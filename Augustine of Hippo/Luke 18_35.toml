[[commentary]]
quote='''
We might understand the expression of being nigh to Jericho, as if they had already gone out of it, but were still near. It might, though less common in this sense, be so taken here, since Matthew relates, that as they were going out of Jericho, two men received their sight who sat by the way side. There need be no question about the number, if we suppose that one of the Evangelists remembering only one was silent about the other. Mark also mentions only one, and he too says that he received his sight as they were going out of Jericho; he has given also the name of the man and of his father, to let us understand that this one was well known, but the other not so, so that it might come to pass that the one who was known would be naturally the only one mentioned. But seeing that what follows in St. Luke's Gospel most plainly proves the truth of his account, that while they were yet coming to Jericho, the miracle took place, we cannot but suppose that there were two such miracles, the first upon one blind man when our Lord was coming to that city, the second on two, when He was departing out of it; Luke relating the one, Matthew the other.

(de Quæst. Ev. l. ii. qu. 48.) If we interpret Jericho to mean the moon, and therefore death, our Lord when approaching His death commanded the light of the Gospel to be preached to the Jews only, who are signified by that one blind man whom Luke speaks of, but rising again from the dead and ascending to heaven, to both Jews and Gentiles; and these two nations seem to be denoted by the two blind men whom Matthew mentions.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Luke, although he mentions an incident altogether of the same tenor, is nevertheless to be understood as really narrating only a similar miracle which was wrought in the case of another blind man, and as putting on record its similarity to the said miracle in the method of performance. For he states that it was performed when He was coming nigh unto Jericho; while the others say that it took place when He was departing from Jericho. Now the name of the city, and the resemblance in the deed, favour the supposition that there was but one such occurrence. But still, the idea that the evangelists really contradict each other here, in so far as the one says, "As He was come nigh unto Jericho," while the others put it thus, "As He came out of Jericho," is one which no one surely will be prevailed on to accept, unless those who would have it more readily credited that the gospel is unveracious, than that He wrought two miracles of a similar nature and in similar circumstances. But every faithful son of the gospel will most readily perceive which of these two alternatives is the more credible, and which the rather to be accepted as true; and, indeed, every gainsayer too, when he is advised concerning the real state of the case, will answer himself either by the silence which he will have to observe, or at least by the tenor of his reflections should he decline to be silent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 65"
