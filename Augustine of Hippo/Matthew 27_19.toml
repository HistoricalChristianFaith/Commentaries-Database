[[commentary]]
quote='''
Once more, as regards what Matthew records above,—namely, "And when he was set down on the judgment-seat, his wife sent unto him, saying, Have thou nothing to do with that just man; for I have suffered many things this day in a dream because of him,"—we remark, that Pilate really took his seat upon the tribunal at a later point, but that, among the earlier incidents which Matthew was recounting, the account given of Pilate's wife came into his mind, and he decided on inserting it in this particular connection, with the view of preparing us for understanding how Pilate had an especially urgent reason for wishing, even on to the last, not to deliver Him up to the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 13"
