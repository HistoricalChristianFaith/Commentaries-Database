[[commentary]]
quote='''
Then in Matthew we have these words: "But Peter followed Him afar off unto the high priest's palace, and went in and sat with the servants to see the end." To this passage in the narrative Mark makes this addition: "And he warmed himself at the fire." Luke also makes a statement which amounts to the same, thus: "Peter followed afar off: and when they had kindled a fire in the midst of the hall, and were sat down together, Peter sat down among them." And John proceeds in these terms: "And Simon Peter followed Jesus, and so did another disciple. That disciple (namely, that other) was known unto the high priest, and went in (as John also tells us) with Jesus into the palace of the high priest. But Peter (as the same John adds) stood at the door without. Then went out that other disciple, which was known unto the high priest, and spake unto her that kept the door, and brought in Peter." For the last fact we are thus indebted to John's narrative. And in this way we see how it came about that Peter also got inside, and was within the hall, as the other evangelists mention.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 6"
