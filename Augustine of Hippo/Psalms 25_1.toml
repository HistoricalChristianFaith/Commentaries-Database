[[commentary]]
quote='''
To the end, a psalm of David himself.

Christ speaks, but in the person of the Church: for what is said has reference rather to the Christian People turned unto God.

“Unto Thee, O Lord, have I lift up my soul” (ver. 1): with spiritual longing have I lift up the soul, that was trodden down on the earth with carnal longings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
