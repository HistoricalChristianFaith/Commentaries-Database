[[commentary]]
quote='''
But will not He who at first came concealed, because humble, come again manifested, because exalted? You have just listened to the Psalm: "God shall come manifestly, and our God shall not keep silence." He was silent that He might be judged, He will not be silent when He begins to judge. It would not have been said, "He will come manifestly," unless at first He had come concealed; nor would it have been said, "He shall not keep silence," unless He had first kept silence. How was He silent? Interrogate Isaiah: "He was brought as a sheep to the slaughter, and as a lamb before his shearer was dumb, so He opened not His mouth.' "But He shall come manifestly, and shall not keep silence." In what manner "manifestly"? "A fire shall go before Him, and round about Him a strong tempest." That tempest has to carry away all the chaff from the floor, which is now being threshed; and the fire has to burn what the tempest carries away. But now He is silent; silent in judgment, but not silent in precept. For if Christ is silent, what is the purpose of these Gospels? what the purpose of the voices of the apostles, what of the canticles of the Psalms, what of the declarations of the prophets? In all these Christ is not silent. But now He is silent in not taking vengeance: He is not silent in not giving warning. But He will come in glory to take vengeance, and will manifest Himself even to all who do not believe on Him. But now, because when present He was concealed, it behoved that He should be despised. For unless He had been despised, He would not have been crucified; if He had not been crucified, He would not have shed His blood-the price by which He redeemed us. But that He might give a price for us, He was crucified; that He might be crucified, He was despised; that He might be despised, He appeared in humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"

[[commentary]]
quote='''
For there will be a time of glory, when He who came in humility will come in loftiness; He who came to be judged will come to judge; He who came to be slain by the dead will come to judge the quick and the dead. "God," saith the psalm, "will come manifest, our God, and He will not be silent." What is "shall come manifest"? Because He came concealed. Then He will not be silent; for when He came concealed, "He was led as a sheep to the slaughter; and as a lamb before its shearer, He opened not His mouth." He shall come, and shall not keep silence. "I was silent," saith He, "shall I always be silent?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"

[[commentary]]
quote='''
Let us, then, to whom this is ministered, understand that the power of our Lord Jesus Christ, then concealed, will be made manifest in the judgment, of which it is said, "God will come manifest; our God, and He will not be silent." Why is it said, "will come manifest"? Because He, our God,-namely, Christ,-came hidden, will come manifest. "And will not be silent:" why this "will not be silent"? Because at first He did keep silence. When? When He was judged; that this, too, might be fulfilled which the prophet had foretold: "As a sheep He was led to the slaughter, and as a lamb before his shearer is dumb, so He opened not His mouth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252037.html'
source_title="Tractates on John 37"

[[commentary]]
quote='''
What then, brethren? This God of gods, both then hidden, and now hidden, shall He ever be hidden? Evidently not: hear what followeth: “God shall come manifest” (ver. 3). He that came hidden, shall come manifest. Hidden He came to be judged, manifest He shall come to judge: hidden He came that He might stand before a judge, manifest He shall come that He may be judge even of judges: “He shall come manifest, and shall not be silent.” But why? Is He now silent? And whence are all the words that we say? whence those precepts? whence those warnings? whence that trumpet of terror? He is not silent, and is silent: is not silent from warning, is silent from avenging: is not silent from precept, is silent from judgment. For He suffereth sinners daily doing evil things, not caring for God, not in their conscience, not in heaven, not in earth: all these things escape Him not, and universally He doth admonish all; and whenever He chastiseth any on earth, it is admonition, not yet condemnation. He is silent then from judgment, He is hidden in heaven, as yet He intercedeth for us: He is long-suffering to sinners, not putting forth His wrath, but awaiting penitence. He saith in another place: “I have held my peace, shall I always hold my peace?” When then He shall not hold His peace, “God shall come manifest.” What God? “Our God.” And the God Himself, who is our God: for he is not God, who is not our God. For the gods of the nations are devils: the God of Christians is very God. Himself shall come, but “manifest,” not still to be mocked, not still to be buffeted and scourged: He shall come, but “manifest,” not still to be smitten with a reed upon the head, not still to be crucified, slain, buried: for all these things God being hidden hath willed to suffer. “He shall come manifest, and shall not be silent.”

But that He shall come to judgment, the following words teach. “Fire shall go before Him.” Do we fear? Be we changed, and we shall not fear. Let chaff fear the fire: what doth it to gold? What thou mayest do is now in thy power, so thou mayest not experience, for want of being corrected, that which is to come even against thy will. For if we might so bring it about, brethren, that the day of judgment should not come; I think that even then it were not for us to live ill. If the fire of the day of judgment were not to come, and over sinners there impended only separation from the face of God, in whatever affluence of delights they might be, not seeing Him by whom they were created, and separated from that sweetness of His ineffable countenance, in whatever eternity and impunity of sin, they ought to bemoan themselves. But what shall I say, or to whom shall I say? This is a punishment to lovers, not to despisers. They that have begun to feel in any degree the sweetness of wisdom and truth, know what I say, how great a punishment it is to be only separated from the face of God: but they that have not tasted that sweetness, if not yet they yearn for the face of God, let them fear even fire; let punishments terrify those, whom rewards win not. Of no value to thee is what God promiseth, tremble at what He threateneth. The sweetness of His presence shall come; thou art not changed, thou art not awakened, thou sighest not, thou longest not: thou embracest thy sins and the delights of thy flesh, thou art heaping stubble to thyself, the fire will come. “Fire shall burn in His presence.” This fire will not be like thy hearth-fire, into which nevertheless, if thou art compelled to thrust thy hand, thou wilt do whatsoever he would have thee who doth threaten this alternative. If he say to thee, “write against the life of thy father, write against the lives of thy children, for if thou do not, I thrust thy hand into thy fire:” thou wilt do it in order that thy hand be not burned, in order that thy member be not burned for a time, though it is not to be ever in pain. Thine enemy threateneth then but so light an evil, and thou doest evil; God threateneth eternal evil, and doest thou not good? To do evil not even menaces should compel thee: from doing good not even menaces should deter thee. But by the menaces of God, by menaces of everlasting fire, thou art dissuaded from evil, invited to good. Wherefore doth it grieve thee, except because thou believest not? Let each one then examine his heart, and see what faith doth hold there. If we believe a judgment to come, brethren, let us live well. Now is time of mercy, then will be time of judgment. No one will say, “Call me back to my former years.” Even then men will repent, but will repent in vain: now let there be repentance, while there is fruit of repentance; now let there be applied to the roots of the tree a basket of dung, sorrow of heart, and tears; lest He come and pluck up by the roots. For when He shall have plucked up, then the fire is to be looked for. Now, even if the branches have been broken, they can again be grafted in: then, “every tree which bringeth not forth good fruit, shall be cut down, and shall be cast into the fire.” “Fire shall burn in His presence.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
“And a mighty tempest round about Him” (ver. 3). “A mighty tempest,” in order to winnow so great a floor. In this tempest shall be that winnowing whereby from the saints shall be put away everything impure, from the faithful every unreality; from godly men and them that fear the Word of God, every scorner and every proud man. For now a sort of mixture doth lie there, from the rising of the sun unto the going down. Let us see then how He will do that is to come, what He will do with that tempest which “shall be a mighty tempest round about Him.” Doubtless this tempest is to make a sort of separation. It is that separation which they waited not for, who brake the nets, before they came to land. But in this separation there is made a sort of distinction between good men and bad men. There be some that now follow Christ with lightened shoulders without the load of the world’s cares, who have not heard in vain, “If thou wilt be perfect, go and sell all that thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, follow Me;” to which sort is said, “Ye shall sit upon twelve thrones, judging the twelve tribes of Israel.” Some then shall be judging with the Lord: but others to be judged, but to be placed on the right hand. For that there will be certain judging with the Lord, we have most evident testimony, which I have but now quoted: “Ye shall sit upon twelve thrones, judging the twelve tribes of Israel.”…

But what the Lord did after His resurrection, signified what is to be to us after our resurrection, in that number of the kingdom of heaven, where shall be no bad man.…Lastly, those seven thousand of whom reply was made to Elias, “I have left me seven thousand men that have not bowed knees before Baal,” far exceed that number of fishes. Therefore the hundred and fifty-three fishes doth not alone express just such a number of saints, but Scripture doth express the whole number of saints and righteous men by so great a number for a particular reason; to wit, in order that in those hundred and fifty-three all may be understood that pertain to the resurrection to eternal life. For the Law hath ten commandments: but the Spirit of Grace, through which alone the Law is fulfilled, is called sevenfold. The number then must be examined, what mean ten and seven: ten in commandments, seven in the grace of the Holy Spirit: by which grace the commandments are fulfilled. Ten then and seven contain all that pertain to the resurrection, to the right hand, to the kingdom of heaven, to life eternal, that is, they that fulfil the Law by the Grace of the Spirit, not as it were by their own work or their own merit. But ten and seven, if thou countest from one unto seventeen, by adding all the numbers by steps, so that to one thou mayest add two, add three, add four, that they may become ten, by adding five that they may become fifteen, by adding six that they may become twenty-one, by adding seven that they may become twenty-eight, by adding eight that they may become thirty-six, by adding nine that they may become forty-five, by adding ten that they may become fifty-five, by adding eleven that they may become sixty-six, by adding twelve that they may become seventy-eight, by adding thirteen that they may become ninety-one, by adding fourteen that they may become one hundred and five, by adding fifteen that they may become one hundred and twenty, by adding sixteen that they may become one hundred and thirty-six, by adding seventeen, make up one hundred and fifty-three, thou wilt find a vast number of all saints to belong to this number of a few fishes. In like manner then as in five virgins, countless virgins; as in five brethren of him that was tormented in hell, thousands of the people of the Jews; as in the number of one hundred and fifty-three fishes, thousands of thousands of saints: so in twelve thrones, not twelve men, but great is the number of the perfect.

But I see what is next required of us; in like manner as in the case of the five virgins, a reason was given why many should belong to five, and why to those five many Jews, and why to a hundred and fifty-three many perfect—to show why and how to the twelve thrones not twelve men, but many belong. What mean the twelve thrones, which signify all men everywhere that have been enabled to be so perfect as they must be perfect, to whom it is said, “Ye shall sit over the twelve tribes of Israel”? And why do all men everywhere belong to the number twelve? Because the very “everywhere” which we say, we say of the whole world: but the compass of lands is contained in four particular quarters, East, West, South, and North: from all these quarters they being called in the Trinity and made perfect in the faith and precept of the Trinity,—seeing that three times four are twelve, ye perceive wherefore the saints belong to the whole world; they that shall sit upon twelve thrones to judge the twelve tribes of Israel, since the twelve tribes of Israel, also, are the twelve tribes of the whole of Israel. For like as they that are to judge are from the whole world, so also they that are to be judged are from the whole world. The Apostle Paul of himself, when he was reproving believing laymen, because they referred not their causes to the Church, but dragged them with whom they had matters before the public, said, “Know ye not that we shall judge Angels?” See after what sort He hath made Himself judge: not only himself, but also all that judge aright in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
