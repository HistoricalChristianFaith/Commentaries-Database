[[commentary]]
quote='''
(Tract. lxxii. 2) Whatsoever ye shall ask. Then why do we often see believers asking, and not receiving? Perhaps it is that they ask amiss. When a man would make a bad use of what he asks for, God in His mercy does not grant him it. Still if God even in kindness often refuses the requests of believers, how are we to understand, Whatsoever ye shall ask in My name, I will do? Was this said to the Apostles only? No. He says above, He that believeth on Me, the works that I do shall he do also. And if we go to the lives of the Apostles themselves, we shall find that he who laboured more than they all, prayed that the messenger of Satan might depart from him, but was not granted his request. But attend: does not our Lord lay down a certain condition? In My name, which is Christ Jesus. Christ signifies King, Jesus, Saviour. Therefore whatever we ask for that would hinder our salvation, we do not ask in our Saviour's name: and yet He is our Saviour, not only when He does what we ask, but also when He does not. When He sees us ask any thing to the disadvantage of our salvation, He shows Himself our Saviour by not doing it. The physician knows whether what the sick man asks for is to the advantage or disadvantage of his health; and does not allow what would be to his hurt, though the sick man himself desires it; but looks to his final cure. And some things we may even ask in His name, and He will not grant them us at the time, though He will some time. What we ask for is deferred, not denied.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Wake up, then, believer, and give careful heed to what is stated here, "in my name:" for in these words He does not say, "whatsoever ye shall ask" in any way; but, "in my name." How, then, is He called, who promised so great a blessing? Christ Jesus, of course: Christ means King, and Jesus means Saviour! for certainly it is not any one who is a king that will save us, but only the Saviour-King; and therefore, whatsoever we ask that is adverse to the interests of salvation, we do not ask in the name of the Saviour. And yet He is the Saviour, not only when He does what we ask, but also when He refuses to do so; since by not doing what He sees to be contrary to our salvation, He manifests Himself the more fully as our Saviour. For the physician knows which of his patient's requests will be favorable, and which will be adverse, to his safety; and therefore yields not to his wishes when asking what is prejudicial, that he may effect his recovery. Accordingly, when we wish Him to do whatsoever we ask, let it not be in any way, but in His name, that is, in the name of the Saviour, that we present our petition. Let us not, then, ask aught that is contrary to our own salvation; for if He do that, He does it not as the Saviour, which is the name He bears to His faithful disciples. For He who condescends to be the Saviour of the faithful, is also a Judge to condemn the ungodly. Whatsoever, therefore, any one that believeth on Him shall ask in that name which He bears to those who believe on Him, He will do it; for He will do it as the Saviour. But if one that believeth on Him asketh something through ignorance that is injurious to his salvation, he asketh it not in the name of the Saviour; for His Saviour He will no longer be if He do aught to impede his salvation. And hence, in such a case, in not doing what He is entreated to do, His way is kept the clearer for doing what His name imports. And on that account, not only as the Saviour, but also as the good Master, He taught us, in the very prayer He gave us, what we should ask, in order that, whatsoever we shall ask, He may do it; and that we, too, might thereby understand that we cannot be asking in the Master's name anything that is inconsistent with the rule of His own instructions.

There are some things, indeed, which, although really asked in His name, that is, in harmony with His character as both Saviour and Master, He doeth not at the time we ask them, and yet He faileth not to do them. For when we pray that the kingdom of God may come, it does not imply that He is not doing what we ask, because we do not begin at once to reign with Him in the everlasting kingdom: for what we ask is delayed, but not denied. Nevertheless, let us not fail in praying, for in so doing we are as those that sow the seed; and in due season we shall reap. And even when we are asking aright, let us ask Him at the same time not to do what we ask amiss; for there is reference to this also in the Lord's Prayer, when we say, "Lead us not into temptation." For surely the temptation is no slight one if thine own request be hostile to thy cause.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252073.html'
source_title="Tractates on John 73"
