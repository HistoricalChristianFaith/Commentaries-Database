[[commentary]]
quote='''
For those who have a cause, and wish to supplicate the emperor, seek for some one skilled in the law, and trained in the schools, to compose their petition for them; lest perchance, if they ask in an unbecoming manner, they not only do not obtain what they seek, but get punishment instead of a benefit. When, therefore, the apostles sought to petition, and could not find how to approach the Emperor God, they said unto Christ, "Lord, teach us to pray;" that is to say, "O thou who art our skilled One in the law, our Assessor, yea, the Concessor of God, compose for us prayers." And the Lord taught them from the book of the celestial law, taught them how to pray; and in that which He taught, He laid down a certain condition: "Forgive us our debts, as we also forgive our debtors." If thou seekest not according to the law, thou becomest guilty. Dost thou not tremble before the Emperor, having become guilty? Offer the sacrifice of humility, offer the sacrifice of mercy; pray, saying, Forgive me, for I also forgive. But if thou sayest, do. For what wilt thou do? whither wilt thou go if thou hast lied in thy prayers? Not as it is said in the forum, thou shalt lose the benefit of the rescript; but thou shall not obtain a rescript. For it is the law of the forum that he who shall have lied in his petition shall derive no benefit from that which he has obtained. But this among men, because a man can be deceived: the emperor might have been deceived, when thou didst address to him thy petition; for thou saidest what thou wouldest, and he to whom thou didst speak knew not whether it was true or false; he sent thee away to thy adversary to be confuted if possible, so that if before the judge thou shouldest be convicted of falsehood (because he was not able not to grant the rescript, not knowing whether thou hadst lied), thou shouldest lose the benefit of the rescript, in the place to which thou hadst taken it. But God, who knows whether thou liest or speakest the truth, does not cause thee to lose in the judgment the benefit, but does not permit thee to obtain it, because thou hast dared to lie to the Truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
