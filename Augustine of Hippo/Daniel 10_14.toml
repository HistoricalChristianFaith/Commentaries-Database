[[commentary]]
quote='''
This indeed an Angel could do: for he said to Daniel, “I am come to give thee understanding;” and this word is in the Greek, as it is here also, συνέτισαί σε; as if the Latin translator were to render θεραπεῦσαί σε by sanitatem dare tibi. For the Latin interpreter would not make a circumlocution by saying, to give thee understanding, if, as we say from health, “to heal thee,” so one could say from intellect, “to intellectuate thee.” But if an Angel could do this, what reason is there that this man should pray that this be done for him by God? Is it because God had commanded the Angel to do it? Just so: for Christ is understood to have given this command to the Angel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
