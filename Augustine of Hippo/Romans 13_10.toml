[[commentary]]
quote='''
The rule of love is that one should wish his friend to have all the good things he wants to have himself and should not wish the evils to befall his friend which he wishes to avoid himself. He shows this benevolence to all men. No evil must be done to any. Love of one's neighbor works no evil. Let us then love even our enemies as we are commanded, if we wish to be truly unconquered.
'''
source_url=''
source_title="OF TRUE RELIGION 87"

[[commentary]]
quote='''
Hear also the apostle when he says, "Love is the fulfilling of the law." Whence the love? By the grace of God, by the Holy Spirit. For we could not have it from ourselves, as if making it for ourselves. It is the gift of God, and a great gift it is: for, saith he, "the love of God is shed abroad in our hearts by the Holy Spirit, which is given to us." Wherefore love completes the law, and most truly it is said, "Love is the perfecting of the law."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"

[[commentary]]
quote='''
But let us ponder the words of the same apostle: "Love is the fullness of the law." And so, where there is love, what can be wanting? and where it is not, what is there that can possibly be profitable? The devil believes, but does not love: no one loveth who doth not believe. One may, indeed, hope for pardon who does not love, but he hopes in vain; but no one can despair who loves. Therefore, where there is love, there of necessity will there be faith and hope; and where there is the love of our neighbor, there also of necessity will be the love of God. For he that loveth not God, how loveth he his neighbour as himself, seeing that he loveth not even himself? Such an one is both impious and iniquitous; and he that loveth iniquity, manifestly loveth not, but hateth his own soul. Let us, therefore, be holding fast to this precept of the Lord, to love one another; and then all else that is commanded we shall do, for all else we have contained in this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252083.html'
source_title="Tractates on John 83"
