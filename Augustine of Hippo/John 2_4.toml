[[commentary]]
quote='''
Neither is there anything to compel us to a denial of the mother of the Lord, in the circumstance that this word was spoken by Him: "Woman, what have I to do with thee? Mine hour is not yet come." But He rather admonishes us to understand that, in respect of His being God, there was no mother for Him, the part of whose personal majesty He was preparing to show forth in the turning of water into wine. But as regards His being crucified, He was crucified in respect of his being man; and that was the hour which had not come as yet, at the time when this word was spoken, "What have I to do with thee? Mine hour is not yet come;" that is, the hour at which I shall recognize thee. For at that period, when He was crucified as man, He recognized His human mother, and committed her most humanely to the care of the best beloved disciple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Faith%2520and%2520the%2520Creed.html'
source_title="A Treatise on Faith and the Creed"

[[commentary]]
quote='''
(Tr. viii. c. 5) Some who derogate from the Gospel, and say that Jesus was not born of the Virgin Mary, try to draw an argument for their error from this place; for, how, say they, could she be His mother to whom He said, What have I to do with thee? Now who is it who gives this account, and on whose authority do we believe it? The Evangelist John. But he himself says, The mother of Jesus was there. Why should He say it, unless both were true. But did He therefore come to the marriage to teach men to despise their mother?

(de Symbolo Serm. ii. c. 14. [5]) To mark a distinction between His Godhead and manhood, that according to His manhood He was inferior and subject, but according to His Godhead supreme, He saith, Woman, what have I to do with thee?

(Tr. viii. c. 9. et seq. sparsim) Or it was because our Lord as God had not a mother, though as man He had, and the miracle He was about to work was the act of His Divinity, not of human infirmity. When therefore His mother demanded a miracle, He, as though not acknowledging a human birth, when about to perform a divine work, said, Woman, what have I to do with thee? As if He said, Thou didst not beget that in Me, which works the miracle, My Divinity. (She is called woman, with reference to the female sex, not to any injury of her virginity.) But because thou broughtest forth My infirmity, I will acknowledge thee then, when that very infirmity shall hang on the cross. And therefore He adds, Mine hour is not yet come: as if to say, I will acknowledge thee when the infirmity, of which thou art the mother, shall hang from the cross. He commended His mother to the disciple, when about to die, and to rise again, before her death. But note; just as the Manicheans have found an occasion of error and pretext for their faithlessness in our Lord's word, What have I to do with thee? in the same way the astrologers support theirs from the words, Mine hour is not yet come. For, say they, if Christ had not been under the power of fate, He would never have said this. But let them believe what God says below, I have power to lay it (my life) down, and I have power to take it again: (John 10:18) and then let them ask, why He says, Mine hour is not yet come: nor let them on such a ground subject the Creator of heaven to fate; seeing that, even were there a fatality in the stars, the Maker of the stars could not be under the dominion of the stars. And not only had Christ nothing to do with fate, as ye call it; but neither hast thou, or any other man. Wherefore said He then, Mine hour is not yet come? Because He had the power to die when He pleased, but did not think it expedient yet to exert the power. He was to call the disciples, to proclaim the Kingdom of heaven, to do marvellous works, to approve His divinity by miracles, His humility by partaking of the sufferings of our mortal state. And when He had done all, then the hour was come, not of destiny, but of will, not of obligation, but of power.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Why, then, said the Son to the mother, "Woman, what have I to do with thee? mine hour is not yet come?" Our Lord Jesus Christ was both God and man. According as He was God, He had not a mother; according as He was man, He had. She was the mother, then, of His flesh, of His humanity, of the weakness which for our sakes He took upon Him. But the miracle which He was about to do, He was about to do according to His divine nature, not according to His weakness; according to that wherein He was God not according to that wherein He was born weak. But the weakness of God is stronger than men. His mother then demanded a miracle of Him; but He, about to perform divine works, so far did not recognize a human womb; saying in effect, "That in me which works a miracle was not born of thee, thou gavest not birth to my divine nature; but because my weakness was born of thee, I will recognize thee at the time when that same weakness shall hang upon the cross." This, indeed, is the meaning of "Mine hour is not yet come." For then it was that He recognized, who, in truth, always did know. He knew His mother in predestination, even before He was born of her; even before, as God, He created her of whom, as man, He was to be created, He knew her as His mother: but at a certain hour in a mystery He did not recognize her; and at a certain hour which had not yet come, again in a mystery, He does recognize her. For then did He recognize her, when that to which she gave birth was a-dying. That by which Mary was made did not die, but that which was made of Mary; not the eternity of the divine nature, but the weakness of the flesh, was dying. He made that answer therefore, making a distinction in the faith of believers, between the who; and the how, He came. For while He was God and the Lord of heaven and earth, He came by a mother who was a woman. In that He was Lord of the world, Lord of heaven and earth, He was, of course, the Lord of Mary also; but in that wherein it is said, "Made of a woman, made under the law," He was Mary's son. The same both the Lord of Mary and the son of Mary; the same both the Creator of Mary and created from Mary. Marvel not that He was both son and Lord. For just as He is called the son of Mary, so likewise is He called the son of David; and son of David because son of Mary. Hear the apostle openly declaring, "Who was made of the seed of David according to the flesh." Hear Him also declared the Lord of David; let David himself declare this: "The Lord said to my Lord, Sit Thou on my right hand." And this passage Jesus Himself brought forward to the Jews, and refuted them from it. How then was He both David's son and David's Lord? David's son according to the flesh, David's Lord according to His divinity; so also Mary's son after the flesh, and Mary's Lord after His majesty. Now as she was not the mother of His divine nature, whilst it was by His divinity the miracle she asked for would be wrought, therefore He answered her, "Woman, what have I to do with thee?" But think not that I deny thee to be my mother: "Mine hour is not yet come;" for in that hour I will acknowledge thee, when the weakness of which thou art the mother comes to hang on the cross. Let us prove the truth of this. When the Lord suffered, the same evangelist tells us, who knew the mother of the Lord, and who has given us to know about her in this marriage feast,-the same, I say, tells us, "There was there near the cross the mother of Jesus; and Jesus saith to His mother, Woman, behold thy son! and to the disciple, Behold thy mother!" He commends His mother to the care of the disciple; commends His mother, as about to die before her, and to rise again before her death. The man commends her a human being to man's care. This humanity had Mary given birth to. That hour had now come, the hour of which He had then said, "Mine hour is not yet come."

In my opinion, brethren, we have answered the heretics. Let us now answer the astrologers. And how do they attempt to prove that Jesus was under fate? Because, say they, Himself said, "Mine hour is not yet come." Therefore we believe Him; and if He had said, "I have no hour," He would have excluded the astrologers: but behold, say they, He said, "Mine hour is not yet come." If then He had said, "I have no hour," the astrologers would have been shut out, and would have no ground for their slander; but now that He said, "Mine hour is not yet come," how can we contradict His own words? 'Tis wonderful that the astrologers, by believing Christ's words, endeavor to convince Christians that Christ lived under an hour of fate. Well, let them believe Christ when He saith, "I have power to lay down my life and to take it up again: no man taketh it from me, but I lay it down of myself, and I take it again." Is this power then under fate? Let them show us a man who has it in his power when to die, how long to live: this they can never do. Let them, therefore, believe God when He says, "I have power to lay down my life, and to take it up again;" and let them inquire why it was said, "Mine hour is not yet come;" and let them not because of these words, be imposing fate on the Maker of heaven, the Creator and Ruler of the stars. For even if fate were from the stars, the Maker of the stars could not be subject to their destiny. Moreover, not only Christ had not what thou callest fate, but not even hast thou, or I, or he there, or any human being whatsoever.

Nevertheless, being deceived, they deceive others, and propound fallacies to men. They lay snares to catch men, and that, too. in the open streets. They who spread nets to catch wild beasts even do it in woods and desert places: how miserably vain are men, for catching whom the net is spread in the forum! When men sell themselves to men, they receive money; but these give money in order to sell themselves to vanities. For they go in to an astrologer to buy themselves masters, such as the astrologer is pleased to give them: be it Saturn, Jupiter, Mercury, or any other named profanity. The man went in free, that having given his money he might come out a slave. Nay, rather, had he been free he would not have gone in; but he entered whither his master Error and his mistress Avarice dragged him. Whence also the truth says, "Every one that doeth sin is the slave of sin."

Why then did He say, "Mine hour is not yet come?" Rather because, having it in His power when to die, He did not yet see it fit to use that power. Just as we, brethren, say, for example, "Now is the appointed hour for us to go out to celebrate the sacraments." If we go out before it is necessary, do we not act perversely and absurdly? And because we act only at the proper time, do we therefore in this action regard fate when we so express ourselves? What means then, "Mine hour is not yet come?" When I know that it is the fitting time for me to suffer, when my suffering will be profitable, then I will willingly suffer. That hour is not yet: that thou mayest preserve both, this, "Mine hour is not yet come;" and that, "I have power to lay down my life, and power to take it again." He had come, then, having it in His power when to die. And surely it would not have been right were He to die before He had chosen disciples. Had he been a man who had not his hour in his own power, he might have died before he had chosen disciples; and if haply he had died when his disciples were now chosen and instructed, it would be something conferred on him, not his own doing. But, on the contrary, He who had come having in His power when to go, when to return, how far to advance, and for whom the regions of the grave were open, not only when dying but when rising again; He, I say, in order to show us His Church's hope of immortality, showed in the head what it behoved the members to expect. For He who has risen again in the head will also rise again in all His members. The hour then had not yet come, the fit time was not yet. Disciples had to be called, the kingdom of heaven to be proclaimed, the Lord's divinity to be shown forth in miracles, and His humanity in His very sympathy with mortal men. For He who hungered because He was man, fed so many thousands with five loaves because He was God; He who slept because He was man, commanded the winds and the waves because He was God. All these things had first to be set forth, that the evangelists might have whereof to write, that there might be what should be preached to the Church. But when He had done as much as He judged to be sufficient, then His hour came, not of necessity, but of will,-not of condition, but of power.

What then, brethren? Because we have replied to these and those, shall we say nothing as to what the water-pots signify? what the water turned into wine? what the master of the feast? what the bridegroom? what in mystery the mother of Jesus? what the marriage itself? We must speak of all these, but we must not burden you. I would have preached to you in Christ's name yesterday also, when the usual sermon was due to you, my beloved, but I was hindered by certain necessities. If you please then, holy brethren, let us defer until to-morrow what pertains to the hidden meaning of this translation, and not burden both your and our own weakness. There are many of you, perhaps, who have to-day come together on account of the solemnity of the day, not to hear the sermon. Let those who come to-morrow come to hear, so that we may not defraud those who are eager to learn, nor burden those who are fastidious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25208.html'
source_title="Tractates on John 8"
