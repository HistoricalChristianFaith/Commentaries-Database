[[commentary]]
quote='''
A man is observed, and the things which belong to him; no one knoweth of what sort he is: God seeth of what sort he is. Sometimes even the devil himself he escapeth; except he tempt, he findeth not: just as concerning that man of whom just now I have made mention:…“Doth Job by any means worship God for nought?” For this was true light, this the light of the living, that gratis he should worship God. God saw in the heart of His servant His gratuitous worship. For that heart was pleasing in the sight of the Lord in the light of the living: the devil’s sight he escaped, because in darkness he was. God admitted the tempter, not in order that He might Himself know that which He did know, but in order that to us to be known and imitated He might set it forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
