[[commentary]]
quote='''
What do I mean by this, hold fast to Christ? It was for this reason that He chose to suffer on earth Himself. Ye have heard, while the prophet was being read, how He “did not turn away His back from the smiters, and His face from the spittings of men,” how “He turned not His cheek from their hands;” wherefore chose He to suffer all these things, but that He might console the suffering? He could have raised His flesh at the last day: but then thou wouldest not have had thy ground of hope, since thou hadst not seen Him. He deferred not His resurrection, that thou mightest not still be in doubt. Suffer then tribulation in the world with the same end as that which thou hast observed in Christ: and let not those who do evil, and flourish in this life, move thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252092.html'
source_title="Exposition on Psalm 92"
