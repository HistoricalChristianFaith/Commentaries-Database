[[commentary]]
quote='''
“For Himself is my God and My Saving One, my Taker up, I will not remove hence” (ver. 6). Because “Himself is my God,” therefore He calleth me: “and my Saving One,” therefore He justifieth me: “and my Taker up,” therefore He glorifieth me. For here I am called and am justified, but there I am glorified; and from thence where I am glorified, “I will not remove.” For a sojourner I am with Thee on earth as all my fathers were. Therefore from my lodging I shall remove, from my Heavenly home I shall not remove.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
