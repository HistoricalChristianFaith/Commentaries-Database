[[commentary]]
quote='''
When he says: And not only so, but we also glory in tribulations, and the rest, he leads on step by step up to the love of God—which love he says we have through the gift of the Spirit—and he shows that all those things which we might attribute to ourselves are to be attributed to God, who has deigned to give grace through the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
And of this spirit the same Apostle Paul discourses to the Romans: "We glory in tribulations, knowing that tribulation worketh patience; and patience, experience; and experience, hope; and hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us." Not by ourselves, therefore, but by the Holy Ghost which is given to us, does it come to pass that, through that very love, which he shows us to be the gift of God, tribulation does not do away with patience, but rather produces it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 39"
