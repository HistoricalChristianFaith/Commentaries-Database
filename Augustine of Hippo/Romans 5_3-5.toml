[[commentary]]
quote='''
When he says: And not only so, but we also glory in tribulations, and the rest, he leads on step by step up to the love of God—which love he says we have through the gift of the Spirit—and he shows that all those things which we might attribute to ourselves are to be attributed to God, who has deigned to give grace through the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
Hear the heart prepared in an Apostle, because he hath imitated his Lord: “We glory,” he saith, “in tribulations: because tribulation worketh patience: patience probation, probation hope, but hope maketh not ashamed: because the love of God is shed abroad in our hearts through the Holy Spirit, which hath been given to us.” He was in oppressions, in chains, in prisons, in stripes, in hunger and thirst, in cold and nakedness, in every wasting of toils and pains, and he was saying, “We glory in tribulations.” Whence, but that prepared was his heart? Therefore he was singing and playing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
