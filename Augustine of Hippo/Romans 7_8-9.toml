[[commentary]]
quote='''
And we thought that we could easily be righteous as it were by our own strength, before we received the command; “but when the command came, sin revived; but I died,” saith the Apostle. For a law was given to men, not such as could save them at once, but it was to show them in what severe sickness they were lying.…But when sin was made manifest by the law given, sin was but increased, for it is both sin, and against the Law; “Sin,” saith he, “taking occasion by the command, wrought in me all manner of concupiscence.” What does he mean by “taking occasion by the law”? Having received the command, men tried as by their own strength to obey it; conquered by lust, they became guilty of transgression of this very command also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
