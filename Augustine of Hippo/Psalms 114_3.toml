[[commentary]]
quote='''
But, again, listen to another excellent steward of God, whom I reverence as a father, for in Christ Jesus he begat me through the gospel, and from this servant of Christ I received the laver of regeneration. I speak of the blessed Ambrose, whose grace, constancy, labors, dangers, whether in works or in speech, for the catholic faith, I myself have experienced, and together with me the Roman world does not hesitate to proclaim them. When this man was explaining the Gospel according to Luke, he said, "The Jordan turned backwards" signified the future mysteries of the laver of salvation, through which infants who are baptized at the beginning of their natural life are reformed from badness.
'''
source_url=''
source_title="AGAINST JULIAN 1:3.10"

[[commentary]]
quote='''
But I would not that ye should seek without yourselves, how the Jordan was turned back, I would not ye should augur anything evil. For the Lord chideth those who have “turned” their “back” unto Him, “and not their face.” And whoever forsaketh the source of his being, and turneth away from his Creator; as a river into the sea, he glides into the bitter wickedness of this world. It is therefore good for him that he turn back, and that God whom he had set behind his back, may be before his face as he returneth; and that the sea of this world, which he had set before his face, when he was gliding on towards it, may become behind him; and that he may so forget what is behind him, that he may “reach forward to what is before him;” which is profitable for him when once converted.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
