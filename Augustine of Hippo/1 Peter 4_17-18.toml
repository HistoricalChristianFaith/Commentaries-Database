[[commentary]]
quote='''
Thou hast this in the Epistle of the Apostle Peter, and for this reason he hath adduced a testimony from the Scripture: “for the time is come,” he saith, “that judgment must begin at the house of God;” that is, the time is come for the judgment of those who belong to the house of God. If sons are scourged, what must the most wicked slaves expect? For which reason he added: “And if it first begin at us, what shall the end be of them that obey not the Gospel of God?” To which he added this testimony: “For if the righteous scarcely be saved, where shall the ungodly and sinner appear?” How then shall the wicked be with Thee, if Thou dost not even spare Thy faithful, in order that Thou mayest exercise and teach them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
