[[commentary]]
quote='''
“Give sentence,” therefore, “for the fatherless and the poor man, justify the humble and needy” (ver. 3). Not them who for their own sake are rich and proud, but Him who for your sake was humble and poor, believe ye to be righteous: proclaim Him righteous. But they will envy Him, and will not at all spare Him, saying, “This is the Heir, come, let us kill Him, and the inheritance shall be ours.” “Deliver,” then, “the poor man, and save the needy from the hands of the ungodly” (ver. 4). This is said that it might be known, that in that nation where Christ was born and put to death, those persons were not guiltless of so great a crime, who being so numerous, that, as the Gospel says, the Jews feared them, and therefore dared not lay hands on Christ, afterwards consented, and permitted Him to be slain by the malicious and envious Jewish rulers: yet if they had so willed, they would still have been feared, so that the hands of the wicked would never have prevailed against Him. For of these it is said elsewhere, “Dumb dogs, they know not how to bark.” Of them too is that said, “Lo, how the righteous perisheth, and no man layeth it to heart.” He perished as far as lay in them who would have Him to perish; for how could He perish by dying, who in that way rather was seeking again what had perished? If then they are justly blamed and deservedly rebuked, who by their dissembling suffered such a wicked deed to be committed; how must they be blamed, or rather not only blamed, but how severely must they be condemned, who did this of design and malice?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252082.html'
source_title="Exposition on Psalm 82"
