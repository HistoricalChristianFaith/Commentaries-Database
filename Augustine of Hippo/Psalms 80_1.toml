[[commentary]]
quote='''
…If perchance things obscure demand the office of an interpreter, those things which are evident ought to require of me the office of a reader. The song here is of the Advent of the Lord and of our Saviour Jesus Christ, and of His vineyard. But the singer of the song is that Asaph, as far as doth appear, enlightened and converted, by whose name ye know the synagogue to be signified. Lastly, the title of the Psalm is: “For the end in behalf of them that shall be changed;” that is, for the better. For Christ, the end of the Law, hath come on purpose that He should change men for the better. And he addeth, “a testimony to Asaph himself.” A good testimony of truth. Lastly, this testimony doth confess both Christ and the vineyard; that is, Head and Body, King and people, Shepherd and flock, and the entire mystery of all Scriptures, Christ and the Church. But the title of the Psalm doth conclude with, “for the Assyrians.” The Assyrians are interpreted, “men guiding.” Therefore it is no longer a generation which hath not guided the heart thereof, but now a generation guiding. Therefore hear we what he saith in this testimony.

What is, “Thou that feedest Israel, hearken, Thou that conducteth Joseph like sheep”? (ver. 1). He is being invoked to come, He is being expected until He come, He is being yearned for until He come. Therefore may He find “men guiding:” “Thou that conductest,” he saith, “Joseph like sheep:” Joseph himself like sheep. Joseph himself are the sheep, and Joseph himself is a sheep. Observe Joseph; for although even the interpretation of his name doth aid us much, for it signifieth increase; and He came indeed in order that the grain given to death might arise manifold; that is, that the people of God might be increased.…“Thou that sittest upon the Cherubin.” Cherubin is the seat of the glory of God, and is interpreted the fulness of knowledge. There God sitteth in the fulness of knowledge. Though we understand the Cherubin to be the exalted powers and virtues of the heavens: yet, if thou wilt, thou wilt be Cherubin. For if Cherubin is the seat of God, hear what saith the Scripture: “The soul of a just man is the seat of wisdom.” How, thou sayest, shall I be the fulness of knowledge? Who shall fulfil this? Thou hast the means of fulfilling it: “The fulness of the Law is love.” Do not run after many things, and strain thyself. The amplitude of the branches doth terrify thee: hold by the root, and of the greatness of the tree think not. Be there in thee love, and the fulness of knowledge must needs follow. For what doth he not know that knoweth love? Inasmuch as it hath been said, “God is love.” “Appear.” For we went astray because Thou didst not appear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
