[[commentary]]
quote='''
“How long will ye judge unrighteously, and accept the persons of the ungodly” (ver. 2); as in another place, “How long are ye heavy in heart?” Until He shall come who is the light of the heart? I have given a law, ye have resisted stubbornly: I sent Prophets, ye treated them unjustly, or slew them, or connived at those who did so. But if they are not worthy to be even spoken to, who slew the servants of God that were sent to them, ye who were silent when these things were doing, that is, ye who would imitate as if they were innocent those who then were silent, “how long will ye judge unrighteously, and accept the persons of the ungodly?” If the Heir comes even now, is He to be slain? Was He not willing for your sake to become as it were a child under guardians? Did not He for your sake hunger and thirst like one in need? Did He not cry to you, “Learn of Me, for I am meek and lowly of heart”? Did He not “become poor, when He was rich, that by His poverty we might be made rich”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252082.html'
source_title="Exposition on Psalm 82"
