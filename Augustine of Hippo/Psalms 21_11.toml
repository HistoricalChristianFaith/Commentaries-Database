[[commentary]]
quote='''
“Because they turned evils against Thee.” Now this punishment shall be recompensed to them, because the evils which they supposed to hang over them by Thy reign, they turned against Thee to Thy death. “They imagined a device, which they were not able to establish” (ver. 11). They imagined a device, saying, “It is expedient that one die for all:” which they were not able to establish, not knowing what they said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
