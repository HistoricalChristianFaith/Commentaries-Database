
[[commentary]]
quote='''
They shall not be joyous then that seek themselves, whom Thou hast first sought before they sought Thee. Not yet did that sheep seek the Shepherd, it had strayed from the flock, and He went down to it; He sought it, and carried it back upon His shoulders. Will He despise thee, O sheep, seeking Him, who hath first sought thee despising Him and not seeking Him? Now then begin thou to seek Him that first hath sought thee, and hath carried thee back on His shoulders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
