[[commentary]]
quote='''
A psalm of David himself, of the consummation of the tabernacle.

A Psalm of the Mediator Himself, strong of hand, of the perfection of the Church in this world, where she wars in time against the devil.

The Prophet speaks, “Bring unto the Lord, O ye Sons of God, bring unto the Lord the young of rams” (ver. 1). Bring unto the Lord yourselves, whom the Apostles, the leaders of the flocks, have begotten by the Gospel. “Bring unto the Lord glory and honour” (ver. 2). By your works let the Lord be glorified and honoured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252029.html'
source_title="Exposition on Psalm 29"

[[commentary]]
quote='''
But when thou hast heard Synagogue, do not forthwith abhor it, as if it were the murderer of the Lord. That Synagogue was indeed the murderer of the Lord, no man doubteth it: but remember, that from the Synagogue were the rams whereof we are the sons. Whence it is said in a Psalm, “Bring ye to the Lord the sons of rams.” What rams are thence? Peter, John, James, Andrew, Bartholomew, and the rest of the Apostles. Hence also he too at first Saul, afterwards Paul: that is, at first proud, afterwards humble.…Therefore even Paul came to us from the Synagogue, and Peter and the other Apostles from the Synagogue. Therefore when thou hast heard the voice of the Synagogue, do not look to the deserving thereof, but observe the offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
