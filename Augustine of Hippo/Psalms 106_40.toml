[[commentary]]
quote='''
“Therefore was the wrath of the Lord kindled against His own people” (ver. 40). Our translators have been unwilling to use the word anger, for the Greek θυμὸς; though some have used it; while others translate by “indignation” or “mind.” Whichever of these terms be adopted, passion doth not affect God; but the power of punishing hath assumed this name metaphorically from custom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
