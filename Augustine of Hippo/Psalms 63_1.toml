[[commentary]]
quote='''
This psalm hath the title, “For David himself, when he was in the desert of Idumæa.” By the name of Idumæa is understood this world. For Idumæa was a certain nation of men going astray, where idols were worshipped. In no good sense is put this Idumæa. If not in a good sense it is put, it must be understood that this life, wherein we suffer so great toils, and wherein to so great necessities we are made subject, by the name of Idumæa is signified. Even here is a desert where there is much thirst, and ye are to hear the voice of One now thirsting in the desert. But if we acknowledge ourselves as thirsting, we shall acknowledge ourselves as drinking also. For he that thirsteth in this world, in the world to come shall be satisfied, according to the Lord’s saying, “Blessed are they that hunger and thirst after righteousness, for the same shall be satisfied.” Therefore in this world we ought not to love fulness. Here we must thirst, in another place we shall be filled. But now in order that we may not faint in this desert, He sprinkleth upon us the dew of His word, and leaveth us not utterly to dry up, so that there should not be in our case any seeking of us again, but that we may so thirst as that we may drink. But in order that we may drink, with somewhat of His Grace we are sprinkled: nevertheless we thirst. And what saith our soul to God?

“God, my God, unto Thee from the light I watch” (ver. 1). What is to watch? It is, not to sleep. What is to sleep? There is a sleep of the soul; there is a sleep of the body. Sleep of body we all ought to have: because if sleep of body is not taken, a man fainteth, the body itself fainteth. For our frail body cannot long sustain a soul watching and on the stretch on active works; if for a long time the soul shall have been intent on active pursuits, the body being frail and earthly holdeth her not, sustaineth her not for ever in activity, and fainteth and falleth. Therefore God hath granted sleep to the body, whereby are recruited the members of the body, in order that they may be able to sustain the soul watching. But of this let us take heed, namely, that our soul herself sleep not: for evil is the sleep of the soul. Good is the sleep of the body, whereby is recruited the health of the body. But the sleep of the soul is to forget her God. Whatsoever soul shall have forgotten her God, sleepeth. Therefore the Apostle saith to certain persons that forgot their God, and being as it were in sleep, did act the follies of the worship of idols—the Apostle, I say, saith to certain persons, “Rise, thou that sleepest, and rise up from the dead, and Christ shall enlighten thee.” Was the Apostle waking up one sleeping in body? Nay, but he was waking a soul sleeping, inasmuch as he was waking her, in order that she might be lightened by Christ. Therefore as to these same watchings saith this man, “God, my God, unto Thee from the light I watch.” For thou wouldest not watch of thyself, unless there should arise thy Light, to wake thee from sleep. For Christ lighteneth souls, and maketh them to watch: but if His light He taketh away, they slumber. For for this cause to Him there is said in another psalm, “Lighten mine eyes, that I may never slumber in death.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
“My soul hath thirsted for Thee” (ver. 2). Behold that desert of Idumæa. See how here he thirsteth: but see what good thing is here, “Hath thirsted for Thee.” For there are they that thirst, but not for God. For every one that willeth anything to be granted to him, is in the heat of longing; the longing itself is the thirst of the soul. And see ye what longings there are in the hearts of men: one longeth for gold, another longeth for silver, another longeth for possessions, another inheritance, another abundance of money, another many herds, another a wife, another honours, another sons. Ye see those longings, how they are in the hearts of men. All men are inflamed with longing, and scarce is found one to say, “My soul hath thirsted for Thee.” For men thirst for the world: and perceive not themselves to be in the desert of Idumæa, where their souls ought to thirst for God.…

Wisdom therefore must be thirsted after, righteousness must be thirsted after. With it we shall not be satisfied, with it we shall not be filled, save when this life shall have been ended, and we shall have come to that which God hath promised. For God hath promised equality with Angels: and now the Angels thirst not as we do, they hunger not as we do; but they have the fulness of truth, of light, of immortal wisdom. Therefore blessed they are, and out of so great blessedness, because they are in that City, the Heavenly Jerusalem, afar from whence we now are sojourning in a strange land, they observe us sojourners, and they pity us, and by the command of the Lord they help us, in order that to this common country sometime we may return, and there with them sometime with the Lord’s fountain of truth and eternity we may be filled. Now therefore let our soul thirst: whence doth our flesh also thirst, and this in many ways? “In many ways for Thee,” he saith, “my flesh also.” Because to our flesh also is promised Resurrection. As to our soul is promised blessedness, so also to our flesh is promised resurrection.…For if God hath made us that were not, is it a great thing for Him to make again us that were? Therefore let not this seem to you to be incredible, because ye see dead men as it were decaying, and passing into ashes and into dust. Or if any dead man be burned, or if dogs tear him in pieces, do ye think that from this he will not rise again? All things which are dismembered, and into a sort of dust do decay, are entire with God. For into those elements of the world they pass, whence at first they have come, when we were made: we do not see them; but yet God will bring them forth, He knoweth whence, because even before we were, He created us from whence He knew. Such a resurrection of the flesh therefore to us is promised, as that, although it be the same flesh that now we carry which is to rise again, yet it hath not the corruption which now it hath. For now because of the corruption of frailty, if we eat not, we faint and are hungry; if we drink not, we faint and are thirsty; if long time we watch, we faint and sleep; if long time we sleep, we faint, therefore we watch.…Secondly, see how without any standing is our flesh: for infancy passeth away into boyhood, and thou seekest infancy, and infancy is not, for now instead of infancy is boyhood: again this same also passeth into youth, thou seekest boyhood and findest not: the young man becometh a middle-aged man, thou seekest the young man and he is not: the middle-aged man becometh an old man, thou seekest a middle-aged man and findest not: and an old man dieth, thou seekest an old man and findest not: our age therefore standeth not still: everywhere is weariness, everywhere faintness, everywhere corruption. Observing what a hope of resurrection God promiseth to us, in all those our manifold faintings we thirst for that incorruption: and so our flesh manifoldly doth thirst for God.

Nevertheless, my brethren, the flesh of a good Christian and a believer even in this world for God doth thirst: for if the flesh hath need of bread, if it hath need of water, if it hath need of wine, if it hath need of money, if this flesh hath need of a beast, from God it ought to seek it, not from demons and idols and I know not what powers of this world. For there are certain who when they suffer hunger in this world, leave God and ask Mercury or ask Jove to give unto them, or her whom they call “Heavenly,” or any the like demons: not for God their flesh thirsteth. But they that thirst for God, everywhere ought to thirst for Him, both soul and flesh: for to the soul also God giveth His bread, that is the Word of Truth: and to the flesh God giveth the things which are necessary, for God hath made both soul and flesh. For the sake of thy flesh thou askest of demons: hath God made the soul, and the demons made the flesh? He that hath made the soul, the Same hath made the flesh also: He that hath made both of them, the Same feedeth both of them. Let either part of us thirst for God, and after labour manifold let either simply be filled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
But where thirsteth our soul, and our flesh manifoldly, not for any one but for Thee, O Lord, that is our God? it thirsteth where? “In a land desert, and without way, and without water.” Of this world we have spoken, the same is Idumæa, this is the desert of Idumæa, whence the Psalm hath received its title. “In a land desert.” Too little it is to say “desert,” where no man dwelleth; it is besides, both “without way, and without water.” O that the same desert had even a way: O that into this a man running, even knew where he might thence get forth!…Evil is the desert, horrible, and to be feared: and nevertheless God hath pitied us, and hath made for us a way in the desert, Himself our Lord Jesus Christ: and hath made for us a consolation in the desert, in sending to us preachers of His Word: and hath given to us water in the desert, by fulfilling with the Holy Spirit His preachers, in order that there might be created in them a well of water springing up unto life everlasting. And, lo! we have here all things, but they are not of the desert.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
