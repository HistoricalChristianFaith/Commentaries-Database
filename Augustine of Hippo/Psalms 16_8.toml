[[commentary]]
quote='''
“I foresaw the Lord in My sight always” (ver. 8). But coming into things that pass away, I removed not Mine eye from Him who abideth ever, foreseeing this, that to Him I should return after passing through the things temporal. “For He is on My right hand, that I should not be moved.” For He favoureth Me, that I should abide fixedly in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
