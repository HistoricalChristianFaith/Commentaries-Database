[[commentary]]
quote='''
For these reasons, it also appears to me, that of the various parties who have interpreted the living creatures in the Apocalypse as significant of the four evangelists, those who have taken the lion to point to Matthew, the man to Mark, the calf to Luke, and the eagle to John, have made a more reasonable application of the figures than those who have assigned the man to Matthew, the eagle to Mark, and the lion to John. For, in forming their particular idea of the matter, these latter have chosen to keep in view simply the beginnings of the books, and not the full design of the several evangelists in its completeness, which was the matter that should, above all, have been thoroughly examined. For surely it is with much greater propriety that the one who has brought under our notice most largely the kingly character of Christ, should be taken to be represented by the lion. Thus is it also that we find the lion mentioned in conjunction with the royal tribe itself, in that passage of the Apocalypse where it is said, "The lion of the tribe of Judah hath prevailed." For in Matthew's narrative the magi are recorded to have come from the east to inquire after the King, and to worship Him whose birth was notified to them by the star. Thus, too, Herod, who himself also was a king, is [said there to be] afraid of the royal child, and to put so many little children to death in order to make sure that the one might be slain. Again, that Luke is intended under the figure of the calf, in reference to the pre-eminent sacrifice made by the priest, has been doubted by neither of the two [sets of interpreters]. For in that Gospel the narrator's account commences with Zacharias the priest. In it mention is also made of the relationship between Mary and Elisabeth. In it, too, it is recorded that the ceremonies proper to the earliest priestly service were attended to in the case of the infant Christ; and a careful examination brings a variety of other matters under our notice in this Gospel, by which it is made apparent that Luke's object was to deal with the part of the priest. In this way it follows further, that Mark, who has set himself neither to give an account of the kingly lineage, nor to expound anything distinctive of the priesthood, whether on the subject of the relationship or on that of the consecration, and who at the same time comes before us as one who handles the things which the man Christ did, appears to be indicated simply under the figure of the man among those four living creatures. But again, those three living creatures, whether lion, man, or calf, have their course upon this earth; and in like manner, those three evangelists occupy themselves chiefly with the things which Christ did in the flesh, and with the precepts which He delivered to men, who also bear the burden of the flesh, for their instruction in the rightful exercise of this mortal life. Whereas John, on the other hand, soars like an eagle above the clouds of human infirmity, and gazes upon the light of the unchangeable truth with those keenest and steadiest eyes of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 6"

[[commentary]]
quote='''
John remains, between whom and others there is left no comparison to be instituted. For, however the evangelists may each have reported some matters which are not recorded by the others, it will be hard to prove that any question involving real discrepancy arises out of these. Thus, too, it is a clearly admitted position that the first three—namely, Matthew, Mark, and Luke—have occupied themselves chiefly with the humanity of our Lord Jesus Christ, according to which He is both king and priest. And in this way, Mark, who seems to answer to the figure of the man in the well-known mystical symbol of the four living creatures, either appears to be preferentially the companion of Matthew, as he narrates a larger number of matters in unison with him than with the rest, and therein acts in due harmony with the idea of the kingly character whose wont it is, as I have stated in the first book, to be not unaccompanied by attendants; or else, in accordance with the more probable account of the matter, he holds a course in conjunction with both [the other Synoptists]. For although he is at one with Matthew in the larger number of passages, he is nevertheless at one rather with Luke in some others. And this very fact shows him to stand related at once to the lion and to the steer, that is to say, to the kingly office which Matthew emphasizes, and to the sacerdotal which Luke introduces, wherein also Christ appears distinctively as man, as the figure which Mark sustains stands related to both these. On the other hand, Christ's divinity, in virtue of which He is equal to the Father, in accordance with which He is the Word, and God with God, and the Word that was made flesh in order to dwell among us, in accordance with which also He and the Father are one, has been taken specially in hand by John with a view to its recommendation to our minds. Like an eagle, he abides among Christ's sayings of the sublimer order, and in no way descends to earth but on rare occasions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
