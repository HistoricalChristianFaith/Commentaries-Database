[[commentary]]
quote='''
The sacrifices, however, which used to be performed there, have been put away; and that which remained unto them for a sign like that of Cain, hath by this time been fulfilled; and they know it not. They slay the Lamb; they eat the unleavened bread. “Christ has been sacrificed for us, as our Passover.” Lo, in the sacrifice of Christ, I recognise the Lamb that was slain! What of the unleavened bread? “Therefore,” says he, “let us keep the feast; not with old leaven, neither with the leaven of wickedness” (he shows what is meant by “old;” it is “stale” flour; it is sour), “but in the unleavened bread of sincerity and truth.” They have continued in the shade; they cannot abide the Sun of Glory. We are already in the light of day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
