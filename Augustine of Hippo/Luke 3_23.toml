[[commentary]]
quote='''
(Quæst. Ev. ii. qu. 5.) Or there occur three reasons, by one of which the Evangelist was led. For either one Evangelist has mentioned the father by whom Joseph was begotten, but the other his maternal grandfather, or some one of his ancestors. Or one of the fathers mentioned was the natural father of Joseph, the other his father who had adopted him. Or after the manner of the Jews, when a man has died without children, the next of kin taking his wife ascribes to his dead kinsman the son whom he has himself begotten.

(de Con. Ev. lib. ii. c. 3.) It is most probable that Luke took the origin by adoption, as not being willing to say that Joseph, was begotten by him whose son he related him to be. For more easily is a man said to be his son by whom he was adopted, than to be begotten by him from whose flesh he was not born. But Matthew saying, "Abraham begat lsaac, and Isaac begat Jacob," and continuing in the word "begat," until at last he says, but "Jacob begat Joseph," has sufficiently expressed that he has carried through the succession of the fathers, to that father by whom Joseph was not adopted, but begotten. Although even supposing that Luke should say that Joseph was begotten by Eli, neither ought that word to perplex us. For it is not absurd to say that a man has begotten not in the flesh but in love the Son whom he has adopted. But rightly has Luke taken the origin by adoption, for by adoption are we made the sons of God, by believing on the Son of God, but by His birth in the flesh, the Son of God has rather for our sakes become the Son of man.

(de Con. Ev. lib. ii. c. 3.) He sufficiently declared by this that he called not Joseph the son of Eli because he was begotten by him, but rather because he was adopted by him, for he has called also Adam himself son, since though made by God, yet by grace (which he forfeited by sin) he was placed as a son in paradise.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Christ, it is true, was also supposed to be the son of Joseph in another way, as if He had been born simply of that man's seed. But this supposition was entertained by persons whose notice the virginity of Mary escaped. For Luke says: "And Jesus Himself began to be about thirty years of age, being (as was supposed) the son of Joseph." This Luke, however, instead of naming Mary His only parent, had not the slightest hesitation in also speaking of both parties as His parents, when he says: "And the boy grew and waxed strong, filled with wisdom, and the grace of God was in Him: and His parents went to Jerusalem every year at the feast of the passover." But lest any one may fancy that by the "parents" here are rather to be understood the blood relations of Mary along with the mother herself, what shall be said to that preceding word of the same Luke, namely, "And His father and mother marvelled at those things which were spoken of Him"? Since, then, he also makes the statement that Christ was born, not in consequence of Joseph's connection with the mother, but simply of Mary the virgin, how can he call him His father, unless it be that we are to understand him to have been truly the husband of Mary, without the intercourse of the flesh indeed, but in virtue of the real union of marriage; and thus also to have been in a much closer relation the father of Christ, in so far as He was born of his wife, than would have been the case had He been only adopted from some other party? And this makes it clear that the clause,"as was supposed," is inserted with a view to those who are of opinion that He was begotten by Joseph in the same way as other men are begotten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 1"

[[commentary]]
quote='''
Furthermore, as to those critics who find a difficulty in the circumstance that Matthew enumerates one series of ancestors, beginning with David and travelling downwards to Joseph, while Luke specifies a different succession, tracing it from Joseph upwards as far as to David, they might easily perceive that Joseph may have had two fathers,—namely, one by whom he was begotten, and a second by whom he may have been adopted. For it was an ancient custom also among that people to adopt children with the view of making sons for themselves of those whom they had not begotten. For, leaving out of sight the fact that Pharaoh's daughter adopted Moses (as she was a foreigner), Jacob himself adopted his own grandsons, the sons of Joseph, in these very intelligible terms: "Now, therefore, thy two sons which were born unto thee before I came unto thee, are mine: Ephraim and Manasseh shall be mine, as Reuben and Simeon: and thy issue which thou begettest after them shall be thine." Whence also it came to pass that there were twelve tribes of Israel, although the tribe of Levi was omitted, which did service in the temple; for along with that one the whole number was thirteen, the sons of Jacob themselves being twelve. Thus, too, we can understand how Luke, in the genealogy contained in his Gospel, has named a father for Joseph, not in the person of the father by whom he was begotten, but in that of the father by whom he was adopted, tracing the list of the progenitors upwards until David is reached. For, seeing that there is a necessity, as both evangelists give a true narrative,—to wit, both Matthew and Luke,—that one of them should hold by the line of the father who begat Joseph, and the other by the line of the father who adopted him, whom should we suppose more likely to have preserved the lineage of the adopting father, than that evangelist who has declined to speak of Joseph as begotten by the person whose son he has nevertheless reported him to be? For it is more appropriate that one should have been called the son of the man by whom he was adopted, than that he should be said to have been begotten by the man of whose flesh he was not descended. Now when Matthew, accordingly, used the phrases, "Abraham begat Isaac," "Isaac begat Jacob," and so on, keeping steadily by the term "begat," until he said at the close, "and Jacob begat Joseph," he gave us to know with sufficient clearness, that he had traced out the order of ancestors on to that father by whom Joseph was not adopted, but begotten.

But even although Luke had said that Joseph was begotten by Heli, that expression ought not to disturb us to such an extent as to lead us to believe anything else than that by the one evangelist the father begetting was mentioned, and by the other the father adopting. For there is nothing absurd in saying that a person has begotten, not after the flesh, it may be, but in love, one whom he has adopted as a son. Those of us, to wit, to whom God has given power to become His sons, He did not beget of His own nature and substance, as was the case with His only Son; but He did indeed adopt us in His love. And this phrase the apostle is seen repeatedly to employ just in order to distinguish from us the only-begotten Son who is before every creature, by whom all things were made, who alone is begotten of the substance of the Father; who, in accordance with the equality of divinity, is absolutely what the Father is, and who is declared to have been sent with the view of assuming to Himself the flesh proper to that race to which we too belong according to our nature, in order that by His participation in our mortality, through His love for us, He might make us partakers of His own divinity in the way of adoption. For the apostle speaks thus: "But when the fulness of time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons." And yet we are also said to be born of God,—that is to say, in so far as we, who already were men, have received power to be made the sons of God,—to be made such, moreover, by grace, and not by nature. For if we were sons by nature, we never could have been aught else. But when John said, "To them gave He power to become the sons of God, even to them that believe on His name," he proceeded at once to add these words, "which were born not of blood, nor of the will of the flesh, nor of the will of man, but of God." Thus, of the same persons he said, first, that having received power they became the sons of God, which is what is meant by that adoption which Paul mentions; and secondly, that they were born of God. And in order the more plainly to show by what grace this is effected, he continued thus: "And the Word was made flesh, and dwelt among us,"—as if he meant to say, What wonder is it that those should have been made sons of God, although they were flesh, on whose behalf the only Son was made flesh, although He was the Word? Howbeit there is this vast difference between the two cases, that when we are made the sons of God we are changed for the better; but when the Son of God was made the son of man, He was not indeed changed into the worse, but He did certainly assume to Himself what was below Him. James also speaks to this effect: "Of His own will begat He us by the word of truth, that we should be a kind of first fruits of His creatures." And to preclude our supposing, as it might appear from the use of this term "begat," that we are made what He is Himself, he here points out very plainly, that what is conceded to us in virtue of this adoption, is a kind of headship among the creatures.

It would be no departure from the truth, therefore, even had Luke said that Joseph was begotten by the person by whom he was really adopted. Even in that way he did in fact beget him, not indeed to be a man, but certainly to be a son; just as God has begotten us to be His sons, whom He had previously made to the effect of being men. But He begat only one to be not simply the Son, which the Father is not, but also God, which the Father in like manner is. At the same time, it is evident that if Luke had employed that phraseology, it would be altogether a matter of dubiety as to which of the two writers mentioned the father adopting, and which the father begetting of his own flesh; just as, on the other hand, although neither of them had used the word "begat," and although the former evangelist had called him the son of the one person, and the latter the son of the other, it would nevertheless be doubtful which of them named the father by whom he was begotten, and which the father by whom he was adopted. As the case stands now, however,—the one evangelist saying that "Jacob begat Joseph," and the other speaking of "Joseph who was the son of Heli,"—by the very distinction which they have made between the expressions, they have elegantly indicated the different objects which they have taken in hand. But surely it might easily suggest itself, as I have said, to a man of piety decided enough to make him consider it right to seek some worthier explanation than that of simply crediting the evangelist with stating what is false; it might, I repeat, readily suggest itself to such a person to examine what reasons there might be for one man being (supposed) capable of having two fathers. This, indeed, might have suggested itself even to those detractors, were it not that they preferred contention to consideration.
'''
