[[commentary]]
quote='''
(Tr. liii. 5) But what follows involved a deeper question: Therefore they could not believe, because that Esaias said again, He hath blinded their eyes, and hardened their hearts, that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them. That they should not believe; but if so, what sin is there in a man doing what he cannot help doing? And what is a graver point still, the cause is assigned to God; since He it is who blinded their eyes, and hardened their heart. This is not said to be the devil's doing, but God's. Yet if any ask why they could not believe, I answer, Because they would not. For as it is to the praise of the Divine will that God cannot deny Himself, so is it the fault of the human will that they could not believe.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the words of the Gospel also, that follow, are still more pressing, and start a question of more profound import: for He goes on to say, "Therefore they could not believe, because that Isaiah said again, He hath blinded their eyes, and hardened their heart; that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them." For it is said to us: If they could not believe, what sin is it in man not to do what he cannot do and if they sinned in not believing, then they had the power to believe, and did not use it. If, then, they had the power, how says the Gospel, "Therefore they could not believe, because that Isaiah said again, He hath blinded their eyes, and hardened their heart;" so that (which is of grave import) to God Himself is referred the cause of their not believing, inasmuch as it is He who "hath blinded their eyes, and hardened their heart"? For what is thus testified to in the prophetical Scriptures, is at least not spoken of the devil, but of God. For were we to suppose it said of the devil, that he "hath blinded their eyes, and hardened their heart;" we have to undertake the task of being able to show what blame was theirs in not believing, of whom it is said, "they could not believe." And then, what reply shall we give touching another testimony of this very prophet, which the Apostle Paul has adopted, when he says: "Israel hath not obtained that which he seeketh for; but the election hath obtained it, and the rest were blinded, according as it is written, God hath given them the spirit of remorse, eyes that they should not see, and ears that they should not hear, unto this day"?

Such, as you have just heard, brethren, is the question that comes before us, and you can perceive how profound it is; but we shall give what answer we can. "They could not believe," because that Isaiah the prophet foretold it; and the prophet foretold it because God foreknew that such would be the case. But if I am asked why they could not, I reply at once, because they would not; for certainly their depraved will was foreseen by God, and foretold through the prophet by Him from whom nothing that is future can be hid. But the prophet, sayest thou, assigns another cause than that of their will. What cause does the prophet assign? That "God hath given them the spirit of remorse, eyes that they should not see, and ears that they should not hear; and hath blinded their eyes, and hardened their heart." This also, I reply, their will deserved. For God thus blinds and hardens, simply by letting alone and withdrawing His aid: and God can do this by a judgment that is hidden, although not by one that is unrighteous. This is a doctrine which the piety of the God-fearing ought to preserve unshaken and inviolable in all its integrity: even as the apostle, when treating of the same intricate question, says, "What shall we say then? is there unrighteousness with God? God forbid." If, then, we must be far from thinking that there is unrighteousness with God, this only can it be,that, when He giveth His aid, He acteth mercifully; and, when He withholdeth it, He acteth righteously: for in all He doeth, He acteth not rashly, but in accordance with judgment. And still further, if the judgments of the saints are righteous, how much more those of the sanctifying and justifying God? They are therefore righteous, although hidden. Accordingly, when questions of this sort come before us, why one is dealt with in such a way, and another in such another way; why this one is blinded by being forsaken of God, and that one is enlightened by the divine aid vouchsafed to him: let us not take upon ourselves to pass judgment on the judgment of so mighty a judge, but tremblingly exclaim with the apostle, "O the depth of the riches both of the wisdom and knowledge of God! how unsearchable are His judgments, and His ways past finding out!" As it is also said in the psalm, "Thy judgments are as a great deep."

Let not then, brethren, the expectations of your Charity drive me to attempt the task of penetrating into such a deep, of sounding such an abyss, of searching into what is unsearchable. I own my own little measure of ability, and I think I have some perception of yours also, as equally small. This is too high for my stature, and too strong for my strength; and for yours also, I think. Let us, therefore, listen together to the admonition and to the words of Scripture: "Seek not out the things that are too high for thee, neither search the things that are above thy strength." Not that such things are forbidden us, since the divine Master saith, "There is nothing hid that shall not be revealed:" but if we walk up to the measure of our present attainments, then, as the apostle tells us, not only what we know not and ought to know, but also if we are minded to know anything else, God will reveal even this unto us. But if we have reached the pathway of faith, let us keep to it with all constancy: let it be our guide to the chamber of the King, in whom are hid all the treasures of wisdom and knowledge. For it was in no spirit of grudging that the Lord Jesus Christ Himself acted towards those great and specially chosen disciples of His, when He said, "I have many things to say unto you, but ye cannot bear them now." We must be walking, making progress, and growing, that our hearts may become fit to receive the things which we cannot receive at present. And if the last day shall find us sufficiently advanced, we shall then learn what here we were unable to know.

If, however, any one considers himself able, and has confidence enough, to give a clearer and better exposition of the question before us, God forbid that I should not be still more ready to learn than to teach. Only let no one dare to defend the freedom of the will in any such way as to attempt depriving us of the prayer that says, "Lead us not into temptation;" and, on the other hand, let no one deny the freedom of the will, and so venture to find an excuse for sin. But let us give heed to the Lord, both in commanding and in offering His aid; in both telling us our duty, and assisting us to discharge it. For some He hath let be lifted up to pride through an overweening trust in their own wills, while others He hath let fall into carelessness through a contrary excess of distrust. The former say: Why do we ask God not to let us be overcome by temptation, when it is all in our own power? The latter say: Why should we try to live well, when the power to do so is in the hands of God? O Lord, O Father, who art in heaven, lead us not into any of these temptations; but "deliver us from evil!" Listen to the Lord, when He says, "I have prayed for thee, Peter, that thy faith fail not;" that we may never think of our faith as so lying in our free will that it has no need of the divine assistance. Let us listen also to the evangelist, when he says, "He hath given them power to become the sons of God;" that we may not imagine it as altogether beyond our own power that we believe: but in both let us acknowledge His beneficent acting. For, on the one side, we have to give Him thanks that the power is bestowed; and on the other, to pray that our own little strength may not utterly fail. It is this very faith that worketh by love, according to the measure thereof that the Lord hath given to every man; that he that glorieth may glory, not in himself, but in the Lord.

It is no wonder, then, that they could not believe, when such was their pride of will, that, being ignorant of the righteousness of God, they wished to establish their own: as the apostle says of them, "They have not submitted themselves unto the righteousness of God." For it was not by faith, but as it were by works, that they were puffed up; and blinded by this very self-elation, they stumbled against the stone of stumbling. And so it is said, "they could not," by which we are to understand that they would not; in the same way as it was said of the Lord our God, "If we believe not, yet He abideth faithful, He cannot deny Himself." It is said of the Omnipotent, "He cannot." And so, just as it is a commendation of the divine will that the Lord "cannot deny Himself," that they "could not believe" is a fault chargeable on the will of man.

And, look you! so also say I, that those who have such lofty ideas of themselves as to suppose that so much must be attributed to the powers of their own will, that they deny their need of the divine assistance in order to a righteous life, cannot believe on Christ. For the mere syllables of Christ's name, and the Christian sacraments, are of no profit, where faith in Christ is itself resisted. For faith in Christ is to believe in Him that justifieth the ungodly; to believe in the Mediator, without whose interposition we cannot be reconciled unto God; to believe in the Saviour, who came to seek and to save that which was lost; to believe in Him who said, "Without me ye can do nothing." Because, then, being ignorant of that righteousness of God that justifieth the ungodly, he wishes to set up his own to satisfy the minds of the proud, such a man cannot believe on Christ. And so, those Jews "could not believe:" not that men cannot be changed for the better; but so long as their ideas run in such a direction, they cannot believe. Hence they are blinded and hardened; for, denying the need of divine assistance, they are not assisted. God foreknew this regarding these Jews who were blinded and hardened, and the prophet by His Spirit foretold it.

But when he added, "And they should be converted, and I should heal them," is there a "not" to be understood, that is, they should not be converted, connecting it with the clause before, where it is said, "that they should not see with their eyes and understand with their heart;" for here also it is certainly meant, "and should not understand "? For conversion itself is likewise a gift of His grace, as when it is said to Him, "Turn us, O God of Hosts." Or may it be that we are to understand this also as actually taking place through the merciful experience of the divine method of healing, [namely this,] that, being of proud and perverse wills, and wishing to establish their own righteousness, they were left alone for the very purpose of being blinded; and thus blinded in order that they might stumble on the stone of stumbling, and have their faces filled with shame; and so, being thus humbled, might seek the name of the Lord, and no longer a righteousness of their own, that inflated their pride, but the righteousness of God, that justifieth the ungodly? For this very way turned out to the good of many of them, who were afterwards filled with remorse for wickedness, and believed on Christ; and on whose behalf He Himself had put up the prayer, "Father, forgive them, for they know not what they do." And it is of that ignorance of theirs also that the apostle says, "I bear them record that they have a zeal of God, but not according to knowledge:" for he then goes on also to add, "For they, being ignorant of God's righteousness, and seeking to establish their own righteousness, have not submitted themselves unto the righteousness of God."
'''
