[[commentary]]
quote='''
And He, who had come to forgive sins, said: "Whoever among you knows himself to be without sin, let him first cast a stone at her." O response, or proposal! If they wished to cast a stone at the sinner, at that moment it would again be said: "In whatever judgment you judge, you will be judged." You condemn, you will be condemned. However, although they did not recognize the Creator, they knew their own conscience. Putting their faces one after another, so that they would not see each other out of shame, from the oldest—as the Evangelist said—to the youngest, they all went out. For the Holy Spirit had said: "All have turned away, together they have become worthless; there is none who does good, not even one."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252016A.html'
source_title="Sermon 16A"

[[commentary]]
quote='''
(Tract. xxxiii. 5) He did not say, Stone her not, lest He should seem to speak contrary to the law. But God forbid that He should say, Stone her; for He came not to destroy that which He found, but to seek that which was lost. What then did He answer? He that is without sin among you, let him first cast a stone at her. This is the voice of justice. Let the sinner be punished, but not by sinners; the law carried into effect, but not by transgressors of the law.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"
