[[commentary]]
quote='''
Three men were crucified in the same place, the Lord in the middle, because "he was reckoned among the wicked." They placed the two robbers on either side, but they were not crucified for the same reason. They were flanking Christ as he hung there, but they were far removed from him in reality. They were crucified by their crimes, he by ours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520285.html'
source_title="SERMON 285:2"

[[commentary]]
quote='''
For Christ was not discerned by the ungodly, but was condemned with the ungodly; for it was said concerning Him, "He was accounted among the wicked." The robber escaped, Christ was condemned. He who was loaded with criminal accusations received pardon; He who has released from their crimes all who confess Him, was condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"
