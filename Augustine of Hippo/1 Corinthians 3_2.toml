[[commentary]]
quote='''
Ye know that the Apostle saith to some weak brethren, “I have fed you with milk, and not with meat; for hitherto ye were not able to bear it, neither yet now are ye able.” There are weak persons who are not fit for strong meat; they wish to grasp at that which they cannot receive: and if they ever do receive, or seem to themselves to receive what they have not received, they are puffed up thereby, and become proud thereupon; they seem to themselves wise men. Now this happeneth to all heretics; who since they were animal and carnal, by defending their depraved opinions, which they could not see to be false, were shut out of the Catholic Church.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520131.html'
source_title="Exposition on Psalm 131"
