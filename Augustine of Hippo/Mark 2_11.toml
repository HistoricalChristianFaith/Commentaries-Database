[[commentary]]
quote='''
The bed of pain is the infirmity of the flesh; lest thou shouldest say, I cannot hold, and carry, and tie up my flesh; thou art aided that thou mayest. The Lord help thee on thy bed of pain. Thy bed did carry thee, thou carriedst not thy bed, but wast a paralytic inwardly; He cometh who saith to thee, “Take up thy bed, and go thy way into thy house.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"
