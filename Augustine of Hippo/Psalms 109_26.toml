[[commentary]]
quote='''
“Help me, O Lord my God: O save me according to Thy mercy” (ver. 25). This may be referred to the whole, both to the Head and to the body: to the Head, owing to His having taken the form of a servant; to the body, on account of the servants themselves. For He might even in them have said unto God, “Help Me:” and, “O save Me:” as in them He said unto Paul, “Why persecutest thou Me”? The following words, “according to Thy mercy,” describe grace given gratuitously, not according to the merit of works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
