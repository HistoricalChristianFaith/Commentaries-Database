[[commentary]]
quote='''
He it was rather who kept it, who was without sin. For this is the spiritual Sabbath, to have no sin. In fact, brethren, it is of this that God admonishes us, when He commends the Sabbath to our notice: "Thou shalt do no servile work" These are God's words when commending the Sabbath, "Thou shalt do no servile work." Now ask the former lessons, what is meant by servile work; and listen to the Lord: "Every one that committeth sin is the servant of sin." But these men, neither seeing, as I said, nor anointed, kept the Sabbath carnally, and profaned it spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
