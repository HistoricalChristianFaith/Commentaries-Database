[[commentary]]
quote='''
What, again, is the purport of that which the man of God said to King Amaziah: "Let not the army of Israel go with thee; for the Lord is not with Israel, even with all the children of Ephraim: for if thou shalt think to obtain with these, the Lord shall put thee to flight before thine enemies: for God hath power either to strengthen or to put to flight"? Now, how does the power of God help some in war by giving them confidence, and put others to flight by injecting fear into them, except it be that He who has made all things according to His own will, in heaven and on earth, also works in the hearts of men?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 42"
