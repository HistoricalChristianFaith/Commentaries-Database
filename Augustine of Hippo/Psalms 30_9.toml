[[commentary]]
quote='''
“What profit” is there “in My blood, whilst I go down to corruption?” (ver. 9) What profit is there in the shedding of My blood, whilst I go down to corruption? “Shall dust confess unto Thee?” For if I shall not rise immediately, and My body shall become corrupt, “shall dust confess unto Thee?” that is, the crowd of the ungodly, whom I shall justify by My resurrection? “Or declare Thy truth?” Or for the salvation of the rest declare Thy truth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
