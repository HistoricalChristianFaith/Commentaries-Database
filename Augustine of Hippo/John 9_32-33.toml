[[commentary]]
quote='''
(Tr. xliv. 13) Freely, stedfastly, truly. For how could what our Lord did, be done by any other than God, or by disciples even, except when their Lord dwelt in them?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Since the world began was it not heard that any man opened the eyes of one that was born blind. If this man were not of God, he could do nothing." With frankness, constancy, and truthfulness [he spoke]. For these things that were done by the Lord, by whom were they done but by God? Or when would such things be done by disciples, were not the Lord dwelling in them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
