[[commentary]]
quote='''
“O remember Thy word unto Thy servant, wherein Thou hast given me hope” (ver. 49). Is forgetfulness incident to God, as it is to man? Why then is it said unto Him, “O remember”? Although in other passages of holy Scripture this very word is used, as, “Why hast Thou forgotten me?” and, “Wherefore forgettest Thou our misery?”…These expressions are borrowed from moral discourses on human affections; although God doth these things according to a fixed dispensation, with no failing memory, nor with an understanding obscured, nor with a will changed. When therefore it is said unto Him, “O remember,” the desire of him who prayeth is displayed, because he asketh for what was promised; God is not admonished, as if the promise had escaped from His mind. “O remember,” he saith, “Thy word unto Thy servant:” that is, fulfil Thy promise to Thy servant. “Wherein Thou hast given me hope:” that is, in Thy Word, since Thou hast promised, Thou hast caused me to hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
