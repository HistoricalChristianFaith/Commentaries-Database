[[commentary]]
quote='''
“Merciful, pitying, and just is the Lord God.” It delighteth us that He is “merciful and pitying,” but it perhaps terrifieth us that the Lord God is “just.” Fear not, despair not at all, happy man, who fearest the Lord, and hast great delight in His commandments; be thou sweet, be merciful and lend. For the Lord is just in this manner, that He judgeth without mercy him who hath not shown mercy; but, “Sweet is the man who is merciful and lendeth” (ver. 5): God will not spew him out of His mouth as if he were not sweet. “Forgive,” He saith, “and ye shall be forgiven; give, and it shall be given unto you.” Whilst thou forgivest that thou mayest be forgiven, thou art merciful; whilst thou givest that it may be given unto thee, thou lendest. For though all be called generally mercy where another is assisted in his distress, yet there is a difference where thou spendest neither money, nor the toil of bodily labour, but by forgiving what each man hath sinned against thee, thou gainest free pardon for thine own sins also.…He who is unwilling to give to the poor, seeketh riches; listen to what is written, “Thou shalt have treasure in heaven.” Thou wilt not then lose honour by forgiving: for it is a very laudable triumph to conquer anger: wilt not grow poor by giving; for a heavenly treasure is a more safe possession. The former verse, “Riches and plenteousness shall be in his house,” was pregnant with this verse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
