[[commentary]]
quote='''
For in a certain place, when He was informed that His mother and His brethren were standing without, at the time He was speaking to His disciples, He said: "Who is my mother? or who are my brethren? And stretching out His hand over His disciples, He said, These are my brethren;" and, "Whosoever shall do the will of my Father, the same is my mother, and brother, and sister." Therefore also Mary, because she did the will of the Father. What the Lord magnified in her was, that she did the will of the Father, not that flesh gave birth to flesh. Give good heed, beloved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"

[[commentary]]
quote='''
I speak a wonderful thing, my brethren. In the words of the Lord, we find the Church to be both His brethren, and His sisters, and His mother.…For Mary was among the sides of His House, and His relatives coming of the kindred of the Virgin Mary, who believed on Him, were among the sides of His House; not in respect of their carnal consanguinity, but inasmuch as they heard the Word of God, and obeyed it.…He added; “For whosoever shall do the will of My Father which is in heaven, the same is My brother, and sister, and mother.” “Brother,” perhaps, on account of the male sex whom the Church hath: “sister,” on account of the women whom Christ hath here in His members. How “mother,” save that Christ Himself is in those Christians, whom the Church daily bringeth forth Christians through baptism? In those therefore in whom thou understandest the wife, in them thou understandest the mother, in them the children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
