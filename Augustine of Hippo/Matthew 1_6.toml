[[commentary]]
quote='''
(De Cons. Ev. ii. 4.) Since in Matthew's genealogy is showed forth the taking on Him by Christ of our sins, therefore he descends from David to Solomon, in whose mother David had sinned. Luke ascends to David through Nathan, for through Nathan the prophet God punished David's sin; because Luke's genealogy is to show the putting away of our sins.

(Lib. Retract. ii. 16.) That is it, must be said, through a prophet of the same name, for it was not Nathan the son of David who reproved him, but a prophet of the same name.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
On the other hand, Luke appears to have occupied himself rather with the priestly lineage and character of the Lord. For although in his own way he carries the descent back to David, what he has followed is not the royal pedigree, but the line of those who were not kings. That genealogy, too, he has brought to a point in Nathan the son of David, which person likewise was no king. It is not thus, however, with Matthew. For in tracing the lineage along through Solomon the king, he has pursued with strict regularity the succession of the other kings; and in enumerating these, he has also conserved that mystical number of which we shall speak hereafter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 2"

[[commentary]]
quote='''
In this way, it is the taking of our sins upon Himself by the Lord Christ that is signified in the genealogy of Matthew, while in the genealogy of Luke it is the abolition of our sins by the Lord Christ that is expressed. In accordance with these ideas, the one details the names in the descending scale, and the other in the ascending. For when the apostle says, "God sent His Son in the likeness of the flesh of sin," he refers to the taking of our sins upon Himself by Christ. But when he adds, "for sin, to condemn sin in the flesh," he expresses the expiation of sins. Consequently Matthew traces the succession downwards from David through Solomon, in connection with whose mother it was that he sinned; while Luke carries the genealogy upwards to the same David through Nathan, by which prophet God took away his sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 4"
