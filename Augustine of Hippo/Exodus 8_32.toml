[[commentary]]
quote='''
Nor should you take away from Pharaoh free will, because in several passages God says, "I have hardened Pharaoh;" or," I have hardened or I will harden Pharaoh's heart;" for it does not by any means follow that Pharaoh did not, on this account, harden his own heart. For this, too, is said of him, after the removal of the fly-plague from the Egyptians, in these words of the Scripture: "And Pharaoh hardened his heart at this time also; neither would he let the people go." Thus it was that both God hardened him by His just judgment, and Pharaoh by his own free will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 45"
