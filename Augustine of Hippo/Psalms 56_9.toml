[[commentary]]
quote='''
“Turned be mine enemies backward” (ver. 9). This thing to these very men is profitable, no ill to these men he is wishing. For to go before they are willing, therefore to be amended they are not willing. Thou warnest thine enemy to live well, that he amend himself: he scorneth, he rejecteth thy word: “Behold him that adviseth me; behold him from whom I am to hear the commandments whereby I shall live!” To go before thee he willeth, and in going before is not amended. He mindeth not that thy words are not thine, he mindeth not that thy life to God thou tellest out, not to thyself. In going before therefore he is not amended: it is a good thing for him that he be turned backward, and follow him whom to go before he willed. The Lord to His disciples was speaking of His Passion that was to be. Peter shuddered, and saith, “Far be it, O Lord;” he that a little before had said, “Thou art the Christ, Son of the living God,” having confessed God, feared for Him to die, as if but a man. But the Lord who so came that He might suffer (for we could not otherwise be saved unless with His blood we were redeemed), a little before had praised the confession of Peter.…But immediately when the Lord beginneth to speak of His Passion, he feared lest He should perish by death, whereas we ourselves should perish unless He died; and he saith, “Far be it, O Lord, this thing shall not be done.” And the Lord, to him to whom a little before He had said, “Blessed thou art, and upon this Rock I will build my Church,” saith, “Go back behind, Satan, an offence thou art to Me.” Why therefore “Satan” is he, that a little before was “blessed,” and a “Rock”? “For thou savourest not the things which are of God,” He saith, “but those things which are of man.” A little before he savoured the things which are of God: because “not flesh and blood hath revealed to thee, but My Father which is in the Heavens.” When in God he was praising his discourse, not Satan but Peter, from petra: but when of himself and out of human infirmity, carnal love of man, which would be for an impediment to his own salvation, and that of the rest, Satan he is called. Why? Because to go before the Lord he willed, and earthly counsel to give to the heavenly Leader. “Far be it, O Lord, this thing shall not be done.” Thou sayest, “Far be it,” and thou sayest, “O Lord:” surely if Lord He is, in power He doeth: if Master He is, He knoweth what He doeth, He knoweth what He teacheth. But thou willest to lead thy Leader, teach thy Master, command thy Lord, choose for God: much thou goest before, go back behind. Did not this too profit these enemies? “Turned be Mine enemies backward;” but let them not remain backward. For this reason let them be turned backward, lest they go before; but so that they follow, not so that they remain.

“In whatsoever day I shall have called upon Thee, behold I have known that my God art Thou” (ver. 9). A great knowledge. He saith not, “I have known that God Thou art:” but, “that my God art Thou.” For thine He is, when thee He succoureth: thine He is, when thou to Him art not an alien. Whence is said, “Blessed the people of whom is the Lord the God of the same.” Wherefore “of whom is”? For of whom is He not? Of all things indeed God He is: but of those men the God peculiarly He is said to be, that love Him, that hold Him, that possess Him, that worship Him, as though belonging to His own House: the great family of Him are they, redeemed by the great blood of the Only Son. How great a thing hath God given to us, that His own we should be, and He should be ours! But in truth foreigners afar have been put from holy men, sons alien they are. See what of them is said in another Psalm: “O Lord, deliver me,” he saith, “from the hand of alien sons, of whom the mouth hath spoken vanity, and the right hand of them is a right hand of iniquity.”…

Let us therefore love God, brethren, purely and chastely. There is not a chaste heart, if God for reward it worshippeth. How so? Reward of the worship of God shall not we have? We shall have evidently, but it is God Himself whom we worship. Himself for us a reward shall be, because “we shall see Him as He is.” Observe that a reward thou shalt obtain.…I will tell you, brethren: in these human alliances consider a chaste heart, of what sort it is towards God: certainly human alliances are of such sort, that a man doth not love his wife, that loveth her because of her portion: a woman her husband doth not chastely love, that for these reasons loveth him, because something he hath given, or because much he hath given. Both a rich man is a husband, and one that hath become a poor man is a husband. How many men proscribed, by chaste wives have been the more beloved! Proved have been many chaste marriages by the misfortunes of husbands: that the wives might not be supposed to love any other object more than their husband, not only have they not forsaken, but the more have they obeyed. If therefore a husband of flesh freely is loved, if chastely he is loved; and a wife of flesh freely is loved, if chastely she is loved; in what manner must God be loved, the true and truth-speaking Husband of the soul, making fruitful unto the offspring of everlasting life, and not suffering us to be barren? Him, therefore, so let us love, as that any other thing besides Himself be not loved: and there takes place in us that which we have spoken of, that which we have sung, because even here the voice is ours: “In whatsoever day I shall have called upon Thee, behold, I have known that my God art Thou.” This is to call upon God, freely to call upon Him. Furthermore, of certain men hath been said what? “Upon the Lord they have not called.” The Lord they seemed as it were to call unto themselves and they besought Him about inheritances, about increasing money, about lengthening this life, about the rest of temporal things: and concerning them the Scripture saith what? “Upon the Lord they have not called.” Therefore there followeth what? “There they have feared with fear, where there was no fear.” What is, “where there was no fear”? Lest money should be stolen from them, lest anything in their house should be made less; lastly, lest they should have less of years in this life, than they hoped for themselves: but there have they trembled with fear, where there was no fear.
'''
