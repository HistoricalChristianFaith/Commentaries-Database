[[commentary]]
quote='''
(ubi sup.) Matthew has not related, that the man who brought the sponge filled with vinegar, but that the others spoke about Elias; from whence we gather that both said it.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew next makes this statement: "And straightway one of them ran, and took a sponge, and filled it with vinegar, and put it on a reed, and gave Him to drink." Mark presents it in a similar form: "And one ran, and filled a sponge full of vinegar, and put it on a reed, and gave Him to drink, saying, Let alone; let us see whether Elias will come to take Him down." Matthew, however, has represented these words about Elias to have been spoken, not by the person who offered the sponge with the vinegar, but by the rest. For his version runs thus: "But the rest said, Let be; let us see whether Elias will come to save Him;"—from which, therefore, we infer that both the man specially referred to and the others who were there expressed themselves in these terms. Luke, again, has introduced this notice of the vinegar previous to his report of the robber's insolence. He gives it thus: "And the soldiers also mocked Him, coming to Him, and offering Him vinegar, and saying, If thou be the King of the Jews, save thyself." It has been Luke's purpose to embrace in one statement what was done and what was said by the soldiers. And we ought to feel no difficulty in the circumstance that he has not said explicitly that it was "one" of them who offered the vinegar. For, adopting a method of expression which we have discussed above, he has simply put the plural number for the singular. Moreover, John has also given us an account of the vinegar, where he says: "After this, Jesus, knowing that all things were now accomplished, that the Scripture might be fulfilled, said, I thirst. Now there was set a vessel full of vinegar: and they filled a sponge with vinegar, and put it upon hyssop, and put it to His mouth." But although the said John thus informs us that Jesus said "I thirst," and also mentions that there was a vessel full of vinegar there, while the other evangelists leave these things unspecified, there is nothing to marvel at in this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 17"
