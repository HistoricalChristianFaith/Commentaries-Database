[[commentary]]
quote='''
But what shall I say, brethren? Let us see plainly what He purchased. For there He bought, where He paid the price. Paid it for how much? If He paid it only for Africa, let us be Donatists, and not be called Donatists, but Christians; since Christ bought only Africa: although even here are other than Donatists. But He has not been silent of what He bought in this transaction. He has made up the account: thanks be to God, He has not tricked us. Need there is for that bride to hear, and then to understand to whom she has vowed her virginity. There, in that psalm where it says, "They pierced my hands and my feet, they counted all my bones;" wherein the Lord's passion is most openly declared;-the psalm which is read every year on the last week, in the hearing of the whole people, at the approach of Christ's passion; and this psalm is read both among them and us;-there, I say, note, brethren, what He has bought: let the bill of merchandise be read: hear ye what He bought: "All the ends of the earth shall remember, and turn unto the Lord; and all the kindreds of the nations shall worship in His sight: for the kingdom is His, and He shall rule the nations." Behold what it is He has bought! Behold! "For God, the King of all the earth," is thy Bridegroom. Why, then, wouldst thou have one so rich reduced to rags? Acknowledge Him: He bought the whole; yet thou sayest, "Thou hast a part of it here."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
