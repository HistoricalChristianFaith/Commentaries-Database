[[commentary]]
quote='''
And since the apostle himself says: "Now this I say: he who sows sparingly shall also reap sparingly," you should understand that now is the time, while we are still in this life, to be swift and eager to purchase the gift of eternal life, for when the end of the world comes it will be given only to those who have bought it for themselves by faith before they were able to see it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 268"

[[commentary]]
quote='''
“And his seed is blessed.” Here too let not any carnal notion suggest itself. We see many of the sons of the righteous dying of hunger; in what sense then will his seed be blessed? His seed is that which remains of him afterwards; that wherewith he soweth here, and will hereafter reap. For the Apostle says, “Let us not be weary in well-doing; for in due season we shall reap if we faint not. As we have therefore time,” he says, “let us do good unto all men.” This is that “seed” of thine which shall “be blessed.” You commit it to the earth, and gather ever so much more; and dost thou lose it in committing it to Christ? See it expressly termed “seed” by the Apostle, when he was speaking of alms. For this he saith; “He which soweth sparingly, shall reap also sparingly; and he which soweth in blessings, shall also reap in blessings.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"


[[commentary]]
quote='''
Works of mercy are our seeds: of which seeds the Apostle saith, “Let us not be weary in well doing; for in due season we shall reap if we faint not.” Speaking therefore of almsgiving itself, what saith he? “This I say; he that soweth sparingly, shall reap also sparingly.” He therefore who soweth plentifully, shall reap plentifully: he who soweth sparingly, shall reap also sparingly: and he that soweth nothing, shall reap nothing. Why do ye long for ample estates, where ye may sow plentifully? There is not a wider field on which ye can sow than Christ, who hath willed that we should sow in Himself. Your soil is the Church; sow as much as ye can.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
