[[commentary]]
quote='''
Praise to the rich if they remain humble. Praise the rich for being poor. The one who writes to Timothy wants them to be like that, when he says, "Order the rich of this world not to be haughty in mind." I know what I am saying: give them these orders. The riches they have are whispering persuasively to them to be proud; the riches they have make it very hard for them to be humble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252014.html'
source_title="SERMONS 14.2"


[[commentary]]
quote='''
It wasn't riches he was in dread of, but the disease of riches. The disease of riches is great pride. A grand spirit it is indeed, that in the midst of riches is not prone to this disease, a spirit greater than its riches, surpassing them not by desiring but by despising them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252036.html'
source_title="SERMONS 36.2"

[[commentary]]
quote='''
Yet do not take what I have said, my brethren, in such a way, as if God does not hear those who have gold and silver, and a household, and farms, if they happen to be born to this estate, or hold such a rank in the world: only let them remember the Apostle’s words: “Charge those who are rich in this world, that they be not highminded.” For those that are not highminded are poor in God, and to the poor and needy and those in want He inclines His ear. For they know that their hope is not in gold and silver, nor in those things in which for a time they seem to abound. It is enough that riches ruin them not; it is enough that they do them no harm: for good they can do them none. What certainly profiteth is a work of mercy, done by a rich or by a poor man: by a rich man, with will and deed; by a poor man, with will alone. When therefore he is such an one as despiseth in himself everything which is wont to swell men with pride, he is one of God’s poor: He inclines unto him His ear, for He knows that his heart is contrite.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
