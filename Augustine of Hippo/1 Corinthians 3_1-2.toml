[[commentary]]
quote='''
From the words of our Lord, where He says, "I have yet many things to say unto you, but ye cannot bear them now," there arose a difficult question, which I recollect to have put off, that it might be handled afterwards at greater leisure, because my last discourse had reached its proper limits, and required to be brought to a close. And now, accordingly, as we have time to redeem our promise, let us take up its discussion as the Lord Himself shall grant us ability, who put it into our heart to make the proposal. And the question is this: Whether spiritual men have aught in doctrine which they should withhold from the carnal, but declare to the spiritual. For if we shall say, They have not, we shall meet with the reply, What, then, is to be made of the words of the apostle in writing to the Corinthians: "I could not speak unto you as unto spiritual, but as unto carnal. As unto babes in Christ, I have given you milk to drink, and not meat to eat: for hitherto ye were not able; neither yet now are ye able; for ye are yet carnal?" But if we say, They have, we have cause to fear and take heed, lest under such a pretext detestable doctrines be taught in secret, and under the name of spiritual, as things which cannot be understood by the carnal, may seem not only capable of being whitewashed by plausible excuses, but deserving also to be lauded in preaching.

In the first place, then, your Charity ought to know that it is Christ Himself as crucified, wherewith the apostle says that he has fed those who are babes as with milk; but His flesh itself, in which was witnessed His real death, that is, both His real wounds when transfixed and His blood when pierced, does not present itself to the minds of the carnal in the same manner as to that of the spiritual, and so to the former it is milk, and to the latter it is meat; for if they do not hear more than others, they understand better. For the mind has not equal powers of perception even for that which is equally received by both in faith. And so it happens that the preaching of Christ crucified, by the apostle, was at once to the Jews a stumbling-block, and to the Gentiles foolishness; and to those who are called, both Jews and Greeks, the power of God, and the wisdom of God;" but to the carnal, as babes who held it only as a matter of faith, and to the spiritual, as those of greater capacity, who perceived it as a matter of understanding; to the former, therefore, as a milk-draught, to the latter as solid food: not that the former knew it in one way out in the world at large, and the latter in another way in their secret chambers; but that what both heard in the same measure when it was publicly spoken, each apprehended in his own measure. For inasmuch as Christ was crucified for the very purpose of shedding His blood for the remission of sins, and of divine grace being thereby commended in the passion of His Only-begotten, that no one should glory in man, what understanding had they of Christ crucified who were still saying, "I am of Paul"? Was it such as Paul himself had, who could say, "But God forbid that I should glory, save in the cross of our Lord Jesus Christ"? In regard, therefore, even to Christ crucified, he himself found food in proportion to his own capacity, and nourished them with milk in accordance with their infirmity. And still further, knowing that what he wrote to the Corinthians might doubtless be understood in one way by those who were still babes, and differently by those of greater capacity, he said, "If any one among you is a prophet, or spiritual, let him acknowledge that the things that I write unto you are the commandment of the Lord; but if any man be ignorant, let him be ignorant." Assuredly he would have the knowledge of the spiritual to be substantial, wherever not only faith had found a suitable abode, but a certain power of understanding was possessed; and whereby such believed those very things which as spiritual they likewise acknowledged. But "let him be ignorant," he says, who "is ignorant;" because it was not yet revealed to him to know that which he believes. When this takes place in a man's mind, he is said to be known of God; for it is God who endows him with this power of understanding, as it is elsewhere said, "But now, knowing God, or rather, being known of God." For it was not then that God first knew those who were foreknown and chosen before the foundation of the world; but then it was that He made them to know Himself.

Having ascertained this, therefore, at the outset, that the very things, which are equally heard by the spiritual and the carnal, are received by each according to the slender measure of his own capacity,-by some as babes, by others as those of riper years,-by one as milk nourishment, by another as solid food,-there seems no necessity for any matters of doctrine being retained in silence as secrets, and concealed from infant believers, as things to be spoken of apart to those who are older, or possessed of a riper understanding; and let us regard it as needful to act thus, just because of the words of the apostle, "I could not speak unto you as unto spiritual, but as unto carnal." For even this very statement of his, that he knew nothing among them but Jesus Christ and Him crucified, he could not speak unto them as unto spiritual, but as unto carnal; because even that they were not able to receive as spiritual. But all who were spiritual among them received with spiritual understanding the very same truths which the others only heard as carnal; and in this way may we understand the words, "I could not speak unto you as unto spiritual, but as unto carnal," as if he said, What I did speak, ye could not receive as spiritual, but as carnal. For "the natural man"-that is, the man whose wisdom is of a mere human kind, and is called natural [literally, soulish] from the soul, and carnal from the flesh, because the complete man consists of soul and flesh-"perceiveth not the things of the Spirit of God;" that is, the measure of grace bestowed on believers by the cross of Christ, and thinks that all that is effected by that cross is to provide us with an example for our imitation in contending even to death for the truth. For if men of this type, who have no desire to be aught else than men, knew how it is that Christ crucified is "made of God unto us wisdom, and righteousness, and sanctification, and redemption, that, according as it is written, He that glorieth, let him glory in the Lord." they would doubtless no longer glory in man, nor say in a carnal spirit, "I am of Paul, and I of Apollos, and I of Cephas;" but in a spiritual way, "I am of Christ."
'''
