[[commentary]]
quote='''
(Tract. xlix. 12) Of the four days many things may be said. They refer to one thing, but one thing viewed in different ways. There is one day of death which the law of our birth brings upon us. Men transgress the natural law, and this is another day of death. The written law is given to men by the hands of Moses, and that is despised—a third day of death. The Gospel comes, and men transgress it—a fourth day of death. But Christ doth not disdain to awaken even these.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(lib. lxxxiii. Quæst. q. 65) Or we may take Lazarus in the grave as the soul laden with earthly sins.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Nevertheless, let us go unto him. Then said Thomas, who is called Didymus, unto his fellow disciples, Let us also go, that we may die with Him. Therefore Jesus came, and found that he had [lain] in the grave four days already." Much might be said of the four days, according to the wont of the obscure passages of Scripture, which bear as many senses as there is diversity of those who understand them. Let us express also our opinion of what is meant by one four days dead. For as in the former case of the.. blind man we understand in a way the human race, so in the case of this dead man many perhaps are also to be understood; for one thing may be signified by different figures. When a man is born, he is born already in a state of death; for he inherits sin from Adam. Hence the apostle says: "By one man sin entered into the world, and death by sin; and so that passed upon all men, wherein all have sinned." Here you have one day of death because man inherits it from the seed stock of death. Thereafter he grows, and begins to approach the years of reason that he may know the law of nature, which every one has had implanted in his heart: What thou wouldst not have done to thyself, do not to another. Is this learned from the pages of a book, and not in a measure legible in our very nature? Hast thou any desire to be robbed? Certainly not. See here, then, the law in thy heart: What thou art unwilling to suffer, be unwilling to do. This law also is transgressed by men; and here, then, we have the second day of death. The law was also divinely given through Moses, the servant of God; and therein it is said," Thou shalt not kill; thou shalt not commit adultery; thou shalt not bear false witness; honor thy father and mother; thou shalt not covet thy neighbor's property; thou shalt not covet thy neighbor's wife." Here you have the written law, and it also is despised: this is the third day of death. What remains? The gospel also comes, the kingdom of heaven is preached, Christ is everywhere published; He threatens hell, He promises eternal life; and that also is despised. Men transgress the gospel; and this is the fourth day of death. Now he deservedly stinketh. But is mercy to be denied to such? God forbid; for to raise such also from the dead, the Lord thinks it not unfitting to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
