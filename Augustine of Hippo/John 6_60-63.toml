[[commentary]]
quote='''
But doth the flesh give life? Our Lord Himself, when He was speaking in praise of this same earth, said, “It is the Spirit that quickeneth, the flesh profiteth nothing.”…But when our Lord praised it, He was speaking of His own flesh, and He had said, “Except a man eat My flesh, he shall have no life in him.” Some disciples of His, about seventy, were offended, and said, “This is an hard saying, who can hear it?” And they went back, and walked no more with Him. It seemed unto them hard that He said, “Except ye eat the flesh of the Son of Man, ye have no life in you:” they received it foolishly, they thought of it carnally, and imagined that the Lord would cut off parts from His body, and give unto them; and they said, “This is a hard saying.” It was they who were hard, not the saying; for unless they had been hard, and not meek, they would have said unto themselves, He saith not this without reason, but there must be some latent mystery herein. They would have remained with Him, softened, not hard: and would have learnt that from Him which they who remained, when the others departed, learnt. For when twelve disciples had remained with Him, on their departure, these remaining followers suggested to Him, as if in grief for the death of the former, that they were offended by His words, and turned back. But He instructed them, and saith unto them, “It is the Spirit that quickeneth, but the flesh profiteth nothing; the words that I have spoken unto you, they are spirit, and they are life.” Understand spiritually what I have said; ye are not to eat this body which ye see; nor to drink that blood which they who will crucify Me shall pour forth. I have commended unto you a certain mystery; spiritually understood, it will quicken. Although it is needful that this be visibly celebrated, yet it must be spiritually understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
