[[commentary]]
quote='''
“Make Thy ways, O Lord, known to me, and teach me Thy paths” (ver. 4): not those which are broad, and lead the many to destruction; but Thy paths, narrow, and known to few, teach Thou me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
