[[commentary]]
quote='''
Yet listen to one passage that occurs to me meanwhile. When father Abraham sent his servant to seek a wife for his son Isaac, he bound him by this oath, to fulfill faithfully what he was commanded, and know also for himself what to do. For it was a great matter that was in hand when marriage was sought for Abraham's seed. But that the servant might apprehend what Abraham knew, that it was not offspring after the flesh he desired, nor anything of a carnal kind concerning his race that was referred to, he said to the servant whom he sent, "Put thy hand under my thigh, and swear by the God of heaven. What connection has the God of heaven with Abraham's thigh? Already you understand the mystery: by thigh is meant race. And what was that swearing, but the signifying that of Abraham's race would the God of heaven come in the flesh? Fools find fault with Abraham because he said, Put thy hand under my thigh. Those who find fault with Christ's flesh find fault with Abraham's conduct. But let us, brethren, if we acknowledge the flesh of Christ as worthy of veneration, despise not that thigh, but receive it as spoken of prophetically. For a prophet also was Abraham. Whose prophet? Of his own seed, and of his Lord. To his own seed he pointed in saying, "Put thy hand under my thigh." To his Lord he pointed in adding, "and swear by the God of heaven."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"
