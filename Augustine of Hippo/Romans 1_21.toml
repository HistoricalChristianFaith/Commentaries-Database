[[commentary]]
quote='''
Surely that darkening of the heart was already a penalty and punishment, and by that penalty, that is by the blinding of the heart because of the abandonment by the light of wisdom, they fell into more and more serious sins.
'''
source_url=''
source_title="ON NATURE AND GRACE 22.24"

[[commentary]]
quote='''
When he says: Knowing God, they did not glorify him as God or give thanks, this is the head of sin, of which it is said: The beginning of all sin is pride. For had they given thanks to God, who had given this wisdom, they would not have attributed anything to themselves by their own thoughts. Wherefore they were given over by the Lord into the desires of their heart, to do the things that were not fitting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
