[[commentary]]
quote='''
Haply say the wicked, I securely do evil, because the Eyes of the Lord are not upon me: God attendeth to the righteous, me He seeth not, and whatever I do, I do securely. Immediately added the Holy Spirit, seeing the thoughts of men, and said, “But the Face of the Lord is against them that do evil; to cut off the remembrance of them from the earth” (ver. 16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
