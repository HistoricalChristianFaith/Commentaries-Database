[[commentary]]
quote='''
(de Civ. Dei, xx. 5.) Thus our flesh will be regenerated by incorruption, as our soul also shall be regenerated by faith.

(ubi sup.) From this passage we learn that Jesus will judge with His disciples; whence He says in another place to the Jews, Therefore shall they be your judges. (Mat. 12:27.) And whereas He says they shall sit upon twelve thrones, we need not think that twelve persons only shall judge with Him. For by the number twelve is signified the whole number of those that shall judge; and that because the number seven which generally represents completeness contains the two numbers four and three, which multiplied together make twelve. For if it were not so, as Matthias was elected into the place of the traitor Judas, the Apostle Paul who laboured more than they all should not have place to sit to judge; but he shows that he with the rest of the saints pertains to the number of judges, when he says, Know ye not that we shall judge Angels? (1 Cor. 6:3.)

(Serm. 351. 8.) In the number of judges therefore are included all that have left their all and followed the Lord;

(de Civ. Dei, xx. 5.) The same holds good, by reason of this number twelve, of those that are to be judged. For when it is said, Judging the twelve tribes, yet is not the tribe of Levi, which is the thirteenth, to be exempt from being judged by them; nor shall they judge this nation alone, and not also other nations.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But I see what is next required of us; in like manner as in the case of the five virgins, a reason was given why many should belong to five, and why to those five many Jews, and why to a hundred and fifty-three many perfect—to show why and how to the twelve thrones not twelve men, but many belong. What mean the twelve thrones, which signify all men everywhere that have been enabled to be so perfect as they must be perfect, to whom it is said, “Ye shall sit over the twelve tribes of Israel”? And why do all men everywhere belong to the number twelve? Because the very “everywhere” which we say, we say of the whole world: but the compass of lands is contained in four particular quarters, East, West, South, and North: from all these quarters they being called in the Trinity and made perfect in the faith and precept of the Trinity,—seeing that three times four are twelve, ye perceive wherefore the saints belong to the whole world; they that shall sit upon twelve thrones to judge the twelve tribes of Israel, since the twelve tribes of Israel, also, are the twelve tribes of the whole of Israel. For like as they that are to judge are from the whole world, so also they that are to be judged are from the whole world. The Apostle Paul of himself, when he was reproving believing laymen, because they referred not their causes to the Church, but dragged them with whom they had matters before the public, said, “Know ye not that we shall judge Angels?” See after what sort He hath made Himself judge: not only himself, but also all that judge aright in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
There is a deep mystery in this number of twelve: “Ye shall sit,” says our Saviour, “on twelve thrones, judging the twelve tribes of Israel.” If there are twelve thrones there, there will be no room for the judgment-seat of Paul, the thirteenth Apostle, though he says that he shall judge not men only, but even Angels; which, but the fallen Angels? “Know ye not, that we shall judge Angels,” he writes. The world would answer, Why dost thou boast that thou shalt be a judge? Where will be thy throne? Our Lord spoke of twelve thrones for the twelve Apostles: one, Judas, fell, and his place being supplied by Matthias, the number of twelve thrones was made up: first, then, discover room for thy judgment-seat; then threaten that thou wilt judge. Let us, therefore, reflect upon the meaning of the twelve thrones. The expression is typical of a sort of universality, as the Church was destined to prevail throughout the whole world: whence this edifice is styled a building together into Christ: and because judges come from all quarters, the twelve thrones are spoken of, just as the twelve gates, from the entering in from all sides into that city. Not only therefore have those twelve, and the Apostle Paul, a claim to the twelve thrones, but, from the universal signification, all who are to sit in judgment: in the same manner as all who enter the city, enter by one or the other of the twelve gates. There are four quarters of the globe: East, West, North, and South: and they are constantly alluded to in the Scriptures. From all those four winds; our Lord declares in the Gospel that He will call his sheep “from the four winds;” therefore from all those four winds is the Church called. And how called? On every side it is called in the Trinity: no otherwise is it called than by Baptism in the name of the Father, the Son, and the Holy Ghost: four then being thrice taken, twelve are found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"

[[commentary]]
quote='''
“For there were seated seats for judgment” (ver. 5). This is a wonderful riddle, a wonderful question, if it be not understood. He calleth those seats, which the Greeks call thrones. The Greeks call chairs thrones, as a term of honour. Therefore, my brethren, it is not wonderful if even we should sit on seats, or chairs; but that these seats themselves should sit, when shall we be able to understand this? As if some one should say: let stools or chairs sit here. We sit on chairs, we sit on seats, we sit on stools; the seats themselves sit not. What then meaneth this, “For there were seated seats for judgment”?…If therefore heaven be the seat of God, and the Apostles are heaven; they themselves are become the seat of God, the throne of God. It is said in another passage: “The soul of the righteous is the throne of wisdom.” A great truth, a great truth, is declared; the throne of wisdom is the soul of the righteous; that is, wisdom sitteth in the soul of the righteous as it were in her chair, in her throne, and thence judgeth whatsoever she judgeth. There were therefore thrones of wisdom, and therefore the Lord said unto them, “Ye shall sit upon twelve thrones, judging the twelve tribes of Israel.” So they also shall sit upon twelve seats, and they are themselves the seats of God; for of them it is said, “For there were seated seats.” Who sat? “Seats.” And who are the seats? They of whom it is said, “The soul of the righteous is the seat of wisdom.” Who are the seats? The heavens. Who are the heavens? Heaven. What is heaven? That of which the Lord saith, “Heaven is My seat.” The righteous then themselves are the seats; and have seats; and seats shall be seated in that Jerusalem. For what purpose? “For judgment.” Ye shall sit, He saith, on twelve thrones, O ye thrones, judging the twelve tribes of Israel. Judging whom? Those who are below on earth. Who will judge? They who have become heaven. But they who shall be judged, will be divided into two bodies: one will be on the right hand, the other on the left…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
