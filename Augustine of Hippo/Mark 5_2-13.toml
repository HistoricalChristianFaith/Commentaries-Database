[[commentary]]
quote='''
Moreover, with respect to the circumstance that Matthew states that there were two men who were afflicted with the legion of devils which received permission to go into the swine, whereas Mark and Luke instance only a single individual, we may suppose that one of these parties was a person of some kind of superior notability and repute, whose case was particularly lamented by that district, and for whose deliverance there was special anxiety. With the intention of indicating that fact, two of the evangelists have judged it proper to make mention only of the one person, in connection with whom the fame of this deed had been spread abroad the more extensively and remarkably. Neither should any scruple be excited by the different forms in which the words uttered by the possessed have been reproduced by the various evangelists. For we may either resolve them all into one and the same thing, or suppose them all to have been actually spoken. Nor, again, should we find any difficulty in the circumstance that with Matthew the address is couched in the plural number, but with Mark and Luke in the singular. For these latter two tell us at the same time, that when the man was asked what was his name, he answered that he was Legion, because the devils were many. Nor, once more, is there any discrepancy between Mark's statement that the herd of swine was round about the mountain, and Luke's, that they were on the mountain. For the herd of swine was so great that one portion of it might be on the mountain, and another only round about it. For, as Mark has expressly informed us, there were about two thousand swine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 24"
