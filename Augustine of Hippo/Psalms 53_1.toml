[[commentary]]
quote='''
Of this Psalm we undertake to treat with you, as far as the Lord supplieth us. A brother biddeth us that we may have the will, and prayeth that we may have the power. If anything in haste perchance I shall have passed over, He that even to us deigneth to give what we shall be enabled to say, will supply it in you. The title of it is: “At the end, for Maeleth, understanding to David himself.” “For Maeleth,” as we find in interpretations of Hebrew names, seemeth to say, For one travailing, or in pain. But who there is in this world that travaileth and is in pain, the faithful acknowledge, because thereof they are. Christ here travaileth, Christ here is in pain: the Head is above, the members below. For one not travailing nor in pain would not say, “Saul, Saul, why persecutest thou me?” Him, with whom when persecuting He was travailing, being converted, He made to travail. For he also was himself afterwards enlightened, and grafted on those members which he used to persecute; being pregnant with the same love, he said, “My little children, of whom again I travail, until Christ be formed in you.” For the members therefore of Christ, for His Body which is the Church, for that same One Man, that is, for that very unity, whereof the Head is above, this Psalm is sung.…Who are they, then, amid whom we travail and groan, if in the Body of Christ we are, if under Him, the Head, we live, if amongst His members we are counted? Who they are, hear ye.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"

[[commentary]]
quote='''
“The unwise man hath said in his heart, There is no God” (ver. 1). Such sort is it of men amid whom is pained and groaneth the Body of Christ. If such is this sort of men, of not many do we travail; as far as seemeth to occur to our thoughts, very few there are; and a difficult thing it is to meet with a man that saith in his heart, “There is no God;” nevertheless, so few there are, that, fearing amid the many to say this, in their heart they say it, for that with mouth to say it they dare not. Not much then is that which we are bid to endure, hardly is it found: uncommon is that sort of men that say in their heart, “There is no God.” But, if it be examined in another sense, is not that found to be in more men, which we supposed to be in men few and uncommon, and almost in none? Let them come forth into the midst that live evil lives, let us look into the doings of profligate, daring, and wicked men, of whom there is a great multitude; who foster day by day their sins, who, their acts having been changed into habit, have even lost sense of shame: this is so great a multitude of men, that the Body of Christ, set amid them, scarce dareth to censure that which it is not constrained to commit, and deemeth it a great matter for itself that the integrity of innocence be preserved in not doing that which now, by habit, either it doth not dare to blame, or if it shall have dared, there breaketh out the censure and recrimination of them that live evil lives, more readily than the free voice of them that live good lives. And those men are such as say in their heart, “There is no God.” Such men I am confuting. Whence confuting? That their doings please God, they judge. He doth not therefore affirm, “some say,” but “The unwise man hath said in his heart, There is no God.” Which men do so far believe there is a God, that the same God they judge with what they do to be pleased. But if thou being wise dost perceive, how “the unwise man hath said in his heart, There is no God,” if thou give heed, if thou understand, if thou examine; he that thinketh that evil doings please God, Him he doth not think to be God. For if God is, He is just; if He is just, injustice displeaseth Him, iniquity displeaseth. But thou, when thou thinkest that iniquity pleaseth Him, dost deny God. For if God is one Whom iniquity displeaseth, but God seemeth not to thee to be one whom iniquity displeaseth, and there is no God but one whom iniquity displeaseth, then when thou sayest in thy heart, God doth countenance my iniquities, thou sayest nothing else than, “There is no God.”

Let us advert also to that sense, which concerning Christ our Lord Himself, our Head Himself, doth present itself. For when Himself in form of a servant appeared on earth, they that crucified Him said, “He is not God.” Because Son of God He was, truly God He was. But they that are corrupted and have become abominable said what? “He is not God:” let us slay Him, “He is not God.” Thou hast the voice of these very men in the book of Wisdom. For after there had gone before the verse, “The unwise man hath said in his heart, There is no God;” as if reasons were required why the unwise man could say this, he hath subjoined, “Corrupted they are, and abominable have become in their iniquities” (ver. 2). Hear ye those corrupted men. “For they have said with themselves, not rightly thinking:” corruption beginneth with evil belief, thence it proceedeth to depraved morals, thence to the most flagrant iniquities, these are the grades. But what with themselves said they, thinking not rightly? “A small thing and with tediousness is our life.” From this evil belief followeth that which also the Apostle hath spoken of, “Let us eat and drink, for to-morrow we shall die.” But in the former passage more diffusely luxury itself is described: “Let us crown us with roses, before they be withered; in every place let us leave the tokens of our gladness.” After the more diffuse description of that luxury, what followeth? “Let us slay the poor just man:” this is therefore saying, “He is not God.” Soft words they seemed but now to say: “Let us crown us with roses, before they be withered.” What more delicate, what more soft? Wouldest thou expect, out of this softness, Crosses, swords? Wonder not, soft are even the roots of brambles; if any one handle them, he is not pricked: but that wherewith thou shalt be pricked from thence hath birth. “Corrupted,” therefore, are those men, “and abominable have become in their iniquities.” They say, “If Son of God He is, let Him come down from the Cross.” Behold them openly saying, “He is not God.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
