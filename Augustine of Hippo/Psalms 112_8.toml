[[commentary]]
quote='''
Nor is he broken down by any temptations: “His heart is established, and will not shrink, until he see beyond his enemies” (ver. 8). His enemies wished to see good things here, and when invisible blessings were promised them, used to say, “Who will show us any good?” Let our heart therefore be established, and shrink not, until we see beyond our enemies. For they wish to see good things of men in the land of the dying; we trust to see the good things of the Lord in the land of the living.

But it is a great thing to have the heart established, and not to be moved, while they rejoice who love what they see, and mock at him who hopeth for what he seeth not; “what the Lord hath prepared for them that love Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
