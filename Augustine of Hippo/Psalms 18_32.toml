[[commentary]]
quote='''
“God, who hath girded me with strength” (ver. 32). God, who hath girded me that I might be strong, lest the loosely flowing folds of desire hinder my deeds and steps. “And hath made my way undefiled.” And hath made the way of love, whereby I may come to Him, undefiled, as the way of faith is undefiled, whereby He comes to me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
