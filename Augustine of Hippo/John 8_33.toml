[[commentary]]
quote='''
(Tr. xli. 2) Or it was not those who believed, but the unbelieving multitude that made this answer. But how could they say with truth, taking only secular bondage into account, that we have never been in bondage to any man? Was not Joseph sold? were not the holy prophets carried into captivity? Ungrateful people! Why does God remind you so continually of His having taken you out of the house of bondage if you never were in bondage? Why do you who are now talking, pay tribute to the Romans, if you never were in bondage?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In short, the Jews also so understood and "answered Him;" not those who had already believed, but those in that crowd who were not yet believers. "They answered Him, We are Abraham's seed, and were never in bondage to any man: how sayest thou, Ye shall be free?" But the Lord had not said, "Ye shall be free," but, "The truth shall make you free." That word, however, they, because, as I have said, it is clearly so in the Greek, understood as pointing only to freedom, and puffed themselves up as Abraham's seed, and said, "We are Abraham's seed, and were never in bondage to any man: how sayest thou, Ye shall be free?" O inflated skin! such is not magnanimity, but windy swelling. For even as regards freedom in this life, how was that the truth when you said, "We were never in bondage to any man"? Was not Joseph sold? Were not the holy prophets led into captivity? And again, did not that very nation, when making bricks in Egypt, also serve hard rulers, not only in gold and silver, but also in clay? If you were never in bondage to any man, ungrateful people, why is it that God is continually reminding you that He delivered you from the house of bondage? Or mean you, perchance, that your fathers were in bondage, but you who speak were never in bondage to any man? How then were you now paying tribute to the Romans, out of which also you formed a trap for the Truth Himself, as if to ensnare Him, when you said, "Is it lawful to give tribute to Caesar?" in order that, had He said, It is lawful, you might fasten on Him as one ill-disposed to the liberty of Abraham's seed; and if He said, It is not lawful, you might slander Him before the kings of the earth, as forbidding the payment of tribute to such? Deservedly were you defeated on producing the money, and compelled yourselves to concur in your own capture. For there it was told you, "Render to Caesar the things that are Caesar's, and to God the things that are God's," after your own reply, that the money-piece bore the image of Caesar. For as Caesar looks for his own image on the coin, so God looks for His in man. Thus, then, did He answer the Jews. I am moved, brethren, by the hollow pride of men, because even of that very freedom of theirs, which they understood carnally, they lied when they said, "We were never in bondage to any man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
