[[commentary]]
quote='''
But after that they had bound Jesus, it then appears most clearly that Judas had betrayed Him not for a good, but a most wicked purpose: And led Him away to Annas first.

(Tr. cxiii) Why they did so, he tells us immediately after: For he was father in law to Caiaphas, which was the high priest that same year. Matthew, in order to shorten the narrative, says that He was led to Caiaphas; because He was led to Annas first, as being the father in law of Caiaphas. So that we must understand that Annas wished to act Caiaphas's part.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"
