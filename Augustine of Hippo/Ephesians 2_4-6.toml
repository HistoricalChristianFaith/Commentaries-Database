[[commentary]]
quote='''
He promised, therefore, that we should be in heaven; for thither the servant-form, which He received of the Virgin, has been elevated, and set at the right hand of the Father. Because of the same blessed hope the apostle also says: "But God, who is rich in mercy, for His great love wherewith He loved us, even when we were dead in sins, hath quickened us together with Christ; by whose grace we are saved; and hath raised us up together, and made us sit together in heavenly places in Christ Jesus." And so accordingly we may understand the Lord to have said, "That where I am, there they may be also." He, indeed, said of Himself that He was there already; but of us He merely declared that He wished us to be there with Him, without any indication that we were there already But what the Lord said that He wished to be done, the apostle spake of as already accomplished. For he said not, He will yet raise us up, and make us sit in heavenly places; but, "hath raised us up, and made us sit in heavenly places:" for it is not without good grounds, but in believing assurance, that he reckons as already done what he is certain will yet be done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520111.html'
source_title="Tractates on John 111"
