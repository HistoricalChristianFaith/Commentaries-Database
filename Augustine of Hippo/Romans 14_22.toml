[[commentary]]
quote='''
When he says: Blessed is he who does not judge himself in that which he approves, this is best referred to what he said above: Let not our good, then, be blasphemed. For this is also what he now says before that statement: The faith which you have, keep to yourself before God—so that, since this faith is good, by which we believe that all things are clean to the clean, and in that faith we approve ourselves, we may use our good well; lest perhaps, when we have abused that good to the stumbling of weak brethren, we sin against the brethren and judge ourselves in that very good, when we scandalize the weak, in which good we approve ourselves, when that faith pleases us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
