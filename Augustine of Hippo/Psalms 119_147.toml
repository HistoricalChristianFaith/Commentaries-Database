[[commentary]]
quote='''
“I have prevented in midnight,” he saith, “and have cried: In Thy words have I trusted” (ver. 147). If we refer this to each of the faithful, and to the literal character of the act; it oft happeneth that the love of God is awake in that hour of the night, and, the love of prayer strongly urging us, the time of prayer, which is wont to be after the crowing of the cock, is not awaited, but prevented. But if we understand night of the whole of this world’s duration; we indeed cry unto God at midnight, and prevent the fulness of time in which He will restore us what He hath promised, as is elsewhere read, “Let us prevent His presence with confession.” Although if we choose to understand the unripe season of this night, before the fulness of time had come, that is, the ripe season when Christ should be manifested in the flesh; neither was the Church then silent, but preventing this fulness of time, in prophecy cried out, and trusted in the words of God, who was able to do what He promised, that in the seed of Abraham all nations should be blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
