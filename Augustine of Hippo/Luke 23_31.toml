[[commentary]]
quote='''
There is planted the Church of Christ, whence were rooted out the thorns of the synagogue. For truly this fire blazed “as the fire of thorns.” But the Lord was as a green tree. This said Himself, when certain women mourned Christ as dying.…“For if they do these things in a green tree, what shall be done in a dry?” When can a green tree be consumed by the fire of thorns? For they blazed as fire among thorns. Fire consumeth thorns, but whatsoever green tree it is applied to, is not easily kindled.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"
