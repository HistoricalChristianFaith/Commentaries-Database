[[commentary]]
quote='''
(de cons. Ev. l. ii. c. 38.) That Luke speaks of the finger of God, where Matthew has said, the Spirit, does not take away from their agreement in sense, but it rather teaches us a lesson, that we may know what meaning to give to the finger of God, whenever we read it in the Scriptures.

(de Quæst. Ev. l. ii. qu. 17.) Now the Holy Spirit is called the finger of God, because of the distribution of gifts which are given through Him, to every one his own gift, whether he be of men or angels. For in none of our members is division more apparent than in our fingers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What the finger of God is, the Gospel explaineth to us; for the finger of God is the Holy Ghost. How do we prove this? Our Lord, when answering those who accused Him of casting out devils in the name of Beelzebub, saith, “If I cast out devils by the Spirit of God;” and another Evangelist, in relating the same saying, saith, “If I with the finger of God cast out devils.” What therefore is in one stated clearly, is darkly expressed in another. Thou didst not know what was the finger of God, but another Evangelist explains it by terming it the Spirit of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
