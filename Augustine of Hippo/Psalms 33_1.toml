[[commentary]]
quote='''
“Rejoice in the Lord, O ye righteous:” rejoice, O ye righteous, not in yourselves, for that is not safe; but in the Lord. “For praise is comely to the upright” (ver. 1): these praise the Lord, who submit themselves unto the Lord; for else they are distorted and perverse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
