[[commentary]]
quote='''
Choose for thyself Him, who will neither sleep nor slumber, and thy foot shall not be moved. God is never asleep: if thou dost wish to have a keeper who never sleepeth, choose God for thy keeper. “Suffer not my feet to be moved,” thou sayest: well, very well: but He also saith unto thee, “Let not him that keepeth thee slumber.” Thou perhaps wast about to turn thyself unto men as thy keepers, and to say, whom shall I find who will not sleep? what man will not slumber? whom do I find? whither shall I go? whither shall I return? The Psalmist telleth thee: “He that keepeth Israel, shall neither slumber nor sleep” (ver. 4). Dost thou wish to have a keeper who neither slumbereth nor sleepeth? Behold, “He that keepeth Israel shall neither slumber nor sleep:” for Christ keepeth Israel. Be thou then Israel. What meaneth Israel? It is interpreted, Seeing God. And how is God seen? First by faith: afterwards by sight. If thou canst not as yet see Him by sight, see Him by faith…Who is there, who will neither slumber nor sleep? when thou seekest among men, thou art deceived; thou wilt never find one. Trust not then in any man: every man slumbereth, and will sleep. When doth he slumber? When he beareth the flesh of weakness. When will he sleep? When he is dead. Trust not then in man. A mortal may slumber, he sleepeth in death. Seek not a keeper among men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520121.html'
source_title="Exposition on Psalm 121"
