[[commentary]]
quote='''
For they being happy in those things which they see, exult in drink, in wantonness, in chamberings, in covetousness, in riches, in robberies, in secular dignities, in the whitening of a mud wall, in these things they exult: but I walk in a different way, contemning those things which are present, and fearing even the prosperous things of the world, and secure in no other thing but the promises of God. And they, “Let us eat and drink, for to-morrow we die.” What sayest thou? Repeat it: “let us eat,” he saith, “and drink.” Come now, what hast thou said afterwards? “for to-morrow we die.” Thou hast terrified, not led me astray. Certainly by the very thing which thou hast said afterwards, thou hast stricken me with fear to consent with thee. “For to-morrow we die,” thou hast said: and there hath preceded, “Let us eat and drink.” For when thou hadst said, “Let us eat and drink;” thou didst add, “for to-morrow we die.” Hear the other side from me, “Yea let us fast and pray, ‘for to-morrow we die.’”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
