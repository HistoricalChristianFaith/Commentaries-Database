[[commentary]]
quote='''
What then, when the sun went down, when our Lord suffered? There was a sort of darkness with the Apostles, hope failed, in those to whom He at first seemed great, and the Redeemer of all men. How so? “Thou didst make darkness, and it became night; wherein all the beasts of the forest shall move” (ver. 20).…Here the beasts of the forest are used in different ways: for these things are always understood in varying senses; as our Lord Himself is at one time termed a lion, at another a lamb. What is so different as a lion and a lamb? But what sort of lamb? One that could overcome the wolf, overcome the lion. He is the Rock, He the Shepherd, He the Gate. The Shepherd entereth by the gate: and He saith, “I am the good Shepherd:” and, “I am the Door of the Sheep.”…Learn thus to understand, when these things are spoken figuratively; lest perchance when ye have read that the Rock signifieth Christ, ye may understand it to mean Him in every passage. In one place it meaneth one thing, another in another, just as we can only understand the meaning of a letter by seeing its position.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
