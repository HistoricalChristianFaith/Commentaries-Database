[[commentary]]
quote='''
Certainly where we read the following words, “I have longed for Thy salvation, O Lord” (ver. 174): even if all our foes be reluctant, let Christ the Salvation of God occur to us: the righteous men of old confess that they longed for Him, the Church longed for His destined coming from His mother’s womb, the Church longeth for His coming at His Father’s right hand. Subjoined to this sentence are the words, “And Thy law is my meditation:” for the Law giveth testimony unto Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
