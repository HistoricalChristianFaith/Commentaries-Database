[[commentary]]
quote='''
A new god is either a stone or a phantom. He is not, saith one, a stone; I have a silver and a gold one. Justly did he choose to name the very costly things, who said, “The idols of the nations are silver and gold.” Great are they, because they are of gold and silver; costly they are, shining they are; but yet, “Eyes they have, and see not!” New are these gods. What newer than a god out of a workshop? Yea, though those now old ones spiders’ webs have covered over, they that are not eternal are new.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"


[[commentary]]
quote='''
But they seem to themselves to have a purer religion, who say, I neither worship an idol, nor a devil; but in the bodily image I behold an emblem of that which I am bound to worship.…They presume to reply, that they worship not the bodies themselves, but the deities which preside over the government of them. One sentence of the Apostle, therefore, testifieth to their punishment and condemnation; “Who,” he saith, “have changed the truth of God into a lie, and worshipped and served the creature more than the Creator, who is blessed for ever.” For in the former part of this sentence he condemned idols; in the latter, the account they give of their idols: for by designating images wrought by an artificer by the names of the works of God’s creation, they change the truth of God into a lie; while, by considering these works themselves as deities, and worshipping them as such, they serve the creature more than the Creator, who is blessed for ever.…

But, it will be said, we also have very many instruments and vessels made of materials or metal of this description for the purpose of celebrating the Sacraments, which being consecrated by these ministrations are called holy, in honour of Him who is thus worshipped for our salvation: and what indeed are these very instruments or vessels, but the work of men’s hands? But have they mouth, and yet speak not? have they eyes, and see not? do we pray unto them, because through them we pray to God? This is the chief cause of this insane profanity, that the figure resembling the living person, which induces men to worship it, hath more influence in the minds of these miserable persons, than the evident fact that it is not living, so that it ought to be despised by the living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520115.html'
source_title="Exposition on Psalm 115"
