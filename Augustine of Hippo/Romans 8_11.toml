[[commentary]]
quote='''
This is a very explicit witness to the resurrection of the body, and it is sufficiently clear that as long as we are in this life there will be no lack of both the annoyances occasioned by the mortal flesh and some excitations arising from carnal pleasures. For although he who is established under grace serves the law of God with his mind and does not yield, nevertheless, with the flesh he continues to serve the law of sin.
'''
source_url=''
source_title="QUESTIONS 66.7"

[[commentary]]
quote='''
When he says: If the Spirit of him who raised Jesus Christ from the dead dwells in you, he who raised Jesus Christ from the dead will also give life to your mortal bodies through his Spirit dwelling in you, he now shows the fourth of those four stages which we distinguished above. But this stage is not found in this life. For it pertains to the hope by which we await the redemption of our body, when this corruptible shall put on incorruption and this mortal shall put on immortality. There peace is perfect, because the soul suffers no troubles from the body, now made alive and transformed into a heavenly quality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
