[[commentary]]
quote='''
“As for those that troubled them, the waters overwhelmed them: there was not one of them left” (ver. 11); not of all the Egyptians, but of those who pursued the departing Israelites, desirous either of taking or of killing them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
