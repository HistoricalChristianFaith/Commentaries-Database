[[commentary]]
quote='''
(de con. Ev. l. ii. c. 70.) Matthew has omitted for brevity's sake what Luke has not, namely, that the parable was spoken not to the rulers only who asked concerning His authority, but also to the people.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"
[[commentary]]
quote='''
Matthew goes on thus: "But what think ye? A certain man had two sons; and he came to the first, and said, Son, go work to-day in my vineyard. But he answered and said, I will not; but afterward he repented, and went. And he came to the second, and said likewise. And he answered and said, I go, sir; and went not;" and so on, down to the words, "And whosoever shall fall upon this stone shall be broken; but on whomsoever it shall fall, it will grind him to powder." Mark and Luke do not mention the parable of the two sons to whom the order was given to go and labour in the vineyard. But what is narrated by Matthew subsequently to that,—namely, the parable of the vineyard which was let out to the husbandmen, who persecuted the servants that were sent to them, and afterwards put to death the beloved son, and thrust him out of the vineyard,—is not left unrecorded also by those two. And in detailing it they likewise both retain the same order, that is to say, they bring it in after that declaration of their inability to tell which was made by the Jews when interrogated regarding the baptism of John, and after the reply which He returned to them in these words: "Neither do I tell you by what authority I do these things."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 70"
