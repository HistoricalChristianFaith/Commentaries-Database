[[commentary]]
quote='''
“To the saints who are on His earth” (ver. 3): to the saints who have placed their hope in the land of the living, the citizens of the heavenly Jerusalem, whose spiritual conversation is, by the anchor of hope, fixed in that country, which is rightly called God’s earth; although as yet in this earth too they be conversant in the flesh. “He hath wonderfully fulfilled all My wishes in them.” To those saints then He hath wonderfully fulfilled all My wishes in their advancement, whereby they have perceived, how both the humanity of My divinity hath profited them that I might die, and the divinity of the humanity that I might rise again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
