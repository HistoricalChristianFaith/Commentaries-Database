[[commentary]]
quote='''
Messias, in Hebrew; Christ, in Greek; in Latin, Anointed. Χρῖσμα is anointing in Greek; Christ, therefore, is the Anointed. He is peculiarly anointed, pre-eminently anointed; wherewith all Christians are anointed, He is pre-eminently anointed. Hear how He speaks in the psalm: "Wherefore God, Thy God, hath anointed Thee with the oil of gladness above Thy fellows." For all the holy ones are His fellows, but He in a peculiar sense is the Holy of Holies, peculiarly anointed, peculiarly Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
