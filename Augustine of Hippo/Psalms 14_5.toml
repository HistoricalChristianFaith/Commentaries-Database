[[commentary]]
quote='''
“There they trembled for fear, where no fear was” (ver. 5): that is, for the loss of things temporal. For they said, “If we let Him thus alone, all men will believe on Him; and the Romans will come, and take away both our place and nation.” They feared to lose an earthly kingdom, where no fear was; and they lost the kingdom of heaven, which they ought to have feared. And this must be understood of all temporal goods, the loss of which when men fear, they come not to things eternal.

“For God is in the just generation.” It refers to what went before, so that the sense is, “shall not all they that work iniquity know that the Lord is in the just generation;” that is, He is not in them who love the world. For it is unjust to leave the Maker of the worlds, and “serve the creature more than the Creator.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252014.html'
source_title="Exposition on Psalm 14"
