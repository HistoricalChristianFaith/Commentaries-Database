[[commentary]]
quote='''
What is it, most beloved? ye who know yourselves to be Israelites according to Abraham’s seed, ye who are of the house of Jacob, heirs according to promise, know that even ye have gone forth from Egypt, since ye have renounced this world; that ye have gone forth from a foreign people, since by the confession of piety, ye have separated yourselves from the blasphemies of the Gentiles. For it is not your tongue, but a foreign one, which knoweth not how to praise God, to whom ye sing Allelujah. For “Judah” hath become “His sanctuary” in you; for “he is not a Jew which is one outwardly; neither is that circumcision, which is outward in the flesh; but he is a Jew which is one inwardly, and by circumcision of the heart.” Examine then your hearts, if faith hath circumcised them, if confession hath cleansed them; in you “Judah” hath become “His sanctuary,” in you “Israel” hath become “His dominion.” For “He gave” unto you “the power to become the sons of God.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
