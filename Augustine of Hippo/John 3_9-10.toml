
[[commentary]]
quote='''
"Nicodemus answered and said unto Him, How can these things be?" And, in fact, in the carnal sense, he knew not how. In him occurred what the Lord had said; the Spirit's voice he heard, but knew not whence it came, and whither it was going. "Jesus answered and said unto him, Art thou a master in Israel, and knowest not these things?" Oh, brethren! What do we think that the Lord meant to taunt scornfully this master of the Jews? The Lord knew what He was doing; He wished the man to be born of the Spirit. No man is born of the Spirit if he be not humble, for humility itself makes us to be born of the Spirit; "for the Lord is nigh to them that are of broken heart." The man was puffed up with his mastership, and it appeared of some importance to himself that he was a teacher of the Jews. Jesus pulled down his pride, that he might be born of the Spirit: He taunted him as an unlearned man; not that the Lord wished to appear his superior. What comparison can there be, God compared to man, truth to falsehood? Christ greater than Nicodemus! Ought this to be said, can it be said, is it to be thought? If it were said, "Christ is greater than angels," it were ridiculous: for incomparably greater than every creature is He by whom every creature was made. But yet He rallies the man on his pride: "Art thou a master in Israel, and knowest not these things?" As if He said, Behold, thou knowest nothing, thou art a proud chief; be thou born of the Spirit: for if thou be born of the Spirit, thou wilt keep the ways of God, so as to follow Christ's humility. So, indeed, is He high above all angels, that, "being in the form of God, He thought it not robbery to be equal with God, but emptied Himself, taking upon Him the form of a servant, being made into the likeness of men, and found in fashion as a man: He humbled Himself, being made: obedient unto death" (and lest any kind of death should please thee), "even the death of the cross." He hung on the cross, and they scoffed at Him. He could have come down from the cross; but He deferred, that He might rise again from the tomb. He, the Lord, bore with proud slaves; the physician with the sick. If He did this, how ought they to act whom it behoves to be born of the Spirit!-if He did this, He who is the true Master in heaven, not of men only, but also of angels. For if the angels are learned, they are so by the Word of God. If they are learned by the Word of God, ask of what they are learned; and you shall find, "In the beginning was the Word, and the Word was with God, and the Word was God." The neck of man is done away with, only the hard and stiff neck, that it may be gentle to bear the yoke of Christ, of which it is said, "My yoke is easy, and my burden is light."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"
