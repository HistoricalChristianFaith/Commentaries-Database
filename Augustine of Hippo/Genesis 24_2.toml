[[commentary]]
quote='''
For, putting the hand under the thigh of a man and swearing by the God of heaven, what else did that signify except that in that flesh, which took its origin from that thigh, the God of heaven would come?Marriage therefore is a good in which the married are better in proportion as they fear God more chastely and more faithfully, especially if they also nourish spiritually the children whom they desire carnally.
'''
source_url='https://www.newadvent.org/fathers/1309.htm'
source_title="On the Good of Marriage 19"


[[commentary]]
quote='''
This surely was prophetic of the fact that the Lord God of heaven and the Lord of the earth would one day come in flesh fashioned from that thigh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252016.html'
source_title="City of God 16.33"

[[commentary]]
quote='''
What does he mean to express by the “thigh”? The flesh. Whence those words, “A prince shall not depart from Judah; and a lawgiver from his thighs”? Did not Abraham himself (to whom was promised the seed in which “all the nations of the earth were to be blessed”), when he sent his servant to seek and to bring home a wife for his son, being by faith fully persuaded, that in that, so to speak, contemptible seed was contained the great Name; that is, that the Son of God was to come of the seed of Abraham, out of all the children of men; did not he, I say, cause his servant to swear unto him in this manner, saying, “Put thy hand under my thigh,” and so swear; as if he had said, “Put thy hand on the altar, or on the Gospel, or on the Prophet, or on any holy thing.” “Put” (he says) “thy hand under my thigh;” having full confidence, not ashamed of it as unseemly, but understanding therein a truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"

[[commentary]]
quote='''
For what meaneth it, brethren (to mention but one thing), that Abraham sending his faithful servant to espouse a wife for his only son, maketh him swear to him, and in the oath saith to him, “Put thy hand under my thigh, and swear”? What was there in the thigh of Abraham, where he put his hand in swearing? What was there there, except that which even then was promised to him, “In thy seed shall be blessed all nations”? Under the name of thigh, flesh is signified. From the flesh of Abraham, through Isaac and Jacob, and not to mention many names, through Mary was our Lord Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
