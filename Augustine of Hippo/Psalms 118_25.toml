[[commentary]]
quote='''
“Save me now, O Lord: prosper Thou well my way, O Lord” (ver. 25). Because it is the day of Salvation, “save me:” because we, returning from a long pilgrimage, are separated from those who hated peace, with whom we were peaceful, and who, when we spoke to them, made war upon us without a cause; “prosper well our way” as we return, since Thou hast become our Way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
