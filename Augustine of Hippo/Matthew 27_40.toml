[[commentary]]
quote='''
Says one, If he had this power, why, when the Jews insulted him on the cross and said, "If he be the Son of God let him come down from the cross," did he not come down, to show them his power by coming down? Because He was teaching us patience, therefore He deferred the demonstration of His power. For if He came down, moved as it were at their words, He would be thought to have been overcome by the sting of their insults. He did not come down; there He remained fixed, to depart when He would. For what great matter was it for Him to descend from the cross, when He could rise again from the sepulchre?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252037.html'
source_title="Tractates on John 37"
