[[commentary]]
quote='''
“A king shall not be saved by much strength:” he shall not be saved who ruleth his own flesh, if he presume much upon his own strength. “Neither shall a giant be saved by much strength” (ver. 16): nor shall he be saved whoever warreth against the habit of his own lust, or against the devil and his angels, if he trust much to his own might.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
