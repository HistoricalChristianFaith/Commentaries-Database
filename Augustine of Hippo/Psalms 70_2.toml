[[commentary]]
quote='''
“Let them be confounded and fear that seek my soul.” Christ is speaking: whether Head speak or whether Body speak; He is speaking that hath said, “Why persecutest thou Me?” He is speaking that hath said, “Inasmuch as ye have done it to one of the least of Mine, to Me ye have done it.” The voice then of this Man is known to be of the whole man, of Head and of Body: that need not often be mentioned, because it is known. “Be they confounded,” he saith, “and fear that seek my soul.” In another Psalm He saith, “I was looking unto the right and saw, and there was not one that would know Me: flight hath perished from Me, and there is not one to seek out My soul.” There of persecutors He saith, that there was not one to seek out His soul: but here, “Let them be confounded and fear that seek My soul.”…And where is that which thou hast heard from thy Lord, “Love ye your enemies, do good to them that hate you, and pray for them that persecute you”? Behold thou sufferest persecution, and cursest them from whom thou sufferest: how dost thou imitate the Passions of thy Lord that have gone before, hanging on the cross and saying, “Father, forgive them, for they know not what they do.” To persons saying such things the Martyr replieth and saith, thou hast set before me the Lord, saying, “Father, forgive them, for they know not what they do:” understand thou my voice also, in order that it may be thine too: for what have I said concerning mine enemies? “Let them be confounded and fear.” Already such vengeance hath been taken on the enemies of the Martyrs. That Saul that persecuted Stephen, he was confounded and feared. He was breathing out slaughters, he was seeking some to drag and slay: a voice having been heard from above, “Saul, Saul, why persecutest thou Me,” he was confounded and laid low, and he was raised up to obedience, that had been inflamed unto persecuting. This then the Martyrs desire for their enemies, “Let them be confounded and fear.” For so long as they are not confounded and fear, they must needs defend their actions: glorious they think themselves, because they hold, because they bind, because they scourge, because they kill, because they dance, because they insult, and because of all these doings they be some time confounded and fear. For if they be confounded, they will also be converted: because converted they cannot be, unless they shall have been confounded and shall have feared. Let us then wish these things to our enemies, let us wish them without fear. Behold I have said, and let me have said it with you, may all that still dance and sing and insult the Martyrs “be confounded and fear:” at last within these walls confounded may they beat their breasts!

“Let them be turned away backward and blush that think evil things to me” (ver. 2). At first there was the assault of them persecuting, now there hath remained the malice of them thinking. In fact, there are in the Church distinct seasons of persecutions following one another. There was made an assault on the Church when kings were persecuting: and because kings had been foretold as to persecute and as to believe, when one had been fulfilled the other was to follow. There came to pass also that which was consequent; kings believed, peace was given to the Church, the Church began to be set in the highest place of dignity, even on this earth, even in this life: but there is not wanting the roar of persecutors, they have turned their assaults into thoughts. In these thoughts, as in a bottomless pit, the devil hath been bound, he roareth and breaketh not forth. For it hath been said concerning these times of the Church, “The sinner shall see, and shall be angry.” And shall do what? That which he did at first? Drag, bind, smite? He doeth not this. What then? “With his teeth he shall gnash, and shall pine away.” And with these men the Martyr is, as it were, angry, and yet for these men the Martyr prayeth. For in like manner as he hath wished well to those men concerning whom he hath said, “Let them be confounded and fear that seek my soul:” so also now, “Let them be turned backward, and blush, that think evil things to me.” Wherefore? In order that they may not go before, but follow. For he that censureth the Christian religion, and on his own system willeth to live, willeth as it were to go before Christ, as though He indeed had erred and had been weak and infirm, because He either willed to suffer or could suffer in the hands of the Jews; but that he is a clever man for guarding against all these things; in shunning death, even in basely lying to escape death, and slaying his soul that he may live in body, he thinketh himself a man of singular and prudent measures. He goeth before in censuring Christ, in a manner he outstrippeth Christ: let him believe in Christ, and follow Christ. For that which had been desired but now for persecutors thinking evil things, the same the Lord Himself said to Peter. Now in a certain place Peter willed to go before the Lord.…A little before, “Blessed art thou, Simon Bar-jona, for flesh and blood hath not revealed it to thee, but My Father which is in Heaven:” now in a moment, “Go back behind Me, Satan.” What is, “Go back behind Me”? Follow Me. Thou willest to go before Me, thou willest to give Me counsel, it is better that thou follow My counsel: this is, “go back,” go back behind Me. He is silencing one outstripping, in order that he may go backward; and He is calling him Satan, because he willeth to go before the Lord. A little before, “blessed;” now, “Satan.” Whence a little before, “blessed”? Because, “to thee,” He saith, “flesh and blood hath not revealed it, but My Father which is in Heaven.” Whence now, “Satan”? Because “thou savourest not,” He saith, “the things which are of God, but the things which are of men.” Let us then that would duly celebrate the nativities of the Martyrs, long for the imitation of the Martyrs; let us not wish to go before the Martyrs, and think ourselves to be of better understanding than they, because we shun sufferings in behalf of righteousness and faith which they shunned not. Therefore be they that think evil things, and in wantonness feed their hearts, “turned backward and blush.” Let them hear from the Apostle afterwards saying, “But what fruit had ye some time in those things at which ye now blush?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
