[[commentary]]
quote='''
“Show the light of Thy countenance on Thy servant, and teach me thy statutes” (ver. 135): that is, manifest Thy presence, by succouring and aiding me. “And teach me Thy righteousnesses.” Teach me to work them: as it is more plainly expressed elsewhere, “Teach me to do Thy will.” For they who hear, although they retain in their memories what they hear, are by no means to be considered to have learnt, unless they do. For it is the word of Truth: “Every man that hath heard and hath learned of the Father, cometh unto Me.” He therefore who obeyeth not in deed, that is, who cometh not, hath not learnt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
