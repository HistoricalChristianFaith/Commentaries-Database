[[commentary]]
quote='''
But let us hear what they next confess: “we have sinned with our fathers: we have done amiss, and dealt wickedly” (ver. 6). What meaneth “with our fathers”?…“Our fathers,” he saith, “regarded not Thy wonders in Egypt” (ver. 7); and many other things also, he doth relate of their sins. Or is, “we have sinned with our fathers,” to be understood as meaning, we have sinned like our fathers, that is, by imitating their sins? If it be so, it should be supported by some example of this mode of expression: which did not occur to me when I sought on this occasion an instance of any one saying that he had sinned, or done anything, with another, whom he had imitated by a similar act after a long interval of time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
