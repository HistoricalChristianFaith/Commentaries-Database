[[commentary]]
quote='''
But if perchance it is asked, whether God the Father of the Lord Jesus Christ can be called King also, I know not whether any one would dare to withhold this name from Him in the passage where the Apostle saith, “But to the King of ages, immortal, invisible, the only God.” Because even if this be said of the Trinity itself, therein is also God the Father. But if we do not carnally understand, “O God, Thy Judgment to the King give Thou, and Thy justice to the Son of the King:” I know not whether anything else hath been said than, “to Thy Son.” King therefore is the Father also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"

[[commentary]]
quote='''
“For Salomon” indeed this Psalm’s title is fore-noted: but things are spoken of therein which could not apply to that Salomon king of Israel after the flesh, according to those things which holy Scripture speaketh concerning him: but they can most pertinently apply to the Lord Christ. Whence it is perceived, that the very word Salomon is used in a figurative sense, so that in him Christ is to be taken. For Salomon is interpreted peace-maker: and on this account such a word to Him most truly and excellently doth apply, through Whom, the Mediator, having received remission of sins, we that were enemies are reconciled to God. For “when we were enemies we were reconciled to God through the death of His Son.” The Same is Himself that Peace-maker.…Since then we have found out the true Salomon, that is, the true Peace-maker: next let us observe what the Psalm doth teach concerning Him.

“O God, Thy judgment to the King give Thou, and Thy justice to the King’s Son” (ver. 1). The Lord Himself in the Gospel saith, “The Father judgeth not any one, but all judgment He hath given to the Son:” this is then, “O God, Thy judgment to the King give Thou.” He that is King is also the Son of the King: because God the Father also is certainly King. Thus it hath been written, that the King made a marriage for His Son. But after the manner of Scripture the same thing is repeated. For that which he hath said in, “Thy judgment;” the same he hath otherwise expressed in, “Thy justice:” and that which he hath said in, “the King,” the same he hath otherwise expressed in, “to the King’s Son.”…But these repetitions do much commend the divine sayings, whether the same words, or whether in other words the same sense be repeated: and they are mostly found in the Psalms, and in the kind of discourse whereby the mind’s affection is to be awakened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
