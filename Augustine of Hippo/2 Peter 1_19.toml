[[commentary]]
quote='''
The blessed apostle Peter, with two other disciples of Christ the Lord, James and John, was up the mountain with the Lord himself and heard a voice coming down from heaven saying "This is my beloved Son in whom I am well pleased. Listen to him" To remind us of this and draw it to our attention, the same apostle referred to it in his letter and went on to add that all this confirmed the message of the prophets. The voice echoed from heaven, and the prophetic word was thus made more certain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252043.html'
source_title="SERMONS 43.5"

[[commentary]]
quote='''
But when shall they laugh? When iniquity shall have passed over; when it shall have flown over; as now to a great degree hath flown over the time uncertain; when shall have been put to flight the darkness of this world, wherein now we walk not but by the lamp of the Scriptures, and therefore fear as though in night. For we walk by prophecy; whereof saith the Apostle Peter, “We have a more sure prophetic word, to which giving heed ye do well, as to a lamp shining in a dark place, until the day shine, and the day-star arise in your hearts.” So long then as by a lamp we walk, it is needful that with fear we should live. But when shall have come our day, that is, the manifestation of Christ, whereof the same Apostle saith, “When Christ shall have appeared, your life, then ye also shall appear with Himself in glory,” then the just shall laugh at that Doeg.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"

[[commentary]]
quote='''
What is, “in the night”? In this age. For it is night until there shine forth day in the glorified advent of our Lord Jesus Christ. For would ye see how it is night? Unless we had here had a lantern, we should have remained in darkness. For Peter saith, “We too have more sure the prophetic discourse, whereunto ye do well to give heed, as to a lantern shining in a dark place, until day shine, and the day-star arise in your hearts.” There is therefore to come day after this night, meanwhile in this night a lantern is not lacking. And this is perchance what we are now doing: by explaining these passages, we are bringing in a lantern, in order that we may rejoice in this night. Which indeed ought alway to be burning in your houses. For to such men is said, “The Spirit quench ye not.” And as though explaining what he was saying, he continueth and saith, “Prophecy despise ye not:” that is, let the lantern alway shine in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"

[[commentary]]
quote='''
“Make me to hear in the morning Thy mercy, for in Thee have I hoped” (ver. 8). Behold, I am in the night, yet “in Thee have I hoped,” until the iniquity of the night pass away. “For we have,” as Peter saith, “a more sure word of prophecy, whereunto ye do well that ye take heed, as unto a light that shineth in a dark place, until the day dawn, and the daystar arise in your hearts.” “Morning” then he calleth the time after the end of the world, when we shall see what in this world we believe. But what here, until the morning come? For it is not enough to hope for the morning; we must do somewhat. Why do somewhat? God is to be sought with the hands in the night. What is, “with the hands”? By good works. Since then we must thus hope for the morning, and bear this night, and persevere in this patience until the day dawn, what meanwhile must we do here? lest perchance thou think that thou wilt do aught of thyself, whereby thou mayest earn to be brought to the morning. “Make known to me, O Lord, the way wherein I must walk.” Therefore did He kindle the lamp of prophecy, therefore did He send the Lord in the vessel, as it were, of the flesh, who should even say, “My strength is dried up like a potsherd.” Walk by prophecy, walk by the lamp of future things predicted, walk by the word of God.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
