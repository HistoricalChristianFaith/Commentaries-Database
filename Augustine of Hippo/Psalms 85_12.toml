[[commentary]]
quote='''
We were wolves. "We too were by nature children of wrath just like the rest." But the sheep died and turned us into sheep. "Behold the Lamb of God, behold him who takes away the sin," not of this person or that, but "of the world." So then, my brothers, let us claim no credit for anything we are, provided it is by faith in him we are whatever we are—let us claim no credit for ourselves, or we may lose what we have received. But for whatever we have received let us give him the glory, him the honor, and may he water the seeds he has sown. What would our land have if he had not sown anything? He too sends the rain. He does not abandon what he has sown. "The Lord will give his sweetness, and our land will yield its fruit."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252026.html'
source_title="SERMON 26:15"

[[commentary]]
quote='''
This is that sweetness, whereof in another place is said, “The Lord shall give sweetness, and our land shall give her fruit:” in order that a good work may be done not for fear, but for love; not for dread of punishment, but for love of righteousness. For this is true and sound freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"

[[commentary]]
quote='''
“For the Lord shall give sweetness, and our land shall give her increase” (ver. 12).…He will give unto thee the sweetness of working righteousness, so that righteousness shall begin to delight thee, whom before unrighteousness delighted: so that thou who at first didst delight in drunkenness, shalt rejoice in sobriety: and thou who didst at first rejoice in theft, so as to take from another man what thou hadst not, shalt seek to give to him that hath not that which thou hast: and thou who didst take delight in robbing, shalt delight now in giving: thou whom shows delighted, shalt delight in prayer; thou who didst delight in trifling and lascivious songs, shalt now delight in singing hymns to God; in running to church, thou who at first didst run to the theatre. Whence is that sweetness born to thee, except from this, that “God giveth sweetness”? For, behold, ye see what I mean: behold, I have spoken unto you the word of God, I have sown seed in your devout hearts, finding your souls furrowed, as it were, with the plough of confession: with devout attention ye have received the seed; think now upon the word which ye have heard, like those who break up the clouds, lest the fowls should carry away the seed, that what is sown may be able to spring up there: and unless God rain upon it, what profits it that it is sown? This is what is meant by “our land shall give her increase.” May He with His visitations, in leisure, in business, in your house, in your bed, at meal-time, in conversation, in walks, visit your hearts, when we are not by. May the rain of God come and make to sprout what is sown there: and when we are not by, and are resting quietly, or otherwise employed, may God give increase to the seeds which we have sown, that remarking afterwards your improved characters, we too may rejoice for your fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
