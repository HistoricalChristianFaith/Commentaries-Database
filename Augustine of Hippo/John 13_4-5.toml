[[commentary]]
quote='''
(Tr. lv. 7) He laid aside His garments, when, being in the form of God, He emptied Himself; He girded Himself with a towel, took upon Him the form of a servant; He poured water into a bason, out of which He washed His disciples' feet. He shed His blood on the earth, with which He washed away the filth of their sins; He wiped them with the towel wherewith He was girded; with the flesh wherewith He was clothed, He established the steps of the Evangelists; He laid aside His garments, to gird Himself with the towel; that He might take upon Him the form of a servant, He emptied Himself, not laying aside indeed what He had, but assuming what He had not. Before He was crucified, He was stripped of His garments, and when dead was wound up in linen clothes: the whole of His passion is our cleansing.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But why should we wonder that He rose from supper, and laid aside His garments, who, being in the form of God, made Himself of no reputation? And why should we wonder, if He girded Himself with a towel, who took upon Him the form of a servant, and was found in the likeness of a man? Why wonder, if He poured water into a basin wherewith to wash His disciples' feet, who poured His blood upon the earth to wash away the filth of their sins? Why wonder, if with the towel wherewith He was girded He wiped the feet He had washed, who with the very flesh that clothed Him laid a firm pathway for the footsteps of His evangelists? In order, indeed, to gird Himself with the towel,He laid aside the garments He wore; but when He emptied Himself [of His divine glory] in order to assume the form of a servant, He laid not down what He had, but assumed that which He had not before. When about to be crucified, He was indeed stripped of His garments, and when dead was wrapped in linen clothes: and all that suffering of His is our purification. When, therefore, about to suffer the last extremities [of humiliation,] He here illustrated beforehand its friendly compliances; not only to those for whom He was about to endure death, but to him also who had resolved on betraying Him to death. Because so great is the beneficence of human humility, that even the Divine Majesty was pleased to commend it by His own example; for proud man would have perished eternally, had he not been found by the lowly God. For the Son of man came to seek and to save that which was lost. And as he was lost by imitating the pride of the deceiver, let him now, when found, imitate the Redeemer's humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252055.html'
source_title="Tractates on John 55"

[[commentary]]
quote='''
Why therefore is He here said to be girded in front (præcinctus)? He who girdeth himself before, placeth something before himself, wherewith he is girded; whence it is said, He girded Himself before with a towel, and began to wash the disciples’ feet. Because He was humble when He girded Himself with a towel. He washed the feet of His own disciples. But all strength is in humility: because all pride is fragile: therefore when He was speaking of strength, he added, “He is girded:” that thou mayest remember how thy God was girded in humility, when He washed His disciples’ feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
