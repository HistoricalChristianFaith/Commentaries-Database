[[commentary]]
quote='''
But those men, indignant, yet dead, and predestinated to death eternal, answered with insults, and said, "Now we know that thou hast a devil. Abraham is dead, and the prophets." But not in that death which the Lord meant to be understood was either Abraham dead or the prophets. For these were dead, and yet they live: those others were alive, and yet they had died. For, replying in a certain place to the Sadducees, when they stirred the question of the resurrection, the Lord Himself speaks thus: "But as touching the resurrection of the dead, have ye not read how the Lord said to Moses from the bush, I am the God of Abraham, and the God of Isaac, and the God of Jacob? He is not the God of the dead, but of the living." If, then, they live, let us labor so to live, that after death we may be able to live with them. "Whom makest thou thyself," they add, that thou sayest, "he shall never see death who keepeth my saying," when thou knowest that both Abraham is dead and the prophets?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"
