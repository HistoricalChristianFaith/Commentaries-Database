[[commentary]]
quote='''
Matthew next continues his narrative in the following terms:—" And as Jesus passed forth from thence, He saw a man named Matthew, sitting at the receipt of custom: and He saith unto him, Follow me. And he arose and followed Him." Mark gives this story also, and keeps the same order, bringing it in after the notice of the healing of the man who was sick of the palsy. His version runs thus: "And He went forth again by the sea-side; and all the multitude resorted unto Him, and He taught them. And as He passed by, He saw Levi the son of Alphæus sitting at the receipt of custom, and said unto him, Follow me. And he arose, and followed Him." There is no contradiction here; for Matthew is the same person with Levi. Luke also introduces this after the story of the healing of the same man who was sick of the palsy. He writes in these terms: "And after these things He went forth, and saw a publican, named Levi, sitting at the receipt of custom: and He said unto him, Follow me. And he left all, rose up, and followed Him." Now, from this it will appear to be the most reasonable explanation to say that Matthew records these things here in the form of things previously passed over, and now brought to mind. For certainly we must believe that Matthew's calling took place before the delivery of the sermon on the mount. For Luke tells us that on this mountain on that occasion the election was made of all these twelve, whom Jesus also named apostles, out of the larger body of the disciples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 26"
