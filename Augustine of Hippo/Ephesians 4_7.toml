[[commentary]]
quote='''
We find that God does give the Spirit by measure. Hear the apostle when he says, "According to the measure of the gift of Christ." To men He gives by measure, to the only Son He gives not by measure. How does He give to men by measure? "To one is given by the Spirit the word of wisdom: to another the word of wisdom according to the same Spirit; to another faith by the same Spirit; to another prophecy; to another discerning of spirits; to another kinds of tongues; to another the gift of healing. Are all apostles? Are all prophets? Are all teachers? Are all workers of miracles? Have all the gift of healing? Do all speak with tongues? Do all interpret?" This man has one gift, that man another; and what that man has, this has not: there is a measure, a certain division of gifts. To men, therefore, it is given by measure, and concord among them makes one body. As the hand receives one kind of gift to work, the eye another to see, the ear another to hear, the foot another to walk; nevertheless the soul that does all is one, in the hand to work, in the foot to walk, in the ear to hear, in the eye to see; so are also the gifts of believers diverse, distributed to them as to members, to each according to his proper measure. But Christ, who gives, receives not by measure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252014.html'
source_title="Tractates on John 14"
