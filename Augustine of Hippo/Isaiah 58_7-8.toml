[[commentary]]
quote='''
Begin, then, to love thy neighbor. "Break thy bread to the hungry, and bring into thy house him that is needy without shelter; if thou seest the naked, clothe him; and despise not those of the household of thy seed." And in doing this, what wilt thou get in consequence? "Then shall thy light break forth as the morning light." Thy light is thy God, a "morning light" to thee, because He shall come to thee after the night of this world: for He neither rises nor sets, because He is ever abiding. He will be a morning light to thee on thy return, He who had set for thee on thy falling away from Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"
