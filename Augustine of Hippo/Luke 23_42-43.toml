[[commentary]]
quote='''
“For with the heart man believeth unto righteousness; but with the mouth confession is made unto salvation.” In case like unto which that thief was found, who, hanging on the Cross with the Lord, did on the Cross acknowledge the Lord. Others had refused to acknowledge Him while working miracles; this man acknowledged Him when hanging on the Cross. That thief had every other member pierced through; his hands were fastened by the nails; his feet were pierced also; his whole body was fastened to the tree; the body was not disengaged in its other members; the heart and the tongue were disengaged; “with the heart” he “believed; with the tongue” he made “confession.” “Remember me, O Lord,” he said, “when Thou comest into Thy kingdom.” He hoped for the coming of his salvation at a time far remote; he was content to receive it after a long delay; his hope rested on an object far remote. The day, however, was not postponed! The answer was, “This day shalt thou be with Me in Paradise.” Paradise hath happy trees! This day hast thou been with Me on “the Tree” of the Cross. This day shalt thou be with Me on “the Tree” of Salvation.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
