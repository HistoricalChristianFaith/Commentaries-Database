[[commentary]]
quote='''
Why then “the Heavens dropped from the face of God,” from the face of this God, but because thus was fulfilled that which had been foretold, “Blessing He shall give that hath given the Law”? The Law whereby to terrify a man that relieth on human powers; blessing, whereby He delivereth a man that hopeth in God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
