[[commentary]]
quote='''
So Matthew continues, "Then did they spit in His face, and buffeted Him, and others smote Him with the palms of their hands, saying, Prophesy unto us, thou Christ, Who is he that smote thee?" Mark reports these things in like manner. He also mentions a further fact, namely, that they covered His face. On these incidents we have likewise the testimony of Luke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 6"
