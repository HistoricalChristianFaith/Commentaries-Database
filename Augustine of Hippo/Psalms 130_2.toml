[[commentary]]
quote='''
“Lord, hear my voice. O let Thine ears consider well the voice of my complaint” (ver. 2). Whence doth he cry? From the deep. Who is it then who crieth? A sinner. And with what hope doth he cry? Because He who came to absolve from sins, gave hope even to the sinner down in the deep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
