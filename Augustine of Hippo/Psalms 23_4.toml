[[commentary]]
quote='''
As long as you remain in this present life, you are walking in the midst of vices, of worldly pressures, which are the shadow of death. Let Christ shine in your heart, who lights the lamp of our minds with the love of God and neighbor; and you will not fear any evils, since he is with you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520366.html'
source_title="SERMON 366:5"

[[commentary]]
quote='''
“Yea, though I walk in the midst of the shadow of death” (ver. 4). Yea, though I walk in the midst of this life, which is the shadow of death. “I will fear no evil, for Thou art with me.” I will fear no evil, for Thou dwellest in my heart by faith: and Thou art now with me, that after the shadow of death I too may be with Thee. “Thy rod and Thy staff, they have comforted me.” Thy discipline, like a rod for a flock of sheep, and like a staff for children of some size, and growing out of the natural into spiritual life, they have not been grievous to me; rather have they comforted me: because Thou art mindful of me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252023.html'
source_title="Exposition on Psalm 23"
