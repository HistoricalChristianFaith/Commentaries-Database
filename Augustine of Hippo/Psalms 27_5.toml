[[commentary]]
quote='''
“For He hath hidden me in His tabernacle in the day of my evils” (ver. 5). For He hath hidden me in the dispensation of His Incarnate Word in the time of temptations, to which my mortal life is exposed. “He hath protected me in the secret place of His tabernacle.” He hath protected me, with the heart believing unto righteousness.

“On a rock hath He exalted me.” And that what I believed might be made manifest for salvation, He hath made my confession to be conspicuous in His own strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
