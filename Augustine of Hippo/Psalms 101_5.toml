[[commentary]]
quote='''
If it were always praiseworthy to suffer persecution, it would have been enough for the Lord to say, "Blessed are they that suffer persecution," without adding "for justice sake." Similarly, if it were always blameworthy to persecute, it would not be written in the sacred Books: "The one that in private speaks ill of his neighbor, him did I persecute." Sometimes, then, the one who suffers persecution is unjust, and the one who persecutes is just. It is clear that the bad have always persecuted the good and the good have persecuted the bad; the former to do harm unjustly, the latter to bring about amendment by punishment; the one without limits, the other within bounds; those as slaves of passion, these out of love. The one who kills does not mind how he butchers his victim, but the one who cures watches carefully how he cuts; he has health as his aim, the other destruction. Impious people killed the prophets; the prophets also killed impious people. The Jews scourged Christ, and Christ scourged the Jews. The apostles were delivered up by people to the civil rulers, and the apostles delivered up people to the power of Satan. In all these cases, what else is to be noted except to ask which of them served the cause of truth, which that of sin; which one wished to injure, which one wished to convert?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 93"

[[commentary]]
quote='''
“Whoso privily slandered his neighbour, him I persecuted” (ver. 5). Behold the righteous persecutor, not of the man, but of the sin. “With the proud eye, and the insatiable heart, I did not feed.” What meaneth, “I did not feed with”? I did not eat in common with such. Attend, beloved; since ye are about to hear something wonderful. If he did not feed with this man, he did not eat with him; for to feed is to eat; how is it then that we find our Lord Himself eating with the proud? It was not only with those publicans and sinners, for they were humble: for they acknowledged their weakness, and asked for the physician. We find that He ate with the proud Pharisees themselves. A certain proud man had invited Him: it was the same who was displeased because a sinning woman, one of ill repute in the city, approached the feet of our Lord.…That Pharisee was proud: the Lord ate with him; what is it therefore that he saith? “With such an one I did not eat.” How doth He enjoin unto us what He hath not done Himself? He exhorteth us to imitate Himself: we see that He ate with the proud; how doth He forbid us to eat with the proud? We indeed, brethren, for the sake of reproof, abstain from communion with our brethren, and do not eat with them, that they may be reformed? We rather eat with strangers, with Pagans, than with those who hold with us, if we have seen that they live wickedly, that they may be ashamed, and amend; as the Apostle saith, “And if any man obey not our word by this Epistle, note that man, and have no company with him, that he may be ashamed. Yet count him not as an enemy, but admonish him as a brother.” For the sake of healing others we usually do this; but nevertheless we often eat with many strangers and ungodly men.

The pious heart hath its banquets, the proud heart hath its banquets: for it was on account of the food of the proud heart, that he said, “with an insatiable heart.” How is the proud heart fed? If a man is proud, he is envious: otherwise it cannot be. Pride is the mother of enviousness: it cannot but generate it, and ever coexist with it. Every proud man is, therefore, envious: if envious, he feedeth on the misfortunes of others. Whence the Apostle saith, “But if ye bite and devour one another, take heed that ye be not consumed of one another.” Ye see them, then, eating: eat not with these: fly such banquets: for they cannot satisfy themselves with rejoicing in others’ evils, because their hearts are insatiable. Beware thou art not caught in their feasts by the devil’s noose.…Just as birds feed at the trap, or fishes at the hook, they were taken, when they fed. The ungodly therefore have their own feasts, the godly also have theirs. Hear the feasts of the godly: “Blessed are they who hunger and thirst after righteousness: for they shall be filled.” If therefore the godly eateth the meat of righteousness, and the ungodly of pride; it is no wonder if he is insatiable in heart. He eateth the meat of iniquity: do not eat the meat of iniquity, and the proud in eye, and the insatiable in heart, eateth not with thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"
