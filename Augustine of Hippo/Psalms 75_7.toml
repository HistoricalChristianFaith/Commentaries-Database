[[commentary]]
quote='''
“One He humbleth, and another He exalteth” (ver. 7). Whom humbleth, whom exalteth this Judge? Observe these two men in the temple, and ye see whom He humbleth and whom He exalteth. “They went up into the Temple to pray,” He saith, “the one a Pharisee, and the other a Publican.…“Verily I say unto you, that Publican went down justified more than that Pharisee: for every one that exalteth himself shall be humbled; and he that humbleth himself shall be exalted.” Thus hath been explained a verse of this Psalm. God the Judge doth what? “One He humbleth, and another He exalteth:” He humbleth the proud, He exalteth the humble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
