[[commentary]]
quote='''
We rejoice at your numbers, for you have come together with readiness and in greater numbers than we could have hoped. This it is that delights and consoles us in all the labors and dangers of this life, your love towards God, and pious zeal, and assured hope, and fervor of spirit. You heard when the psalm was read, "that the needy and poor man cries to God in this world." For it is the voice, as you have often heard, and ought to remember, not of one man, and yet of one man; not of one, because the faithful are many-many grains groaning amid the chaff diffused throughout the whole world-but of one, because all are members of Christ, and thus one body. This people, then, poor and needy, does not know to rejoice with the world: its grief is within, and its joy is within, where no one sees but He who listens to him who groans, and crowns him who hopes. The rejoicing of the world is vanity. With great expectation is it hoped for and it cannot, when it comes, be held fast. For this day which is a day of rejoicing in this city to the lost, to-morrow will, of course, cease to be; nor will they themselves be the same tomorrow that they are to-day. And all things pass away, fly away, and vanish like smoke; and woe to those who love such things! For every soul follows what it loves. "All flesh is grass, and all the goodliness thereof as the flower of the field: the grass withereth, the flower fadeth; but the word of the Lord abideth forever." Behold what thou must love if thou dost desire to abide for ever. But thou hadst this to reply: How can I apprehend the word of God? "The Word was made flesh, and dwelt among us."

Wherefore, beloved, let it belong to our neediness and poverty to grieve for those who seem to themselves to abound. For their joy is as that of madmen. But as a madman rejoices for the most part in his madness, and laughs, and grieves over him who is in his senses, so let us, beloved, if we have received the medicine coming from heaven, because we all were madmen, as if made whole, because those things which we did love we do not love,-let us, I say, groan unto God for those who are yet in madness, for He is able to save them also. And there is need that they should look upon themselves and be displeased with themselves: to behold they desire, and to behold themselves they have not known. For if they for a little turn their eyes upon themselves, they see their own confusion. But until this take place, let our pursuits be different, let the recreations of our souls be different; our grief avails more than their joy. As far as regards the number of the brethren, it is difficult to conceive that any one of the men should have been carried away by that celebration; but as regards the number of the sisters, it grieves us, and this is a greater cause for grief, that they do not rather repair to the Church, whom if not fear, modesty at all events ought to deter from the public scene. May He see to this who sees it; and may His mercy be present to heal all. Let us who have come together feed upon the feast of God, and let our joy be His word. For He has invited us to His gospel, and He is our food, than whom nothing is sweeter, if only a man have a healthy palate in his heart.

But I imagine, beloved brethren, that you remember that this Gospel is read in order in suitable portions; and I think that it has not escaped you what has lately been treated of, specially the recent matters concerning John and the dove. Concerning John, namely, what new thing he learned concerning the Lord by means of the dove, although he had already known the Lord. And this was discovered by the inspiration of the Spirit of God, that John indeed already knew the Lord, but that the Lord Himself was to baptize, that the power of baptizing He would not transfer from Himself to any one, this he learned by means of the dove, because it was said to him, "On whom thou shalt see the Spirit descending as a dove, and abiding upon Him, this is He which baptizeth with the Holy Ghost." What is "This is He"? Not another, although by means of another. But why by means of a dove? Many things were said, and I am not able, nor is there need that I should go over all;-principally, however, to denote peace, because also the trees which were baptized outside, because the dove found in them fruit, it brought to the ark, as you remember the dove sent out by Noah from the ark, which floated on the flood and was washed by baptism, was not submerged. When, then, it was sent forth, it brought an olive branch; but it had not leaves alone, it had also fruit. This, then, we ought to wish for our brethren who are baptized outside, that they may have fruit; the dove will not permit them to remain outside, but bring them back to the ark. For the whole of fruit is charity, without which a man is nothing, whatever else he have. And this, which is most fully said by the apostle, we have mentioned and recounted. For he says, "Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass or a tinkling cymbal; and though I should have all knowledge, and know all mysteries, and have all prophecy, and should have all faith" (but in what sense did he say all faith?), "so that I could remove mountains, and have not charity, I am nothing. And though I should distribute all my goods to the poor, and though I should give my body to be burned, and have not charity, it profiteth me nothing." But in no manner are they able to say that they have charity who divide unity. These things were said: let us see what follows.

John bare record because he saw. What record did he bear? "That this is the Son of God." It behoved, then, that He should baptize who is God's only Son, not His adopted son. Adopted sons are the ministers of the only Son: the only Son has power; the adopted, the ministry. In the case that a minister baptizes who does not belong to the number of sons, because he lives evilly and acts evilly, what is our consolation? "This is He which baptizeth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
