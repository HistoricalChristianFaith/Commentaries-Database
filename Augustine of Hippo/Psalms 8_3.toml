[[commentary]]
quote='''
“For I shall see Thy heavens, the works of Thy fingers” (ver. 3). We read that the law was written with the finger of God, and given through Moses, His holy servant: by which finger of God many understand the Holy Ghost. Wherefore if, by the fingers of God, we are right in understanding these same ministers filled with the Holy Ghost, by reason of this same Spirit which worketh in them, since by them all holy Scripture has been completed for us; we understand consistently with this, that, in this place, the books of both Testaments are called “the heavens.” Now it is said too of Moses himself, by the magicians of king Pharaoh, when they were conquered by him, “This is the finger of God.” And what is written, “The heavens shall be rolled up as a book.” Although it be said of this æthereal heaven, yet naturally, according to the same image, the heavens of books are named by allegory. “For I shall see,” he says, “the heavens, the works of Thy fingers:” that is, I shall discern and understand the Scriptures, which Thou, by the operation of the Holy Ghost, hast written by Thy ministers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"

[[commentary]]
quote='''
“For I shall see the heavens, the works of Thy fingers, the moon and the stars, which Thou hast ordained.” The moon and stars are ordained in the heavens; since both the Church universal, to signify which the moon is often put, and Churches in the several places particularly, which I imagine to be intimated by the name of stars, are established in the same Scriptures, which we believe to be expressed by the word heavens. But why the moon justly signifies the Church, will be more seasonably considered in another Psalm, where it is said, “The sinners have bent their bow, that they may shoot in the obscure moon the upright in heart.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"
