[[commentary]]
quote='''
“Make glad the soul of Thy servant: for unto Thee, O Lord, have I lifted up my soul” (ver. 4). Make it glad, for unto Thee have I lifted it up. For it was on earth, and from the earth it felt bitterness: lest it should wither away in bitterness, lest it should lose all the sweetness of Thy grace, I lifted it up unto Thee: make Thou it glad with Thyself. For Thou alone art gladness: the whole world is full of bitterness. Surely with reason He admonishes His members to lift up their hearts. May they hear and do it: may they lift up unto Him what on earth is ill. There the heart decayeth not, if it be lifted up to God. If thou hadst corn in thy rooms below, thou wouldest take it up higher, lest it should grow rotten. Wouldest thou remove thy corn, and dost thou suffer thy heart to rot on the earth? Thou wouldest take thy corn up higher: lift up thy heart to heaven. And how can I, dost thou say? What ropes are needed? what machines? what ladders? Thy affections are the steps: thy will the way. By loving thou mountest, by neglect thou descendest. Standing on the earth thou art in heaven, if thou lovest God. For the heart is not so raised as the body is raised: the body to be lifted up changes its place: the heart to be lifted up changes its will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
