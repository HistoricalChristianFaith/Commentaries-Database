[[commentary]]
quote='''
“For one day in Thy courts is better than a thousand” (ver. 10). Those courts they were for which he sighed, for which he fainted. “My soul longeth and faileth for the courts of the Lord:” one day there is better than a thousand days. Men long for thousands of days, and wish to live here long: let them despise these thousands of days, let them long for one day, which has neither rising nor setting: one day, an everlasting day, to which no yesterday yields, which no to-morrow presses. Let this one day be longed for by us. What have we to do with a thousand days? We go from the thousand days to one day; let us hasten to that one day, as we go from strength to strength.

“I have chosen to be cast away in the house of the Lord, rather than to dwell in the tents of sinners” (ver. 11). For he found the valley of weeping, he found humility by which he might rise: he knoweth that if he would raise himself he shall fall, if he humble himself he shall be exalted: he hath chosen to be cast away, that he may be raised up. How many beside this tabernacle of the Lord’s winepress, that is beside the Catholic Church, wishing to be lifted up, and loving their honours, refuse to see the truth. If this verse had been in their heart, would they not cast away honours, and run to the valley of weeping, and hence find in their heart the way of ascent, and hence go from virtues to virtue, placing their hope in Christ, not in some man or another? A good word is this, a word to rejoice in, a word to be chosen. He himself chose to be cast away in the house of the Lord; but He who invited him to the feast, when he chose a lower place calleth him to a higher one, and saith unto him, “Go up higher.” Yet he chose not but to be in the house of the Lord, in any part of it, so that he were not outside the threshold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
