[[commentary]]
quote='''
And twelve gates of Jerusalem are spoken of, and the one gate is Christ, and the twelve gates are Christ for Christ dwells in the twelve gates, hence was twelve the number of the Apostles. There is a deep mystery in this number of twelve: “Ye shall sit,” says our Saviour, “on twelve thrones, judging the twelve tribes of Israel.” If there are twelve thrones there, there will be no room for the judgment-seat of Paul, the thirteenth Apostle, though he says that he shall judge not men only, but even Angels; which, but the fallen Angels? “Know ye not, that we shall judge Angels,” he writes. The world would answer, Why dost thou boast that thou shalt be a judge? Where will be thy throne? Our Lord spoke of twelve thrones for the twelve Apostles: one, Judas, fell, and his place being supplied by Matthias, the number of twelve thrones was made up: first, then, discover room for thy judgment-seat; then threaten that thou wilt judge. Let us, therefore, reflect upon the meaning of the twelve thrones. The expression is typical of a sort of universality, as the Church was destined to prevail throughout the whole world: whence this edifice is styled a building together into Christ: and because judges come from all quarters, the twelve thrones are spoken of, just as the twelve gates, from the entering in from all sides into that city. Not only therefore have those twelve, and the Apostle Paul, a claim to the twelve thrones, but, from the universal signification, all who are to sit in judgment: in the same manner as all who enter the city, enter by one or the other of the twelve gates. There are four quarters of the globe: East, West, North, and South: and they are constantly alluded to in the Scriptures. From all those four winds; our Lord declares in the Gospel that He will call his sheep “from the four winds;” therefore from all those four winds is the Church called. And how called? On every side it is called in the Trinity: no otherwise is it called than by Baptism in the name of the Father, the Son, and the Holy Ghost: four then being thrice taken, twelve are found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
