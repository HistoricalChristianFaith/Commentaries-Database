[[commentary]]
quote='''
“The remembrance of the abundance of Thy sweetness they shall pour forth.” O happy feasts! What shall they eat, who thus shall “pour forth”!…So eat, that thou mayest pour forth again; so receive, that thou mayest give. Thou eatest, when thou learnest; thou pourest forth again, when thou teachest: thou eatest, when thou hearest; thou pourest forth again, when thou preachest; but that thou pourest forth, which thou hast first eaten. Finally, that most eager feaster John, to whom the very table of the Lord sufficed not, unless he leaned on the Lord’s breast, and of his inmost heart drank in divine secrets; what did he pour forth? “In the beginning was the Word, and the Word was with God.” How is it that it sufficeth not to say, “Thy remembrance;” or, “the remembrance of Thine abundance”? Because, what availeth it if it be abundant, yet not sweet? So also it is annoying if it be sweet but too little.

…By “pouring forth” this, His preachers “shall exult in His righteousness” not in their own. What then hast Thou done unto us, O Lord, whom we praise, that we should be, that we should praise, that we should “exult in Thy righteousness,” that we should “utter forth the remembrance of the abundance of Thy sweetness”? Let us tell it, and, as we tell, let us praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520145.html'
source_title="Exposition on Psalm 145"
