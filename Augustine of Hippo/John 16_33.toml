[[commentary]]
quote='''
When the Holy Spirit was given them, they were of good cheer, and, in His strength, victorious. For He would not have overcome the world, had the world overcome His members. When He says, These things have I spoken to you, that in Me ye might have peace, He refers not only to what He has just said, but to what He had said all along, either from the time that He first had disciples, or since the supper, when He began this long and wonderful discourse. He declares this to be the object of His whole discourse, viz. that in Him they might have peace. And this peace shall have no end, but is itself the end of every pious action and intention.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For the Lord Himself saith: “These things I have spoken to you: that in Me ye might have peace. But in the world ye shall have tribulation.” If ye are Christians, look for tribulations in this world; look not for more peaceful and better times. Brethren, ye deceive yourselves; what the Gospel doth not promise you, promise not to yourselves. Ye know what the Gospel saith; we are speaking to Christians; we ought not to disobey the faith. The Gospel saith this, that in the last times many evils, many stumbling-blocks, many tribulations, much iniquity, shall abound; but he that shall endure unto the end, the same shall be saved. “The love,” it saith, “of many shall wax cold.” Whosoever then hath been stedfastly fervent in spirit, as the Apostle saith, “fervent in spirit,” his love shall not wax cold: because “the love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us.” Let no man therefore promise himself what the Gospel doth not promise. Behold, happier times will come, and I am doing this, and purchasing this. It is good for thee to listen to Him who is not deceived, nor hath deceived any man, who promised thee joy not here, but in Himself; and when all here hath passed away, to hope that with Him thou wilt for ever reign; lest when thou dost wish to reign here, thou mayest neither enjoy gladness here, nor find it there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
