[[commentary]]
quote='''
Nevertheless, Christ has not been among us with the bodily form which the Jews saw and despised; because this also was said concerning Him, even as the apostle says: "Now I say that Christ was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers. He owed it to have come to those by whose fathers and to whose fathers He was promised. For this reason He says also Himself: "I am not sent but unto the lost sheep of the house of Israel." But what says the apostle in the following words? "And that the Gentiles might glorify God for His mercy." What, moreover, saith the Lord Himself? "Other sheep I have which are not of this fold. He who had said, "I am not sent but unto the lost sheep of the house of Israel," how has He other sheep to which He was not sent, except that He intimated that He was not sent to show His bodily presence but to the Jews only, who saw and killed Him? And yet many of them, both before and afterwards, believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"

[[commentary]]
quote='''
When he says: For I say that Christ was a minister of the circumcision for the truth of God, to confirm the promises of the fathers, but that the Gentiles should glorify God for his mercy, he says this so that the Gentiles may understand that the Lord Christ was sent to the Jews, and may not be proud. For, the Jews rejecting what was sent to them, it came about that the Gospel was preached to the Gentiles also—which is most clearly written in the Acts of the Apostles, when the Apostles say to the Jews: To you it was necessary that the word be preached first; but since you have judged yourselves unworthy, behold, we turn ourselves to the Gentiles. According also to the testimonies of the Lord himself, when he says: I am not sent except to the lost sheep of the house of Israel, and again: It is not good to send the children's bread to the dogs. And if the Gentiles consider this well, they understand that, by this their own faith, by which they now believe that all things are clean to the clean, they ought not to insult those—if any perchance be weak among the circumcision—who, on account of association with idols, dare not touch any meats at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
