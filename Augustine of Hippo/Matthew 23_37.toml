[[commentary]]
quote='''
(Quaest. Ev. i. 36.) This species has the greatest affection for its brood, insomuch that when they are sick the mother sickens also; and what you will hardly find in any other animal, it will fight against the kite, protecting its young with its wings. In like manner our mother, the Wisdom of God, sickened as it were in the putting on the flesh, according to that of the Apostle, The weakness of God is stronger than men, (1 Cor. 1:25.) protects our weakness, and resists the Devil that he should not make us his prey.

(Ench. 97.) Where is that omnipotence, by the which He did whatsoever pleased Him both in heaven and in earth, if He would have gathered the children of Jerusalem and did not? Was it not that she would not that her children should be gathered by Him, and yet He did, notwithstanding, gather those of her children whom He would?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
As weak, then, He nourishes the weak, as a hen her chickens; for He likened Himself to a hen: "How often," He saith to Jerusalem, "would I have gathered thy children under my wings, as a hen her chickens; but thou wouldest not!" And you see, brethren, how a hen becomes weak with her chickens. No other bird, when it is a mother, is recognized at once to be so. We see all kinds of sparrows building their nests before our eyes; we see swallows, storks, doves, every day building their nests; but we do not know them to be parents, except when we see them on their nests. But the hen is so enfeebled over her brood, that even if the chickens are not following her, if thou see not the young ones, yet thou knowest her at once to be a mother. With her wings drooping, her feathers ruffled, her note hoarse, in all her limbs she becomes so sunken and abject, that, as I have said, even though thou seest not her young, yet thou perceivest her to be a mother. In such manner was Jesus weak, wearied with His journey. His journey is the flesh assumed for us. For how can He, who is present everywhere, have a journey, He who is nowhere absent? Whither does He go, or whence, but that He could not come to us, except He had assumed the form of visible flesh? Therefore, as He deigned to come to us in such manner, that He appeared in the form of a servant by the flesh assumed, that same assumption of flesh is His journey. Thus, "wearied with His journey," what else is it but wearied in the flesh? Jesus was weak in the flesh: but do not thou become weak; but in His weakness be strong, because what is "the weakness of God is stronger than men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252015.html'
source_title="Tractates on John 15"

[[commentary]]
quote='''
Something else I am admonished to say in this place of the loftiness of our Head Himself: for He was made weak even unto death, and He took on Him the weakness of flesh, in order that the chickens of Jerusalem He might gather under His wings, like a hen showing herself weak with her little ones. For have we not observed this thing in some bird at some time or other, even in those which build nests before our eyes, as the house-sparrows, as swallows, so to speak, our annual guests, as storks, as various sorts of birds, which before our eyes build nests, and hatch eggs, feed chickens, as the very doves which daily we see; and some bird to become weak with her chickens, have we not known, have we not looked upon, have we not seen? In what way doth a hen experience this weakness? Surely a known fact I am speaking of, which in our sight is daily taking place. How her voice groweth hoarse, how her whole body is made languid? The wings droop, the feathers are loosened, and thou seest around the chickens some sick thing, and this is maternal love which is found as weakness. Why was it therefore, but for this reason, that the Lord willed to be as a Hen, saying in the Holy Scripture, “Jerusalem, Jerusalem, how often have I willed to gather thy sons, even as a hen her chickens under her wings, and thou hast not been willing.” But He hath gathered all nations, like as a hen her chickens.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"

[[commentary]]
quote='''
If thou protect me not, forasmuch as I am a chicken, the kite will seize me. For our Lord Himself saith in a certain place to that Jerusalem, a certain city, where He was crucified: “Jerusalem,” He saith, “Jerusalem, how often I have willed to gather thy sons, as though a hen her chickens, and thou wouldest not.” Little ones we are: therefore may God protect us under the shadow of His wings. What when we shall have grown greater? A good thing it is for us that even then He should protect us, so that under Him the greater, alway we be chickens. For alway He is greater, however much we may have grown. Let no one say, let Him protect me while I am a little one: as if sometime he would attain to such magnitude, as should be self-sufficient. Without the protection of God, nought thou art. Alway by Him let us desire to be protected: then alway in Him we shall have power to be great, if alway under Him little we be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
If the hen defends her chickens beneath her wings; how much more shalt thou be safe beneath the wings of God, even against the devil and his angels, the powers who fly about in mid air like hawks, to carry off the weak young one? For the comparison of the hen to the very Wisdom of God is not without ground; for Christ Himself, our Lord and Saviour, speaks of Himself as likened to a hen; “how often would I have gathered thy children,” etc. That Jerusalem would not: let us be willing.…If you consider other birds, brethren, you will find many that hatch their eggs, and keep their young warm: but none that weakens herself in sympathy with her chickens, as the hen does. We see swallows, sparrows, and storks outside their nests, without being able to decide whether they have young or no: but we know the hen to be a mother by the weakness of her voice, and the loosening of her feathers: she changes altogether from love for her chickens: she weakens herself because they are weak. Thus since we were weak, the Wisdom of God made Itself weak, when the Word was made flesh, and dwelt in us, that we might hope under His wings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
