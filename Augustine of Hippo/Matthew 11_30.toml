[[commentary]]
quote='''
So then they who with unfearing neck have submitted to the yoke of the Lord endure such hardships and dangers, that they seem to be called not from labour to rest, but from rest to labour. But the Holy Spirit was there who, as the outward man decayed, renewed the inward man day by day, and giving a foretaste of spiritual rest in the rich pleasures of God in the hope of blessedness to come, smoothed all that seemed rough, lightened all that was heavy. Men suffer amputations and burnings, that at the price of sharper pain they may be delivered from torments less but more lasting, as boils or swellings. What storms and dangers will not merchants undergo that they may acquire perishing riches? Even those who love not riches endure the same hardships; but those that love them endure the same, but to them they are not hardships. For love makes right easy, and almost nought all things however dreadful and monstrous. How much more easily then does love do that for true happiness, which avarice does for misery as far as it can?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
The shoulders are divided, in order that their sins may burthen some men, while others may take up the burden of Christ. For godly shoulders He was requiring when He said, “For My yoke is gentle, and My burden is light.” Another burden oppresseth and loadeth thee, but Christ’s burden relieveth thee: another burden hath weight, Christ’s burden hath wings. For even if thou pull off the wings from a bird, thou dost remove a kind of weight; and the more weight thou hast taken away, the more on earth it will abide. She that thou hast chosen to disburden lieth there: she flieth not, because thou hast taken off a weight: let there be given back the weight, and she flieth. Such is Christ’s burden; let men carry it, and not be idle: let them not be heeded that will not bear it; let them bear it that will, and they shall find how light it is, how sweet, how pleasant, how ravishing unto Heaven, and from earth how transporting.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"

[[commentary]]
quote='''
“Between the shoulders,” however. This is indeed a part of the body, it is a part about the region of the heart, at the hinder parts however, that is, at the back: which part of that dove silvered he saith is “in the greenness of gold,” that is, in the vigour of wisdom, which vigour I think cannot be better understood than by love. But why on the back, and not on the breast? Although I wonder in what sense this word is put in another Psalm, where there is said, “Between His shoulders He shall overshadow thee, and under His wings thou shalt hope:” forasmuch as under wings there cannot be overshadowed anything but what shall be under the breast. And in Latin, indeed, “between the shoulders,” perchance in some degree of both parts may be understood, both before and behind, that we may take shoulders to be the parts which have the head betwixt them; and in Hebrew perchance the word is ambiguous, which may in this manner also be understood: but the word that is in the Greek, μετάφρενα, signifieth not anything but at the back, which is “between the shoulders.” Is there for this reason there the greenness of gold, that is, wisdom and love, because in that place there are in a manner the roots of the wings? or because in that place is carried that light burden? For what are even the wings themselves, but the two commandments of love, whereon hangeth the whole Law and the Prophets? what is that same light burden, but that same love which in these two commandments is fulfilled? For whatever thing is difficult in a commandment, is a light thing to a lover. Nor on any other account is rightly understood the saying, “My burden is light,” but because He giveth the Holy Spirit, whereby love is shed abroad in our hearts, in order that in love we may do freely that which he that doeth in fear doeth slavishly; nor is he a lover of what is right, when he would prefer, if so be it were possible, that what is right should not be commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
