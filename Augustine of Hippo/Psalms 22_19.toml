
[[commentary]]
quote='''
“But Thou, O Lord, withhold not Thy help far from Me” (ver. 19). But Thou, O Lord, raise Me up again, not as the rest of men, at the end of the world, but immediately. “Look to My defence.” “Look,” that they in no wise hurt Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
