[[commentary]]
quote='''
For how did He turn away the captivity of Jacob? See, how that that setting free is spiritual, see how that it is done inwardly. “Thou hast forgiven,” he saith, “the iniquity of Thy people: Thou hast covered all their sins” (ver. 2). Behold how He hath turned away their captivity, in that He hath remitted iniquity: iniquity held them captive; thy iniquity forgiven, thou art freed. Confess therefore that thou art in captivity, that thou mayest be worthy to be freed: for he that knoweth not of his enemy, how can he invoke the liberator? “Thou hast covered all their sins.” What is, “Thou hast covered”? So as not to see them. How didst Thou not see them? So as not to take vengeance on them. Thou wast unwilling to see our sins: and therefore sawest Thou them not, because Thou wouldest not see them: “Thou hast covered all their sins.” “Thou hast appeased all Thy anger: Thou hast turned Thyself from Thy wrathful indignation” (ver. 3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
