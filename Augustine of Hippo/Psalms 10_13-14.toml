[[commentary]]
quote='''
Accordingly understanding now the manifest judgment, and in exultation at it, they say, “Wherefore hath the ungodly angered God?” (ver. 13); that is, what hath it profited him to do so great evil? “For he said in his heart, He will not require it.” Then follows, “For Thou seest toil and considerest anger, to deliver them into Thine hands” (ver. 14). This sentence looks for distinct explanation, wherein if there shall be error it becomes obscure. For thus has the ungodly said in his heart, God will not require it, as though God regarded toil and anger, to deliver them into His hands; that is, as though He feared toil and anger, and for this reason would spare them, lest their punishment be too burdensome to Him, or lest He should be disturbed by the storm of anger: as men generally act, excusing themselves of vengeance, to avoid toil or anger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
