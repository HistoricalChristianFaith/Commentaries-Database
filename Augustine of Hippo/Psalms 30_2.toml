[[commentary]]
quote='''
“O Lord, My God, I have cried unto Thee, and Thou hast healed Me” (ver. 2). O Lord, My God, I have cried unto Thee, and I no longer bear about a body enfeebled and sick by mortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
