[[commentary]]
quote='''
Taking, then, not only the reports presented by the four evangelists, but also the statement given by the Apostle Paul, we shall endeavour to bring the whole into a single connected narrative, and exhibit the order in which all these incidents may have taken place, comprehending all the Lord's appearances to the male disciples, and leaving out His earlier declarations to the women. Now, in the entire number of the men, Peter is understood to be the one to whom Christ showed Himself first. At least, this holds good so far as regards all the individuals who are actually mentioned by the four evangelists, and by the Apostle Paul. But, at the same time, who would be bold enough either to affirm or to deny that He may have appeared to some one among them before He showed Himself to Peter, although all these writers pass the matter over in silence? For the statement which Paul also gives is not in the form, "He was seen first of Cephas." But it runs thus: "He was seen of Cephas, then of the twelve: after that He was seen of above five hundred brethren at once." And thus it is not made clear who these twelve were, just as we are not informed who these five hundred were. It is quite possible, indeed, that the twelve here instanced were some unknown twelve belonging to the multitude of the disciples. For now the apostle might speak of those whom the Lord designated apostles, not as the twelve, but as the eleven. Some codices, indeed, contain this very reading. I take that, however, to be an emendation introduced by men who were perplexed by the text, supposing it to refer to those twelve apostles who, by the time when Judas disappeared, were really only eleven. It may be the case, then, that those are the more correct codices which contain the reading "eleven;" or it may be that Paul intended some other twelve disciples to be understood by that phrase; or, once more, the fact may be that he meant that consecrated number to remain as before, although the circle had been reduced to eleven: for this number twelve, as it was used of the apostles, had so mystical an importance, that, in order to keep the spiritual symbol of the same number, there could be but a single individual, namely, Matthias, elected to fill the place of Judas. But whichever of these several views may be adopted, nothing necessarily results which can appear to be inconsistent with truth, or at variance with any one most trustworthy historian among them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
