[[commentary]]
quote='''
“Thou hast proved and visited Mine heart in the night-season” (ver. 3). For this Mine heart hath been proved by the visitation of tribulation. “Thou hast examined Me by fire, and iniquity hath not been found in Me.” Now not night only, in that it is wont to disturb, but fire also, in that it burns, is this tribulation to be called; whereby when I was examined I was found righteous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
