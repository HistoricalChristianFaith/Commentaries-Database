[[commentary]]
quote='''
(ubi sup.) Hence we understand what Mark means by clothed him with purple; (Mark 15:17.) instead of the royal purple, this scarlet cloak was used in mockery; and there is a shade of purple which is very like scarlet. Or it may be, that Mark spoke of the purple which the cloak contained, though its colour was scarlet.

(ubi sup.) But Matthew seems to introduce this here as recollected from above, not that it was done at the time Pilate gave Him up for crucifixion. For John puts it before. He is given up by Pilate.

(Quaest. Ev. ii. in fin.) That they took from off the Lord in His passion His own garment, and put on Him a coloured robe, denotes those heretics who said that He had a shadowy, and not a real body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We have now reached the point at which we may study the Lord's passion, strictly so called, as it is presented in the narrative of these four evangelists. Matthew commences his account as follows: "Then the soldiers of the governor took Jesus into the common hall, and gathered unto Him the whole band of soldiers. And they stripped Him, and put on Him a scarlet robe. And when they had platted a crown of thorns, they put it upon His head, and a reed in His right hand: and they bowed the knee before Him, and mocked Him, saying, Hail, King of the Jews!" At the same stage in the narrative, Mark delivers himself thus: "And the soldiers led Him away into the hall called Prætorium; and they called together the whole band. And they clothed Him with purple, and platted a crown of thorns, and put it on His head, and began to salute Him, saying, Hail, King of the Jews! And they smote Him on the head with a reed, and did spit upon Him, and, bowing their knees, worshipped Him." Here, therefore, we perceive that while Matthew tells us how they "put on Him a scarlet robe," Mark speaks of purple, with which He was clothed. The explanation may be that the said scarlet robe was employed instead of the royal purple by these scoffers. There is also a certain red-coloured purple which resembles scarlet very closely. And it may also be the case that Mark has noticed the purple which the robe contained, although it was properly scarlet. Luke has left this without mention.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 9"
