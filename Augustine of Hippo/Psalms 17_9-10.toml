[[commentary]]
quote='''
“From the face of the ungodly who have troubled Me” (ver. 9).

“Mine enemies have compassed about My soul;” “they have shut up their own fat” (ver. 10). They have been covered with their own gross joy, after that their desire hath been satiated with wickedness. “Their mouth hath spoken pride.” And therefore their mouth spoke pride, in saying, “Hail, King of the Jews,” and other like words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
