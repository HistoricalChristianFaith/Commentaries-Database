[[commentary]]
quote='''
The Psalm which we have sung is short: but as it is written in the Gospel of Zacchæus that he was “little of stature,” but mighty in works; as it is written of that widow who cast two mites into the treasury, little was the money, but great was her charity; thus also this Psalm, if thou count the words, is short; if thou weigh the sentiments, is great.…Let the Spirit of God speak, let It speak to us, let It sing to us; whether we wish or wish not to dance, let It sing. For as he who danceth, moveth his limbs to the time; so they who dance according to the commandment of God, in their works obey the sound. What therefore saith the Lord in the Gospel to those who refuse to do this? “We have piped unto you, and ye have not danced: we have mourned unto you, and ye have not lamented.” Let Him therefore sing; we trust in God’s mercy, for there will be those by whom He consoleth us. For they who are obstinate, continuing in wickedness, although they hear the Word of God, by their offences daily disturb the Church. Of such this Psalm speaketh; for thus it beginneth.

“Many a time have they fought against me from my youth up” (ver. 1). The Church speaketh of those whom She endureth: and as if it were asked, “Is it now?” The Church is of ancient birth: since saints have been so called, the Church hath been on earth. At one time the Church was in Abel only, and he was fought against by his wicked and lost brother Cain. At one time the Church was in Enoch alone: and he was translated from the unrighteous. At one time the Church was in the house of Noah alone, and endured all who perished by the flood, and the ark alone swam upon the waves, and escaped to shore. At one time the Church was in Abraham alone, and we know what he endured from the wicked. The Church was in his brother’s son, Lot, alone, and in his house, in Sodom, and he endured the iniquities and perversities of Sodom, until God freed him from amidst them. The Church also began to exist in the people of Israel: She endured Pharaoh and the Egyptians. The number of the saints began to be also in the Church, that is, in the people of Israel; Moses and the rest of the saints endured the wicked Jews, the people of Israel. We come unto our Lord Jesus Christ: the Gospel was preached in the Psalms.…For this reason, lest the Church wonder now, or lest any one wonder in the Church, who wisheth to be a good member of the Church, let him hear the Church herself his Mother saying to him, Marvel not at these things, my son: “Many a time have they fought against me from my youth up.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520129.html'
source_title="Exposition on Psalm 129"
