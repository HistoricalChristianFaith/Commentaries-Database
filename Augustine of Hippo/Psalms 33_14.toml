[[commentary]]
quote='''
“From His prepared habitation:” from His habitation of assumed Humanity, which He prepared for Himself. “He looketh upon all the inhabitants of the earth” (ver. 14): He looketh mercifully upon all who live in the flesh, that He may be over them in ruling them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
