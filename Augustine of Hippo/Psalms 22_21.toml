
[[commentary]]
quote='''
“Save Me from the lion’s mouth:” save Me from the mouth of the kingdom of this world: “and my humility from the horns of the unicorns” (ver. 21). And from the loftiness of the proud, exalting themselves to special pre-eminence, and enduring no partakers, save My humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
