[[commentary]]
quote='''
“Thou heardest them,” he saith, “O Lord our God: Thou wast forgiving to them, O God” (ver. 8). God is not said to be forgiving toward anything but sins: when He pardoneth sins, then He forgiveth. And what had He in them to punish, so that He was forgiving in pardoning them? He was forgiving in pardoning their sins, He was also forgiving in punishing them. For what followeth? “And punishedst all their own affections.” Even in punishing them Thou wast forgiving toward them: for not in remitting, but also in punishing their sins, hast Thou been forgiving. Consider, my brethren, what he hath taught us here: attend. God is angry with him whom, when he sinneth, He scourgeth not: for unto him to whom He is truly forgiving, He not only remitteth sins, that they may not injure him in a future life; but also chasteneth him, that he delight not in continual sin.

Come, my brethren; if we ask how these were punished, the Lord will aid me to tell you. Let us consider these three persons, Moses, Aaron, and Samuel: and how they were punished, since he said, “Thou hast punished all their own affections:” meaning those affections of theirs, which the Lord knew in their hearts, which men knew not. For they were living in the midst of the people of God, without complaint from man. But what do we say? That perhaps the early life of Moses was sinful; for he fled from Egypt, after slaying a man. The early life of Aaron also was such as would displease God; for he allowed a maddened and infatuated people to make an idol to worship; and an idol was made for God’s people to worship. What sin did Samuel, who was given up when an infant to the temple? He passed all his life amid the holy sacraments of God: from childhood the servant of God. Nothing was ever said of Samuel, nothing by men. Perhaps God knew of somewhat there to chasten; since even what seemeth perfect unto men, unto that Perfection is still imperfect. Artists show many of their works to the unskilful; and when the unskilful have pronounced them perfect, the artists polish them still further, as they know what is still wanting to them, so that men wonder at things they had imagined already perfect having received so much additional polish. This happeneth in buildings, and in paintings, and in embroidery, and almost in every species of art. At first they judge it to be already in a manner perfect, so that their eyes desire nothing further: but the judgment of the inexperienced eye is one, and that of the rule of art another. Thus also these Saints were living before the eyes of God, as if faultless, as if perfect, as if Angels: but He who punished all their own affections, knew what was wanting in them. But He punished them not in anger, but in mercy: He punished them that He might perfect what He had begun, not to condemn what He had cast away. God therefore punished all their affections. How did He punish Samuel? where is this punishment?…What was said unto Moses was a type, not a punishment. What punishment is death to an old man? What punishment was it, not to enter into that land, into which unworthy men entered? But what is said of Aaron? He also died an old man: his sons succeeded him in the priesthood: his son afterwards ruled in the priesthood: how did He punish Aaron also? Samuel also died a holy old man, leaving his sons as his successors. I seek for the punishment inflicted upon them, and according to men I find it not: but according to what I know the servants of God suffer every day, they were day by day punished. Read ye, and see the punishments, and ye also who are advanced bear the punishments. Every day they suffered from the obstinate people, every day they suffered from the ungodly livers; and were compelled to live among those whose lives they daily censured. This was their punishment. He unto whom it is small hath not advanced far; for the ungodliness of others tormenteth thee in proportion as thou hast departed far from thine own.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
