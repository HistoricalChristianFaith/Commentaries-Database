[[commentary]]
quote='''
Certainly, Christ the Lord Himself sent His apostles, as their name implies: for as those who in Greek are called angeli are in Latin called nuntii [messengers], so the Greek apostoli [apostles] becomes the Latin missi [persons sent]. But never would any of the apostles have dared to say, "He that believeth on me, believeth not on me, but on Him that sent me;" for in no sense whatever would he say, "He that believeth on me." We believe an apostle, but we do not believe on him; for it is not an apostle that justifieth the ungodly. But to him that believeth on Him that justifieth the ungodly, his faith is counted for righteousness. An apostle might say, He that receiveth me, receiveth Him that sent me; or, He that heareth me, heareth Him that sent me; for the Lord tells them so Himself: "He that receiveth you, receiveth me; and he that receiveth me, receiveth Him that sent me." For the master is honored in the servant, and the father in the son: but then the father is as it were in the son, and the master as it were in the servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252054.html'
source_title="Tractates on John 54"
