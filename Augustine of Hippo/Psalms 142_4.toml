[[commentary]]
quote='''
In the Psalms the Lord Himself says by the prophet, "A place of refuge hath failed me, and there is none that seeketh after my life;" and again He says in another place in the Psalms, "Let them be confounded and ashamed who seek after my life." He blamed the former for not seeking, He condemned the latter because they did. For it is wrong not to seek the life of Christ, that is, in the way the disciples sought it; and it is wrong to seek the life of Christ, that is, in the way the Jews sought it: for the former sought to possess it, these latter to destroy it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252038.html'
source_title="Tractates on John 38"

[[commentary]]
quote='''
And what follows? “Let them be confounded and put to shame, that seek after my soul” (ver. 4): for to this end they seek after it, to destroy it. For I would that they would seek it for good! for in another Psalm he blameth this in men, that there was none who would seek after his soul: “Refuge failed me: there was none that would seek after my soul.” Who is this that saith, “There was none that would seek after my soul”? Is it haply He, of whom so long before it was predicted, “They pierced My Hands and My Feet, they numbered all My Bones, they stared and looked upon Me, they have parted My Garments among them, and cast lots for My Vesture”? Now all these things were done before their eyes, and there was none who would seek after His Soul.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
[[commentary]]
quote='''
“Let them be ashamed and confounded together that seek after my soul to destroy it” (ver. 14). For in a certain passage he makes an accusation, and says, “I looked upon my right hand, and beheld; and there was no man who sought after my soul;” that is, there was no man to imitate Mine example. Christ in His Passion is the Speaker. “I looked on my right hand,” that is, not on the ungodly Jews, but on Mine own right hand, the Apostles,—“and there was no man who sought after My soul.” So thoroughly was there no man to “seek after My soul,” that he who had presumed on his own strength, “denied My soul.” But because a man’s soul is sought after in two ways, either in order that you may enjoy his society; or that you may persecute him; therefore he here speaks of others, whom he would have “confounded and ashamed,” who are “seeking after his soul.” But lest you should understand it in the same way as when he complains of some who did not “seek after his soul,” He adds, “to destroy it;” that is, they seek after my soul in order to my death.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
“I considered upon the right hand, and saw” (ver. 4). He considered upon the right hand, and saw: whoso considereth upon the left hand, is blinded. What is to consider on the right hand? Where they will be to whom shall be said, “Come, ye blessed of My Father,” etc.,…He goeth on to say, “and there was none that knew me.” For when thou fearest all things, who knoweth what thou regardest, whether thou directest thine eyes to the right hand or to the left? If, in bearing, thou seekest the praise of men, thou hast regarded the left: if, in bearing, thou seekest the promises of God, thou hast regarded the right hand. Hast thou regarded the right hand, thou shalt see: hast thou regarded the left hand, thou shalt be blinded. But even when thou seest on the right hand, there will be none to know thee. For who comforteth thee save the Lord? “Flight hath perished from me.” He speaketh as though he were hemmed in. Let the persecutors rejoice over him; he is overpowered, he is taken, he is hemmed in, he is conquered. “Flight hath perished” from him who fleeth not. But he who fleeth not, suffereth whatever he can for Christ: that is, he fleeth not in soul. For in body it is lawful to flee; it is allowed, it is permitted; for the Lord saith, “When they persecute you in one city, flee to another.” He then who fleeth not in soul, from him “flight hath perished.” But it maketh a difference why he fleeth not; whether because he is hemmed in, because he is caught, or because he is brave. For both from him that is caught flight hath perished, and from him that is brave flight hath perished. What flight then is to be avoided? what flight shall we allow to perish from us? That whereof the Lord speaketh in the Gospel, “The Good Shepherd layeth down his life for the sheep. But he that is an hireling, and not the shepherd, when he seeth the wolf coming, fleeth.” When he seeth the ravager, why fleeth he? “Because he careth not for the sheep.”…In two ways a man’s life is sought, either by his persecutors or by his lovers. So then “there is none to seek my life,” he said of them; verily they persecute my life, and they seek not my life. But if they seek my life, they will find it clinging to Thee: and if they know to seek it, they know also to imitate it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520142.html'
source_title="Exposition on Psalm 142"
