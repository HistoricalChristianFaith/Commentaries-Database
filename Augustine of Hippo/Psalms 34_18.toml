[[commentary]]
quote='''
“The Lord is nigh unto them that have broken their heart; and saveth such as be lowly in spirit” (ver. 18). God is High: let a Christian be lowly. If he would that the Most High God draw nigh unto him, let him be lowly. A great mystery, Brethren. God is above all: thou raisest thyself, and touchest not Him: thou humblest thyself, and He descendeth unto thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
To a proud man He draweth not near. High indeed He is, one lifted up attaineth not unto Him. In order that we may reach all exalted objects, we raise ourselves, and if we are not able to reach them, we look for some appliances or ladders, in order that being exalted we may reach exalted objects: contrariwise God is both high, and by the lowly He is reached. It is written, “Nigh is the Lord to them that have bruised the heart.” The bruising of the heart is Godliness, humility. He that bruiseth himself is angry with himself. Let him make himself angry in order that he may make Him merciful; let him make himself judge, in order that he may make Him Advocate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"

[[commentary]]
quote='''
What is to bruise the heart? Let it be known, brethren, let it be done, that ye may be able to be healed. For it is told in many other places of Scripture;…“the sacrifice of God is a troubled spirit, a bruised and contrite heart God will not despise.” He healeth then the bruised in heart, for He draweth nigh unto them to heal them; as is said in another place, “the Lord is nigh unto them who have bruised their heart.” Who are they that have “bruised their heart”? The humble. Who are they that have not “bruised their heart”? The proud. The bruised heart shall be healed, the puffed up heart shall be dashed down. For for this purpose perhaps is it dashed down, that being bruised it may be healed. Let not our heart then, brethren, desire to be set upright, before it be upright. It is ill for that to be uplifted which is not first corrected.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
