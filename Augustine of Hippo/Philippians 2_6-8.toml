
[[commentary]]
quote='''
So, indeed, is He high above all angels, that, "being in the form of God, He thought it not robbery to be equal with God, but emptied Himself, taking upon Him the form of a servant, being made into the likeness of men, and found in fashion as a man: He humbled Himself, being made: obedient unto death" (and lest any kind of death should please thee), "even the death of the cross." He hung on the cross, and they scoffed at Him. He could have come down from the cross; but He deferred, that He might rise again from the tomb. He, the Lord, bore with proud slaves; the physician with the sick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"

[[commentary]]
quote='''
Learn the same likewise in the words of an apostle. "Let this mind," he says, "be in you, which was also in Christ Jesus: who, being in the form of God, thought it not robbery to be equal with God." Who, save Christ Jesus, as respects His nature as the Word, is God with God? But look at what follows: "But emptied Himself, and took upon Him the form of a servant; being made in the likeness of men, and found in fashion as a man." And who is this, but the same Christ Jesus Himself? But here we have now all the parts, both the Word in that form of God which assumed the form of a servant, and the soul and the flesh in that form of a servant which was assumed by the form of God. "He humbled Himself, and became obedient unto death." Now in His death, it was His flesh only that was slain by the Jews. For if He said to His disciples, "Fear not them that kill the body, but are not able to kill the soul," how could they do more in His own case than kill the body? And yet in the slaying of His flesh, it was Christ that was slain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"
