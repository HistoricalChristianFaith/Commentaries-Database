[[commentary]]
quote='''
“He gathereth the waters of the sea together as into a bottle:” He gathereth the people of the world together, to confession of mortified sin, lest through pride they flow too freely. “He layeth up the deep in storehouses” (ver. 7): and keepeth in them His secrets for riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
