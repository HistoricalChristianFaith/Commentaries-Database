[[commentary]]
quote='''
“The Lord loveth the righteous.” And who are the “righteous”? How far are they righteous now? Just as thou hast; “the Lord, guardeth proselytes” (ver. 9). “Proselytes” are strangers. Every Church of the Gentiles is a stranger. For it cometh in to the Fathers, not sprung of their flesh, but their daughter by imitating them. Yet the Lord, not any man, guardeth them. “The orphan and widow He will take up.” Let none think that He taketh up the orphan for his inheritance, or the widow for any business of hers. True, God doth help them; and in all the duties of the human race, he doeth a good work, who taketh care of an orphan, who abandoneth not a widow: but in a certain way we are all orphans, not because our Father is dead, but because He is absent.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
