[[commentary]]
quote='''
“He hath delivered Me from My strongest enemies” (ver. 17). He hath delivered Me from Mine enemies, who prevailed to the afflicting and overturning of this temporal life of Mine. “And from them which hate Me; for they are too strong for Me:” as long as I am under them knowing not God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
