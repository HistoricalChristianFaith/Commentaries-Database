[[commentary]]
quote='''
“Wait on the Lord, quit thyself like a man: and let thy heart be strong, yea wait on the Lord” (ver. 14). But when shall this be? It is arduous for a mortal, it is slow to a lover: but listen to the voice, that deceiveth not, of him that saith, “Wait on the Lord.” Endure the burning of the reins manfully, and the burning of the heart stoutly. Think not that what thou dost not as yet receive is denied thee. That thou faint not in despair, see how it is said, “Wait on the Lord.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"

[[commentary]]
quote='''
How does He “uphold” them? What saith He unto them? Even what is said in another Psalm, “Wait on the Lord, be of good courage; and let thine heart be strengthened. Wait, I say, on the Lord.” What is meant by this, “Wait on the Lord”? Thou sufferest but for a time; thou shalt rest for ever: thy trouble is short; thy happiness is to be everlasting. It is but for “a little while” thou art to sorrow; thy joy shall have no end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
