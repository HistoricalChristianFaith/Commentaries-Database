[[commentary]]
quote='''
How should we will that to us He come? By living well, by doing well. Let not things past please us; things present not hold us; let us not “close the ear” as it were with tail, let us not press down the ear on the ground; lest by things past we be kept back from hearing, lest by things present we be entangled and prevented from meditating on things future; let us reach forth unto those things which are before, let us forget things past. And that for which now we toil, for which now we groan, for which now we sigh, of which now we speak, which in part, however small soever, we perceive, and to receive are not able, we shall receive, we shall thoroughly enjoy in the resurrection of the just. Our youth shall be renewed as an eagle’s, if only our old man we break against the Rock of Christ. Whether those things be true, brethren, which are said of the serpent, or those which are said of the eagle, or whether it be rather a tale of men than truth, truth is nevertheless in the Scriptures, and not without reason the Scriptures have spoken of this: let us do whatever it signifieth, and not toil to discover how far that is true. Be thou such an one, as that thy youth may be able to be renewed as an eagle’s. And know thou that it cannot be renewed, except thine old man on the Rock shall have been broken off: that is, except by the aid of the Rock, except by the aid of Christ, thou wilt not be able to be renewed. Do not thou because of the pleasantness of the past life be deaf to the word of God: do not by things present be so held and entangled, as to say, I have no leisure to read, I have no leisure to hear. This is to press down the ear upon the ground. Do thou therefore not be such an one: but be such an one as on the other side thou findest, that is, so that thou forget things past, unto things before reach thyself out, in order that thine old man on the Rock thou mayest break off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"

[[commentary]]
quote='''
After the battle, then, I shall be crowned; after the crown, what shall I do? “He who satisfieth thy longing with good things” (ver. 5).…Seek thy own good, O soul. For one thing is good to one creature, another to another, and all creatures have a certain good of their own, to the completeness and perfection of their nature. There is a difference as to what is essential to each imperfect thing, in order that it may be made perfect; seek for thy own good. “There is none good but One, that is, God.” The highest good is thy good. What then is wanting unto him to whom the highest good is good? For there are inferior goods, which are good to different creatures respectively. What, brethren, is good unto the cattle, save to fill the belly, to prevent want, to sleep, to indulge themselves, to exist, to be in health, to propagate? This is good to them: and within certain bounds it hath an allotted measure of good, granted by God, the Creator of all things. Dost thou seek such a good as this? God giveth also this: but do not pursue it alone. Canst thou, a coheir of Christ, rejoice in fellowship with cattle? Raise thy hope to the good of all goods. He will be thy good, by whom thou in thy kind hast been made good, and by whom all things in their kind were made good. For God made all things very good.…

When shall my longing be satisfied with good things? when, dost thou ask? “Thy youth shall be renewed as the eagle’s.” Dost thou then ask when thy soul is to be satisfied with good things? When thy youth shall be restored. And he addeth, as an eagle’s. Something here lieth hidden; what however is said of the eagle, we will not pass over silently, since it is not foreign to our purpose to understand it. Let this only be impressed upon our hearts, that it is not said without cause by the Holy Spirit. For it hath intimated unto us a sort of resurrection. And indeed the youth of the eagle is restored, but not into immortality, for a similitude hath been given, as far as it could be drawn from a thing mortal to signify a thing immortal, not to demonstrate it. The eagle is said, after it becometh overpowered with bodily age, to be incapable of taking food from the immoderate length of its beak, which is always increasing. For after the upper part of its beak, which forms a crook above the lower part, hath increased from old age to an immoderate length, the length of this increase will not allow of its opening its mouth, so as to form any interval between the lower beak and the crook above. For unless there be such an opening, it hath no power of biting like a forceps, by which to shear off what it may put within its jaws. The upper part therefore increasing, and being too far hooked over, it cannot open its mouth, and take any food. This old age doth to it, it is weighed down with the infirmity of age, and becometh too weak from want of power to eat; two causes of infirmity assaulting it, old age, and want. By a natural device, therefore, in order in some measure to restore its youth, the eagle is said to dash and strike against a rock the upper lip of its beak, by the too great increase of which the opening for eating is closed: and by thus rubbing it against the rock, it breaketh off the weight of its old beak, which impeded its taking food. It cometh to its food, and everything is restored: it will be after its old age like a young eagle; the vigour of all its limbs returneth, the lustre of its plumage, the guidance of its wings, it flieth aloft as before, a sort of resurrection taketh place in it. For this is the object of the similitude, like that of the Moon, which after waning and being apparently intercepted, again is renewed, and becometh full; and signifieth to us the resurrection; but when it is full it doth not remain so; again it waneth, that the signification may never cease. Thus also what hath here been said of the eagle: the eagle is not restored unto immortality, but we are unto eternal life; but the similitude is derived from hence, that the rock taketh away from us what hindereth us. Presume not therefore on thy strength: the firmness of the rock rubbeth off thy old age: for that Rock was Christ. In Christ our youth shall be restored like that of the eagle.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
