[[commentary]]
quote='''
Persecution, therefore, will never be lacking. For, when our enemies from without leave off raging and there ensues a span of tranquillity—even of genuine tranquillity and great consolation at least to the weak—we are not without enemies within, the many whose scandalous lives wound the hearts of the devout.… So it is that those who want to live piously in Christ must suffer the spiritual persecution of these and other aberrations in thought and morals, even when they are free from physical violence and vexation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252018.html'
source_title="City of God 18.51.2"


[[commentary]]
quote='''
What sort of people, though, are those who, being afraid to offend the ones they are talking to, not only don't prepare them for the trials that are looming ahead but even promise them a well-being in this world which God himself hasn't promised to the world? He foretells distress upon distress coming upon the world right up to the end, and do you wish the Christian to be exempt from these distresses? Precisely because he's Christian, he is going to suffer more in this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252046.html'
source_title="SERMONS 46.11"

[[commentary]]
quote='''
Let no one say to himself, There have been troubles in our fathers’ time, in our time there are not. If thou supposest thyself not to have troubles, not yet hast thou begun to be a Christian. And where is the voice of the Apostle, “But even all that will live godly in Christ, persecutions shall suffer.” If therefore thou sufferest not any persecution for Christ, take heed lest not yet thou hast begun godly to live in Christ. But when thou hast begun godly to live in Christ, thou hast entered into the winepress; make ready thyself for pressings: but be not thou dry, lest from the pressing nothing go forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
