
[[commentary]]
quote='''
“O God, aid Thou me.” Most suitably also Lazarus is said to be interpreted, “one aided:” that needy and poor man, that was transported into the bosom of Abraham; and beareth the type of the Church, which ought alway to confess that she hath need of aid. This is true, this is godly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
