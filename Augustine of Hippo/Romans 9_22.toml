[[commentary]]
quote='''
When he says: He bore with much patience the vessels of wrath, which were fitted for destruction, he sufficiently indicated by this that the hardening of heart which took place in Pharaoh came from the merits of a prior hidden ungodliness, which nevertheless God patiently endured, until Pharaoh should be brought to that time at which vengeance might opportunely proceed against him—for the correction of those whom he had determined to free from error, and to lead them, by recalling them to his own worship and godliness, granting help to their prayers and groanings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
