[[commentary]]
quote='''
Andrew saith: "There is a lad here, who has five loaves and two fishes, but what are these for so many?" When Philip, on being asked, had said that two hundred pennyworth of bread would not suffice to refresh that so great a multitude, there was there a certain lad, carrying five barley loaves and two fishes. "And Jesus saith, Make the men sit down. Now there was there much grass: and they sat down about five thousand men. And the Lord Jesus took the loaves, gave thanks;" He commanded, the loaves were broken, and put before the men that were set down. It was no longer five loaves, but what He had added thereto, who had created that which was increased. "And of the fishes as much as sufficed." It was not enough that the multitude had been satisfied, there remained also fragments; and these were ordered to be gathered up, that they should not be lost: "And they filled twelve baskets with the fragments."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252024.html'
source_title="Tractates on John 24"
