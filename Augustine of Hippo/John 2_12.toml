[[commentary]]
quote='''
(Tr. x. in Joan. 1, 2) The Lord our God is He, high, that He might create us; low, that He might create us anew; walking among men, suffering what was human, hiding what was divine. So He hath a mother, hath brethren, hath disciples: whence He hath a mother, thence hath He brethren. Scripture frequently gives the name of brethren, not to those only who are born of the same womb, or the same father, but to those of the same generation, cousins by the father's or mother's side. Those who are unacquainted with this way of speaking, ask, Whence hath our Lord brothers? did Mary bring forth again? That could not be: with her commenced the dignity of the virgin state. Abraham was uncle of Lot, and Jacob was nephew to Laban the Syrian. Yet Abraham and Lot are called brethren; and likewise Jacob and Laban.

(de Cons. Ev. c. ii. c. xvii. [39.]) And His disciples; it is uncertain whether Peter and Andrew and the sons of Zebedee, were of their number or not at this time. For Matthew first relates that our Lord came and dwelt at Capernaum, and afterwards that He called those disciples from their boats, as they were fishing. Is Matthew perhaps supplying what he had omitted? For without any mention that it was at a subsequent time, he says, Jesus walking by the sea of Galilee saw two brethren. (Matt. 4:18) Or is it better to suppose that these were other disciples? For the writings of the Evangelists and Apostles, call not the twelve only, but all who believing in God were prepared for the kingdom of heaven by our Lord's teaching, disciplesa. (id. cap. 18). How is it too that our Lord's journey to Galilee is placed here before John the Baptist's imprisonment, when Matthew says, Now when Jesus had heard that John was cast into prison, he departed into Galilee: and Mark the same? Luke too, though he says nothing of John's imprisonment, yet places Christ's visit to Galilee after His temptation and baptismc, as the two former do. We should understand then that the three Evangelists are not opposed to John, but pass over our Lord's first coming into Galilee after his baptism; at which time it was that He converted the water into wine.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In the psalm you have heard the groaning of the poor, whose members endure tribulations over the whole earth, even unto the end of the world. Make it your chief business, my brethren, to be among and of these members: for all tribulation is to pass away. "Woe to them that rejoice!" "Blessed," says the Truth, "are they that mourn, for they shall be comforted." God has become man: what shall man be, for whom God is become man? Let this hope comfort us in every tribulation and temptation of this life. For the enemy does not cease to persecute; and when he does not openly rage, he plots in secret. How does he plot? "And for wrath, they worked deceitfully." Thence is he called a lion and a dragon. But what is said to Christ? "Thou shall tread on the lion and the dragon." Lion, for open rage; dragon, for hidden treachery. The dragon cast Adam out of Paradise; as a lion, the same persecuted the Church, as Peter says: "For your adversary, the devil, goeth about as a roaring lion, seeking whom he may devour." Let it not seem to you as if the devil had lost his ferocity. When he blandly flatters, then is he the more vigilantly to be guarded against. But amid all these treacherous devices and temptations of his, what shall we do but that which we have heard in the psalm: "And I, when they were troublesome to me, clothed me in sackcloth, and humbled my soul in fasting." There is one that heareth prayer, hesitate not to pray; but He that heareth abideth within. You need not direct your eyes towards some mountain; you need not raise your face to the stars, or to the sun, or to the moon; nor must you suppose that you are heard when you pray beside the sea: rather detest such prayers. Only cleanse the chamber of thy heart; wheresoever thou art, wherever thou prayest, He that hears is within, within in the secret place, which the psalmist calls his bosom, when he says, "And my prayer shall be turned in my own bosom." He that heareth thee is not beyond thee; thou hast not to travel far, nor to lift thyself up, so as to reach Him as it were with thy hands. Rather, if thou lift thyself up, thou shalt fall; if thou humble thyself, He will draw near thee. Our Lord God is here, the Word of God, the Word made flesh, the Son of the Father, the Son of God, the Son of man; the lofty One to make us, the humble to make us anew, walking among men, bearing the human, concealing the divine.

"He went down," as the evangelist says, "to Capernaum, He, and His mother, and His brethren, and His disciples; and they continued there not many days." Behold He has a mother, and brethren, and disciples: whence He has a mother, thence brethren. For our Scripture is wont to call them brethren, not only that are sprung from the same man and woman, or from the same mother, or from the same father, though by different mothers; or, in truth, that are of the same degree as cousins by the father's or mother's side: not these alone is our Scripture wont to call brethren. The Scripture must be understood as it speaks. It has its own language; one who does not know this language is perplexed and says, Whence had the Lord brethren? For surely Mary did not give birth a second time? Far from it! With her begins the dignity of virgins. She could be a mother, but a woman known of man she could not be. She is spoken of as mulier [which usually signifies a wife], but only in reference to her sex, not as implying loss of virgin purity: and this follows from the language of Scripture itself. For Eve, too, immediately she was formed from the side of her husband, and as yet not known of her husband, is, as you know, called mulier: "And he made her a woman [mulier]." Then, whence the brethren? The kinsmen of Mary, of whatever degree, are the brethren of the Lord. How do we prove this? From Scripture itself. Lot is called "Abraham's brother;" he was his brother's son. Read, and thou wilt find that Abraham was Lot's uncle on the father's side, and yet they are called brethren. Why, but because they were kinsmen? Laban the Syrian was Jacob's uncle by the mother's side, for he was the brother of Rebecca, Isaac's wife and Jacob's mother. Read the Scripture, and thou wilt find that uncle and sister's son are called brothers. When thou hast known this rule, thou wilt find that all the blood relations of Mary are the brethren of Christ.

But rather were those disciples brethren; for even those kinsmen would not be brethren were they not disciples: and to no advantage brethren, if they did not recognize their brother as their master. For in a certain place, when He was informed that His mother and His brethren were standing without, at the time He was speaking to His disciples, He said: "Who is my mother? or who are my brethren? And stretching out His hand over His disciples, He said, These are my brethren;" and, "Whosoever shall do the will of my Father, the same is my mother, and brother, and sister." Therefore also Mary, because she did the will of the Father. What the Lord magnified in her was, that she did the will of the Father, not that flesh gave birth to flesh. Give good heed, beloved. Moreover, when the Lord was regarded with admiration by the multitude, while doing signs and wonders, and showing forth what lay concealed under the flesh, certain admiring souls said: "Happy is the womb that bare Thee: and He said, Yea, rather, happy are they that hear the word of God, and keep it." That is to say, even my mother, whom ye have called happy, is happy in that she keeps the word of God: not because in her the Word was made flesh and dwelt in us; but because she keeps that same word of God by which she was made, and which in her was made flesh. Let not men rejoice in temporal offspring, but let them exult if in spirit they are joined to God. We have spoken these things on account of that which the evangelist says, that He dwelt in Capernaum a few days, with His mother, and His brethren, and His disciples.
'''
