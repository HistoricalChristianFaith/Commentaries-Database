[[commentary]]
quote='''
Behold! you are mortal; and you bear about you a body of flesh that is corrupting away: “And ye shall fall like one of the princes. Ye shall die like men,” and shall fall like the devil. What good does the remedial discipline of mortality do you? The devil is proud, as not having a mortal body, as being an angel. But as for you, who have received a mortal body, and to whom even this does no good, so as to humble you by so great weakness, you shall “fall like one of the princes.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
