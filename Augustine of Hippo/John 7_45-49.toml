[[commentary]]
quote='''
The same are therefore the strong men, that assailed Christ, commending their own justice. Hear ye these strong men: when certain men of Jerusalem were speaking, having been sent by them to take Christ, and not daring to take Him (because when he would, then was He taken, that truly was strong): Why therefore, say they, “could ye not take Him?” And they made answer, “No one of men did ever so speak as He.” And these strong men, “Hath by any means any one of the Pharisees believed on Him, or any one of the Scribes, but this people knowing not the Law?” They preferred themselves to the sick multitude, that was running to the Physician: whence but because they were themselves strong? and what is worse, by their strength, all the multitude also they brought over unto themselves, and slew the Physician of all.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
