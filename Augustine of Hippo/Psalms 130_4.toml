[[commentary]]
quote='''
But wherefore is there hope? “For there is propitiation with Thee” (ver. 4). And what is this propitiation, except sacrifice? And what is sacrifice, save that which hath been offered for us? The pouring forth of innocent blood blotted out all the sins of the guilty: so great a price paid down redeemed all captives from the hand of the enemy who captured them. “With Thee,” then, “there is propitiation.” For if there were not mercy with Thee, if Thou chosest to be Judge only, and didst refuse to be merciful, Thou wouldest mark all our iniquities, and search after them. Who could abide this? Who could stand before Thee, and say, I am innocent? Who could stand in Thy judgment?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
