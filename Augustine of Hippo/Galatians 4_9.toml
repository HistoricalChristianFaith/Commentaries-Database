[[commentary]]
quote='''
What follows, as it were, reintroduces a question that has already been explored. Through the whole letter he has shown that no one has disturbed the faith of the Galatians except those who were of the circumcision, who wished to lead them into carnal observations of the law as though salvation were in them. In this place alone he seems to speak to those who were attempting to return to Gentile superstitions.… For in saying "you have reverted," since he is speaking not to the circumcised but to Gentiles, as appears in the whole letter, he does not say at all that they have reverted to circumcision, in which they had never been, but he says "to the weak and beggarly elements," which you wish to serve again as before.
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 33 [1B.4.9]"

[[commentary]]
quote='''
“I have appeared to Thee,” is what? In order that Thou mightest see me: and for this reason Thou hast seen me, in order that I might see Thee. “I have appeared to Thee, that I might see.” He hath not said, “I have appeared to Thee, that Thou mightest see:” but, “I have appeared to Thee, that I might see Thy power and Thy glory.” Whence also the Apostle, “But now,” he saith, “knowing God, nay, having been known of God.” For first ye have appeared to God, in order that to you God might be able to appear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
