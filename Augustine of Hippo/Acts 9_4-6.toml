[[commentary]]
quote='''
Saul was a blasphemer of Christ: he was then lifted up, he prays to Christ, “he is fallen,” he is prostrate before Him: the enemy of Christ is slain, that the disciple of Christ may live! By an arrow launched from heaven, Saul (not as yet Paul, but still Saul), still lifted up, still not yet prostrate, is wounded in “the heart:” he received the arrow, he fell “in heart.” For though he fell prostrate on his face, it was not there that he fell down in heart: but it was there where he said aloud, “Lord, what dost Thou bid me do?” But just now thou wert going to bind the Christians, and to bring them to punishment: and now thou sayest unto Christ, “What dost Thou bid me do?” O arrow sharp and most mighty, by whose stroke “Saul” fell, so as to become “Paul.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
