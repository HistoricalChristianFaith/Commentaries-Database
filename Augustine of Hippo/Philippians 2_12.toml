[[commentary]]
quote='''
"And greater works than these shall he do." Than what, pray? Shall we say that one is doing greater works than all that Christ did who is working out his own salvation with fear and trembling? A work which Christ is certainly working in him, but not without him; and one which I might, without hesitation, call greater than the heavens and the earth, and all in both within the compass of our vision. For both heaven and earth shall pass away, but the salvation and justification of those predestinated thereto, that is, of those whom He foreknoweth, shall continue forever. In the former there is only the working of God, but in the latter there is also His image. But there are also in the heavens, thrones, governments, principalities, powers, archangels, and angels, which are all of them the work of Christ; and is it, then, greater works also than these that he doeth, who, with Christ working in him, is a co-worker in his own eternal salvation and justification?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252072.html"
source_title="Tractates on John 72"
