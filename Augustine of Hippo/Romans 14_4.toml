[[commentary]]
quote='''
These men were of a mind to pass judgment with regard to things which may indeed be done with a bad intention but which may also be done with an upright, simple and magnanimous motive. Although they were men, they wanted to judge the secrets of the heart—secrets of which God alone is the judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 2.18.59"

[[commentary]]
quote='''
When he says: Who are you to judge another's servant? he says this so that, in those matters which can be done with either a good or a bad intention, we may leave the judgment to God, and not dare to pass sentence on another's heart, which we do not see. But in those matters which are so grasped that it is clear they cannot be done with a good and chaste intention, it is not disapproved if we judge. And so, in what he says about foods—since it is not known with what intention it is done—he does not want us to be judges, but God; but concerning that abominable defilement, where a certain man had taken his father's wife, he judged that it must be judged by the precepts. For that man could not say that he had committed so monstrous a shameful deed with a good intention. Therefore whatever deeds are so manifest that it cannot be said, "I did it with a good intention," are to be judged by us; but whatever things are so done that it is uncertain with what intention they are done, are not to be judged but reserved for the judgment of God, as it is written: The things that are hidden belong to God, but the things that are manifest, to you and to your children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
