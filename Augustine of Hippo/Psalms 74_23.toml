[[commentary]]
quote='''
“Forget not the voice of them that implore Thee” (ver. 23). While they groan for and expect now that which Thou hast promised from the New Testament, and walk by that same Faith, “do Thou not forget the voice of them imploring Thee.” But those still say, “Where is Thy God? Let the pride of them that hate Thee come up alway to Thee.” Do not forget even their pride. Nor doth He forget: no doubt He doth either punish or amend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
