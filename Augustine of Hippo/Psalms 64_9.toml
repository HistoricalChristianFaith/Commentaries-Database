[[commentary]]
quote='''
“And every man feared” (ver. 9). They that feared not, were not even men. “Every man feared;” that is, every one using reason to perceive the things which were done. Whence they that feared not, must rather be called cattle, rather beasts savage and cruel. A lion ramping and roaring is that people as yet. But in truth every man feared: that is, they that would believe, that trembled at the judgment to come. “And every man feared: and they declared the works of God.”…“And every man hath feared: and they have declared the works of God, and His doings they have perceived.” What is, “His doings they have perceived”? Was it, O Lord Jesu Christ, that Thou wast silent, and like a sheep for a victim wast being led, and didst not open before the shearer Thy mouth, and we thought Thee to be set in smiting and in grief, and knowing how to bear weakness? Was it that Thou wast hiding Thy beauty, O Thou beautiful in form before the sons of men? Was it that Thou didst not seem to have beauty nor grace? Thou didst bear on the Cross men reviling and saying, “If Son of God He is, let Him come down from the Cross.”…This thing they, that would have had Him come down from the Cross, perceived not: but when He rose again, and being glorified ascended into Heaven, they perceived the works of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"
