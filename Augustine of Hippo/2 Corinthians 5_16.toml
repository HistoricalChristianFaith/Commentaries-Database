[[commentary]]
quote='''
What does it mean, then, "If I go not away, the Comforter will not come unto you;" but that ye cannot receive the Spirit so long as ye continue to know Christ after the flesh? Hence one who had already been made a partaker of the Spirit says, "Though we have known Christ after the flesh, yet now henceforth know we [Him] no more." For now even the very flesh of Christ he did not know in a carnal way, when brought to a spiritual knowledge of the Word that had been made flesh. And such, doubtless, did the good Master wish to intimate, when He said, "If I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252094.html'
source_title="Tractates on John 94"
