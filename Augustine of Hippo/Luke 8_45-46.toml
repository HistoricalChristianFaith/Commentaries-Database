[[commentary]]
quote='''
For we do not run to Christ on foot, but by believing; nor is it by a motion of the body, but by the inclination of the heart that we draw nigh to Him. This is why that woman who touched the hem of His garment touched Him more than did the crowd that pressed Him. Therefore the Lord said, "Who touched me?" And the disciples wondering said, "The multitude throng Thee, and press Thee, and sayest Thou, Who touched me?" And He repeated it, "Somebody hath touched me." That woman touched, the multitude pressed. What is "touched," except "believed"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
