[[commentary]]
quote='''
“That troublest the bottom of the sea” (ver. 7). He hath done this: it is seen what He hath done. For He hath prepared mountains in His strength, hath sent them to preach: girded about He is by believers in power: and moved is the sea, moved is the world, and it beginneth to persecute His saints. “Girded about in power: that troublest the bottom of the sea.” He hath not said, that troublest the sea; but “the bottom of the sea.” The bottom of the sea is the heart of ungodly men. For just as from the bottom more thoroughly all things are stirred, and the bottom holdeth firm all things: so whatsoever hath gone forth: by tongue, by hands, by divers powers for the persecution of the Church, from the bottom hath gone forth. For if there were not the root of iniquity in the heart, all those things would not have gone forth against Christ. The bottom He troubled, perchance in order that the bottom He might also empty: for in the case of certain evil men He emptied the sea from the bottom, and made the sea a desert place. Another Psalm saith this, “That turneth sea into dry land.” All ungodly and heathen men that have believed were sea, have been made land; with salt waves at first barren, afterwards with the fruit of righteousness productive. “That troublest the bottom of the sea: the sound of its waves who shall endure?” “Who shall endure,” is what? What man shall endure the sound of the waves of the sea, the behests of the high powers of the world? But whence are they endured? Because He prepareth mountains in His strength. In that therefore which he hath said “who shall” endure he saith thus: We ourselves of our own selves should not be able to endure those persecutions, unless He gave strength.

“The nations shall be troubled” (ver. 8). At first they shall be troubled: but those mountains prepared in the strength of Christ, are they troubled? Troubled is the sea, against the mountains it dasheth: the sea breaketh, unshaken the mountains have remained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
