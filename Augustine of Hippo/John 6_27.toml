[[commentary]]
quote='''
(Tr. xxv. 10) Under the figure of food He alludes to Himself. Ye seek Me, He saith, for the sake of something else; seek Me for My own sake.

(Tr. xxv. 10) As He told the woman of Samaria above, If thou knewest Who it is that saith to thee, Give me to drink, thou wouldest have asked of Him, and He would have given thee living water. (c. 4) So He says here, Which the Son of man shall give unto you.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore "this meat, not that which perisheth, but that which endureth unto everlasting life, which the Son of man shall give unto you; for Him hath God the Father sealed." Do not take this Son of man as you take other sons of men, of whom it is said, "And the sons of men will trust in the protection of Thy wings." This Son of man is separated by a certain grace of the spirit; Son of man according to the flesh, taken out from the number of men: He is the Son of man. This Son of man is also the Son of God; this man is even God. In another place, when questioning His disciples, He saith: "Whom do men say that I, the Son of man, am? And they answered, Some John, some Elias, some Jeremias, or one of the prophets. And He said unto them, But whom say ye that I am? Peter answered, Thou art the Christ, the Son of the living God." He declared Himself Son of man, Peter declared Him the Son of the living God. Most fitly did He mention that which in mercy He had manifested Himself to be; most fitly did the other mention that which He continues to be in glory. The Word of God commends to our attention His own humility: the man acknowledged the glory of his Lord. And indeed, brethren, I think that this is just. He humbled Himself for us, let us glorify Him. For not for Himself is He Son of man, but for us. Therefore was He Son of man in that way, when "the Word was made flesh, and dwelt among us." For to that end "God the Father sealed Him." What is to seal, but to put some particular mark? To seal is to impress some mark which cannot be confounded with the rest. To seal is to put a mark on a thing. When thou puttest a mark on anything, thou doest so lest it might be confused with other things, and thou shouldst not be able to recognize it. "The Father," then, "hath sealed Him." What is that, "hath sealed"? Bestowed on Him something peculiar, which puts Him out of comparison with all other men. For that reason it is said of Him, "God, even Thy God, hath anointed Thee with the oil of gladness above Thy fellows." What is it then to seal, but to have Him excepted? This is the import of "above Thy fellows." And so, do not, saith He, despise me because I am the Son of man, but seek from me, "not the meat that perisheth, but that which endureth to eternal life." For I am the Son of man in such manner as not to be one of you: I am Son of man in such manner that God the Father sealed me. What does that mean, He "sealed me"? Gave me something peculiarly my own, that I should not be confounded with mankind, but that mankind should be delivered by me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
