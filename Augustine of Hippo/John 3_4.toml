[[commentary]]
quote='''
You wonder why a sinner should be born of the seed of a just person. Don't you also wonder why a wild olive is born of the seed of an olive tree? Here is another comparison: think of the baptized righteous person as a grain that has been gleaned. Don't you observe that from this gleaned grain wheat is born with the chaff, without which it was sown? Again, while the propagation of those who are reborn is a matter of spiritual regeneration, do you really want a person to be born circumcised of a circumcised person? Certainly this kind of generation is a bodily act, and circumcision is a bodily act. And yet the offspring of a circumcised man is not born circumcised. So in the same way the offspring of a baptized person cannot be born baptized, because nobody is born again before being born.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520294.html'
source_title="SERMON 294.16"

[[commentary]]
quote='''
(Tr. xi. c. 6) It is the Spirit that speaketh, whereas he understandeth carnally; he knew of no birth save one, that from Adam and Eve; from God and the Church he knows of none. But do thou so understand the birth of the Spirit, as Nicodemus did the birth of the flesh; for as the entrance into the womb cannot be repeated, so neither can baptism.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore mark, my brethren, what answer this man who came to Jesus by night makes. Although he came to Jesus, yet because he came by night, he still speaks from the darkness of his own flesh. He understands not what he hears from the Lord, understands not what he hears from the Light, "which lighteth every man that cometh into this world." Already hath the Lord said to him, "Except a man be born again, he shall not see the kingdom of God. Nicodemus saith unto Him, How can a man be born again when he is old?" The Spirit speaks to him, and he thinks of the flesh. He thinks of his own flesh, because as yet he thinks not of Christ's flesh. For when the Lord Jesus had said, "Except a man eat my flesh, and drink my blood, he shall not have life in him," some who followed Him were offended, and said among themselves, "This is a hard saying; who can hear it?" For they fancied that, in saying this, Jesus meant that they would be able to cook Him, after being cut up like a lamb, and eat Him: horrified at His words, they went back, and no more followed Him. Thus speaks the evangelist: "And the Lord Himself remained with the twelve; and they said to Him, Lo, those have left Thee. And He said, Will ye also go away?"-wishing to show them that He was necessary to them, not they necessary to Christ. Let no man fancy that he frightens Christ, when he tells Him that he is a Christian; as if Christ will be more blessed if thou be a Christian. It is a good thing for thee to be a Christian; but if thou be not, it will not be ill for Christ. Hear the voice of the psalm, "I said to the Lord, Thou art my God, since Thou hast no need of my goods." For that reason, "Thou art my God, since of my goods Thou hast no need." If thou be without God, thou wilt be less; if thou be with God, God will not be greater. Not from thee will He be greater, but thou without Him wilt be less. Grow, therefore, in Him; do not withdraw thyself, that He may, as it were, diminish. Thou wilt be renewed if thou come to Him, wilt suffer loss if thou depart from Him. He remains entire when thou comest to Him, remains entire even when thou fallest away. When, therefore, He had said to His disciples, "Will ye also go away?" Peter, that Rock, answered with the voice of all, "Lord, to whom shall we go? Thou hast the words of eternal life." Pleasantly savored the Lord's flesh in his mouth. The Lord, however, expounded to them, and said, "It is the Spirit that quickeneth." After He had said, "Except a man eat my flesh, and drink my blood, he shall not have life in him," lest they should understand it carnally, He said, "It is the Spirit that quickeneth, but the flesh profiteth nothing: the words which I have spoken unto you are spirit and life."

This Nicodemus, who had come to Jesus by night, did not savor of this spirit and this life. Saith Jesus to him, "Except a man be born again, he shall not see the kingdom of God." And he, savoring of his own flesh, while as yet he savored not of the flesh of Christ in his mouth, saith, "How can a man be born a second time, when he is old? Can he enter a second time into his mother's womb, and be born?" This man knew but one birth, that from Adam and Eve; that which is from God and the Church he knew not yet: he knew only those parents that bring forth to death, knew not yet the parents that bring forth to life; he knew but the parents that bring forth successors, knew not yet the ever-living parents that bring forth those that shall abide.

Whilst there are two births, then, he understood only one. One is of the earth, the other of heaven; one of the flesh, the other of the Spirit; one of mortality, the other of eternity; one of male and female, the other of God and the Church. But these two are each single; there can be no repeating the one or the other. Rightly did Nicodemus understand the birth of the flesh; so understand thou also the birth of the Spirit, as Nicodemus understood the birth of the flesh. What did Nicodemus understand? "Can a man enter a second time into his mother's womb, and be born?" Thus, whosoever shall tell thee to be spiritually born a second time, answer in the words of Nicodemus, "Can a man enter a second time into his mother's womb, and be born?" I am already born of Adam, Adam cannot beget me a second time. I am already born of Christ, Christ cannot beget me again. As there is no repeating from the womb, so neither from baptism.

He that is born of the Catholic Church, is born, as it were, of Sarah, of the free woman; he that is born of heresy is, as it were, born of the bond woman, but of Abraham's seed. Consider, beloved, how great a mystery. God testifies, saying, "I am the God of Abraham, and the God of Isaac, and the God of Jacob." Were there not other patriarchs? Before these, was there not holy Noah, who alone of the whole human race, with all his house, was worthy to be delivered from the flood,-he in whom, and in his sons, the Church was prefigured? Borne by wood, they escaped the flood. Then afterwards great men whom we know, whom Holy Scriptures commends, Moses faithful in all his house. And yet those three are named, just as if they alone deserved well of him: "I am the God of Abraham, and the God of Isaac, and the God of Jacob: this is my name for ever." Sublime mystery! It is the Lord that is able to open both our mouth and your hearts, that we may speak as He has deigned to reveal, and that you may receive even as it is expedient for you.

The patriarchs, then, are these three, Abraham, Isaac, and Jacob. You know that the sons of Jacob were twelve, and thence the people Israel; for Jacob himself is Israel, and the people Israel in twelve tribes pertaining to the twelve sons of Israel. Abraham, Isaac, and Jacob three fathers, and one people. The fathers three, as it were in the beginning of the people; three fathers in whom the people was figured: and the former people itself the present people. For in the Jewish people was figured the Christian people. There a figure, here the truth; there a shadow, here the body: as the apostle says, "Now these things happened to them in a figure." It is the apostle's voice: "They were written," saith he, "for our sakes, upon whom the end of the ages is come." Let your mind now recur to Abraham, Isaac, and Jacob. In the case of these three, we find that free women bear children, and that bond women bear children: we find there offspring of free women, we find there also offspring of bond women. The bond woman signifies nothing good: "Cast out the bond woman," saith he, "and her son; for the son of the bond woman shall not be heir with the son of the free." The apostle recounts this; and he says that in those two sons of Abraham was a figure of the two Testaments, the Old and the New. To the Old Testament belong the lovers of temporal things, the lovers of the world: to the New Testament belong the lovers of eternal life. Hence, that Jerusalem on earth was the shadow of the heavenly Jerusalem, the mother of us all, which is in heaven; and these are the apostle's words. And of that city from which we are absent on our sojourn, you know much, you have now heard much. But we find a wonderful thing in these births, in these fruits of the womb, in these generations of free and bond women: namely, four sorts of men; in which four sorts is completed the figure of the future Christian people, so that what was said in the case of those three patriarchs is not surprising, "I am the God of Abraham, and the God of Isaac, and the God of Jacob." For in the case of all Christians, observe, brethren, either good men are born of evil men, or evil men of good; or good men of good, or evil men of evil: more than these four sorts you cannot find. These things I will again repeat: Give heed, keep them, excite your hearts, be not dull; take in, lest ye be taken, how of all Christians there are four sorts. Either of the good are born good, or of the evil, are born evil; or of the good are born evil, or of the evil good. I think it is plain. Of the good, good; if they who baptize are good, and also they who are baptized rightly believe, and are rightly numbered among the members of Christ. Of the evil, evil; if they who baptize are evil, and they who are baptized approach God with a double heart, and do not observe the morals which they hear urged in the Church, so as not to be chaff, but grain, there. How many such there are, you know, beloved. Of the evil, good; sometimes an adulterer baptizes, and he that is baptized is justified. Of the good, evil; sometimes they who baptize are holy, they who are baptized do not desire to keep the way of God.

I suppose, brethren, that this is known in the Church, and that what we are saying is manifest by daily examples; but let us consider these things in the case of our fathers before us, how they also had these four kinds. Of the good, good; Ananias baptized Paul. How of the evil, evil? The apostle declares that there were certain preachers of the gospel, who, he says, did not use to preach the gospel with a pure motive, whom, however, he tolerates in the Christian society, saying, "What then, notwithstanding every way, whether by occasion or in truth, Christ is preached, and in this I rejoice." Was he therefore malevolent, and did he rejoice in another's evil? No, but rejoiced because through evil men the truth was preached, and by the mouths of evil men Christ was preached. If these men baptized any persons like themselves, evil men baptized evil men: if they baptized such as the Lord admonishes, when He says, "Whatsoever they bid you, do; but do not ye after their works," they were evil men that were baptizing good. Good men baptized evil men, as Simon the sorcerer was baptized by Philip, a holy man. Therefore these four sorts, my brethren, are known. See, I repeat them again, hold them, count them, think upon them; guard against what is evil; keep what is good. Good men are born of good, when holy men are baptized by holy; evil men are born of evil, when both they that baptize and they that are baptized live unrighteously and ungodly; good men are born of evil, when they are evil that baptize, and they good that are baptized; evil men are born of good, when they are good that baptize, and they evil that are baptized.

How do we find this in these three names, "I am the God of Abraham, and the God of Isaac, and the God of Jacob"? We hold the bond women among the evil, and the free women among the good. Free women bear the good; Sarah bare Isaac: bond women bear the evil; Hagar bare Ishmael. We have in the case of Abraham alone the two sorts, both when the good are of the good, and also when the evil are of the evil. But where have we evil of good figured? Rebecca, Isaac's wife, was a free woman: read, She bare twins; one was good, the other evil. Thou hast the Scripture openly declaring by the voice of God, "Jacob have I loved, but Esau have I hated." Rebecca bare those two, Jacob and Esau: one of them is chosen, the other is reprobated; one succeeds to the inheritance, the other is disinherited. God does not make His people of Esau, but makes it of Jacob. The seed is one, those conceived are dissimilar: the womb is one, those born of it are diverse. Was not the free woman that bare Jacob, the same free woman that bare Esau? They strove in the mother's womb; and when they strove there, it was said to Rebecca," Two peoples are in thy womb." Two men, two peoples; a good people, and a bad people: but yet they strive in one womb. How many evil men there are in the Church! And one womb carries them until they are separated in the end: and the good cry out against the evil, and the evil in turn cry out against the good, and both strive together in the bowels of one mother. Will they be always together? There is a going forth to the light in the end; the birth which is here figured in a mystery is declared; and it will then appear that "Jacob have I loved, but Esau have I hated."

Accordingly we have now found, brethren, of the good, good-of the free woman, Isaac; and of the evil, evil-of the bond woman, Ishmael; and of the good, evil-of Rebecca, Esau: where shall we find of the evil, good? There remains Jacob, that the completion of these four sorts may be concluded in the three patriarchs. Jacob had for wives free women, he had also bond women: the free bear children, as do also the bond, and thus come the twelve sons of Israel. If you count them all, of whom they were born, they were not all of the free women, nor all of the bond women; but yet they were all of one seed. What, then, my brethren? Did not they who were born of the bond women possess the land of promise together with their brethren? We have there found good sons of Jacob born of bond women, and good sons of Jacob born of free women. Their birth of the wombs of bond women was nothing against them, when they knew their seed in the father, and consequently they held the kingdom with their brethren. Therefore, as in the case of Jacob's sons, that they were born of bond women did not hinder their holding the kingdom, and receiving the land of promise on an equality with their brothers; their birth of bond women did not hinder them, but the father's seed prevailed: so, whoever are baptized by evil men, appear as if born of bond women; nevertheless, because they are of the seed of the Word of God, which is figured in Jacob, let them not be cast down, they shall possess the inheritance with their brethren. Therefore, let him who is born of the good seed be without fear; only let him not imitate the bond woman, if he is born of a bond woman. Do not thou imitate the evil, proud, bond woman. For how came the sons of Jacob, that were born of bond women, to possess the land of promise with their brethren, whilst Ishmael, born of a bond woman, was cast out from the inheritance? How, but because he was proud, they were humble? He proudly reared his neck, and wished to seduce his brother while he was playing with him.

A great mystery is there. They were playing together, Ishmael and Isaac: Sarah sees them playing, and says to Abraham, "Cast out the bond woman and her son; for the son of the bond woman shall not be heir with my son Isaac." And when Abraham was sorrowful, the Lord confirmed to him the saying of his wife. Now here is evidently a mystery, that the event was somehow pregnant with something future. She sees them playing, and says, "Cast out the bond woman and her son." What is this, brethren? For what evil had Ishmael done to the boy Isaac, in playing with him? That playing was a mocking; that playing signified deception. Now attend, beloved, to this great mystery. The apostle calls it persecution; that playing, that play, he calls persecution: for he says, "But as then he that was born after the flesh, persecuted him that was born after the Spirit, so also now;" that is, they that are born after the flesh persecute them that are born after the Spirit. Who are born after the flesh? Lovers of the world, lovers of this life. Who are born after the Spirit? Lovers of the kingdom of heaven, lovers of Christ, men that long for eternal life, that worship God freely. They play, and the apostle calls it persecution. For after he said these words, "And as then he that was born after the flesh persecuted him that was born after the Spirit, so also now;" the apostle went on, and showed of what persecution, he was speaking: "But what says the Scripture? Cast out the bond woman and her son: for the son of the bond woman shall not be heir with my son Isaac." We search where the Scripture says this, to see whether any persecution on Ishmael's part against Isaac preceded this; and we find that this was said by Sarah when she saw the boys playing together. The playing which Scripture says that Sarah saw, the apostle calls persecution. Hence, they who seduce you by playing, persecute you the more. "Come," say they, "Come, be baptized here, here is true baptism for thee." Do not play, there is one true baptism; that other is play: thou wilt be seduced, and that will be a grievous persecution to thee. It were better for thee to make Ishmael a present of the kingdom; but Ishmael will not have it, for he means to play. Keep thou thy father's inheritance, and hear this: "Cast out the bond woman and her son; for the son of the bond woman shall not be heir with my son Isaac."

These men, too, dare to say that they are wont to suffer persecution from catholic kings, or from catholic princes. What persecution do they bear? Affliction of body: yet if at times they have suffered, and how they suffered, let themselves know, and settle it with their consciences; still they suffered only affliction of body: the persecution which they cause is more grievous. Beware when Ishmael wishes to play with Isaac, when he fawns on thee, when he offers another baptism: answer him, I have baptism already. For if this baptism is true, he who would give thee another would be mocking thee. Beware of the persecution of the soul. For though the party of Donatus has at times suffered somewhat at the hands of catholic princes, it was a bodily suffering, not the suffering of spiritual deception. Hear and see in the very facts of Old Testament history all the signs and indications of things to come. Sarah is found to have afflicted her maid Hagar: Sarah is free. After her maid began to be proud, Sarah complained to Abraham, and said, "Cast out the bond woman;" she has lifted her neck against me. His wife complains of Abraham, as if it were his doing. But Abraham, who was not bound to the maid by lust, but by the duty of begetting children, inasmuch as Sarah had given her to him to have offspring by her, says to her: "Behold, she is thy handmaid; do unto her as thou wilt." And Sarah grievously afflicted her, and she fled from her face. See, the free woman afflicted the bond woman, and the apostle does not call that a persecution; the slave plays with his master, and he calls it persecution: this afflicting is not called persecution; that playing is. How does it appear to you, brethren? Do you not understand what is signified? Thus, then, when God wills to stir up powers against heretics, against schismatics, against those that scatter the Church, that blow on Christ as if they abhorred Him, that blaspheme baptism, let them not wonder; because God stirs them up, that Hagar may be beaten by Sarah. Let Hagar know herself, and yield her neck: for when, after being humiliated, she departed from her mistress, an angel met her, and said to her, "What is the matter with thee, Hagar, Sarah's handmaid?" When she complained of her mistress, what did she hear from the angel? "Return to thy mistress." It is for this that she is afflicted, that she may return; and would that she may return, for her offspring, just like the sons of Jacob, will obtain the inheritance with their brethren.

But they wonder that Christian powers are roused against detestable scatterers of the Church. Should they not be moved, then? How otherwise should they give an account of their rule to God? Observe, beloved, what I say, that it concerns Christian kings of this world to wish their mother the Church, of which they have been spiritually born, to have peace in their times. We read Daniel's visions and prophetical histories. The three children praised the Lord in the fire: King Nebuchadnezzar wondered at the children praising God, and at the fire around them doing them no harm: and whilst he wondered, what did King Nebuchadnezzar say, he who was neither a Jew nor circumcised, who had set up his own image and compelled all men to adore it; but, impressed by the praises of the three children when he saw the majesty of God present in the fire what said he? "And I will publish a decree to all tribes and tongues in the whole earth." What sort of decree? "Whosoever shall speak blasphemy against the God of Shadrach, Meshach, and Abednego, shall be cut off, and their houses shall be made a ruin." See how an alien king acts with raging indignation that the God of Israel might not be blasphemed, because He was able to deliver the three children from the fire: and yet they would not have Christian kings to act with severity when Christ is contemptuously rejected, by whom not three children, but the whole world, with these very kings, is delivered from the fire of hell! For those three children, my brethren, were delivered from temporal fire. Is He not the same God who was the God of the Maccabees and the God of the three children? The latter He delivered from the fire; the former did in body perish in the torments of fire, but in mind they remained steadfast in the ordinances of the law. The latter were openly delivered, the former were crowned in secret. It is a greater thing to be delivered from the flame of hell than from the furnace of a human power. If, then, Nebuchadnezzar praised and extolled and gave glory to God because He delivered three children from the fire, and gave such glory as to send forth a decree throughout his kingdom, "Whosoever shall speak blasphemy against the God of Shadrach, Meshach, and Abednego, shall be cut off, and their houses shall be brought to ruin," how should not these kings be moved, who observe, not three children delivered from the flame, but their very selves delivered from hell, when they see Christ, by whom they have been delivered, contemptuously spurned in Christians, when they hear it said to a Christian, "Say that thou art not a Christian"? Men are willing to do such deeds, but they do not wish to suffer, at all events, such punishments.

For see what they do and what they suffer. They slay souls, they suffer in body: they cause everlasting deaths, and yet they complain that they themselves suffer temporal deaths. And yet what deaths do they suffer? They allege to us some martyrs of theirs in persecution. See, Marculus was hurled headlong from a rock; see, Donatus of Bagaia was thrown into a well. When have the Roman authorities decreed such punishments as casting men down rocks? But what do those of our party reply? What was done I know not; what however do ours tell?That they flung themselves headlong and cast the infamy of it upon the authorities. Let us call to mind the custom of the Roman authorities, and see to whom we are to give credit. Our men declare that those men cast themselves down headlong. If they are not the very disciples of those men, who now cast themselves down precipices, while no man persecutes them, let us not credit the allegation of our men: what wonder if those men did what these are wont to do? The Roman authorities never did employ such punishments: for had they not the power to put them to death openly? But those men, while they wished to be honored when dead, found not a death to make them more famous. In short, whatever the fact was, I do not know. And even if thou hast suffered corporal affliction, O party of Donatus, at the hand of the Catholic Church, as an Hagar thou hast suffered it at the hand of Sarah; "return to thy mistress." A point which it was indeed necessary to discuss has detained us somewhat too long to be at all able to expound the whole text of the Gospel Lesson. Let this suffice you in the meantime, beloved brethren, lest, by speaking of other matters, what has been spoken might be shut out from your hearts. Hold fast these things, declare such things; and while yourselves are inflamed, go your way thither, and set on fire them that are cold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"

[[commentary]]
quote='''
We observe, beloved, that the intimation with which we yesterday excited your attention has brought you together with more alacrity, and in greater number than usual; but meanwhile let us, if you please, pay our debt of a discourse on the Gospel Lesson, which comes in due course. You shall then hear, beloved, as well what we have already effected concerning the peace of the Church, and what we hope yet further to accomplish. For the present, then, let the whole attention of your hearts be given to the gospel; let none be thinking of anything else. For if he who attends to it wholly apprehends with difficulty, must not he who divides himself by diverse thoughts let go what he has received? Moreover, you remember, beloved, that on the last Lord's day, as the Lord deigned to help us, we discoursed of spiritual regeneration. That lesson we have caused to be read to you again, so that what was then left unspoken, we may now, by the aid of your prayers in the name of Christ, fulfill.

Spiritual regeneration is one, just as the generation of the flesh is one. And Nicodemus said the truth when he said to the Lord that a man cannot, when he is old, return again into his mother's womb and be born. He indeed said that a man cannot do this when he is old, as if he could do it even were he an infant. But be he fresh from the womb, or now in years, he cannot possibly return again into the mother's bowels and be born. But just as for the birth of the flesh, the bowels of woman avail to bring forth the child only once, so for the spiritual birth the bowels of the Church avail that a man be baptized only once. Therefore, in case one should say, "Well, but this man was born in heresy, and this in schism:" all that was cut away, if you remember what was debated to you about our three fathers, of whom God willed to be called the God, not that they were thus alone but because in them alone the figure of the future people was made up in its completeness. For we find one born of a bond woman disinherited, one born of a free woman made heir: again, we find one born of a free woman disinherited, one born of a bond woman made heir. Ishmael, born of a bond woman, disinherited; Isaac, born of a free woman, made heir: Esau, born of a free woman, disinherited; the sons of Jacob, born of bond women, made heirs. Thus, in these three fathers the figure of the whole future people is seen: and not without reason God saith, "I am the God of Abraham, and the God of Isaac, and the God of Jacob: this," saith He, "is my name for ever." Rather let us remember what was promised to Abraham himself: for this was promised to Isaac, and also to Jacob. What do we find? "In thy seed shall all nations be blessed." At that time the one man believed what as yet he saw not: men now see, and are blinded. What was promised to the one man is fulfilled in the nations; and they who will not see what is already fulfilled, are separating themselves from the communion of the nations. But what avails it them that they will not see? See they do, whether they will or no; the open truth strikes against their closed eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"

[[commentary]]
quote='''
No man can return into his mother's bowels and be born again. But some one is born of a bond woman? Well, did they who were born of bond women at the former time, return into the wombs of the free to be born anew? The seed of Abraham was in Ishmael also; but that Abraham might have a son of the bond maid, it was at the advice of his wife. The child was of the husband's seed, not of the womb, but at the sole pleasure of the wife. Was his birth of a bond woman the reason why he was disinherited? Then, if he was disinherited because he was the son of a bond woman, no sons of bond women would be admitted to the inheritance. The sons of Jacob were admitted to the inheritance; but Ishmael was put out of it, not because born of a bond woman, but because he was proud to his mother, proud to his mother's son; for his mother was Sarah rather than Hagar. The one gave her womb, the other's will was added: Abraham would not have done what Sarah willed not: therefore was he Sarah's son rather. But because he was proud to his brother, proud in playing, that is, in mocking him; what said Sarah? "Cast out the bond woman and her son; for the son of the bond woman shall not be heir with my son Isaac." It was not, therefore, the bowels of the bond woman that caused his rejection, but the slave's neck. For the free-born is a slave if he is proud, and, what is worse, the slave of a bad mistress, of pride itself. Thus, my brethren, answer the man, that a man cannot be born a second time; answer fearlessly, that a man cannot be born a second time. Whatever is done a second time is mockery, whatever is done a second time is play. It is Ishmael playing, let him be cast out. For Sarah observed them playing, saith the Scripture, and said to Abraham, "Cast out the bond woman and her son." The playing of the boys displeased Sarah. She saw something strange in their play. Do not they who have sons like to see them playing? She saw and disapproved it. Something or other she saw in their play; she saw mockery in it, observed the pride of the slave; she was displeased with it, and she cast him out. The children of bond women, when wicked, are cast out; and the child of the free woman, when an Esau, is cast out. Let none, therefore, presume on his birth of good parents; let none presume on his being baptized by holy men. Let him that is baptized by holy men still beware lest he be not a Jacob, but an Esau. This would I say then, brethren, it is better to be baptized by men that seek their own and love the world, which is what the name of bond woman imports, and to be spiritually seeking the inheritance of Christ, so as to be as it were a son of Jacob by a bond woman, than to be baptized by holy men and to become proud, so as to be an Esau to be cast out, though born of a free woman. Hold ye this fast, brethren. We are not coaxing you, let none of your hope be in us; we flatter neither ourselves nor you; every man bears his own burden. It is our duty to speak, that we be not judged unhappily: yours to hear, and that with the heart, lest what we give be required of you; nay, that when it is required, it may be found a gain, not a loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"
