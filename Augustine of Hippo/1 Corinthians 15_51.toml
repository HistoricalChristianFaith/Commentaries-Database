[[commentary]]
quote='''
The pious people will be raised as they transform the remnants of the "old man" that cling to them into the "new man." The impious people who have kept the "old man" from the beginning to the end will be raised in order to be precipitated into the second death. Those who read diligently can make out the divisions of the ages. They have no horror of tares or chaff.
'''
source_url=''
source_title="ON TRUE RELIGION 27.50"

[[commentary]]
quote='''
Let them see therefore here their punishments; before that there cometh that resurrection, when in flesh rising again they shall not be changed. “For all we shall rise again, but not all we shall be changed.” For they shall have the corruption of the flesh wherein to be pained, not that wherein to die: otherwise even those pains would be ended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
