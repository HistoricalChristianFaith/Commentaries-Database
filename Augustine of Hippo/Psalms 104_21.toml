[[commentary]]
quote='''
“The lion’s whelps roaring after their prey, do seek their meat from God” (ver. 21). Justly then our Lord, when nigh unto His going down, the very Sun of Righteousness recognising His going down, said to His disciples, as if darkness being about to come, the lion would roam about to seek whom he might devour, that that lion could devour no man, unless with leave: “Simon,” said He, “this night Satan hath desired to have you, that he may sift you as wheat. But I have prayed for thee, that thy faith fail not.” When Peter thrice denied, was he not already between the lion’s teeth?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
