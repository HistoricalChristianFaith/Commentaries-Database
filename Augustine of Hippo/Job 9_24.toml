[[commentary]]
quote='''
Lastly, wherefore did He leave His own Son in “the hands of the ungodly”? Here also, if thou wouldest have all the limbs of thy inner man made strong, remove the covering of the roof, and find thy way to the Lord. Hear what another Scripture, foreseeing our Lord’s future suffering at the hands of the ungodly, saith. What saith it? “The earth is given into the hands of the wicked.” What is meant by “earth” being “given into the hands of the ungodly”? The delivering of the flesh into the hands of the persecutors. But God did not leave “His righteous One” there: from the flesh, which was taken captive, He leads forth the soul unconquered.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
