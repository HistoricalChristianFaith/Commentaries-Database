[[commentary]]
quote='''
In praises of God, in confessions of sins, in hymns and in songs, in prayers, “There is a multitude of the sound of waters. The clouds have uttered a voice” (ver. 17). Thence that sound of waters, thence the troubling of the abysses, because “the clouds have uttered a voice.” What clouds? The preachers of the word of truth. What clouds? Those concerning which God doth menace a certain vineyard, which instead of grape had brought forth thorns and He saith, “I will command My clouds, that they rain no rain upon it.” In a word, the Apostles forsaking the Jews, went to the Gentiles: in preaching Christ among all nations, “the clouds have uttered a voice.” “For Thine arrows have gone through.” Those same voices of the clouds He hath again called arrows. For the words of the Evangelists were arrows. For these things are allegories. For properly neither an arrow is rain, nor rain is an arrow: but yet the word of God is both an arrow because it doth smite; and rain because it doth water. Let no one therefore any longer wonder at the troubling of the abysses, when “Thine arrows have gone through.” What is, “have gone through”? They have not stopped in the ears, but they have pierced the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
