[[commentary]]
quote='''
So long therefore as here we are, this let us ask of God, that He thrust not from us our supplication, and His mercy, that is, that we pray continually, and He continually pity. For many become feeble in praying, and in the newness of their own conversion pray fervently, afterwards feebly, afterwards coldly, afterwards negligently: as if they have become secure. The foe watcheth: thou sleepest. The Lord Himself hath given commandment in the Gospel, how “it behoveth men always to pray and not to faint.” And he giveth a comparison from that unjust judge, who neither feared God, nor regarded man, whom that widow daily importuned to hear her; and he yielded for weariness, that was not influenced by pity: and the naughty judge saith to himself, “Though neither God I fear, nor men I regard, even because of the weariness which this widow daily putteth upon me, I will hear her cause, and will avenge her.” And the Lord saith, “If a naughty judge hath done this, shall not your Father avenge His chosen, that to Him do cry day and night? Yea, I say unto you, He shall make judgment of them speedily.” Therefore let us not faint in prayer. Though He putteth off what He is going to grant, He putteth it not away: being secure of His promise, let us not faint in praying, and this is by His goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"

[[commentary]]
quote='''
The whole Church therefore is one widow, whether in men or in women, in married men or married women, in young men or in old, or in virgins: the whole Church is one widow, desolate in this world, if she feel this, if she is aware of her widowhood: for then is help at hand for her. Do ye not recognise this widow in the Gospel, my brethren, when the Lord declared “that men ought always to pray and not to faint”? “There was in a city a judge,” He said, “which feared not God, neither regarded man. And there was a widow in that city; and she came unto him day by day, saying, Avenge me of mine adversary.” The widow, by daily importunity, prevailed with him: for the judge said within himself, “Though I fear not God; neither regard man, yet because this woman troubleth me, I will avenge her.” If the wicked judge heard the widow, that he might not be molested; heareth not God His Church, whom He exhorteth to pray?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
