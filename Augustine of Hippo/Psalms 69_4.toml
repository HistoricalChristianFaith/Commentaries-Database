[[commentary]]
quote='''
Thus “there have been multiplied above the hairs of My head they that hate Me gratis” (ver. 4). How multiplied? So as that they might add to themselves even one out of the twelve. “There have been multiplied above the hairs of My head they that hate Me for nought.” With the hairs of His head He hath compared His enemies. With reason they were shorn when in the place of Calvary He was crucified. Let the members accept this voice, let them learn to be hated gratis. For now, O Christian, if it must needs be that the world hate thee, why dost thou not make it hate thee gratis, in order that in the Body of thy Lord and in this Psalm sent before concerning Him, thou mayest acknowledge thy own voice? How shall it come to pass that the world hate thee gratis? If thou no wise hurtest any one, and art still hated: for this is gratis, without cause…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
