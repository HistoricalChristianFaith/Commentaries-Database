
[[commentary]]
quote='''
The nation of the Jews hath just so remained as a fleece dry upon the ground. For this, ye know, happened in a certain miracle, the ground was dry, the fleece only was wet, yet rain in the fleece appeared not. So also the mystery of the New Testament appeared not in the nation of the Jews. What there was the fleece, is here the veil. For in the fleece was veiled the mystery. But on the ground, in all the nations open lieth Christ’s Gospel; the rain is manifest, the Grace of Christ is bare, for it is not covered with a veil. But that the rain might come out of it, the fleece was pressed. For by pressure they from themselves excluded Christ, and the Lord now from His clouds raineth on the ground, the fleece hath remained dry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"

[[commentary]]
quote='''
In a certain nation were hidden the Law and the Prophets, “all the words of Thy mouth:” in the Jewish nation alone were “all the words of Thy mouth,” the nation which the Apostle praiseth, saying, “What advantage hath the Jew? Much every way; chiefly because that unto them were committed the oracles of God.” These were the words of God.…What meant Gideon’s fleece? It is like the nation of the Jews in the midst of the world, which had the grace of sacraments, not indeed openly manifested, but hidden in a cloud, or in a veil, like the dew in the fleece. The time came when the dew was to be manifested in the floor; it was manifested, no longer hidden. Christ alone is the sweetness of dew: Him alone thou recognisest not in Scripture, for whom Scripture was written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"
