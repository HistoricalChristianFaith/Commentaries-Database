[[commentary]]
quote='''
(Tract. xlviii. 11) To lay hold of Him, not by faith and the understanding, but with bloodthirsty violence. Do thou so lay hold of Him, that thou mayest have sure hold; they would fain have laid hold on Him, but they could not: for it follows, But He escaped out of their hand. They did lay hold of Him with the hand of faith. It was no great matter for the Word to rescue His flesh from the hands of flesh.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Therefore they sought to apprehend Him." Would they had apprehended by faith and understanding, not in wrath and murder! For now, my brethren, when I speak thus, it is the weak one wishing to apprehend what is strong, the small what is great, the fragile what is solid; and it is we ourselves-both you who are of the same matter as I am, and I myself who speak to you-who all wish to apprehend Christ. And what is it to apprehend Him? [If] thou hast understood, thou hast apprehended. But not as did the Jews: thou hast apprehended in order to possess, they wished to apprehend in order to make away with Him. And because this was the kind of apprehension they desired, what did He do to them? "He escaped out of their hands." They failed to apprehend Him, because they lacked the hand of faith. The Word was made flesh; but it was no great task to the Word to rescue His own flesh from fleshy hands. To apprehend the Word in the mind, is the right apprehension of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"
