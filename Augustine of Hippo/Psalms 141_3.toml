[[commentary]]
quote='''
…“Set, O Lord, a watch before my mouth, and a door of restraint around my lips” (ver. 3). He said not a barrier of restraint, but “a door of restraint.” A door is opened as well as shut. If then it be a “door,” let it be both opened and shut; opened, to confession of sin; closed, to excusing sin. So will it be a “door of restraint,” not of ruin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"

[[commentary]]
quote='''
It is certain that it is we that act when we act; but it is He who makes us act, by applying efficacious powers to our will, who has said, "I will make you to walk in my statutes, and to observe my judgments, and to do them." When he says, "I will make you . . . to do them," what else does He say in fact than, "I will take away from you your heart of stone," from which used to arise your inability to act, "and I will give you a heart of flesh," in order that you may act? And what does this promise amount to but this: I will remove your hard heart, out of which you did not act, and I will give you an obedient heart, out of which you shall act? It is He who causes us to act, to whom the human suppliant says, "Set a watch, O Lord, before my mouth." That is to say: Make or enable me, O Lord, to set a watch before my mouth,—a benefit which he had already obtained from God who thus described its influence: "I set a watch upon my mouth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 32"
