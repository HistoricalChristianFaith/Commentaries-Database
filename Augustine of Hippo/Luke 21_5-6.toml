[[commentary]]
quote='''
The future signs that are foretold in the Gospel according to Luke are the same as those in Matthew and Mark. These three tell how the Lord answered his disciples. They asked him when the events that he had foretold of the destruction of the temple would happen. They also asked him what was to be the sign of his coming and of the end of the world. There is no discrepancy in the Gospels as to facts, although one tells one detail that another passes over or describes differently. They rather supplement each other when they are compared, and they thus give direction to the mind of the reader. It would take too long to discuss them all now. The Lord answered their questions by telling what was to happen from that time on: the destruction of Jerusalem that prompted their inquiry, and his coming in the church in which he does not cease to dwell until the end. Christ is recognized when he comes to his own, while his members are daily born. He said of this coming, "Hereafter you shall see the Son of man coming in the clouds."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 199"

[[commentary]]
quote='''
Matthew proceeds with his history in the following terms: "And Jesus went out and departed from the temple; and His disciples came to Him for to show Him the buildings of the temple. And Jesus said unto them, See ye all these things? Verily I say unto you, There shall not be left here one stone upon another which shall not be thrown down." This incident is related also by Mark, and nearly in the same order. But he brings it in after a digression of some small extent, which is made with a view to mention the case of the widow who put the two mites into the treasury, which occurrence is recorded only by Mark and Luke. For [in proof that Mark's order is essentially the same as Matthew's, we need only notice that] in Mark's version also, after the account of the Lord's discussion with the Jews on the occasion when He asked them how they held Christ to be David's son, we have a narrative of what He said in warning them against the Pharisees and their hypocrisy,—a section which Matthew has presented on the amplest scale, introducing into it a larger number of the Lord's sayings on that occasion. Then after this paragraph, which has been handled briefly by Mark, and treated with great fulness by Matthew, Mark, as I have said, introduces the passage about the widow who was at once so extremely poor, and yet abounded so remarkably. And finally, without interpolating anything else, he subjoins a section in which he comes again into unison with Matthew,—namely, that relating to the destruction of the temple. In like manner, Luke first states the question which was propounded regarding Christ, as to how He was the son of David, and then mentions a few of the words which were spoken in cautioning them against the hypocrisy of the Pharisees. Thereafter he proceeds, as Mark does, to tell the story of the widow who cast the two mites into the treasury. And finally he appends the statement, which appears also in Matthew and Mark, on the subject of the destined overthrow of the temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 76"
