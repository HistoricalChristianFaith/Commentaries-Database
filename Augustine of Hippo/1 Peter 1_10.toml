[[commentary]]
quote='''
This is that very “salvation,” Brethren, concerning which, as the Apostle Peter saith, “Prophets have enquired diligently,” and though they have enquired diligently, yet have not found it. But they searched into it, and foretold of it; while we have come and have found what they sought for. And see, we ourselves too have not as yet received it; and after us shall others also be born, and shall find, what they also shall not receive, and shall pass away, that we may, all of us together, receive the “penny of salvation in the end of the day,” with the Prophets, the Patriarchs, and the Apostles. For you know that the hired servants, or labourers, were taken into the vineyard at different times; yet did they all receive their wages on an equal footing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
