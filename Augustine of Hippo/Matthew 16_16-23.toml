[[commentary]]
quote='''
Did not Peter draw near, when he said, “Thou art the Christ, the Son of the Living God”? And yet the same man became afar off by saying, “Be it far from Thee, Lord; this shall not be unto Thee.” Lastly, what said He, his Neighbour, as it were, to him drawing near? “Blessed art thou, Simon, Barjona.” To him afar off, as it were, and unlike, what said He? “Get thee behind Me, Satan.” To him drawing near, “Flesh and blood,” saith He, “hath not revealed it unto thee, but My Father, which is in Heaven.” His Light is shed over thee, in His Light thou shinest. But when having become afar off, he spake against the Lord’s Passion, which should be for our Salvation, “Thou savourest not,” said He, “the things that be of God, but those that be of men.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
