[[commentary]]
quote='''
(ap. Aug. non occ. sed ap. Bed. ubi sup.) If however He, as one Who knew the present and the future wills of men, knew that they would proclaim Him the more in proportion as He forbade them, why did He give them this command? If it were not that He wished to prove to men who are idle, how much more joyfully, with how much greater obedience, they whom He commands to proclaim Him should preach, when they who were forbidden could not hold their peace.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Mark continues in these terms: "And He said unto them, Come ye apart into a desert place, and rest a while;" and so on, down to the words, "But the more He charged them, so much the more a great deal they published it; and were beyond measure astonished, saying, He hath done all things well: He maketh both the deaf to hear, and the dumb to speak." In all this there is nothing which presents the appearance of any want of harmony between Mark and Luke; and the whole of the above we have already considered, when we were comparing these evangelists with Matthew. At the same time, we must make sure that no one shall suppose that the last statement, which I have cited here from Mark's Gospel, is in antagonism with the entire body of the evangelists, who, in reporting most of His other deeds and words, make it plain that He knew what went on in men; that is to say, that their thoughts and desires could not be concealed from Him. Thus John puts it very clearly in the following passage: "But Jesus did not commit Himself unto them, because He knew all men, and needed not that any should testify of man; for He knew what was in man." But what wonder is it that He should discern the present thoughts of men, if He announced beforehand to Peter the thought which he was to entertain in the future, but which he certainly had not then, at the very time when he was boldly declaring himself ready to die for Him, or with Him? This being the case, then, how can it fail to appear as if this knowledge and foreknowledge, which He possessed in so supreme a measure, is contradicted by Mark's statement, "He charged them that they should tell no man: but the more He charged them, so much the more a great deal they published it"? For if He, as one who held in His own knowledge all the intentions of men, both present and future was aware that they would publish it all the more the more He charged them not to publish it, what purpose could He have in giving them such a charge? Well, but may not the explanation be this, that he desired to give backward ones to understand how much more zealously and fervently they ought to preach on whom He lays the commission to preach, if even men who were interdicted were unable to keep silent?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 4"
