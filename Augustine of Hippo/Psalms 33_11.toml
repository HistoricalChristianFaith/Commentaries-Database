[[commentary]]
quote='''
“But the counsel of the Lord standeth for ever;” but the counsel of the Lord, whereby He maketh none blessed but him that submitteth unto Himself, standeth for ever. The thoughts of His Heart to all generations” (ver. 11): the thoughts of His Wisdom are not mutable, but endure to all generations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
