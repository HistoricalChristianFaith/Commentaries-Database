[[commentary]]
quote='''
He then adds: "After this, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst. Now there was set a vessel full of vinegar: and they filled a sponge with vinegar, and fixed it upon hyssop, and put it to His mouth. When Jesus therefore had received the vinegar, He said, It is finished: and He bowed His head, and gave up the ghost." Who has the power of so adjusting what he does, as this Man had of arranging all that He suffered? But this Man was the Mediator between God and men; the Man of whom we read in prophecy, He is man also, and who shall acknowledge Him for the men who did such things acknowledged not this Man as God. For He who was manifest as man, was hid as God: He who was manifest suffered all these things, and He Himself also, who was hid, arranged them all. He saw, therefore, that all was accomplished that required to be done before He received the vinegar, and gave up the ghost; and that this also might be accomplished which the scripture had foretold, "And in my thirst they gave me vinegar to drink," He said, "I thirst:" as if it were, One thing still you have failed to do, give me what you Are. For the Jews were themselves the vinegar, degenerated as they were from the wine of the patriarchs and prophets; and filled like a full vessel with the wickedness of this world, with hearts like a sponge, deceitful in the formation of its cavernous and tortuous recesses. But the hyssop, whereon they placed the sponge filled with vinegar, being a lowly herb, and purging the heart, we fitly take for the humility of Christ Himself; which they thus enclosed, and imagined they had completely ensnared. Hence we have it said in the psalm, "Thou shalt purge me with hyssop, and I shall be cleansed." For it is by Christ's humility that we are cleansed; because, had He not humbled Himself, and became obedient unto the death of the cross, His blood certainly would not have been shed for the remission of sins, or, in other words, for our cleansing.

Nor need we be disturbed with the question, how the sponge could be applied to His mouth when He was lifted up from the earth on the cross. For as we read in the other evangelists, what is omitted by this one, it was fixed on a reed, so that such drink as was contained in the sponge might be raised to the highest part of the cross. By the reed, however, the scripture was signified, which was fulfilled by this very act. For as a tongue is called either Greek or Latin, or any other, significant of the sound, which is uttered by the tongue; so the reed may give its name to the letter which is written with a reed. We most usually, however, call those tongues that express the sounds of the human voice: while in calling scripture a reed, the very rareness of the thing only enhances the mystical nature of that which it symbolizes. A wicked people did such things, a compassionate Christ suffered them. They who did them, knew not what they did; but He who suffered, not only knew what was done, and why it was so, but also wrought what was good through those who were doing what was evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520119.html'
source_title="Tractates on John 119"

[[commentary]]
quote='''
And when He was on the Cross, “I thirst,” He said, although they gave not to Him that for which He was thirsting. For for themselves He was thirsting: but they gave vinegar, not new wine, wherewith are filled up the new bottles, but old wine, but old to its loss. For old vinegar also is said of the old men, of whom hath been said, “For to them is no changing;” namely, that the Jebusites should be overthrown, and Jerusalem be builded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"

[[commentary]]
quote='''
His fasting was, when there fell away all they that had believed in Him; because also it was His hunger, that men should believe in Him: because also it was His thirst, when He said to the woman, I thirst, “give Me to drink:” yea for her faith He was thirsting. And from the Cross when He was saying, “I thirst,” He was seeking the faith of them for whom He had said, “Father, forgive them, for they know not what they do.” But what did those men give to drink to Him thirsty? Vinegar. Vinegar is also called old. With reason of the old man they gave to drink, because they willed not to be new. Why willed they not to become new? Because to the title of this Psalm whereon is written, “For them that shall be changed,” they belonged not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"

[[commentary]]
quote='''
Matthew next makes this statement: "And straightway one of them ran, and took a sponge, and filled it with vinegar, and put it on a reed, and gave Him to drink." Mark presents it in a similar form: "And one ran, and filled a sponge full of vinegar, and put it on a reed, and gave Him to drink, saying, Let alone; let us see whether Elias will come to take Him down." Matthew, however, has represented these words about Elias to have been spoken, not by the person who offered the sponge with the vinegar, but by the rest. For his version runs thus: "But the rest said, Let be; let us see whether Elias will come to save Him;"—from which, therefore, we infer that both the man specially referred to and the others who were there expressed themselves in these terms. Luke, again, has introduced this notice of the vinegar previous to his report of the robber's insolence. He gives it thus: "And the soldiers also mocked Him, coming to Him, and offering Him vinegar, and saying, If thou be the King of the Jews, save thyself." It has been Luke's purpose to embrace in one statement what was done and what was said by the soldiers. And we ought to feel no difficulty in the circumstance that he has not said explicitly that it was "one" of them who offered the vinegar. For, adopting a method of expression which we have discussed above, he has simply put the plural number for the singular. Moreover, John has also given us an account of the vinegar, where he says: "After this, Jesus, knowing that all things were now accomplished, that the Scripture might be fulfilled, said, I thirst. Now there was set a vessel full of vinegar: and they filled a sponge with vinegar, and put it upon hyssop, and put it to His mouth." But although the said John thus informs us that Jesus said "I thirst," and also mentions that there was a vessel full of vinegar there, while the other evangelists leave these things unspecified, there is nothing to marvel at in this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 17"
