[[commentary]]
quote='''
Now there was, no doubt, a decided merit in the Apostle Paul, but it was an evil one, while he persecuted the Church, and he says of it: "I am not meet to be called an apostle, because I persecuted the Church of God." And it was while he had this evil merit that a good one was rendered to him instead of the evil; and, therefore, he went on at once to say, "But by the grace of God I am what I am." Then, in order to exhibit also his free will, he added in the next clasue, "And His grace within me was not in vain, but I have laboured more abundantly than they all." This free will of man he appeals to in the case of others also, as when he says to them, "We beseech you that ye receive not the grace of God in vain." Now, how could he so enjoin them, if they received God's grace in such a manner as to lose their own will? Nevertheless, lest the will itself should be deemed capable of doing any good thing without the grace of God, after saying, "His grace within me was not in vain, but I have laboured more abundantly than they all," he immediately added the qualifying clause, "Yet not I, but the grace of God which was with me." In other words, Not I alone, but the grace of God with me. And thus, neither was it the grace of God alone, nor was it he himself alone, but it was the grace of God with him. For his call, however, from heaven and his conversion by that great and most effectual call, God's grace was alone, because his merits, though great, were yet evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 12"
