[[commentary]]
quote='''
“They have prevented Me in the day of My affliction” (ver. 18). They have first injured Me, in the time when I am bearing a mortal and toilsome body. “And the Lord hath become My stay.” And since the stay of earthly pleasure was disturbed and torn up by the bitterness of misery, the Lord hath become My stay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
