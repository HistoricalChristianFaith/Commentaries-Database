[[commentary]]
quote='''
And because God, when he created him, was certainly not ignorant of his future malignity, and foresaw the good which he Himself would bring out of his evil, therefore says the psalm, "This leviathan whom Thou hast made to be a sport therein," that we may see that, even while God in his goodness created him good, he yet had already foreseen and arranged how he would make use of him when he became wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252011.html'
source_title="City of God 11.17"


[[commentary]]
quote='''
There is a passage, too, in the Book of Job, of which the devil is the subject: "This is the beginning of the creation of God, which he made to be a sport to his angels," which agrees with the psalm, where it is said, "There is that dragon which Thou hast made to be a sport therein." But these passages are not to lead us to suppose that the devil was originally created to be the sport of the angels, but that he was doomed to this punishment after his sin. His beginning, then, is the handiwork of God; for there is no nature, even among the least, and lowest, and last of the beasts, which was not the work of Him from whom has proceeded all measure, all form, all order, without which nothing can be planned or conceived. How much more, then, is this angelic nature, which surpasses in dignity all else that he has made, the handiwork of the Most High!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252011.html'
source_title="City of God 11.15"


[[commentary]]
quote='''
“There shall go the ships” (ver. 26). Lo, ships float upon that which alarmed you, and sink not. By ships we understand churches; they go among the storms, among the tempests of temptations, among the waves of the world, among the beasts, both small and great. Christ on the wood of His cross is the Pilot. “There shall go the ships.” Let not the ships fear, let them not much mind where they float, but by Whom they are steered. “There shall go the ships.” What voyage do they find tedious, when they feel that Christ is their Pilot? They will sail safely, let them sail diligently, they will reach their promised haven, they will be led to the land of rest.

There is also in that sea somewhat which transcends all creatures, great and small. What is this? Let us hear the Psalm: “There is that Leviathan, whom Thou hast formed to make sport of him.” There are creeping things innumerable, both small and great beasts; there shall the ships go, and shall not fear, not only the creeping things innumerable, and beasts both small and great, but not even the serpent which is there; “whom Thou,” he speaketh unto God, “hast made to make sport of him.” This is a great mystery; and yet I am about to utter what ye already know. Ye know that a certain serpent is the enemy of the Church: ye have not seen him with the eyes of the flesh, but ye see him with the eyes of faith.…

This serpent then, our ancient enemy, glowing with rage, cunning in his wiles, is in the mighty sea. “Here is that Leviathan, whom Thou hast formed to make sport of him.” Do thou now make sport of the serpent: for for this end was this serpent made. He falling by his own sin from the sublime realms of the heavens, and made devil instead of angel, received a certain region of his own in this mighty and spacious sea. What thou thinkest his kingdom, is his prison. For many say: wherefore hath the devil received so great power, that he may rule in this world, and prevaileth so much, can do so much? How much prevaileth he? How much can he do? Unless by permission, he can do nothing. Do thou so act, that he may not be allowed to attack thee; or if he be allowed to tempt thee, he may depart vanquished, and may not gain thee. For he hath been allowed to tempt some holy men, servants of God: they overcame him, because they departed not from the way, they whose heel he watched, fell not.…

He then, my brethren, who doth wish to watch the serpent’s head, and safely to pass this sea; for it must be that this serpent dwelleth here, and, as I had commenced saying, the devil when he fell from heaven received this region; let him watch his head, on the part of the fear of the world, and of the lusts of the world. For it is hence that he suggesteth some object of fear or of desire; he trieth thy love, or thy fear. If thou fearest hell, and lovest the kingdom of God, thou wilt watch his head.…“There is no power but of God.” What then fearest thou? Let the dragon be in the waters, let the dragon be in the sea: thou art to pass through it. He is made so as to be made sport of, he is ordained to inhabit this place, this region is given him. Thou thinkest that this habitation is a great thing for him, because thou knowest not the dwellings of the angels whence he fell: what seemeth to thee his glory, is his damnation.

…What then fearest thou? Perhaps he is about to try thy flesh: it is the scourge of thy Lord, not the power of thy tempter. His wish is to injure that salvation which is promised: but he is not allowed: but that he may not be allowed, have Christ for thy Head: repel the serpent’s head: consent not unto his suggestion, slip not from thy path. “There is that Leviathan, whom Thou hast made to make sport of him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
