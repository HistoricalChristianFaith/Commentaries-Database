[[commentary]]
quote='''
What then have all those deaths of the martyrs accomplished? Listen: “As the fatness of the earth is spread over the earth, our bones have been scattered beside the pit” (ver. 7). “The bones” of the martyrs, that is, the bodies of the witnesses of Christ. The martyrs were slain, and they who slew them seemed to prevail. They prevailed by persecution, that the words of Christ might prevail by preaching. And what was the result of the deaths of the saints? What meaneth, “the fatness of the earth is spread over the earth”? We know that everything that is refuse is the fatness of the earth. The things which are, as it were, contemptible to men, enrich the earth.…“Precious in the sight of the Lord is the death of His saints.” As it is contemptible to the world, so is it precious to the husbandman. For he knoweth the use thereof, and its rich juice; he knoweth what he desireth, what he seeketh, whence the fertile crop ariseth; but this world despiseth it. Know ye not that “God hath chosen the contemptible things of the world, and those which are not, like as those which are, that the things which are may be brought to nought”? From the dunghill was Peter lifted up, and Paul; when they were put to death, they were despised: now, the earth having been enriched by them, and the cross of the Church springing up, behold, all that is noble and chief in the world, even the emperor himself, cometh to Rome, and whither does he hasten? to the temple of the emperor, or the memorial of the fisherman?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
