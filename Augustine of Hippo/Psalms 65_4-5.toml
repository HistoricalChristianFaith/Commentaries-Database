[[commentary]]
quote='''
“Thy holy Temple is marvellous in righteousness” (ver. 5). These are the good things of that House. He hath not said, Thy holy Temple is marvellous in pillars, marvellous in marbles, marvellous in gilded ceilings; but is “marvellous in righteousness.” Without thou hast eyes wherewith thou mayest see marbles, and gold: within is an eye wherewith may be seen the beauty of righteousness. If there is no beauty in righteousness, why is a righteous old man loved? What bringeth he in body that may please the eyes? Crooked limbs, brow wrinkled, head blanched with gray hairs, dotage everywhere full of plaints. But perchance because thine eyes this decrepit old man pleaseth not, thine ears he pleaseth: with what words? with what song? Even if perchance when a young man he sang well, all with age hath been lost. Doth perchance the sound of his words please thine ears, that can hardly articulate whole words for loss of teeth? Nevertheless, if righteous he is, if another man’s goods he coveteth not, if of his own that he possesseth he distributeth to the needy, if he giveth good advice, and soundly judgeth, if he believeth the entire faith, if for his belief in the faith he is ready to expend even those very shattered limbs, for many Martyrs are even old men; why do we love him? What good thing in him do we see with the eyes of the flesh? Not any. There is therefore a kind of beauty in righteousness, which we see with the eye of the heart, and we love, and we kindle with affection: how much men found to love in those same Martyrs, though beasts tare their limbs! Is it possible but that when blood was staining all parts, when with the teeth of monsters their bowels gushed out, the eyes had nothing but objects to shudder at? What was there to be loved, except that in that hideous spectacle of mangled limbs, entire was the beauty of righteousness? These are the good things of the House of God, with these prepare thyself to be satisfied.…“Blessed they which hunger and thirst after righteousness, for they shall be filled.” “Thy holy Temple is marvellous in righteousness.” And that same temple, brethren, do not imagine to be aught but yourselves. Love ye righteousness, and ye are the Temple of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"
