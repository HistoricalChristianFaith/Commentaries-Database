[[commentary]]
quote='''
These words men say, but ofttimes they are so bound, that to fly they are not able. For perchance they are not bound with any birdlime, but are bound by duty. But if they are bound with care and duty, and to leave it are unable, let them say, “I was wishing to be dissolved and to be with Christ, for it is by far the best thing: to abide in the flesh is necessary because of you.” A dove bound back by affection, not by cupidity, was not able to fly away because of duty to be fulfilled, not because of little merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
