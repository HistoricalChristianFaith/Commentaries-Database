[[commentary]]
quote='''
“Health,” he saith, “is far from the ungodly: for they regard not Thy righteousnesses” (ver. 155). This separateth thee, that what they have not done, thou hast done, that is, thou hast regarded the righteousnesses of God. But “what hast thou that thou hast not received?” Art thou not he who a little before didst say, “I will keep Thy righteousnesses”? Thou therefore hast received from Him, unto whom thou didst call, the power to keep them. He therefore doth Himself separate thee from those from whom health is far, because they have not regarded the righteousnesses of God.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
