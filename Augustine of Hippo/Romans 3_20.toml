[[commentary]]
quote='''
When he says: Because no flesh shall be justified in the law before him; for through the law comes knowledge of sin, and other similar things which some think must be raised as a reproach against the law, these must be read carefully enough, so that neither may the law seem to be disapproved by the Apostle, nor may free will be taken away from man. So let us distinguish these four stages of man: before the law, under the law, under grace, in peace. Before the law we follow the concupiscence of the flesh; under the law we are dragged by it; under grace we neither follow it nor are dragged by it; in peace there is no concupiscence of the flesh. Before the law, then, we do not fight, because we not only lust and sin, but even approve of our sins. Under the law we fight, but we are conquered; for we confess that the things we do are evil, and by confessing them to be evil, we certainly do not wish to do them, but because grace is not yet present, we are overcome. In this stage it is shown to us how we lie prostrate, and while we wish to rise and yet fall, we are more grievously afflicted. Hence it is said here: The law entered in secretly, that sin might abound. Hence too what is now set down: For through the law comes knowledge of sin—for it is not the removal of sin, since sin is removed by grace alone. The law, therefore, is good, because it forbids the things that ought to be forbidden and commands the things that ought to be commanded. But when anyone thinks to fulfill it by his own strength, and not through the grace of his Liberator, this presumption profits him nothing; indeed, it even harms him so much that he is both swept away by a more vehement desire for sin and is found to be a transgressor in his sins as well. For where there is no law, neither is there transgression. So then, lying thus prostrate, when anyone recognizes that he cannot rise by himself, let him implore the help of the Liberator. Grace, therefore, comes, which forgives past sins, and helps him as he strives, and bestows the love of righteousness, and takes away fear. And when this happens, although certain desires of the flesh, while we are in this life, fight against our spirit to lead it into sin, yet the spirit, not consenting to these desires, because it is fixed in the grace and love of God, ceases to sin. For we do not sin in the evil desire itself, but in our consent. To this pertains what the same Apostle says: Let not sin therefore reign in your mortal body, so as to obey its desires. For by this he shows that there are desires by not obeying which we do not allow sin to reign in us. But since these desires arise from the mortality of the flesh, which we draw from the first sin of the first man, from whom we are born carnally, they will not come to an end until, by the resurrection of the body, we attain that transformation which is promised to us, where there will be perfect peace, when we shall be established in the fourth stage. And it will be perfect peace, because nothing will resist us when we do not resist God. This is what the Apostle says: The body indeed is dead because of sin, but the spirit is life because of righteousness. If, then, the Spirit of him who raised Jesus from the dead dwells in you, he who raised Jesus Christ from the dead will also give life to your mortal bodies through his Spirit dwelling in you. Free will, therefore, existed perfectly in the first man; but in us, before grace, there is no free will so that we may not sin, but only so that we may not wish to sin. But grace brings it about that we not only wish to do right but also are able to, not by our own strength but by the help of the Liberator, who will also grant us perfect peace in the resurrection—which perfect peace follows upon good will. For, Glory to God in the highest, and on earth peace to men of good will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
Let us, however, read, and by the Lord's help understand, what the apostle tells us: "Because by the deeds of the law there shall no flesh be justified in His sight; for by the law is the knowledge of sin." Observe, he says "the knowledge," not "the destruction," of sin. But when a man knows sin, and grace does not help him to avoid what he knows, undoubtedly the law works wrath. And this the apostle explicitly says in another passage. His words are: "The law worketh wrath." The reason of this statement lies in the fact that God's wrath is greater in the case of the transgressor who by the law knows sin, and yet commits it; such a man is thus a transgressor of the law, even as the apostle says in another sentence, "For where no law is, there is no transgression."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 22"
