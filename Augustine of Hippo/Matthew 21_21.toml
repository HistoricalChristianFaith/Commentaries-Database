[[commentary]]
quote='''
(Quæst. Ev. i. 29.) Or, this is to be said by each servant of God in his own case respecting the mountain of pride, to cast it from him. Or, because by Jews the Gospel was preached, the Lord Himself, who is called the mount, is by the Jews cast among the Gentiles as into a sea.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Lord truly said to His disciples, “If ye have faith as a grain of mustard seed, ye shall say to this mountain, Be Thou removed, and be Thou cast into the sea, and it shall be done.” Haply “to this mountain,” He said of Himself; for He is called a Mountain: “It shall come to pass in the last days, that the mountain of the Lord shall be manifest.” But this Mountain is placed above other mountains; because the Apostles also are mountains, supporting this Mountain. Therefore followeth, “In the last days the Mountain of the Lord shall be manifest, established in the top of the mountains.” Therefore passeth It the tops of all mountains, and on the top of all mountains is It placed; because the mountains are preaching The Mountain. But the sea signifieth this world, in comparison of which sea, like earth seemed the nation of the Jews. For it was not covered over with the bitterness of idolatry, but, like dry land, was surrounded with the bitterness of the Gentiles as with sea. It was to be, that the earth be confounded, that is, that nation of the Jews; and that the mountains be carried into the heart of the sea, that is, first that great Mountain established in the top of the mountains. For He deserted the nation of the Jews, and came among the Gentiles. He was carried from the earth into the sea. Who carrying Him? The Apostles, to whom He had said, “If ye have faith as a grain of mustard seed, ye shall say to this mountain, Be thou removed, and be thou cast into the sea, and it shall be done:” that is, through your most faithful preaching it shall come to pass, that this mountain, that is, I Myself, be preached among the Gentiles, be glorified among the Gentiles, be acknowledged among the Gentiles, and that be fulfilled which was predicted of Me, “A people whom I have not known shall serve Me.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
