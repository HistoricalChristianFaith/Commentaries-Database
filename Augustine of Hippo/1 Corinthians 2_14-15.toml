[[commentary]]
quote='''
It remains, therefore, for us, so far as my capacity to apprehend it goes, to understand Jesus as having promised that He would cause His disciples, from being carnal and natural, to become spiritual, although not yet such as we shall be, when a spiritual body shall also be ours; but such as was he who said, "We speak wisdom among them that are perfect;" and, "I could not speak unto you as unto spiritual, but as unto carnal;" and, "We have received, not the spirit of the world, but the Spirit who is of God; that we might know the things that are freely given to us of God. Which things also we speak, not in the words which man's wisdom teacheth, but which the Spirit teacheth; comparing spiritual things with spiritual. But the natural man perceiveth not the things of the Spirit of God." And thus the natural man, perceiving not the things of the Spirit of God, hears in such a way whatever is told him of the nature of God, that he can conceive of nothing else but some bodily form, however spacious or immense, however lustrous and magnificent, yet still a body: and therefore he holds as proverbs all that is said of the incorporeal and immutable substance of wisdom; not that he accounts them as proverbs, but that his thoughts follow the same direction as those who habitually listen to proverbs without understanding them. But when the spiritual man begins to discern all things, and he himself is discerned by no man, he perceives, even though in this life it still be through a glass and in part, not by any bodily sense, and not by any imaginative conception which catches at or devises the likenesses of all sorts of bodies, but by the clearest understanding of the mind, that God is not material, but spiritual: in such a way does the Son show us openly of the Father, that He, who thus shows, is also Himself seen to be of the same substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520102.html'
source_title="Tractates on John 102"
