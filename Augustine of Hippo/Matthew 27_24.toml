[[commentary]]
quote='''
(de Cons. Ev. iii. 8.) Pilate many times pleaded with the Jews, desiring that Jesus might be released, which Matthew witnesses in very few words, when he says, Pilate seeing that he could prevail nothing, but that rather a tumult was made. He would not have spoken thus, if Pilate had not striven much, though how many efforts he made to release Jesus he does not mention.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Again Mark goes on, "Then Pilate said unto them Why, what evil hath he done? And they cried out the more exceedingly, Crucify him." Matthew has not recorded this passage; but he has introduced the statement, "When Pilate saw that he could prevail nothing, but that rather a tumult was made," and has also informed us how he washed his hands before the people with the view of declaring himself innocent of the blood of that just person (a circumstance not reported by Mark and the others). And thus he has also shown us with all due plainness how the governor dealt with the people with the intention of securing His release. This has been briefly referred to by Mark, when he tells us that Pilate said, "Why, what evil hath he done?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"

[[commentary]]
quote='''
In accordance with his own plan, however, Luke makes the above digression with the view of telling what occurred with Herod; and after that he reverts to the history of what took place in the governor's presence. Thus he now continues as follows: "And Pilate, when he had called together the chief priests and the rulers and the people, said unto them, Ye have brought this man unto me as one that perverteth the people: and, behold, I having examined him before you, have found no fault in this man touching those things whereof ye accuse him." Here we notice that he has omitted to mention how Pilate asked the Lord what answer He had to make to His accusers. Thereafter he proceeds in these terms: "No, nor yet Herod: for I sent you to him: and, lo, nothing worthy of death is done unto him. I will therefore chastise him and release him. For of necessity he must release one unto them at the feast. And they cried out all at once, saying, Away with this man, and release unto us Barabbas; who for a certain sedition made in the city, and for murder, was cast into prison. Pilate, therefore, willing to release Jesus, spake again to them. But they cried, saying, Crucify him, crucify him. And he said unto them the third time, Why, what evil hath he done? I have found no cause of death in him: I will therefore chastise him and let him go. And they were instant with loud voices, requiring that He might be crucified; and the voices of them prevailed." The repeated effort which Pilate, in his desire to accomplish the release of Jesus, thus made to gain the people's consent, is satisfactorily attested by Matthew, although in a very few words, when he says, "But when Pilate saw that he could prevail nothing, but that rather a tumult was made." For he would not have made such a statement at all, had not Pilate exerted himself earnestly in that direction, although at the same time he has not told us how often he made such attempts to rescue Jesus from their fury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
