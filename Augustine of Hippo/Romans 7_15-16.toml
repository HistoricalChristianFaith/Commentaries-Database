[[commentary]]
quote='''
When he says: For what I will, that I do not, but what I hate, that I do. But if I do what I do not will, I consent to the law, that it is good—the law is indeed sufficiently defended from every accusation; but care must be taken lest anyone suppose that by these words free will is taken from us, which is not so. For now a man is described as placed under the law before grace; for at that time he is conquered by sins, while he tries to live justly by his own strength without the help of God's liberating grace. But by free will he has it to believe in the Liberator and to receive grace, so that now, with him who bestows it liberating and helping, he does not sin, and thus ceases to be under the law, but is with the law or in the law, fulfilling it by the love of God, which he could not do by fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
