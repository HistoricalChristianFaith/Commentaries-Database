[[commentary]]
quote='''
Let us hear what followeth: “I have promised to keep Thy law.” What meaneth, “My portion, O Lord: I have promised to keep Thy law” (ver. 57); save because the Lord will be each man’s portion then, when he hath kept His law? Consider therefore what he subjoineth: “I entreated Thy face, with my whole heart:” and saying in what manner he prayed: “O be merciful,” he saith, “unto me, according to Thy word” (ver. 58).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
