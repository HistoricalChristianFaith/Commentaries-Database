
[[commentary]]
quote='''
Therefore the Prophet saith unto these great and small, the mountains and the little hills, the rams and the young sheep, what followeth: “Ye are the blessed of the Lord, who made heaven and earth” (ver. 15). As if he should say, Ye are the blessed of the Lord, who made the heaven in the great, earth in the small: not this visible heaven, studded with luminaries which are objects to these eyes. For “The heaven of heavens is the Lord’s” (ver. 16); who hath elevated the minds of some saints to such a height, that they became teachable by no man, but by God Himself; in comparison of which heaven, whatever is discerned with carnal eyes is to be called earth; which “He hath given to the children of men;” that when it is contemplated, whether in that region which illumineth above, as that which is called heaven, or in that which is illumined beneath, which is properly called earth (since in comparison with that which is called heaven of heaven, the whole, as we have said, is earth;) the whole therefore of this earth He hath given to the children of men, that by the consideration of it, as far as they can, they may conceive of the Creator, whom with their yet weak hearts they cannot see without that aid to their conception.

…But nevertheless since they derive the truth and richness of wisdom, not from man nor through man, but through God Himself, they have received little ones who shall be heaven, that they may know that they are heaven of heaven; as yet however earth, unto which they say, “I have planted, Apollos watered, but God gave the increase.” For to those very sons of men whom He made heaven, He who knoweth how to provide for the earth through heaven, hath given earth upon which they work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520115.html'
source_title="Exposition on Psalm 115"
