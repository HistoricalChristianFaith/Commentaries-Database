
[[commentary]]
quote='''
If such faith is within. there is Christ groaning; for if there is faith in us, Christ is in us. For what else says the apostle: "That Christ may dwell in your hearts by faith." Therefore thy faith in Christ is Christ Himself in thy heart. This is why He slept in the ship; and why, when His disciples were in danger and already on the verge of shipwreck, they came to Him and awoke Him. Christ arose, laid His commands on the winds and waves, and there ensued a great calm. So also with thee; the winds enter thy heart, that is, where thou sailest, where thou passest along this life as a stormy and dangerous sea; the winds enter, the billows rise and toss thy vessel. What are the winds? Thou hast received some insult, and art wroth: that insult is the wind; that anger, the waves. Thou art in danger, thou preparest to reply, to render cursing for cursing, and thy vessel is already nigh to shipwreck. Awake the Christ who is sleeping. For thou art in commotion, and making ready to render evil for evil, because Christ is sleeping in thy vessel. For the sleep of Christ in thy heart is the forgetfulness of faith. But if thou arousest Christ, that is, recallest thy faith, what dost thou hear said to thee by Christ, when now awake in thy heart? I [He says] have heard it said to me, "Thou hast a devil," and I have prayed for them. The Lord hears and suffers; the servant hears and is angry! But thou wishest to be avenged. Why so? I am already avenged. When thy faith so speaks to thee, command is exercised, as it were, over the winds and waves, and there is a great calm. As, then, to awaken Christ in the vessel is just to awaken faith; so in the heart of one who is pressed down by a great mass and habit of sin, in the heart of the man who has been a transgressor even of the holy gospel and a despiser of eternal punishment, let Christ groan, let such a man betake himself to self-accusation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"

[[commentary]]
quote='''
Perchance thy ship is being troubled, because He in thee is sleeping. The sea was raging, the bark wherein the disciples were sailing was being tossed; but Christ was sleeping: at length it was seen by them that among them was sleeping the Ruler and Creator of winds; they drew near and awoke Christ; He commanded the winds, and there was a great calm. With reason then perchance thy heart is troubled, because thou hast forgotten Him on whom thou hast believed: beyond endurance thou art suffering, because it hath not come into thy mind what for thee Christ hath borne. If unto thy mind cometh not Christ, He sleepeth: awake Christ, recall faith. For then in thee Christ is sleeping, if thou hast forgotten the sufferings of Christ: then in thee Christ is watching, if thou hast remembered the sufferings of Christ. But when with full heart thou shalt have considered what He hath suffered, wilt not thou too with equanimity endure? and perchance rejoicing, because thou hast been found in some likeness of the sufferings of thy King. When therefore on these things thinking thou hast begun to be comforted and to rejoice, He hath arisen, He hath commanded the winds; therefore there is a great calm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
