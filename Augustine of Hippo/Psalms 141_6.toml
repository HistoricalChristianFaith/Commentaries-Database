[[commentary]]
quote='''
See what followeth: “their judges have been swallowed up beside the Rock” (ver. 6). What is, “swallowed up beside the Rock? That Rock was Christ. They have been swallowed up beside the Rock.” “Beside,” that is, compared, as judges, as mighty, powerful, learned: they are called “their judges,” as judging about morals, and laying down their opinions. This Aristotle said. Set him beside the Rock, and he is swallowed up. Who is Aristotle? let him hear, “Christ hath said,” and he trembleth among the dead. This Pythagoras said, that Plato said. Set them beside the Rock, compare their authority to the authority of the Gospel, compare the proud to the Crucified. Say we to them “Ye have written your words in the hearts of the proud; He hath planted His Cross in the hearts of kings: finally, He died, and rose again; ye are dead, and I will not ask how ye rise again.” So “their judges have been swallowed up beside” that “Rock.” So long do their words seem somewhat, till they are compared with the Rock. Therefore if any of them be found to have said what Christ too hath said, we congratulate him, but we follow him not. But he came before Christ. If any man speak what is true, is he therefore before the Truth itself? Regard Christ, O man, not when He came to thee, but when He made thee. The sick man too might say, “But I took to my bed before the physician came to me.” Why, for that very reason has He come last, because thou first has sickened.

“They shall hear My Words, for they have prevailed.” My Words have prevailed over their words. They have spoken clever things, I true things. To praise one who talketh well is one thing, to praise One who speaketh truth is another. “They shall hear My Words, for they have prevailed.” How have they prevailed? Who of them has been taken offering sacrifice, when such things were forbidden by the law, and has not denied it? Who of them has been taken worshipping an idol, and has not exclaimed, “I did it not,” and feared lest he should be convicted? Such servants hath the devil. But how have the Words of the Lord prevailed? “Behold, I send you forth as sheep in the midst of wolves. Fear not those who kill the body,” etc. He gave them fear, He suggested hope, He kindled love. “Fear not death,” He saith. Do ye fear death? I die first. Fear ye, lest a hair of your head perish? I first rise again in the flesh uninjured. Rightly have ye heard His Words, for they have prevailed. They spake, and were slain; they fell, and yet stood. And what was the result of so many deaths of martyrs, save that those words prevailed, and the earth being, so to speak, watered by the blood of Christ’s witnesses, the cross of the Church shot up everywhere? How have they “prevailed”? We have said already, when they were preached by men who feared not. Feared not what? Neither banishment, nor losses, nor death, nor crucifixion: for it was not death alone that they did not fear; but even crucifixion, a death than which none was thought more accursed. It the Lord endured, that His disciples might not only not fear death, but not even that kind of death. When then these things are said by men that fear not, they have prevailed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
