[[commentary]]
quote='''
Hitherto in this section of the Gospel, whereon we are discoursing to-day, the tenor of everything has been, I may say, of easy understanding: a much closer attention is needful in connection with the words that follow. For what does He mean by the words, "And in that day ye shall ask me nothing"? The verb to ask, used here, means not only to beg of, but also to question; and the Greek Gospel, of which this is a translation, has a word that may also be understood in both senses, so that by it the ambiguity is not removed; and even though it were so, every difficulty would not thereby disappear. For we read that the Lord Christ, after He rose again, was both questioned and petitioned. He was asked by the disciples, on the eve of His ascension into heaven, when He would be manifested, and when the kingdom of Israel would come; and even when already in heaven, He was petitioned [asked] by St. Stephen to receive his spirit. And who dare either think or say that Christ ought not to be asked, sitting as He does in heaven, and yet was asked while He abode on earth? or that He ought not to be asked in His state of immortality, although it was men's duty to ask Him while still in His state of subjection to death? Nay, beloved, let us ask Him to untie with His own hands the knot of our present inquiry, by so shining into our hearts that we may perceive what He saith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520101.html'
source_title="Tractates on John 101"
[[commentary]]
quote='''
We have now to consider these words of the Lord, "Verily, verily, I say unto you, If ye shall ask anything of the Father in my name, He will give it you." It has already been said in the earlier portions of this discourse of our Lord's, on account of those who ask some things of the Father in Christ's name and receive them not, that there is nothing asked of the Father in the Saviour's name that is asked in contrariety to the method of salvation. For it is not the sound of the letters and syllables, but what the sound itself imports, and what is rightly and truly to be understood by that sound, that He is to be regarded as declaring, when He says, "in my name." Hence, he who has such ideas of Christ as ought not to be entertained of the only Son of God, asketh not in His name, even though he may not abstain from the mention of Christ in so many letters and syllables; since it is only in His name he asketh, of whom he is thinking when he asketh. But he who has such ideas of Him as ought to be entertained, asketh in His name, and receiveth what he asketh, if he asketh nothing that is contrary to his own everlasting salvation. And he receiveth it when he ought to receive it. For some things are not refused, but are delayed till they can be given at a suitable time. In this way, surely, we are to understand His words, "He will give you," so that thereby we may know that those benefits are signified which are properly applicable to those who ask. For all the saints are heard effectively in their own behalf, but are not so heard in behalf of all besides, whether friends or enemies, or any others: for it is not said in a general kind of way, "He will give;" but, "He will give you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520102.html'
source_title="Tractates on John 102"
