[[commentary]]
quote='''
(Serm. in Mont. in fin.) Otherwise; Rain, when it is put to denote any evil, is understood as the darkness of superstition; rumours of men are compared to winds; the flood signifies the lust of the flesh, as it were flowing over the land, and because what is brought on by prosperity is broken off by adversity. None of these things does he fear who has his house founded upon a rock, that is, who not only hears the command of the Lord, but who also does it. And in all these he submits himself to danger, who hears and does not. For no man confirms in himself what the Lord commands, or himself hears, but by doing it. But it should be noted, that when he said, He that heareth these words of mine, He shows plainly enough that this sermon is made complete by all those precepts by which the Christian life is formed, so that with good reason they that desire to live according to them, may be compared to one that builds on a rock.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And who is safe, unless he who builds upon the rock? And what saith the Lord Himself? "He that heareth these my words, and doeth them, I will liken him unto a wise man building his house upon a rock" (he doth not yield to temptation). "The rain descended, the floods came, the winds blew, and beat upon that house; and it fell not: for it was founded upon a rock. But he that heareth my words, and doeth them not" (now let each one of us fear and beware), "I will liken him to a foolish man, who built his house upon the sand: the rain descended, the floods came, the winds blew, and beat upon that house; and it fell: and great was the fall of it." What profit is it to enter the Church for him who builds upon the sand? For, by hearing and not doing, he builds indeed, but on the sand. For if he hears nothing, he builds nothing; but if he hears, he builds. But we ask, Where? For if he hears and does, he builds upon the rock; if he hears and does not, he builds upon the sand. There are two kinds of builders, those building upon the rock, and those building upon the sand. What, then, are those who do not hear? Are they safe? Does He say that they are safe because they do not build? They are naked beneath the rains, before the winds, before the floods; when these come, they carry away: those persons before they overthrow the houses. It is then the only security, both to build, and to build upon the rock. If thou wilt hear and do not, thou buildest; but thou buildest a ruin: and when temptation comes it overthrows the house, and carries away thee with the ruin. But if thou dost not hear, thou art naked; thou thyself art dragged away by those temptations. Hear, then, and do; it is the only remedy. How many, perchance, on this day, by hearing and not doing, are hurried away on the stream of this festival! For, through hearing and not doing, the flood cometh, this annual festival; the torrent is filled, it will pass away and become dry, but woe to him whom it shall carry away! Know this, then, beloved, that unless a man hears and does, he builds not upon the rock, and he does not belong to that great name which the Lord so commended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
