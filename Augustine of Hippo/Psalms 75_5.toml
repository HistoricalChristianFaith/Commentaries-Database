[[commentary]]
quote='''
If you say that, you will not be singing to no purpose, "I said, Lord, have mercy on me; heal my soul, for I have sinned against you." If God is blamed for the evil that you do and you take credit for the good, then you are speaking wickedly against God. Listen to what the psalm has to say on this point: "Do not lift your horn on high or speak wickedly against God." The iniquity you were speaking against God is this, that you were wishing to attribute everything good to yourself and everything bad to him. By lifting up the horn of pride, you were speaking wickedly against God. With humility you speak justly. And what is the equity you speak with humility? "I said, Lord, have mercy on me; heal my soul, for I have sinned against you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252016B.html'
source_title="SERMON 16B.2"

[[commentary]]
quote='''
“Be not therefore lifted up: speak not iniquity against God” (ver. 5).…What saith He in another Psalm? “These things thou hast done,” having enumerated certain sins. “These things thou hast done,” He saith, “and was silent.” What is, “I was silent”? He is never silent with commandment, but meanwhile He is silent with punishment: He is keeping still from vengeance, He doth not pronounce sentence against the condemned. But this man saith thus, I have done such and such things, and God hath not taken vengeance; behold I am whole, nought of ill hath befallen me. “These things thou hast done, and I was silent: thou hast suspected iniquity, that I shall be like unto thee.” What is, “that I shall be like unto thee”? Because thou art unjust, even Me thou hast deemed unjust; as though an approver of thy misdeeds, and no adversary, no avenger thereof. And what afterwards saith He to thee? “I will convict thee, and will set thee before thine own face”? What is this? Because now by sinning behind thy back thou settest thyself, seest not thyself, examinest not thyself; I will set thee before thyself, and will bring upon thee punishment from thyself. So also here, “Speak not iniquity against God.” Attend. Many men speak this iniquity; but dare not openly, lest as blasphemers they be abhorred by godly men: in their heart they gnaw upon these things, within they feed upon such impious food; it delighteth them to speak against God, and if they break not out with tongue, in heart they are not silent. Whence in another Psalm is said, “The fool hath said in his heart, There is no God.” The fool hath said, but he hath feared men: he would not say it where men might hear; and he said it in that place where He might Himself hear concerning whom he said it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
