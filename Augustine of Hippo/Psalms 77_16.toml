[[commentary]]
quote='''
And he continueth how? “The waters have seen Thee, O God, and they have feared and the abysses have been troubled” (ver. 16). What are the waters? The peoples. What are these waters hath been asked in the Apocalypse, the answer was, the peoples. There we find most clearly waters put by a figure for peoples. But above he had said, “Thou hast made known in the peoples Thy virtue.” With reason therefore, “the waters have seen Thee, and they have feared.” They have been changed because they have feared. What are the abysses? The depths of waters. What man among the peoples is not troubled, when the conscience is smitten? Thou seekest the depth of the sea, what is deeper than human conscience? That is the depth which was troubled, when God redeemed with His arm His people. In what manner were the abysses troubled? When all men poured forth their consciences in confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
