[[commentary]]
quote='''
In what way do those who make themselves sureties for others, express themselves? What is it that they say? “I repay it: I take it upon myself. It is to me you are giving it.” Do we then suppose that God also says this, “I take it on Myself. It is unto me thou givest it”? Assuredly, if Christ be God, of which there is no doubt, He hath Himself said, “I was an hungred, and ye gave Me meat.” And when they said unto Him, “When saw we Thee hungry?” that He might show Himself to be the Surety for the poor, that He answers for all His members, that He is the Head, they the members, and that when the members receive, the Head receiveth also; He says, “Inasmuch as ye have done it to one of the least of these that belong to Me, ye have done it unto Me.” Come, thou covetous usurer, consider what thou hast given; consider what thou art to receive. Hadst thou given a small sum of money, and he to whom thou hadst given it were to give thee for that small sum a great villa, worth incomparably more money than thou hadst given, how great thanks wouldest thou render, with how great joy wouldest thou be transported! Hear what possession He to whom thou hast been lending bestows. “Come, ye blessed of My Father, receive”—What? The same that they have given? God forbid! What you gave were earthly things, which, if you had not given them, would have become corrupted on earth. For what could you have made of them, if you had not given them? That which on earth would have been lost, has been preserved in heaven. Therefore what we are to receive is that which hath been preserved. It is thy desert that hath been preserved, thy desert hath been made thy treasure. For consider what it is that thou art to receive. Receive—“the kingdom prepared for you from the foundation of the world.” On the other hand, what shall be their sentence, who would not “lend”? “Go ye into everlasting fire, prepared for the devil and his angels.” And what is the kingdom which we receive called? Consider what follows: “And these shall go into everlasting burning; but the righteous into life eternal.” Make interest for this; purchase this. Give your money on usury to earn this. You have Christ throned in heaven, begging on earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
