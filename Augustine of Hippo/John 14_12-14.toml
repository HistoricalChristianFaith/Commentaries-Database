[[commentary]]
quote='''
But what is this that follows? "Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also; and greater works than these shall he do; because I go unto my Father. And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son. If ye shall ask anything in my name, I will do it." And so He promised that He Himself would also do those greater works. Let not the servant exalt himself above his Lord, or the disciple above his Master. He says that they will do greater works than He doeth Himself; but it is all by His doing such in or by them, and not as if they did them of themselves. Hence the song that is addressed to Him, "I will love Thee, O Lord, my strength." But what, then, are those greater works? Was it that their very shadow, as they themselves passed by, healed the sick? For it is a mightier thing for a shadow, than for the hem of a garment, to possess the power of healing. The one work was done by Christ Himself, the other by them; and yet it was He that did both. Nevertheless, when He so spake, He was commending the efficacious power of His own words: for it was in this sense He had said, "The words that I speak unto you, I speak not of myself; but the Father that dwelleth in me, He doeth the works." What works was He then referring to, but the words He was speaking? They were hearing and believing, and their faith was the fruit of those very words: howbeit, when the disciples preached the gospel, it was not small numbers like themselves, but nations also that believed; and such, doubtless, are greater works. And yet He said not, Greater works than these shall ye do, to lead us to suppose that it was only the apostles who would do so; for He added, "He that believeth on me, the works that I do shall he do also; and greater works than these shall he do." Is the case then so, that he that believeth on Christ doeth the same works as Christ, or even greater than He did? Points like these are not to be treated in a cursory way, nor ought they to be hurriedly disposed of; and, therefore, as our present discourse must be brought to a close,we are obliged to defer their further consideration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252071.html'
source_title="Tractates on John 71"
