[[commentary]]
quote='''
…“Forget not,” he saith, “all His rewards:” not awards, but “rewards.” For something else was due, and what was not due hath been paid. Whence also these words: “What,” he asketh, “shall I reward the Lord for all His rewards unto me?” Thou hast rewarded good with evil; He rewardeth evil with good. How hast thou, O man, rewarded thy God with evil for good? Thou who hast once been a blasphemer, and a persecutor, and injurious, hast rewarded blasphemies. For what good things? First, because thou art: but a stone also is. Next, because thou livest: but a brute also liveth. What reward wilt thou give the Lord, for His having created thee above all the cattle; and above all the fowls of the air, in His image and likeness? Seek not how to reward Him: give back unto Him His own image: He requireth no more; He demandeth His own coin.…

Think thou, soul, of all the rewards of God, in thinking over all thy wicked deeds: for as many as are thy sins, so many are His rewards of good. And what present, what offering, what sacrifice, canst thou ever tender unto Him?…What wilt thou reward the Lord with? For thou wast reflecting, and couldest not find: “I will receive the cup of salvation.” What? hath not the Lord Himself given the cup of salvation? Reward Him from thine own, if thou canst. I would say, No, do it not; reward Him not from thine own; God doth not will to be rewarded from thine own. If thou rewardest Him from thine own, thou rewardest sin. For all that thou hast thou hast from Him: sins only thou hast of thine own. He doth not wish to be rewarded from thine, He doth will from His own. Just as, if thou shouldest bring to a husbandman, from the land which he hath sown, an ear of wheat, thou hast rewarded him from the husbandman’s own produce; if thorns, that hast offered him of thine own. Reward truth, in truth praise the Lord: if thou shalt choose to reward Him from thine own, thou wilt lie. He who speaketh a lie, speaketh of his own. If he who speaketh a lie, speaketh of his own: so he who speaketh truth, speaketh of the Lord’s. But what is to receive the cup of salvation, but to imitate the Passion of our Lord?…I will receive the cup of Christ, I will drink of our Lord’s Passion. Beware that thou fail not. But, “I will call upon the Name of the Lord.” They then who failed, called not upon the Lord; they presumed in their own strength. Do thou so return, as remembering that thou art returning what thou hast received. So then let thy soul bless the Lord, as not to forget all His rewards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
