[[commentary]]
quote='''
(Tr. xix. s. 14) None if the founders of false religious sects have been able to deny the resurrection of the soul, but many have denied the resurrection of the body; and, unless Thou, Lord Jesus, hadst declared it, what answer could we give the gainsayer? To set forth this truth, He says, Marvel not at this; (i. e. that He hath given power to the Son of man to execute judgment,) for the hour is coming, &c.

(de Ver. Dom. Ser. 64) He does not add, And now is, here; because this hour would be at the end of the world. Marvel not, i. e. marvel not, men will all be judged by a man. But what men? Not those only, whom He will find alive, For the hour cometh, in which all that are in their graves shall hear His voice.

(Sup. Joan. Tr. xix. s. 17, 18) What can be plainer? Men's bodies are in their graves, not their souls. Above when He said, The hour cometh, and added, and now is; He proceeds, When the dead shall hear the voice of the Son of God. He does not say, All the dead; for by the dead are meant the wicked, and the wicked have not all been brought to obey the Gospel. But in the end of the world all that are in their graves shall hear His voice, and come forth. He does not say, Shall live, as He said above, when He spoke of the eternal and blessed life; which all will not have, who shall come forth from their graves. This judgment was committed to Him because He was the Son of man. But what takes place in this judgment? They that have done good shall go unto the resurrection of life, i. e. to live with the Angels of God; they that have done evil unto the resurrection of judgment. Judgment here meaning damnation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let Him declare this more distinctly, that the heretical denier of the resurrection of the body may not find a pretext for sophistical cavil, although the meaning already shines out clearly. When it was said above, "The hour is coming," He added, "and now is;" but just now, "The hour is coming," He has not added, "and now is." Let Him, however, by the open truth, burst asunder all handles, all loops and pegs of sophistical attack, all the nooses of ensnaring objections. "Marvel not at this: for the hour is coming, in which all that are in the graves." What more evident? what more distinct? Bodies are in the graves; souls are not in the graves, either of just or of unjust. The soul of the just man was in the bosom of Abraham; the unjust man's soul was in hell, tormented: neither the one nor the other was in the grave. Above, when He saith, "The hour is coming, and now is," I beseech you give earnest heed. Ye know, brethren, that we get the bread of the belly with toil; with how much greater toil the bread of the mind! With labor you stand and hear, but with greater we stand and speak. If we labor for your sake, you ought to labor with us for your own sake. Above, then, when He said, "The hour is coming," and added, "and now is," what did He subjoin? "When the dead shall hear the voice of the Son of God, and they that hear shall live." He did not say, "All the dead shall hear, and they that hear shall live;" for He meant the unrighteous to be understood. And is it so, that all the unrighteous obey the gospel? The apostle says openly, "But not all obey the gospel." But they that hear shall live, because all that obey the gospel shall pass to eternal life by faith: yet all do not obey; and this is now. But certainly, in the end, "All that are in the graves," both the just and the unjust, "shall hear His voice, and come forth." How is it He would not say, "and shall live"? All, indeed, will come forth, but all will not live. For in that which He said above, "And they that hear shall live," He meant it to be understood that there is in that very hearing and obeying an eternal and blessed life, which not all that shall come forth from the graves will have. Here, then, both in the mention of graves, and by the expression of a "coming forth" from the graves, we openly understand a resurrection of bodies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
Now, therefore, as to a resurrection, perhaps some one of us was saying: Behold, we have risen; he who hears Christ, and believes, and is passed from death to life, also will not come into judgment. The hour cometh, and now is, that whoso heareth the voice of the Son of God shall live: he was dead, he has heard; behold, he doth rise. What is this that is said, that there is to be a resurrection afterwards? Spare thyself, do not hasten the sentence, lest thou hurry after it. There is, indeed, this resurrection which comes to pass now; unbelievers were dead, the unrighteous were dead; the righteous live, they pass from the death of unbelief to the life of faith. But do not thence believe that there will not be a resurrection afterwards of the body; believe that there will be a resurrection of the body also. For hear what follows after the declaration of this resurrection which is by faith, lest any should think this to be the only resurrection, or fall into that desperation and error of men who perverted the thoughts of others, "saying that the resurrection is past already," of whom the apostle saith, "and they overthrow the faith of some." For I believe that they were saying to them such words as these: "Behold, when the Lord saith, And he that believeth in me is passed from death unto life;" the resurrection has already taken place in believing men, who were before unbelievers: how can a second resurrection be meant?" Thanks to our Lord God, He supports the wavering, directs the perplexed, confirms the doubting. Hear what follows, now that thou hast not whereof to make to thyself the darkness of death. If thou hast believed, believe the whole. What whole, sayest thou, am I to believe? Hear what He saith: "Marvel not at this," namely, that He gave to the Son authority of making judgment. I say, in the end of the world, saith He. How in the end? "Do not marvel at this; for the hour cometh." Here He has not said, "and now is." In reference to that resurrection of faith, what did He say? "The hour cometh, and now is." In reference to that resurrection which He intimates there will be of dead bodies, He said, "The hour cometh;" He has not said, "and now is," because it is to come in the end of the world.

And whence, sayest thou, dost thou prove to me that He spoke about the resurrection itself? If thou hear patiently, thou wilt presently prove it to thyself. Let us go on then: "Marvel not at this; for the hour cometh, in which all that are in the graves." What more evident than this resurrection? A while ago, He had not said, "they that are in the graves," but, "The dead shall hear the voice of the Son of God; and they that hear shall live." He has not said, some shall live, others shall be damned; because all who believe shall live. But what does He say concerning the graves? "All that are in the graves shall hear His voice, and shall come forth." He said not, "shall hear and live." For if they have lived wickedly, and lay in the graves, they shall rise to death, not to life. Let us see, then, who shall come forth. Although, a little before, the dead by hearing and believing did live, there was no distinction there made: it was not said, The dead shall hear the voice of the Son of God; and when they shall have heard, some shall live, and some shall be damned; but, "all that hear shall live:" because they that believe shall live, they that have charity shall live, and none of them shall die. But concerning the graves, "They shall hear His voice, and come forth: they that have done well, to the resurrection of life; they that have done ill, to the resurrection of judgment." This is the judgment, that punishment of which He had said a while before, "Whoso believeth in me is passed from death to life," and shall not come into judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
