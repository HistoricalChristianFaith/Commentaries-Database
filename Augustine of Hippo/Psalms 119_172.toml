[[commentary]]
quote='''
But as he hath now learned, and praised God his Teacher, he next wisheth to teach. “Yea, my tongue shall declare Thy word: for all Thy commandments are righteousness” (ver. 172). When he saith that he will declare these things, he becometh a minister of the word. For though God teach within, nevertheless “faith cometh from hearing: and how do they hear without a preacher?” For, because “God giveth the increase,” is no reason why we need not plant and water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
