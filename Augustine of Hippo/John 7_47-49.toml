[[commentary]]
quote='''
But the Pharisees, repelling their testimony, said to them: "Are ye also deceived?" We see, indeed, that you also have been charmed by his discourses. "Hath any one of the rulers or the Pharisees believed on him? But this multitude who know not the law are cursed." They who knew not the law believed on Him who had sent the law; and those men who were teaching the law despised Him, that it; might be fulfilled which the Lord Himself had said, "I am come that they who see not may see, and they that see may be made blind." For the Pharisees, the teachers of the law, were made blind, and the people that knew not the law, and yet believed on the author of the law, were enlightened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
