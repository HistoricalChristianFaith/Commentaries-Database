[[commentary]]
quote='''
“We have passed through fire and water.” Fire and water are both dangerous in this life. Certainly water seemeth to extinguish fire, and fire seemeth to dry up water. Thus also these are the trials, wherein aboundeth this life. Fire burneth, water corrupteth: both must be feared, both the burning of tribulation and the water of corruption. Whenever there is adversity, and anything which is called unhappiness in this world, there is as it were fire: whenever there is prosperity, and the world’s plenty floweth about one, there is as it were water. See that fire burn thee not, nor water corrupt.…Hasten not to the water: through fire pass over to the water, that thou mayest pass over the water also. Therefore also in the mystic rites and in catechising and in exorcising, there is first used fire. For whence ofttimes do the unclean spirits cry out, “I burn,” if that is not fire? But after the fire of Exorcism we come to Baptism: so that from fire to water, from water unto refreshment. But as in the Sacraments, so it is in the temptations of this world: the straitness of fear draweth near first, in place of fire; afterwards fear being removed, we ought to be afraid lest worldly happiness corrupt. But when the fire hath not made thee burst, and when thou hast not sunk in the water, but hast swum out; through discipline thou passest over to rest, and passing over through fire and water, thou art led forth into a place of refreshment. For of those things whereof the signs are in the Sacraments, there are the very realities in that perfection of life everlasting.…But we are not torpid there, but we rest: nor though it be called heat, shall we be hot there, but we shall be fervent in spirit. Observe that same heat in another Psalm: “nor is there any one that hideth himself from the heat thereof.” What saith also the Apostle? “In spirit fervent.” Therefore, “we have gone over through fire and water: and Thou hast led us forth into a cool place.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
