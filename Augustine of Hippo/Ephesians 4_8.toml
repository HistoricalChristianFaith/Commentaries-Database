[[commentary]]
quote='''
In the next place, turning his address to the Lord Himself, “Thou hast gone up,” he saith, “on high, Thou hast led captivity captive, Thou hast received gifts in men” (ver. 18). Of this the Apostle thus maketh mention, thus expoundeth in speaking of the Lord Christ: “But unto each one of us,” he saith, “is given grace after the measure of the giving of Christ: for which cause he saith, He hath gone up on high, He hath led captive captivity, He hath given gifts to men.”…And let it not move us that the Apostle making mention of that same testimony saith not, “Thou hast received gifts in men;” but, “He hath given gifts unto men.” For he with Apostolic authority hath spoken thus according to the faith that the Son is God with the Father. For in respect of this He hath given gifts to men, sending to them the Holy Spirit, which is the Spirit of the Father and of the Son. But forasmuch as the self-same Christ is understood in His Body which is the Church, wherefore also His members are His saints and believers, whence to them is said, “But ye are the Body of Christ, and the members,” doubtless He hath Himself also received gifts in men. Now Christ hath gone up on high, and sitteth at the right hand of the Father: but unless He were here also on the earth, He would not thence have cried, “Saul, Saul, why persecutest thou me?” When the Same saith Himself, “Inasmuch as to one of My least ye have done it, to Me ye have done it:” why do we doubt that He receiveth in His members, the gifts which the members of Him receive?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
