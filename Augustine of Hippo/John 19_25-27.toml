[[commentary]]
quote='''
The Lord being now crucified, and the parting of His garments having also been completed by the casting of the lot, let us look at what the evangelist John thereafter relates. "And these things," he says, "the soldiers did. Now there stood by the cross of Jesus His mother, and His mother's sister, Mary [the wife] of Cleophas, and Mary Magdalene. When Jesus therefore saw His mother, and the disciple standing by whom He loved, He saith unto His mother, Woman, behold thy son! Then saith He to the disciple, Behold thy mother! And from that hour the disciple took her unto his own home." This, without a doubt, was the hour whereof Jesus, when about to turn the water into wine, had said to His mother, "Woman, what have I to do with thee? mine hour is not yet come." This hour, therefore, He had foretold, which at that time had not yet arrived, when it should be His to acknowledge her at the point of death, and with reference to which He had been born as a mortal man. At that time, therefore, when about to engage in divine acts, He repelled, as one unknown, her who was the mother, not of His divinity, but of His [human] infirmity; but now, when in the midst of human sufferings, He commended with human affection [the mother] by whom He had become man. For then, He who had created Mary became known in His power; but now, that which Mary had brought forth was hanging on the cross.

A passage, therefore, of a moral character is here inserted. The good Teacher does what He thereby reminds us ought to be done, and by His own example instructed His disciples that care for their parents ought to be a matter of concern to pious children: as if that tree to which the members of the dying One were affixed were the very chair of office from which the Master was imparting instruction. From this wholesome doctrine it was that the Apostle Paul had learned what he taught in turn, when he said, "But if any provide not for his own, and especially for those of his own house, he hath denied the faith, and is worse than an infidel." And what are so much home concerns to any one, as parents to children, or children to parents? Of this most wholesome precept, therefore, the very Master of the saints set the example from Himself, when, not as God for the hand-maid whom He had created and governed, but as a man for the mother, of whom He had been created, and whom He was now leaving behind, He provided in some measure another son in place of Himself. And why He did so, He indicates in the words that follow: for the evangelist says, "And from that hour the disciple took her unto his own," speaking of himself. In this way, indeed, he usually refers to himself as the disciple whom Jesus loved: who certainly loved them all, but him beyond the others, and with a closer familiarity, so that He even made him lean upon His bosom at supper; in order, I believe, in this way to commend the more highly the divine excellence of this very gospel, which He was thereafter to preach through his instrumentality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520119.html'
source_title="Tractates on John 119"

[[commentary]]
quote='''
Matthew proceeds thus: "And many women were there beholding afar off, which followed Jesus from Galilee: among which was Mary Magdalene, and Mary the mother of James and Joseph, and the mother of Zebedee's children." Mark gives it in this form: "There were also women looking on afar off: among whom was Mary Magdalene, and Mary the mother of James the Less and of Joseph, and Salome (who also, when He was in Galilee, followed Him, and ministered unto Him); and many other women which came up with Him unto Jerusalem." I see nothing which can be supposed to constitute a discrepancy between these writers here. For in what way can the truth be affected by the fact that some of these women are named in both lists, while others are referred to only in the one? Luke has likewise connected his narrations as follows: "And all the people that came together to that sight, beholding the things which were done, smote their breasts, and returned. And all His acquaintance and the women that followed Him from Galilee stood afar off beholding these things." Here we perceive that he is quite in harmony with the former two as far as regards the presence of the women, although he does not mention any of them by name. On the subject of the multitude of people who were also present, and who, as they beheld the things which were done, smote their breasts and returned, he is in like manner at one with Matthew, although that evangelist has introduced into the context this distinct statement: "Now the centurion and they that were with him." Thus it simply appears that Luke is the only one who has spoken expressly of His "acquaintance" who stood afar off. For John has also noticed the presence of the women before the Lord gave up the ghost. His narrative runs thus: "Now there stood by the cross of Jesus His mother, and His mother's sister, Mary the wife of Cleophas, and Mary Magdalene. When Jesus therefore saw His mother, and the disciple standing by whom He loved, He saith unto His mother, Woman, behold thy son! Then saith He to the disciple, Behold thy mother! And from that hour that disciple took her unto his own home." Now, as regards this statement, had not Matthew and Mark at the same time mentioned Mary Magdalene most explicitly by name, it might have been possible for us to say that there was one company of women afar off, and another near the cross. For none of these writers has mentioned the Lord's mother here but John himself. The question, therefore, which rises now is this, How can we understand the same Mary Magdalene both to have stood afar off along with other women, as the accounts of Matthew and Mark bear, and to have been by the cross, as John tells us, unless it be the case that these women were at such a distance as made it quite legitimate to say at once that they were near, because they were at hand there in the sight of Him, and also afar off in comparison with the crowd of people who were standing round about in closer vicinity along with the centurion and the soldiers? It is open for us, then, to suppose that those women who were present at the scene along with the Lord's mother, after He commended her to the disciple, began then to retire with the view of extricating themselves from the dense mass of people, and of looking on at what remained to be done from a greater distance. And in this way the rest of the evangelists, who have introduced their notices of these women only after the Lord's death, have properly reported them to be standing by that time afar off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 21"
