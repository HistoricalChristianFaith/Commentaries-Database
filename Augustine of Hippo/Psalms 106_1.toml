[[commentary]]
quote='''
[Jesus] was granting pardon; but while he was granting it he raised his face to her and said, "Has no one stoned you?" And she did not say, "Why? What have I done, Lord? I am not guilty, am I?" She did not say that; what she said was, "No one, Lord." She accused herself. They had been unable to prove it against her and had withdrawn. But she confessed, because her Lord was aware of her guilt but was nonetheless seeking her faith and her confession. "Has no one stoned you?" "No one, Lord." "No one"—that is confession of sins; and "Lord"—that is pardon of the punishment that she deserved. "No one, Lord. I acknowledge both things. I know who you are, I know who I am. It is to you I am confessing. You see, I have heard the words, "Confess to the Lord, for he is good." I know my confession, I know your mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252016A.html'
source_title="SERMON 16A.5"

[[commentary]]
quote='''
This Psalm also hath the title Allelujah prefixed to it: and this twice. But some say, that one Allelujah belongeth to the end of the former Psalm, the other to the beginning of this. And they assert, that all the Psalms bearing this title have Allelujah at the end, but not all at the beginning; so that they will not allow any Psalm which hath not Allelujah at the end, to have it at the beginning; supposing that what seemeth to belong to the commencement, really belongeth to the end of the former Psalm. But until they persuade us by some sure proofs that this is true, we will follow the general custom, which, whenever it findeth Allelujah, attributes it to the same Psalm, at the head of which it is found. For there are very few copies (and I have found this in none of the Greek copies, which I have been able to inspect) which have Allelujah at the end of the CLth Psalm; after which there is no other which belongeth to the same canon. But not even this could outweigh custom, although all the copies had it so. For it might be that, with some reference to the praise of God, the whole book of Psalms, which is said to consist of five books (for they say that the books severally end where it is written Amen, Amen), might be closed with this last Allelujah, after all that hath been sung; nor, on account of the end of the CLth Psalm, do I see that it is necessary that all the Psalms entitled Allelujah, should have Allelujah at the end. But when there is a double Allelujah at the head of a Psalm, why as our Lord sometimes once, sometimes twice over, saith Amen, in the same way Allelujah may not sometimes be used once, sometimes twice, I know not: especially, since as in this CVth, both the Allelujahs are placed after the mark by which the number of the Psalm is described, whereas the one, if it belonged to the end of the former Psalm, ought to have been placed before the number; and the Allelujah which belonged to the Psalm of this number, should have been written after the number. But perhaps even in this an ignorant habit hath prevailed, and some reason may be assigned of which we are as yet uninformed, so that the judgment of truth ought rather to be our guide than the prejudice of custom. In the mean time, before we are fully instructed in this matter, whenever we find Allelujah written, whether once or twice, after the number of the Psalm, according to the most usual custom of the Church, we will ascribe it to that Psalm to which the same number is prefixed; confessing that we both believe the mysteries of all the titles in the Psalms, and of the order of the same Psalms, to be important, and that we have not yet been able, as we wish, to penetrate them.

But I find these two Psalms, the CVth and CVIth so connected, that in one of them, the first, the people of God is praised in the person of the elect, of whom there is no complaint, whom I imagine to have been there in those with whom God was well pleased; but in the following Psalm those are mentioned among the same people who have provoked God; though the mercy of God was not wanting even to these.…This Psalm therefore beginneth like the former; “Confess ye unto the Lord.” But in that Psalm these words follow: “And call upon His Name:” whereas here, it is as follows, “For He is gracious, and His mercy endureth for ever” (ver. 1). Wherefore in this passage a confession of sins may be understood; for after a few verses we read, “We have sinned with our fathers, we have done amiss, and dealt wickedly;” but in the words, “For He is gracious, and His mercy endureth for ever,” there is chiefly the praise of God, and in His praise confession. Although when any one confesses his sins, he ought to do so with praise of God; nor is a confession of sins a pious one, unless it be without despair, and with calling upon the mercy of God. It therefore doth contain His praise, whether in words, when it calleth Him gracious and merciful, or in the feeling only, when he believeth this.…If that mercy be here understood, in respect of which no man can be happy without God; we may render it better, “for ever:” but if it be that mercy which is shown to the wretched, that they may either be consoled in misery, or even freed from it; it is better construed, “to the end of the world,” in which there will never be wanting wretched persons to whom that mercy may be shown. Unless indeed any man ventured to say, that some mercy of God will not be wanting even to those who shall be condemned with the devil and his angels; not a mercy by which they may be freed from that condemnation, but that it may be in some degree softened for them: and that thus the mercy of God may be styled eternal, as exercised over their eternal misery.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
