[[commentary]]
quote='''
“I will pay my vows unto the Lord” (ver. 18). What vows wilt thou pay? What victims hast thou vowed? what burnt-offerings, what holocausts? Dost thou refer to what thou hast said a little before, “I will receive the cup of salvation, and will call upon the Name of the Lord;” and, “I will offer to Thee the sacrifice of thanksgiving”? and indeed whosoever well considereth what he is vowing to the Lord, and what vows he is paying, let him vow himself, let him pay himself as a vow: this is exacted, this is due. On looking at the coin, the Lord saith, “Render unto Cæsar the things which are Cæsar’s, and unto God the things which are God’s:” his own image is rendered unto Cæsar: let His image be rendered unto God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
