[[commentary]]
quote='''
“Lord, when wilt Thou look on? Rescue My Soul from their deceits, My Darling from the lions” (ver. 17). For to us the time is slow; and in our person is this said, “When wilt Thou look on?” that is, when shall we see vengeance upon those who insult us? When shall the Judge, overcome by weariness, hear the widow? But our Judge, not from weariness, but from love, delayeth our salvation; from reason, not from need; not that He could not even now succour us, but that the number of us all may be filled up even to the end. And yet out of our desire, what do we say? “Lord, when wilt Thou look on? Rescue My Soul from their deceits, My Darling from the lions:” that is, My Church from raging powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
