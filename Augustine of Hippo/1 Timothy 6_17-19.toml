[[commentary]]
quote='''
What is true life, but that which is eternal life? Hear the apostle speaking to Timothy, when he says, "Charge them that are rich in this world, not to be high-minded, nor to trust in uncertain riches, but in the living God, who giveth us all things richly to enjoy; let them do good, be rich in good works, ready to distribute, to communicate." Why does he say this? Hear what follows: "Let them lay up in store for themselves a good foundation for the time to come, that they may lay hold of the true life." If they ought to lay up for themselves a good foundation for the time to come, in order to lay hold of the true life, surely this in which they were is a false life. For why shouldest thou desire to lay hold of the true, if thou hast the true already? Is the true to be laid hold of? There must then be a departing from the false.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"


[[commentary]]
quote='''
So those whom the Apostle chargeth by Timothy he would not have to be proud, lest they should glory in the abundance of their riches. Lastly, what they possessed he would not have to grow old in their hands: but that something should be made of it to be for the price of the redemption of their souls. For he saith, “Charge them that are rich in this world, that they be not high-minded: nor trust in uncertain riches, but in the living God, who giveth us richly all things to enjoy.” And as if they had said, “What shall we then make of our riches?” he continueth, “Let them be rich in good works, ready to distribute, willing to communicate,” and they will not lose that. How know we? Hear what followeth. “Let them lay up for themselves a good foundation against the time to come, that they may lay hold on the true life.” So shall they give the price of the redemption of their soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"

[[commentary]]
quote='''
Whence the Apostle saith of the rich, “Charge them that are rich in this world, that they be not highminded, nor trust in uncertain riches, but in the living God, who giveth us richly all things to enjoy.” What therefore should they do with their riches? He goeth on to say: “That they be rich in good works, ready to distribute, willing to communicate.” And see that they are poor in this world: “Laying up in store for themselves,” he addeth, “a good foundation against the time to come, that they may lay hold on eternal life.” When they have laid hold of eternal life, then will they be rich; but since they have it not as yet, they should know that they are poor. Thus it is that God counteth among His poor all the humble in heart, who are established in that twofold charity, whatever they may have in this world—among His poor, whom He satisfieth with bread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
