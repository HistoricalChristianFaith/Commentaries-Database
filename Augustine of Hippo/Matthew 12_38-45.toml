[[commentary]]
quote='''
Matthew goes on and relates what followed thus: "Then certain of the scribes and of the Pharisees answered, saying, Master, we would see a sign of thee;" and so on, down to where we read, "Even so shall it be also unto this wicked generation." These words are recorded also by Luke in this connection, although in a somewhat different order. For he has mentioned the fact that they sought of the Lord a sign from heaven at an earlier point in his narrative, which makes it follow immediately on his version of the miracle wrought on the dumb man. He has not, however, recorded there the reply which was given to them by the Lord. But further on, after [telling us how] the people were gathered together, he states that this answer was returned to the persons who, as he gives us to understand, were mentioned by him in those earlier verses as seeking of Him a sign from heaven. And that reply he also subjoins, only after introducing the passage regarding the woman who said to the Lord, "Blessed is the womb that bare thee." This notice of the woman, moreover, he inserts after relating the Lord's discourse concerning the unclean spirit that goes out of the man, and then returns and finds the house garnished. In this way, then, after the notice of the woman, and after his statement of the reply which was made to the multitudes on the subject of the sign which they sought from heaven, he brings in the similitude of the prophet Jonas; and then, directly continuing the Lord's discourse, he next instances what was said concerning the Queen of the South and the Ninevites. Thus he has rather related something which Matthew has passed over in silence, than omitted any of the facts which that evangelist has narrated in this place. And furthermore, who can fail to perceive that the question as to the precise order in which these words were uttered by the Lord is a superfluous one? For this lesson also we ought to learn, on the unimpeachable authority of the evangelists,—namely, that no offence against truth need be supposed on the part of a writer, although he may not reproduce the discourse of some speaker in the precise order in which the person from whose lips it proceeded might have given it; the fact being, that the mere item of the order, whether it be this or that, does not affect the subject-matter itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 39"
