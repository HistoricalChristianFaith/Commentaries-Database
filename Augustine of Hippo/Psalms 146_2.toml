[[commentary]]
quote='''
From the words of this psalm, which we have just sung, may the Lord grant that we might be able to speak to you. For we have said: I will praise the Lord in my life; I will sing psalms to my God as long as I live. With these words, let us first remind your Charity that when you hear or say as long as I live, I will sing psalms to my God, do not think that when this life ends, the praise of God will end for us. For we will praise Him even more then, when we live without end. For if we praise in the pilgrimage from which we depart, how much more will we praise in the house from which we will never depart? As is said and read and sung in another psalm: Blessed are those who dwell in your house; they will praise you forever and ever. Where you hear: forever and ever, there is no end. And to live a blessed life, where God is undoubtedly seen, is to be loved without offense, to be praised without end; this will indeed be our life, to see God, to love Him, to praise Him. If therefore we praise when we believe, how will we praise when we see? How will sight praise, if faith praises so? For the Apostle says: As long as we are in the body, we are pilgrims from the Lord; for we walk by faith, not by sight. Now therefore by faith, then by sight. Now we believe what we do not see, then we will see what we believed. The one who believes is not ashamed, because it is true what he will see. But our Lord first built faith in us, where, if the reward of faith is given, it should not be sought prematurely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252033A.html'
source_title="Sermon 33A"

[[commentary]]
quote='''
And then the soul, weighed down, as it were, and unable to stand up as is fitting, answereth the mind, “I will praise the Lord in my life” (ver. 2). What is, “in my life”? Because now I am in my death. Therefore first encourage thyself, and say, “Praise the Lord, O my soul.” Thy soul answereth thee, I do praise so far as I can, slightly, poorly, weakly. Wherefore? Because, “while we are in the body, we are absent from the Lord.”…

“In my life.” Now what has it? It might answer thee, “My death.” Whence, “My death”? because I am absent from the Lord. For if to cling to Him is life, to depart from Him is death. But what comforteth thee? Hope. Now thou livest in hope: in hope praise, in hope sing. Thy death is from the sadness of this life, thou livest in hope of a future life. And how wilt thou praise thy Lord? “I will sing unto my God, as long as I have my being.” What sort of praise is this, “I will sing unto my God as long as I have being”? Behold, my brethren, what sort of being this will be; where there will be everlasting praise, there will be also everlasting being. Behold, now thou hast being: dost thou sing unto God as long as thou hast being? Behold, thou wast singing, and hast turned thyself away to some business, thou singest no longer, yet thou hast being: thou hast being, yet thou singest not. It may be also thy desire turneth thee to somewhat; not only dost thou not sing, but thou even offendest His ears, yet thou hast being. What praise will that be, when thou praisest as long as thou hast being? But what meaneth, “as long as I have being”? Will there be any time when he will not be? Nay, rather, that “long” will be everlasting, and therefore it will be truly “long.” For whatever hath end in time, however prolonged it is, is yet not “long.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
