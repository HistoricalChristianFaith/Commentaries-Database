[[commentary]]
quote='''
But we, dearly beloved, do we come of Abraham's race, or was Abraham in any sense our father according to the flesh? The flesh of the Jews draws its origin from his flesh, not so the flesh of Christians. We have come of other nations, and yet, by imitating him, we have become the children of Abraham. Listen to the apostle: "To Abraham and to his seed were the promises made. He saith not," he adds, "And to seeds, as of many; but as of one, And to thy seed, which is Christ. And if ye be Christ's, then are ye Abraham's seed, and heirs according to the promise." We then have become Abraham's seed by the grace of God. It was not of Abraham's flesh that God made any co-heirs with him. He disinherited the former, He adopted the latter; and from that olive tree whose root is in the patriarchs, He cut off the proud natural branches, and engrafted the lowly wild olive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"

[[commentary]]
quote='''
For those of whom He so speaks are, as I have said, His members; and the head and body are one Christ, as the apostle teaches when he says of the seed of Abraham, "And if ye be Christ's, then are ye Abraham's seed," after having said before, "He saith not, And to seeds, as in many, but as in one, And to thy seed, which is Christ." If, then, the seed of Abraham is Christ, what else is declared to those to whom he says, "Then are ye Abraham's seed," but then are ye Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520108.html'
source_title="Tractates on John 108"
