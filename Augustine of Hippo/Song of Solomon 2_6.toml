[[commentary]]
quote='''
As for the right hand of the Father, it isn't meant in the manner of the structure of the human body, as though he is on the Son's left, if the Son in terms of bodily positions and relationships is placed on his right. But the right hand of God means the inexpressible peak of honor and good fortune, as we read it said about wisdom: "His left hand under my head, and his right hand embraces me." If earthly convenience has been lying underneath, then eternal felicity is embracing from above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520214.html'
source_title="SERMON 214:8"

[[commentary]]
quote='''
The persecutors raged against Crispina, whose birthday we are to-day celebrating; they were raging against a rich and delicate woman: but she was strong, for the Lord was her defence upon the hand of her right hand. He was her Keeper. Is there any one in Africa, my brethren, who knoweth her not? For she was most illustrious, noble in birth, abounding in wealth: but all these things were in her left hand, beneath her head. An enemy advanced to strike her head, and the left hand was presented to him, which was under her head. Her head was above, the right hand embraced her from above.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520121.html'
source_title="Exposition on Psalm 121"
