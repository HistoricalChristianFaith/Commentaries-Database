[[commentary]]
quote='''
“In Thy will Thou hast conducted me.” What is, “in thy will”? Not in my merits. What is, “in Thy will”? Hear the apostle, who was at first a beast longing for things earthly, and living after the Old Testament. He saith what? “I that at first was a blasphemer, and persecutor, and injurious: but mercy I obtained.” What is, “in Thy will”? “By the grace of God I am what I am.” “And in glory Thou hast taken me up.” Now to what glory he was taken up, and in what glory, who can explain, who can say? Let us await it, because in the Resurrection it will be, in the last things it will be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
