
[[commentary]]
quote='''
And therefore after this wandering, and hunger, and thirst, “And they cried unto the Lord in their trouble, and He delivered them out of their distress” (ver. 6). And what did He for them, as they were wandering? “And He led them in the right way” (ver. 7). They found not the way of a city to dwell in, with hunger and thirst they were vexed and faint, “and He led them into the right way, that they might go into a city to dwell in.” How He helped their hunger and thirst, He saith not, but even this expect ye: “Let them confess unto the Lord His mercies, and His wonders towards the children of men” (ver. 8). Tell them, ye that are experienced, to the inexperienced; ye that are already in the way, already directed towards finding the city, already at last free from hunger and thirst. “Because He hath satisfied the empty soul, and filled the hungry soul with good things” (ver. 9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
