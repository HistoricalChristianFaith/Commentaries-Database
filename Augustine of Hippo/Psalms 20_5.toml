[[commentary]]
quote='''
“We will exult in Thy salvation” (ver. 5). We will exult in that death will in no wise hurt Thee; for so Thou wilt also show that it cannot hurt us either. “And in the name of the Lord our God will we be magnified.” And the confession of Thy name shall not only not destroy us, but shall even magnify us.

“The Lord fulfil all Thy petitions.” The Lord fulfil not only the petitions which Thou madest on earth, but those also whereby Thou intercedest for us in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
