[[commentary]]
quote='''
A sermon has to be preached about the evening sacrifice. We prayed after all as we sang, and we sang as we prayed, "May my prayer rise straight up like incense in your presence; the lifting up of my hands an evening sacrifice." In the prayer we observe the person, in the extension of the hands we recognize the cross. So this is the sign that we carry on our foreheads, the sign by which we have been saved. A sign that was mocked, in order to be honored; despised in order to be glorified. God appears in visible form, so that as man he may intercede; he remains hidden so that as man he may die. "For if they had known, they would never have crucified the Lord of glory." So this sacrifice, in which the priest is also the victim, has redeemed us by the shedding of the Creator's blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520342.html'
source_title="SERMON 342:1"

[[commentary]]
quote='''
But in order that God’s pardon may be obtained, propitiation is made through some sacrifice. There hath come forth therefore, sent from God the Lord, One our Priest; He took upon Him from us that which He might offer to the Lord; we are speaking of those same first-fruits of the flesh from the womb of the Virgin. This holocaust He offered to God. He stretched out His hands on the Cross, in order that He might say, “Let My prayer be directed as incense in Thy sight, and the lifting up of My hands an evening sacrifice.” As ye know, the Lord about eventide hung on the Cross: and our impieties were propitiated; otherwise they had swallowed us up: the discourses of unjust men had prevailed over us; there had led us astray preachers of Jupiter, and of Saturn, and of Mercury: “the discourses of ungodly men had prevailed over us.” But what wilt Thou do? “Our impieties Thou wilt propitiate.” Thou art the priest, Thou the victim; Thou the offerer, Thou the offering.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"

[[commentary]]
quote='''
“And Thou, Lord God, art One who hast compassion and merciful, longsuffering, and very pitiful, and true” (ver. 15). Wherefore longsuffering and very pitiful, and One who hast compassion? Because hanging on the Cross He said: “Father, forgive them, for they know not what they do.” Whom prayeth He to? for whom doth He pray? Who prayeth? Where prayeth He? The Son prays to the Father, crucified for the ungodly, in the midst of very insults, not of words but of death inflicted, hanging on the Cross; as if for this He had His hands stretched out, that thus He might pray for them, that His “prayer might be directed like incense in the sight of the Father, and the lifting up of His hands like an evening sacrifice.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"

[[commentary]]
quote='''
“Let my prayer be set forth in Thy sight as incense, and the lifting up of my hands an evening sacrifice” (ver. 2). That this is wont to be understood of the Head Himself, every Christian acknowledgeth. For when the day was now sinking towards evening, the Lord upon the Cross “laid down His life to take it again,” did not lose it against His will. Still we too are figured there. For what of Him hung upon the tree, save what He took of us? And how can it be that the Father should leave and abandon His only begotten Son, especially when He is one God with Him? Yet, fixing our weakness upon the Cross, where, as the Apostle saith, “our old man is crucified with Him,” He cried out in the voice of that our “old man,” “Why hast Thou forsaken Me?” That then is the “evening sacrifice,” the Passion of the Lord, the Cross of the Lord, the offering of a salutary Victim, the whole burnt offering acceptable to God. That “evening sacrifice” produced, in His Resurrection, a morning offering. Prayer then, purely directed from a faithful heart, riseth like incense from a hallowed altar. Nought is more delightful than the odour of the Lord: such odour let all have who believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
