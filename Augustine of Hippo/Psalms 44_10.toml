[[commentary]]
quote='''
“Thou hast turned us away backward in presence of our enemies” (ver. 10), so that they are, as it were, before; we, behind; they are counted as conquerors, we as conquered. “And they which hate us spoiled for themselves.” What did they “spoil” but ourselves?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"
