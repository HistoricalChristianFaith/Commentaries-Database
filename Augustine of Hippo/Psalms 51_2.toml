[[commentary]]
quote='''
“More and more wash me from mine unrighteousness” (ver. 2). What is, “More and more wash”? One much stained. More and more wash the sins of one knowing. Thou that hast washed off the sins of one ignorant. Not even thus is it to be despaired of Thy mercy. “And from my delinquency purge Thou me.” According to the manner in which He is physician, offer a recompense. He is God, offer sacrifice. What wilt thou give that thou mayest be purged? For see upon whom thou callest; upon a Just One thou callest. He hateth sins, if He is just; He taketh vengeance upon sins, if He is just; thou wilt not be able to take away from the Lord God His justice: entreat mercy, but observe the justice: there is mercy to pardon the sinner, there is justice to punish the sin. What then? Thou askest mercy; shall sin unpunished abide? Let David answer, let those that have fallen answer, answer with David, and say, No, Lord, no sin of mine shall be unpunished; I know the justice of Him whose mercy I ask: it shall not be unpunished, but for this reason I will not that Thou punish me, because I punish my sin: for this reason I beg that Thou pardon, because I acknowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"