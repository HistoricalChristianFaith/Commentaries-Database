[[commentary]]
quote='''
And what is the drift of what we have just been singing to the Lord in the psalm? "Have mercy on me, Lord, because man has trampled on me." "Man" means whoever lives according to merely human criteria. Well, anyway, those who live according to God's standards are told, "You are gods, and all of you sons of the Most High." But to the reprobate, who were called to be children of God but preferred rather merely to be human, that is, to live only according to human standards, "you," it says, "shall die like people and fall like one of the princes." Surely the fact that we human beings are mortal should serve to teach us our place, not to make us boastful. What does a worm, which is due to die tomorrow, have to boast about?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252097.html'
source_title="SERMON 97:2"

[[commentary]]
quote='''
Just as when we are going to enter into any house, we look on the title to see whose it is and to whom it belongeth, lest perchance inopportunely we burst into a place whereunto we ought not; and again, in order that we may not through timidity withdraw from that which we ought to enter: as if in a word we were to read, These estates belong to such an one or to such an one: so on the lintel of this Psalm we have inscribed, “At the end, for the people that from holy men were put afar off, to David himself, at the inscription of the Title, when the Allophyli held him in Gath.” Let us therefore take knowledge of the people that from holy men were put afar off at the inscription of the Title. For this doth belong to that David whom now ye know how to understand spiritually. For there is here commended to our notice no other than He of whom hath been said, “The end of the Law is Christ for righteousness to every man believing.” Therefore when thou hearest “at the end,” unto Christ give heed, lest tarrying in the way thou arrive not at the end.…

Who are then the people that from holy men were put afar off at the inscription of the Title? Let the Title itself declare to us that people. For there was written a certain title at the Passion of the Lord, when the Lord was crucified: there was in that place a Title inscribed in Hebrew, in Greek, and in Latin, “The King of the Jews;” in three tongues as though by three witnesses the Title was confirmed: because “in the mouth of two or three witnesses shall stand every word.”…

What therefore meaneth that which to the title itself still belongeth, namely, that “the Allophyli held him in Geth”? Geth was a certain city of the Allophyli, that is, of strangers, to wit, of people afar from holy men. All they that refuse Christ for King become strangers. Wherefore strangers are they made? Because even that vine, though by Him planted, when it had become sour what heard it? “Wherefore hast thou been turned into sourness, O alien vine?” It hath not been said, My vine: because if Mine, sweet; if sour, not Mine; if not Mine, surely alien. “There held him,” then, “Allophyli in Geth.” We find indeed, brethren, David himself, son of Jesse, king of Israel, to have been in a strange land among the Allophyli, when he was sought by Saul, and was in that city and with the king of that city, but that there he was detained we read not. Therefore our David, the Lord Jesus Christ out of the seed of that David, not alone they held, but there hold Him still Allophyli in Geth. Of Geth we have said that it is a city. But the interpretation of this name, if asked for, signifieth “press.”…How therefore here is He held in Geth? Held in a winepress is His Body, that is, His Church. What is, in a winepress? In pressings. But in a winepress fruitful is the pressing. A grape on the vine sustaineth no pressing, whole it seemeth, but nothing thence floweth: it is thrown into a winepress, is trodden, is pressed; harm seemeth to be done to the grape, but this harm is not barren; nay, if no harm had been applied, barren it would have remained.

Let whatsoever holy men therefore that are suffering pressing from those that have been put afar off from the saints, give heed to this Psalm, let them perceive here themselves, let them speak what here is spoken, that suffer what here is spoken of.…Private enmities therefore let no one think of, when about to hear the words of this Psalm: “Know ye that for us the wrestling is not against flesh and blood, but against princes and powers, and spiritual things of wickedness,” that is, against the devil and his angels; because even when we suffer men that annoy us, he is instigating, he is inflaming, as it were his vessels he is moving. Let us give heed therefore to two enemies, him whom we see, and him whom we see not; man we see, the devil we see not; man let us love, of the devil beware; for man pray, against the devil pray, and let us say to God, “Have pity on me, O Lord, for man hath trodden me down” (ver. 1). Fear not because man hath trodden thee down: have thou wine, a grape thou hast become in order that thou shouldest be trodden. “All day long warring he hath troubled me,” every one that hath been put afar off from the saints. But why should not here be understood even the devil himself? Is it because mention is made of “man”? doth therefore the Gospel err, because it hath said, “A man that is an enemy hath done this”? But by a kind of figure may he also be called a man, and yet not be a man. Whether therefore it was him whom he that said these words was beholding, or whether it was the people and each one that was put afar off from holy men, through which kind the devil troubleth the people of God, who cleave to holy men, who cleave to the Holy One, who cleave to the King, at the title of which King being indignant they were as though beaten back, and put afar off: let him say, “Have pity on me, O Lord, for man hath trodden me down:” and let him faint not in this treading down, knowing Him on whom he is calling, and by whose example he hath been made strong. The first cluster in the winefat pressed is Christ. When that cluster by passion was pressed out, there flowed that whence “the cup inebriating is how passing beautiful!” Let His Body likewise say, looking upon its Head, “Have pity on me, O Lord, for man hath trodden me down: all day long warring he hath troubled me.” “All day long,” at all times. Let no one say to himself, There have been troubles in our fathers’ time, in our time there are not. If thou supposest thyself not to have troubles, not yet hast thou begun to be a Christian. And where is the voice of the Apostle, “But even all that will live godly in Christ, persecutions shall suffer.” If therefore thou sufferest not any persecution for Christ, take heed lest not yet thou hast begun godly to live in Christ. But when thou hast begun godly to live in Christ, thou hast entered into the winepress; make ready thyself for pressings: but be not thou dry, lest from the pressing nothing go forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
