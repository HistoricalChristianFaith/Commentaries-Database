[[commentary]]
quote='''
It sufficiently appears from this place, that if they were said according to that sense in which it is said, "He hath given to the Son to have life in Himself," it certainly would not be said, "The Father judgeth no man." For in respect to this, that the Father hath begotten the Son equal to Himself, He judges with Him. Therefore it is in respect to this that it is said, that in the judgment, not the form of God, but the form of the Son of man will appear. Not that He will not judge, who hath committed all judgment unto the Son, since the Son saith of Him, "There is One that seeketh and judgeth:" but it is so said, "The Father judgeth no man, but hath committed all judgment unto the Son;" as if it were said, No one will see the Father in the judgment of the quick and the dead, but all will see the Son: because He is also the Son of man, so that He can be seen even by the ungodly, since they too shall see Him whom they have pierced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%25201.html'
source_title="On the Trinity, Book 1.29"

[[commentary]]
quote='''
(de Trin. c. 29. [xiii.]) For this, viz. that the Father hath given all judgment unto the Son, does not mean that He begat the Son with this attribute, as is meant in the words, So hath He given to the Son to have life in Himself. For if so, it would not be said, The Father judgeth no man, because, in that the Father begat the Son equal, He judgeth with the Son. What is meant is, that in the judgment, not the form of God but the form of the Son of man will appear; not because He will not judge Who hath given all judgment to the Son; since the Son says of Him below, There is one that seeketh and judgeth, (c. 8.) but the Father judgeth no man; i. e. no one will see Him in the judgment, but all will see the Son, because He is the Son of man, even the ungodly who will look on Him Whom they pierced. (Zech. 12)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What follows then? "For the Father judgeth not any man, but hath given all judgment to the Son, that all men may honor the Son, even as they honor the Father:" this He subjoined, as rendering a reason of the foregoing sentence. A great question comes before us; give it your earnest attention. The Son quickeneth whom He will, the Father quickeneth whom He will; the son raiseth the dead, just as the Father raiseth the dead. And further, "the Father judgeth not any man." If the dead must be raised in the judgment, how can it be said that the Father raiseth the dead, if He judgeth not any man, since "He hath given all judgment to the Son"? But in that judgment the dead are raised; some rise to life, others to punishment. If the Son doeth all this, but the Father not, inasmuch as "He judgeth not any man, but hath given all judgment to the Son," it will appear contrary to what has been said, viz., "As the Father raiseth up the dead, and quickeneth them, so also the Son quickeneth whom He will." Consequently the Father and the Son raise together; if they raise together, they quicken together: hence they judge together. How, then, is that true, "For the Father judgeth not any man, but hath given all judgment to the Son"? Meanwhile let the questions now proposed engage your minds; the Lord will cause that, when solved, they will delight you. For so it is, brethren: every question, unless it stirs the mind to reflection, will not give delight when explained. May the Lord Himself then follow with us, in case He may perhaps reveal Himself somewhat in those matters which He foldeth up. For He foldeth up His light with a cloud; and it is difficult to fly like an eagle above every obscure mist with which the whole earth is covered, and to behold the most serene light in the words of the Lord. In case, then, He may perhaps dissipate our darkness with the heat of His rays, and deign to reveal Himself somewhat in the sequel, let us, deferring these questions, look at what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
"For," saith He, "the Father judgeth no man, but all judgment hath He given to the Son." A little before we were thinking that the Father doeth something which the Son doeth not, when He said," The Father loveth the Son, and showeth Him all things that Himself doeth;" as though the Father were doing, and the Son were seeing. In this way there was creeping in upon our mind a carnal conception, as if the Father did what the Son did not; but that the Son was looking on while the Father showed what He was doing. Then, as the Father was doing what the Son did not, just now we see the Son doing what the Father doeth not. How He turns us about, and keeps our mind busy! He leads us hither and thither, will not allow us to remain in one place of the flesh, that by changing He may exercise us, by exercising He may cleanse us, by cleansing He may render us capable of receiving, and may fill us when made capable. What have these words to do with us? What was He speaking? What is He speaking? A little before, He said that the Father showeth to the Son whatever He doeth. I did see, as it were, the Father doing. the Son waiting to see; presently again, I see the Son doing, the Father idle: "For the Father judgeth not any man, but all judgment hath He given to the Son." When, therefore, the Son is about to judge, will the Father be idle, and not judge? What is this? What am I to understand? What dost Thou say, O Lord? Thou art God the Word, I am a man. Dost Thou say that "the Father judgeth not any man, but hath given all judgment to the Son"? I read in another place that Thou sayest, "I judge not any man; there is one who seeketh and judgeth." Of whom sayest Thou, "There is one who seeketh and judgeth," unless it be of the Father? He maketh inquisition for thy wrongs, and judgeth for them. How is it to be understood here that "the Father judgeth not any man, but all judgment hath He given to the Son"? Let us ask Peter; let us hear him speaking in his epistle: "Christ suffered for us," saith he, "leaving us an example that we should follow His steps; who did no sin, neither was guile found in His mouth; who, when He was reviled, reviled not again; when He suffered wrong, He threatened not, but committed Himself to Him that judgeth righteously." How is it true that "the Father judgeth not any man, but hath given all judgment to the Son"? We are here in perplexity, and being perplexed let us exert ourselves, that by exertion we may be purified. Let us endeavor as best we may, by His own gift, to penetrate the deep secrets of these words. It may be that we are acting rashly, in that we wish to discuss and to scrutinize the words of God. Yet why were they spoken, but to be known? Why did they sound forth, but to be heard? Why were they heard, but to be understood? Let Him greatly strengthen us, then, and bestow somewhat on us so far as He may deem worthy; and if we do not yet penetrate to the fountain, let us drink of the brook. Behold, John himself has flowed forth to us like a brook, conveyed to us the word from on high. He brought it low, and in a manner levelled it, that we may not dread the lofty One, but may draw nigh to Him that is low.

By all means there is a sense, a true and strong sense, if somehow we can grasp it, in which "the Father judgeth not any man, but hath given all judgment to the Son." For this is said because none will appear to men in the judgment but the Son. The Father will be hidden, the Son will be manifest. In what will the Son be manifest? In the form in which He ascended. For in the form of God He was hidden with the Father; in the form of a servant, manifest to men. Not therefore "the Father judgeth any man, but all judgment hath He given to the Son:" only the manifest judgment, in which manifest judgment the Son will judge, since the same will appear to them that are to be judged. The Scripture shows us more clearly that it is the Son that will appear. On the fortieth day after His resurrection He ascended into heaven, while His disciples were looking on; and they hear the angelic voice: "Men of Galilee," saith it, "why stand ye gazing up into heaven? This same that is taken up from you into heaven, shall so come in like manner as ye have seen Him going into heaven." In what manner did they see Him go? In the flesh, which they touched, which they handled. the wounds even of which they proved by touching; in that body in which He went in and out with them for forty days, manifesting Himself to them in truth, not in falsity; not a phantom, or shadow, or ghost, but, as Himself said, not deceiving them, "Handle and see, for a spirit hath not flesh and bones, as ye see me have." That body is now indeed worthy of a heavenly habitation, not being subject to death, nor mutable by the lapse of ages. It is not as it had grown to that age from infancy, so from the age of manhood declines to old age: He remains as He ascended, to come to those to whom He willed His word to be preached before He comes. Thus will He come in human form, and this form the wicked will see; both they on the right shall see it, and they that are separated to the left shall see it: as it is written, "They shall look on Him whom they pierced." If they shall look on Him whom they pierced, they shall look on that same body which they struck through with the spear; for a spear does not pierce the Word. This body, therefore, will the wicked be able to look on which they were able to wound. God hidden in the body they will not see: after the judgment He will be seen by those who will be on the right hand. This, then, is what He means when He saith, "The Father judgeth not any man, but all judgment hath He given to the Son,"-that the Son will come to judgment manifest, apparent to men in human body; saying to those on the right, "Come, ye blessed of my Father, receive the kingdom;" and to those on the left, "Go into everlasting fire, which is prepared for the devil and his angels."

Behold, that form of man will be seen by the godly and by the wicked, by the just and the unjust, by the believers and unbelievers, by those that rejoice and by those that mourn, by them that trusted and by them that are confounded: lo, seen it will be. When that form shall have appeared in the judgment, and the judgment shall have been finished, where it is said that the Father judgeth not any, but hath given all judgment to the Son, for this reason, that the Son will appear in the judgment in that form which He took from us. What shall be after this? When shall be seen the form of God, which all the faithful are thirsting to see? When shall be seen that Word which was in the beginning, God with God, by which all things were made? When shall be seen that form of God, of which the apostle saith, "Being in the form of God, He thought it not robbery to be equal with God"? For great is that form, in which, moreover, the quality of the Father and Son is recognized; ineffable, incomprehensible, most of all to little ones. When shall this form be seen? Behold, on the right are the just, on the left are the unjust; all alike see the man, they see the Son of man, they see Him who was pierced, Him who was crucified they see: they see Him that was made low, Him who was born of the Virgin, the Lamb of the tribe of Judah they see. But when will they see the Word, God with God? He will be the very same even then, but the form of a servant will appear. The form of a servant will be shown to servants: the form of God will be reserved for sons. Wherefore let the servants be made sons: let them who are on the right hand go into the eternal inheritance promised of old, which the martyrs, though not seeing, believed, for the promise of which they poured out their blood without hesitation; let them go thither and see there. When shall they go thither? Let the Lord Himself say: "So those shall go into everlasting burning, but the righteous into life eternal."

Behold, He has named eternal life. Has He told us that we shall there see and know the Father and Son? What if we shall live for ever, yet not see that Father and Son? Hear, in another place, where He has named eternal life, and expressed what eternal life is: "Be not afraid; I do not deceive thee; not without cause have I promised to them that love me, saying, `He that hath my commandments, and keepeth them, he it is that loveth me; and he that loveth me, shall be loved of my Father, and I will love him, and will show myself to him.'" Let us answer the Lord, and say, What great thing is this, O Lord our God? What great thing is it? Wilt Thou show Thyself to us? What, then, didst Thou not show Thyself to the Jews also? Did not they see Thee who crucified Thee? But Thou wilt show Thyself in the judgment, when we shall stand at Thy right hand; will not also they who will stand on Thy left see Thee? What is it that Thou wilt show Thyself to us? Do we, indeed, not see Thee now when Thou art speaking? He makes answer: I will show myself in the form of God; just now you see the form of a servant. I will not deceive thee, O faithful man; believe that thou shall see. Thou lovest, and yet thou dost not see: shall not love itself lead thee to see? Love, persevere in loving; I will not disappoint thy love, saith He, I who have purified thy heart. For why have I purified thy heart, but to the end that God may be seen by thee? For "blessed are the pure in heart, for they shall see God." "But this," saith the servant, as if disputing with the Lord, "Thou didst not express, when Thou didst say, `The righteous shall go into life eternal;' Thou didst not say, They shall go to see me in the form of God, and to see the Father, with whom I am equal." Observe what He said elsewhere: "This is life eternal, that they may know Thee the one true God,and Jesus Christ whom Thou hast sent."
'''
