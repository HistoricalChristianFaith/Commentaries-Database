[[commentary]]
quote='''
“I became also a reproach unto them” (ver. 24): through the death of the Cross. “For Christ hath redeemed us from the curse of the law, being made a curse for us.” “They looked upon Me, and shaked their heads.” Because they beheld His crucifixion, without beholding His resurrection: they saw when His knees were weakened, they saw not when His flesh was changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
