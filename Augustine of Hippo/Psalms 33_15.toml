[[commentary]]
quote='''
“He fashioneth their hearts singly:” He giveth spiritually to their hearts their proper gifts, so that neither the whole body may be eye, nor the whole hearing; but that one in this manner, another in that manner, may be incorporated with Christ. “He understandeth all their works” (ver. 15). Before Him are all their works understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
