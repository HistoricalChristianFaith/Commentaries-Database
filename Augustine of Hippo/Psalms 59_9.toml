[[commentary]]
quote='''
Therefore, it is good for a person to say truthfully and with the full strength of his free will, "I will provide you with my strength," because the man who thought he could keep it without the help of him who gave it went abroad into a far country and wasted his substance, living riotously. But, worn down by the wretchedness of a harsh slavery, he returned to himself and said, "I will arise and go to my father." But how could he have had this good thought if the most merciful Father had not whispered it to him in secret? It was because he understood this that the minister of the New Testament said, "Not that we are sufficient to think anything of ourselves as of ourselves, but our sufficiency is from God." Consequently, when the psalmist also had said, "I will provide you with my strength," lest he should attribute to himself the fact that he was keeping it, and as if he recalled to mind that "except the Lord keep the city, they watch in vain that keep it," and that "he shall neither slumber nor sleep that keeps Israel," he added the reason of his being able to keep it, or, rather, the guard by whom it is kept and said, "For you, O God, are my protector."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 186"

[[commentary]]
quote='''
“My strength to Thee I will keep” (ver. 9). For those strong men have fallen for this reason; because their strength to Thee they have not kept: that is, they that upon me have risen up and rushed, on themselves have relied. But I “my strength to Thee will keep:” because if I withdraw, I fall; if I draw near, stronger I am made. For see, brethren, what there is in a human soul. It hath not of itself light, hath not of itself powers: but all that is fair in a soul, is virtue and wisdom: but it neither is wise for itself, nor strong for itself, nor itself is light to itself, nor itself is virtue to itself. There is a certain origin and fountain of virtue, there is a certain root of wisdom, there is a certain, so to speak, if this also must be said, region of unchangeable truth: from this the soul withdrawing is made dark, drawing near is made light. “Draw near to Him, and be made light:” because by withdrawing ye are made dark. Therefore, “my strength, I will keep to Thee:” not from Thee will I withdraw, not on myself will I rely. “My strength, to Thee I will keep: because, O God, my lifter up Thou art.” For where was I, and where am I? Whence hast Thou taken me up? What iniquities of mine hast Thou remitted? Where was I lying? To what have I been raised up? I ought to have remembered these things: because in another Psalm is said, “For my father and my mother have forsaken me, but the Lord hath taken me unto Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
