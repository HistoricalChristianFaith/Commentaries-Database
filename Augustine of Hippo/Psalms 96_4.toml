[[commentary]]
quote='''
“For the Lord is great, and cannot worthily be praised” (ver. 4). What Lord, except Jesus Christ, “is great, and cannot worthily be praised”? Ye know surely that He appeared as a Man: ye know surely that He was conceived in a woman’s womb, ye know that He was born from the womb, that He was suckled, that He was carried in arms, circumcised, that a victim was offered for Him, that He grew; lastly, ye know that He was buffeted, spit upon, crowned with thorns, was crucified, died, was pierced with a spear; ye know that He suffered all these things: “He is great, and cannot worthily be praised.” Despise not what is little, understand what is great. He became little, because ye were such: let Him be acknowledged great, and in Him ye shall be great.…For what can a small tongue say towards the praise of the Great One? By saying, Beyond praise, he hath spoken, and hath given to imagination what it may conceive: as if saying, What I cannot utter, do thou reflect on; and when thou shalt have reflected, it will not be enough. What no man’s thought uttereth, doth any man’s tongue utter? “The Lord is great, and cannot worthily be praised.” Let Him be praised, and preached: His honour declared, and His house built.

…For the spot where he wished to build the house, is itself woody, where it was said yesterday, “we found it in the wood.” For he was seeking that very house, when he said, “in the wood.” And why is that spot woody? Men used to worship images: it is not wonderful that they fed hogs. For that son who left his father, and spent his all on harlots, living as a prodigal, used to feed hogs, that is, to worship devils; and by this very superstition of the heathen, all the earth became a wood. But he who buildeth a house, rooteth up the wood; and for this reason it was said, “While the house was being built, after the captivity.” For men were held captive under the devil, and served devils; but they were redeemed from captivity. They could sell, but they could not redeem themselves. The Redeemer came, and gave a price; He poured forth His Blood, and bought the whole world. Ye ask what He bought? Ye see what He hath given; find out then what He bought. The Blood of Christ was the price. What is equal to this? What, but the whole world? What, but all nations? They are very ungrateful for their price, or very proud, who say that the price is so small that it bought the Africans only; or that they are so great, as that it was given for them alone. Let them not then exult, let them not be proud: He gave what He gave for the whole world. He knew what He bought, because He knew at what price He bought it. Thus because we are redeemed, the house is built after the captivity. And who are they who held us in captivity? Because they to whom it is said, “Declare His honour,” are the clearers of the wood: that they may root out the wood, free the earth from captivity, and build, and raise up, by declaring the greatness of the Lord’s house. How is the wood of devils cleared away, unless He who is above them all be preached? All nations then had devils for their gods: those whom they called gods, were devils, as the Apostle more openly saith, “The things which the Gentiles sacrifice, they sacrifice unto devils, and not to God.” Since therefore they were in captivity, because they sacrificed to devils, and on that account the whole earth had remained woody; He is declared to be great, and above all worldly praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
