[[commentary]]
quote='''
“For thou wilt light My candle, O Lord” (ver. 28). For our light is not from ourselves; but “Thou wilt light my candle, O Lord. O my God, Thou wilt enlighten my darkness.” For we through our sins are darkness; but “Thou, O my God, wilt enlighten my darkness.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
