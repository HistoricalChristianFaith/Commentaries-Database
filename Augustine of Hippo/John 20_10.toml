[[commentary]]
quote='''
Mary Magdalene had brought the news to His disciples, Peter and John, that the Lord was taken away from the sepulchre; and they, when they came thither, found only the linen clothes wherewith the body had been shrouded; and what else could they believe but what she had told them, and what she had herself also believed? "Then the disciples went away again unto their own" (home); that is to say, where they were dwelling, and from which they had run to the sepulchre.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520121.html'
source_title="Tractates on John 121"
