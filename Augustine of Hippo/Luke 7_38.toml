[[commentary]]
quote='''
Under no circumstances would any reasonable person imagine that the Lord's feet were anointed with precious ointment by the woman for the same reason that was customary for sensual, dissolute men whose banquets were such that we loathe them. In that case the good odor is the good reputation that each one will possess by the works of good life, as long as one follows the footsteps of Christ, and as it were, anoints his feet with very precious ointment. Hence what is frequently sinful in other persons is a symbol of some sublime truth in the person of God or a prophet.
'''
source_url=''
source_title="CHRISTIAN INSTRUCTION 12:18"

[[commentary]]
quote='''
(de Cons. Ev. lib. ii. c. 79.) For I think we must understand that the same Mary did this twice, once indeed as Luke has related, when at first coming with humility and weeping, she was thought worthy to receive forgiveness of sins. Hence John, when he began to speak of the resurrection of Lazarus, before he came to Bethany, says, But it was Mary who anointed our Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick. (John 11:2.) Mary therefore had already done this; but what she again did in Bethany is another occurrence, which belongs not to the relation of Luke, but is equally told by the other three.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For this hair signifieth a superfluity of things temporal. Which hairs indeed are not made by God superfluously on the body of men, but for a sort of ornament: yet because without feeling they are cut off, they that cleave to the Lord with their heart, so have these earthly things as they have hair. But sometimes even something of good with “hair” is wrought, when thou breakest bread to the hungry, the poor without roof thou bringest into thy house; if thou shalt have seen one naked, thou coverest him: lastly, the Martyrs themselves also imitating the Lord, blood for the Church shedding, hearing that voice, “As Christ laid down His life for us, so also ought we also to lay down for the brethren,” in a certain way with their hair did good to us, that is, with those things which that razor can lop off or scrape. But that therefore even with the very hair some good can be done, even that woman a sinner intimated, who, when she had wept over the feet of the Lord, with her hair wiped what with tears she wetted. Signifying what? That when thou shalt have pitied any one, thou oughtest to relieve him also if thou canst. For when thou hast pity, thou sheddest as it were tears: when thou relievest, thou wipest with hair. And if this to any one, how much more to the feet of the Lord. The feet of the Lord are what? The holy Evangelists, whereof is said, “How beautiful are the feet of them that tell of peace, that tell of good things!”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
