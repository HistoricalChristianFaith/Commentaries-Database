[[commentary]]
quote='''
The most blessed Paul-certainly not himself the only-begotten Son of God, but the servant and apostle of that Son; not the Truth, but a partaker of the truth-declares with freedom and consistency, "And though I would desire to glory, I shall not be a fool; for I say the truth." For it would not be in himself, but in the truth, which is superior to himself, that he was glorying both humbly and truly: for it is he also who has given the charge, that he that glorieth should glory in the Lord. Could thus the lover of wisdom have no fear of being chargeable with foolishness, though he desired to glory, and would wisdom itself, in its glorying, have any fear of such a charge?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252058.html'
source_title="Tractates on John 58"
