[[commentary]]
quote='''
Lend not money at interest. Thou accusest Scripture which saith, “He that hath not given his money upon usury.” I wrote not this: it went not forth first from my mouth: hear God. He replieth: let not the clergy lend upon usury. Perchance he who speaketh to thee, lendeth not at interest: but if he do so lend, suppose that he doth so lend; doth He who speaketh through him lend at interest? If he doth what he enjoineth thee, and thou dost it not; thou wilt go into the flame, he into the kingdom. If he doth not what he enjoineth thee, and equally with thee doth evil deeds, and preaches duties which he doth not; ye will both equally go into the flames. The hay will burn; but “the word of the Lord abideth for evermore.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520129.html'
source_title="Exposition on Psalm 129"
