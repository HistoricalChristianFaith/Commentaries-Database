[[commentary]]
quote='''
So by bread you are instructed as to how you ought to cherish unity. Was that bread made of one grain of wheat? Were there not, rather, many grains? However, before they became bread, these grains were separate. They were joined together in water after a certain amount of crushing. For unless the grain is ground and moistened with water, it cannot arrive at that form which is called bread. So, too, you were previously ground, as it were, by the humiliation of your fasting and by the sacrament of exorcism. Then came the baptism of water. You were moistened, as it were, so as to arrive at the form of bread. But without fire, bread does not yet exist.
'''
source_url=''
source_title="EASTER SERMON 227"

[[commentary]]
quote='''
The one who is properly said to eat the body of Christ and to drink his blood is the one who is incorporated into the unity of his body. Heretics and schismatics can receive the sacrament but to no avail—in fact, to their harm—since the result is to increase their pain rather than to curtail the length of their punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252021.html'
source_title="City of God 21.25"

[[commentary]]
quote='''
Believers know the body of Christ, if they neglect not to be the body of Christ. Let them become the body of Christ, if they wish to live by the Spirit of Christ. None lives by the Spirit of Christ but the body of Christ. Understand, my brethren, what I mean to say. Thou art a man; thou hast both a spirit and a body. I call that a spirit which is called the soul; that whereby it consists that thou art a man, for thou consistest of soul and body. And so thou hast an invisible spirit and a visible body. Tell me which lives of the other: does thy spirit live of thy body, or thy body of thy spirit? Every man that lives can answer; and he that cannot answer this, I know not whether he lives: what doth every man that lives answer? My body, of course, lives by my spirit. Wouldst thou then also live by the Spirit of Christ. Be in the body of Christ. For surely my body does not live by thy spirit. My body lives by my spirit, and thy body by thy spirit. The body of Christ cannot live but by the Spirit of Christ. It is for this that the Apostle Paul, expounding this bread, says: "One bread," saith he, "we being many are one body." O mystery of piety! O sign of unity! O bond of charity! He that would live has where to live, has whence to live. Let him draw near, let him believe; let him be embodied, that he may be made to live. Let him not shrink from the compact of members; let him not be a rotten member that deserves to be cut off; let him not be a deformed member whereof to be ashamed; let him be a fair, fit, and sound member; let him cleave to the body, live for God by God: now let him labor on earth, that hereafter he may reign in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
