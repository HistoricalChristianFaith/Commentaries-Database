[[commentary]]
quote='''
“Let them alway be against the Lord” (ver. 14). “Against the Lord,” meaneth in the Lord’s sight: for other translators have rendered this line, “let them be always in the sight of the Lord;” while others have rendered it, “let them be before the Lord alway;” as it is elsewhere said, “Thou hast set our misdeeds in Thy sight.” By “alway,” he meaneth that this great crime should be without pardon, both here, and in a future life. “Let the memorial of them perish from off the earth:” that is, of his father and of his mother. By memorial of them, he meaneth, that which is preserved by successive generations: this he prophesied should perish from the earth, because both Judas himself, and his sons, who were the memorial of his father and mother, without any succeeding offspring, as it is said above, were consumed in the short space of one generation.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
