[[commentary]]
quote='''
It talks of a mountain, and the mountain is veiled to the party of Donatus.… The holy Daniel saw a vision and wrote down what he saw, and he said that he had seen a stone hewn out of a mountain without hands. It is Christ, coming from the nations of the Jews, which was also a mountain, you see, because it has the kingdom.… What is the mountain over which the heretics stumbled? Listen to Daniel again: "And that stone grew and became a great mountain, such that it filled all the face of the earth." How right the psalm is to say to Christ the Lord as he rises again, "Be exalted over the heavens, O God, and let your glory be over the whole earth." What is your glory over the whole earth? Over the whole earth is your church, over the whole earth your bride. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520147A.html'
source_title="SERMON 147A. 4"

[[commentary]]
quote='''
“His holy Hill” is His holy Church. It is that mountain which, according to Daniel’s vision, grew from a very small “stone,” till it crushed the kingdoms of the earth; and grew to such a size, that it “filled the face of the earth.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252043.html'
source_title="Exposition on Psalm 43"

[[commentary]]
quote='''
For out of a small stone He hath grown, and become a great mountain, so that He hath filled all the face of the earth. Why then wouldest thou by land come to Him, who filleth all lands? Lo, He hath already come: watch thou. By growing He waketh even sleepers; if yet there is not in them so deep sleep, as that they be hardened even against the mountain coming; but they hear, “Awake, thou that sleepest, and arise from the dead, and Christ shall give thee light.” For it was a great thing for the Jews to see the stone. For the stone was yet small: and small they deservedly despised it, and despising they stumbled, and stumbling they were broken; remains that they be ground to powder. For so was it said of the stone, “Whosoever shall fall upon that stone shall be broken; but on whomsoever it shall fall, it will grind him to powder.” It is one thing to be broken, another to be ground to powder. To be broken is less than to be ground to powder: but none grindeth He coming exalted, save whom He brake lying low. For now before His coming He lay low before the Jews, and they stumbled at Him, and were broken; hereafter shall He come in His Judgment, glorious and exalted, great and powerful, not weak to be judged, but strong to judge, and grind to powder those who were broken stumbling at Him. For “A stone of stumbling and a rock of offence,” is He to them that believe not. Therefore, brethren, no wonder if the Jews acknowledged not Him, whom as a small stone lying before their feet they despised. They are to be wondered at, who even now so great a mountain will not acknowledge. The Jews at a small stone by not seeing stumbled; the heretics stumble at a mountain. For now that stone hath grown, now say we unto them, Lo, now is fulfilled the prophecy of Daniel, “The stone that was small became a great mountain, and filled the whole earth.” Wherefore stumble ye at Him, and go not rather up to Him? Who is so blind as to stumble at a mountain? Came He to thee that thou shouldest have whereat to stumble, and not have whereto to go up?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
