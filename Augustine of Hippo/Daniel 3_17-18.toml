[[commentary]]
quote='''
Let us fear that death which the three men feared when they said to the king, "God is able to deliver us even from that flame; and if not," etc. There was there the fear of that death which the Lord now threatens, when they said, But also if He be not willing openly to deliver us, He can crown us with victory in secret.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"
