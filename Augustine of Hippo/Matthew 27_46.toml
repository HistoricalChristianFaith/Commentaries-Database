[[commentary]]
quote='''
And yet He had said, “My God! My God! why hast Thou forsaken Me?” and He now says, “O My God, depart not from Me.” If He does not forsake the body, did He forsake the Head? Whose words then are these but the First Man’s? To show then that He carried about Him a true body of flesh derived from him, He says, “My God, My God why hast Thou forsaken Me?” God had not forsaken Him. If He does not forsake Thee, who believest in Him, could the Father, the Son, and the Holy Ghost, One God, forsake Christ? But He had transferred to Himself the person of the First Man. We know by the words of an Apostle, that “our old man is crucified with Him.” We should not, however, be divested of our old nature, had He not been crucified “in weakness.” For it was to this end that He came that we may be renewed in Him, because it is by aspiration after Him, and by following the example of His suffering, that we are renewed. Therefore that was the cry of infirmity; that cry, I mean, in which it was said, “Why hast Thou forsaken Me?” Thence was it said in that passage above, “the words of mine offences.” As if He were saying, These words are transferred to My Person from that of the sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"

[[commentary]]
quote='''
Hidden then was the God of gods, and He gave forth words more out of compassion for us than out of His own majesty. For whence, unless assumed from us, were those words, “My God, My God, why hast Thou forsaken me?” But when hath the Father forsaken the Son, or the Son the Father? Are not Father and Son one God? Whence then, “My God, My God, why hast Thou forsaken Me,” save that in the Flesh of infirmity there was acknowledged the voice of a sinner? For as He took upon Him the likeness of the flesh of sin, why should He not take upon Him the voice of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
When would He have been seized, except they had first said in their heart, “God hath forsaken Him?” Whence there was that voice on the Cross, “My God, My God, why hast Thou forsaken Me?” So then did God forsake Christ, though “God was in Christ reconciling the world to Himself,” though Christ was also God, out of the Jews indeed according to the flesh, “Who is over all things, God blessed for ever,”—did God forsake Him? Far be it. But in our old man our voice it was, because our old man was crucified together with Him: and of that same our old man He had taken a Body, because Mary was of Adam. Therefore the very thing which they thought, from the Cross He said, “Why hast Thou forsaken Me?” Why do these men think Me left alone to their evil? What is, think Me forsaken in their evil?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
