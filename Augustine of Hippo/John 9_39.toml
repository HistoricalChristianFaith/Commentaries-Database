[[commentary]]
quote='''
“Because it is a commandment for Israel, and a judgment for the God of Jacob” (ver. 4). Where a commandment, there judgment. For, “They that have sinned in the Law, by the Law shall be judged.” And the very Giver of the commandment, the Lord Christ, the Word made flesh, saith, “For judgment I am come into the world, that they that see not may see, and they that see may be made blind.” What is, “That they that see not may see, they that see be made blind,” but that the lowly be exalted, the proud thrown down? For not they that see are to be made blind, but those who to themselves seem to see are to be convicted of blindness. This is brought about in the mystery of the press, that they who see may not see, and they that see be made blind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"

[[commentary]]
quote='''
“Clouds and darkness are round about Him: righteousness and judgment are the direction of His seat” (ver. 2).…The Lord Himself saith: “For judgment I am come into this world; that they which see not might see, and that they which see might be made blind.” They who seem unto themselves to see, who think themselves wise, who think healing not needful for them, that they may be made blind, may not understand. And that “they which see not may see;” that they who confess their blindness may obtain to be enlightened. Let there be therefore “clouds and darkness round about Him,” for those who have not understood Him: for those who confess and humble themselves, “righteousness and judgment are the direction of His seat.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"

[[commentary]]
quote='''
But grace, indeed, effects this purpose—that good works should now be wrought by those who previously did evil; not that they should persevere in evil courses and suppose that they are recompensed with good. Their language, therefore, ought not to be: "Let us do evil, that good may come;" but: "We have done evil, and good has come; let us henceforth do good, that in the future world we may receive good for good, who in the present life are receiving good for evil." Wherefore it is written in the Psalm, "I will sing of mercy and judgment unto Thee, O Lord." When the Son of man, therefore, first came into the world, it was not to judge the world, but that the world through Him might be saved. And this dispensation was for mercy; by and by, however, He will come for judgment—to judge the quick and the dead. And yet even in this present time salvation itself does not eventuate without judgment—although it be a hidden one; therefore He says, "For judgment I am come into this world, that they which see not may see, and that they which see may be made blind."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 44"
