[[commentary]]
quote='''
People argue against this evident truth. What else, after all, could you expect from mere people, who savor the things of humankind, but to argue about God against God? I mean, he is God, they are mere individuals. But God "knows the thoughts of people, that they are vain." With worldly, materialistic people, what they are in the habit of observing entirely governs their manner of understanding. What they are accustomed to see, they can believe; what they aren't, they can't. God performs miracles that go beyond what we are accustomed to, because he is God. It is in fact a greater miracle, so many people being born every day who did not previously exist, than a few having risen again, who did exist; and yet this kind of miracle is not seriously considered and appreciated, but being so common is disregarded as uninteresting. Christ rose again; the case is complete and closed. He was body, he was flesh, which hung on the cross, gave up the soul, was placed in the tomb. He presented it alive, seeing he lived in it. Why are we astonished, why don't we believe? It is God who did it. Reflect on the one who brought it about, and you eliminate all possibility of doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520242.html'
source_title="SERMON 242:1"

[[commentary]]
quote='''
“The Lord knoweth the thoughts of man, that they are but vain” (ver. 11). For although thou knowest not the thoughts of God, that they are righteous; “He knoweth the thoughts of man, that they are but vain.” Even men have known the thoughts of God: but those to whom He hath become a friend, it is to them He showeth His counsel. Do not, brethren, despise yourselves: if ye approach the Lord with faith, ye hear the thoughts of God; these ye are now learning, this is told you, and for this reason ye are taught, why God spareth the wicked in this life, that ye may not murmur against God, who teacheth man knowledge. “The Lord knoweth the thoughts of man, that they are but vain.” Abandon therefore the thoughts of man, which are vain: that ye may take hold on the thoughts of God, which are wise. But who is he who taketh hold on the thoughts of God? He who is placed in the firmament of heaven. We have already chanted that Psalm, and have expounded this expression therein.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
