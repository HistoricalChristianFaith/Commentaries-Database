[[commentary]]
quote='''
For if they placed their hope in God, not only would their desires of the flesh but also those of the spirit have been fulfilled. For he that…“opened the doors of Heaven, and rained upon them manna to eat,” that He might fill the unbelieving, is not without power to give to believers Himself the true Bread from Heaven, which the manna did signify: which is indeed the food of Angels, whom being incorruptible the Word of God doth incorruptibly feed: the which in order that man might eat, He became flesh, and dwelled in us. For Himself the Bread by means of the Evangelical clouds is being rained over the whole world, and, the hearts of preachers like heavenly doors, being opened, is being preached not to a murmuring and tempting synagogue, but to a Church believing and putting hope in Him. He is able also to feed the feeble faith of such as tempt not, but believe, with the signs of words uttered by the flesh and speeding through the air, as though it were fowls: not however with such as come from the north, where cold and mist do prevail, that is to say, eloquence which is pleasing to this world, but by bringing over the South Wind from Heaven; whither, except to the earth? In order that they who are feeble in faith, by hearing things earthly may be nourished up to receive things heavenly.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
