[[commentary]]
quote='''
The fear of slaves, although it renders belief to the Master, contains no love of righteousness but only the fear of damnation. The cry of sons is "Abba, Father!"—two words, one of which belongs to the circumcision and the other to the uncircumcision.
'''
source_url=''
source_title="THE SPIRIT AND THE LETTER 56"

[[commentary]]
quote='''
Paul is speaking of the fear which was inspired in the Old Testament, lest the temporal be lost which God had promised to those who were not yet his sons under grace but still servants under the law.
'''
source_url='https://www.newadvent.org/fathers/1310.htm'
source_title="On Holy Virginity 38.39"

[[commentary]]
quote='''
For just as there are two kinds of fear, which produce two classes of fearers; so there are two kinds of service, which produce two classes of servants. There is a fear, which perfect love casteth out; and there is another fear, which is clean, and endureth for ever. The fear that lies not in love, the apostle pointed to when he said, "For ye have not received the spirit of service again to fear." But he referred to the clean fear when he said, "Be not high-minded, but fear." In that fear which love casteth out, there has also to be cast out the service along with it: for both were joined together by the apostle, that is, the service and the fear, when he said, "For ye have not received the spirit of service again to fear." And it was the servant connected with this kind of service that the Lord also had in His eye when He said, "Henceforth I call you not servants; for the servant knoweth not what his lord doeth." Certainly not the servant characterized by the clean fear, to whom it is said, "Well done, thou good servant: enter thou into the joy of thy lord;" but the servant who is characterized by the fear which love casteth out, of whom He elsewhere saith, "The servant abideth not in the house for ever, but the Son abideth ever." Since, therefore, He hath given us power to become the sons of God, let us not be servants, but sons: that, in some wonderful and indescribable but real way, we may as servants have the power not to be servants; servants, indeed, with that clean fear which distinguishes the servant that enters into the joy of his lord, but not servants with the fear that has to be cast out, and which marketh him that abideth not in the house for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252085.html'
source_title="Tractates on John 85"

[[commentary]]
quote='''
When he says: For you have not received a spirit of servitude unto fear, but you have received the Spirit of the adoption of sons, in whom we cry: Abba, Father!—the times of the two Testaments are most clearly distinguished; for that one pertains to fear, but the New to love. But it is asked, what is the spirit of servitude? For the Spirit of the adoption of sons is surely the Holy Spirit; the spirit of servitude in fear, then, is he who has the power of death, because by that very fear those were held liable to servitude throughout their whole life who lived under the law, not under grace. Nor is it to be wondered at that those who pursued temporal goods received him through divine providence—not that the law and the commandment are his. For: The law is holy, and the commandment holy and just and good; but that spirit of servitude, which is surely not good, is received by those who cannot fulfill the precepts of the given law, while they serve carnal desires, not yet taken up by the grace of the Liberator into the adoption of sons; for that spirit of servitude too holds no one in its power except him who, by the order of divine providence, has been handed over to it, God's justice assigning to each his own. This power the Apostle had received, when he says of certain persons: Whom I have handed over to Satan, that they may learn not to blaspheme; and again of another: I have already judged, he says, to hand over such a one to Satan for the destruction of the flesh, that the soul may be saved. Those, therefore, who are not yet under grace and, established under the law, are conquered by sins so as to obey carnal desires, and by transgression increase the guilt of their crimes, have received the spirit of servitude, that is, the spirit of him who has the power of death. For if we understand by the spirit of servitude the very spirit of man, then the spirit of adoption too begins to be understood as that same spirit changed for the better. But since we take the Spirit of adoption to be the Holy Spirit—which he clearly shows when he says: The Spirit himself bears witness to our spirit—it remains that we understand the spirit of servitude to be that one whom sinners serve, so that, just as the Holy Spirit delivers from the fear of death, so the spirit of servitude, which has the power of death, holds the guilty by the terror of that same death, so that each one may turn himself to the help of the Liberator—even against the will of the devil himself, who desires always to hold him in his power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
But that the title hath Halleluia not once only but twice, is not peculiar to this Psalm, but the former also hath it so. And as far as appears from its text, that was sung of the people of Israel, but this is sung of the universal Church of God, spread through the whole world. Perchance, it not unfitly hath Halleluia twice, because we cry, Abba, Father. Since Abba is nothing else but Father, yet not without meaning the Apostle said, “in whom we cry, Abba, Father;” but because one wall indeed coming to the Corner Stone crieth Abba, but the other, from the other side crieth Father; viz., in that Corner Stone, “who is our Peace, who hath made both one.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
