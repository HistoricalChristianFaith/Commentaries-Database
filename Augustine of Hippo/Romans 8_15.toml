[[commentary]]
quote='''
The fear of slaves, although it renders belief to the Master, contains no love of righteousness but only the fear of damnation. The cry of sons is "Abba, Father!"—two words, one of which belongs to the circumcision and the other to the uncircumcision.
'''
source_url=''
source_title="THE SPIRIT AND THE LETTER 56"

[[commentary]]
quote='''
Paul is speaking of the fear which was inspired in the Old Testament, lest the temporal be lost which God had promised to those who were not yet his sons under grace but still servants under the law.
'''
source_url='https://www.newadvent.org/fathers/1310.htm'
source_title="On Holy Virginity 38.39"

[[commentary]]
quote='''
For just as there are two kinds of fear, which produce two classes of fearers; so there are two kinds of service, which produce two classes of servants. There is a fear, which perfect love casteth out; and there is another fear, which is clean, and endureth for ever. The fear that lies not in love, the apostle pointed to when he said, "For ye have not received the spirit of service again to fear." But he referred to the clean fear when he said, "Be not high-minded, but fear." In that fear which love casteth out, there has also to be cast out the service along with it: for both were joined together by the apostle, that is, the service and the fear, when he said, "For ye have not received the spirit of service again to fear." And it was the servant connected with this kind of service that the Lord also had in His eye when He said, "Henceforth I call you not servants; for the servant knoweth not what his lord doeth." Certainly not the servant characterized by the clean fear, to whom it is said, "Well done, thou good servant: enter thou into the joy of thy lord;" but the servant who is characterized by the fear which love casteth out, of whom He elsewhere saith, "The servant abideth not in the house for ever, but the Son abideth ever." Since, therefore, He hath given us power to become the sons of God, let us not be servants, but sons: that, in some wonderful and indescribable but real way, we may as servants have the power not to be servants; servants, indeed, with that clean fear which distinguishes the servant that enters into the joy of his lord, but not servants with the fear that has to be cast out, and which marketh him that abideth not in the house for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252085.html'
source_title="Tractates on John 85"
