
[[commentary]]
quote='''
“Because I kept silence, my bones waxed old:” because I made not with my mouth “confession unto salvation,” all firmness in me has grown old in infirmity. “Through my roaring all the day long” (ver. 3): when I was ungodly and a blasphemer, crying against God, as though defending and excusing my sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252032.html'
source_title="Exposition on Psalm 32"
