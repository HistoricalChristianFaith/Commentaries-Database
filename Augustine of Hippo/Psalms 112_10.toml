[[commentary]]
quote='''
Dearly beloved, whether the Jews receive these divine testimonies with joy or with indignation, nevertheless, when we can, let us proclaim them with great love for the Jews. Let us not proudly glory against the broken branches; let us rather reflect by whose grace it is, and by much mercy, and on what root, we have been ingrafted. Then, not savoring of pride but with a deep sense of humility, not insulting with presumption but rejoicing with trembling, let us say, "Come and let us walk in the light of the Lord," because his "name is great among the Gentiles." If they hear him and obey him, they will be among them to whom Scripture says, "Come to him and be enlightened, and your faces shall not be confounded." If, however, they hear and do not obey, if they see and are jealous, they are among them of whom the psalm says, "The wicked shall see and shall be angry, he shall gnash with his teeth and pine away." "But I," the church says to Christ, "as a fruitful olive tree in the house of God, have hoped in the mercy of God for ever, yea forever and ever."
'''
source_url=''
source_title="IN ANSWER TO THE JEWS 10:15"

[[commentary]]
quote='''
At first there was the assault of them persecuting, now there hath remained the malice of them thinking. In fact, there are in the Church distinct seasons of persecutions following one another. There was made an assault on the Church when kings were persecuting: and because kings had been foretold as to persecute and as to believe, when one had been fulfilled the other was to follow. There came to pass also that which was consequent; kings believed, peace was given to the Church, the Church began to be set in the highest place of dignity, even on this earth, even in this life: but there is not wanting the roar of persecutors, they have turned their assaults into thoughts. In these thoughts, as in a bottomless pit, the devil hath been bound, he roareth and breaketh not forth. For it hath been said concerning these times of the Church, “The sinner shall see, and shall be angry.” And shall do what? That which he did at first? Drag, bind, smite? He doeth not this. What then? “With his teeth he shall gnash, and shall pine away.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"

[[commentary]]
quote='''
“The ungodly shall see it, and he shall be angered” (ver. 10): this is that late and fruitless repentance. For with whom rather than himself is he “angered,” when he shall say, “Our pride, what hath it profited us? the boastfulness of our riches, what hath it given us?” seeing the horn of him exalted with honour, who “dispersed abroad, and gave to the poor.” “He shall gnash with his teeth, and consume away:” for “there shall be weeping and gnashing of teeth.” For he will no more bring forth leaves and bloom, as would happen if he had repented in season: but he will then repent, when “the desire of the ungodly shall perish,” no consolation succeeding. “The desire of the ungodly shall perish,” when “all things shall pass away like a shadow,” when the flower shall fall down on the withering of the grass. “But the word of the Lord that endureth for ever,” as it is mocked by the vanity of the falsely happy, so will laugh at the perdition of the same when truly miserable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
