[[commentary]]
quote='''
“I have not shrunk,” he saith, “from Thy judgments: for Thou hast laid down a law for me” (ver. 102). He hath stated what made him fear, so that he refrained his feet from every evil way.…Thou, more inward than my inmost self, Thou hast laid down a law within my heart by Thy Spirit, as it were by Thy fingers, that I might not fear it as a slave without love, but might love it with a chaste fear as a son, and fear it with a chaste love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
