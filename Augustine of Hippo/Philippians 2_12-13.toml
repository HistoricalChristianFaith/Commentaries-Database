[[commentary]]
quote='''
Wherefore to be feared and not to be loved? Hear thou another voice of a Psalm: “Serve ye the Lord in fear, and exult unto Him with trembling.” What meaneth this? Hear the voice of the Apostle: “With fear,” he saith, “and trembling, your own salvation work ye out.” Wherefore with fear and trembling? He hath subjoined the reason: “for God it is that worketh in you both to will and to work according to good will.” If therefore God worketh in thee, by the Grace of God thou workest well, not by thy strength. Therefore if thou rejoicest, fear also: lest perchance that which was given to a humble man be taken away from a proud one.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"


[[commentary]]
quote='''
“Who looketh on the earth, and maketh it tremble; who toucheth the hills, and they shall smoke” (ver. 32). O earth, thou wast exulting in thy good, to thyself thou didst ascribe thy fulness and opulence; behold, the Lord looketh on thee, and causeth thee to tremble. May He look on thee, and make thee tremble: for the trembling of humility is better than the confidence of pride.…For it is God, he saith, which worketh in you. For this reason then with trembling, because God worketh in you. Because He gave, because what thou hast cometh not from thee, thou shalt work with fear and trembling, for if thou fearest not Him, He will take away what He gave. Work, therefore, with trembling. Hear another Psalm: “Serve the Lord with fear, and rejoice unto Him with trembling.” If we must rejoice with trembling, God beholdeth us, there cometh an earthquake; when God looketh upon us, let our hearts tremble; then will God rest there. Hear Him in another passage: “Upon whom shall My Spirit rest? Even on him that is lowly and quiet, and who trembleth at My Word.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"

[[commentary]]
quote='''
“Work out your own salvation,” saith the Apostle, “with fear and trembling.” If we do work out our own salvation, wherefore with fear, wherefore with trembling, when what we work is in our own power? Hear wherefore with fear and trembling: “for it is God that worketh in you both to will and to do, of His good pleasure.” Therefore “with fear and trembling,” that it may delight our Maker to work in the lowly valley.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
