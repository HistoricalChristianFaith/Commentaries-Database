[[commentary]]
quote='''
Observe how not only concerning a cool place, but neither of that very fire to be desired he hath been silent: “I will enter into Thy House in holocausts” (ver. 13). What is a holocaust? A whole sacrifice burned up, but with fire divine. For a sacrifice is called a holocaust, when the whole is burned. One thing are the parts of sacrifices, another thing a holocaust: when the whole is burned and the whole consumed by fire divine, it is called a holocaust: when a part, a sacrifice. Every holocaust indeed is a sacrifice: but not every sacrifice a holocaust. Holocausts therefore he is promising, the Body of Christ is speaking, the Unity of Christ is speaking, “I will enter into Thy House in holocausts.” All that is mine let Thy fire consume, let nothing of mine remain to me, let all be Thine. But this shall be in the Resurrection of just men, “when both this corruptible shall be clad in incorruption, and this mortal shall be clad in immortality: then shall come to pass that which hath been written, ‘Death is swallowed up in victory.’” Victory is, as it were, fire divine: when it swalloweth up our death also, it is a holocaust. There remaineth not anything mortal in the flesh, there remaineth not anything culpable in the spirit: the whole of mortal life shall be consumed, in order that in life everlasting it may be consummated, that from death we may be preserved in life. These therefore will be the holocausts. And what shall there be “in the holocausts”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
