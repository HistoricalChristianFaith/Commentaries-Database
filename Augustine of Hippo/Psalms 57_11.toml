[[commentary]]
quote='''
Giving therefore to Him thanks, let us say with the same Psalm the last verses, which sometime since too I have said, “Be Thou exalted above the Heavens, O God, and above all the earth Thy glory” (ver. 11). For this to Him the Prophet said so many years before; this now we see; this therefore let us also say.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
