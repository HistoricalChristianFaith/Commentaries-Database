[[commentary]]
quote='''
Now as to Chusi, from the interpretation of silence, it is rightly understood that our Lord contended against that guile in silence, that is, in that most deep secret, whereby “blindness happened in part to Israel,” when they were persecuting the Lord, that the fulness of the Gentiles might enter in, and “so all Israel might be saved.” When the Apostle came to this profound secret and deep silence, he exclaimed, as if struck with a kind of awe of its very depth, “O the depth of the riches of the wisdom and knowledge of God! how unsearchable are His judgments, and His ways past finding out! For who hath known the wind of the Lord, or who hath been His counsellor?” Thus that great silence he does not so much discover by explanation, as he sets forth its greatness in admiration. In this silence the Lord, hiding the sacrament of His adorable passion, turns the brother’s voluntary ruin, that is, His betrayer’s impious wickedness, into the order of His mercy and providence: that what he with perverse mind wrought for one Man’s destruction, He might by providential overruling dispose for all men’s salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
