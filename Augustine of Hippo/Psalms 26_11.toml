[[commentary]]
quote='''
“But I have walked in mine innocence: deliver me, and have mercy on me” (ver. 11). Let so great a price of my Lord’s Blood avail for my complete deliverance: and in the dangers of this life let not Thy mercy leave me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
