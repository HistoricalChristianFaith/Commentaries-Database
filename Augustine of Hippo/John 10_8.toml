[[commentary]]
quote='''
(Tr. xlv. 8) All that ever came before Me are thieves and robbers. Understand, All that ever came at variance with Me. The Prophets were not at variance with Him. They came with Him, who came with the Word of God, who spake the truth. He, the Word, the Truth, sent heralds before Him, but the hearts of those whom He sent were His own. They came with Him, inasmuch as He is always, though He assumed the flesh in time: In the beginning was the Word. His humble advent in the flesh was preceded by just men, who believed on Him as about to come, as we believe on Him come. The times are different, the faith is the same. Our faith knitteth together both those who believed that He was about to come, and those who believe that He has come. All that ever came at variance with Him were thieves and robbers; i. e. they came to steal and to kill; but the sheep did not hear them. They had not Christ's voice; but were wanderers, dreamers, deceivers. Why He is the Door, He next explains, I am the Door; by Me if any man enter in he shall be saved.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"All that ever came are thieves and robbers." What is this, Lord, "All that ever came"? How so hast Thou not come? But understand; I said, "All that ever came," meaning, of course, exclusive of myself. Let us recollect then. Before His coming came the prophets: were they thieves and robbers? God forbid. They did not come apart from Him, for they came with Him. When about to come, He sent heralds, but retained possession of the hearts of His messengers. Do you wish to know that they came with Him, who is Himself ever existent? Certainly He assumed human flesh at the time appointed. But what means that "ever"? "In the beginning was the Word." With Him, therefore, came those who came with the word of God. "I am," said He, "the way, and the truth, and the life." If He is the truth, with Him came those who were truthful. As many, therefore, as were apart from Him, were "thieves and robbers," that is, had come to steal and to destroy.

'But the sheep did not hear them." This is a more important point, "the sheep did not hear them." Before the advent of our Lord Jesus Christ, when He came in humility in the flesh, righteous men preceded, believing in the same way in Him who was to come, as we believe in Him who has come. Times vary, but not faith. For verbs themselves also vary with the tense, when they are variously declined. He is to come, has one sound; He has come, has another: there is a change in the sound between He is to come, and He has come: yet the same faith unites both,-both those who believed that He would come, and those who have believed that He is come. At different times, indeed, but by the one doorway of faith, that is, by Christ, do we see that both have entered. We believe that the Lord Jesus Christ was born of the Virgin, that He came in the flesh, suffered, rose again, ascended into heaven: all this, just as you hear verbs of the past tense, we believe to be already fulfilled. In that faith a partnership is also held with us by those fathers who believed that He would be born of the Virgin, would suffer, would rise again, would ascend into heaven; for to such the apostle pointed when he said, "But we having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak." The prophet said, "I believed, therefore have I spoken:" the apostle says, "We also believe, and therefore speak." But to let you know that their faith is one, listen to him saying, "Having the same spirit of faith, we also believe." So also in another place, "For I would not have you ignorant, brethren, how that all our fathers were under the cloud, and all passed through the sea: and were all baptized unto Moses in the cloud and in the sea; and did all eat the same spiritual meat, and did all drink the same spiritual drink." The Red Sea signifies baptism; Moses, their leader through the Red Sea, signifies Christ; the people, who passed through, signify believers; the death of the Egyptians signifies the abolition of sins. Under different signs there is the same faith. It is with different signs as with different words [verbs]; for verbs change their sounds through the tenses, and verbs are indeed nothing else than signs. For they are words because of what they signify: take away the meaning from a word, and it becomes a senseless sound. All, therefore, have become signs. Was not the same faith theirs by whom these signs were employed, and by whom were foretold in prophecy the very things which we believe? Certainly it was: but they believed that they were yet to come, and we, that they have come. In like manner does he also say, "They all drank the same spiritual drink;" "the same spiritual," for it was not the same material [drink]. For what was it they drank? "For they drank of the spiritual Rock that followed them; and that Rock was Christ." See, then, how that while the faith remained, the signs were varied. There the rock was Christ; to us that is Christ which is placed on the altar of God. And they, as a great sacramental sign of the same Christ, drank the water flowing from the rock: what we drink is known to believers. If one's thoughts turn to the visible form, the thing is different; if to the meaning that addresses the understanding, they drank the same spiritual drink. As many, then, at that time as believed, whether Abraham, or Isaac, or Jacob, or Moses, or the other patriarchs or prophets who foretold of Christ, were sheep, and heard Christ. His voice, and not another's, did they hear. The Judge was present in the person of the Crier. For even when the judge speaks through the crier, the clerk does not make it, The crier said; but the judge said. But others there are whom the sheep did not hear, in whom Christ's voice had no place,-wanderers, uttering falsehoods, prating inanities, fabricating vanities, misleading the miserable.

Why is it, then, that I have said, This is a more important point? What is there about it obscure and difficult to understand? Listen, I beseech you. See, the Lord Jesus Christ Himself came and preached. Much more surely was that the Shepherd's voice which was uttered by the very mouth of the Shepherd. For if the Shepherd's voice came through the prophets, how much more did the Shepherd's own tongue give utterance to the Shepherd's voice? Yet all did not hear Him. But what are we to think? Those who did hear, were they sheep? Lo? Judas heard, and was a wolf: he followed, but, clad in sheep-skin. he was laying snares for the Shepherd. Some, again, of those who crucified Christ did not hear, and yet were sheep; for such He saw in the crowd when He said, "When ye have lifted up the Son of man, then shall ye know that I am He." Now, how is this question to be solved? They that are not sheep do hear, and they that are sheep do not hear. Some, who are wolves, follow the Shepherd's voice; and some, that are sheep, contradict it. Last of all, the sheep slay the Shepherd. The point is solved; for some one in reply says. But when they did not hear, as yet they were not sheep, they were then wolves: the voice, when it was heard, changed them, and out of wolves transformed them into sheep; and so, when they became sheep, they heard, and found the Shepherd, and followed Him. They built their hopes on the Shepherd's promises, because they obeyed His precepts.

That question has been solved in a way, and perhaps satisfies every one. But I bare still a subject of concern, and what concerns me I shall impart to you, that, in some sort inquiring together, I may through His revelation be found worthy with you to attain the solution. Hear, then, what it is that moves me. By the Prophet Ezekiel the Lord rebukes the shepherds, and among other things says of the sheep, "The wandering sheep have ye not recalled." He both declares it a wanderer, and calls it a sheep. If, while wandering, it was a sheep, whose voice was it hearing to lead it astray? For doubtless it would not be straying were it hearing the shepherd's voice: but it strayed just because it heard another's voice; it heard the voice of the thief and the robber. Surely the sheep do not hear the voice of robbers. "Those that came," He said,-and we are to understand, apart from me,-that is, "those that came apart from me are thieves and robbers, and the sheep did not hear them." Lord, if the sheep did not hear them, how can the sheep wander? If the sheep hear only Thee, and Thou art the truth, whoever heareth the truth cannot certainly fall into error. But they err, and are called sheep. For if, in the very midst of their wandering, they were not called sheep, it would not be said by Ezekiel, "The wandering sheep have ye not recalled." How is it at the same time a wanderer and a sheep? Has it heard the voice of another? Surely "the sheep did not hear them." Accordingly many are just now being gathered into Christ's fold, and from being heretics are becoming catholics. They are rescued from the thieves, and restored to the shepherds: and sometimes they murmur, and become wearied of Him that calls them back, and have no true knowledge of him that would murder them; nevertheless also, when, after a struggle, those have come who are sheep, they recognize the Shepherd's voice, and are glad they have come, and are ashamed of their wandering. When, then, they were glorying in that state of error as in the truth, and were certainly not hearing the Shepherd's voice, but were following another, were they sheep, or were they not? If they were sheep, how can it be the case that the sheep do not listen to aliens? If they were not sheep, wherefore the rebuke addressed to those to whom it is said, "The wandering sheep have ye not recalled"? In the case also of those already become catholic Christians, and believers of good promise, evils sometimes occur: they are seduced into error, and after their error are restored. When they were thus seduced, and were rebaptized, or after the companionship of the Lord's fold were turned back again into their former error, were they sheep, or were they not? Certainly they were catholics. If they were faithful catholics, they were sheep. If they were sheep, how was it that they could listen to the voice of a stranger when the Lord saith, "The sheep did not hear them"?

You hear, brethren, the great importance of the question. I say then, "The Lord knoweth them that are His." He knoweth those who were foreknown, He knoweth those who were predestinated; because it is said of Him, "For whom He did foreknow, He also did predestinate to be conformed to the image of His Son, that He might be the firstborn among many brethren. Moreover, whom He did predestinate, them He also called; and whom He called, them He also justified; and whom He justified, them He also glorified. If God be for us, who can be against us?" Add to this: "He that spared not His own Son, but delivered Him up for us all, how hath He not with Him also freely given us all things?" But what "us"? Those who are foreknown, predestinated, justified, glorified; regarding whom there follows, "Who shall lay anything to the charge of God's elect?" Therefore "the Lord knoweth them that are His;" they are the sheep. Such sometimes do not know themselves, but the Shepherd knoweth them, according to this predestination, this foreknowledge of God, according to the election of the sheep before the foundation of the world: for so saith also the apostle, "According as He hath chosen us in Him before the foundation of the world." According, then, to this divine foreknowledge and predestination, how many sheep are outside, how many wolves within! and how many sheep are inside, how many wolves without! How many are now living in wantonness who will yet be chaste! how many are blaspheming Christ who will yet believe in Him! how many are giving themselves to drunkenness who will yet be sober! how many are preying on other people property who will yet freely give of their own! Nevertheless at present they are hearing the voice of another, they are following strangers. In like manner, how many are praising within who will yet blaspheme; are chaste who will yet be fornicators; are sober who will wallow hereafter in drink; are standing who will by and by fall! These are not the sheep. (For we speak of those who were predestinated,-of those whom the Lord knoweth that they are His.) And yet these, so long as they keep right, listen to the voice of Christ. Yea, these hear, the others do not; and yet, according to predestination, these are not sheep, while the others are.

There remains still the question, which I now think may meanwhile thus be solved. There is a voice of some kind,-there is, I say, a certain kind of voice of the Shepherd, in respect of which the sheep hear not strangers, and in respect of which those who are not sheep do not hear Christ. What a word is this! "He that endureth to the end, the same shall be saved." No one of His own is indifferent to such a voice, a stranger does not hear it: for this reason also does He announce it to the former, that he may abide perseveringly with Himself to the end; but by one who is wanting in such persevering continuance with Him, such a word remains unheard. One has come to Christ, and has heard word after word of one kind and another, all of them true, all of them salutary; and among all the rest is also this utterance, "He that endureth to the end, the same shall be saved." He who has heard this is one of the sheep. But there was, perhaps, some one listening to it, who treated it with dislike, with coldness, and heard it as that of a stranger. If he was predestinated, he strayed for the time, but he was not lost for ever: he returns to hear what he has neglected, to do what he has heard. For if he is one of those who are predestinated, then both his very wandering and his future conversion have been foreknown by God: if he has strayed away, he will return to hear that voice of the Shepherd, and to follow Him who saith, "He that endureth to the end, the same shall be saved." A good voice, brethren, it is; true and shepherd-like, the very voice of salvation in the tabernacles of the righteous. For it is easy to hear Christ, easy to praise the gospel, easy to applaud the preacher: but to endure unto the end, is peculiar to the sheep who hear the Shepherd's voice. A temptation befalls thee, endure thou to the end, for the temptation will not endure to the end. And what is that end to which thou shalt endure? Even till thou reachest the end of thy pathway. For as long as thou hearest not Christ, He is thine adversary in the pathway, that is, in this mortal life. And what doth He say? "Agree with thine adversary quickly, while thou art in the way with him." Thou hast heard, hast believed, hast agreed. If thou hast been at enmity, agree. If thou hast got the opportunity of coming to an agreement, keep not up the quarrel longer. For thou knowest not when thy way will be ended, and it is known to Him. If thou art a sheep, and if thou endurest to the end, thou shalt be saved: and therefore it is that His own despise not that voice, and strangers hear it not. According to my ability, as He gave me the power, I have either explained to you or gone over with you a subject of great profundity. If any have failed fully to understand, let him retain his piety, and the truth will be revealed: and let not those who have understood vaunt themselves as swifter at the expense of the slower, lest in their vaunting they turn out of the track, and the slower more easily attain the goal. But let all of us be guided by Him to whom we say, "Lead me, O Lord, in Thy way, and I will walk in Thy truth."
'''
