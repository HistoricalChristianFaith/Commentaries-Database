[[commentary]]
quote='''
I have said who was the exhorter, namely, that lover who would not alone embrace what he loveth, and saith, "Approach unto Him, and be ye lightened" (ver. 5). For he saith what he himself proved. For some spiritual person in the Body of Christ, or even our Lord Jesus Christ Himself according to the flesh, the Head exhorting His Own Members, saith; what? "Approach unto Him, and be ye lightened." Or rather some spiritual Christian inviteth us to approach to our Lord Jesus Christ Himself. But let us approach to Him and be lightened; not as the Jews approached to Him, that they might be darkened; for they approached to Him that they might crucify Him: let us approach to Him that we may receive His Body and Blood. They by Him crucified were darkened; we by eating and drinking The Crucified are lightened. "Approach unto Him, and be ye lightened." Lo, this is said to the Gentiles. Christ was crucified amid the Jews raging and seeing; the Gentiles were absent; lo, they have approached who were in darkness, and they who saw not are lightened. Whereby approach the Gentiles? By following with faith, by longing with the heart, by running with charity. Thy feet are thy charity. Have two feet, be not lame. What are thy two feet? The two commandments of love, of thy God, and of thy Neighbour. With these feet run thou unto God, approach unto Him, for He hath both exhorted thee to run, and hath Himself shed His Own Light, as he hath magnificently and divinely continued.  "And your faces shall not be ashamed." "Approach" (saith he) "unto Him, and be ye lightened; and your faces shall not be ashamed." No face shall be ashamed but of the proud. Wherefore? Because he would be lifted up, and when he hath suffered insult, or ignominy, or mischance in this world, or any affliction, he is ashamed. But fear not thou, approach unto Him, and thou shalt not be ashamed. ...
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
But when the word comes, and is poured into the hearers, and they not only hear, but are made obedient, the soul rises from its death to its life-that is, from unrighteousness, from folly, from ungodliness, to its God, who is to it wisdom, righteousness, light. Let it rise to Him, and be enlightened by Him. "Come near,' saith he, "to Him." And what shall we have? "And be enlightened." If, therefore, by "coming to" ye are enlightened, and by "departing from" ye become darkened, your light was not in yourselves, but in your God. Come to Him that ye may rise again: if ye depart from Him, ye shall die. If by coming to Him ye live, and by departing from Him ye die, your life was not in yourselves. For the same is your life which is your light. "Because with Thee is the fountain of life, and in Thy light we shall see light."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
"Then the cohort, and the tribune, and the officers of the Jews, took Jesus, and bound Him." They took Him to whom they had never found access: for He continued the day, while they remained as darkness; neither had they given heed to the words, "Come unto Him, and be enlightened." For had they so approached Him, they would have taken Him, not with their hands for the purpose of murder, but with their hearts for the purpose of a welcome reception. Now, however, when they laid hold of Him in this way, their distance from Him was vastly increased: and they bound Him by whom they themselves ought rather to have been loosed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520112.html'
source_title="Tractates on John 112"
