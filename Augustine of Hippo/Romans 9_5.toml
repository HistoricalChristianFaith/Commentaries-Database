[[commentary]]
quote='''
When he says: Whose are the fathers, from whom is Christ according to the flesh, and adds: Who is over all, God blessed forever, he commends the fullest faith, because we confess our Lord both, according to the assumption of the flesh, the Son of Man, and, according to eternity, the Word in the beginning, God blessed over all forever. But because the Jews held only part of this confession, they are refuted by the Lord. For when he had asked them whose son they said the Christ was, they answered: David's. But this is according to the flesh. Concerning his divinity, however—that he is God—they answered nothing. Therefore the Lord said to them: How then does David in the spirit call him Lord? That they might understand that they had confessed only this, that Christ is the son of David, but had passed over in silence that Christ is the Lord of David himself. For the former is according to the assumption of the flesh, the latter according to the eternity of the divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
“Whose” (saith the Apostle) “are the fathers, of whom as concerning the flesh Christ came.” Of the Jews then is Christ, but according to the flesh. But who is this Christ who is of the Jews according to the flesh? “Who is over all, God blessed for ever.” God before the flesh, God in the flesh, God with the flesh. Nor only God before the flesh, but God before the earth whence flesh was made; nor only God before the earth whereof flesh was made, but even God before the Heaven which was first made; God before the day which was first made; God before Angels; the same Christ is God: for “In the beginning was the Word, and the Word was with God, and the Word was God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
