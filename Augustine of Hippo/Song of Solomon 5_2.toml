[[commentary]]
quote='''
Therefore, as the Apostle James saith, "Let every man be swift to hear, slow to speak." As it is also said by another man of God, "Thou wilt make me to hear joy and gladness; and the bones Thou hast humbled will rejoice." This is what I said: When the truth is heard, humility is preserved. And another says: "But the friend of the bridegroom standeth and heareth him, and rejoiceth greatly because of the bridegroom's voice." Let us rejoice in the hearing that comes from the noiseless speaking of the truth within us. For although, when the sound is outwardly uttered, as by one that readeth; or proclaimeth, or preacheth, or disputeth, or commandeth, or comforteth, or exhorteth, or even by one that sings or accompanies his voice on an instrument, those who do so may fear to defile their feet, when they aim at pleasing men with the secretly active desire of human applause. Yet the one who hears such with a willing and pious mind, has no room for self-gratulation in the labors of others; and with no self-inflation, but with the joy of humility, rejoices because of the Master's words of truth. Accordingly, in those who hear with willingness and humility, and spend a tranquil life in sweet and wholesome studies, the holy Church will take delight, and may say, "I sleep, and my heart waketh." And what is this, "I sleep, and my heart waketh," but just I sit down quietly to listen? My leisure is not laid out in nourishing slothfulness, but in acquiring wisdom. "I sleep, and my heart waketh." I am still, and see that Thou art the Lord: for "the wisdom of the scribe cometh by opportunity of leisure; and he that hath little business shall become wise." "I sleep, and my heart waketh:" I rest from troublesome business, and my mind turns its attention to divine concerns (or communications).

But while the Church finds delightful repose in those who thus sweetly and humbly sit at her feet, here is one who knocks, and says: "What I tell you in darkness, that speak ye in light; and what ye hear in the ear, that preach ye upon the house-tops." It is His voice, then, that knocks at the gate, and says: "Open to me, my sister, my neighbor, my dove, my perfect one; for my head is filled with dew, and my locks with the drops of the night." As if He had said, Thou art at leisure, and the door is closed against me: thou art caring for the leisure of the few, and through abounding iniquity the love of many is waxing cold. The night He speaks of is iniquity: but His dew and drops are those who wax cold and fall away, and make the head of Christ to wax cold, that is, the love of God to fail. For the head of Christ is God. But they are borne on His locks, that is, their presence is tolerated in the visible sacraments; while their senses never take hold of the internal realities. He knocks, therefore, to shake off this quiet from His inactive saints, and cries, "Open to me," thou who, through my blood, art become "my sister;" through my drawing nigh, "my neighbor;" through my Spirit, "'my dove;" through my word which thou hast fully learned in thy leisure, "my perfect one:" open to me, go and preach me to others. For how shall I get in to those who have shut their door against me, without some one to open? and how shall they hear without a preacher?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252057.html'
source_title="Tractates on John 57"
