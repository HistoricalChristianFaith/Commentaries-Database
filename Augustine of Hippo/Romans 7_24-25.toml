[[commentary]]
quote='''
For he said: Wretched man that I am, who will free me from the body of this death? And he added: The grace of God through Jesus Christ our Lord. Then he begins to describe the man established under grace, which is the third of those four stages we distinguished above. To this stage now belongs what he immediately adds: Therefore I myself with my mind serve the law of God, but with my flesh the law of sin; for although carnal desires exist, he no longer serves by consenting so as to commit sin—he who, established under grace, serves the law of God with his mind, but with his flesh the law of sin. And by the law of sin he means the mortal condition arising from Adam's transgression, by which we were made mortal. For from this taint of the flesh carnal concupiscence solicits us, and according to this he says in another place: We too were by nature children of wrath, even as the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
