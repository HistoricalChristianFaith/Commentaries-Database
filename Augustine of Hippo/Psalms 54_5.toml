[[commentary]]
quote='''
“Turn away evil things unto mine enemies” (ver. 5). So however green they are, so however they flourish, for the fire they are being reserved. “In Thy virtue destroy Thou them.” Because to wit they flourish now, because to wit they spring up like grass: do not thou be a man unwise and foolish, so that by giving thought to these things thou perish for ever and ever. For, “Turn Thou away evil things unto mine enemies.” For if thou shalt have place in the body of David Himself, in His virtue He will destroy them. These men flourish in the felicity of the world, perish in the virtue of God. Not in the same manner as they flourish, do they also perish: for they flourish for a time, perish for everlasting: flourish in unreal good things, perish in real torments. “In Thy strength destroy,” whom in Thy weakness Thou hast endured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"
