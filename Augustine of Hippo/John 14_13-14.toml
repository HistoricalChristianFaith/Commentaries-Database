[[commentary]]
quote='''
But we must not listen with indifference to the statement that the Lord (to prevent any from thinking that what He promised to do to those that asked, He would do without the Father, after saying, "Whatsoever ye shall ask in my name, I will do it") immediately added, "That the Father may be glorified in the Son: if ye shall ask anything in my name, I will do it." In no respect, therefore, does the Son act without the Father, since He so acts for the very purpose that in Him the Father may be glorified. The Father, therefore, acts in the Son, that the Son may be glorified in the Father: and the Son acts in the Father, that the Father may be glorified in the Son; for the Father and the Son are one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252073.html'
source_title="Tractates on John 73"
