
[[commentary]]
quote='''
In another place, when questioning His disciples, He saith: "Whom do men say that I, the Son of man, am? And they answered, Some John, some Elias, some Jeremias, or one of the prophets. And He said unto them, But whom say ye that I am? Peter answered, Thou art the Christ, the Son of the living God." He declared Himself Son of man, Peter declared Him the Son of the living God. Most fitly did He mention that which in mercy He had manifested Himself to be; most fitly did the other mention that which He continues to be in glory. The Word of God commends to our attention His own humility: the man acknowledged the glory of his Lord. And indeed, brethren, I think that this is just. He humbled Himself for us, let us glorify Him. For not for Himself is He Son of man, but for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
