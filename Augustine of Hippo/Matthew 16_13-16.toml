
[[commentary]]
quote='''
In another place, when questioning His disciples, He saith: "Whom do men say that I, the Son of man, am? And they answered, Some John, some Elias, some Jeremias, or one of the prophets. And He said unto them, But whom say ye that I am? Peter answered, Thou art the Christ, the Son of the living God." He declared Himself Son of man, Peter declared Him the Son of the living God. Most fitly did He mention that which in mercy He had manifested Himself to be; most fitly did the other mention that which He continues to be in glory. The Word of God commends to our attention His own humility: the man acknowledged the glory of his Lord. And indeed, brethren, I think that this is just. He humbled Himself for us, let us glorify Him. For not for Himself is He Son of man, but for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"

[[commentary]]
quote='''
Let the Lord Himself say whether He can find one like unto Himself. “Whom do men say that I the Son of Man am?” Because I appear, because I am seen, because I walk among you, and perhaps at present I am become common; say, whom do men say that I the Son of Man am? Surely when they see a son of man, they see a cloud; but say, “Whom do men say that I am?” In answer they gave Him the reports of men; “Some say that Thou art John the Baptist: some Elias, and others Jeremias, or one of the prophets.” Many clouds and sons of God are here mentioned: for because they were righteous and holy, as the sons of God, Jeremias, Elias, and John are called also sons of God: in their character of preachers of God, they are styled clouds. Ye have said what clouds men imagine Me to be: do ye too say, “Whom say ye that I am?” Peter replying in behalf of all, one for those who were one, answered, “Thou art the Christ, the Son of the living God;” not like those sons of God who are not made equal to Thee: Thou hast come in the flesh: but not as the clouds, who are not to be compared unto Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
