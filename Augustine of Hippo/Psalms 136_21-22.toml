[[commentary]]
quote='''
“And gave away their land for an heritage” (ver. 21), “even an heritage unto Israel His servant” (ver. 22). For He giveth them, whom once the devil owned, for an heritage to the seed of Abraham, that is, Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
