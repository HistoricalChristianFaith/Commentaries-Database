[[commentary]]
quote='''
“In me, O God, are Thy vows, which I will render of praise to Thee” (ver. 12). “Vow ye, and render to the Lord your God.” What vow, what render? Perchance those animals which were offered at the altars aforetime? No such thing offer thou: in thyself is what thou mayest vow and render. From the heart’s coffer bring forth the incense of praise; from the store of a good conscience bring forth the sacrifice of faith. Whatsoever thing thou bringest forth, kindle with love. In thyself be the vows, which thou mayest render of praise to God. Of what praise? For what hath He granted thee? “For Thou hast rescued my soul from death” (ver. 13). This is that very life which he telleth out to Him: “O God, my life I have told out to Thee.” For I was what? Dead. Through myself I was dead: through Thee I am what? Alive. Therefore “in me, O God, are Thy vows, which I will render of praise to Thee.” Behold I love my God: no one doth tear Him from me: that which to Him I may give, no one doth tear from me, because in the heart it is shut up. With reason is said with that former confidence, “What should man do unto me?” Let man rage, let him be permitted to rage, be permitted to accomplish that which he attempteth: what is he to take away? Gold, silver, cattle, men servants, maid servants, estates, houses, let him take away all things: doth he by any means take away the vows, which are in me, which I may render of praise to God? The tempter was permitted to tempt a holy man, Job; in one moment he took away all things: whatever of possessions he had had, he carried off: took away inheritance, slew heirs; and this not little by little, but in a crowd, at one blow, at one swoop, so that all things were on a sudden announced: when all was taken away, alone there remained Job, but in him were vows of praise, which he might render to God, in him evidently there were: the coffer of his holy breast the thieving devil had not rifled, full he was of that wherefrom he might sacrifice. Hear what he had, hear what he brought forth: “The Lord hath given, the Lord hath taken away; as hath pleased the Lord, so hath been done: be the name of the Lord blessed.” O riches interior, whither thief doth not draw near! God Himself had given that whereof He was receiving; He had Himself enriched him with that whereof to Him he was offering that which He loved. Praise from thee God requireth, thy confession God requireth. But from thy field wilt thou give anything? He hath Himself rained in order that thou mayest have. From thy coffer wilt thou give anything? He hath Himself put in that which thou art to give. What wilt thou give, which from Him thou hast not received? “For what hast thou which thou hast not received?” From the heart wilt thou give? He too hath given faith, hope, and charity: this thou must bring forth: this thou must sacrifice. But evidently all the other things the enemy is able to take away against thy will; this to take away he is not able, unless thou be willing. These things a man will lose even against his will: and wishing to have gold, will lose gold; and wishing to have house, will lose house: faith no one will lose, except him that shall have despised her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
