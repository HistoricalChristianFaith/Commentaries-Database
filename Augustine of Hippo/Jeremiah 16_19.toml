[[commentary]]
quote='''
So the shepherds came from nearby to see, and the Magi came from far away to worship. This is the humility for which the wild olive deserved to be grafted into the olive tree and against nature to produce olives, because it deserved to change nature through grace. They come, you see, from the uttermost bounds of the earth, saying, according to Jeremiah, "Truly our fathers worshipped lies." And they come, not just from one part of the world, but as the gospel according to Luke says, from East and West, from North and South, to sit down with Abraham and Isaac and Jacob in the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520203.html'
source_title="SERMON 203:3"


[[commentary]]
quote='''
Further, Jeremiah says of Christ, "Behold the days come, says the Lord, and I will raise up to David a just branch. A king shall reign and shall be wise. He shall execute justice and judgment in the earth. In those days shall Judah be saved, and Israel shall dwell confidently. This is the name that they shall call him: The Lord our just one." On the calling of the Gentiles that he foresaw and we today see as realized, the prophet had this to say: "O Lord, my might and my strength, and my refuge in the day of tribulation; to you the Gentiles shall come from the ends of the earth and shall say, 'Surely our ancestors have possessed lies, a vanity that has not profited them.' "
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252018.html'
source_title="City of God 18.33"

[[commentary]]
quote='''
For truly what is thus effected by Christians is not a thing which belongs only to Christian times, but one which was predicted very long ago. Those very Jews who have remained enemies to the name of Christ, and regarding whose destined perfidy these prophetic writings have not been silent, do themselves possess and peruse the prophet who says: "O Lord my God, and my refuge in the day of evil, the Gentiles shall come unto Thee from the ends of the earth, and shall say, Surely our fathers have worshipped mendacious idols, and there is no profit in them." Behold, that is now being done; behold, now the Gentiles are coming from the ends of the earth to Christ, uttering things like these, and breaking their idols! Of signal consequence, too, is this which God has done for His Church in its world-wide extension, in that the Jewish nation, which has been deservedly overthrown and scattered abroad throughout the lands, has been made to carry about with it everywhere the records of our prophecies, so that it might not be possible to look upon these predictions as concocted by ourselves; and thus the enemy of our faith has been made a witness to our truth. How, then, can it be possible that the disciples of Christ have taught what they have not learned from Christ, as those foolish men in their silly fancies object, with the view of getting the superstitious worship of heathen gods and idols subverted? Can it be said also that those prophecies which are still read in these days, in the books of the enemies of Christ, were the inventions of the disciples of Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 26"
