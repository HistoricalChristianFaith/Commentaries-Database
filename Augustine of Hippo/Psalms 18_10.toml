[[commentary]]
quote='''
“And He mounted above the cherubim, and did fly” (ver. 10). And He was exalted above the fulness of knowledge, that no man should come to Him but by love: for “love is the fulfilling of the law.” And full soon He showed to His lovers that He is incomprehensible, lest they should suppose that He is comprehended by corporeal imaginations. “He flew above the wings of the winds.” But that swiftness, whereby He showed Himself to be incomprehensible, is above the powers of souls, whereon as upon wings they raise themselves from earthly fears into the air of liberty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
