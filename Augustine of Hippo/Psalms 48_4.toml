[[commentary]]
quote='''
“For, lo, the kings of the earth are gathered together” (ver. 3). Behold now those sides of the North, see how they come, see how they say, “Come ye, and let us go up to the mountain of the Lord: and He will teach us His way, and we will walk in it.” “And have come together in one.” In what one, but that “corner-stone”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
