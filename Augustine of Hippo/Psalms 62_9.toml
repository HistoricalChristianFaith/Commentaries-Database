[[commentary]]
quote='''
“Nevertheless, vain are the sons of men, and liars are the sons of men in the balances, in order that they may deceive, being at one because of vanity” (ver. 9). Certainly many men there are: behold there is that one man, that one man that was cast forth from the multitude of guests. They conspire, they all seek things temporal, and they that are carnal things carnal, and for the future they hope them, whosoever do hope: even if because of variety of opinions they are in division, nevertheless because of vanity they are at one. Divers indeed are errors and of many forms, and the kingdom against itself divided shall not stand: but alike in all is the will vain and lying, belonging to one king, with whom into fire everlasting it is to be thrown headlong—“these men because of vanity are at one.” And for them see how He thirsteth, see how He runneth in thirst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
