[[commentary]]
quote='''
“And He rejected the tabernacle of Selom, His tabernacle, where He dwelled among men” (ver. 61). He hath elegantly explained why He rejected His tabernacle, when he saith, “where He dwelled among men.” When therefore they were not worthy for Him to dwell among, why should He not reject the tabernacle, which indeed not for Himself He had established, but for their sakes, whom now He judged unworthy for Him to dwell among. “And He gave over unto captivity their strength, and their beauty unto the hands of the enemy.” The very Ark whereby they thought themselves invincible, and whereon they plumed themselves, he calleth their “virtue” and “beauty.” Lastly, also afterward, when they were living ill, and boasting of the temple of the Lord, He doth terrify them by a Prophet, saying, “See ye what I have done to Selom, where was My tabernacle.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
