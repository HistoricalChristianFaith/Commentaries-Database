[[commentary]]
quote='''
“My mercy will I keep for Him for ever: and my Testament faithful with Him” (ver. 28). On His account, the Testament is faithful: in Him the Testament is mediated: He is the Sealer, the Mediator of the Testament, the Surety of the Testament, the Witness of the Testament, the Heritage of the Testament, the Coheir of the Testament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
