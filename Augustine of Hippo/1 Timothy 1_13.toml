[[commentary]]
quote='''
We heard the reading from the apostle, and perhaps some of you may be worried by what is written there, "According to the justice which is from the law, I was without reproach. Whatever was a gain for me, that I have regarded as a dead loss on account of Christ." Then he went on to say, "I have reckoned it to be not only a dead loss, but even muck, that I may gain Christ and may be found in him, not having my own justice which is from the law, but the justice which is from the faith of Jesus Christ." The question is, how could he consider conducting himself without reproach according to the justice which is from the law, to be so much muck and loss? After all, who gave the law?… But let us listen to what he says in another place, "It was not as a result of works," he says, "which we have done ourselves, but according to his own mercy that he saved us, by means of the bath of rebirth." And again, "I, who was previously a blasphemer and persecutor, and an overbearing man; but I obtained mercy," and so on. On the one hand he affirmed that he conducted himself without reproach; on the other he confessed he had been a sinner of such proportions that no sinners need despair of themselves, precisely because even Paul had found remission.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520170.html'
source_title="SERMONS 170.1"

[[commentary]]
quote='''
From being a persecutor he was changed into "a preacher and the teacher of the nations." "Previously," he says, "I was a blasphemer and persecutor and an insolent man. But the reason I obtained mercy was this, that Christ Jesus might demonstrate his forbearance first of all in me, and for the instruction of those who were going to trust him for eternal life." It is by the grace of God, you see, that we are saved from our sins, in which we are languishing. God alone is the medicine that cures the soul. The soul was well able to injure itself but quite unable to cure itself. In the body, too, after all, people have it in their power to get sick, but not equally in their power to get better. I mean, if they exceed the proper limits, and live self-indulgent lives and do all the things that undermine the constitution and are injurious to health, the day comes, if that's what they want, when they fall sick. When they've so fallen, though, they don't get better. In order to fall sick, you see, they apply themselves to self-indulgence. But in order to get better, they must apply the doctor's services to their health.… And so it goes with the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520278.html'
source_title="SERMONS 278.1-2"


[[commentary]]
quote='''
Thou dost regard mockers to amend them, dost regard ignorant men to teach them, dost regard men confessing to pardon. Did he this in ignorance? A certain man had done some, aye many evil things he had done; “Mercy,” he saith, “I obtained, because ignorant I did it in unbelief.” This David could not say, “Ignorant I did it.” For he was not ignorant how very evil a thing was the touching of another’s wife, and how very evil a thing was the killing of the husband, who knew not of it, and was not even angered. They obtain therefore the mercy of the Lord that have in ignorance done it; and they that have knowing done it, obtain not any mercy it may chance, but “great mercy.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
[[commentary]]
quote='''
In like manner as his life Paul the Apostle did tell out, saying, “I that before was a blasphemer and a persecutor and injurious,” he shall tell out his life. “But mercy I have obtained.” He hath told out his life, not for himself, but for Him: because he hath told it out in such sort, that in Him men believe, not for his own advantages, but for the advantages of Him.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"

[[commentary]]
quote='''
The hay is devoured, but the gold is purified, and the man exchanges death for life, and begins to be himself too a burning coal; such a coal as was the Apostle, “who before was a blasphemer and a persecutor and injurious,” a coal black and extinguished; but when he had obtained mercy, he was set on fire from heaven, the voice of Christ set him on fire, all the blackness in him perished, he began to be fervent in spirit, to set others on fire with that wherewith he was set on fire himself.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
