[[commentary]]
quote='''
“Let them be confounded and turned backward, as many as have evil will at Sion” (ver. 5). They who hate Sion, hate the Church: Sion is the Church. And they who hypocritically enter into the Church, hate the Church. They who refuse to keep the Word of God, hate the Church: “Upon my back have they built:” what will the Church do, save endure the burden even unto the end?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520129.html'
source_title="Exposition on Psalm 129"
