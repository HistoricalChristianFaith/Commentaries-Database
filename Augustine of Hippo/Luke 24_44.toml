[[commentary]]
quote='''
(de Con. Ev. lib. i. c. 11.) Let those then who dream that Christ could have done such things by magical arts, and by the same art have consecrated His name to the nations to be converted to Him, consider whether He could by magical arts fill the Prophets with the Divine Spirit before He was born. For neither supposing that He caused Himself to be worshipped when dead, was He a magician before He was born, to whom one nation was assigned to prophesy His coming.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
That no one, however, may deem that sense inconsistent with the true one, in which we say that the Lord may have meant the communion of mortal flesh which He held with the disciples till His passion, when He said, "Yet a little while I am with you;" let those words also of His after His resurrection, as found in another evangelist, be taken into consideration, when He said, "These are the words which I spake unto you, while I was yet with you:" as if then He was no longer with them, even at the very time that they were standing by, seeing, touching, and talking with Him. What does He mean, then, by saying, "while I was yet with you," but, while I was yet in that state of mortal flesh wherein ye still remain? For then, indeed, He had been raised again in the same flesh; but He was no longer associated with them in the same mortality. And accordingly, as on that occasion, when now clothed in fleshly immortality, He said with truth, "while I was yet with you," to which we can attach no other meaning than, while I was yet with you in fleshly mortality; so here also, without any absurdity, we may understand His words, "Yet a little while I am with you," as if He had said, Yet a little while I am mortal like yourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252064.html'
source_title="Tractates on John 64"
