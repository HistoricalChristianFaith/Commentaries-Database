[[commentary]]
quote='''
For all men born of flesh, what are they but worms? and of these worms God makes angels. For if the Lord Himself says, "But I am a worm and no man," who will hesitate to say what is written also in Job, "How much more is man rottenness, and the son of man a worm?" First he said, "Man is rottenness;" and afterwards, "The son of man a worm:" because a worm springs from rottenness, therefore "man is rottenness," and "the son of man a worm."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25201.html'
source_title="Tractates on John 1"
