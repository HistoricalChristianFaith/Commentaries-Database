
[[commentary]]
quote='''
To David himself; for understanding.

To David himself; for understanding; by which it is understood that not by the merits of works, but by the grace of God, man is delivered, confessing his sins.

“Blessed are they whose unrighteousness is forgiven, and whose sins are covered” (ver. 1): and whose sins are buried in oblivion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252032.html'
source_title="Exposition on Psalm 32"
