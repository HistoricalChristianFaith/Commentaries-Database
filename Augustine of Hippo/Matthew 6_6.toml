[[commentary]]
quote='''
Enter into your inner chamber. Do not let the door stand open to the boisterous, through whom the things that are outside profanely rush in and assail the inner self.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 2.3.11"

[[commentary]]
quote='''
Outside the inner chamber are all things in time and space, which knock on the door. Through our bodily senses they clamor to interrupt our prayer, so that prayer is invaded with a crowd of vain phantoms. This is why you must shut the door. The senses of the body are resisted, that the spirit of prayer may be directed to the Father. This occurs in the inmost heart, where prayer is offered to the Father in secret. There "your Father who sees in secret will reward you." This is a fitting conclusion to good counsel, not merely calling us to pray but also showing us how, not merely calling us to give alms but also showing the right spirit for doing so. The instruction is to cleanse the heart. Nothing cleanses the heart but the undivided and single-minded striving after eternal life from the pure love of wisdom alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 2.3.11"

[[commentary]]
quote='''
(ubi sup.) Or, by our chambers are to be understood our hearts, of which it is spoken in the fourth Psalm; (Ps 4:4.) What things ye utter in your hearts, and wherewith ye are pricked in your chambers. The door is the bodily senses; without are all worldly things, which, enter into our thoughts through the senses, and that crowd of vain imaginings which beset us in prayer.

(ubi sup.) The door then must be shut, that is, we must resist the bodily sense, that we may address our Father in such spiritual prayer as is made in the inmost spirit, where we pray to Him truly in secret.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“I sought the Lord, and He heard me” (ver. 4). Where heard the Lord? Within. Where giveth He? Within. There thou prayest, there thou art heard, there thou art blessed. Thou hast prayed, thou art heard, thou art blessed; and he knoweth not who standeth by thee: it is all carried on in secret, as the Lord saith in the Gospel, “Enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret, shall reward thee openly.” When therefore thou enterest into thy chamber, thou enterest into thy heart. Blessed are they who rejoice when they enter into their heart, and find therein nought of evil.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
Our bed is our heart: there we suffer the tossing of an evil conscience; and there we rest when our conscience is good. Whoso loveth the bed of his heart, let him do some good therein. There is our bed, where the Lord Jesus Christ commands us to pray. “Enter into thy chamber, and shut thy door.” What is, “Shut thy door?” Expect not from God such things as are without, but such as are within; “and thy Father which seeth in secret, shall reward thee openly.” Who is he that shutteth not the door? He who asketh much from God such things, and in such wise directeth all his prayers, that he may receive the goods that are of this world. Thy door is open, the multitude seeth when thou prayest. What is it to shut thy door? To ask that of God, which God alone knoweth how He giveth. What is that for which thou prayest, when thou hast shut the door? What “eye hath not seen, nor ear heard, nor hath entered into the heart of man.” And haply it hath not entered into thy very bed, that is, into thy heart. But God knoweth what He will give: but when shall it be? When the Lord shall be revealed, when the Judge shall appear.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"

[[commentary]]
quote='''
“I will pour out before Him my prayer” (ver. 2). What is, “before Him”? In His sight. What is, in His sight? Where He seeth. But where doth He not see? For so do we say, ‘where He seeth,’ as though somewhere He seeth not. But in this assemblage of bodily substances men too see, animals too see: He seeth where man seeth not. For thy thoughts no man seeth, but God seeth. There then pour out thy prayer, where He alone seeth, who rewardeth. For the Lord Jesus Christ bade thee pray in secret: but if thou knowest what “thy closet” is, and cleansest it, there thou prayest to God. “But thou,” saith He, “when thou prayest, enter into thy closet, and shut the door, and pray to thy Father in secret, and He who seeth in secret shall reward thee.” If men are to reward thee, pour out thy prayer before men: if God is to reward thee, pour out thy prayer before Him; and close the door, lest the tempter enter. Therefore the Apostle, because it is in our power to shut the door, the door of our hearts, not of our walls, for in it is our “closet,”—because it is in our power to shut this door, saith, “neither give place to the devil.” But what is to “shut the door”? This door hath as it were two leaves, desire and fear. Either thou desireth something earthly, and he enters by this; or thou fearest something earthly, and he enters by that. Close then the door of fear and desire against the devil, open it to Christ. How dost thou open these folding doors to Christ? By desiring the kingdom of heaven, by fearing the fire of hell. By desire of this world the devil entereth, by desire of eternal life Christ entereth; by fear of temporal punishment the devil entereth, by fear of everlasting fire Christ entereth.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520142.html'
source_title="Exposition on Psalm 142"
