
[[commentary]]
quote='''
You desire bread from heaven; you have it before you, and yet you do not eat. "But I said unto you, that ye also have seen me, and ye believed not." But I have not on that account lost my people. "For hath your unbelief made the faith of God of none effect?" For, see thou what follows: "All that the Father giveth me shall come to me; and him that cometh to me, I will not cast out of doors." What kind of within is that, whence there is no going out of doors? Noble interior, sweet retreat! O secret dwelling without weariness, without the bitterness of evil thoughts, without the solicitings of temptations and the interruptions of griefs! Is it not that secret dwelling whither shall enter that well-deserving servant, to whom the Lord will say, "Enter thou into the joy of thy Lord?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
