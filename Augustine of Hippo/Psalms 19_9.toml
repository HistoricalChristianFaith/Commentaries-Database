[[commentary]]
quote='''
As for that fear that is holy, enduring forever, if it can exist in the world to come—and how else can we interpret "enduring forever"?—it will not be a fear deterring us from an evil that might befall us but a fear preserving us in a good that can never be lost. For in a state where love of possessed good is utterly unchangeable, there, if I may put it thus, fear of all evil will be perfectly at peace. What "holy fear" really means is a will so fixed that we shall necessarily refuse to sin and guard against it, not out of worry or weakness lest we fall, because our love is perfectly at peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252014.html'
source_title="City of God 14.9"

[[commentary]]
quote='''
What then of the two fears? There is a servile fear, and there is a clean [chaste] fear: there is the fear of suffering punishment, there is another fear of losing righteousness. That fear of suffering punishment is slavish. What great thing is it to fear punishment? The vilest slave and the cruelest robber do so. It is no great thing to fear punishment, but great it is to love righteousness. Has he, then, who loves righteousness no fear? Certainly he has; not of incurring of punishment, but of losing righteousness. My brethren, assure yourselves of it, and draw your inference from that which you love. Some one of you is fond of money. Can I find any one, think you, who is not so? Yet from this very thing which he loves he may understand my meaning. He is afraid of loss: why is he so? Because he loves money. In the same measure that he loves money, is he afraid of losing it. So, then, some one is found to be a lover of righteousness, who at heart is much more afraid of its loss, who dreads more being stripped of his righteousness, than thou of thy money. This is the fear that is clean-this [the fear] that endureth for ever, It is not this that love makes away with, or casteth out, but rather embraces it, and keeps it with it, and possesses it as a companion. For we come to the Lord that we may see Him face to face. And there it is this pure fear that preserves us; for such a fear as that does not disturb, but reassure. The adulterous woman fears the coming of her husband, and the chaste one fears her husband's departure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"

[[commentary]]
quote='''
“The fear of the Lord is chaste, enduring for ever” (ver. 9). “The fear of the Lord;” not that distressing fear under the law, dreading exceedingly the withdrawal of temporal goods, by the love of which the soul commits fornication; but that chaste fear wherewith the Church, the more ardently she loves her Spouse, the more carefully does she take heed of offending Him, and therefore, “perfect love casteth” not “out” this “fear,” but it endureth for ever.

“The judgments of the Lord are true, justified together.” The judgments of Him, who “judgeth no man, but hath committed all judgment unto the Son,” are justified in truth unchangeably. For neither in His threatenings nor His promises doth God deceive any man, nor can any withdraw either from the ungodly His punishment, or from the godly His reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"
