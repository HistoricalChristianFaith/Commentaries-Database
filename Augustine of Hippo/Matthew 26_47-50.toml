[[commentary]]
quote='''
When we follow the versions presented by Matthew and Mark, we find that the history now proceeds thus: "And while He yet spake, lo, Judas, one of the twelve, came, and with him a great multitude, with swords and staves, from the chief priests and elders of the people. Now he that betrayed Him, gave them a sign, saying, Whomsoever I shall kiss, that same is He; hold Him fast. And forthwith he came to Jesus, and said, Hail, Master; and kissed Him." First of all, however, as we gather from Luke's statement, He said to the traitor, "Judas, betrayest thou the Son of man with a kiss?" Next, as we learn from Matthew, He spoke thus: "Friend, wherefore art thou come?" Thereafter He added certain words which are found in John's narrative, which runs in the following strain: "Whom seek ye? They answered Him, Jesus of Nazareth. Jesus saith unto them, I am He. And Judas also, which betrayed Him, stood with them. As soon then as He had said unto them, I am He, they went backward, and fell to the ground. Then asked He them again, Whom seek ye? And they said, Jesus of Nazareth. Jesus answered, I have told you that I am He: if therefore ye seek me, let these go their way; that the saying might be fulfilled which He spake, Of them which thou gavest me have I lost none."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 5"
