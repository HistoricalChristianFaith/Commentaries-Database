[[commentary]]
quote='''
But the hyssop, whereon they placed the sponge filled with vinegar, being a lowly herb, and purging the heart, we fitly take for the humility of Christ Himself; which they thus enclosed, and imagined they had completely ensnared. Hence we have it said in the psalm, "Thou shalt purge me with hyssop, and I shall be cleansed." For it is by Christ's humility that we are cleansed; because, had He not humbled Himself, and became obedient unto the death of the cross, His blood certainly would not have been shed for the remission of sins, or, in other words, for our cleansing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520119.html'
source_title="Tractates on John 119"

[[commentary]]
quote='''
“Thou shalt sprinkle me,” he saith, “with hyssop, and I shall be cleansed” (ver. 7). Hyssop we know to be a herb humble but healing: to the rock it is said to adhere with roots. Thence in a mystery the similitude of cleansing the heart has been taken. Do thou also take hold, with the root of thy love, on thy Rock: be humble in thy humble God, in order that thou mayest be exalted in thy glorified God. Thou shalt be sprinkled with hyssop, the humility of Christ shall cleanse thee. Despise not the herb, attend to the efficacy of the medicine. Something further I will say, which we are wont to hear from physicians, or to experience in sick persons. Hyssop, they say, is proper for purging the lungs. In the lung is wont to be noted pride: for there is inflation, there breathing. It was said of Saul the persecutor as of Saul the proud, that he was going to bind Christians, breathing slaughter: he was breathing out slaughter, breathing out blood, his lung not yet cleansed. Hear also in this place one humbled, because with hyssop purged: “Thou shalt wash me,” that is, shalt cleanse me: “and above snow I shall be whitened.” “Although,” he saith, “your sins shall have been like scarlet, like snow I will whiten.” Out of such men Christ doth present to Himself a vesture without spot and wrinkle. Further, His vesture on the mount, which shone forth like whitened snow, signified the Church cleansed from every spot of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
