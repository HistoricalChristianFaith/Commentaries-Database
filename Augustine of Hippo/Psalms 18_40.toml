[[commentary]]
quote='''
“And thou hast given mine enemies the back to me” (ver. 40). And thou hast turned mine enemies, and hast made them to be a back to me, that is, to follow me. “And Thou hast destroyed them that hate me.” But such other of them as have persisted in hatred, Thou hast destroyed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
