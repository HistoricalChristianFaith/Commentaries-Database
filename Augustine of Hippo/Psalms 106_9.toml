[[commentary]]
quote='''
“He rebuked the Red Sea also, and it was dried up” (ver. 9). We do not read that any voice was sent forth from Heaven to rebuke the sea; but he hath called the Divine Power by which this was effected, a rebuke: unless indeed any one may choose to say, that the sea was secretly rebuked, so that the waters might hear, and yet men could not. The power by which God acteth is very abstruse and mysterious, a power which He causeth that even things devoid of sense instantly obey at His will. “So He led them through the deeps, as through a wilderness.” He calleth a multitude of waters the deeps. For some wishing to give the sense of this whole verse, have translated, “So He led them forth amid many waters.” What then doth “through the deeps, as through a wilderness,” mean, except that that had become as a wilderness from its dryness, where before had been the watery deeps?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
