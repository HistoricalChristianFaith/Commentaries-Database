[[commentary]]
quote='''
“Hear my voice, O Lord, wherewith I have cried unto Thee” (ver. 7). Hear, Lord, my interior voice, which with a strong intention I have addressed to Thy ears. “Have mercy upon me, and hear me.” Have mercy upon me, and hear me therein.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
