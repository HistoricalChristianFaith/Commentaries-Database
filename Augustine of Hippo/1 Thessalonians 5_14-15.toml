[[commentary]]
quote='''
Moreover, when he says to the Corinthians, "Let all your things be done with love," he shows plainly enough that even those chastisements which are deemed sharp and bitter by those who are corrected thereby, are to be administered with love. Accordingly, in another passage, after saying, "Warn them that are unruly, comfort the feeble-minded, support the weak, be patient toward all men," he immediately added, "See that none render evil for evil unto any man." Therefore, even when the unruly are corrected, it is not rendering evil for evil, but contrariwise, good. However, what but love worketh all these things?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 34"
