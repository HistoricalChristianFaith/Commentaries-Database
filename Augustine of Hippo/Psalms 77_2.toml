[[commentary]]
quote='''
Just now in that reading, which most recently sounded in your ears, what did you hear Thomas saying? I do not believe unless I touch. And the Lord to Thomas himself: Come, touch, put your hands into my side, and do not be unbelieving but believing. He said, If you think it too little that I offer myself to your eyes, I offer myself also to your hands. For perhaps you are one of those who sing in the Psalm: In the day of my trouble I sought the Lord with my hands, and my hands were stretched out in the night without ceasing. Why was he seeking with his hands? Because he was seeking in the night. What does it mean, he was seeking in the night? He was carrying the darkness of disbelief in his heart. However, this happened not only for himself but also for those who were going to deny the true flesh of the Lord. For Christ could have healed the wounds of his flesh in such a way that no marks of the scars would appear: he could, therefore, not bear the marks of the nails on his limbs, not bear the mark of the wound in his side; but those scars were allowed to remain in the flesh so that the wound of disbelief in human hearts would be removed, and the signs of the wounds would cure true wounds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520375C.html'
source_title="Sermon 375C"

[[commentary]]
quote='''
“In the day of tribulation I have sought out God” (ver. 2). Who art thou that doest this thing? In the day of thy tribulation take heed what thou seekest out. If a jail be the cause of tribulation, thou seekest to get forth from jail: if fever be the cause of tribulation, thou seekest health: if hunger be the cause of tribulation, thou seekest fulness: if losses be the cause of tribulation, thou seekest gain: if expatriation be the cause of tribulation, thou seekest the home of thy flesh. And why should I name all things, or when could I name all things? Dost thou wish to be one leaping over? In the day of thy tribulation seek out God: not through God some other thing, but out of tribulation God, that to this end God may take away tribulation, that thou mayest without anxiety cleave unto God. “In the day of my tribulation, I have sought out God:” not any other thing, but “God I have sought out.” And how hast thou sought out? “With my hands in the night before Him.”…

Tribulation must not be thought to be this or that in particular. For every individual that doth not yet leap over, thinketh that as yet to be no tribulation, unless it be a thing which may have befallen this life of some sad occasion: but this man, that leapeth over, doth count this whole life to be his tribulation. For so much doth he love his supernal country, that the earthly pilgrimage is of itself the greatest tribulation. For how can this life be otherwise than a tribulation, I pray you? how can that not be a tribulation, the whole whereof hath been called temptation? Thou hast it written in the book of Job, is not human life a temptation upon earth? Hath he said, human life is tempted upon earth? Nay, but life itself is a temptation. If therefore temptation, it must surely be a tribulation. In this tribulation therefore, that is to say in this life, this man that leapeth over hath sought out God. How? “With my hands,” he saith. What is, “with my hands”? With my works. For he was not seeking any thing corporeal, so that he might find and handle something which he had lost, so that he might seek with hands coin, gold, silver, vesture, in short everything which can be held in the hands. Howbeit, even our Lord Jesus Christ Himself willed Himself to be sought after with hands, when to His doubting disciple He showed the scars.…What then, to us belongeth not the seeking with hands? It belongeth to us, as I have said, to seek with works. When so? “In the night.” What is, “in the night”? In this age. For it is night until there shine forth day in the glorified advent of our Lord Jesus Christ. For would ye see how it is night? Unless we had here had a lantern, we should have remained in darkness. For Peter saith, “We too have more sure the prophetic discourse, whereunto ye do well to give heed, as to a lantern shining in a dark place, until day shine, and the day-star arise in your hearts.” There is therefore to come day after this night, meanwhile in this night a lantern is not lacking. And this is perchance what we are now doing: by explaining these passages, we are bringing in a lantern, in order that we may rejoice in this night. Which indeed ought alway to be burning in your houses. For to such men is said, “The Spirit quench ye not.” And as though explaining what he was saying, he continueth and saith, “Prophecy despise ye not:” that is, let the lantern alway shine in you. And even this light by comparison with a sort of ineffable day is called night. For the very life of believers by comparison with the life of unbelievers is day.…Night and day—day in comparison with unbelievers, night in comparison with the Angels. For the Angels have a day, which we have not yet. Already we have one that unbelievers have not: but not yet have believers that which Angels have: but they will have, at the time when they will be equal to the Angels of God, that which hath been promised to them in the Resurrection. In this then which is now day and yet night; night in comparison with the future day for which we yearn, day in comparison with the past night which we have renounced: in this night then, I say, let us seek God with our hands. Let not works cease, let us seek God, be there no idle yearning. If we are in the way, let us expend our means in order that we may be able to reach the end. With hands let us seek God.…“With my hands in the night before Him, and I have not been deceived.”

…“My soul hath refused to be comforted” (ver. 2). So great weariness did here possess me, that my soul did close the door against all comfort. Whence such weariness to him? It may be that his vineyard hath been hailed on, or his olive hath yielded no fruit, or the vintage hath been interrupted by rain. Whence the weariness to him? Hear this out of another Psalm. For therein is the voice of the same: “weariness hath bowed me down, because of sinners forsaking Thy law.” He saith then that he was overcome with so great weariness because of this sort of evil thing; so as that his soul refused to be comforted. Weariness had well nigh swallowed him up, and sorrow had ingulfed him altogether beyond remedy, he refuseth to be comforted. What then remained? In the first place, see whence he is comforted. Had he not waited for one who might condole with him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
