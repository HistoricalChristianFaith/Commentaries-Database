[[commentary]]
quote='''
When he says: For the expectation of the creature awaits the revelation of the sons of God; for the creature was made subject to vanity, not willingly, etc., down to what he says: And we ourselves groan within ourselves, awaiting the adoption, the redemption of our body—this is to be understood in such a way that we neither suppose that there is a sense of grieving and groaning in trees and vegetables and stones and other creatures of this kind (for this is the error of the Manichaeans), nor think that the holy angels are subjected to vanity, or judge of them that they will be freed from the servitude of destruction, since they surely are not going to perish; but let us understand the whole creation as being in man himself, without any distortion. For no creature can exist except either spiritual, which is preeminent in the angels, or animal, which appears well enough also in the life of beasts, or corporeal, which can be seen or touched; and all of these are also in man, because man consists of spirit and soul and body. Therefore the creature awaits the revelation of the sons of God—whatever now in man labors and lies subject to corruption awaits that manifestation of which the same Apostle says: For you are dead, and your life is hidden with Christ in God; when Christ, your life, shall appear, then you also shall appear with him in glory. John too says: Beloved, now we are the sons of God, and it has not yet appeared what we shall be; but we know that, when he shall appear, we shall be like him, for we shall see him as he is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
