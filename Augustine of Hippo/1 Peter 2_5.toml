[[commentary]]
quote='''
The Lord will repay his faithful followers who are so lovingly, so cheerfully, so devotedly carrying out these works, to the effect that he includes them in the construction of his own building, into which they hasten to fit as living stones, fashioned by faith, made solidly firm by hope, cemented together by charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520337.html'
source_title="SERMONS 337"

[[commentary]]
quote='''
In earthly cities, one thing is the structure of buildings: another thing are the citizens that dwell therein: that city is builded of its own inmates, who are themselves the blocks that form the city, for the very stones are living: “Ye also,” says the Apostle, “as living stones, are built up a spiritual house,” words that are addressed to ourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"

[[commentary]]
quote='''
It is some city he speaketh of, therefore, which is now being built, unto which living stones run in faith, of whom Peter saith, “Ye also, as lively stones, are built up a spiritual house;” that is, the holy temple of God. What meaneth, ye are built up as lively stones? Thou livest, if thou believest: but if thou believest, thou art made a temple of God; for the Apostle Paul saith, “The temple of God is holy, which temple are ye.” This city is therefore now in building; stones are cut down from the hills by the hands of those who preach truth, they are squared that they may enter into an everlasting structure. There are still many stones in the hands of the Builder: let them not fall from His hands, that they may be built perfect into the structure of the temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
