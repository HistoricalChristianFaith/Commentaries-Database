[[commentary]]
quote='''
“I will worship toward Thy holy Temple” (ver. 2). What holy Temple? That where we shall dwell, where we shall worship. For we hasten that we may adore. Our heart is pregnant and cometh to the birth, and seeketh where it may bring forth. What is the place where God is to be worshipped?…“The Temple of God is holy,” saith the Apostle, “which Temple ye are.” But assuredly, as is manifest, God dwelleth in the Angels. Therefore when our joy, being in spiritual things, not in earthly, taketh up a song to God, to sing before the Angels, that very assembly of Angels is the Temple of God, we worship toward God’s Temple. There is a Church below, there is a Church above also; the Church below, in all the faithful; the Church above, in all the Angels. But the God of Angels came down to the Church below, and Angels ministered to Him on earth, while He ministered to us; for, “I came not,” saith He, “to be ministered unto, but to minister.”…The Lord of Angels died for man. Therefore, “I will worship toward Thy holy Temple;” I mean, not the temple made with hands, but that which Thou hast made for Thyself.

“And I will confess to Thy Name in Thy mercy and Thy truth.”…These also which Thou hast given to me, do I according to my power give to Thee in return: mercy, in aiding others; truth, in judging. By these God aideth us, by these we win God’s favour. Rightly, therefore, “All the ways of the Lord are mercy and truth.” No other ways are there whereby He can come to us, no other whereby we can come to Him. “For Thou hast magnified Thy holy Name over everything.” What sort of thanksgiving is this, brethren? He hath magnified His holy Name over Abraham. Of Abraham was born Isaac; over that house God was magnified; then Jacob; God was magnified, who said, “I am the God of Abraham, and the God of Isaac, and the God of Jacob.” Then came his twelve sons. The name of the Lord was magnified over Israel. Then came the Virgin Mary. Then Christ our Lord, “dying for our sins, rising again for our justification,” filling the faithful with His Holy Spirit, sending forth men to proclaim throughout the Gentiles, “Repent ye,” etc. Behold, “He hath magnified His holy Name above all things.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"
