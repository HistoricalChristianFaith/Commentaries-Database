[[commentary]]
quote='''
Whence hath He brought thee out? Out of a certain deep, out of which thou criedst out in another Psalm, “Out of the deep have I called unto Thee, O Lord.” And those who are already “crying out of the deep,” are not absolutely in the lowest deep: the very act of crying is already lifting them up. There are some deeper in the deep, who do not even perceive themselves to be in the deep. Such are those who are proud despisers, not pious entreaters for pardon; not tearful criers for mercy: but such as Scripture thus describes. “The sinner when he comes into the depth of evil despiseth.” For he is deeper in the deep, who is not satisfied with being a sinner, unless instead of confessing he even defends his sins. But he who has already “cried out of the deep,” hath already lifted up his head in order that he might “cry out of the deep,” has been heard already, and has been “brought out of the horrible pit, and out of the mire and clay.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
“Neither let the deep swallow Me, nor the pit close her mouth upon Me.” What is this, brethren? What hath he prayed against? Great is the pit of the depth of human iniquity: every one, if he shall have fallen into it, will fall into the deep. But yet if a man being there placed confesseth his sins to his God, the pit will not shut her mouth upon him: as is written in another Psalm, “From the depths I have cried to Thee, O Lord; Lord, hearken unto my voice.” But if there is done in him that which another passage of Scripture saith, “When a sinner shall have come into the depth of evil things, he will despise,” upon him the pit hath shut her mouth. Why hath she shut her mouth? Because she hath shut his mouth. He hath lost confession, really dead he is, and there is fulfilled in him that which elsewhere is spoken of, “From a dead man, as from one that is not, there perisheth confession.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"

[[commentary]]
quote='''
“Out of the deep have I called unto Thee, O Lord: Lord, hear my voice” (ver. 1). Jonas cried from the deep; from the whale’s belly. He was not only beneath the waves, but also in the entrails of the beast; nevertheless, those waves and that body prevented not his prayer from reaching God, and the beast’s belly could not contain the voice of his prayer. It penetrated all things, it burst through all things, it reached the ears of God: if indeed we ought to say that, bursting through all things, it reached the ears of God, since the ears of God were in the heart of him who prayed. For where hath not he God present, whose voice is faithful? Nevertheless, we also ought to understand from what deep we cry unto the Lord. For this mortal life is our deep. Whoever hath understood himself to be in the deep, crieth out, groaneth, sigheth, until he be delivered from the deep, and come unto Him who sitteth above all the deeps.…For they are very deep in the deep, who do not even cry from the deep. The Scripture saith, “When the wicked hath reached the depth of evils, he despiseth.” Now consider, brethren, what sort of deep that is, where God is despised. When each man seeth himself overwhelmed with daily sins, pressed down by heaps and weights, so to speak, of iniquities: if it be said unto him, Pray unto God, he laughs. In what manner? He first saith, If crimes were displeasing unto God, should I live? If God regarded human affairs, considering the great crimes which I have committed, should I not only live, but be prosperous? For this is wont to happen to those who are far in the deep, and are prosperous in their iniquities: and they are the more plunged in the deep, in proportion as they seem to be more happy; for a deceitful happiness is itself a greater unhappiness.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
