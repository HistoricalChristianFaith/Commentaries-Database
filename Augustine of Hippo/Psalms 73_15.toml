[[commentary]]
quote='''
“If I said, I shall declare thus; behold, the generation of Thy sons I have reprobated” (ver. 15): that is, I will teach thus. How wilt thou teach? that there is no knowledge in the Most High, that God doth not know? Wilt thou propound this opinion, that without cause men live justly who do live justly; that a just man hath lost his service, because God doth more show favour to evil men, or else He doth care for no one? Wilt thou tell this, declare this? He doth restrain himself by an authority repressing him. What authority? A man wisheth some time to break out in this sentiment: but he is recalled by the Scriptures directing us alway to live well, saying, that God doth care for things human, that He maketh a distinction between a godly man and an ungodly man. Therefore this man also wishing to put forth this sentiment, doth recollect himself. And what saith he? “I have reprobated the generation of Thy sons.” If I shall declare thus, the generation of just men I shall reprobate. As also some copies have it, “Behold, the generation of thy sons with which I have been in concert:” that is, with which consisting of Thy sons I have been in concert; that is, with which I have agreed, to which I have been conformed: I have been out of time with all, if so I teach. For he doth sing in concert who giveth the tune together; but he that giveth not the tune together doth not sing in concert. Am I to say something different from that which Abraham said, from that which Isaac said, from that which Jacob said, from that which the Prophets said? For all they said that God doth care for things human, am I to say that He careth not? Is there greater wisdom in me than in them? Greater understanding in me than in them? A most wholesome authority hath called back his thought from ungodliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
