[[commentary]]
quote='''
(de Verb. Dom. Serm. lii) Christ went to the grave in which Lazarus slept, as if He were not dead, but alive and able to hear, for He forthwith called him out of his grave: And when He had thus spoken, He cried with a loud voice, Lazarus, come forth. He calls him by name, that He may not bring out all the dead.

(lib. lxxxiii. Quæst. q. 65) Although according to the Gospel history, we hold that Lazarus was really raised to life, yet I doubt not that his resurrection is an allegory as well. We do not, because we allegorize facts, lose our belief in them as facts.

(Tr. super Joan. xlix. 3) Every one that sinneth, dies; but God, of His great mercy, raises the soul to life again, and does not suffer it to die eternally. The three miraculous resurrections in the Gospels, I understand to testify the resurrection of the soul.

(Tr. xlix. 3) Or, it is death within; when the evil thought has not come out into action. But if thou actually do the evil thing, thou hast as it were carried the dead outside the gate.

(lib. lxxxiii. Quæst. q. 65) That Lazarus came forth from the grave, signifies the soul's deliverance from carnal sins. That he came bound up in grave clothes means, that even we who are delivered from carnal things, and serve with the mind the law of God, yet cannot, so long as we are in the body, be free from the besetments of the flesh. That his face was bound about with a napkin means, that we do not attain to full knowledge in this life. And when our Lord says, Loose him, and let him go, we learn that in another world all veils will be removed, and that we shall see face to face.

(Tr. xlix) Or thus: When thou despisest, thou liest dead; when thou confessest, thou comest forth. For what is to come forth, but to go out, as it were, of thy hiding place, and show thyself? But thou canst not make this confession, except God move thee to it, by crying with a loud voice, i. e. calling thee with great grace. But even after the dead man has come forth, he remains bound for some time, i. e. is as yet only a penitent. Then our Lord says to His ministers, Loose him, and let him go, i. e. remit his sins: Whatsoever ye shall bind on earth shall be bound in heaven, and whatsoever ye shall loose on earth shall be loosed in heaven. (Matt. 18:18)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Then they took away the stone. And Jesus lifted up His eyes, and said, Father, I thank Thee, that Thou hast heard me. And I knew that Thou hearest me always: but because of the people that stand by I said it, that they may believe that Thou hast sent me. And when He had thus spoken, He cried with a loud voice." He groaned, He wept, He cried with a loud voice. With what difficulty does one rise who lies crushed under the heavy burden of a habit of sinning! And yet he does rise: he is quickened by hidden grace within; and after that loud voice he riseth. For what followed? "He cried with a loud voice, Lazarus, come forth. And immediately he that was dead came forth, bound hand and foot with bandages; and his face was bound about with a napkin." Dost thou wonder how he came forth with his feet bound, and wonderest not at this, that after four days' interment he rose from the dead? In both events it was the power of the Lord that operated, and not the strength of the dead. He came forth, and yet still was bound. Still in his burial shroud, he has already come outside the tomb. What does it mean? While thou despisest [Christ]. thou liest in the arms of death; and if thy contempt reacheth the lengths I have mentioned, thou art buried as well: but when thou makest confession, thou comest forth. For what is this coming forth, but the open acknowledgment thou makest of thy state, in quitting, as it were, the old refuges of darkness? But the confession thou makest is effected by God, when He crieth with a loud voice, or in other words, calleth thee in abounding grace. Accordingly, when the dead man had come forth, still bound; confessing, yet guilty still; that his sins also might be taken away, the Lord said to His servants: "Loose him, and let him go." What does He mean by such words? Whatsoever ye shall loose on earth shall be loosed in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
