[[commentary]]
quote='''
Now he addeth this also to the praises of God, that He led the Israelites out of Egypt enriched with silver and gold; because even they were then in such a condition, that they could not as yet despise the just and due, though temporal, reward of their toils.…“He brought them forth also in silver and gold” (ver. 37): this too is a Scripture idiom; for “in silver and gold” is said for the same as if it had been said “with silver and gold: there was not one feeble person among their tribes:” in body, not in mind. This also was a great blessing of God, that in this necessity of removal there was no infirm person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
