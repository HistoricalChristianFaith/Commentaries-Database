[[commentary]]
quote='''
What if he tempt thee in these words: If thou wast a Christian, thou wouldest do miracles, as many Christians have done? Thou, deceived by a wicked suggestion, wouldest tempt the Lord thy God, so as to say to Him, If I am a Christian, and am before Thine eyes, and Thou dost account me at all in the number of Thine own, let me also do something like the many works which Thy Saints have done. Thou hast tempted God, as if thou wert not a Christian, unless thou didst this. Many who desired such things have fallen. For that Simon the sorcerer desired such gifts of the Apostles, when he wished to buy the Holy Spirit for money. He loved the power of working miracles, but loved not the imitation of humility.…What then, if he tempt thee thus, “work miracles”? that thou mayest not tempt God, what shouldest thou answer? What our Lord answered. The devil said to Him, “Cast Thyself down; for it is written, He shall give His Angels charge concerning Thee,” etc. If Thou shalt cast Thyself down, Angels shall receive Thee. And it might indeed, my brethren, happen, if our Lord had cast Himself down, the attending Angels would receive our Lord’s flesh; but what does He say to him? “It is written again, Thou shalt not tempt the Lord thy God.” Thou thinkest Me a man. For the devil came to Him with this view, that he might try whether He were the Son of God. He saw His Flesh; but His might appeared in His works: the Angels had borne witness. He saw that He was mortal, so that he might tempt Him, that by Christ’s temptation the Christian might be taught. What then is written? “Thou shalt not tempt the Lord thy God.” Let us not then tempt the Lord, so as to say, If we belong to Thee, let us work a miracle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
