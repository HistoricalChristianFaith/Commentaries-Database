[[commentary]]
quote='''
“And did eat up all the grass in their land, and devoured the fruit of the ground” (ver. 35). Even grass is fruit, as Scripture is wont to speak, which calleth even the ripe corn grass; but it wished these two things to harmonize in number with the two which it had spoken of before, that is, the locust and the caterpillar. But the whole of this doth belong to the variety of speech, which is a remedy for weariness, not to any difference of senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
