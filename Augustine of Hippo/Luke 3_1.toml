[[commentary]]
quote='''
But with respect to the mention of Herod, it is well understood that some are apt to be influenced by the circumstance that Luke has told us how, in the days of John's baptizing, and at the time when the Lord, being then a grown man, was also baptized, Herod was tetrarch of Galilee; whereas Matthew tells us that the boy Jesus returned from Egypt after the death of Herod. Now these two accounts cannot both be true, unless we may also suppose that there were two different Herods. But as no one can fail to be aware that this is a perfectly possible case, what must be the blindness in which those persons pursue their mad follies, who are so quick to launch false charges against the truth of the Gospels; and how miserably inconsiderate must they be, not to reflect that two men may have been called by the same name? Yet this is a thing of which examples abound on all sides. For this latter Herod is understood to have been the son of the former Herod: just as Archelaus also was, whom Matthew states to have succeeded to the throne of Judæa on the death of his father; and as Philip was, who is introduced by Luke as the brother of Herod the tetrarch, and as himself tetrarch of Ituræa. For the Herod who sought the life of the child Christ was king; whereas this other Herod, his son, was not called king, but tetrarch, which is a Greek word, signifying etymologically one set over the fourth part of a kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 7"

[[commentary]]
quote='''
Here again, however, it may happen that a difficulty will be found, and that some, seeing that Matthew has told us how Joseph was afraid to go into Judæa with the child on his return, expressly for the reason that Archelaus the son reigned there in place of his father Herod, may be led to ask how he could have gone into Galilee, where, as Luke bears witness, there was another son of that Herod, namely, Herod the tetrarch. But such a difficulty can only be founded on the fancy that the times indicated as those in which there was such apprehension on the child's account were identical with the times dealt with now by Luke: whereas it is conspicuously evident that there is a change in the periods, because we no longer find Archelaus represented as king in Judæa; but in place of him we have Pontius Pilate, who also was not the king of the Jews, but only their governor, in whose times the sons of the elder Herod, acting under Tiberius Cæsar, held not the kingdom, but the tetrarchy. And all this certainly had not come to pass at the time when Joseph, in fear of the Archelaus who was then reigning in Judæa, betook himself, together with the child, into Galilee, where was also his city Nazareth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 8"
