[[commentary]]
quote='''
“I will render to Thee my vows, which my lips have distinguished” (ver. 14). What is the distinction in vows? This is the distinction, that thyself thou censure, Him thou praise: perceive thyself to be a creature, Him the Creator: thyself darkness, Him the Enlightener, to whom thou shouldest say, “Thou shalt light my lamp, O Lord my God, Thou shalt enlighten my darkness.” For whenever thou shalt have said, O soul, that from thyself thou hast light, thou wilt not distinguish. If thou wilt not distinguish, thou wilt not render distinct vows. Render distinct vows, confess thyself changeable, Him unchangeable: confess thyself without Him to be nothing, but Himself without thee to be perfect; thyself to need Him, but Him not to need thee. Cry to Him, “I have said to the Lord, My God art Thou, for my good things Thou needest not.” Now though God taketh thee to Him for a holocaust, He groweth not, He is not increased, He is not richer, He becometh not better furnished: whatsoever He maketh of thee for thy sake, is the better for thee, not for Him that maketh. If thou distinguishest these things, thou renderest the vows to thy God which thy lips have distinguished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"


[[commentary]]
quote='''
“Let us prevent His face by confession” (ver. 2). Confession hath a double meaning in Scripture. There is a confession of him who praiseth, there is that of him who groaneth. The confession of praise pertaineth to the honour of Him who is praised: the confession of groaning to the repentance of him who confesseth. For men confess when they praise God: they confess when they accuse themselves; and the tongue hath no more worthy use. Truly, I believe these to be the very vows, of which he speaketh in another Psalm: “I will pay Thee my vows, which I distinguished with my lips.” Nothing is more elevated than that distinguishing, nothing is so necessary both to understand and to do. How then dost thou distinguish the vows which thou payest unto God? By praising Him, by accusing thyself; because it is His mercy, to forgive us our sins. For if He chose to deal with us after our deserts, He would find cause only to condemn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
