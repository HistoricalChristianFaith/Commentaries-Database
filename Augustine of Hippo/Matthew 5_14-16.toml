[[commentary]]
quote='''
What of the apostles? Are not they, too, lamps? They are, clearly. He alone is not a lamp. For He is not lighted and put out; because "even as the Father hath life in Himself, so hath He given to the Son to have life in Himself." The apostles also, I say, are lamps; and they give thanks because they were both lighted by the light of truth, and are burning with the spirit of charity, and supplied with the oil of God's grace. If they were not lamps, the Lord would not say to them, "Ye are the light of the world." For after He said, "Ye are the light of the world," He shows that they should not think themselves such a light as that of which it is said, "That was the true light, that enlighteneth every man coming into this world." But this was said of the Lord at that time when He was distinguished from John (the Baptist). Of John the Baptist, indeed, it had been said, "He was not the light, but that he might bear witness of the light." And lest thou shouldst say, How was he not the light, of whom Christ says that "he was a lamp"?-I answer, In comparison of the other light, he was not light. For "that was the true light that enlighteneth every man coming into this world." Accordingly, when He said also to the disciples, "Ye are the light of the world," lest they should imagine that anything was attributed to them which was to be understood of Christ alone, and thus the lamps should be extinguished by the wind of pride, when He had said, "Ye are the light of the world," He immediately subjoined, "A city that is set on a hill cannot be hid; neither do men light a candle and put it under a bushel, but an a candlestick, that it may shine on all that are in the house." But what if He did not call the apostles the candle, but the lighters of the candle, which they were to put on a candlestick? Hear that He called themselves the candle. "So let your light shine," saith He, "before men, that they, seeing your good works, may glorify," not you, but "your Father who is in heaven."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"

[[commentary]]
quote='''
He said in a certain place to His disciples, "Ye are the light of the world. A city that is set on a hill cannot be hid. Neither do men light a candle, and put it under a bushel, but on a candlestick; that it may give light to all that are in the house: so let your light shine before men, that they may see your good works, and glorify your Father who is in heaven:" but He did not say to them, Ye are come a light into the world, that whosoever believeth on you should not abide in darkness. Such a statement, I maintain, can nowhere be met with. All the saints, therefore, are lights, but they are illuminated by Him through faith; and every one that becomes separated from Him will be enveloped in darkness. But that Light, which enlightens them, cannot become separated from itself; for it is altogether beyond the reach of change. We believe, then, the light that has thus been lit, as the prophet or apostle: but we believe him for this end, that we may not believe on that which is itself enlightened, but, with him, on that Light which has given him light; so that we, too, may be enlightened, not by him, but, along with him, by the same Light as he.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252054.html'
source_title="Tractates on John 54"
