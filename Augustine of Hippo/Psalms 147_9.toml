[[commentary]]
quote='''
“And giveth unto the cattle their food” (ver. 9). These are the cattle he meaneth, even God’s flocks. God defraudeth not His flock of their food through men, for whose “service He maketh the grass to grow.” “And to the young of the ravens that call upon Him.” Shall we perchance think this, that the ravens call upon God to give them their food? Think not that the unreasoning creature calls upon God: no creature knows how to call upon God, save the reasonable alone. Consider it as spoken in a figure, lest thou think, as some evil men say, that the souls of men migrate into cattle, dogs, swine, ravens. Give this no place in your hearts or in your faith. The soul of man is made after the image of God: He will not give His image to dog or swine. Who are “the young of the ravens”? The Israelites used to say that they alone were righteous, because to them the Law had been given: all other men of every nation they used to call sinners. And in truth all nations were given up to sin, to idolatry, to the worship of stones and stocks: but did they continue so? Although the ravens themselves, our fathers, did not, yet we, “the young of the ravens,” do call upon God.…For “the young of the ravens,” who seemed to worship the images of their forefathers, have advanced, and turned to God. And now thou hearest “the young of the ravens” calling upon the one God. What then? Sayest thou to “the young of the ravens,” “hast thou left thy father?” Plainly I have, saith he; for he is a raven who calls not upon God. I, “the young of the raven,” do call upon God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
