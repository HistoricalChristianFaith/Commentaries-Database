[[commentary]]
quote='''
Hence there follows also the testimony concerning Pharaoh's punishment, when Scripture says of Pharaoh: For this I raised you up, that I might show my power in you, and that my name might be proclaimed in all the earth; for, as we read in Exodus, the heart of Pharaoh was hardened, so that he was not moved by such evident signs. That Pharaoh at that time did not obey the commands of God already came from his punishment. But no one can say that that hardening of heart befell Pharaoh undeservedly, but by the judgment of God repaying his unbelief with the deserved penalty. Therefore this is not imputed to him—that he then did not obey, since with a hardened heart he could not obey—but that he showed himself deserving of having his heart hardened, by his prior unfaithfulness. For just as in those whom God chooses, not works but faith begins the merit, so that by the gift of God they may work well, so in those whom he condemns, unfaithfulness and ungodliness begin the merit of punishment, so that through the punishment itself they may even work evil, as the same Apostle says above: And because they did not approve of having God in their knowledge, God gave them over to a reprobate mind, to do the things that are not fitting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
