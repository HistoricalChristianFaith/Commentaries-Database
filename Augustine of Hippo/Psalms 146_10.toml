[[commentary]]
quote='''
“Come, ye blessed of My father, enjoy the Kingdom;” “The Lord shall reign for ever” (ver. 10). “O Sion, thy God” shall reign for ever; surely thy God will not reign without thee. “For generation and generation.” He hath said it twice, because he could not say it for ever. And think not that eternity is bounded by finite words. The word eternity consists of four syllables; in itself it is without end. It could not be commended to thee, save thus, “for generation and generation.” Too little hath he said: if he spoke it all day long, it were too narrow: if he spoke it all his life, must he not at length hold his peace? Love eternity: without end shalt thou reign, if Christ be thine End, with whom thou shalt reign for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
