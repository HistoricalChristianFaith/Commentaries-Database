[[commentary]]
quote='''
Behold how God advises and arouses you so that you may be converted from your sins and be saved, though late. Behold how he urges one liable to death to live; how gently, how kindly he calls, not refusing his fatherly devotion even to sinners. He continues to call children those who have lost God their Father by their sins.
'''
source_url=''
source_title="ON THE CHRISTIAN LIFE 2"


[[commentary]]
quote='''
There are people who, as soon as they begin to think about the evil things they have done, assume that they can not be pardoned; and on the assumption that they can not be pardoned, they give their souls over to destruction from that moment.… They perish from despair, whether before they come to believe at all or whether they are already Christians and have fallen by evil living into various sins and vicious forms of behavior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252087.html'
source_title="SERMON 87:10"

[[commentary]]
quote='''
From both, then, men are in danger; both from hoping and despairing, from contrary things, from contrary affections. Who is deceived by hoping? He who says, God is good, God is merciful, let me do what I please, what I like; let me give loose reins to my lusts, let me gratify the desires of my soul. Why this? Because God is merciful, God is good, God is kind. These men are in danger by hope. And those are in danger from despair, who, having fallen into grievous sins, fancying that they can no more be pardoned upon repentance, and believing that they are without doubt doomed to damnation, do say with themselves, We are already destined to be damned, why not do what we please with the disposition of gladiators destined to the sword. This is the reason that desperate men are dangerous: for, having no longer aught to fear, they are to be feared exceedingly. Despair kills these; hope, those. The mind is tossed to and fro between hope and despair. Thou hast to fear lest hope slay thee; and, when thou hopest much from mercy, lest thou fall into judgment: again, thou hast to fear lest despair slay thee, and, when thou thinkest that the grievous sins which thou hast committed cannot be forgiven thee, thou dost not repent, and thou incurrest the sentence of Wisdom, which says, "I also will laugh at your perdition." How then does the Lord treat those who are in danger from both these maladies? To those who are in danger from hope, He says, "Be not slow to be converted to the Lord, neither put it off from day to day; for suddenly His anger will come, and in the time of vengeance, will utterly destroy thee. To those who are in danger from despair, what does He say? "In what day soever the wicked man shall be converted, I will forget all his iniquities." Accordingly, for the sake of those who are in danger by despair, He has offered us a refuge of pardon; and because of those who are in danger by hope, and are deluded by delays, He has made the day of death uncertain. Thou knowest not when thy last day may come. Art thou ungrateful because thou hast to-day on which thou mayest be improved?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
