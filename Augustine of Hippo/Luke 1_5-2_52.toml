[[commentary]]
quote='''
If any one wishes, however, to make up one complete narrative out of all that is said or left unsaid by these two evangelists respectively, on the subject of Christ's nativity and infancy or boyhood, he may arrange the different statements in the following order:—Now the birth of Christ was on this wise. There was, in the days of Herod the king of Judæa, a certain priest named Zacharias, of the course of Abia; and his wife was of the daughters of Aaron, and her name was Elisabeth. And they were both righteous before God, walking in all the commandments and ordinances of the Lord blameless. And they had no child, because that Elisabeth was barren, and they both were well stricken in years. And it came to pass, that while he executed the priest's office before God, in the order of his course, according to the custom of the priest's office, his lot was to burn incense when he went into the temple of the Lord: and the whole multitude of the people were praying without at the time of incense. And there appeared unto him an angel of the Lord standing on the right side of the altar of incense. And when Zacharias saw him he was troubled, and fear fell upon him. But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John. And thou shalt have joy and gladness; and many shall rejoice at his birth. For he shall be great in the sight of the Lord: and he shall drink neither wine nor strong drink; and he shall be filled with the Holy Ghost, even from his mother's womb. And many of the children of Israel shall he turn to the Lord their God. And he shall go before him in the spirit and power of Elias, to turn the hearts of the fathers to the children, and the disobedient to the wisdom of the just; to make ready a people perfect for the Lord. And Zacharias said unto the angel, Whereby shall I know this? for I am an old man, and my wife well stricken in years. And the angel, answering, said unto him, I am Gabriel, that stand in the presence of God; and am sent to speak unto thee, and to show thee these glad tidings. And, behold, thou shalt be dumb, and not able to speak, until the day that these things shall be performed, because thou hast not believed my words, which shall be fulfilled in their season. And the people waited for Zacharias, and marvelled that he tarried in the temple. And when he came out, he could not speak unto them: and they perceived that he had seen a vision in the temple: and he beckoned unto them, and remained speechless. And it came to pass that, as soon as the days of his ministration were accomplished, he departed to his own house. And after those days his wife Elisabeth conceived, and hid herself five months, saying, Thus hath the Lord dealt with me in the days wherein He looked upon me, to take away my reproach among men. And in the sixth month the angel Gabriel was sent from God unto a city of Galilee, named Nazareth, to a virgin espoused to a man whose name was Joseph, of the house of David; and the virgin's name was Mary. And the angel came in unto her, and said, Hail, thou that art full of grace, the Lord is with thee; blessed art thou among women. And when she saw him, she was troubled at his saying, and cast in her mind what manner of salutation this should be. And the angel said unto her, Fear not, Mary: for thou hast found favour with God. Behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call His name Jesus. He shall be great, and shall be called the Son of the Highest; and the Lord God shall give unto Him the throne of His father David: and He shall reign in the house of Jacob for ever; and of His kingdom there shall be no end. Then said Mary unto the angel, How shall this be, seeing I know not a man? And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God. And, behold, thy cousin Elisabeth, she hath also conceived a son in her old age: and this is the sixth month with her who is called barren. For with God nothing shall be impossible. And Mary said, Behold the handmaid of the Lord; be it unto me according to thy word. And the angel departed from her. And Mary arose in those days, and went into the hill country with haste, into a city of Juda; and entered into the house of Zacharias, and saluted Elisabeth. And it came to pass, that when Elisabeth heard the salutation of Mary, the babe leaped in her womb; and Elisabeth was filled with the Holy Ghost: and she spake out with a loud voice, and said, Blessed art thou among women, and blessed is the fruit of thy womb. And whence is this to me, that the mother of my Lord should come to me? for, lo, as soon as the voice of thy salutation sounded in mine ears, the babe leaped in my womb for joy. And blessed art thou that didst believe, for there shall be a performance of those things which were told thee from the Lord. And Mary said, My soul doth magnify the Lord, and my spirit hath rejoiced in God my Saviour. For He hath regarded the low estate of His handmaiden: for, behold, from henceforth all generations shall call me blessed. For He that is mighty hath done to me great things, and holy is His name. And His mercy is on them that fear Him, from generation to generation. He hath made strength with His arm; He hath scattered the proud in the imagination of their heart. He hath put down the mighty from their seat, and exalted them of low degree. He hath filled the hungry with good things, and the rich He hath sent empty away. He hath holpen His servant Israel, in remembrance of his mercy: as He spake to our fathers, to Abraham, and to his seed for ever. And Mary abode with her about three months, and returned to her own house. Then it proceeds thus:—She was found with child of the Holy Ghost. Then Joseph her husband, being a just man, and not willing to make her a public example, was minded to put her away privily. But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost. And she shall bring forth a son, and thou shalt call His name Jesus: for He shall save His people from their sins. Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying, Behold, a virgin shall be with child, and shall bring forth a son, and they shall call His name Emmanuel; which, being interpreted, is, God with us. Then Joseph, being raised from sleep, did as the angel of the Lord had bidden him, and took unto him his wife, and knew her not.

Now Elisabeth's full time came that she should be delivered, and she brought forth a son. And her neighbours and her relatives heard that the Lord magnified His mercy with her; and they congratulated her. And it came to pass, that on the eighth day they came to circumcise the child; and they called him Zacharias, after the name of his father. And his mother answered and said, Not so; but he shall be called John. And they said unto her, There is none of thy kindred that is called by this name. And they made signs to his father, how he would have him called. And he asked for a writing table, and wrote, saying, His name is John. And they marvelled all. And his mouth was opened immediately, and his tongue, and he spake and praised God. And fear came on all them that dwelt round about them: and all these sayings were noised abroad throughout all the hill country of Judæa. And all they that had heard them laid them up in their heart, saying, What manner of child, thinkest thou, shall this be? For the hand of the Lord was with him. And his father Zacharias was filled with the Holy Ghost, and prophesied, saying, Blessed be the Lord God of Israel; for He hath visited and redeemed His people, and hath raised up an horn of salvation for us in the house of His servant David; as He spake by the mouth of His holy prophets, which have been since the world began; (to give) salvation from our enemies, and from the hand of all that hate us: to perform mercy with our fathers, and to remember His holy covenant, the oath which He sware to Abraham our father that He would give to us; in order that, being saved out of the hand of our enemies, we might serve Him without fear, in holiness and righteousness before Him, all our days. And thou, child, shalt be called the Prophet of the Highest: for thou shalt go before the face of the Lord to prepare His ways; to give knowledge of salvation unto His people, for the remission of their sins, through the tender mercy of our God; whereby the dayspring from on high hath visited us, to give light to them that sit in darkness and in the shadow of death, to guide our feet into the way of peace. And the child grew, and waxed strong in spirit, and was in the deserts until the day of his showing unto Israel. And it came to pass in those days, that there went out a decree from Cæsar Augustus, that all the world should be taxed. This first taxing was made when Syrinus was governor of Syria. And all went to be taxed, every one into his own city. And Joseph also went up from Galilee, out of the city of Nazareth, into Judæa, unto the city of David, which is called Bethlehem, because he was of the house and lineage of David, to be taxed with Mary his espoused wife, being great with child. And so it was, that while they were there, the days were accomplished that she should be delivered. And she brought forth her first-born son, and wrapped Him in swaddling-clothes, and laid Him in a manger; because there was no room for them in the inn. And there were in the same country shepherds watching and keeping the virgils of the night over their flock. And, lo, the angel of the Lord stood by them, and the glory of the Lord shone round about them; and they were sore afraid. And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people. For unto you is born this day, in the city of David, a Saviour, which is Christ the Lord. And this shall be a sign unto you: Ye shall find the babe wrapped in swaddling-clothes, lying in a manger. And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, and on earth peace to men of goodwill. And it came to pass, as the angels were gone away from them into heaven, the shepherds said one to another, Let us now go even unto Bethlehem, and see this thing which is come to pass, which the Lord hath made known unto us. And they came with haste, and found Mary and Joseph, and the babe lying in a manger. And when they had seen it, they understood the saying which had been told them concerning this child. And all they that heard it, wondered also at those things which were told them by the shepherds. But Mary kept all these things, and pondered them in her heart. And the shepherds returned, glorifying and praising God for all the things that they had heard and seen, as it was told unto them. And when eight days were accomplished for the circumcising of the child, His name was called Jesus, which was so named of the angel before He was conceived in the womb. And then it proceeds thus: Behold, there came wise men from the east to Jerusalem, saying, Where is he that is born King of the Jews? for we have seen His star in the east, and are come to worship Him. Now when Herod the king had heard these things, he was troubled, and all Jerusalem with him. And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born. And they said unto him, In Bethlehem of Judæa; for thus it is written by the prophet, And thou, Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor that shall rule my people Israel. Then Herod, when he had privily called the wise men, inquired of them diligently the time of the star which appeared unto them. And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found him, bring me word again, that I may come and worship him also. When they had heard the king, they departed; and, lo, the star which they had seen in the east went before them, until it came and stood over where the young child was. And when they saw the star, they rejoiced with exceeding great joy. And when they were come into the house, they found the child with Mary His mother, and fell down and worshipped Him: and when they had opened their treasures, they presented unto Him gifts, gold, frankincense, and myrrh. And being warned of God in a dream that they should not return unto Herod, they departed into their own country another way. Then, after this account of their return, the narrative goes on thus: When the days of her (His mother's) purification, according to the law of Moses, were accomplished, they brought Him to Jerusalem, to present Him to the Lord (as it is written in the law of the Lord, Every male that openeth the womb shall be called holy to the Lord), and to offer a sacrifice according to that which is said in the law of the Lord, A pair of turtle-doves, or two young pigeons. And, behold, there was a man in Jerusalem whose name was Simeon; and the same man was just and devout, waiting for the consolation of Israel: and the Holy Ghost was in him.

And it had been revealed unto him by the Holy Ghost, that he should not see death before he had seen the Lord's Christ. And he came by the Spirit into the temple. And when His parents brought in the child Jesus, to do for Him after the custom of the law, then took he Him up in his arms, and said, Lord, now lettest Thou Thy servant depart in peace, according to Thy word: for mine eyes have seen Thy salvation, which Thou hast prepared before the face of all people; a light to lighten the Gentiles, and the glory of Thy people Israel. And His father and mother marvelled at those things which were spoken of Him. And Simeon blessed them, and said unto Mary His mother, Behold, this child is set for the fall and rising again of many in Israel, and for a sign that shall be spoken against; and a sword shall pierce through thy own soul also, that the thoughts of many hearts may be revealed. And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Aser: she was of a great age, and had lived with her husband seven years from her virginity; and she was a widow of about fourscore and four years, which departed not from the temple, but served God with fastings and prayers day and night. And she, coming in that instant, gave thanks also unto the Lord, and spake of Him to all them that looked for the redemption of Jerusalem. And when they had performed all things according to the law of the Lord, behold, the angel of the Lord appeared to Joseph in a dream, saying, Arise, and take the young child and His mother, and flee into Egypt, and be thou there until I bring thee word; for Herod will seek the young child to destroy Him. When he arose, he took the young child and His mother by night, and departed into Egypt, and was there until the death of Herod; that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my Son. Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently inquired of the wise men. Then was fulfilled that which was spoken by Jeremy the prophet, saying, In Rama was there a voice heard, lamentation and great mourning, Rachel weeping for her children, and would not be comforted, because they are not. But when Herod was dead, behold, an angel of the Lord appeared in a dream to Joseph in Egypt, saying, Arise, and take the young child and His mother, and go into the land of Israel; for they are dead which sought the young child's life. And he arose, and took the young child and His mother, and came into the land of Israel. But when he heard that Archelaus did reign in Judæa, in the room of his father Herod, he was afraid to go thither; and being warned of God in a dream, he turned aside into the parts of Galilee; and came and dwelt in a city called Nazareth, that it might be fulfilled which was spoken by the prophets, He shall be called a Nazarene. And the child grew, and waxed strong, filled with wisdom; and the grace of God was in Him. And His parents went to Jerusalem every year, at the feast of the passover. And when He was twelve years old, they went up to Jerusalem, after the custom of the feast. And when they had fulfilled the days, as they returned, the child Jesus tarried behind in Jerusalem; and His parents knew not of it. But they, supposing Him to have been in the company, went a day's journey; and they sought Him among their kinsfolk and acquaintance. And when they found Him not, they turned back again to Jerusalem seeking Him. And it came to pass, that after three days they found Him in the temple, sitting in the midst of the doctors, both hearing them and asking them questions. And all that heard Him were astonished at His understanding and answers. And when they saw Him, they were amazed. And His mother said to Him, Son, why hast thou thus dealt with us? behold, thy father and I sought thee sorrowing. And He said unto them, How is it that ye sought me? Wist ye not that I must be about my Father's business? And they understood not the saying which He spake unto them. And He went down with them, and came to Nazareth, and was subject unto them; and His mother kept all these sayings in her heart. And Jesus increased in wisdom and age, and in favour with God and men.
'''
