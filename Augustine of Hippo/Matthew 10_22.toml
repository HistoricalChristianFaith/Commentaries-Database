[[commentary]]
quote='''
(De Civ. Dei, xxi. 25.) To endure in Christ, is to abide in His faith which worketh by love.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There remains still the question, which I now think may meanwhile thus be solved. There is a voice of some kind,-there is, I say, a certain kind of voice of the Shepherd, in respect of which the sheep hear not strangers, and in respect of which those who are not sheep do not hear Christ. What a word is this! "He that endureth to the end, the same shall be saved." No one of His own is indifferent to such a voice, a stranger does not hear it: for this reason also does He announce it to the former, that he may abide perseveringly with Himself to the end; but by one who is wanting in such persevering continuance with Him, such a word remains unheard. One has come to Christ, and has heard word after word of one kind and another, all of them true, all of them salutary; and among all the rest is also this utterance, "He that endureth to the end, the same shall be saved." He who has heard this is one of the sheep. But there was, perhaps, some one listening to it, who treated it with dislike, with coldness, and heard it as that of a stranger. If he was predestinated, he strayed for the time, but he was not lost for ever: he returns to hear what he has neglected, to do what he has heard. For if he is one of those who are predestinated, then both his very wandering and his future conversion have been foreknown by God: if he has strayed away, he will return to hear that voice of the Shepherd, and to follow Him who saith, "He that endureth to the end, the same shall be saved." A good voice, brethren, it is; true and shepherd-like, the very voice of salvation in the tabernacles of the righteous. For it is easy to hear Christ, easy to praise the gospel, easy to applaud the preacher: but to endure unto the end, is peculiar to the sheep who hear the Shepherd's voice. A temptation befalls thee, endure thou to the end, for the temptation will not endure to the end. And what is that end to which thou shalt endure? Even till thou reachest the end of thy pathway. For as long as thou hearest not Christ, He is thine adversary in the pathway, that is, in this mortal life. And what doth He say? "Agree with thine adversary quickly, while thou art in the way with him." Thou hast heard, hast believed, hast agreed. If thou hast been at enmity, agree. If thou hast got the opportunity of coming to an agreement, keep not up the quarrel longer. For thou knowest not when thy way will be ended, and it is known to Him. If thou art a sheep, and if thou endurest to the end, thou shalt be saved: and therefore it is that His own despise not that voice, and strangers hear it not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
