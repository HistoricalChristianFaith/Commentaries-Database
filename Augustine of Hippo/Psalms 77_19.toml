[[commentary]]
quote='''
“Thy way is in the sea” (ver. 19). But now Thy way was in the Holy One, now “Thy way is in the sea:” because the Holy One Himself is in the sea, and with reason even did walk upon the waters of the sea. “Thy way is in the sea,” that is, Thy Christ is preached among the Gentiles.…“Thy way is in the sea, and Thy paths in many waters,” that is, in many peoples. “And Thy footsteps will not be known.” He hath touched certain, and wonder were it if it be not those same Jews. Behold now the mercy of Christ hath been so published to the Gentiles, that “Thy way is in the sea. Thy footsteps will not be known.” How so, by whom will they not be known, save by those who still say, Christ hath not yet come? Why do they say, Christ hath not yet come? Because they do not yet recognise Him walking on the sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
