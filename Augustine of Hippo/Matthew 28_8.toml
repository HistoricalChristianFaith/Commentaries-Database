[[commentary]]
quote='''
(de Cons. Ev. iii. 23.) They departed forth of the tomb, that is, from that spot of the garden which was before the tomb hewn in the rock.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"
