[[commentary]]
quote='''
To the end, a psalm of David himself.

It is a well-known title; nor does the Lord Jesus Christ say what follows, but it is said of Him.

“The heavens tell out the glory of God” (ver. 1). The righteous Evangelists, in whom, as in the heavens, God dwelleth, set forth the glory of our Lord Jesus Christ, or the glory wherewith the Son glorified the Father upon earth. “And the firmament showeth forth the works of His hands.” And the firmament showeth forth the deeds of the Lord’s power, that now made heaven by the assurance of the Holy Ghost, which before was earth by fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252019.html'
source_title="Exposition on Psalm 19"

[[commentary]]
quote='''
“The heavens have declared His righteousness: and all the people have seen His glory” (ver. 6). What heavens have declared? “The heavens declare the glory of God.” Who are the heavens? Those who have become His seat; for as God sitteth in the heavens, so doth He sit in the Apostles, so doth He sit in the preachers of the Gospel. Even thou, if thou wilt, shalt be a heaven. Dost thou wish to be so? Purge from thy heart the earth. If thou hast not earthly lusts, and hast not in vain uttered the response, that thou hast “lifted up thy heart,” thou shalt be a heaven. “If ye be risen with Christ,” saith the Apostle to believers, “set your affection on things above, not on things of the earth.” Thou hast begun to set thine affection upon things above, not on things upon earth; hast thou not become a heaven? Thou carriest flesh, and in thy heart thou art already a heaven; for thy conversation will be in heaven. Being such, thou also declarest Christ; for who of the faithful declareth not Christ?…Therefore the whole Church preacheth Christ, and the heavens declare His righteousness; for all the faithful, whose care it is to gain unto God those who have not yet believed, and who do this from love, are heavens. From them God thundereth forth the terror of His judgment; and he who was unbelieving trembleth, and is alarmed, and believeth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
