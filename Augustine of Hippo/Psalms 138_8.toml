[[commentary]]
quote='''
“Thou, Lord, shalt recompense for me” (ver. 8). I recompense not: Thou shalt recompense. Let mine enemies rage their full: Thou shalt recompense what I cannot.…“Dearly beloved, avenge not yourselves,” saith the Apostle, “but rather give place unto wrath; for it is written, Vengeance is Mine, I will repay, saith the Lord.” There is here another sense not to be neglected, perhaps even to be preferred. “Lord” Christ, “Thou shalt repay for me.” For I, if I repay, have seized; Thou hast paid what Thou hast not seized. Lord, Thou shalt “repay for me.” Behold Him repaying for us. They came to Him, who exacted tribute: they used to demand as tribute a didrachma, that is, two drachmas for one man; they came to the Lord to pay tribute; or rather, not to Him, but to His disciples, and they said to them, “Doth not your Master pay tribute?” They came and told Him. He saith unto Peter, “lest we should offend them, go thou to the sea, and cast an hook, and take up the fish that first cometh up: and when thou hast opened his mouth, thou shalt find a stater: that take, and give for Me and thee.” The first that riseth from the sea, is the First-begotten from the dead. In His mouth we find two didrachmas, that is, four drachmas: in His mouth we find the four Gospels. By those four drachmas we are free from the claims of this world, by the four Evangelists we remain no longer debtors; for there the debt of all our sins is paid. He then hath repaid for us, thanks to His mercy. He owed nothing: He repaid not for Himself: He repaid for us.…

“Lord, Thy mercy is for everlasting.”…Not for a time only do I desire to be freed. “Thy mercy is for everlasting,” wherewith Thou hast freed the martyrs, and so hast quickly taken them from this life. “Despise not Thou the works of Thine own hands.” I say not, Lord, “despise not the works of my hands:” of mine own works I boast not. “I sought,” indeed, “the Lord with my hands in the night season before Him, and have not been deceived;” but yet I praise not the works of mine own hands; I fear lest, when Thou shalt look into them, Thou find more sins in them than deserts. Behold in me Thy Work, not mine: for mine if Thou seest, Thou condemnest; Thine, if Thou seest, Thou crownest. For whatever good works there be of mine, from Thee are they to me; and so they are more Thine than mine. Therefore whether in regard that we are men, or in regard that we have been changed and justified from our iniquity, Lord, “despise not Thou the works of Thine own hands.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"
