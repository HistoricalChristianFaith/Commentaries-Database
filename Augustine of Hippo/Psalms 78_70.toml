[[commentary]]
quote='''
“And He chose David His servant” (ver. 71). The tribe, I say, of Judah, for the sake of David: but David for the sake of Christ: the tribe then of Judah for the sake of Christ. At whose passing by blind men cried out, “Have pity on us, Son of David:” and forthwith by His pity they received light, because true was the thing which they cried out. This then the Apostle doth not cursorily speak of, but doth heedfully notice, writing to Timothy, “Be thou mindful, that Christ Jesus hath risen from the dead, of the seed of David,” etc. Therefore the Saviour Himself, made according to the flesh of the seed of David, is figured in this passage under the name of David, the Lord opening in parables His mouth. And let it not move us, that when he had said, “and He chose David,” under which name he signified Christ, he hath added, “His servant,” not His Son. Yea even hence we may perceive, that not the substance of the Only-Begotten coeternal with the Father, but the “form of a servant” was taken of the seed of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
