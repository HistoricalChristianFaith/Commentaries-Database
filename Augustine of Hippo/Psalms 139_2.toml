[[commentary]]
quote='''
“Thou hast known My down-sitting and Mine up-rising” (ver. 2). What here is “down-sitting,” what “up-rising”? He who sitteth, humbleth himself. The Lord then “sat” in His Passion, “up-rose” in His Resurrection. “Thou,” he saith, hast known this; that is, Thou hast willed, Thou hast approved; according to Thy will was it done. But if thou choosest to take the words of the Head in the person of the Body: man sitteth when he humbleth himself in penitence, he riseth up when his sins are forgiven, and he is lifted up to the hope of everlasting life. Lift not up yourselves, unless ye have first been humbled. For many wish to rise before they have sat down, they wish to appear righteous, before they have confessed that they are sinners.…

“Thou hast understood my thoughts from afar; Thou hast tracked out my path and my limit” (ver. 3); “and all my ways Thou hast seen beforehand” (ver. 4). What is, “from afar”? While I am yet in my pilgrimage, before I reach that, my true country, Thou hast known my thoughts.…The younger son went into a far country. After his toil and suffering and tribulation and want, he thought on his father, and desired to return, and said, “I will arise, and go to my father.” “I will arise,” said he, for before he had sat. Here then thou mayest recognise him saying, “Thou hast known my down-sitting and up-rising.” I sat, in want; I arose, in longing for Thy Bread. “Thou hast understood my thoughts from afar.” For far indeed had I gone; but where is not He whom I had left? Wherefore the Lord saith in the Gospel, that his father met him as he was coming. Truly; for “he had understood his thoughts from afar.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
