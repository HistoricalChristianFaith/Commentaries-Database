[[commentary]]
quote='''
“For Thou art not a God who hast pleasure in iniquity. The malignant man shall not dwell near Thee, nor shall the unrighteous abide before Thine eyes. Thou hast hated all that work iniquity, Thou wilt destroy all that speak a lie. The man of blood, and the crafty man, the Lord will abominate” (vers. 4–6). Iniquity, malignity, lying, homicide, craft, and all the like, are the night of which we speak: on the passing away of which, the morning dawns, that God may be seen. He has unfolded the reason, then, why he will stand by in the morning, and see: “For,” he says, “Thou art not a God who hast pleasure in iniquity.” For if He were a God who had pleasure in iniquity, He could be seen even by the iniquitous, so that He would not be seen in the morning, that is, when the night of iniquity is over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
