[[commentary]]
quote='''
“My bone is not hid from Thee, which Thou hast made in secret” (ver. 15). “His bone,” he saith. What the people call ossum, is in Latin called os. This is the word in the Greek. For we might think the word os is here the one which makes in the plural ora, not os (short), which makes ossa. He saith then, I have a certain bone (ossum) in secret. For this word let us prefer to use; better is it that scholars find fault with us, than that the people understand us not. “There is then,” saith he, “a certain bone of mine, within, hidden; Thou hast made within a bone for me in secret, yet is it not hidden from Thee. In secret hast Thou made it, but hast Thou therefore hidden it from Thyself? This my bone made by Thee in secret men see not, men know not: Thou knowest, who hast made. What “bone” then meaneth he, brethren? Let us seek it, it is “in secret.” But because as Christians we are speaking in the Name of the Lord to Christians, now we find what bone is of this kind. It is a sort of inward strength; for strength and fortitude are understood to be in the bones. There is then a sort of inward strength of the soul, wherein it is not broken. Whatever tortures, whatever tribulations, whatever adversities rage around, that which God hath made strong in secret in us, cannot be broken, yieldeth not. For by God is made a certain strength of patience, of which is said in another Psalm, “But my soul shall be subjected to God, for of Him is my patience.”…Wherein dost thou glory? “In tribulations, knowing that tribulation worketh patience.” See how that strength is fashioned within in his heart: “because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.” So is fashioned and made strong that hidden bone, that it maketh us even to glory in tribulations. But to men we seem wretched, because that which we have within is hidden from them. “And my substance is in the lower parts of the earth.” Behold, in flesh is my substance, yet have I a bone within, which Thou hast fashioned, such as to cause me never to yield to any persecutions of this lower region, where still my substance is. For what great matter is it, if an Angel be brave? This is a great matter, if flesh is brave. And whence is flesh brave, whence is an earthen vessel brave, save because in it is made a bone in secret?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
