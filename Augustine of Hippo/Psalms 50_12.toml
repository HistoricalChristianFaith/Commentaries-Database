[[commentary]]
quote='''
Who can explain, who expound that which is said to Him in another Psalm, “For my goods Thou needest not”? He hath said that He needeth not from us any necessary thing. “If I shall be hungry, I will not tell thee” (ver. 12). He that keepeth Israel shall neither hunger nor thirst, nor be weary, nor fall asleep. But, lo! according to thy carnality I speak: because thou wilt suffer hunger when thou hast not eaten, perhaps thou thinkest even God doth hunger that He may eat. Even though He shall be hungry, He telleth not thee: all things are before Him, whence He will He taketh what is needful for Him. These words are said to convince little understanding; not that God hath declared His hunger. Though for our sake this God of gods deigned even to hunger. He came to hunger, and to fill; He came to thirst, and give drink; He came to be clothed with mortality, and to clothe with immortality; He came poor, to make rich. For He lost not His riches by taking to Him our poverty, for, “In him are all the treasures of wisdom and knowledge hidden.” “If I shall be hungry, I will not tell thee. For Mine is the whole world, and the fulness thereof.” Do not then labour to find what to give Me, without whom I have what I will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
