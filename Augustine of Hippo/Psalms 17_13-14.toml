[[commentary]]
quote='''
“Thy weapon: from the enemies of Thine hand” (ver. 14). For My soul is Thy weapon, which Thy hand, that is, Thy eternal Power, hath taken to subdue thereby the kingdoms of iniquity, and divide the righteous from the ungodly. This weapon then “deliver from the enemies of Thine hand,” that is, of Thy Power, that is, from Mine enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
