[[commentary]]
quote='''
By this, then, which the Lord hath explained, that He Himself is the door, let us find entrance to what He has set forth, but not explained. And indeed who it is that is the Shepherd, although He hath not told us in the lesson we have read to-day, yet in that which follows He very plainly tells us: "I am the good Shepherd." And although He had not said so, whom else but Himself ought we to have understood in those words where He saith, "He that entereth in by the door is the Shepherd of the sheep. To Him the porter openeth: and the sheep hear His voice: and He calleth His own sheep by name, and leadeth them out. And when He putteth forth His own sheep, He goeth before them, and the sheep follow Him: for they know His voice"? For who else calleth His own sheep by name, and leadeth them hence unto eternal life, but He who knoweth the names of those that are fore-ordained? Hence He said to His disciples, "Rejoice that your names are written in heaven;" for from this it is that He calleth them by name. And who else putteth them forth, save He who putteth away their sins, that, freed from their grievous fetters, they may be able to follow Him? And who hath gone before them to the place whither they are to follow Him, but He who, rising from the dead, dieth no more; and death shall have no more dominion over Him; and who, when He was manifest here in the flesh, said, "Father, I will that they also whom Thou hast given me be with me where I am"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
