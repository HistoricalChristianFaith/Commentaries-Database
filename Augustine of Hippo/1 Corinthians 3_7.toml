[[commentary]]
quote='''
Since the apostles would not have accomplished anything if God had not given the increase, how much more true is this of you or me, or anyone else of our time, who fancies himself as a teacher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 193"

[[commentary]]
quote='''
And though they do learn from men, yet what they understand is given them within, flashes within, is revealed within. What do men that proclaim tidings from without? What am I doing even now while I speak? I am pouring a clatter of words into your ears. What is that that I say or that I speak, unless He that is within reveal it? Without is the planter of the tree, within is the tree's Creator. He that planteth and He that watereth work from without: this is what we do. But "neither he that planteth is anything, nor he that watereth; but God that giveth the increase." That is, "they shall be all taught of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
