[[commentary]]
quote='''
Hear in one place the apostle himself ascending and descending in the same sentence: "For whether," says he,"we be beside ourselves, it is to God; or whether we be sober, it is for your cause. " What is "we are beside ourselves "? That we see those things which it is not lawful for a man to speak. What is "we are sober for your cause? Have I judged myself to know anything among you, save Jesus Christ and Him crucified?" If the Lord Himself ascended and descended, it is evident that His preachers ascend by imitation. descend by preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
