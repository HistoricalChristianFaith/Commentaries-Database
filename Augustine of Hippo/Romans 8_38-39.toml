[[commentary]]
quote='''
When he says: For I am certain—and he did not say: For I think—he held with full faith that neither any death, nor temporal life promised, nor the rest that follows, can turn the believer away from the love of God. No one, therefore, separates us: neither he who threatens death, because he who believes in Christ, though he die, shall live; nor he who promises life, because that One gives eternal life. For the promise of temporal life is to be despised in comparison with the eternal. Nor does an angel separate us, because, though an angel, he says, should come down from heaven and announce to you anything beyond what you have received, let him be anathema. Nor principality—that is, an adverse one—because he himself stripped off these principalities and powers, triumphing over them in himself. Nor things present nor things to come—that is, temporal things, whether those that delight, or those that oppress, or those that give hope, or those that strike fear. Nor power (and here an adverse power must be understood, according to which he says: No one shall plunder the goods of the strong man unless he first binds the strong man), nor height, nor depth. For very often an empty curiosity about those things which cannot be found, or are even found in vain, whether in heaven or in the abyss, separates one from God, unless love conquers, which invites us to sure spiritual things, not by the vanity of the things that are outside, but by the inner man. Nor any other creature. This can be understood in two ways: either the visible creature—since we too, that is, the soul, are a creature, but an invisible one—so that he meant this: that no other creature separates us, that is, the love of bodies; or else that no other creature separates us from the love of God, from the fact that there is no other creature between us and God which might set itself against us and exclude us from his embrace. For above human minds, which are rational, there is no longer any creature, but God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
