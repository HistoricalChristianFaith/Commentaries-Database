[[commentary]]
quote='''
(Tract. cxxii) In the draught before, the number of the fishes is not mentioned, as if in fulfilment of the prophecy in the Psalm, If I should declare them, and speak of them, they should be more than I am able to express; (Ps. 41:7) but here there is a certain number mentioned, which we must explain. The number which signifies the law is ten, from the ten Commandments. But when to the law is joined grace, to the letter spirit, the number seven is brought in, that being the number which represents the Holy Spirit, to Whom sanctification properly belongs. For sanctification was first heard of in the law, with respect to the seventh day; and Isaiah praises the Holy Spirit for His sevenfold work and office. The seven of the Spirit added to the ten of the law make seventeen; and the numbers from one up to seventeen when added together, make a hundred and fifty-three.

(Tract. cxxii) It is not then signified that only a hundred and fifty-three saints are to rise again to eternal life, but this number represents all who partake of the grace of the Holy Spirit: which number too contains three fifties, and three over, with reference to the mystery of the Trinity. And the number fifty is made up of seven sevens, and one in addition, signifying that those sevens are one. That they were great fishes too, is not without meaning. For when our Lord says, I came not to destroy the law, but to fulfil, by giving, that is, the Holy Spirit through Whom the law can be fulfilled, He says almost immediately after, Whosoever shall do and teach them, the same shall be called great in the kingdom of heaven. In the first draught the net was broken, to signify schisms; but here to show that in that perfect peace of the blessed there would be no schisms, the Evangelist continues: And for all they were so great, yet was not the net broken; as if alluding to the case before, in which it was broken, and making a favourable comparison.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For if we determine on the number that should indicate the law, what else can it be but ten? For we have absolute certainty that the Decalogue of the law, that is, those ten well-known precepts, were first written by the finger of God on two tables of stone. But the law, when it is not aided by grace, maketh transgressors, and is only in the letter, on account of which the apostle specially declared, "The letter killeth, but the spirit giveth life." Let the spirit then be added to the letter, lest the letter kill him whom the spirit maketh not alive, and let us work out the precepts of the law, not in our own strength, but by the grace of the Saviour. But when grace is added to the law, that is, the spirit to the letter, there is, in a kind of way, added to ten the number of seven. For this number, namely seven, is testified by the documents of holy writ given us for perusal, to signify the Holy Spirit. For example, sanctity or sanctification properly pertains to the Holy Spirit, whence, as the Father is a spirit, and the Son a spirit, because God is a spirit, so the Father is holy and the Son holy, yet the Spirit of both is called peculiarly by the name of the Holy Spirit. Where, then, was there the first distinct mention of sanctification in the law but on the seventh day? For God sanctified not the first day, when He made the light; nor the second, when He made the firmament; nor the third, when He separated the sea from the land, and the land brought forth grass and timber; nor the fourth, wherein the stars were created; nor the fifth, wherein were created the animals that live in the waters or fly in the air; nor the sixth, when the terrestrial living soul and man himself were created; but He sanctified the seventh day, wherein He rested from all His works. The Holy Spirit, therefore, is aptly represented by the septenary number. The prophet Isaiah likewise says, "The Spirit of God shall rest on Him;" and thereafter calls our attention to that Spirit in His septenary work or grace, by saying, "The spirit of wisdom and understanding, the spirit of counsel and might, the spirit of knowledge and piety; and He shall be filled with the spirit of the fear of God." And what of the Revelation? Are they not there called the seven Spirits of God, while there is only one and the same Spirit dividing to every one severally as He will? But the septenary operation of the one Spirit was so called by the Spirit Himself, whose own presence in the writer led to their being spoken of as the seven Spirits. Accordingly, when to the number of ten, representing the law, we add the Holy Spirit as represented by seven, we have seventeen; and when this number is used for the adding together of every several number it contains, from 1 up to itself, the sum amounts to one hundred and fifty-three. For if you add 2 to 1, you have 3 of course; if to these you add 3 and 4, the whole makes 10; and then if you add all the numbers that follow up to 17, the whole amounts to the foresaid number; that is, if to 10, which you had reached by adding all together from 1 to 4, you add 5, you have 15; to these add 6, and the result is 21; then add 7, and you have 28; to this add 8, and 9, and 10, and you get 55; to this add 11 and 12, and 13, and you have 91; and to this again add 14, 15, and 16, and it comes to 136; and then add to this the remaining number of which we have been speaking, namely, 17, and it will make up the number of fishes. But it is not on that account merely a hundred and fifty-three saints that are meant as hereafter to rise from the dead unto life eternal, but thousands of saints who have shared in the grace of the Spirit, by which grace harmony is established with the law of God, as with an adversary; so that through the life-giving Spirit the letter no longer kills, but what is commanded by the letter is fulfilled by the help of the Spirit, and if there is any deficiency it is pardoned. All therefore who are sharers in such grace are symbolized by this number, that is, are symbolically represented. This number has, besides, three times over, the number of fifty, and three in addition, with reference to the mystery of the Trinity; while, again, the number of fifty is made up by multiplying 7 by 7, with the addition of 1, for 7 times 7 make 49. And the 1 is added to show that there is one who is expressed by seven on account of His sevenfold operation; and we know that it was on the fiftieth day after our Lord's ascension that the Holy Spirit was sent, for whom the disciples were commanded to wait according to the promise.

It was not, then, without a purpose that these fishes were described as so many in number, and so large in size, that is, as both an hundred and fifty-three, and large. For so it is written, "And He drew the net to land full of great fishes, an hundred and fifty and three." For when the Lord said, "I am not come to destroy the law, but to fulfill "because about to give the Spirit, through whom the law might be fulfilled, and to add thereby, as it were, seven to ten; after interposing a few other words He proceeded, "Whosoever therefore shall break one of these least commandments, and shall teach men so, he shall be called the least in the kingdom of heaven: ] but whosoever shall do and teach them. the same shall be called great in the kingdom of heaven. The latter, therefore, may possibly belong to the number of great fishes. But he that is the least, who undoes in deed what he teaches in word, may be in such a church as is signified by that first capture of fishes, which contains both good and bad, for it also is called the kingdom of heaven, as He says, "The kingdom of heaven is like unto a net that was cast into the sea, and gathered of ever kind;" where He wishes the good as well as the bad to be understood, and of whom He declares that they are yet to be separated on the shore, to wit, at the end of the world. And lastly, to show that those least ones are reprobates who teach by word of mouth the good which they undo by their evil lives, and that they will not be even the least, as it were, in the life that is eternal, but will have no place there at all; after saying, "He shall be called the least in the kingdom of heaven," He immediately added, "For I say unto you, That except your righteousness shall exceed [the righteousness] of the scribes and Pharisees, ye shall not enter into the kingdom of heaven." Such, doubtless-these scribes and Pharisees-are those who sit in Moses' seat, and of whom He says, "Do ye what they say, but do not what they do; for they say, and do not." They teach in sermons what they undo by their morals. It therefore follows that he who is least in the kingdom of heaven, as the Church now exists, shall not enter into the kingdom of heaven, as the Church shall be hereafter; for by teaching what he himself is in the habit of breaking, he can have no place in the company of those who do what they teach, and therefore will not be in the number of great fishes, seeing it is he "who shall do and teach that shall be called great in the kingdom of heaven." And because he will be great here, therefore shall he be there, where he that is least shall not be. Yea, so great will they certainly be there, that he who is less there is greater than the greatest here. And yet those who are great here, that is, who do the good that they teach in that kingdom of heaven into which the net gathereth good and bad, shall be greater still in that eternal state of the heavenly kingdom,-those, I mean, who are indicated by the fishes here as belonging to the right hand and to the resurrection of life. We have still to discourse, as God shall grant us ability, on the meal that the Lord took with those seven disciples, and on the words He spake after the meal, as well as on the close of the Gospel itself; but these are topics that cannot be included in the present lecture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520122.html'
source_title="Tractates on John 122"

[[commentary]]
quote='''
But what the Lord did after His resurrection, signified what is to be to us after our resurrection, in that number of the kingdom of heaven, where shall be no bad man.…Lastly, those seven thousand of whom reply was made to Elias, “I have left me seven thousand men that have not bowed knees before Baal,” far exceed that number of fishes. Therefore the hundred and fifty-three fishes doth not alone express just such a number of saints, but Scripture doth express the whole number of saints and righteous men by so great a number for a particular reason; to wit, in order that in those hundred and fifty-three all may be understood that pertain to the resurrection to eternal life. For the Law hath ten commandments: but the Spirit of Grace, through which alone the Law is fulfilled, is called sevenfold. The number then must be examined, what mean ten and seven: ten in commandments, seven in the grace of the Holy Spirit: by which grace the commandments are fulfilled. Ten then and seven contain all that pertain to the resurrection, to the right hand, to the kingdom of heaven, to life eternal, that is, they that fulfil the Law by the Grace of the Spirit, not as it were by their own work or their own merit. But ten and seven, if thou countest from one unto seventeen, by adding all the numbers by steps, so that to one thou mayest add two, add three, add four, that they may become ten, by adding five that they may become fifteen, by adding six that they may become twenty-one, by adding seven that they may become twenty-eight, by adding eight that they may become thirty-six, by adding nine that they may become forty-five, by adding ten that they may become fifty-five, by adding eleven that they may become sixty-six, by adding twelve that they may become seventy-eight, by adding thirteen that they may become ninety-one, by adding fourteen that they may become one hundred and five, by adding fifteen that they may become one hundred and twenty, by adding sixteen that they may become one hundred and thirty-six, by adding seventeen, make up one hundred and fifty-three, thou wilt find a vast number of all saints to belong to this number of a few fishes. In like manner then as in five virgins, countless virgins; as in five brethren of him that was tormented in hell, thousands of the people of the Jews; as in the number of one hundred and fifty-three fishes, thousands of thousands of saints: so in twelve thrones, not twelve men, but great is the number of the perfect.
'''
