[[commentary]]
quote='''
“Let Thy hand be stretched forth (fiat, be made) to save me, for I have chosen Thy commandments” (ver. 173). That I might not fear, and that not only might my heart hold fast, but my tongue also utter Thy words: “I have chosen Thy commandments,” and have stifled fear with love. Let Thy hand therefore be stretched forth, to save me from another’s hand. Thus God saved the Martyrs, when He permitted them not to be slain in their souls: for “vain is the safety of man” in the flesh. The words, “Let Thy hand be made,” may also be taken to mean Christ the Hand of God…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
