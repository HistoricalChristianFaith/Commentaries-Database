[[commentary]]
quote='''
(Serm. 83. 3.) I am bold to say, that if he shall sin seventy-eight times, thou shouldest forgive him; yea, and if a hundred; and how oft soever he sin against thee, forgive him. For if Christ found a thousand sins, yet forgave them all, do not you withdraw your forgiveness. For the Apostle says, Forgiving one another, if any man hath a quarrel against any, even as God in Christ forgave you. (Col. 3:13.)

(ubi sup.) Yet not without reason did the Lord say, Seventy times seven; for the Law is set forth in ten precepts; and the Law is signified by the number ten, sin by eleven, because it is passing the denary line. Seven is used to be put for a whole, because time goes round in seven days. Take eleven seven times, and you have seventy. He would therefore have all trespasses forgiven, for this is what He signifies by the number seventy-seven.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What then does "seventy times seven" mean? Listen, my friends, to this great mystery, this wonderful gift. When the Lord was baptized, Luke the holy Evangelist there noted down his ancestry, in what order, series and stems that generation had been reached in which Christ was born. Matthew began from Abraham and came as far as Joseph in descending generations. But Luke began to count by going back up in ascending order. Why does the one reckon in a descending and the other in an ascending order? Because Matthew set forth the generations of Christ by which he came down to us, and so he began to reckon when Christ was born from a descending order. Luke begins to reckon in reverse from when Christ was baptized. In this is the beginning of an ascension, for he begins to reckon in an ascending order. Note that in his account he enumerates seventy-seven generations! With whom did he begin his reckoning? Note carefully! He began to reckon from Christ up to Adam himself, who was the first sinner and who parented us into bondage to sin. Luke reckoned up to Adam, and so there are enumerated in toto seventy-seven generations—from Christ up to Adam and from Adam up to Christ. Note seventy-seven! So then if no generation was omitted, there is no exemption of any trespass that ought not to be forgiven. For therefore did he reckon up his seventy-seven generations, which number the Lord mentioned as to the forgiveness of sins; since he begins to reckon from the baptism, where all sins are remitted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252083.html'
source_title="SERMON 83.5"

[[commentary]]
quote='''
The number, also, which Luke follows does most certainly best indicate the taking away of sins. For inasmuch as in Christ, who Himself had no sin, there is assuredly no iniquity allied to the iniquities of men which He bore in His flesh, the number adopted by Matthew makes forty when Christ is excepted. On the contrary, inasmuch as, by clearing us of all sin and purging us, He places us in a right relation to His own and His Father's righteousness (so that the apostle's word is made good: "But he that is joined to the Lord is one spirit"), in the number used by Luke we find included both Christ Himself, with whom the enumeration begins, and God, with whom it closes; and the sum becomes thus seventy-seven, which denotes the thorough remission and abolition of all sins. This perfect removal of sins the Lord Himself also clearly represented under the mystery of this number, when He said that the person sinning ought to be forgiven not only seven times, but even unto seventy times seven.

A careful inquiry will make it plain that it is not without some reason that this latter number is made to refer to the purging of all sins. For the number ten is shown to be, as one may say, the number of justice [righteousness] in the instance of the ten precepts of the law. Moreover, sin is the transgression of the law. And the transgression of the number ten is expressed suitably in the eleven; whence also we find instructions to have been given to the effect that there should be eleven curtains of haircloth constructed in the tabernacle; for who can doubt that the haircloth has a bearing upon the expression of sin? Thus, too, inasmuch as all time in its revolution runs in spaces of days designated by the number seven, we find that when the number eleven is multiplied by the number seven, we are brought with all due propriety to the number seventy-seven as the sign of sin in its totality. In this enumeration, therefore, we come upon the symbol for the full remission of sins, as expiation is made for us by the flesh of our Priest, with whose name the calculation of this number starts here; and as reconciliation is also effected for us with God, with whose name the reckoning of this number is here brought to its conclusion by the Holy Spirit, who appeared in the form of a dove on the occasion of that baptism in connection with which the number in question is mentioned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 4"
