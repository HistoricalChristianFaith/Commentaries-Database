[[commentary]]
quote='''
These things the Lord is understood to have passed through on to the early morning in the high priest's house, to which He was first conducted, and in which Peter was also tempted. With respect, however, to this temptation of Peter, which took place during the time that the Lord was enduring these injuries, the several evangelists do not present the same order in the recital of the circumstances. For Matthew and Mark first narrate the injuries offered to the Lord, and then this temptation of Peter. Luke, again, first describes Peter's temptation, and only after that the reproaches borne by the Lord; while John, on the other hand, first recounts part of Peter's temptation, then introduces some verses recording what the Lord had to bear, next appends a statement to the effect that the Lord was sent away thence (i.e. from Annas) to Caiaphas the high priest, and then at this point resumes and sums up the relation which he had commenced of Peter's temptation in the house to which he was first conducted, giving a full account of that incident, thereafter reverting to the succession of things befalling the Lord, and telling us how He was brought to Caiaphas.

Accordingly, Matthew proceeds as follows: "Now Peter sat without in the palace; and a damsel came unto him, saying, Thou also wast with Jesus of Galilee. But he denied before them all, saying, I know not what thou sayest. And as he went out into the porch, another maid saw him, and said unto them that were there, This fellow was also with Jesus of Nazareth. And again he denied with an oath, I do not know the man. And after a while came unto him they that stood by, and said to Peter, Surely thou also art one of them, for thy speech bewrayeth thee. Then began he to curse and to swear, saying that he knew not the man. And immediately the cock crew." Such is Matthew's version. But we are also given to understand that after he had gone outside, and when he had now denied the Lord once, the first cock crew,—a fact which Matthew does not specify, but which is intimated by Mark.

But it was not when he was outside at the gate that he denied the Lord the second time. That took place after he had come back to the fire-place. There was no need, however, to mention the precise time at which he did thus return. Consequently Mark goes on with his narrative of the incident in these terms: "And he went out into the porch, and the cock crew. And a maid saw him again, and began to say to them that stood by, This is one of them. And he denied it again." This is not the same maid, however, as the former one, but another, as Matthew tells us. Nay, we gather further that on the occasion of the second denial he was addressed by two parties, namely, by the maid who is mentioned by Matthew and Mark, and also by another person who is noticed by Luke. For Luke's account runs in this style: "And Peter followed afar off. And when they had kindled a fire in the midst of the hall, and were sat down together, Peter sat down among them. But a certain maid beheld him as he sat by the fire, and earnestly looked upon him, and said, This man was also with him. And he denied Him, saying, Woman, I know Him not. And after a little while, another saw him, and said, "Thou art also of them." Now the clause, "And after a little while," which Luke introduces, covers the period during which [we may suppose that] Peter went out and the first cock crew. By this time, however, he had come in again; and thus we can understand the consistency of John's narrative, which informs us that he denied the Lord the second time as he stood by the fire. For in his version of Peter's first denial, John not only says nothing about the first crowing of the cock (which holds good of the other evangelists, too, with the exception of Mark), but also leaves unnoticed the fact that it was as he sat by the fire that the maid recognised him. For all that John says there is this, "Then saith the damsel that kept the door unto Peter, Art not thou also one of this man's disciples? He saith, I am not." Then he brings in the statement which he deemed it right to make on the subject of what took place with Jesus in that same house. His record of this is to the following effect: "And the servants and officers stood there, who had made a fire of coals, for it was cold. And they warmed themselves; and Peter stood with them, and warmed himself." Here, therefore, we may suppose Peter to have gone out, and by this time to have come in again. For at first he was sitting by the fire; and after a space, as we gather, he had returned, and commenced to stand [by the hearth].

It may be, however, that some one will say to us: Peter had not actually gone out as yet, but had only risen with the purpose of going out. This may be the allegation of one who is of opinion that the second interrogation and denial took place when Peter was outside at the door. Let us therefore look at what follows in John's narrative. It is to this effect: "The high priest then asked Jesus of His disciples, and of His doctrine. Jesus answered him, I spake openly to the world; I ever taught in the synagogue, and in the temple, whither the Jews always resort; and in secret have I said nothing. Why askest thou me? ask them which heard me what I have said unto them: behold, they know what I said. And when He had thus spoken, one of the officers which stood by struck Jesus with the palm of his hand, saying, Answerest thou the high priest so? Jesus answered him, If I have spoken evil, bear witness of the evil; but if well, why smitest thou me? And Annas sent Him bound to Caiaphas the high priest." This certainly shows us that Annas was high priest. For Jesus had not been sent to Caiaphas as yet, when the question was thus put to Him, "Answerest thou the high priest so?" Mention is also made of Annas and Caiaphas as high priests by Luke at the beginning of his Gospel. After these statements, John reverts to the account which he had previously begun of Peter's denial. Thus he brings us back to the house in which the incidents took place which he has recorded, and from which Jesus was sent away to Caiaphas, to whom He was being conducted at the commencement of this scene, as Matthew has informed us. Moreover, it is in the way of a recapitulation that John records the matters regarding Peter which he has introduced at this point. Falling back upon his narration of that incident with the view of making up a complete account of the threefold denial, he proceeds thus: "And Simon stood and warmed himself. They said therefore unto him, Art not thou also one of his disciples? He denied it, and said, I am not." Here, therefore, we find that Peter's second denial occurred, not when he was at the door, but as he was standing by the fire. This, however, could not have been the case, had he not returned by this time after having gone outside. For it is not that by this second occasion he had actually gone out, and that the other maid who is referred to saw him there outside; but the matter is put as if it was on his going out that she saw him; or, in other words, it was when he rose to go out that she observed him, and said to those who were there,—that is, to those who were gathered by the fire inside, within the court,—"This fellow was also with Jesus of Nazareth." Then we are to suppose that the man who had thus gone outside, on hearing this assertion, came in again, and swore to those who were now inimically disposed, "I do not know the man." In like manner, Mark also says of this same maid, that "she began to say to them that stood by, This is one of them." For this damsel was speaking not to Peter, but to those who had remained there when he went out. At the same time, she spoke in such a manner that he heard her words; whereupon he came back and stood again by the fire, and met their words with a negative. Then we have the statement made by John in these terms: "They said, Art not thou also one of his disciples?" We understand this question to have been addressed to him on his return as he stood there; and we also recognise the harmony in which this stands with the position that on this occasion Peter had to do not only with that other maid who is mentioned by Matthew and Mark in connection with this second denial, but also with that other person who is introduced by Luke. This is the reason why John uses the plural, "They said." The explanation then may be, that when the maid said to those who were with her in the court as he went out, "This is one of them," he heard her words and returned with the purpose of clearing himself, as it were, by a denial. Or, in accordance with the more probable theory, we may suppose that he did not catch what was said about him as he went out, and that on his return the maid and the other person who is introduced by Luke addressed him thus, "Art not thou also one of his disciples?" that he met them with a denial, "and said, I am not;" and further, that when this other person of whom Luke speaks insisted more pertinaciously, and said, "Surely thou art one of them," Peter answered thus, "Man, I am not." Still, when we compare together all the statements made by the several evangelists on this subject, we come clearly to the conclusion, that Peter's second denial took place, not when he was at the door, but when he was within, by the fire in the court. It becomes evident, therefore, that Matthew and Mark, who have told us how he went without, have left the fact of his return unnoticed simply with a view to brevity.
'''
