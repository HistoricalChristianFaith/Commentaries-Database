[[commentary]]
quote='''
We understand, brethren, that a wonderful gentleness shone out pre-eminently in the Lord. They observed that He was very meek, very gentle: for of Him it had been previously foretold, "Gird Thy sword upon Thy thigh, O most Mighty; in Thy splendor and beauty urge on, march on prosperously, and reign, because of truth, and meekness, and righteousness." Accordingly, as a teacher, He brought truth; as a deliverer, He brought gentleness; as a protector, He brought righteousness. That He was to reign on account of these things, the prophet had by the Holy Spirit foretold. When He spoke His truth was acknowledged; when He was not provoked to anger against His enemies, His meekness was praised. Whilst, therefore, in respect of these two,-namely, His truth and meekness,-His enemies were tormented with malice and envy; in respect of the third,-namely, righteousness,-they laid a stumbling-block for Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
