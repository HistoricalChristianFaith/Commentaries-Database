[[commentary]]
quote='''
He next appends the following statement: "And a certain scribe came and said unto Him, Master, I will follow Thee whithersoever thou goest;" and so on, down to the words, "Let the dead bury their dead." We have a narrative in similar terms also in Luke. But he inserts it only after a variety of other matters, and without any explicit note of the order of time, but after the fashion of one only bethinking himself of the incident at that point. He leaves us also uncertain whether he brings it in there as something previously omitted, or as an anticipatory notice of something which in actual fact took place subsequently to those incidents by which it is followed in the history. For he proceeds thus: "And it came to pass, that as they went in the way, a certain man said unto Him, I will follow Thee whithersoever Thou goest." And the Lord's answer is given here in precisely the same terms as we find recited in Matthew. Now, although Matthew tells us that this took place at the time when He gave commandment to depart unto the other side of the lake, and Luke, on the other hand, speaks of an occasion when they "went in the way," there is no necessary contradiction in that. For it may be the case that they went in the way just in order to come to the lake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 23"
