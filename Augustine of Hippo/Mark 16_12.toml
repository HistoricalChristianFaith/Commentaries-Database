[[commentary]]
quote='''
It seems as if some impediment to recognition had been effected in the eyes of those who beheld him; and when it is plainly said elsewhere: "He appeared to them in another shape"—obviously in his own body with another appearance—some effect was produced which acted as an impediment to prevent them, that is, their eyes were subjected to a delay in recognition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149, TO PAULINUS"

[[commentary]]
quote='''
Jesus appeared; he was visible to their eyes, yet he was not recognized. The master walked with them on the way; in fact, he was the way on which they were not yet walking; but he found that they had wandered some distance from the way. For when he was with them before his passion, he had foretold all—that he would suffer, that he would die, that he would rise again on the third day—he had predicted all; but his death was as a loss of memory for them. They were so disturbed when they saw him hanging on the cross that they forgot his teaching, did not look for his resurrection, and failed to keep his promises in mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520235.html'
source_title="SERMON 235.1"

[[commentary]]
quote='''
(Con. Evang. iii. 25) Luke relates the whole story respecting these two, one of whom was Cleophas, but Mark here touches but slightly upon it. That village of which Luke speaks may without absurdity be supposed to be what is here called a farm house, and indeed in some Greek manuscripts it is called the country. But by this name are understood not only villages, but also boroughs and country towns, because they are without the city, which is the head and mother of all the rest. That which Mark expresses by the Lord's appearance in another form, is what Luke means by saying that their eyes were holden that they could not know him. For something was upon their eyes, which was allowed to remain there, until the breaking of bread.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Still, it remains the probable supposition, that, after He was seen of Peter, He appeared next to those two, of whom Cleophas was one, and regarding whom Luke presents us with a complete narrative, while Mark gives us only a very brief notice. The latter evangelist reports the same incident in these concise terms: "And after that He appeared in another form unto two of them, as they walked and went to a country-seat." For it is not unreasonable for us to suppose that the place of residence referred to may also have been styled a country-seat; just as Bethlehem itself, which formerly was called a city, is even at the present time also named a village, although its honour has now been made so much the greater since the name of this Lord, who was born in it, has been proclaimed so extensively throughout the Churches of all nations. In the Greek codices, indeed, the reading which we discover is rather "estate" than "country-seat." But that term was employed not only of residences, but also of free towns and colonies beyond the city, which is the head and mother of the rest, and is therefore called the metropolis.

Again, if Mark tells us that the Lord appeared to these persons in another form, Luke refers to the same when he says that their eyes, were holden, that they should not know Him. For something had come upon their eyes which was suffered to remain until the breaking of the bread, in reference to a well-known mystery, so that only then was the different form in Him made visible to them, and they did not recognise Him, as is shown by Luke's narrative, until the breaking of the bread took place. And thus, in apt accordance with the state of their minds, which were still ignorant of the truth, that it behoved Christ to die and rise again, their eyes sustained something of a similar order; not, indeed, that the truth itself proved misleading, but that they were themselves incompetent to perceive the truth, and thought of the matter as something else than it was. The deeper significance of all which is this, that no one should consider himself to have attained the knowledge of Christ, if he is not a member in His body—that is to say, in His Church—the unity of which is commended to our notice under the sacramental symbol of the bread by an apostle, when he says: "We being many are one bread and one body." So was it that, when He handed to them the bread which He had blessed, their eyes were opened, and they recognised Him, that is to say, their eyes were opened for such knowledge of Him, in so far as the impediment was now removed which had prevented them from recognising Him. For certainly they were not walking with closed eyes. But there was something in them which debarred them from seeing correctly what was in their view,—a state of matters, indeed, which is the familiar result of darkness, or of a certain kind of humour. It is not meant by this, however, that the Lord could not alter the form of His flesh, so that His figure might be literally and actually different, and not the one which they were in the habit of beholding. For, indeed, even before His passion, He was transfigured on the mount so that His countenance "did shine as the sun." And He who made genuine wine out of genuine water can also transform any body whatsoever in all unquestionable reality into any other kind of body which may please Him. But what is meant is, that He had not acted so when He appeared in another form unto those two individuals. For He did not appear to be what He was to these men, because their eyes were holden, so that they should not know Him. Moreover, not unsuitably may we suppose that this impediment in their eyes came from Satan, with the view of precluding their recognition of Jesus. But, nevertheless, permission that it should be so was given by Christ on to the point at which the mystery of the bread was taken up. And thus the lesson might be, that it is when we become participants in the unity of His body, that we are to understand the impediment of the adversary to be removed, and liberty to be given us to know Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
