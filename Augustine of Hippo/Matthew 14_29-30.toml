[[commentary]]
quote='''
(Serm. 76.) For in one Apostle, namely Peter, first and chief in the order of Apostles in whom was figured the Church, both kinds were to be signified; that is, the strong, in his walking upon the waters; the weak, in that he doubted, for to each of us our lusts are as a tempest. Dost thou love God? Thou walkest on the sea; the fear of this world is under thy feet. Dost thou love the world? It swallows thee up. But when thy heart is tossed with desire, then that thou mayest overcome thy lust, call upon the divine person of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
As if in storm and waves he were beginning to sink, like Peter. For he doth trample the waves of this world, that loveth enemies. Christ on the sea was walking fearless, from whose heart there could not by any means be taken away the love of an enemy, who hanging on the Cross did say, “Father, forgive them, for they know not what they do.” Peter too would walk. He as Head, Peter as Body: because, “Upon this rock,” He saith, “I will build My Church.” He was bidden to walk, and he was walking by the Grace of Him bidding, not by his own strength. But when he saw the wind mighty, he feared; and then he began to sink, being troubled in his exercise. By what mighty wind? “By the voice of the enemy, and by the tribulation of the sinner” (ver. 3). Therefore, in the same manner as he cried out on the waves, “Lord, I perish, save me,” a similar voice from this man hath preceded, “Hearken unto me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
