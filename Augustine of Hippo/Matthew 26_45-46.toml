[[commentary]]
quote='''
(de Cons. Ev. iii. 4.) This speech as Matthew has it seems self-contradictory. For how could He say, Sleep on, and take your rest, and immediately continue, Rise, let us be going. This contradiction some have endeavoured to reconcile by supposing the words, Sleep on, and take your rest, to be an ironical rebuke, and not a permission; it might be rightly so taken if need were. But as Mark records it, when He had said, Sleep on, and take your rest, He added, it is enough, and then continued, The hour is come, behold, the Son of man is betrayed into the hands of sinners; (Mark 14:41.) we clearly understand the Lord to have been silent some time after He had said, Sleep on, to allow of their doing so, and then after some interval to have roused them with, Behold, the hour is at hand. And as Mark fills up the sense with, it is enough, that is, ye have had rest enough.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then taking Matthew's record, we get this statement next in order: "He said unto His disciples, Sit ye here, while I go and pray yonder. And He took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy. Then saith He unto them, My soul is exceeding sorrowful, even unto death: tarry ye here, and watch with me. And He went a little farther, and fell on His face, and prayed, saying, O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as Thou wilt. And He cometh unto the disciples, and findeth them asleep, and saith unto Peter, What! could ye not watch with me one hour? Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak. He went away again the second time, and prayed, saying, O my Father, if this cup may not pass away from me except I drink it, Thy will be done. And He came and found them asleep again: for their eyes were heavy. And He left them, and went away again, and prayed the third time, saying the same words. Then cometh He to His disciples, and saith unto them, Sleep on now, and take your rest: behold, the hour is at hand, and the Son of man shall be betrayed into the hands of sinners. Rise, let us be going: behold, he is at hand that shall betray me."

Mark also records these passages, introducing them quite in the same method and succession. Some of the sentences, however, are given with greater brevity by him, and others are somewhat more fully explained. These sayings of our Lord, indeed, may seem in one portion to stand in some manner of contradiction to each other as they are presented in Matthew's version. I refer to the fact that [it is stated there that] He came to His disciples after His third prayer, and said to them, "Sleep on now, and take your rest: behold, the hour is at hand, and the Son of man shall be betrayed into the hands of sinners. Rise, let us be going: behold, he is at hand that shall betray me." For what are we to make of the direction thus given above, "Sleep on now, and take your rest," when there is immediately subjoined this other declaration, "Behold, the hour is at hand," and thereafter also the instruction, "Arise, let us be going "? Those readers who perceive something like a contradiction here, seek to pronounce these words, "Sleep on now, and take your rest," in a way betokening that they were spoken in reproach, and not in permission. And this is an expedient which might quite fairly be adopted were there any necessity for it. Mark, however, has reproduced these sayings in a manner which implies that after He had expressed himself in the terms, "Sleep on now, and take your rest," He added the words, "It is enough," and then appended to these the further statement, "The hour is come; behold, the Son of man shall be betrayed." Hence we may conclude that the case really stood thus: namely, that after addressing these words to them, "Sleep on now, and take your rest," the Lord was silent for a space, so that what He had thus given them permission to do might be [seen to be] really acted upon; and that thereafter He made the other declaration, "Behold, the hour is come." Thus it is that in Mark's Gospel we find those words [regarding the sleeping] followed immediately by the phrase, "It is enough;" that is to say," the rest which you have had is enough now." But as no distinct notice is introduced of this silence on the Lord's part which intervened then, the passage comes to be understood in a forced manner, and it is supposed that a peculiar pronunciation must be given to these words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 4"
