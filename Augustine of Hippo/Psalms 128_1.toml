[[commentary]]
quote='''
Felix the Martyr, truly Felix, i.e. “Happy” both in his name and his crown, whose birthday this is, despised the world. Was he, because he feared the Lord, thence happy, thence blessed, because his wife was as a fruitful vine upon the earth, and his children stood around his table? All these blessings he hath perfectly, but in the Body of Him who is here described; and, because he understood them in this sense, he scorned things present, that he might receive things future. Ye are aware, brethren, that he suffered not the death that other martyrs suffered. For he confessed, and was set aside for torments; on another day his body was discovered lifeless. They had closed the prison to his body, not to his spirit. The executioners found him gone; when they were preparing to torture, they spent their rage for nought. He was lying dead, without sense to them, that he might not be tortured; with sense with God, that he might be crowned. Whence was he also happy, brethren, not only in name, but in the reward of everlasting life, if he loved these things.

“Blessed are all they that fear the Lord, and walk in His ways” (ver. 1). He speaketh to many; but since these many are one in Christ, in the next words he speaketh in the singular: “For thou shalt eat the labours of thy fruits.”…When I speak of Christians in the plural, I understand one in the One Christ. Ye are therefore many, and ye are one; we are many, and we are one. How are we many, and yet one? Because we cling unto Him whose members we are; and since our Head is in heaven, that His members may follow.…Let us therefore so hear this Psalm, as considering it to be spoken of Christ: and all of us who cling unto the Body of Christ, and have been made members of Christ, walk in the ways of the Lord; and let us fear the Lord with a chaste fear, with a fear that abideth for ever.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
