[[commentary]]
quote='''
In the four Gospels, or rather in the four books of the one Gospel, Saint John the apostle, not undeservedly in respect of his spiritual understanding compared to the eagle, has elevated his preaching higher and far more sublimely than the other three; and in this elevating of it he would have our hearts likewise lifted up. For the other three evangelists walked with the Lord on earth as with a man; concerning His divinity they have said but little; but this evangelist, as if he disdained to walk on earth, just as in the very opening of his discourse he thundered on us, soared not only above the earth and above the whole compass of air and sky, but even above the whole army of angels and the whole order of invisible powers, and reached to Him by whom all things were made; saying, "In the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God. All things were made by Him, and without Him was nothing made." To this so great sublimity of his beginning all the rest of his preaching well agrees; and he has spoken concerning the divinity of the Lord as none other has spoken. What he had drank in, the same he gave forth. For it is not without reason that it is recorded of him in this very Gospel, that at supper he reclined on the Lord's bosom. From that breast then he drank in secret; but what he drank in secret he gave forth openly, that there may come to all nations not only the incarnation of the Son of God, and His passion and resurrection, but also what He was before His incarnation, the only Son of the Father, the Word of the Father, coeternal with Him that begat, equal with Him by whom He was sent; but yet in that very sending made less, that the Father might be greater.

Whatever, then, you have heard stated in lowly manner concerning the Lord Jesus Christ, think of that economy by which He assumed flesh; but whatever you hear, or read, stated in the Gospel concerning Him that is sublime and high above all creatures, and divine, and equal and coeternal with the Father, be sure that this which you read appertains to the form of God, not to the form of the servant. For if you hold this rule, you who can understand it (inasmuch as you are not all able to understand it, but you are all bound to trust it),-if, I say, you hold this rule, as men walking in the light, you will fight against the calumnies of heretical darkness without fear. For there have not been wanting those who, in reading the Gospel, followed only those testimonies that concern the humility of Christ, and have been deaf to those which have declared His divinity; deaf for this reason, that they may be full of evil words. There have likewise been some, who, giving heed only to those which speak of the excellency of the Lord, even though they have read of His mercy in becoming man for our sakes, have not believed the testimonies, but accounted them false and invented by men; contending that our Lord Jesus Christ was only God, not also man Some in this way, some in that: both in error. But the catholic faith, holding from both the truths which each holds and preaching the truth which each believes, has both understood that Christ is God and also believed Him to be man: for each is written and each is true. Shouldst thou assert that Christ is only God, thou deniest the medicine whereby thou wast healed: shouldst thou assert that Christ is only man, thou deniest the power whereby thou wast created. Hold therefore both. O faithful soul and catholic heart, hold both, believe both, faithfully confess both. Christ is both God and also man. How is Christ God? Equal with the Father, one with the Father. How is Christ man? Born of a virgin, taking upon Himself mortality from man, but not taking iniquity.

These Jews then saw the man; they neither perceived nor believed Him to be God: and you have already heard how, among all the rest, they said to Him, "Thou bearest witness of thyself; thy witness is not true." You have also heard what He said in reply, as it was read to you yesterday, and according to our ability discussed. To-day have been read these words of His, "Ye judge after the flesh." Therefore it is, saith He, that you say to me, "Thou bearest witness of thyself; thy witness is not true," because you judge after the flesh, because you perceive not God; the man you see, and by persecuting the man, you offend God hidden in Him. "Ye," then, "judge after the flesh." Because I bear witness of myself, I therefore appear to you arrogant. For every man, when he wishes to bear commendatory witness of himself, seems arrogant and proud. Hence it is written, "Let not thy own mouth praise thee, but let thy neighbor's" mouth praise thee. But this was said to man. For we are weak, and we speak to the weak. We can speak the truth, but we can also lie; although we are bound to speak the truth, still we have it in our power to lie when we will. But far be it from us to think that the darkness of falsehood could be found in the splendor of the divine light. He spoke as the light, spoke as the truth; but the light was shining in the darkness, and the darkness comprehended it not: therefore they judged after the flesh. "Ye," saith He, "judge after the flesh."

"I judge not any man." Does not the Lord Jesus Christ, then, judge any man? Is He not the same of whom we confess that He rose again on the third day, ascended into heaven, there sits at the right hand of the Father, and thence shall come to judge the quick and the dead? Is not this our faith of which the apostle says, "With the heart man believeth unto righteousness, and with the mouth confession is made unto salvation?" When, therefore, we confess these things, do we contradict the Lord? We say that He shall come a judge of the quick and the dead, whilst He says Himself, "I judge not any man." This question may be solved in two ways: Either that we may understand this expression, "I judge not any man," to mean, I judge not any man now; in accordance with what He says in another place, "I am not come to judge the world, But to save the world;" not denying His judgment here, but deferring it. Or, otherwise, surely that when He said, "Ye judge after the flesh," He subjoined, "I judge not any man," in such manner that thou shouldst understand "after the flesh" to complete the sense. Therefore let no scruple of doubt remain in our heart against the faith which we hold and declare concerning Christ as judge. Christ is come, but first to save, then to judge: to adjudge to punishment those who would not be saved; to bring them to life who, by believing, did not reject salvation. Accordingly, the first dispensation of our Lord Jesus Christ is medicinal, not judicial; for if He had come to judge first, He would have found none on whom He might bestow the rewards of righteousness. Because, therefore, He saw that all were sinners, and that none was exempt from the death of sin, His mercy had first to be craved, and afterwards His judgment must be executed; for of Him the psalm had sung, "Mercy and judgment will I sing to Thee, O Lord." Now, He says not judgment and mercy," for if judgment had been first, there would be no mercy; but it is mercy first, then judgment. What is the mercy first? The Creator of man deigned to become man; was made what He had made, that the creature He had made might not perish. What can be added to this mercy? And yet He has added thereto. It was not enough for Him to be made man, He added to this that He was rejected of men; it was not enough to be rejected, He was dishonored; it was not enough to be dishonored, He was put to death; but even this was not enough, it was by the death of the cross. For when the apostle was commending to us His obedience even unto death, it was not enough for him to say, "He became obedient unto death;" for it was not unto death of any kind whatever: but he added, "even the death of the cross." Among all kinds of death, there was nothing worse than that death. In short, that wherein one is racked by the most intense pains is called cruciatus, which takes its name from crux, a cross. For the crucified, hanging on the tree, nailed to the wood, were killed by a slow lingering death. To be crucified was not merely to be put to death; for the victim lived long on the cross, not because longer life was chosen, but because death itself was stretched out that the pain might not be too quickly ended. He willed to die for us, yet it is not enough to say this; He deigned to be crucified, became obedient even to the death of the cross. He who was about to take away all death, chose the lowest and worst kind of death: He slew death by the worst of deaths. To the Jews who understood not, it was indeed the worst of deaths, but it was chosen by the Lord. For He was to have that very cross as His sign; that very cross, a trophy, as it were, over the vanquished devil, He was to put on the brow of believers, so that the apostle said, "God forbid that I should glory, save in the cross of our Lord Jesus Christ, by whom the world is crucified to me, and I to the world." Nothing was then more intolerable in the flesh, nothing is now more glorious on the brow. What does He reserve for His faithful one, when He has put such honor on the instrument of His own torture? Now is the cross no longer used among the Romans in the punishment of criminals, for where the cross of the Lord came to be honored, it was thought that even a guilty man would be honored if he should be crucified. Hence, He who came for this cause judged no man: He suffered also the wicked. He suffered unjust judgment, that He might execute righteous judgment. But it was of His mercy that He endured unjust judgment. In short, He became so low as to come to the cross; yea, laid aside His power, but published His mercy. Wherein did He lay aside His power? In that He would not come down from the cross, though He had the power to rise again from the sepulchre. Wherein did He publish His mercy? In that, when hanging on the cross, He said, "Father, forgive them; for they know not what they do." Whether, then, it be that He said, "I judge not any man," because He had come not to judge the world, but to save the world; or, that, as I have mentioned, when He had said, "Ye judge after the flesh," He added, "I judge not any man," for us to understand that Christ judgeth not after the flesh, like as He was judged by men.
'''
