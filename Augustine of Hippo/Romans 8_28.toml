[[commentary]]
quote='''
There is, in the foreknowledge of God, a predetermined limit and number of saints who love God as he has given them to do through the Holy Spirit poured forth in their hearts, and for them everything works together for good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 186"

[[commentary]]
quote='''
He operates, therefore, without us, in order that we may will; but when we will, and so will that we may act, He co-operates with us. We can, however, ourselves do nothing to effect good works of piety without Him either working that we may will, or co-working when we will. Now, concerning His working that we may will, it is said: "It is God which worketh in you, even to will." While of His co-working with us, when we will and act by willing, the apostle says, "We know that in all things there is co-working for good to them that love God." What does this phrase, "all things," mean, but the terrible and cruel sufferings which affect our condition? That burden, indeed, of Christ, which is heavy for our infirmity, becomes light to love. For to such did the Lord say that His burden was light, as Peter was when he suffered for Christ, not as he was when he denied Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 33"
