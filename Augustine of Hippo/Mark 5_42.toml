[[commentary]]
quote='''
Moreover, as to the circumstance that some codices of Matthew's Gospel contain the reading, "For the woman is not dead, but sleepeth," while Mark and Luke certify that she was a damsel of the age of twelve years, we may suppose that Matthew has followed the Hebrew mode of speech here. For in other passages of Scripture, as well as here, it is found that not only those who had already known a man, but all females in general, including untouched virgins, are called women. That is the case, for instance, where it is written of Eve, "He made it into a woman;" and again, in the book of Numbers, where the women who have not known a man by lying with him, that is to say, the virgins, are ordered to be saved from being put to death. Adopting the same phraseology, Paul, too, says of Christ Himself, that He was "made of a woman." And it is better, therefore, to understand the matter according to these analogies, than to suppose that this damsel of twelve years of age was already married, or had known a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 28"
