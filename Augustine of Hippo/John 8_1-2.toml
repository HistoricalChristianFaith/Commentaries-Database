[[commentary]]
quote='''
"Thence Jesus went unto the mount;" namely, to mount "Olivet,"-unto the fruitful mount, unto the mount of ointment, unto the mount of chrism. For where, indeed, but on mount Olivet did it become the Christ to teach? For the name of Christ is from chrism; χρισμα in the Greek, is called in Latin unctio, an anointing. And He has anointed us for this reason, because He has made us wrestlers against the devil. "And early in the morning He came again into the temple, and all the people came unto Him; and He sat down and taught them." And He was not taken, for He did not yet deign to suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
