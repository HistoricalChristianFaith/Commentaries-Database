[[commentary]]
quote='''
“Day continueth according to Thy ordinance” (ver. 91). For all these things are day: “and this is the day which the Lord hath made: let us rejoice and be glad in it:” and “let us walk honestly as in the day.” “For all things serve Thee.” He said all things of some: “all” which belong to this day “serve Thee.” For the ungodly of whom it is said, “I have compared thy mother unto the night,” do not serve Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
