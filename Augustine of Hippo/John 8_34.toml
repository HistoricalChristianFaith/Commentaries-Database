[[commentary]]
quote='''
(Tr. xli. 3) This asseveration is important: it is, if one may say so, His oath. Amen means true, but is not translated. Neither the Greek nor the Latin Translator have dared to translate it. It is a Hebrew word; and men have abstained from translating it, in order to throw a reverential veil over so mysterious a word: not that they wished to lock it up, but only to prevent it from becoming despised by being exposed. How important the word is, you may see from its being repeated. Verily I say unto you, says Verity itself; which could not be, even though it said not verily. Our Lord however has recourse to this mode of enforcing His words, in order to rouse men from their state of sleep and indifference. Whosoever, He saith, committeth sin, whether Jew or Greek, rich or poor, king or beggar, is the servant of sin.

O miserable bondage! The slave of a human master when wearied with the hardness of his tasks, sometimes takes refuge in flight. But whither does the slave of sin flee? He takes it along with him, wherever he goes; for his sin is within him. The pleasure passes away, but the sin does not pass away: its delight goes, its sting remains behind.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But to the Lord's own answer, let us give better and more earnest heed, lest we ourselves be also found bondmen. For "Jesus answered them, Verily, verily, I say unto you, that every one who committeth sin is the servant of sin." He is the servant-would that it were of man, and not of sin! Who will not tremble at such words? The Lord our God grant us, that is, both you and me, that I may speak in fitting terms of this freedom to be sought, and of that bondage to be avoided. "Amen, amen [verily, verily], I say unto you." The Truth speaks: and in what sense does the Lord our God claim it as His to say, "Amen, amen, I say unto you"? His charge is weighty in so announcing it. In some sort, if lawful to be said, His form of swearing is, "Amen, amen, I say unto you." Amen in a way may be interpreted, [It is] true [truly, verily]; and yet it is not interpreted, though it might have been said, What is true [verily] I say unto you. Neither the Greek translator nor the Latin has dared to do so; for this word Amen is neither Greek nor Latin, but Hebrew. So it has remained without interpretation, to possess honor as the covering of something hidden; not in order to be disowned, but that it might not, as a thing laid bare to the eye, fall into disrepute. And yet it is not once, but twice uttered by the Lord, "Amen, amen, I say unto you." And now learn from the very doubling, how much was implied in the charge before us.

What, then, is the charge given? Verily, verily, I say unto you, saith the Truth who surely, though He had not said, Verily, I say, could not possibly lie. Yet [thereby] He impresses, inculcates His charge, arouses in a way the sleeping, makes them attentive, and would not be contemned. What does He say? "Verily, verily, I say unto you, that every one who committeth sin is the servant of sin." Miserable slavery! Men frequently, when they suffer under wicked masters, demand to get themselves sold, not seeking to be without a master, but at all events to change him. What can the servant of sin do? To whom can he make his demand? To whom apply for redress? Of whom require himself to be sold? And then at times a man's slave, worn out by the commands of an unfeeling master, finds rest in flight. Whither can the servant of sin flee? Himself he carries with him wherever he flees. An evil conscience flees not from itself; it has no place to go to; it follows itself. Yea, he cannot withdraw from himself, for the sin he commits is within. He has committed sin to obtain some bodily pleasure. The pleasure passes away; the sin remains. What delighted is gone; the sting has remained behind. Evil bondage! Sometimes men flee to the Church, and we generally permit them, uninstructed as they are-men, wishing to be rid of their master, who are unwilling to be rid of their sins. But sometimes also those subjected to an unlawful and wicked yoke flee for refuge to the Church; for, though free-born men, they are retained in bondage: and an appeal is made to the bishop. And unless he care to put forth every effort to save free-birth from oppression, he is accounted unmerciful. Let us all flee to Christ, and appeal against sin to God as our deliverer. Let us seek to get ourselves sold, that we may be redeemed by His blood. For the Lord says, "Ye were sold for nought, and ye shall be redeemed without money." Without price, that is, of your own; because of mine. So saith the Lord; for He Himself has paid the price, not in money, but His own blood. Otherwise we had remained both bondmen and indigent.

From this bondage, then, we are set free by the Lord alone. He who had it not, Himself delivers us from it; for He alone came without sin in the flesh. For the little ones whom you see carried in their mothers' hands cannot yet walk, and are already in fetters; for they have received from Adam what they are loosened from by Christ. To them also, when baptized, pertains that grace which is promised by the Lord; for He only can deliver from sin who came without sin, and was made a sacrifice for sin. For you heard when the apostle was read: "We are ambassadors," he says, "for Christ, as though God were exhorting you by us; we beseech you in Christ's stead,"-that is, as if Christ were beseeching you, and for what? -"to be reconciled unto God." If the apostle exhorts and beseeches us to be reconciled unto God, then were we enemies to God. For no one is reconciled unless from a state of enmity. And we have become enemies not by nature, but by sin. From the same source are we the servants of sin, that we are the enemies of God. God has no enemies in a state of freedom. They must be slaves; and slaves will they remain unless delivered by Him to whom they wished by their sins to be enemies. Therefore, says be, "We beseech you in Christ's stead to be reconciled unto God." But how are we reconciled, save by the removal of that which separates between us and Himself? For He says by the prophet, "He hath not made the ear heavy that it should not hear; but your iniquities have separated between you and your God." And so, then, we are not reconciled, unless that which is in the midst is taken away, and something else is put in its place. For there is a separating medium, and, on the other hand, there is a reconciling Mediator. The separating medium is sin, the reconciling Mediator is the Lord Jesus Christ: "For there is one God and Mediator between God and men, the man Christ Jesus." To take then away the separating wall, which is sin, that Mediator has come, and the priest has Himself become the sacrifice. And because He was made a sacrifice for sin, offering Himself as a whole burnt-offering on the cross of His passion, the apostle, after saying, "We beseech you in Christ's stead to be reconciled unto God,"-as if we had said, How shall we be able to be reconciled?-goes on to say, "He hath made Him," that is, Christ Himself, "who knew no sin, [to be] sin for us, that we may be the righteousness of God in Him," "Him," he says, Christ Himself our God, "who knew no sin." For He came in the flesh, that is, in the likeness of sinful flesh, but not in Sinful flesh, because He had no sin at all; and therefore became a true sacrifice for sin, because He Himself had no sin.

But perhaps, through some special perception of my own, I have said that sin is a sacrifice for sin. Let those who have read it be free to acknowledge it; let not those who have not read it be backward; let them not, I say, be backward to read, that they may be truthful in judging. For when God gave commandment about the offering of sacrifices for sin, in which sacrifices there was no expiation of sins, but the shadow of things to come, the self-same sacrifices, the self-same offerings, the self-same victims, the self-same animals, which were brought forward to be slain for sins, and in whose blood that [true] blood was prefigured, are themselves called sins by the law; and that to such an extent that in certain passages it is written in these terms, that the priests, when about to sacrifice, were to lay their hands on the head of the sin, that is, on the head of the victim about to be sacrificed for sin. Such sin, then, that is, such a sacrifice for sin, was our Lord Jesus Christ made, "who knew no sin."

With efficacious merit does He deliver from this bondage of sin, who saith in the psalms: "I am become as a man without help, free among the dead." For He only was free, because He had no sin. For He Himself says in the Gospel, "Behold, the prince of this world cometh," meaning the devil about to come in the persons of the persecuting Jews;-"behold," He says, "he cometh, and shall find nothing in me." Not as he found some measure of sin in those whom he also slew as righteous; in me he shall find nothing. And just as if He were asked, If he shall find nothing in Thee, wherefore will he slay Thee? He further said, "But that all may know that I do the will of my Father, rise and let us go hence." I do not, He says, pay the penalty of death as a necessity of my sinfulness; but in the death I die, I do the will of my Father. And in this, I am doing rather than enduring it; for, were I unwilling, I should not have had the suffering to endure. You have Him saying in another place, "I have power to lay down my life, and I have power to take it up again." Here surely is one "free among the dead."
'''
