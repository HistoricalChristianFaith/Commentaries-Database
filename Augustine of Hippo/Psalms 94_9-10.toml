[[commentary]]
quote='''
When, then, that man, so learned in the Scriptures, was commenting on the psalm where it says, "Understand, you senseless among the people; and you fools be wise at last. He who has planted the ear, shall he not hear? or he who has formed the eye, does he not consider?" He said, among other things, "This passage is directed chiefly against the anthropomorphists who say that God has members such as we have. For example, God is said to have eyes: the eyes of the Lord look on all things; the hand of the Lord makes all things; and it says, "Adam heard the footsteps of the Lord walking in paradise." They take these expressions literally, and they attribute our human inadequacies to the magnificence of God. But I say that God is all eye, he is all hand, he is all foot. He is all eye because he sees all things; he is all hand because he effects all things; he is all foot because he is everywhere present. See, then, what it says, "He who has planted the ear, does he not hear?" It does not say, "He who has planted, does he not then have an ear?" and it does not say, "Does he not then have eyes?" What does it say? "He who has planted the ear, shall he not hear? He who has formed the eye, does he not consider?" He brought together the members, he gave the faculties.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 148"

[[commentary]]
quote='''
“He that planted the ear, shall He not hear? or He that made the eye, doth He not consider?” (ver. 9) “or He that instructeth the nations, shall He not reprove?” (ver. 10). This is what God is at present doing: He is instructing the nations: for this reason he sent His word to man throughout the world: He sent it by Angels, by Patriarchs, by Prophets, by servants, through so many heralds going before the Judge. He sent also His own Word Himself, He sent His own Son in Person: He sent the servants of His Son, and in these very servants His own Son. Throughout the world is everywhere preached the word of God. Where is it not said unto men, Abandon your former wickedness, and turn yourselves to right paths? He spareth, that ye may correct yourselves: He punished not yesterday, in order that to-day ye may live well. He teacheth the heathen, shall He not therefore reprove? will He not hear those whom He teacheth? will He not judge those to whom He hath beforehand sent and sown lessons of warning? If thou wast in a school, wouldest thou receive a task, and not repeat it? When therefore thou receivest it from thy master, thou art being taught: the Master giveth thy task into thy hands, and shall He not exact it from thee when thou comest to repeat it? or when thou hast begun to repeat it, shalt thou not be in fear of stripes? At present then we are receiving our work: afterwards we are placed before the Master, that we may give up to Him all our past tasks, that is, that we may give an account of all those things which are now being bestowed upon us. Hear the Apostle’s words: “We must all appear before the judgment-seat of Christ,” etc. “It is He that teacheth man knowledge.” Doth He not know, who maketh thee to know?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
