[[commentary]]
quote='''
“The man of blood, and the crafty man, the Lord will abominate.” What he said above, “Thou hast hated all that work iniquity, Thou wilt destroy all that speak a lie,” may well seem to be repeated here: so that one may refer “the man of blood” to “the worker of iniquity,” and “the crafty man” to the “lie.” For it is craft, when one thing is done, another pretended. He used an apt word too, when he said, “will abominate.” For the disinherited are usually called abominated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
