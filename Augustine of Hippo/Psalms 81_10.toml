[[commentary]]
quote='''
“For I am.” Why wouldest thou adore what is not? “For I am the Lord thy God” (ver. 10). Because “I am I that Am,” and indeed “I Am” He saith, I that Am, over every creature: yet to thee what good have I afforded in time? “Who brought thee out of the land of Egypt.” Not to that people alone is it said. For we all were brought out of the land of Egypt, we have all passed through the Red Sea; our enemies pursuing us have perished in the water. Let us not be ungrateful to our God; let us not forget God that abideth, and fabricate in ourselves a new god. “I, who led thee out of the land of Egypt,” saith God. “Open wide thy mouth, and I will fill it.” Thou sufferest straitness in thyself because of the new god set up in thy heart; break the vain image, cast down from thy conscience the feigned idol: “open wide thy mouth,” in confessing, in loving: “and I will fill it,” because with me is the fountain of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"
