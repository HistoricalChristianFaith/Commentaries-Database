[[commentary]]
quote='''
“Save Thy people, and bless Thine inheritance” (ver. 9). I intercede therefore, after My Flesh hath flourished again, because Thou hast said, “Desire of Me, and I will give Thee the heathen for Thine inheritance;” “Save Thy people, and bless Thine inheritance:” for “all Mine are Thine.” “And rule them, and set them up even for ever.” And rule them in this temporal life, and raise them from hence into life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
