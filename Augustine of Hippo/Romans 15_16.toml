[[commentary]]
quote='''
When he says: That I may be a minister of Christ Jesus among the Gentiles, consecrating the Gospel of God, that the offering of the Gentiles may become acceptable, sanctified in the Holy Spirit, this is understood: that the Gentiles are offered to God, as an acceptable sacrifice, when, believing in Christ, they are sanctified through the Gospel—as he also says above: I beseech you therefore, brethren, by the mercy of God, that you present your bodies a living sacrifice, holy, pleasing to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
