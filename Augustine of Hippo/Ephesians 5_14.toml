[[commentary]]
quote='''
What is said to the dead by the apostle? "Arise, thou that sleepest." But, quoth an objector, he said sleep, not death. Hear what follows: "Arise, thou that sleepest, and come forth from the dead." And as if the sleeper said, Whither shall I go? "And Christ shall give thee light." Christ having enlightened thee, now believing, immediately thou makest a passage from death to life: abide in that to which thou hast passed, and thou shalt not come into judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"


[[commentary]]
quote='''
Endure thou the night, yearn for the morning. Think not because the night hath life, the morning too hath not life. Doth then he that sleepeth live, and he that riseth live not? Is not he that sleepeth more like death? And who are they that sleep? They whom the Apostle Paul rouseth, if they choose but to awake. For to certain he saith, “Awake, thou that sleepest, and arise from the dead, and Christ shall give thee light.” They then that are lightened by Christ watch now, but the fruit of their watchings appeareth not yet: in the morning it shall appear, that is, when doubtful things of this world shall have passed away. For these are very night: for do they not appear to thee like darkness?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"

[[commentary]]
quote='''
But the sleep of the soul is to forget her God. Whatsoever soul shall have forgotten her God, sleepeth. Therefore the Apostle saith to certain persons that forgot their God, and being as it were in sleep, did act the follies of the worship of idols—the Apostle, I say, saith to certain persons, “Rise, thou that sleepest, and rise up from the dead, and Christ shall enlighten thee.” Was the Apostle waking up one sleeping in body? Nay, but he was waking a soul sleeping, inasmuch as he was waking her, in order that she might be lightened by Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
