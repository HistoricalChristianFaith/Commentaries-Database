[[commentary]]
quote='''
“Behold, O God our defender. And look on the face of Thy Christ” (ver. 9). For when doth God not look upon the face of His Christ? What is this, “Look on the face of Thy Christ”? By the face we are known. What is it then, Look on the face of Thy Christ? Cause Thy Christ to become known to all. Look on the face of Thy Christ: let Christ become known to all, that we may be able to go from strength to strength, that grace may abound, since sin hath abounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
