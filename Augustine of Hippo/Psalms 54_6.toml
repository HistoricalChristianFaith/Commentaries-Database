[[commentary]]
quote='''
“Voluntarily I will sacrifice to Thee” (ver. 6). Who can even understand this good thing of the heart, at another’s speaking thereof, unless in himself he hath tasted it? What is, “Voluntarily I will sacrifice to Thee”?… For what sacrifice here shall I take, brethren? or what worthily shall I offer to the Lord for His mercy? Victims shall I seek from flock of sheep, ram shall I select, for any bull in the herds shall I look out, frankincense indeed from the land of the Sabæans shall I bring? What shall I do? What offer; except that whereof He speaketh, “Sacrifice of praise shall honour Me”? Wherefore then “voluntarily”? Because truly I love that which I praise. I praise God, and in the self-same praise I rejoice: in the praise of Himself I rejoice, at whom being praised, I blush not. For He is not praised in the same manner as by those who love the theatrical follies is praised either by a charioteer, or a hunter, or actor of any kind, and by their praisers, other praisers are invited, are exhorted, to shout together: and when all have shouted, ofttimes, if their favourite is overcome, they are all put to the blush. Not so is our God: be He praised with the will, loved with charity: let it be gratuitous (or voluntary) that He is loved and that He is praised. What is “gratuitous”? Himself for the sake of Himself, not for the sake of something else. For if thou praisest God in order that He may give thee something else, no longer freely dost thou love God. Thou wouldest blush, if thy wife for the sake of riches were to love thee, and perchance if poverty should befall thee, should begin to think of adultery. Seeing that therefore thou wouldest be loved by thy partner freely, wilt thou for anything else love God? What reward art thou to receive of God, O covetous man? Not earth for thee, but Himself He keepeth, who made heaven and earth. “Voluntarily I will sacrifice to Thee:” do it not of necessity. For if for the sake of anything else thou praisest God, out of necessity thou praisest.…These things also which He hath given, because of the Giver are good things. For He giveth entirely, He giveth these temporal things: and to certain men to their good, to certain men to their harm, after the height and depth of His judgments.…“Voluntarily I will sacrifice to Thee.” Wherefore “voluntarily”? Because gratis. What is gratis? “And I will confess to Thy name, O Lord, for it is a good thing:” for nothing else, but because a “good thing” it is. Doth he say, “I will confess to Thy name, O Lord,” because Thou givest me fruitful manors, because Thou givest me gold and silver, because Thou givest me extended riches, abundant money, most exalted dignity? Nay. But what? “For it is a good thing.” Nothing I find better than Thy name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"
