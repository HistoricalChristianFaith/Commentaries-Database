[[commentary]]
quote='''
Everyone, even little children, have broken God's covenant, not indeed in virtue of any personal action but in virtue of mankind's common origin in that single ancestor in whom all have sinned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252016.html'
source_title="City of God 16.27"

[[commentary]]
quote='''
If the souls of all men are derived from that one which was breathed into the first man … either the soul of Christ was not derived from that one, since he had no sin of any kind … or, if his soul was derived from that first one, he purified it in taking it for himself, so that he might be born of the virgin and might come to us without any trace of sin, either committed or transmitted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 164"

[[commentary]]
quote='''
As infants cannot help being descended from Adam, so they cannot help being touched by the same sin, unless they are set free from its guilt by the baptism of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 157"

[[commentary]]
quote='''
These words clearly teach that original sin is common to all men, regardless of the personal sins of each one.
'''
source_url=''
source_title="AGAINST JULIAN 6.20.63"

[[commentary]]
quote='''
All men for whom Christ died died in the sin of the first Adam, and all who are baptized into Christ die to sin.
'''
source_url=''
source_title="AGAINST JULIAN 6.7.21"


[[commentary]]
quote='''
For there is no husband that, because he is an husband, is not subject to death, or that is subject to death for any other reason but because of sin. For even the Lord was subject to death, but not on account of sin: He took upon Him our punishment, and so looseth our guilt. With reason then, “In Adam all die, but in Christ shall all be made alive.” For, “Through one man,” saith the Apostle, “sin hath entered into this world, and through sin death, and so hath passed unto all men, in that all have sinned.” Definite is the sentence: “In Adam,” he saith, “all have sinned.” Alone then could such an infant be innocent, as hath not been born of the work of Adam.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"