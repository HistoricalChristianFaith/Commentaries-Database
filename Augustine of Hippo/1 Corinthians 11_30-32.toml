[[commentary]]
quote='''
Let us prove from the Scriptures that judgment is put where punishment is understood; although also in this very passage, a little further on, you will hear the same term judgment put for nothing else than for condemnation and punishment. Yet the apostle says in a certain place, writing to those who abused the body, what the faithful among you know; and because they abused it, they were chastised by the scourge of the Lord. For he says to them, "Many among you are weak and sickly, and deeply sleep." For many therefore even died. And he went on: "For if we judged ourselves, we should not be judged by the Lord;" that is, if we reproved ourselves, we should not be reproved by the Lord. "But when we are judged, we are chastened by the Lord, that we may not be condemned with the world." There are therefore those who are judged here according to punishment, that they may be spared there; there are those who are spared here, that they may be the more abundantly tormented there; and there are those to whom the very punishments are meted out without the scourge of punishment, if they be not corrected by the scourge of God; that, since here they have despised the Father that scourgeth, they may there feel the Judge that punisheth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
