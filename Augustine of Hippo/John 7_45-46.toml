[[commentary]]
quote='''
But they who had been sent to take Him returned clear of the crime and full of admiration. For they even gave witness to His divine doctrine, when those by whom they had been sent asked, "Why have ye not brought him?" They answered that they had never heard a man so speak: "For not any man so speaks." But He spake thus, because He was God and man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
