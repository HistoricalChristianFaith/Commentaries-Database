[[commentary]]
quote='''
Wherefore did he choose?…“Because God loveth mercy and truth” (ver. 12). The Lord loveth mercy, by which He first came to my help: He loveth truth, so as to give to him that believeth what He has promised. Hear in the case of the Apostle Paul, His mercy and truth, Paul who was first Saul the persecutor. He needed mercy, and he has said that it was shown towards him: “I who was before a blasphemer, and a persecutor, and injurious: but I obtained mercy, that in me Christ Jesus might show forth all longsuffering towards those who shall believe in Him unto life eternal.” So that, when Paul received pardon of such great crimes, no one should despair of any sins whatever being forgiven him. Lo! Thou hast Mercy.…Lo, we see that Paul holdeth Him a debtor, having received mercy, demanding truth. The Lord, he says, shall give back in that day. What shall He give thee back, but that which He oweth thee? How oweth He unto thee? What hast thou given Him? “Who hath first given unto Him, and it shall be restored to him again.” The Lord Himself hath made Himself a debtor, not by receiving, but by promising: it is not said unto Him, Restore what Thou hast received: but, Restore what Thou hast promised. He hath shown mercy unto me, he saith, that He might make me innocent: for before I was a blasphemer and injurious: but by His grace I have been made innocent. But He who first showed mercy, can He deny His debt? “He loveth mercy and truth. He will give grace and glory.” What grace, but that of which the same one said: “By the grace of God I am what I am”? What glory, but that of which he said, “There is laid up for me a crown of glory”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
