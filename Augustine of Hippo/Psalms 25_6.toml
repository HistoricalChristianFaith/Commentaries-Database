[[commentary]]
quote='''
“Remember Thy compassions, O Lord” (ver. 6). Remember the works of Thy mercy, O Lord; for men deem of Thee as though Thou hadst forgotten. “And that Thy mercies are from eternity.” And remember this, that Thy mercies are from eternity. For Thou never wast without them, who hast subjected even sinful man to vanity indeed, but in hope; and not deprived him of so many and great consolations of Thy creation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
