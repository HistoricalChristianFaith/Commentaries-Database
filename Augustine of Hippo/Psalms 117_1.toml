[[commentary]]
quote='''
“O praise the Lord, all ye heathen: praise Him, all ye nations” (ver. 1). These are the courts of the Lord’s house, this all His people, this the true Jerusalem. Let those rather listen who have refused to be the children of this city, since they have cut themselves off from the communion of all nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520117.html'
source_title="Exposition on Psalm 117"
