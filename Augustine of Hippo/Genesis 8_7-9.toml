[[commentary]]
quote='''
For some there are who prepare to turn, and yet put it off, and in them crieth out the raven’s voice, “Cras! Cras!” The raven which was sent from the ark, never returned. God seeketh not procrastination in the raven’s voice, but confession in the wailing of the dove. The dove, when sent forth, returned. How long, To-morrow! To-morrow!? Look to thy last morrow: since thou knowest not what is thy last morrow, let it suffice that thou hast lived up to this day a sinner. Thou hast heard, often thou art wont to hear, thou hast heard to-day also; daily thou hearest, and daily thou amendest not.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
