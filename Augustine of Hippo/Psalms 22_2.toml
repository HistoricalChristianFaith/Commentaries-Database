
[[commentary]]
quote='''
“My God, I will cry unto Thee in the daytime, and Thou wilt not hear” (ver. 2). My God, I will cry unto Thee in the prosperous circumstances of this life, that they be not changed; and Thou wilt not hear, because I shall cry unto Thee in the words of my sins. “And in the night-season, and not to my folly.” And so in the adversities of this life will I cry to Thee for prosperity; and in like manner Thou wilt not hear. And this Thou doest not to my folly, but rather that I may have wisdom to know what Thou wouldest have me cry for, not with the words of sins out of longing for life temporal, but with the words of turning to Thee for life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
