[[commentary]]
quote='''
For once the tongues became discordant through pride, and then of one became many tongues. For after the flood certain proud men, as if endeavoring to fortify themselves against God, as if aught were high for God, or aught could give security to pride, raised a tower, apparently that they might not be destroyed by a flood, should there come one thereafter. For they had heard and considered that all iniquity was swept away by a flood; to abstain from iniquity they would not; they sought the height of a tower as a defense against a flood; they built a lofty tower. "God saw their pride, and frustrated their purpose by causing that they should not understand one another's speech, and thus tongues became diverse through pride." If pride caused diversities of tongues, Christ's humility has united these diversities in one. The Church is now bringing together what that tower had sundered. Of one tongue there were made many; marvel not: this was the doing of pride. Of many tongues there is made one; marvel not: this was the doing of charity. For although the sounds of tongues are various, in the heart one God is invoked, one peace preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"
