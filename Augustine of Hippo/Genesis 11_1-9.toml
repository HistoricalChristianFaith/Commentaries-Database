[[commentary]]
quote='''
For once the tongues became discordant through pride, and then of one became many tongues. For after the flood certain proud men, as if endeavoring to fortify themselves against God, as if aught were high for God, or aught could give security to pride, raised a tower, apparently that they might not be destroyed by a flood, should there come one thereafter. For they had heard and considered that all iniquity was swept away by a flood; to abstain from iniquity they would not; they sought the height of a tower as a defense against a flood; they built a lofty tower. "God saw their pride, and frustrated their purpose by causing that they should not understand one another's speech, and thus tongues became diverse through pride." If pride caused diversities of tongues, Christ's humility has united these diversities in one. The Church is now bringing together what that tower had sundered. Of one tongue there were made many; marvel not: this was the doing of pride. Of many tongues there is made one; marvel not: this was the doing of charity. For although the sounds of tongues are various, in the heart one God is invoked, one peace preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"

[[commentary]]
quote='''
Recollect that tower of proud men made after the deluge: what said the proud men? Lest we perish in a deluge, let us make a lofty tower. In pride they were thinking themselves to be fortified, they builded up a lofty tower, and the Lord divided the tongues of them. Then they began not to understand one another; hence arose the beginning of many tongues. For before, one tongue there was: but one tongue for men agreeing was good, one tongue for humble men was good: but when that gathering together did into a union of pride fall headlong, God spared them; even though He divided the tongues, lest by understanding one another they should make a destructive unity. Through proud men, divided were the tongues; through humble Apostles, united were the tongues. Spirit of pride dispersed tongues, Spirit Holy united tongues. For when the Holy Spirit came upon the disciples, with the tongues of all men they spake, by all men they were understood: tongues dispersed, into one were united. Therefore if still they rage and are Gentiles, it is expedient for them divided to have their tongues. They would have one tongue; let them come to the Church; because even among the diversity of tongues of flesh, one is the tongue in faith of heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
