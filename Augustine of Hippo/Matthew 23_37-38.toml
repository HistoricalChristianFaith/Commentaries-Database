
[[commentary]]
quote='''
Let not the enemy lead us astray from the way, that He, who gathers us like chickens under His wings, may foster us: lest we stray from His wings, and the hawk of the air carry us off while yet unfledged. For the Christian ought not to hope in himself: if he hopes to be strong, let him be reared by his mother’s warmth. This is the hen who gathers her young together; whence is the reproach of our Saviour against the unbelieving Jerusalem. “Behold, your house shall be left unto you desolate.” Hence was it said, “Thou hast made his strongholds a terror.” Since then they would not be gathered together under the wings of this hen, and have given as a warning to teach us to dread the unclean spirits that fly in the air, seeking daily what they may devour; let us gather ourselves under the wings of this hen, the divine Wisdom, since she is weakened even unto death of her chickens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
