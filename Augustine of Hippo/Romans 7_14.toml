[[commentary]]
quote='''
When he says: We know that the law is spiritual, but I am carnal, he sufficiently shows that the law cannot be fulfilled except by the spiritual, such as the grace of God makes. For anyone who has become like the law itself easily fulfills what it commands; nor will he be under it but with it—and such is he who is no longer captivated by temporal goods, nor terrified by temporal evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
When he says: I was sold under sin, it must be understood that each one, by sinning, sells his soul to the devil, having received, as it were as a price, the sweetness of temporal pleasure. Hence our Lord too was called Redeemer, because in this way, as has been said, we had been sold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"


[[commentary]]
quote='''
…How man had come into captivity, let us ask the Apostle Paul.…For he saith: “For we know that the Law is spiritual, but I am carnal, sold under sin.” Behold whence we became captives; because we were sold under sin. Who sold us? We ourselves, who consented to the seducer. We could sell ourselves; we could not redeem ourselves. We sold ourselves by consent of sin, we are redeemed in the faith of righteousness. For innocent blood was given for us, that we might be redeemed. Whatsoever blood he shed in persecuting the righteous, what kind of blood did he shed? Righteous men’s blood, indeed, he shed; they were Prophets, righteous men, our fathers, and Martyrs. Whose blood he shed, yet all coming of the offspring of sin. One blood he shed of Him who was not justified, but born righteous: by shedding that blood, he lost those whom he held. For they for whom innocent blood was given were redeemed, and, turned back from their captivity, they sing this Psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
