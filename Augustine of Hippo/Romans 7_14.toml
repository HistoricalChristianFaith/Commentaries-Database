[[commentary]]
quote='''
When he says: We know that the law is spiritual, but I am carnal, he sufficiently shows that the law cannot be fulfilled except by the spiritual, such as the grace of God makes. For anyone who has become like the law itself easily fulfills what it commands; nor will he be under it but with it—and such is he who is no longer captivated by temporal goods, nor terrified by temporal evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
When he says: I was sold under sin, it must be understood that each one, by sinning, sells his soul to the devil, having received, as it were as a price, the sweetness of temporal pleasure. Hence our Lord too was called Redeemer, because in this way, as has been said, we had been sold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
