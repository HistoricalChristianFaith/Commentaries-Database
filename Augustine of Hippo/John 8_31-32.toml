[[commentary]]
quote='''
Of what follows of the previous lesson, and has been read publicly to us to-day from the holy Gospel, I then deferred speaking, because I had already said much, and of that liberty into which the grace of the Saviour calleth us it was needful to treat in no cursory or negligent way. Of this, by the Lord's help, we purpose speaking to you to-day. For those to whom the Lord Jesus Christ was speaking were Jews. in a large measure indeed His enemies, but also in some measure already become, and yet to be, His friends; for some He saw there, as we have already said, who should yet believe after His passion. Looking to these, He had said, "When ye have lifted up the Son of man, then shall ye know that I am [He]." There also were those who, when He so spake. straightway believed. To them He spake what we have heard to-day: "Then said Jesus to those Jews who believed on Him, If ye continue in my word, ye shall be my disciples indeed." By continuing ye shall be so; for as now ye are believers, by so continuing ye shall be beholders. Hence there follows, "And ye shall know the truth." The truth is unchangeable. The truth is bread, which refreshes our minds and fails not; changes the eater, and is not itself changed into the eater. The truth itself is the Word of God, God with God, the only-begotten Son. This Truth was for our sake clothed with flesh, that He might be born of the Virgin Mary, and the prophecy fulfilled, "Truth has sprung from the earth." This Truth then, when speaking to the Jews, lay hid in the flesh. But He lay hid not in order to be denied, but to be deferred [in His manifestation]; to be deferred, in order to suffer in the flesh; and to suffer in the flesh, in order that flesh might be redeemed from sin. And so our Lord Jesus Christ, standing full in sight as regards the infirmity of flesh, but hid as regards the majesty of Godhead, said to those who had believed on Him, when He so spake, "If ye continue in my word, ye shall be my disciples indeed." For he that endureth to the end shall be saved. "And ye shall know the truth," which now is hid from you, and speaks to you. "And the truth shall free you." This word, liberabit [shall free], the Lord hath taken from libertas [freedom]. For liberat [frees, delivers] is properly nothing else but liberum facit [makes free]. As salvat [he saves] is nothing else but salvum facit [he makes safe]; as he heals is nothing else but he makes whole; he enriches is nothing else but he makes rich; so liberat [he frees] is nothing else but liberum facit [he makes free]. This is clearer in the Greek word. For in Latin usage we commonly say that a man is delivered (liberari), in regard not to liberty, but only to safety, just as one is said to be delivered from some infirmity. So is it said customarily, but not properly. But the Lord made such use of this word in saying, "And the truth shall make you free (liberabit)," that in the Greek tongue no one could doubt that He spake of freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
