[[commentary]]
quote='''
Let us see, then, the answer made by the Truth: "My Father worketh hitherto, and I work." Is it false, then, which the Scripture has said, that "God rested from all His works on the seventh day"? And does the Lord Jesus speak contrary to this Scripture ministered by Moses, whilst He Himself says to the Jews, "If ye believed Moses, ye would believe me; for He wrote of me"? See, then, whether Moses did not mean it to be significant of something that "God rested on the seventh day." For God had not become wearied in doing the work of His own creation, and needed rest as a man. How can He have been wearied, who made by a word? Yet is both that true, that "God rested from His works on the seventh day;" and this also is true that Jesus saith, "My Father worketh hitherto." But who can unfold it in words, man to men, weak to weak, unlearned to them that seek to learn; and if he chance to understand somewhat, unable to bring it forth and unfold it to men, who with difficulty, it may be, receive it, even if what is received can possibly be unfolded? Who, I say, my brethren, can unfold in words how God both works while at rest, and rests while working? I pray you to put this matter off while you are advancing on the way; for this seeing requires the temple of God, requires the holy place. Bear your neighbor, and walk. Ye shall see Him in that place where ye shall not require the words of men.

Perhaps we can more appropriately say this, that in the saying, "God rested on the seventh day," he signified by a great mystery the Lord and our Saviour Jesus Christ Himself, who spoke and said, "My Father worketh hitherto, and I work." For the Lord Jesus is, of course, God. For He is the Word of God, and you have heard that "in the beginning was the Word;" and not any word whatsoever, but "the Word was God, and all things were made by Him." He was perhaps signified as about to rest on the seventh day from all His works. For, read the Gospel, and see what great works Jesus wrought. He wrought our salvation on the cross, that all things foretold by the prophets might be fulfilled in Him. He was crowned with thorns; He hung on the tree; said, "I thirst," received vinegar on a sponge, that it might be fulfilled which was said, "And in my thirst they gave me vinegar to drink." And when all His works were completed, on the sixth day of the week, He bowed His head and gave up the ghost, and on the Sabbath-day He rested in the tomb from all His works. Therefore it is as if He said to the Jews, "Why do ye expect that I should not work on the Sabbath? The Sabbath-day was ordained for you for a sign of me. You observe the works of God: I was there when they were made, by me were they all made; I know them. `My Father worketh hitherto.' The Father made the light, but He spoke that there should be light; if He spoke, it was by His Word He made it: His Word I was, I am; by me was the world made in those works, by me the world is ruled in these works. My Father worked when He made the world, and hitherto now worketh while He rules the world: therefore by me He made when He made, and by me He rules while He rules." This He said, but to whom? To men deaf, blind, lame, impotent, not acknowledging the physician, and as if in a frenzy they had lost their wits, wishing to slay Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"

[[commentary]]
quote='''
For they, taking the observance of the Sabbath in a carnal sense, fancied that God had, as it were, slept after the labor of framing the world even to this day; and that therefore He had sanctified that day, from which He began to rest as from labor. Now, to our fathers of old there was ordained a sacrament of the Sabbath, which we Christians observe spiritually, in abstaining from every servile work, that is, from every sin (for the Lord saith, "Every one that committeth sin is the servant of sin"), and in having rest in our heart, that is, spiritual tranquillity. And although in this life we strive after this rest yet not until we have departed this life shall we attain to that perfect rest. But the reason why God is said to have rested is, that He made no creature after all was finished. Moreover, the Scripture called it rest, to admonish us that after good works we shall rest. For thus we have it written in Genesis, "And God made all things very good, and God rested on the seventh day," in order that thou, O man, considering that God Himself is said to have rested after good works, shouldest not expect rest for thyself, until after thou hast wrought good works; and even as God after He made man in His own image and likeness, and in him finished all His works very good, rested on the seventh day, so mayest thou also not expect rest to thyself, except thou return to that likeness in which thou wast made, which likeness thou hast lost by sinning. For, in reality, God cannot be said to have toiled, who "said, and they were done." Who is there that, after such facility of work, desires to rest as if after labor? If He commanded and some one resisted Him, if He commanded and it was not done, and labored that it might be done, then justly He should be said to have rested after labor. But when in that same book of Genesis we read, "God said, Let there be light, and there was light; God said, Let there be a firmament, and the firmament was made, and all the rest were made immediately at His word: to which also the psalm testifies, saying, "He spake, and they were made; He commanded, and they were created," -how could He require rest after the world was made, as if to enjoy leisure after toil, He who in commanding never toiled? Consequently these sayings are mystical, and are laid down in this wise that we may be looking for rest after this life, provided we have done good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252020.html'
source_title="Tractates on John 20"

[[commentary]]
quote='''
Remembering then what God did through all those days, when He made and ordained all things, from the first up to the sixth day (for the seventh He sanctified, because He rested on that day after all the works, which He made very good), we find that He created on the sixth day (which day is here mentioned, in that he saith, “before the Sabbath”) all animals on the earth; lastly, He on that very day created man in His own likeness and image. For these days were not without reason ordained in such order, but for that ages also were to run in a like course, before we rest in God. But then we rest if we do good works. As a type of this, it is written of God, “God rested on the seventh day,” when He had made all His works very good. For He was not wearied, so as to need rest, nor hath He now left off to work, for our Lord Christ saith openly, “My Father worketh hitherto.” For He saith this unto the Jews, who thought carnally of God, and understood not that God worketh in quiet, and always worketh, and is always in quiet. We also, then, whom God willed then to figure in Himself, shall have rest after all good works.…And because these good works are doomed to pass away, that sixth day also, when those very good works are perfected, hath an evening; but in the Sabbath we find no evening, because our rest shall have no end: for evening is put for end. As therefore God made man in His own image on the sixth day: thus we find that our Lord Jesus Christ came into the sixth age, that man might be formed anew after the image of God. For the first period, as the first day, was from Adam until Noah: the second, as the second day, from Noah unto Abraham: the third, as the third day, from Abraham unto David: the fourth, as the fourth day, from David unto the removal to Babylon: the fifth period, as the fifth day, from the removal to Babylon unto the preaching of John. The sixth day beginneth from the preaching of John, and lasteth unto the end: and after the end of the sixth day, we reach our rest. The sixth day, therefore, is even now passing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
