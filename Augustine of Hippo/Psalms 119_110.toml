[[commentary]]
quote='''
“The ungodly,” he saith, “have laid a snare for me: but yet I swerved not from Thy commandments” (ver. 110). Whence this, unless because his soul is in the hands of God, or in his own hands is offered to God to be quickened?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
