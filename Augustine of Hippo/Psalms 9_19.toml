[[commentary]]
quote='''
“Arise, O Lord, let not man prevail” (ver. 19). The future judgment is prayed for: but before it come, “Let the heathen,” saith he, “be judged in Thy sight:” that is, in secret; which is called in God’s sight, with the knowledge of a few holy and righteous ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25209.html'
source_title="Exposition on Psalm 9"
