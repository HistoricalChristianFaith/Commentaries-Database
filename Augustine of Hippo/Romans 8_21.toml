[[commentary]]
quote='''
And therefore: On account of him, he says, who subjected it in hope, because the creature itself also shall be freed from the servitude of destruction into the liberty of the glory of the sons of God—that is, even that which is only creature, not yet gathered by faith into the number of the sons of God; yet in those who were going to believe the Apostle saw what he says: that the creature shall be freed from the servitude of destruction, so that it may not serve destruction, which all sinners serve. For to the sinner it was said: You shall die the death. But it shall be freed into the liberty of the glory of the sons of God—that is, so that it too may attain to the liberty of the glory of the sons of God through faith; and when this faith was not in it, it was called only creature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
