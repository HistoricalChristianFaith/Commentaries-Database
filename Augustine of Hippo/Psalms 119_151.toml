[[commentary]]
quote='''
Lastly, it followeth, “Thou art nigh at hand, O Lord, and all Thy ways are truth” (ver. 151). Even in their troubles, it hath been a wonted confession of the saints, to ascribe truth unto God, because they suffer them not undeservedly. So did Queen Esther, so did holy Daniel, so did the three men in the furnace, so do other associates in their sanctity confess. But it may be asked, in what sense it is here said, “All Thy ways are truth;” since in another Psalm it is read, “All the ways of the Lord are mercy and truth.” But towards the saints, All the ways of the Lord are at once mercy and truth: since He aideth them even in judgment, and thus mercy is not wanting; and in having mercy upon them, He performeth that which He hath promised, so that truth is not wanting. But towards all, both those whom He freeth, and those whom He condemneth, all the ways of the Lord are mercy and truth; because where He doth not show mercy, the truth of His vengeance is displayed. For He freeth many who have not deserved, but He condemneth none who hath not deserved it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
