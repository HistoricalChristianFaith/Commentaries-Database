[[commentary]]
quote='''
“Glory and riches shall be in his house” (ver. 3). For his house is his heart; where, with the praise of God, he liveth in greater riches with the hope of eternal life, than with men flattering, in palaces of marble, with splendidly adorned ceilings, with the fear of everlasting death. “For his righteousness endureth for ever:” this is his glory, there are his riches. While the other’s purple, and fine linen, and grand banquets, even when present, are passing away; and when they have come to an end, the burning tongue shall cry out, longing for a drop of water from the finger’s end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
