[[commentary]]
quote='''
As the Prophet testifieth, “The poor man cried, and the Lord heard him” (ver. 6). He teacheth thee how thou mayest be heard. Therefore art thou not heard, because thou art rich. Lest haply thou say, thou criedst and wast not heard, hear wherefore; “The poor man cried, and the Lord heard him.” As poor cry thou, and the Lord heareth. And how shall I cry as poor? By not, if thou hast aught, presuming therefrom upon thy own strength: by understanding that thou art needy; by understanding that so long art thou poor, as thou hast not Him who maketh thee rich. But how did the Lord hear him? “And saved him out of all his troubles.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
