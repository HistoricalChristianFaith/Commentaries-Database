[[commentary]]
quote='''
For what followeth? “They will be captious against the soul of the righteous” (ver. 21). Why will they be captious? Because they can find no true ground of accusation. For how were they captious against our Lord? They made up false accusations, because they could not find true ones. “And will condemn the innocent blood.” Why all this taketh place, he will show in the sequel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
