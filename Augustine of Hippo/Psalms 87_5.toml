[[commentary]]
quote='''
Therefore let the Prophet have honor among us, because He had no honor in His own country. He had no honor in His country, wherein He was formed; let Him have honor in the country which He has formed. For in that country was He, the Maker of all, made as to the form of a servant. For that city in which He was made, that Zion, that nation of the Jews He Himself made when He was with the Father as the Word of God: for "all things were made by Him, and without Him was nothing made." Of that man we have to-day heard it said: "One Mediator of God and men, the man Christ Jesus." The Psalms also foretold, saying, "My mother is Sion, shall a man say." A certain man, the Mediator man between God and men, says, "My mother Sion." Why says, "My mother is Sion"? Because from it He took flesh, from it was the Virgin Mary, of whose womb He took upon Him the form of a servant; in which He deigned to appear most humble. "My mother is Sion," saith a man; and this man, who says, "My mother is Sion," was made in her, became man in her. For He was God before her, and became man in her. He who was made man in her, "Himself did found her; the Most High was made man in her most low." Because "the Word was made flesh, and dwelt among us." "He Himself, the Most High, founded her." Now, because He founded this country, here let Him have honor. The country in which He was born rejected Him; let that country receive Him which He regenerated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252016.html'
source_title="Tractates on John 16"
