[[commentary]]
quote='''
You ask what is meant by these words in Psalm 67 [LXX]: "But God shall break the heads of his enemies: the hairy crown of them that walk on in their sins." It seems to me it means simply that God will break the heads of his enemies who are too overwhelming, who rise too high in their sins. By a certain hyperbole he describes pride as rising so high and rushing along with such eagerness that it is like striding and running over the hair of the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149"

[[commentary]]
quote='''
“Nevertheless, God shall break in pieces the heads of His enemies, the scalp of hair of men walking on in their transgressions” (ver. 21): that is, too much exalting themselves, being too proud in their transgressions: wherein at least they ought to be humble, saying, “O Lord, be Thou merciful to me a sinner.” But He shall break in pieces their heads: for he that exalteth himself shall be humbled. And thus though even of the Lord be the outgoing of death: nevertheless the same Lord, because He was God, and died after the flesh of His own will, not of necessity, “shall break in pieces the heads of His enemies:” not only of those who mocked and crucified Him, and wagged their heads, and said, “If Son of God He is, let Him come down from the Cross;” but also of all men lifting up themselves against His doctrine, and deriding His death as though it were of a man. For that very same One of whom hath been said, “Others He saved, Himself He cannot save,” is the “God of our healths,” and is the “God of saving men:” but for an example of humility and of patience, and to efface the handwriting of our sins, He even willed that the outgoing of death should be His own, that we might not fear that death, but rather this from which He hath delivered us through that. Nevertheless, though mocked and dead, “He shall break in pieces the heads of His enemies,” of whom He saith, “Raise Thou me up, and I shall render to them:” whether it be good things for evil things, while to Himself He subdueth the heads of them believing, or whether just things for unjust things, while He punisheth the heads of them proud. For in either way are shattered and broken the heads of enemies, when from pride they are thrown down, whether by humility being amended, or whether unto the lowest depths of hell being hurled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
