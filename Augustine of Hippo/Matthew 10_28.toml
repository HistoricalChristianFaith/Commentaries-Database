[[commentary]]
quote='''
The gospel is life. Impiety and infidelity are the death of the soul. So then, if the soul can die, how then is it yet immortal? Because there is always a dimension of life in the soul that can never be extinguished. And how does it die? Not in ceasing to be life but by losing its proper life. For the soul is both life to something else, and it has it own proper life. Consider the order of the creatures. The soul is the life of the body. God is the life of the soul. As the life that is the soul is present with the body, that the body may not die, so the life of the soul (God) ought to be with the soul that it may not die.How does the body die? By the departure of the soul. I say, by the departure of the soul the body dies, and it lies there as a mere carcass, what was a little before a lively, not a contemptible, object. There are in it still its several members, the eyes and ears. But these are merely the windows of the house; its inhabitant is gone. Those who bewail the dead cry in vain at the windows of the house. There is no one there within it to hear.… Why is the body dead? Because the soul, its life, is gone. But at what point is the soul itself dead? When God, its life, has forsaken it.… This then we can know and hold for certain: the body is dead without the soul, and the soul is dead without God. Every one without God has a dead soul. You who bewail the dead rather should bewail sin. Bewail ungodliness. Bewail disbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252065.html'
source_title="SERMON 65.5-7"

[[commentary]]
quote='''
(De Civ. Dei, xiii. 2.) This cannot be before the soul is so joined to the body, that nothing may sever them. Yet it is rightly called the death of the soul, because it does not live of God; and the death of the body, because though man does not cease to feel, yet because this his feeling has neither pleasure, nor health, but is a pain and a punishment, it is better named death than life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Word is not mortal, His soul is not mortal. If even thine dieth not, could the Lord's be subject to death?

How can I know, thou wilt say, that mine dieth not? Slay it not thyself, and it cannot die. How, thou asketh, can I slay my soul? To say nothing. meanwhile of other sins, "The mouth that lieth, slayeth the soul." How, thou sayest, can I be sure that it dieth not? Listen to the Lord Himself giving security to His servant: "Be not afraid of them that kill the body, and after that have no more that they can do." But what in the plainest terms does He say? "Fear Him who hath power to slay both soul and body in hell." Here you have the fact that it dieth, and that it doth not die. What is its dying? What is dying to thy flesh? Dying, to thy flesh, is the losing of its life: dying to thy soul, is the losing of its life. The life of thy flesh is thy soul: the life of thy soul is thy God. As the flesh dies in losing the soul, which is its life, so the soul dieth in losing God, who is its life. Of a certainty, then, the soul is immortal. Manifestly immortal, for it liveth even when dead. For what the apostle said of the luxurious widow, may also be said of the soul if it has lost its God, "she is dead while she liveth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"

[[commentary]]
quote='''
Say we, therefore, ourselves also: “Hearken, O God, to my prayer, while I am troubled; from fear of the enemy deliver my soul” (ver. 1). Enemies have raged against the Martyrs: for what was that voice of Christ’s Body praying? For this it was praying, to be delivered from enemies, and that enemies might not have power to slay them. Were they not therefore hearkened to, because they were slain; and hath God forsaken His servants of a contrite heart, and despised men hoping in Him? Far be it. For “who hath called upon God, and hath been forsaken; who hath hoped in Him, and hath been deserted by Him?” They were hearkened to therefore, and they were slain; and yet from enemies they were delivered. Others being afraid gave consent, and lived, and yet the same by enemies were swallowed up. The slain were delivered, the living were swallowed up. Thence is also that voice of thanksgiving, “Perchance alive they would have swallowed us up.”…Therefore for this prayeth the voice of the Martyrs, “From fear of the enemy deliver Thou my soul:” not so that the enemy may not slay me, but that I may not fear an enemy slaying. For that to be fulfilled in the Psalm the servant prayeth, which but now in the Gospel the Lord was commanding. What but now was the Lord commanding? “Fear not them that kill the body, but the soul are not able to kill; but Him rather fear ye, that hath power to kill both body and soul in the hell of fire.” And He repeated, “Yea, I say unto you, fear Him.” Who are they that kill the body? Enemies. What was the Lord commanding? That they should not be feared. Be prayer offered, therefore, that He may grant what He hath commanded. “From fear of the enemy deliver my soul.” Deliver me from fear of the enemy, and make me submit to the fear of Thee. I would not fear him that killeth the body, but I would fear Him that hath power to kill both body and soul in the hell of fire. For not from fear would I be free: but from fear of the enemy being free, under fear of the Lord a servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"

[[commentary]]
quote='''
Hear Him preserving the souls of His servants, and saying, “Fear not them which kill the body, but are not able to kill the soul.” He who hath most power against thee, slayeth the body. What hath he done unto thee? What he also did to the Lord thy God. Why lovest thou to have what Christ hath, if thou fearest to suffer what Christ did? He came to bear thy life, temporal, weak, subject unto death. Surely fear to die, if thou canst avoid dying. What thou canst not avoid through thy nature, why dost thou not undergo by faith? Let the adversary who threateneth take away from thee that life, God giveth thee another life: for He gave thee this life also, and without His will even this shall not be taken from thee; but if it be His will that it be taken from thee, He hath a life to give thee in exchange; fear not to be robbed for His sake. Art thou unwilling to put off a patched garment? He will give thee a robe of glory. What robe dost thou tell me of? “This corruptible must put on incorruption, and this mortal must put on immortality.” This very flesh of thine shall not perish. Thine enemy can rage as far as to thy death: he hath not power beyond, either over thy soul, or even over thy flesh; for although he scatter thy flesh about, he hindereth not the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
