[[commentary]]
quote='''
We have already, beloved, as the Lord was pleased to enable us, expounded to you those words of the Gospel, where the Lord, in washing His disciples' feet, says, "He that is once washed needeth not save to wash his feet, but is clean every whit." Let us now look at what follows. "And ye," He says, "are clean, but not all." And to remove the need of inquiry on our part, the evangelist has himself explained its meaning, by adding: "For He knew who it was that should betray Him; therefore said He, Ye are not all clean." Can anything be clearer? Let us therefore pass to what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252058.html'
source_title="Tractates on John 58"
