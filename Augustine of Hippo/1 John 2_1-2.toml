[[commentary]]
quote='''
And if he sometimes wounds us, we have the remedy at hand. For as the combatants are told, "These things I write unto you, that ye sin not:" so those who are wounded have the sequel to listen to, "And if any man sin, we have an Advocate with the Father, Jesus Christ, the righteous; and He is the propitiation for our sins."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"
