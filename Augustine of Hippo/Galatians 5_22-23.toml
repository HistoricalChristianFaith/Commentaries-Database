[[commentary]]
quote='''
In the same way also the Apostle Paul, when wishing to commend the fruit of the Spirit in opposition to the deeds of the flesh, posited this as his principle, saying, "The fruit of the Spirit is love;" and then, as if springing from and bound up in this principle, he wove the others together, which are "joy, peace, long-suffering, kindness, goodness, faith, meekness, temperance." For who can truly rejoice who loves not good as the source of his joy? Who can have true peace, if he have it not with one whom he truly loves? Who can be long-enduring through persevering continuance in good, save through fervent love? Who can be kind, if he love not the person he is aiding? Who can be good, if he is not made so by loving? Who can be sound in the faith, without that faith which worketh by love? Whose meekness can be beneficial in character, if not regulated by love? And who will abstain from that which is debasing, if he love not that which dignifies? Appropriately, therefore, does the good Master so frequently commend love, as the only thing needing to be commended, without which all other good things can be of no avail, and which cannot be possessed without bringing with it those other good things that make a man truly good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252087.html'
source_title="Tractates on John 87"
