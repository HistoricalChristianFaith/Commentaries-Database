[[commentary]]
quote='''
For if the apostle has said of us, "According as He hath chosen us in Him before the foundation of the world," why should it be thought incongruous with the truth, if the Father glorified our Head at the same time as; He chose us in Him to be His members? For we were chosen in the same way as He was glorified; inasmuch as before the world was, neither we nor the Mediator between God and men, the man Christ Jesus, were yet in existence. But He who, in as far as He is His Word, of His own self "made even those things which are yet to come," and "calleth those things which are not as though they were," certainly, in respect of His manhood as Mediator between God and men, was Himself glorified on our behalf by God the Father before the foundation of the world, if it be so that we also were then chosen in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520105.html'
source_title="Tractates on John 105"
