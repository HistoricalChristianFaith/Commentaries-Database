[[commentary]]
quote='''
Here we must take care not to let John underlie the appearance not only of standing in antagonism to Luke, who had stated before this, that Satan entered into the heart of Judas at the time when he made his bargain with the Jews to betray Him on receipt of a sum of money, but also of contradicting himself. For, at an earlier point, and previous to [his notice of] the receiving of this sop, he had made use of these terms: "And supper being ended, the devil having now put into the heart of Judas to betray Him." And how does he enter into the heart, but by putting unrighteous persuasions into the thoughts of unrighteous men? The explanation, however, is this. We ought to suppose Judas to have been more fully taken possession of by the devil now, just as on the other hand, in the instance of the good, those who had already received the Holy Spirit on that occasion, subsequently to His resurrection, when He breathed upon them and said, "Receive ye the Holy Ghost," also obtained a fuller gift of that Spirit at a later time, namely, when He was sent down from above on the day of Pentecost. In like manner, Satan then entered into this man after the sop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 1"
