[[commentary]]
quote='''
“For the King hopeth in the Lord.” For the King is not proud, but humble in heart, he hopeth in the Lord. “And in the mercy of the Most Highest He shall not be moved” (ver. 7). And in the mercy of the Most Highest His obedience even unto the death of the Cross shall not disturb His humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
