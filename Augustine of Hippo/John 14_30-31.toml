[[commentary]]
quote='''
For alone among men could truly say the God-Man, “If ye have found in Me sin, say.” But perchance there was what escaped men, and they found not what was really there, but was not manifest. In another place He saith, “Behold there cometh the Prince of the world,” being an acute observer of all sins; “Behold,” He saith, “there cometh the Prince of this world,” with death afflicting sinners, presiding over death: for, “By the malice of the devil death came into the world.” “Behold,” He saith, “there cometh the Prince of the world:”—He said these words close upon His Passion:—“and in Me he shall find nothing,” nothing of sin, nothing worthy of death, nothing worthy of condemnation. And as if it were said to Him, Why then dost Thou die? He continueth and saith, “But that all men may know that I do the will of My Father; arise, let us go hence.” I suffer, He saith, undeserving, for men deserving, in order that them I may make deserving of My Life, for whom I undeservedly suffer their death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"