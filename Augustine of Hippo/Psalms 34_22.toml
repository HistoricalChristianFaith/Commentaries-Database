[[commentary]]
quote='''
“For the Lord redeemeth the souls of His servants.” But according to the soul is death to be understood either the worst or best, not according to bodily either dishonour, or honours which men see. “And none of them which trust in Him shall perish” (ver. 22); this is the manner of human righteousness, that mortal life, however advanced, because without sin it cannot be, in this perisheth not, while it trusteth in Him, in whom is remission of sins. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
