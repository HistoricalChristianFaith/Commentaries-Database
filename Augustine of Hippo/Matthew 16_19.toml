[[commentary]]
quote='''
Why, then, did He not say, thou wilt have, but, ye will have? Because Judas is not here a unit. One wicked man represents the whole body of the wicked; in the same way as Peter, the whole body of the good, yea, the body of the Church, but in respect to the good. For if in Peter's case there were no sacramental symbol of the Church, the Lord would not have said to him, "I will give unto thee the keys of the kingdom of heaven: whatsoever thou shalt loose on earth shall be loosed in heaven; and whatsoever thou shalt bind on earth shall be bound in heaven." If this was said only to Peter, it gives no ground of action to the Church. But if such is the case also in the Church, that what is bound on earth is bound in heaven, and what is loosed on earth is loosed in heaven,-for when the Church excommunicates, the excommunicated person is bound in heaven; when one is reconciled by the Church, the person so reconciled is loosed in heaven:-if such, then, is the case in the Church, Peter, in receiving the keys, represented the holy Church. If, then, in the person of Peter were represented the good in the Church, and in Judas' person were represented the bad in the Church, then to these latter was it said, "But me ye will not have always."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"

[[commentary]]
quote='''
The same Matthew then proceeds with his narrative in the following terms: "In that hour came the disciples unto Jesus, saying, Who, thinkest Thou, is the greater in the kingdom of heaven? And Jesus called a little child unto Him, and set him in the midst of them, and said, Verily I say unto you, Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven;" and so on, down to the words, "So likewise shall my heavenly Father do also unto you, if ye from your hearts forgive not every one his brother their trespasses." Of this somewhat lengthened discourse which was spoken by the Lord, Mark, instead of giving the whole, has presented only certain portions, in dealing with which he follows meantime the same order. He has also introduced some matters which Matthew does not mention. Moreover, in this complete discourse, so far as we have taken it under consideration, the only interruption is that which is made by Peter, when he inquires how often a brother ought to be forgiven. The Lord, however, was speaking in a strain which makes it quite clear that even the question which Peter thus proposed, and the answer which was returned to him, belong really to the same address. Luke, again, records none of these things in the order here observed, with the exception of the incident with the little child whom He set before His disciples, for their imitation when they were thinking of their own greatness. For if he has also narrated some other matters of a tenor resembling those which are inserted in this discourse, these are sayings which he has recalled for notice in other connections, and on occasions different from the present: just as John introduces the Lord's words on the subject of the forgiveness of sins,—namely, those to the effect that they should be remitted to him to whom the apostles remitted them, and that they should be retained to him to whom they retained them, as spoken by the Lord after His resurrection; while Matthew mentions that in the discourse now under notice the Lord made this declaration, which, however, the self-same evangelist at the same time affirms to have been given on a previous occasion to Peter. Therefore, to preclude the necessity of having always to inculcate the same rule, we ought to bear in mind the fact that Jesus uttered the same word repeatedly, and in a number of different places,—a principle which we have pressed so often upon your attention already; and this consideration should save us from feeling any perplexity, even although the order of the sayings may be thought to create some difficulty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 61"
