[[commentary]]
quote='''
“And I shall be undefiled with Him, and I shall keep Myself from Mine iniquity” (ver. 23).

“And the Lord shall reward Me according to My righteousness (ver. 24). Accordingly not only for the breadth of faith, which worketh by love; but also for the length of perseverance, will the Lord reward Me according to My righteousness. “And according to the cleanness of My hands in the sight of His eyes.” Not as men see, but “in the sight of His eyes.” For “the things that are seen are temporal; but the things that are not seen are eternal:” whereto the height of hope appertains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
