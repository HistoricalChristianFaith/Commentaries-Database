[[commentary]]
quote='''
What then? is the whole of that people condemned? far be it. It is called the good olive-tree by the Apostle, for it commenced with the patriarchs.…This then is the tree itself: though some of its boughs have been broken, yet all have not. For if all the boughs were broken, whence is Peter? whence John? whence Thomas? whence Matthew? whence Andrew? whence are all those Apostles? whence that very Apostle Paul who was speaking to us but now, and by his own fruit bearing witness to the good olive? Were not all these of that people?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
