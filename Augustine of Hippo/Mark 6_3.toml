[[commentary]]
quote='''
Those heretics were called Antidicomarites who denied the virginity of Mary to the point that they claim that after the birth of Christ she had intercourse with her husband.
'''
source_url='https://books.google.com/books?id=Z3DYAAAAMAAJ&lpg=PA72&ots=WC8rp17mAB&dq=Antidicomarianite%20augustine&pg=PA48#v=onepage&q&f=false'
source_title="Heresies, LVI"

[[commentary]]
quote='''
(de Con. Evan. ii. 42) Matthew indeed says that He was called the son of a carpenter; nor are we to wonder, since both might have been said, for they believed Him to be a carpenter, because He was the son of a carpenter.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At present, therefore, we have to consider whether [Matthew's report of] what the Lord spoke, and what was said to Him in His own country, is in concord with the accounts given by the other two, namely, Mark and Luke. For, in widely different and dissimilar sections of his history, John mentions words, either spoken to the Lord or spoken by Him, which resemble those recorded in this passage by the other three evangelists.

Now Mark, indeed, gives this passage in terms almost precisely identical with those which meet us in Matthew; with the one exception, that what he says the Lord was called by His fellow-townsmen is, "the carpenter, and the son of Mary," and not, as Matthew tells us, the "carpenter's son." Neither is there anything to marvel at in this, since He might quite fairly have have been designated by both these names. For in taking Him to be the son of a carpenter, they naturally also took Him to be a carpenter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 42"
