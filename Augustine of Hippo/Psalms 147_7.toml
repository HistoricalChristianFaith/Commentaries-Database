[[commentary]]
quote='''
And how dost thou begin to have peace with God? Thou beginnest with Him in confession. There is a voice of a Psalm, saying, “Begin ye to the Lord in confession.” What is, “Begin ye to the Lord in confession”? Begin ye to be joined to the Lord. In what manner? So that the same thing may displease you as displeaseth Him. There displeaseth Him thy evil life; if it please thyself, thou art disunited from Him; if it displease thee, through confession to Him thou art united.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"

[[commentary]]
quote='''
“Begin to the Lord in confession” (ver. 7). Begin with this, if thou wouldest arrive at a clear understanding of the truth. If thou wilt be brought from the road of faith to the profession of the reality, “begin in confession.” First accuse thyself: accuse thyself, praise God.…What after confession? Let good works follow. “Sing unto our God upon the harp.” What is, “Upon the harp”? As I have already explained, just like the Psalm upon the psaltery, so also is the “harp:” not with voice only, but with works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
