[[commentary]]
quote='''
(Tr. liv. 7) When the Father gave the Son a commandment, He did not give Him what He had not: for in the Wisdom of the Father, i. e. in the Word, are all the commandments of the Father. The commandment is said to be given, because it is not from him to whom it is said to be given. But to give the Son that which He never was without, is the same as to beget the Son who never was not.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"For I have not," He says, "spoken of myself." He says that He has not spoken of Himself, because He is not of Himself. Of this we have frequently discoursed already; so that now, without any more instruction, we have simply to remind you of it as a truth with which you are familiar. "But the Father who sent me, He gave me a commandment what I should say, and what I should speak." We would not stay to elaborate this, did we know that we were now speaking with those with whom we have spoken on former occasions, and of these, not with all, but such only whose memories have retained what they heard: but because there are perhaps some now present who did not hear, and some in a similar condition who have forgotten what they heard, on their account let those who remember what they have heard bear with our delay. How giveth the Father a commandment to His only Son? With what words doth He speak to the Word, seeing that the Son Himself is the only-begotten Word? Could it be by an angel, seeing that by Him the angels were created? Was it by means of a cloud, which, when it gave forth its sound to the Son, gave it not on His account, as He Himself also tells us elsewhere, but for the sake of others who were needing to hear it (ver. 29)? Could it be by any sound issuing from the lips, where bodily form was wanting, and where there is no such local distance separating the Son from the Father as to admit of any intervening air, to give effect, by its percussion, to the voice, and render it audible? Let us put away all such unworthy notions of that incorporeal and ineffable subsistence. The only Son is the Word and the Wisdom of the Father, and therein are all the commandments of the Father. For there was no time that the Son knew not the Father's commandment, so as to make it necessary for Him to possess in course of time what He possessed not before. For what He has received from the Father, He received in being born, and was given it in being begotten. For the life He is, and life He certainly received in being born, while yet there was no antecedent time when life was wanting to His personal existence. For, on the one hand, the Father has life, and is what He has: and yet He received it not, because He is not of any one. But the Son received life as the Father's gift, of whom He is: and so He Himself is what He has; for He has life, and is the life. Listen to Himself when He says, "As the Father hath life in Himself, so hath He given to the Son to have life in Himself." Could He give it to one who was in being, and yet hitherto was destitute thereof? On the contrary, in the very begetting it. was given by Him who begat the life, and so life begat the life. And to show that He begat the life equal, and not inferior to Himself, it was said, "As He hath life in Himself, so hath He also given to the Son to have life in Himself." He gave life; for in begetting the life, what was it He gave Him, save to be the life? And as His nativity is itself eternal, there never was a time without that Son who is the life, and never was there a time when the Son Himself was without the life; and as His nativity is eternal, so He, who was thus born, is eternal life. And so the Father gave not to the Son a commandment which He had not already; but, as I said, in the Wisdom of the Father, that is, in the word of the Father, are laid up all the Father's commandments. And yet the commandment is said to have been given Him, because He, to whom it is thus given, is not of Himself: and to give that to the Son which He never was without, is the same in meaning as to beget that Son who never was without existence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252054.html'
source_title="Tractates on John 54"
