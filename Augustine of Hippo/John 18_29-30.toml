[[commentary]]
quote='''
"Pilate then went out unto them, and said, What accusation bring ye against this man? They answered and said unto him, If he were not a malefactor, we would not have delivered him up unto thee." Let the question be put to, and the answer come from, those who had been delivered from foul spirits, from the sickly who had been healed, the lepers who had been cleansed, the deaf who were hearing, the dumb who were speaking, the blind who were seeing, the dead who were raised to life, and, above all, the foolish who were become wise, whether Jesus were a malefactor. But these things were said by those of whom He Himself had already foretold by the prophet, "They rewarded me evil for good."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520114.html'
source_title="Tractates on John 114"

[[commentary]]
quote='''
Let us next take the account of these same incidents—that is to say, those in which Pilate was engaged—as it is presented by John. He proceeds thus: "And they themselves went not into the judgment-hall, lest they should be defiled; but that they might eat the passover. Pilate then went out unto them, and said, What accusation bring ye against this man? They answered and said unto him, If he were not a malefactor, we would not have delivered him up unto thee." We must look into this passage in order to show that it contains nothing inconsistent with Luke's version, which states that certain charges were brought against Him, and also specifies their terms. For Luke's words are these: "And they began to accuse Him, saying, We found this fellow perverting the nation, and forbidding to give tribute to Cæsar, saying that he himself is Christ a king." On the other hand, according to the paragraph which I have now cited from John, the Jews seem to have been unwilling to state any specific accusations, when Pilate asked them, "What accusation bring ye against this man?" For their reply was, "If he were not a malefactor, we would not have delivered him up unto thee;" the purport of which was, that he should accept their authority, cease to inquire what fault was alleged against Him, and believe Him guilty for the simple reason that He had been [reckoned] worthy of being delivered up by them to him. This being the case, then, we ought to suppose that both these versions report words which were actually said, both the one before us at present, and the one given by Luke. For among the multitude of sayings and replies which passed between the parties, these writers have made their own selections as far as their judgment allowed them to go, and each of them has introduced into his narrative just what he considered sufficient. It is also true that John himself mentions certain charges which were alleged against Him, and which we shall find in their proper connections.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"

[[commentary]]
quote='''
And then he goes on, the Lord being still the speaker, to recite other matters which the rest have not recorded. His terms are these: "To this end was I born, and for this cause came I into the world, that I should bear witness unto the truth. Every one that is of the truth heareth my voice. Pilate saith unto him, What is truth? And when he had said this, he went out again unto the Jews, and saith unto them, I find no fault in him. But ye have a custom, that I should release unto you one at the passover: will ye, therefore, that I release unto you the King of the Jews? Then cried they all again, Not this man, but Barabbas. Now Barabbas was a robber. Then Pilate, therefore, took Jesus, and scourged Him. And the soldiers platted a crown of thorns, and put it on His head, and they put on Him a purple robe; and they came to Him and said, Hail, King of the Jews! and they smote Him with their hands. Pilate went forth again, and saith unto them, Behold, I bring him forth to you, that ye may know that I find no fault in him. Then came Jesus forth, wearing the crown of thorns and the purple robe. And Pilate saith unto them, Behold the man! When the chief priests therefore and officers saw Him, they cried out, saying, Crucify him, crucify him. Pilate saith unto them, Take ye him, and crucify him; for I find no fault in him. The Jews answered him, We have a law, and by our law he ought to die, because he made himself the Son of God." This may fit in with what Luke reports to have been stated in the accusation brought by the Jews,—namely, "We found this fellow perverting our nation,"—so that we might append here the reason given for it, "Because he made himself the Son of God." John then goes on in the following strain: "When Pilate, therefore, heard that saying, he was the more afraid, and went again into the judgment-hall, and saith unto Jesus, Whence art thou? But Jesus gave him no answer. Then saith Pilate unto Him, Speakest thou not unto me? knowest thou not that I have power to crucify thee, and have power to release thee? Jesus answered, Thou couldest have no power at all against me, except it were given thee from above: therefore he that delivered me unto thee hath the greater sin. From thenceforth Pilate sought to release Him: but the Jews cried out, saying, If thou let this man go, thou art not Cæsar's friend: whosoever maketh himself a king, speaketh against Cæsar." This may very well agree with what Luke records in connection with the said accusation brought by the Jews. For after the words, "We found this fellow perverting our nation," he has added the clause, "And forbidding to give tribute to Cæsar, and saying that he himself is Christ a king." This will also offer a solution for the difficulty previously referred to, namely, the occasion which might seem to be given for supposing John to have indicated that no specific charge was laid by the Jews against the Lord, when they answered and said unto him, "If he were not a malefactor, we would not have delivered him up unto thee."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
