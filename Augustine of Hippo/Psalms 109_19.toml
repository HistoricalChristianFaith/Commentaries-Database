[[commentary]]
quote='''
“Let it be unto him as the cloak which covereth him” (ver. 18). Since he hath before spoken of the cloak, why doth he repeat it? When he said, “He clothed himself with cursing as with a raiment;” doth the raiment with which he is “covered” differ from that with which he is “clothed”? For every man is clothed with his tunic, covered with his cloak; and what is this, save boasting in iniquity, even in the sight of men? “and as the girdle,” he saith, “that he is alway girded withal.” Men are girded chiefly that they may be better fit for toil, that they may not be hindered by the folds of their dress. He therefore girdeth himself with curses, who designeth an evil which he hath carefully contrived, not on a sudden impulse, and who learneth in such a manner to do evil, that he is always ready to commit it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
