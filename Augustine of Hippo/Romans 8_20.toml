[[commentary]]
quote='''
This revelation of the sons of God, then, the creature awaits, which in man is now subjected to vanity, as long as it is given over to temporal things, which pass away like a shadow. Hence too it is said in the Psalm: Man has become like vanity; his days pass away like a shadow. Solomon too speaks of vanity, when he says: Vanity of vanities, and all is vanity; what abundance has a man in all his labor with which he labors under the sun? Of which David likewise says: Why do you love vanity and seek a lie? He says the creature was subjected to vanity not willingly, because this subjection is penal. For man, though he sinned willingly, was not likewise condemned willingly—yet this condemnation was inflicted upon our nature not without hope of restoration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
