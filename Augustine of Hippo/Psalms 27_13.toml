[[commentary]]
quote='''
“I believe to see the good things of the Lord in the land of the living” (ver. 13). And since my Lord hath first suffered these things, if I too despise the tongues of the dying (“for the mouth that lieth slayeth the soul”), I believe to see the good things of the Lord in the land of the living, where there is no place for falsity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
