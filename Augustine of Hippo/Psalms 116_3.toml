[[commentary]]
quote='''
For even tribulation, when it comes upon a servant of God for testing or amendment, sometimes seems useless to those who understand less; but if it is referred to what was said: Give us help from tribulation, and vain is the salvation of man, it is understood that God very often helps us by means of tribulation, and that safety is vainly desired which is sometimes adverse, when it entangles the soul with delight and love of this life. Hence too is that saying: I found tribulation and sorrow, and I called upon the name of the Lord. For when he says I found, he signifies something useful; for we do not rightly rejoice at having found anything except what we were seeking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
