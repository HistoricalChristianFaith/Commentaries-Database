[[commentary]]
quote='''
What did Sion hear, and rejoice at? That the Gentiles also had received the word of God. One wall had come, but the corner existed not as yet. The name Sion is here peculiarly given to the Church which was in Judæa. “Sion heard of it, and rejoiced: and the daughters of Judah were glad.” Thus it is written, “The apostles and brethren that were in Judæa heard.” See if the daughters of Judæa rejoiced not. What did they hear? “That the Gentiles had also received the word of God.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
