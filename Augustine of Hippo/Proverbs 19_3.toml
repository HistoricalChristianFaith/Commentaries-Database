[[commentary]]
quote='''
From these statements of the inspired word, and from similar passages which it would take too long to quote in full, it is, I think, sufficiently clear that God works in the hearts of men to incline their wills whithersoever He wills, whether to good deeds according to His mercy, or to evil after their own deserts; His own judgment being sometimes manifest, sometimes secret, but always righteous. This ought to be the fixed and immoveable conviction of your heart, that there is no unrighteousness with God. Therefore, whenever you read in the Scriptures of Truth, that men are led aside, or that their hearts are blunted and hardened by God, never doubt that some ill deserts of their own have first occurred, so that they justly suffer these things. Thus you will not run counter to that proverb of Solomon: "The foolishness of a man perverteth his ways, yet he blameth God in his heart."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 43"
