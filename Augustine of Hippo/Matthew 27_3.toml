[[commentary]]
quote='''
And thus it is that Matthew here relates what took place between Pilate and the Lord.

First, however, he makes a digression with the purpose of telling the story of Judas' end, which is related only by him. His account is in these terms: "Then Judas, which had betrayed Him, when he saw that He was condemned, repented himself, and brought again the thirty pieces of silver to the chief priests and elders, saying, I have sinned, in that I have betrayed the innocent blood. And they said, What is that to us? See thou to that. And he cast down the pieces of silver in the temple, and departed, and went and hanged himself. And the chief priests took the silver pieces, and said, It is not lawful for to put them into the treasury, because it is the price of blood. And they took counsel, and bought with them the potter's field, to bury strangers in. Wherefore that field was called, The field of blood, unto this day. Then was fulfilled that which was spoken by Jeremy the prophet, saying, And they took the thirty pieces of silver, the price of Him that was valued, whom the children of Israel did value, and gave them for the potter's field, as the Lord appointed me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 7"
