[[commentary]]
quote='''
“Avenge Thou,” he saith, “my cause, and deliver me” (ver. 154). The former sentence is here almost repeated. And what is there said, “For I do not forget Thy law,” agreeth with what we read here, “Quicken me, according to Thy word.” For these words are the law of God, which he hath not forgot, so that he hath abased himself, and will therefore be exalted. But the words, “Quicken me,” pertain to this very exaltation; for the exaltation of the saints is everlasting life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
