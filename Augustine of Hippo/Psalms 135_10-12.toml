[[commentary]]
quote='''
Little did He in Egypt: what did He after His people was led out thence? “Who smote many nations” (ver. 10), who possessed that land, which God willed to give His people. “And slew mighty kings, Sehon king of the Amorites, and Og the king of Bashan, and all the kingdoms of Canaan” (ver. 11). All these things which the Psalm records simply, do we read likewise in others of the Lord’s books, and there the hand of the Lord is great. When thou seest what has been done to the wicked, take heed lest it be done to thee.…But when the good man sees what the wicked has suffered, let him cleanse himself from all iniquity, lest he fall into a like punishment, a like chastisement. Then ye have thoroughly understood these things. What did God then? He drove out the wicked, “And he gave their land for an inheritance, even an inheritance to Israel His servant” (ver. 12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520135.html'
source_title="Exposition on Psalm 135"
