[[commentary]]
quote='''
Let us then, my brethren, hold unity: without unity, even he who works miracles is nothing. The people Israel was in unity, and yet wrought no miracles: Pharaoh's magicians were out of unity, and yet they wrought the like works as Moses." The people Israel, as I have said, wrought no miracles. Who were saved with God-they who did, or they who did not, work miracles? The Apostle Peter raised a dead person: Simon Magus did many things: there were there certain Christians who were not able to do either what Peter did or what Simon did; and wherein did they rejoice? In this, that their names were written in heaven. For this is what our Lord Jesus Christ said to the disciples on their return, because of the faith of the Gentiles. The disciples, in truth, themselves said, boasting, "Behold, Lord, in Thy name even the devils are subject to us." Rightly indeed they confessed, they brought the honor to the name of Christ; and yet what does He say to them? "Do not ye glory in this, that the devils are subject to you; but rejoice that your names are written in heaven." Peter cast out devils. Some old widow, some lay person or other, having charity, and holding the integrity of faith, forsooth does not do this. Peter is the eye in the body, that man is the finger, yet is he in the same body in which Peter is; and if the finger has less power than the eye, yet it is not cut off from the body. Better is it to be a finger and to be in the body, than to be an eye and to be plucked out of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
