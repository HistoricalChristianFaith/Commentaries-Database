[[commentary]]
quote='''
“Confession and beauty are before Him” (ver. 6). Dost thou love beauty? Wishest thou to be beautiful? Confess! He said not, beauty and confession, but confession and beauty. Thou wast foul; confess, that thou mayest be fair: thou wast a sinner; confess, that thou mayest be righteous. Thou couldest deform thyself: thou canst not make thyself beautiful. But of what sort is our Betrothed, who hath loved one deformed, that he might make her fair? How, saith some one, loved He one deformed? “I came not,” said He, “to call the righteous, but sinners.” Whom callest Thou? sinners, that they may remain sinners? No, saith He. And by what means will they cease to be sinners? “Confession and beauty are before Him.” They honour Him by confession of their sins, they vomit the evils which they had greedily devoured; they return not to their vomit, like the unclean dog; and there will then be confession and beauty: we love beauty; let us first choose confession, that beauty may follow. Again, there is one who loveth power and greatness: he wisheth to be great as the Angels are. There is a certain greatness in the Angels; and such power, that if the Angels exert it to the full, it cannot be withstood. And every man desireth the power of the Angels, but their righteousness every man loveth not. First love righteousness, and power shall follow thee. For what followeth here? “Holiness and greatness are in His sanctification.” Thou wast before seeking for greatness: first love righteousness: when thou art righteous, thou shalt also be great. For if thou preposterously dost wish first to be great, thou fallest before thou canst rise: for thou dost not rise, thou art raised up. Thou risest better, if He raise thee who falleth not. For He who falleth not descendeth unto thee: thou hadst fallen: He descendeth, He hath stretched forth His hand unto thee; thou canst not rise by thy own strength, embrace the hand of Him who descendeth, that thou mayest be raised up by the Strong One.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
