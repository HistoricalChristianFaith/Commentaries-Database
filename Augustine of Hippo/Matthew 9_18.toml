[[commentary]]
quote='''
(De Cons. Ev. ii. 28.) This narrative is given both by Mark and Luke, but in a quite different order; namely, when after the casting out of the daemons and their entrance into the swine, he had returned across the lake from the country of the Gerasenes. Now Mark does indeed tell us that this happened after He had recrossed the lake, but how long after he does not determine. Unless there had been some interval of time, that could not have taken place that Matthew relates concerning the feast in his house. After this, immediately follows that concerning the ruler of the synagogue's daughter. If the ruler came to Him while He was yet speaking that of the new patch, and the new wine, then no other act of speech of his intervened. And in Mark's account, the place where these things might come in, is evident. In like manner, Luke does not contradict Matthew; for what he adds, And behold a man, whose name was Jairus, (Luke 8:41.) is not to be taken as though it followed instantly what had been related before, but after that feast with the Publicans, as Matthew relates. While he spake these things unto them, behold, one of their chief men, namely, Jairus, the ruler of the synagogue, came to him, and worshipped him, saying, Lord, my daughter is even now dead. It should be observed, lest there should seem to be some discrepancy, that the other two Evangelists represent her as at the point of death, but yet not dead, but so as afterwards to say that there came afterwards some saying, She is dead, trouble not the Master, for Matthew for the sake of shortness represents the Lord as having been asked at first to do that which it is manifest He did do, namely, raise the dead. He looks not at the words of the father respecting his daughter, but rather his mind. For he had so far despaired of her life, that he made his request rather for her to be called to life again, thinking it impossible that she, whom he had left dying, should be found yet alive. The other two then have given Jairus' words; Matthew has put what he wished and thought. Indeed had either of them related that it was the father himself that said that Jesus should not be troubled for she was now dead, in that case the words that Matthew has given would not have corresponded with the thoughts of the ruler. But we do not read that he agreed with the messengers. Hence we learn a thing of the highest necessity, that we should look at nothing in any man's words, but his meaning to which his words ought to be subservient; and no man gives a false account when he repeats a man's meaning in words other than those actually used.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Still keeping by the order of time, Matthew next continues to the following effect: "While He spake these things unto them, behold, there came a certain ruler, and worshipped Him, saying, My daughter is even now dead; but come and lay Thy hand upon her, and she shall live;" and so on, until we come to the words, "and the maid arose. And the fame hereof went abroad into all that land." The other two, namely, Mark and Luke, in like manner give this same account, only they do not keep by the same order now. For they bring up this narrative in a different place, and insert it in another connection; to wit, at the point where He crosses the take and returns from the country of the Gerasenes, after casting out the devils and permitting them to go into the swine. Thus Mark introduces it, after he has related what took place among the Gerasenes, in the following manner: "And when Jesus was passed over again by ship unto the other side, much people gathered unto Him: and He was nigh unto the sea. And there cometh one of the rulers of the synagogue, Jairus by name; and when he saw Him, he fell at His feet," etc. By this, then, we are certainly to understand that the occurrence in connection with the daughter of the ruler of the synagogue did take place after Jesus had passed across the lake again in the ship. It does not, however, appear from the words themselves how long after that passage this thing happened. But that some time did elapse is clear. For had there not been an interval, no period would be left within which those circumstances might fall which Matthew has just related in the matter of the feast in his house. These, indeed, he has told after the fashion of the evangelists, as if they were the story of another person's doings. But they are the story really of what took place in his own case, and at his own house. And after that narrative, what follows in the immediate context is nothing else than this notice of the daughter of the ruler of the synagogue. For he has constructed the whole recital in such a manner, that the mode of transition from one thing to the other has itself indicated with sufficient clearness that the words immediately, following give the narrative of what actually took place in immediate consecution. For after mentioning, in connection with the former incident, those words which Jesus spake with respect to the new cloth and the new wine, he has subjoined these other words, without any interruption in the narrative, namely, "While He spake these things unto them, behold, there came a certain ruler." And this shows that, if the person approached Him while He was speaking these things, nothing else either done or said by Him could have intervened. In Mark's account, on the other hand, the place is quite apparent, as we have already pointed out, where other things [left unrecorded by him] might very well have come in. The case is much the same also with Luke, who, when he proceeds to follow up his version of the story of the miracle wrought among the Gerasenes, by giving his account of the daughter of the ruler of the synagogue, does not pass on to that in any such way as to place it in antagonism with Matthew's version, who, by his words, "While He yet spake these things," gives us plainly to understand that the occurrence took place after those parables about the cloth and the wine. For when he has concluded his statement of what happened among the Gerasenes, Luke passes to the next subject in the following manner; "And it came to pass that, when Jesus was returned, the people gladly received Him; for they were all waiting for Him. And, behold, there came a man named Jairus, and he was a ruler of the synagogue, and he fell down at Jesus' feet," and so on. Thus we are given to understand that the crowd did indeed receive Jesus forthwith on the said occasion: for He was the person for whose return they were waiting. But what is conveyed in the words which are directly added, "And, behold, there came a man whose name was Jairus," is not to be taken to have occurred literally in immediate succession. On the contrary, the feast with the publicans, as Matthew records it, took place before that. For Matthew connects this present incident with that feast in such a way as to make it impossible for us to suppose that any other sequence of events can be the correct order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 28"

[[commentary]]
quote='''
At the same time, however, there remains the fact that Matthew represents the ruler of the synagogue to have spoken to the Lord of his daughter, not merely as one likely to die, or as dying, or as on the very point of expiring, but as even then dead; while these other two evangelists report her as now nigh unto death, but not yet really dead, and keep so strictly to that version of the circumstances, that they tell us how the persons came at a later stage with the intelligence of her actual death, and with the message that for this reason the Master ought not now to trouble Himself by coming, with the purpose of laying His hand upon her, and so preventing her from dying,—the matter not being put as if He was one possessed of ability to raise the once dead to life. It becomes necessary for us, therefore, to investigate this fact lest it may seem to exhibit any contradiction between the accounts. And the way to explain it is to suppose that, by reason of brevity in the narrative, Matthew has preferred to express it as if the Lord had been really asked to do what it is clear He did actually do, namely, raise the dead to life. For what Matthew directs our attention to, is not the mere words spoken by the father about his daughter, but what is of more importance, his mind and purpose. Thus he has given words calculated to represent the father's real thoughts. For he had so thoroughly despaired of his child's case, that not believing that she whom he had just left dying, could possibly now be found yet in life, his thought rather was that she might be made alive again. Accordingly two of the evangelists have introduced the words which were literally spoken by Jairus. But Matthew has exhibited rather what the man secretly wished and thought. Thus both petitions were really addressed to the Lord; namely, either that He should restore the dying damsel, or that, if she was already dead, He might raise her to life again. But as it was Matthew's object to tell the whole story in short compass, he has represented the father as directly expressing in his request what, it is certain, had been his own real wish, and what Christ actually did. It is true, indeed, that if those two evangelists, or one of them, had told us that the father himself spake the words which the parties who came from his house uttered,—namely, that Jesus should not now trouble Himself, because the damsel had died,—then the words which Matthew has put into his mouth would not be in harmony with his thoughts. But, as the case really stands, it is not said that he gave his consent to the parties who brought that report, and who bade the Master no more think of coming now. And together with this, we have to observe, that when the Lord addressed him in these terms, "Fear not: believe only, and she shall be made whole," He did not find fault with him on the ground of his want of belief, but really encouraged him to a yet stronger faith. For this ruler had faith like that which was exhibited by the person who said, "Lord, I believe; help Thou mine unbelief."

Seeing, then, that the case stands thus, from these varied and yet not inconsistent modes of statement adopted by the evangelists, we evidently learn a lesson of the utmost utility, and of great necessity,—namely, that in any man's words the thing which we ought narrowly to regard is only the writer's thought which was meant to be expressed, and to which the words ought to be subservient; and further, that we should not suppose one to be giving an incorrect statement, if he happens to convey in different words what the person really meant whose words he fails to reproduce literally. And we ought not to let the wretched cavillers at words fancy that truth must be tied somehow or other to the jots and tittles of letters; whereas the fact is, that not in the matter of words only, but equally in all other methods by which sentiments are indicated, the sentiment itself, and nothing else, is what ought to be looked at.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 28"
