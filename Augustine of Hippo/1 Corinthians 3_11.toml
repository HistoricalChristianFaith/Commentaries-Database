[[commentary]]
quote='''
It should not be denied that this is the distinctive basis of the orthodox faith, just because it is shared between us and certain heretics as well. For if we think carefully about the meaning of Christ we shall see that among some of the heretics who want to be called Christians, the name of Christ is held in honor, but the reality to which the name points is not.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 2.5"

[[commentary]]
quote='''
…But that ye may know that Christ is at once the earliest and the highest foundation, the Apostle saith, “Other foundation can no man lay than is laid, which is Christ Jesus.” How, then, are the Prophets and Apostles foundations, and yet Christ so, than whom nothing can be higher? How, think you, save that as He is openly styled, Saint of saints, so figuratively Foundation of foundations? Thus if thou art thinking of mysteries, Christ is the Saint of saints: if of a subject flock, the Shepherd of shepherds: if of a structure, the Pillar of pillars. In material edifices, the same stone cannot be above and below: if at the bottom, it cannot be at the top: and vice versa: for almost all bodies are liable to limitations in space: nor can they be everywhere or for ever; but as the Godhead is in every place, from every place symbols may be taken for It; and not being any of these things in external properties, It can be everything in figure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"

[[commentary]]
quote='''
This, then, is the “Jerusalem that is being built as a city:” Christ is its foundation. The Apostle Paul saith, “Other foundation can no man lay than that is laid, which is Christ Jesus.” When a foundation is laid on earth, the walls are built above, and the weight of the walls tends towards the lowest parts, because the foundation is laid at the bottom. But if our foundation be in heaven, let us be built towards heaven. Bodies have built the edifice of this basilica, the ample size of which ye see; and since bodies have built it, they placed the foundation lowest: but since we are spiritually built, our foundation is placed at the highest point. Let us therefore run thither, where we may be built…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
