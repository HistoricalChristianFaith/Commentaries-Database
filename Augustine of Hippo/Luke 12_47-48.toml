[[commentary]]
quote='''
How then must be understood, what the Lord saith in the Gospel concerning stripes, “the many and the few”? if greater the anger of God is against the nations, which have not known the Lord? For in this which he saith, “Pour forth Thine anger,” with this word he hath clearly enough pointed out, how great anger he hath willed that there should be understood. Whence afterwards he saith, “Render to our neighbours seven times as much.” Is it not that there is a great difference between servants, who, though they know not the will of their Lord, do yet call upon His name, and those that are aliens from the family of so great a Master, who are so ignorant of God, as that they do not even call upon God? For in place of Him they call upon either idols or demons, or any creature they choose; not the Creator, who is blessed for ever. For those persons, concerning whom he is prophesying this, he doth not even intimate to be so ignorant of the will of their God, as that still they fear the Lord Himself; but so ignorant of the Lord Himself, that they do not even call upon Him, and that they stand forth as enemies of His name. There is a great difference then between servants not knowing the will of their God, and yet living in His family and in His house, and enemies not only setting the will against knowing the Lord Himself, but also not calling upon His name, and even in His servants fighting against it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"

[[commentary]]
quote='''
The excuse such as men are in the habit of alleging from ignorance is taken away from those persons who know God's commandments. But neither will those be without punishment who know not the law of God. "For as many as have sinned without law shall also perish without law; and as many as have sinned in the law shall be judged by the law." Now the apostle does not appear to me to have said this as if he meant that they would have to suffer something worse who in their sins are ignorant of the law than they who know it. It is seemingly worse, no doubt, "to perish" than "to be judged;" but inasmuch as he was speaking of the Gentiles and of the Jews when he used these words, because the former were without the law, but the latter had received the law, who can venture to say that the Jews who sin in the law will not perish, since they refused to believe in Christ, when it was of them that the apostle said, "They shall be judged by the law"? For without faith in Christ no man can be delivered; and therefore they will be so judged that they perish. If, indeed, the condition of those who are ignorant of the law of God is worse than the condition of those who know it, how can that be true which the Lord says in the gospel: "The servant who knows not his lord's will, and commits things worthy of stripes, shall be beaten with few stripes; whereas the servant who knows his lord's will, and commits things worthy of stripes, shall be beaten with many stripes"? Observe how clearly He here shows that it is a graver matter for a man to sin with knowledge than in ignorance. And yet we must not on this account betake ourselves for refuge to the shades of ignorance, with the view of finding our excuse therein. It is one thing to be ignorant, and another thing to be unwilling to know. For the will is at fault in the case of the man of whom it is said, "He is not inclined to understand, so as to do good." But even the ignorance, which is not theirs who refuse to know, but theirs who are, as it were, simply ignorant, does not so far excuse any one as to exempt him from the punishment of eternal fire, though his failure to believe has been the result of his not having at all heard what he should believe; but probably only so far as to mitigate his punishment. For it was not said without reason: "Pour out Thy wrath upon the heathen that have not known Thee;" nor again according to what the apostle says: "When He shall come from heaven in a flame of fire to take vengeance on them that know not God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 5"
