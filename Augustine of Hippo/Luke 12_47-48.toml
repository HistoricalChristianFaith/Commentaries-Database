[[commentary]]
quote='''
Now if those ignorant of the law are in a worse condition than those who know the law, how can this saying of our Lord in the Gospel be true? "That servant who knew his master's will but did not make ready or act according to his will shall receive a severe beating. But he who did not know and did what deserved a beating shall receive a light beating." You see that this passage shows clearly a person who knows sins more seriously than one who does not know. Yet we must not on this account take refuge in the darkness of ignorance so as to find there an excuse for our conduct. Not to know is one thing; unwillingness to know is another.
'''
source_url=''
source_title="ON GRACE AND FREE WILL 3"

[[commentary]]
quote='''
How then must be understood, what the Lord saith in the Gospel concerning stripes, “the many and the few”? if greater the anger of God is against the nations, which have not known the Lord? For in this which he saith, “Pour forth Thine anger,” with this word he hath clearly enough pointed out, how great anger he hath willed that there should be understood. Whence afterwards he saith, “Render to our neighbours seven times as much.” Is it not that there is a great difference between servants, who, though they know not the will of their Lord, do yet call upon His name, and those that are aliens from the family of so great a Master, who are so ignorant of God, as that they do not even call upon God? For in place of Him they call upon either idols or demons, or any creature they choose; not the Creator, who is blessed for ever. For those persons, concerning whom he is prophesying this, he doth not even intimate to be so ignorant of the will of their God, as that still they fear the Lord Himself; but so ignorant of the Lord Himself, that they do not even call upon Him, and that they stand forth as enemies of His name. There is a great difference then between servants not knowing the will of their God, and yet living in His family and in His house, and enemies not only setting the will against knowing the Lord Himself, but also not calling upon His name, and even in His servants fighting against it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"
