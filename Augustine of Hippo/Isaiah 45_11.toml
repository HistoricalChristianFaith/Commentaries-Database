[[commentary]]
quote='''
There is no doubt that human wills cannot resist the will of God, "who has done whatsoever he pleased in heaven and on earth," and who has even "formed the things that are to come." Nor can the human will prevent [God] from doing what he wills, seeing that even with human wills, he does what he wills, when he wills to do it.
'''
source_url=''
source_title="ADMONITION AND GRACE 14:45"


[[commentary]]
quote='''
By predestination God indeed foreknew that which he himself was going to do. Thus it was said, "He has made that which shall be." Furthermore, [God] can foreknow even those things that he himself does not do, such as whatever sins there may be. There are certain things that are sins and at the same time punishment for sins, so that it is written, "God delivered them up to a reprobate mind, to do those things which are not fitting." This is not the sin of God, however, but the judgment of God.
'''
source_url=''
source_title="PREDESTINATION OF THE SAINTS 10"

[[commentary]]
quote='''
How then are there mansions in the Father's house, and these not different ones but the same, which already exist in a sense in which they can admit of no preparation, and yet do not exist, inasmuch as they are still to be prepared? How are we to think of this, but in the same way as the prophet, who also declares of God, that He has [already] made that which is yet to be. For he says not, Who will make what is yet to be, but, "Who has made what is yet to be." Therefore He has both made such things and is yet to make them. For they have not been made at all if He has not made them; nor will they ever be if He make them not Himself. He has made them therefore in the way of fore-ordaining them; He has yet to make them in the way of actual elaboration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252068.html'
source_title="Tractates on John 68"
