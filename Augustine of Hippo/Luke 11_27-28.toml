[[commentary]]
quote='''
Mary was more blessed in accepting the faith of Christ than in conceiving the flesh of Christ. To someone who said, "Blessed is the womb that bore you," he replied, "Rather, blessed are they who hear the word of God and keep it."Finally, for his brothers, his relatives according to the flesh who did not believe in him, of what advantage was that relationship? Even her maternal relationship would have done Mary no good unless she had borne Christ more happily in her heart than in her flesh.
'''
source_url='https://www.newadvent.org/fathers/1310.htm'
source_title="On Holy Virginity 3"

[[commentary]]
quote='''
Moreover, when the Lord was regarded with admiration by the multitude, while doing signs and wonders, and showing forth what lay concealed under the flesh, certain admiring souls said: "Happy is the womb that bare Thee: and He said, Yea, rather, happy are they that hear the word of God, and keep it." That is to say, even my mother, whom ye have called happy, is happy in that she keeps the word of God: not because in her the Word was made flesh and dwelt in us; but because she keeps that same word of God by which she was made, and which in her was made flesh. Let not men rejoice in temporal offspring, but let them exult if in spirit they are joined to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
