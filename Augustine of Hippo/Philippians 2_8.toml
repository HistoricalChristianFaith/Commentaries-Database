[[commentary]]
quote='''
He humbled himself, being made obedient even unto death, even death on a cross, so that none of us, though being able to face death without fear, might shrink from any kind of death that human beings regard as a great disgrace.
'''
source_url='https://www.newadvent.org/fathers/1304.htm'
source_title="On Faith and the Creed 11"

[[commentary]]
quote='''
What can be added to this mercy? And yet He has added thereto. It was not enough for Him to be made man, He added to this that He was rejected of men; it was not enough to be rejected, He was dishonored; it was not enough to be dishonored, He was put to death; but even this was not enough, it was by the death of the cross. For when the apostle was commending to us His obedience even unto death, it was not enough for him to say, "He became obedient unto death;" for it was not unto death of any kind whatever: but he added, "even the death of the cross." Among all kinds of death, there was nothing worse than that death. In short, that wherein one is racked by the most intense pains is called cruciatus, which takes its name from crux, a cross. For the crucified, hanging on the tree, nailed to the wood, were killed by a slow lingering death. To be crucified was not merely to be put to death; for the victim lived long on the cross, not because longer life was chosen, but because death itself was stretched out that the pain might not be too quickly ended. He willed to die for us, yet it is not enough to say this; He deigned to be crucified, became obedient even to the death of the cross. He who was about to take away all death, chose the lowest and worst kind of death: He slew death by the worst of deaths.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"
