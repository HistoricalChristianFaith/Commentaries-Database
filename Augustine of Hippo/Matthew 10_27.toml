[[commentary]]
quote='''
And even what He spake to His disciples apart, He certainly spake not in secret. For who speaketh in secret, that speaketh before so many persons; as it is written, "At the mouth of two or three witnesses shall every word be established:" especially if that be spoken to a few which he wisheth to become known to many through them; as the Lord Himself said to the few whom He had as yet, "What I tell you in darkness, that speak ye in light; and what ye hear in the ear, that preach ye upon the house-tops"? And accordingly the very thing that seemed to be spoken by Himself in secret, was in a certain sense not spoken in secret; for it was not so spoken to remain unuttered by those to whom it was spoken; but rather so in order to be preached in every possible direction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520113.html'
source_title="Tractates on John 113"
