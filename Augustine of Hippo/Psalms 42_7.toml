[[commentary]]
quote='''
“Deep calleth unto deep with the voice of thy water-spouts” (ver. 7). I may perhaps finish the Psalm, aided as I am by your attention, whose fervour I perceive. As for your fatigue in hearing, I am not greatly solicitous, since you see me also, who speak, toiling in the heat of these exertions. Assuredly it is from your seeing me labouring, that you labour with me: for I am labouring not for myself, but for you. “Deep calleth unto deep with the voice of thy water-spouts.” It was God whom he addressed, who “remembered him from the land of Jordan and Hermon.” It was in wonder and admiration he spake this: “Abyss calleth unto abyss with the voice of Thy water-spouts.” What abyss is this that calls, and to what other abyss? Justly, because the “understanding” spoken of is an “abyss.” For an “abyss” is a depth that cannot be reached or comprehended; and it is principally applied to a great body of water. For there is a “depth,” a “profound,” the bottom of which cannot be reached by sounding. Furthermore, it is said in a certain passage, “Thy judgments are a mighty abyss,” Scripture meaning to suggest that the judgments of God are incomprehensible. What then is the “abyss” that calls, and to what other “abyss” does it call? If by “abyss” we understand a great depth, is not man’s heart, do you not suppose, “an abyss”? For what is there more profound than that “abyss”? Men may speak, may be seen by the operations of their members, may be heard speaking in conversation: but whose thought is penetrated, whose heart seen into? What he is inwardly engaged on, what he is inwardly capable of, what he is inwardly doing or what purposing, what he is inwardly wishing to happen, or not to happen, who shall comprehend? I think an “abyss” may not unreasonably be understood of man, of whom it is said elsewhere, “Man shall come to a deep heart, and God shall be exalted.” If man then is an “abyss,” in what way doth “abyss” call on “abyss”? Does man “call on” man as God is called upon? No, but “calls on” is equivalent to “calls to him.” For it was said of a certain person, he calls on death; that is, lives in such a way as to be inviting death; for there is no man at all who puts up a prayer, and calls expressly on death: but men by evil-living invite death. “Deep calls on deep,” then, is, “man calls to man.” Thus is it wisdom is learnt, and thus faith, when “man calls to man.” The holy preachers of God’s word call on the “deep:” are they not themselves “a deep” also?…

“Deep calleth to deep with the voice of Thy water-spouts.” I, who tremble all over, when my soul was disquieted on account of myself, feared greatly on account of Thy “judgments.”…Are those judgments slight ones? They are great ones, severe, hard to bear; but would they were all. “Deep calls to deep with the voice of Thy water-spouts,” in that Thou threatenest, Thou sayest, that there is another condemnation in store even after those sufferings. “Deep calls on deep with the voice of Thy water-spouts.” “Whither then shall I go from Thy presence? And whither shall I flee from Thy Spirit?” seeing that deep calls to deep, and after those sufferings severer ones are to be dreaded.

“All Thy overhangings and Thy waves are come upon me.” The “waves” in what I already feel, the “overhangings” in that Thou denouncest. All my sufferings are Thy waves; all Thy denouncements of judgments are Thy “overhangings.” In the “waves” that deep “calleth;” in the “overhangings” is the other “deep” which it “calls to.” In this that I suffer are all Thy waves; in the severer punishment that Thou threatenest, all Thy “overhangings” are come unto me. For He who threatens does not let His judgments fall upon us, but keeps them suspended over us. But inasmuch as Thou sittest at liberty, I have thus spoken unto my soul. “Hope in God: for I will confess unto Him. My God is the saving health of my countenance.” The more numerous my sufferings, the sweeter will be Thy mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252042.html'
source_title="Exposition on Psalm 42"

[[commentary]]
quote='''
On this account, wishing to praise His obedience which He carried to the extreme of humility, he says, “He humbled Himself, and became obedient unto death;” and as this seemed little, he added, “even the death of the Cross;” and with the same view as far as I can see, he says in this Psalm, “And all thy suspensions,” or, as some translate “waves,” others “tossings,” “Thou hast brought over Me.” We also find in another Psalm, “All thy suspensions and waves are come in upon Me,” or, as some have translated better, “have passed over Me:” for it is διῆλθον in Greek, not εἰσῆλθον: and where both expressions are employed, “waves” and “suspensions,” one cannot be used as equivalent to the other. In that passage we explained “suspensions” as threatenings, “waves” as the actual sufferings: both inflicted by God’s judgment: but in that place it is said, “All have passed over Me,” here, “Thou hast brought all upon Me.” In the other case, that is, although some evils took place, yet, he said, all those which are here mentioned passed over; but in this case, “Thou hast brought them upon Me.” Evils pass over when they do not touch a man, as things which hang over him, or when they do touch him, as waves. But when he uses the word “suspensions,” he does not say they passed over, but, “Thou hast brought them upon Me,” meaning that all which impended had come to pass. All things which were predicted of His Passion impended, as long as they remained in the prophecies for future fulfilment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252088.html'
source_title="Exposition on Psalm 88"
