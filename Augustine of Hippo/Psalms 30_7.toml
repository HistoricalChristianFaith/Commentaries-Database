[[commentary]]
quote='''
“O Lord, in Thy will Thou hast afforded strength unto my beauty” (ver. 7). But that this my abundance, O Lord, is not of myself, but that in Thy will Thou hast afforded strength unto my beauty, I have learnt from this, “Thou turnedst away Thy Face from me, and I became troubled;” for Thou hast sometimes turned away Thy Face from the sinner, and I became troubled, when the illumination of Thy knowledge withdrew from me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
