[[commentary]]
quote='''
The miracles performed by our Lord Jesus Christ are indeed divine works, and incite the human mind to rise to the apprehension of God from the things that are seen. But inasmuch as He is not such a substance as may be seen with the eyes, and His miracles in the government of the whole world and the administration of the universal creation are, by their familiar constancy, slightly regarded, so that almost no man deigns to consider the wonderful and stupendous works of God, exhibited in every grain of seed; He has, agreeably to His mercy, reserved to Himself certain works, beyond the usual course and order of nature, which He should perform on fit occasion, that they, by whom His daily works are lightly esteemed, might be struck with astonishment at beholding, not indeed greater, but uncommon works. For certainly the government of the whole world is a greater miracle than the satisfying of five thousand men with five loaves; and yet no man wonders at the former; but the latter men wonder at, not because it is greater, but because it is rare. For who even now feeds the whole world, but He who creates the cornfield from a few grains? He therefore created as God creates. For, whence He multiplies the produce of the fields from a few grains, from the same source He multiplied in His hands the five loaves. The power, indeed, was in the hands of Christ; but those five loaves were as seeds, not indeed committed to the earth, but multiplied by Him who made the earth. In this miracle, then, there is that brought near to the senses, whereby the mind should be roused to attention, there is exhibited to the eyes, whereon the understanding should be exercised, that we might admire the invisible God through His visible works; and being raised to faith and purged by faith, we might desire to behold Him even invisibly, whom invisible we came to know by the things that are visible.

Yet it is not enough to observe these things in the miracles of Christ. Let us interrogate the miracles themselves, what they tell us about Christ: for they have a tongue of their own, if they can be understood. For since Christ is Himself the Word of God, even the act of the Word is a word to us. Therefore as to this miracle, since we have heard how great it is, let us also search how profound it is; let us not only be delighted with its surface, but let us also seek to know its depth. This miracle, which we admire on the outside, has something within. We have seen, we have looked at something great, something glorious, and altogether divine, which could be performed only by God: we have praised the doer for the deed. But just as, if we were to inspect a beautiful writing somewhere, it would not suffice for us to praise the hand of the writer, because he formed the letters even,equal and elegant, if we did not also read the information he conveyed to us by those letters; so, he who merely inspects this deed may be delighted with its beauty to admire the doer: but he who understands does, as it were, read it. For a picture is looked at in a different way from that in which a writing is looked at. When thou hast seen a picture, to have seen and praised it is the whole thing; when thou seest a writing, this is not the whole, since thou art reminded also to read it. Moreover, when thou seest a writing, if it chance that thou canst not read, thou sayest, "What do we think that to be which is here written?" Thou askest what it is, when already thou seest it to be something. He of whom thou seekest to be informed what it is that thou hast seen, will show thee another thing. He has other eyes than thou hast. Do you not alike see the form of the letters? But yet you do not alike understand the signs. Well, thou seest and praisest; but he sees, praises, reads and understands. Therefore, since we have seen and praised, let us also read and understand.

The Lord on the mount: much rather let us understand that the Lord on the mount is the Word on high. Accordingly, what was done on the mount does not, as it were, lie low, nor is to be cursorily passed by, but must be looked up to. He saw the multitude, knew them to be hungering, mercifully fed them: not only in virtue of His goodness, but also of His power. For what would mere goodness avail, where there was not bread with which to feed the hungry crowd? Did not power attend upon goodness, that crowd had remained fasting and hungry. In short, the disciples also, who were with the Lord, and hungry, themselves wished to feed the multitudes, that they might not remain empty, but had not wherewithal to feed them. The Lord asked, whence they might buy bread to feed the multitude. And the Scripture saith: "But this He said, proving him;" namely, the disciple Philip of whom He had asked; "for Himself knew what He would do." Of what advantage then was it to prove him, unless to show the disciple's ignorance? And, perhaps, in showing the disciple's ignorance He signified something more. This will appear, then, when the sacrament of the five loaves itself will begin to speak to us, and to intimate its meaning: for there we shall see why the Lord in this act wished to exhibit the disciple's ignorance, by asking what He Himself knew. For we sometimes ask what we do not know, that, being willing to hear, we may learn; sometimes we ask what we do know, wishing to learn whether he whom we ask also knows. The Lord knew both the one and the other; knew both what He asked, for He knew what Himself would do; and He also knew in like manner that Philip knew not this. Why then did He ask, but to show Philip's ignorance? And why He did this, we shall, as I have said, understand afterwards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252024.html'
source_title="Tractates on John 24"
