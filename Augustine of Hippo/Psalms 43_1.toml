[[commentary]]
quote='''
For if judgment were always to be taken in a bad sense, the psalm would not say, "Judge me, O God." Perhaps some one is surprised when he hears one say, "Judge me, O God." For man is wont to say, "Forgive me, O God;" "Spare me, O God." Who is it that says, "Judge me, O God"? Sometimes in the psalm this very verse even is placed in the pause, to be given out by the reader and responded by the people. Does it not perhaps strike some man's heart so much that he is afraid to sing and to say to God, "Judge me, O God"? And yet the people sing it with confidence, and do not imagine that they wish an evil thing in that which they have learned from the divine word; even if they do not well understand it, they believe that what they sing is something good. And yet even the psalm itself has not left a man without an insight into the meaning of it. For, going on, it shows in the words that follow what kind of judgment it spoke of; that it is not one of condemnation, but of discrimination. For saith it, "Judge me, O God." What means "Judge me, O God, and discern my cause from an unholy nation"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"

[[commentary]]
quote='''
This point may also be solved from the word itself. Thou hast penal judgment spoken of in the Gospel: "He that believeth not is judged already;" and in another place, "The hour is coming, when those who are in the graves shall hear His voice, and shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of judgment." You see how He has put judgment for condemnation and punishment. And yet if judgment were always to be taken for condemnation, should we ever have heard in the psalm, "Judge me, O God"? In the former place, judgment is used in the sense of inflicting pain; here, it is used in the sense of discernment. How so? Just because so expounded by him who says, "Judge me, O God." For read, and see what follows. What is this "Judge me, O God," but just what he adds, "and discern my cause against an unholy nation"? Because then it was said, "Judge me, O God, and discern [the true merits of] my cause against an unholy nation;" similarly now said the Lord Christ, "I seek not mine own glory: there is one that seeketh and judgeth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"

[[commentary]]
quote='''
This Psalm is a short one; it satisfies the mental cravings of the hearers, without imposing too severe a trial on the hunger of those fasting. Let our soul feed upon it; our soul, which he who sings in this Psalm, speaks of as “cast down;” cast down, I suppose, either in consequence of some fast, or rather in consequence of some hunger he was in. For fasting is a voluntary act; being an-hungered is an involuntary thing. That which is an-hungered, is the Church, is the Body of Christ: and that “Man” who is extended throughout the whole world, of which the Head is above, the limbs below: it is His voice which ought by this time to be perfectly known, and perfectly familiar, to us, in all the Psalms; now chanting joyously, now sorrowing; now rejoicing in hope, now sighing at its actual state, even as if it were our own. We need not then dwell long on pointing out to you, who is the speaker here: let each one of us be a member of Christ’s Body; and he will be speaker here.…

“Judge me, O Lord, and separate my cause from the ungodly nation” (ver. 1). I do not dread Thy judgment, because I know Thy mercy. “Judge me, O God,” he cries. Now, meanwhile, in this state of pilgrimage, Thou dost not yet separate my place, because I am to live together with the “tares” even to the time of the “harvest:” Thou dost not as yet separate my rain from theirs; my light from theirs: “separate my cause.” Let a difference be made between him who believes in Thee, and him who believes not in Thee. Our infirmity is the same; but our consciences not the same: our sufferings the same; but our longings not the same. “The desire of the ungodly shall perish,” but as to the desire of the righteous, we might well doubt, if He were not “sure” who promised. The object of our desires is He Himself, who promiseth: He will give us Himself, because He has already given Himself to us; He will give Himself in His immortality to us then immortal, even because He gave Himself in His mortality to us when mortal.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252043.html'
source_title="Exposition on Psalm 43"
