[[commentary]]
quote='''
“For they have not had understanding in the works of the Lord” (ver. 5). And whence is it clear that this hath befallen them? From this forsooth, “for they have not had understanding in the works of the Lord.” This very thing, in truth, hath been, even now, their recompense, that in Him whom they tempted with malicious intent as a Man, they should not recognise God, with what design the Father sent Him in the Flesh. “And the works of His hands.” Nor be moved by those visible works, which are laid out before their very eyes. “Thou shalt destroy them, and not build them up.” Let them do Me no hurt, nay, nor again in their endeavour to raise engines against My Church, let them aught avail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
