[[commentary]]
quote='''
Let us now come to the words, “Thy wife” (ver. 3): it is said unto Christ. His wife, therefore, is the Church: His Church, His wife, we ourselves are. “As a fruitful vineyard.” But in whom is the vineyard fruitful? For we see many barren ones entering those walls; we see that many intemperate, usurious persons, slave dealers, enter these walls, and such as resort to fortune-tellers, go to enchanters and enchantresses when they have a headache. Is this the fruitfulness of the vine? Is this the fecundity of the wife? It is not. These are thorns, but the vineyard is not everywhere thorny. It hath a certain fruitfulness, and is a fruitful vine; but in whom? “Upon the sides of thy house.” Not all are called the sides of the house. For I ask what are the sides. What shall I say? Are they walls, strong stones, as it were? If he were speaking of this bodily tenement, we should perhaps understand this by sides. We mean by the sides of the house, those who cling unto Christ.…

“Thy children.” The wife and the children are the same. In these carnal marriages and wedlocks, the wife is one, the children other: in the Church, she who is the wife, is the children also. For the Apostles belonged to the Church, and were among the members of the Church. They were therefore in His wife, and were His wife according to their own portion which they held in His members. Why then is it said concerning them, “When the Bridegroom shall be taken from them, then shall the children of the Bridegroom fast”? She who is the wife, then, is the children also. I speak a wonderful thing, my brethren. In the words of the Lord, we find the Church to be both His brethren, and His sisters, and His mother.…For Mary was among the sides of His House, and His relatives coming of the kindred of the Virgin Mary, who believed on Him, were among the sides of His House; not in respect of their carnal consanguinity, but inasmuch as they heard the Word of God, and obeyed it.…He added; “For whosoever shall do the will of My Father which is in heaven, the same is My brother, and sister, and mother.” “Brother,” perhaps, on account of the male sex whom the Church hath: “sister,” on account of the women whom Christ hath here in His members. How “mother,” save that Christ Himself is in those Christians, whom the Church daily bringeth forth Christians through baptism? In those therefore in whom thou understandest the wife, in them thou understandest the mother, in them the children.

…Such children ought therefore to be “around” the Lord’s “table, like olive-branches.” A complete Vine it is, a great bliss: who would now refuse to be there? When thou seest any blasphemer have a wife, children, grandchildren, and thyself perchance without them, envy them not; discern that the promise hath been fulfilled in thee also, but spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
