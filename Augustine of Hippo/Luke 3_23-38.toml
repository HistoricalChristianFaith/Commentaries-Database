[[commentary]]
quote='''
(ubi sup. c. 4.) Matthew indeed wished to set forth God descending to our mortality; accordingly at the beginning of the Gospel he recounted the generations from Abraham to the birth of Christ in a descending scale. But Luke, not at the beginning, but after the baptism of Christ, relates the generation not descending but ascending, as if marking out rather the high priest in the expiation of sins, of whom John bore testimony, saying, Behold, who taketh away the sins of the world. But by ascending he comes to God, to whom we are reconciled, being cleansed and expiated.

(Quæst. Ev. lib. ii. qu. 6.) But most fitly with regard to our baptized Lord does Luke reckon the generations through seventy-seven persons. For both the ascent to God is expressed, to whom we are reconciled by the abolition of sins, and by baptism is brought to man the remission of all his sins, which are signified by that number. For eleven times seven are seventy-seven. But by the tenth number is meant perfect happiness. Hence it is plain that the going beyond the tenth marks the sin of one through pride coveting to have more. But this is said to be seven times to signify that the transgression was caused by the moving of man. For by the third number the immortal part of man is represented, but by the fourth the body. But motion is not expressed in numbers, as when we say, one, two, three; but when we say, once, twice, thrice. And so by seven times eleven, is signified a transgression wrought by man's action.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And inasmuch as it was Matthew's intention to set forth Christ as descending with the object of sharing this mortal state with us, he has mentioned those same generations from Abraham on to Joseph, and on to the birth of Christ Himself, in the form of a descending scale, and at the very beginning of his Gospel. Luke, on the other hand, details those generations not at the commencement of his Gospel, but at the point of Christ's baptism, and gives them not in the descending, but in the ascending order, ascribing to Him preferentially the character of a priest in the expiation of sins, as where the voice from heaven declared Him, and where John himself delivered his testimony in these terms: "Behold the Lamb of God, that taketh away the sin of the world!" Besides, in the process by which he traces the genealogy upwards, he passes Abraham and carries us back to God, to whom, purified and atoned for, we are reconciled. Of merit, too, He has sustained in Himself the origination of our adoption; for we are made the sons of God through adoption, by believing on the Son of God. Moreover, on our account the Son of God was pleased to be made the son of man by the generation which is proper to the flesh. And the evangelist has shown clearly enough that he did not name Joseph the son of Heli on the ground that he was begotten of him, but only on the ground that he was adopted by him. For he has spoken of Adam also as the son of God, who, strictly speaking, was made by God, but was also, as it may be said, constituted a son in paradise by the grace which afterwards he lost through his transgression.

In this way, it is the taking of our sins upon Himself by the Lord Christ that is signified in the genealogy of Matthew, while in the genealogy of Luke it is the abolition of our sins by the Lord Christ that is expressed. In accordance with these ideas, the one details the names in the descending scale, and the other in the ascending. For when the apostle says, "God sent His Son in the likeness of the flesh of sin," he refers to the taking of our sins upon Himself by Christ. But when he adds, "for sin, to condemn sin in the flesh," he expresses the expiation of sins. Consequently Matthew traces the succession downwards from David through Solomon, in connection with whose mother it was that he sinned; while Luke carries the genealogy upwards to the same David through Nathan, by which prophet God took away his sin. The number, also, which Luke follows does most certainly best indicate the taking away of sins. For inasmuch as in Christ, who Himself had no sin, there is assuredly no iniquity allied to the iniquities of men which He bore in His flesh, the number adopted by Matthew makes forty when Christ is excepted. On the contrary, inasmuch as, by clearing us of all sin and purging us, He places us in a right relation to His own and His Father's righteousness (so that the apostle's word is made good: "But he that is joined to the Lord is one spirit"), in the number used by Luke we find included both Christ Himself, with whom the enumeration begins, and God, with whom it closes; and the sum becomes thus seventy-seven, which denotes the thorough remission and abolition of all sins. This perfect removal of sins the Lord Himself also clearly represented under the mystery of this number, when He said that the person sinning ought to be forgiven not only seven times, but even unto seventy times seven.

A careful inquiry will make it plain that it is not without some reason that this latter number is made to refer to the purging of all sins. For the number ten is shown to be, as one may say, the number of justice [righteousness] in the instance of the ten precepts of the law. Moreover, sin is the transgression of the law. And the transgression of the number ten is expressed suitably in the eleven; whence also we find instructions to have been given to the effect that there should be eleven curtains of haircloth constructed in the tabernacle; for who can doubt that the haircloth has a bearing upon the expression of sin? Thus, too, inasmuch as all time in its revolution runs in spaces of days designated by the number seven, we find that when the number eleven is multiplied by the number seven, we are brought with all due propriety to the number seventy-seven as the sign of sin in its totality. In this enumeration, therefore, we come upon the symbol for the full remission of sins, as expiation is made for us by the flesh of our Priest, with whose name the calculation of this number starts here; and as reconciliation is also effected for us with God, with whose name the reckoning of this number is here brought to its conclusion by the Holy Spirit, who appeared in the form of a dove on the occasion of that baptism in connection with which the number in question is mentioned.
'''
