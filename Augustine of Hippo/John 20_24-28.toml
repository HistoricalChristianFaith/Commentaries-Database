[[commentary]]
quote='''
"But Thomas, one of the twelve, who is called Didymus, was not with them when Jesus came. The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in His hands the print of the nails, and put my finger into the place of the nails, and put my hand into His side, I will not believe. And after eight days, again His disciples were within, and Thomas with them. Then came Jesus, the doors being shut, and stood in the midst, and said, Peace be unto you. Then saith He to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and put it into my side: and be not faithless, but believing. Thomas answered and said unto Him, My Lord and my God." He saw and touched the man, and acknowledged the God whom he neither saw nor touched; but by the means of what he saw and touched, he now put far away from him every doubt, and believed the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520121.html'
source_title="Tractates on John 121"
