[[commentary]]
quote='''
“Who maketh spirits His angels, and flaming fire His ministers” (ver. 4): that is, those who are already spirits, who are spiritual, not carnal, He maketh His Angels, by sending them to preach His gospel. “And flaming fire His ministers.” For unless the minister that preacheth be on fire, he enflameth not him to whom he preacheth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
