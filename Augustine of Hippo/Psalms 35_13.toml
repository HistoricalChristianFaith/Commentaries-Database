[[commentary]]
quote='''
But amid all these treacherous devices and temptations of his, what shall we do but that which we have heard in the psalm: "And I, when they were troublesome to me, clothed me in sackcloth, and humbled my soul in fasting." There is one that heareth prayer, hesitate not to pray; but He that heareth abideth within. You need not direct your eyes towards some mountain; you need not raise your face to the stars, or to the sun, or to the moon; nor must you suppose that you are heard when you pray beside the sea: rather detest such prayers. Only cleanse the chamber of thy heart; wheresoever thou art, wherever thou prayest, He that hears is within, within in the secret place, which the psalmist calls his bosom, when he says, "And my prayer shall be turned in my own bosom." He that heareth thee is not beyond thee; thou hast not to travel far, nor to lift thyself up, so as to reach Him as it were with thy hands. Rather, if thou lift thyself up, thou shalt fall; if thou humble thyself, He will draw near thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"

[[commentary]]
quote='''
“But I, when they troubled me, clothed myself with sackcloth, and humbled my soul with fasting, and my prayer shall return into mine own bosom” (ver. 13)…Brethren, if for some little space with pious curiosity we lift the veil, and search with the intent eye of the heart the inner part of this Scripture, we find that even this the Lord did. Sackcloth, haply He calleth His mortal flesh. Wherefore Sackcloth? For the likeness of sinful flesh. For the Apostle saith, “God sent His Son in the likeness of sinful flesh, that through sin He might condemn sin in the flesh:” that is, He clothed His Own Son with sackcloth, that through sackcloth He might condemn the goats. Not that there was sin, I say not in the Word of God, but not even in that Holy Soul and Mind of a Man, which the Word and Wisdom of God had so joined to Himself as to be One Person. Nay, nor even in His very Body was any sin, but the likeness of sinful flesh there was in the Lord; because death is not but by sin, and surely that Body was mortal. For had It not been mortal, It had not died; had It not died, It had not risen again; had It not risen again, It had not showed us an example of eternal life. So then death, which is caused by sin, is called sin; as we say the Greek tongue, the Latin tongue, meaning not the very member of flesh, but that which is done by the member of flesh. For the tongue in our members is one among others, as the eyes, nose, ears, and the rest: but the Greek tongue is Greek words, not that the tongue is words, but that words are by the tongue.…So then the sin of the Lord is that which was caused by sin; because He assumed flesh, of the same lump which had deserved death by sin. For to speak more briefly, Mary who was of Adam died for sin, Adam died for sin, and the Flesh of the Lord which was of Mary died to put away sin. With this sackcloth the Lord clothed Himself, and therefore was He not known, because He lay hid under sackcloth. “When they,” saith He, “troubled Me, I clothed Myself with sackcloth:” that is, they raged, I lay hid. For had He not willed to lie hid neither could He have died, since in one moment of time one drop only of His Power, if indeed it is to be called a drop, He put forth, when they wished to seize Him, and at His one question, “Whom seek ye?” they all went back and fell to the ground. Such power could He not have humbled in passion, if He had not lain hid under sackcloth.

Again, if we have understood the sackcloth, how understand we the fasting? Wished Christ to eat, when He sought fruit on the tree, and if He had found, would He have eaten? Wished Christ to drink, when He said to the woman of Samaria, “Give Me to drink”? when He said on the Cross, “I thirst”? For what hungered, for what thirsted Christ, but our good works? Because in them that crucified and persecuted Him He had found no good works, He fasted; for they rewarded barrenness to His soul. For what a fast was His, who found barely one thief, whom on the Cross He might taste! For the Apostles had fled, and had hidden themselves in the multitude. And even Peter, who even to the death of his Lord had promised to persevere, had now thrice denied Him, had now wept, and still lay hid in the multitude, still feared lest He should be known. Lastly, having seen Him dead, all of them despaired of their own safety and despairing He found them, after His resurrection, and when He spake with them, found them grieving and mourning, no longer hoping anything.…In great fasting had the Lord remained, had He not refreshed them that He might feed on them. For He refreshed them, He comforted them, He confirmed them, and into His Own Body converted them. In this manner then was our Lord also in fasting.

“And My prayer shall return into Mine Own Bosom.” In the bosom of this verse is plainly a great depth, and may the Lord grant that it be fathomable by us. For in the “bosom” a secret is understood. And we ourselves, Brethren, are here well admonished to pray within our own bosom, where God seeth, where God heareth, where no human eye penetrateth, where none seeth but He who succoureth; where Susanna prayed, and her voice, though it was not heard by men, yet by God was heard.…We read also that in the mount Jesus prayed alone, we read that He passed the night in prayer, even at the time of His Passion. What then? “And My prayer shall return into Mine Own Bosom.” I know not what better to understand concerning the Lord: take meanwhile what now occurs; perhaps something better will occur hereafter, either to me or to some better: “My prayer shall return into Mine Own Bosom:” this I understand to be said, because in His Own Bosom He had the Father. “For God was in Christ reconciling the world unto Himself.” In Himself He had Him to whom He prayed. He was not far from Him, for Himself had said, “I am in the Father, and the Father in Me.” But because prayer rather belongeth to very Man (for according as Christ is the Word, He prayeth not, but heareth prayer; and seeketh not to be succoured for Himself, but with the Father succoureth all): what is, “My prayer shall return into Mine Own Bosom,” but in Me My Manhood invoketh in Me My Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
