[[commentary]]
quote='''
But amid all these treacherous devices and temptations of his, what shall we do but that which we have heard in the psalm: "And I, when they were troublesome to me, clothed me in sackcloth, and humbled my soul in fasting." There is one that heareth prayer, hesitate not to pray; but He that heareth abideth within. You need not direct your eyes towards some mountain; you need not raise your face to the stars, or to the sun, or to the moon; nor must you suppose that you are heard when you pray beside the sea: rather detest such prayers. Only cleanse the chamber of thy heart; wheresoever thou art, wherever thou prayest, He that hears is within, within in the secret place, which the psalmist calls his bosom, when he says, "And my prayer shall be turned in my own bosom." He that heareth thee is not beyond thee; thou hast not to travel far, nor to lift thyself up, so as to reach Him as it were with thy hands. Rather, if thou lift thyself up, thou shalt fall; if thou humble thyself, He will draw near thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
