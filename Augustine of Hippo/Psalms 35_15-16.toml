[[commentary]]
quote='''
But when we say this, they gnash upon us with their teeth; but the psalm which you have heard comforts us: "They gnashed upon me with their teeth." Yet we know how we may be cured, although the strokes of the lash are multiplied on Christ, for His word is made to bear the scourge: "The scourges," saith He, "were gathered together against me, and they knew not." He was scourged by the scourges of the Jews; He is now scourged by the blasphemies of false Christians: they multiply scourges for their Lord, and know it not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"
