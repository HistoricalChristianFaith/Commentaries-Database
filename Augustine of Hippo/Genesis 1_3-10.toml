[[commentary]]
quote='''
Still may He bless us: for blessing in multiplication is wont most chiefly and properly to be perceived. Let us prove this in Genesis; see the works of God: God made light, and God made a division between light and darkness: the light He called day, and the darkness He called night. It is not said, He blessed the light. For the same light returneth and changeth by days and nights. He calleth the sky the firmament between waters and waters: it is not said, He blessed the sky: He severed the sea from the dry land, and named both, the dry land earth, and the gathering together of the waters sea: neither here is it said, God blessed.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
