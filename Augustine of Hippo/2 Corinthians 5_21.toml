[[commentary]]
quote='''
“It is good for me that Thou hast humbled me: that I might learn Thy righteousnesses” (ver. 71). He hath said something kindred to this above. For by the fruit itself he showeth that it was a good thing for him to be humbled; but in the former passage he hath stated the cause also, in that he had felt beforehand that humiliation which resulted from his punishment, when he went wrong. But in these words, “Wherefore have I kept Thy word:” and again in these, “That I might learn Thy righteousnesses:” he seemeth to me to have signified, that to know these is the same thing as to keep them, to keep them the same thing as to know them. For Christ knew what He reproved; and yet He reproved sin, though it is said of Him that “He knew not sin.” He knew therefore by a kind of knowledge, and again He knew not by a kind of ignorance. Thus also many learn the righteousnesses of God, and learn them not. For they know them in a certain way; and, again do not know them from a kind of ignorance, since they do them not. In this sense the Psalmist therefore is to be understood to have said, “That I might learn Thy righteousnesses,” meaning that kind of knowledge whereby they are performed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"

[[commentary]]
quote='''
“Praise the Lord in His saints,” that is, in those whom He hath glorified: “praise Him in the firmament of His power” (ver. 1). “Praise Him in His deeds of strength;” or, as others have explained it, “in His deeds of power: praise Him according to the multitude of His greatness” (ver. 2). All these His saints are; as the Apostle saith, “But we may be the righteousness of God in Him.” If then they be the righteousness of God, which He hath wrought in them, why are they not also the strength of Christ which He hath wrought in them, that they should rise again from the dead? For in Christ’s resurrection, “strength” is especially set forth to us, for in His Passion was weakness, as the Apostle saith. And well doth it say, “the firmament of His power.” For it is the “firmament of His power” that He “dieth no more, death hath no more dominion over Him.” Why should not they also be called “the works of” God’s “strength,” which He hath done in them: yea rather, they themselves are the works of His strength; just as it is said, “We are the righteousness of God in Him.” For what more powerful than that He should reign for ever, with all His enemies put under His feet? Why should not they also be “the multitude of His greatness”? not that whereby He is great, but whereby He hath made them great, many as they are, that is, thousands of thousands. Just as righteousness too is understood in two ways, that whereby He is righteous, and that which He worketh in us, so as to make us His righteousness. These same saints are signified by all the musical instruments in succession, to praise God in. For what the Psalmist began with, saying, “Praise the Lord in His saints,” that he carrieth out, signifying in various ways these same saints of His.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520150.html'
source_title="Exposition on Psalm 150"

[[commentary]]
quote='''
Decline, therefore, neither to the right hand nor to the left, although the paths on the right hand are praised, and those on the left hand are blamed. This is why he added, "Turn away thy foot from the evil way,"—that is, from the left-hand path. This he makes manifest in the following words, saying, "For the Lord knoweth the ways on the right hand; but those on the left are perverse." In those ways we ought surely to walk which the Lord knows; and it is of these that we read in the Psalm, "The Lord knoweth the way of the righteous, but the way of the ungodly shall perish;" for this way, which is on the left hand, the Lord does not know. As He will also say at last to such as are placed on His left hand at the day of judgment: "I know you not." Now what is that which He knows not, who knows all things, both good and evil, in man? But what is the meaning of the words, "I know you not," unless it be that you are now such as I never made you? Precisely as that passage runs, which is spoken of the Lord Jesus Christ, that "He knew no sin." How knew it not, except that He had never made it? And, therefore, how is to be understood the passage, "The ways which are on the right hand the Lord knoweth," except in the sense that He made those ways Himself,—even "the paths of the righteous," which no doubt are "those good works that God," as the apostle tells us, "hath before ordained that we should walk in them"? Whereas the left-hand ways—those perverse paths of the unrighteous—He truly knows nothing of, because He never made them for man, but man made them for himself. Wherefore He says, "The perverse ways of the wicked I utterly abhor; they are on the left hand."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Letter 2, Section 6"
