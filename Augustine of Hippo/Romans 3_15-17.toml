[[commentary]]
quote='''
These that are men of bloods and of deceit, let them not suppose that we thus wrongly understand men of bloods, of them that kill souls: they themselves of their Maximianists have so understood it. For when they condemned them, in the very sentence of their Council they have set down these words: “Swift are the feet of them to shed the blood” (of the proclaimers), “tribulation and calamity are in the ways of them, and the way of peace they have not known.” This of the Maximianists they have said. But I ask of them, when have the Maximianists shed the body’s blood; not because they too would not shed, if there were so great a multitude as could shed, but because of the fear in their minority rather they have suffered somewhat from others, than have themselves at any time done any such thing. Therefore I question the Donatist and say: In thy Council thou hast set down of the Maximianists, “Swift are the feet of them to shed blood.” Show me one of whom the Maximianists have hurt so much as a finger! What other thing to me is he to answer, than that which I say? They that have separated themselves from unity, and who slay souls by leading astray, spiritually, not carnally, do shed blood. Very well thou hast expounded, but in thy exposition acknowledge their own deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
