[[commentary]]
quote='''
"And if I go," He says "and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also. And whither I go ye know, and the way ye know." O Lord Jesus, how goest Thou to prepare a place, if there are already many mansions in Thy Father's house, where Thy people shall dwell with Thyself? Or if Thou receivest them unto Thyself, how wilt Thou come again, who never withdrawest Thy presence? Such subjects as these, beloved, were we to attempt to explain them with such brevity as seems within the proper bounds of our discourse to-day, would certainly suffer in clearness from compression, and the very brevity would become itself a second obscurity; we shall therefore defer this debt, which the bounty of our Family head will enable us to repay at a more suitable opportunity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252067.html'
source_title="Tractates on John 67"

[[commentary]]
quote='''
But why is it that He went away to make such preparation, when, as it is certainly we ourselves that are the subjects in need of preparation, His doing so will be hindered by leaving us behind? I explain it, Lord, as I can: it was surely this Thou didst signify by the preparation of those mansions, that the just ought to live by faith. For he who is sojourning at a distance from the Lord has need to be living by faith, because by this we are prepared for beholding His countenance. For "blessed are the pure in heart, for they shall see God;" and "He purifieth their hearts by faith." The former we find in the Gospel, the latter in the Acts of the Apostles. But the faith by which those who are yet to see God have their hearts purified, while sojourning at a distance here, believeth what it doth not see; for if there is sight, there is no longer faith. Merit is accumulating now to the believer, and then the reward is paid into the hand of the beholder. Let the Lord then go and prepare us a place; let Him go, that He may not be seen; and let Him remain concealed, that faith may be exercised. For then is the place preparing, if it is by faith we are living. Let the believing in that place be desired, that the place desired may itself be possessed; the longing of love is the preparation of the mansion. Prepare thus, Lord, what Thou art preparing; for Thou art preparing us for Thyself, and Thyself for us, inasmuch as Thou art preparing a place both for Thyself in us, and for us in Thee. For Thou hast said, "Abide in me, and I in you." As far as each one has been a partaker of Thee, some less, some more, such will be the diversity of rewards in proportion to the diversity of merits; such will be the multitude of mansions to suit the inequalities among their inmates; but all of them, none the less, eternally living, and endlessly blessed. Why is it that Thou goest away? Why is it Thou comest again? If I understand Thee aright, Thou withdrawest not Thyself either from the place Thou goest from, or from the place Thou comest from: Thou goest away by becoming invisible, Thou comest by again becoming manifest to our eyes. But unless Thou remainest to direct us how we may still be advancing in goodness of life, how will the place be prepared where we shall be able to dwell in the fullness of joy? Let what we have said suffice on the words which have been read from the Gospel as far as "I will come again, and receive you to myself." But the meaning of what follows, "That where I am, there ye may be also; and whither I go ye know, and the way ye know," we shall be in a better condition-after the question put by the disciple, that follows, and which we also may be putting, as it were, through him-for hearing, and more suitably situated for making the subject of our discourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252068.html'
source_title="Tractates on John 68"
