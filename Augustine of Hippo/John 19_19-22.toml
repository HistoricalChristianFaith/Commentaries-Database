[[commentary]]
quote='''
What reference hath this to Christ? If all things which then were being done, were figures of things future, we find there Christ, and by far in the greatest degree. For this, “corrupt not for the inscription of the title,” I see not how it belongeth to that David. For not any “title” was inscribed over David himself which Saul would “corrupt.” But we see in the Passion of the Lord that there had been written a title, “King of the Jews:” in order that this title might put to the blush these very men, seeing that from their King they withheld not their hands. For in them Saul was, in Christ David was. For Christ, as saith the Apostolic Gospel, is, as we know, as we confess, of the seed of David after the flesh; for after the Godhead He is above David, above all men, above heaven and earth, above angels, above all things visible and invisible.…And because already it had been sung through the Holy Spirit, “Unto the end, corrupt not, for the inscription of the title:” Pilate answered them, “What I have written, I have written:” why do ye suggest to me falsehood? I corrupt not truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"

[[commentary]]
quote='''
For what the inscription of this title is, which to be corrupted he forbiddeth, the Gospel to us doth indicate. For when the Lord was being crucified, a title by Pilate was inscribed and set, “King of the Jews,” in three tongues, Hebrew, Greek, and Latin: which tongues in the whole world mostly do prevail.…Therefore “corrupt not” is most proper and prophetic; since indeed even those Jews made suggestion at that time to Pilate, and said, “Do not write King of the Jews, but write, that Himself said that He was King of the Jews:” for this title, say they, hath established Him King over us. And Pilate, “What I have written, I have written.” And there was fulfilled, “corrupt not.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
