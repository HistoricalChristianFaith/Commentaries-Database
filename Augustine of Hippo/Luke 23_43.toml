[[commentary]]
quote='''
"Recognize to whom you are commending yourself. You believe I am going to come, but even before I come, I am everywhere. That is why, although I am about to descend into hell, I have you with me in paradise today. You are with me and not entrusted to someone else. You see, my humility has come down to mortal human beings and to the dead, but my divinity has never departed from paradise."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520285.html'
source_title="SERMON 285.2"

[[commentary]]
quote='''
But if any one would inquire, let him inquire rather how he may be with Him; not everywhere as He is, but wherever He may be. For when He said to the man that was expiating his crimes on the tree, and making confession unto salvation, "Today shalt thou be with me in paradise," in respect to His human nature His own soul was on that very day to be in hell, His flesh in the sepulchre; but as respected His Godhead He was certainly also in paradise. And therefore the soul of the thief, absolved from his by-gone crimes, and already in the blessed enjoyment of His grace, although it could not be everywhere as He was, yet could on that very day be also with Him in paradise, from which He, who is always everywhere, had not withdrawn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520111.html'
source_title="Tractates on John 111"
