[[commentary]]
quote='''
(Tr. cxxi) He saith not, Hast touched me, but, hast seen me; the sight being a kind of general sense, and put in the place often of the other four senses; as when we say, Hear, and see how well it sounds; smell, and see how sweet it smells; taste, and see how well it tastes; touch, and see how warm it is. Wherefore also our Lord says, Reach hither thy finger, and behold My hands. What is this but, Touch and see? And yet he had not eyes in his finger. He refers them both to seeing and to touching, when He says, Because thou hast seen, thou hast believed. Although it might be said, that the disciple did not dare to touch, what was offered to be touched.

He uses the past tense, the future to His knowledge having already taken place by His own predestination.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Jesus saith unto him, Because thou hast seen me, thou hast believed." He saith not, Thou hast touched me, but, "Thou hast seen me," because sight is a kind of general sense. For sight is also habitually named in connection with the other four senses: as when we say, Listen, and see how well it sounds; smell it, and see how well it smells; taste it, and see how well it savors; touch it, and see how hot it is. Everywhere has the word, See, made itself heard, although sight, properly speaking, is allowed to belong only to the eyes. Hence here also the Lord Himself says, "Reach hither thy finger, and behold my hands:" and what else does He mean but, Touch and see? And yet he had no eyes in his finger. Whether therefore it was by looking, or also by touching, "Because thou hast seen me," He says, "thou hast believed." Although it may be affirmed that the disciple dared not so to touch, when He offered Himself for the purpose; for it is not written, And Thomas touched Him. But whether it was by gazing only, or also by touching that he saw and believed, what follows rather proclaims and commends the faith of the Gentiles: "Blessed are they that have not seen, and yet have believed." He made use of words in the past tense, as One who, in His predestinating purpose, knew what was future, as if it had already taken place. But the present discourse must be kept from the charge of prolixity: the Lord will give us the opportunity to discourse at another time on the topics that remain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520121.html'
source_title="Tractates on John 121"
