[[commentary]]
quote='''
(Tr. xxv. 8) So He Who had fled to the mountain, mixes and converses with the multitude. Only just now they would have kept Him, and made Him king. But after the sacrament of the miracle, He begins to discourse, and fills their souls with His word, whose bodies He had satisfied with bread.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And when the multitudes had found Him." Behold, He presents Himself to the people from whom He had escaped into the mountain, afraid that He should be taken of them by force. In every way He proves to us and gives us to know that all these things are said in a mystery, and done in a great sacrament (or mystery) to signify something important. Behold, that is He who had escaped the crowds unto the mountain; is He not speaking with the same crowds? Let them hold Him now; let them now make Him a king. "And when they had found Him on the other side of the sea, they said unto Him Rabbi, when camest Thou hither?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
