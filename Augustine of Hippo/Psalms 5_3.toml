[[commentary]]
quote='''
Of that day, indeed, which is to arise, it is said. "In the morning I will stand near thee, and contemplate thee." What means "in the morning"? When the night of this world is over, when the terrors of temptations are over, when that lion which goeth about roaring in the night, seeking whom it may devour, is vanquished. "In the morning I will stand near thee, and contemplate."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252034.html'
source_title="Tractates on John 34"
