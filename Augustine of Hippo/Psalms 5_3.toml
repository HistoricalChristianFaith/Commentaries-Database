[[commentary]]
quote='''
Of that day, indeed, which is to arise, it is said. "In the morning I will stand near thee, and contemplate thee." What means "in the morning"? When the night of this world is over, when the terrors of temptations are over, when that lion which goeth about roaring in the night, seeking whom it may devour, is vanquished. "In the morning I will stand near thee, and contemplate."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252034.html'
source_title="Tractates on John 34"

[[commentary]]
quote='''
“Because I will pray unto Thee (ver. 3). O Lord, in the morning Thou wilt hear my voice.” What does that, which he said above, “Hear Thou,” mean, as if he desired to be heard immediately? But now he saith, “in the morning Thou wilt hear;” not, hear Thou: and, “I will pray unto Thee;” not, I do pray unto Thee: and, as follows, “in the morning I will stand by Thee, and will see;” not, I do stand by Thee, and do see. Unless perhaps his former prayer marks the invocation itself: but being in darkness amidst the storms of this world, he perceives that he does not see what he desires, and yet does not cease to hope, “For hope that is seen, is not hope.” Nevertheless, he understands why he does not see, because the night is not yet past, that is, the darkness which our sins have merited. He says therefore, “Because I will pray unto Thee, O Lord;” that is, because Thou art so mighty to whom I shall make my prayer, “in the morning Thou wilt hear my voice.” Thou art not He, he says, that can be seen by those, from whose eyes the night of sins is not yet withdrawn: when the night then of my error is past, and the darkness gone, which by my sins I have brought upon myself, then “Thou wilt hear my voice.” Why then did he say above not, “Thou wilt hear,” but “hear Thou”? Is it that after the Church cried out, “hear Thou,” and was not heard, she perceived what must needs pass away to enable her to be heard? Or is it that she was heard above, but doth not yet understand that she was heard, because she doth not yet see by whom she hath been heard; and what she now says, “In the morning Thou wilt hear,” she would have thus taken, In the morning I shall understand that I have been heard? Such is that expression, “Arise, O Lord,” that is, make me arise. But this latter is taken of Christ’s resurrection: but at all events that Scripture, “The Lord your God proveth you, that He may know whether ye love Him,” cannot be taken in any other sense, than, that ye by Him may know, and that it may be made evident to yourselves, what progress ye have made in His love.

“In the morning I will stand by Thee, and will see” (ver. 3). What is, “I will stand,” but “I will not lie down”? Now what else is, to lie down, but to take rest on the earth, which is a seeking happiness in earthly pleasures? “I will stand by,” he says, “and will see.” We must not then cleave to things earthly, if we would see God, who is beheld by a clean heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
