[[commentary]]
quote='''
"These words spake his parents, because they feared the Jews: for the Jews had conspired already, that if any man did confess that He was Christ, he should be put out of the synagogue." It was no longer a bad thing to be put out of the synagogue. They cast out, but Christ received. "Therefore said his parents, He is of age, ask himself."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
