[[commentary]]
quote='''
"One have I asked of the Lord, this will I require." For one petition have I asked the Lord, this will I require. "That I may dwell in the house of the Lord all the days of my life" [Psalm 27:4]. That as long as I am in this life, no adversities may exclude me from the number of them who hold the unity and the truth of the Lord's faith throughout the world. "That I may contemplate the delight of the Lord." With this end, namely, that persevering in the faith, the delightsome vision may appear to me, which I may contemplate face to face. "And I shall be protected, His temple." And death being swallowed up in victory, I shall be clothed with immortality, being made His temple.
'''
source_url='https://www.newadvent.org/fathers/1801027.htm'
source_title="Exposition on Psalm 27"

[[commentary]]
quote='''
Brethren, we now believe, we do not see; for faith the reward will be to see what we believe The prophets knew this, but it was concealed before He came. For a certain lover sighing, says in the Psalms: "One thing have I desired of the Lord, that will I seek after." And dost thou ask what he seeks? For perhaps he seeks a land flowing with milk and honey carnally, although this is to be spiritually sought and desired; or perhaps the subjection of his enemies, or the death of foes, or the power and riches of this world. For he glows with love, and sighs greatly, and burns and pants. Let us see what he desires: "One thing have I desired of the Lord, that will I seek after." What is it that he doth seek after? "That I may dwell," saith he, "in the house of the Lord all the days of my life." And suppose that thou dwellest in the house of the Lord, from what source will thy joy there be derived? "That I may behold," saith he, "the beauty of the Lord."

My brethren, wherefore do you cry out, wherefore do you exult, wherefore do you love, unless that a spark of this love is there? What do you desire? I ask you. Can it be seen with the eyes? Can it be touched? Is it some fairness which delights the eyes? Are not the martyrs vehemently beloved; and when we commemorate them do we not burn with love? What is it that we love in them, brethren? Limbs torn by wild beasts? What is more revolting if thou askest the eyes of the flesh? what more fair if thou askest the eyes of the heart? How appears in your eyes a very fair young man who is a thief? How shocked are your eyes! Are the eyes of the flesh shocked? If you interrogate them, nothing is more shapely and better formed than that body; the symmetry of the limbs and the beauty of the color attract the eyes; and yet, when thou hearest that he is a thief, your mind recoils from the man. Thou beholdest on the other hand a bent old man, leaning upon a staff, scarcely moving himself, ploughed all over with wrinkles. Thou hearest that he is just: thou lovest and embracest him. Such are the rewards promised to us, my brethren: love such, sigh after such a kingdom, desire such a country, if you wish to arrive at that with which our Lord came, that is, at grace and truth. But if you covet bodily rewards from God, thou art still under the law, and therefore thou shalt not fulfill the law. For when thou seest those temporal things granted to those who offend God, thy steps falter, and thou sayest to thyself: Behold, I worship God, daily I run to church, my knees are worn with prayers, and yet I am constantly sick: there are men who commit murders, who are guilty of robberies, and yet they exult and have abundance; it is well with them. Was it such things that thou soughtest from God? Surely thou didst belong to grace. If, therefore, God gave to thee grace, because He gave freely, love freely. Do not for the sake of reward love God; let Him be the reward. Let thy soul say, "One thing have I desired of the Lord, that will I seek after; that I may dwell in the house of the Lord all the days of my life, that I may behold the beauty of the Lord." Do not fear that thine enjoyment will fail through satiety: such will be that enjoyment of beauty that it will ever be present to thee, and thou shalt never be satisfied; indeed thou shalt be always satisfied, and yet never satisfied. For if I shall say that thou shalt not be satisfied, it will mean famine; and if I shall say thou shalt be satisfied, I fear satiety: where neither satiety nor famine are, I know not what to say; but God has that which He can manifest to those who know not how to express it, yet believe that they shall receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
