[[commentary]]
quote='''
Matthew goes on with his account in the following terms: "And when He had sent the multitudes away, He went up into a mountain apart to pray: and when the evening was come, He was there alone. But the ship was now in the midst of the sea, tossed with waves: for the wind was contrary. And in the fourth watch of the night He came unto them, walking on the sea. And when the disciples saw Him walking on the sea, they were troubled, saying, It is a spirit;" and so on, down to the words, "They came and worshipped Him, saying, Of a truth Thou art the Son of God." In like manner, Mark, after narrating the miracle of the five loaves, gives his account of this same incident in the following terms: "And when it was late, the ship was in the midst of the sea, and He alone on the land. And He saw them toiling in rowing: for the wind was contrary to them," and so on. This is similar to Matthew's version, except that nothing is said as to Peter's walking upon the waters. But here we must see to it, that no difficulty be found in what Mark has stated regarding the Lord, namely, that, when He walked upon the waters, He would also have passed by them. For in what way could they have understood this, were it not that He was really proceeding in a different direction from them, as if minded to pass those persons by like strangers, who were so far from recognizing Him that they took Him to be a spirit? Who, however, is so obtuse as not to perceive that this bears a mystical significance? At the same time, too, He came to the help of the men in their perturbation and outcry, and said to them, "Be of good cheer, it is I; be not afraid." What is the explanation, therefore, of His wish to pass by those persons whom nevertheless He thus encouraged when they were in terror, but that that intention to pass them by was made to serve the purpose of drawing forth those cries to which it was meet to bear succour?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 47"
