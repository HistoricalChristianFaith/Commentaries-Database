[[commentary]]
quote='''
After this, Matthew continues the narrative, and mentions that in that hour He addressed the multitude as follows: "Are ye come out as against a thief with swords and staves for to take me? I sat daily with you teaching in the temple, and ye laid no hold on me." Then He added also certain words, which Luke introduces thus: "But this is your hour, and the power of darkness." Next comes the sentence given by Matthew: "But all this was done that the Scriptures of the prophets might be fulfilled. Then all the disciples forsook Him and fled." This last fact is recorded also by Mark. The same evangelist makes also the following addition: "And there followed Him a certain young man, having a linen cloth cast about his naked body; and when they laid hold on him, he left the linen cloth, and fled from them naked."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 5"
