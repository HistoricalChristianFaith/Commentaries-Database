[[commentary]]
quote='''
First comes in the natural body such as Adam was the first man to possess. Had he not sinned, he would never have died. Such a body we too possess, except that its nature as a result of sin has become so changed for the worse that it is now faced with inexorable death. Such a body Christ also deigned to assume for our sakes, not indeed by necessity but in virtue of his power. Afterward, however, comes the spiritual body such as that which Christ, our head, was the first to have been, but which we, his members, will have at the final resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252013.html'
source_title="City of God 13.23"

[[commentary]]
quote='''
Behold, we are made of clay: “The first man is of the earth, earthy: the second man is the Lord from heaven.” He sent even His own Son, Him who was made the second man, Him who was God before all things. For He was second in His coming, first in His returning: He died after many, He arose before all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
