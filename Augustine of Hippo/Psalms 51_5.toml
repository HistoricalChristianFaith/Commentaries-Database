[[commentary]]
quote='''
So it is because of this quite unique innocence that the psalm says, "Against you alone have I sinned and done what is evil in your presence, that you may be justified in your words and may overcome when you are judged," because he could find not a hint of evil in you [Jesus Christ]. Why could he find it in you, though, O human race? Because it goes on to say, "For I myself was conceived in iniquity, and in sins did my mother conceive me." It is David saying this. Inquire how David was born; you will discover that it was of a lawful wife, not of adultery. So in terms of what sort of propagation does he say "I was conceived in iniquity"? It can only be that there is here a kind of propagation or transmission of death, which every person contracts who is born of the union of man and woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520170.html'
source_title="SERMON 170:4"

[[commentary]]
quote='''
If to be innocent is to be a lamb, then John was a lamb, for was not he innocent? But who is innocent? To what extent innocent? All come from that branch and shoot, concerning which David sings, even with groanings, "Behold, I was shapen in iniquity; and in sin did my mother conceive me." Alone, then, was He, the Lamb who came, not so. For He was not conceived in iniquity, because not conceived of mortality; nor did His mother conceive Him in sin, whom the Virgin conceived, whom the Virgin brought forth; because by faith she conceived, and by faith received Him. Therefore, "Behold the Lamb of God." He is not a branch derived from Adam: flesh only did he derive from Adam, Adam's sin He did not assume.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"


[[commentary]]
quote='''
“For, behold, in iniquities I was conceived” (ver. 5). As though he were saying, They are conquered that have done what thou, David, hast done: for this is not a little evil and little sin, to wit, adultery and man-slaying. What of them that from the day that they were born of their mother’s womb, have done no such thing? even to them dost thou ascribe some sins, in order that He may conquer all men when He beginneth to be judged. David hath taken upon him the person of mankind, and hath heeded the bonds of all men, hath considered the offspring of death, hath adverted to the origin of iniquity, and he saith, “For, behold, in iniquities I was conceived.” Was David born of adultery; being born of Jesse, a righteous man, and his own wife? What is it that he saith himself to have been in iniquity conceived, except that iniquity is drawn from Adam? Even the very bond of death, with iniquity itself is engrained? No man is born without bringing punishment, bringing desert of punishment. A Prophet saith also in another place, “No one is clean in Thy sight, not even an infant, whose life is of one day upon earth.” For we know both by the Baptism of Christ that sins are loosed, and that the Baptism of Christ availeth the remission of sins. If infants are every way innocent, why do mothers run with them when sick to the Church? What by that Baptism, what by that remission is put away? An innocent one I see that rather weeps than is angry. What doth Baptism wash off? what doth that Grace loose? There is loosed the offspring of sin. For if that infant could speak to thee, it would say, and if it had the understanding which David had, it would answer thee, Why heedest thou me, an infant? Thou dost not indeed see my actions: but I in iniquity have been conceived, “And in sins hath my mother nourished me in the womb.”

Apart from this bond of mortal concupiscence was Christ born without a male, of a virgin conceiving by the Holy Ghost. He cannot be said to have been conceived in iniquity, it cannot be said, In sins His mother nourished Him in the womb, to whom was said, “The Holy Ghost shall come upon thee, and the Virtue of the Highest shall overshadow thee.” It is not therefore because it is sin to have to do with wives that men are conceived in iniquity, and in sins nourished in the womb by their mother; but because that which is made is surely made of flesh deserving punishment. For the punishment of the flesh is death, and surely there is in it liability to death itself. Whence the Apostle spoke not of the body as if to die, but as if dead: “The body indeed is dead,” he saith, “because of sin, but the Spirit is life because of righteousness.” How then without bond of sin is born that which is conceived and sown of a body dead because of sin? This chaste operation in a married person hath not sin, but the origin of sin draweth with it condign punishment. For there is no husband that, because he is an husband, is not subject to death, or that is subject to death for any other reason but because of sin. For even the Lord was subject to death, but not on account of sin: He took upon Him our punishment, and so looseth our guilt. With reason then, “In Adam all die, but in Christ shall all be made alive.” For, “Through one man,” saith the Apostle, “sin hath entered into this world, and through sin death, and so hath passed unto all men, in that all have sinned.” Definite is the sentence: “In Adam,” he saith, “all have sinned.” Alone then could such an infant be innocent, as hath not been born of the work of Adam.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"