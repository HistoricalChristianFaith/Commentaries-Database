[[commentary]]
quote='''
They make progress, but for a time. For what saith the Apostle? “But evil men and seducers shall make progress for the worse, themselves erring, and other men into error driving.” But “a blind man leading a blind man, together into a ditch they fall.” Deservedly they fall “into the pit of corruption.” What therefore saith he? They shall make progress for the worse: not however for long. For a little before he hath said, “But further they shall not make progress:” that is, “shall not halve their days.” Let the Apostle proceed and tell wherefore: “For the madness of them shall be manifest to all men, as also was that of the others.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
