[[commentary]]
quote='''
By Joseph He hath willed another people to be understood, hath willed that the people of the Gentiles be understood. Why the people of the Gentiles by Joseph? Because Joseph was sold into Egypt by his brethren. That Joseph whom the brethren envied, and sold him into Egypt, when sold into Egypt, toiled, was humbled; when made known and exalted, flourished, reigned. And by all these things he hath signified what? What but Christ sold by His brethren, banished from His own land, as it were into the Egypt of the Gentiles? There at first humbled, when the Martyrs were suffering persecutions: now exalted, as we see; inasmuch as there hath been fulfilled in Him, “There shall adore Him all kinds of the earth, all nations shall serve Him.” Therefore Joseph is the people of the Gentiles, but Israel the people of the Hebrew nation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
