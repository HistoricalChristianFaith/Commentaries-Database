[[commentary]]
quote='''
The Pelagians think that they know something great when they assert that "God would not command what He knew could not be done by man." Who can be ignorant of this? But God commands some things which we cannot do, in order that we may know what we ought to ask of Him. For this is faith itself, which obtains by prayer what the law commands. He, indeed, who said, "If thou wilt, thou shalt keep the commandments," did in the same book of Ecclesiasticus afterwards say, "Who shall give a watch before my mouth, and a seal of wisdom upon my lips, that I fall not suddenly thereby, and that my tongue destroy me not." Now he had certainly heard and received these commandments: "Keep thy tongue from evil, and thy lips from speaking guile." Forasmuch, then, as what he said is true: "If thou wilt, thou shalt keep the commandments," why does he want a watch to be given before his mouth, like him who says in the Psalm, "Set a watch, O Lord, before my mouth"? Why is he not satisfied with God's commandment and his own will; since, if he has the will, he shall keep the commandments? How many of God's commandments are directed against pride! He is quite aware of them; if he will, he may keep them. Why, therefore, does he shortly afterwards say, "O God, Father and God of my life, give me not a proud look"? The law had long ago said to him, "Thou shalt not covet;" let him then only will, and do what he is bidden, because, if he has the will, he shall keep the commandments. Why, therefore, does he afterwards say, "Turn away from me concupiscence"? Against luxury, too, how many commandments has God enjoined! Let a man observe them; because, if he will, he may keep the commandments. But what means that cry to God, "Let not the greediness of the belly nor lust of the flesh take hold on me!"? Now, if we were to put this question to him personally, he would very rightly answer us and say, From that prayer of mine, in which I offer this particular petition to God, you may understand in what sense I said, "If thou wilt, thou mayest keep the commandments." For it is certain that we keep the commandments if we will; but because the will is prepared by the Lord, we must ask of Him for such a force of will as suffices to make us act by the willing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 32"
