[[commentary]]
quote='''
But, when once they had become submissive after reflecting on that thought, they would find the church promised to all nations, not in slanders and in human fables but in the sacred Books, and they would see it set before their eyes. Then they would not doubt that Christ, as promised in those Books, though unseen, is now above the heavens. Why in the world, then, should I begrudge them salvation, by recalling my colleagues from this sort of fatherly duty, when it is through this that we see many renouncing their former blindness? Yet some who believed, without seeing, that Christ is raised above the heavens, still denied his glory over all the earth, which they did see, although the prophet, with strong significance, included both in one sentence when he said, "Be exalted, O God, above the heavens, and your glory over all the earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 93"

[[commentary]]
quote='''
Wherefore, as we have nothing to say in this place of those who malign and blaspheme Christ,-for it is of His glory we speak, wherewith He was glorified in the world,-it was only in the holy Catholic Church that the Holy Spirit glorified Him with His true glory. For elsewhere, that is, either among heretics or certain pagans, the glory He has in the world cannot be a true one, even where there is a generally accepted fame of Him accompanied with praise. His true glory, therefore, in the Catholic Church is celebrated in these words by the prophet: "Be thou exalted, O God, above the heavens; and Thy glory above all the earth." Accordingly, that after His exaltation the Holy Spirit was to come, and to glorify Him, the sacred psalm, and the Only-begotten Himself, promised as an event of the future, which we see accomplished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520100.html'
source_title="Tractates on John 100"
