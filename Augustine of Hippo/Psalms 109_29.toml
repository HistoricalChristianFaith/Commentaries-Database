[[commentary]]
quote='''
“Let my slanderers be clothed with shame” (ver. 28): that is, let it shame them to have slandered me. But this may also be understood as a blessing, in that they are amended. “And let them cover themselves with their own confusion, as with a double cloak;” for diplois is a double cloak; that is, let them be confounded both within and without: both before God and before men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
