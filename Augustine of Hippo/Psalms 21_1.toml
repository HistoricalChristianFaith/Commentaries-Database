[[commentary]]
quote='''
To the end, a psalm of David himself.

The title is a familiar one; the Psalm is of Christ.

“O Lord, the King shall rejoice in Thy strength” (ver. 1). O Lord, in Thy strength, whereby the Word was made flesh, the Man Christ Jesus shall rejoice. “And shall exult exceedingly in Thy salvation.” And in that, whereby Thou quickenest all things, shall exult exceedingly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
