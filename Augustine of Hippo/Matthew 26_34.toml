source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
All this is recorded almost in the same language also by Mark, only that he has not put in so general a form what the Lord said with regard to the manner in which the event [of Peter's failure] was to be brought about, but has given it a more particular turn. For his version is this: "Verily I say unto thee, That this day, even in this night, before the cock crow twice, thou shalt deny me thrice." Thus it appears that all of them tell us how the Lord foretold that Peter would deny Him before the cock crew, but that they do not all mention how often the cock was to crow, and that Mark is the only one who has presented a more explicit notice of this incident in the narrative. Hence some are of opinion that Mark's statement is not in harmony with those of the others. But this is simply because they do not give sufficient attention to the facts of the case, and, above all, because they approach the question under the cloud of a prejudiced mind, in consequence of their being possessed by a hostile disposition towards the gospel. The fact is, that Peter's denial, when taken as a whole, is a threefold denial. For he remained in the same state of mental agitation, and harboured the same mendacious intention, until what had been foretold regarding him was brought to his mind, and healing came to him by bitter weeping and sorrow of heart. It is evident, however, that if this complete denial—that is to say, the threefold denial—is taken to have commenced only after the first crowing of the cock, three of the evangelists will appear to have given an incorrect account of the matter. For Matthew's version is this: "Verily I say unto thee, That this night, before the cock crow, thou shalt deny me thrice;" and Luke puts it thus: "I tell thee, Peter, the cock shall not crow this day, before that thou shalt thrice deny that thou knowest me;" and John presents it in this form: "Verily, verily, I say unto thee, the cock shall not crow till thou hast denied me thrice." And thus, in different terms and with words introduced in diverse successions, these three evangelists have expressed one and the same sense as conveyed by the words which the Lord spake—namely, the fact that, before the cock should crow, Peter was to deny Him thrice. On the other hand, if [we suppose that] he went through the whole triple denial before the cock began to crow at all, then Mark will be made to underlie the charge of having given a superfluous statement when he puts these words into the Lord's mouth: "Verily I say unto thee, That this day, before the cock crow twice, thou shall deny me thrice." For to what purpose would it be to say, "before the cock crow twice," when, on the supposition that this entire threefold denial was gone through previous to the first crowing of the cock, it is self-evident that a negation, which would thus be proved to have been completed before the first cockcrow, must also, as matter of course, be understood to have been fully uttered before the second cockcrow and before the third, and, in short, before all the cockcrowings which took place on that same night? But, inasmuch as this threefold denial was begun previous to the first crowing of the cock, those three evangelists concerned themselves with noticing, not the time at which Peter was to complete it, but the extent to which it was to be carried, and the period at which it was to commence; that is to say, their object was to bring out the facts that it was to be thrice repeated, and that it was to begin previous to the cockcrowing. At the same time, so far as the man's own mind is concerned, we might also quite well understand it to have been engaged in, as a whole, previous to the first cockcrow. For although it is true that, so far as regards the actual utterance of the individual who was guilty of the denial, that threefold negation was only entered upon previous to the first cockcrow, and really finished before the second cockcrow, still it is equally true that, in so far as the disposition of mind and the apprehensions indulged by Peter were concerned, it was conceived, as a whole, before the first cockcrow. Neither is it a matter of any consequence of what duration those intervals of delay were which elapsed between the several utterances of that thrice-recurring voice, if it is the case that the denial completely possessed his heart even previous to the first cockcrow,—in consequence, indeed, of his having imbibed a spirit of terror so abject as to make him capable of denying the Lord when he was questioned regarding Him, not only once, but a second time, and even a third time. Thus, a more correct and careful consideration of the matter might show us that, precisely as it is declared that the man who looketh on a woman to lust after her has committed adultery with her already in his heart, so, in the present instance, inasmuch as in the words which he spoke, Peter merely expressed the apprehension which he had already conceived with such intensity in his mind as to make it capable of enduring even on to a third repetition of his denial of the Lord, this threefold negation is to be assigned as a whole to that particular period at which the fear that sufficed thus to carry him on to a threefold denial took possession of him. In this way, too, it may be made apparent that, even if the words in which the denial was couched began to break forth from him only after the first cockcrow, when his heart was smitten by the inquiries addressed to him, it would involve neither any absurdity nor any untruthfulness, although it were said that before the cock crew he denied Him thrice, seeing that, in any case, previous to the crowing of the cock, his mind had been assailed by an apprehension violent enough to be able to draw him on even to a third denial. All the less, therefore, ought we to feel any difficulty in the matter, if it appears that the threefold denial, as expressed also in the thrice-recurring utterances of the person who made the denial, was entered upon previous to the crowing of the cock, although it was not completed before the first cockcrow. We may take a parallel case, and suppose an intimation to be made to the following effect to a person: "This night, before the cock crow, you will write a letter to me, in which you will revile me thrice." Well, surely in this instance, if the man began to write the letter before the cock had crowed at all, and finished it after the cock had crowed for the first time, that would be no reason for alleging that the intimation previously made was false. The fact, therefore, is that, in putting these words into the Lord's lips, "Before the cock crow twice, thou shalt deny me thrice," Mark has given us a plainer indication of the intervals of time which separated the utterances themselves. And when we come to the said section of the evangelical narrative, we shall see that the circumstances are presented in a manner which exhibits, in that connection also, the harmony subsisting among the evangelists.

If, however, the demand is to get at the very words, literally and completely, which the Lord addressed to Peter, we answer that it is impossible to discover these; and further, that it is simply superfluous to ask them, inasmuch as the speaker's meaning—to intimate which was the object He had in view in uttering the words—admits of being understood with the utmost plainness, even under the diverse terms employed by the evangelists. And whether, then, it be the case that Peter, instigated at different occasions in the course of the Lord's sayings, made his presumptuous declaration three several times, and had his denial foretold him thrice over by the Lord, as is the more probable result to which our investigation points us; or whether it may appear that the accounts given by all the evangelists are capable of being reduced to a single statement, when a certain order of narration is adopted, so that it could be proved that it was only on one occasion that the Lord predicted to Peter, on the exhibition of his presumptuous spirit, the fact that he would deny Him;—in either case, any contradiction between the evangelists will fail to be detected, as nothing of that nature really exists.
'''
