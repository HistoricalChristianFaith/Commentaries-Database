[[commentary]]
quote='''
(Serm. 197. 2.) He chose not kings, senators, philosophers, or orators, but he chose common, poor, and untaught fishermen.

(Aug. Tract. in Joann. vii. 17.) Had one learned been chosen, he might have attributed the choice to the merit of his learning. But our Lord Jesus Christ, willing to bow the necks of the proud, sought not to gain fishermen by orators, but gained an Emperor by a fisherman. Great was Cyprian the pleader, but Peter the fisherman was before him.

(Ev. ii. 17.) It might move enquiry, why John relates that near Jordan, not in Galilee, Andrew followed the Lord with another whose name he does not mention; and again, that Peter received that name from the Lord. Whereas the other three Evangelists write that they were call d rom their fishing, sufficiently agreeing with one another, especially Matthew and Mark; Luke not naming Andrew, who is however understood to have been in the same vessel with him. There is a further seeming discrepancy, that in Luke it is to Peter only that it is said, Henceforth thou shalt catch men; Matthew and Mark write that it was said to both. As to the different account in John, it should be carefully considered, and it will be found that it is a different time, place, and calling that is there spoken of. For Peter and Andrew had not so seen Jesus at the Jordan that they adhered inseparably ever after, but so as only to have known who He was, and wondering at Him to have gone their way. Perhaps he is returning back to something he had omitted, for he proceeds without marking any difference of time, As he walked by the sea of Galilee. It may be further asked, how Matthew and Mark relate that He called them separately two and two, when Luke relates that James and John being partners of Peter were called as it were to aid him, and bringing their barks to land followed Christ. We may then understand that the narrative of Luke relates to a prior time, after which they returned to their fishing as usual. For it had not been said to Peter that he should no more catch fishes, as he did do so again after the resurrection, but that he should catch men. Again, at a time after this happened that call of which Matthew and Mark speak; for they draw their ships to land to follow Him, not as careful to return again, but only anxious to follow Him when He bids them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The question may indeed be raised as to how John gives us this account of the calling of the disciples, which is to the effect that, certainly not in Galilee, but in the vicinity of the Jordan, Andrew first of all became a follower of the Lord, together with another disciple whose name is not declared; that, in the second place, Peter got that name from Him; and thirdly, that Philip was called to follow Him; whereas the other three evangelists, in a satisfactory concord with each other, Matthew and Mark in particular being remarkably at one here, tell us that the men were called when they were engaged in fishing. Luke, it is true, does not mention Andrew by name. Nevertheless, we can gather that he was in that same vessel, from the narrative of Matthew and Mark, who furnish a concise history of the manner in which the affair was gone about. Luke, however, presents us with a fuller and clearer exposition of the circumstances, and gives us also an account of the miracle which was performed there in the haul of fishes, and of the fact that previous to that the Lord spake to the multitudes when He was seated in the boat. There may also seem to be a discrepancy in this respect, that Luke records the saying, "From henceforth thou shalt catch men," as if it had been addressed by the Lord to Peter alone, while the others have exhibited it as spoken to both the brothers. But it may very well be the case that these words were spoken first to Peter himself, when he was seized with amazement at the immense multitude of fishes which were caught, and this will then be the incident introduced by Luke; and that they were addressed to the two together somewhat later, which [second utterance] will be the one noticed by the other two evangelists. Therefore the circumstance which we have mentioned with regard to John's narrative deserves to be carefully considered; for it may indeed be supposed to bring before us a contradiction of no slight importance. For if it be the case that in the vicinity of the Jordan, and before Jesus went into Galilee, two men, on hearing the testimony of John the Baptist, followed Jesus; that of these two disciples the one was Andrew, who at once went and brought his own brother Simon to Jesus; and that on this occasion that brother received the name Peter, by which he was thereafter to be called,—how can it be said by the other evangelists that He found them engaged in fishing in Galilee, and called them there to be His disciples? How can these diverse accounts be reconciled, unless it be that we are to understand that those men did not gain such a view of Jesus on the occasion connected with the vicinity of the Jordan as would lead them to attach themselves to Him for ever, but that they simply came to know who He was, and, after their first wonder at His Person, returned to their former engagements?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 17"

[[commentary]]
quote='''
But the question may be asked, how He called the fishermen from their boats two by two, namely, calling Peter and Andrew first, and then going forward a little and calling other two, namely the sons of Zebedee, according to the narratives of Matthew and Mark; whereas Luke's version of the matter is, that both their boats were filled with the immense haul of fishes. And his statement bears further, that Peter's partners, to wit, James and John, the sons of Zebedee, were summoned to the men's help when they were unable to drag out their crowded nets, and that all who were there were astonished at the enormous draught of fishes which had been taken; and that when Jesus said to Peter, "Fear not, from henceforth thou shall catch men,"although the words had been addressed to Peter alone, they all nevertheless followed Him when they had brought their ships to land. Well, we are to understand by this, that what Luke introduces here was what took place first, and that these men were not called by the Lord on this occasion, but only that the prediction was uttered to Peter by himself, that he would be a fisher of men. That saying, moreover, was not intended to convey that they would never thereafter be catchers of fish. For we read that even after the Lord's resurrection they were engaged again in fishing. The words, therefore, imported simply that thereafter he would catch men, and they did not bear that henceforth he would not catch fish. And in this way we are at perfect liberty to suppose that they returned to the catching of fish, according to their habit; so that those incidents which are related by Matthew and Mark might easily take place at a period subsequent to this. I refer to what occurred at the time when He called the disciples two by two, and Himself gave them the command to follow Him, at first addressing Peter and Andrew, and then the others, namely, the two sons of Zebedee. For on that occasion they did not follow Him only after they had drawn up their ships on shore, as with the intention of returning to them, but they went after Him immediately, as after one who summoned and commanded them to follow Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 17"
