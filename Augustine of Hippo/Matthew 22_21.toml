[[commentary]]
quote='''
We are God's money: we have wandered away as coin from the treasury. The impression that was stamped upon us has been rubbed out by our wandering. He has come to refashion, for He it was that fashioned us at first; and He is Himself asking for His money, as Caesar for his. Therefore He says, "Render unto Caesar the things that are Caesar's, and unto God the things that are God's:" to Caesar his money, to God yourselves. And then shall the truth be reproduced in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252040.html'
source_title="Tractates on John 40"
