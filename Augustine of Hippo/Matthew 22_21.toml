[[commentary]]
quote='''
We are God's money: we have wandered away as coin from the treasury. The impression that was stamped upon us has been rubbed out by our wandering. He has come to refashion, for He it was that fashioned us at first; and He is Himself asking for His money, as Caesar for his. Therefore He says, "Render unto Caesar the things that are Caesar's, and unto God the things that are God's:" to Caesar his money, to God yourselves. And then shall the truth be reproduced in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252040.html'
source_title="Tractates on John 40"


[[commentary]]
quote='''
“The light of Thy countenance,” saith he, “is stamped on us, O Lord.” This light is the whole and true good of man, which is seen not with the eye, but with the mind. But he says, “stamped on us,” as a penny is stamped with the king’s image. For man was made after the image and likeness of God, which he defaced by sin: therefore it is his true and eternal good, if by a new birth he be stamped. And I believe this to be the bearing of that which some understand skilfully; I mean, what the Lord said on seeing Cæsar’s tribute money, “Render to Cæsar the things that are Cæsar’s; and to God the things that are God’s.” As if He had said, In like manner as Cæsar exacts from you the impression of his image, so also does God: that as the tribute money is rendered to him, so should the soul to God, illumined and stamped with the light of His countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25204.html'
source_title="Exposition on Psalm 4"

[[commentary]]
quote='''
and indeed whosoever well considereth what he is vowing to the Lord, and what vows he is paying, let him vow himself, let him pay himself as a vow: this is exacted, this is due. On looking at the coin, the Lord saith, “Render unto Cæsar the things which are Cæsar’s, and unto God the things which are God’s:” his own image is rendered unto Cæsar: let His image be rendered unto God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
