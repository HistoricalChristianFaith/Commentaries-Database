[[commentary]]
quote='''
The miracle indeed of our Lord Jesus Christ, whereby He made the water into wine, is not marvellous to those who know that it was God's doing. For He who made wine on that day at the marriage feast, in those six water-pots, which He commanded to be filled with water, the self-same does this every year in vines. For even as that which the servants put into the water-pots was turned into wine by the doing of the Lord, so in like manner also is what the clouds pour forth changed into wine by the doing of the same Lord. But we do not wonder at the latter, because it happens every year: it has lost its marvellousness by its constant recurrence. And yet it suggests a greater consideration than that which was done in the water-pots. For who is there that considers the works of God, whereby this whole world is governed and regulated, who is not amazed and overwhelmed with miracles? If he considers the vigorous power of a single grain of any seed whatever, it is a mighty thing, it inspires him with awe. But since men, intent on a different matter, have lost the consideration of the works of God, by which they should daily praise Him as the Creator, God has, as it were, reserved to Himself the doing of certain extraordinary actions, that, by striking them with wonder, He might rouse men as from sleep to worship Him. A dead man has risen again; men marvel: so many are born daily, and none marvels. If we reflect more considerately, it is a matter of greater wonder for one to be who was not before, than for one who was to come to life again. Yet the same God, the Father of our Lord Jesus Christ, doeth by His word all these things; and it is He who created that governs also. The former miracles He did by His Word, God with Himself; the latter miracles He did by the same Word incarnate, and for us made man. As we wonder at the things which were done by the man Jesus, so let us wonder at the things which where done by Jesus God. By Jesus God were made heaven,and earth, and the sea, all the garniture of heaven, the abounding riches of the earth, and the fruitfulness of the sea;-all these things which lie within the reach of our eyes were made by Jesus God. And we look at these things, and if His own spirit is in us they in such manner please us, that we praise Him that contrived them; not in such manner that turning ourselves to the works we turn away from the Maker, and, in a manner, turning our face to the things made and our backs to Him that made them.

And these things indeed we see; they lie before our eyes. But what of those we do not see, as angels, virtues, powers, dominions,and every inhabitant of this fabric which is above the heavens, and beyond the reach of our eyes? Yet angels, too, when necessary, often showed themselves to men. Has not God made all these too by His Word, that is, by His only Son, our Lord Jesus Christ? What of the human soul itself, which is not seen, and yet by its works shown in the flesh excites great admiration in those that duly reflect on them,-by whom was it made, unless by God? And through whom was it made, unless through the Son of God? Not to speak as yet of the soul of man: the soul of any brute whatever, see how it regulates the huge body, puts forth the senses, the eyes to see, the ears to hear, the nostrils to smell, the taste to discern flavors-the members, in short, to execute their respective functions! Is it the body, not the soul, namely the inhabitant of the body, that doeth these things? The soul is not apparent to the eyes, nevertheless it excites admiration by these its actions. Direct now thy consideration to the soul of man, on which God has bestowed understanding to know its Creator to discern and distinguish between good and evil, that is, between right and wrong: see how many things it does through the body! Observe this whole world arranged in the same human commonwealth, with what administrations, with what orderly degrees of authority, with what conditions of citizenship, with what laws, manners, arts! The whole of this is brought about by the soul, and yet this power of the soul is not visible. When withdrawn from the body, the latter is a mere carcase: first, it in a manner preserves it from rottenness. For all flesh is corruptible, and falls off into putridity unless preserved by the soul as by a kind of seasoning. But the human soul has this quality in common with the soul of the brute; those qualities rather are to be admired which I have stated, such as belong to the mind and intellect, wherein also it is renewed after the image of its Creator, after whose image man was formed. What will this power of the soul be when this body shall have put on incorruption, and this mortal shall have put on immortality? If such is its power, acting through corruptible flesh, what shall be its power through a spiritual body, after the resurrection of the dead? Yet this soul, as I have said, of admirable nature and substance, is a thing invisible, intellectual; this soul also was made by God Jesus, for He is the Word of God. "All things were made by Him, and without Him was nothing made."

When we see, therefore, such deeds wrought by Jesus God, why should we wonder at water being turned into wine by the man Jesus? For He was not made man in such manner that He lost His being God. Man was added to Him, God not lost to Him. This miracle was wrought by the same who made all those things Let us not therefore wonder that God did it, but love Him because He did it in our midst, and for the purpose of our restoration. For He gives us certain intimations by the very circumstances of the case. I suppose that it was not without cause He came to the marriage. The miracle apart, there lies something mysterious and sacramental in the very fact. Let us knock, that He may open to us, and fill us with the invisible wine: for we were water, and He made us wine, made us wise; for He gave us the wisdom of His faith, whilst before we were foolish. And it appertains, it may be, to this wisdom, together with the honor of God, and with the praise of His majesty, and with the charity of His most powerful mercy, to understand what was done in this miracle.

The Lord, on being invited, came to the marriage. What wonder if He came to that house to a marriage, having come into this world to a marriage? For, indeed, if He came not to a marriage, He has not here a bride. But what says the apostle? "I have espoused you to one husband, to present you a chaste virgin to Christ." Why does he fear lest the virginity of Christ's bride should be corrupted by the subtilty of the devil? "I fear," saith he, "lest as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ." Thus has He here a bride whom He has redeemed by His blood, and to whom He has given the Holy Spirit as a pledge. He has freed her from the bondage of the devil: He died for her sins, and is risen again for her justification. Who will make such offerings to his bride? Men may offer to a bride every sort of earthly ornament,-gold, silver, precious stones, houses, slaves, estates, farms,-but will any give his own blood? For if one should give his own blood to his bride, he would not live to take her for his wife. But the Lord, dying without fear, gave His own blood for her, whom rising again He was to have, whom He had already united to Himself in the Virgin's womb. For the Word was the Bridegroom, and human flesh the bride; and both one, the Son of God, the same also being Son of man. The womb of the Virgin Mary, in which He became head of the Church, was His bridal chamber: thence He came forth, as a bridegroom from his chamber, as the Scripture foretold, "And rejoiced as a giant to run his way." From His chamber He came forth as a bridegroom; and being invited, came to the marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25208.html'
source_title="Tractates on John 8"

[[commentary]]
quote='''
May the Lord our God be present, that He may grant us to render you what we promised. For yesterday, if you remember, holy brethren, when the shortness of the time prevented us from completing the sermon we had begun, we put off until to-day the unfolding, by God's assistance, of those things which are mystically put in hidden meanings in this fact of the Gospel lesson. We need not, therefore, now stay any longer to commend the miracle of God. For He is the same God who, throughout the whole creation, worketh miracles every day, which become lightly esteemed by men, not because of the ease with which they are wrought, but by reason of their constant recurrence. Those uncommon works, however, which were done by the same Lord-that is, by the Word for us made flesh-occasioned greater astonishment to men, not because they are greater than those which He daily performs in the creation, but because these which happen every day are accomplished as it were in the course of nature; but the others appear exhibited to the eyes of men, wrought by the: efficacy of a power, as it were, immediately present. We said, as you remember, one dead man rose again, people were amazed, whilst no man wonders at the birth every day of those who were not in being. In like manner, who does not wonder at water turned into wine, although God is doing this every year in vines? But since all the works which the Lord Jesus did, serve not only to rouse our hearts by their miraculous character, but also to edify our hearts in the doctrine of faith, it behoves us thoroughly to examine into the meaning and significance of those works. For the consideration of the meaning of all these things we deferred, as you remember, till today.

The Lord, in that He came to the marriage to which He was invited, wished, apart from the mystical signification, to assure us that marriage was His own institution. For there were to be those of whom the apostle spoke, "forbidding to marry," and asserting that marriage was an evil, and of the devil's institution: notwithstanding the same Lord declares in the Gospel, on being asked whether it be lawful for a man to put away his wife for any cause, that it is not lawful save for the cause of fornication. In His answer, if you remember, He said, "What God hath joined together let not man put asunder." And they that are well instructed in the catholic faith know that God instituted marriage; and as the union of man and wife is from God, so divorce is from the devil. But in the case of fornication it is lawful for a man to put away his wife, because she first chose to be no longer wife in not preserving conjugal fidelity to her husband. Nor are those women who vow virginity to God, although they hold a higher place of honor and sanctity in the Church, without marriage. For they too, together with the whole Church, attain to a marriage, a marriage in which Christ is the Bridegroom. And for this cause, therefore, did the Lord, on being invited, come to the marriage, to confirm conjugal chastity, and to show forth the sacrament of marriage. For the bridegroom in that marriage, to whom it was said, "Thou hast kept the good wine until now," represented the person of the Lord. For the good wine-namely, the gospel-Christ has kept until now.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"
