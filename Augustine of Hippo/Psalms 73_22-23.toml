[[commentary]]
quote='''
What is, “I knew not”? “As it were a beast I became to Thee, and I am alway with Thee” (ver. 23). There is a great difference between this man and others. He became as it were a beast in longing for earthly things, when being brought to nothing he knew not things eternal: but he departed not from his God, because he did not desire these things of demons, of the devil. For this I have already brought to your notice. The voice is from the Synagogue, that is, from that people which served not idols. A beast indeed I became, when desiring from my God things earthly: but I never departed from That my God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
