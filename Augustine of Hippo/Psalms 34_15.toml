[[commentary]]
quote='''
“The Eyes of the Lord are upon the righteous:” fear not then; labour; the eyes of the Lord are upon thee. “And His Ears are open unto their prayers” (ver. 15). What wouldest thou more? If an householder in a great house should not hearken to a servant murmuring, he would complain, and say, What hardship do we here suffer, and none heareth us. Canst thou say this of God, What hardships I suffer, and none heareth me? If He heard me, haply, sayest thou, He would take away my tribulation: I cry unto Him, and yet have tribulation. Only do thou hold fast His ways, and when thou art in tribulation, He heareth thee. But He is a Physician, and still hast thou something of putrefaction; thou criest out, but still He cutteth, and taketh not away His Hand, until He hath cut as much as pleaseth Him. For that Physician is cruel who heareth a man, and spareth his wound and putrefaction. How do mothers rub their children in the baths for their health. Do not the little ones cry out in their hands? Are they then cruel because they spare not, nor hearken unto their tears? Are they not full of affection? And yet the children cry out, and are not spared. So our God also is full of charity, but therefore seemeth He not to hear, that He may spare and heal us for everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
