[[commentary]]
quote='''
…He hath taken away the pride of rich men, he giveth counsel. As if they were saying, We are rich men, thou dost forbid us to be proud, dost prohibit us from boasting of the parade of our riches: what then are we to do with these riches? Is it come to this, that there is nothing which they may do therewith? “Be they rich,” he saith, “in good works; let them readily distribute, communicate.” And what doth this profit? “Let them treasure unto themselves a good foundation for the future, that they may lay hold of true life.” Where ought they to lay up treasure for themselves? In that place whereunto he set his eye, when entering into the Sanctuary of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
