
[[commentary]]
quote='''
They who follow the will of their Lord, not seeking their own, but the things of the Lord Jesus Christ, they are the upright in heart, their feet shall not be moved. For "God is good to Israel, to the upright in heart. But, as for me, says he, my feet were almost moved." Why? "Because I was jealous at sinners, looking at the peace of sinners." To whom is God good then, unless to the upright in heart? For God was displeasing to me when my heart was crooked. Why displeasing? Because He gave happiness to the wicked, and therefore my feet tottered, as if I had served God in vain. For this reason, then, my feet were almost moved, because I was not upright of heart. What then is upright in heart? Following the will of God. One man is prosperous, another man toils; the one lives wickedly and yet is prosperous, the other lives rightly and is distressed. Let not him that lives rightly and is in distress be angry; he has within what the prosperous man has not: let him therefore not be saddened, nor vex himself, nor faint. That prosperous man has gold in his own chest; this other has God in his conscience. Compare now gold and God, chest and conscience. The former has that which perishes, and has it where it will perish; the latter has God, who cannot perish, and has Him there whence He cannot be taken away: only if he is upright in heart; for then He enters within and goeth not out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"

[[commentary]]
quote='''
In short, that man, who was not yet right in heart when the success of the wicked and the distress of the good grieved him, says, when he is corrected: "How good is the God of Israel to the upright in heart! But as for me," when I was not right in heart, "my feet were almost gone; my steps had well-nigh slipped." Why?. "Because I was envious at sinners, beholding the peace of sinners." I saw, saith he, the wicked prosperous, and I was displeased at God; for I did wish that God should not permit the wicked to be happy. Let man understand: God never does permit this; but a bad man is thought to be happy, for this reason, because men are ignorant of what happiness is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"
