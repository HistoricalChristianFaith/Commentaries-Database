[[commentary]]
quote='''
"Ask of Me, and I shall give Thee the nations for Thine inheritance" [Psalm 2:8]. This has at once a temporal sense with reference to the Manhood which He took on Himself, who offered up Himself as a Sacrifice in the stead of all sacrifices, who also maketh intercession for us; so that the words, "ask of Me," may be referred to all this temporal dispensation, which has been instituted for mankind, namely, that the "nations" should be joined to the Name of Christ, and so be redeemed from death, and possessed by God. "I shall give Thee the nations for Thine inheritance," which so possess them for their salvation, and to bear unto Thee spiritual fruit. "And the uttermost parts of the earth for Thy possession." The same repeated, "The uttermost parts of the earth," is put for "the nations;" but more clearly, that we might understand all the nations. And "Thy possession" stands for "Thine inheritance."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25202.html'
source_title="Exposition on Psalm 2"

[[commentary]]
quote='''
He did not fear to have joint-heirs, because His heritage does not become narrow if many are possessors. Those very persons, He being possessor, become His inheritance, and He in turn becomes their inheritance. Hear in what manner they become His inheritance: "The Lord hath said unto me, Thou art my Son, this day have I begotten Thee. Ask of me, and I will give Thee the nations for Thine inheritance." Hear in what manner He becomes their inheritance. He says in the Psalms: "The Lord is the portion of mine inheritance, and of my cup." Let us possess Him, and let Him possess us: let Him possess us as Lord; let us possess Him as salvation, let us possess Him as light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25202.html'
source_title="Tractates on John 2"
