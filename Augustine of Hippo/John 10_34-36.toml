[[commentary]]
quote='''
(Tract. xlviii) i. e. the Law given to you, I have said, Ye are Gods? (Ps. 82:6) God saith this by the Prophet in the Psalm. Our Lord calls all those Scriptures the Law generally, though elsewhere He spiritually distinguishes the Law from the Prophets. On these two commandments hang all the Law and the Prophets. (Matt. 22:40) In another place He makes a threefold division of the Scriptures; All things must be fulfilled which were written in the Law of Moses, and in the Prophets, and in the Psalms concerning Me. (Luke 24:44) Now He calls the Psalms the Law, and thus argues from them; If he called them gods unto whom the word of God came, and the scripture cannot be broken, say ye of Him whom the Father hath sanctified, and sent into the world, Thou blasphemest, because I said, I am the Son of God?

(Tract. xlviii) Or sanctified, i. e. in begetting, gave Him holiness, begat Him holy. If men to whom the word of God came were called gods, much more the Word of God Himself is God. If men by partaking of the word of God were made gods, much more is the Word of which they partake, God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But see what answer the Lord gave to their dull apprehension. He saw that they could not bear the brilliance of the truth, and He tempered it with words. "Is it not written in your law," that is, as given to you, "that I said, Ye are gods?" And the Lord called all the Scriptures generally, the law: although elsewhere He speaks more definitely of the law, distinguishing it from the prophets; as it is said, "The law and the prophets were until John;" and "On these two commandments hang all the law and the prophets." Sometimes, however, He divided the same Scriptures into three parts, as where He saith, "All things must be fulfilled which were written in the law, and the prophets, and the psalms, concerning me." But now He includes the psalms also under the name of the law, where it is written, "I said, Ye are gods. If He calleth them gods, to whom the word of God came, and the Scripture cannot be broken: say ye of Him, whom the Father hath sanctified, and sent into the world. Thou blasphemest; because I said, I am the Son of God?" If the word of God came to men, that they might be called gods, how can the very Word of God, who is with God, be otherwise than God? If by the word of God men become gods, if by fellowship they become gods, can He by whom they have fellowship not be God? If lights which are lit are gods,is the light which enlighteneth not God? If through being warmed in a way by saving fire they are constituted gods, is He who gives them the warmth other than God? Thou approachest the light and art enlightened, and numbered among the sons of God; if thou withdrawest from the light, thou fallest into obscurity, and art accounted in darkness; but that light approacheth not, because it never recedeth from itself. If, then, the word of God maketh you gods, how can the Word of God be otherwise than God? Therefore did the Father sanctify His Son, and send Him into the world. Perhaps some one may be saying: If the Father sanctified Him, was there then a time when He was not sanctified? He sanctified in the same way as He begat Him. For in the act of begetting He gave Him the power to be holy, because He begat Him in holiness. For if that which is sanctified was unholy before, how can we say to God the Father, "Hallowed be Thy name"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"
