[[commentary]]
quote='''
When he says: And this, knowing the time, that it is now the hour for us to rise from sleep, this looks to what was said: Behold, now is the acceptable time; behold, now is the day of salvation. For the time of the Gospel is signified, and that opportune season of saving those who believe in God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
