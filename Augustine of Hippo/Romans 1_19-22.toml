[[commentary]]
quote='''
For many, in that they affirmed themselves to be wise, became fools. The apostle convicts them, and says of them, "Because that which is known of God is manifest to them; for God has showed it unto them." Hear ye what he says of certain unthankful, ungodly men: "For the invisible things of Him from the creation of the world are seen, being understood by the things that are made, His eternal power likewise, and Godhead; so that they are without excuse." Why without excuse? "Because, knowing God" (he said not, "because they knew Him not "), "they glorified Him not as God, nor were thankful; but became vain in their imaginations, and their foolish heart was darkened: professing themselves to be wise, they became fools." If they had known God, they had known at the same time that God, and none other, had made them wise; and they would not then attribute to themselves that which they did not have from themselves, but to Him from whom they had received it. But by their unthankfulness they became fools. Therefore, what God gave freely, He took from the unthankful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252014.html'
source_title="Tractates on John 14"
