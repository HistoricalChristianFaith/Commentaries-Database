[[commentary]]
quote='''
To the Jews who understood not, it was indeed the worst of deaths, but it was chosen by the Lord. For He was to have that very cross as His sign; that very cross, a trophy, as it were, over the vanquished devil, He was to put on the brow of believers, so that the apostle said, "God forbid that I should glory, save in the cross of our Lord Jesus Christ, by whom the world is crucified to me, and I to the world." Nothing was then more intolerable in the flesh, nothing is now more glorious on the brow. What does He reserve for His faithful one, when He has put such honor on the instrument of His own torture? Now is the cross no longer used among the Romans in the punishment of criminals, for where the cross of the Lord came to be honored, it was thought that even a guilty man would be honored if he should be crucified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"
