[[commentary]]
quote='''
“The voice of Thy thunder is in the wheel” (ver. 18). What is this? How are we to understand it? May the Lord give aid. When boys we were wont to imagine, whenever we heard thunderings from Heaven, that carriages were going forth as it were from the stables. For thunder doth make a sort of rolling like carriages. Must we return to these boyish thoughts, in order to understand, “the voice of Thy thunder is in the wheel,” as though God hath certain carriages in the clouds, and the passing along of the carriages doth raise that sound? Far be it. This is boyish, vain, trifling. What is then, “The voice of Thy thunder is in the wheel”? Thy voice rolleth. Not even this do I understand. What shall we do? Let us question Idithun himself, to see whether perchance he may himself explain what he hath said: “The voice,” he saith, “of Thy thunder is in the wheel.” I do not understand. I will hear what thou sayest: “Thy lightnings have appeared to the round world.” Say then, I had no understanding. The round world is a wheel. For the circuit of the round world is with reason called also an “orb:” whence also a small wheel is called an “orbiculus.” “The voice of Thy thunder is in the wheel:” Thy “lightnings have appeared to the round world.” Those clouds in a wheel have gone about the round world, have gone about with thundering and with lightning, they have shaken the abyss, with commandments they have thundered, with miracles they have lightened. “Unto every land hath gone forth the sound of them, and unto the ends of the orb the words of them.” “The land hath been moved and made to tremble:” that is, all men that dwell in the land. But by a figure the land itself is sea. Why? Because all nations are called by the name of sea, inasmuch as human life is bitter, and exposed to storms and tempests. Moreover if thou observe this, how men devour one another like fishes, how the stronger doth swallow up the weaker—it is then a sea, unto it the Evangelists went.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
