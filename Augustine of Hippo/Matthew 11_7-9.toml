[[commentary]]
quote='''
And John was not a prophet; he was greater than a prophet. The Lord gave such testimony concerning him: "What went ye out into the wilderness to see? A reed shaken with the wind?" Of course implying that he was not shaken by the wind; because John was not such an one as is moved by the wind; for he who is moved by the wind is blown upon by every seductive blast. "But what went ye out for to see? A man clothed in soft raiment?" For John was clothed in rough garments; that is, his tunic was of camel's hair. "Behold, they who are clothed in soft raiment are in kings' houses." You did not then go out to see a man clothed in soft raiment. "But what went ye out for to see? A prophet? Yea, I say unto you, one greater than a prophet is here;" for the prophets prophesied of Christ a long time before, John pointed Him out as present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"
