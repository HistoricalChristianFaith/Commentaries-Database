[[commentary]]
quote='''
For when the disciples had lifted up their voices unto Him, many believed, and many received the Holy Spirit, and many rivers instead of few began to lift up their voice. Hence there followeth, “from the voices of many waters, wonderful are the hangings of the sea;” that is, the waves of the world. When Christ had begun to be preached by so powerful voices, the sea became enraged, persecutions began to thicken. When therefore the rivers had lift up their voice, “from the voices of many waters, wonderful” were “the hangings of the sea.” To be hung aloft is to be lifted up; when the sea rages, the waves are hung as from above. Let the waves hang over as they choose; let the sea roar as it chooseth; the hangings of the sea indeed are mighty, mighty are the threatenings, mighty the persecutions; but see what followeth: “but yet the Lord, who dwelleth on high, is mightier.” Let therefore the sea restrain itself, and sometime become calmed; let peace be granted by Christians. The sea was disturbed, the vessel was tossed; the vessel is the Church: the sea, the world. The Lord came, He walked over the sea, and calmed the waves. How did the Lord walk over the sea? Above the heads of those mighty foaming waves. Principalities and kings believed; they were subdued unto Christ. Let us not therefore be frightened; because “the Lord, who dwelleth on high, is mightier.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
