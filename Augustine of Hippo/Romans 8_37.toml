[[commentary]]
quote='''
And what avails "the good fight," unless followed by victory? And who gives the victory but He of whom the apostle says himself, "Thanks be to God, who giveth us the victory through our Lord Jesus Christ"? Then, in another passage, having quoted from the Psalm these words: "Because for Thy sake we are killed all the day long; we are accounted as sheep for slaughter," he went on to declare: "Nay, in all these things we are more than conquerors, through Him that loved us." Not by ourselves, therefore, is the victory accomplished, but by Him who hath loved us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 16"
