[[commentary]]
quote='''
Put two people together; one wants to go to the show, the other to church. They are joined in body, separated by their desires. The first is like the salt water, the second appears as dry land. How can we prove that this land is dry, which signifies people desiring good things? The psalmist says to God, "My soul is like land without water to you." My soul has thirsted for you; it is thirsty, it is dry, it is segregated from the waters of the sea. It must not bother about not yet being segregated in the body; its desire has already made the separation. Some desire God, others desire the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229S.html'
source_title="SERMON 229S"

[[commentary]]
quote='''
“I stretched forth,” saith he, “my hands to Thee: my soul is as a land without water to Thee” (ver. 6). Rain upon me, saith he, to bring forth from me good fruit. “For the Lord shall give sweetness, that our land may give her fruit.” “I have stretched forth my hands to Thee; my soul is as a land without water,” not to me, but “to Thee.” I can thirst for Thee, I cannot water myself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
