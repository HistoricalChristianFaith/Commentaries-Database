[[commentary]]
quote='''
But, even if the angels, whose nature is simple and spiritual, are said to have tongues with which they sing praises to their Lord and Creator and give him unceasing thanks, much more must the spiritualized bodies of men do so after the resurrection. For all the members of their glorified flesh will have tongues in their mouths, and they will give voice to their speaking tongues, and thus they will utter divine praises, the outpouring in words of their love and of the joys that fill even their senses. Doubtless the Lord will add this to the grace and glory of his saints in the time of his kingdom, that the more perfectly they attain to this blessed condition of body by a happy transformation, the more fully will they sing with tongue and voice. Being established in their spiritual bodies, they may speak, perchance, not with the tongues of men but with those of angels, such as the apostle heard in paradise.
'''

[[commentary]]
quote='''
Although even among the spiritual themselves there are some, doubtless, who are of greater capacity and in a better condition than others; so that one of them attained even to things of which it is not lawful for a man to speak. Taking advantage of which, there have been some vain individuals, who, with a presumption that betrays the grossest folly, have forged a Revelation of Paul, crammed with all manner of fables, which has been rejected by the orthodox Church; affirming it to be that whereof he had said that he was caught up into the third heavens, and there heard unspeakable words "which it is not lawful for a man to utter." Nevertheless, the audacity of such might be tolerable, had he said that he heard words which it is not as yet lawful for a man to utter; but when he said, "which it is not lawful for a man to utter," who are they that dare to utter them with such impudence and non-success?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252098.html'
source_title="Tractates on John 98"
