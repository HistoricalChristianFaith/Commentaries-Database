[[commentary]]
quote='''
The Church swalloweth not thus. To Peter it was said, “Kill and eat:” not, Swallow quick. Because no man entereth into the body of the Church, save he be slain first. What he was dieth, that he may be what he was not. Otherwise, he who is not slain, and is not eaten by the Church, may be in the visible number of the people: but he cannot be in the number of the people which is known to God, whereof the Apostle saith, “The Lord knoweth who are His,” save he be eaten; and eaten he cannot be, save he first be slain. The Pagan cometh, still in him idolatry liveth; he must be grafted among the members of Christ: that he may be engrafted, he must needs be eaten; but he cannot be eaten by the Church, save first he be slain. Let him renounce the world, then is he slain; let him believe in God, then is he eaten…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520124.html'
source_title="Exposition on Psalm 124"
