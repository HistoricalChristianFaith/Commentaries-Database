[[commentary]]
quote='''
(de Orig. Anim. 4. 16) Now as to your thinking Abraham's bosom to be any thing bodily, I am afraid lest you should be thought to treat so weighty a matter rather lightly than seriously. For you could never be guilty of such folly, as to suppose the corporeal bosom of one man able to hold so many souls, nay, to use your own words, so many bodies as the Angels carry thither as they did Lazarus. But perhaps you imagine that one soul to have alone deserved to come to that bosom. If you would not fall into a childish mistake, you must understand Abraham's bosom to be a retired and hidden resting-place where Abraham is; and therefore called Abraham's, not that it is his alone, but because he is the father of many nations, and placed first, that others might imitate his preeminence of faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And that ye may know, that not money in a rich man, but covetousness is condemned, attend to what I say; Thou observest that rich man standing near thee, and perchance in him is money, and is not covetousness; in thee is not money, and is covetousness. A poor man full of sores, full of woe, licked by dogs, having no help, having no morsel, not having perchance a mere garment, was borne by the Angels unto Abraham’s bosom. Ho! being a poor man, art thou glad now; for are even sores by thee to be desired? Is not thy patrimony soundness? There is not in this Lazarus the merit of poverty, but that of godliness. For thou seest who was borne up, thou seest not whither he was borne up. Who was borne up by Angels? A poor man, full of woe, full of sores. Whither was he borne up? Unto Abraham’s bosom. Read the Scriptures, and thou shalt find Abraham to have been a rich man. In order that thou mayest know, that not riches are blamed; Abraham had much gold, silver, cattle, household, was a rich man, and unto his bosom Lazarus, a poor man, was borne up. Unto bosom of rich man, poor man: are not rather both unto God rich men, both in cupidity poor men?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
