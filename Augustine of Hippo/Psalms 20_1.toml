[[commentary]]
quote='''
To the end, a psalm of David.

This is a well-known title; and it is not Christ who speaks; but the prophet speaks to Christ, under the form of wishing, foretelling things to come.

“The Lord hear Thee in the day of trouble” (ver. 1). The Lord hear Thee in the day in which Thou saidst, “Father glorify Thy Son.” “The name of the God of Jacob protect Thee.” For to Thee belongeth the younger people. Since “the elder shall serve the younger.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
