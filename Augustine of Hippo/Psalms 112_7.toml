[[commentary]]
quote='''
“He will not be afraid of any evil hearing; for his heart standeth fast and believeth in the Lord” (ver. 7). Such as the words which he will hear addressed to those on the left hand, “Depart into everlasting fire, prepared for the devil and his angels.” He therefore who seeketh here not his own things, but those of Jesus Christ, most patiently endureth sufferings, waiteth for the promises with faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520112.html'
source_title="Exposition on Psalm 112"
