
[[commentary]]
quote='''
“My strength dried up as a potsherd” (ver. 15). My strength dried up by My Passion; not as hay, but a potsherd, which is made stronger by fire. “And My tongue cleaved to My jaws.” And they, through whom I was soon to speak, kept My precepts in their hearts. “And Thou broughtest Me down to the dust of death.” And to the ungodly appointed to death, whom the wind casteth forth as dust from the face of the earth, Thou broughtest Me down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"

[[commentary]]
quote='''
The censurer hath broken thee, thou hast been broken in the furnace like an earthen vessel. The Word hath moulded thee, and there hath come the trial of tribulation: that which hath been formed, must needs be seasoned; if it hath been well moulded, there hath come the fire to strengthen. Whence He said in the Passion, “Dried up like a potsherd hath been My virtue.” For Passion and the furnace of tribulation had made Him stronger.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
