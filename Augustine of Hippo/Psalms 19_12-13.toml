[[commentary]]
quote='''
Hence is that which is elsewhere spoken, “From my secret sins cleanse Thou me; and from others’ sins also keep Thy servant.” What is, “From my secret sins”? “Let not the foot of pride come against me.” What is, “From other men’s sins also keep Thy servant”? “Let not the hand of the wicked remove me.” Keep that which is within, and thou shalt not fear from without.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"
