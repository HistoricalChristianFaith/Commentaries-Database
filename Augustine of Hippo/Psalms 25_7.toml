[[commentary]]
quote='''
“Remember not the offences of my youth and of my ignorance” (ver. 7). The offences of my presumptuous boldness and of my ignorance reserve not for vengeance, but let them be as if forgotten by Thee. “According to Thy mercy, be mindful of me, O God.” Be mindful indeed of me, not according to the anger of which I am worthy, but according to Thy mercy which is worthy of Thee. “For Thy goodness, O Lord.” Not for my deservings, but for Thy goodness, O Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
