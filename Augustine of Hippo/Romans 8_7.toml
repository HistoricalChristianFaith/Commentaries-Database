[[commentary]]
quote='''
When he says: Because the prudence of the flesh is hostile toward God, for it is not subject to the law of God, nor indeed can it be, he shows what he meant by hostile—lest anyone suppose that, as from an opposing principle, some nature which God did not create wages enmity against God. He is therefore called an enemy of God who does not submit to his law, and this through the prudence of the flesh, that is, when he desires temporal goods and fears temporal evils. For the definition of prudence is usually set out in the desiring of goods and the avoiding of evils. Wherefore the Apostle rightly calls it the prudence of the flesh, by which these things are desired as if they were great goods, though they do not endure with a man, and by which it is feared that these may be lost, which must one day be lost. But such prudence cannot submit to the law of God; rather the law is submitted to only when this prudence has been extinguished, so that the prudence of the spirit may succeed it, by which our hope is neither in temporal goods nor our fear in temporal evils. For the same nature of the soul both has the prudence of the flesh, when it pursues lower things, and the prudence of the spirit, when it chooses higher things—just as the same nature of water both freezes with cold and melts with heat. Thus, then, it was said: The prudence of the flesh is not subject to the law of God, nor indeed can it be—just as it would rightly be said that snow cannot be made warm, nor indeed can it; but when, heat being applied, it is dissolved and the water grows warm, now no one can call it snow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
