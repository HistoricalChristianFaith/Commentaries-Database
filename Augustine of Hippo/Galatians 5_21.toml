[[commentary]]
quote='''
Let no one suppose that envy is the same thing as jealousy. For they are indeed neighbors and because of that very neighborhood either of them is often freely substituted for the other.… But because each is distinguished here they require us to make a distinction. Jealousy is the mind's anguish when someone achieves something that two or more were seeking but which can be had only by one. Jealousy is cured by peace, in which all may obtain that which is sought and thus become one. Envy on the other hand is the grief one feels in one's mind when an unworthy person appears to have obtained something, even if it is not being sought by others. Envy is overcome by meekness, when all who yearn appeal to the judgment of God and do not resist his will, trusting rather in the justice of what he does than in one's own estimate of what people deserve.
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 52"


[[commentary]]
quote='''
If therefore all those works “shall not possess the kingdom of God” (yea not the works, but “they that do such things;” for such works there shall be none in the fire: for they shall not, while burning in that fire, be committing theft or adultery; but “they that do such things shall not possess the kingdom of God”); they shall not therefore be on the right hand, with those to whom it shall be said, “Come, ye blessed of My Father, receive the kingdom:” because, “they that do such things shall not possess the kingdom of God.” If therefore on the right they shall not be, there remaineth not but that they must be on the left. To those on the left what shall He say? “Go ye into eternal fire.” Because, “their time shall be for ever.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"
