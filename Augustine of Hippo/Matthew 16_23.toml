[[commentary]]
quote='''
For our Lord Christ once addressed Peter as Satan, rather because he wished to precede his Lord, and to give counsel that He should not die, He who had come to die, that we might not die for ever; and He says to him, "Get thee behind me, Satan; for thou savorest not the things that be of God, but the things that be of men." He did not drive him back to go after Satan, and so called him Satan; but He made him go behind Himself, that by walking after his Lord he should not be a Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252027.html'
source_title="Tractates on John 27"

[[commentary]]
quote='''
For that which had been desired but now for persecutors thinking evil things, the same the Lord Himself said to Peter. Now in a certain place Peter willed to go before the Lord.…A little before, “Blessed art thou, Simon Bar-jona, for flesh and blood hath not revealed it to thee, but My Father which is in Heaven:” now in a moment, “Go back behind Me, Satan.” What is, “Go back behind Me”? Follow Me. Thou willest to go before Me, thou willest to give Me counsel, it is better that thou follow My counsel: this is, “go back,” go back behind Me. He is silencing one outstripping, in order that he may go backward; and He is calling him Satan, because he willeth to go before the Lord. A little before, “blessed;” now, “Satan.” Whence a little before, “blessed”? Because, “to thee,” He saith, “flesh and blood hath not revealed it, but My Father which is in Heaven.” Whence now, “Satan”? Because “thou savourest not,” He saith, “the things which are of God, but the things which are of men.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"

[[commentary]]
quote='''
Peter too had risen before the light, when he wished to give the Lord advice, deterring Him from suffering for us.…But what did our Lord do? He caused him to rise after the Light: “Get thee behind Me, Satan.” He was Satan, because he wished to rise before Light. “Get thee behind Me:” that I may precede, thou mayest follow: where I go, there thou mayest go; and mayest not wish to lead Me, where thou wouldest go.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
