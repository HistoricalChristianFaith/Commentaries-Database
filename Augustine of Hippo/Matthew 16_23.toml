[[commentary]]
quote='''
For our Lord Christ once addressed Peter as Satan, rather because he wished to precede his Lord, and to give counsel that He should not die, He who had come to die, that we might not die for ever; and He says to him, "Get thee behind me, Satan; for thou savorest not the things that be of God, but the things that be of men." He did not drive him back to go after Satan, and so called him Satan; but He made him go behind Himself, that by walking after his Lord he should not be a Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252027.html'
source_title="Tractates on John 27"
