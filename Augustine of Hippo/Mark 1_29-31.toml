[[commentary]]
quote='''
After this, Matthew goes on with his narrative in these terms: "And leaving the city of Nazareth, He came and dwelt in Capharnaum, which is upon the sea-coast, in the borders of Zabulon and Nephthalim;" and so forth, until we come to the conclusion of the sermon which He delivered on the mount. In this section of the narrative, Mark agrees with him in attesting the calling of the disciples Peter and Andrew, and a little after that, the calling of James and John. But whereas Matthew introduces in this immediate context his account of that lengthened sermon which He delivered on the mount, after He cured a multitude, and when great crowds followed Him, Mark has inserted other matters at this point, touching His teaching in the synagogue, and the people's amazement at His doctrine. Then, too, he has stated what Matthew also states, although not till after that lengthened sermon has been given, namely, that "He taught them as one that had authority, and not as the scribes." He has likewise given us the account of the man out of whom the unclean spirit was cast; and after that the story of Peter's mother-in-law. In these things, moreover, Luke is in accord with him. But Matthew has given us no notice of the evil spirit here. The story of Peter's mother-in-law, however, he has not omitted, only he brings it in at a later stage.

In this paragraph, moreover, which we are at present considering, the same Matthew follows up his account of the calling of those disciples to whom, when they were engaged in fishing, He gave the command to follow Him, by a narrative to the effect that He went about Galilee, teaching in the synagogues, and preaching the gospel, and healing all manner of sickness; and that when multitudes had gathered about Him, He went up into a mountain, and delivered that lengthened sermon [already alluded to]. Thus the evangelist gives us ground for understanding that those incidents which are recorded by Mark after the election of those same disciples, took place at the period when He was going about Galilee, and teaching in their synagogues. We are at liberty also to suppose that what happened to Peter's mother-in-law came in at this point; and that he has mentioned at a later stage what he has passed over here, although he has not indeed brought up at that later point, for direct recital, everything else which is omitted at the earlier.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 17"

[[commentary]]
quote='''
Matthew proceeds in the following terms: "And when Jesus was come into Peter's house, He saw his wife's mother laid, and sick of a fever. And He touched her hand, and the fever left her: and she arose, and ministered unto them." Matthew has not indicated the date of this incident; that is to say, he has specified neither before what event nor after what occurrence it took place. For we are certainly under no necessity of supposing that, because it is recorded after a certain event, it must also have happened in actual matter of fact after that event. And unquestionably, in this case, we are to understand that he has introduced for record here something which he had omitted to notice previously. For Mark brings in this narrative before his account of that cleansing of the leper which he would appear to have placed after the delivery of the sermon on the mount; which discourse, however, he has left unrelated. And thus, too, Luke inserts this story of Peter's mother-in-law after an occurrence which it follows likewise in Mark's version, but also before that lengthened discourse, which has been reproduced by him, and which may appear to be one with the sermon which Matthew states to have been delivered on the mount. For of what consequence is it in what place any of them may give his account; or what difference does it make whether he inserts the matter in its proper order, or brings in at a particular point what was previously omitted, or mentions at an earlier stage what really happened at a later, provided only that he contradicts neither himself nor a second writer in the narrative of the same facts or of others? For as it is not in one's own power, however admirable and trustworthy may be the knowledge he has once obtained of the facts, to determine the order in which he will recall them to memory (for the way in which one thing comes into a person's mind before or after another is something which proceeds not as we will, but simply as it is given to us), it is reasonable enough to suppose that each of the evangelists believed it to have been his duty to relate what he had to relate in that order in which it had pleased God to suggest to his recollection the matters he was engaged in recording. At least this might hold good in the case of those incidents with regard to which the question of order, whether it were this or that, detracted nothing from evangelical authority and truth.

But as to the reason why the Holy Spirit, who divideth to every man severally as He will, and who therefore undoubtedly, with a view to the establishing of their books on so distinguished an eminence of authority, also governs and rules the minds of the holy men themselves in the matter of suggesting the things they were to commit to writing, has left one historian at liberty to construct his narrative in one way, and another in a different fashion, that is a question which any one may look into with pious consideration, and for which, by divine help, the answer also may possibly be found. That, however, is not the object of the work which we have taken in hand at present. The task we have proposed to ourselves is simply to demonstrate that not one of the evangelists contradicts either himself or his fellow-historians, whatever be the precise order in which he may have had the ability or may have preferred to compose his account of matters belonging to the doings and sayings of Christ; and that, too, at once in the case of subjects identical with those recorded by others, and in the case of subjects different from these. For this reason, therefore, when the order of times is not apparent, we ought not to feel it a matter of any consequence what order any of them may have adopted in relating the events. But wherever the order is apparent, if the evangelist then presents anything which seems to be inconsistent with his own statements, or with those of another, we must certainly take the passage into consideration, and endeavour to clear up the difficulty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 21"
