[[commentary]]
quote='''
"Simon Peter," therefore, "saith, I go a fishing." Those who were with him "say unto him, We also go with thee. And they went forth, and entered into a ship; and that night they caught nothing. But when the morning was now come, Jesus stood on the shore; but the disciples knew not that it was Jesus. Then Jesus saith unto them, Children, have ye any meat? They answered Him, No. He saith unto them, Cast the net on the right side of the ship, and ye shall find. They cast therefore, and now they were not able to draw it for the multitude of fishes. Therefore that disciple whom Jesus loved saith unto Peter, It is the Lord. When Simon Peter heard that it was the Lord, he girt his coat unto him, for he was naked, and did cast himself into the sea. And the other disciples came in a little ship (for they were not far from the land, but as it were two hundred cubits), dragging the net with fishes. As soon then as they were come to land, they saw a fire of coals laid, and a fish laid thereon, and bread. Jesus saith unto them, Bring of the fish which ye have now caught. Simon Peter went up, and drew the net to land full of great fishes, an hundred and fifty and three: and for all there were so many, yet was not the net broken."

This is a great mystery in the great Gospel of John; and to commend it the more forcibly to our attention, the last chapter has been made its place of record. Accordingly, inasmuch as there were seven disciples taking part in that fishing, Peter, and Thomas, and Nathaneal, and the two sons of Zebedee, and two others whose names are withheld, they point, by their septenary number, to the end of time. For there is a revolution of all time in seven days. To this also pertains the statement, that when the morning was come, Jesus stood on the shore; for the shore likewise is the limit of the sea, and signifies therefore the end of the world. The same end of the world is shown also by the act of Peter, in drawing the net to land, that is, to the shore. Which the Lord has Himself elucidated, when in a certain other place He drew His similitude from a fishing net let down into the sea: "And they drew it," He said, "to the shore." And in explanation of what that shore was, He added, "So will it be in the end of the world."

That, however, is a parable in word, not one embodied in outward action; and just as in the passage before us the Lord indicated by an outward action the kind of character the Church would have in the end of the world, so in the same way, by that other fishing, He indicated its present character. In doing the one at the commencement of His preaching and this latter after His resurrection, He showed thereby in the former case that the capture of fishes signified the good and bad presently existing in the Church; but in the latter, the good only, whom it will contain everlastingly, when the resurrection of the dead shall have been completed in the end of this world. Furthermore, on that previous occasion Jesus stood not, as here, on the shore, when He gave orders for the taking of the fish, but "entered into one of the ships, which was Simon's, and prayed him that he would thrust out a little from the land; and He sat down therein, and taught the crowds. And when He had left speaking, He said unto Simon, Launch out into the deep, and let down your nets for a draught." There also they put the fishes that were caught into the ship, and did not, as here, draw the net to the shore. By these signs, and any others that may be found, on the former occasion the Church was prefigured as it exists in this world, and on the other, as it shall be in the end of the world: the one accordingly took place before, and the other subsequently to the resurrection of the Lord; because there we were signified by Christ as called, and here as raised from the dead. On that occasion the nets are not let down on the right side, that the good alone might not be signified, nor on the left, lest the application should be limited to the bad; but without any reference to either side, He says, "Let down your nets for a draught," that we may understand the good and bad as mingled together: while on this He says, "Cast the net on the right side of the ship," to signify those who stood on the right hand, the good alone. There the net was broken on account of the schisms that were meant to be signified; but here, as then there will be no more schisms in that supreme peace of the saints, the evangelist was entitled to say, "And for all they were so great," that is, so large, "yet was not the net broken;" as if with reference to the previous time when it was broken, and a commendation of the good that was here in comparison with the evil that preceded. There the multitude of fishes caught was so great, that the two vessels were filled and began to sink, that is, were weighed down to the point of sinking; for they did not actually sink, but were in extreme jeopardy. For whence exist in the Church the great evils under which we groan, save from the impossibility of withstanding the enormous multitude that, almost to the entire subversion of discipline, gain an entrance, with their morals so utterly at variance with the pathway of the saints? Here, however, they cast the net on the right side, "and now they were not able to draw it for the multitude of fishes." What is meant by the words, "Now they were not able to draw it," but this, that those who belong to the resurrection of life, that is to say, to the right hand, and depart this life within the nets of the Christian name, will be made manifest only on the shore, in other words, when they shall rise from the dead at the end of the world? Accordingly, they were not able to draw the nets so as to discharge into the vessel the fishes they had caught, as was done with all of those wherewith the net was broken, and the boats laden to sinking. But the Church possesses those right-hand ones after the close of this life in the sleep of peace, lying hid as it were in the deep, till the net reach the shore whither it is being drawn, as it were two hundred cubits. And as on that first occasion it was done by two vessels, with reference to the circumcision and the uncircumcision; so in this place, by the two hundred cubits, I am of opinion that there is symbolized, with reference to the elect of both classes, the circumcision and the uncircumcision, as it were two separate hundreds; because the number that passes to the right hand is represented summarily by hundreds. And last of all, in that former fishing the number of fishes is not expressed, as if the words were there acted on that were uttered by the prophet, "I have declared and spoken; they are multiplied beyond number:" while here there are none beyond calculation, but the definite number of a hundred and fifty and three; and of the reason of this number we must now, with the Lord's help, give some account.
'''
