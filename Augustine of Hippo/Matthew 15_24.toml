[[commentary]]
quote='''
A question arises here on that point: How is it that we have come from the Gentiles to the sheepfold of Christ if he was sent only to the lost sheep of the house of Israel? What is the meaning of this puzzling dispensation? The Lord knew why he came—certainly to have a church among all the Gentiles—and he yet said that he was sent only to the lost sheep of the house of Israel? We accordingly understand that he had to manifest in due sequence to that people first the presence of his body, his birth, the display of miracles and then the power of his resurrection. It had thus been predetermined from the beginning, such and such had been foretold and fulfilled, that Christ Jesus had to come to the Jewish people and to be seen and killed and to win for himself those whom he knew beforehand. The Gentiles were not to be condemned but to be winnowed like grain. A multitude of chaff was there, the hidden dignity of grain was there, burning was to take place there, and a storehouse to be filled there. In fact, where were the apostles if not there? Where was Peter? Where were the rest?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252077.html'
source_title="SERMON 77.2"

[[commentary]]
quote='''
Nevertheless, Christ has not been among us with the bodily form which the Jews saw and despised; because this also was said concerning Him, even as the apostle says: "Now I say that Christ was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers. He owed it to have come to those by whose fathers and to whose fathers He was promised. For this reason He says also Himself: "I am not sent but unto the lost sheep of the house of Israel." But what says the apostle in the following words? "And that the Gentiles might glorify God for His mercy." What, moreover, saith the Lord Himself? "Other sheep I have which are not of this fold. He who had said, "I am not sent but unto the lost sheep of the house of Israel," how has He other sheep to which He was not sent, except that He intimated that He was not sent to show His bodily presence but to the Jews only, who saw and killed Him? And yet many of them, both before and afterwards, believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"
