[[commentary]]
quote='''
“For our heart shall rejoice in Him:” for not in ourselves, wherein without Him there is great need; but in Himself shall our heart rejoice. “And we have trusted in His holy Name” (ver. 21); and therefore have we trusted that we shall come to God, because unto us absent hath He sent, through faith, His own Name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
