[[commentary]]
quote='''
Photius said, "Christ is only a man, he is not also God." The Father hath not drawn him who thus believes. One whom the Father has drawn says: "Thou art Christ, Son of the living God." Not as a prophet, not as John, not as some great and just man, but as the only, the equal, "Thou art Christ, Son of the living God." See that he was drawn, and drawn by the Father. "Blessed art thou, Simon Barjonas: for flesh and blood hath not revealed it to thee, but my Father who is in heaven." This revealing is itself the drawing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
