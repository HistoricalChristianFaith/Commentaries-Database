[[commentary]]
quote='''
Let me try to explain, as far as the Lord enables me to, what these signs mean. The rod stands for the kingdom, the snake for mortality; it was by the snake that man was given death to drink. The Lord was prepared to take this death to himself. So when the rod came down to earth it had the form of a snake, because the kingdom of God, which is Jesus Christ, came down to earth. He put on mortality, which he also nailed to the cross. Your holinesses know that when that proud and stiff-necked people grumbled against God in the desert, they began to be bitten by serpents and to die of the bites. In his mercy God provided a remedy, a remedy that restored health at the time but also foretold the wisdom that was to come in the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%25206.html'
source_title="SERMON 6.7"

[[commentary]]
quote='''
Let us look back to the first thing that was done, when He willed to possess that same congregation, delivering it from Egypt, what sign He gave to Moses, when Moses said to Him, “What sign shall I give that they may believe me, that Thou hast sent me? And God saith to him, What dost thou bear in thine hand? A rod. Cast it on to the ground,” etc. What doth it intimate? For this was not done to no purpose. Let us inquire of the writings of God. To what did the serpent persuade man? To death. Therefore death is from the serpent. If death is from the serpent, the rod in the serpent is Christ in death. Therefore also when by serpents in the desert they were being bitten and being slain, the Lord commanded Moses to exalt a brazen serpent in the desert, and admonish the people that whosoever by a serpent had been bitten, should look thereupon and be made whole. Thus also it was done: thus also men, bitten by serpents, were made whole of the venom by looking upon a serpent. To be made whole of a serpent is a great Sacrament. What is it to be made whole of a serpent by looking upon a serpent? It is to be made whole of death by believing in one dead. And nevertheless Moses feared and fled. What is it that Moses fled from that serpent? What, brethren, save that which we know to have been done in the Gospel? Christ died and the disciples feared, and withdrew from that hope wherein they had been.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
