[[commentary]]
quote='''
But first He was led to Annas, the father-in-law of Caiaphas, as John says, then to Caiaphas, as Matthew says, but Mark and Luke do not give the name of the High Priest.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In the line of Matthew's narrative we come next upon this statement: "And they that laid hold on Jesus led Him away to Caiaphas the high priest, where the scribes and the elders were assembled." We learn, however, from John that He was conducted first to Annas, the father-in-law of Caiaphas. On the other hand, Mark and Luke omit all mention of the name of the high priest. Moreover [we find that] He was led away bound. For, as John informs us, there were at hand there, in the multitude, a tribune and a cohort, and the servants of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 6"
