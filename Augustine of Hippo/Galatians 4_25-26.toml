[[commentary]]
quote='''
But from what are they redeemed, save from the captivity of this pilgrimage? Let not therefore rest be sought, save in the heavenly country. God indeed gave the carnal Israelites an earthly Jerusalem, “which is in bondage with her children:” but this is the Old Covenant, pertaining unto the old man. But they who there understood the figure, even then were heirs of the New Covenant; for “Jerusalem which is above is free, which is our everlasting mother in heaven.” But that transitory promises were given in that Old Testament is proved by the fact itself: however, “He hath commended His covenant for ever.” But what, but the New?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520111.html'
source_title="Exposition on Psalm 111"
