[[commentary]]
quote='''
His last clause runs thus: "I have kept the faith." But he who says this is the same who declares in another passage, "I have obtained mercy that I might be faithful." He does not say, "I obtained mercy because I was faithful," but "in order that I might be faithful," thus showing that even faith itself cannot be had without God's mercy, and that it is the gift of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 17"

[[commentary]]
quote='''
I have already discussed the point concerning faith, that is, concerning the will of him who believes, even so far as to show that it appertains to grace,—so that the apostle did not tell us, "I have obtained mercy because I was faithful;" but he said, "I have obtained mercy in order to be faithful."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 28"
