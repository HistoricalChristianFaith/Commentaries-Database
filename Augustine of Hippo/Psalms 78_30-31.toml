[[commentary]]
quote='''
But what He had delayed let us hear. “Yet the morsel was in their mouths, and the anger of God came down upon them” (ver. 30). Behold what He had delayed. For before “He delayed:” and afterwards, “fire was lighted in Jacob and anger went up upon Israel.” He had delayed therefore in order that He might first do what they had believed that He could not do, and then might bring upon them what they deserved to suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
