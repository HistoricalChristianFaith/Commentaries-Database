[[commentary]]
quote='''
Learned men have enquired for Tarshish a city, that is, what city was signified by this name: and to some it has seemed that Cilicia is called Tarshish, because its metropolis is called Tarsus. Of which city was the Apostle Paul, being born in Tarsus of Cilicia. But some have understood by it Carthage, being haply sometimes so named, or in some language so signified. For in the Prophet Isaiah it is thus found: “Howl, ye ships of Carthage.” But in Ezekiel by some interpreters the word is translated Carthage, by some Tarshish: and from this diversity it can be understood that the same which was called Carthage, is called Tharsus. But it is manifest, that in the beginning of its reign Carthage flourished with ships, and so flourished, that among other nations they excelled in trafficking and navigation. For when Dido, flying from her brother, escaped to the parts of Africa, where she built Carthage, the ships which had been prepared for commerce in his country she had taken with her for her flight, the princes of the country consenting to it; and the same ships also when Carthage was built failed not in traffic. And hence that city became too proud, so that justly by its ships may be understood the pride of the nations, presuming on things uncertain, as on the breath of the winds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
