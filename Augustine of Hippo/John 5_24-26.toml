[[commentary]]
quote='''
"Verily, verily, I say unto you." Again He returns to the resurrection of souls, that by continual repetition we may apprehend His meaning; because we could not keep up with His discourse hastening on as on wings. Lo, the Word of God lingers with. us; lo, it doth, as it were, dwell with our infirmities. He returns again to the mention of the resurrection of souls. "Verily, verily, I say unto you, Whoso heareth my word, and believeth Him that sent me, hath eternal life;" but hath it as from the Father. "For whoso heareth my word, and believeth Him that sent me, hath eternal life" from the Father, by believing the Father that sent the Son "And shall not come into judgment, but is passed from death to life." But from the Father, whom he believes, is he quickened. What, dost Thou not quicken? See that the Son also "quickeneth whom He will." "Verily, verily, I say unto you, That the hour cometh when the dead shall hear the voice of the Son of God, and they that hear shall live." Here He did not say, they shall believe Him that sent me, and therefore shall live; but by hearing the voice of the Son of God, "they that hear," that is, they that obey the Son of God, "shall live." Therefore, both from the Father shall they live, when they will believe the Father; and from the Son shall they live, when they will hear the voice of the Son of God. Why shall they live both from the Father and from the Son "For even as the Father hath life in Himself, so also hath He given to the Son to have life in Himself."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
