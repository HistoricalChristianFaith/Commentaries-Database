[[commentary]]
quote='''
When he says: Knowing this, that our old man was crucified together with him, that the body of sin might be destroyed, this refers to what was said through Moses: Cursed is everyone who hangs upon a tree. For the crucifixion of the old man was signified in the cross of the Lord, just as the renewal of the new man was signified in the resurrection. And it is clear that we enact the old man—the one who is cursed—on account of whom, in respect of sin, no one doubts that it was said even of the Lord that he bore our sins, and was made sin for us, and from sin condemned sin. But what is it "to destroy the body of sin"? He himself explained it: That we should no longer serve sin; and that which he says: If we are dead with Christ—that is, if we have been crucified with Christ. For he says in another place: For those who are Christ Jesus' have crucified their flesh with its vices and concupiscences. Moses, therefore, did not curse the Lord, but prophesied what his crucifixion would show.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
Was it not enough that He was “dead”? wherefore “in abomination” also? Because He was crucified. For this death of the Cross was a great abomination in their eyes, as they did not perceive that it was spoken in prophecy, “Cursed is every one that hangeth on a tree.” For He did not Himself bring death; but He found it here, propagated from the curse of the first man; and this same death of ours, which had originated in sin, He had taken upon Himself, and hung on the Tree. Lest therefore some persons should think (as some of the Heretics think), that our Lord Jesus Christ had only a false body of flesh; and that the death by which He made satisfaction on the Cross was not a real death, the Prophet notices this, and says, “Cursed is every one that hangeth on a tree.” He shows then that the Son of God died a true death, the death which was due to mortal flesh: lest if He were not “accursed,” you should think that He had not truly died. But since that death was not an illusion, but had descended from that original stock, which had been derived from the curse, when He said, “Ye shall surely die:” and since a true death assuredly extended even to Him, that a true life might extend itself to us, the curse of death also did extend to Him, that the blessing of life might extend even unto us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
