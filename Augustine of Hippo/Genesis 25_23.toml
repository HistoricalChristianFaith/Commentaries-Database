[[commentary]]
quote='''
We must now take a look at the history of the city of God, as it takes its course from this point on among the descendants of Abraham. In the period from Isaac's birth to his seventieth year, when his first children were born, there is one memorable fact: He asked God that his wife, who was barren, might bear him a child. God heard the prayer, and she conceived twins who leaped while still in her womb. She was troubled by the disturbance, and, asking the Lord, she received this answer: "Two nations are in your womb; two people shall stem from your body. One people shall be stronger than the other, and the elder shall serve the younger."This is interpreted by the apostle Paul as an obvious proof of the working of grace: "For before the children had yet been born or had done anything of good or evil," the younger was chosen, through no merits of his own, and the older rejected. So far as original sin goes, both were equal. As for personal sins, neither had any.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252016.html'
source_title="City of God 16.35"

[[commentary]]
quote='''
For He is the God of Israel, our God, the God of Jacob, the God of the younger son, the God of the younger people. Let none say, Of the Jews said He this, I am not Israel; rather the Jews are not Israel. For the elder son, he is the elder people reprobated; the younger, the people beloved. “The elder shall serve the younger:” now is it fulfilled: now, brethren, the Jews serve us, they are as our satchellers, we studying, they carry our books. Hear wherein the Jews serve us, and not without reason.…With them are the Law and the Prophets, in which Law, and in which Prophets, Christ is preached. When we have to do with Pagans, and show this coming to pass in the Church of Christ, which before was predicted of the Name of Christ, of the Head and Body of Christ, lest they think that we have forged these predictions, and from things which have happened, as though they were future, had made them up, we bring forth the books of the Jews. The Jews forsooth are our enemies, from an enemy’s books convince we the adversary.…If any enemy clamour and say, “Ye for yourselves have forged prophecies;” be the books of the Jews brought forth, because the elder shall serve the younger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"
