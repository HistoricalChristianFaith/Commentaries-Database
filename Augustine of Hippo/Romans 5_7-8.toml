[[commentary]]
quote='''
“For while we were yet sinners, Christ died for us. For scarcely for a just man will one die: yet for a good man peradventure one would even dare to die:” but our Lord died for the wicked. For no merits of ours had gone before, for which the Son of God should die: but the more, because there were no merits, was His mercy great. How sure then, how firm is the promise, by which for the righteous He keepeth His life, who for the wicked gave His own death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
