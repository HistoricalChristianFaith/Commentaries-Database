[[commentary]]
quote='''
(Tr. lxi. 6.) Observe too his mode of speaking, which was not by word, but by beckoning; Beckoned and spake, i. e. spake by beckoning. If even thoughts speak, as when it is said, They spake among themselves, much more may beckonings, which are a kind of outward expression of our thoughts.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Simon Peter therefore beckons, and says to him." The expression is noteworthy, as indicating that something was said not by any sound of words, but by merely beckoning with the head. "He beckons, and says;" that is, his beckoning is his speech. For if one is said to speak in his thoughts, as Scripture saith, "They said [reasoned] with themselves;" how much more may he do so by beckoning, which expresses outwardly by some sort of signs what had previously been conceived within! What, then, did his beckoning mean? What else but that which follows? "Who is it of whom He speaks?" Such was the language of Peter's beckoning; for it was by no vocal sounds, but by bodily gestures, that he spake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252061.html'
source_title="Tractates on John 61"
