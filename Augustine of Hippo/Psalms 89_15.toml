[[commentary]]
quote='''
In all these things shall we not rejoice? or shall we contain our joy? or shall words suffice for our gladness? or shall the tongue be able to express our rejoicing? If therefore no words suffice, “Blessed is the people, O Lord, that knoweth glad shouting” (ver. 15). O blessed people! dost thou conceive aright, dost thou understand, glad shouting? For except thou understand glad shouting, thou canst not be blessed. What do I mean by understanding glad shouting? Whether thou knowest the source of that rejoicing which is beyond words to express. For this joy is not of thyself, since “he that glorieth, let him glory in the Lord.” Rejoice not then in thy own pride, but in God’s grace. See that that grace is such, that the tongue fails to express its greatness, and then thou understandest glad shouting.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"

[[commentary]]
quote='''
What then is it, “to jubilate”? For the title of the present Psalm especially maketh us give good heed to this word, for it is entitled, “A Psalm of confession.” What meaneth, to jubilate with confession? It is the sentiment thus expressed in another Psalm: “Blessed is the people that understandeth jubilance.” Surely that which being understood maketh blessed is something great. May therefore the Lord our God, who maketh men blessed, grant me to understand what to say, and grant you to understand what ye hear: “Blessed is the people that understandeth jubilance.” Let us therefore run unto this blessing, let us understand jubilance, let us not pour it forth without understanding. Of what use is it to be jubilant and obey this Psalm, when it saith, “Jubilate unto the Lord, all ye lands,” and not to understand what jubilance is, so that our voice only may be jubilant, our heart not so? For the understanding is the utterance of the heart.

I am about to say what ye know. One who jubilates, uttereth not words, but it is a certain sound of joy without words: for it is the expression of a mind poured forth in joy, expressing, as far as it is able, the affection, but not compassing the feeling. A man rejoicing in his own exultation, after certain words which cannot be uttered or understood, bursteth forth into sounds of exultation without words, so that it seemeth that he indeed doth rejoice with his voice itself, but as if filled with excessive joy cannot express in words the subject of that joy.…Those who are engaged at work in the fields are most given to jubilate; reapers, or vintagers, or those who gather any of the fruits of the earth, delighted with the abundant produce, and rejoicing in the very richness and exuberance of the soil, sing in exultation; and among the songs which they utter in words, they put in certain cries without words in the exultation of a rejoicing mind; and this is what is meant by jubilating.…

When then are we jubilant? When we praise that which cannot be uttered. For we observe the whole creation, the earth and the sea, and all things that therein are: we observe that each have their sources and causes, the power of production, the order of birth, the limit of duration, the end in decease, that successive ages run on without any confusion, that the stars roll, as it seemeth, from the East to the West, and complete the courses of the years: we see how the months are measured, how the hours extend; and in all these things a certain invisible element, I know not what, but some principle of unity, which is termed spirit or soul, present in all living things, urging them to the pursuit of pleasure and the avoidance of pain, and the preservation of their own safety; that man also hath somewhat in common with the Angels of God; not with cattle, such as life, hearing, sight, and so forth; but somewhat which can understand God, which peculiarly doth belong to the mind, which can distinguish justice and injustice, as the eye discerneth white from black. In all this consideration of creation, which I have run over as I could, let the soul ask itself: Who created all these things? Who made them? Who made among them thyself?…I have observed the whole creation, as far as I could. I have observed the bodily creation in heaven and on earth, and the spiritual in myself who am speaking, who animate my limbs, who exert voice, who move the tongue, who pronounce words, and distinguish sensations. And when can I comprehend myself in myself? How then can I comprehend what is above myself? Yet the sight of God is promised to the human heart, and a certain operation of purifying the heart is enjoined; this is the counsel of Scripture. Provide the means of seeing what thou lovest, before thou try to see it. For unto whom is it not sweet to hear of God and His Name, except to the ungodly, who is far removed, separated from Him?…

Be therefore like Him in piety, and earnest in meditation: for “the invisible things of Him are clearly seen, being understood by the things that are made;” look upon the things that are made, admire them, seek their author. If thou art unlike, thou wilt turn back; if like, thou wilt rejoice. And when, being like Him, thou shalt have begun to approach Him, and to feel God, the more love increaseth in thee, since God is love, thou wilt perceive somewhat which thou wast trying to say, and yet couldest not say. Before thou didst feel God, thou didst think that thou couldest express God; thou beginnest to feel Him, and then feelest that what thou dost feel thou canst not express. But when thou hast herein found that what thou dost feel cannot be expressed, wilt thou be mute, wilt thou not praise God? Wilt thou then be silent in the praises of God, and wilt thou not offer up thanksgivings unto Him who hath willed to make Himself known unto thee? Thou didst praise Him when thou wast seeking, wilt thou be silent when thou hast found Him? By no means; thou wilt not be ungrateful. Honour is due to Him, reverence is due to Him, great praise is due to Him. Consider thyself, see what thou art: earth and ashes; look who it is hath deserved to see, and What; consider who thou art, What to see, a man to see God! I recognise not the man’s deserving, but the mercy of God. Praise therefore Him who hath mercy.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520100.html'
source_title="Exposition on Psalm 100"
