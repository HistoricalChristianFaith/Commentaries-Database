[[commentary]]
quote='''
From this point Paul begins to discuss those works of the law which … no one denies also pertain to the new covenant, but with another aim, appropriate to those who perform good works "in freedom." These acts aim for the rewards of a love that hopes for eternal things and looks forward in faith. This is quite unlike the Jews, who were forced to fulfill these commandments from fear, and not that righteous fear which endures to eternity but one that made them fear for the present life. The result: they fulfill certain works of the law which consist in ceremonies but are completely unable to fulfill those that consist in good conduct. For nothing fulfills these except love.… And so the apostle now says, "You are called into freedom, brethren, but on condition that you do not let your freedom be an opportunity for the sin nature. Do not suppose, upon hearing the word freedom, that you can sin with impunity."
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 43 [1B.5.13]"

[[commentary]]
quote='''
Our hope is this, brethren, to be made free by the free One; and that, in setting us free, He may make us His servants. For we were the servants of lust; but being set free, we are made the servants of love. This also the apostle says: "For, brethren, ye have been called unto liberty; only Use not liberty for an occasion to the flesh, but by love serve one another." Let not then the Christian say, I am free; I have been called unto liberty: I was a slave, but have been redeemed, and by my very redemption have been made free, I shall do what I please: no one may balk me of my will, if I am free. But if thou committest sin with such a will, thou art the servant of sin. Do not then abuse your liberty for freedom in sinning, but use it for the purpose of sinning not. For only if thy will is pious, will it be free. Thou wilt be free, if thou art a servant still,-free from sin, the servant of righteousness : as the apostle says, "When ye were the servants of sin, ye were free from righteousness. But now, being made free from sin, and become servants to God, ye have your fruit unto holiness, and the end everlasting life." Let us be striving after the latter, and be doing the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
