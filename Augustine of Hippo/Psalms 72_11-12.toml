[[commentary]]
quote='''
“And there shall adore Him all kings of the earth, all nations shall serve Him” (ver. 11).

But while he is explaining the reasons why so great honour is paid Him by kings, and He is served of all nations: “because He hath delivered,” he saith, “the needy man from the mighty, and the poor man, to whom was no helper”(ver. 12). This needy and poor man is the people of men believing in Him. In this people are also kings adoring Him. For they do not disdain to be needy and poor, that is, humbly confessing sins, and needing the glory of God and the grace of God, in order that this King, Son of the King, may deliver them from the mighty one. For this same mighty one is he who above was called the Slanderer: whom mighty to subdue men to himself, and to hold them bound in captivity, not his virtue did make, but men’s sins. The same is himself also called strong; therefore here mighty also. But He that hath humbled the slanderer and hath entered into the house of the strong man to bind him and to spoil his vessels, He “hath delivered the needy and the poor man.” For this neither the virtue of any one could accomplish, nor any just man, nor any Angel. When then there was no helper, by His coming He saved them Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
