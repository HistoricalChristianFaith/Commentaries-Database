[[commentary]]
quote='''
This is that kingdom of heaven whereof it is said, "The kingdom of heaven is likened unto a man who sowed good seed in his field. But the good seed are the children of the kingdom;" and although now they are mingled with tares, at the end the King Himself shall send forth His angels, "and they shall gather out of His kingdom all things that offend. Then shall the righteous shine forth as the sun in the kingdom of their Father." The kingdom will shine forth in the kingdom when [those that are] the kingdom shall have reached the kingdom; just as we now pray when we say, "Thy kingdom come." Even now, therefore, already is the kingdom called, but only as yet being called together. For if it were not now called, it could not be then said, "They shall gather out of His kingdom everything that offends." But the realm is not yet reigning. Accordingly it is already so far the kingdom, that when all offences shall have been gathered out of it, it shall then attain to sovereignty, so as to possess not merely the name of a kingdom, but also the power of government.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252068.html'
source_title="Tractates on John 68"
