[[commentary]]
quote='''
For when he had said, “We have received Thy mercy in the midst of Thy people,” he signified that there is a people not receiving the mercy of God, in the midst of whom some do receive the mercy of God: and then lest it should occur to men that there are so few, as to be nearly none, how did He console them in the words following? “According to Thy Name, O God, so is Thy praise unto the ends of the earth” (ver. 9). What is this? …That is, as Thou art known through all the earth, so Thou art also praised through all the earth, nor are there wanting who now praise Thee through all the earth. But they praise Thee who live well. For, “According to Thy Name, O God, so is Thy praise,” not in a part, but “unto the ends of the earth.” “Thy right hand is full of righteousness.” That is, many are they also who shall stand at Thy right hand. Not only shall they be many who shall stand at Thy left hand, but there also shall be a full heap set at Thy right hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
