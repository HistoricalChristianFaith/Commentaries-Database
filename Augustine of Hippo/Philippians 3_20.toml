[[commentary]]
quote='''
What then? Are we now in heaven? In heaven we are by faith. For if not in heaven, where is the “Lift up your heart”? If not in heaven, whence with the Apostle Paul, “For our conversation is in heaven”? In body we walk on earth, in heart we dwell in heaven. We dwell there, if thither we send anything which holdeth us there. For no one dwelleth in heart, save where thought is: but there his thought is, where his treasure is. He hath treasured on earth, his heart doth not withdraw from earth: he hath treasured in heaven, his heart from heaven doth not come down: for the Lord saith plainly, “Where thy treasure is, there will thy heart be also.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
