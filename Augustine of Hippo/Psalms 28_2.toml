[[commentary]]
quote='''
“Hear, O Lord, the voice of my supplication, whilst I pray unto Thee, whilst I hold up my hands to Thy holy temple” (ver. 2). Whilst I am crucified for their salvation, who on believing become Thy holy temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
