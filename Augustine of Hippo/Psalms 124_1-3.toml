[[commentary]]
quote='''
The holy martyrs, you see, did not rely on themselves but asked for relief from Christ. That is why they were also victorious. Listen to the voices of those who do not rely on themselves; it is the voice of the holy martyrs: "Unless the Lord were among us, let Israel now say; unless the Lord were among us when people rose up against us, they would perhaps have swallowed us alive." The martyrs say, "Unless the Lord were among us," unless he had helped us, unless he had strengthened our hearts with faith, unless he had endowed us with patience, unless he had provided us with power as we fought, "they would perhaps have swallowed us alive."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520335F.html'
source_title="SERMON 335F.2"

[[commentary]]
quote='''
“Let them not say, We have swallowed him up.” Whence say those Martyrs, “If the Lord had not been on our side, then they had swallowed us up quick.” What is, “had swallowed us up”? Had passed into their own body. For that thou swallowest up, which thou passest into thy own body. The world would swallow thee up; swallow thou the world, pass it into thy own body: kill and eat. As it was said to Peter, “Kill and eat;” do thou kill in them what they are, make them what thou art. But if they on the other hand persuade thee to ungodliness, thou art swallowed up by them. Not when they persecute thee art thou swallowed up by them, but when they persuade thee to be what they are.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
