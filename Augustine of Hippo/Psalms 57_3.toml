[[commentary]]
quote='''
“He hath sent from heaven and hath saved me” (ver. 3). Now the Man Himself, now the Flesh Itself, now the Son of God after His partaking of ourselves, of Him it is manifest, how He was saved, and hath sent from heaven the Father and hath saved Him, hath sent from heaven, and hath raised Him again: but in order that ye may know, that also the Lord Himself hath raised again Himself; both truths are written in Scripture, both that the Father hath raised Him again, and that Himself Himself hath raised again. Hear ye how the Father hath raised Him again: the Apostle saith, “He hath been made,” he saith, “obedient unto death, even the death of the Cross: wherefore God also hath exalted Him, and hath given Him a name which is above every name.” Ye have heard of the Father raising again and exalting the Son; hear ye how that He too Himself His flesh hath raised again. Under the figure of a temple He saith to the Jews, “Destroy this Temple, and in three days I will raise it up.” But the Evangelist hath explained to us what it was that He said: “But this,” he saith, “He spake of the Temple of His Body.” Now therefore out of the person of one praying, out of the person of a man, out of the person of the flesh, He saith, “He hath saved me. He hath given unto reproach those that trampled on me.” Them that have trampled on Him, that over Him dead have insulted, that Him as though man have crucified, because God they perceived not, them He hath given unto reproach. See ye whether it has not been so done. The thing we do not believe as yet to come, but fulfilled we acknowledge it. The Jews raged against Christ, they were overbearing against Christ. Where? In the city of Jerusalem. For where they reigned, there they were puffed up, there their necks they lifted up. After the Passion of the Lord thence they were rooted out; and they lost the kingdom, wherein Christ for King they would not acknowledge. In what manner they have been given unto reproach, see ye: dispersed they have been throughout all nations, nowhere having a settlement, nowhere a sure abode. But for this reason still Jews they are, in order that our books they may carry to their confusion. For whenever we wish to show Christ prophesied of, we produce to the heathen these writings. And lest perchance men hard of belief should say that we Christians have composed these books, so that together with the Gospel which we have preached we have forged the Prophet, through whom there might seem to be foretold that which we preach: by this we convince them; namely, that all the very writings wherein Christ hath been prophesied are with the Jews, all these very writings the Jews have. We produce documents from enemies, to confound other enemies. In what sort of reproach therefore are the Jews? A document the Jew carrieth, wherefrom a Christian may believe. Our librarians they have become, just as slaves are wont behind their masters to carry documents, in such sort that these faint in carrying, those profit by reading. Unto such a reproach have been given the Jews: and there hath been fulfilled that which so long before hath been foretold, “He hath given unto reproach those that trampled on me.” But how great a reproach it is, brethren, that this verse they should read, and themselves being blind should look upon their mirror! For in the same manner the Jews appear in the holy Scripture which they carry, as appeareth the face of a blind man in a mirror: by other men it is seen, by himself not seen.

Thou wast inquiring perhaps when he said, “He hath sent from heaven and hath saved me.” What hath He sent from heaven? Whom hath He sent from heaven? An Angel hath He sent, to save Christ, and through a servant is the Lord saved? For all Angels are creatures serving Christ. For obedience there might have been sent Angels, for service they might have been sent, not for succour: as is written, “Angels ministered unto Him,” not like men merciful to one indigent, but like subjects to One Omnipotent. What therefore “hath He sent from heaven, and hath saved me”? Now we hear in another verse what from heaven He hath sent. “He hath sent from heaven His mercy and His truth.” For what purpose? “And hath drawn out my soul from the midst of the lions’ whelps.” “Hath sent,” he saith, “from heaven His mercy and His truth:” and Christ Himself saith, “I am Truth.” There was sent therefore Truth, that it should draw out my soul hence from the midst of the lions’ whelps: there was sent mercy. Christ Himself we find to be both mercy and truth; mercy in suffering with us, and truth in requiting us.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
