[[commentary]]
quote='''
Accordingly, after these incidents, He affirmed Himself to be the light of the world, and declared that he who followed Him would not walk in darkness, but would have the light of life. He said, also, that He was "the beginning which also discoursed to them." By which designation He clearly distinguished Himself from the light which He made, and presented Himself as the Light by which all things have been made. Consequently, when He said that He was the light of the world, we are not to take the words to bear simply the sense intended when He addressed the disciples in similar terms, saying, "Ye are the light of the world." For they are compared only to the kindled light, which is not to be put beneath a bushel, but to be set upon a candlestick; as He also says of John the Baptist, that "he was a burning and shining light." But He is Himself the beginning, of whom it is likewise declared, that "of His fulness have all we received."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
