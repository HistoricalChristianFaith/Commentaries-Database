[[commentary]]
quote='''
This he saw himself also. For I should not see it, save I saw it in Him, save I were in Him. For these are the words of the Body of Christ, whose members we are. He saw this, I say, and at once added, “Great are Thy mercies, O Lord” (ver. 156). Even our seeking out Thy righteousnesses, then, cometh of Thy mercies. “Quicken me according to Thy judgment.” For I know that Thy judgments will not be upon me without Thy mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
