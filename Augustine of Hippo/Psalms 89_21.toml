[[commentary]]
quote='''
“My hand shall hold Him fast, and My arm shall strengthen Him” (ver. 21): because there was a taking up of man; because flesh was assumed in the Virgin’s womb, because by Him who in the form of God is coequal with the Father, the form of a servant was taken, and He became obedient unto death, even the death of the Cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
