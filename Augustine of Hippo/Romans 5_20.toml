[[commentary]]
quote='''
Prohibition increased lust. It made it unconquered so that transgression might be added, which did not exist without the law, although there was sin.
'''
source_url='https://www.newadvent.org/fathers/1308.htm'
source_title="On Continence 3.7"

[[commentary]]
quote='''
"For the law was given by Moses;" which law held the guilty. For what saith the apostle? "The law entered that the offense might abound." It was a benefit to the proud that the offense abounded, for they gave much to themselves, and, as it were, attributed much to their own strength; and they were unable to fulfill righteousness without the aid of Him who had commanded it. God, desirous to subdue their pride, gave the law, as if saying: Behold, fulfill, and do not think that there is One wanting to command. One to command is not wanting, but one to fulfill.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
When he says: The law entered in secretly, that sin might abound, by this very word he sufficiently indicated that the Jews did not know by what dispensation the law was given. For it was not given as something that could give life, since grace gives life through faith; rather the law was given to show by how great and how tight bonds of sins those were constrained who presumed to fulfill righteousness by their own strength. Thus sin abounded, since both concupiscence became more ardent from the prohibition, and to those sinning against the law was added the charge of transgression. This is understood by one who considers the second stage among those four stages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
He was discoursing about the Jews and Gentiles, when he wrote to the Romans—themselves Gentiles—to this effect: "For as ye, in times past, have not believed God, yet have now obtained mercy through their unbelief; even so have these also now not believed, that through your mercy they also may obtain mercy; for God hath concluded them all in unbelief, that He might have mercy upon all." Now, after he had thought upon what he said, full of wonder at the certain truth of his own assertion, indeed, but astonished at its great depth, how God concluded all in unbelief that He might have mercy upon all,—as if doing evil that good might come,—he at once exclaimed, and said, "O the depth of the riches both of the wisdom and knowledge of God! how unsearchable are His judgments, and His ways past finding out!" Perverse men, who do not reflect upon these unsearchable judgments and untraceable ways, indeed, but are ever prone to censure, being unable to understand, have supposed the apostle to say, and censoriously gloried over him for saying, "Let us do evil, that good may come!" God forbid that the apostle should say so! But men, without understanding, have thought that this was in fact said, when they heard these words of the apostle: "Moreover, the law entered, that the offence might abound; but where sin abounded, grace did much more abound." But grace, indeed, effects this purpose—that good works should now be wrought by those who previously did evil; not that they should persevere in evil courses and suppose that they are recompensed with good. Their language, therefore, ought not to be: "Let us do evil, that good may come;" but: "We have done evil, and good has come; let us henceforth do good, that in the future world we may receive good for good, who in the present life are receiving good for evil."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 44"
