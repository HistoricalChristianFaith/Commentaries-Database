[[commentary]]
quote='''
“Prove me, O Lord, and try me” (ver. 2). Lest, however, any of my secret sins should be hid from me, prove me, O Lord, and try me, making me known, not to Thee from whom nothing is hid, but to myself, and to men. “Burn my reins and my heart.” Apply a remedial purgation, as it were fire, to my pleasures and thoughts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
