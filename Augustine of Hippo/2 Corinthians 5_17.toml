[[commentary]]
quote='''
We are then truly free when God orders our lives, that is, forms and creates us not as human beings—this he has already done—but as good people, which he is now doing by his grace, that we may indeed be new creatures in Christ Jesus. Accordingly the prayer: "Create in me a clean heart, O God.".
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 9.31"


[[commentary]]
quote='''
“The earth is full of Thy creation.” Of what creation of Thine is the earth full? Of all trees and shrubs, of all animals and flocks, and of the whole of the human race; the earth is full of the creation of God. We see, know, read, recognise, praise, and in these we preach of Him; yet we are not able to praise respecting these things, as fully as our heart doth abound with praise after the beautiful contemplation of them. But we ought rather to heed that creation, of which the Apostle saith, “If any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.” What “old things have passed away”? In the Gentiles, all idolatry; in the Jews themselves, all that servitude unto the Law, all those sacrifices that were harbingers of the present Sacrifice. The oldness of man was then abundant; One came to renovate His own work, to melt His silver, to form His coin, and we now see the earth full of Christians believing in God, turning themselves away from their former uncleanness and idolatry, from a past hope to the hope of a new age: and behold it is not yet realized, but is already possessed in hope, and through that very hope we now sing, and say, “The earth is full of Thy creation.” We do not as yet sing this in our country, nor yet in that rest which is promised, the bars of the gates of Jerusalem not being as yet made fast; but still in our pilgrimage gazing upon the whole of this world, upon men who on every side are running unto the faith, fearing hell, despising death, loving eternal life, scorning the present, and filled with joy at such a spectacle, we say, “The earth is full of Thy creation.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
