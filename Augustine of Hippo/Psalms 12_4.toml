[[commentary]]
quote='''
“Who have said, We will magnify our tongue, our lips are our own, who is Lord over us?” (ver. 4). Proud hypocrites are meant, putting confidence in their speech to deceive men, and not submitting themselves to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252012.html'
source_title="Exposition on Psalm 12"
