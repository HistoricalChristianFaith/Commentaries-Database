[[commentary]]
quote='''
“With my voice have I cried unto the Lord” (ver. 4); that is, not with the voice of the body, which is drawn out with the sound of the reverberation of the air; but with the voice of the heart, which to men speaks not, but with God sounds as a cry. By this voice Susanna was heard; and with this voice the Lord Himself commanded that prayer should be made in closets, that is, in the recesses of the heart noiselessly. Nor would one easily say that prayer is not made with this voice, if no sound of words is uttered from the body; since even when in silence we pray within the heart, if thoughts interpose alien from the mind of one praying, it cannot yet be said, “With my voice have I cried unto the Lord.” Nor is this rightly said, save when the soul alone, taking to itself nothing of the flesh, and nothing of the aims of the flesh, in prayer, speaks to God, where He only hears. But even this is called a cry by reason of the strength of its intention. “And He heard me out of His holy mountain.” We have the Lord Himself called a mountain by the Prophet, as it is written, “The stone that was cut out without hands grew to the size of a mountain.” But this cannot be taken of His Person, unless peradventure He would speak thus, out of myself, as of His holy mountain He heard me, when He dwelt in me, that is, in this very mountain. But it is more plain and unembarrassed, if we understand that God out of His justice heard. For it was just that He should raise again from the dead the Innocent who was slain, and to whom evil had been recompensed for good, and that He should render to the persecutor a meet reward, who repaid Him evil for good. For we read, “Thy justice is as the mountains of God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"

[[commentary]]
quote='''
“His holy Hill” is His holy Church. It is that mountain which, according to Daniel’s vision, grew from a very small “stone,” till it crushed the kingdoms of the earth; and grew to such a size, that it “filled the face of the earth.” This is the “hill,” from which he tells us that his prayer was heard, who says, “I cried unto the Lord with my voice, and He heard me out of His holy hill.” Let no one of those that are without that mountain, hope to be heard unto eternal life. For many are heard in their prayers for many things. Let them not congratulate themselves on being heard; the devils were heard in their prayer, that they might be sent into the swine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252043.html'
source_title="Exposition on Psalm 43"

[[commentary]]
quote='''
What does it profit to pray, and yet not to pray on the Mount? “I cried,” says he, “unto the Lord with my voice: and He heard me out of His holy hill.” Out of what “hill”? Out of that of which it is said, “A city set upon a hill cannot be hid.” Of what “hill”? Out of that hill which Daniel saw “grow out of a small stone, and break all the kingdoms of the earth; and cover all the face of the earth.” There let him pray, who hopes to receive: there let him ask, who would have his prayer heard: there let him confess, who wishes to be pardoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
