[[commentary]]
quote='''
(Tr. cxvi. 8) Pilate still tries to overcome their apprehensions on Caesar's account; Pilate saith unto them, Shall I crucify your King? He tries to shame them into doing what he had not been able to soften them into by putting Christ to shame.
The chief priests answered, We have no king but Caesar.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
See and observe, my brethren: Christ as King they would not have, and portions of foxes they have been made. For when Pilate the deputy governor in Judæa slew Christ at the voices of the Jews, he said to the same Jews, “Your King shall I crucify?” Because He was called King of the Jews, and He was the true King. And they rejecting Christ said, “We have no king but Cæsar.” They rejected a Lamb, chose a fox: deservedly portions of foxes they were made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
Therefore when the Lord Himself came, the kingdom of the Jews was overthrown, and removed from the Jews. Now they have no king; because they will not acknowledge the true King. See now whether they must be called Jews. Now ye do see that they must not be called Jews. They have themselves with their own voice resigned that name, so that they are not worthy to be called Jews, except only in the flesh. When did they sever themselves from the name? They said, “We have no king but Cæsar.” O ye who are called Jews and are not, if ye have no king but Cæsar, there hath failed a Prince of Judah: there hath come then He to whom the promise hath been made. They then are more truly Jews, who have been made Christians out of Jews: the rest of the Jews, who in Christ have not believed, have deserved to lose even the very name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
