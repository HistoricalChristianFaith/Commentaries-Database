[[commentary]]
quote='''
These righteousnesses Jacob learnt from God, who made him to wrestle with an Angel; under the guise of which Angel, God Himself wrestled with him. He held Him, he exerted violence to hold Him, he prevailed to hold Him: He caused Himself to be held, in mercy, not in weakness. Jacob therefore wrestled, and prevailed: he held Him and when he seemed to have conquered Him asked to be blessed of Him. How did he understand with Whom he had wrestled, Whom he had held? Wherefore did he wrestle violently, and hold Him? Because “the kingdom of heaven suffereth violence, and the violent take it by force.” Wherefore then did he wrestle? Because it is with toil. Wherefore do we with difficulty hold, what we so easily lose? Lest, easily getting back what we have lost, we learn to lose that which we hold. Let man have toil to hold: he will hold firmly, what he has only held after toil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
