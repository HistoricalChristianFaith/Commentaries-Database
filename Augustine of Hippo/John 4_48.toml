[[commentary]]
quote='''
(Tr. xvi. c. 3) Did not he who made this request believe? Mark what our Lord says; Then said Jesus unto him, Except ye see signs and wonders, ye will not believe. This is to charge the man either with lukewarmness, or coldness of faith, or with want of faith altogether: as if his only object was to put Christ's power to the test, and see who and what kind of person Christ was, and what He could do. The word prodigy (wonder) signifies something far off, in futurity.

Our Lord would have the mind of the believer so raised above all mutable things, as not to seek even for miracles. For miracles, though sent from heaven, are, in their subject matter, mutable.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For, though one of the chosen and holy twelve, yet he was an Israelite, of the Lord's nation, that Thomas who desired to put his fingers into the places of the wounds. The Lord censured him just as He did this ruler. To the ruler He said, "Except ye see signs and wonders, ye believe not;" and to Thomas He said, "Because thou hast seen, thou hast believed."He had come to the Galileans after the Samaritans, who had believed His word, before whom He wrought no miracles, whom He without anxiety quickly left, strong in faith, because by the presence of His divinity He had not left them. Now, then, when the Lord said to Thomas, "Come, reach hither thy hand, and be not faithless, but believing;" and he, having touched the places of the wounds, exclaimed, and said, "My Lord, and my God;" he is chided, and has it said to him, "Because thou hast seen, thou hast believed." Why, but "because a prophet has no honor in his own country?" But since this Prophet has honor among strangers, what follows? "Blessed are they that have not seen, and yet have believed." We are the persons here foretold; and that which the Lord by anticipation praised, He has deigned to fulfill even in us. They saw Him, who crucified Him, and touched Him with their hands, and thus a few believed; we have not seen nor handled Him, we have heard and believed. May it be our lot, that the blessedness which He has promised may be made good in us: both here, because we have been preferred to His own country; and in the world to come, because we have been grafted in instead of the branches that were broken off!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252016.html'
source_title="Tractates on John 16"

[[commentary]]
quote='''
Once more, he brings us again to Cana of Galilee, where Jesus had made the water wine. In that narrative he tells us how He spoke to the nobleman, whose son was sick, in these terms: "Except ye see signs and wonders ye believe not :" in which saying He aims at lifting the mind of the believer high above all things mutable, so that He would not have even the miracles themselves, which, however they may bear the impression of what is divine, are yet wrought in the instance of what is changeable in bodies, made objects of seeking on the part of the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
