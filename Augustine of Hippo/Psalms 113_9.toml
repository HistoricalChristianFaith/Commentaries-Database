[[commentary]]
quote='''
What then, brethren, if we have already heard of those humble things which are in heaven, lifted up from the mire, that they might be set with the princes of the people; have we by consequence heard nothing of the humble things which the Lord beholdeth on the earth? For those friends who will judge with their Lord are fewer, while those whom they receive into everlasting habitations are more in number. For although the whole of a heap of corn compared with the separate chaff may seem to contain few in number; yet considered by itself, it is abundant.…The Church then speaketh thus in that sense, wherein she seemeth to bear no offspring among those crowds who have not given up all things, that they might follow the Lord, and might sit upon the twelve thrones. But how many in the same crowd, who make unto themselves friends of the mammon of unrighteousness, shall stand on the right hand through works of mercy? He not only then lifteth up from the mire him whom He is to place with the princes of His people; but also, “Maketh the barren woman to keep house, and to be a joyful mother of children” (ver. 9): He who dwelleth on high, and beholdeth the humble things that are in heaven and earth, the seed of Abraham like the stars of heaven, holiness set on high in heavenly habitations; and like the sand on the sea shore, a merciful and countless multitude gathered together from the harmful waves, and the bitterness of impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520113.html'
source_title="Exposition on Psalm 113"
