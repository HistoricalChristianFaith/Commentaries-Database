[[commentary]]
quote='''
“My heart hath said to Thee, I have sought Thy countenance” (ver. 8). For I have not exhibited myself to men; but in secret, where Thou alone hearest, my heart hath said to Thee; I have not sought from Thee aught without Thee as a reward, but Thy countenance. “Thy countenance, O Lord, will I seek.” In this search will I perseveringly persist: for not aught that is common, but Thy countenance, O Lord, will I seek, that I may love Thee freely, since nothing more precious do I find.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
