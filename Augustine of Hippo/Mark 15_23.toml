[[commentary]]
quote='''
(de Con. Evan. iii. 11) This we must understand to be what Matthew expresses by, mixed with gall; for he put gall for any thing bitter, and wine mingled with myrrh is most bitter; although there may have been both gall and myrrh to make the wine most bitter.

(ubi sup.) That which follows, But he received it not, must' mean, He received it not to drink, but only tasted it, as Matthew witnesses. And what the same Matthew relates, he would not drink, Mark expresses by, he received it not, but was silent as to His tasting it.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The same Matthew next adds, "and they gave Him wine to drink, mingled with gall; and when He had tasted thereof, He would not drink." This is given by Mark as follows: "And they gave Him to drink wine mingled with myrrh; and He received it not." Here we may understand Matthew to have conveyed the same sense as Mark, when he speaks of the wine being "mingled with gall." For the gall is mentioned with a view to express the bitterness of the potion. And wine mingled with myrrh is remarkable for its bitterness. The fact may also be that gall and myrrh together made the wine exceedingly bitter. Again, when Mark says that "He received it not," we understand the phrase to denote that He did not receive it so as actually to drink it. He did taste it, however, as Matthew certifies. Thus Mark's words, "He received it not," convey the same meaning as Matthew's version, "He would not drink." The former, however, has said nothing about His tasting the potion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 11"
