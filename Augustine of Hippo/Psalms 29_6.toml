[[commentary]]
quote='''
“And shall bruise them as the calf of Libanus” (ver. 6). And when their proud exaltation hath been cut off, He will lay them low after the imitation of His Own humility, who like a calf was led to slaughter by the nobility of this world. “For the kings of the earth stood up, and the rulers agreed together against the Lord, and against His Christ.” “And the Beloved is as the young of the unicorns.” For even He the Beloved, and the Only One of the Father, “emptied Himself” of His glory; and was made man, like a child of the Jews, that were “ignorant of God’s righteousness,” and proudly boasting of their own righteousness as peculiarly theirs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252029.html'
source_title="Exposition on Psalm 29"
