[[commentary]]
quote='''
Luke, on the other hand, has omitted to mention the number of times that He prayed. He has told us, however, a fact which is not recorded by the others—namely, that when He prayed He was strengthened by an angel, and that, as He prayed more earnestly, He had a bloody sweat, with drops falling down to the ground. Thus it appears that when he makes the statement, "And when He rose up from prayer, and was come to His disciples," he does not indicate how often He had prayed by that time. But still, in so doing, he does not stand in any kind of antagonism to the other two. Moreover, John does indeed mention how He entered into the garden along with His disciples. But he does not relate how He was occupied there up to the period when His betrayer came in along with the Jews to apprehend Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 4"
