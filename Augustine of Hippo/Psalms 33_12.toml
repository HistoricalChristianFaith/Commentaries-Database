[[commentary]]
quote='''
“Blessed is the nation whose God is the Lord:” one nation is blessed, belonging to the heavenly city, which hath not chosen save the Lord for their God: “And the people whom He hath chosen for His own inheritance” (ver. 12): and which not of itself, but by the gift of God, hath been chosen, that He by possessing it may not suffer it to be uncared for and miserable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
