[[commentary]]
quote='''
When he says: Receive him who is weak in faith, not in disputes over thoughts, he says this so that we may receive the one who is weak in faith, and by our own firmness bear with his weakness, and not pass judgment on his thoughts—that is, that we should not dare to pass sentence on another's heart, which we do not see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
