[[commentary]]
quote='''
And seeing that being delivered over to the lust of his own heart, and predestinated to extreme condemnation, he is to come, by wicked arts, to that vain and empty height and rule; therefore it follows, “For he hath said in his heart, I shall not move from generation to generation without evil” (ver. 6): that is, my fame and my name will not pass from this generation to the generation of posterity, unless by evil arts I acquire so lofty a principality, that posterity cannot be silent concerning it. For a mind abandoned and void of good arts, and estranged from the light of righteousness, by bad arts devises a passage for itself to a fame so lasting, as is celebrated even in posterity. And they that cannot be known for good, desire that men should speak of them even for ill, provided that their name spread far and wide. And this I think is here meant, “I shall not move from generation to generation without evil.” There is too another interpretation, if a mind vain and full of error supposes that it cannot come from the mortal generation to the generation of eternity, but by bad arts: which indeed was also reported of Simon, when he thought that he would gain heaven by wicked arts, and pass from the human generation to the generation divine by magic. Where then is the wonder, if that man of sin too, who is to fill up all the wickedness and ungodliness, which all false prophets have begun, and to do such “great signs; that, if it were possible, he should deceive the very elect,” shall say in his heart, “I shall not move from generation to generation without evil”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
