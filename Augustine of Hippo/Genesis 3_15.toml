[[commentary]]
quote='''
Enmities are not set between the serpent and the man but between the serpent and the woman. This is surely not because he fails to deceive and tempt men, is it? On the contrary, it is clear that he does deceive them. Or is it because he did not deceive Adam but his woman? But is the serpent then not the enemy of the man to whom that deception came through his woman, especially since "I will place enmity between you and the woman" is stated in the future? If the reason is that he did not thereafter deceive Adam, it is also true that he did not thereafter deceive Eve. Hence, why does Scripture put it this way? To show clearly that we cannot be tempted by the devil except through that animal part, which reveals, so to speak, the image or exemplification of the woman in the one whole man.
'''
source_url=''
source_title="TWO BOOKS ON GENESIS AGAINST THE MANICHAEANS 2.18.28"

[[commentary]]
quote='''
Therefore when the Lord would caution His Church, He said, “It shall watch thy head, and thou shalt watch his heel.” The serpent watcheth when the foot of pride may come against thee, when thou mayest fall, that he may cast thee down. But watch thou his head: the beginning of all sin is pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"


[[commentary]]
quote='''
With the heel a man slippeth. Let your Love observe. What was said by God to the Serpent? “She shall mark thy head, and thou shalt mark her heel.” The devil marketh thy heel, in order that when thou slippest he may overthrow thee. He marketh thy heel, do thou mark his head. What is his head? The beginning of an evil suggestion. When he beginneth to suggest evil thoughts, then do thou thrust him away before pleasure ariseth, and consent followeth; and so shalt thou avoid his head, and he shall not grasp thy heel. But wherefore said He this to Eve? Because through the flesh man doth slip. Our flesh is an Eve within us. “He that loveth his wife,” he saith, “loveth himself.” What meaneth “himself”? He continueth, and saith, “For no man ever yet hath hated his own flesh.” Because then the devil would make us slip through the flesh, just as he made that man Adam to slip, through Eve; Eve is bidden to mark the head of the devil, because the devil marketh her heel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
