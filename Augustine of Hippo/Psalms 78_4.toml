[[commentary]]
quote='''
“They have not been hidden from their sons in another generation” (ver. 4). This is our generation wherein there hath been given to us regeneration. “Telling forth the praises of the Lord and His powers, and His wonderful works which He hath done.” The order of the words is, “and our fathers have told unto us, telling forth the praises of the Lord.” The Lord is praised, in order that He may be loved. For what object can be loved more to our health?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
