[[commentary]]
quote='''
"The man answered and said unto them, Herein is a marvellous thing, that ye know not from whence he is, and yet he hath opened mine eyes. Now we know that God heareth not sinners; but if any man is a worshipper of God, and doeth His will, him He heareth." He speaks still as one only anointed. For God heareth even sinners. For if God heard not sinners, in vain would the publican, casting his eyes on the ground, and smiting on his breast, have said, "Lord, be merciful to me a sinner." And that confession merited justification, as this blind man enlightenment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
