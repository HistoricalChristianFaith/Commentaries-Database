[[commentary]]
quote='''
There are some who think that in the resurrection all will be men and that women will lose their sex. This view springs from this text and Ephesians: "Until we all attain to perfect manhood." … For my part, I think that those who believe that there will be two sexes in the resurrection are more sensible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252019.html'
source_title="City of God 19.22.17"

[[commentary]]
quote='''
When he says: That he might be the firstborn among many brethren, he teaches well enough that our Lord is to be understood in one way as only-begotten, in another as firstborn. For where he is called Only-begotten, he has no brethren and is by nature the Son of God, the Word in the beginning, through whom all things were made. But according to the assumption of manhood and the dispensation of the incarnation—through which he deigned to call even us, who are not sons by nature, into the adoption of sons—he is called firstborn, with the addition of brethren. For where he is called first, he is surely not alone, but has brethren who are to follow into that which he himself has gone before. Hence in another place too he calls him the firstborn from the dead, that he himself might hold the primacy. For the resurrection of the dead, so that they die no more, was before him in no one, but after him is of many saints, whom he is not ashamed to call brethren on account of that very sharing of humanity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
