[[commentary]]
quote='''
(in Serm. non occ.) When now nought of suffering remains to be endured, death still lingers, knowing that it has nothing there. The ancient foe suspected somewhat unusual. This man, first and only, he found having no sin, free from guilt, owing nothing to the laws of his jurisdiction. But leagued with Jewish madness, Death comes again to the assault, and desperately invades the Life-giver. And Jesus, when he had cried again with a loud voice, yielded up the ghost. Wherefore should we be offended that Christ came from the bosom of the Father to take upon Him our bondage, that He might confer on us His freedom; to take upon Him our death, that we might be set free by His death; by despising death He exalted us mortals into Gods, counted them of earth worthy of things in heaven? For seeing the Divine power shines forth so brilliant in the contemplation of its works, it is an argument of boundless love, that it suffers for its subjects, dies for its bondsmen. This then was the first cause of the Lord's Passion, that He would have it known how great God's love to man, Who desired rather to be loved than feared. The second was that He might abolish with yet more justice the sentence of death which He had with justice passed. For as the first man had by guilt incurred death through God's sentence, and handed down the same to his posterity, the second Man, who knew no sin, came from heaven that death might be condemned, which, when commissioned to seize the guilty, had presumed to touch the Author of sinlessness. And it is no wonder if for us He laid down what He had taken of us, His life, namely, when He has done other so great things for us, and bestowed so much on us.

(Cons. Ev. iii. 18.) Luke mentions the words which He thus cries out, Father, into thy hands I commend my Spirit.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew proceeds as follows: "And Jesus, crying again with a loud voice, yielded up the ghost." In like manner, Mark says, "And Jesus cried with a loud voice, and gave up the ghost." Luke, again, has told us what He said when that loud voice was uttered. For his version is thus: "And Jesus, crying with a loud voice, said, Father, into Thy hands I commend my spirit: and saying this, He gave up the ghost." John, on the other hand, as he has left unnoticed the first voice, which Matthew and Mark have reported—namely, "Eli, Eli"—has also passed over in silence the one which has been recited only by Luke, while the other two have referred to it under the designation of the "loud voice." I allude to the cry, "Father, into Thy hands I commend my spirit." Luke has also attested the fact that this exclamation was uttered with a loud voice; and hence we may understand this particular cry to be identified with the loud voice which Matthew and Mark have specified. But John has stated a fact which is noticed by none of the other three, namely, that He said "It is finished," after He had received the vinegar. This cry we take to have been uttered previous to the loud voice referred to. For these are John's words: "When Jesus, therefore, had received the vinegar, He said, It is finished; and He bowed His head, and gave up the ghost." In the interval elapsing between this cry, "It is finished," and what is referred to in the subsequent sentence, "and He bowed His head and gave up the ghost," the voice was uttered which John himself has passed over without record, but which the other three have noticed. For the precise succession appears to be this, namely, that He said first "It is finished," when what had been prophesied regarding Him was fulfilled in Him, and that thereafter—as if He had been waiting for this, like one, indeed, who died when He willed it to be so—He commended His spirit [to His Father], and resigned it. But, whatever the order may be in which a person may consider it likely that these words were spoken, he ought above all things to guard against entertaining the notion that any one of the evangelists is in antagonism with another, when one leaves unmentioned something which another has repeated, or particularizes something which another has passed by in silence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 18"
