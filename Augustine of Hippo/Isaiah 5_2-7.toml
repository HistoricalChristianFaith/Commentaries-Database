[[commentary]]
quote='''
For thus He threatens her through Isaiah, “I will throw down her enclosure.” Wherefore? “For I looked that she should bring forth grapes, but she brought forth thorns.” I looked for fruit from thence, and I found sin. Why then dost thou ask, O Asaph, “Why hast Thou thrown down her enclosure?” For knowest thou not why? I looked that she should do judgment, and she did iniquity. Must not her enclosure needs be thrown down?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
