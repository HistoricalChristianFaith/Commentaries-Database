
[[commentary]]
quote='''
In a similar way also, in another passage, St. Peter, who loved the Lord, but did not yet fully understand the reason of His coming, was afraid of His dying, and so displeased the Life, to wit, the Lord Himself; for when He was intimating to the disciples what He was about to suffer at Jerusalem at the hands of the Jews, Peter made reply among the rest, and said, "Far be it from Thee, Lord; pity Thyself: this shall not be unto Thee." And at once the Lord replied, "Get thee behind me, Satan: for thou savorest not the things that be of God, but those that be of men." And yet a little before, in confessing the Son of God, he had merited commendation: for he heard the words, "Blessed art thou, Simon Barjona: for flesh and blood hath not revealed it unto thee, but my Father who is in heaven." To whom He had said, "Blessed art thou," He now says, "Get thee behind me, Satan;" because it was not of himself that he was blessed. But of what then? "For flesh and blood hath not revealed it unto thee, but my Father who is in heaven." See, this is how thou art blessed, not from anything that is thine own, but from that which is mine. Not that I am the Father, but that all things which the Father hath are mine. But if his blessedness came from the Lord's own working, from whose [working] came he to be Satan? He there tells us: for He assigned the reason of such blessedness, when He said, "Flesh and blood hath not revealed this unto thee, but my Father who is in heaven:" that is the cause of thy blessedness. But that I said, "Get thee behind me, Satan, hear also its cause. For thou savorest not the things that be of God, but those that be of men." Let no one then flatter himself: in that which is natural to himself he is Satan, in that which is of God he is blessed. For all that is of his own, whence comes it, but from his sin? Put away the sin, which is thine own. Righteousness, He saith, belongeth unto me. For what hast thou that thou didst not receive?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"

[[commentary]]
quote='''
…Many have been confounded to their health: many, put to shame, have passed over from the persecution of Christ to the society of His members with devoted piety; and this would not have been, had they not been confounded and put to shame. Therefore he wished well to them.…Let them not go before, but follow; let them not give counsel, but take it. For Peter would go before the Lord, when the Lord spake of His future Passion: he would to Him as it were give counsel for His health. The sick man to the Saviour give counsel for His health! And what said he to the Lord, affirming that His future Passion? “Be it far from Thee, Lord. Be gracious to Thyself. This shall not be to Thee.” He would go before that the Lord might follow; and what said He? “Get thee behind Me, Satan.” By going before thou art Satan, by following thou wilt be a disciple. The same then is said to these also, “Let them be turned back and brought to confusion that think evil against me.” For when they have begun to follow after, now they will not think evil against me, but desire my good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
[[commentary]]
quote='''
For when they are before, they are wishing to take precedence of their Lord; to be better than He; but if they go behind Him, they acknowledge Him to be better than they; they acknowledge that He ought to go before; that He should precede, they follow. Thence He thus rebukes Peter giving Him evil counsel. For the Lord, when about to suffer for our salvation, also foretold what was to happen concerning that Passion itself; and Peter says, “Be it far from Thee,” “God forbid it!” “This shall not be!” He would fain have gone before his Lord; would have given counsel to his Master! But the Lord, that He might make him not go before Him, but follow after Him, says, “Get thee behind, Satan!” It is for this reason He said “Satan,” because thou art seeking to go before Him, whom thou oughtest to follow; but if thou art behind, if thou follow Him, thou wilt henceforth not be “Satan.” What then? “Upon this Rock I will build My Church.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
The Lord to His disciples was speaking of His Passion that was to be. Peter shuddered, and saith, “Far be it, O Lord;” he that a little before had said, “Thou art the Christ, Son of the living God,” having confessed God, feared for Him to die, as if but a man. But the Lord who so came that He might suffer (for we could not otherwise be saved unless with His blood we were redeemed), a little before had praised the confession of Peter.…But immediately when the Lord beginneth to speak of His Passion, he feared lest He should perish by death, whereas we ourselves should perish unless He died; and he saith, “Far be it, O Lord, this thing shall not be done.” And the Lord, to him to whom a little before He had said, “Blessed thou art, and upon this Rock I will build my Church,” saith, “Go back behind, Satan, an offence thou art to Me.” Why therefore “Satan” is he, that a little before was “blessed,” and a “Rock”? “For thou savourest not the things which are of God,” He saith, “but those things which are of man.” A little before he savoured the things which are of God: because “not flesh and blood hath revealed to thee, but My Father which is in the Heavens.” When in God he was praising his discourse, not Satan but Peter, from petra: but when of himself and out of human infirmity, carnal love of man, which would be for an impediment to his own salvation, and that of the rest, Satan he is called. Why? Because to go before the Lord he willed, and earthly counsel to give to the heavenly Leader. “Far be it, O Lord, this thing shall not be done.” Thou sayest, “Far be it,” and thou sayest, “O Lord:” surely if Lord He is, in power He doeth: if Master He is, He knoweth what He doeth, He knoweth what He teacheth. But thou willest to lead thy Leader, teach thy Master, command thy Lord, choose for God: much thou goest before, go back behind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"

[[commentary]]
quote='''
Not with God, but behind God; that He may go before, thou mayest follow. For he that shall have willed to go before God, by his own counsel would live, and will not follow the commandments of God. Because of this even Peter was rebuked, when he willed to give counsel to Christ, who was going to suffer for us.…“Far be it from Thee, O Lord, be Thou merciful to Thyself.” And the Lord, “Go back behind Me, Satan: for thou savourest not the things which are of God, but the things which are of men.” Wherefore, the things which are of men? Because to go before Me thou desirest, go back behind Me, in order that thou mayest follow me: so that now following Christ he might say, “My soul hath been glued on behind Thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
Matthew proceeds in the following strain: "Then charged He His disciples that they should tell no man that He was Jesus the Christ. From that time forth began Jesus to show unto His disciples how that He must go into Jerusalem, and suffer many things of the elders, and chief priests, and scribes;" and so on, down to where we read, "Thou savourest not the things that be of God, but those that be of men." Mark and Luke add these passages in the same order. Only Luke says nothing about the opposition which Peter expressed to the passion of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 54"
