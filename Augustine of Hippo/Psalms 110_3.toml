[[commentary]]
quote='''
Listen to the voice of the Father to the Son: "Before Lucifer I have begotten Thee." He who was begotten before Lucifer Himself illuminates all. A certain one was named Lucifer, who fell; for he was an angel and became a devil; and concerning him the Scripture said, "Lucifer, who did arise in the morning, fell" And why was he Lucifer? Because, being enlightened, he gave forth light. But for what reason did he become dark! Because he abode not in the truth. Therefore He was before Lucifer, before every one that is enlightened; since before every one that is enlightened, of necessity He must be by whom all are enlightened who can be enlightened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
“With Thee the beginning on the day of Thy power” (ver. 3). What is this day of His power, when is there beginning with Him, or what beginning, or in what sense is there beginning with Him, since He is the Beginning?…

What meaneth, “With Thee is the beginning”? Suppose anything you please as the beginning. Of Christ Himself, it would rather have been said, Thou art the Beginning, than, With Thee is the beginning. For He answered to those who asked Him, “Who art Thou?” and said, “Even the same that I said unto you, the Beginning;” since His Father also is the Beginning, of whom is the only-begotten Son, in which Beginning was the Word, for the Word was with God. What then, if both the Father and the Son are the beginning, are there two beginnings? God forbid! For as the Father is God, and the Son is God, but the Father and the Son are not two Gods, but one God: so is the Father Beginning and the Son Beginning, but the Father and the Son are not two, but one Beginning. “With Thee is the beginning.” Then it shall appear in what sense the beginning is with Thee. Not that the beginning is not with Thee here also. For hast Thou not also said, “Behold, ye shall be scattered, every man to his own, and shall leave Me alone; but I am not alone, because the Father is with Me”? Here therefore also, the beginning is with Thee. For Thou hast said elsewhere also, “But the Father that dwelleth in Me, He doeth His works.” “With Thee is the beginning:” nor was the Father ever separated from Thee. But when the Beginning shall appear to be with Thee, then shall it be manifest unto all who are made like Thee; since they shall see Thee as Thou art; for Philip saw Thee here, and sought the Father. Then therefore shall be seen what now is believed: then shall “the beginning be with Thee” in the sight of the righteous, in the sight of saints; the ungodly being removed, that they may not see the brightness of the Lord.…

Explain of what power thou speakest. Because here also, as is said, His power is mentioned, when the rod of His power is sent forth out of Sion, that He may be Ruler in the midst of His enemies. Of what power speakest thou, “In the splendour of the saints”? “In the splendour,” he saith, “of the saints.” He speaketh of that power when the saints shall be in splendour; not when still carrying about their earthly flesh, and groaning in a mortal and corruptible body.…

But this is put off, this will be granted afterwards: what is there now? “From the womb I have begotten Thee, before the morning star.” What is here? If God hath a Son, hath He also a womb? Like fleshly bodies, He hath not; for He hath not a bosom either; yet it is said, “He who is in the bosom of the Father, hath declared Him.” But that which is the womb, is the bosom also: both bosom and womb are put for a secret place. What meaneth, “from the womb”? From what is secret, from what is hidden; from Myself, from My substance; this is the meaning of “from the womb;” for, “Who shall declare His generation?” Let us then understand the Father saying unto the Son, “From My womb before the morning star have I brought Thee forth.” What then meaneth, “before the morning star”? The morning star is put for the stars, as if the Scripture signified the whole from a part, and from one conspicuous star all the stars. But how were those stars created? “That they may be for signs, and for seasons, and for days, and years.”…This expression also, “before the morning star,” is used both figuratively and literally, and was thus fulfilled. For the Lord was born at night from the womb of the Virgin Mary; the testimony of the shepherds doth assert this, who were “keeping watch over their flock.” So David: O Thou, my Lord, who sittest at the right hand of my Lord, whence art Thou my Son, except because, “From the womb before the morning star I have begotten Thee”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
