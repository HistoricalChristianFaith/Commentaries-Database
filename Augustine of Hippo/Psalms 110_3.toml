[[commentary]]
quote='''
Listen to the voice of the Father to the Son: "Before Lucifer I have begotten Thee." He who was begotten before Lucifer Himself illuminates all. A certain one was named Lucifer, who fell; for he was an angel and became a devil; and concerning him the Scripture said, "Lucifer, who did arise in the morning, fell" And why was he Lucifer? Because, being enlightened, he gave forth light. But for what reason did he become dark! Because he abode not in the truth. Therefore He was before Lucifer, before every one that is enlightened; since before every one that is enlightened, of necessity He must be by whom all are enlightened who can be enlightened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
