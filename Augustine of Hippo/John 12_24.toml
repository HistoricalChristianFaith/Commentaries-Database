[[commentary]]
quote='''
But the height of His glorification had to be preceded by the depth of His passion. Accordingly, He went on to add, "Verily, verily, I say unto you, except a grain of wheat fall into the ground and die, it abideth alone; but if it die, it bringeth forth much fruit." But He spake of Himself. He Himself was the grain that had to die, and be multiplied; to suffer death through the unbelief of the Jews, and to be multiplied in the faith of many nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252051.html'
source_title="Tractates on John 51"


[[commentary]]
quote='''
Ephraim is interpreted fruitfulness. Mine, he saith, is fruitfulness, and this fruitfulness is the strength of My Head. For My Head is Christ. And whence is fruitfulness the strength of Him? Because unless a grain were to fall into the earth, it would not be multiplied, alone it would remain. Fall then to earth did Christ in His Passion, and there followed fruit-bearing in the Resurrection. He was hanging and was being despised: the grain was within, it had powers to draw after it all things. How in a grain do numbers of seeds lie hid, something abject it appeareth to the eyes, but a power turning into itself matter and bringing forth fruit is hidden; so in Christ’s Cross virtue was hidden, there appeared weakness. O mighty grain! Doubtless weak is He that hangeth, Doubtless before Him that people did wag the head, Doubtless they said, “If Son of God He is, let Him come down from the Cross.” Hear the strength of Him: that which is a weak thing of God, is stronger than men. With reason so great fruitfulness hath followed: it is mine, saith the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"

[[commentary]]
quote='''
Thanks to the “Corn of wheat,” because He willed to die and to be multiplied: thanks to the only Son of God, our Lord and Saviour Jesus Christ, who disdained not to undergo our death, in order that He might make us worthy of His life. Behold Him that was single until He went hence; as He said in another Psalm, “Single I am until I go hence;” for He was a single corn of wheat in such sort as that He had in Himself a great fruitfulness of increase; in how many corns imitating the Passion of Him we exult, when we celebrate the nativities of the Martyrs!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"

[[commentary]]
quote='''
What is it that the Lord saith in this Psalm, “I am alone, until I pass over”? What is it that we have expounded? If we have understood it, listen to His own words in the Gospel. “Except a corn of wheat fall into the ground and die, it abideth alone; but if it die, it beareth much fruit.”…Therefore He was alone before He was put to death.…So far was any from dying for the Name, that is, for confessing the Name of Christ, before that Corn of wheat fell into the ground, that even John, who was slain just before Him, being given by a wicked king to a dancing woman, was not put to death because he confessed Christ. Of course he might have been put to death for this, and that by many. If for another reason he was put to death by one man, how much more might he have been put to death by those very men, who put Christ to death? For John gave testimony to Christ. They who heard Christ, wished to slay Him; the man who gave testimony to Him they slew not.…He is not slain by the Jews who gave free testimony to Christ, whom the Jews slew; he is slain by Herod, because he said to him, “It is not lawful for thee to have thy brother’s wife.” For his brother had not died without issue. For the law of truth, for equity, for righteousness’ sake, he did die: therefore is he a saint, therefore a martyr; but yet he died not for that Name whereby we are Christians, wherefore, save that the saying might be fulfilled, “I am alone, until I pass over.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
