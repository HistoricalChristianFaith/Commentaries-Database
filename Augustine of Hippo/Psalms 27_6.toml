[[commentary]]
quote='''
“And now, lo! He hath exalted mine head above mine enemies” (ver. 6). What doth He reserve for me at the last, when even now the body is dead because of sin, lo! I feel that my mind serves the law of God, and is not led captive under the rebellious law of sin? “I have gone about, and have sacrificed in His tabernacle the sacrifice of rejoicing.” I have considered the circuit of the world, believing on Christ; and in that for us God was humbled in time, I have praised Him with rejoicing: for with such sacrifice He is well pleased. “I will sing and give praises to the Lord.” In heart and in deed I will be glad in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
