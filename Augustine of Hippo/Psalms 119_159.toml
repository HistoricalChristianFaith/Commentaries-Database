[[commentary]]
quote='''
And he commendeth himself as differing from them, and saith, “Behold, how I have loved Thy commandments” (ver. 159). He saith not, I have not denied Thy words or testimonies, as the Martyrs were urged to do, and, when they refused, suffered intolerable torments: but he said this wherein is the fruit of all sufferings; for, “if I give up my body to be burned, and have not charity, it profiteth me nothing.” The Psalmist, praising this virtue, saith, “Behold, how I have loved Thy commandments.” Then he asketh his reward, “O Lord, quicken me, according to Thy mercy.” These put me to death, do Thou quicken me. But if a reward be asked of mercy, which justice is bound to give; how much greater is that mercy, which enabled him to gain the victory, on account of which the reward was sought for?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
