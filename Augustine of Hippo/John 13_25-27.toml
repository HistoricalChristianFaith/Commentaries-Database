[[commentary]]
quote='''
"He then, having leaned back on Jesus' breast,"-surely the very bosom of His breast this, the secret place of wisdom!-"saith unto Him, Lord, who is it? Jesus answered, He it is to whom I shall give a piece of bread, when I have dipped it. And when He had dipped the bread, he gave it to Judas Iscariot, the son of Simon. And after the bread, Satan entered into him." The traitor was disclosed, the coverts of darkness were revealed. What he got was good, but to his own hurt he received it, because, evil himself, in an evil spirit he received what was good. But we have much to say about that dipped bread which was presented to the false-hearted disciple, and about that which follows; and for these we shall require more time than remains to us now at the close of this discourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252061.html'
source_title="Tractates on John 61"
