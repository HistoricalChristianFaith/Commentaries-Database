[[commentary]]
quote='''
He was already there who said that he was “caught up into the third Heaven, and there heard unspeakable words, which it is not lawful for a man to utter.” But he was recalled to us, in order that, as requiring to be made perfect, he might first mourn his infirmity, and afterwards be clothed with might. Yet encouraged for the ministration of his office by having seen somewhat of those things, he goes on saying, “I heard unspeakable words, which it is not lawful for a man to utter.” Now then what use is it for you to ask, either of me or of any one, the “things which it is not lawful for man to utter.” If it was not lawful for him to utter them, to whom is it lawful to hear them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
