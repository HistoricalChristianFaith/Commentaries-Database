[[commentary]]
quote='''
God makes the ungodly man godly, in order that he might persevere in this godliness and righteousness. For a man is justified in order that he might be just, not so that he might think it is all right to go on sinning.
'''
source_url=''
source_title="AUGUSTINE ON ROMANS 22"

[[commentary]]
quote='''
Let us listen, then, to the apostle, when he says, "To him that believeth on Him that justifieth the ungodly, his faith is counted for righteousness." This is the work in which we may be doing the works of Christ, for even our very believing in Christ is the work of Christ. It is this He worketh in us, not certainly without us. Hear now, then, and understand, "He that believeth on me, the works that I do shall he do also:" I do them first, and he shall do them afterwards; for I do such works that he may do them also. And what are the works, but the making of a righteous man out of an ungodly one?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252072.html"
source_title="Tractates on John 72"
