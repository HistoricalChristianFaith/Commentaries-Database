[[commentary]]
quote='''
“Bend down Thine ear unto Me” (ver. 2). Hear Me in My humiliation, nigh at hand unto Me. “Make haste to deliver Me.” Defer not to the end of the world, as with all who believe on Me, My separation from sinners. “Be unto Me a God who protecteth Me.” Be unto Me God, and Protector. “And a house of refuge, that Thou mayest save Me.” And as a house, wherein taking refuge I may be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
