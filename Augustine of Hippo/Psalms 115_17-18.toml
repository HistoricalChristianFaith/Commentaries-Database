
[[commentary]]
quote='''
May they therefore abide, heaven and earth, in their God, who made them, and let them live from Him, confessing unto Him, and praising Him; for if they choose to live from themselves, they shall die, as it is written, “From the dead, as though he were not, confession ceaseth.” But, “The dead praise not Thee, O Lord, neither all they that go down into silence” (ver. 17). For the Scripture in another passage proclaimeth, “The sinner, when he cometh into the abyss of wickednesses, scorneth.” “But we, who live, will praise the Lord, from this time forth for evermore” (ver. 18).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520115.html'
source_title="Exposition on Psalm 115"
