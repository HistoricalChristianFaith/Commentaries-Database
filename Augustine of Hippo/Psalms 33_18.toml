[[commentary]]
quote='''
“Behold, the Eyes of the Lord are upon them that fear Him:” because if thou seek salvation, behold, the love of the Lord is upon them that fear Him. “Upon them that hope in His mercy” (ver. 18): that hope not in their own strength, but in His mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
