[[commentary]]
quote='''
“But Thou, Lord, art the Most Highest for evermore” (ver. 8). Waiting above in Thy eternity until the season of the wicked be past, and that of the just come. “For lo.” Listen, brethren. Already he who speaketh (for he speaketh in our person, in the person of Christ’s body, for Christ speaketh in His own body, that is, in His Church), hath joined himself unto the eternity of God: as I a little before was saying unto you, God is long-suffering and patient, and alloweth all those evil deeds which He seeth to be done by wicked men. Wherefore? because He is eternal, and seeth what He keepeth for them. Dost thou also wish to be long-suffering and patient? Join thyself to the eternity of God: together with Him wait for those things which are beneath thee: for when thy heart shall have cleaved unto the Most Highest, all mortal things will be beneath thee: say then what follows, “For lo, thine enemies shall perish.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252092.html'
source_title="Exposition on Psalm 92"
