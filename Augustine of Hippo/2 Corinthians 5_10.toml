[[commentary]]
quote='''
Christ judges all things because when he is with God he is above all.
'''
source_url=''
source_title="ON TRUE RELIGION 58"

[[commentary]]
quote='''
What is this, "and thou comest not into judgment"? And who will be better than the Apostle Paul, who saith, "We must all appear before the judgment-seat of Christ, that every one may there receive what he has done in the body, whether it be good or evil"? Paul saith, "We must all appear before the judgment-seat of Christ;" and darest thou promise to thyself that thou shalt not come into judgment? Be it far from me, sayest thou, that I should dare promise this to myself. But I believe Him that doth promise. The Saviour speaks, the Truth promises, Himself said to me, "Whoso heareth my words, and believeth Him that sent me, hath eternal life, and makes a passage from death unto life, and shall not come into judgment." I then have heard the words of my Lord, and I have believed; so now, when I was an unbeliever, I became a believer even as He warned me, I passed from death to life, I come not into judgment; not by my presumption, but by His promise. Does Paul, however, speak contrary to Christ, the servant against his Lord, the disciple against his Master, the man against God; so that, when the Lord saith, "Whoso heareth and believeth, passeth from death to life," the apostle should say, "We must all appear before the judgment-seat of Christ"? Otherwise, if he comes not into judgment who appears before the judgment-seat, I know not how to understand it.

The Lord our God then reveals it, and by His Scriptures puts us in mind how it may be understood when judgment is spoken of. I exhort you, therefore, to give attention. Sometimes judgment means punishment, sometimes it means discrimination. According to that mode of speech in which judgment means discrimination, "we must all appear before the judgment-seat of Christ that" a man "may there receive what things he has done in the body, whether it be good or ill." For this same is a discrimination, to distribute good things to the good, evil things to the evil. For if judgment were always to be taken in a bad sense, the psalm would not say, "Judge me, O God." Perhaps some one is surprised when he hears one say, "Judge me, O God." For man is wont to say, "Forgive me, O God;" "Spare me, O God." Who is it that says, "Judge me, O God"? Sometimes in the psalm this very verse even is placed in the pause, to be given out by the reader and responded by the people. Does it not perhaps strike some man's heart so much that he is afraid to sing and to say to God, "Judge me, O God"? And yet the people sing it with confidence, and do not imagine that they wish an evil thing in that which they have learned from the divine word; even if they do not well understand it, they believe that what they sing is something good. And yet even the psalm itself has not left a man without an insight into the meaning of it. For, going on, it shows in the words that follow what kind of judgment it spoke of; that it is not one of condemnation, but of discrimination. For saith it, "Judge me, O God." What means "Judge me, O God, and discern my cause from an unholy nation"? According to this judgment of discerning, then, "we must all appear before the judgment-seat of Christ."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
