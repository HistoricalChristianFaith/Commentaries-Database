[[commentary]]
quote='''
“So I will speak good of Thee in my life, and in Thy name I will lift up my hands” (ver. 5). Now in my life which to me Thou hast given, not in that which I have chosen after the world with the rest among many lives, but that which Thou hast given to me through Thy mercy, that I should praise Thee. “So I will speak good of Thee in my life.” What is “so”? That to Thy mercy I may ascribe my life wherein Thee I praise, not to my merits. “And in Thy name I will lift up my hands.” Lift up therefore hands in prayer. Our Lord hath lifted up for us His hands on the Cross, and stretched out were His hands for us, and therefore were His hands stretched out on the Cross, in order that our hands might be stretched out unto good works: because His Cross hath brought us mercy. Behold, He hath lifted up hands, and hath offered for us Himself a Sacrifice to God, and through that Sacrifice have been effaced all our sins. Let us also lift up our hands to God in prayer: and our hands being lifted up to God shall not be confounded, if they be exercised in good works. For what doth he that lifteth up hands? Whence hath it been commanded that with hands lifted up we should pray to God? For the Apostle saith, “Lifting up pure hands without anger and dissension.” It is in order that when thou liftest up hands to God, there may come into thy mind thy works. For whereas those hands are lifted up that thou mayest obtain that which thou wilt, those same hands thou thinkest in good works to exercise, that they may not blush to be lifted up to God. “In thy name I will lift up my hands.” Those are our prayers in this Idumæa, in this desert, in the land without water and without way, where for us Christ is the Way, but not the way of this earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
