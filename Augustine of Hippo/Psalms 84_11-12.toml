[[commentary]]
quote='''
Therefore “the Lord will not withhold good from those who walk in innocence” (ver. 12). Why then, O men, are ye unwilling to keep innocence, except in order that ye may have good things?…Thou seest wealth in the hands of robbers, of the impious, the wicked, the base; in the hands of scandalous and criminal men thou seest wealth: God giveth them these things on account of their fellowship in the human race, for the abundant overflowing of His goodness: who also “maketh His sun to rise upon the good and the evil, and causeth it to rain upon the righteous and upon the sinners.” Giveth He so much to the wicked, and keepeth nothing for thee? He keepeth something: be at ease, He who had mercy on thee when thou wast impious, doth He desert thee when thou hast become pious? He who gave to the sinner the free gift of His Son’s death, what keepeth He for the saved through that death? Therefore be at ease. Hold Him a debtor, for thou hast believed in Him promising. What then remains for us here, in the winepress, in affliction, in hardship, in our present dangerous life? What remains for us, that we may arrive thither? “O Lord God of virtues, blessed is the man that putteth his hope in Thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
