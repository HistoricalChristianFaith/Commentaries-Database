[[commentary]]
quote='''
What therefore followeth after these words: “If Thou, Lord, wilt be extreme to mark what is amiss, O Lord, who may abide it?” (ver. 3). So, he hath disclosed from what deep he cried out. For he crieth beneath the weights and billows of his iniquities.…He said not, I may not abide it: but, “who may abide it?” For he saw that nigh the whole of human life on every side was ever bayed at by its sins, that all consciences were accused by their thoughts, that a clean heart trusting in its own righteousness could not be found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
