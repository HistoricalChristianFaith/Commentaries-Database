[[commentary]]
quote='''
“Be merciful unto me, O Lord, for I have cried unto Thee all day” (ver. 3). Not “one day:” understand “all day” to mean continually: from the time that the body of Christ groans being in afflictions, until the end of the world, when afflictions pass away, that man groaneth and calleth upon God: and each one of us after his measure hath his part in that cry in the whole body. Thou hast cried in thy days, and thy days have passed away: another hath come after thee, and cried in his days: and thou here, he there, another elsewhere: the body of Christ crieth all the day, its members departing and succeeding one another. One Man it is that reaches to the end of the world: the same members of Christ cry, and some members already rest in Him, some still cry, some when we shall be at rest will cry, and after them others will cry. It is the whole body of Christ whose voice He hears, saying, “Unto Thee have I cried all the day.” Our Head on the right hand of the Father intercedes for us: some members He recovereth, others He scourgeth, others He cleanseth, others He comforteth, others He is creating, others calling, others recalling, others correcting, others restoring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
