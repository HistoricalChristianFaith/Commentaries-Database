[[commentary]]
quote='''
As yet, however, the evangelist proceeds to say: "But when Pilate heard these sayings, he brought Jesus forth, and sat down before the tribunal, in a place that is called the Pavement, but in the Hebrew, Gabbatha. And it was the preparation of the passover, and about the sixth hour." The question, at what hour the Lord was crucified, because of the testimony supplied by another evangelist, who says, "And it was the third hour, and they crucified Him," we shall consider as we can, if the Lord please, when we are come to the passage itself where His crucifixion is recorded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520116.html'
source_title="Tractates on John 116"
