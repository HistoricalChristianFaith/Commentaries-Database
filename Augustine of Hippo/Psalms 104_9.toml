[[commentary]]
quote='''
Hear. “Thou hast set a bound which they shall not pass over, neither shall they turn again to cover the earth” (ver. 9). What then, because now the bitterest waves have received a measure, that we must be allowed to preach such things even with freedom; because they have had their due limit assigned, because they cannot pass over the bound that is set, nor shall they return to cover the earth; what is doing in the earth itself? What workings take place therein, now that the sea hath left it bare? Although at its beach slight waves do make their noise, although Pagans still murmur round; the sound of the shores I hear, a deluge I dread not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
