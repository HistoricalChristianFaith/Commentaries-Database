[[commentary]]
quote='''
And now addressing the few that remained: "Then said Jesus to the twelve" (namely, those twelve who remained), "Will ye also," said He, "go away?" Not even Judas departed. But it was already manifest to the Lord why he remained: to us he was made manifest afterwards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252027.html'
source_title="Tractates on John 27"
