[[commentary]]
quote='''
(De Cons. Ev. ii. 47.) This may seem contrary to that Matthew says, that having sent the multitudes away, He went up into a mountain that He might pray alone; and John again says, that it was on a mountain that He fed this same multitude. But since John himself says further, that after that miracle He retired to a mountain that He might not be held by the multitude, who sought to make Him a king, it is clear that He had come down from the mountain when He fed them. Nor do Matthew's words, He went up into a mountain alone to pray, disagree with this, though John says, When he knew that they would come to make him a king, he withdrew into a mountain himself alone. (John 6:15.) For the cause of His praying is not contrary to the cause of His retiring, for herein the Lord teaches us that we have great cause for prayer when we have cause for flight. Nor, again, is it contrary to this that Matthew says first, that He bade His disciples go into the boat, and then that He sent the multitudes away, and went into a mountain alone to pray; while John relates that He first withdrew to the mountain, and then, when it was late, his disciples went down to the sea, and when they had entered into a boat, &c. for who does not see that John is relating as afterwards done by His disciples what Jesus had commanded before He retired into the mountain?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(ubi sup.) But while Christ prays on high, the boat is tossed with great waves in the deep; and forasmuch as the waves rise, that boat can be tossed; but because Christ prays, it cannot be sunk. Think of that boat as the Church, and the stormy sea as this world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Furthermore, John still tarries for a little space with these others. For, after his recital of the miracle of the five loaves, he also gives us some account of the vessel that laboured, and of the Lord's act in walking upon the sea. This notice he connects with his preceding narrative in the following manner: "When Jesus therefore perceived that they would come and take Him by force and make Him a king, He departed again into a mountain Himself alone. And when it became late, His disciples went down unto the sea; and when they had entered into a ship, they came over the sea to Capharnaum: and it was now dark, and Jesus was not come to them. And the sea arose by reason of a great wind that blew," and so on. In this there cannot appear to be anything contrary to the records preserved in the other Gospels, unless it be the circumstance that Matthew tells us how, when the multitudes were sent away, He went up into a mountain, in order that there He might pray alone; while John states that He was on a mountain with those same multitudes whom He fed with the five loaves. But seeing that John also informs us how He departed into a mountain after the said miracle, to preclude His being taken possession of by the multitudes, who wished to make Him a king, it is surely evident that they had come down from the mountain to more level ground when those loaves were provided for the crowds. And consequently there is no contradiction between the statements made by Matthew and John as to His going up again to the mountain. The only difference is, that Matthew uses the phrase "He went up," while John's term is "He departed." And there would be an antagonism between these two, only if in departing He had not gone up. Nor, again, is any want of harmony betrayed by the fact that Matthew's words are, "He went up into a mountain apart to pray;" whereas John puts it thus: "When He perceived that they would come to make Him a king, He departed again into a mountain Himself alone." Surely the matter of the departure is in no way a thing antagonistic to the matter of prayer. For, indeed, the Lord, who in His own person transformed the body of our humiliation in order that He might make it like unto the body of His own glory, hereby taught us also the truth that the matter of departure should be to us in like manner grave matter for prayer. Neither, again, is there any defect of consistency proved by the circumstance that Matthew has told us first how He commanded His disciples to embark in the little ship, and to go before Him unto the other side of the lake until He sent the multitudes away, and then informs us that, after the multitudes were sent away, He Himself went up into a mountain alone to pray; while John mentions first that He departed unto a mountain alone, and then proceeds thus: "And when it became late, His disciples came down unto the sea; and when they had entered into a ship," etc. For who will not perceive that, in recapitulating the facts, John has spoken of something as actually done at a later point by the disciples, which Jesus had already charged them to do before His own departure unto the mountain; just as it is a familiar procedure in discourse, to revert in some fashion or other to any matter which otherwise would have been passed over? But inasmuch as it may not be specifically noted that a reversion, especially when done briefly and instantaneously, is made to something omitted, the auditors are sometimes led to suppose that the occurrence which is mentioned at the later stage also took place literally at the later period. In this way the evangelist's statement really is, that to those persons whom he had described as embarking in the ship and coming across the sea to Capharnaum, the Lord came, walking toward them upon the waters, as they were toiling in the deep; which approach of the Lord of course took place at the earlier point, during the said voyage in which they were making their way to Capharnaum.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 47"
