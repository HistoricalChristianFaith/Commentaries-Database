[[commentary]]
quote='''
This Psalm, belonging to the number of the Songs of Degrees, teacheth us, while we ascend and raise our minds unto the Lord our God in loving charity and piety, not to fix our gaze upon men who are prosperous in this world, with a happiness that is false and unstable, and altogether seductive; where they cherish nothing save pride, and their heart freezeth up against God, and is made hard against the shower of His grace, so that it beareth not fruit.…

“They that put their trust in the Lord shall be even as the mount Sion: they shall not be removed for ever” (ver. 1).

Who are these? “They shall stand fast for ever, who dwell in Jerusalem” (ver. 2). If we understand this earthly Jerusalem, all who dwelt therein have been excluded by wars and by the destruction of the city: thou now seekest a Jew in the city of Jerusalem, and findest him not. Why then will “they that dwell in Jerusalem not be moved for ever,” save because there is another Jerusalem, of which ye are wont to hear much? She is our mother, for whom we sigh and groan in this pilgrimage, that we may return unto her.…They then who dwell therein “shall never be moved.” But they who dwelt in that earthly Jerusalem, have been moved; first in heart, afterwards by exile. When they were moved in heart and fell, then they crucified the King of the heavenly Jerusalem herself; they were already spiritually without, and shut out of doors their very King. For they cast Him out without their city, and crucified Him without. He too cast them out of His city, that is, of the everlasting Jerusalem, the Mother of us all, who is in Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520125.html'
source_title="Exposition on Psalm 125"
