[[commentary]]
quote='''
Again, thy Bridegroom possesseth the whole world; why, then, shouldst thou be defiled with a part of it? Who is the Bridegroom? "For God is King of all the earth." This thy Bridegroom possesses the whole, because He purchased the whole. See at what price He purchased it, that thou mayest understand what He has purchased. What price has He given? He gave His blood. Where gave He, where shed He, His blood? In His passion. Is it not to thy Bridegroom thou singest, or feignest to sing, when the whole world was purchased: "They pierced my hands and my feet, they counted all my bones: but they themselves considered me, they looked upon me, they divided my garments among them, and upon my vesture they cast lots"? Thou art the bride, acknowledge thy Bridegroom's vesture. Upon what vesture was the lot cast? Ask the Gospel; see to whom thou art espoused, see from whom thou receivest pledges. Ask the Gospel; see what it tells thee in the suffering of the Lord. "There was a coat" there: let us see what kind; "woven from the top throughout." What does the coat woven from the top signify, but charity? What does this coat signify, but unity? Consider this coat, which not even the persecutors of Christ divided. For it saith, "They said among themselves, Let us not divide it, but let us cast lots upon it." Behold that of which the psalm spoke! Christ's persecutors did not rend His garment; Christians divide the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"

[[commentary]]
quote='''
Give heed, wherefore many things are expressed by the Prophets as if they were past; whereas it is things future, not past facts that are the subject of prophecy. For the future Passion of our Lord Himself was foretold: and yet it says, “They pierced My hands and My feet. They told all My bones;” not, “They shall pierce,” and “shall tell.” “They looked and stared upon Me;” not “They shall look and stare upon Me.” “They parted My garments among them.” It does not say, “They shall part” them. All these things are expressed as if they were past, although they were yet to come: because to God things to come also are as certain as if they were past.…It is for this reason, in consequence of their certainty, that those things which are yet future, are spoken of as if past.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"
