[[commentary]]
quote='''
“Give ye glory to God, above Israel is the magnificence of Him” (ver. 34). Of whom saith the Apostle, “Upon the Israel of God.” For “not all that are out of Israel, are Israelites:” for there is also an Israel after the flesh. Whence he saith, “See ye Israel after the flesh.” “For not they that are sons of the flesh, are sons of God, but sons of promise are counted for a seed.” Therefore at that time when without any intermixture of evil men His people shall be, like a heap purged by the fan, like Israel in whom guile is not, then most pre-eminent “above Israel” shall be “the magnificence” of “Him: and the virtue of Him in the clouds.” For not alone He shall come to judgment, but with the elders of His people: to whom He hath promised that they shall sit upon thrones to judge, who even shall judge angels. These be the clouds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
