[[commentary]]
quote='''
By which addition he shows that this very thing, that the soul is righteous and harmless, she has not by herself, but by God who giveth brightness and light. For of this he says in another Psalm, “Thou, O Lord, wilt light my candle.” And of John it is said, that “he was not the light, but bore witness of the light.” “He was a burning and shining candle.” That light then, whence souls, as candles, are kindled, shines forth not with borrowed, but with original, brightness, which light is truth itself. It is then so said, “According to my righteousness, and according to my harmlessness, that is upon me,” as if a burning and shining candle should say, Judge me according to the flame which is upon me, that is, not that wherewith I am myself, but that whereby I shine enkindled of thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
