[[commentary]]
quote='''
“My heart hath been troubled in me” (ver. 4). This is the same as elsewhere hath been said, “Mine eye because of anger hath been troubled.” And if eye hath been troubled, what followeth? “And fear of death hath fallen upon me.” Our life is love: if life is love, death is hatred. When a man hath begun to fear lest he should hate him that he was loving, it is death he is fearing; and a sharper death, and a more inward death, whereby soul is killed, not body. Thou didst mind a man raging against thee; what was he to do, against whom thine own Lord had given thee security, saying, “Fear not them that kill the body”? He by raging killeth body, thou by keeping hatred hast killed soul; and he the body of another, thou thine own soul. “Fear,” therefore, “of death hath fallen upon me.”

“Fearfulness and trembling have come upon me, and darkness hath covered me” (ver. 5). “And I have said,” “He that hateth his brother, is in darkness until now.” If love is light, hatred is darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
