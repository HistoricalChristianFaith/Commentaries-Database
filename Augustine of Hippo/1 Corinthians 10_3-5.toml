[[commentary]]
quote='''
But without doubt the mystery of the Kingdom of Heaven was veiled in the Old Testament, which in the fulness of time should be unveiled in the New. “For,” saith the Apostle, “they did drink of the Spiritual Rock following them, but the Rock was Christ.” In a mystery therefore theirs was the same meat and drink as ours, but in signification the same, not in form; because the same Christ was Himself figured to them in a Rock, manifested to us in the Flesh. “But,” he saith, “not in all of them God was well pleased.” All indeed ate the same spiritual meat and drank the same spiritual drink, that is to say, signifying something spiritual: but not in all of them was God well pleased. When, he saith, “not in all:” there were evidently there some in whom was God well pleased; and although all the Sacraments were common, grace, which is the virtue of the Sacraments, was not common to all. Just as in our times, now that the faith hath been revealed, which then was veiled, to all men that have been baptized in the name of the Father and of the Son and of the Holy Ghost, the Laver of regeneration is common; but the very grace whereof these same are the Sacraments, whereby the members of the Body of Christ are to reign together with their Head, is not common to all. For even heretics have the same Baptism, and false brethren too, in the communion of the Catholic name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
