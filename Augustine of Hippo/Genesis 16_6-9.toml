[[commentary]]
quote='''
Hear and see in the very facts of Old Testament history all the signs and indications of things to come. Sarah is found to have afflicted her maid Hagar: Sarah is free. After her maid began to be proud, Sarah complained to Abraham, and said, "Cast out the bond woman;" she has lifted her neck against me. His wife complains of Abraham, as if it were his doing. But Abraham, who was not bound to the maid by lust, but by the duty of begetting children, inasmuch as Sarah had given her to him to have offspring by her, says to her: "Behold, she is thy handmaid; do unto her as thou wilt." And Sarah grievously afflicted her, and she fled from her face. See, the free woman afflicted the bond woman, and the apostle does not call that a persecution; the slave plays with his master, and he calls it persecution: this afflicting is not called persecution; that playing is. How does it appear to you, brethren? Do you not understand what is signified? Thus, then, when God wills to stir up powers against heretics, against schismatics, against those that scatter the Church, that blow on Christ as if they abhorred Him, that blaspheme baptism, let them not wonder; because God stirs them up, that Hagar may be beaten by Sarah. Let Hagar know herself, and yield her neck: for when, after being humiliated, she departed from her mistress, an angel met her, and said to her, "What is the matter with thee, Hagar, Sarah's handmaid?" When she complained of her mistress, what did she hear from the angel? "Return to thy mistress." It is for this that she is afflicted, that she may return; and would that she may return, for her offspring, just like the sons of Jacob, will obtain the inheritance with their brethren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"
