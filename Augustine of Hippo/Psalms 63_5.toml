[[commentary]]
quote='''
…Already our fathers are dead, but God liveth: here we could not always have fathers, but there we shall alway have one living Father, when we have our father-land.…What sort of country is that? But thou lovest here riches. God Himself shall be to thee thy riches. But thou lovest a good fountain. What is more passing clear than that wisdom? What more bright? Whatsoever is an object of love here, in place of all thou shalt have Him that hath made all things, “as though with marrow and fatness my soul should be filled: and lips of exultation shall praise Thy name.” In this desert, in Thy name I will lift up my hands: let my soul be filled as though with marrow and fatness, “and my lips with exultation shall praise Thy name.” For now is prayer, so long as there is thirst: when thirst shall have passed away, there passeth away praying and there succeedeth praising. “And lips of exultation shall praise Thy name.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
