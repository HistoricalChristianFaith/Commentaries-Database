[[commentary]]
quote='''
Let not heretics insult, divided into parties, let them not exalt themselves who say, “Lo, here is Christ, or lo, there.” Whoso saith, “Lo, here is Christ, or lo, there,” inviteth to parties. Unity God promised. The kings are gathered together in one, not dissipated through schisms.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
