[[commentary]]
quote='''
You heard just now, when that reading was read, that Simon Magus was baptized and yet did not lay aside his evil mind. He had the form of the sacrament, but the power of the sacrament he did not have. Listen to what the apostle says about the godless, "having," he says, "the form of godliness, while refusing its power." What is the form of godliness? The visible sacrament. What is the power of godliness? Invisible charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229U.html'
source_title="SERMONS 229U"


[[commentary]]
quote='''
Shut out the evil love of the world so that you may be filled with the love of God. You are a vessel, but you are still full. Pour out what you have that you may receive what you have not.… It is good for us not to love the world in order that the sacraments may not remain in us for our damnation rather than as the mainstays of our salvation. The mainstay of salvation is to have the root of love, to have the power of godliness, not the external form alone.
'''
source_url=''
source_title="TRACTATES ON THE EPISTLE OF JOHN 2.2.9"

[[commentary]]
quote='''
Now forsooth all are reckoned the people of God, who carry His Sacraments, but not all belong to His Mercy. All forsooth receiving the Sacrament of the Baptism of Christ, are called Christians, but not all live worthily of that Sacrament. There are some of whom saith the Apostle, “Having a form of godliness, but denying the power thereof.” Yet on account of this form of godliness they are named among God’s people. As to the floor, until the corn is threshed, belongs not the wheat only, but the chaff. But will it also belong to the garner?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
