
[[commentary]]
quote='''
My Mercy and my Refuge, my Upholder and my Deliverer” (ver. 2). Much toileth this combatant, having his flesh lusting against his spirit. Keep what thou hast. Then shalt thou have in full what thou wishest, when “death shall have been swallowed up in victory;” when this mortal body has been raised, and is changed into the condition of the angels, and rises aloft to a heavenly quality.…There is life, there are good days, where nought lusteth against the spirit, where it is not said, “Fight,” but “Rejoice.” But who is he that lusteth for these days? Every man certainly saith, “I do.” Hear what followeth. I see that thou art toiling, I see that thou art engaged in battle, and in danger; hear what followeth:…“Depart from evil, and do good:” let not the poor first weep under thee, that the poor may rejoice through thee. For what reward, since now thou art fighting? “Seek peace, and ensue it.” Learn and say, “My Mercy and my Refuge, mine Upholder and my Deliverer, my Protector:” “mine Upholder,” lest I fall; “my Deliverer,” lest I stick; “my Protector,” lest I be stricken. In all these things, in all my toil, in all my battles, in all my difficulties, in Him have I hoped, “who subdueth my people under me.” Behold, our Head speaketh together with us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520144.html'
source_title="Exposition on Psalm 144"
