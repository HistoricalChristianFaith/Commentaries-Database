[[commentary]]
quote='''
“For he hath wrought deceitfully in His sight” (ver. 2). In whose sight? In His, whose fear was not before the eyes of him that did work deceitfully. “To find out his iniquity, and hate it.” He wrought so as not to find it. For there are men who as it were endeavour to seek out their iniquity, and fear to find it; because if they should find it, it is said to them, Depart from it: this thou didst before thou knewest; thou didst iniquity being in ignorance; God giveth pardon: now thou hast discovered it, forsake it, that to thy ignorance pardon may easily be given; and that with a clear face thou mayest say to God, “Remember not the sins of my youth, and of my ignorance.” Thus he seeketh it, thus he feareth lest he find it; for he seeketh it deceitfully. When saith a man, I knew not that it was sin? When he hath seen that it is sin, and ceaseth to do the sin, which he did only because he was ignorant: such an one in truth would know his sin, to find it out, and hate it. But now many “work deceitfully to find out their iniquity:” they work not from their heart to find it out and hate it. But because in the very search after iniquity, there is deceit, in the finding it there will be defence of it. For when one hath found his iniquity, lo now it is manifest to him that it is iniquity. Do it not, thou sayest. And he who wrought deceitfully to find it out, now he hath found, hateth it not; for what saith he? How many do this! Who is there that doth it not? And will God destroy them all? Or at least he saith this: if God would not these things to be done, would men live who commit the same? Seest thou that thou didst work deceitfully to find out thy iniquity? For if not deceitfully but sincerely thou hadst wrought, thou wouldest now have found it out, and hated it; now thou hast found it out, and thou defendest it; therefore thou didst work deceitfully, when thou soughtest it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"
