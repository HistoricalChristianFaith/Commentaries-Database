[[commentary]]
quote='''
A psalm of David himself, on the first day of the week.

A Psalm of David himself, touching the glorifying and resurrection of the Lord, which took place early in the morning on the first day of the week, which is now called the Lord’s Day.

“The earth is the Lord’s, and the fulness thereof, the compass of the world, and all they that dwell therein” (ver. 1); when the Lord, being glorified, is announced for the believing of all nations; and the whole compass of the world becomes His Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252024.html'
source_title="Exposition on Psalm 24"
