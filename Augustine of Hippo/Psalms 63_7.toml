[[commentary]]
quote='''
“And in the covering of Thy wings I will exult.” I am cheerful in good works, because over me is the covering of Thy wings. If thou protect me not, forasmuch as I am a chicken, the kite will seize me. For our Lord Himself saith in a certain place to that Jerusalem, a certain city, where He was crucified: “Jerusalem,” He saith, “Jerusalem, how often I have willed to gather thy sons, as though a hen her chickens, and thou wouldest not.” Little ones we are: therefore may God protect us under the shadow of His wings. What when we shall have grown greater? A good thing it is for us that even then He should protect us, so that under Him the greater, alway we be chickens. For alway He is greater, however much we may have grown. Let no one say, let Him protect me while I am a little one: as if sometime he would attain to such magnitude, as should be self-sufficient. Without the protection of God, nought thou art. Alway by Him let us desire to be protected: then alway in Him we shall have power to be great, if alway under Him little we be. “And in the covering of Thy wings I will exult.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
