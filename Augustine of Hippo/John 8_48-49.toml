[[commentary]]
quote='''
In that lesson of the holy Gospel which has been read to-day, from power we learn patience. For what are we as servants to the Lord, as sinners to the Just One, as creatures to the Creator? Howbeit, just as in what we are evil, we are so of ourselves; so in whatever respects we are good, we are so of Him, and through Him. And nothing does man so seek as he does power. He has great power in the Lord Christ; but let him first imitate His patience, that he may attain to power. Who of us would listen with patience if it were said to him, "Thou hast a devil"? as was said to Him, who was not only bringing men to salvation, but also subjecting devils to His authority.

For when the Jews had said, "Say we not well that thou art a Samaritan, and hast a devil?" of these two charges cast at Him, He denied the one, but not the other. For He answered and said, "I have not a devil" He did not say, I am not a Samaritan; and yet the two charges had been made. Although He returned not cursing with cursing, although He met not slander with slander, yet was it proper for Him to deny the one charge and not to deny the other. And not without a purpose, brethren. For Samaritan means keeper. He knew that He was our keeper. For "He that keepeth Israel neither slumbereth nor sleepeth;" and, "Except the Lord keep the city, they wake in vain who keep it." He then is our Keeper who is our Creator. For did it belong to Him to redeem us, and would it not be His to preserve us? Finally, that you may know more fully the hidden reason why He ought not to have denied that He was a Samaritan, call to mind that well-known parable, where a certain man went down from Jerusalem to Jericho, and fell among thieves, who wounded him severely, and left him half dead on the road. A priest came along and took no notice of him. A Levite came up, and he also passed on his way. A certain Samaritan came up - He who is our Keeper. He went up to the wounded man. He exercised mercy, and did a neighbor's part to one whom He did not account an alien. To this, then, He only replied that He had not a devil, but not that He was not a Samaritan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"

[[commentary]]
quote='''
And because pride had wounded us, humility maketh us whole. God came humbly, that from such great wound of pride He might heal man. He came, for “The Word was made Flesh, and dwelt among us.” He was taken by the Jews; He was reviled of them. Ye heard when the Gospel was read, what they said, and to Whom they said, “Thou hast a devil:” and He said not, Ye have a devil, for ye are still in your sins, and the devil possesseth your hearts. He said not this, which if He had said, He had said truly: but it was not meet that He should say it, lest He should seem not to preach Truth, but to retort evil speaking. He let go what He heard as though He heard it not. For a Physician was He, and to cure the madman had He come. As a Physician careth not what he may hear from the madman; but how the madman may recover and become sane; nor even if he receive a blow from the madman, careth he; but while he to him giveth new wounds, he cureth his old fever: so also the Lord came to the sick man, to the madman came He, that whatever He might hear, whatever He might suffer, He should despise; by this very thing teaching us humility, that being taught by humility, we might be healed from pride: from which he here prayeth to be delivered, saying, “Let not the foot of pride come against me; neither let the hand of the sinner remove me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"
