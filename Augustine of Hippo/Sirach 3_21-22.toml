[[commentary]]
quote='''
Let him not therefore wish to lift up his soul, when perchance he is not fit to take meat, but let him fulfil the commandments of humility. He hath wherein he may exercise himself: let him believe in Christ, that he may understand Christ. He cannot see the Word, he cannot understand the equality of the Word with the Father, he cannot as yet see the equality of the Holy Spirit with the Father and the Word; let him believe this, and suck it. He is safe, because, when he hath grown, he will eat, which he could not do before he grew by sucking: and he hath a point to stretch towards. Seek not out the things that are too hard for thee, and search not the things that are above thy strength; that is, things which thou art not as yet fit to understand. And what am I to do? thou repliest. Shall I remain thus? “But what things the Lord hath commanded thee, think thereupon always.” What hath the Lord commanded thee? Do works of mercy, part not with the peace of the Church, place not thy trust in man, tempt not God by longing for miracles.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520131.html'
source_title="Exposition on Psalm 131"
