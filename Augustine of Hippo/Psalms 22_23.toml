
[[commentary]]
quote='''
“Ye that fear the Lord, praise Him.” “Ye that fear the Lord,” seek not your own praise, but “praise Him.” “All ye seed of Jacob, magnify Him” (ver. 23). All ye seed of him whom the elder shall serve, magnify Him.

“Let all the seed of Israel fear Him.” Let all who have been born to a new life, and restored to the vision of God “fear Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
