[[commentary]]
quote='''
This is also the kingdom of God, which the Son is yet to deliver up to the Father; and hence the same apostle says, "Christ, the beginning, and then they that are Christ's in His presence; then [cometh] the end, when He shall have delivered up the kingdom to God, even the Father;" that is, those whom He has redeemed by His blood, He shall then have delivered up to stand before His Father's face.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252068.html'
source_title="Tractates on John 68"
