[[commentary]]
quote='''
Behold, thou hast sacraments; and I grant that thou hast. Thou hast the form, but thou art a branch cut off from the vine; thou hast a form, I want the root. There is no fruit of the form, except where there is a root; but where is the root but in charity? Hear the form of the cut-off branches; let Paul speak: "Though I know all mysteries," saith he, "and have all prophecy, and all faith" (and how great a faith!), "so as to remove mountains, and have not charity, I am nothing."

Let no man tell you fables, then. "Pontius wrought a miracle; and Donatus prayed, and God answered him from heaven." In the first place, either they are deceived, or they deceive. In the last place, grant that he removes mountains: "And have not charity," saith the apostle, "I am nothing." Let us see whether he has charity. I would believe that he had, if he had not divided unity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
