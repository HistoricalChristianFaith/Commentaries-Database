
[[commentary]]
quote='''
“But Thou dwellest in the holy place, O Thou praise of Israel” (ver. 3). But Thou dwellest in the holy place, and therefore wilt not hear the unclean words of sins. The “praise” of him that seeth Thee; not of him who hath sought his own praise in tasting of the forbidden fruit, that on the opening of his bodily eyes he should endeavour to hide himself from Thy sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
