[[commentary]]
quote='''
(Tr. xvii. c. 7) Three distinct biddings. Rise, however, is not a command, but the conferring of the cure. Two commands were given upon his cure, take up thy bed, and walk.

(Tr. xvii. c. 3) Take up thy bed, our Lord saith, meaning, When thou wert impotent, thy neighbour carried thee; now thou art made whole, carry thy neighbour. And walk; but whither, except to the Lord thy God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"
