[[commentary]]
quote='''
Matthew proceeds with his narrative in the following terms: "And all the people were amazed, and said, Is not this the son of David? But when the Pharisees heard it, they said, This fellow doth not cast out devils but in Beelzebub, the prince of the devils. And Jesus knew their thoughts, and said unto them, Every kingdom divided against itself shall be brought to desolation;" and so on, down to the words, "By thy words thou shalt be justified, and by thy words thou shalt be condemned." Mark does not bring in this allegation against Jesus, that He cast out devils in [the power of] Beelzebub, in immediate sequence on the story of the dumb man; but after certain other matters, recorded by himself alone, he introduces this incident also, either because he recalled it to mind in a different connection, and so appended it there, or because he had at first made certain omissions in his history, and after noticing these, took up this order of narration again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 38"
