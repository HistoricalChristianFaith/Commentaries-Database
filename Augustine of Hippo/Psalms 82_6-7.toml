[[commentary]]
quote='''
…But the kingdom of earthly happiness is pride, to oppose which came the lowliness of Christ, rebuking those whom He wished by lowliness to make the children of the Most High, and blaming them: “I said, Ye are gods, ye are all the children of the Most High” (ver. 6). “But ye shall die like men, and fall like one of the princes” (ver. 7). Whether to those He said this, “I said, Ye are gods,” and to those particularly who are unpredestined to eternal life; and to the other, “But ye shall die like men,” etc., “and shall fall like one of the princes,” in this way also distinguishing the gods; or whether He blames all together, in order to distinguish the obedient and those who received correction, “I said, Ye are gods, and ye are all the children of the Most High:” that is, to all of you I promised celestial happiness, “but ye,” through the infirmity of your flesh, “shall die like men,” and through haughtiness of soul, “like one of the princes,” that is, the devil, shall not be exalted, but “shall fall.” As if He said: Though the days of your life are so few, that ye speedily die like men, this avails not to your correction: but like the devil, whose days are many in this world, because he dies not in the flesh, ye are lifted up so that ye fall. For by devilish pride it came to pass that the perverse and blind rulers of the Jews envied the glory of Christ: by this will it came to pass, and still does, that the lowliness of Christ crucified unto death is lightly esteemed in the eyes of them who love the excellence of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252082.html'
source_title="Exposition on Psalm 82"
