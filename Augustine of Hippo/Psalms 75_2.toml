[[commentary]]
quote='''
This is the time of which Christ, that is the body of Christ, speaks in prophecy: "When I shall have received the fit time, I will judge righteously." For at present it is not the time of judging, but of tolerating the wicked. Therefore, let the body of Christ bear at present, and tolerate the wickedness of evil livers. Let it, however, have righteousness now, for by righteousness it shall come to judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"
