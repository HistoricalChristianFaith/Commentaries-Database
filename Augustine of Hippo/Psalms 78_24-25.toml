[[commentary]]
quote='''
Let us turn back to the one who performed these miracles. He is himself the bread that came down from heaven; but bread that nourishes and never diminishes; bread that can be eaten but cannot be eaten up. This bread was also signified by manna, of which it was said, "He gave them the bread of heaven; people ate the bread of angels. Who can the bread of heaven be, but Christ? But for people to eat the bread of angels, the Lord of angels became a human being. Because if he had not become this, we would not have his flesh; if we did not have his flesh, we would not eat the bread of the altar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520130.html'
source_title="SERMON 130:2"

[[commentary]]
quote='''
How by Christ to Christ? By Christ the man, to Christ God; by the Word made flesh, to the Word which in the beginning was God with God; from that which man ate, to that which angels daily eat. For so it is written, "He gave them bread of heaven: man ate the bread of angels." What is the bread of angels? "In the beginning was the Word, and the Word was with God, and the Word was God." How has man eaten the bread of angels? "And the Word was made flesh, and dwelt among us."

But though we have said that angels eat, do not fancy, brethren, that this is done with teeth. For if you think so, God, of whom the angels eat, is as it were torn in pieces. Who tears righteousness in pieces? But still, some one asks me, And who is it that can eat righteousness? Well, how is it said, "Blessed are they that hunger and thirst after righteousness, for they shall be filled"? The food which thou eatest carnally perishes, in order to refresh thee; to repair thy waste it is consumed: eat righteousness; and while thou art refreshed, it continues entire. Just as by seeing this corporeal light, these eyes of ours are refreshed, and yet it is a corporeal thing that is seen by corporeal eyes. Many there have been, when too long in darkness, whose eyesight is weakened by fasting, as it were, from light. The eyes, deprived of their food (for they feed on light), become wearied by fasting, and weakened, so that they cannot bear to see the light by which they are refreshed; and if the light is too long absent, they are quenched, and the very sense of sight dies as it were in them. What then? Does the light become less, because so many eyes are daily fed by it? Thy eyes are refreshed, and the light remains entire. As God was able to show this in the case of corporeal light to corporeal eyes, does He not show that other light to clean hearts as unwearied, continuing entire, and in no respect failing?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
