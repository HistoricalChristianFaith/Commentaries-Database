[[commentary]]
quote='''
“A way Thou hast made in the sight of her, and hast planted the roots of her, and she hath filled the land” (ver. 9). Would she have filled the land, unless a way had been made in the sight of her? What was the way which was made in the sight of her? “I am,” He saith, “the Way, the Truth, and the Life.” With reason she hath filled the land. That hath now been said of this vineyard, which hath been accomplished at the last. But in the mean time what?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
