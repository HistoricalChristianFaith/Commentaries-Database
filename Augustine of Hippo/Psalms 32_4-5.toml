[[commentary]]
quote='''
The repentance of this time is pain healing: repentance of that time is pain penal. Wouldest thou not suffer those thorns? here be thou pierced with the thorns of repentance; in such sort that thou do that which hath been spoken of, “Turned I have been in sorrow, when the thorn was piercing: my sin I have known, and mine iniquity I have not covered: I have said, I will declare against me my shortcoming to the Lord, and Thou hast remitted the ungodliness of my heart.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
