[[commentary]]
quote='''
Jesus says, "My Father, Lord of heaven and earth," Father of him through whom all things were made. Surely all creation is embraced by these two nouns heaven and earth. Therefore the first book of God's Scripture says, "In the beginning God made heaven and earth." And "my help is from the Lord, who made heaven and earth." By the name of heaven is understood whatever is in heaven, and by the name of earth is understood whatever is on earth. Thus, by mentioning these two parts of creation no aspect of creation is overlooked, since the created object is either here or there. Moreover, when the Son speaks to his Father his confession, Jesus admonishes us that confession is owed to God not for our sins alone. For very often when it is heard in the Scriptures, "You shall confess to the Lord," many who hear this beat their breasts in remorse. They do not recall that the term confession means anything else except their accustomed use when they show repentance, confessing their sins and awaiting their just deserts from God, not because they deserve to suffer but because God deems it worthy to act mercifully. But if there were not confession in the act of praise, Jesus would not say, "I confess to you, Father," since he had no sin to confess. It is said in another book of the Scripture: "You shall confess to the Lord" and say in your confession that "all the works of the Lord are very good." This is certainly a confession of praise and not of fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252068.html'
source_title="SERMON 68.2"

[[commentary]]
quote='''
(Serm. 67. 1.) If Christ, from whom all sin is far, said, I confess, confession is not proper for the sinner only, but sometimes also for him that gives thanks. We may confess either by praising God, or by accusing ourselves. When He said, I confess unto thee, it is, I praise Thee, not I accuse Myself.

(Serm. 67. 5.) That the wise and understanding are to be taken as the proud, Himself opens to us when He says, and hast revealed them unto babes; for who are babes but the humble?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But in many places of holy Scriptures we have already made known to you that confession is also put for praise: as in this passage it is, “These words ye shall say in confession, ‘That the works of the Lord are very good.’” And especially that which the Saviour Himself saith, who had not any sin at all, which by repentance to confess: “I confess to Thee, Father, Lord of heaven and earth, that Thou hast hid these things from the wise and prudent, and hast revealed them to babes.” I have said this, in order that it may be more clearly perceived how in the expression, “We will proclaim Thy praise,” the same hath been repeated as had been said higher up, “We will confess to Thee.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"

[[commentary]]
quote='''
But first I remind you, that the term confession in Scripture, when we speak of confession to God, is used in two senses, of sin, and of praise. But confession of sin all know, confession of praise few attend to. So well known is confession of sin, that, wherever in Scripture we hear the words, “I will confess to Thee, O Lord,” or, “we will confess to Thee,” forthwith, through habitually understanding in this way, our hands hurry to beating our breast: so entirely are men wont not to understand confession to be of aught, save of sin. But was then our Lord Jesus Christ Himself too a sinner, who saith in the Gospel, “I confess to Thee, Father, Lord of heaven and earth”? He goeth on to say what He confesseth, that we might understand His confession to be of praise, not of sin, “I confess to Thee, Father, Lord of heaven and earth, because Thou hast hid these things from the wise and prudent, and hast revealed them unto babes.” He praised the Father, he praised God, because He despiseth not the humble, but the proud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"

[[commentary]]
quote='''
Matthew proceeds thus: "At that time Jesus answered and said, I make my acknowledgment to Thee, O Father, Lord of heaven and earth, that Thou hast hid these things from the wise and prudent," and so on, down to where we read, "For my yoke is easy, and my burden is light." This passage is also noticed by Luke, but only in part. For he does not give us the words, "Come unto me, all ye that labour," and the rest. It is, however, quite legitimate to suppose that all this may have been said on one occasion by the Lord, and yet that Luke has not recorded the whole of what was said on that occasion. For Matthew's phrase is, that "at that time Jesus answered and said;" by which is meant the time after His upbraiding of the cities. Luke, on the other hand, interposes some matters, although they are not many, after that upbraiding of the cities; and then he subjoins this sentence: "In that hour He rejoiced in the Holy Spirit, and said." Thus, too, we see that even if Matthew's expression had been, not "at that time," but "in that very hour," still what Luke inserts in the interval is so little that it would not appear an unreasonable thing to give it as all spoken in the same hour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 33"
