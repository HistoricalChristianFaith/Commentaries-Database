[[commentary]]
quote='''
“O stablish Thy word in Thy servant, that I may fear Thee” (ver. 38). And what else is this than, Grant unto me that I may do according to what Thou sayest? For the word of God is not stablished in those who remove it in themselves by acting contrary to it; but it is stablished in those in whom it is immoveable. God therefore stablisheth His word, that they may fear Him, in those unto whom He giveth the spirit of the fear of Him; not that fear of which the Apostle saith, “Ye have not received the spirit of bondage again to fear;” for “perfect love casteth out” this “fear,” but that fear which the Prophet calleth “the spirit of the fear of the Lord;” that fear which “is pure, and endureth for ever;” that fear which feareth to offend Him whom it loveth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
