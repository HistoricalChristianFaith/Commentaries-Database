[[commentary]]
quote='''
For every man has in himself a spirit of his own, of which I spoke when I was commending to you the consideration of the mind. For every man's mind is his own spirit: of which the Apostle Paul says, "For what man knoweth the things of a man, but the spirit of the man which is in himself?" And then he added, "So also the things of God knoweth no man, but the Spirit of God." None knows the things that are ours but our own spirit. I indeed do not know what are thy thoughts, nor dost thou know what are mine; for those things which we think within are our own, peculiar to ourselves; and his own spirit is the witness of every man's thoughts. "So also the things of God knoweth no man, but the Spirit of God." We with our spirit, God with His: so, however, that God with His Spirit knows also what goes on within us; but we are not able, without His own Spirit, to know what takes place in God. God, however, knows in us even what we know not in ourselves. For Peter did not know his own weakness, when he heard from the Lord that he would deny Him thrice: the sick man was ignorant of his own condition; the Physician knew him to be sick. There are then certain things which God knows in us, while we ourselves know them not. So far, however, as belongs to men, no man knows a man as he does himself: another does not know what is going on within him, but his own spirit knows it. But on receiving the Spirit of God, we learn also what takes place in God: not the whole, for we have not received the whole. We know many things from the pledge; for we have received a pledge, and the fullness of this pledge shall be given hereafter. Meanwhile, let the pledge console us in our pilgrimage here; because he who has condescended to bind himself to us by a pledge, is prepared to give us much. If such is the token, what must that be of which it is the token?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252032.html'
source_title="Tractates on John 32"
