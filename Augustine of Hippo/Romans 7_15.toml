[[commentary]]
quote='''
When he says: For what I do, I know not, it may seem to those who understand less to be contrary to that statement in which he said: Sin, that it might appear as sin, worked death in me through what is good. For how does it appear, if it is not known? But I know not is said in this place so that it may be understood: I do not approve. For just as darkness is not seen but is perceived by comparison with light—and to perceive darkness is precisely not to see—so also sin, because it is not illumined by the light of righteousness, is discerned by not understanding, just as darkness was said to be perceived by not seeing. And to this pertains what is said in the Psalm: Who understands his faults?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
