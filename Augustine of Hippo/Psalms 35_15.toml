[[commentary]]
quote='''
“And against Me they rejoiced, and gathered themselves together” (ver. 15), against Me only: they rejoicing, I sorrowful. But we heard just now in the Gospel, “Blessed are they that mourn.” If they are blessed that mourn, miserable are they that laugh. “Against Me they rejoiced, and gathered themselves together: scourges were gathered together against Me, and they knew not.” Because they laid to My charge things that I knew not, they also knew not Whom they charged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"

[[commentary]]
quote='''
Now do so, now be pierced through, be there not in thee done that which hath been said of certain execrable men, “They have been cloven asunder, and have not been pierced through.” Observe them that have been cloven asunder and have not been pierced through. Ye see men cloven asunder, and ye see them not pierced through. Behold beside the Church they are, and it doth not repent them, so as they should return whence they have been cloven asunder. The bramble hereafter shall bring forth their thorns. They will not now have a healing piercing through, they shall have hereafter one penal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
