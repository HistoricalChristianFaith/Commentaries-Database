[[commentary]]
quote='''
“Blessed be He that cometh in the Name of the Lord” (ver. 26). Cursed, therefore, is he that cometh in his own name; as He saith in the Gospel: “if another shall come in his own name, him ye will receive.” “We have blessed you out of the house of God.” I believe that these are the words of the great to the little, of those great ones, to wit, who in spirit commune with God the Word, who is with God, as they may in this life; and yet temper their discourse for the sake of the little ones, so that they may sincerely say what the Apostle saith: “For whether we be beside ourselves, it is to God: or whether we be sober, it is for your cause. For the love of Christ constraineth us.” They bless the little children from the inner house of the Lord, where that praise faileth not age after age: consider therefore what they proclaim from thence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
