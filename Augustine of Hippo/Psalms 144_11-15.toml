[[commentary]]
quote='''
In what way do His enemies “live,” in that He hath said of them already, that they have “spoken vanity”? Hear in another Psalm also: “Whose sons are as young plants; firmly rooted.” But above He had said, “Whose mouth speaketh vanity. Their daughters polished after the similitude of a temple: their garners full bursting forth more and more; their cattle fat, their sheep fruitful, multiplying in their streets; no hedge falling into ruin; no cry in their streets.” “Mine enemies” then “live.” This is their life; this life they praise; this they set their hearts upon: this they hold fast to their own ruin. For what follows? They pronounce “the people that is in such a case” blessed. But what sayest thou, who “hast a care for thy sin”? What sayest thou, who “confessest thine iniquity”? He says, “Blessed is the people whose God is the Lord.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
