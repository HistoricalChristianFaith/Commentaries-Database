[[commentary]]
quote='''
The praise of God could not be expressed in fewer words than these, “For He is good.” I see not what can be more solemn than this brevity, since goodness is so peculiarly the quality of God, that the Son of God Himself when addressed by some one as “Good Master,” by one, namely, who beholding His flesh, and comprehending not the fulness of His divine nature, considered Him as man only, replied, “Why callest thou Me good? There is none good but one, that is, God.” And what is this but to say, If thou wishest to call Me good, recognise Me as God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"

[[commentary]]
quote='''
With regard, then, to the accounts which are given us of this rich person, who asks what good thing he should do in order to obtain eternal life, there may appear to be some discrepancy between them, because the words were, according to Matthew, "Why askest thou me about the good?" while according to the others they were, "Why callest thou me good?" The sentence, "Why askest thou me about the good?" may then be referred more particularly to what was expressed by the man when he put the question, "What good thing shall I do?" For there we have both the name "good" applied to Christ, and the question put. But the address "Good Master" does not of itself convey the question. Accordingly, the best method of disposing of it is to understand both these sentences to have been uttered, "Why callest thou me good?" and, "Why askest thou me about the good?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 63"
