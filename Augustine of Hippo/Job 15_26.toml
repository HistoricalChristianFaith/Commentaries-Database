
[[commentary]]
quote='''
Against God fought ungodliness, and earthen vessels were dashed in pieces, even men by presuming on themselves, by too much prevailing by their own strength. This is that, the shield whereof Job also named concerning one ungodly. “He runneth against God, upon the stiff neck of his shield.” What is, “upon the stiff neck of his shield”? Presuming too much upon his own protection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
