[[commentary]]
quote='''
This grace the Apostle commendeth: by this he got to have the Jews for enemies, boasting of the letter of the law and of their own justice. This then commending in the lesson which hath been read, he saith thus: “For I am the least of the Apostles, that am not worthy to be called an Apostle, because I persecuted the Church of God.” “But therefore mercy,” he saith, “I obtained, because ignorant I did it in unbelief.” Then a little afterwards, “Faithful the saying is, and worthy of all acceptation, that Christ Jesus came into the world to save sinners, of whom I am first.” Were there before him not any sinners? What then, was he the first then? Yea, going before all men not in time, but in evil disposition. “But therefore,” he saith, “mercy I obtained,” in order that in me Christ Jesus might show all long-suffering, for the imitation of those that shall believe in Him unto life eternal: that is, every sinner and unjust man, already despairing of himself, already having the mind of a gladiator, so as to do whatsoever he willeth, because he must needs be condemned, may yet observe the Apostle Paul, to whom so great cruelty and so very evil a disposition was forgiven by God; and by not despairing of himself may he be turned unto God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
