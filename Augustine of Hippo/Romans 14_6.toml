[[commentary]]
quote='''
He who is wise as to the day, he says, is wise to the Lord—that is, because this very thing, that he judges the present day well, is wise to the Lord. And this is to judge well as to the day: that you know his correction in the future is not to be despaired of, concerning whose manifest fault you have judged in the present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
