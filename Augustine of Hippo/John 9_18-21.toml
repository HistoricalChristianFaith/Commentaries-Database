[[commentary]]
quote='''
"Therefore the Jews did not believe concerning him, that he had been blind, and received his sight, till they called the parents of him that received his sight;" that is, who had been blind, and had come to the possession of sight. "And they asked them, saying, Is this your son, who ye say was born blind? how then doth he now see? His parents answered them, and said, We know that this is our son, and that he was born blind: but how he now seeth, we know not; or who hath opened his eyes, we know not. And they said, Ask himself; he is of age, let him speak of himself." He is indeed our son, and we might justly be compelled to answer for him as an infant, because then he could not speak for himself: from of old he has had power of speech, only now he sees: we have been acquainted with him as blind from his birth, we know him as having speech from of old, only now do we see him endowed with sight: ask himself, that you may be instructed; why seek to calumniate us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
