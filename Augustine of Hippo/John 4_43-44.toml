[[commentary]]
quote='''
(Tr. xvi) After staying two days in Samaria, He departed into Galilee, where He resided: Now after two days He departed thence, and went into Galilee.

Why then does the Evangelist say immediately, For Jesus Himself testified, that a prophet hath no honour in his own country. For He would seem to have testified more to the truth, had He remained in Samaria, and not gone into Galilee. Not so: He stayed two days in Samaria, and the Samaritans believed on Him: He stayed the same time in Galilee, and the Galileans did not believe on Him, and therefore He said, that a prophet hath no honour in his own country.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Gospel Lesson of to-day follows that of yesterday, and this is the subject of our discourse. In this passage the meaning, indeed, is not difficult of investigation, but worthy of preaching, worthy of admiration and praise. Accordingly, in reciting this passage of the Gospel, we must commend it to your attention, rather than laboriously expound it.

Now Jesus, after His stay of two days in Samaria, "departed into Galilee," where He was brought up. And the evangelist, as he goes on, says, "For Jesus Himself testified that a prophet hath no honor in his own country." It was not because He had no honor in Samaria that Jesus departed. thence after two days; for Samaria was not His own country, but Galilee. Whilst, therefore, He left Samaria so quickly, and came to Galilee, where He had been brought up, how does He testify that "a prophet hath no honor in his own country"? Rather does it seem that He might have testified that a prophet has no honor in his own country, had He disdained to go into Galilee, and had stayed in Samaria.

Now mark well, beloved, while the Lord suggests and bestows what I may speak, that here is intimated to us no slight mystery. You know the question before us; seek ye out the solution of it. But, to make the solution desirable, let us repeat the theme. The point that troubles us is, why the evangelist said, "For Jesus Himself testified that a prophet hath no honor in his own country." Urged by this, we go back to the preceding words, to discover the evangelist's intention in saying this; and we find him relating, in the preceding words of the narrative, that after two days Jesus departed from Samaria into Galilee. Was it for this, then, thou saidst, O evangelist, that Jesus testified that a prophet hath no honor in his own country, just because He left Samaria after two days, and made haste to come to Galilee? On the contrary, I should have thought it more likely, that if Jesus had no honor in His own country, He should not have hastened to it, and left Samaria. But if I am not mistaken, or rather, because it is true, and I am not mistaken; for the evangelist saw what he was saying better than I can see it, saw the truth better than I do, he who drank it in from the Lord's bosom: for the evangelist is the same John who, among all the disciples, reclined on the Lord's breast, and whom the Lord, owing love to all, yet loved above the rest. Is it he, then, that should be mistaken, and I right in my opinion? Rather, if I am piously-minded, let me obediently hear what he said, that I may be worthy of thinking as he thought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252016.html'
source_title="Tractates on John 16"
