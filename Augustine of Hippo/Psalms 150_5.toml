[[commentary]]
quote='''
“Praise Him on the well-sounding cymbals, praise Him on cymbals of jubilation” (ver. 5). Cymbals touch one another in order to sound, and therefore are by some compared to our lips. But I think it better to understand that God is in a manner praised on the cymbal, when each is honoured by his neighbour, not by himself, and then honouring one another, they give praise to God. But lest any should understand such cymbals as sound without life, therefore I think he added, “on cymbals of jubilation.” For “jubilation” that is, unspeakable praise, proceedeth not, save from life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520150.html'
source_title="Exposition on Psalm 150"
