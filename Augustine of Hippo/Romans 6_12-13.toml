[[commentary]]
quote='''
But if with the flesh thou servest the law of sin, do as the apostle himself says: "Let not sin therefore reign in your mortal body, that ye should obey it in the lust thereof: neither yield ye your members as weapons of unrighteousness unto sin." He says not, Let it not be; but, "Let it not reign." So long as sin must be in thy members, let its reigning power at least be taken away, let not its demands be obeyed. Does anger rise? Yield not up thy tongue to anger for the purpose of evil-speaking; yield not up thy hand or foot to anger for the purpose of striking. That irrational anger would not rise, were there no sin in the members. But take away its ruling power; let it have no weapons wherewith to fight against thee. Then also it will learn not to rise, when it begins to find the lack of weapons. "Yield not your members as weapons of unrighteousness unto sin," else will ye be entirely captive, and there will be no room to say, "With the mind I serve the law of God." For if the mind keep possession of the weapons, the members are not roused to the service of raging sin. Let the inward ruler keep possession of the citadel, because it stands there under a greater ruler, and is certain of assistance. Let it bridle anger; let it restrain evil desire. There is within something that needs bridling, that needs restraining, that needs to be kept in command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
