[[commentary]]
quote='''
“Shall not all, who work iniquity, know?” (ver. 4). He threatens the judgment. “Who devour My people as the food of bread:” that is, daily. For the food of bread is daily food. Now they devour the people, who serve their own ends out of them, not referring their ministry to the glory of God, and the salvation of those over whom they are.

“They have not called upon the Lord.” For he doth not really call upon Him, who longs for such things as are displeasing to Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252014.html'
source_title="Exposition on Psalm 14"
