[[commentary]]
quote='''
“He shall give blessing,” saith he, “who gave the law.”…Grace shall come after the law, grace itself is the blessing. And what has that grace and blessing given unto us? “They shall go from virtue to virtue.” For here by grace many virtues are given. “For to one is given by the Spirit the word of wisdom, to another the word of knowledge according to the same Spirit, to another faith, to another the gift of healing, to another different kinds of tongues, to another the interpretation of tongues, to another prophecy.” Many virtues, but necessary for this life; and from these virtues we go on to “a virtue.” To what “virtue”? To “Christ the Virtue of God and the Wisdom of God.” He giveth different virtues in this place, who for all the virtues which are necessary and useful in this valley of weeping shall give one virtue, Himself. For in Scripture and in many writers four virtues are described useful for life: prudence, by which we discern between good and evil; justice, by which we give each person his due, “owing no man anything,” but loving all men: temperance, by which we restrain lusts; fortitude, by which we bear all troubles. These virtues are now by the grace of God given unto us in the valley of weeping: from these virtues we mount unto that other virtue. And what will that be, but the virtue of the contemplation of God alone?…It follows in that place: “They shall go from virtue to virtue.” What virtue? That of contemplation. What is contemplation? “The God of Gods shall appear in Sion.” The God of Gods, Christ of the Christians.…When all is finished, that mortality makes necessary, He shall appear to the pure in heart, as He is, “God with God,” The Word with the Father, “by which all things were made.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
