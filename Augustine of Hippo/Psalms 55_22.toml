[[commentary]]
quote='''
What shall we do, then, that we may apprehend what He is? Can ye do this by or through me? I say this to the little ones, both to you and to myself; there is by whom we can: we have just now sung, just now heard, "Cast thy care upon the Lord, and He will nourish thee." The reason why thou art not able, O man, is because thou art a little one; being a little one, thou must be nourished; being nourished, thou wilt become full-grown; and what as a little one thou couldst not, thou shalt see when full-grown; but that thou mayest be nourished, "cast thy care upon the Lord, and He will nourish thee."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
