
[[commentary]]
quote='''
“Thou art My God,” “depart not from Me; for trouble is hard at hand” (ver. 11). Thou art, therefore, My God, depart not from Me; for trouble is nigh unto Me; for it is in My body. “For there is none to help.” For who helpeth, if Thou helpest not?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
