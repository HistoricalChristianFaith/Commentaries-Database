[[commentary]]
quote='''
“The Lord from Heaven hath looked forth upon the sons of men, that He might see if there is one understanding and seeking after God” (ver. 3). What is this? “Corrupted they are,” all these that say, “There is no God”? And what? Did it escape God, that they were become such? Or indeed to us would their inward thought be opened, except by Him it were told? If then He understood, if then He knew, what is this which hath been said, “that He might see”? For the words are of one inquiring, of one not knowing. “God from Heaven hath looked forth,” etc. And as though He had found what He sought by looking upon, and by looking down from Heaven, He giveth sentence: “All men have gone aside, together useless they have become: there is not one that doeth good, not so much as one” (ver. 4). Two questions arise somewhat difficult: for if God looketh out from Heaven, in order that He may see if there is one understanding or seeking after God; there stealeth upon an unwise man the thought, that God knoweth not all things. This is one question: what is the other? If there is not one that doeth good, is not so much as one; who is he that travaileth amid bad men? The former question then is solved as followeth: ofttimes the Scripture speaketh in such manner, that what by the gift of God a creature doth, God is said to do.…For hence has been said the following also, “For the Spirit searcheth all things, even the depth of God;” not because He that knoweth all things searcheth, but because to thee hath been given the Spirit, which maketh thee also to search: and that which by His own gift thou doest, He is said to do; because without Him thou wouldest not do it: therefore God is said to do, when thou doest.…And because this by the gift of God thou doest, God from heaven is “looking forth upon the sons of men.” The former question then, according to our measure, thus hath been solved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
