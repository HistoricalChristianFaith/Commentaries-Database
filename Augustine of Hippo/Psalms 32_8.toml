
[[commentary]]
quote='''
Diapsalma. The answer of God: “I will give thee understanding, and will set thee in the way in which thou shalt go;” I will give thee understanding after confession, that thou depart not from the way in which thou shouldest go; lest thou wish to be in thine own power. “I will fix Mine Eyes upon thee” (ver. 8); so will I make sure upon thee My Love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252032.html'
source_title="Exposition on Psalm 32"
