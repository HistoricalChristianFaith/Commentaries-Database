[[commentary]]
quote='''
“The Lord liveth, and blessed be my God.” “But to be carnally minded is death:” for “the Lord liveth, and blessed be my God. And let the God of my salvation be exalted” (ver. 46). And let me not think after an earthly fashion of the God of my salvation; nor look from Him for this earthly salvation, but that on high.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
