[[commentary]]
quote='''
When he says: I say then, Did they so stumble that they should fall? God forbid! But by their fall salvation has come to the Gentiles, he does not say this because they did not fall, but because their fall was not empty, since it profited unto the salvation of the Gentiles. They did not, then, so stumble as to fall—that is, only to fall, as if solely for their own punishment—but so that this very fact, that they fell, might profit the Gentiles unto salvation. Then from this passage he begins to commend the people of the Jews, even on account of their very fall of unbelief, so that the Gentiles may not be proud, because even the fall of the Jews proved so precious for the salvation of the Gentiles; rather the Gentiles ought all the more to take care lest, while they are proud, they likewise fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
