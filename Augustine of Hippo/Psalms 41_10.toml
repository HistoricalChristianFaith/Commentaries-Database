[[commentary]]
quote='''
“But Thou, O Lord, be merciful unto Me” (ver. 10). This is the person of a servant, this is the person of the needy and poor: for, “Blessed is he that understandeth upon the needy and poor One.” See, as it was spoken, “Be merciful unto Me, and raise Me up, and I will requite them,” so is it done. For the Jews slew Christ, lest they should lose their place. Christ slain, they lost their place. Rooted out of the kingdom were they, dispersed were they. He, raised up, requited them tribulation, He requited them unto admonition, not yet unto condemnation. For the city wherein the people raged, as a ramping and a roaring lion, crying out, “Crucify Him, Crucify Him,” the Jews rooted out therefrom, hath now Christians, by not one Jew is inhabited. There is planted the Church of Christ, whence were rooted out the thorns of the synagogue. For truly this fire blazed “as the fire of thorns.” But the Lord was as a green tree. This said Himself, when certain women mourned Christ as dying.…“For if they do these things in a green tree, what shall be done in a dry?” When can a green tree be consumed by the fire of thorns? For they blazed as fire among thorns. Fire consumeth thorns, but whatsoever green tree it is applied to, is not easily kindled.…Yet lest ye think that God the Father of Christ could raise up Christ, that is, the Flesh of His Son, and that Christ Himself, though He be the Word equal with the Father, could not raise up His own Flesh; hear out of the Gospel, “Destroy this temple, and in three days I will raise it up.” “But,” said the Evangelist (lest even after this we should doubt), “He spake of the temple of His Body. Raise Me up, and I will requite them.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"

[[commentary]]
quote='''
Nevertheless, though mocked and dead, “He shall break in pieces the heads of His enemies,” of whom He saith, “Raise Thou me up, and I shall render to them:” whether it be good things for evil things, while to Himself He subdueth the heads of them believing, or whether just things for unjust things, while He punisheth the heads of them proud. For in either way are shattered and broken the heads of enemies, when from pride they are thrown down, whether by humility being amended, or whether unto the lowest depths of hell being hurled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
