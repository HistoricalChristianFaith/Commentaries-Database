[[commentary]]
quote='''
But when He here said, "Now is my soul troubled;" and also when He says, "My soul is sorrowful, even unto death;" and "Father, if it be possible, let this cup pass from me;" He assumed the infirmity of man, to teach him, when thereby saddened and troubled, to say what follows: "Nevertheless, Father, not as I will, but as Thou wilt." For thus it is that man is turned from the human to the divine, when the will of God is preferred to his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"
