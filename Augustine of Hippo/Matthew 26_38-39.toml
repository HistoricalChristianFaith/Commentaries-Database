[[commentary]]
quote='''
But when He here said, "Now is my soul troubled;" and also when He says, "My soul is sorrowful, even unto death;" and "Father, if it be possible, let this cup pass from me;" He assumed the infirmity of man, to teach him, when thereby saddened and troubled, to say what follows: "Nevertheless, Father, not as I will, but as Thou wilt." For thus it is that man is turned from the human to the divine, when the will of God is preferred to his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252052.html'
source_title="Tractates on John 52"

[[commentary]]
quote='''
God is displeasing to thee, and thou art pleasing to thyself, of perverted and crooked heart thou art: and this is the worse, that the heart of God thou wouldest correct by thy heart, to make Him do what thou wilt have whereas thou oughtest to do what He willeth. What then? Thou wouldest make crooked the heart of God which alway is right, according to the depravity of thy own heart? How much better to correct thy heart by the rectitude of God? Hath not thy Lord taught thee this, of Whose Passion but now were we speaking? Was He not bearing thy weakness, when He said, “Sad is My soul even unto death”? Was He not figuring thyself in Himself, when He was saying, “Father, if it be possible, let there pass from Me this cup”? For the hearts of the Father and of the Son were not two and different: but in the form of a servant He carried thy heart, that He might teach it by His example. Now behold trouble found out as it were another heart of thine, which willed that there should pass away that which was impending: but God would not. God consenteth not to thy heart, do thou consent to the heart of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"
