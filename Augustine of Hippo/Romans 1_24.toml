[[commentary]]
quote='''
When the evil will receives power to accomplish its purpose, this comes from the judgment of God, in whom there is no unrighteousness. His punishment is carried out in this way as well as in other ways. It is not less just merely because it is hidden. The wicked man only knows that he is being punished when some manifest penalty makes him feel, against his will, the evil of the sin which he committed willingly.
'''
source_url=''
source_title="THE SPIRIT AND THE LETTER 54"

[[commentary]]
quote='''
Many are left to themselves, to their own hurt.… A man that has asked for great wealth may have received it to his own hurt. While he was without it he had little to fear; as soon as he has possession of it he has become a prey to the stronger.
'''
source_url=''
source_title="HOMILIES ON 1 JOHN 6.8"

[[commentary]]
quote='''
When he says: He gave them over, it is understood: he dismissed them into the desires of their heart. And he says they received a reciprocal recompense from God, namely to be given over into the desires of their heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
But these punishments few men do see: therefore them the Spirit of God doth exceedingly recommend to our notice. Hear the Apostle saying, “God hath given them up unto the lusts of their heart.” Behold, the fire from the face of which like wax they are melting. For they loose themselves from a certain continence of chastity; therefore even these same men, going unto their lusts, as loose and melting are spoken of. Whence melting? whence loose? From the fire of lusts. “God hath given them up unto the lusts of their heart, so that they do those things which beseem not, being filled full of all iniquity.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
