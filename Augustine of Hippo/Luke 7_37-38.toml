[[commentary]]
quote='''
Behold that harlot of ill fame in the city burst into a strange house into which she had not been invited by the host, but by One invited she had been called; called not with tongue, but by Grace. The sick woman knew that she had there a place, where she was aware that her Physician was sitting at meat. She has gone in, that was a sinner; she dareth not draw near save to the feet: she weepeth at His feet, she washeth with tears, she wipeth with hair, she anointeth with ointment. Why wonderest thou? The earth hath given her fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
