[[commentary]]
quote='''
“For there is no deceit in my tongue.” What meant he by this? Lo, I confess to Thee, I have walked in my own way, I am become far from Thee, I have departed from Thee, with whom it was well with me, and to my good it was ill with me without Thee.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
