[[commentary]]
quote='''
Well, the Donatists are not false Christians. They are quite simply not Christians at all, since they listen to what the devil suggested and do not listen to the answer Christ gave him. How, after all, did the Lord, our teacher and savior, answer the devil's suggestion of such things? "Get back, Satan, for it is written: You shall not tempt the Lord your God." The devil, as a matter of fact, had taken his suggestion from Scripture, and the Lord replied from Scripture. The devil had said to the Lord, you see, "Since it is written, He will instruct his angels about you; they will lift you up in their hands, lest you should hurt your foot on a stone." "Hurl yourself down," he said, "and if you are the Son of God, the angels are there to catch you; what are you afraid of?" The Lord could indeed both have cast down his body and not allowed it to die; but what the devil was suggesting to Christ at that time is the sort of thing Christ was not teaching future Christians. This, you see, is exactly what the devil is also suggesting to the Donatists, saying, "Hurl yourselves down, the angels are there to catch you. With such a death you do not go to punishment, but you win through to a crown." They would be Christians if they give an ear to Christ and did not trust the devil, who first separated them from the peace of the church and later on gave them cliff-jumpers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520313E.html'
source_title="SERMON 313E.4"

[[commentary]]
quote='''
What then, my brethren, what is said of our Head? “For Thou, Lord, art my hope,” etc. Of this we have spoken, “for He hath given His angels charge over Thee, to keep Thee in all Thy ways” (ver. 11). You heard these words but now, when the Gospel was being read; attend therefore. Our Lord, after He was baptized, fasted. Why was He baptized? That we might not scorn to be baptized. For when John said to our Lord, “Comest Thou to me to be baptized? I ought to be baptized by Thee;” and our Lord replied, “Suffer it to be so now, for thus it becometh us to fulfil all righteousness;” He wished to fulfil all humility, so that He should be washed, who had no defilement.…Our Lord, then, was baptized, and after baptism He was tempted; He fasted forty days, a number which has, as I have often mentioned, a deep meaning. All things cannot be explained at once, lest needful time be too much taken up. After forty days He was an hungred. He could have fasted without ever feeling hunger; but then how could He be tempted? or had He not overcome the tempter, how couldest thou learn to struggle with him? He was hungry; and then the tempter said, “If Thou be the Son of God, command that these stones be made bread.” Was it a great thing for our Lord Jesus Christ to make bread out of stones, when He satisfied so many thousands with five loaves? He made bread out of nothing. For whence came that quantity of food, which could satisfy so many thousands? The sources of that bread are in the Lord’s hands. This is nothing wonderful; for He Himself made out of five loaves bread enough for so many thousands, who also every day out of a few seeds raises up on earth immense harvests. These are the miracles of our Lord: but from their constant operation they are disregarded. What then, my brethren, was it impossible for the Lord to create bread out of stones? He made men even out of stones, in the words of John the Baptist himself, “God is able of these stones to raise up children unto Abraham.” Why then did He not so? That he might teach thee how to answer the tempter, so that if thou wast reduced to any straits and the tempter suggested, if thou wast a Christian and belongedst to Christ, would He desert thee now?…Listen to our Lord: “Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.” Dost thou think the word of God bread? If the Word of God, through which all things were made, was not bread, He would not say, “I am the bread which came down from heaven.” Thou hast therefore learnt to answer the tempter, when pressed with hunger.

What if he tempt thee in these words: If thou wast a Christian, thou wouldest do miracles, as many Christians have done? Thou, deceived by a wicked suggestion, wouldest tempt the Lord thy God, so as to say to Him, If I am a Christian, and am before Thine eyes, and Thou dost account me at all in the number of Thine own, let me also do something like the many works which Thy Saints have done. Thou hast tempted God, as if thou wert not a Christian, unless thou didst this. Many who desired such things have fallen. For that Simon the sorcerer desired such gifts of the Apostles, when he wished to buy the Holy Spirit for money. He loved the power of working miracles, but loved not the imitation of humility.…What then, if he tempt thee thus, “work miracles”? that thou mayest not tempt God, what shouldest thou answer? What our Lord answered. The devil said to Him, “Cast Thyself down; for it is written, He shall give His Angels charge concerning Thee,” etc. If Thou shalt cast Thyself down, Angels shall receive Thee. And it might indeed, my brethren, happen, if our Lord had cast Himself down, the attending Angels would receive our Lord’s flesh; but what does He say to him? “It is written again, Thou shalt not tempt the Lord thy God.” Thou thinkest Me a man. For the devil came to Him with this view, that he might try whether He were the Son of God. He saw His Flesh; but His might appeared in His works: the Angels had borne witness. He saw that He was mortal, so that he might tempt Him, that by Christ’s temptation the Christian might be taught. What then is written? “Thou shalt not tempt the Lord thy God.” Let us not then tempt the Lord, so as to say, If we belong to Thee, let us work a miracle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
