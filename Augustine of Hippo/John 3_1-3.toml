[[commentary]]
quote='''
"And there was a man of the Pharisees, Nicodemus by name, a ruler of the Jews: the same came to Him by night, and said unto Him, Rabbi (you already know that Master is called Rabbi), we know that Thou art a teacher come from God; for no man can do these signs which Thou doest, except God be with him." This Nicodemus, then, was of those who had believed in His name, as they saw the signs and prodigies which He did. For this is what he said above: "Now, when He was in Jerusalem at the passover on the feast-day, many believed in His name." Why did they believe? He goes on to say, "Seeing His signs which He did." And what says he of Nicodemus? "There was a ruler of the Jews, Nicodemus by name the same came to Him by night, and says to Him, Rabbi, we know that Thou art a teacher come from God." Therefore this man also had believed in His name. And why had he believed? He goes on, "For no man can do these signs which Thou doest, except God be with him." If, therefore, Nicodemus was of those who had believed in His name, let us now consider, in the case of this Nicodemus, why Jesus did not trust Himself to them. "Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God." Therefore to them who have been born again doth Jesus trust Himself. Behold, those men had believed on Him, and yet Jesus trusted not Himself to them. Such are all catechumens: already they believe in the name of Christ, but Jesus does not trust Himself to them. Give good heed, my beloved, and understand. If we say to a catechumen, Dost thou believe on Christ, he answers, I believe, and signs himself; already he bears the cross of Christ on his forehead, and is not ashamed of the cross of his Lord. Behold, he has believed in His name. Let us ask him, Dost thou eat the flesh of the Son of man, and drink the blood of the Son of man? He knows not what we say, because Jesus has not trusted Himself to him.

Therefore, since Nicodemus was of that number, he came to the Lord, but came by night; and this perhaps pertains to the matter. Came to the Lord, and came by night; came to the Light, and came in the darkness. But what do they that are born again of water and of the Spirit hear from the apostle? "Ye were once darkness, but now light in the Lord; walk as children of light;" and again, "But we who are of the day, let us be sober." Therefore they who are born again were of the night, and are of the day; were darkness, and are light. Now Jesus trusts Himself to them, and they come to Jesus, not by night, like Nicodemus; not in darkness do they seek the day. For such now also profess: Jesus has come near to them, has made salvation in them; for He said, "Except a man eat my flesh, and drink my blood, he shall not have life in him." And as the catechumens have the sign of the cross on their forehead, they are already of the great house; but from servants let them become sons. For they are something who already belong to the great house. But when did the people Israel eat the manna? After they had passed the Red Sea. And as to what the Red Sea signifies, hear the apostle: "Moreover, brethren, I would not have you ignorant, that all our fathers were under the cloud, and all passed through the sea." To what purpose passed they through the sea? As if thou wert asking of him, he goes on to say, "And all were baptized by Moses in the cloud and in the sea." Now, if the figure of the sea had such efficacy, how great will be the efficacy of the true form of baptism! If what was done in a figure brought the people, after they had crossed over, to the manna, what will Christ impart, in the verity of His baptism, to His own people: brought over through Himself? By His baptism He brings over them that believe; all their sins, the enemies as it were that pursue them, being slain, as all the Egyptians perished in that sea. Whither does He bring over, my brethren? Whither does Jesus bring over by baptism, of which Moses then showed the figure, when he brought them through the sea? Whither? To the manna. What is the manna? "I am," saith He, "the living bread, which came down from heaven." The faithful receive the manna, having now been brought through the Red Sea? Why Red Sea? Besides sea, why also "red"? That "Red Sea" signified the baptism of Christ. How is the baptism of Christ red, but as consecrated by Christ's blood? Whither, then, does He lead those that believe and are baptized? To the manna. Behold, "manna," I say: what the Jews, that people Israel, received, is well known, well known what God had rained on them from heaven; and yet catechumens know not what Christians receive. Let them blush, then, for their ignorance; let them pass through the Red Sea, let them eat the manna, that as they have believed in the name of Jesus, so likewise Jesus may trust Himself to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"
