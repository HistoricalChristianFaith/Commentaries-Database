[[commentary]]
quote='''
Thus then “mayest thou see the good things that are of Jerusalem,” and that, “all thy life long—and mayest thou see,” not only thy children, but, “thy children’s children.” What meaneth, Thy children? Thy works which thou here dost. Who are thy children’s children? The fruits of thy works. Thou givest alms: these are thy children: for the sake of thine alms thou receivest everlasting life, these are thy children’s children. “Mayest thou see thy children’s children;” and there shall be “peace upon Israel” (ver. 6), the last words of the Psalm.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520128.html'
source_title="Exposition on Psalm 128"
