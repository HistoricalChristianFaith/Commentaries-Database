[[commentary]]
quote='''
(Tract. lxxv. 5) He that hath them in mind, and keepeth them in life; he that hath them in words, and keepeth them in works; he that hath them by hearing, and keepeth them by doing; he that hath them by doing, and keepeth them by persevering, he it is that loveth Me. Love must be shown by works, or it is a mere barren name.

(Tract. lxxv. 5) I will love him, as if now He did not love him. What meaneth this? He explains it in what follows: And will manifest Myself unto him, i. e. I love him so far as to manifest Myself to him; so that, as the reward of his faith, he will have sight. Now He only loves us so that we believe; then He will love us so that we see. And whereas we love now by believing that which we shall see, then we shall love by seeing that which we have believed.

(ad Paul. de videndo Dei, Ep. 112:100, 10) He promises to show Himself to them that love Him as God with the Father, not in that body which He bore upon earth, and which the wicked saw.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"He that hath my commmandments," He adds, "and keepeth them, he it is that loveth me." He that hath [them] in his memory, and keepeth them in his life; who hath them orally, and keepeth them morally; who hath them in the ear, and keepeth them in deed; or who hath them in deed, and keepeth them by perseverance;-"he it is," He says, "that loveth me." By works is love made manifest as no fruitless application of a name. "And he that loveth me," He says, "shall be loved of my Father, and I will love him, and will manifest myself to him." But what is this, "I will love"? Is it as if He were then only to love, and loveth not at present? Surely not. For how could the Father love us apart from the Son, or the Son apart from the Father? Working as They do inseparably, how can They love apart? But He said, "I will love him," in reference to that which follows, "and I will manifest myself to him." "I will love, and will manifest;" that is, I will love to the very extent of manifesting. For this has been the present aim of His love, that we may believe, and keep hold of the commandment of faith; but then His love will have this for its object, that we may see, and get that very sight as the reward of our faith: for we also love now, by believing in that which we shall see hereafter; but then shall we love in the sight of that which now we believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252075.html'
source_title="Tractates on John 75"

[[commentary]]
quote='''
For it was not Himself that Christ showed forth on earth; but it was His Flesh that He showed. For had He showed Himself, the Jews would have seen and known Him; but had they “known Him, they would never have crucified the Lord of Glory.” But perhaps His disciples saw Him, when they said unto Him, “Show us the Father, and it sufficeth us;” and He, to show that it was not Himself that had been seen by them, added: “Have I been so long with you, and have ye not known Me, Philip? He that seeth Me, seeth the Father also.” If then they saw Christ, wherefore did they yet seek for the Father? For if it were Christ whom they saw, they would have seen the Father also. They did not therefore yet see Christ, who desired that the Father should be shown unto them. To prove that they did not yet see Him, hear that, in another place, He promised it by way of reward, saying, “He who loveth Me, keepeth My commandments; and whoso loveth Me, shall be loved of My Father; and I will love Him and” (as if it were said to Him, “what wilt Thou give unto him, as Thou lovest him?” He saith), “I will manifest Myself unto him.” If then He promises this by way of a reward unto them that love Him, it is manifest that the vision of the Truth, promised to us, is of such a nature, that, when we have seen it, we shall no longer say, “My soul is filled with illusions.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"


[[commentary]]
quote='''
But as He was seen by those who believed, and by those who crucified Him, when He was judged; so will He be seen, when He shall have begun to be judge, both by those whom He shall condemn, and by those whom He shall crown. But that vision of divinity, which He hath promised to them that love Him, when He saith, “He that loveth Me shall be loved of My Father, and he that loveth Me keepeth My commandments, and I will love him, and will manifest Myself to him:” this the ungodly shall not see. This manifestation is in a certain way familiar: He keepeth it for His own, He will not show it to the ungodly. Of what sort is the vision itself? Of what sort is Christ? Equal to the Father. Of what sort is Christ? “In the beginning was the Word, and the Word was with God, and the Word was God.” For this vision we sigh now, and groan so long as we sojourn here; to this vision we shall be brought home at the last, this vision now we see but darkly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"

[[commentary]]
quote='''
For that ye may know that the heart ought to be made ready for that place, to see the Divinity of the Father and Son and Holy Spirit, in which though not seen we believe, and by believing cleanse the heart that there may be able to be sight: the Lord Himself saith in another place, “He that hath My commands and keepeth them, he it is that loveth Me: and he that loveth Me shall be loved by My Father: and I will love him, and will manifest Myself unto him.” Did they not see Him, with whom He was talking? They both saw Him, and did not see Him? they saw something, they believed something: they saw Man, they believed in God. But in the Judgment they shall see the same Lord Jesus Christ as Man, together with the wicked: after the Judgment, they shall see God, apart from the wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
