[[commentary]]
quote='''
“For unto Thee, Lord, are mine eyes; in Thee have I hoped, take not Thou away my life” (ver. 8). For they were tortured in persecutions, and many failed. It occurreth to him that many have failed, many have been in hazard, and as it were in the midst of the tribulation of persecution is sent forth the voice of one praying; “For unto Thee, Lord, are mine eyes:” I care not what they threaten who stand around, “unto Thee, Lord, are mine eyes.” More do I fix mine eye on Thy promises than on their threats. I know what Thou hast suffered for me, what Thou hast promised me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
