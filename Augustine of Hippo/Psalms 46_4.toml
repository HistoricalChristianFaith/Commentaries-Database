[[commentary]]
quote='''
“The streams of the river make glad the City of God” (ver. 4). When the mountains shake, when the sea rages, God deserteth not His City, by the streams of the river. What are these streams of the river? That overflowing of the Holy Spirit, of which the Lord said, “If any man thirst, let him come unto Me, and drink. He that believeth on Me, out of his bosom shall flow rivers of living water.” These rivers then flowed out of the bosom of Paul, Peter, John, the other Apostles, the other faithful Evangelists. Since these rivers flowed from one river, many “streams of the river make glad the City of God.” For that ye might know this to be said of the Holy Spirit, in the same Gospel next said the Evangelist, “But this spake He of the Spirit, which they that were to believe on Him should receive. For the Holy Ghost was not yet given, because that Jesus was not yet glorified.” Jesus being glorified after His Resurrection, glorified after His Ascension, on the day of Pentecost came the Holy Spirit, and filled the believers, who spake with tongues, and began to preach the Gospel to the Gentiles. Hence was the City of God made glad, while the sea was troubled by the roaring of its waters, while the mountains were confounded, asking what they should do, how drive out the new doctrine, how root out the race of Christians from the earth. Against whom? Against the streams of the river making glad the City of God. For thereby showed He of what river He spake; that He signified the Holy Spirit, by “the streams of the river make glad the City of God.” And what follows? “The Most High hath sanctified His tabernacle:” since then there followeth the mention of Sanctification, it is manifest that these streams of the river are to be understood of the Holy Spirit, by whom is sanctified every godly soul believing in Christ, that it may be made a citizen of the City of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"

[[commentary]]
quote='''
The Spirit itself was a mighty river, whence many rivers were filled. Of that river the Psalmist saith in another passage, “The rivers of the flood thereof shall make glad the city of God.” Rivers then were made to flow from the belly of the disciples, when they received the Holy Spirit: themselves were rivers, when they had received that Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
