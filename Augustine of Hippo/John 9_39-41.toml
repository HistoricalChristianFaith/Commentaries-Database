[[commentary]]
quote='''
(Tr. xliv. 16, 17) The day then was divided between light and darkness. So it is rightly added, that they which see not, may see; for He relieved men from darkness. But what is that which follows: And that they which see might he made blind. Hear what comes next. Some of the Pharisees were moved by these words: And some of the Pharisees which were with Him heard these words, and said unto Him, Are we blind also? What had moved them were the words, And that they which see might be made blind. It follows; Jesus saith unto them, If ye were blind, ye should have no sin; i. e. If ye called yourselves blind, and ran to the physician. But now ye say, We see; therefore your sin remaineth: for in that saying, We see, ye seek not a physician, ye shall remain in your blindness. This then which He has just before said, I came, that they that see not might see; i. e. they who confess they cannot see, and seek a physician, in order that they may see: and that they which see not may be made blind; i. e. they which think they can see, and seek not a physician, may remain in their blindness. This act of division He calls judgment, saying, For judgment have I come into this world: not that judgment by which He will judge quick and dead at the end of the world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And Jesus said to him." Now is He, the day, discerning between the light and the darkness. "For judgment am I come into this world; that they who see not might see, and they who see might be made blind." What is this, Lord? A weighty subject of inquiry hast Thou laid on the weary; but revive our strength that we may be able to understand what Thou hast said. Thou art come "that they who see not may see:" rightly so, for Thou art the light: rightly so, for Thou art the day: rightly so, for Thou deliverest from darkness: this every soul accepts, every one understands. What is this that follows, "And those who see may be made blind?" Shall then, because Thou art come, those be made blind who saw? Hear what follows, and perhaps thou wilt understand.

By these words, then, were "some of the Pharisees" disturbed, "and said unto Him, Are we blind also?" Hear now what it is that moved them, "And they who see may be made blind." "Jesus said unto them, If ye were blind, ye should have no sin;" while blindness itself is sin. "If ye were blind," that is, if ye considered yourselves blind, if ye called yourselves blind, ye also would have recourse to the physician: "if" then in this way "ye were blind, ye should have no sin;" for I am come to take away sin. "But now ye say, We see; [therefore] your sin remaineth." Wherefore? Because by saying, "We see:" ye seek not the physician, ye remain in your blindness. This, then, is that which a little above we did not understand, when He said, "I am come, that they who see not may see;" for what means this, "that they who see not may see"? They who acknowledge that they do not see, and seek the physician, that they may receive sight. And they who see may be made blind:" what means this, "they who see may be made blind"? That they who think they see, and seek not the physician, may abide in their blindness. Such discerning therefore of one from another He called judgment, when He said, "For judgment I am come into this world," whereby He distinguishes the cause of those who believe and make confession from the proud, who think they see, and are therefore the more grievously blinded: just as the sinner, making confession, and seeking the physician, said to Him, "Judge me, O God, and discern my cause against the unholy nation," -namely, those who say, "We see," and their sin remaineth. But it was not that judgment He now brought into the world, whereby in the end of the world He shall judge the living and the dead. For in respect to this He had said, "I judge no man;" seeing that He came the first time, "not to judge the world, but that the world through Him might be saved."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
