[[commentary]]
quote='''
“Arise, O Lord, into Thy resting place” (ver. 8). He saith unto the Lord sleeping, “Arise.” Ye know already who slept, and who rose again.…“Thou, and the ark of Thy sanctification:” that is, Arise, that the ark of Thy sanctification, which Thou hast sanctified, may arise also. He is our Head; His ark is His Church: He arose first, the Church will arise also. The body would not dare to promise itself resurrection, save the Head arose first. The Body of Christ, that was born of Mary, hath been understood by some to be the ark of sanctification; so that the words mean, Arise with Thy Body, that they who believe not may handle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
