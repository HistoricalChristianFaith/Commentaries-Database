[[commentary]]
quote='''
“Sing to the Lord, O ye saints of His.” The prophet seeing these future things, rejoiceth, and saith, “Sing to the Lord, O ye saints of His. And make confession of the remembrance of His holiness” (ver. 4). And make confession to Him, that He hath not forgotten the sanctification, wherewith He hath sanctified you, although all this intermediate period belong to your desires.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"
