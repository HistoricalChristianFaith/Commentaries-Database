[[commentary]]
quote='''
In these twelve was the tribe of Judah, whence the kings were. For at first from another tribe was given King Saul, and he was rejected as being an evil king; after there was given from the tribe of Judah King David, and out of him from the tribe of Judah were the Kings. But Jacob had spoken of this, when he blessed his sons, “there shall not fail a prince out of Judah, nor a leader from his thighs, until there come He to whom the promise hath been made.” But from the tribe of Judah there came Our Lord Jesus Christ. For He is, as the Scripture saith, and as ye have but now heard, out of the seed of David born of Mary. But as regardeth the Divinity of our Lord Jesus Christ, wherein He is equal with the Father, He is not only before the Jews, but also before Abraham himself; nor only before Abraham, but also before Adam; nor only before Adam, but also before Heaven and earth and before ages: for all things by Himself were made, and without Him there was made nothing. Because therefore in prophecy hath been said, “there shall not fail a prince out of Judah,” etc.: former times are examined, and we find that the Jews always had their kings of the tribe of Judah, and had no foreign king before that Herod who was king when the Lord was born. Thence began foreign kings, from Herod. Before Herod all were of the tribe of Judah, but only until there should come He to whom the promise had been made. Therefore when the Lord Himself came, the kingdom of the Jews was overthrown, and removed from the Jews. Now they have no king; because they will not acknowledge the true King. See now whether they must be called Jews. Now ye do see that they must not be called Jews. They have themselves with their own voice resigned that name, so that they are not worthy to be called Jews, except only in the flesh. When did they sever themselves from the name? They said, “We have no king but Cæsar.” O ye who are called Jews and are not, if ye have no king but Cæsar, there hath failed a Prince of Judah: there hath come then He to whom the promise hath been made. They then are more truly Jews, who have been made Christians out of Jews: the rest of the Jews, who in Christ have not believed, have deserved to lose even the very name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
