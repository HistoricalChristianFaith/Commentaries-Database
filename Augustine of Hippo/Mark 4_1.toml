[[commentary]]
quote='''
Matthew continues thus: "In that day went Jesus out of the house, and sat by the seaside: and great multitudes were gathered together unto Him, so that He went into a ship and sat, and the whole multitude stood on the shore. And He spake many things unto them in parables, saying;" and so on, down to the words, "Therefore every scribe which is instructed in the kingdom of heaven is like unto a man that is an householder, which bringeth forth out of his treasure things new and old." That the things narrated in this passage took place immediately after the incident touching the mother and the brethren of the Lord, and that Matthew has also retained that historical order in his version of these events, is indicated by the circumstance that, in passing from the one subject to the other, he has expressed the connection by this mode of speech: "In that day went Jesus out of the house, and sat by the sea-side; and great multitudes were gathered together unto Him." For by adopting this phrase, "in that day" (unless perchance the word "day," in accordance with a use and wont of the Scriptures, may signify simply "time"), he intimates clearly enough either that the thing now related took place in immediate succession on what precedes, or that much at least could not have intervened. This inference is confirmed by the fact that Mark keeps by the same order. Luke, on the other hand, after his account of what happened with the mother and the brethren of the Lord, passes to a different subject. But at the same time, in making that transition, he does not institute any such connection as bears the appearance of a want of consistency with this order. Consequently, in all those passages in which Mark and Luke have reported in common with Matthew the words which were spoken by the Lord, there is no questioning their harmony with one another. Moreover, the sections which are given by Matthew only are even much more beyond the range of controversy. And in the matter of the order of narration, although it is presented somewhat differently by the various evangelists, according as they have proceeded severally along the line of historical succession, or along that of the succession of recollection, I see as little reason for alleging any discrepancy of statement or any contradiction between any of the writers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 41"
