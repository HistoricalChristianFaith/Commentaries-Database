[[commentary]]
quote='''
It is in accordance with this principle that he elsewhere says, "That we may serve in newness of spirit, and not in the oldness of the letter;" wishing the law to be here understood by "the oldness of the letter," and what else by "newness of spirit" than grace? Then, that it might not be thought that he had brought any accusation, or suggested any blame, against the law, he immediately takes himself to task with this inquiry: "What shall we say, then? Is the law sin? God forbid." He then adds the statement: "Nay, I had not known sin but by the law;" which is of the same import as the passage above quoted: "By the law is the knowledge of sin." Then: "For I had not known lust," he says, "except the law had said, 'Thou shalt not covet.' But sin, taking occasion by the commandment, wrought in me all manner of concupiscence. For without the law sin was dead. For I was alive without the law once; but when the commandment came, sin revived, and I died. And the commandment, which was ordained to life, I found to be unto death. For sin, taking occasion by the commandment, deceived me, and by it slew me. Wherefore the law is holy; and the commandment holy, just, and good. Was, then, that which is good made death unto me? God forbid. But sin, that it might appear sin, worked death in me by that which is good,—in order that the sinner, or the sin, might by the commandment become beyond measure." And to the Galatians he writes: "Knowing that a man is not justified by the works of the law, except through faith in Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law; for by the works of the law shall no flesh be justified."

Why, therefore, do those very vain and perverse Pelagians say that the law is the grace of God by which we are helped not to sin? Do they not, by making such an allegation, unhappily and beyond all doubt contradict the great apostle? He, indeed, says, that by the law sin received strength against man; and that man, by the commandment, although it be holy, and just, and good, nevertheless dies, and that death works in him through that which is good, from which death there is no deliverance unless the Spirit quickens him, whom the letter had killed,—as he says in another passage, "The letter killeth, but the Spirit giveth life." And yet these obstinate persons, blind to God's light, and deaf to His voice, maintain that the letter which kills gives life, and thus gainsay the quickening Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapters 22-23"
