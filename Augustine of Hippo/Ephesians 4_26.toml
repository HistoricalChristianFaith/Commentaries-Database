[[commentary]]
quote='''
But if he mean that his eye is disordered by his own anger, there is no wonder either in this. For hence perhaps it is said, “Let not the sun go down upon your wrath;” because the mind, which, from her own disorder, is not permitted to see God, supposes that the inner sun, that is, the wisdom of God, suffers as it were a setting in her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25206.html'
source_title="Exposition on Psalm 6"
