[[commentary]]
quote='''
And in the end our Lord Himself said there should be an abounding of iniquity: “And since iniquity shall abound, the love of many shall wax cold; but he that shall have persevered unto the end, the same shall be saved.” But who shall persevere even unto the end, even until iniquity pass over? He that shall have been in the Body of Christ, he that shall have been in the members of Christ, and from the Head shall have learned the patience of persevering. Thou passest away, and behold passed are thy temptations; and thou goest into another life whither have gone holy men, if holy thou hast been. Into another life have gone Martyrs; if Martyr thou shalt have been, thou also goest into another life. Because “thou” hast passed away hence, hath by any means iniquity therefore passed away? There are born other unrighteous men, as there die some unrighteous men. In like manner therefore as some unrighteous men die and others are born: so some just men go, and others are born. Even unto the end of the world neither iniquity will be wanting to oppress, nor righteousness to suffer.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"

[[commentary]]
quote='''
Ye know what the Gospel saith; we are speaking to Christians; we ought not to disobey the faith. The Gospel saith this, that in the last times many evils, many stumbling-blocks, many tribulations, much iniquity, shall abound; but he that shall endure unto the end, the same shall be saved. “The love,” it saith, “of many shall wax cold.” Whosoever then hath been stedfastly fervent in spirit, as the Apostle saith, “fervent in spirit,” his love shall not wax cold: because “the love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
