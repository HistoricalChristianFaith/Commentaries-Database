
[[commentary]]
quote='''
"He that believeth in me, though he were dead, yet shall he live: and whosoever liveth and believeth in me shall never die." What meaneth this? "He that believeth in me, though he were dead," just as Lazarus is dead, "yet shall he live;" for He is not the God of the dead, but of the living. Such was the answer He gave the Jews concerning their fathers, long ago dead, that is, concerning Abraham, and Isaac, and Jacob: I am the! God of Abraham, and the God of Isaac, and! the God of Jacob: He is not the God of the dead, but of the living; for all live unto Him." Believe then, and though thou wert dead, yet shalt thou live: but if thou believest not, even while thou livest thou art dead. Let us prove this likewise, that if thou believest not, though thou livest thou art dead. To one who was delaying to follow Him, and saying, "Let me first go and bury my father," the Lord said, "Let the dead bury their dead; but come thou and follow me." There was there a dead man requiring to be buried, there were there also dead men to bury the dead: the one was dead in the flesh, the others in soul. And how comes death on the soul? When faith is wanting. How comes death on the body? When the soul is wanting. Therefore thy soul's soul is faith. "He that believeth in me," says Christ, though he were dead in the flesh, yet shall he live in the spirit; till the flesh also rise again, never more to die. This is "he that believeth in me," though he die, "yet shall he live. And whosoever liveth" in the flesh, "and believeth in me," though he shall die in time on account of the death of the flesh, "shall never die," because of the life of the spirit, and the immortality of the resurrection. Such is the meaning of the words, "And whosoever liveth and believeth in me shall never die. Believest thou this? She saith unto Him, Yea, Lord, I have believed that Thou art the Christ, the Son of God, who hast come into the world." When I believed this, I believed that Thou art the resurrection, that Thou art the life: I believed that he that believeth in Thee, though he die, yet shall he live; and whosoever liveth and believeth in Thee, shall never die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
