[[commentary]]
quote='''
Psalm 68 [LXX] also includes in its title the words "for the things that will be entirely changed." This psalm sings of the passion of our Lord Jesus Christ, assuming to himself even certain words of his members, that is, of his faithful. For he himself did not have any sin, but he carried our sins; thus the psalm says "and my offenses are not hidden from you." Here is written and foretold what we read in the Gospel as having happened: "And they gave me gall for my food, and in my thirst they gave me vinegar to drink." In him, therefore, the old events have been changed that the title of the psalm predicted were to be changed.
'''
source_url=''
source_title="IN ANSWER TO THE JEWS 5:6"


[[commentary]]
quote='''
For it was proclaimed beforehand by the very same prophets that they [Jews] would not understand, because it was necessary for other things to be fulfilled, and by a hidden and just decree of God, for due punishment to be paid in accordance with their merits. For, indeed, he whom they crucified, he to whom they gave gall and vinegar—although he was hanging on the cross—he said to the Father, for the sake of those whom he would have led from the darkness into the light, "Father, forgive them, for they know not what they do." But, for the sake of the others whom he was to abandon for more hidden causes, he said long before through the prophet, "And they gave me gall for my food, and in my thirst they gave me vinegar to drink. Let their table become as a snare before them, and a recompense and a stumbling block. Let their eyes be darkened that they see not; and their back you always bend down." Therefore, they roam about anywhere and everywhere, their darkened eyes a most remarkable proof for our cause, so that through them our arguments are upheld at the very time that this same people is rejected.
'''
source_url=''
source_title="ON FAITH IN THINGS UNSEEN 6:9"

[[commentary]]
quote='''
While hanging on the tree, He said, "I thirst." They, having heard this, offered to Him on the cross vinegar by a sponge on a reed. He received it, and said, "It is finished;" and, bowing His head, gave up the ghost. You see His power of dying, that He waited for this-until all things should be fulfilled that had been foretold concerning Him-to take place before His death. For the prophet had said, "They gave me gall for my meat; and in my thirst they gave me vinegar to drink." He waited for all these things to be fulfilled: after they were completed, He said, "It is finished;" and He departed by power, because He came not by necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"

[[commentary]]
quote='''
Among the rest that was prophesied of Him, it is also written: "They gave me gall for meat, and in my thirst they gave me vinegar to drink." How this happened, we know from the Gospel. First, they gave Him gall; He received it, tasted it, and spat it out. Thereafter, as He hung on the cross, that all that was foretold might be fulfilled, He said, "I thirst." They took a sponge filled with vinegar, bound it to a reed, and put it to His mouth; He received it, and said, "It is finished." What did that mean? All things which were prophesied before my death are completed, then what do I here any longer? In a word, when He said "It is finished, He bowed His head, and gave up the ghost."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252037.html'
source_title="Tractates on John 37"

[[commentary]]
quote='''
He saw, therefore, that all was accomplished that required to be done before He received the vinegar, and gave up the ghost; and that this also might be accomplished which the scripture had foretold, "And in my thirst they gave me vinegar to drink," He said, "I thirst:" as if it were, One thing still you have failed to do, give me what you Are. For the Jews were themselves the vinegar, degenerated as they were from the wine of the patriarchs and prophets; and filled like a full vessel with the wickedness of this world, with hearts like a sponge, deceitful in the formation of its cavernous and tortuous recesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520119.html'
source_title="Tractates on John 119"

[[commentary]]
quote='''
“And they gave for My food gall, and in My thirst they gave Me vinegar to drink” (ver. 22). This was done indeed to the letter. And the Gospel declareth this to us. But we must understand, brethren, that the very fact that I found not comforters, that the very fact that I found not one that together should be made sorrowful, this was My gall, this to Me was bitter, this was vinegar: bitter because of grief, vinegar because of their old man. For we read, that to Him indeed gall was offered, as the Gospel speaketh; but for drink, not for food. Nevertheless, we must so take and consider that when fulfilled, which here had been before predicted, “They gave for My food gall:” and in that very action, not only in this saying, we ought to seek for a mystery, at secret things to knock, to enter the rent veil of the Temple, to see there a Sacrament, both in what there hath been said and in what there hath been done. “They gave,” He saith, “for My food gall:” not the thing itself which they gave was food, for it was drink: but “for food they gave it.” Because already the Lord had taken food, and into it there had been thrown gall. But He had taken Himself pleasant food, when He ate the Passover with His disciples: therein He showed the Sacrament of His Body. Unto this food so pleasant, so sweet, of the Unity of Christ, of which the Apostle maketh mention, saying, “For one bread, One Body, being many we are;” unto this pleasant food who is there that addeth gall, except the gainsayers of the Gospel, like those persecutors of Christ? For less the Jews sinned in crucifying Him walking on earth, than they that despise Him sitting in Heaven. That which then the Jews did, in giving above the food which He had already taken that bitter draught to drink, the same they do that by evil living bring scandal upon the Church: the same do embittered heretics, “But let them not be exalted in their own selves.” They give gall after so delectable meat. But what doth the Lord? He admitteth them not to His Body. In this mystery, when they presented gall, the Lord Himself tasted, and would not drink. If we did not suffer them, neither at all should we taste: but because it is necessary to suffer them, we must needs taste. But because in the members of Christ such sort cannot be, they can be tasted, received into the Body they cannot be. “And they gave for My food gall, and in My thirst they gave Me vinegar to drink.” I was thirsting, and vinegar I received: that is, for the faith of them I longed, and I found oldness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
