[[commentary]]
quote='''
(Tract. lxxxi. 3) For the branches of the vine are as contemptible, if they abide not in the vine, as they are glorious, if they abide. One of the two the branch must be in, either the vine, or the fire: if it is not in the vine, it will be in the fire.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And just because such grace is so essential to life, that even death itself ceases to be at the disposal of free-will, He adds, "If any one abide not in me, he shall be cast forth as a branch, and wither; and they shall gather him, and cast him into the fire, and he is burned." The wood of the vine, therefore, is in the same proportion the more contemptible if it abide not in the vine, as it is glorious while so abiding; in fine, as the Lord likewise says of them in the prophet Ezekiel, when cut off, they are of no use for any purpose of the husbandman, and can be applied to no labor of the mechanic. The branch is suitable only for one of two things, either the vine or the fire: if it is not in the vine, its place will be in the fire; and that it may escape the latter, may it have its place in the vine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252081.html'
source_title="Tractates on John 81"
