[[commentary]]
quote='''
“From them that rise up against Me Thou wilt exalt Me” (ver. 48). From the Jews that rise up against Me in My passion, Thou wilt exalt Me in My resurrection. “From the unjust man Thou wilt deliver Me.” From their unjust rule Thou wilt deliver Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
