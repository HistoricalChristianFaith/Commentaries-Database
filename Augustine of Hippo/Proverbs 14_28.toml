[[commentary]]
quote='''
The Scripture says, “In a wide nation is the king’s honour; but in the domination of the people is the affliction of a prince.” This wrong then thou dost unto Christ, to say that His people is diminished to that small number. Was it for this thou wast born, for this thou callest thyself a Christian, that thou mayest grudge Christ His glory, whose sign thou sayest that thou bearest on thy forehead, and hast lost out of thy heart? In a wide nation is the king’s honour: acknowledge thy King: give Him glory, give Him a wide nation. What wide nation shall I give Him, dost thou say? Choose not to give Him from thy own heart, and thou wilt give aright. Whence am I to give? thou wilt say. Lo, give from hence: “All nations that Thou hast made shall come and worship before Thee, O Lord.” Say this, confess this, and thou hast given a wide nation: for all nations in One are one: this is very oneness. For as there is a Church and Churches, and those are Churches which also are a Church, so that is a nation which was nations: formerly nations, many nations, now one nation. Why one nation? Because one faith, one hope, one charity, one expectation. Lastly, why not one nation, if one country? Our country is heavenly, our country is Jerusalem: whoever is not a citizen of it, belongs not to that nation: but whoever is a citizen of it is in that one nation of God. And this nation, from the east to the west, from the north and the sea, is extended through the four quarters of the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
