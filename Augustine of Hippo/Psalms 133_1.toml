[[commentary]]
quote='''
Perform your duties in the church faithfully and joyfully, as they fall to your lot according to your rank, and fulfill your ministry with uprightness, because of that God under whom we are fellow servants and to whom we understand that we shall render an account of our actions. Therefore, his mercy ought to abound in us, because "judgment without mercy to him that has not done mercy." For this reason pray with us for those who still cause us sadness, that the sickness of their carnal mind, intensified and concentrated by long custom, may be healed. For who does not understand "how good and how pleasant it is for brethren to dwell together in unity" if that pleasure touches a palate from which the mind has spit out all the bitterness of division and that loves the sweetness of charity? The God to whom we pray for them is powerful and merciful enough to use any sort of occasion to draw them even now to salvation. May the Lord preserve you in peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 142"

[[commentary]]
quote='''
This is a short Psalm, but one well known and quoted. “Behold, how good and how pleasant is it, that brethren should dwell together in unity” (ver. 1). So sweet is that sound, that even they who know not the Psalter, sing that verse. …

For these same words of the Psalter, this sweet sound, that honeyed melody, as well of the mind as of the hymn, did even beget the Monasteries. By this sound were stirred up the brethren who longed to dwell together. This verse was their trumpet. It sounded through the whole earth, and they who had been divided, were gathered together. The summons of God, the summons of the Holy Spirit, the summons of the Prophets, were not heard in Judah, yet were heard through the whole world. They were deaf to that sound, amid whom it was sung; they were found with their ears open, of whom it was said, “They shall see him, who were not told of him; they shall understand who heard not.” Yet, most beloved, if we reflect, the very blessing hath sprung from that wall of circumcision. For have all the Jews perished? and whence were the Apostles, the sons of the Prophets, the sons of the exiles? He speaks as to them who know. Whence those five hundred, who saw the Lord after His resurrection, whom the Apostle Paul commemorates? Whence those hundred and twenty, who were together in one place after the resurrection of the Lord, and His ascension into heaven, on whom when gathered into one place the Holy Spirit descended on the day of Pentecost, sent down from heaven, sent, even as He was promised? All were from thence, and they first dwelt together in unity; who sold all they had, and laid the price of their goods at the Apostles’ feet, as is read in the Acts of the Apostles. And distribution was made to each one as he had need, and none called anything his own, but they had all things common. And what is “together in unity”? They had, he says, one mind and one heart God-wards. So they were the first who heard, Behold how good and how pleasant is it, that brethren dwell together. They were the first to hear, but heard it not alone.…

From the words of this Psalm was taken the name of Monks, that no one may reproach you who are Catholics by reason of the name. When you with justice reproach heretics by reason of the Circelliones, that they may be saved by shame, they reproach you on the score of the Monks.…

Moreover, beloved, there are they who are false Monks, and we know men of this kind; but the pious brotherhood is not annulled, because of them who profess to be what they are not. There are false Monks, as there are false men among the Clergy, and among the faithful.…

Since the Psalm says, “Behold, how good and how pleasant is it, that brethren should dwell together in one,” why then should we not call Monks so? for Monos is one. Not one in any manner, for a man in a crowd is one, but though he can be called one along with others, he cannot be Monos, that is, alone, for Monos means “one alone.” They then who thus live together as to make one man, so that they really possess what is written, “one mind and one heart,” many bodies, but not many minds; many bodies, but not many hearts; can rightly be called Monos, that is, one alone.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520133.html'
source_title="Exposition on Psalm 133"
