[[commentary]]
quote='''
“Man, his days are but as grass” (ver. 15). Let man consider what he is; let not man be proud. “His days are but as grass.” Why is the grass proud, that is now flourishing, and in a very short space dried up? Why is the grass proud that flourisheth only for a brief season, until the sun be hot? It is then good for us that His mercy be upon us, and from grass make gold. “For he flourisheth as a flower of the field.” The whole splendour of the human race; honour, powers, riches, pride, threats, is the flower of the grass. That house flourisheth, and that family is great, that family flourisheth; and how many flourish, and how many years do they live! Many years to thee, are but a short season unto God. God doth not count, as thou dost. Compared with the length and long life of ages, all the flower of any house is as the flower of the field. All the beauty of the year hardly lasteth for the year. Whatever there flourisheth, whatever there is warmed with heat, whatever there is beautiful, lasteth not; nay, it cannot exist for one whole year. In how brief a season do flowers pass away, and these are the beauty of the herbs! This which is so very beautiful, this quickly falleth. Inasmuch then as He knoweth as a father our forming, that we are but grass, and can only flourish for a time; He sent unto us His Word, and His Word, which abideth for evermore, He hath made a brother unto the grass which abideth not. Wonder not that thou shalt be a sharer of His Eternity; He became Himself first a sharer of thy grass. Will He who assumed from thee what was lowly, deny unto thee what is exalted in respect of thee?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
