[[commentary]]
quote='''
But to prove that by His Grace He buildeth to Himself this place, not for the sake of the merits preceding of those persons out of whom He buildeth it, see what followeth: “Who leadeth forth men fettered, in strength.” For He looseth the heavy bonds of sins, wherewith they were fettered so that they could not walk in the way of the commandments: but He leadeth them forth “in strength,” which before His Grace they had not. “Likewise men provoking that dwell in the tombs:” that is, every way dead, taken up with dead works. For these men provoke Him to anger by withstanding justice: for those fettered men perchance would walk, and are not able, and are praying of God that they may be able, and are saying to Him, “From my necessities lead me forth.” By whom being heard, they give thanks, saying, “Thou hast broken asunder my bonds.” But these provoking men that dwell in the tombs, are of that kind, which in another passage the Scripture pointeth out, saying, “From a dead man, as from one that is not, confession perisheth.” Whence there is this saying, “When a sinner shall have come into the depth of evil things, he despiseth.” For it is one thing to long for, another thing to fight against righteousness: one thing from evil to desire to be delivered, another thing one’s evil doings to defend rather than to confess: both kinds nevertheless the Grace of Christ leadeth forth in strength. With what strength, but that wherewith against sin even unto blood they are to strive? For out of each kind are made meet persons, whereof to construct His holy place; those being loosened, these being raised to life. For even of the woman, whom Satan had bound for eighteen years, by His command He loosed the bonds; and Lazarus’ death by His voice He overcame. He that hath done these things in bodies, is able to do more marvellous things in characters, and to make men of one mood to dwell in a house: “leading forth men fettered in strength, likewise men provoking that dwell in the tombs.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
