[[commentary]]
quote='''
What follows, therefore, contains both these differences, so that it is explained thus: For if by one man's offense death reigned through one, much more shall those who receive the abundance of grace and of righteousness reign in life through one, Jesus Christ. What he said, then—much more shall they reign—pertains to eternal life; but what he said—they receive the abundance of grace—pertains to the forgiveness of many offenses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
