[[commentary]]
quote='''
He must be quite cognizant, certain and confident of his own innocence who stretches out and extends his hands to God. Hence the apostle says, "I wish then that men pray everywhere, lifting up pure hands." He rightly lifts his hands to God, he pours forth prayers with a good conscience, who can say, "You know, O Lord, how holy, how innocent, how pure from every fraud, injury and plunder are the hands which I lift up to you; how unstained and free from all deceit are the lips with which I pour forth prayers to you so that you may have pity on me." Such a person deserves to be heard quickly and can obtain what he asks even before he has finished his prayer.
'''
source_url=''
source_title="THE CHRISTIAN LIFE 11"

[[commentary]]
quote='''
Let us also lift up our hands to God in prayer: and our hands being lifted up to God shall not be confounded, if they be exercised in good works. For what doth he that lifteth up hands? Whence hath it been commanded that with hands lifted up we should pray to God? For the Apostle saith, “Lifting up pure hands without anger and dissension.” It is in order that when thou liftest up hands to God, there may come into thy mind thy works. For whereas those hands are lifted up that thou mayest obtain that which thou wilt, those same hands thou thinkest in good works to exercise, that they may not blush to be lifted up to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
