[[commentary]]
quote='''
“And the Lord was awakened as one sleeping” (ver. 65). For He seemeth to sleep, when He giveth His people into the hands of those whom He hateth, when there is said to them, “Where is thy God?” “He was awakened, then, like one sleeping, like a mighty man drunken with wine.” No one would dare to say this of God, save His Spirit. For he hath spoken, as it seemeth to ungodly men reviling; as if like a drunken man He sleepeth long, when He succoureth not so speedily as men think.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
