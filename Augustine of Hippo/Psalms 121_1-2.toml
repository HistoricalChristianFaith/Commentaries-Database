[[commentary]]
quote='''
However just people may be, however preeminent in grace, however luminous their wisdom, however great the merits that set them on a pinnacle, they are only mountains. Pay attention to the psalm: "I lifted up my eyes to the mountains, from where my help shall come," because "there was a man sent by God, whose name was John; this man came to bear witness to the light." So you have lifted up your eyes to the mountain John, from where your help may come, because he is bearing witness to the light. Continue with the psalm; do not stop on the mountain: "My help is from the Lord, who made heaven and earth." That is Christ; "all things were made through him." He is the constructor of the world; he is, you see, the Word of the Father; the Father made all things through the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520379.html'
source_title="SERMON 379:7"

[[commentary]]
quote='''
Consider, then, brethren, if perchance John is not one of those mountains concerning whom we sang a little while ago, "I have lifted up mine eyes to the mountains, from whence shall come my help." Therefore, my brethren, if you would understand, lift up your eyes to this mountain, that is, raise yourselves up to the evangelist, rise to his meaning. But, because though these mountains receive peace he cannot be in peace who places his hope in man, do not so raise your eyes to the mountain as to think that your hope should be placed in man; and so say, "I have lifted up mine eyes to the mountains, from whence shall come my help," that you immediately add, "My help is from the Lord, who made heaven and earth." Therefore let us lift our eyes to the mountains, from whence shall come our help; and yet it is not in the mountains themselves that our hope should be placed, for the mountains receive what they may minister to us; therefore, from whence the mountains also receive there should our hope be placed. When we lift our eyes to the Scriptures, since it was through men the Scriptures were ministered, we are lifting our eyes to the mountains, from whence shall come our help; but still, since they were men who wrote the Scriptures, they did not shine of themselves, but "He was the true light, who lighteth every man that cometh into the world." A mountain also was that John the Baptist, who said, "I am not the Christ," lest any one, placing his hope in the mountain, should fall from Him who illuminates the mountain. He also confessed, saying, "Since of His fullness have all we received." So thou oughtest to say, "I have lifted up mine eyes to the mountains, from whence shall come my help," so as not to ascribe to the mountains the help that comes to thee; but continue and say, "My help is from the Lord, who made heaven and earth."

Therefore, brethren, may this be the result of my admonition, that you understand that in raising your hearts to the Scriptures (when the gospel was sounding forth, "In the beginning was the Word, and the Word was with God, and the Word was God," and the rest that was read), you were lifting your eyes to the mountains, For unless the mountains said these things, you would not find out how to think of them at all. Therefore from the mountains came your help, that you even heard of these things; but you cannot yet understand what you have heard. Call for help from the Lord, who made heaven and earth; for the mountains were enabled only so to speak as not of themselves to illuminate, because they themselves are also illuminated by hearing. Thence John, who said these things, received them-he who lay on the Lord's breast, and from the Lord's breast drank in what he might give us to drink. But he gave us words to drink. Thou oughtest then to receive understanding from the source from which he drank who gave thee to drink; so that thou mayest lift up thine eyes to the mountains from whence shall come thine aid, so that from thence thou mayest receive, as it were, the cup, that is, the word, given thee to drink; and yet, since thy help is from the Lord, who made heaven and earth, thou mayest fill thy breast from the source from which he filled his; whence thou saidst, "My help is from the Lord, who made heaven and earth:" let him, then, fill who can. Brethren, this is what I have said: Let each one lift up his heart in the manner that seems. fitting, and receive what is spoken. But perhaps you will say that I am more present to you than God, Far be such a thought from you! He is much more present to you; for I appear to your eyes, He presides over your consciences. Give me then your ears, Him your hearts, that you may fill both. Behold, your eyes, and those your bodily senses, you lift up to us; and yet not to us, for we are not of those mountains, but to the gospel itself, to the evangelist himself: your hearts, however, to the Lord to be filled. Moreover, let each one so lift up as to see what he lifts up, and whither. What do I mean by saying, "what he lifts up, and whither?" Let him see to it what sort of a heart he lifts up, because it is to the Lord he lifts it up, lest, encumbered by a load of fleshly pleasure, it fall ere ever it is raised. But does each one see that he bears a burden of flesh? Let him strive by continence to purify that which he may lift up to God. For "Blessed are the pure in heart, because they shall see God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25201.html'
source_title="Tractates on John 1"

[[commentary]]
quote='''
And therefore saith He in a certain Psalm, “I lifted up mine eyes unto the mountains, from whence cometh my help.” But think not that the mountains themselves will give thee help: for they receive what they may give, give not of their own. And if thou remain in the mountains, thy hope will not be strong: but in Him who enlighteneth the mountains, ought to be thy hope and presumption. Thy help indeed will come to thee through the mountains, because the Scriptures are administered to thee through the mountains, through the great Preachers of the Truth: but fix not thy hope in them. Hear what He saith next following: “I lifted up mine eyes unto the mountains, from whence cometh my help.” What then? Do the mountains give thee help? No; hear what follows, “My help cometh from the Lord, which made Heaven and earth.” Through the mountains cometh help, but not from the mountains. From whom then? “From the Lord, which made Heaven and earth.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"

[[commentary]]
quote='''
But indeed they fix their eyes on those who go before them, and follow and imitate them; but they do so, because they consider from Whom they have received the grace to go before them; and because they trust in Him. Although therefore they make these their models, they place their trust in Him from whom the others have received the grace whereby they are such as they are. “The just shall see it, and fear, and shall trust in the Lord.” Just as in another Psalm, “I lift up mine eyes unto the hills,” we understand by hills, all distinguished and great spiritual persons in the Church; great in solidity, not by swollen inflation. By these it is that all Scripture hath been dispensed unto us; they are the Prophets, they are the Evangelists; they are sound Doctors: to these “I lift up mine eyes, from whence shall come my help.” And lest you should think of mere human help, he goes on to say, “My help cometh from the Lord, which made heaven and earth. The just shall see it, and fear, and shall trust in the Lord.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
Wherefore also, in another place, a Psalm saith what? “I have lifted up mine eyes unto the mountains, whence there shall come help to me.” What then, in the mountains is thy hope, and from thence to thee shall there come help? Hast thou stayed at the mountains? Take heed what thou doest. There is something above the mountains: above the mountains is He at whom the mountains tremble. “I have lifted up,” he saith, “mine eyes unto the mountains, whence there shall come help to me.” But what followeth? “My help,” he saith, “is from the Lord, who hath made Heaven and earth.” Unto the mountains indeed I have lifted up eyes, because through the mountains to me the Scriptures were displayed: but I have my heart in Him that doth enlighten all mountains.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"

[[commentary]]
quote='''
…Let them “lift up their eyes to the hills whence cometh their help” (ver. 1). What meaneth, The hills have been lightened? The Sun of righteousness hath already risen, the Gospel hath been already preached by the Apostles, the Scriptures have been preached, all the mysteries have been laid open, the veil hath been rent, the secret place of the temple hath been revealed: let them now at length lift their eyes up to the hills, whence their help cometh…“Of His fulness have all we received,” he saith. Thy help therefore is from Him, of whose fulness the hills received, not from the hills; towards which, nevertheless, save thou lift thine eyes through the Scriptures, thou wilt not approach, so as to be lighted by Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520121.html'
source_title="Exposition on Psalm 121"

[[commentary]]
quote='''
What is this Jerusalem? He briefly describes it. “The mountains stand around Jerusalem” (ver. 2). Is it anything great, that we are in a city surrounded by mountains? Is this the whole of our happiness, that we shall have a city which mountains surround? Do we not know what mountains are? or what are mountains save swellings of the earth? Different then from these are those mountains that we love, lofty mountains, preachers of truth, whether Angels, or Apostles, or Prophets. They stand around Jerusalem; they surround her, and, as it were, form a wall for her. Of these lovely and delightful mountains Scripture constantly speaketh.…They are the mountains of whom we sing: “I lifted up mine eyes unto the mountains, from whence my help shall come:” because in this life we have help from the holy Scriptures. And through the mountains that receive peace, the little hills received righteousness: for what saith he of the mountains themselves? He said not, they have peace from themselves, or they make peace, or generate peace; but, they receive peace. The Lord is the source, whence they receive peace. So therefore lift up thine eyes to the mountains for the sake of peace, that thy help may come from the Lord, who hath made heaven and earth. Again, the Holy Spirit mentioning these mountains saith this: “Thou dost light them wonderfully from Thy everlasting mountains.” He said not, the mountains light them: but, Thou lightest them from Thy everlasting mountains: through those mountains whom Thou hast willed to be everlasting, preaching the Gospel, Thou lighting them, not the mountains. Such then are the “mountains that stand around Jerusalem.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520125.html'
source_title="Exposition on Psalm 125"
