[[commentary]]
quote='''
For it is thy heart’s desire that is thy prayer; and if thy desire continues uninterrupted, thy prayer continueth also. For not without a meaning did the Apostle say, “Pray without ceasing.” Are we to be “without ceasing” bending the knee, prostrating the body, or lifting up our hands, that he says, “Pray without ceasing”? Or if it is in this sense that we say that we “pray,” this, I believe, we cannot do “without ceasing.” There is another inward kind of prayer without ceasing, which is the desire of the heart. Whatever else you are doing, if you do but long for that Sabbath, you do not cease to pray. If you would never cease to pray, never cease to long after it. The continuance of thy longing is the continuance of thy prayer. You will be ceasing to speak, if you cease to long for it. Who are those who have ceased to speak? They of whom it is said, “Because iniquity shall abound, the love of many shall wax cold.” The freezing of charity is the silence of the heart; the burning of charity is the cry of the heart. If love continues still you are still lifting up your voice; if you are always lifting up your voice, you are always longing after something; if always longing for something absent, you are calling “the Sabbath rest to remembrance.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
