[[commentary]]
quote='''
At present, however, after recording how the Lord rose from supper and washed the disciples' feet, and after telling us also the reason why the Lord dealt thus with them, in expressing which He had intimated, although still obscurely, and by the use of a testimony of Scripture, the fact that He was being betrayed by the man who was to eat of His bread, at this point John comes to the section in question, which the other three evangelists also unite in introducing. He presents it thus: "When Jesus had thus said, He was troubled in spirit, and testified, and said, Verily, verily, I say unto you, That one of you shall betray me. Then the disciples looked (as the same John subjoins) one on another, doubting of whom He spake." "And (as Matthew and Mark tell us) they were exceeding sorrowful, and began every one of them to say unto Him, Is it I? And He answered and said (as Matthew proceeds to state), He that dippeth his hand with me in the dish, the same shall betray me." Matthew also goes on to make the following addition to the preceding: "The Son of man indeed goeth, as it is written of Him; but woe unto that man by whom the Son of man shall be betrayed! it had been good for that man if he had not been born." Mark, too, is at one with him here as regards both the words themselves and the order of narration. Then Matthew continues thus: "Then Judas, which betrayed Him, answered and said, Master, is it I? He said unto him, Thou hast said." Even these words did not say explicitly whether he was himself the man. For the sentence still admits of being understood as if its point was this, "I am not the person who has said so." All this, too, may quite easily have been uttered by Judas and answered by the Lord without its being noticed by all the others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 1"
