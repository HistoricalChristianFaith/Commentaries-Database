[[commentary]]
quote='''
What did Moses see? Moses saw a cloud, he saw an angel, he saw a fire. All that is the creature: it bore the type of its Lord, but did not manifest the presence of the Lord Himself. For thou hast it plainly stated in the law: "And Moses spake with the Lord face to face, as a friend with his friend." Following the same scripture, thou findest Moses saying: "If I have found grace in Thy sight, show me Thyself plainly, that I may see Thee." And it is little that he said this: he received the reply, "Thou canst not see my face." An angel then spake with Moses, my brethren, bearing the type of the Lord; and all those things which were done by the angel promised that future grace and truth. Those who examine the law well know this; and when we have opportunity to speak somewhat of this matter also, we shall not fail to speak to you, beloved brethren, as far as the Lord may reveal to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
