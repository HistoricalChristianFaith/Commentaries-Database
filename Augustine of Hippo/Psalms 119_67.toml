[[commentary]]
quote='''
“Before I was humbled, I went wrong; wherefore I have kept Thy word” (ver. 67); or, as some have it more closely, “Thy utterance,” that is, lest I should be humbled again. This is better referred to that humiliation which took place in Adam, in whom the whole human creature, as it were, being corrupted at the root, as it refused to be subject to truth, “was made subject to vanity.” Which it was profitable to the vessels of mercy to feel, that by throwing down pride, obedience might be loved, and misery perish, never again to return.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
