[[commentary]]
quote='''
“Redeem Israel, O God, out of all his troubles” (ver. 22). “Redeem Thy people, O God,” whom Thou hast prepared to see Thee, out of his troubles, not those only which he bears without, but those also which he bears within.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
