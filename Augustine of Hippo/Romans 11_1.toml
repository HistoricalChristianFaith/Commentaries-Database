[[commentary]]
quote='''
When he says: Has God then rejected his people? God forbid! For I too am an Israelite, of the seed of Abraham, of the tribe of Benjamin, this refers to what he said above: But the word of God cannot fail. For not all who are of Israel are Israelites, nor because they are the seed of Abraham are all sons, but: In Isaac shall your seed be called—so that from the very people of the Jews those may be counted in the seed who believed the Lord. Of this too he says above: A remnant shall be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
