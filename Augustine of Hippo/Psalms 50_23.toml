[[commentary]]
quote='''
“Sacrifice of praise shall glorify Me” (ver. 23). How shall “sacrifice of praise glorify Me”? Assuredly sacrifice of praise doth no wise profit evil men, because they take Thy Covenant in their mouth, and do damnable things that displease Thine eyes. Straightway, he saith, even to them this I say, “Sacrifice of praise shall glorify Me.” For if thou livest ill and speakest good words, not yet dost thou praise: but again, if, when thou beginnest to live well, to thy merits thou dost ascribe thy living well, not yet dost thou praise.…Therefore the Publican went down justified, rather than that Pharisee. Therefore hear ye that live well, hear ye that live ill: “Sacrifice of praise shall glorify Me.” No one offereth Me this sacrifice, and is evil. I say not, Let there not offer Me this any one that is evil; but no one doth offer Me this, that is evil. For he that praiseth, is good: because if he praiseth, he doth also live well, because if he praiseth, not only with tongue he praiseth, but life also with tongue doth agree.

“And there is the way whereby I will show him the salvation of God.” In sacrifice of praise “is the way.” What is “the salvation of God”? Christ Jesus. And how in sacrifice of praise to us is shown Christ? Because Christ with grace came to us. These words saith the Apostle: “But I live, now not I, but Christ liveth in me: but that in flesh I live, in faith I live of the Son of God, who loved me, and gave Himself for me.” Acknowledge then sinners, that there would not need physician, if they were whole. For Christ died for the ungodly. When then they acknowledge their ungodlinesses, and first copy that Publican, saying, “Lord, be merciful to me a sinner:” show wounds, beseech Physician: and because they praise not themselves, but blame themselves,—“So that he that glorieth, not in himself but in the Lord may glory,”—they acknowledge the cause of the coming of Christ, because for this end He came, that He might save sinners: for “Jesus Christ came,” he saith, “into this world to save sinners; of whom I am chief.” Further, those Jews, boasting of their work, thus the same Apostle doth rebuke, in saying, that they to grace belonged not, who to their merits and their works thought that reward was owing. He therefore that knoweth himself to belong to grace, doth know what is Christ and what is Christ’s because he needeth grace. If grace it is called, gratis it is given; if gratis it is given, not any merits of thine have preceded that it should be given.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
