[[commentary]]
quote='''
“He hath not dealt with us according to our sins” (ver. 10). Thanks unto God, because He hath vouchsafed this. We have not received what we were deserving of: “He hath not dealt with us according to our sins, nor rewarded us according to our wickednesses.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
