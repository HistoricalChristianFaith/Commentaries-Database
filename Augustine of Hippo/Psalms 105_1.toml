[[commentary]]
quote='''
This Psalm is the first of those to which is prefixed the word Allelujah; the meaning of which word, or rather two words, is, Praise the Lord. For this reason he beginneth with praises: “O confess unto the Lord, and call upon His Name” (ver. 1); for this confession is to be understood as praise, just as these words of our Lord, “I confess to Thee, O Father, Lord of heaven and earth.” For after commencing with praise, calling upon God is wont to follow, whereunto he that prayeth doth next add his longings: whence the Lord’s Prayer itself hath at the commencement a very brief praise, in these words, “Our Father which art in Heaven.” The things prayed for, then follow.…This also followeth, “Tell the people what things He hath done;” or rather, to translate literally from the Greek, as other Latin copies too have it, “Preach the Gospel of His works among the Gentiles.” Unto whom is this addressed, save unto the Evangelists in prophecy?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
