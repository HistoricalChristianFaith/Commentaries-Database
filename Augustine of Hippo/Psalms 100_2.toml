[[commentary]]
quote='''
“Serve the Lord with gladness.” All servitude is full of bitterness: all who are bound to a lot of servitude both are slaves, and discontented. Fear not the servitude of that Lord: there will be no groaning there, no discontent, no indignation; no one seeketh to be sold to another master, since it is a sweet service, because we are all redeemed. Great happiness, brethren, it is, to be a slave in that great house, although in bonds. Fear not, bound slave, confess unto the Lord: ascribe thy bonds to thine own deservings; confess in thy chains, if thou art desirous they be changed into ornaments.…At the same time thou art slave, and free; slave, because thou art created such; free, because thou art loved by God, by whom thou wast created: yea, free indeed, because thou lovest Him by whom thou wast made. Serve not with discontent; for thy murmurs do not tend to release thee from serving, but to make thee a wicked servant. Thou art a slave of the Lord, thou art a freedman of the Lord: seek not so to be emancipated as to depart from the house of Him who frees thee.…

I will, therefore, saith he, live separate with a few good men: why should I live in common with crowds? Well: those very few good men, from what crowds have they been strained out? If however these few are all good: it is, nevertheless, a good and praiseworthy design in man, to be with such as have chosen a quiet life; distant from the bustle of the people, from noisy crowds, from the great waves of life, they are as if in harbour. Is there therefore here that joy? that jubilant gladness which is promised? Not as yet; but still groans, still the anxiety of temptations. For even the harbour hath an entrance somewhere or other; if it had not, no ship could enter it; it must therefore be open on some side: but at times on this open side the wind rusheth in; and where there are no rocks, ships dashed together shatter one another. Where then is security, if not even in harbour? And yet it must be confessed, it is true, that persons in harbour are in their degree much better off than when afloat on the main. Let them love one another, as ships in harbour, let them be bound together happily; let them not dash against one another: let absolute equality be preserved there, constancy in love; and when perchance the wind rusheth in from the open side, let there be careful piloting there. Now what will one who perchance presideth over such places, nay, who serveth his brethren, in what are called monasteries, tell me? I will be cautious: I will admit no wicked man. How wilt thou admit no evil one?…Those who are about to enter, do not know themselves; how much less dost thou know them? For many have promised themselves that they were about to fulfil that holy life, which has all things in common, where no man calleth anything his own, who have one soul and one heart in God: they have been put into the furnace, and have cracked. How then knowest thou him who is unknown even to himself?…Where then is security? Here nowhere; in this life nowhere, except solely in the hope of the promise of God. But there, when we shall reach thereunto, is complete security, when the gates are shut, and the bars of the gates of Jerusalem made fast; there is truly full jubilance, and great delight. Only do not thou feel secure in praising any sort of life: “judge no man blessed before his death.”

By this means men are deceived, so that they either do not undertake, or rashly attempt, a better life; because, when they choose to praise, they praise without mention of the evil that is mixed with the good: and those who choose to blame, do so with so envious and perverse a mind, as to shut their eyes to the good, and exaggerate only the evils which either actually exist there, or are imagined. Thus it happeneth, that when any profession hath been ill, that is, incautiously, praised, if it hath invited men by its own reputation, they who betake themselves thither discover some such as they did not believe to be there; and offended by the wicked recoil from the good. Brethren, apply this teaching to your life, and hear in such a manner that ye may live. The Church of God, to speak generally, is magnified: Christians, and Christians alone, are called great, the Catholic (Church) is magnified; all love each other; each and all do all they can for one another; they give themselves up to prayers, fastings, hymns; throughout the whole world, with peaceful unanimity God is praised. Some one perhaps heareth this, who is ignorant that nothing is said of the wicked who are mingled with them; he cometh, invited by these praises, findeth bad men mixed with them, who were not mentioned to him before he came; he is offended by false Christians, he flieth from true Christians. Again, men who hate and slander them, precipitately blame them: asking, what sort of men are Christians? Who are Christians? Covetous men, usurers. Are not the very persons who fill the Churches on holidays the same who during the games and other spectacles fill the theatres and amphitheatres? They are drunken, gluttonous, envious, slanderers of each other. There are such, but not such only. And this slanderer in his blindness saith nothing of the good: and that praiser in his want of caution is silent about the bad.…Thus also in that common life of brethren, which exists in a monastery: great and holy men live therein, with daily hymns, prayers, praises of God; their occupation is reading; they labour with their own hands, and by this means support themselves; they seek nothing covetously; whatever is brought in for them by pious brethren, they use with contentedness and charity; no one claimeth as his own what another hath not; all love, all forbear one another mutually. Thou hast praised them; thou hast praised; he who knoweth not what is going on within, who knoweth not how, when the wind entereth, ships even in harbour dash against one another, entereth as if in hope of security, expecting to find no man to forbear; he findeth there evil brethren, who could not have been found evil, if they had not been admitted (and they must be at first tolerated, lest they should perchance reform; nor can they easily be excluded, unless they have first been endured): and becometh himself impatient beyond endurance. Who asked me here? I thought that love was here. And irritated by the perversity of some few men, since he hath not persevered in fulfilling his vow, he becometh a deserter of so holy a design, and guilty of a vow he hath never discharged. And then, when he hath gone forth himself too, he also becometh a reproacher, and a slanderer; and records those things only (sometimes real), which he asserts that he could not have endured. But the real troubles of the wicked ought to be endured for the society of the good. The Scripture saith unto him: “Woe unto those that have lost patience.” And what is more, he belcheth abroad the evil savour of his indignation, as a means to deter them who are about to enter; because, when he had entered himself, he could not persevere. Of what sort are they? Envious, quarrelsome, men who forbear no man, covetous; saying, He did this there, and he did that there. Wicked one, why art thou silent about the good! Thou sayest enough of those whom thou couldest not endure: thou sayest nothing of those who endured thy wickedness.…

“O serve the Lord with gladness” (ver. 2): he addresseth you, whoever ye are who endure all things in love, and rejoice in hope. “Serve the Lord,” not in the bitterness of murmuring, but in the “gladness of love.” “Come before His presence with rejoicing.” It is easy to rejoice outwardly: rejoice before the presence of God. Let not the tongue be too joyful: let the conscience be joyful. “Come before His presence with a song.”
'''
