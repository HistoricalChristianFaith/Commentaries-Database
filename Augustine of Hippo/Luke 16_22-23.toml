[[commentary]]
quote='''
Was it really for the merit of his poverty that the poor man was carried away by Angels, or was it for the sin of his riches that the rich man was sent away to be tormented? In that poor man is signified the honour which is paid to humility, in that rich man the condemnation which awaits pride. I will prove shortly that it was not riches but pride which was tormented in that rich man. It is certain that the poor man was carried into the bosom of Abraham: of Abraham himself Scripture saith that he had here very much gold and silver, and was rich on the earth. If every one that is rich is hurried away to be tormented, how could Abraham have gone before that poor man, so as to be ready to receive him when carried to his bosom? But Abraham in his riches was poor, humble, reverencing all commands, and obeying them. So true was it that he counted all those riches for nothing, that on God’s command he was ready to sacrifice his son, for whom he was keeping his riches. Learn therefore ye to be poor and needy, whether ye have anything in this world, or whether ye have not.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252086.html'
source_title="Exposition on Psalm 86"
