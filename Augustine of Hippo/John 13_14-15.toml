[[commentary]]
quote='''
(Tr. lviii. 4) This is, blessed Peter, what thou wast ignorant of; this thou wert told that thou shouldest know afterwards.

(Tr. lviii. 4) This act is done literally by many, when they receive one another in hospitality. For it is unquestionably better that it should be done with the hands, and that the Christian disdain not to do what Christ did. For when the body is bent at the feet of a brother, the feeling of humility is made to rise in the heart, or, if it be there already, is confirmed. But besides this moral meaning, is not a brother able to change a brother from the pollution of sin? Let us confess our faults one to another, forgive one another's faults, pray for one another's faults. In this way we shall wash one another's feet.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"If I, then," He says, "your Lord and Master, have washed your feet, ye also ought to wash one another's feet. For I have given you an example, that ye should do as I have done to you." This, blessed Peter, is what thou didst not know when thou wert not allowing it to be done. This is what He promised to let thee know afterwards, when thy Master and thy Lord terrified thee into submission, and washed thy feet. We have learned, brethren, humility from the Highest; let us, as humble, do to one another what He, the Highest, did in His humility. Great is the commendation we have here of humility: and brethren do this to one another in turn, even in the visible act itself, when they treat one another with hospitality; for the practice of such humility is generally prevalent, and finds expression in the very deed that makes it discernible. And hence the apostle, when he would commend the well-deserving widow, says, "If she is hospitable, if she has washed the saints' feet." And wherever Such is not the practice among the saints, what they do not with the hand they do in heart, if they are of the number of those who are addressed in the hymn of the three blessed men, "O ye holy and humble of heart, bless ye the Lord." But it is far better, and beyond all dispute more accordant with the truth, that it should also be done with the hands; nor should the Christian think it beneath him to do what was done by Christ. For when the body is bent at a brother's feet, the feeling of such humility is either awakened in the heart itself, or is strengthened if already present.

But apart from this moral understanding of the passage, we remember that the way in which we commended to your attention the grandeur of this act of the Lord's, was that, in washing the feet of disciples who were already washed and clean, the Lord instituted a sign, to the end that, on account of the human feelings that occupy us on earth, however far we may have advanced in our apprehension of righteousness, we might know that we are not exempt from sin; which He thereafter washes away by interceding for us, when we pray the Father, who is in heaven, to forgive us our debts, as we also forgive our debtors. What connection, then, can such an understanding of the passage have with that which He afterwards gave Himself, when He explained the reason of His act in the words, "If I then, your Lord and Master, have washed your feet, ye also ought to wash one another's feet. For I have given you an example, that ye should do as I have done to you"? Can we say that even a brother may cleanse a brother from the contracted stain of wrongdoing? Yea, verily, we know that of this also we were admonished in the profound significance of this work of the Lord's, that we should confess our faults one to another, and pray for one another, even as Christ also maketh intercession for us. Let us listen to the Apostle James, who states this precept with the greatest clearness when he says, "Confess your faults one to another, and pray one for another." For of this also the Lord gave us the example. For if He who neither has, nor had, nor will have any sin, prays for our sins, how much more ought we to pray for one another's in turn! And if He forgives us, whom we have nothing to forgive; how much more ought we, who are unable to live here without sin, to forgive one another! For what else does the Lord apparently intimate in the profound significance of this sacramental sign, when He says, "For I have given you an example, that ye should do as I have done to you;" but what the apostle declares in the plainest terms, "Forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye"? Let us therefore forgive one another his faults, and pray for one another's faults, and thus in a manner be washing one another's feet. It is our part, by His grace, to be supplying the service of love and humility: it is His to hear us, and to cleanse us from all the pollution of our sins through Christ, and in Christ; so that what we forgive even to others, that is, loose on earth, may be loosed in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252058.html'
source_title="Tractates on John 58"
