[[commentary]]
quote='''
Listen to the Apostle Paul acknowledging grace, and afterwards desiring the payment of a debt. What acknowledgment of grace is there in Paul? "Who was before a blasphemer, and a persecutor, and injurious; but I obtained," saith he, "mercy." He said that he who obtained it was unworthy; that he had, however, obtained it, not through his own merits, but through the mercy of God. Listen to him now demanding the payment of a debt, who had first received unmerited grace: "For," saith he, "I am now ready to be offered up, and the time of my departure is at hand. I have fought a good fight, I have finished my course, I have kept the faith: henceforth there is laid up for me a crown of righteousness." Now he demands a debt, he exacts what is due. For consider the following words: "Which the Lord, the righteous Judge, shall render unto me in that day." That he might in the former instance receive grace, he stood in need of a merciful Father; for the reward of grace, of a just judge, Will He who did not condemn the ungodly man condemn the faithful man? And yet, if thou dost rightly consider, it was He who first gave thee faith, whereby thou didst obtain favor; for not of thine own didst thou so obtain favor that anything should be due to thee. Wherefore, then, in afterwards bestowing the reward of immortality, He crowns His own gifts, not thy merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
