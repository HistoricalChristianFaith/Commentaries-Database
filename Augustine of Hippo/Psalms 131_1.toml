[[commentary]]
quote='''
In this Psalm, the humility of one that is a servant of God and faithful is commended unto us, by whose voice it is sung; which is the whole body of Christ. For we have often warned you, beloved, that it ought not to be received as the voice of one man singing, but of all who are in Christ’s Body. And since all are in His Body, as it were one man speaketh: and he is one who also is many.…Now he prayeth in the temple of God, who prayeth in the peace of the Church, in the unity of Christ’s Body; which Body of Christ consisteth of many who believe in the whole world: and therefore he who prayeth in the temple, is heard. For he prayeth in the spirit and in truth, who prayeth in the peace of the Church; not in that temple, wherein was the figure.…

“Lord, my heart is not lifted up” (ver. 1). He hath offered a sacrifice. Whence do we prove that he hath offered a sacrifice? Because humility of heart is a sacrifice.…If there is no sacrifice, there is no Priest. But if we have a High Priest in Heaven, who intercedeth with the Father for us (for He hath entered into the Holy of Holies, within the veil),…we are safe, for we have a Priest; let us offer our sacrifice there. Let us consider what sacrifice we ought to offer; for God is not pleased with burnt-offerings, as ye have heard in the Psalm. But in that place he next showeth what he offereth: “The sacrifice of God is a troubled spirit: a broken and a contrite heart, O God, shalt Thou not despise.

“Lord, my heart was not lifted up, neither were mine eyes raised on high” (ver. 1); “I have not exercised myself in great matters, nor in wonderful things which are too high for me” (ver. 2). Let this be more plainly spoken and heard. I have not been proud: I have not wished to be known among men as for wondrous powers; nor have I sought anything beyond my strength, whereby I might boast myself among the ignorant. As that Simon the sorcerer wished to advance into wonders above himself, on that account the power of the Apostles more pleased him, than the righteousness of Christians.…What is above my strength, he saith, I have not sought; I have not stretched myself out there, I have not chosen to be magnified there. How deeply this self-exaltation in the abundance of graces is to be feared, that no man may pride himself in the gift of God, but may rather preserve humility, and may do what is written: “The greater thou art, the more humble thyself, and thou shalt find favour before the Lord:” how deeply pride in God’s gift should be feared, we must again and again impress upon you.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520131.html'
source_title="Exposition on Psalm 131"
