[[commentary]]
quote='''
What then ought the servant of God to do, who is kindled with these “coals,” and himself made a coal of salvation, what should he do? He should wish rather to hear than to speak; as it is written, “Let every man be swift to hear, slow to speak.” And if it may be so, let him desire this, not to be obliged to speak and talk and teach.…I can quickly tell you wherein each one may prove himself, not by never speaking, but by requiring a case where it is his duty to speak; let him be glad to be silent, in will, let him speak to teach, when he must. For when must thou needs speak and teach? When thou meetest with one ignorant, when thou meetest with one unlearned. If it delight thee always to teach, thou wishest always to have some ignorant one to teach.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
