[[commentary]]
quote='''
Paul is referring to the Trinity when he says this.
'''
source_url='https://www.newadvent.org/fathers/1304.htm'
source_title="On Faith and the Creed 16"

[[commentary]]
quote='''
For the Catholic faith preaches not two or three Gods, but the Very Trinity, One God. Not that the same Trinity can be together, now the Father, now the Son, now the Holy Ghost, as Sabellius believed: but that the Father must be none but the Father, and the Son none but the Son, and the Holy Ghost none but the Holy Ghost, and this Trinity but One God. Hence when the Apostle had said, “Of whom are all things, by whom are all things, in whom are all things,” he is believed to have conveyed an intimation of the Very Trinity; and yet he did not add, to Them be glory; but, “to Him be glory.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
