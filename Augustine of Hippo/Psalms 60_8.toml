[[commentary]]
quote='''
“Moab the pot of my hope.” Wherefore “pot”? Because tribulation. Wherefore “of my hope”? Because there hath gone before Juda my king.…Moab is perceived in the Gentiles. For that nation was born of sin, that nation was born of the daughters of Lot, who lay with their father drunken, abusing a father. Better were it to have remained barren, than thus to have become mothers. But this was a kind of figure of them that abuse the law. For do not heed that law in the Latin language is of the feminine gender: in Greek of the masculine gender it is: but whether it be of the feminine gender in speaking, or of the masculine, the expression maketh no difference to the truth. For law hath rather a masculine force, because it ruleth, is not ruled. But moreover, the Apostle Paul saith what? “Good is the law, if any one use it lawfully.” But those daughters of Lot unlawfully used their father. But in the same manner as good works begin to grow when a man useth well the law: so arise evil works, when a man ill useth the law. Furthermore, they ill using their father, that is, ill using the law, engendered the Moabites, by whom are signified evil works. Thence the tribulation of the Church, thence the pot boiling up. Of this pot in a certain place of prophecy is said, “A pot heated by the North wind.” Whence but by the quarters of the devil, who hath said, “I will set my seat at the North”? The chiefest tribulations therefore arise against the Church from none except from those that ill use the law.…

“Into Idumæa I will stretch out my shoe” (ver. 8). The Church speaketh, “I will come through even unto Idumæa.” Let tribulations rage, let the world boil with offences, even unto those very persons that lead an earthly life (for Idumæa is interpreted earthly), even unto those same, “even unto Idumæa, I will stretch out my shoe.” Of what thing the shoe except of the Gospel? “How beautiful the feet of them that tell of peace, that tell of good things,” and “the feet shod unto the preparation of the Gospel of peace.”…In these times we see, brethren, how many earthly men do perpetrate frauds for the sake of gain, for frauds perjuries; on account of their fears they consult fortune-tellers, astrologers: all these men are Edomites, earthly; and nevertheless all these men adore Christ, under His own shoe they are; now even unto Idumæa is stretched out His shoe. “To Me Allophyli have been made subject.” Who are “Allophyli”? Men of other race, not belonging to My race. They “have been made subject,” because many men adore Christ, and are not to reign with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252060.html'
source_title="Exposition on Psalm 60"
