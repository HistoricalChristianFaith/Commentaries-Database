[[commentary]]
quote='''
“For He knoweth our forming” (ver. 14): that is, our infirmity. He knoweth what He hath created, how it hath fallen, how it may be repaired, how it may be adopted, how it may be enriched. Behold, we are made of clay: “The first man is of the earth, earthy: the second man is the Lord from heaven.” He sent even His own Son, Him who was made the second man, Him who was God before all things. For He was second in His coming, first in His returning: He died after many, He arose before all. “He knoweth our forming.” What forming? Ourselves. Why sayest thou that He knoweth? Because He hath pitied. “Remember that we are but dust.” Addressing God Himself, he saith, “Remember,” as if God could forget: He perceiveth, He knoweth in such a manner that He cannot forget. But what meaneth, “Remember”? Let thy mercy continue towards us. Thou knowest our forming; forget not our forming, lest we forget thy grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
