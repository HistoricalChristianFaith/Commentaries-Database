[[commentary]]
quote='''
(Tr. lii. 6) The judgment at the end of the world will be of eternal rewards and punishments. But there is another judgment, not of condemnation, but of selection, which is the one meant here; the selection of His own redeemed, and their deliverance from the power of the devil: Now shall the prince of this world be cast out. The devil is not called the prince of this world, in the sense of being lord over heaven and earth; God forbid. The world here stands for the wicked dispersed over all the world. In this sense the devil is the prince of the world, i. e. of all the wicked men who live in the world. The world also sometimes stands for the good dispersed throughout the world: God was in Christ reconciling the world unto Himself. (2 Cor. 5:19) These are they from whose hearts the prince of this world shall be cast out. Our Lord foresaw that after His passion and glorifying, great nations all over the world would be converted, in whom the devil was then, but from whose hearts, on their truly renouncing him, he would be cast out. But was he not cast out of the hearts of righteous men of old? Why is it, Now shall be cast out? Because that which once took place in a very few persons, was now to take place in whole nations. What then, does the devil not tempt at all the minds of believers? Yea, he never ceases to tempt them. But it is one thing to reign within, another to lay siege from without.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Look at what follows: "Now," He says, "is the judgment of the world." What, then, are we to expect at the end of time? But the judgment that is looked for in the end will be the judging of the living and the dead, the awarding of eternal rewards and punishment. Of what sort, then, is the judgment now? I have already, in former lessons, as far as I could, put you in mind, beloved, that there is a judgment spoken of, not of condemnation, but of discrimination; as it is written, "Judge me, O God, and plead [discern, discriminate] my cause against an unholy nation." And many are the judgments of God; as it is said in the psalm. "Thy judgments are a great deep."

And the apostle also says, "O the depth of the riches of the wisdom and the knowledge of God! how unsearchable are His judgments!" To such judgments does that spoken of here by the Lord also belong, "Now is the judgment of this world;" while that judgment in the end is reserved, when the living and the dead shall at last be judged. The devil, therefore, had possession of the human race, and held them by the written bond of their sins as criminals amenable to punishment; he ruled in the hearts of unbelievers, and, deceiving and enslaving them, seduced them to forsake the Creator and give worship to the creature; but by faith in Christ, which was confirmed by His death and resurrection, and, by His blood, which was shed for the remission of sins, thousands of believers are delivered from the dominion of the devil, are united to the body of Christ, and under this great head are made by His one Spirit to spring up into new life as His faithful members. This it was that He called the judgment, this righteous separation, this expulsion of the devil from His own redeemed.

Attend, in short, to His own words. For just as if we had been inquiring what He meant by saying, "Now is the judgment of the world," He proceeded to explain it when He says, "Now shall the prince of this world be cast out." What we have thus heard was the kind of judgment He meant. Not that one, therefore, which is yet to come in the end, when the living and dead shall be judged, some of them set apart on His right hand, and the others on His left; but that judgment by which "the prince of this world shall be cast out." In what sense, then, was he within, and whither did He. mean that he was to be cast out? Was it this: That he was in the world. and was cast forth beyond its boundaries? For had He been speaking of that judgment which is yet to come in the end, some one's thoughts might have turned to that eternal fire into which the devil is to be cast with his angels, and all who belong to him;-that is, not naturally, but through moral delinquency; not because he created or begat them, but because he persuaded and kept hold of them: some one, therefore, might have thought that that eternal fire was outside the world, and that this was the meaning of the words, "he shall be cast out." But as He says, "Now is the judgment of this world," and in explanation of His meaning, adds, "Now shall the prince of this world be cast out," we are thereby to understand what is now being done, and not what is to be, so long afterwards, at the last day. The Lord, therefore, foretold what He knew, that after His own passion and glorification, many nations throughout the whole world, in whose hearts the devil was an inmate, would become believers, and the devil, when thus renounced by faith, is cast out.

But some one says, Was he then not cast out of the hearts of the patriarchs and prophets, and the righteous of olden time? Certainly he was. How, then, is it said, "Now he shall be cast out"? How else can we think of it, but that what was then done in the case of a very few individuals, was now foretold as speedily to take place in many and mighty nations? Just as also that other saying, "For the Spirit was not yet given, because that Jesus was not yet glorified," may suggest a similar inquiry, and find a similar solution. For it was not without the Holy Spirit that the prophets predicted the events of the future; nor was it so that the aged Simeon and the widowed Anna knew by the Holy Spirit the infant Lord; and that Zacharias and Elisabeth uttered by the Holy Spirit so many predictions concerning Him, when He was not yet born, but only conceived. But "the Spirit was not yet given;" that is, with that abundance of spiritual grace which enabled those assembled together to speak in every language, and thus announce beforehand in the language of every nation the Church of the future: and so by 'this spiritual grace it was that nations were gathered into congregations, sins were pardoned far and wide, and thousands of thousands were reconciled unto God.

But then, says some one, since the devil is thus cast out of the hearts of believers, does he now tempt none of the faithful? Nay, verily, he does not cease to tempt. But it is one thing to reign within, another to assail from without; for in like manner the best fortified city is sometimes attacked by an enemy without being taken. And if some of his arrows are discharged, and reach us, the apostle reminds us how to render them harmless, when he speaks of the breastplate and the shield of faith. And if he sometimes wounds us, we have the remedy at hand. For as the combatants are told, "These things I write unto you, that ye sin not:" so those who are wounded have the sequel to listen to, "And if any man sin, we have an Advocate with the Father, Jesus Christ, the righteous; and He is the propitiation for our sins." And what do we pray for when we say, "Forgive us our debts," but for the healing of our wounds? And what else do we ask, when we say, "Lead us not into temptation," but that he who thus lies in wait for us, or assails us from without, may fail on every side to effect an entrance, and be unable to overcome us either by fraud or force? Nevertheless, whatever engines of war he may erect against us, so long as he has no more a place in the heart that faith inhabits, he is cast out. But "except the Lord keep the city, the watchman waketh but in vain." Presume not, therefore, about yourselves, if you would not have the devil, who has once been cast out, to be recalled within.

On the other hand, let us be far from supposing that the devil is called in any such way the prince of the world, as that we should believe him possessed of power to rule over the heaven and the earth. The world is so spoken of in respect of wicked men, who have overspread the whole earth; just as a house is spoken of in respect to its inhabitants, and we accordingly say, It is a good house, or a bad house; not as finding fault with, or approving of, the erection of walls and roofs, but the morals either of the good or the bad within it. In a similar way, therefore, it is said, "The prince of this world;" that is, the prince of all the wicked who inhabit this world. The world is also spoken of in respect to the good, who in like manner have overspread the whole earth; and hence the apostle says, "God was in Christ, reconciling the world unto Himself." These are they out of whose hearts the prince of this world is ejected.
'''
