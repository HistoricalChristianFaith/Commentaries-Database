[[commentary]]
quote='''
(Tr. xlix. c. 9) It was really true that He was sleeping. To our Lord, he was sleeping; to men who could not raise him again, he was dead. Our Lord awoke him with as much ease from his grave, as thou awakest a sleeper from his bed. He calls him then asleep, with reference to His own power, as the Apostle saith, But I would not have you to be ignorant, concerning them which are asleep. (1 Thess. 4:13) Asleep, He says, because He is speaking of their resurrection which was to be. But as it matters to those who sleep and wake again daily, what they see in their sleep, some having pleasant dreams, others painful ones, so it is in death; every one sleeps and rises again with his own account.a
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And after that He saith unto them, Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep." It was true what He said. To his sisters he was dead, to the Lord he was asleep. He was dead to men, who could not raise him again; but the Lord aroused him with as great ease from the tomb as one arouseth a sleeper from his bed. Hence it was in reference to His own power that He spoke of him as sleeping: for others also, who are dead, are frequently spoken of in Scripture as sleeping; as when the apostle says, "But I would not have you to be ignorant, brethren, concerning those who are asleep, that ye sorrow not, even as others who have no hope." Therefore he also spoke of them as sleeping, because foretelling their resurrection. And so, all the dead are sleeping, both good and bad. But just as, in the case of those who sleep and waken day by day, there is a great difference as to what they severally see in their sleep: some experience pleasant dreams; others. dreams so frightful that the waking are afraid to fall asleep for fear of their recurrence: so every individual sleeps and wakens in circumstances peculiar to himself. And there is a difference as to the kind of custody one may be placed in, who is afterwards to be taken before the judge. For the kind of custody in which men are placed depends on the merits of the case: some are required to be guarded by lictors, an office humane and mild, and becoming a citizen; others are given up to subordinates; some, again, are sent to prison: and in the prison itself all are not thrust together into its lowest dungeons, but dealt with in proportion to the merits and superior gravity of the charges. As, then, there are different kinds of custody among those engaged in official life, so there are different kinds of custody for the dead, and differing merits in those who rise again. The beggar was taken into custody, so was the rich man: but the one into Abraham's bosom; the other, where he thirsted, and found not a drop of water.

Therefore, to make this the occasion of instructing your Charity, all souls have, when they quit this world, their different receptions. The good have joy; the evil, torments. But when the resurrection takes. place, both the joy of the good will be fuller and the torments of the wicked heavier, when they shall be tormented in the body. The holy patriarchs, prophets, apostles, martyrs, and good believers, have been received into peace; but all of them have still in the end to receive the fulfillment of the divine promises; for they have been promised also the resurrection of the flesh, the destruction of death, and eternal life with the angels. This we have all to receive together; for the rest, which is given immediately after death, every one, if worthy of it, receives when he dies. The patriarchs first received it-think only from what they rest; the prophets afterwards; more recently the apostles; still more lately the holy martyrs, and day by day the good and faithful. Thus some have now been in that rest for long, some not so long; others for fewer years, and others whose entrance therein is still less than recent. But when they shall wake from this sleep, they shall all together receive the fulfillment of the promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
