[[commentary]]
quote='''
Be therefore prudent, copy the ant, as saith the Scripture: “Store in summer, lest thou hunger in winter;” the winter is the last day, the day of tribulation; the winter is the day of offences and of bitterness: gather what may be there for thee for the future: but if thou doest not so, thou wilt perish both imprudent and unwise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"

[[commentary]]
quote='''
He hath not imitated the ant, he hath not gathered to himself grains, while it was summer. What have I meant by, while it was summer? While he had quietude of life, while he had this world’s prosperity, when he had leisure, when happy he was being called by all men, his summer it was. He should have imitated the ant, he should have heard the Word of God, he should have gathered together grains, and he should have stored them within. There had come the trial of tribulation, there had come upon him a winter of numbness, tempest of fear, the cold of sorrow, whether it were loss, or any danger to his safety, or any bereavement of his family; or any dishonour and humiliation; it was winter; the ant falleth back upon that which in summer she hath gathered together; and within in her secret store, where no man seeth, she is recruited by her summer toils. When for herself she was gathering together these stores in summer, all men saw her: when on these she feedeth in winter, no one seeth. What is this? See the ant of God, he riseth day by day, he hasteneth to the Church of God, he prayeth, he heareth lection, he chanteth hymn, he digesteth that which he hath heard, with himself he thinketh thereon, he storeth within grains gathered from the threshing-floor. They that providently hear those very things which even now are being spoken of, do thus, and by all men are seen to go forth to the Church, go back from Church, to hear sermon, to hear lection, to choose a book, open and read it: all these things are seen, when they are done. That ant is treading his path, carrying and storing up in the sight of men seeing him. There cometh winter sometime, for to whom cometh it not? There chanceth loss, there chanceth bereavement: other men pity him perchance as being miserable, who know not what the ant hath within to eat, and they say, miserable he whom this hath befallen, or what spirits, dost thou think, hath he whom this hath befallen? how afflicted is he? He measureth by himself, hath compassion according to his own strength; and thus he is deceived: because the measure wherewith he measureth himself, he would apply to him whom he knoweth not.…O sluggard, gather in summer while thou art able; winter will not suffer thee to gather, but to eat that which thou shalt have gathered. For how many men so suffer tribulation, that there is no opportunity either to read anything, or to hear anything, and they obtain no admittance, perchance, to those that would comfort them. The ant hath remained in her nest, let her see if she hath gathered anything in summer, whereby she may recruit herself in winter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
