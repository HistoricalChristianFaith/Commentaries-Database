[[commentary]]
quote='''
Matthew continues his narrative in the following terms: "Then were there two robbers crucified with Him, one on the right hand, and another on the left." Mark and Luke give it also in a similar form. Neither does John raise any question of difficulty, although he has made no mention of those robbers. For he says, "And two other with Him, on either side one, and Jesus in the midst." But there would have been a contradiction if John had spoken of these others as innocent, while the former evangelists called them robbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 14"
