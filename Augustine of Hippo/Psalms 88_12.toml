[[commentary]]
quote='''
“Shall thy wondrous works be known in the dark, and thy righteousness in the land where all things are forgotten?” (ver. 12), the dark answers to the land of forgetfulness: for the unbelieving are meant by the dark, as the Apostle saith, “For ye were sometimes darkness;” and the land where all things are forgotten, is the man who has forgotten God; for the unbelieving soul can arrive at darkness so intense, “that the fool saith in his heart, There is no God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252088.html'
source_title="Exposition on Psalm 88"
