[[commentary]]
quote='''
Lastly, when both these things have been briefly touched, afterwards he is evidently following out the order of the narrative. “Because they believed not in God, nor hoped in His saving health” (ver. 22). For when he had told why fire was lighted in Jacob, and anger went up upon Israel, that is to say, “because they believed not in God, nor hoped in His saving health:” immediately subjoining the evident blessings for which they were ungrateful, he saith, “and He commanded the clouds above, and opened the doors of Heaven” (ver. 23). “And He rained upon them manna to eat, and gave them bread of Heaven” (ver. 24). “Bread of angels man did eat: dainties He sent them in abundance” (ver. 25). He brought over the South Wind from Heaven, and in His virtue He led in the South West Wind” (ver. 26). “And He rained upon them fleshes like dust, and winged fowls like the sand of the sea” (ver. 27). “And they fell in the midst of their camp, around their tabernacles” (ver. 28). “And they ate and were filled exceedingly; and their desire He brought to them: they were not deprived of their desire” (ver. 29). Behold why He had delayed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
