[[commentary]]
quote='''
“Thus in a holy thing I have appeared to Thee, that I might see Thy power and Thy glory” (ver. 3).…Unless a man first thirst in that desert, that is in the evil wherein he is, he never arriveth at the good, which is God. But “I have appeared to Thee,” he saith, “in a holy thing.” Now in a holy thing is there great consolation. “I have appeared to Thee,” is what? In order that Thou mightest see me: and for this reason Thou hast seen me, in order that I might see Thee. “I have appeared to Thee, that I might see.” He hath not said, “I have appeared to Thee, that Thou mightest see:” but, “I have appeared to Thee, that I might see Thy power and Thy glory.” Whence also the Apostle, “But now,” he saith, “knowing God, nay, having been known of God.” For first ye have appeared to God, in order that to you God might be able to appear. “That I might see Thy power and Thy glory.” In truth in that forsaken place, that is, in that desert, if as though from the desert a man striveth to obtain enough for his sustenance, he will never see the power of the Lord, and the glory of the Lord, but he will remain to die of thirst, and will find neither way, nor consolation, nor water, whereby he may endure in the desert. But when he shall have lifted up himself to God, so as to say to Him out of all his inward parts, “My soul hath thirsted for Thee; how manifoldly for Thee also my flesh!” lest perchance even the things necessary for the flesh of others he ask, and not of God, or else long not for that resurrection of the flesh, which God hath promised to us: when, I say, he shall have lifted up himself, he will have no small consolations.

…But ye have heard but now when the Gospel was being read in what terms He hath notified His Majesty: “I and My Father are One.” Behold how great a Majesty and how great an Equality with the Father hath come down to the flesh because of our infirmity. Behold how greatly beloved we have been, before that we loved God. If before that we loved God, so much by Him we were beloved, as that His Son, Equal with Himself, He made a Man for our sake, what doth He reserve for us now loving Him? Therefore many men think it to be a very small thing that the Son of God hath appeared on earth; because they are not in the Holy One, to them hath not appeared the power of the Same and the glory of the Same: that is, not yet have they a heart made holy, whence they may perceive the eminence of that virtue, and may render thanks to God, nor that to which for their own sakes so great an One came, unto what a nativity, unto what a Passion, they are not able to see, His glory and His power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
