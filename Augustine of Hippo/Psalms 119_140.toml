[[commentary]]
quote='''
Then considering with himself with what a flame of love he burned for the commandments of God: “Fiery,” saith he, “is Thy word exceedingly, and Thy servant hath loved it” (ver. 140). Justly jealous was he of the impenitent heart in His enemies, who had forgotten God’s word; for he endeavoured to bring them unto that which he himself most ardently loved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
