[[commentary]]
quote='''
What peace then is that which men have here, opposed by so many troubles, desires, wants, wearinesses? This is no true, no perfect peace. What will be perfect peace? “This corruptible must put on incorruption, and this mortal must put on immortality.”…Persevere in eating much; this itself will kill thee: persevere in fasting much, by this thou wilt die: sit continually, being resolved not to rise up, by this thou wilt die: be always walking so as never to take rest, by this thou wilt die; watch continually, taking no sleep, by this thou wilt die; sleep continually, never watching, thus too thou wilt die. When therefore death shall be swallowed up in victory, these things shall no longer be: there will be full and eternal peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
