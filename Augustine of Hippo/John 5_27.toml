[[commentary]]
quote='''
And he has granted him power to execute judgment, because he is the Son of Man. Therefore, that form will come for judgment. The form of a man will come for judgment; hence he says: He has granted him power to execute judgment, because he is the Son of Man. The judge here will be the Son of Man; that form will judge here which has been judged. Listen, and understand, this the Prophet had already said: They will look on the one they have pierced. They will see that very form, which they pierced with a lance. The judge will sit, who stood before the judge. He will condemn the true guilty, who was made a false guilty one. He himself will come, that form will come. You have this also in the Gospel: when, before the eyes of his disciples, he went into heaven, they were standing and watching, and an angelic voice sounded: Men of Galilee, why do you stand looking? etc. This same Jesus will come in the same way as you saw him going into heaven. What does it mean: he will come in the same way? He will come in the same form: For he has granted him power to execute judgment, because he is the Son of Man. See, however, in what way this was necessary, and it was right, that those to be judged should see the judge. For both the good and the bad were to be judged. But blessed are the pure in heart, for they will see God. It remains, then, that in judgment the form of a servant should be shown to both the good and the bad, the form of God should be reserved for the good alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520127.html'
source_title="Sermon 127"

[[commentary]]
quote='''
(Tr. xxii. in Joan. s. 10, 11) Or thus: Inasmuch as the Word was in the beginning with God, the Father gave Him to have life in Himself; but inasmuch as the Word was made flesh of the Virgin Mary, being made man, He became the Son of man: and as the Son of man, He received power to execute judgment at the end of the world; at which time the bodies of the dead shall rise again. The souls then of the dead God raises by Christ the Son of God; their bodies by the same Christ, the Son of man. Wherefore He adds, Because He is the Son of man: for, as to the Son of God, He always had the power.

(de Ver. Dom. Ser. 64) At the judgment will appear the form of man, that form will judge, which was judged; He will sit a Judge Who stood before the judge; He will condemn the guilty, Who was condemned innocent. For it is proper that the judged should see their Judge. Now the judged consist of both good and bad; so that the form of the servant will be shown to good and bad alike; the form of God to the good only. Blessed are the pure in heart, for they shall see God. (Matt. 5:8)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Wherefore, keep not silent, O Lord, concerning the resurrection of the flesh; lest men believe it not, and we continue reasoners, not preachers. But "as the Father hath life in Himself, even so hath He given to the Son to have life in Himself." Let them that hear, understand; let them believe that they may understand; let them obey that they may live. And that they may not suppose that the resurrection is finished here, let them hear this further: "and hath given Him authority to execute judgment also." Who hath given? The Father. To whom hath He given? To the Son; namely, to whom He gave to have life in Himself, to the same hath He given authority to execute judgment. "Because He is the Son of man." For this is the Christ, both Son of God and Son of man. "In the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God." Behold, how He hath given Him to have life in Himself! But because "the Word was made flesh, and dwelt among us," was made man of the Virgin Mary, He is the Son of man. What, therefore, hath He received as Son of man? Authority to execute judgment. What judgment? That in the end of the world. Then also there will be a resurrection, but a resurrection of bodies. So, then, God raiseth up souls by Christ, the Son of God; bodies He raiseth up by the same Christ, the Son of man. "Hath given Him authority." He should not have this authority did He not receive it; and He should be a man without authority. But the same who is Son of God is also Son of man. For by adhering to the unity of person, the Son of man with the Son of God is made one person, and the Son of God is the same person which the Son of man is. But what characteristic it has, and wherefore, must be distinguished. The Son of man has soul and body. The Son of God, which is the Word of God, has man, as the soul has body. And just as soul having body does not make two persons, but one man; so the Word, having man, maketh not two persons, but one Christ. What is man? A rational soul, having a body. What is Christ? The Word of God, having man. I see of what things I speak, who I the speaker am, and to whom I am speaking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
Afterwards, because He was made man, what gave He to Him? "And hath given Him authority to execute judgment, because He is the Son of man." In that He is the Son of God, "As the Father hath life in Himself, so also hath He given to the Son to have life in Himself;" in that He is the Son of man, "He hath given Him authority of executing judgment." This is what I explained to you yesterday, my beloved, that in the judgment man will be seen, but God will not be seen; but after the judgment, God will be seen by those who have prevailed in the judgment, but by the wicked He will not be seen. Since, therefore, the man will be seen in the judgment in that form in which He will so come as He ascended, for that reason He had said above, "The Father judgeth not any man, but hath given all judgment to the Son." He repeats the same thing also in this place, when He says, "And hath given Him authority of executing judgment, because He is the Son of man." As if thou wert to say, "hath given Him authority of executing judgment." In what way? When He had not that authority of executing judgment? Since "in the beginning was the Word, and the Word was with God, and the Word was God;" since "all things were made by Him," did He not already have authority of executing judgment? Yes, but according to this, I say, "He gave Him authority of executing judgment, because He is the Son of man:" according to this, He received authority of judging "because He is the Son of man." For in that He is the Son of God, He always had this authority. He that was crucified, received; He who was in death, is in life: the Word of God never was in death, but is always in life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
