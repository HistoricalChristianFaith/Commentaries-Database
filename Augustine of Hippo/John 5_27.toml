[[commentary]]
quote='''
And he has granted him power to execute judgment, because he is the Son of Man. Therefore, that form will come for judgment. The form of a man will come for judgment; hence he says: He has granted him power to execute judgment, because he is the Son of Man. The judge here will be the Son of Man; that form will judge here which has been judged. Listen, and understand, this the Prophet had already said: They will look on the one they have pierced. They will see that very form, which they pierced with a lance. The judge will sit, who stood before the judge. He will condemn the true guilty, who was made a false guilty one. He himself will come, that form will come. You have this also in the Gospel: when, before the eyes of his disciples, he went into heaven, they were standing and watching, and an angelic voice sounded: Men of Galilee, why do you stand looking? etc. This same Jesus will come in the same way as you saw him going into heaven. What does it mean: he will come in the same way? He will come in the same form: For he has granted him power to execute judgment, because he is the Son of Man. See, however, in what way this was necessary, and it was right, that those to be judged should see the judge. For both the good and the bad were to be judged. But blessed are the pure in heart, for they will see God. It remains, then, that in judgment the form of a servant should be shown to both the good and the bad, the form of God should be reserved for the good alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520127.html'
source_title="Sermon 127"

[[commentary]]
quote='''
(Tr. xxii. in Joan. s. 10, 11) Or thus: Inasmuch as the Word was in the beginning with God, the Father gave Him to have life in Himself; but inasmuch as the Word was made flesh of the Virgin Mary, being made man, He became the Son of man: and as the Son of man, He received power to execute judgment at the end of the world; at which time the bodies of the dead shall rise again. The souls then of the dead God raises by Christ the Son of God; their bodies by the same Christ, the Son of man. Wherefore He adds, Because He is the Son of man: for, as to the Son of God, He always had the power.

(de Ver. Dom. Ser. 64) At the judgment will appear the form of man, that form will judge, which was judged; He will sit a Judge Who stood before the judge; He will condemn the guilty, Who was condemned innocent. For it is proper that the judged should see their Judge. Now the judged consist of both good and bad; so that the form of the servant will be shown to good and bad alike; the form of God to the good only. Blessed are the pure in heart, for they shall see God. (Matt. 5:8)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"
