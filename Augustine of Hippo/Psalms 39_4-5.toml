[[commentary]]
quote='''
These days in another passage are styled years: where unto God it is said, “But Thou art the same, and Thy years shall not fail:” for these are not years that are accounted for nothing, or days that perish like a shadow: but they are days which have a real existence, the number of which he who thus spoke, “Lord, let me know mine end” (that is, after reaching what term I shall remain unchanged, and have no further blessing to crave), “and the number of my days, what it is” (what is, not what is not): prayed to know. He distinguishes them from the days of this life, of which he speaks as follows, “Behold, Thou hast made my days as it were a span long,” which are not, because they stand not, remain not, but change in quick succession: nor is there a single hour in them in which our being is not such, but that one part of it has already passed, another is about to come, and none remains as it is. But those years and days, in which we too shall never fail, but evermore be refreshed, will never fail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252090.html'
source_title="Exposition on Psalm 90"
