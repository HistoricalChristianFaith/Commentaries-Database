[[commentary]]
quote='''
They answer: we do not worship devils; we worship angels, as ye call them, the powers and the ministers of the great God. I wish ye would worship them: ye would easily learn from themselves not to worship them. Hear an Angel teaching. He was teaching a disciple of Christ, and showing him many wonders in the Revelation of John: and when some wonderful vision had been shown him, he trembled, and fell down at the Angel’s feet; but that Angel, who sought not but the glory of God, said, “See thou do it not; for I am a fellow-servant of thee, and of thy brethren the prophets.” What then, my brethren? Let no man say, I fear lest the Angel may be angry with me, if I worship him not as my God. He is then angry with thee, when thou hast chosen to worship him: for he is righteous, and loveth God. As devils are angry if they are not worshipped, so are Angels angry if they are worshipped instead of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
