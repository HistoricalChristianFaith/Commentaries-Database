[[commentary]]
quote='''
Of David himself, before he was anointed.

Christ’s young soldier speaketh, on his coming to the faith. “The Lord is my light, and my salvation: whom shall I fear?” (ver. 1). The Lord will give me both knowledge of Himself, and salvation: who shall take me from Him? “The Lord is the Protector of my life: of whom shall I be afraid?” The Lord will repel all the assaults and snares of mine enemy: of no man shall I be afraid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
