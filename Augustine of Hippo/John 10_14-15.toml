[[commentary]]
quote='''
Those of you who hear the word of our God, not only with willingness, but also with attention, doubtless remember our promise. Indeed the same gospel lesson has also been read to-day which was read last Lord's day; because, having lingered over certain closely related topics, we could not discuss all that we owed to your powers of understanding. Accordingly, what has been already said and discoursed about we do not inquire into today, lest by continual repetitions we should be prevented from reaching what has still to be spoken. You know now in the Lord's name who is the good Shepherd, and in what way good shepherds are His members, and therefore the Shepherd is one. You know who is the hireling we have to bear with; who the wolf, and the thieves, and the robbers we have to beware of; who are the sheep, and what is the door whereby both sheep and shepherd enter: how we are to understand the doorkeeper. You know also that every one who entereth not by the door is a thief and a robber, and cometh not but to steal, and to kill, and to destroy. All these sayings have, as I think, been sufficiently handled. To-day we ought to tell you, as far as the Lord enables us (for Jesus Christ our Saviour hath Himself told us that He is both the Shepherd and the door, and that the good Shepherd entereth in by the door), how it is that He entereth in by Himself. For if no one is a good shepherd but he that entereth by the door, and He Himself is preeminently the good Shepherd, and also Himself the door, I can understand it only in this way, that He entereth in by Himself to His sheep, and calleth them to follow Him, and they, going in and out, find pasture, which is to say, eternal life.

I proceed, then, without more delay. When I seek to get into you, that is, into your heart, I preach Christ: were I preaching something else, I should be trying to climb up some other way. Christ, therefore, is my gate to you: by Christ I get entrance, not to your houses, but to your hearts. It is by Christ I enter: it is Christ in me that you have been willingly hearing. And why is it you have thus willingly hearkened to Christ in me? Because you are the sheep of Christ, purchased with the blood of Christ. You acknowledge your own price, which is not paid by me, but is preached by my instrumentality. He, and only He, was the buyer, who shed precious blood-the precious blood of Him who was without sin. Yet made He precious also the blood of His own, for whom He paid the price of blood: for had He not made the blood of His own precious, it would not have been said, "Precious in the sight of the Lord is the death of His saints." So also when He saith, "The good Shepherd giveth His life for the sheep," He is not the only one who has done such a deed; and yet if those who have done so are His members, He only Himself was the doer of it. For He was able to do so without them, but whence had they the power apart from Him, who Himself had said, "Without me ye can do nothing"? But from the same source we can show what others also have done, for the apostle John himself, who preached the very gospel you have been hearing, has said in his epistle, "Just as Christ laid down His life for us, so ought we also to lay down our lives for the brethren." "We ought," he says: He made us debtors who first set the example. To the same effect it is written in a certain place, "If thou sittest down to sup at a ruler's table, make wise observation of what is set before thee; and put to thy hand, knowing that it will be thy duty to make similar provision in turn." You know what is meant by the ruler's table: you there find the body and blood of Christ; let him who comes to such a table be ready with similar provision. And what is such similar provision? As He laid down His life for us, so ought we also, for the edification of others, and the maintenance of the faith, to lay down our lives for the brethren. To the same effect He said to Peter, whom He wished to make a good shepherd. not in Peter's own person, but as a member of His body: "Peter, lovest thou me? Feed my sheep." This He did once, again, and a third time, to the disciple's sorrow. And when the Lord had questioned him as often as He judged it needful, that he who had thrice denied might thrice confess Him, and had a third time given him the charge to feed His sheep, He said to him, "When thou wast young, thou girdedst thyself, and walkedst whither thou wouldest: but when thou shall be old, thou shalt stretch forth thy hands, and another shall gird thee, and carry thee whither thou wouldest not." And the evangelist has explained the Lord's meaning: "But this spake He, signifying by what death he should glorify God." "Feed my sheep" applies, then, to this, that thou shouldst lay down thy life for my sheep.

And now when He saith, "As the Father knoweth me, even so know I the Father," who can be ignorant of His meaning? For He knoweth the Father by Himself, and we by Him. That He hath knowledge by Himself, we know already: that we also have knowledge by Him, we have likewise learned, for this also we have learned of Him. For He Himself hath said: "No one hath seen God at any time; but the only-begotten Son, who is in the bosom of the Father, He hath declared Him." And so by Him do we also get this knowledge, to whom He hath declared Him. In another place also He saith: "No one knoweth the Son, but the Father; neither knoweth any one the Father, save the Son, and he to whomsoever the Son will reveal Him." As He then knoweth the Father by Himself, and we know the Father by Him; so into the sheepfold He entereth by Himself, and we by Him. We were saying that by Christ we have a door of entrance to you; and why? Because we preach Christ. We preach Christ; and therefore we enter in by the door. But Christ preacheth Christ, for He preacheth Himself; and so the Shepherd entereth in by Himself. When the light shows the other things that are seen in the light, does it need some other means of being made visible itself? The light, then, exhibits both other things and itself. Whatever we understand, we understand with the intellect: and how, save by the intellect, do we understand the intellect itself? But does one in the same way with the bodily eye see both other things and [the eye] itself? For though men see with their eyes, yet their own eyes they see not. The eye of the flesh sees other things, itself it cannot [see]: but the intellect understands itself as well other things. In the same way as the intellect seeth itself, so also doth Christ preach Himself. If He preacheth Himself, and by preaching entereth into thee, He entereth into thee by Himself. And He is the door to the Father, for there is no way of approach to the Father but by Him. "For there is one God and one Mediator between God and men, the man Christ Jesus." Many things are expressed by a word: all that I have just said, I have said, of course, by means of words. If I were wishing to speak also of a word itself, how could I do so but by the use of the word? And thus both many things are expressed by a word, which are not the same as the word, and the word itself can only be expressed by means of the word. By the Lord's help we have been copious in illustration. Remember, then, how the Lord Jesus Christ is both the door and the Shepherd: the door, in presenting Himself to view; the Shepherd, in entering in by Himself. And indeed, brethren, because He is the Shepherd, He hath given to His members to be so likewise. For both Peter, and Paul, and the other apostles were, as all good bishops are, shepherds. But none of us calleth himself the door. This-the way of entrance for the sheep-He has retained as exclusively belonging to Himself. In short, Paul discharged the office of a good shepherd when he preached Christ, because he entered by the door. But when the undisciplined sheep began to create schisms, and to set up other doors before them, not of entrance to their joint assembly, but for falling away into divisions, saying, some of them, "I am of Paul;" others, "I am of Cephas;" others," I of Apollos;" others, "I of Christ:" terrified for those who said, "I am of Paul,"-as if calling out to the sheep, Wretched ones, whither are you going? I am not the door,-he said, "Was Paul crucified for you? or were ye baptized in the name of Paul?" But those who said, "I am of Christ," had found the door.
'''
