
[[commentary]]
quote='''
To the end, for the taking up of the morning, a psalm of David.

“To the end,” for His own resurrection, the Lord Jesus Christ Himself speaketh. For in the morning on the first day of the week was His resurrection, whereby He was taken up, into eternal life, “Over whom death shall have no more dominion.” Now what follows is spoken in the person of The Crucified. For from the head of this Psalm are the words, which He cried out, whilst hanging on the Cross, sustaining also the person of the old man, whose mortality He bare. For our old man was nailed together with Him to the Cross.

“O God, my God, look upon me, why hast Thou forsaken me far from my salvation?” (ver. 1). Far removed from my salvation: for “salvation is far from sinners.” “The words of my sins.” For these are not the words of righteousness, but of my sins. For it is the old man nailed to the Cross that speaks, ignorant even of the reason why God hath forsaken him: or else it may be thus, The words of my sins are far from my salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"

[[commentary]]
quote='''
“Neither is there any rest in my bones, from the face of my sin.” It is commonly enquired, of what person this is the speech; and some understand it to be Christ’s, on account of some things which are here said of the Passion of Christ; to which we shall shortly come; and which we ourselves shall acknowledge to be spoken of His Passion. But how could He who had no sin, say, “There is no rest in my bones, from the face of my sin.”…For if we were to say that they are not the words of Christ, those words, “My God, My God, why hast Thou forsaken Me?” will also not be the words of Christ. For there too you have, “My God, My God, why hast Thou forsaken Me?” “The words of mine offences are far from my health.” Just as here you have, “from the face of my sins,” so there also you have, “the words of my offences.” And if Christ is, for all that, without “sin,” and without “offences,” we begin to think those words in the Psalm also not to be His. And it is exceedingly harsh and inconsistent that that Psalm should not relate to Christ, where we have His Passion as clearly laid open as if it were being read to us out of the Gospel. For there we have, “They parted My garments among them, and cast lots upon My vesture.” Why should I mention that the first verse of that Psalm was pronounced by the Lord Himself while hanging on the Cross, with His own mouth, saying, “My God, My God, why hast Thou forsaken Me?” What did He mean to be inferred from it, but that the whole of that Psalm relates to Him, seeing He Himself, the Head of His Body, pronounced it in His own Person? Now when it goes on to say, “the words of mine offences,” it is beyond a doubt that they are the words of Christ. Whence then come “the sins,” but from the Body, which is the Church? Because both the Head and the Body of Christ are speaking. Why do they speak as if one person only? Because “they twain,” as He hath said, “shall be one flesh.” “This” (says the Apostle) “is a great mystery; but I speak concerning Christ and the Church.”…For why should He not say, “my sins,” who said, “I was an hungred, and ye gave Me no meat; I was thirsty, and ye gave Me no drink; I was a stranger, and ye took Me not in. I was sick and in prison, and ye visited Me not.” Assuredly the Lord was not in prison. Why should He not say this, to whom when it was said, “When saw we Thee a hungred, and athirst, or in prison; and did not minister unto Thee?” He replied, that He spake thus in the person of His Body. “Inasmuch as ye did it not unto one of the least of Mine, ye did it not unto Me.” Why should He not say, “from the face of my sins,” who said to Saul, “Saul, Saul, why persecutest thou Me,” who, however, being in Heaven, now suffered from no persecutors? But just as, in that passage, the Head spake for the Body, so here too the Head speaks the words of the Body; whilst you hear at the same time the accents of the Head Itself also. Yet do not either, when you hear the voice of the Body, separate the Head from it; nor the Body, when you hear the voice of the Head: because “they are no more twain, but one flesh.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"

[[commentary]]
quote='''
The title then is not simply “To the sons of Korah,” but, “For understanding, to the sons of Korah.” This is the case also with that Psalm, the first verse of which the Lord Himself uttered on the Cross: “My God, My God, look upon Me; why hast Thou forsaken Me?” For “transferring us in a figure” to what He was saying, and to His own Body (for we are also “His Body,” and He is our “Head”), He uttered from the Cross not His own cry, but ours. For God never “forsook” Him: nor did He Himself ever depart from the Father; but it was in behalf of us that He spake this: “My God, My God, why hast thou forsaken Me?” For there follows, “Far from My health are the words of My offences:” and it shows in whose person He said this; for sin could not be found in Him.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252044.html'
source_title="Exposition on Psalm 44"

[[commentary]]
quote='''
Hidden then was the God of gods, and He gave forth words more out of compassion for us than out of His own majesty. For whence, unless assumed from us, were those words, “My God, My God, why hast Thou forsaken me?” But when hath the Father forsaken the Son, or the Son the Father? Are not Father and Son one God? Whence then, “My God, My God, why hast Thou forsaken Me,” save that in the Flesh of infirmity there was acknowledged the voice of a sinner? For as He took upon Him the likeness of the flesh of sin, why should He not take upon Him the voice of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
When would He have been seized, except they had first said in their heart, “God hath forsaken Him?” Whence there was that voice on the Cross, “My God, My God, why hast Thou forsaken Me?” So then did God forsake Christ, though “God was in Christ reconciling the world to Himself,” though Christ was also God, out of the Jews indeed according to the flesh, “Who is over all things, God blessed for ever,”—did God forsake Him? Far be it. But in our old man our voice it was, because our old man was crucified together with Him: and of that same our old man He had taken a Body, because Mary was of Adam. Therefore the very thing which they thought, from the Cross He said, “Why hast Thou forsaken Me?” Why do these men think Me left alone to their evil? What is, think Me forsaken in their evil?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
