[[commentary]]
quote='''
The lesson of to-day, brethren, is easy; but on account of what was due yesterday (for I know what I have delayed, not withdrawn, and the Lord has deigned to allow me even to-day to speak to you), recall to mind what you ought to demand, if perhaps, while preserving piety and wholesome humility, we may in some measure stretch out ourselves, not against God, but towards Him, and lift up our soul, pouring it out above us, like the Psalmist, to whom it was said, "Where is thy God? "On these things," saith he, "I meditated, and poured out my soul above me." Therefore let us lift up our soul to God, not against God; for this also is said, "To Thee, O Lord, I have lifted up my soul." And let us lift it up with His own assistance, for it is heavy. And from what cause is it heavy? Because the body which is corrupt weighs down the soul, and the earthly tabernacle depresses the mind while meditating on many things. Let us try, then, whether we may not be able to withdraw our mind from many things in order to concentrate it on one, and to raise it to one (which indeed we cannot do, as I have said, unless He assist us who wills our souls to be raised to Himself). And so we may apprehend in some measure how the Word of God, the only begotten of the Father, the co-eternal and equal with the Father, doeth not anything except what He seeth the Father doing, whilst yet the Father Himself doeth not anything but through the Son, who seeth Him doing. Since the Lord Jesus, as it seems to me,-willing here to make known some great matter to those that give attention to it, and to pour into those that are capable of receiving, and to rouse, on the other hand, the incapable to assiduity, in order that, while not yet understanding, they may by right living be made capable,-has intimated to us that the human soul and rational mind which is in man, not in the beast, is invigorated, enlightened, and made happy in no other way than by the very substance of God: that the soul itself gets somewhat by and of the body, and yet holds the body subject to it, while the senses of the body can be soothed and delighted by things bodily, and that because of this kind of fellowship of soul and body in this life, and in this mutual embrace of theirs, the soul is delighted when the bodily senses are soothed, and saddened when they are offended; while yet the happiness by which the soul itself is made happy cannot be realized but by a participation of that ever-living, unchangeable life, of that eternal substance,which is God: that as the soul, which is inferior to God, causes the body, which is inferior to itself, to live, so that alone which is superior to the soul can cause that same soul to live happily. For the soul is higher than the body, and higher than the soul is God. It bestows something on its inferior, while there is something bestowed on itself by the superior. Let it serve its Lord, that it may not be trampled on by its own servant. This, brethren, is the Christian religion, which is preached through the whole world, while its enemies are dismayed; who, where they are conquered, murmur, and fiercely rage against it where they prevail. This is the Christian religion, that one God be worshipped, not many gods, because only one God can make the soul happy. It is made happy by participation of God. Not by participation of a holy soul does the feeble soul become happy, nor by participation of an angel does the holy soul become happy; but if the feeble soul seeks to be happy, let it seek that by which the holy soul is made happy. For thou art made happy, not of an angel, but the angel as well as thou of the same source.

These things being premised and firmly established,-that the rational soul is made happy only by God, that the body is enlivened only by the soul, and that the soul is a something intermediate between God and the body,-direct your thoughts to, and recollect with me, not the passage read to-day, of which we have spoken enough, but that of yesterday, which we have been turning over and handling these three days, and, to the best of our abilities, digging into until we should come to the rock. The Word Christ, Christ the Word of God with God, Christ the Word and the Word God, Christ and God and Word one God. To this press on; O soul, despising, or even transcending all things else, to this press on. There is nothing more powerful than this creature, which is called the rational mind, nothing more sublime: whatever is above this, is but the Creator. But I was saying that Christ is the Word, and Christ is the Word of God, and Christ the Word is God; but Christ is not only the Word, since "the Word became flesh, and dwelt among us:" therefore Christ is both Word and flesh. For when "He was in the form of God, He thought it not robbery to be equal with God." And what of us in our low estate, who, feeble and crawling on the ground, Were not able to reach unto God, were we to be abandoned? God forbid. "He emptied Himself, taking upon Him the form of a servant;" not, therefore, by losing the form of God. He became man who was God, by receiving what He was not, not by losing what He was: so God became man. There thou hast something for thy weakness, something for thy perfection. Let Christ raise thee by that which is man, lead thee by That which is God-man, and guide thee through to that which is God. And the whole preaching and dispensation by Christ is this, brethren, and there is not another, that souls may be raised again, and that bodies also may be raised again. For each of the two was dead; the body by weakness, the soul by iniquity. Because each was dead, each may rise again What each? Soul and body. By what, then, can the soul rise again but by Christ God? By what the body, but by the man Christ? For there was also in Christ a human soul, a whole soul; not merely the irrational part of the soul, but also the rational, which is called mind. For there have been certain heretics, and they have been driven out of the Church, who fancied that the body of Christ did not have in it a rational mind, but, as it were, the animal life of a beast; since, without the rational mind, life is only animal life. But because they were driven out, and driven out by the truth, accept thou the whole Christ, Word, rational mind, and flesh. This is the whole Christ. Let thy soul rise again from iniquity by that which is God, thy body from corruption by that which is man. There, most beloved, hear ye what, so far as it appears to me, is the great profundity of this passage; and see how Christ here speaks to the effect, that the only reason why He came is, in order that souls may have a resurrection from iniquity, and bodies from corruption. I have already said by what our souls are raised, by the very substance of God; by what our bodies are raised, by the human dispensation of our Lord Jesus Christ.
'''
