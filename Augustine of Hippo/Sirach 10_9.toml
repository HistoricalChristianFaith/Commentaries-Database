[[commentary]]
quote='''
"No one knows the things of a person except the spirit of man which is in him." And yet, there is something of a person that "the spirit … in him" does not know. But you, Lord, who made him, you fully know him. I indeed, though in your sight I despise myself and consider "myself but dust and ashes"—I still know something concerning you that I do not know about myself. Most assuredly, "we see through a glass dimly," "not yet face to face." As long as I am absent from you, I am more present with myself than with you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%252010.html'
source_title="Confessions 10.5.7"

[[commentary]]
quote='''
And hence what is said of proud mortal man, clad in the tattered rags of the flesh, weighed down with the weight of a corruptible body, and withal extolling himself, and forgetting with what skin-coat he is clothed,-what, I ask, saith the Scripture to him? "Why is dust and ashes proud?" Why proud! Let the Scripture tell why. "Because in his life he put forth his inmost parts." What is "put forth," but "threw afar off"? This is to go forth away. For to enter within, is to long after the inmost parts; to put forth the inmost parts, is to go forth away. The proud man puts forth the inmost parts, the humble man earnestly desires the inmost parts. If we are cast out by pride, let us return by humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252025.html'
source_title="Tractates on John 25"
