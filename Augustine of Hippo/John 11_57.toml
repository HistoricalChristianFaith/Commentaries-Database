[[commentary]]
quote='''
"Now the chief priests and the Pharisees had given a commandment, that, if any man knew where He were, he should show it, that they might take Him." Let us for our parts show the Jews where Christ is. Would, indeed, that all the seed of those who had given commandment to have it shown them where Christ was, would but hear and apprehend! Let them come to the church and hear where Christ is, and take Him. They may hear it from us, they may hear it from the gospel. He was slain by their forefathers, He was buried, He rose again, He was recognized by the disciples, He ascended before their eyes into heaven, and there sitteth at the right hand of the Father; and He who was judged is yet to come as Judge of all: let them hear, and hold fast. Do they reply, How shall I take hold of the absent? how shall I stretch up my hand into heaven, and take hold of one who is sitting there? Stretch up thy faith, and thou hast got hold. Thy forefathers held by the flesh, hold thou with the heart; for the absent Christ is also present. But for His presence, we ourselves were unable to hold Him. But since His word is true, "Lo, I am with you alway, even to the end of the world," He is away, and He is here; He has returned, and will not forsake us; for He has carried His body into heaven, but His majesty He has never withdrawn from the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
