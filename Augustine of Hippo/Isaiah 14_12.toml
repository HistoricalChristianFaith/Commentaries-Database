[[commentary]]
quote='''
For example, what is said in Isaiah, "How he is fallen from heaven, Lucifer, son of the morning!" and the other statements in that context that speak of the king of Babylon are of course to be understood of the devil. However, the statement that is made in the same place, "He that sent orders to all nations is crushed on the earth," does not altogether fitly apply to the head himself.
'''
source_url=''
source_title="CHRISTIAN INSTRUCTION 3:37"

[[commentary]]
quote='''
A certain one was named Lucifer, who fell; for he was an angel and became a devil; and concerning him the Scripture said, "Lucifer, who did arise in the morning, fell" And why was he Lucifer? Because, being enlightened, he gave forth light. But for what reason did he become dark! Because he abode not in the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"
