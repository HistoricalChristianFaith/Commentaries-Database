[[commentary]]
quote='''
For it had previously been said through His passion that when He, according to the flesh, showed the example of humility, the waves of the sea raged against Him, to which He yielded willingly for us, so that the prophecy might be fulfilled: "I have come into deep waters, and the storm overwhelmed me." For He did not repel false witnesses nor the raging clamor of those shouting, "Crucify Him." He did not suppress the rabid hearts and mouths of the furious by force, but endured with patience. They did to Him all they wished; for He became obedient unto death, even the death of the cross. But after He rose from the dead, so that He might alone pray for the disciples established in the Church as in a ship, and carried by the faith of His cross as by wood, and endangered by the temptations of this world as by the waves of the sea, His name began to be honored in this world, in which He was despised, accused, and killed. So that He who had come in the flesh into the deep waters according to His passion, and had been overwhelmed by the storm, might now trample on the necks of the proud as the foam of the waves by the honor of His name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252075.html'
source_title="Sermon 75"

[[commentary]]
quote='''
“Fixed I am in the clay of the deep, and there is no substance” (ver. 2). What called He clay? Is it those very persons that have persecuted? For out of clay man hath been made. But these men by falling from righteousness have become the clay of the deep, and whosoever shall not have consented to them persecuting and desiring to draw him to iniquity, out of his clay doth make gold. For the clay of the same shall merit to be converted into a heavenly form, and to be made associate of those of whom saith the Title of the Psalm, “in behalf of them that shall be changed.” But at the time when these were the clay of the deep, I stuck in them: that is, they held Me, prevailed against Me, killed Me. “Fixed” then “I am in the clay of the deep, and there is no substance.” What is this, “there is no substance”? Can it be that clay itself is not a substance? What is then, “fixed I am”? Can it be that Christ hath thus stuck? Or hath He stuck, and was not, as hath been said in the book of Job, “the earth delivered into the hands of the ungodly man”? Was He fixed in body, because it could be held, and suffered even crucifixion? For unless with nails He had been fixed, crucified He had not been. Whence then “there is no substance”? Is that clay not a substance? But we shall understand, if it be possible, what is, “and there is no substance,” if first we shall have understood what is a substance. For there is substance spoken of even of riches, as we say, he hath substance, and he hath lost substance.…

God is a sort of substance: for that which is no substance, is nothing at all. To be a substance then is to be something. Whence also in the Catholic Faith against the poisons of certain heretics thus we are builded up, so that we say, Father and Son and Holy Spirit are of one substance. What is, of one substance? For example, if gold is the Father, gold is also the Son, gold also the Holy Spirit. Whatever the Father is because He is God, the same is the Son, the same the Holy Spirit. But when He is the Father, this is not what He is. For Father He is called not in reference to Himself, but in reference to the Son: but in reference to Himself God He is called. Therefore in that He is God, by the same He is a substance. And because of the same substance the Son is, without doubt the Son also is God. But yet in that He is Father, because it is not the name of the substance, but is referred to the Son; we do not say that the Son is Father in the same manner as we say the Son is God. Thou askest what the Father is; we answer, God. Thou askest what is the Father and the Son: we answer, God. If questioned of the Father alone, answer thou God: if questioned of both, not Gods, but God, answer thou. We do not reply as in the case of men, when thou inquirest what is father Abraham, we answer a man; the substance of him serveth for answer: thou inquirest what is his son Isaac, we answer, a man; of the same substance are Abraham and Isaac: thou inquirest what is Abraham and Isaac, we answer not man, but men. Not so in things divine. For so great in this case is the fellowship of substance, that of equality it alloweth, plurality alloweth not. If then it shall have been said to thee, when thou tellest me that the Son is the same as the Father, in fact the Son also is the Father; answer thou, according to the substance I have told thee that the Son is the same as the Father, not according to that term which is used in reference to something else. For in reference to Himself He is called God, in reference to the Father is called Son. And again, the Father in reference to Himself is called God, in reference to the Son He is called Father. The Father as He is called in reference to the Son, is not the Son: the Son as He is called in reference to the Father, is not the Father: what the Father is called in reference to Himself and the Son in reference to Himself, the same is Father and Son, that is, God. What is then, “there is no substance”? After this interpretation of substance, how shall we be able to understand this passage of the Psalm, “Fixed I am in the clay of the deep, and there is no substance”? God made man, He made substance; and O that he had continued in that which God made Him! If man had continued in that which God made him, in him would not have been fixed He whom God begot. But moreover because through iniquity man fell from the substance wherein he was made (for iniquity itself is no substance; for iniquity is not a nature which God formed, but a perverseness which man made); the Son of God came to the clay of the deep, and was fixed; and that was no substance wherein He was fixed, because in the iniquity of them He was fixed. “All things by Him were made, and without Him there was made nothing.” All natures by Him were made, iniquity by Him was not made, because iniquity was not made. Those substances by Him were made, which praise Him. The whole creation praising God is commemorated by the three children in the furnace, and from things earthly to things heavenly, or from things heavenly to things earthly reacheth the hymn of them praising God. Not that all these things have sense to praise; but because all things being well meditated upon, do beget praise, and the heart by considering creation is fulfilled to overflowing with a hymn to the Creator. All things do praise God, but only the things which God hath made. Do ye observe in that hymn that covetousness praiseth God? There even the serpent praiseth God, covetousness praiseth not. For all creeping things are there named in the praise of God: there are named all creeping things; but there are not there named any vices. For vices out of ourselves and out of our own will we have: and vices are not a substance. In these was fixed the Lord, when He suffered persecution: in the vice of the Jews, not in the substance of men which by Him was made.

“I have come into the depth of the sea, and the tempest hath made Me to sink down.” Thanks to the mercy of Him who came into the depth of the sea, and vouchsafed to be swallowed by the sea whale, but was vomited forth the third day. He came into the depth of the sea, in which depth we were thrust down, in which depth we had suffered shipwreck: He came thither Himself, and the tempest made Him to sink down: for there He suffered waves, those very men; tempests, the voices of men saying, “Crucify, Crucify.” Though Pilate said, I find not any cause in this Man why He should be killed: there prevailed the voices of them, saying, “Crucify, Crucify.” The tempest increased, until He was made to sink down that had come into the depth of the sea. And the Lord suffered in the hands of the Jews that which He suffered not when upon the waters He was walking: the which not only He had not suffered Himself, but had not allowed even Peter to suffer it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
