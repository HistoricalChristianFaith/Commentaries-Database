[[commentary]]
quote='''
“There hath not failed from the streets thereof usury and deceit” (ver. 11). Usury and deceit are not hidden at least, because they are evil things, but in public they rage. For he that in his house doth any evil thing, however for his evil thing doth blush: “In the streets thereof usury and deceit.” Money-lending even hath a profession, Money-lending also is called a science; a corporation is spoken of, a corporation as if necessary to the state, and of its profession it payeth revenue; so entirely indeed in the streets is that which should have been hidden. There is also another usury worse, when thou forgivest not that which to thee is owed; and the eye is disturbed in that verse of the prayer, “Forgive us our debts—as we too forgive our debtors.” For what there wilt thou do, when thou art going to pray, and coming to that same verse? An insulting word thou hast heard: thou wouldest exact the punishment of condemnation. Do but consent to exact just so much as thou hast given, thou usurer of injuries! With the fist thou hast been smitten, slaying thou seekest. Evil usury! How wilt thou go to prayer? If thou shalt have left praying, which way wilt thou come round unto the Lord? Behold thou wilt say: “Our Father which art in heaven, hallowed be Thy Name, Thy kingdom come, Thy will be done, as in heaven so on earth.” Thou wilt say, “Our daily bread give us to-day.” Thou wilt come to, “Forgive us our debts, as we also forgive our debtors.” Even in that evil city let there abound these usuries; let them not enter the walls where the breast is smitten! What wilt thou do? because there thou and that verse are in the midst? Petitions for thee hath a heavenly Lawyer composed. He that knew what used there to be done, said to thee, “Otherwise thou shalt not obtain.” “Verily, verily, I say unto you, that if ye shall have forgiven men sins, they shall be forgiven you; but if ye shall not have forgiven sins unto men, neither will your Father forgive you.” Who saith this? He that knoweth what there is being done, in the place whereat thou art standing to make request. See how Himself hath willed to be thy Advocate; Himself thy Counsellor, Himself the Assessor of the Father, Himself thy Judge hath said, “Otherwise thou shalt not receive.” What wilt thou do? Thou wilt not receive, unless thou shalt speak; wilt not receive if falsely thou shalt speak. Therefore either thou must do and speak, or else what thou askest thou wilt not earn; because they that this do not do, are in the midst of those evil usuries. Be they engaged therein, that yet do idols either adore or desire: do not thou, O people of God, do not thou, O people of Christ, do not thou the Body of Him the Head! Give heed to the bond of thy peace, give heed to the promise of thy life. For what doth it profit thee, that thou exactest for injuries which thou hast endured? doth vengeance refresh thee? Therefore, over the evil of another shalt thou rejoice? Thou hast suffered evil; pardon thou; be not ye two.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
