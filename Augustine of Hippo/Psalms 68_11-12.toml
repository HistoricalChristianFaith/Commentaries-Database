[[commentary]]
quote='''
Who then “shall give the Word to men preaching the Gospel with much virtue”? “The King,” he saith, “of the virtues of the Beloved” (ver. 12). The Father therefore is King of the virtues of the Son. For the Beloved, when there is not specified any person that is beloved, by a substitution of name, of the Only Son is understood. Is not the Son Himself King of His virtues, to wit of the virtues serving Himself? Because with much virtue the King of Virtues shall give the Word to men preaching the Gospel, of Whom it hath been said, “The Lord of Virtues, He is the King of Glory?” But his not having said King of Virtues, but “King of the Virtues of the beloved,” is a most usual expression in the Scriptures, if any one observe: which thing chiefly appeareth in those cases where even the person’s own name is already expressed, so that it cannot at all be doubted that it is the same person of whom something is said. Of which sort also is that which in the Pentateuch in many passages is found: “And Moses did it, as the Lord commanded Moses.” He said not that which is usual in our expressions, And Moses did, as the Lord commanded him; but, “Moses did as the Lord commanded Moses,” as if one person were the Moses whom He commanded, and another person the Moses who did, whereas it is the very same. In the New Testament such expressions are most difficult to find.…“The King,” therefore, “of the virtues of the Beloved,” thus may be understood, as if it were to be said, the King of His virtues, because both King of Virtues is Christ, and the Beloved is the very same Christ. However, this sense hath not so great urgency, as that no other can be accepted: because the Father also may be understood as King of the virtues of His Beloved Son, to whom the Beloved Himself saith, “All Mine are Thine, and Thine Mine.” But if perchance it is asked, whether God the Father of the Lord Jesus Christ can be called King also, I know not whether any one would dare to withhold this name from Him in the passage where the Apostle saith, “But to the King of ages, immortal, invisible, the only God.” Because even if this be said of the Trinity itself, therein is also God the Father. But if we do not carnally understand, “O God, Thy Judgment to the King give Thou, and Thy justice to the Son of the King:” I know not whether anything else hath been said than, “to Thy Son.” King therefore is the Father also. Whence that verse of this Psalm, “King of the virtues of the Beloved;” in either way may be understood. When therefore he had said, “The Lord shall give the Word to men preaching the Gospel with much virtue:” because virtue itself by Him is ruled, and serveth Him by whom it is given; the Lord Himself, he saith, who shall give the Word to men preaching the Gospel with much virtue, is the King of the virtues of the Beloved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
