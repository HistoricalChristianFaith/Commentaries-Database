
[[commentary]]
quote='''
“Thou hast loosed him from cleansing” (ver. 44). What is this? Amongst all the evils, this is a matter for great fear; for howsoever God may beat, howsoever He may be wroth, howsoever He may flog and scourge, yet let Him scourge him bound, whom He is to cleanse, not “loose him from cleansing.” For if He loose him from being purified, he becomes incapable of cleansing, and must be an outcast. From what cleansing then is the Jew loosed? From faith; for by faith we live: and it is said of faith, “purifying their hearts by faith:” and as it is only the faith of Christ that cleanses; by disbelief in Christ, they are loosed from purification. “Thou hast loosed him from cleansing, and cast his throne down to the ground.” And so Thou hast broken it. “The days of his seat hast Thou shortened” (ver. 45). They imagined that they should reign for ever. “And covered him with confusion.” All these things happened to the Jews, Christ yet not being taken away, but His advent deferred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
