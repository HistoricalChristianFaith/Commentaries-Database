[[commentary]]
quote='''
“I became dumb; and I opened not my mouth” (ver. 9). But it was to guard against “the foolish man,” that “I became dumb, and opened not my mouth.” For to whom should I tell what is going on within me? “For I will hear what the Lord God will speak in me; for He will speak peace unto His people.” But “There is no peace,” saith the Lord, “to the wicked.” “I was dumb, and opened not my mouth; because it is Thou that madest me.” Was this the reason that thou openedst not thy mouth, “because God made thee”? That is strange; for did not God make thy mouth, that thou shouldest speak? “He that planted the ear, doth He not hear? He that formed the eye, doth He not see?” God hath given thee a mouth to speak with; and dost thou say, “I was dumb, and opened not my mouth, because Thou madest me”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
