[[commentary]]
quote='''
But what is, “Depart from evil”? (ver. 14). It is little that thou injure none, murder none, steal not, commit not adultery, do no wrong, speak no false witness; “Depart from evil.” When thou hast departed, thou sayest, Now I am safe, I have done all, I shall have life, I shall see good days. Not only saith he, “Depart from evil,” but also, “and do good.” It is nothing that thou spoil not: clothe the naked. If thou hast not spoiled, thou hast declined from evil; but thou wilt not do good, except thou receive the stranger into thine house. So then depart from evil, as to do good. “Seek peace, and ensue it.” He hath not said, Thou shalt have peace here; seek it, and ensue it. Whither shall I ensue it? Whither it hath gone before. For the Lord is our peace, hath risen again, and hath ascended into Heaven. “Seek peace, and ensue it;” because when thou also hast risen, this mortal shall be changed, and thou shalt embrace peace there where no man shall trouble thee. For there is perfect peace, where thou wilt not hunger.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"

[[commentary]]
quote='''
How ought we too to have judgment and righteousness? Thou hast judgment, when thou dost distinguish evil from good: and righteousness when thou followest the good, and turnest aside from the evil. By distinguishing them, thou hast judgment; by doing, thou hast righteousness. “Eschew evil,” he saith, “and do good; seek peace, and ensue it.” Thou shouldest first have judgment, then righteousness. What judgment? That thou mayest first judge what is evil, and what is good. And what righteousness? That thou mayest shun evil, and do good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
