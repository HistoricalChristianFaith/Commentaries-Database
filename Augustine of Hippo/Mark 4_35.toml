[[commentary]]
quote='''
Matthew thence proceeds as follows: "And it came to pass that, when Jesus had finished these parables, He departed thence: and when He was come into His own country, He taught them in their synagogues;" and so on, down to the words, "And He did not many mighty works there because of their unbelief." Thus he passes from the above discourse containing the parables, on to this passage, in such a way as not to make it absolutely necessary for us to take the one to have followed in immediate historical succession upon the other. All the more may we suppose this to be the case, when we see how Mark passes on from these parables to a subject which is not identical with Matthew's directly succeeding theme, but quite different from that, and agreeing rather with what Luke introduces; and how he has constructed his narrative in such a manner as to make the balance of credibility rest on the side of the supposition, that what followed in immediate historical sequence was rather the occurrences which these two latter evangelists both insert in near connection [with the parables],—namely, the incidents of the ship in which Jesus was asleep, and the miracle performed in the expulsion of the devils in the country of the Gerasenes,—two events which Matthew has already recalled and introduced at an earlier stage of his record.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 42"
