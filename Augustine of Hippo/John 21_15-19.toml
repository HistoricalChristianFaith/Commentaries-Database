[[commentary]]
quote='''
"So when they had dined, He saith to Simon Peter, Simon, [son] of John, lovest thou me more than these? He saith unto Him, Yea, Lord; Thou knowest that I love Thee. He saith unto him, Feed my lambs. He saith to him again, Simon, [son] of John, lovest thou me? He saith unto Him, Yea, Lord; Thou knowest that I love Thee. He saith unto Him, Feed my lambs. He saith unto him the third time, Simon, [son] of John, lovest thou me? Peter was grieved because He said unto him the third time, Lovest thou me? And he said unto Him, Lord, Thou knowest all things; Thou knowest that I love Thee. He saith unto him, Feed my sheep. Verily, verily, I say unto thee, When thou wast young thou girdedst thyself, and walkedst whither thou wouldest: but when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee, and carry thee whither thou wilt not. And this spake He, signifying by what death he should glorify God." Such was the end reached by that denier and lover; elated by his presumption, prostrated by his denial, cleansed by his weeping, approved by his confession, crowned by his suffering, this was the end he reached, to die with a perfected love for the name of Him with whom, by a perverted forwardness, he had promised to die. He would do, when strengthened by His resurrection, what in his weakness he promised prematurely. For the needful order was that Christ should first die for Peter's salvation, and then that Peter should die for the preaching of Christ. The boldness thus begun by human temerity was an utter inversion of the order that had been instituted by the Truth. Peter thought to lay down his life for Christ, the one to be delivered in behalf of the Deliverer, seeing that Christ had come to lay down His life for all His own, including Peter also, which, you see, was now done. Now and henceforth a true, because graciously bestowed, strength of heart may be assumed for incurring death itself for the name of the Lord, and not a false one presumptuously usurped through an erroneous estimate of ourselves. Now there is no need that we should any more fear the passage out of the present life, because in the Lord's resurrection we have a foregoing illustration of the life to come. Now thou hast cause, Peter, to be no longer afraid of death, because He liveth whom thou didst mourn when dead, and whom in thy carnal love thou didst try to hinder from dying in our behalf. Thou didst dare to step in before the Leader, and thou didst tremble before His persecutor: now that the price has been paid for thee, it is thy duty to follow the Buyer, and follow Him even to the death of the cross. Thou hast heard the words of Him whom thou hast already proved to be truthful; He Himself hath foretold thy suffering, who formerly foretold thy denial.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520123.html'
source_title="Tractates on John 123"
