[[commentary]]
quote='''
But of what use were the miracles, save that He might be feared? What too would fear profit, unless “the gracious and merciful Lord” gave “meat unto them that fear Him”? (ver. 5); meat that doth not spoil, “bread that cometh down from heaven,” which He gave to no deservings of ours. For “Christ died for the ungodly.” No one then would give such food, save a gracious and merciful Lord. But if He gave so much to this life, if the sinner who was to be justified received the Word made flesh; what shall he receive when glorified in a future world? For, “He shall ever be mindful of His covenant.” Nor hath He who hath given a pledge, given the whole.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520111.html'
source_title="Exposition on Psalm 111"
