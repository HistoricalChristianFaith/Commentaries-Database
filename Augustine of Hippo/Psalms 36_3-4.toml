[[commentary]]
quote='''
“Thou hast loved malice above benignity” (ver. 4). Before thee was benignity; herself thou shouldest have loved. For thou wast not going to expend anything, nor wast thou going to fetch something to love by a distant voyage. Benignity is before thee, iniquity before thee: compare and choose. But perchance thou hast an eye wherewith thou seest malignity, and hast no eye wherewith thou seest benignity. Woe to the iniquitous heart. What is worse, it doth turn away itself, that it may not see what it is able to see. For what of such hath been said in another place? “He would not understand that he might do good.” For it is not said, he could not: but “he would not,” he saith, “understand that he might do good,” he closed his eyes from present light. And what followeth? “Of iniquity he hath meditated in his bed;” that is, in the inner secrecy of his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
