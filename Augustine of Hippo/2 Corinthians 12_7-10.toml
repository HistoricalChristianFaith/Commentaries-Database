[[commentary]]
quote='''
See how (I dare so speak, my brethren) even the Apostle was beaten with this very hammer: he saith, “there was given to me a thorn in the flesh, the messenger of Satan, to buffet me.” Behold he is under the hammer: let us hear how he speaketh of it: “For this thing,” he saith, “I besought the Lord thrice, that it might depart from me. And He said unto me, My grace is sufficient for thee: for My strength is made perfect in weakness.” I, saith His Maker, wish to make this trumpet perfect; I cannot do so unless I hammer it; in weakness is strength made perfect. Hear now the ductile trumpet itself sounding as it should: “When I am weak, then am I strong.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
