[[commentary]]
quote='''
Who save him who rose on the third day was in a position to say that his flesh rested in hope, that his soul, not left in hell, would swifty return to reanimate his flesh, that his flesh would not undergo corruption as other corpses rot away? Surely, no one can maintain that all of this was verified in David, king and prophet!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252017.html'
source_title="City of God 17.18"

[[commentary]]
quote='''
“For Thou wilt not leave My soul in hell” (ver. 10). For Thou wilt neither give My soul for a possession to those parts below. “Neither wilt Thou grant Thine Holy One to see corruption.” Neither wilt Thou suffer that sanctified body, whereby others are to be also sanctified, to see corruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
