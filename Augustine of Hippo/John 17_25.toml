[[commentary]]
quote='''
(Tr. cxi. 5) Or thus; What is to know Him, but eternal life, which He gave not to a condemned but to a reconciled world? For this reason the world hath not known Thee; because Thou art just, and hast punished them with this ignorance of Thee, in reward for their misdeeds. And for this reason the reconciled world knows Thee, because Thou art merciful, and hast vouchsafed this knowledge, not in consequence of their merits, but of thy grace. It follows: But I have known Thee. He is God the fountain of grace by nature, man of the Holy Ghost and Virgin by grace ineffable. Then because the grace of God is through Jesus Christ, He says, And they have known Me, i. e. the reconciled world have known Me, by grace, forasmuch as Thou hast sent Me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"
