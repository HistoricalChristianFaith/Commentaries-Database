[[commentary]]
quote='''
The river Jordan, when they were entering across it into the land of promise, when touched by the feet of the priests who bore the Ark, stood still from above with bridled stream, while it flowed down from below, where it ran on into the sea, until the whole people passed over, the priests standing on the dry ground. We know these things, but yet we should not imagine in this Psalm, to which we have now answered by chanting Allelujah, that it is the purpose of the Holy Spirit, that while we call to mind those deeds of the past, we should not consider things like unto them yet to take place. For “these things,” as the Apostle saith, “happened unto them for ensamples.”

“When Israel came out of Egypt, and the house of Jacob from among the strange people” (ver. 1), “Judah was His sanctuary, and Israel His dominion” (ver. 2); “the sea saw that and fled, Jordan was driven back” (ver. 3). Think not that past deeds are related unto us, but rather that the future is predicted; since, while those miracles also were going on in that people, things present indeed were happening, but not without an intimation of things future.…Some things he has related differently to what we have learnt and read there: that he might not truly be thought to be repeating past acts rather than to be prophesying future things. For in the first place, we read not that the Jordan was driven back, but that it stood still on the side nearest the source of its streams, while the people were passing through; next, we read not of the mountains and hills skipping: all which he hath added, and repeated. For after saying, “The sea saw that, and fled; Jordan was driven back:” he added, “The mountains skipped like rams, and the little hills like young sheep” (ver. 4): and then asketh, “What aileth thee, O thou sea, that thou fleddest: and thou, Jordan, that thou wast driven back?” (ver. 5). “Ye mountains, that ye skipped like rams; and ye little hills, like young sheep?” (ver. 6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
