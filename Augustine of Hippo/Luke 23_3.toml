[[commentary]]
quote='''
Here, then, he proceeds thus: "Then said Pilate unto them, Take ye him, and judge him according to your law. The Jews, therefore, said unto him, It is not lawful for us to put any man to death; that the saying of Jesus might be fulfilled, which He spake, signifying what death He should die. Then Pilate entered into the judgment-hall again, and called Jesus, and said unto Him, Art thou the King of the Jews? And Jesus answered, Sayest thou this thing of thyself, or did others tell it thee of me?" This again may seem not to harmonize with what is recorded by the others,—namely, "Jesus answered, Thou sayest,"—unless it is made clear in what follows that the one thing was said as well as the other. Hence he gives us to understand that the matters which he records next are [not to be regarded as] things never actually uttered by the Lord, but are rather to be considered things which have been passed over in silence by the other evangelists. Mark, therefore, what remains of his narrative. It proceeds thus: "Pilate answered, Am I a Jew? Thine own nation, and the chief priests, have delivered thee unto me: what hast thou done? Jesus answered, My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews; but now is my kingdom not from hence. Pilate therefore said unto Him, Art thou a king then? Jesus answered, Thou sayest that I am a king." Behold, here is the point at which he comes to that which the other evangelists have reported.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
