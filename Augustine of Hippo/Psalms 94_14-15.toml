[[commentary]]
quote='''
And what saith the Holy Scripture in the psalm to the members,-namely, that tolerate the wickedness of this world? "The Lord will not cast off His people." For, in fact, His people labors among the unworthy, among the unrighteous, among blasphemers, among murmurers, detractors, persecutors, and, if they are allowed, destroyers. Yes, it labors; but "the Lord will not cast off His people, and He will not forsake His inheritance until justice is turned into judgment." "Until the justice," which is now in His saints, "be turned into judgment;" when that shall be fulfilled which was said to them, "Ye shall sit upon twelve thrones, judging the twelve tribes of Israel." The apostle had righteousness, but not yet that judgment of which he says, "Know ye not that we shall judge angels?" Be it now, therefore, the time for living rightly; the time for judging them that have lived ill shall be hereafter. "Until righteousness," saith he, "is turned into judgment."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252028.html'
source_title="Tractates on John 28"
