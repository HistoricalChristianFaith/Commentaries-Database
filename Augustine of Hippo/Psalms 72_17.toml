[[commentary]]
quote='''
“Be,” therefore, “the name of Him blessed for ever: before the sun endureth the name of Him” (ver. 17). By the sun times are signified. Therefore for everlasting endureth the name of Him. For eternity doth precede times, and is not bounded by time. “And there shall be blessed in Him all the tribes of the earth.” For in Him is fulfilled that which hath been promised to Abraham. “For He saith not, In seeds, as though in many; but as though in one, And to thy Seed, which is Christ.” But to Abraham is said, “In thy Seed shall be blessed all the tribes of the earth.” And not the sons of the flesh but the sons of promise are counted in the Seed. “All nations shall magnify Him.” As if in explanation there is repeated that which above hath been said. For because they shall be blessed in Him, they shall magnify Him; not of themselves making Him to be great, that of Himself is great, but by praising and confessing Him to be great. For thus we magnify God: thus also we say, “Hallowed be Thy name,” which is indeed always holy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
