
[[commentary]]
quote='''
Do not thou, then, so, do not so: fear the word of the Lord, saying, “Remember Lot’s wife.” She too being on the way, but now delivered from the Sodomites, looked back; in the place where she looked back, there she remained: she became a statue of salt, in order to season thee. For to thee she hath been given for an example, in order that thou mayest have sense, mayest not stop infatuated on the way. Observe her stopping and pass on: observe her looking back, and do thou be reaching forth unto the things before, as Paul was. What is it, not to look back. “Of the things behind forgetful,” he saith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"

[[commentary]]
quote='''
When the Lord was threatening them with the day of judgment, He saith what? “Remember Lot’s wife.” To all men He spake. For what did Lot’s wife? She was delivered from Sodom, and being in the way she looked back. In the place where she looked back, there she remained. For she became a statue of salt, in order that by considering her men might be seasoned, might have sense, might not be infatuated, might not look back, lest by giving a bad example they should themselves remain and season others. For even now we are saying this to certain of our brethren, whom perchance we may have seen as it were weak in the good they have purposed. And wilt thou be such an one as he was? We put before them certain who have looked back. They are savourless in themselves, but they season others, inasmuch as they are mentioned, in order that fearing their example they may not look back. “Vow ye, and pay.” For that wife of Lot to all doth belong. A married woman hath had the will to commit adultery; from her place whither she had arrived she looked back. A widow who had vowed so to remain hath willed to marry, she hath willed the thing which was lawful to her who hath married, but to herself was not lawful, because from her place she hath looked back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
