[[commentary]]
quote='''
What is that which looking forth we acknowledge? What is that which looking forth God acknowledgeth? What (because here He giveth it) doth He acknowledge? Hear what it is; that “All have gone aside, together useless they have become: there is not one that doeth good, there is not so much as one.” What then is that other question, but the same whereof a little before I have made mention? If, “There is not one that doeth good, is not so much as one,” no one remaineth to groan amid evil men. Stay, saith the Lord, do not hastily give judgment. I have given to men to do well; but of Me, He saith, not of themselves: for of themselves evil they are: sons of men they are, when they do evil; when well, My sons. For this thing God doth, out of sons of men He maketh sons of God: because out of Son of God He hath made Son of Man. See what this participation is: there hath been promised to us a participation of Divinity: He lieth that hath promised, if He is not first made partaker of mortality. For the Son of God hath been made partaker of mortality, in order that mortal man may be made partaker of divinity. He that hath promised that His good is to be shared with thee, first with thee hath shared thy evil: He that to thee hath promised divinity, showeth in thee love. Therefore take away that men are sons of God, there remaineth that they are sons of men: “There is none that doeth good, is not so much as one.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"
