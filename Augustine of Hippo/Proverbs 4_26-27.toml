[[commentary]]
quote='''
Mark well the counsel which the Holy Ghost gives us by Solomon: "Make straight paths for thy feet, and order thy ways aright. Turn not aside to the right hand nor to the left, but turn away thy foot from the evil way; for the Lord knoweth the ways on the right hand, but those on the left are perverse. He will make thy ways straight, and will direct thy steps in peace." Now consider, my brethren, that in these words of Holy Scripture, if there were no free will, it would not be said, "Make straight paths for thy feet, and order thy ways; turn not aside to the right hand, nor to the left." Nor yet, were this possible for us to achieve without the grace of God, would it be afterwards added, "He will make thy ways straight, and will direct thy steps in peace."

Decline, therefore, neither to the right hand nor to the left, although the paths on the right hand are praised, and those on the left hand are blamed. This is why he added, "Turn away thy foot from the evil way,"—that is, from the left-hand path. This he makes manifest in the following words, saying, "For the Lord knoweth the ways on the right hand; but those on the left are perverse." In those ways we ought surely to walk which the Lord knows; and it is of these that we read in the Psalm, "The Lord knoweth the way of the righteous, but the way of the ungodly shall perish;" for this way, which is on the left hand, the Lord does not know. As He will also say at last to such as are placed on His left hand at the day of judgment: "I know you not." Now what is that which He knows not, who knows all things, both good and evil, in man? But what is the meaning of the words, "I know you not," unless it be that you are now such as I never made you? Precisely as that passage runs, which is spoken of the Lord Jesus Christ, that "He knew no sin." How knew it not, except that He had never made it? And, therefore, how is to be understood the passage, "The ways which are on the right hand the Lord knoweth," except in the sense that He made those ways Himself,—even "the paths of the righteous," which no doubt are "those good works that God," as the apostle tells us, "hath before ordained that we should walk in them"? Whereas the left-hand ways—those perverse paths of the unrighteous—He truly knows nothing of, because He never made them for man, but man made them for himself. Wherefore He says, "The perverse ways of the wicked I utterly abhor; they are on the left hand."

But the reply is made: Why did He say, "Turn not aside to the right hand, nor to the left," when he clearly ought rather to have said, Keep to the right hand, and turn not off to the left, if the right-hand paths are good? Why, do we think, except this, that the paths on the right hand are so good that it is not good to turn off from them, even to the right? For that man, indeed, is to be understood as declining to the right who chooses to attribute to himself, and not to God, even those good works which appertain to right-hand ways. Hence it was that after saying, "For the Lord knoweth the ways on the right hand, but those on the left hand are perverse," as if the objection were raised to Him, Wherefore, then, do you not wish us to turn aside to the right? He immediately added as follows: "He will Himself make thy paths straight, and will direct thy ways in peace." Understand, therefore, the precept, "Make straight paths for thy feet, and order thy ways aright," in such a sense as to know that whenever you do all this, it is the Lord God who enables you to do it. Then you will not turn off to the right, although you are walking in right-hand paths, not trusting in your own strength; and He will Himself be your strength, who will make straight paths for your feet, and will direct your ways in peace.

Wherefore, most dearly beloved, whosoever says, My will suffices for me to perform good works, declines to the right. But, on the other hand, they who think that a good way of life should be forsaken, when they hear God's grace so preached as to lead to the supposition and belief that it of itself makes men's wills from evil to good, and it even of itself keeps them what it has made them; and who, as the result of this opinion, go on to say, "Let us do evil that good may come,"—these persons decline to the left. This is the reason why he said to you, "Turn not aside to the right hand, nor to the left;" in other words, do not uphold free will in such wise as to attribute good works to it without the grace of God, nor so defend and maintain grace as if, by reason of it, you may love evil works in security and safety,—which may God's grace itself avert from you!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Letter 2, Sections 5-8"
