[[commentary]]
quote='''
But whereas by the sons of Ephrem he hath willed that there be understood the whole of that embittering generation, it is an expression signifying the whole by a part. And perhaps this part was chosen whereby to signify the whole, because from these men especially some good thing was to have been expected.…Although set at the left hand by his father as being the younger, Jacob nevertheless blessed with his right hand, and preferred him before his elder brother with a benediction of hidden meaning.…For there was being figured how they were to be last that were first, and first were to be they that were last, through the Saviour’s coming, concerning whom hath been said, “He that is coming after me was made before me.” In like manner righteous Abel was preferred before the elder brother; so to Ismael Isaac; so to Esau, though born before him, his twin brother Jacob; so also Phares himself preceded even in birth his twin brother, who had first thrust a hand out of the womb, and had begun to be born: so David was preferred before his elder brother: and as the reason why all these parables and others like them preceded, not only of words but also of deeds, in like manner to the people of the Jews was preferred the Christian people, for redeeming the which as Abel by Cain, so by the Jews was slain Christ. This thing was prefigured even when Jacob stretching out his hands cross-wise, with his right hand touched Ephrem standing on the left; and set him before Manasse standing on the right, whom he himself touched with the left hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
