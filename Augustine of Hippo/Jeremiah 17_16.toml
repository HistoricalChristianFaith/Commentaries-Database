[[commentary]]
quote='''
The Lord has indeed made every day—not only has made but also continues to make. I mean, he makes every day as follows: he makes his sun rise on the good and the bad and sends rain on the just and the unjust. So we are not to imagine that this ordinary kind of day, which is common to good and bad alike, is meant in this place, where we heard, "This is the day that the Lord has made." What particular sort of day can it be when it says, "Let us exult and be joyful in it"? What sort, but a good one? What sort, but a very choice, lovable, desirable one, the sort about which Jeremiah said, "And I have not yearned for the day of men, you know it well"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520229B.html'
source_title="SERMON 229B.2"

[[commentary]]
quote='''
Next we come to the passage where His brethren—that is to say, His relations according to the flesh—urge Him to go up to the feast-day, in order that He may have an opportunity of making Himself known to the multitude. And here, again, how supremely elevated is the tone of His reply! "My time is not yet come, but your time is alway ready. The world cannot hate you; but me it hateth, because I testify of it that the works thereof are evil." So it is the case, then, that "your time is alway ready," because ye desire that kind of day to which the prophet refers when he says, "But I have not laboured following Thee, O Lord; and the day of man I have not desired, Thou knowest:" that is to say, to soar to the light of the Word, and to desire that day which Abraham desired to see, and which he did see, and was glad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
