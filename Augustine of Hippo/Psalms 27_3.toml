[[commentary]]
quote='''
“If camps stand together against me, my heart will not fear.” But if the multitude of gain-sayers conspire to stand together against me, my heart will not fear, so as to go over to their side. “If war rise up against me, in this will I trust” (ver. 3). If the persecution of this world arise against me, in this petition, which I am pondering, will I place my hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
