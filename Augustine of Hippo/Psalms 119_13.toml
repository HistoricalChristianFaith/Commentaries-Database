[[commentary]]
quote='''
“With my lips have I been telling of all the judgments of Thy mouth” (ver. 13); that is, I have kept silent nothing of Thy judgments, which Thou didst will should become known to me through Thy words, but I have been telling of all of them without exception with my lips. This he seemeth to me to signify, since he saith not, all Thy judgments, but, “all the judgments of Thy mouth;” that is, which Thou hast revealed unto me: that by His mouth we may understand His word, which He hath discovered unto us in many revelations of the Saints, and in the two Testaments; all which judgments the Church ceaseth not to declare at all times with her lips.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
