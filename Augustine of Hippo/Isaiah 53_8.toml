[[commentary]]
quote='''
The Son of God, who is also the Son of man, our Lord Jesus Christ, born of the Father without mother, created every single day; born of his mother without father, he consecrated this particular day [Christmas Day]; invisible in his divine birth, visible in his human one, in each of them wonderful. Thus it is difficult to judge about which of the two the prophet is more likely to have prophesied, "Who shall tell the tale of his begetting?"—whether of that one in which, never not born, he has the Father co-eternal with himself; or of this one in which, born at a particular time, he had already made the mother of whom he would be made; whether of that one where he was always born, since he always was. Who, after all, will tell the tale of how light was born from light, and they were both one light; how God was born from God, and the number of gods did not increase?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520195.html'
source_title="SERMON 195:1"


[[commentary]]
quote='''
If you think this to be referred to the human generation by which he was born of a virgin, look into yourself and ask your soul whether the prophet would dare to declare the divine generation if words failed him for the human one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 242"


[[commentary]]
quote='''
To sum up, Christ was born both of a Father and of a mother; both without a father and without a mother; of a Father as God, of a mother as man; without a mother as God, without a Father as man.… "Who will recount his begetting," whether that one without time or this one without seed; that one without beginning or this one without precedent; that one which never was not, or this one which never was before or after that one which has no end, or this one which has its beginning in its end?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520184.html'
source_title="SERMON 184:3"

[[commentary]]
quote='''
The evangelist Matthew has commenced his narrative in these terms: "The book of the generation of Jesus Christ, the son of David, the son of Abraham." By this exordium he shows with sufficient clearness that his undertaking is to give an account of the generation of Christ according to the flesh. For, according to this, Christ is the Son of man,—a title which He also gives very frequently to Himself, thereby commending to our notice what in His compassion He has condescended to be on our behalf. For that heavenly and eternal generation, in virtue of which He is the only-begotten Son of God, before every creature, because all things were made by Him, is so ineffable, that it is of it that the word of the prophet must be understood when he says, "Who shall declare His generation?" Matthew therefore traces out the human generation of Christ, mentioning His ancestors from Abraham downwards, and carrying them on to Joseph the husband of Mary, of whom Jesus was born. For it was not held allowable to consider him dissociated from the married estate which was entered into with Mary, on the ground that she gave birth to Christ, not as the wedded wife of Joseph, but as a virgin. For by this example an illustrious recommendation is made to faithful married persons of the principle, that even when by common consent they maintain their continence, the relation can still remain, and can still be called one of wedlock, inasmuch as, although there is no connection between the sexes of the body, there is the keeping of the affections of the mind; particularly so for this reason, that in their case we see how the birth of a son was a possibility apart from anything of that carnal intercourse which is to be practised with the purpose of the procreation of children only. Moreover, the mere fact that he had not begotten Him by act of his own, was no sufficient reason why Joseph should not be called the father of Christ; for indeed he could be in all propriety the father of one whom he had not begotten by his own wife, but had adopted from some other person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 1"
