[[commentary]]
quote='''
“A horse is a deceitful thing for safety:” he is deceived, who thinketh either that through men he gaineth salvation received among men, or that by the impetuosity of his own courage he is defended from destruction. “In the abundance of his strength shall he not be saved” (ver. 17).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
