[[commentary]]
quote='''
But when did the people Israel eat the manna? After they had passed the Red Sea. And as to what the Red Sea signifies, hear the apostle: "Moreover, brethren, I would not have you ignorant, that all our fathers were under the cloud, and all passed through the sea." To what purpose passed they through the sea? As if thou wert asking of him, he goes on to say, "And all were baptized by Moses in the cloud and in the sea." Now, if the figure of the sea had such efficacy, how great will be the efficacy of the true form of baptism! If what was done in a figure brought the people, after they had crossed over, to the manna, what will Christ impart, in the verity of His baptism, to His own people: brought over through Himself? By His baptism He brings over them that believe; all their sins, the enemies as it were that pursue them, being slain, as all the Egyptians perished in that sea. Whither does He bring over, my brethren? Whither does Jesus bring over by baptism, of which Moses then showed the figure, when he brought them through the sea? Whither? To the manna. What is the manna? "I am," saith He, "the living bread, which came down from heaven." The faithful receive the manna, having now been brought through the Red Sea? Why Red Sea? Besides sea, why also "red"? That "Red Sea" signified the baptism of Christ. How is the baptism of Christ red, but as consecrated by Christ's blood? Whither, then, does He lead those that believe and are baptized? To the manna. Behold, "manna," I say: what the Jews, that people Israel, received, is well known, well known what God had rained on them from heaven; and yet catechumens know not what Christians receive. Let them blush, then, for their ignorance; let them pass through the Red Sea, let them eat the manna, that as they have believed in the name of Jesus, so likewise Jesus may trust Himself to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"
