[[commentary]]
quote='''
The Savior pointed out that Jonah the prophet, who having been tossed into the sea was caught in the belly of the whale and emerged on the third day, prefigured the Son of Man who would suffer and rise on the third day. The Jewish people were censured in comparison with the Ninevites, for the Ninevites, to whom Jonah the prophet had been sent by way of reproof, placated God's wrath by repenting and gained his mercy. "And behold," he said, "something greater than Jonah is here," the Lord Jesus implying himself. The Ninevites heard the servant and amended their ways; the Jews heard the Lord and not only did they not amend their ways but moreover they killed him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252072A.html'
source_title="SERMON 72A.1"

[[commentary]]
quote='''
(De Cons. Ev. iii. 24.) Some, not knowing the Scripture manner of speaking, would interpret as one night those three hours of darkness when the sun was darkened from the sixth to the ninth hour; and as a day in like manner those other three hours in which it was again restored to the world, from the ninth hour till sunset. Then follows the night preceding the sabbath, which if we reckon with its own day we shall have thus two days and two nights. Then after the sabbath follows the night of the sabbath prime, that is of the dawning of the Lord's day on which the Lord arose. Thus we shall only get two nights and two days, with this one night to be added if we might understand the whole of it, and it could not be shown that that dawn was indeed the latter part of the night. So that not even by taking in those six hours, three of darkness, and three of restored light, can we establish the computation of three days and three nights. It remains therefore that we find the explanation in that usual manner of Scripture of putting a part for the whole.

(De Trin. iv. 6.) For that the three days were not three full and entire days, Scripture witnesses; the first day is reckoned because the latter end of it comes in; and the third day is likewise reckoned, because the first part of it is included; while the day between, that is the second day, appears in all its twenty-four hours, twelve of the night and twelve of the day. For the succeeding night up to the dawn when the Lord's resurrection was made known, belongs to the third day. For as the first days of creation were, because of man's coming fall, computed from morning to night; so these days are because of man's restoration computed from night to morning.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Further, should we take the whole for a part, as Scripture sometimes uses this expression, I do not remember an instance in which the whole is taken for a part, when the word “whole” is expressly added. For in the passage of the Gospel where the Lord saith, “The Son of Man shall be three days and three nights in the heart of the earth,” it is no extraordinary licence to take the whole for the part, the expression not being for three “whole” days and three whole nights: since the one intermediate day was a whole one, the other two were parts, the last being part of the first day, the first part of the last.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252088.html'
source_title="Exposition on Psalm 88"

[[commentary]]
quote='''
For the space of three days, which elapsed between the Lord's death and resurrection, cannot be correctly understood except in the light of that form of expression according to which the part is dealt with as the whole. For He said Himself, "For as Jonas was three days and three nights in the whale's belly, so shall the Son of man be three days and three nights in the heart of the earth." Now, in whichever way we reckon the times, whether from the point when He yielded up the ghost, or from the date of his burial, the sum does not come out clearly, unless we take the intermediate day, that is to say, the Sabbath, as a complete day—in other words, a full day along with its night,—and, on the other hand, understand those days between which that one intervenes—that is to say, the day of the preparation and the first day of the week, which we designate the Lord's day—to be dealt with on the principle of the part standing for the whole. For of what avail is it that some, hard pressed by these difficulties, and not knowing the very large part which the mode of expression referred to—namely, that which takes the part as the whole—plays in the matter of solving the problems presented in the Holy Scriptures, have struck out the idea of reckoning as a distinct night those three hours, namely, from the sixth hour to the ninth, during which the sun was darkened, and as a distinct day the other three hours, during which the sun was restored again to the lands, that is to say, from the ninth hour on to its setting? For the night connected with the coming Sabbath follows, and if we compute it along with its day, there will then be two days and two nights. But, further, after the Sabbath there comes in the night connected with the first day of the week, that is to say, with the dawning of the Lord's day, which was the time when the Lord arose. Consequently, the result to which this mode of calculation leads us will be just two days and two nights, and one night, even supposing it possible to take the last as a complete night, and taking it for granted that we were not to show that the said dawn was in reality the ultimate portion of the same. Thus it would appear that, even although we were to compute these six hours in that fashion, during three of which the sun was darkened, and during the other three of which it shone forth again, we would not establish a satisfactory reckoning of three days and three nights. In accordance, therefore, with the usage which meets us so frequently in the language of the Scriptures, and which deals with the part as the whole, it remains for us to hold the time of the preparation to constitute the day at the one extremity, on which the Lord was crucified and buried, and, from that limit, to find one whole day along with its night which was fully spent. In this way, too, we must take the intermediate member, that is to say the day of the Sabbath, not as calculated simply from the part, but as a really complete day. The third day, again, must be computed from its first part; that is to say, calculating from the night, we must look upon it as making up a whole day when its day-portion is connected with it. Thus we shall get a space of three days, on the analogy of a case already considered, namely, those eight days after which the Lord went up into a mountain; with respect to which period we find that Matthew and Mark, fixing their attention simply on the complete days intervening, have put it thus, "After six days," whereas Luke's representation of the same is this, "An eight days after."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 24"
