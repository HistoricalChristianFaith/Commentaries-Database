[[commentary]]
quote='''
[The psalmist is saying] "O Lord, why give me some other inheritance? Whatever you give, it isn't worth much. You be my inheritance; I love you, I love you with all I am, with all my heart, with all my soul, with all my mind I love you. What can it mean to me, anything you give me apart from yourself?" That is to love God freely, to hope in God for God, to hasten to be filled with God, to be satisfied with him. He, after all, is enough for you; apart from him, nothing is enough for you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520334.html'
source_title="SERMON 334:3"

[[commentary]]
quote='''
He did not fear to have joint-heirs, because His heritage does not become narrow if many are possessors. Those very persons, He being possessor, become His inheritance, and He in turn becomes their inheritance. Hear in what manner they become His inheritance: "The Lord hath said unto me, Thou art my Son, this day have I begotten Thee. Ask of me, and I will give Thee the nations for Thine inheritance." Hear in what manner He becomes their inheritance. He says in the Psalms: "The Lord is the portion of mine inheritance, and of my cup." Let us possess Him, and let Him possess us: let Him possess us as Lord; let us possess Him as salvation, let us possess Him as light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25202.html'
source_title="Tractates on John 2"

[[commentary]]
quote='''
“The Lord is the portion of Mine inheritance, and of My cup” (ver. 5). For together with Me they shall possess the inheritance, the Lord Himself. Let others choose for themselves portions, earthly and temporal, to enjoy: the portion of the Saints is the Lord eternal. Let others drink of deadly pleasures, the portion of My cup is the Lord. In that I say, “Mine,” I include the Church: for where the Head is, there is the body also. For into the inheritance will I gather together their assemblies, and by the inebriation of the cup I will forget their old names. “Thou art He who will restore to Me My inheritance:” that to these too, whom I free, may be known “the glory wherein I was with Thee before the world was made.” For Thou wilt not restore to Me that which I never lost, but Thou wilt restore to these, who have lost it, the knowledge of that glory: in whom because I am, Thou wilt restore to Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
