[[commentary]]
quote='''
“For, lo, sinners have bent the bow, they have prepared their arrows in the quiver, that they may in the obscure moon shoot at the upright in heart” (ver. 2). These be the terrors of those who threaten us as touching sinners, that we may pass over to them as the righteous. “Lo,” they say, “the sinners have bent the bow:” the Scriptures, I suppose, by carnal interpretation of which they emit envenomed sentences from them. “They have prepared their arrows in the quiver:” the same words, that is, which they will shoot out on the authority of Scripture, they have prepared in the secret place of the heart. “That they may in the obscure moon shoot at the upright in heart:” that when they see, from the Church’s light being obscured by the multitude of the unlearned and the carnal, that they cannot be convicted, they may corrupt good manners by evil communications. But against all these terrors we must say, “In the Lord I trust.”

Now I remember that I promised to consider in this Psalm with what suitableness the moon signifies the Church. There are two probable opinions concerning the moon: but of these which is the true, I suppose it either impossible or very difficult for a man to decide. For when we ask whence the moon has her light, some say that it is her own, but that of her globe half is bright, and half dark: and when she revolves in her own orbit, that part wherein she is bright gradually turns towards the earth, so as that it may be seen by us; and that therefore at first her appearance is as if she were horned.…According to this opinion the moon in allegory signifies the Church, because in its spiritual part the Church is bright, but in its carnal part is dark: and sometimes the spiritual part is seen by good works, but sometimes it lies hid in the conscience, and is known to God alone, since in the body alone is it seen by men.…But according to the other opinion also the moon is understood to be the Church, because she has no light of her own, but is lighted by the only-begotten Son of God, who in many places of holy Scripture is allegorically called the Sun. Whom certain heretics being ignorant of, and not able to discern Him, endeavour to turn away the minds of the simple to this corporeal and visible sun, which is the common light of the flesh of men and flies, and some they do pervert, who as long as they cannot behold with the mind the inner light of truth, will not be content with the simple Catholic faith; which is the only safety to babes, and by which milk alone they can arrive in assured strength at the firm support of more solid food. Whichever then of these two opinions be the true, the moon in allegory is fitly understood as the Church. Or if in such difficulties as these, troublesome rather than edifying, there be either no satisfaction or no leisure to exercise the mind, or if the mind itself be not capable of it, it is sufficient to regard the moon with ordinary eyes, and not to seek out obscure causes, but with all men to perceive her increasings and fulnesses and wanings; and if she wanes to the end that she may be renewed, even to this rude multitude she sets forth the image of the Church, in which the resurrection of the dead is believed.

Next we must enquire, what in this Psalm is meant by “the obscure moon,” in which sinners have prepared to shoot at the upright in heart? For not in one way only may the moon be said to be obscure: for when her monthly course is finished, and when her brightness is interrupted by a cloud, and when she is eclipsed at the full, the moon may be called obscure. It may then be understood first of the persecutors of the Martyrs, for that they wished in the obscure moon to shoot at the upright in heart; whether it be yet in the time of the Church’s youth, because she had not yet shone forth in greatness on the earth, and conquered the darkness of heathen superstitions; or by the tongues of blasphemers and such as defame the Christian name, when the earth was as it were beclouded, the moon, that is, the Church, could not be clearly seen; or when by the slaughter of the Martyrs themselves and so great effusion of blood, as by that eclipse and obscuration, wherein the moon seems to exhibit a bloody face, the weak were deterred from the Christian name; in which terror sinners shot out words crafty and sacrilegious to pervert even the upright in heart. And secondly, it can be understood of these sinners, whom the Church contains, because at that time, taking the opportunity of this moon’s obscurity, they committed many crimes, which are now tauntingly objected to us by the heretics, whereas their founders are said to have been guilty of them. But howsoever that be which was done in the obscure moon, now that the Catholic name is spread and celebrated throughout the whole world, what concern of mine is it to be disturbed by things unknown? For “in the Lord I trust;” nor do I listen to them that say to my soul, “Remove into the mountains as a sparrow. For, lo, sinners have bent the bow, that they may in the obscure moon shoot at the upright in heart.” Or if the moon seem even now obscure to them, because they would make it uncertain which is the Catholic Church, and they strive to convict her by the sins of those many carnal men whom she contains; what concern is this to him, who says in truth, “In the Lord I trust”? By which word every one shows that he is himself wheat, and endures the chaff with patience unto the time of winnowing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252011.html'
source_title="Exposition on Psalm 11"
