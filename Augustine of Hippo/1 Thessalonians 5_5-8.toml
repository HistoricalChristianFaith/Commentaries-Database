[[commentary]]
quote='''
And worthy things we ought to work: that is, as though in the light, since by Christ showing the way we work. Whosoever worketh evil things, in the night he worketh, not in the dawn; according to the Apostle, saying, “They that are drunken, in the night are drunken; and they that sleep, in the night do sleep; let us that are of the day, be sober.” He exhorteth us that after the day we should walk honestly: “As in the day, honestly let us walk.” And again, “Ye,” he saith, “are sons of light, and sons of day; we are not of night nor of darkness.” Who are sons of night, and sons of darkness? They that work all evil things. To such a degree they are sons of night, that they fear lest the things which they work should be seen.…No one therefore in the dawn worketh, except him that in Christ worketh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
