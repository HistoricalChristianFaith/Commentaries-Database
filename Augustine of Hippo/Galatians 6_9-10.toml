[[commentary]]
quote='''
“And his seed is blessed.” Here too let not any carnal notion suggest itself. We see many of the sons of the righteous dying of hunger; in what sense then will his seed be blessed? His seed is that which remains of him afterwards; that wherewith he soweth here, and will hereafter reap. For the Apostle says, “Let us not be weary in well-doing; for in due season we shall reap if we faint not. As we have therefore time,” he says, “let us do good unto all men.” This is that “seed” of thine which shall “be blessed.” You commit it to the earth, and gather ever so much more; and dost thou lose it in committing it to Christ? See it expressly termed “seed” by the Apostle, when he was speaking of alms. For this he saith; “He which soweth sparingly, shall reap also sparingly; and he which soweth in blessings, shall also reap in blessings.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
