[[commentary]]
quote='''
(de Cons. Ev. lib. ii. c. 39.) Luke indeed relates this in the same place as Matthew, but in a somewhat different order. But who does not see that it is an idle question, in what order our Lord said those things, seeing that we ought to learn by the most precious authority of the Evangelist, that there is no falsehood. But not every man will repeat another's words in the same order in which they proceeded from his mouth, seeing that the order itself makes no difference with respect to the fact, whether it be so or not.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And by his present version Luke indicates that this discourse of the Lord was of greater length than we might otherwise have supposed; and he records certain topics handled in it, which resemble those which are mentioned by Matthew in his recital of the sermon which was delivered on the mount. So that we take these words to have been spoken twice over, to wit, on that previous occasion, and again on this one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 39"
