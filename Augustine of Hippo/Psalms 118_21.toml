[[commentary]]
quote='''
“I will confess unto Thee, O Lord, for Thou hast heard me, and art become my salvation” (ver. 21). How often is that confession proved to be one of praise, that doth not point out wounds to the physician, but giveth thanks for the health it hath received. But the Physician Himself is the Salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
