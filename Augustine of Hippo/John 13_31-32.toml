[[commentary]]
quote='''
But after saying, "Now is the Son of man glorified," He added, "and God is glorified in Him." For this is itself the glorifying of the Son of man, that God should be glorified in Him. For if He is not glorified in Himself, but God in Him, then it is He whom God glorifies in Himself. And just as if to give them this explanation, He furthers adds: "If God is glorified in Him, God shall also glorify Him in Himself." That is, "If God is glorified in Him," because He came not to do His own will, but the will of Him that sent Him; "and God shall glorify Him in Himself," in such wise that the human nature, in which He is the Son of man, and which was so assumed by the eternal Word, should also be endowed with an eternal immortality. "And," He says, "He shall straightway glorify Him;" predicting, to wit, by such an asseveration, His own resurrection in the immediate future, and not, as it were, ours in the end of the world. For it is this very glorification of which the evangelist had previously said, as I mentioned a little ago, that on this account the Spirit was not yet in their case given in that new way, in which He was yet to be given after the resurrection to those who believed, because that Jesus was not yet glorified: that is, mortality was not yet clothed with immortality, and temporal weakness transformed into eternal strength. This glorification may also be indicated in the words, "Now is the Son of man glorified;" so that the word "now" may be supposed to refer, not to His impending passion, but to His closely succeeding resurrection, as if what was now so near at hand had actually been accomplished. Let this suffice your affection to-day; we shall take up, when the Lord permits us, the words that follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252063.html'
source_title="Tractates on John 63"
