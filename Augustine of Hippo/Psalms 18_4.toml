[[commentary]]
quote='''
“The pains of death,” that is, of the flesh, have “compassed Me about. And the overflowings of ungodliness have troubled Me” (ver. 4). Ungodly troubles stirred up for a time, like torrents of rain which will soon subside, have come on to trouble Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
