[[commentary]]
quote='''
“The saints shall exult in glory” (ver. 5). I would say somewhat important about the glory of the saints. For there is no one who loveth not glory. But the glory of fools, popular glory as it is called, hath snares to deceive, so that a man, influenced by the praises of vain men, shall be willing to live in such fashion as to be spoken of by men, whosoever they be, in whatsoever way. Hence it is that men, rendered mad, and puffed up with pride, empty within, without swollen, are willing ever to ruin their fortunes by bestowing them on stage-players, actors, men who fight with wild beasts, charioteers. What sums they give, what sums they spend! They lavish the powers not only of their patrimony, but of their minds too. They scorn the poor, because the people shouteth not that the poor should be given to, but the people do shout that the fighter with wild beasts be given to. When then no shout is raised to them, they refuse to spend; when madmen shout to them, they are mad too: nay, all are mad, both performer, and spectator, and the giver. This mad glory is blamed by the Lord, is offensive in the eyes of the Almighty.…Thou choosest to clothe the fighter with wild beasts, who may be beaten, and make thee blush: Christ is never conquered; He hath conquered the devil, He hath conquered for thee, and to thee, and in thee; such a conqueror as this thou choosest not to clothe. Wherefore? Because there is less shouting, less madness about it. They then who delight in such glory, have an empty conscience. Just as they drain their chests, to send garments as presents, so do they empty their conscience, so as to have nothing precious therein.

But the saints who “exult in glory,” no need is there for us to say how they exult: just hear the verse of the Psalm which followeth: “The saints shall exult in glory, they shall rejoice in their beds:” not in theatres, or amphitheatres, or circuses, or follies, or market places, but “in their chambers.” What is, “in their chambers”? In their hearts. Hear the Apostle Paul exulting in his closet: “For this is our glory, the testimony of our conscience.” On the other hand, there is reason to fear lest any be pleasing to himself, and so seem to be proud, and boast of his conscience. For every one ought to exult with fear, for that wherein he exulteth is God’s gift, not his own desert. For there be many that please themselves, and think themselves righteous; and there is another passage which goeth against them, which saith, “Who shall boast that he hath a clean heart, and that he is pure from sin?” There is then, so to speak, a limit to glorying in our conscience, namely, to know that thy faith is sincere, thy hope sure, thy love without dissimulation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
