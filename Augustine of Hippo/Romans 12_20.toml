[[commentary]]
quote='''
When he says: If your enemy is hungry, feed him; if he thirsts, give him drink; for in doing this you will heap coals of fire upon his head, it can seem to many to contradict that saying by which the Lord commanded that we love our enemies and pray for those who persecute us, or even this which the same Apostle said above: Bless those who persecute you; bless, and do not curse, and again: Rendering to no one evil for evil. For how does anyone love him to whom he gives food and drink for the purpose of heaping coals of fire upon his head, if coals of fire in this place signify some grievous punishment? Wherefore it must be understood that this was said so that we might provoke him who has injured us to repentance for his deed, when we do good to him. For these coals of fire avail for the burning, that is, the contrition of the spirit, which is as it were the head of the soul, in which all malice is burned away, when a man is changed for the better through repentance—like those coals of fire of which it is said in the Psalms: What shall be given you, or what shall be added to you, against a deceitful tongue? The sharp arrows of the mighty, with devastating coals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
