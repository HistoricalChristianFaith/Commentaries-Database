[[commentary]]
quote='''
“They said, Aha, Aha, our eyes have seen it” (ver. 21): that is, Thy deeds, Thy miracles. This Man is the Christ. “If He be the Christ, let Him come down from the Cross, and we will believe Him. He saved others, Himself He cannot save.” “Our eyes have seen it.” This is all whereof He boasted Himself, when “He called Himself the Son of God.” But the Lord was hanging patient upon the Cross: His power had He not lost, but He showed His patience. For what great thing was it for Him to come down from the Cross, who could afterward rise again from the sepulchre? But He seems to have yielded to His insulters; and this, beloved, that having risen again He should show Himself to His own, and not to them, and this is a great mystery; for His resurrection signified the New Life, but the New Life is known to His friends, not to His enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
