[[commentary]]
quote='''
“Deliver my soul, O Lord, from unrighteous lips, and from a deceitful tongue” (ver. 2). What is a deceitful tongue? A treacherous tongue, one that hath the semblance of counsel, and the bane of real mischief. Such are those who say, And wilt thou do this, that nobody doth? Wilt thou be the only Christian?…Some deter by dissuasion, others discourage yet more by their praise. For since such is the life that hath for some time been diffused over the world, so great is the authority of Christ, that not even a pagan ventureth to blame Christ. He who cannot be censured is read. They cannot contradict Christ, they cannot contradict the Gospel, Christ cannot be censured; the deceitful tongue turneth itself to praise as an hindrance. If thou praisest, exhort. Why dost thou discourage with thy praise?…Thou turnest thyself to another mode of dissuasion, that by false praise thou mayest turn me away from true praise; nay, that by praising Christ thou mayest keep me away from Christ, saying, What is this? Behold these men have done this: thou, perhaps, wilt not be able: thou beginnest to ascend, thou fallest. It seemeth to warn thee: it is the serpent, it is the deceitful tongue, it hath poison. Pray against it, if thou wishest to ascend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520120.html'
source_title="Exposition on Psalm 120"
