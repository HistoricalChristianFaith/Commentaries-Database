[[commentary]]
quote='''
And the words, “them that trouble us,” in the former Psalm, are the same with “our enemies,” in this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520108.html'
source_title="Exposition on Psalm 108"
