[[commentary]]
quote='''
"It was winter. And Jesus walked in the temple in Solomon's porch. Then came the Jews round about Him, and said unto Him, How long dost thou keep our mind in suspense? If thou be the Christ, tell us plainly." They were not desiring the truth, but preparing a calumny. "It was winter," and they were chill; because they were slow to approach that divine fire. For to approach is to believe: he who believes, approaches; who denies, retires. The soul is not moved by the feet, but by the affections. They had become icy cold to the sweetness of loving Him, and they burned with the desire of doing Him an injury. They were far away, while there beside Him. It was not with them a nearer approach in believing, but the pressure of persecution. They sought to hear the Lord saying, I am Christ; and probably enough they only thought of the Christ in a human way. The prophets preached Christ; but the Godhead of Christ asserted in the prophets and in the gospel itself is not perceived even by heretics; and how much less by Jews, so long as the vail is upon their heart? In short, in a certain place, the Lord Jesus, knowing that their views of the Christ were cast in a human mould, not in the Divine, taking His stand on the human ground, and not on that where along with the assumption of humanity He also continued Divine, He said to them, "What think ye of Christ? Whose Son is He?" Following their own opinion, they replied, "Of David." For so they had read, and this only they retained; because while they read of His divinity, they did not understand it. But the Lord, to pin them down to some inquiry touching the divinity of Him whose apparent weakness they despised, answered them: "How, then, doth David in spirit call Him Lord, saying, The Lord said unto my Lord, Sit Thou on my right hand, till I put Thine enemies under Thy feet? If David, then, in spirit call Him Lord, how is He his son?" He did not deny, but questioned. Let no one think, on hearing this, that the Lord Jesus denied that He was the Son of David. Had Christ the Lord given any such denial, He would not have enlightened the blind who so addressed Him. For as He was passing by one day, two blind men, who were sitting by the wayside, cried out, "Have mercy upon us, thou Son of David." And on hearing these words He had mercy on them. He stood still, healed, enlightened them; for He owned the name. The Apostle Paul also says, "Who was made of the seed of David according to the flesh;" and in his Epistle to Timothy, "Remember that Jesus Christ was raised from the dead, [He that is] of the seed of David, according to my gospel." For the Virgin Mary drew her origin, and hence our Lord also, from the seed of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"
