[[commentary]]
quote='''
To wit, “because of deceitfulness Thou hast set upon them” (ver. 18). Because deceitful they are, that is fraudulent; because deceitful they are, they suffer deceits. What is this, because fraudulent they are they suffer a fraud? They desire to play a fraud upon mankind in all their naughtinesses, they themselves also suffer a fraud, in choosing earthly good things, and in forsaking the eternal. Therefore, brethren, in their very playing off a fraud they suffer a fraud. In that which but now I said, brethren, “What manner of wit hath he who to gain a garment doth lose his fidelity?” hath he whose garment he hath taken suffered a fraud, or he that is smitten with so great a loss? If a garment is more precious than fidelity, the former doth suffer the greater loss: but if incomparably good faith doth surpass the whole world, the latter shall seem to have sustained the loss of a garment; but to the former is said, “What doth it profit a man if he gain the whole world, but suffer the loss of his own soul?” Therefore what hath befallen them? “Because of deceitfulness Thou hast set for them: Thou didst throw them down while they were being exalted.” He hath not said, Thou didst throw them down because they were lifted up: not as it were after that they were lifted up Thou didst throw them down; but in their very lifting up they were thrown down. For thus to be lifted up is already to fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"

[[commentary]]
quote='''
The proud man raiseth himself up against God: God sinketh him: and he sinketh by the very act of raising himself up against God. For in another Psalm he thus saith, “Thou hast cast them down, while they were being exalted.” He said not, Thou hast cast them down, because they were exalted; or, Thou hast cast them down, after they were exalted; so that the period of their exaltation be one, of their casting down another: but in the very act of their exaltation were they cast down. For in proportion as the heart of man is proud, so doth it recede from God; and if it recede from God, it sinketh down into the deep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
