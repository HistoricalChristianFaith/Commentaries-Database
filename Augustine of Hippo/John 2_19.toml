[[commentary]]
quote='''
Then, after noticing the few days spent in Capharnaum, the evangelist comes again to the temple, where he states that Jesus spoke of the temple of His body in these terms: "Destroy this temple, and in three days I will raise it up:" in which declaration emphatic intimation is given not only that God was in that temple in the person of the Word that was made flesh, but also that He Himself raised the said flesh to life, in the veritable exercise of that prerogative which He has in His oneness with the Father, and according to which He does not act separately from Him; whereas it will perhaps be found that, in all other passages, the phrase which Scripture employs is one to the effect that God raised Him: neither is there any such expression found anywhere else as that, when God raised Christ, Christ also raised Himself, because He is one God with the Father; which is the import of the passage now before us, in which He says, "Destroy this temple, and in three days I will raise it up."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 10"
