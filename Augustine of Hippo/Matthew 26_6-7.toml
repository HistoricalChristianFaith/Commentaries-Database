[[commentary]]
quote='''
(de Cons. Ev. ii, 79.) Though the action described in Luke is the same as that described here, and the name of him with whom the Lord supped is the same, for Luke also names Simon; yet because it is not contrary to either nature or custom for two men to bear the same name, it is more probable that this was another Simon, not the leper, in whose house in Bethany these things were done. I would only suppose that the woman who on that occasion came near to Jesus' feet, and this woman, were not two different persons, but that the same Mary did this twice. The first time is that narrated by Luke; for John mentions it in praise of Mary before Christ's coming to Bethany, It was that Mary who anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick. (John 11:2.) Mary therefore had done this before. That she did afterwards in Bethany is distinct from Luke's account, but is the same event that is recorded by all three, John, Matthew, and Mark. That Matthew and Mark say it was the Lord's head that she anointed, and John His feet, is reconciled by supposing that she anointed both. Against this one might raise a cavil from what Mark says, that she anointed His head by breaking the box over it, so that there could be none of the ointment left with which to anoint His feet also. Let such caviller understand, that His feet were first anointed before the box was broken, and there remained in it, yet whole, enough wherewith to anoint the head by breaking the box and shedding the contents.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew, then, continuing his narrative from the point up to which we had concluded its examination, proceeds in the following terms: "Then assembled together the chief priests and the elders of the people unto the palace of the high priest, who was called Caiaphas, and consulted that they might take Jesus by subtilty and kill Him: but they said, Not on the feast-day, lest there be an uproar among the people. Now when Jesus was in Bethany, in the house of Simon the leper, there came unto Him a woman having an alabaster box of precious ointment, and poured it on His head as He sat at meat;" and so on down to the words, "there shall also this that this woman hath done be told for a memorial of her." The scene with the woman and the costly ointment at Bethany we have now to consider, as it is thus detailed. For although Luke records an incident resembling this, and although the name which he assigns to the person in whose house the Lord was supping might also suggest an identity between the two narratives (for Luke likewise names the host "Simon"), still, since there is nothing either in nature or in the customs of men to make the case an incredible one, that as one man may have two names, two men may with all the greater likelihood have one and the same name, it is more reasonable to believe that the Simon in whose house [it is thus supposed, according to Luke's version, that] this scene at Bethany took place, was a different person from the Simon [named by Matthew]. For Luke, again, does not specify Bethany as the place where the incident which he records happened. And although it is true that he in no way particularizes the town or village in which that occurrence took place, still his narrative does not seem to deal with the same locality. Consequently, my opinion is, that there is but one interpretation to be put upon the matter. That is not, however, to suppose that the woman who appears in Matthew was an entirely different person from the woman who approached the feet of Jesus on that occasion in the character of a sinner, and kissed them, and washed them with her tears, and wiped them with her hair, and anointed them with ointment, in reference to whose case Jesus also made use of the parable of the two debtors, and said that her sins, which were many, were forgiven her because she loved much. But my theory is, that it was the same Mary who did this deed on two separate occasions, the one being that which Luke has put on record, when she approached Him first of all in that remarkable humility, and with those tears, and obtained the forgiveness of her sins. For John, too, although he has not given the kind of recital which Luke has left us of the circumstances connected with that incident, has at least mentioned the fact, in commending the same Mary to our notice, when he has just begun to tell the story of the raising of Lazarus, and before his narrative brings the Lord to Bethany itself. The history which he offers us of that transaction proceeds thus: "Now a certain man was sick, named Lazarus, of Bethany, the town of Mary, and her sister Martha. It was that Mary which anointed the Lord with ointment, and wiped His feet with her hair, whose brother Lazarus was sick." By this statement John attests what Luke has told us when he records a scene of this nature in the house of a certain Pharisee, whose name was Simon. Here, then, we see that Mary had acted in this way before that time. And what she did a second time in Bethany is a different matter, which does not belong to Luke's narrative, but is related by three of the evangelists in concert, namely, John, Matthew, and Mark.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 79"
