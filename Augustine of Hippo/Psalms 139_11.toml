[[commentary]]
quote='''
And considering the length of the way, what said he to himself? “And I said, Peradventure the darkness shall overwhelm me” (ver. 11). Lo, now I have believed in Christ, now am I wafted aloft on the wings of twofold love.…Regarding the length of the way, I said to myself, “And the night was light in my delight.” The night was made to me light, because in the night I despaired of being able to cross so great a sea, to surmount so long a journey, to reach the utmost parts by persevering to the end. Thanks to Him who sought me when a runaway, who smote my back with strokes of the scourge, who by calling me recalled me from destruction, who made my night light. For it is night so long as we are passing through this life. How was the night made light? Because Christ came down into the night.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
