[[commentary]]
quote='''
(de Con. Ev. l. ii. c. 53.) Now it may raise a question, that Luke says that our Lord asked His disciples, Whom do men say that I am, at the same time that He was alone praying, and they also were with Him; whereas Mark says, that they were asked this question by our Lord on the way; but this is difficult only to him who never prayed on the way.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
On the other hand, Luke, after the record of the miracle of the five loaves, passes to another subject, and diverges from this order of narration. For he makes no mention of that little ship, and of the Lord's pathway over the waters. But after the statement conveyed in these words, "And they did all eat, and were filled, and there was taken up of fragments that remained to them twelve baskets," he has subjoined the following notice: "And it came to pass, as He was alone praying, His disciples were with Him; and He asked them, saying, Who say the people that I am?" Thus he relates in this succession something new, which is not given by those three who have left us the account of the manner in which the Lord walked upon the waters, and came to the disciples when they were on the voyage. It ought not, however, on this account, to be supposed that it was on that same mountain to which Matthew has told us He went up in order to pray alone, that He said to His disciples, "Who say the people that I am?" For Luke, too, seems to harmonize with Matthew in this, because his words are, "as He was alone praying;" while Matthew's were, "He went up unto a mountain alone to pray." But it must by all means be held to have been on a different occasion that He put this question, since [it is said here, both that] He prayed alone, and [that] the disciples were with Him. Thus Luke, indeed, has mentioned only the fact of His being alone, but has said nothing of His being without His disciples, as is the case with Matthew and John, since [according to these latter] they left Him in order to go before Him to the other side of the sea. For with unmistakeable plainness Luke has added the statement that "His disciples also were with Him." Consequently, in saying that He was alone, he meant his statement to refer to the multitudes, who did not abide with Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 47"

[[commentary]]
quote='''
Matthew continues thus: "And Jesus came into the coasts of Cæsarea Philippi; and He asked His disciples, saying, Whom do men say that I, the Son of man, am? And they said, Some say that Thou art John the Baptist; some, Elias; and others, Jeremias, or one of the prophets;" and so on, down to the words," And whatsoever thou shalt loose on earth shall be loosed in heaven." Mark relates this nearly in the same order. But he has brought in before it a narrative which is given by him alone,—namely, that regarding the giving of sight to that blind man who said to the Lord, "I see men as trees walking." Luke, again, also records this incident, inserting it after his account of the miracle of the five loaves; and, as we have already shown above, the order of recollection which is followed in his case is not antagonistic to the order adopted by these others. Some difficulty, however, may be imagined in the circumstance that Luke's representation bears that the Lord put this question, as to whom men held Him to be, to His disciples at a time when He was alone praying, and when His disciples were also with Him; whereas Mark, on the other hand, tells us that the question was put by Him to the disciples when they were on the way. But this will be a difficulty only to the man who has never prayed on the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 53"
