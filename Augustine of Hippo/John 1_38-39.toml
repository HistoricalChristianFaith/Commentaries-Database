[[commentary]]
quote='''
"What seek ye?" They said unto Him, "Rabbi (which is to say, being interpreted, Master), where dwellest Thou? He says to them, Come and see. And they came and saw where He dwelt, and abode with Him that day: and it was about the tenth hour." Do we think that it did in no wise pertain to the evangelist to tell us what hour it was? Is it possible that he wished us to give heed to nothing in that, to inquire after nothing? It was the tenth hour. That number signifies the law, because the law was given in ten commandments. But the time had come for the law to be fulfilled by love, because it could not be fulfilled by the Jews by fear. Hence the Lord says, "I am not come to destroy the law, but to fulfill." Suitably, then, at the tenth hour did these two follow Him, at the testimony of the friend of the Bridegroom, and that He at the tenth hour heard" Rabbi (which is interpreted, Master)." If at the tenth hour the Lord heard Rabbi, and the tenth number pertains to the law, the master of the law is no other than the giver of the law. Let no one say that one gave the law, and that another teaches the law: for the same teaches it who gave it; He is the Master of His own law, and teaches it. And mercy is in His tongue therefore mercifully teacheth He the law, as it is said regarding wisdom, The law and mercy doth she carry in her tongue." Do not fear that thou art not able to fulfill the law, flee to mercy. If thou canst not fulfill the law, make use of that covenant, make use of the bond, make use of the prayers which the heavenly One, skilled in the law, has ordained and composed for you.

For those who have a cause, and wish to supplicate the emperor, seek for some one skilled in the law, and trained in the schools, to compose their petition for them; lest perchance, if they ask in an unbecoming manner, they not only do not obtain what they seek, but get punishment instead of a benefit. When, therefore, the apostles sought to petition, and could not find how to approach the Emperor God, they said unto Christ, "Lord, teach us to pray;" that is to say, "O thou who art our skilled One in the law, our Assessor, yea, the Concessor of God, compose for us prayers." And the Lord taught them from the book of the celestial law, taught them how to pray; and in that which He taught, He laid down a certain condition: "Forgive us our debts, as we also forgive our debtors." If thou seekest not according to the law, thou becomest guilty. Dost thou not tremble before the Emperor, having become guilty? Offer the sacrifice of humility, offer the sacrifice of mercy; pray, saying, Forgive me, for I also forgive. But if thou sayest, do. For what wilt thou do? whither wilt thou go if thou hast lied in thy prayers? Not as it is said in the forum, thou shalt lose the benefit of the rescript; but thou shall not obtain a rescript. For it is the law of the forum that he who shall have lied in his petition shall derive no benefit from that which he has obtained. But this among men, because a man can be deceived: the emperor might have been deceived, when thou didst address to him thy petition; for thou saidest what thou wouldest, and he to whom thou didst speak knew not whether it was true or false; he sent thee away to thy adversary to be confuted if possible, so that if before the judge thou shouldest be convicted of falsehood (because he was not able not to grant the rescript, not knowing whether thou hadst lied), thou shouldest lose the benefit of the rescript, in the place to which thou hadst taken it. But God, who knows whether thou liest or speakest the truth, does not cause thee to lose in the judgment the benefit, but does not permit thee to obtain it, because thou hast dared to lie to the Truth.

What, then, wilt thou do? Tell me. To fulfill the law in every part, so as to offend in nothing, is difficult: the condition of guilt is therefore certain; wilt thou refuse to use the remedy? Behold, my brethren, what a remedy the Lord hath provided for the sicknesses of the soul! What then? When thy head aches, we praise thee if thou placest the gospel at thy head, instead of having recourse to an amulet. For so far has human weakness proceeded, and so lamentable is the estate of those who have recourse to amulets, that we rejoice when we see a man who is upon his bed, and tossed about with fevers and pains, placing his hope on nothing else than that the gospel lies at his head; not because it is done for this purpose, but because the gospel is preferred to amulets. If, then, it is placed at the head to allay the pain of the head, is it not placed at the heart to heal it from sin? Let it be done then. Let what be done? Let it be placed at the heart, let the heart be healed. It is well,-well that thou shouldest have no further care regarding the safety of the body, than to ask it from God. If He knows that it will do thee good, He will give it thee; if He give it not to thee, it would not have profited thee to have it. How many are sick in bed, and for that reason are innocent! for if they were to recover, they would go forth to commit acts of wickedness. To how many is health an injury! The robber who goes forth to the narrow path to slay a man, how much better for him would it have been to have been sick! And he who rises by night to dig through his neighbor's wall, how much better for him to be tossed by fever! If he were ill, he would have been comparatively innocent; being well, he is guilty of wickedness. It is known, then, to God what is expedient for us: let us make this only our endeavor, that our hearts be whole from sins; and when it happens that we are scourged in the body, let us pray to Him for relief. The Apostle Paul besought Him that He would take away the thorn in his flesh, and He would not. Was he disturbed? Was he filled with sadness, and did he speak of himself as deserted? Rather did he say that he was not deserted, because that was not taken away which he desired to be taken away, to the end that infirmity might be cured. For this he found in the voice of the Physician, "My grace is sufficient for thee; for my strength is made perfect in weakness." Whence knowest thou, then, that God does not wish to heal thee? As yet it is expedient for thee to be scourged. Whence knowest thou how diseased that is which the physician cuts, using his knife on the diseased parts? Does he not know the measure, what he is to do, and how far he is to do it? Does the shrieking of him he cuts restrain the hands of the physician cutting according to his art? The one cries, the other cuts. Is he cruel who does not listen to the man crying out, or is he not rather merciful in following the wound, that he may heal the sick man? These things have I said, my brethren, in order that no one seek any other aid than that of God, when we happen to be under the reproof of God. See that ye perish not; see that ye do not depart from the Lamb, and be devoured by the lion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
