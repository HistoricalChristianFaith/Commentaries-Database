[[commentary]]
quote='''
And as these things are said of the future, though the sound of the words is past, it follows: “Turn us, O God of our salvation” (ver. 4). That which he had just related as if it were done, how prayeth he that it may be done, except because he wished to show that he had spoken as if of the past in prophecy? But that it was not yet done which he had said was done he showeth by this, that he prayeth that it may be done: “Turn us, O God of our salvation, and turn away Thine anger from us.” Didst thou not say before: “Thou hast appeased all Thy anger, Thou has turned Thyself from Thy wrathful indignation”? How then now sayest thou, “And turn away Thine anger from us”? The Prophet answereth: These things I speak of as done, because I see them about to be done: but because they are not yet done, I pray that they may come, which I have already seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
