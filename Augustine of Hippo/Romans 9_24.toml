[[commentary]]
quote='''
God did not call all the Jews but only some of them. Nor did he call all the Gentiles but only some of them. From Adam has sprung one mass of sinners and godless men, in which both Jews and Gentiles belong to one lump, apart from the grace of God. If the potter out of one lump of clay makes one vessel for honor and another for dishonor, it is clear that God has made of the Jews some vessels for honor and others for dishonor, and similarly of the Gentiles.
'''
source_url=''
source_title="TO SIMPLICIAN ON VARIOUS QUESTIONS 1.2.19"

[[commentary]]
quote='''
When he says: Whom he also called, namely us, not only from the Jews but also from the Gentiles, as he says also in Hosea: I will call that which was not my people, my people, and the rest, he brings the purpose of this whole discussion to this: that since he has taught that our working well is of God's mercy, the Jews should not glory as if from works—who, when they had received the Gospel, thinking it was to be attributed to their own merits, did not want it given to the Gentiles; from which pride they must now desist, understanding that if we are called, not from works but by the mercy of God, that we may believe, and it is granted to believers that they may work well, then this mercy is not to be begrudged the Gentiles, as though the merit of the Jews—which is nothing—were preferred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
