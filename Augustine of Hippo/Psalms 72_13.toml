[[commentary]]
quote='''
But it might occur to one; if because of sins man was held by the devil, have sins pleased Christ, who saved the needy man from the mighty? Far be it. But “He it is that shall spare the helpless and poor man” (ver. 13): that is, shall remit sins to the man, humble and not trusting in his own merits, or hoping for salvation because of his own virtue, but needing the grace of his Saviour. But when he hath added, “and the souls of the poor He shall save:” he hath recommended to our notice both the aids of grace; both that which is for the remission of sins, when he saith, “He shall spare the poor and needy man;” and that which doth consist in the imparting of righteousness, when he hath added, “and the souls of the poor He shall save.” For no one is meet of himself for salvation (which salvation is perfect righteousness), unless God’s grace aid: because the fulness of the law is nought but love, which doth not exist in us of ourselves, but is shed abroad in our hearts through the Holy Spirit which hath been given unto us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252072.html'
source_title="Exposition on Psalm 72"
