[[commentary]]
quote='''
However, whether by what he saith, “who made the heavens in understanding,” or, as others have rendered it, “in intelligence,” he meant to signify, the heavens we can understand, or that He in His understanding or intelligence, that is, in His wisdom made the heavens (as it is elsewhere written, “in wisdom hast Thou made them all”), implying thereby the only-begotten Word, may be a question. But if it be so, that we are to understand that “God by His wisdom made the heavens,” why saith He this only of the heavens, whereas God made all things by the same wisdom? It is that it needed only to be expressed there, so that in the rest it might be understood without being written. How then could it be “alone,” if “in understanding” or “in intelligence” means “by His wisdom,” that is, by the only-begotten Word? Is it that, inasmuch as the Trinity is not three Gods, but one God, he states that God made these things alone, because He made not creation by means of any creature?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
