[[commentary]]
quote='''
Again, he says to the Ephesians, "Peace be to the brethren, and love with faith." Great blessings these! Let him tell us, however, whence they come. "From God the Father," says he immediately afterwards, "and the Lord Jesus Christ." These great blessings, therefore, are nothing else than God's gifts to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 39"
