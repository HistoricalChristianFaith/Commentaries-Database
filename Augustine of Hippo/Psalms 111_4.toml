[[commentary]]
quote='''
“He hath made His wonderful works to be remembered” (ver. 4): by abasing this man, exalting that. Reserving unusual miracles for a fit season, that thus human weakness, intent upon novelty, may remember them, although His daily miracles be greater. He created so many trees throughout the whole earth, and no one wondereth: He dried up one with a word, and the hearts of mortals were thunderstruck. For that miracle, which hath not through its frequency become common, will cling most firmly to the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520111.html'
source_title="Exposition on Psalm 111"
