[[commentary]]
quote='''
“For my life hath failed in pain” (ver 10). For my life is to confess Thee, but it failed in pain, when the enemy had said, Let them be tortured until they deny Him. “And my years in groanings.” The time that I pass in this world is not taken away from me by death, but abides, and is spent in groanings. “My strength hath been weakened by want.” I want the health of this body, and racking pains come on me: I want the dissolution of the body, and death forbears to come: and in this want my confidence hath been weakened. “And my bones have been disturbed.” And my stedfastness hath been disturbed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
