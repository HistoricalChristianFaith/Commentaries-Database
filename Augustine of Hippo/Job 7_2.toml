[[commentary]]
quote='''
I who once fled from Thee, now flee to Thee. For Adam fled from the Face of God, and hid himself among the trees of Paradise, so that of him was said in the Book of Job, “As a servant that fleeth from his Lord, and findeth a shadow.” He fled from the Face of his Lord, and found a shadow. Woe to him, if he continue in the shade, lest it be said afterward, “All things are passed away like a shadow.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
