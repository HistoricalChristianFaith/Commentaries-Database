[[commentary]]
quote='''
“For of the Lord is our taking up” (ver. 18). For I was moved like a heap of sand, that I might fall; and I should have fallen, had not the Lord taken me up. “For of the Lord is (our) taking up: and of the Holy One of Israel our King.” Himself is thy taking up, Himself thy illumination: in His light thou art safe, in His light thou walkest, in His righteousness thou art exalted. He took thee up, He guards thy weakness: He gives thee strength of Himself, not of thyself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
