[[commentary]]
quote='''
“My soul hath been glued on behind Thee” (ver. 9). See ye one longing, see ye one thirsting, see ye how he cleaveth to God. Let there spring up in you this affection. If already it is sprouting, let it be rained upon and grow: let it come to such strength, that ye also may say from the whole heart, “My soul hath been glued on behind Thee.” Where is that same glue? The glue itself is love. Have thou love, wherewith as with glue thy soul may be glued on behind God. Not with God, but behind God; that He may go before, thou mayest follow. For he that shall have willed to go before God, by his own counsel would live, and will not follow the commandments of God. Because of this even Peter was rebuked, when he willed to give counsel to Christ, who was going to suffer for us.…“Far be it from Thee, O Lord, be Thou merciful to Thyself.” And the Lord, “Go back behind Me, Satan: for thou savourest not the things which are of God, but the things which are of men.” Wherefore, the things which are of men? Because to go before Me thou desirest, go back behind Me, in order that thou mayest follow me: so that now following Christ he might say, “My soul hath been glued on behind Thee.” With reason he addeth, “Me Thy right hand hath taken up.” This Christ hath said in us: that is in the Man which He was bearing for us, which He was offering for us, He hath said this. The Church also said this in Christ, she saith it in her Head: for she too hath suffered here great persecutions, and by her individual members even now she suffereth.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
