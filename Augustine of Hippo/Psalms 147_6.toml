[[commentary]]
quote='''
“The Lord taketh up the gentle” (ver. 6). For example; thou understandest not, thou failest to understand, canst not attain: honour God’s Scripture, honour God’s Word, though it be not plain: in reverence wait for understanding. Be not wanton to accuse either the obscurity or seeming contradiction of Scripture. There is nothing in it contradictory: somewhat there is which is obscure, not in order that it may be denied thee, but that it may exercise him that shall afterward receive it. When then it is obscure, that is the Physician’s doing, that thou mayest knock. He willed that thou shouldest be exercised in knocking; He willed it, that He might open to thee when thou knockest. By knocking thou shalt be exercised; exercised, thou shalt be enlarged; enlarged, thou shalt contain what is given. Be not then indignant for that it is shut; be mild, be gentle. Kick not against what is dark, nor say, It were better said, if it were said thus. For how canst thou thus say, or judge how it is expedient it be said? It is said as it is expedient it be said. Let not the sick man seek to amend his remedies: the Physician knoweth how to temper them: believe Him who careth for thee. Therefore what cometh next?…“The Lord taketh up the gentle, but humbleth the sinners even to the ground,” he intended a certain sort of sinners to be understood, from the gentleness mentioned first. By sinners then in this place, we understand the fierce, and those who are not gentle. Wherefore doth He “humble them even to the earth”? They carp at objects of understanding, they shall perceive only things earthly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
