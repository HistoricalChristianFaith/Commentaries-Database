[[commentary]]
quote='''
And in the book of Ecclesiasticus we read: "Say not thou, It is through the Lord that I fell away; for thou oughtest not to do the things that He hateth: nor do thou say, He hath caused me to err; for He hath no need of the sinful man. The Lord hateth all abomination, and they that fear God love it not. He Himself made man from the beginning, and left him in the hand of His counsel. If thou be willing, thou shalt keep His commandments, and perform true fidelity. He hath set fire and water before thee: stretch forth thine hand unto whether thou wilt. Before man is life and death, and whichsoever pleaseth him shall be given to him." Observe how very plainly is set before our view the free choice of the human will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 3"
