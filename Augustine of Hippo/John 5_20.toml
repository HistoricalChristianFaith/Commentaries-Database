[[commentary]]
quote='''
(Tr. xxi. s. 2) Having said that He did the same things that the Father did, and in a like way, He adds, For the Father loveth the Son, and showeth Him all things that Himself doeth. And showeth Him all things that Himself doeth: this has a reference to the words above; But what He seeth the Father do. But again, our human ideas are perplexed, and one may say, So then the Father first does something, that the Son may see what He does; just as an artificer teaches his son his art, and shows him what he makes, that he may be able to make the same after him. On this supposition, when the Father does a thing, the Son does not do it; in that the Son is beholding what His Father doeth. But we hold it as a fixed and incontrovertible truth, that the Father makes all things through the Son, and therefore He must show them to the Son, before He makes them. And where does the Father show the Son what He makes, except in the Son Himself, by whom He makes them? For if the Father makes a thing for a pattern, and the Son attends to the workmanship as it goes on, where is the indivisibility of the Trinity? The Father therefore does not show the Son what He doeth by doing it, but by showing doeth it, through the Son. The Son seeth, and the Father showeth, before a thing is made, and from the showing of the Father, and the seeing of the Son, that is made which is made; made by the Father, through the Son. But thou wilt say, I show my Son what I wish him to make, and he makes it, and I make it through him. True; but before thou doest any thing, thou shewest it to thy son, that he may do it for thy example, and thou by him; but thou speakest to thy son words which are not thyself; whereas the Son Himself is the Word of the Father; and could He speak by the Word to the Word? Or, because the Son was the great Word, were lesser words to pass between the Father and the Son, or a certain sound and temporary creation, as it were, to go out of the mouth of the Father, and strike the ear of the Son? Put away these bodily notions, and if thou art simple, see the truth in simplicity. If thou canst not comprehend what God is, comprehend at least what He is not. Thou wilt have advanced no little way, if thou thinkest nothing that is untrue of God. See what I am saying exemplified in thine own mind. Thou hast memory, and thought, thy memory showeth to thy thought Carthage: before thou perceivest what is in her, she showeth it to thought, which is turned toward her: the memory then hath shown, the thought hath perceived, and no words have passed between them, no outward sign been used. But whatever is in thy memory, thou receivest from without: that which the Father showeth to the Son, He doth not receive from without; the whole goes on within; there being no creature existing without, but what the Father hath made by the Son. And the Father maketh by showing, in that He maketh by the Son who sees. The Father's showing begets the Son's seeing, as the Father begets the Son? showing begets seeing, not seeing shewing. But it would be more correct, and more spiritual, not to view the Father as distinct from His showing, or the Son from His seeing.

(Tr. xxi) For to see the Father is to see His Son. The Father so shows all His works to the Son, that the Son sees them from the Fatheri. For the birth of the Son is in His seeing: He sees from the same source, from which He is, and is born, and remains.

(Tr. xxi. s. 5) But now from Him whom we called coeternal with the Father, who saw the Father, and existed in that He saw, we return to the things of time, And He will show him greater works than these. But if He will show him, i. e. is about to show him, He hath not yet shown him: and when He does show him, others also will see; (Tr. xix). for it follows, That ye may believe. It is difficult to see what the eternal Father can show in time to the coeternal Son, Who knows all that exists within the Father's mind. For as the Father raiseth up the dead, and quickeneth them, even so the Son quickeneth whom He will. To raise the dead was a greater work than to heal the sick. But this is explained by consideriug that He Who a little before spoke as God, now begins to speak as man. As man, and therefore living in time, He will be shown greater works in time. Bodies will rise again by the human dispensation by which the Son of God assumed manhood in time; but souls by virtue of the eternity of the Divine Substance. For which reason it was said before that the Father loved the Son, and showed Him what things soever He did. For the Father shows the Son that souls are raised up; for they are raised up by the Father and the Son, even as they cannot live, except God give them life. (Tr. xxi). Or the Father is about to show this to us, not to Him; according to what follows, That ye may believe. This being the reason why the Father would show Him greater things than these. But why did He not say, shall show you, instead of the Son? Because we are members of the Son, and He, as it were, learns in His members, even as He suffers in us. For as He says, Inasmuch as ye have done it unto one of the least of these My brethren, ye have done it unto Me: (Matt. 25:40) so, if we ask Him, how He, the Teacher of all things, learns, He replies, When one of the least of My brethren learns, I learn.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"For the Father loveth the Son, and showeth Him all things that Himself doeth." Here is that "showeth." "Showeth," as it were, to whom? Of course, as to one that sees. We return to that which we cannot explain, how the Word seeth. Behold, man was made by the Word; but man has eyes, ears, hands, divers members in the body: he is able by the eyes to see, by the ears to hear, by the hands to work; the members are diverse, their offices diverse. One member cannot do the office of another; yet, by reason of the unity of the body, the eye sees both for itself and for the ear, and the ear hears for itself and for the eye. Are we to suppose that something like this holds good in the Word, seeing all things are by Him; and Scripture has said in the psalm, "Understand, ye brutish among the people; and ye fools, at length be wise. He that planted the ear, shall He not hear? And He that formed the eye, shall He not see?" Hence, if the Word is He that formed the eye, for all things are by the Word; if the Word is He that planted the ear, for all things are by the Word: we cannot say the Word doth not hear, the Word doth not see; lest the psalm reprove us, and say, "Fools, at length be wise." Therefore, if the Word heareth and seeth, if the Son heareth and seeth, are we yet to search for eyes and ears in Him in separate places? Does He by one part hear, by another see; and cannot His ear do what His eye doth; and cannot His eye do what His ear can? Or is He not all sight, all hearing? Perhaps yes; nay, not perhaps, but truly yes; whilst, however, that seeing of His, and that hearing of His, is in a way far other than it is with us. Both to see and to hear exist together in the Word: seeing and hearing are not diverse things in Him; but hearing is sight, and sight is hearing.

And we, who see in one way, and hear in another way, how know we this? We return perhaps to ourselves, if we are not the trangressors to whom it is said, "Return, O trangressors, to your heart." Return to your heart: why go from yourselves, and perish from yourselves? Why go the ways of solitude? You go astray by wandering: return ye. Whither? To the Lord. 'Tis quickly done: first return to thine own heart; thou hast wandered abroad an exile from thyself; thou knowest not thyself, and yet thou art asking by whom thou wast made! Return, return to thy heart, lift thyself away from the body: thy body is thy place of abode; thy heart perceives even by thy body. But thy body is not what thy heart is; leave even thy body, return to thy heart. In thy body thou didst find eyes in one place, ears in another place: dost thou find this in thy heart? Or hast thou not ears in thy heart? Else of what did the Lord say, "Whoso hath ears to hear, let him hear?" Or hast thou not eyes in thy heart? Else of what saith the apostle. "The eyes of your heart being enlightened?" Return to thy heart; see there what, it may be, thou canst perceive of God, for in it is the image of God. In the inner man dwelleth Christ, in the inner man art thou renewed after the image of God, in His own image recognize its Author. See how all the senses of the body bring intelligence to the heart within of what they have perceived abroad; see how many ministers the one commander within has and what it can do by itself even without these ministers. The eyes report to the heart things black and white; the ears report to the same heart pleasant and harsh sounds; to the same heart the nostrils announce sweet odors and stenches; to the same heart the taste announces things bitter and sweet; to the same heart the touch announces things smooth and rough; and the heart declares to itself things just and unjust. Thy heart sees and hears and judges all other things perceived by the senses; and, what the senses do not aspire to, discerns things just and unjust, things evil and good. Show me the eyes, ears, nostrils, of thy heart. Diverse are the things that are referred to thy heart, yet are there not diverse members there. In thy flesh, thou hearest in one place, seest in another; in thy heart, where thou seest, there thou hearest. If this be the image, how much more mightily He whose the image is! Therefore the Son both heareth and seeth; the Son is both the hearing itself and the seeing: to hear is to Him the same thing as "to be;" and to see is to Him the same thing as "to be." To see is not the same thing to thee as to be; for if thou lose thy sight, thou canst be; and if thou lose thy hearing, thou canst be.

Do we think we have knocked? Is there raised up within us something whereby we may even slightly conjecture whence light may come to us? It is my opinion, brethren, that when we speak of these things, and meditate upon them, we are exercising ourselves. And when we are exercising ourselves, and are as it were bent back again by our own weight to our customary thoughts, we are like weak-eyed persons, when they are brought forth to see the light, if perchance they had no sight at all before, and begin in some sort to recover their sight by the assiduous care of physicians. And when the physician would test the progress of recovery, he tries to show them something which they sought to see, but could not while they were blind: and while the eyesight is now somewhat recovered, they are brought forth to the light; and as they see it, are beaten back in a manner by the very glare; and they answer the physician, as he points out the object, This moment I did see, but now I cannot. What then does the physician? He brings them back to their usual ways, and applies the eye-salve to nourish the longing for seeing that which was seen only for a moment, so that by the very longing he may cure more completely; and if any stinging salves are applied for the recovery of soundness, let the patient bear it bravely, and, inflamed with love of the light, say to himself, When will it be that with strong eyes I shall see what with sore and weak eyes I could not? He urges the physician, and begs him to heal him. Therefore, brethren, if, it may be, something like this has taken place in your hearts, if somehow you have raised your heart to see the Word, and, beaten back by its light, you have fallen back to your wonted ways; pray the Physician to apply sharp salves, the precepts of righteousness. There is that which thou mayest see, but not that whereby thou canst see. Thou didst not believe me before that there is that which thou mayest see: thou art now, as by the guidance of reason, brought to it: thou hast drawn near, strained thine eyes to see it, throbbed, and shrunk back. Thou knowest for certain that there is what thou mayest see, but that thou art not yet meet to see it. Therefore be healed. What are the eye-salves? Do not lie, do not swear falsely, do not commit adultery, do not steal, do not defraud. But thou art used to these, and it is with some pain thou art drawn away from old habits: this is what bites, but yet heals. For I tell thee freely, by fear of myself and of thee, if thou give up the healing, and scorn to become meet to enjoy this light, by weakness of thine eyes, thou wilt love darkness; and by loving darkness, wilt remain in darkness; and by remaining in darkness, wilt be cast even into outer darkness: there shall be weeping and gnashing of teeth. If the love of light has effected nothing in thee, let the fear of pain effect something.

I think I have spoken long enough, and yet I have not concluded the Gospel lesson: if I go on to declare what remains, I shall burden you, and I fear lest even what has been drawn may be lost; therefore let this be enough for you now, beloved. We are debtors, not now, but always as long as we live; because we live for you. However, do you, by good living, comfort this life of ours, so weak, toilsome, and full of peril in this world; do not afflict and wear us out by your evil manners. For if, when offended with your evil life, we flee from you and separate ourselves from you, and no longer come to you, will ye not complain, and say, And if we were sick, ye might care for us; and if we were weak, ye might have visited us? Behold, we do care for you; behold, we do visit you; but let it not be with us as you have heard from the apostle, "I fear lest I have bestowed labor upon you in vain."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252018.html'
source_title="Tractates on John 18"

[[commentary]]
quote='''
"For the Father loveth the Son, and showeth Him all things that Himself doeth." To that which He said above, "except what He seeth the Father doing," seems to belong this also, "He showeth Him all things that Himself doeth." But if the Father doth show what He doeth, and the Son cannot do except the Father hath shown, and if the Father cannot show unless He hath done, it will follow that it is not through the Son that the Father doeth all things; moreover, if we hold it fixed and unshaken, that the Father doeth all by the Son, then He shows the Son before He doeth. For if the Father doth show to the Son after He has done, that the Son may do the things shown, which being shown were already done, then doubtless something there is that the Father doeth without the Son. But the Father doeth not anything without the Son, because the Son of God is God's Word, and all things were made by Him. It remains, then, that possibly what the Father is about to do, He shows as about to be done, that it may be done by the Son. For if the Son doeth those things which the Father showeth as already done, surely it is not by the Son that the Father hath done the things which He thus showeth. For they could not be shown to the Son unless they were first done, and the Son would not be able to do them unless they were first shown; therefore were they made without the Son. But yet it is a true thing, "All things were made by Him;" therefore they were shown before they were made. But this we said must be put off, and returned to after briefly scanning the passage, if, as we said, some portion of time and of strength should remain to us for a reconsideration of the matters deferred.

Attend now to a wider and more difficult question. "And greater works than these," saith He, "will He show Him, that ye may marvel." "Greater than these." Greater than which? The answer readily occurs: than the cures of bodily diseases which ye have just heard: For the whole occasion of this discourse arose about the man who was thirty and eight years in infirmity, and was healed by the word of Christ; and in respect of this cure, the Lord could say, "Greater works than these He will show Him, that ye may marvel." For there are greater, and the Father will show them to the Son. It is not "hath shown," as of a thing past, but "will show," of a thing future; or, is about to show. Again a difficult question arises: Why, then, is there something with the Father that has not yet been shown to the Son? Is there something with the Father that was still hid from the Son when He spoke these words? For surely, if it be "will show," that is to say, "is about to show," then He has not yet shown; and He is about to show to the Son at the same time as to these persons, since it follows, "that ye may marvel." And this is a thing hard to see, how the Eternal Father doth show something, as it were in time, to the coeternal Son, who knoweth all things that are with the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"

[[commentary]]
quote='''
Yesterday, so far as the Lord vouchsafed to bestow, we discussed with what ability we could, and discerned according to our capacity, how the works of the Father and of the Son are inseparable; and how the Father doeth not some, the Son others, but that the Father doeth all things through the Son, as through His Word, of which it is written, "All things were made by Him, and without Him was nothing made." Let us to-day look at the words that follow. And of the same Lord let us pray for mercy, and hope that, if He deem it meet, we may understand what is true; but if we should not be able to do this, that we may not go into what is false. For it is better not to know than to go astray; but to know is better than not to know. Therefore, before all things, we ought to strive to know. Should we be able, to God be thanks; but should we not be able meanwhile to arrive at the truth, let us not go to falsehood. For we are bound to consider well what we are, and what we are treating of. We are men bearing flesh, walking in this life; and though now begotten again of the seed of the Word of God, yet in Christ renewed in such manner that we are not yet wholly rid of Adam. For truly our mortal and corruptible part that weighs down the soul shows itself to be, and manifestly is, of Adam; but what in us is spiritual, and raises up the soul, is of God's gift and of His mercy, who has sent His only Son to partake our death with us, and to lead us to His own immortality. The Son we have for our Master, that we may not sin; and for our defender, if we have sinned and have confessed, and been converted; an intercessor for us, if we have desired any good of God; and the bestower of it with the Father, because Father and Son is one God. But He was speaking these things as man to men: God concealed, the man manifest, that He might make them gods that are manifest men; and the Son of God made Son of man, that He might make the sons of men sons of God. By what skill of His wisdom He doeth this, we perceive in His own words. For as a little one He speaks to little ones, but Himself little in such wise that He is also great, and we little, but in Him great. He speaks, indeed as one cherishing and nourishing children at the breast that grow by loving.

He had said, "The Son cannot of Himself do anything, but what He seeth the Father doing." We, however, understood it not that the Father doeth something separately, which when the Son seeth, Himself also doeth something of the same kind, after seeing His Father's work; but when He said, "The Son cannot of Himself do anything, but what He seeth the Father doing," we understood it that the Son is wholly of the Father-that His whole substance and His whole power are of the Father that begat Him. But just now, when He had said that He doeth in like manner these things which the Father doeth, that we may not understand it to mean that the Father doeth some, the Son others, but that the Son with like power doeth the very same which the Father doeth, whilst the Father doeth through the Son, He went on, and said what we have heard read to-day: "For the Father loveth the Son, and showeth Him all things that Himself doeth." Again mortal thought is disturbed. The Father showeth to the Son what things Himself doeth; therefore, saith some one, the Father doeth separately, that the Son may be able to see what He doeth. Again, there occur to human thought, as it were, two artificers-as, for instance, a carpenter teaching his son his own art, and showing him whatever he doeth, that the son also may be able to do it. "Showeth Him," saith He, "all things that Himself doeth." Is it therefore so, that whilst He doeth, the Son doeth not, that He may be able to see the Father do? Yet, certainly, "all things were made by Him, and without Him was nothing made." Hence we see how the Father showeth the Son what He doeth, since the Father doeth nothing but what He doeth through the Son. What hath the Father made? He made the world. Hath He shown the world, when made, to the Son in such wise, that the Son also should make something like it? Then let us see the world which the Son made. Nevertheless, both" all things were made by Him, and without Him was nothing made," and also "the world was made by Him." If the world was made by Him, and all things were made by Him, and the Father doeth nothing save by the Son, where doth the Father show to the Son what He doeth, if it be not in the Son Himself, through whom He doeth? In what place can the work of the Father be shown to the Son,as though He were doing and sitting outside, and the Son attentively watching the Father's hand how it maketh? Where is that inseparable Trinity? Where the Word, of which it is said that the same is "the power and the wisdom of God"? Where that which the Scripture saith of the same wisdom: "For it is the brightness of the eternal light?" Where what was said of it again: "It powerfully reaches from the end even to the end, and ordereth all things sweetly"? Whatever the Father doeth, He doeth through the Son: through His wisdom and his power He doeth; not from without doth He show to the Son what He may see, but in the Son Himself He showeth Him what He doeth.

What seeth the Father, or rather, what doth the Son see in the Father, that Himself also may do? Perhaps I may be able to speak it, but show me the man who can comprehend it; or perhaps I may be able to think and not speak it; or perhaps I may not be able even to think it. For that divinity excels us, as God excels men, as the immortal excels a mortal, as the eternal excels the temporal. May He inspire and endow us, and out of that fountain of life deign to bedew and to drop somewhat on our thirst. that we may not be parched in this wilderness! Let us say to Him, Lord, to whom we have learnt to say Father. We make bold to say this, because Himself willed it; if only we so live that He may not say to us, "If I am a Father, where is mine honor? if I am Lord, where is my fear?" Let us then say to Him, "Our Father."To whom do we say, "Our Father"? To the Father of Christ. He, then, who says "Our Father" to the Father of Christ, says to Christ, what else but "Our Brother"? Not, however, as He is the Father of Christ is He in like manner our Father; for Christ never so conjoined us as to make no distinction between Him and us. For He is the Son equal to the Father, the eternal Son with the Father, and co-eternal with the Father; but we became sons through the Son, adopted through the Only-begotten. Hence was it never heard from the mouth of our Lord Jesus Christ, when speaking to His disciples, that He said of the supreme God His Father, "Our Father;" but He said either "My Father" or "Your Father." But He said not "Our Father;" so much so, that in a certain place He used these two expressions: "I go to my God," saith He, "and to your God." Why did He not say, "Our God"? Further, He said, "My Father, and your Father;" He said not, "Our Father." He so joins as to distinguish, distinguishes so as not to disjoin. He wills us to be one in Him, but the Father and Himself one.

How much soever then we may understand, and how much soever we may see, we shall not see as the Son seeth, even when we shall be made equal with the angels. For we are something even when we do not see; but what are we when we do not see, other than persons not seeing? And that we may see, we turn to Him whom we may see, and there is formed in us a seeing which was not before, although we were in being. For a man is when not seeing; and the same, when he doth see, is called a man seeing. For him, then, to see is not the same thing as to be a man; for if it were, he would not be man when not seeing. But since he is man when not seeing, and seeks to see what he sees not, he is one who seeks, and who turns to see; and when he has well turned and has seen, he becomes a man seeing, who was before a man not seeing. Consequently, to see is to him a thing that comes and goes; it comes to him when he turns to, and leaves him when he turns away. Is it thus with the Son? Far be it from us to think so. It was never so that He was Son, not seeing, and afterwards was made to see; but to see the Father is to Him the same thing as to be Son. For we, by turning away to sin, lose enlightenment; and by turning to God we receive enlightenment. For the light by which we are enlightened is one thing; we who are enlightened, another thing. But the light itself, by which we are enlightened, neither turns away from itself, nor loses its lucidity, because as light it exists. The Father, then, showeth a thing which He doeth to the Son, in such wise that the Son seeth all things in the Father, and is all things in the Father. For by seeing He was begotten; and by being begotten He seeth. Not, however, that at any time He was not begotten, and afterwards was begotten; nor that at any time He saw not, and afterwards saw. But in what consists His seeing, in the same consists His being, in the same His being begotten, in the same His continuing, in the same His unchanging, in the same His abiding without beginning and without end. Let us not therefore take it in a carnal sense that the Father sitteth and doeth a work, and showeth it to the Son; and the Son seeth the work that the Father doeth, and doeth another work in another place, or out of other materials. For "all things were made by Him, and without Him was nothing made." The Son is the Word of the Father. The Father said nothing which He did not say in the Son. For by speaking in the Son what He was about to do through the Son, He begat the Son through whom He made all things.

"And greater works than these will He show Him, that ye may marvel." Here again we are embarrassed. And who is there that may worthily investigate this so great a secret? But now, in that He has deigned to speak to us, Himself opens it. For He would not speak what He would not have us understand; and as He has deigned to speak, without doubt He has excited attention: for does He forsake any whom He has roused to give attentive hearing? We have said that it is not in a temporal sense that the Son knoweth,-that the knowledge of the Son is not one thing, and the Son Himself another; nor one thing His seeing, Himself another; but that the seeing itself is the Son, and the knowledge as well as the wisdom of the Father is the Son; and that that wisdom and seeing is eternal and co-eternal with Him from whom it is; that it is not something that varies by time, nor something produced that was not in being, nor something that vanishes away which did exist. What is it, then, that time does in this case, that He should say, "Greater works than these He will show Him"? "He will show," that is, "He is about to show." Hath shown is a different thing from will show: hath shown, we say of an act past; will show, of an act future. What shall we do here, then, brethren? Behold, He whom we had declared to be co-eternal with the Father, in whom nothing is varied by time, in whom is no moving through spaces either of moments or of places, of whom we had declared that He abides ever with the Father seeing, seeing the Father, and by seeing existing; He, I say, here again mentioning times to us, saith, "He will show Him greater works than these." Is He then about to show something to the Son, which the Son doth not as yet know? What, then, do we make of it? How do we understand this? Behold, our Lord Jesus Christ was above, is beneath. When was He above? When He said, "What things soever the Father doeth, these same also the Son doeth in like manner." Whence know we that He is now beneath? Hence: "Greater works than these He will show Him." O Lord Jesus Christ, our Saviour, Word of God, by which all things were made, what is the Father about to show Thee, that as yet Thou knowest not? What of the Father is hid from Thee? What in the Father is hid from Thee, from whom the Father is not hid? What greater works is He about to show Thee? Or greater than what works are they which He is to show Thee? For when He said, "Greater than these," we ought first to understand the works than which are they greater.

Let us again call to mind whence this discourse started. It was when that man who was thirty-eight years in infirmity was healed, and Jesus commanded him, now made whole, to take up his bed and to go to his house. For this cause, indeed, the Jews with whom He was speaking were enraged. He spoke in words, as to the meaning He was silent; hinted in some measure at the meaning to those who understood, and hid the matter from them that were wroth. For this cause, I say, the Jews, being enraged because the Lord did this on the Sabbath, gave occasion to this discourse. Therefore let us not hear these things in such wise as if we had forgotten what was said above, but let us look back to that impotent man languishing for thirty-eight years suddenly made whole, while the Jews marvelled and were wroth. They sought darkness from the Sabbath more than light from the miracle. Speaking then to these, while they are indignant, He saith, "Greater works than these will He show Him." "Greater than these:" than which? What ye have seen, that a man, whose infirmity had lasted thirty-eight years, was made whole greater than these the Father is about to show to the Son. What are greater works? He goes on, saying, "For as the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will." Clearly these are greater. Very much greater is it that a dead man should rise, than that a sick man should recover: these are greater. But when is the Father about to show these to the Son? Does the Son not know them? And He who was speaking, did He not know how to raise the dead? Had He yet to learn how to raise the dead to life-He, I say, by whom all things were made? He who caused that we should live, when we were not in being,had He yet to learn how we might be raised to life again? What, then, do His words mean?

But now He condescends to us, and He who a little before was speaking as God, now begins to speak as man. Notwithstanding, the same is man who is God, for God was made man; but was made what He was not, without losing what He was. The man therefore was added to the God, that He might be man who was God, but not that He should now henceforth be man and not be God. Let us then hear Him also as our brother whom we did hear as our Maker. Our Maker, because the Word in the beginning; our Brother, because born of the Virgin Mary: Maker, before Abraham, before Adam, before earth,before heaven, before all things corporeal and spiritual; but Brother, of the seed of Abraham, of the tribe of Judah, of the Israelitish virgin. If therefore we know Him who speaks to us as both God and man, let us understand the words of God and of man; for sometimes He speaks to us such things as are applicable to the majesty, sometimes such as are applicable to the humility. For the selfsame is high who was made low, that He might make us high who are low. What, then, saith He? "The Father will show" to me "greater than these, that ye may marvel." To us, therefore, He is about to show, not to Him. And since it is to us that the Father is to show, for that reason He said, "that ye may marvel." He has, in fact, explained what He meant in saying, "The Father will show" to me. Why did He not say, The Father will show to you; but, He will show to the Son? Because also we are members of the Son; and like as what we the members learn, He Himself in a manner learns in His members. How doth He learn in us? As He suffers in us. Whence may we prove that He suffers in us? From that voice out of heaven, "Saul, Saul, why. persecutest thou me?" Is it not Himself that will sit as Judge in the end of the world, and, setting the just on the right, and the wicked on the left, will say, "Come, ye blessed of my Father, receive the kingdom; for I was hungry, and ye gave me to eat"? And when they shall answer, "Lord, when saw we Thee hungry?" He will say to them, "Since ye gave to one of the least of mine, ye gave to me." Let us at this time question Him, and let us say to Him, Lord; when wilt Thou be a learner, seeing Thou teachest all things? Immediately, indeed, He makes answer to us in our faith, When one of the least of mine doth learn, I learn.

Let us rejoice, then, and give thanks that we are made not only Christians, but Christ. Do ye understand, brethren, and apprehend the grace of God upon us? Marvel, be glad, we are made Christ. For if He is the head, we are the members: the whole man is He and we. This is what the Apostle Paul saith: "That we be no longer babes, tossed to and fro, and carried about with every wind of doctrine." But above he had said, "Until we all come together into the unity of faith, and to the knowledge of the Son of God, to the perfect man, to the measure of the age of the fullness of Christ." The fullness of Christ, then, is head and members. Head and members, what is that? Christ and the Church. We should indeed be arrogating this to ourselves proudly, if He did not Himself deign to promise it, who saith by the same apostle, "But ye are the body of Christ, and members."

Whenever, then, the Father showeth to Christ's members, He showeth to Christ. A certain great but yet real miracle happens. There is a showing to Christ of what Christ knew, and it is shown to Christ through Christ. A marvelous and great thing it is, but the Scripture so saith. Shall we contradict the divine declarations? Shall we not rather understand them, and of His own gift render thanks to Him who freely bestowed it on us? What is this that I said, "is shown to Christ through Christ"? Is shown to the members through the head. Lo, look at this in thyself. Suppose that with thine eyes shut thou wouldest take up something, thy hand knows not whither to go; and yet thy hand is at any rate thy member, for it is not separated from thy body. Open thine eyes, now the hand sees whither it may go; while the head showed, the member followed. If, then, there could be found in thyself something such, that thy body showed to thy body, and that through thy body something was shown to thy body, then do not marvel that it is said there is shown to Christ through Christ. For the head shows that the members may see, and the head teaches that the members may learn; nevertheless one man, head and members. He willed not to separate Himself, but deigned to attach Himself to us. Far was He from us, yea, very far. What so far apart as the creature and the Creator? What so far apart as God and man? What so far as justice and iniquity? What so far as eternity and mortality? Behold, so far from us was the Word in the beginning, God with God, by whom all things were made. How, then, was He made near, that He might be what we are, and we in Him? "The Word was made flesh, and dwelt in (among) us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252021.html'
source_title="Tractates on John 21"
[[commentary]]
quote='''
Therefore let us now briefly run over what remains, and do you see how the Lord makes known to us the things which I have been here commending to your attention. "The Father loveth the Son, and showeth Him all things which Himself doeth." Himself raiseth up souls, but by the Son, that the souls raised up may enjoy the substance of God, that is, of the Father and of the Son. "And greater works than these He will show Him." Greater than which? Than healings of bodies. We have treated of this already, and must not linger upon it now. Greater is the resurrection of the body unto eternity than this healing of the body, wrought in that impotent man, to last only for a time. "And greater works than these He will show Him, that ye may marvel." "Will show," as if the act were temporal, therefore as to a man made in time, since God the Word is not made, He by whom all times were made. But Christ was made man in time. We know in what consulship the Virgin Mary brought forth Christ, conceived of the Holy Ghost. Wherefore He, by whom as God the times were made, was made man in time. Hence, just as in time, "He will show Him greater works," that is, the resurrection of bodies, "that ye may marvel" at the resurrection of bodies wrought by the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
