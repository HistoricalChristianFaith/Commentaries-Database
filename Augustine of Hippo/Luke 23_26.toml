[[commentary]]
quote='''
(de Con. Ev. lib. iii. c. 10.) But John relates that Jesus bore His own cross, from which is understood that He was Himself carrying His cross, when He went forth to that place which is called Calvary; but as they journeyed Simon was forced into the service on the road, and the cross was given him to carry as far as that place.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew, accordingly, goes on with his narrative in these terms: "And as they came out, they found a man of Cyrene, Simon by name: him they compelled to bear His cross." In like manner, Mark says: "And they led Him out to be crucified. And they compelled one Simon, a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear His cross." Luke's version is also to this effect: "And as they led Him away, they laid hold upon one Simon a Cyrenian, coming out of the country; and on him they laid the cross, that he might bear it after Jesus." On the other hand, John records the matter as follows: "And they took Jesus, and led Him away. And He bearing His cross went forth into a place called the place of a skull, which is called in the Hebrew, Golgotha; where they crucified Him." From all this we understand that Jesus was carrying the cross Himself as He went forth into the place mentioned. But on the way the said Simon, who is named by the other three evangelists, was pressed into the service, and got the cross to carry for the rest of the course until the spot was reached. Thus we find that both circumstances really took place; namely, first the one noticed by John, and thereafter the one instanced by the other three.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 10"
