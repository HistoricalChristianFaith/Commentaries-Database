[[commentary]]
quote='''
(de Civ. Dei, l. iii. c. 15.) This darkening of the sun it is quite plain did not happen in the regular and fixed course of the heavenly bodies, because it was then the Passover, which is always celebrated at the full moon. But a regular eclipse of the sun does not take place except at new moon.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew proceeds thus: "And, behold, the veil of the temple was rent in twain from the top to the bottom." Mark's version is also as follows: "And the veil of the temple was rent in twain from the top to the bottom." Luke likewise gives a statement in similar terms: "And the veil of the temple was rent in the midst." He does not introduce it, however, in the same order. For, with the intention of attaching miracle to miracle, he has told us first how "the sun was darkened," and then has deemed it right to subjoin the said sentence in immediate succession, namely, "And the veil of the temple was rent in the midst." Thus it would appear that he has introduced at an earlier point this incident, which really took place when the Lord expired, so as to give us there a summary description of the circumstances relating to the drinking of the vinegar, and the loud voice, and the death itself, which are understood to have taken place previous to the rending of the veil, and after the darkness had come in. For Matthew has inserted this sentence, "And, behold, the veil of the temple was rent," in immediate succession to the statement, "And Jesus, crying again with a loud voice, yielded up the ghost;" and has thus given us clearly to understand that the time when the veil was rent was after Jesus had given up His spirit. If, however, he had not added the words, "And behold," but had said simply, "And the veil of the temple was rent," it would have been uncertain whether Mark and he had narrated the incident in the form of a recapitulation, while Luke had kept the exact order, or whether Luke had given the summary account of what these others had introduced in the correct historical succession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 19"
