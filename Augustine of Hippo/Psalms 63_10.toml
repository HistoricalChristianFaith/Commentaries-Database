[[commentary]]
quote='''
“They shall be delivered unto the hands of the sword” (ver. 10). In truth, thus it hath visibly befallen them, they have been taken by storm by enemies breaking in. “Portions of foxes they shall be.” Foxes he calleth the kings of the world, that then were when Judæa was conquered. Hear in order that ye may know and perceive, that those he calleth foxes. Herod the king the Lord Himself hath called a fox. “Go ye,” He saith, “and tell that fox.” See and observe, my brethren: Christ as King they would not have, and portions of foxes they have been made. For when Pilate the deputy governor in Judæa slew Christ at the voices of the Jews, he said to the same Jews, “Your King shall I crucify?” Because He was called King of the Jews, and He was the true King. And they rejecting Christ said, “We have no king but Cæsar.” They rejected a Lamb, chose a fox: deservedly portions of foxes they were made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
