[[commentary]]
quote='''
(Tr. cvi) When He adds, I pray not for the world, by the world He means those who live according to the lust of the world, and have not the lot to be chosen by grace out of the world, as those had for whom He prayed: But for them which Thou hast given Me. It was because the Father had given Him them, that they did not belong to the world. Nor yet had the Father, in giving them to the Son, lost what He had given: For they are Thine.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When the Lord was speaking to the Father of those whom He already had as disciples, He said this also among other things: "I pray for them. I pray not for the world, but for those whom Thou hast given me." By the world, He now wishes to be understood those who live according to the lust of the word, and stand not in the gracious lot of such as were to be chosen by Him out of the world. Accordingly it is not for the world, but for those whom the Father hath given Him, that He expresses Himself as praying: for by the very fact of their having already been given Him by the Father, they have ceased to belong to that world for which He refrains from praying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520107.html'
source_title="Tractates on John 107"
