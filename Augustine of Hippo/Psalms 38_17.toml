[[commentary]]
quote='''
“For I am prepared for the scourges” (ver. 17). Quite a magnificent expression; as if He were saying, “It was even for this that I was born; that I might suffer.” For He was not to be born, but from Adam, to whom the scourge is due. But sinners are in this life sometimes not scourged at all, or are scourged less than their deserts: because the wickedness of their heart is given over as already desperate. Those, however, for whom eternal life is prepared, must needs be scourged in this life: for that sentence is true: “My son, faint not under the chastening of the Lord, neither be weary when thou art rebuked of Him.” “For whom the Lord loveth He chasteneth, and scourgeth every son whom He receiveth.” Let not mine enemies therefore insult over me; let “them not magnify themselves;” and if my Father scourgeth me, “I am prepared for the scourge;” because there is an inheritance in store for me. Thou wilt not submit to the scourge: the inheritance is not bestowed upon thee. For “every son” must needs be scourged. So true it is that “every son” is scourged, that He spared not even Him who had no sin. For “I am prepared for the scourges.”

“And my sorrow is continually before me.” What “sorrow” is that? Perhaps, a sorrow for my scourge. And, in good truth, my brethren, in good truth, let me say unto you, men do mourn for their scourges, not for the causes on account of which they are scourged. Not such was the person here. Listen, my brethren: If any person suffers any loss, he is more ready to say, “I did not deserve to suffer it,” than to consider why he suffered it, mourning the loss of money, not mourning over that of righteousness. If thou hast sinned, mourn for the loss of thy inward treasure. Thou hast nothing in thy house, but perhaps thou art still more empty in heart; but if thine heart is full of its Good, even thy God, why dost thou not say, “The Lord gave, the Lord hath taken away; as it pleased the Lord was it done. Blessed be the Name of the Lord.” Whence then was it that He was grieving? Was it for the “scourging” wherewith He was scourged? God forbid. “And my sorrow” (says He) “is continually before me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
