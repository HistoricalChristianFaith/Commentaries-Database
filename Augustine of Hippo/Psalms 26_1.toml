[[commentary]]
quote='''
Of David himself.

It may be attributed to David himself, not the Mediator, the Man Christ Jesus, but the whole Church now perfectly established in Christ.

“Judge me, O Lord, for I have walked in my innocence” (ver. 1). Judge me, O Lord, for, after the mercy which Thou first showedst me, I have some desert of my innocence, the way whereof I have kept. “And trusting in the Lord I shall not be moved.” And yet not even so trusting in myself, but in the Lord, I shall abide in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252026.html'
source_title="Exposition on Psalm 26"
