[[commentary]]
quote='''
Hear then, dearly beloved, what I think in this matter, without prejudice to your own judgment, if you have formed a better. For we have all one Master, and we are fellow-disciples in one school. This, then, is my opinion, and see whether my opinion is not true, or near the truth. In Samaria He spent two days, and the Samaritans believed on Him; many were the days He spent in Galilee. and yet the Galileans did not believe on Him. Look back to the passage, or recall in memory the lesson and the discourse of yesterday. He came into Samaria, where at first He had been preached by that woman with whom He had spoken great mysteries at Jacob's well. After they had seen and heard Him, the Samaritans believed on Him because of the woman's word, and believed more firmly because of His own word, even many more believed: thus it is written. After passing two days there (in which number of days is mystically indicated the number of the two precepts on which hang the whole law and the prophets, as you remember we intimated to you yesterday), He goes into Galilee, and comes to the city Cana of Galilee, where He made the water wine. And there, when He turned the water into wine, as John himself writes, His disciples believed on Him; but, of course, the house was full with a crowd of guests. So great a miracle was wrought, and yet only His disciples believed on Him. He has now returned to this city of Galilee. "And, behold, a certain ruler, whose son was sick, came to Him, and began to beseech Him to go down" to that city or house, "and heal his son; for he was at the point of death." Did he who besought not believe? What dost thou expect to hear from me? Ask the Lord what He thought of him. Having been besought, this is what He answered: "Except ye see signs and wonders, ye believe not." He shows us a man lukewarm, or cold in faith, or of no faith at all; but eager to try by the healing of his son what manner of person Christ was, who He was, what He could do. The words of the suppliant, indeed, we have heard: we have not seen the heart of the doubter; but He who both heard the words and saw the heart has told us this. In short, the evangelist himself, by the testimony of his narrative, shows us that the man who desired the Lord to come to his house to heal his son, had not yet believed. For after he had been informed that his son was whole, and found that he had been made whole at that hour in which the Lord had said, "Go thy way, thy son liveth;" then he saith, "And himself believed, and all his house." Now, if the reason why he believed, and all his house, was that he was told that his son was whole, and found the hour they told him agreed with the hour of Christ's foretelling it, it follows that when he was making the request he did not yet believe. The Samaritans had waited for no sign, they believed simply His word; but His own fellow-citizens deserved to hear this said to them, "Except ye see signs and wonders, ye believe not;" and even there, notwithstanding so great a miracle was wrought, there did not believe but "himself and his house." At His discourse alone many of the Samaritans believed; at that miracle, in the place where it was wrought, only that house believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252016.html'
source_title="Tractates on John 16"
