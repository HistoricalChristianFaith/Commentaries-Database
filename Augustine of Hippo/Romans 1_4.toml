[[commentary]]
quote='''
Paul had to oppose the unbelief of those who accept our Lord Jesus Christ only according to the man whom he put on but do not understand his divinity, which sets him apart from every other creature.
'''
source_url=''
source_title="RUDIMENTARY EXPOSITION OF THE EPISTLE TO THE ROMANS 4"

[[commentary]]
quote='''
Christ is the son of David in weakness according to the flesh but Son of God in power according to the Spirit of sanctification.… Weakness relates to David but life eternal to the power of God.
'''
source_url=''
source_title="RUDIMENTARY EXPOSITION OF THE EPISTLE TO THE ROMANS 5"

[[commentary]]
quote='''
Jesus was predestined, so that he who was to be the Son of David according to the flesh should nonetheless be in power the Son of God, according to the Spirit of sanctification, for he was born of the Holy Spirit and the Virgin Mary. This is that unique act, performed in an ineffable manner, the assumption of a man by the Word of God, so that he might truly and properly be called at once the Son of God and the Son of Man—the Son of Man because of the man who was assumed, the Son of God because of the only begotten God who assumed him.
'''
source_url=''
source_title="ON PREDESTINATION 15.31"

[[commentary]]
quote='''
Accordingly, whoever denies predestination of the Son of God, denies that He was also Himself the Son of man. But, on account of those who are disputatious, let us also on this subject listen to the apostle in the exordium of his epistles. For both in the first of his epistles, which is that to the Romans, and in the beginning of the epistle itself, we read: "Paul, a servant of Jesus Christ, called [to be] an apostle, separated unto the gospel of God, which He had promised afore by His prophets in the Holy Scriptures, concerning His Son, who was made for Him of the seed of David according to the flesh, who was predestinated the Son of God in power, according to the Spirit of holiness, by the resurrection from the dead." In respect, then, of this predestination also, He was gloried before the world was, in order that His glory might be, by the resurrection from the dead, with the Father, at whose right hand He sitteth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520105.html'
source_title="Tractates on John 105"

[[commentary]]
quote='''
When he says: According to the Spirit of sanctification from the resurrection of the dead, that is, because they received the gift of the Spirit after his resurrection; and he mentions the resurrection of the dead, because in him we were all crucified and rose again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
