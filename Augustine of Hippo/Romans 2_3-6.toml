[[commentary]]
quote='''
He spareth them for one reason, they answer for another, because they still live. For the Apostle telleth us wherefore He spareth, he expoundeth the grounds of the long-suffering of God: “And thinkest thou this, O man, that judgest them which do such things, and doest the same, that thou shalt escape the judgment of God? Or despisest thou the riches of His goodness, and forbearance, and long-suffering; not knowing that the long-suffering of God leadeth thee to repentance?” “But thou,” that is, he who answereth and saith, If I displeased God, He would not spare me, hear what he worketh for himself; hear the Apostle; “but after thy hardness and impenitent heart treasurest up into thyself wrath against the day of wrath, and revelation of the righteous judgment of God; who will render to every man according to his deeds.” He therefore increaseth His long-suffering, thou increasest thine iniquity. His treasure will consist in eternal mercy towards those who have not despised His mercy; but thy treasure will be discovered in wrath, and what thou daily layest up by little and little, thou wilt find in the accumulated mass; thou layest up by the grain, but thou wilt find the whole heap. Omit not to watch thy slightest daily sins: rivers are filled from the smallest drops.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"

[[commentary]]
quote='''
Hear the Apostle distinguishing each season, and do thou also distinguish it.…“Thinkest thou,” he saith, “O man, that judgest them that do such things, and doest the same, that thou shalt escape the judgment of God?” And as if we were to reply, Why do I commit such sins daily, and no evil occurreth unto me? he goeth on to show to him the season of mercy: “Despisest thou the riches of His goodness, and forbearance, and long-suffering?” And he did indeed despise them; but the Apostle hath made him anxious. “Not knowing,” he saith, “that the goodness of God leadeth thee to repentance?” Behold the season of mercy. But that he might not think this would last for ever, how did he in the next verse raise his fears? Now hear the season of judgment; thou hast heard the season of mercy, on which account, “mercy and judgment will I sing unto Thee, O Lord:” “But thou,” saith the Apostle, “after thy hardness and impenitent heart, treasurest up unto thyself wrath against the day of wrath, and revelation of the righteous judgment of God, who will render to every man according to his deeds.” Lo, “mercy and judgment.” But he hath threatened concerning judgment: is therefore the judgment of God to be feared only, and not to be loved? To be feared by the wicked on account of punishment, to be loved by the good on account of the crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"
