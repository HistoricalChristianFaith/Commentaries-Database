[[commentary]]
quote='''
It is, therefore, with those disciples who so believe in Him, that, filled with the Holy Spirit, or, in other words, with the gift of divine grace, they no longer belong to those who, "ignorant of the righteousness of God, and going about to establish their own, have not submitted themselves to the righteousness of God;" nor to those of whom it is said, "They loved the praise of men more than the praise of God:" that the prophecy harmonizes, which finds its fulfillment in their own case: "They shall walk, O Lord, in the light of Thy countenance: and in Thy name shall they rejoice all the day; and in Thy righteousness shall they be exalted: for Thou art the glory of their strength." Rightly enough is it said to such, "They shall cast you out of the synagogues;" that is, they who "have a zeal for God, but not according to knowledge;" because, "ignorant of God's righteousness, and going about to establish their own," they expel those who are exalted, not in their own righteousness, but in God's, and have no cause to be ashamed at being expelled by men, since He is the glory of their strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252093.html'
source_title="Tractates on John 93"
