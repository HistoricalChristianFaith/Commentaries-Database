[[commentary]]
quote='''
(Tr. xlix. 16) Silently, i. e. speaking in a low voice. For she did speak, saying, The Master is come, and calleth for thee.

(Tr. xlix. 16) We may observe that the Evangelist has not said, where, or when, or how, the Lord called Mary, but for brevity's sake has left it to be gathered from Martha's words.

(Tr. xlix. non occ.) So we see, if she had known of His arrival before, she would not have let Martha go without her.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And when she had so said, she went ' her way, and called Mary her sister silently, saying, The Master is come, and calleth for thee." It is worthy of notice the way in which the whispering of her voice was denominated silence. For how could she be silent, when she said, "The Master is come, and calleth for thee"? It is also to be noticed why it is that the evangelist has not said where, or when, or how the Lord called for Mary; namely, that in order to preserve the brevity of the narrative, it may rather be understood from the words of Martha.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
