[[commentary]]
quote='''
Moreover, the sentences are sometimes so put as to exercise the judgment of the inquirer. An instance of this kind occurs in what is said in the Epistle to the Galatians: "Bear ye one another's burdens, and so ye will fulfil the law of Christ. For if a man thinketh himself to be something, when he is nothing, he deceiveth himself. But it is meet that every man should prove his own work; and then shall he have rejoicing in himself, and not in another. For every man shall bear his own burden." Now, unless the word "burden" can be taken in different senses, without doubt one would suppose that the same writer contradicts himself in what he says here, and that, too, when the words are placed in such close neighbourhood in one paragraph. For when he has just said, "One shall bear another's burdens," after the lapse of a very brief interval he says, "Every man shall bear his own burden." But the one refers to the burdens which are to be borne in sharing in one's infirmity, the other to the burdens borne in the rendering of an account of our own actions to God: the former are burdens to be borne in our [duties of] fellowship with brethren; the latter are those peculiar to ourselves, and borne by every man for himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 30"
