[[commentary]]
quote='''
You though, standing there, having made no decision to put yourself right—let me speak like this as though to a single person. Whoever you are, you do not want to put yourself right; what are you promising yourself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252040.html'
source_title="SERMON 40:2"

[[commentary]]
quote='''
Hear the Scripture: “I will not the death of a sinner, but rather that he should turn, and live.” By these words of God, he is brought back to hope; but there is another snare to be feared, lest through this very hope he sin the more. What then didst thou also say, thou who through hope sinnest yet more? “Whensoever I turn, God will forgive me all; I will do whatsoever I will.” Say not then, “To-morrow I will turn, to-morrow I will please God; and all to-day’s and yesterday’s deeds shall be forgiven me.” Thou sayest true: God hath promised pardon to thy conversion; He hath not promised a to-morrow to thy delay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520145.html'
source_title="Exposition on Psalm 145"
