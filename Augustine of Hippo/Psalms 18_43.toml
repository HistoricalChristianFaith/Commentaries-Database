[[commentary]]
quote='''
“Thou wilt deliver Me from the contradictions of the people” (ver. 43). Thou wilt deliver Me from the contradictions of them who said, “If we send Him away, all the world will go after Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
