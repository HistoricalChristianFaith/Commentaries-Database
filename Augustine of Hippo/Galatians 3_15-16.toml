[[commentary]]
quote='''
What Testament? To Abraham have been spoken the promises, and to his seed. The Apostle saith, “Nevertheless, a man’s testament confirmed no one maketh void, or super-addeth to: to Abraham have been spoken the promises, and to his seed. He saith not, And to seeds, as if in many; but as if in one, And to thy Seed, which is Christ.” In this Christ, therefore, what Testament hath been promised? “In thy seed shall be blessed all nations.” Thou that hast given up the unity of all nations, and in a part hast remained, hast polluted His Testament.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
