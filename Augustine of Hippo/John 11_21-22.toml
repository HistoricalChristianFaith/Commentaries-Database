
[[commentary]]
quote='''
"And many of the Jews had come to Martha and Mary, to comfort them concerning their brother. Then Martha, as soon as she heard that Jesus was coming, went and met Him; but Mary sat [still] in the house. Then said Martha unto Jesus, Lord, if Thou hadst been here, my brother had not died. But I know that even now, whatsoever Thou wilt ask of God, God will give it Thee:" She did not say, But even now I ask Thee to raise my brother to life again. For how could she know if such a resurrection would be of benefit to her brother? She only said, I know that Thou canst, and whatsoever Thou art pleased, Thou doest: for Thy doing it is dependent on Thine own judgment, not on my presumption. "But even now I know that, whatsoever Thou wilt ask of God, God will give it Thee."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
