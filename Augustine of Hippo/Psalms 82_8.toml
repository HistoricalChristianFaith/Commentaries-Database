[[commentary]]
quote='''
But as to David, why do I say that his prophecy extends to all nations, when we have just heard the psalm (and it is difficult to mention a psalm in which the same is not sounded forth)? But certainly, as I have said. we have been just singing, "Arise, O God, judge the earth; for Thou shalt inherit among all nations." And this is why the Donatists are as men cast forth from the marriage: just as the man who had not a wedding garment was invited, and came, but was cast forth from the number of the guests because he had not the garment to the glory of the bridegroom; for he who seeks his own glory, not Christ's, has not the wedding garment: for they refuse to agree with him who was the friend of the Bridegroom, and says, "This is He that baptizeth." And deservedly was that which he was not made, by way of rebuke, an objection to him who had not the wedding garment, "Friend, how art thou come hither? " And just as he was speechless, so also are these. For what can tongue-clatter avail when the heart is mute? For they know that inwardly, and with their own selves, they have not anything to say. Within, they are mute; without, they make a din. But whether they will or no, they hear this sung even among themselves, "Arise, O God, judge the earth; for Thou shalt inherit among the nations "and by not communicating with all nations, what do they but acknowledge themselves to be disinherited?

Now what I said, brethren, that prophecy extends to all nations (for I wish to show you another meaning in the expression, "Containing two or three metretae apiece "),-that prophecy, I say, extends to all nations, is pointed out, as we have just now reminded you, in Adam, "who is the figure of Him that was to come." Who does not know that from him all nations are sprung; and that in the four letters of his name the four quarters of the globe, by their Greek appellations, are indicated? For if the east, west, north, and south are expressed in Greek even as Holy Scripture mentions them in various places, the initial letters of the words, thou wilt find, make the word Adam: for in Greek the four quarters of the world are called Anatole, Dysis, Arktos, Mesembria. If thou write these four words, one under the other, like four verses, the capital letters form the word Adam. The same is represented in Noah, by reason of the ark, in which were all animals, significant of all nations: the same in Abraham, to whom it was said more clearly, "In thy seed shall all nations be blessed:" the same in David, from whose psalms, to omit other expressions, we have just been singing, "Arise, O God, judge the earth; for Thou shalt inherit among all nations." Now to what God is it said "Arise," but to Him who slept? "Arise, O God, judge the earth." As if it were said, Thou hast been asleep, having been judged by the earth; arise, to judge the earth. And whither does that prophecy extend, "For Thou shalt inherit among all nations"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"
