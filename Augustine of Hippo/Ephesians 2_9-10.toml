[[commentary]]
quote='''
Look back then upon the Framer of thy life, the Author of thy substance, of thy righteousness, and of thy salvation: “meditate upon the works of His hands,” for the righteousness too which is in thee, thou wilt find to pertain to His hand. Hear the Apostle teaching thee this, “not of works,” he saith, “lest any should boast.” Have we no good works? Plainly we have: but see what follows; “for we are His workmanship,” saith he. “We are His workmanship:” perhaps in thus speaking of workmanship, he meant to mention the nature whereby we are men? Evidently not: he was speaking of works. But let us not make conjectures; let the text go on, “for we are His workmanship, created in Christ Jesus unto good works.” Think not then that thou thyself doest anything, save in so far as thou art evil.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
