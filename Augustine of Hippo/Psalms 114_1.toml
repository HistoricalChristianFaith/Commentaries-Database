[[commentary]]
quote='''
Let us therefore consider what we are taught here; since both those deeds were typical of us, and these words exhort us to recognise ourselves. For if we hold with a firm heart the grace of God which hath been given us, we are Israel, the seed of Abraham: unto us the Apostle saith, “Therefore are ye the seed of Abraham.”…Let therefore no Christian consider himself alien to the name of Israel. For we are joined in the corner stone with those among the Jews who believed, among whom we find the Apostles chief. Hence our Lord in another passage saith, “And other sheep I have, which are not of this fold; them also I must bring, that there may be one fold and one Shepherd.” The Christian people then is rather Israel, and the same is preferably the house of Jacob; for Israel and Jacob are the same. But that multitude of Jews, which was deservedly reprobated for its perfidy, for the pleasures of the flesh sold their birthright, so that they belonged not to Jacob, but rather to Esau. For ye know that it was said with this hidden meaning, “That the elder shall serve the younger.”

But Egypt, since it is said to mean affliction, or one who afflicteth, or one who oppresseth, is often used for an emblem of this world; from which we must spiritually withdraw, that we may not be bearing the yoke with unbelievers. For thus each one becometh a fit citizen of the heavenly Jerusalem, when he hath first renounced this world; just as that people could not be led into the land of promise, save first they had departed from Egypt. But as they did not depart thence, until freed by Divine help; so no man is turned away in heart from this world, unless aided by the gift of the Divine mercy. For what was there once prefigured, the same is fulfilled in every faithful one in the daily travailings of the Church, in this end of the world, in this, as the blessed John writeth, last time. Hear the Apostle the teacher of the Gentiles, thus instructing us: “I would not, brethren, that ye should be ignorant, how that all our fathers were under the cloud, and all passed through the sea; and were all baptized unto Moses in the cloud and in the sea, and did all eat the same spiritual meat, and did all drink the same spiritual drink; for they drank of that spiritual rock that followed them, and that rock was Christ. But with many of them God was not well pleased, for they were overthrown in the wilderness. Now these things were our examples.” What more do ye wish, most beloved brethren? For it is surely clear, not from human conjecture, but from the declaration of an Apostle, that is, of God and our Lord: for God spoke in them, and though from clouds of flesh, yet it was God who thundered: surely then it is clear by so great testimony that all these things which were done in figure, are now fulfilled in our salvation; because then the future was predicted, now the past is read, and the present observed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
