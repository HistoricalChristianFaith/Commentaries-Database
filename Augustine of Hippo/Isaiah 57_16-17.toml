[[commentary]]
quote='''
Let her then ask of Him, and hear “Why?” For she is in the Psalm enquiring the cause of her dejection; saying, “Why hast Thou cast me off? and why go I mourning?” Let her hear from Isaiah; let the lesson which has just been read, suggest itself to her. “The spirit shall go forth from me, and every breath have I made. For iniquity have I a little afflicted him; I hid my face from him, and he departed from me sorrowful in the ways of his heart.” Why then didst thou ask, “Why hast Thou cast me off, and why go I mourning?” Thou hast heard, it was “for iniquity.” “Iniquity” is the cause of thy mourning; let “Righteousness” be the cause of thy rejoicing! Thou wouldest sin; and yet thou wouldest fain not suffer; so that it was too little for thee to be thyself unrighteous, without also wishing Him to be unrighteous, in that thou wouldest fain not be punished by Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252043.html'
source_title="Exposition on Psalm 43"
