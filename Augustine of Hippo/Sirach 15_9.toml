[[commentary]]
quote='''
The old song sings about sexual lust, the new song sings of divine love. If your song is moved by lust, then you are singing an old song. Let the words of the new song resonate in your mouth, but if you are sinner there is no such thing as beautiful praise on your lips. It is best to be renewed and chastened than to continue singing the same old song. If, in fact, you have become a new person, even if you remain silent and your singing never reaches human ears, your heart elevates the new inner song so that it reaches the ear of God who has restored you. You love, and, even if you are silent, your love is itself a voice that sings to God.
'''
source_url=''
source_title="EXPOSITIONS OF THE PSALMS 95:2"

[[commentary]]
quote='''
“Let praises be pleasant to our God.” How? If He be praised by our good lives. Hear that then praise will be pleasant to Him. In another place it is said, “Praise is not seemly in the mouth of a sinner.” If then in the mouth of a sinner praise is not seemly, neither is it pleasant, for that only is pleasant which is seemly.…For praise may be pleasant to a man, when he heareth one praising with neat and clever sentiments, and with a sweet voice; but “let praise be pleasant to our God,” whose ears are open not to the mouth, but to the heart; not to the tongue, but to the life of him that praiseth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
