[[commentary]]
quote='''
“And Thou hast girded me with strength to the war” (ver. 39). And the loose desires of my flesh hast Thou bound up with strength, that in such a fight I may not be encumbered. “Thou hast supplanted under me them that rose up against me.” Thou hast caused them to be deceived, who followed upon me, that they should be brought under me, who desired to be over me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
