[[commentary]]
quote='''
And what shall we sing there, save His praises? What else shall we say there, save, “Thou art my God, and I will confess unto Thee; Thou art my God, and I will praise Thee. I will confess unto Thee, for Thou hast heard me, and art become my Salvation.” We will not say these things in loud words; but the love that abideth in Him of itself crieth out in these words, and these words are love itself. Thus as he began with praise, so he endeth: “Confess unto the Lord, for He is gracious, and His mercy endureth for ever” (ver. 29). With this the Psalm commenceth, with this it endeth; since, as from the commencement which we have left behind, so in the end, whither we are returning, there is not anything that can more profitably please us, than the praise of God, and Allelujah evermore.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
