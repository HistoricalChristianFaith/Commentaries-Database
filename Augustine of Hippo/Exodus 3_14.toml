[[commentary]]
quote='''
But now the Lord speaks to Moses—you know all this, and I won't keep you longer on it, for lack of time—"I am who I am; he who is sent me." When he asked God's name, you see, this is what was said: "I am who I am. And you shall say to the children of Israel, he who is sent me to you." What's this all about? O God, O Lord of ours, what are you called? "I am called He is," he said. What does it mean, I am called He is? "That I abide forever, that I cannot change." Things which change are not, because they do not last. What is, abides. But whatever changes was something and will be something; yet you cannot say it is, because it is changeable. So the unchangeableness of God was prepared to suggest itself by this phrase "I am who I am."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%25206.html'
source_title="SERMON 6.4"

[[commentary]]
quote='''
Magnificently and divinely, therefore, our God said to his servant: "I am that I am," and "You shall say to the children of Israel, He who is sent me to you." For he truly is because he is unchangeable. For every change makes what was not, to be. Therefore he truly is, who is unchangeable; but all other things that were made by him have received being from him each in its own measure.
'''
source_url=''
source_title="ON THE NATURE OF THE GOOD 19"

[[commentary]]
quote='''
He is the first and greatest existence, who is utterly unchangeable and who could say most perfectly, "I am who I am, and you shall say to them, "He who is has sent me to you." As a result, the other things which exist could not exist except by him, and these things are good insofar as they have received the ability to be.
'''
source_url=''
source_title="ON CHRISTIAN TEACHING 1.32.35"

[[commentary]]
quote='''
Then too Plato's definition of a philosopher—one who loves God—contains an idea which shines forth everywhere in Scripture. But the most palpable proof to my mind that he was conversant with the sacred books is this, that when Moses, informed by an angel that God wished him to deliver the Hebrews from Egypt, questioned the angel concerning the name of the one who had sent him, the answer received was this: "I am who I am. Thus shall you say to the children of Israel: he who is has sent me to you," as though, in comparison with him who, being immutable, truly is, all mutable things are as if they were not. Now Plato had a passionate perception of this truth and was never tired of teaching it. Yet I doubt whether this idea can be found in any of the works of Plato's predecessors except in the text "I am who I am, and you shall say to them, he who is has sent me to you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%25208.html'
source_title="City of God 8.11"

[[commentary]]
quote='''
But God is without doubt a substance, or perhaps essence would be a better term, which the Greeks call ousia. For just as wisdom is so called from being wise and knowledge is so called from knowing, so essence is so called from being [esse]. And who possesses being in a higher degree than he, who said to his servant Moses, "I am who I am" and "He who is has sent me to you." But all other things that are called essences or substances are susceptible of accidents, by which a change, whether great or small, is brought about in them. But there can be no accidents of this kind in God. Therefore only the essence of God, or the essence which God is, is unchangeable.
'''
source_url=''
source_title="THE TRINITY 5.2.3"

[[commentary]]
quote='''
"In the beginning was the Word." He is the same, and is in the same manner; as He is, so He is always; He cannot be changed; that is, He is. This His name He spoke to His servant Moses: "I am that I am; and He that is hath sent me." Who then shall comprehend this when you see that all mortal things are variable; when you see that not only do bodies vary as to their qualities, by being born, by increasing, by becoming less, by dying, but that even souls themselves through the effect of divers volitions are distended and divided; when you see that men can obtain wisdom if they apply themselves to its light and heat, and also lose wisdom if they remove themselves from it through some evil influence? When, therefore, you see that all those things are variable, what is that which is, unless that which transcends all things which are so that they are not? Who then can receive this? Or who, in what manner soever he may have applied the strength of his mind to touch that which is, can reach to that which he may in any way have touched with his mind?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25202.html'
source_title="Tractates on John 2"

[[commentary]]
quote='''
And be not disturbed by the fact that the verb is put in the future tense. For it is not said, whatsoever He hath heard, or, whatsoever He heareth; but, "whatsoever He shall hear, that shall He speak." For such hearing is everlasting, because the knowing is everlasting. But in the case of what is eternal, without beginning and without end, in whatever tense the verb is put, whether in the past, or present, or future, there is no falsehood thereby implied. For although to that immutable and ineffable nature, there is no proper application of Was and Will be, but only Is: for that nature alone is in truth, because incapable of change; and to it therefore was it exclusively suited to say, "I Am That I Am," and "Thou shalt say unto the children of Israel, He Who Is hath sent me unto you:" yet on account of the changeableness of the times amid which our mortal and changeable life is spent, there is nothing false in our saying, both it was, and will be, and is. It was in past, it is in present, it will be in future ages. It was, because it never was wanting; it will be, because it will never be wanting; it is, because it always is. For it has not, like one who no longer survives, died with the past; nor, like one who abideth not, is it gliding away with the present; nor, as one who had no previous existence, will it rise up with the future. Accordingly, as our human manner of speaking varies with the revolutions of time, He, who through all times was not, is not, and will not by any possibility be found wanting, may correctly bespoken of in any tense whatever of a verb. The Holy Spirit, therefore, is always hearing, because He always knows: ergo, He both knew, and knows, and will know; and in the same way He both heard, and hears, and will hear; for, as we have already said, to Him hearing is one with knowing, and knowing with Him is one with being. From Him, therefore, He heard, and hears, and will hear, of whom He is; and of Him He is, from whom He proceeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252099.html'
source_title="Tractates on John 99"
