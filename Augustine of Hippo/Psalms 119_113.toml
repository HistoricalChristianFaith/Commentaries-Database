[[commentary]]
quote='''
“I have hated the unrighteous; and Thy law have I loved” (ver. 113). He saith not, I hate the wicked, and love the righteous; or, I hate iniquity, and love Thy law; but, after saying, “I have hated the unrighteous,” he explains why, by adding, “and Thy law have I loved;” to show, that he did not hate human nature in unrighteous men, but their unrighteousness whereby they are foes to the law, which he loveth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
