[[commentary]]
quote='''
(Tr. li. 1) See how great was the fruit of His preaching, and how large a flock of the lost sheep of the house of Israel heard the voice of their Shepherd: On the next day much people that were come to the feast, when they heard that Jesus was coming to Jerusalem, took branches of palm trees. The branches of palms are songs of praise, for the victory which our Lord was about to obtain by His death over death, and His triumph over the devil, the prince of death, by the trophy of the cross.

(Tr. li. 2) Hosanna is a simple exclamation, rather indicating some excitement of the mind, than having any particular meaning; like many interjections that we have in Latin.

(Tr. li. 4) It were a small thing to the King eternal to be made a human king. Christ was not the King of Israel, to exact tribute, and command armies, but to direct souls, and bring them to the kingdom of heaven. For Christ then to be King of Israel, was a condescension, not an elevation, a sign of Hispity, not an increase of His power. For He who was called on earth the King of the Jews, is in heaven the King of Angels.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
After our Lord's raising of one to life, who had been four days dead, to the utter amazement of the Jews, some of whom believed on seeing it, and others perished in their envy, because of that sweet savor which is unto life to some, and to others unto death; after He had sat down to meat with Lazarus-the one who had been dead and raised to life-reclining also at table, and after the pouring on His feet of the ointment which had filled the house with its odor; and after the Jews also had shown their own spiritual abandonment in conceiving the useless cruelty and the monstrously foolish and insane guilt of slaying Lazarus;-of all which we have spoken as we could, by the grace of the Lord, in previous discourses: let your Charity now notice how abundant before our Lord's passion was the fruit that appeared of His preaching, and how large was the flock of lost sheep of the house of Israel which had heard the Shepherd's voice.

For the Gospel, the reading of which you have just been listening to, says: "On the next day much people that were come to the feast, when they heard that Jesus was coming to Jerusalem, took branches of palm trees and went forth to meet Him, and cried, Hosanna: blessed is He that cometh in the name of the Lord as the King of Israel." The branches of palm trees are laudatory emblems, significant of victory, because the Lord was about to overcome death by dying, and by the trophy of His cross to triumph over the devil, the prince of death. The exclamation used by the worshipping people is Hosanna, indicating, as some who know the Hebrew language affirm, rather a state of mind than having any positive significance; just as in our own tongue we have what are called interjections, as when in our grief we say, Alas! or in our joy, Ha! or in our admiration, O how fine! where O! expresses only the feeling of the admirer. Of the same class must we believe this word to be, as it has failed to find an interpretation both in Greek and Latin, like that other, "Whosoever shall say to his brother, Raca." For this also is allowed to be an interjection, expressive of angry feelings.

But when it is said, "Blessed is He that cometh in the name of the Lord, [as] the King of Israel," by "in the name of the Lord" we are rather to understand "in the name of God the Father," although it might also be understood as in His own name, inasmuch as He is also Himself the Lord. As we find Scripture also saying in another place, "The Lord rained [upon Sodom fire] from the Lord." But His own words are a better guide to our understanding, when He saith, "I am come in my Father's name, and ye receive me not: another will come in his own name, and him ye will receive." For the true teacher of humility is Christ, who humbled Himself, and became obedient unto death, even the death of the cross. But He does not lose His divinity in teaching us humility; in the one He is the Father's equal, in the other He is assimilated to us. By that which made Him the equal of the Father, He called us into existence; and by that in which He is like unto us, He redeemed us from ruin.

These, then, were the words of praise addressed to Jesus by the multitude, "Hosanna: blessed is He that cometh in the name of the Lord, the King of Israel." What a cross of mental suffering must the Jewish rulers have endured when they heard so great a multitude proclaiming Christ as their King! But what honor was it to the Lord to be King of Israel? What great thing was it to the King of eternity to become the King of men? For Christ's kingship over Israel was not for the purpose of exacting tribute, of putting swords into His soldiers' hands, of subduing His enemies by open warfare; but He was King of Israel in exercising kingly authority over their inward natures, in consulting for their eternal interests, in bringing into His heavenly kingdom those whose faith, and hope, and love were centred in Himself. Accordingly, for the Son of God, the Father's equal, the Word by whom all things were made, in His good pleasure to be King of Israel, was an act of condescension and not of promotion; a token of compassion, and not any increase of power. For He who was called on earth the King of the Jews, is in the heavens the Lord of angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252051.html'
source_title="Tractates on John 51"
