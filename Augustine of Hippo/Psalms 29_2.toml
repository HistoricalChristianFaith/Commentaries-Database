[[commentary]]
quote='''
“Bring unto the Lord glory to His name.” Let Him be made known gloriously throughout the world. “Worship the Lord in His holy court.” Worship the Lord in your heart enlarged and sanctified. For ye are His regal holy habitation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252029.html'
source_title="Exposition on Psalm 29"
