[[commentary]]
quote='''
“These things hast thou done, and I held my tongue” (ver. 21). Therefore the Lord our God shall come, and shall not keep silence. Now, “These things hast thou done, and I held my tongue.” What is, “I held my tongue”? From vengeance I have desisted, my severity I have deferred, patience to thee I have prolonged, thy repentance I have long looked for…“Thou hast imagined iniquity, that I shall be like unto thee;” Thou hast imagined that I shall be like unto thee, while thou wilt not be like unto Me. For, “Be ye,” he saith, “perfect, even as your Father, which is in the heavens, who maketh His sun to rise on the good and evil.” Him thou wouldest not copy, who giveth good things even to evil men, insomuch that sitting thou dost detract even from good men. “I will reprove thee,” when “God manifest shall come, our God, and shall not keep silence,” “I will reprove thee.” And what to thee shall I do in reproving thee? what to thee shall I do? Now thyself thou seest not, I will make thee see thyself. Because if thou shouldest see thyself, and shouldest displease thyself, thou wouldest please Me: but because not seeing thyself thou hast pleased thyself, thou wilt displease both Me and thyself; Me when thou shalt be judged; thyself when thou shalt burn. But what to thee shall I do? He saith. “I will set thee before thy face.” For why wouldest thou escape thyself? At thy back thou art to thyself, thou seest not thyself: I make thee see thyself: what behind thy back thou hast put, before thy face will I put; thou shalt see thy uncleanness, not that thou mayest amend, but that thou mayest blush.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
What saith He in another Psalm? “These things thou hast done,” having enumerated certain sins. “These things thou hast done,” He saith, “and was silent.” What is, “I was silent”? He is never silent with commandment, but meanwhile He is silent with punishment: He is keeping still from vengeance, He doth not pronounce sentence against the condemned. But this man saith thus, I have done such and such things, and God hath not taken vengeance; behold I am whole, nought of ill hath befallen me. “These things thou hast done, and I was silent: thou hast suspected iniquity, that I shall be like unto thee.” What is, “that I shall be like unto thee”? Because thou art unjust, even Me thou hast deemed unjust; as though an approver of thy misdeeds, and no adversary, no avenger thereof. And what afterwards saith He to thee? “I will convict thee, and will set thee before thine own face”? What is this? Because now by sinning behind thy back thou settest thyself, seest not thyself, examinest not thyself; I will set thee before thyself, and will bring upon thee punishment from thyself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"

[[commentary]]
quote='''
“And they have said, The Lord shall not see” (ver. 7): He observeth not, regardeth not these things: He careth for other matters, He understandeth not. These are the two assertions of the wicked: one which I have just quoted, “These things hast thou done, and I held my tongue, and thou thoughtest unrighteousness, that I will be like thyself.” What meaneth, “that I will be like thyself”? Thou thinkest that I see thy deeds, and that they are pleasing unto Me, because I do not punish them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
