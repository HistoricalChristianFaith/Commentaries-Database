[[commentary]]
quote='''
“Let the deceitful lips be made dumb” (ver. 18). In making known to the peoples Thy mysteries wrought in me, strike with dumb amazement the lips of them that invent falsehood of me. “Which speak iniquity against the Righteous, in pride and contempt.” Which speak iniquity against Christ, in their pride and contempt of Him as a crucified man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
