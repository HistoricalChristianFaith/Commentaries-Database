[[commentary]]
quote='''
“The words of his mouth are iniquity and deceit: he would not understand, that he might do good” (ver. 3). Ye see that he attributeth that to the will: for there are men who would understand and cannot, and there are men who would not understand, and therefore understand not. “He would not understand, that he might do good.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252036.html'
source_title="Exposition on Psalm 36"

[[commentary]]
quote='''
And yet we must not on this account betake ourselves for refuge to the shades of ignorance, with the view of finding our excuse therein. It is one thing to be ignorant, and another thing to be unwilling to know. For the will is at fault in the case of the man of whom it is said, "He is not inclined to understand, so as to do good." But even the ignorance, which is not theirs who refuse to know, but theirs who are, as it were, simply ignorant, does not so far excuse any one as to exempt him from the punishment of eternal fire, though his failure to believe has been the result of his not having at all heard what he should believe; but probably only so far as to mitigate his punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 5"
