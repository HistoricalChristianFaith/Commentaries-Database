[[commentary]]
quote='''
“The Lord out of Zion bless thee, who made heaven and earth” (ver. 3). He exhorts many to bless, and Himself blesseth one, because He maketh one out of many, since “it is good and pleasant for brethren to dwell together in one.” It is a plural number, brethren, and yet singular, to dwell together in one. Let none of you say, It cometh not to me. Knowest thou of whom he speaks, “the Lord bless thee out of Zion.” He blessed one. Be one, and the blessing cometh to thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520134.html'
source_title="Exposition on Psalm 134"
