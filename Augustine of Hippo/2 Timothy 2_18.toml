[[commentary]]
quote='''
For hear what follows after the declaration of this resurrection which is by faith, lest any should think this to be the only resurrection, or fall into that desperation and error of men who perverted the thoughts of others, "saying that the resurrection is past already," of whom the apostle saith, "and they overthrow the faith of some." For I believe that they were saying to them such words as these: "Behold, when the Lord saith, And he that believeth in me is passed from death unto life;" the resurrection has already taken place in believing men, who were before unbelievers: how can a second resurrection be meant?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252022.html'
source_title="Tractates on John 22"
