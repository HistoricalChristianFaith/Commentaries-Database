[[commentary]]
quote='''
Sometimes, too, this grace is bestowed upon the children of unbelievers, when they happen by some means or other to fall, by reason of God's secret providence, into the hands of pious persons; but, on the other hand, the children of believers fail to obtain grace, some hindrance occurring to prevent the approach of help to rescue them in their danger. These things, no doubt, happen through the secret providence of God, whose judgments are unsearchable, and His ways past finding out. These are the words of the apostle; and you should observe what he had previously said, to lead him to add such a remark. He was discoursing about the Jews and Gentiles, when he wrote to the Romans—themselves Gentiles—to this effect: "For as ye, in times past, have not believed God, yet have now obtained mercy through their unbelief; even so have these also now not believed, that through your mercy they also may obtain mercy; for God hath concluded them all in unbelief, that He might have mercy upon all." Now, after he had thought upon what he said, full of wonder at the certain truth of his own assertion, indeed, but astonished at its great depth, how God concluded all in unbelief that He might have mercy upon all,—as if doing evil that good might come,—he at once exclaimed, and said, "O the depth of the riches both of the wisdom and knowledge of God! how unsearchable are His judgments, and His ways past finding out!" Perverse men, who do not reflect upon these unsearchable judgments and untraceable ways, indeed, but are ever prone to censure, being unable to understand, have supposed the apostle to say, and censoriously gloried over him for saying, "Let us do evil, that good may come!" God forbid that the apostle should say so! But men, without understanding, have thought that this was in fact said, when they heard these words of the apostle: "Moreover, the law entered, that the offence might abound; but where sin abounded, grace did much more abound." But grace, indeed, effects this purpose—that good works should now be wrought by those who previously did evil; not that they should persevere in evil courses and suppose that they are recompensed with good. Their language, therefore, ought not to be: "Let us do evil, that good may come;" but: "We have done evil, and good has come; let us henceforth do good, that in the future world we may receive good for good, who in the present life are receiving good for evil."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 44"
