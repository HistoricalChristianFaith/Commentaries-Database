
[[commentary]]
quote='''
“I have been strengthened in Thee from the womb” (ver. 10). It is the womb of the Synagogue, which did not carry Me, but threw Me out: but I fell not, for Thou heldest me. “From My mother’s womb Thou art My God.” “From My mother’s womb: My mother’s womb did not cause that, as a babe, I should be forgetful of Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
