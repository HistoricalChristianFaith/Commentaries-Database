[[commentary]]
quote='''
She was saved there, and thus represented the Church of the Gentiles: whence our Lord said to the haughty Pharisees, “Verily I say unto you, that the publicans and the harlots go into the kingdom of God before you.” They go before, because they do violence: they push their way by faith, and to faith a way is made, nor can any resist, since they who are violent take it by force. For it is written, “The kingdom of Heaven suffereth violence, and the violent take it by force.” Such was the conduct of the robber, more courageous on the cross than in the place of ambush.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
