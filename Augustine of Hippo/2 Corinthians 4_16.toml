[[commentary]]
quote='''
The renewal of humankind, begun in the sacred bath of baptism, proceeds gradually and is accomplished more quickly in some individuals and more slowly in others. But many are in progress toward the new life if we consider the matter carefully and without prejudice. As the apostle says: "Even though our outer man is decaying, yet our inner man is being renewed day by day." He says that the inner man is renewed day by day in order that he may become perfect, but you would have him begin with perfection. Would that you really did desire this! But you seek to lead the unwary astray rather than to uplift the weak.
'''
source_url=''
source_title="THE WAY OF LIFE OF THE CATHOLIC CHURCH 1.35.80"

[[commentary]]
quote='''
“Behold, thou hast made my days old” (ver. 5). For these days are “waxing old.” I long for new days “that never shall wax old,” that I may say, “Old things have passed away; behold, things are become new.” Already new in hope; then in reality. For though, in hope and in faith, made new already, how much do we even now do after our old nature! For we are not so completely “clothed upon” with Christ, as not to bear about with us anything derived from Adam. Observe that Adam is “waxing old” within us, and Christ is being “renewed” in us. “Though our outward man is perishing, yet is our inward man being renewed day by day.” Therefore, while we fix our thoughts on sin, on mortality, on time, that is hastening by, on sorrow, and toil, and labour, on stages of life following each other in succession, and continuing not, passing on insensibly from infancy even to old age; whilst, I say, we fix our eyes on these things, let us see here “the old man,” the “day that is waxing old;” the Song that is out of date; the Old Testament; when however we turn to the inner man, to those things that are to be renewed in place of these which are to be changed, let us find the “new man,” the “new day,” the “new song,” the “New Testament;” and that “newness,” let us so love, as to have no fears of its “waxing old.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
