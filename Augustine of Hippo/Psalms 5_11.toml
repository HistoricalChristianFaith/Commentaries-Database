[[commentary]]
quote='''
“And let all rejoice that hope in Thee;” those of course to whose taste the Lord is sweet. “They will exult for evermore, and Thou wilt dwell in them” (ver. 11). This will be the exultation for evermore, when the just become the Temple of God, and He, their Indweller, will be their joy. “And all that love Thy name shall glory in Thee:” as when what they love is present for them to enjoy. And well is it said, “in Thee,” as if in possession of the inheritance, of which the title of the Psalm speaks: when they too are His inheritance, which is intimated by, “Thou wilt dwell in them.” From which good they are kept back, whom God, according to the multitude of their ungodlinesses, driveth out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25205.html'
source_title="Exposition on Psalm 5"
