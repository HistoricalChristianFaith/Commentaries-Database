[[commentary]]
quote='''
Next, since God justifieth, that is, maketh men righteous, by healing them from their iniquities, a prayer followeth: “Remember me, O Lord, according to the favour that Thou bearest unto Thy people” (ver. 4): that is, that we may be among those with whom Thou art well pleased; since God is not well pleased with them all. “O visit me with Thy salvation.” This is the Saviour Himself, in whom sins are forgiven, and souls healed, that they may be able to keep judgment, and do righteousness; and since they who here speak know such men to be blessed, they pray for this themselves.…“Visit us,” then, “with Thy salvation,” that is, with Thy Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
