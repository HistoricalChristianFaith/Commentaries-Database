
[[commentary]]
quote='''
“And they cried out unto the Lord when they were in trouble, and He delivered them out of their distresses” (ver. 19). And because it was a sickness not to be pleased, “He sent His Word, and healed them” (ver. 20). See what evil there is in satiety; see whence He delivers, to whom he crieth that loathes his food. “He sent His Word, and healed them, and snatched them,” from whence? not from wandering, not from hunger, not from the difficulty of overcoming sins, but “from their corruption.” It is a sort of corruption of the mind to loathe what is sweet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
