[[commentary]]
quote='''
But how shall he decline, and fall? “For he hath said in his heart, God hath forgotten; He turneth away His face, that He see not unto the end” (ver. 11). This is declining, and the most wretched fall, while the mind of a man prospers as it were in its iniquities, and thinks that it is spared; when it is being blinded, and kept for an extreme and timely vengeance: of which the Psalmist now speaks: “Arise, O Lord God, let Thine hand be exalted” (ver. 12): that is, let Thy power be made manifest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"
