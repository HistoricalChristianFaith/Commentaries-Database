[[commentary]]
quote='''
Likewise, in the same psalm, where it says, "the tongue of your dogs from the enemies by the same," dogs should not always be taken in an evil sense, otherwise the prophet would not blame "dogs not able to bark and loving to dream": 18 doubtless they would be praiseworthy dogs if they both knew how to bark and loved to watch. And certainly those three hundred men—a most sacred number according to the letter of the cross20—would not have been chosen to win the victory because they lapped water as dogs do, unless some great mystery were signified. Good dogs watch and bark to protect their house and their master, their flock and their shepherd. Finally, even here in the praises offered by the church, when a selection is made from this prophecy, it is the tongue of dogs that is mentioned, not their teeth. "The tongue of your dogs," it says, "from the enemies," that is, that those who used to be your enemies and raged against you may become your dogs and may bark for you. It added "from the same" to make them understand that this is not effected by themselves, but "by the same," that is, by his mercy and grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 149"

[[commentary]]
quote='''
Which to the Lord Himself the Prophet speaketh: “That Thy foot may be stained in blood” (ver. 23): that is, in order that they themselves who are turned to Thee, or to deliver whom Thou art turned, though in the deep of the sea by the burden of iniquity they may have been sunk, may make so great proficiency by Thy Grace (for where there hath abounded sin, there hath superabounded grace), that they may become Thy foot among Thy members, to preach Thy Gospel, and for Thy name’s sake drawing out a long martyrdom, even unto blood they may contend. For thus, as I judge, more meetly is perceived His foot stained in blood.

Lastly, he addeth, “The tongue of Thy dogs out of enemies by Himself,” calling those very same that had been about to strive for the faith of the Gospel, even dogs, as though barking for their Lord. Not those dogs, whereof saith the Apostle, “Beware of dogs:” but those that eat of the crumbs which fall from the table of their masters. For having confessed this, the woman of Canaan merited to hear, “O woman, great is thy faith, be it done to thee as thou wilt.” Dogs commendable, not abominable; observing fidelity towards their master, and before his house barking against enemies. Not only “of dogs” he hath said, but “of Thy dogs:” nor are their teeth praised, but their tongue is: for it was not indeed to no purpose, not without a great mystery, that Gedeon was bidden to lead those alone, who should lap the water of the river like dogs; and of such sort not more than three hundred among so great a multitude were found. In which number is the sign of the Cross because of the letter T, which in the Greek numeral characters signifieth three hundred. Of such dogs in another Psalm also is said, “They shall be turned at even, and hunger they shall suffer as dogs.” For even some dogs have been reproved by the Prophet Isaiah, not because they were dogs, but because they knew not how to bark, and loved to sleep. In which place indeed he hath shown, that if they had watched and barked for their Lord, they would have been praiseworthy dogs: just as they are praised, of whom is said, “The tongue of Thy dogs.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
