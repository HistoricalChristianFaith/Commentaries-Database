[[commentary]]
quote='''
The apostle mentions evil, unmarried women who are gossipers and busybodies and says that this vice springs from idleness. "And further," he says, "being idle, they learn to go about from house to house, and are not only idle, but gossipers as well as busybodies, mentioning things they ought not." He had previously said of these, "But refuse younger widows, for when they have wantonly turned away from Christ, they wish to marry and are to be condemned because they have broken their first pledge," that is, they did not persevere in what they had first vowed. However, he does not say "They marry" but "They wish to marry," for it is not the love of their noble vow which prevents many of them from marrying but fear of outright indecency. This itself springs from pride by which human displeasure is more dreaded than the divine displeasure.
'''
source_url='https://www.newadvent.org/fathers/1310.htm'
source_title="On Holy Virginity 33.34-34.34"

[[commentary]]
quote='''
For what hath the apostle Paul said concerning such? Though he saith that young widows may marry if they will: nevertheless he saith in a certain passage, “but more blessed she will be, if so she shall have remained, after my judgment.” He showeth that she is more blessed, if so she shall have remained; but nevertheless that she is not to be condemned, if she shall have willed to marry. But what saith he concerning certain who have vowed and have not paid? “Having,” he saith, “judgment, because the first faith they have made void.” What is, “the first faith they have made void”? They have vowed, and have not paid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
