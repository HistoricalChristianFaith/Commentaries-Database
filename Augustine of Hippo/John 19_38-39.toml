[[commentary]]
quote='''
"And after this, Joseph of Arimathea (being a disciple of Jesus, but secretly for fear of the Jews) besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus. And there came also Nicodemus, who came to Jesus by night at first, bringing a mixture of myrrh and aloes, about an hundred pound weight." We are not to explain the meaning by saying, "first bringing a mixture of myrrh," but by attaching the word "first" to the preceding clause. For Nicodemus had at first come to Jesus by night, as recorded by this same John in the earlier portions of his Gospel. By the statement given us here, therefore, we are to understand that Nicodemus came to Jesus, not then only, but then for the first time; and that he was a regular comer afterwards, in order by hearing to become a disciple; which is certified, nowadays at least, to almost all nations in the revelation of the body of the most blessed Stephen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520120.html'
source_title="Tractates on John 120"
