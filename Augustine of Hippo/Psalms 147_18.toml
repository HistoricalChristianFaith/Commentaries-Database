[[commentary]]
quote='''
Are we then to despair? God forbid. For it goeth on, “He shall send out His Word, and melt them” (ver. 18). Let not then the snow despair, nor the mist, nor the crystal. For of the snow, as of wool, a garment is being made. That mist findeth safety in repentance: for, “whom He predestinated, them He also called.” But even though they be the very hardest among the predestinated, though they have been for a long time hardening, and are become crystal, they will not be hard to the mercy of God. “He shall send out His Word, and melt them.” What is “melt”? Understand not “melt” in an ill sense: it meaneth, He shall liquefy, He shall thaw them. For they are hard through pride. Rightly is pride called also dulness: for whatever is dull, is also cold.…Despair not even of the crystal. Hear a saying of the crystal. “Who before was a blasphemer, and a persecutor, and injurious.” But wherefore doth God melt the crystal? That the snow despair not of itself. For he saith, “For this cause I obtained mercy, that in me first Jesus Christ might show forth all long-suffering, for a pattern to them that hereafter should believe on Him unto eternal life.” God then calleth unto the Gentiles, “Be melted, O crystal; come, ye snows.” “His Spirit shall blow, and the waters shall flow.” Lo, the “crystal” and the “snows” are melted, they turn into water, “let them that thirst, come and drink.” Saul, hard as crystal, persecuted Stephen unto death; Paul, now in the living water, calleth the Gentiles to the Fount.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
