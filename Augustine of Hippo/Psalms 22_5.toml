
[[commentary]]
quote='''
“They cried unto Thee, and were saved.” They cried unto Thee, not in the words of sins, from which salvation is far; and therefore were they saved. “They hoped in Thee, and were not confounded” (ver. 5). “They hoped in Thee,” and their hope did not deceive them. For they placed it not in themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252022.html'
source_title="Exposition on Psalm 22"
