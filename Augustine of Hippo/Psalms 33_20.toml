[[commentary]]
quote='''
“My soul shall be patient for the Lord:” that hereafter it may be filled with dainties incorruptible, meanwhile, whilst here it remaineth, my soul shall be patient for the Lord. “For He is our Helper and Defender” (ver. 20): our Helper He is, while we endeavour after Him; and our Defender, while we resist the adversary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
