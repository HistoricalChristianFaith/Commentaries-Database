[[commentary]]
quote='''
And he returns to this, “From the morning watch let Israel hope in the Lord.” Not only “let Israel hope,” but “from the morning watch let Israel hope.” Do I then blame the hope of the world, when it is placed in the Lord? No; but there is another hope belonging to Israel. Let not Israel hope for riches as his highest good, not for health of body, not for abundance of earthly things: he will indeed have to suffer tribulation here, if it should be his lot to suffer any troubles for the sake of the truth.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520130.html'
source_title="Exposition on Psalm 130"
