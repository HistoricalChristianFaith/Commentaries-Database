[[commentary]]
quote='''
A certain man had grown dull and cold in fervour of prayer, and said, “Tribulation and grief I found, and on the Name of the Lord I called.” He found tribulation as it were some profitable thing; he had rotted in the slough of his sins; now he had continued without feeling, he found tribulation to be a sort of caustic and cutting. “I found,” he saith, “tribulation and grief, and on the Name of the Lord I called.” And truly, brethren, tribulations are known to all men. Behold those afflictions that abound in mankind; one afflicted with loss bewaileth; another smitten with bereavement mourneth; another exiled from country grieveth and desireth to return, deeming sojourning intolerable; another’s vineyard is hailed upon, he observeth his labours and all his toil spent in vain. When can a human being not be made sad? An enemy he findeth in a friend. What greater misery in mankind? These things all men do deplore and grieve at, and these are tribulations: in all these they call upon the Lord, and they do rightly. Let them call upon God, He is able either to teach how it must be borne, or to heal it when borne. He knoweth how not to suffer us to be tried above that we are able to bear. Let us call upon God even in those tribulations: but these tribulations do find us; as in another Psalm is written, “Helper in tribulations which have found us too much:” there is a certain tribulation which we ought to find. Let such tribulations find us: there is a certain tribulation which we ought to seek and to find. What is that? The above-named felicity in this world, abundance of temporal things: that is not indeed tribulation, these are the solaces of our tribulation. Of what tribulation? Of our sojourning. For the very fact that we are not yet with God, the very fact that we are living amid trials and difficulties, that we cannot be without fear, is tribulation: for there is not that peace which is promised us. He that shall not have found this tribulation in his sojourning, doth not think of going home to his father-land. This is tribulation, brethren. Surely now we do good works, when we deal bread to the hungry, home to the stranger, and the like: tribulation even this is. For we find pitiful objects upon whom we show pity; and the pitiful case of pitiful objects maketh us compassionate. How much better now would it be with thee in that place, where thou findest no hungry man whom thou mayest feed, where thou findest no stranger whom thou mayest take in, no naked man whom thou mayest cover, no sick man whom thou mayest visit, no litigant whom thou mayest set at one! For all things in that place are most high, are true, are holy, are everlasting. Our bread in that place is righteousness, our drink there is wisdom, our garment there is immortality, our house is everlasting in the heavens, our stedfastness is immortality: doth sickness come over? Doth weariness weigh down to sleep? No death, no litigation: there peace, quiet, joy, righteousness. No enemy hath entrance, no friend falleth away. What is the quiet there? If we think and observe where we are, and where He that cannot lie hath promised that we are to be, from His very promise we find in what tribulation we are. This tribulation none findeth, but he that shall have sought it. Thou art whole, see if thou art miserable; for it is easy for him that is sick to find himself miserable: when thou art whole, see if thou art miserable; that thou art not yet with God. “Tribulation and grief I found, and on the Name of the Lord I called.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
[[commentary]]
quote='''
If therefore thou feelest the passions of this world, even when thou art happy, thou understandest now that thou art in the winepress.…If therefore the world smile upon thee with happiness, imagine thyself in the winepress, and say, “I found trouble and heaviness, and I did call upon the name of the Lord.” He said not, I found trouble, without meaning, of such a kind as was hidden: for some troubles are hidden from some in this world, who think they are happy while they are absent from God. “For as long as we are in the body,” he saith, “we are absent from the Lord.” If thou wert absent from thy father, thou wouldest be unhappy: art thou absent from the Lord, and happy? There are then some who think it is well with them. But those who understand, that in whatever abundance of wealth and pleasures, though all things obey their beck, though nothing troublesome creep in, nothing adverse terrify, yet that they are in a bad case as long as they are absent from the Lord; with a most keen eye these have found trouble, and grief, and have called on the name of the Lord. Such is he who sings in this Psalm. Who is he? The Body of Christ. Who is that? You, if you will: all we, if we will: for Christ’s Body is one.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"

[[commentary]]
quote='''
For in these days of mine, “The snares of death compassed me round about, and the pains of hell gat hold upon me” (ver. 3): pains that would not have overtaken me, had I not wandered from Thee. But now they have overtaken me; but I found them not, while I was rejoicing in the prosperity of the world, in which the snares of hell deceive the more.

But after “I too found trouble and heaviness, I called upon the Name of the Lord” (ver. 4). For trouble and profitable sorrow I did not feel; trouble, wherein He giveth aid, unto whom it is said, “O be Thou our help in trouble: and vain is the help of man.” For I thought I might rejoice and exult in the vain help of man; but when I had heard from my Lord, “Blessed are they that mourn, for they shall be comforted:” I did not wait until I should lose those temporal blessings in which I rejoiced, and should then mourn: but I gave heed to that very misery of mine which caused me to rejoice in such things, which I both feared to lose, and yet could not retain; I gave heed to it firmly and courageously, and I saw that I was not only agonized by the adversities of this world, but even bound by its good fortune; and thus “I found the trouble and heaviness” which had escaped me, “and called upon the Name of the Lord; O Lord, I beseech Thee, deliver my soul.” Let then the holy people of God say, “I called upon the Name of the Lord:” and let the remainder of the heathen hear, who do not as yet call upon the Name of the Lord; let them hear and seek, that they may discover trouble and heaviness, and may call upon the Name of the Lord, and be saved.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
