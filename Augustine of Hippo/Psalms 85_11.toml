[[commentary]]
quote='''
“Truth hath sprung out of the earth, and righteousness hath looked down from heaven” (ver. 11). “Truth hath sprung out of the earth:” Christ is born of a woman. The Son of God hath come forth of the flesh. What is truth? The Son of God. What is the earth? Flesh. Ask whence Christ was born, and thou seest that “Truth is sprung out of the earth.” But the Truth which sprang out of the earth was before the earth, and by It the heaven and the earth were made: but in order that righteousness might look down from heaven, that is, in order that men might be justified by Divine grace, Truth was born of the Virgin Mary; that He might be able to offer a sacrifice to justify them, the sacrifice of suffering, the sacrifice of the Cross. And how could He offer a sacrifice for our sins, except He died? How could He die, except He received from us that wherein He might die; that is, unless He received from us mortal flesh, Christ could not have died: because the Word of God dieth not, Godhead dieth not, the Virtue and Wisdom of God doth not die. How should He offer a sacrifice, a healing victim, if He died not? How should He die, unless He clothed Himself with flesh? How should He put on flesh, except truth sprang out of the earth?

On the same passage we may mention another meaning. “Truth is sprung out of the earth:” confession from man. For thou, O man, wast a sinner. O earth, who when thou hadst sinned didst hear the sentence, “Earth thou art, and unto earth shalt thou return,” from thee let truth spring, that righteousness may look down from heaven. How doth truth spring from thee, whilst thou art a sinner, whilst thou art unrighteous? Confess thy sins, and truth shall spring out of thee. For if whilst thou art unrighteous, thou callest thyself just, how can truth spring out of thee? But if being unrighteous thou dost confess thyself to be so, “truth hath sprung out of the earth.”…What “righteousness hath looked down from heaven”? It is that of God, as though He said: Let us spare this man, for he spareth not himself: let us pardon him, for he himself confesseth. He is changed so as to punish his sin: I too will change, so as to set him free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
