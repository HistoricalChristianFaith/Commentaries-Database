[[commentary]]
quote='''
"Then Simon Peter, having a sword, drew it, and smote the high priest's servant, and cut off his right ear. And the servant's name was Malchus." This is the only evangelist who has given us the very name of this servant, as Luke is the only one who tells us that the Lord touched his ear and healed him. The interpretation of Malchus is, one who is destined to reign. What, then, is signified by the ear that was cut off in the Lord's behalf, and healed by the Lord, but the renewed hearing that has been pruned of its oldness, that it may henceforth be in the newness of the spirit, and not in the oldness of the letter? Who can doubt that he, who had such a thing done for him by Christ, was yet destined to reign with Christ? And his being found as a servant, pertains also to that oldness that gendereth to bondage, which is Agar. But when healing came, liberty also was shadowed forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520112.html'
source_title="Tractates on John 112"
