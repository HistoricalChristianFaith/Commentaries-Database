[[commentary]]
quote='''
“Clothed with light as a garment” (ver. 2). Clothed with His Church, because she is made “light” in Him, who before was darkness in herself, as the apostle saith: “Ye were sometime darkness, but now light in the Lord.” “Stretching out the heaven like a skin:” either as easily as thou dost a skin, if it be “as easily,” so that thou mayest take it after the letter; or let us understand the authority of the Scriptures, spread out over the whole world, under the name of a skin; because mortality is signified in a skin, but all the authority of the Divine Scriptures was dispensed unto us through mortal men, whose fame is still spreading abroad now they are dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
