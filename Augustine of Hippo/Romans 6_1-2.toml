[[commentary]]
quote='''
When he says: What then shall we say? Shall we remain in sin, that grace may abound? God forbid! We who are dead to sin, how shall we live in it? By this he shows that it was done regarding past sins, that they should be forgiven, and that in this grace superabounded—that past sins should be remitted. Therefore whoever still seeks increases of sin in order to feel an increase of grace does not understand that he is acting so that grace works nothing in him. For it is the work of grace that we die to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
Wherefore, most dearly beloved, whosoever says, My will suffices for me to perform good works, declines to the right. But, on the other hand, they who think that a good way of life should be forsaken, when they hear God's grace so preached as to lead to the supposition and belief that it of itself makes men's wills from evil to good, and it even of itself keeps them what it has made them; and who, as the result of this opinion, go on to say, "Let us do evil that good may come,"—these persons decline to the left. This is the reason why he said to you, "Turn not aside to the right hand, nor to the left;" in other words, do not uphold free will in such wise as to attribute good works to it without the grace of God, nor so defend and maintain grace as if, by reason of it, you may love evil works in security and safety,—which may God's grace itself avert from you! Now it was the words of such as these which the apostle had in view when he said, "What shall we say, then? Shall we continue in sin that grace may abound?" And to this cavil of erring men, who know nothing about the grace of God, he returned such an answer as he ought in these words: "God forbid. How shall we, that are dead to sin, live any longer therein?" Nothing could have been said more succinctly, and yet to the point. For what more useful gift does the grace of God confer upon us, in this present evil world, than our dying unto sin? Hence he shows himself ungrateful to grace itself who chooses to live in sin by reason of that whereby we die unto sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Letter 2, Section 8"
