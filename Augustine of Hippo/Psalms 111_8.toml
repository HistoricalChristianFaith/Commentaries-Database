[[commentary]]
quote='''
Yet we should not expect here what He promised; we should not hope for it: but “they stand fast for ever and ever, and are done in truth and equity” (ver. 8). It is equitable and just that we should labour here and repose there; since “He sent redemption unto His people” (ver. 9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520111.html'
source_title="Exposition on Psalm 111"
