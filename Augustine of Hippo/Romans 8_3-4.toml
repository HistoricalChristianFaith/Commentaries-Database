[[commentary]]
quote='''
When he says: For what was impossible for the law, in that it was weakened through the flesh, God, sending his own Son in the likeness of sinful flesh, even from sin condemned sin in the flesh, that the righteousness of the law might be fulfilled in us, who walk not according to the flesh but according to the spirit—he teaches most clearly that these very precepts of the law were for this reason not fulfilled, although they ought to have been fulfilled: because those to whom the law was given before grace were given over to carnal goods and desired to acquire happiness from them, and feared nothing except when adversity threatened such goods; and therefore, when those temporal goods were disturbed, they easily withdrew from the precepts of the law. The law, therefore, was weakened by not fulfilling what it commanded, not by its own fault but through the flesh—that is, through those men who, in desiring carnal goods, did not love the righteousness of the law but preferred temporal advantages to it. Therefore our Liberator, the Lord Jesus Christ, by taking on mortal flesh, came in the likeness of sinful flesh. For to sinful flesh death is owed. But that death of the Lord was of condescension, not of debt; and yet the Apostle calls even this "sin"—the assumption of mortal flesh, though not sinful flesh—because, being immortal, he as it were enacts sin when he dies. But from sin, he says, he condemned sin in the flesh. For the Lord's death accomplished this: that death should not be feared, and that thereafter temporal goods should no longer be sought nor temporal evils feared—in which lay that carnal prudence in which the precepts of the law could not be fulfilled. But when this prudence is destroyed and removed in the Lord's manhood, the righteousness of the law is fulfilled, when one walks not according to the flesh but according to the spirit. Hence it was most truly said: I came not to abolish the law but to fulfill it. Love, therefore, is the fullness of the law. And love belongs to those who walk according to the spirit. For this belongs to the grace of the Holy Spirit. For when there was not the love of righteousness but fear, the law was not fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
