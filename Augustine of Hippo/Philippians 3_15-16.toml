[[commentary]]
quote='''
For therefore it was that the blessed apostle, in addressing those who appeared to him already perfect, even after calling himself imperfect, said, "Let us, therefore, as many as be perfect, be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you." And that they might not rush into the hands of seducers, whose desire would be to turn them away from the faith by promising them the knowledge of the truth, and suppose such to be the meaning of the apostle's words, "God shall reveal even this unto you," he forthwith added, "Nevertheless, whereto we have already attained, let us walk by the same rule." If, then, thou hast come to some understanding of what is not at variance with the rule of the Catholic faith, whereto thou hast attained as the way that is guiding thee to thy fatherland; and hast so understood it as to feel it a duty to dismiss all doubts whatever on the subject: add to the building, but do not abandon the foundation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252098.html'
source_title="Tractates on John 98"

[[commentary]]
quote='''
This, then, being the case, dearly beloved, that you be not disturbed by the obscurity of this question, I counsel you first to thank God for such things as you understand; but as for all which is beyond the reach of your mind, pray for understanding from the Lord, observing, at the same time peace and love among yourselves; and until He Himself lead you to perceive what at present is beyond your comprehension, walk firmly on the ground of which you are sure. This is the advice of the Apostle Paul, who, after saying that he was not yet perfect, a little later adds, "Let us, therefore, as many as are perfect, be thus minded,"—meaning perfect to a certain extent, but not having attained to a perfection sufficient for us; and then immediately adds, "And if, in any thing, ye be otherwise minded, God shall reveal even this unto you. Nevertheless, whereunto we have already attained, let us walk by the same rule." For by walking in what we have attained, we shall be able to advance to what we have not yet attained,—God revealing it to us if in anything we are otherwise minded,—provided we do not give up what He has already revealed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 1"

[[commentary]]
quote='''
You must refer the matter, then, to the hidden determinations of God, when you see, in one and the same condition, such as all infants unquestionably have,—who derive their hereditary evil from Adam,—that one is assisted so as to be baptized, and another is not assisted, so that he dies in his very bondage; and again, that one baptized person is left and forsaken in his present life, who God foreknew would be ungodly, while another baptized person is taken away from this life, "lest that wickedness should alter his understanding;" and be sure that you do not in such cases ascribe unrighteousness or unwisdom to God, in whom is the very fountain of righteousness and wisdom, but, as I have exhorted you from the commencement of this treatise, "whereto you have already attained, walk therein," and "even this shall God reveal unto you,"—if not in this life, yet certainly in the next, "for there is nothing covered that shall not be revealed."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 45"
