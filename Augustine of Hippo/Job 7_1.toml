[[commentary]]
quote='''
Tribulation must not be thought to be this or that in particular. For every individual that doth not yet leap over, thinketh that as yet to be no tribulation, unless it be a thing which may have befallen this life of some sad occasion: but this man, that leapeth over, doth count this whole life to be his tribulation. For so much doth he love his supernal country, that the earthly pilgrimage is of itself the greatest tribulation. For how can this life be otherwise than a tribulation, I pray you? how can that not be a tribulation, the whole whereof hath been called temptation? Thou hast it written in the book of Job, is not human life a temptation upon earth? Hath he said, human life is tempted upon earth? Nay, but life itself is a temptation. If therefore temptation, it must surely be a tribulation. In this tribulation therefore, that is to say in this life, this man that leapeth over hath sought out God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252077.html'
source_title="Exposition on Psalm 77"
