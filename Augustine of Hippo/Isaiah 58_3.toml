[[commentary]]
quote='''
What if your flesh obeys you, and you do not obey God? Aren't you condemned by your own flesh, when it submits to you? Doesn't it bear witness against you, precisely by submitting to you?
'''
source_url=''
source_title="SERMON 400:7"

[[commentary]]
quote='''
Who are willing to enter into judgment with Him, save they who, “being ignorant of the righteousness of God, go about to establish their own?” “Wherefore have we fasted, and Thou hast not seen; wherefore have we afflicted our souls, and Thou takest no knowledge?” As though they would say, “We have done what Thou hast commanded, wherefore dost Thou not render to us what Thou hast promised?” God answereth thee: I will give to thee to receive what I have promised: I have given thee that thou shouldest do that whereby thou mayest receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
