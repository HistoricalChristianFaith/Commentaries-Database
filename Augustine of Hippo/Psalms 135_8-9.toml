[[commentary]]
quote='''
We see therefore these things in that work of His; we praise, we marvel at, we bless God; let us see what He has done among men for His people. “Who smote the first-born of Egypt” (ver. 8). But withal those divine doings are told which thou mightest love, those are not told which thou mightest fear. Attend, and see that also when He is angry, He doeth what He willeth. “From man even unto beast. He sent signs and wonders into the midst of thee, O Egypt!” (ver. 9). Ye know, ye have read what the hand of the Lord did by Moses in Egypt, to crush and cast down the proud Egyptians, “on Pharaoh and on all his servants.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520135.html'
source_title="Exposition on Psalm 135"
