[[commentary]]
quote='''
For that joy which is after the fashion of the world, is not true joy. Hear the prophet Isaiah: “There is no joy, saith my God, to the wicked.” What the wicked call joy is not joy, such as he knew who made no account of their joy: let us believe him, brethren. He was a man, but he knew both kinds of joy. He certainly knew the joys of the cup, for he was a man, he knew the joy of the table, he knew the joys of marriage, he knew those joys worldly and luxurious. He who knew them saith with confidence, “There is no joy to the wicked, saith the Lord.” But it is not man who speaks, it is the Lord.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
