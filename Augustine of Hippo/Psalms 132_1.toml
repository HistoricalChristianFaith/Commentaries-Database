[[commentary]]
quote='''
It was right indeed, most beloved, that we should rather hear our Brother, my colleague, when present before all of us. And just now he refused not, but put us off; for he extorted from me that he might now listen to me, on the condition that I also may listen to him, for in charity itself we are all listening unto Him, who is our One Master in heaven. Attend therefore to the Psalm, entitled A Song of Degrees; considerably longer than the rest under the same title. Let us not therefore linger, save where necessity shall compel us: that we may, if the Lord permit, explain the whole. For ye also ought not to hear everything as men untaught; ye ought in some degree to aid us from your past listenings, so that it may not be needful that everything should be declared to you as though new.

“Lord, remember David, and all his meekness” (ver. 1). David according to the truth of history was one man, king of Israel, son of Jesse. He was indeed meek, as the Divine Scriptures themselves mark and command him, and so meek that he did not even render evil for evil to his persecutor Saul. He preserved towards him so great humility, that he acknowledged him a king, and himself a dog: and answered the king not proudly nor rudely, though he was more powerful in God; but he rather endeavoured to appease him by humility, than to provoke him by pride. Saul was even given into his power, and this by the Lord God, that he might do to him what he listed: but since he was not commanded to slay him, but had it only placed in his power (now a man is permitted to use his power), he rather turned towards mercy what God gave him.…The humility of David is therefore commended, the meekness of David is commended; and it is said to God, “Lord, remember David, and all his meekness.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
