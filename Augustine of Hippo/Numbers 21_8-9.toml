[[commentary]]
quote='''
Therefore also when by serpents in the desert they were being bitten and being slain, the Lord commanded Moses to exalt a brazen serpent in the desert, and admonish the people that whosoever by a serpent had been bitten, should look thereupon and be made whole. Thus also it was done: thus also men, bitten by serpents, were made whole of the venom by looking upon a serpent. To be made whole of a serpent is a great Sacrament. What is it to be made whole of a serpent by looking upon a serpent? It is to be made whole of death by believing in one dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
