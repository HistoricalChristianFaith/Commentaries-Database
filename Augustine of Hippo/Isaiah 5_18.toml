[[commentary]]
quote='''
For indeed every man twists for himself a rope by his sins: "Woe to them who draw sins as a long rope?" Who makes a long rope? He who adds sin to sin. How are sins added to sins? When the sins which have been committed are covered over by other sins. One has committed a theft: that he may not be found out to have committed it, he seeks the astrologer. It were enough to have committed theft: why wilt thou add sin to sin? Behold two sins committed. When thou art forbidden to go to the astrologer, thou revilest the bishop: behold three sins. When thou hearest it said of thee, Cast him forth from the Church; thou sayest, I will betake me to the party of Donatus: behold thou addest a fourth sin. The rope is growing; be thou afraid of the rope. It is good for thee to be corrected here, when thou art scourged with it; that it may not be said of thee at the last, "Bind ye his hands and feet, and cast him forth into outer darkness." For, "With the cords of his own sins is every one bound." The former of these is the saying of the Lord, the latter that of another Scripture; but yet both are the sayings of the Lord. With their own sins are men bound and cast into outer darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252010.html'
source_title="Tractates on John 10"

[[commentary]]
quote='''
But those “proud ones have hidden a trap for me;” they have sought to trip up my steps. And what have they done? “And have stretched out cords as traps.” What cords? The word is well known in holy Scripture, and elsewhere we find what “cords” signify. For “each one is holden with the cords of his sins,” saith Scripture. And Esaias saith openly, “Woe to them that draw sin like a long rope.” And why is it called a “cord”? Because every sinner who persevereth in his sins, addeth sin to sin; and when he ought by accusing his sins to amend, by defending he doubleth what by confession he might have removed, and often seeketh to fortify himself by other sins, on account of the sins he hath already committed.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
