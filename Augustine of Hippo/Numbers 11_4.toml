[[commentary]]
quote='''
The people in the desert deserved to be reprimanded, not because they desired meat but because they murmured against the Lord as a result of this desire for meat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%252010.html'
source_title="Confessions 10.31.46"
