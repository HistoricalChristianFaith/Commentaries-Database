[[commentary]]
quote='''
(Tr. xlix. 1) The resurrection of Lazarus is more spoken of than any of our Lord's miracles. But if we bear in mind who He was who wrought this miracle, we shall feel not so much of wonder, as of delight. He who made the man, raised the man; and it is a greater thing to create a man, than to revive him. Lazarus was sick at Bethany, the town of Mary and her sister Martha. The place was near Jerusalem.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Among all the miracles wrought by our Lord Jesus Christ, the resurrection of Lazarus holds a foremost place in preaching. But if we consider attentively who did it, our duty is to rejoice rather than to wonder. A man was raised up by Him who made man: for He is the only One of the Father, by whom, as you know, all things were made. And if all things were made by Him, what wonder is it that one was raised by Him, when so many are daily brought into the world by His power? It is a greater deed to create men than to raise them again from the dead. Yet He deigned both to create and to raise again; to create all, to resuscitate some. For though the Lord Jesus did many such acts, yet all of them are not recorded; just as this same St. John the evangelist himself testifies, that Christ the Lord both said and did many things that are not recorded; but such were chosen for record as seemed to suffice for the salvation of believers. Thou hast just heard that the Lord Jesus raised a dead man to life; and that is sufficient to let thee know that, were He so pleased, He might raise all the dead to life. And, indeed this very work has He reserved in His own hands till the end of the world. For while you have heard that by a great miracle He raised one from the tomb who had been dead four days, "the hour is coming," as He Himself saith, "in the which all that are in the graves shall hear His voice, and shall come forth." He raised one who was putrid, and yet in that putrid carcase there was still the form of limbs; but at the last day He will by a word reconstitute ashes into human flesh. But it was needful then to do only some such deeds, that we, receiving them as tokens of His power, may put our trust in Him, and be preparing for that resurrection which shall be to life and not to judgment. So, indeed, He saith, "The hour is coming, in the which all that are in the graves shall hear His voice, and shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of damnation."

We have, however, read in the Gospel of three dead persons who were raised to life by the Lord, and, let us hope, to some good purpose. For surely the Lord's deeds are not merely deeds, but signs. And if they are signs, besides their wonderful character, they have some real significance: and to find out this in regard to such deeds is a somewhat harder task than to read or hear of them. We were listening with wonder, as at the sight of some mighty miracle enacted before our eyes, in the reading of the Gospel, how Lazarus was restored to life. If we turn our thoughts to the still more wonderful works of Christ, every one that believeth riseth again: if we all consider, and understand that more horrifying kind of death, every one who sinneth dies. But every man is afraid of the death of the flesh; few, of the death of the soul. In regard to the death of the flesh, which must certainly come some time, all are on their guard against its approach: this is the source of all their labor. Man, destined to die, labors to avert his dying; and yet man, destined to live for ever, labors not to cease from sinning. And when he labors to avoid dying, he labors to no purpose, for its only result will be to put off death for a while, not to escape it; but if he refrain from sinning, his toil will cease, and he shall live for ever. Oh that we could arouse men, and be ourselves aroused along with them, to be as great lovers of the life that abideth, as men are of that which passeth away! What will a man not do who is placed under the peril of death? When the sword was overhanging their heads, men have given up every means of living they had in reserve. Who is there that has not made an immediate surrender of all, to escape being slain? And, after all, he has perhaps been slain. Who is there that, to save his life, has not been willing at once to lose his means of living, and prefer a life of beggary to a speedy death? Who has had it said to him, Be off to sea if you would escape with your life, and has delayed to do so? Who has had it said to him, Set to work if you would preserve your life, and has continued a sluggard? It is but little that God requires of us, that we may live for ever: and we neglect to obey Him. God says not to thee, Lose all you have, that you may live a little time oppressed with toil; but, Give to the poor of what you have, that you may live always exempt from labor. The lovers of this temporal life, which is theirs, neither when, nor as long as they wish, are our accusers; and we accuse not ourselves in turn, so sluggish are we, so lukewarm about obtaining eternal life, which will be ours if we wish it, and will be imperishable when we have it; but this death which we fear, notwithstanding all our reluctance, will yet be ours in possession.

If, then, the Lord in the greatness of His grace and mercy raiseth our souls to life, that we may not die for ever, we may well understand that those three dead persons whom He raised in the body, have some figurative significance of that resurrection of the soul which is effected by faith: He raised up the ruler of the synagogue's daughter, while still lying in the house; He raised up the widow's young son, while being carried outside the gates of the city; and He raised up Lazarus, when four days in the grave. Let each one give heed to his own soul: in sinning he dies: sin is the death of the soul. But sometimes sin is committed only in thought. Thou hast felt delight in what is evil, thou hast assented to its commission thou hast sinned; that assent has slain thee but the death is internal, because the evil thought had not yet ripened into action. The Lord intimated that He would raise such a soul to life, in raising that girl, who had not yet been carried forth to the burial, but was lying dead in the house, as if sin still lay concealed. But if thou hast not only harbored a feeling of delight in evil, but hast also done the evil thing, thou hast, so to speak, carried the dead outside the gate: thou art already without, and being carried to the tomb. Yet such an one also the Lord raised to life. and restored to his widowed mother. If thou hast sinned, repent, and the Lord will raise thee up, and restore thee to thy mother Church. The third example of death is Lazarus. A grievous kind of death it is, and is distinguished as a habit of wickedness. For it is one thing to fall into sin, another to form the habit of sinning. He who falls into sin, and straightway submits to correction, will be speedily restored to life; for he is not yet entangled in the habit, he is not yet laid in the tomb. But he who has become habituated to sin, is buried, and has it properly said of him, "he stinketh;" for his character, like some horrible smell, begins to be of the worst repute. Such are all who are habituated to crime, abandoned in morals. Thou sayest to such an one, Do not so. But when wilt thou be listened to by one on whom the earth is thus heaped, who is breeding corruption, and pressed down with the weight of habit? And yet the power of Christ was not unequal to the task of restoring such an one to life. We know, we have seen, we see every day men changing the very worst of habits, and adopting a better manner of life than that of those who blamed them. Thou detestedst such a man: look at the sister of Lazarus herself (if, indeed, it was she who anointed the Lord's feet with ointment, and wiped with her hair what she had washed with her tears), who had a better resurrection than her brother; she was delivered from the mighty burden of a sinful character. For she was a notorious sinner; and had it said of her, "Her many sins are forgiven her, for she has loved much." We see many such, we know many: let none despair, but let none presume in himself. Both the one and the other are sinful. Let thine unwillingness to despair take such a turn as to lead thee to make choice of Him in whom alone thou mayest well presume.

So then the Lord also raised Lazarus to life. You have heard what type of character he represents; in other words, what is meant by the resurrection of Lazarus. Let us now, therefore, read over the passage; and as there is much in this lesson clear already, we shall not go into any detailed exposition, so as to take up more thoroughly the necessary points. "Now a certain man was sick, [named] Lazarus, of Bethany, the town of Mary and Martha, his sisters." In the previous lesson you remember that the Lord escaped from the hands of those who sought to stone Him, and went away beyond Jordan, where John baptized. When the Lord therefore had taken up His abode there, Lazarus fell sick in Bethany, which was a town lying close to Jerusalem.
'''
