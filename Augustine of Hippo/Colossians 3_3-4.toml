[[commentary]]
quote='''
In the winter then they are green; but when the summer sun shall begin to scorch, they will wither away. For now it is the season of winter. Thy glory doth not as yet appear. But if thy love hath but a deep root, like that of many trees during winter, the frost passes away, the summer (that is, the Day of Judgment) will come; then will the greenness of the grass wither away. Then will the glory of the trees appear. “For ye” (saith the Apostle) “are dead,” even as trees seem to be in winter, as it were dead, as it were withered. What is our hope then, if we are dead? The root is within; where our root is, there is our life also, for there our love is fixed. “And your life is hid with Christ in God.” When shall he wither who is thus rooted? But when will our spring be? When our summer? When will the honour of foliage clothe us around, and the fulness of fruit make us rich? When shall this come to pass? Hear what follows: “When Christ, who is our life, shall appear, then shall ye also appear with Him in glory.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
