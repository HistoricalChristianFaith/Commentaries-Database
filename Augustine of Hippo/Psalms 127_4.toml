[[commentary]]
quote='''
“Like as the arrows in the hand of the mighty one, even so are the children of those that are shot out” (ver. 4). Whence hath sprung this heritage, brethren? Whence hath sprung so numerous a heritage? Some have been shot out from the Lord’s hand, as arrows, and have gone far, and have filled the whole earth, whence the Saints spring. For this is the heritage whereof it is said, “Desire of Me, and I shall give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession.” And how doth this possession extend and increase unto the world’s uttermost parts? Because, “like as the arrows in the hand of the mighty one,” etc. Arrows are shot forth from the bow, and the stronger the arm which hath sent it forth, the farther flieth the arrow. But what is stronger than the darting of the Lord? From His bow He sendeth forth His Apostles: there could not be a spot left where an arrow shot by so strong an arm would not reach; it hath reached unto the uttermost parts of the earth. The reason it went no farther was, that there were no more of the human race beyond. For He hath such strength, that even if there were a spot beyond, whither the arrow could fly, He would dart the arrow thither. Such are the children of those who are shot forth as they that are shot forth.…

Perhaps the Apostles themselves are styled the sons of those who have been shaken out, the sons of the Prophets. For the Prophets comprised closed and covered mysteries: they were shaken, that they might come forth thence manifestly.…Except the prophecy involved were sifted with diligence, would the concealed meanings come forth unto us? All these meanings were therefore closed before the Lord’s advent. The Lord came, and shook out these hidden meanings, and they were made manifest; the Prophets were shaken out, and the Apostles were born. Since then they were born of the Prophets who had been shaken out, the Apostles are sons of those that were shaken out. They, placed as the arrows in the hand of the giant, have reached the uttermost parts of the earth.…The Apostles the sons of the Prophets have been like as the arrows in the hand of a mighty one. If He is mighty, He hath shaken them out with a mighty hand; if He hath shaken them out with a mighty hand, they whom He hath shaken forth have arrived even at the uttermost parts of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
