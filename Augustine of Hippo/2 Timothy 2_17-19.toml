[[commentary]]
quote='''
There is therefore a round world movable: there is a world immovable: of which the Apostle speaketh. Behold, the round world movable. I ask thee, of whom speaketh the Apostle in these words, “Of whom is Hymenæus and Philetus; who concerning the truth have erred, saying that the resurrection is past already: and overthrow the faith of some?” Did these belong to the round world, that shall not be moved? But they were chaff: and as he saith, “they overthrow the faith of some.”…“Nevertheless, the foundation of God standeth sure; having his seal,”—what seal hath it as its sure foundation?—“The Lord knoweth them that are His.” This is the round world that shall not be moved; “The Lord knoweth them that are His.” And what seal hath it? “And let every one that nameth the name of Christ depart from unrighteousness.” Let him depart from unrighteousness: for he cannot depart from the unrighteous, for the chaff is mixed with the wheat until it is fanned.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252093.html'
source_title="Exposition on Psalm 93"
