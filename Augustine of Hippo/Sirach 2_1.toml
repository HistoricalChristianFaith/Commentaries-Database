[[commentary]]
quote='''
Thus it is with men whom God predestined before the world to be conformed to the image of His only-begotten Son, who has been first and especially pressed in His Passion, as the great Cluster. Men of this kind, therefore, before they draw near to the service of God, enjoy in the world a kind of delicious liberty, like hanging grapes or olives: but as it is said, “My son, when thou drawest near to the service of God, stand in judgment and fear, and make thy soul ready for temptation:” so each, as he draweth near to the service of God, findeth that he is come to the winepress; he shall undergo tribulation, shall be crushed, shall be pressed, not that he may perish in this world, but that he may flow down into the storehouses of God. He hath the coverings of carnal desires stripped off from him, like grape-skins: for this hath taken place in him in carnal desires, of which the Apostle speaks, “Put ye off the old man, and put on the new man.” All this is not done but by pressure: therefore the Churches of God of this time are called winepresses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
