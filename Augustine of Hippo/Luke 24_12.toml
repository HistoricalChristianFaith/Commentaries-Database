[[commentary]]
quote='''
Luke is supposed to have mentioned this concerning Peter, recapitulating. For Peter ran to the sepulchre at the same time that John also went, as soon as it had been told to them alone by the women, (especially Mary Magdalene,) that the body was taken away. But the vision of Angels took place afterwards. Luke therefore mentioned Peter only, because to him Mary first told it. It may also strike one, that Luke says that Peter, not entering but stooping down, saw the linen clothes by themselves, and departed wondering, whereas John says, that he himself saw the linen clothes in the same position, and that he entered after Peter. We must understand then that Peter first saw them stooping down, which Luke mentions, John omits, but that he afterwards entered before John came in.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now Luke is the only one among the four evangelists who omits to tell us how the Lord was seen by the women, and confines his statement to the appearance of the angels. Matthew, again, informs us that He met them as they were returning from the sepulchre. Mark likewise mentions that He appeared first to Mary Magdalene; as also does John. Only Mark does not state how He manifested Himself to her, while John does give us an explanation of that. Moreover, Luke not only passes by in silence the fact that He showed Himself to the women, as I have already remarked, but also reports that two disciples, one of whom was Cleophas, talked with Him, before they recognised Him, in a strain which seems to imply that the women had related no other appearance seen by them than that of the angels who told them that He was alive. For Luke's narrative proceeds thus: "And, behold, two of them went that same day to a village called Emmaus, which was from Jerusalem about threescore furlongs. And they talked together of all these things which had happened. And it came to pass that, while they communed together and reasoned, Jesus Himself drew near, and went with them. But their eyes were holden, that they should not know Him. And He said unto them, What manner of communications are these that ye have one to another, as ye walk, and are sad? And the one of them, whose name was Cleophas, answering, said unto Him, Art thou only a stranger in Jerusalem, and hast not known the things which are come to pass there in these days? And He said unto them, What things? And they said unto Him, Concerning Jesus of Nazareth, which was a prophet mighty in deed and word before God and all the people; and how the chief priests and our rulers delivered Him to be condemned to death, and have crucified Him. But we trusted that it had been He that should have redeemed Israel: and besides all this, to-day is the third day since these things were done. Yea, and certain women also of our company made us astonished, which were early at the sepulchre; and when they found not His body, they came, saying, that they had also seen a vision of angels, which said that He was alive. And certain of them which were with us went to the sepulchre, and found it even so as the women said; but Him they saw not." All these things they relate, according to Luke's narrative, just as they were able to command their recollections and bethink themselves of what had been reported to them by the women, or by the disciples who had run to the sepulchre when the intelligence was conveyed to them that His body had been removed from the place. It is at the same time true that Luke himself reports only Peter to have run to the tomb, and there to have stooped down and seen the linen clothes laid by themselves, and then to have departed, wondering in himself at that which was come to pass. This notice about Peter, moreover, is introduced previous to the narrative of these two disciples whom He found on the way, and subsequently to the story of the women who had seen the angels, and who had heard from them that Jesus had risen again; so that this position might seem to mark the period at which Peter ran to the sepulchre. But still we must suppose that Luke has inserted the passage about Peter here in the form of a recapitulation. For the time when Peter ran to the sepulchre was also the time when John ran to it; and at that point all that they had heard was simply the statement conveyed to them by the women, and in particular by Mary Magdalene, to the effect that the body had been carried away. Furthermore, the period at which the said woman brought such tidings was just the occasion when she saw the stone rolled away from the sepulchre. And it was at a later point that these other things occurred, connected with the vision of the angels, and the appearance of the Lord Himself, who showed Himself twice over to the women, namely, once at the sepulchre, and a second time when He met them as they were returning from the tomb. This, however, took place previous to His being seen by those two upon the journey, one of whom was Cleophas. For, when this Cleophas was talking with the Lord, before he recognized who He was, he did not say expressly that Peter had gone to the sepulchre. But his words were these: "Certain of them which were with us went to the sepulchre, and found it even so as the women said;" which last statement is also to be understood as introduced in the form of a recapitulation. For the reference is to the report brought first of all by the women to Peter and John about the removal of the body. And thus, when Luke here informs us that Peter ran to the sepulchre, and also states how Cleophas mentioned that some of those who were with them went to the tomb, he is to be taken as attesting John's account, which bears that two persons proceeded to the sepulchre. But Luke has specified Peter alone in the first instance, just because it was to him that Mary had brought the earliest tidings. A difficulty, however, may also be felt in the circumstance that the same Luke does not say that Peter entered, but only that he stooped down and saw the linen clothes hid by themselves, and that thereupon he departed, wondering in himself; whereas John intimates that it was rather himself (for he is the disciple whom Jesus loved) that looked at the scene in this fashion, not going within the sepulchre, which he was the first to reach, but simply bending down and beholding the linen clothes laid in their place; although he also adds that he did enter the tomb afterwards. The explanation, therefore, is simply this, that Peter at first did stoop down and look in after the fashion which Luke specifies, but to which John makes no allusion; and that he went actually in somewhat later, but still before John entered. And in this way we shall find that all these writers have given a true account of what occurred in terms which betray no discrepancies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
