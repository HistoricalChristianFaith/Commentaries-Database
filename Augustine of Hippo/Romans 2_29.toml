[[commentary]]
quote='''
When he says: By the spirit, not the letter, this means that the law is to be understood according to the spirit, not according to what the letter contains—which surely happened to those who received circumcision more carnally than spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
When he says: Whose praise is not from men but from God, this fits with what he says: He who is a Jew in secret.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
But what saith the Apostle? He that in secret is a Jew, he that is so in circumcision of the heart, not in letter but in spirit. There are therefore Jews in circumcision of the flesh, and there are Jews in circumcision of the heart. Many of our holy fathers had both the circumcision of the flesh, for a seal of the faith, and circumcision of the heart, for the faith itself. From these fathers these men degenerating, who now in the name do glory, and have lost their deeds; from these fathers, I say, degenerating, they have remained Jews in flesh, in heart Heathens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252076.html'
source_title="Exposition on Psalm 76"
