[[commentary]]
quote='''
(Con. Evang. iii. 24) Either let us suppose that Matthew was silent about that Angel, whom they saw on entering, whilst Mark said nothing of him, whom they saw outside sitting on the stone, so that they saw two and heard severally from two, the things which the Angels said concerning Jesus; or we must understand by entering into the sepulchre, their coming within some inclosure, by which it is probable that the place was surrounded a little space before the stone, by the cutting out of which the burial place had been made, so that they saw sitting on the right hand in that space him whom Matthew designates as sitting on the stone.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Again, the same Matthew carries on his recital as follows: "Now, in the evening of the Sabbath, when it began to dawn towards the first day of the week, came Mary Magdalene, and the other Mary, to see the sepulchre. And, behold, there was a great earthquake: for the angel of the Lord descended from heaven, and came and rolled back the stone from the door, and sat upon it. And his countenance was like lightning, and his raiment white as snow: and for fear of him the keepers did shake, and became as dead men. And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified. He is not here; for He is risen, as He said. Come, see the place where the Lord lay: And go quickly, and tell His disciples that He is risen from the dead; and, behold, He goeth before you into Galilee; there shall ye see Him: lo, I have told you." Mark is in harmony with this. It is possible, however, that some difficulty may be felt in the circumstance that, according to Matthew's version, the stone was already rolled away from the sepulchre, and the angel was sitting upon it. For Mark tells us that the women entered into the sepulchre, and there saw a young man sitting on the right side, covered with a long white garment, and that they were affrighted. But the explanation may be, that Matthew has simply said nothing about the angel whom they saw when they entered into the sepulchre, and that Mark has said nothing about the one whom they saw sitting outside upon the stone. In this way they would have seen two angels, and have got two separate angelic reports relating to Jesus,—namely, first one from the angel whom they saw sitting outside upon the stone, and then another from the angel whom they saw sitting on the right side when they entered into the sepulchre. Thus, too, the injunction given them by the angel who was sitting outside, and which was conveyed in the words, "Come, and see the place where the Lord lay," would have served to encourage them to go within the tomb; on coming to which, as has been said, and venturing within it, we may suppose them to have seen the angel concerning whom Matthew tells us nothing, but of whom Mark discourses, sitting on the right side, from whom also they heard things of like tenor to those they had previously listened to. Or if this explanation is not satisfactory, we ought certainly to accept the theory that, as they entered into the sepulchre, they came within a section of the ground where, it is reasonable to suppose, a certain space had been by that time securely enclosed, extending a little distance in front of the rock which had been cut out in order to construct the place of sepulture; so that, according to this view, what they really beheld was the one angel sitting on the right side, in the space thus referred to, which same angel Matthew also represents to have been sitting upon the stone which he had rolled away from the mouth of the tomb when the earthquake took place, that is to say, from the place which had been dug out in the rock for a sepulchre.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 24"

[[commentary]]
quote='''
Let us now proceed, therefore, to look into the rest of this passage, and see how in other respects these statements are quite consistent with what is given by Matthew. For Luke tells us, with the utmost plainness, that two angels were seen by those women who came to the sepulchre. One of these angels we have understood to be referred to by each of the first two evangelists; that is to say, one of them is noticed by Matthew, namely, the one who was sitting outside upon the stone, and a second by Mark, namely, the one who was sitting within the sepulchre on the right side. But Luke's version of the scene is to the following effect: "And that day was the preparation, and the Sabbath drew on. And the women which had come with Him from Galilee beheld the sepulchre, and how His body was laid. And they returned, and prepared spices and ointments; and rested the Sabbath-day, according to the commandment. Now upon the first day of the week, very early in the morning, they came unto the sepulchre, bringing the spices which they had prepared. And they found the stone rolled away from the sepulchre. And they entered in, and found not the body of the Lord Jesus. And it came to pass, as they were much perplexed thereabout, behold, two men stood by them in shining garments; and as they were afraid, and bowed down their faces to the earth, they said unto them, Why seek ye the living among the dead? He is not here, but is risen: remember how He spake unto you when He was yet in Galilee, saying, The Son of man must be delivered into the hands of sinful men, and be crucified, and the third day rise again. And they remembered His words. And they returned from the sepulchre, and told all these things unto the eleven, and to all the rest." The question, therefore, is this, how can these angels have been seen sitting each one separately,—namely, one outside upon the stone, according to Matthew, and another within upon the right side, according to Mark,—if Luke's report of the same bears that the two stood beside those women, although the words ascribed to them are similar? Well, it is still possible for us to suppose that one angel was seen by the women in the position assigned by Matthew, and in the circumstances indicated by Mark, as we have already explained. In this way, we may understand the said women to have entered into the sepulchre, that is to say, into a certain space which had been fenced off within a kind of enclosure, in such a manner that an entrance might be said to be made when they came in front of the rocky place in which the sepulchre was constructed; and there we may take them to have beheld the angel sitting upon the stone which had been rolled away from the tomb, as Matthew tells us, or in other words, the angel sitting on the right side, as Mark expresses it. And then we may further surmise that the said women, after they had gone within, and when they were looking at the place where the body of the Lord lay, saw other two angels standing, as Luke informs us, by whom they were addressed in similar terms, with a view to animate their minds and edify their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 24"
