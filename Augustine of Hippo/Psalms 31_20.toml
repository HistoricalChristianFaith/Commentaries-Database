[[commentary]]
quote='''
“Thou wilt hide them in the hidden place of Thy Countenance:” which seat Thou shalt preserve for everlasting in the hidden place of the knowledge of Thee for them that hope in Thee. “From the troubling of men.” So that now they suffer no more trouble from men.

“Thou wilt protect them in Thy tabernacle from the contradiction of tongues” (ver. 20). But here meanwhile whilst evil tongues murmur against them, saying, Who hath known this? or, Who hath come thence? Thou wilt protect them in the tabernacle, that of faith in those things, which the Lord wrought and endured for us in time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
