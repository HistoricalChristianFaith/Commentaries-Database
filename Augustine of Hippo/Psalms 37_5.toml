[[commentary]]
quote='''
“Behold” (you say), “I do long after it, I do ask for it, I do desire it. Shall I then accomplish it?” No. Who shall then? “Reveal thy way unto the Lord: trust also in Him, and He shall bring it to pass” (ver. 5). Mention to Him what thou sufferest, mention to Him what thou dost desire. For what is it that thou sufferest? “The flesh lusteth against the spirit, and the spirit against the flesh.” What is it then that thou dost desire? “Wretched man that I am! Who shall deliver me from the body of this death?” And because it is He “Himself” that “will bring it to pass,” when thou shalt have “revealed thy ways unto Him;” hear what follows: “The grace of God through Jesus Christ our Lord.” What is it then that He is to bring to pass, since it is said, “Reveal thy way unto Him, and He will bring it to pass”? What will He bring to pass?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
