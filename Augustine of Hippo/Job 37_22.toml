[[commentary]]
quote='''
The North is wont to be contrary to Sion: Sion forsooth is in the South, the North over against the South. Who is the North, but He who said, “I will sit in the sides of the North, I will be like the Most High”? The devil had held dominion over the ungodly, and possessed the nations serving images, adoring demons; and all whatsoever there was of human kind anywhere throughout the world, by cleaving to Him, had become North. But since He who binds the strong man, taketh away his goods, and maketh them His own goods; men delivered from infidelity and superstition of devils, believing in Christ, are fitted on to that city, have met in the corner that wall that cometh from the circumcision, and that was made the city of the great King, which had been the sides of the North. Therefore also in another Scripture is it said, “Out of the North come clouds of golden colour: great is the glory and honour of the Almighty.” For great is the glory of the physician, when from being despaired of the sick recovers. “Out of the North come clouds,” and not black clouds, not dark clouds, not lowering, but “of golden colour.” Whence but by grace illumined through Christ? See, “the sides of the North are the city of the great King.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
