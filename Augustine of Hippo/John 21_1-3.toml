[[commentary]]
quote='''
The narrative itself begins in this way: "After these things Jesus showed Himself again to the disciples at the sea of Tiberias; and on this wise showed He (Himself). There were together Simon Peter, and Thomas called Didymus, and Nathanael of Cana in Galilee, and the sons of Zebedee, and two other of His disciples. Simon Peter saith unto them, I go a fishing.They say unto him, We also go with thee."

The inquiry is usually made in connection with this fishing of the disciples, why Peter and the sons of Zebedee returned to what they were before being called by the Lord; for they were fishers when He said to them, "Come after me, and I will make you fishers of men." And they put such reality into their following of Him then, that they left all in order to cleave to Him as their Master: so much so, that when the rich man went away from Him in sorrow, because of His saying to him, "Go sell that thou hast, and give to the poor, and thou shalt have treasure in heaven, and come follow me," Peter said unto Him, "Lo, we have forsaken all, and followed Thee." Why is it then that now, by the abandonment as it were of their apostleship, they become what they were, and seek again what they had forsaken, as if forgetful of the words they had once listened to, "No man, putting his hand to the plough, and looking back, is fit for the kingdom of heaven"? Had they done so when Jesus was lying in the grave, before He rose from the dead,-which of course they could not have done, as the day whereon He was crucified kept them all in closest attention till His burial, which took place before evening; while the next day was the Sabbath, when it was unlawful for those who observed the ancestral custom to work at all; and on the third day the Lord rose again, and recalled them to the hope which they had not yet begun to entertain regarding Him;-yet had they then done so, we might suppose it had been done under the influence of that despair which had taken possession of their minds. But now, after His restoration to them alive from the tomb, after the most evident truth of His revivified flesh offered to their eyes and hands, not only to be seen, but also to be touched and handled; after inspecting the very marks of the wounds, even to the confession of the Apostle Thomas, who had previously declared that he would not otherwise believe; after the reception by His breathing on them of the Holy Spirit, and after the words poured from His lips into their ears, "'As the Father hath sent me, even so send I you: whose soever sins ye remit, they are remitted unto them; and whose soever ye retain, they are retained:" they suddenly become again what they had been, fishers, not of men, but of fishes.

We have therefore to give those who are disturbed by this the answer, that they were not prohibited from seeking necessary sustenance by their manual craft, when lawful in itself, and warranted so long as they preserved their apostleship intact, if at any time they had no other means of gaining a livelihood. Unless any one have the boldness to imagine or to affirm, that the Apostle Paul attained not to the perfection of those who left all and followed Christ, seeing that, in order not to become a burden to any of those to whom he preached the gospel, he worked with his own hands for his support: wherein we find rather the fulfillment of his own words, "I labored more abundantly than they all;" and to which he added, "yet not I, but the grace of God that was with me:" to make it manifest that this also was to be imputed to the grace of God, that both with mind and body he was able to labor so much more abundantly than they all, that he neither ceased from preaching the gospel, nor drew, like them, his present support out of the gospel; while he was sowing it much more widely and fruitfully through multitudes of nations where the name of Christ had never previously been proclaimed. Whereby he showed that living, that is, deriving their subsistence, by the gospel, was not imposed on the apostles as a necessity, but conferred on them as a power. And of this power the same apostle makes mention when he says: "If we have sown to you spiritual things, is it a great thing if we reap your carnal things? If others are partakers of this power among you, are not we rather? But," he adds, "we have not used this power." And a little afterwards he says: "They who serve the altar are partakers with the altar: even so hath the Lord ordained, that they who preach the gospel should live of the gospel; but I have used none of these things." It is clear enough, therefore, that it was not enjoined on the apostles, but put in their power, not to find their living otherwise than by the gospel, and of those to whom by preaching the gospel they sowed spiritual things, to reap their carnal things; that is, to take their bodily support, and, as the soldiers of Christ, to receive the wages due to them, as from the inhabitants of provinces subject to Christ. Hence that same illustrious soldier had said a little before, in reference to this matter, "Who goeth a warfare any time at his own charges?" Which he nevertheless did himself; for he labored more abundantly than they all. If, then, the blessed Paul-that he might not use with them the power which he certainly possessed along with the other preachers of the gospel, but went a warfare at his own charges, that the Gentiles, who were utterly averse to the name of Christ, might not take offense at his teaching, as something offered them for a money equivalent,-in a way very different from that in which he had been educated, learned an altogether new art, that while the teacher supports himself with his own hands, none of his hearers might be burdened; how much rather did the blessed Peter, who had beforetimes been a fisherman, do what he was already acquainted with, if at that present time he found no other means of gaining a livelihood?

But some one will reply, And why did he not find them, when the Lord had promised, saying, "Seek first the kingdom and righteousness of God, and all these things shall be added unto you"? Precisely also in this very way did the Lord fulfill His promise. For who else placed there the fishes that were to be caught, but He, who, we are bound to believe, threw them into the penury that compelled them to go a fishing, for no other reason than that He wished to show them the miracle He had prepared, that so He might both feed the preachers of His gospel, and at the same time enhance that gospel itself, by the great mystery which He was about to impress on their minds by the number of the fishes? And on this subject we also ought now to be telling you what He Himself has set before us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520122.html'
