[[commentary]]
quote='''
(Tr. lviii. 3) It is enjoined in the Proverbs, Let another man praise thee, and not thine own mouth. (Prov. 27:2.) For it is dangerous for one to praise himself, who has to beware of pride. But He who is above all things, howsoever He praise Himself, extolleth not Himself too highly. Nor can God be called arrogant: for that we should know Him is no gain to Him, but to us. Nor can any one know Him, unless He who knows, shows Himself. So that if to avoid arrogance He did not praise Himself, He would be denying us wisdom. But why should the Truth fear arrogance? To His calling Himself Master, no one could object, even were He man only, since professors in different arts call themselves so without presumption. But what free man can bear the title of lord in a man? Yet when God speaks, height cannot exalt itself, truth cannot lie; it is for us to submit to that height, to obey that truth. Wherefore ye say well in that ye call Me Master and Lord, for so I am; but if I were not what ye say, ye would say ill.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Ye call me," He says, "Master and Lord: and ye say well; for so I am." "Ye say well," for ye only say the truth; I am indeed what ye say. There is a precept laid on man: "Let not thine own mouth praise thee, but the mouth of thy neighbor." For self-pleasing is a perilous thing for one who has to be on his guard against falling into pride. But He who is over all things, however much He commend Himself, cannot exalt Himself above His actual dignity: nor can God be rightly termed arrogant. For it is to our advantage to know Him, not to His; nor can any one know Him, unless that self-knowing One make Himself known. If He, then, by abstaining from self-commendation, wish, as it were, to avoid arrogance, He will deny us the power of knowing Him. And no one surely would blame Him for calling Himself Master, even though believing Him to be nothing more than a man; seeing He only makes profession of what even men themselves in the various arts profess to such an extent, without any charge of arrogance, that they are termed professors. But to call Himself also the Lord of His disciples,-of men who, in an earthly sense, were themselves also free-born,-who would tolerate it in a man? But it is God that speaks. Here no elation is possible to loftiness so great, no lie to the truth: the profit is ours to be the subjects of such loftiness, the servants of the truth. That He calls Himself Lord is no imperfection on His side, but a benefit on ours. The words of a certain profane author are commended, when he says, "All arrogance is hateful, and specially disagreeable is that of talent and eloquence;" and yet, when the same person was speaking of his own eloquence, he said, "I would call it perfect, were I to pronounce judgment; nor, in truth, would I greatly fear the charge of arrogance." If, then, that most eloquent man had in truth no fear of being charged with arrogance, how can the truth itself have such a fear? Let Him call Himself Lord who is the Lord, let Him say what is true who is the Truth; so that I may not fail to learn that which is profitable, by His being silent about that which is. The most blessed Paul-certainly not himself the only-begotten Son of God, but the servant and apostle of that Son; not the Truth, but a partaker of the truth-declares with freedom and consistency, "And though I would desire to glory, I shall not be a fool; for I say the truth." For it would not be in himself, but in the truth, which is superior to himself, that he was glorying both humbly and truly: for it is he also who has given the charge, that he that glorieth should glory in the Lord. Could thus the lover of wisdom have no fear of being chargeable with foolishness, though he desired to glory, and would wisdom itself, in its glorying, have any fear of such a charge? He had no fear of arrogance who said, "My soul shall make her boast in the Lord;" and could the power of the Lord have any such fear in commending itself, in which His servant's soul is making her boast? "Ye call me," He says, "Master and Lord: and ye say well; for so I am." Therefore ye say well, that I am so: for if I were not what ye say, ye would be wrong to say so, even with the purpose of praising me. How, then,could the Truth deny what the disciples of the Truth affirm? How could that which was said by the learners be denied by the very Truth that gave them their learning? How can the fountain deny what the drinker asserts? how can the light hide what the beholder declares?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252058.html'
source_title="Tractates on John 58"
