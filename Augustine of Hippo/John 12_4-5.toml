[[commentary]]
quote='''
And now, lastly, listen to what we have here, how this ointment was to some a sweet savor unto life, and to others a sweet savor unto death. When the pious Mary had rendered this grateful service to the Lord, straightway one of His disciples, Judas Iscariot, who was yet to betray Him, said, "Why was not this ointment sold for three hundred pence, and given to the poor?" Alas for thee, wretched man! the sweet savor hath slain thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
