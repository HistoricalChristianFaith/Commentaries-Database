[[commentary]]
quote='''
Man is unable to rule over the lower things unless he in turn submits to the rule of a higher being. And this is the peace that is promised "on earth to men of good will." This is the life of a man of consummate and perfect wisdom. The prince of this world, who rules over the perverse and disorderly, has been cast out of a thoroughly pacified and orderly kingdom of this kind. When this peace has been established and strengthened within a man, then he who has been cast out—no matter what persecutions he may stir up from without increases the glory that is according to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25201.html'
source_title="SERMON ON THE MOUNT 1.2.9"

[[commentary]]
quote='''
(13. de Trin. cap. 13) For righteousness belongs to good will.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“And let the sons of Sion exult in their King.” The sons of the Church are Israel. For Sion indeed was one city, which fell: amid its ruins certain saints dwelt after the flesh: but the true Sion, the true Jerusalem (for Sion and Jerusalem are one), is “eternal in the heavens,” and is “our mother.” She it is that hath given us birth, she is the Church of the saints, she hath nourished us, she, who is in part a pilgrim, in part abiding in the heavens. In the part which abideth in heaven is the bliss of angels, in the part which wandereth in this world is the hope of the righteous. Of the former is said, “Glory to God in the highest;” of the latter, “and on earth peace to men of good will.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
