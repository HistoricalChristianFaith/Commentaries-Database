[[commentary]]
quote='''
“Because of the house of the Lord my God, I have sought good things for thee” (ver. 9). Not on my own account have sought good things, for then I should not seek for thee, but for myself; and so should I not have them, because I should not seek them for thee; but, “Because of the house of the Lord my God,” because of the Church, because of the Saints, because of the pilgrims; because of the poor, that they may go up; because we say to them, we will go into the house of the Lord: because of the house of the Lord my God itself, I have sought good things for Thee. These long and needful words gather ye, brethren, eat them, drink them, and grow strong, run, and seize.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
