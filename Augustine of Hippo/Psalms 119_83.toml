[[commentary]]
quote='''
But when spiritual desires burn, carnal desires without doubt cool: on this account followeth, “Since I am become like a bottle in the frost, I do not forget Thy righteousnesses” (ver. 83). Truly he desireth this mortal flesh to be understood by the bottle, the heavenly blessing by the frost, whereby the lusts of the flesh as it were by the binding of the frost become sluggish; and hence it ariseth that the righteousnesses of God do not slip from the memory, as long as we do not meditate apart from them; since what the Apostle saith is brought to pass: “Make not provision for the flesh, to fulfil the lusts thereof.” “And I do not forget Thy righteousness:” that is, I forget them not, because I have become such. For the fervour of lust hath cooled, that the memory of love might glow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
