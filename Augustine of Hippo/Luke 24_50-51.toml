[[commentary]]
quote='''
You heard what came to our ears just now from the Gospel: "Lifting up his hands, he blessed them. And it happened, while he was blessing them he withdrew from them, and was carried up to heaven." Who was carried up to heaven? The Lord Christ was. Who is the Lord Christ? He is the Lord Jesus. What is this? Are you going to separate the human from the divine and make one person of God, another of the man, so that there is no longer a trinity of three but a quaternary of four? Just as you, a human being, are soul and body, so the Lord Christ is Word, soul and body. The Word did not depart from the Father. He both came to us and did not forsake the Father. He both took flesh in the womb and continued to govern the universe. What was lifted up into heaven, if not what had been taken from earth? That is to say, the very flesh, the very body, about which he was speaking when he said to the disciples, "Feel, and see that a spirit does not have bones and flesh, as you can see that I have." Let us believe this, brothers and sisters, and if we have difficulty in meeting the arguments of the philosophers, let us hold on to what was demonstrated in the Lord's case without any difficulty of faith. Let them chatter, but let us believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520242.html'
source_title="SERMON 242.6"

[[commentary]]
quote='''
After these matters, Luke passes over in silence all else that happened, and introduces nothing into his narrative beyond the occasion when Jesus ascended into heaven. And at the same time he appends this [statement of the ascension], just as if it followed immediately upon these words which the Lord spake, at the same time with those other transactions on the first day of the week, that is to say, on the day on which the Lord rose again; whereas, in the Acts of the Apostles, the self-same Luke tells us that the event really took place on the fortieth day after His resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"

[[commentary]]
quote='''
Consequently, in the four evangelists we find mention made of ten distinct appearances of the Lord to different persons after His resurrection. First, to the women near the sepulchre. Secondly, to the same women as they were on the way returning from the sepulchre. Thirdly, to Peter. Fourthly, to the two who were going to the place in the country. Fifthly, to the larger number in Jerusalem, when Thomas was not present. Sixthly, on the occasion when Thomas saw Him. Seventhly, by the sea of Tiberias. Eighthly, on the mountain in Galilee, of which Matthew speaks. Ninthly, at the time to which Mark refers in the words, "Lastly, as they sat at meat," thereby intimating that now they were no more to eat with Him upon the earth. Tenthly, on the same day, not now indeed upon the earth, but lifted up in the cloud, as He ascended into heaven, as Mark and Luke record. This last appearance, indeed, is introduced by Mark, directly after he has told us how the Lord showed Himself to them as they sat at meat. For his narrative goes on connectedly as follows: "So then, after the Lord had spoken unto them, He was received up into heaven." Luke, on the other hand, omits all that may have passed between Him and His disciples during the forty days, and, after giving the history of the first day of His resurrection-life, when He showed Himself to the larger number in Jerusalem, he silently connects therewith the closing day on which He ascended up into heaven. His statement proceeds in this form: "And He led them out as far as to Bethany; and He lifted up His hands, and blessed them; and it came to pass, that while He blessed them, He was parted from them, and carried up into heaven." Thus, therefore, besides seeing Him upon the earth, they beheld Him also as He was borne up into heaven. So many times, then, is He reported in the evangelical books to have been seen by different individuals, previous to His completed ascension into heaven, namely, nine times upon the earth, and once in the air as He was ascending.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
