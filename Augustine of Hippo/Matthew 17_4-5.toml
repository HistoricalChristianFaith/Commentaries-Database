[[commentary]]
quote='''
Moreover, the statement which Luke makes with regard to Moses and Elias in these terms, "And it came to pass, as they departed from Him, Peter said unto Jesus, Master, it is good for us to be here," and so forth, ought not to be considered antagonistic to what Matthew and Mark have subjoined to the same effect, as if they made Peter offer this suggestion while Moses and Elias were still talking with the Lord. For they have not expressly said that it was at that time, but rather they have simply left unnoticed the fact which Luke has added,—namely, that it was as they went away that Peter made the suggestion to the Lord with respect to the making of three tabernacles. At the same time, Luke has appended the intimation that it was as they were entering the cloud that the voice came from heaven,—a circumstance which is not affirmed, but which is as little contradicted, by the others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 56"
