[[commentary]]
quote='''
This Psalm hath an inscription, that is, a title, “There have failed the hymns of David, the son of Jesse. A Psalm of Asaph himself.” So many Psalms we have on the titles whereof is written the name David, nowhere there is added, “son of Jesse,” except in this alone. Which we must believe hath not been done to no purpose, nor capriciously. For everywhere God doth make intimations to us, and to the understanding thereof doth invite the godly study of love. What is, “there have failed the hymns of David, the son of Jesse”? Hymns are praises of God accompanied with singing: hymns are songs containing the praise of God. If there be praise, and it be not of God, it is no hymn: if there be praise, and God’s praise, and it be not sung, it is no hymn. It must needs then, if it be a hymn, have these three things, both praise, and that of God, and singing. What is then, “there have failed the hymns”? There have failed the praises which are sung unto God. He seemeth to tell of a thing painful, and so to speak deplorable. For he that singeth praise, not only praiseth, but only praiseth with gladness: he that singeth praise, not only singeth, but also loveth him of whom he singeth. In praise, there is the speaking forth of one confessing; in singing, the affection of one loving. “There have failed” then “the hymns of David,” he saith: and he hath added, “the son of Jesse.” For David was king of Israel, son of Jesse, at a certain time of the Old Testament, at which time the New Testament was therein hidden, like fruit in a root. For if thou seek fruit in a root, thou wilt not find, and yet dost thou not find any fruit in the branches, except that which hath gone forth from the root.…And in like manner as Christ Himself to be born after the flesh was hidden in the root, that is in the seed of the Patriarchs, and at a certain time must be revealed, as at the fruit appearing, according as it is written, “there hath flourished a shoot from the root of Jesse:” so also the New Testament itself which is in Christ, in those former times was hidden, being known to the Prophets alone, and to the very few godly men, not by the manifestation of things present, but by the revelation of things future. For what meaneth it, brethren (to mention but one thing), that Abraham sending his faithful servant to espouse a wife for his only son, maketh him swear to him, and in the oath saith to him, “Put thy hand under my thigh, and swear”? What was there in the thigh of Abraham, where he put his hand in swearing? What was there there, except that which even then was promised to him, “In thy seed shall be blessed all nations”? Under the name of thigh, flesh is signified. From the flesh of Abraham, through Isaac and Jacob, and not to mention many names, through Mary was our Lord Jesus Christ.

But that the root was in the Patriarchs, how shall we show? Let us question Paul. The Gentiles now believing in Christ, and desiring as it were to boast over the Jews who crucified Christ; although also from that same people there came another wall, meeting in the corner, that is, in Christ Himself, the wall of uncircumcision, that is, of the Gentiles, coming from a different quarter: when, I say, the nations were lifting up themselves, he doth thus depress them. “For if thou,” he saith, “being cut out of the natural wild olive, hast been graffed in among them, do not boast against the branches: for if thou boastest, thou dost not bear the root, but the root thee.” Therefore he speaketh of certain branches broken off from the root of the Patriarchs because of unbelief, and the wild olive therein graffed in, that it might be partaker of the fatness of the olive, that is, the Church coming out of the Gentiles. And who doth graff the wild olive on the olive? The olive is wont to be graffed on the wild olive; the wild olive on the olive we never saw. For whosoever may have done so will find no berries but those of the wild olive. For that which is graffed in, the same groweth, and of that kind the fruit is found. There is not found the fruit of the root but of the graft. The Apostle showing that God did this thing by His Omnipotence, namely, that the wild olive should be graffed into the root of the olive, and should not bear wild berries, but olive—ascribing it to the Omnipotence of God, the Apostle saith this, “If thou hast been cut out of the natural wild olive and against nature hast been graffed into a good olive, do not boast,” he saith, “against the branches.”…

In the time then of the Old Testament, brethren, the promises from our God to that carnal people were earthly and temporal. There was promised an earthly kingdom, there was promised that land into which they were also led, after being delivered from Egypt: by Jesus son of Nave they were led into the land of promise, where also earthly Jerusalem was builded, where David reigned: they received the land, after being delivered from Egypt, by passing through the Red Sea.…Such were also those promises, which were not to endure, through which however were figured future promises which were to endure, so that all that course of temporal promises was a figure and a sort of prophecy of things future. Accordingly when that kingdom was failing, where reigned David, the son of Jesse, that is, one that was a man, though a Prophet, though holy, because he saw and foresaw Christ to come, of whose seed also after the flesh He was to be born: nevertheless a man, nevertheless not yet Christ, nevertheless not yet our King Son of God, but king David son of Jesse: because then that kingdom was to fail, through the receiving of which kingdom at that time God was praised by carnal men; for this thing alone they esteemed a great matter, namely, that they were delivered temporally from those by whom they were being oppressed, and that they had escaped from persecuting enemies through the Red Sea, and had been led through the desert, and had found country and kingdom: for this alone they praised God, not yet perceiving the thing which God was designing beforehand and promising in these figures. In the failing therefore of those things for which the carnal people, over whom reigned that David, was praising God, “there failed the hymns of David,” not the Son of God, but the “son of Jesse.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
