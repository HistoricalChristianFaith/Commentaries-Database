[[commentary]]
quote='''
“Great is our Lord” (ver. 5). The Psalmist is filled with joy, he hath poured out his words wonderfully: yet somewhat he was unable to speak, and how availed he to think on it? “And great is His power, and of His understanding is no numbering.” He who “numbereth the stars,” Himself cannot be numbered. Who can expound this? who can worthily even imagine what is meant by, “and of His understanding is no number”?…Whatsoever then that is infinite this world containeth, though it be infinite to man, yet is not to God: too little is it to say, to God: even by the angels it is numbered. His understanding surpasses all calculators; it cannot be counted by us. Numbers themselves who numbereth? What than is there with God? wherewith made He all things, and where made He all things, to whom it is said, “Thou hast arrayed all things in measure, number, and weight”? Or who can number, or measure, or weigh, measure and number and weight themselves, wherein God hath ordered all things? Therefore, “of His understanding is no number.” Let human voices be hushed, human thoughts still: let them not stretch themselves out to incomprehensible things, as though they could comprehend them, but as though they were to partake of them, for partakers we shall be.…Partakers then we shall be: let none doubt it: Scripture saith it. And of what shall we be partakers, as though these were parts in God, as though God were divided into parts? Who then can explain how many become partakers of one single substance? Require not then that which I think ye see cannot fitly be said: but return to the healing of the Saviour, bruise your heart. He will guide it, He will bind it up where it is broken, He will make it perfectly sound; and then those things will not be impossible with us, which now are impossible. For it is good that he confess weakness, who desireth to attain to the divine nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
