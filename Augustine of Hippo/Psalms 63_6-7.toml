[[commentary]]
quote='''
“If I have remembered Thee upon my bed, in the dawnings I did meditate on thee (ver. 7): because Thou hast become my helper” (ver. 8). His “bed” he calleth his rest. When any one is at rest, let him be mindful of God; when any one is at rest, let him not by rest be dissolved, and forget God: if mindful he is of God when he is at rest, in his actions on God he doth meditate. For the dawn he hath called actions, because every man at dawn beginneth to do something. What therefore hath he said? If therefore I was not mindful on my bed, in the dawn also I did not meditate on Thee. Can he that thinketh not of God when he is at leisure, in his actions think of God? But he that is mindful of Him when he is at rest, on the Same doth meditate when he is doing, lest in action he should come short. Therefore he hath added what? “Because Thou has become my helper.” For unless God aid our good works, they cannot be accomplished by us. And worthy things we ought to work: that is, as though in the light, since by Christ showing the way we work. Whosoever worketh evil things, in the night he worketh, not in the dawn; according to the Apostle, saying, “They that are drunken, in the night are drunken; and they that sleep, in the night do sleep; let us that are of the day, be sober.” He exhorteth us that after the day we should walk honestly: “As in the day, honestly let us walk.” And again, “Ye,” he saith, “are sons of light, and sons of day; we are not of night nor of darkness.” Who are sons of night, and sons of darkness? They that work all evil things. To such a degree they are sons of night, that they fear lest the things which they work should be seen.…No one therefore in the dawn worketh, except him that in Christ worketh. But he that while at leisure is mindful of Christ, on the Same doth meditate in all his actions, and He is a helper to him in a good work, lest through his weakness he fail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"
