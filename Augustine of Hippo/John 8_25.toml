[[commentary]]
quote='''
"In the beginning was the Word." That through which he made things already was. That is how he made what as yet was not. We can understand it, and rightly understand it, in the sense that heaven and earth were made in the only begotten Word itself. They were, you see, made in that through which they were made. This can be, and be understood as, the beginning in which God made heaven and earth. This Word, after all, is also the wisdom of God, about which it is said, "You have made all things in wisdom." If God made all things in wisdom and his only begotten Son is without a shadow of doubt the wisdom of God, let us not doubt that whatever we have learned was made through the Son was also made in the Son. The Son himself, after all, is certainly the beginning. When the Jews were questioning him and saying, "Who are you? He answered, "The beginning." And there [in Genesis] you have, "In the beginning God made heaven and earth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520223A.html'
source_title="SERMON 223A.1"

[[commentary]]
quote='''
(Tract. xxxviii. s. 11) Our Lord having said, If ye believe not that I am, ye shall die in your sins; they enquire of Him, as if wishing to know in whom they are to believe, that they might not die in their sin: Then said they unto Him, Who art Thou? For when Thou saidst, If ye believe not that I am, Thou didst not add, who Thou art. But our Lord knew that these were some who would believe, and therefore after being asked, Who art Thou? that such might know what they should believe Him to be, Jesus saith unto them, The beginning, who also speak to you; not as if to say, I am the beginning, but, Believe Me to be the beginning; as is evident from the Greek, where beginning is feminine. Believe Me then to be the beginning, but ye die in your sins: for the beginning cannot be changed; it remains fixed in itself, and is the source of change to all things. (Tract. xxxix. 1, 2). But it is absurd to call the Son the beginning, and not the Father also. And yet there are not two beginnings, even as these are not two Gods. The Holy Spirit is the Spirit of the Father and the Son; not being either the Father, or the Son. Yet Father, Son, and Holy Spirit are one God, one Light, one beginning. (Tract. xxxviii. 11). He adds, Who also speak to you, i. e. Who humbled Myself for your sakes, and condescended to those words. Therefore believe Me to be the beginning; because that ye may believe this, not only am I the beginning, but I also speak with you, that ye may believe that I am. For if the Beginning had remained with the Father in its original nature, and not taken upon it the form of a servant, how could men have believed in it? Would their weakly minds have taken in the spiritual Word, without the medium of sensible sound?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And savoring as these men always did of the earth, and ever hearing and answering according to the flesh, what did they say to Him? "Who art thou?" For when thou saidst, "If ye believe not that I am," thou didst not tell us what thou wert. Who art thou, that we may believe? He answered "The Beginning." Here is the existence that [always] is. The beginning cannot be changed: the beginning is self-abiding and all-originating; that is, the beginning, to which it has been said, "But thou Thyself art the same, and Thy years shall not fail." "The beginning," He said, "for so I also speak to you." Believe me [to be] the beginning, that ye may not die in your sins. For just as if by saying, "Who art thou?" they had said nothing else than this, What shall we believe thee to be? He replied, "The beginning;" that is, Believe me [to be] the "beginning." For in the Greek expression we discern what we cannot in the Latin. For in Greek the word "beginning" (principium, ἀρχή), is of the feminine gender, just as with us "law" (lex) is of the feminine gender, while it is of the masculine (νόμος) with them; or as "wisdom" (sapientia, σοφία) is of the feminine gender with both. It is the custom of speech, therefore, in different languages to vary the gender of words, because in things themselves there is no place for the distinction of sex. For wisdom is not really female, since Christ is the Wisdom of God, and Christ is termed of the masculine gender, wisdom of the feminine. When then the Jews said, "Who art thou?" He, who knew that there were some there who should yet believe, and therefore had said, Who art thou that so they might come to know what they ought to believe regarding Him, replied, "The beginning:" not as if He said, I am the beginning; but as if He said, Believe me [to be] the beginning. Which, as I said, is quite evident in the Greek language, where beginning (ἀρχή) is of the feminine gender. Just as if He had wished to say that He was the Truth, and to their question, "Who art thou?" had answered, Veritatem [the Truth]; when to the words, "Who art thou?" He evidently ought to have replied, Veritas [the Truth]; that is, I am the Truth. But His answer had a deeper meaning, when He saw that they had put the question, "Who art thou?" in such a way as to mean, Having heard from thee, "If ye believe not that I am, what shall we believe thee to be? To this He replied, "The beginning:" as if He said, Believe me to be the beginning. And He added "for [as such] I also speak to you;" that is, having humbled myself on your account, I have condescended to such words. For if the beginning as it is in itself had remained so with the Father, as not to receive the form of a servant and speak as man with men; how could they have believed in Him, since their weak hearts could not have heard the Word intelligently without some voice that would appeal to their senses? Therefore, said He, believe me to be the beginning; for, that you may believe, I not only am, but also speak to you. But on this subject I have still much to say to you; may it therefore please your Charity that we reserve what remains, and by His gracious aid deliver it tomorrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252038.html'
source_title="Tractates on John 38"

[[commentary]]
quote='''
The words of our Lord Jesus Christ, which He had addressed to the Jews, so regulating His discourse that the blind saw not, and believers' eyes were opened, are these, which have been read to-day from the holy Gospel: "Then said the Jews, Who art thou?" Because the Lord had said before, "If ye believe not that I am, ye shall die in your sins." To this accordingly they rejoined, "Who art thou?" as if seeking to know on whom they ought to believe, so as not to die in their sin. He replied to those who asked Him: "Who art thou?" by saying, "The beginning, for [so] also I speak to you." If the Lord has called Himself the beginning, it may be inquired whether the Father also is the beginning. For if the Son who has a Father is the beginning, how much more easily must God the Father be understood as the beginning, who has indeed the Son whose Father He is, but has no one from whom He Himself proceedeth? For the Son is the Son of the Father, and the Father certainly is the Father of the Son; but the Son is called God of God,-the Son is called Light of Light; the Father is called Light, but not, of Light,-the Father is called God, but not, of God. If, then, God of God, Light of Light, is the beginning, how much more easily may we understand as such that Light, from whom the Light [cometh], and God, of whom is God? It seems, therefore, absurd, dearly beloved, to call the Son the beginning, and not to call the Father the beginning also.

But what shall we do? Are there, then, two beginnings? Let us beware of saying so. What then, if both the Father is the beginning and the Son the beginning, how are there not two beginnings? In the same way that we call the Father God, and the Son God, and yet say not that there are two Gods; and yet He who is the Father is not the Son, He who is the Son is not the Father; and the Holy Spirit, the Spirit of the Father and of the Son, is neither the Father nor the Son. Although, then, as Catholic ears have been taught in the bosom of mother Church, neither He who is the Father is the Son, nor He who is the Son is the Father, nor is the Holy Spirit, of the Father and of the Son, either the Son or the Father, yet we say not that there are three Gods; although, if we are asked of each apart, we must, of whichever we are questioned, confess that He is God.

But all this seems absurd to those who drag up familiar things to a level with things little known, visible things with invisible, and compare the creature to the Creator. For unbelievers sometimes question us and say: Whom you call the Father, do you call him God? We answer, God. Whom you call the Son, do you call him God? We answer, God. Whom you call the Holy Spirit, do you call him God? We answer, God. Then, say they, are the Father, and the Son, and the Holy Spirit three Gods? We answer, No. They are confounded, because they are not enlightened; they have their heart shut up, because they want the key of faith. Let us then, brethren, by an antecedent faith that heals the eye of our heart, receive without obscurity what we understand,-and what we understand not, believe without hesitation; let us not quit the foundation of faith in order to reach the summit of perfection. The Father is God, the Son is God, the Holy Spirit is God: and yet He is not the Father who is the Son, nor He the Son who is the Father, and the Holy Spirit, the Spirit of the Father and the Son, is neither the Father nor the Son. The Trinity is one God. The Trinity is one eternity, one power, one majesty;-three, [but not three] Gods. Let not the reviler answer me: "Three what, then? For," he adds, "if there are three, you must say, three what?" I reply: The Father, and the Son, and the Holy Spirit. "See," he says, "you have named three; but express what the three are?" Nay, count them yourself; for I make out three when I say, the Father, and the Son, and the Holy Spirit. For the Father is God as respects Himself, but [He is] the Father as respects the Son; the Son is God as respects Himself, but He is the Son as regards the Father.

What I say you may gather from daily analogies. So it is with one man and another, if the one be a father, the other his son. He is man as regards himself, but a father as regards his son; and the son man as respects himself, but a son as respects his father. For father is a name given relatively, and so with son; but these are two men. And certainly God the Father is Father in a relative sense, that is, in relation to the Son; and God the Son is Son relatively, that is, in relation to the Father; but not as the former are two men are these two Gods. Why is it not so here? Because that belongs to one sphere and this to another; for this is divine. There is here something ineffable which cannot be explained in words, that there should both be, and not be, number. For see if there appear not a kind of number, Father, and Son, and Holy Ghost-the Trinity. If three, three what? Here number fails. And so God neither keeps apart from number, nor is comprehended by number. Because there are three, there is a kind of number. If you ask three what, number ceases. Hence it is said, "Great is our Lord, and great His power; and of His understanding there is no number." When you have begun to reflect, you begin to number; when you have numbered, you cannot tell what you have numbered. The Father is Father, the Son is Son, the Holy Spirit is the Holy Spirit. What are these three, the Father, the Son, and the Holy Spirit? Are They not three Gods? No. Are They not three Almighties? No. Not three Creators of the world? No. Is the Father then almighty? Manifestly almighty. And is the Son then not almighty? Clearly the Son. is also almighty. And is the Holy Spirit then not almighty? He, too, is almighty. Are there then three Almighties? No; only one Almighty. Only in Their relation to each other do They suggest number, not in Their essential existence. For though God the Father is, as respects Himself, God along with the Son and the Holy Spirit, there are not three Gods; and, though as respects Himself He is omnipotent, as well as the Son and the Holy Spirit, there are not three omnipotents; for in truth He is the Father not in respect to Himself, but to the Son; nor is the Son so in respect to Himself, but to the Father; nor is the Spirit so as regards Himself, in as far as He is called the Spirit of the Father and of the Son. I have no name to give the three, save the Father, the Son, and the Holy Spirit, one God, one Almighty. And so one beginning.

Take an illustration from the Holy Scriptures, whereby you may in some measure comprehend what I am saying. After our Lord Jesus Christ rose again, and was pleased to ascend into heaven, at the end of ten days He sent from thence the Holy Spirit, by whom those who were present in that one chamber were filled, and began to speak in the languages of all nations. The Lord's murderers, terrified by the miracle, were pricked to the heart and sorrowed; sorrowing, were changed; and being changed, believed. There were added to the Lord's body, that is, to the number of believers, three thousand people. And so also by the working of another miracle there were added other five thousand. A considerable community was created, in which all, receiving the Holy Spirit, by whom spiritual love was kindled, were by their very love and fervor of spirit welded into one, and began in the very unity of fellowship to sell all that they had, and to lay the price at the apostles' feet, that distribution might be made to every one as each had need. And the Scripture says this of them, that "they were of one soul and one heart toward God." Give heed then, brethren, and from this acknowledge the mystery of the Trinity, how it is we say, There is both the Father, and the Son, and the Holy Spirit, and yet there is one God. See! there were so many thousands of these, and yet there was one heart; there were so many thousands, and one soul. But where? In God. How much more so God Himself? Do I err at all in word when I call two men two souls, or three men three souls, or many men many souls? Surely I speak correctly. Let them approach God, and one soul belongs to all. If by approaching God many souls by love become one soul, and many hearts one heart, what of the very fountain of love in the Father and Son? Is it not still more so here that the Trinity is one God? For thence, of that Holy Spirit, does love come to us, as the apostle says: "The love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us." If then the love of God, shed abroad in our hearts by the Holy Ghost which is given unto us, makes many souls one soul, and many hearts one heart, how much rather are the Father and Son and Holy Spirit, one God, one light, and one beginning?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252039.html'
source_title="Tractates on John 39"

[[commentary]]
quote='''
What meaneth, “With Thee is the beginning”? Suppose anything you please as the beginning. Of Christ Himself, it would rather have been said, Thou art the Beginning, than, With Thee is the beginning. For He answered to those who asked Him, “Who art Thou?” and said, “Even the same that I said unto you, the Beginning;” since His Father also is the Beginning, of whom is the only-begotten Son, in which Beginning was the Word, for the Word was with God. What then, if both the Father and the Son are the beginning, are there two beginnings? God forbid! For as the Father is God, and the Son is God, but the Father and the Son are not two Gods, but one God: so is the Father Beginning and the Son Beginning, but the Father and the Son are not two, but one Beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
