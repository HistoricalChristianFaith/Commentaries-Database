[[commentary]]
quote='''
“Take Thou from me the way of iniquity” (ver. 29). And since the law of works hath entered in, that sin might abound; he addeth, “And pity me according to Thy law.” By what law, save by the law of faith? Hear the Apostle: “Where is boasting then? It is excluded. By what law? Of works. Nay: but by the law of faith.” This is the law of faith, whereby we believe and pray that it may be granted us through grace; that we may effect that which we cannot fulfil through ourselves; that we may not, ignorant of God’s righteousness, and going about to establish our own, fail to submit ourselves unto the righteousness of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
