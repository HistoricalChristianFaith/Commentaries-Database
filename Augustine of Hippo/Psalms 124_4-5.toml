[[commentary]]
quote='''
Without doubt, because the Head hath been raised, the body also will say hereafter, “Our soul hath passed over the torrent. Perhaps our soul hath passed over the water without substance” (ver. 5). Behold, what sort of water he was speaking of, “The water perchance had overwhelmed us.” But what meaneth, “without substance”?

In the first place, what meaneth, “Perchance our soul hath passed over”? (ver. 5). Understand however the meaning to be this: “Thinkest thou our soul hath passed over?” and why do they say, “Thinkest thou”? Because the greatness of the danger maketh it hardly credible that he hath escaped. They have endured a great death: they have been in great dangers; they have been so much oppressed, that they almost gave consent while alive, and were all but swallowed up alive: now therefore that they have escaped, now that they are secure, but still remember the danger, the great danger, say, “Thinkest thou our soul hath passed over the water without substance?”

What is the water without substance, save the water of sins without substance? For sins have not substance: they have destitution, not substance; they have want, not substance. In that water without substance, the younger son lost the whole of his substance…Dost thou wish to see how the water is without substance? Take away with thee to the world below what thou hast acquired: what wilt thou do? Thou hast acquired gold: thou hast lost thy faith: after a few days thou leavest this life; thou canst not take away with thee the gold thou hast acquired by the loss of thy good faith; thy heart, destitute of faith, goeth forth into punishment—thy heart, which if full of faith, would go forth unto a crown. Behold, what thou hast done is nothing: and thou hast offended God for nothing.

Men hear that common proverb; and the proverbs of God slumber in them. What proverb? “Better in hand than in hope.” Unhappy man, what hast thou in hand? Thou sayest, “Better in hand.” Hold it so as not to lose it, and then say, “Better in hand.” But if thou holdest it not, why dost thou not hold fast that which thou canst not lose? What then hast thou in hand? Gold. Keep it in hand, therefore: if thou hast it in hand, let it not be taken away without thy consent. But if through gold also thou art carried where thou wishest not, and if a more powerful robber seeketh thee, because he findeth thee a less powerful robber; if a stronger eagle pursue thee, because thou hast carried off a hare before him: the lesser was thy prey, thou wilt be a prey unto the greater. Men see not these things in human affairs: by so much avarice are they blinded…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520124.html'
source_title="Exposition on Psalm 124"
