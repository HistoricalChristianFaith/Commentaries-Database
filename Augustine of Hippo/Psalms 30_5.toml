[[commentary]]
quote='''
“For in His indignation is wrath” (ver. 5). For He hath avenged against you the first sin, for which you have paid by death. “And life in His will.” And life eternal, whereunto you could not return by any strength of your own, hath He given, because He so would. “In the evening weeping will tarry.” Evening began, when the light of wisdom withdrew from sinful man, when he was condemned to death: from this evening weeping will tarry, as long as God’s people are, amid labours and temptations, awaiting the day of the Lord. “And exultation in the morning.” Even to the morning, when there will be the exultation of the resurrection, which hath shone forth by anticipation in the morning resurrection of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252030.html'
source_title="Exposition on Psalm 30"

[[commentary]]
quote='''
With reason also of the Lord Himself the Resurrection was at dawn, that there should be fulfilled that which hath been said in another Psalm, “In the evening shall tarry weeping and in the morning exultation.” For at even the disciples mourned our Lord Jesus Christ as dead, at dawn at Him rising again they exulted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
