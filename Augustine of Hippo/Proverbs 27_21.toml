
[[commentary]]
quote='''
Two are the kinds of persecutors, revilers and flatterers. The tongue of the flatterer doth more persecute than the hand of the slayer: for this also the Scripture hath called a furnace. Truly when the Scripture was speaking of persecution, it said, “Like gold in a furnace it hath proved them” (speaking of Martyrs being slain), “and as the holocaust’s victim it hath received them.” Hear how even the tongue of flatterers is of such sort: “The proving,” he saith, “of silver and of gold is fire; but a man is proved by the tongue of men praising him.” That is fire, this also is fire: out of both thou oughtest to go forth safe. The censurer hath broken thee, thou hast been broken in the furnace like an earthen vessel. The Word hath moulded thee, and there hath come the trial of tribulation: that which hath been formed, must needs be seasoned; if it hath been well moulded, there hath come the fire to strengthen. Whence He said in the Passion, “Dried up like a potsherd hath been My virtue.” For Passion and the furnace of tribulation had made Him stronger.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252070.html'
source_title="Exposition on Psalm 70"
