[[commentary]]
quote='''
“Merciful and pitiful is the Lord; long-suffering, and very merciful” (ver. 8). “Sweet is the Lord to all, and His compassions reach into all His works” (ver. 9). Were He not such as this, there would be no seeking to recover us. Consider thyself: what didst thou deserve, O sinner? Despiser of God, what didst thou deserve? See if aught occur to thee but penalty, if aught occur to thee but punishment. Thou seest then what was due to thee, and what He hath given, who gave gratis. There was given pardon to the sinner; there was given the spirit of justification; there was given charity and love, wherein thou mayest do all good works; and beyond this, He will give thee also life everlasting, and fellowship with the angels: all of His mercy.…Hear the Scripture: “I will not the death of a sinner, but rather that he should turn, and live.” By these words of God, he is brought back to hope; but there is another snare to be feared, lest through this very hope he sin the more. What then didst thou also say, thou who through hope sinnest yet more? “Whensoever I turn, God will forgive me all; I will do whatsoever I will.” Say not then, “To-morrow I will turn, to-morrow I will please God; and all to-day’s and yesterday’s deeds shall be forgiven me.” Thou sayest true: God hath promised pardon to thy conversion; He hath not promised a to-morrow to thy delay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520145.html'
source_title="Exposition on Psalm 145"
