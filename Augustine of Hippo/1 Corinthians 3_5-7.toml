[[commentary]]
quote='''
For although they give not the increase, they afford some help; but not of themselves: "For without me," He says, "ye can do nothing."' And listen, also, to their own confession: "What, then, is Apollos, and what is Paul but ministers by whom ye believed, even as the Lord gave to every man. I have planted, Apollos watered." And this, too, "as the Lord gave to every man;" and so not of themselves. In that, however, which follows, "but God gave the increase," He works not by them, but by Himself; for work like that exceeds the lowly capacity of man, transcends the lofty powers of angels, and rests solely and entirely in the hands of the Triune Husbandman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252080.html'
source_title="Tractates on John 80"
