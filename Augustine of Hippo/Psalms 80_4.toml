[[commentary]]
quote='''
“O Lord God of virtues, how long wilt Thou be angry with the prayer of Thy servant?” (ver. 4). Now Thy servant. Thou wast angry at the prayer of Thy enemy, wilt Thou still be angry with the prayer of Thy servant? Thou hast converted us, we know Thee, and wilt Thou still be angry with the prayer of Thy servant? Thou wilt evidently be angry, in fact, as a father correcting, not as a judge condemning. In such manner evidently Thou wilt be angry, because it hath been written, “My son, drawing near unto the service of God, stand thou in righteousness and in fear, and prepare thy soul for temptation.” Think not that now the wrath of God hath passed away, because thou hast been converted. The wrath of God hath passed away from thee, but only so that it condemn not for everlasting. But He scourgeth, He spareth not: because He scourgeth every son whom He receiveth. If thou refusest to be scourged, why dost thou desire to be received? He scourgeth every son whom He receiveth. He who did not spare even His only Son, scourgeth every one. But nevertheless, “How long wilt Thou be angry with the prayer of Thy servant?” No longer thine enemy: but, “Thou wilt be angry with the prayer of Thy servant,” how long?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
