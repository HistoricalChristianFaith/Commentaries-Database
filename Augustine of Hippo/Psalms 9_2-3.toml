[[commentary]]
quote='''
For now the Person of the Lord begins to appear speaking in this Psalm. For it follows, “I will sing to Thy Name, O Most High, in turning mine enemy behind.” His enemy then, where was he turned back? Was it when it was said to him, “Get thee behind, Satan”? For then he who by tempting desired to put himself before, was turned behind, by failing in deceiving Him who was tempted, and by availing nothing against Him. For earthly men are behind: but the heavenly man is preferred before, although he came after. For “the first man is of the earth, earthy: the second Man is from heaven, heavenly.” But from this stock he came by whom it was said, “He who cometh after me is preferred before me.” And the Apostle forgets “those things that are behind, and reaches forth unto those things that are before.” The enemy, therefore, was turned behind, after that he could not deceive the heavenly Man being tempted; and he turned himself to earthy men, where he can have dominion.…For in truth the devil is turned behind, even in the persecution of the righteous, and he, much more to their advantage, is a persecutor, than if he went before as a leader and a prince. We must sing then to the Name of the Most High in turning the enemy behind: since we ought to choose rather to fly from him as a persecutor, than to follow him as a leader. For we have whither we may fly and hide ourselves in the hidden things of the Son; seeing that “the Lord hath been made a refuge for us.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25209.html'
source_title="Exposition on Psalm 9"
