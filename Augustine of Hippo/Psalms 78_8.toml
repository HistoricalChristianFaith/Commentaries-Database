[[commentary]]
quote='''
And he saith why, by immediately subjoining, “and its spirit hath not been trusted with God,” that is, because it had no faith, which doth obtain what the Law doth enjoin. For when the spirit of man doth work together with the Spirit of God working, then there is fulfilled that which God hath commanded: and this doth not come to pass, except by believing in Him that doth justify an ungodly man. Which faith the generation crooked and embittering had not: and therefore concerning the same hath been said, “The spirit thereof hath not been trusted with God.” For this hath been said much more exactly to point out the grace of God, which doth work not only remission of sins, but also doth make the spirit of man to work together therewith in the work of good deeds, as though he were saying, his spirit hath not believed in God. For to have the spirit trusted with God, is, not to believe that his spirit is able to do righteousness without God, but with God. For this is to believe in God: which is surely more than to believe God. For ofttimes we must believe even a man, though in him we must not believe. To believe in God therefore is this, in believing to cleave unto God who worketh good works, in order to work with Him well.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"

[[commentary]]
quote='''
Therefore these men have been thus branded: “a generation,” he saith, “which hath not directed their heart.” It hath not been said, works, but heart. For when the heart is directed, the works are right; but when the heart is not directed, the works are not right, even though they seem to be right. And how the crooked generation hath not directed the heart, hath sufficiently been shown, when he saith, “and the spirit thereof hath not been trusted with God.” For God is right: and therefore by cleaving to the right, as to an immutable rule, the heart of a man can be made right, which in itself was crooked.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
