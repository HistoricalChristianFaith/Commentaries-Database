[[commentary]]
quote='''
Face to face—this is how the holy angels, who are called our angels, already see. They are our angels in the sense that once we have been delivered from the power of darkness, have received the pledge of the spirit and have been translated to the kingdom of Christ, we shall have begun to belong to the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252022.html'
source_title="City of God 22.29"

[[commentary]]
quote='''
But when we begin to have a spiritual body as we are promised in the resurrection, let us see it even in the body, either by an intellectual vision or in some miraculous manner, since the grace of the spiritual body is indescribable. We shall then see it according to our capacity, without limitations of space, not larger in one part and smaller in another, since it is not a body, and it is wholly present everywhere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 120, TO CONSENTIUS"

[[commentary]]
quote='''
Accordingly, when He says, "He will teach you all truth," or "will guide you into all truth," I do not think the fulfillment is possible in any one's mind in this present life(for who is there, while living in this corruptible and soul-oppressing body, that can know all truth, when even the apostle says, "We know in part "?), but because it is effected by the Holy Spirit, of whom we have now received the earnest, that we shall attain also to the actual fullness of knowledge: whereof it is said by the same apostle, "But then face to face;" and, "Now I know in part, but then shall I know even as also I am known;" not as a thing which he knows fully in this life, but which, as a thing that would still be future on to the attainment of that perfection, the Lord promised us through the love of the Spirit, when He said, "He will teach you all truth,"' or "will guide you unto all truth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252096.html'
source_title="Tractates on John 96"
