[[commentary]]
quote='''
“Their fruit shalt Thou destroy out of the earth.” Their fruit, because it is earthly, shalt Thou destroy out of the earth. “And their seed from the sons of men” (ver. 10). And their works; or, whomsoever they have seduced, Thou shalt not reckon among the sons of men, whom Thou hast called into the everlasting inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
