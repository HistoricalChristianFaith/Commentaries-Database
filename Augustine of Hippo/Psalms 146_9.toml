[[commentary]]
quote='''
“And the way of sinners He shall root out.” What is, “the way of sinners”? To mock at these things which we say. “Who is an orphan, who a widow? What kingdom of heaven, what punishment of hell is there? These are fables of the Christians. To what I see, to that will I live: “let us eat and drink, for to-morrow we die.” Beware lest such men persuade you of aught: let them not enter through your ears into your heart; let them find thorns in your ears: let him, who seeketh to enter thus, go away pierced: for “evil communications corrupt good manners.” But here perhaps thou wilt say, “Wherefore then are they prosperous? Behold, they worship not God, and commit every kind of evil daily: yet they abound in those things, through want of which I toil.” Be not envious against sinners. What they receive, thou seest; what is in store for them, seest thou not?…Wilt thou not believe even the Lord thy God, who saith, “Broad and spacious is the way that leadeth to destruction, and many there be that walk by it”? This “way the Lord will root out.” And, when “the way of sinners” has been “rooted out,” what remaineth for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
