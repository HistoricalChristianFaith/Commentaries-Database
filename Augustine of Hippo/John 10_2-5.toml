[[commentary]]
quote='''
"But he that entereth in by the door is the shepherd of the sheep: to him the porter openeth." Concerning this porter we shall make inquiry, when we have heard of the Lord Himself what is the door and who is the shepherd. "And the sheep hear his voice: and he calleth his own sheep by name." For He has their names written in the book of life. "He calleth his own sheep by name." Hence, says the apostle, "The Lord knoweth them that are His." "And he leadeth them out. And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice. And a stranger do they not follow, but do flee from him: for they know not the voice of strangers." These are veiled words, full of topics of inquiry, pregnant with sacramental signs. Let us follow then, and listen to the Master as He makes some opening into these obscurities; and perhaps by the opening He makes, He will cause us to enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
