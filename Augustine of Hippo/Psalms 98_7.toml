[[commentary]]
quote='''
While ye are rejoicing, and delighted with the ductile trumpets, and the voice of the horn, what followeth? “Let the sea be stirred up, and the fulness thereof” (ver. 7). Brethren, when the Apostles, like ductile trumpets and horns, were preaching the truth, the sea was stirred up, its waves arose, tempests increased, persecutions of the Church took place. Whence hath the sea been stirred up? When a joyful noise was made, when Psalms of thanksgiving were being sung before God: the ears of God were pleased, the waves of the sea were raised. “Let the sea be stirred up, and the fulness thereof: the round world, and all that dwell therein.” Let the sea be stirred up in its persecutions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
