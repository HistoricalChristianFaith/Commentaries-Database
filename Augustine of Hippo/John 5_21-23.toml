[[commentary]]
quote='''
He then returns to that resurrection of souls: "For as the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will;" but this according to the Spirit. The Father quickeneth, the Son quickeneth; the Father whom He will, the Son whom He will; but the Father quickeneth the same as the Son, because all things were made by Him. "For as the Father raiseth up the dead, and quickeneth them, so also the Son quickeneth whom He will." This is said of the resurrection of souls; but what of the resurrection of bodies? He returns, and says: "For the Father judgeth not any man. but all judgment hath He given to the Son." The resurrection of souls is effected by the eternal and unchangeable substance of the Father and Son. But the resurrection of bodies is effected by the dispensation of the Son's humanity, which dispensation is temporal, not co-eternal with the Father. Therefore, when He mentioned judgment, in which there should be a resurrection of bodies, He saith, "For the Father judgeth not any man, but all judgment hath He given to the Son;" but concerning the resurrection of souls, He saith, "Even as the Father raiseth the dead, and quickeneth them, so also the Son quickeneth whom He will." That, then, the Father and the Son together. But this concerning the resurrection of bodies: "The Father judgeth not any man, but hath given all judgment to the Son; that all may honor the Son, even as they honor the Father." This is referred to the resurrection of souls. "That all may honor the Son." How? "Even as they honor the Father." For the Son works the resurrection of souls in the same manner as the Father doth; the Son quickeneth just as the Father doth. Therefore, in the resurrection of souls, "let all honor the Son as they honor the Father." But what of the honoring on account of the resurrection of the body? "Whoso honoreth not the Son, honoreth not the Father that sent Him." He said not even as, but honoreth and honoreth. For the man Christ is honored, but not even as God the Father. Why? Because, with respect to this, He said, "The Father is greater than I." And when is the Son honored even as the Father is honored? When "in the beginning was the Word, and the Word was with God; and all things were made by Him." And hence, in this second honoring, what saith He? "Whoso honoreth not the Son, honoreth not the Father that sent Him." The Son was not sent, but because He was made man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
