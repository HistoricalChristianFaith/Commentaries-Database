[[commentary]]
quote='''
Nevertheless, let him point out to us, why the body of Christ, the holy Church, the people of adoption, suffered such indignities. “The Lord,” he saith, “hast chastened and corrected me, but He hath not given me over unto death” (ver. 18). Let not then the boastful wicked imagine that aught hath been permitted to their power: they would not have that power, were it not given them from above. Oft doth the father of a family command his sons to be corrected by the most worthless slaves; though he designeth the heritage for the former, fetters for the latter. What is that heritage? Is it of gold, or silver, or jewels, or farms, or pleasant estates? Consider how we enter into it: and learn what it is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
