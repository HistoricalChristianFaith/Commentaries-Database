[[commentary]]
quote='''
But lest anyone should think it was said only of their labor, he adds a further word about those who had already believed. For although they served the law of God with the spirit, that is, with the mind, yet because the flesh serves the law of sin, as long as we suffer the troubles and solicitations of our mortality, therefore he added, saying: And not only so, but we ourselves also, having the firstfruits of the Spirit, even we ourselves groan within ourselves. Not only, then, he says, does that which is called merely creature in those men who have not yet believed—and therefore are not yet established in the number of the sons of God—groan together and grieve, but we ourselves also, who believe and have the firstfruits of the Spirit, because we already cleave to God in spirit through faith, and therefore are no longer called creature but sons of God—yet we ourselves also groan within ourselves, awaiting the adoption, the redemption of our body. For this adoption, which has already been accomplished in those who have believed, was accomplished in spirit, not in body. For the body has not yet been reformed into that heavenly transformation, as the spirit has already been changed, being turned from its errors to God by the reconciliation of faith. Therefore even in those who have believed, that manifestation is still awaited which will come about in the resurrection of the body, which pertains to that fourth stage, where peace will be wholly perfect and rest eternal, with no corruption on any side resisting us or trouble soliciting us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
