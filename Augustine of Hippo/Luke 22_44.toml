[[commentary]]
quote='''
(Prosp. ex Aug. Sent. 68.) Our Lord praying with a bloody sweat represented the martyrdoms which should flow from His whole body, which is the Church.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This we all can say. This not I alone say: whole Christ saith it. But it is said rather in the name of the Body: for He too, when He was here and bore our flesh, prayed; and when He prayed, drops of blood streamed down from His whole Body. So is it written in the Gospel: “Jesus prayed earnestly, and His sweat was as it were great drops of blood.” What is this flowing of sweat from His whole Body, but the suffering of martyrs from the whole Church?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520141.html'
source_title="Exposition on Psalm 141"
