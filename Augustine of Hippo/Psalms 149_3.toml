[[commentary]]
quote='''
“Let them praise His Name in chorus” (ver. 3). What meaneth “chorus”? Many know what a “chorus” is: nay, as we are speaking in a town, almost all know. A “chorus” is the union of singers. If we sing “in chorus,” let us sing in concord. If any one’s voice is out of harmony in a chorus of singers, it offendeth the ear, and throweth the chorus into confusion. If the voice of one echoing discordantly troubleth the harmony of them who sing, how doth the discord of heresy throw into confusion the harmony of them who praise. The whole world is now the chorus of Christ. The chorus of Christ soundeth harmoniously from east to west. “Let them sing a psalm unto Him with timbrel and psaltery.” Wherefore taketh he to him the “timbrel and psaltery”? That not the voice alone may praise, but the works too. When timbrel and psaltery are taken, the hands harmonize with the voice. So too do thou, whensoever thou singest “Halleluia,” deal forth thy bread to the hungry, clothe the naked, take in the stranger: then doth not only thy voice sound, but thy hand soundeth in harmony with it, for thy deeds agree with thy words. Thou hast taken to thee an instrument, and thy fingers agree with thy tongue. Nor must we keep back the mystical meaning of the “timbrel and psaltery.” On the timbrel leather is stretched, on the psaltery gut is stretched; on either instrument the flesh is crucified. How well did he “sing a psalm on timbrel and psaltery,” who said, “the world is crucified unto me, and I unto the world”? This psaltery or timbrel He wishes thee to take up, who loveth a new song, who teacheth thee, saying to thee, “Whosoever willeth to be My disciple, let him deny himself, and take up his cross, and follow Me.” Let him not set down his psaltery, let him not set down his timbrel, let him stretch himself out on the wood, and be dried from the lust of the flesh. The more the strings are stretched, the more sharply do they sound. The Apostle Paul then, in order that his psaltery might sound sharply, what said he? “Stretching forth unto those things which are before,” etc. He stretched himself: Christ touched him; and the sweetness of truth sounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
