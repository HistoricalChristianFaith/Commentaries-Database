[[commentary]]
quote='''
Many pricked in the heart said, "What shall we do?" For they saw themselves bound by an immense crime of impiety, since they slew Him whom they ought to have revered and worshipped; and this crime they thought inexpiable. A great wickedness indeed it was, the thought of which might make them despair; yet it did not behove them to despair, for whom the Lord, as He hung on the cross, deigned to pray. For He had said, "Father, forgive them; for they know not what they do. He saw some who were His own among many who were aliens; for these He sought pardon, from whom at the time He was still receiving injury. He regarded not that He was being put to death by them, but only that He was dying for them. It was a great thing that was forgiven them, it was a great thing that was done by them and for them, so that no man should despair of the forgiveness of his sin when they who slew Christ obtained pardon. Christ died for us, but surely He was not put to death by us? But those men indeed saw Christ dying by their own villany; and yet they believed on Christ pardoning their villanies. Until they drank the blood they had shed, they despaired of their own salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"
