[[commentary]]
quote='''
“For the King’s honour loveth judgment.”…

“Thou hast prepared equity; Thou hast wrought judgment and righteousness in Jacob.” For we too ought to have judgment, we ought to have righteousness; but He worketh in us judgment and righteousness, who created us in whom He might work them. How ought we too to have judgment and righteousness? Thou hast judgment, when thou dost distinguish evil from good: and righteousness when thou followest the good, and turnest aside from the evil. By distinguishing them, thou hast judgment; by doing, thou hast righteousness. “Eschew evil,” he saith, “and do good; seek peace, and ensue it.” Thou shouldest first have judgment, then righteousness. What judgment? That thou mayest first judge what is evil, and what is good. And what righteousness? That thou mayest shun evil, and do good. But this thou wilt not gain from thyself; see what he hath said, “Thou hast wrought judgment and righteousness in Jacob.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
