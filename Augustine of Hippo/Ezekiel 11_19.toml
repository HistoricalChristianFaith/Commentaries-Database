[[commentary]]
quote='''
For by the heart of flesh and the fleshy tables is not meant a carnal understanding: but as flesh feels, whereas a stone cannot, the insensibility of stone signifies an unintelligent heart, and the sensibility of flesh signifies an intelligent heart.
'''
source_url=''
source_title="AGAINST FAUSTUS, A MANICHAEAN 15:4"


[[commentary]]
quote='''
Those and other divine testimonies, which it would take too long to enumerate, show that God by his grace takes away the stony heart from unbelievers and forestalls merit in people of good will in such a way that their will is prepared by prevenient grace, but not that grace is given through prevenient merit of the will. This is shown both by thanksgiving and by prayer: prayer for unbelievers; thanksgiving for believers. Prayer is to be made to him that he may do what we ask; thanksgiving is to be offered when he has done it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 217"


[[commentary]]
quote='''
Flesh is not mentioned in this passage in order to signify carnal desire but rather in the way in which the prophet says that a heart of stone is taken away from the people and a heart of flesh is given them.
'''
source_url=''
source_title="ON GENESIS AGAINST THE MANICHAEANS 2:12.17"


[[commentary]]
quote='''
This grace, which from divine generosity is bestowed secretly in human hearts, is rejected by no one, no matter how hard-hearted he may be. For it is given so that hardness of the heart may first be taken away. Therefore, when the Father is heard within and teaches, so that one may come to the Son, he takes away the heart of stone and bestows a heart of flesh, as he promised by the word of the prophet. For it is thus that he makes them children of the promise and vessels of mercy that he has prepared for glory.
'''
source_url=''
source_title="PREDESTINATION OF THE SAINTS 8:13"

[[commentary]]
quote='''
Now if faith is simply of free will, and is not given by God, why do we pray for those who will not believe, that they may believe? This it would be absolutely useless to do, unless we believe, with perfect propriety, that Almighty God is able to turn to belief wills that are perverse and opposed to faith. Man's free will is addressed when it is said, "Today, if ye will hear His voice, harden not your hearts." But if God were not able to remove from the human heart even its obstinacy and hardness, He would not say, through the prophet, "I will take from them their heart of stone, and will give them a heart of flesh." That all this was foretold in reference to the New Testament is shown clearly enough by the apostle when he says, "Ye are our epistle, . . . written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshly tables of the heart." We must not, of course, suppose that such a phrase as this is used as if those might live in a fleshly way who ought to live spiritually; but inasmuch as a stone has no feeling, with which man's hard heart is compared, what was there left Him to compare man's intelligent heart with but the flesh, which possesses feeling? For this is what is said by the prophet Ezekiel: "I will give them another heart, and I will put a new spirit within you; and I will take the stony heart out of their flesh, and will give them a heart of flesh; that they may walk in my statutes, and keep mine ordinances, and do them: and they shall be my people, and I will be their God, saith the Lord." Now can we possibly, without extreme absurdity, maintain that there previously existed in any man the good merit of a good will, to entitle him to the removal of his stony heart, when all the while this very heart of stone signifies nothing else than a will of the hardest kind and such as is absolutely inflexible against God? For where a good will precedes, there is, of course, no longer a heart of stone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 29"
