[[commentary]]
quote='''
“The heathen are fixed in the corruption, which they made” (ver. 15). Consider ye how punishment is reserved for the sinner, out of his own works; and how they that have wished to persecute the Church, have been fixed in that corruption, which they thought to inflict. For they were desiring to kill the body, whilst they themselves were dying in soul. “In that snare which they hid, has their foot been taken.” The hidden snare is crafty devising. The foot of the soul is well understood to be its love: which, when depraved, is called coveting or lust; but when upright, love or charity.…And the Apostle says, “That being rooted and grounded in love, ye may be able to take in.” The foot then of sinners, that is, their love, is taken in the snare, which they hide: for when delight shall have followed on to deceitful dealing, when God shall have delivered them over to the lust of their heart; that delight at once binds them, that they dare not tear away their love thence and apply it to profitable objects; for when they shall make the attempt, they will be pained in heart, as if desiring to free their foot from a fetter: and giving way under this pain they refuse to withdraw from pernicious delights. “In the snare” then “which they have hid,” that is, in deceitful counsel, “their foot hath been taken,” that is, their love, which through deceit attains to that vain joy whereby pain is purchased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25209.html'
source_title="Exposition on Psalm 9"
