[[commentary]]
quote='''
“Arise, O Lord, prevent them, and cast them down” (ver. 13). Arise, O Lord, Thou whom they suppose to be asleep, and regardless of men’s iniquities; be they blinded before by their own malice, that vengeance may prevent their deed; and so cast them down.

“Deliver My soul from the ungodly.” Deliver My soul, by restoring Me after the death, which the ungodly have inflicted on Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
