[[commentary]]
quote='''
“As for iniquity, I hate and abhor it; but Thy law have I loved” (ver. 163). That awe, therefore, of His word did not create hatred of those words, but maintained his love unimpaired. For the words of God are no other than the law of God. Far be it therefore that love perish through fear, where fear is chaste. Thus fathers are at once feared and loved by affectionate sons; thus doth the chaste wife at once fear her husband, lest she be forsaken by him, and loveth him, that she may enjoy his love. If then the human father and the human husband desire at once to be feared and loved; much more doth our Father who is in heaven, and that Bridegroom, “beautiful beyond the sons of men,” not in the flesh, but in goodness. For by whom is the law of God loved, save by those by whom God is loved? And what that is severe hath the father’s law to good sons? Let the Father’s judgments therefore be praised even in the scourge, if His promises be loved in the reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
