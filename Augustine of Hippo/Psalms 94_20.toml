[[commentary]]
quote='''
But, instead, I was in a ferment of wickedness. I deserted you and allowed myself to be carried away by the sweep of the tide. I broke all your lawful bounds and did not escape your lash. For what person can escape it? You were always present, angry and merciful at once, strewing the pangs of bitterness over all my lawless pleasures to lead me on to look for others unallied with pain. You meant me to find them nowhere but in yourself, O Lord, for you teach us by inflicting pain, you smite so that you may heal, and you kill us so that we may not die away from you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FConfessions%2FBook%25202.html'
source_title="Confessions 2.2"

[[commentary]]
quote='''
And that which is written, “Thou formest my grief in teaching me,” could only be said unto God by one who was “leaping beyond” his fellows; “Thou formest my grief in teaching me;” Thou makest, that is to say, a lesson for me out of my sorrow. It is Thou that formest that very grief itself; Thou dost not leave it unformed, but formest it; and that grief, that has been inflicted by Thee, when formed, will be a lesson unto me, that I may be set free by Thee. For the word finges is used in the sense of “forming,” as it were moulding, my grief; not in the sense of “feigning” it; in the same way that fingit is applied to the artist, in the same sense that figulus is derived from fingere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"

[[commentary]]
quote='''
“Wilt Thou have anything to do with the stool of iniquity, who makest sorrow in learning?” (ver. 20). He hath said this, No wicked man sitteth with Thee, nor shalt Thou have anything to do with the stool of iniquity. And he giveth an account whereof he understandeth this, “For Thou makest sorrow in learning.” For from this, because Thou hast not spared us, do I understand that Thou hast nothing to do with the stool of iniquity. Thou hast this in the Epistle of the Apostle Peter, and for this reason he hath adduced a testimony from the Scripture: “for the time is come,” he saith, “that judgment must begin at the house of God;” that is, the time is come for the judgment of those who belong to the house of God. If sons are scourged, what must the most wicked slaves expect? For which reason he added: “And if it first begin at us, what shall the end be of them that obey not the Gospel of God?” To which he added this testimony: “For if the righteous scarcely be saved, where shall the ungodly and sinner appear?” How then shall the wicked be with Thee, if Thou dost not even spare Thy faithful, in order that Thou mayest exercise and teach them? But as He spareth them not, for this reason, that He may teach them: he saith, “For Thou makest sorrow in learning.” “Makest,” that is, formest: from whence comes the word figulus (from fingo), and a potter’s vessel is called fictile: not in the meaning of fiction, as a falsehood, but of forming so as to give anything being and some sort of form; as before he said, “He that fabricated (finxit) the eye, shall He not see?” Is that, “fabricated the eye” a falsehood? Nay, it is understood He fashioned the eye, made the eye. And is He not a potter when He makes men frail, weak, earthly? Hear the Apostle: “We have this treasure in earthen vessels.”…Behold our Lord Himself, how He showeth Himself a potter. Because He had made man of clay, He anointed him with clay, for whom He had not made eyes in the womb. And so when he saith, “Hast Thou anything to do,” etc., he saith, out of grief makest learning for us, so that grief itself becomes our instruction. How is sorrow our learning? When He scourgeth thee who died for thee, and who doth not promise bliss in this life, and who cannot deceive, and when He giveth not here what thou seekest. What will He give? when will He give? how much will He give, who giveth not here, who here teacheth, who maketh sorrow in learning? Thy labour is here, and rest is promised thee. Thou takest thought that thou hast toil here: but take thought what sort of rest He promiseth. Canst thou conceive it? If thou couldest, thou wouldest see that thy toil here is nothing toward an equivalent.…

Attend, brethren; it is for sale. What I have is for sale, saith God unto thee, buy it. What hath He for sale? I have rest for sale; buy it by thy toil. Attend, that we may be in Christ’s name brave Christians: the remainder of the Psalm is but a little, let us not be weary. For how can he be strong in doing, who faileth in hearing? The Lord will help us to expound unto you the remainder. Attend then: God hath, as it were, proclaimed the kingdom of heaven for sale. Thou sayest unto Him, What is its value? The price is toil: if He were to say, its price is gold, it would not suffice to say this only, but thou wouldest seek to know how much gold; for there is a mass of gold, and half an ounce, and a pound, and the like. He said “price,” that thou mightest not be at pains to inquire, how long thou shouldest find it. The price of the commodity is toil: how much toil is it? Now seek how much thou shouldest toil for it. Thou art not as yet told how great that toil is doomed to be, or how much toil is required of thee: God saith this unto thee, I show thee how great that rest will be; do thou judge with what measure of toil it should be bought.

…He promised rest: suffer trouble. He threateneth eternal fire; despise temporal pains: and while Christ doth watch, let thy heart be calmed, that thou also mayest reach the harbour. For He would not fail to prepare a harbour, who provided a vessel. “Hast Thou anything to do with the stool of iniquity, Thou who makest sorrow in learning?” He trieth us with the wicked, and by their persecution He teacheth us. By means of the malice of the wicked the good is scourged, through the slave the son is chastened: thus is learning taught by sorrow. What God alloweth them power to do, that do wicked men, whom He spareth for a season, do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252094.html'
source_title="Exposition on Psalm 94"
