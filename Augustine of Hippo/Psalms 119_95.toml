[[commentary]]
quote='''
“The ungodly,” he saith, “have awaited me that they might destroy me; but I have understood Thy testimonies” (ver. 95). What meaneth, “that they might destroy me”? Did he then fear that he should perish altogether at the death of his body? God forbid! and what meaneth, “have awaited me,” save that he should consent with them unto iniquity? For then they would destroy him. And he hath said why he hath not perished: “I understood Thy testimonies.” The Greek word, Μαρτύρια, soundeth more familiarly to the ears of the Church. For though they should slay me not consenting unto them, yet while I confessed Thy testimonies (martyria) I should not perish; but they who, that they might destroy me, were waiting till I should consent unto them, tortured me even when I did confess them. Yet he did not leave that which he had understood, looking on it and seeing an end without end, if only he should persevere unto the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
