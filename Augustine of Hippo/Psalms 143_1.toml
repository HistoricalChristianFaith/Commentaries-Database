[[commentary]]
quote='''
…The title of the Psalm is, “To David himself, when his son was pursuing him.” We know from the Books of Kings that this happened:…but we must recognise here another David, truly “strong in hand,” which is the explanation of David, even our Lord Jesus Christ. For all those events of past time were figures of things to come. Let us seek then in this Psalm our Lord and Saviour Jesus Christ, announcing Himself beforehand in His prophecy, and foretelling what should happen at this time by things which were done long ago. For He Himself foretold Himself in the Prophets: for He is the Word of God. Nor did they say ought of this kind, save when filled with the Word of God. They announced then Christ, being filled with Christ, they went before Him about to come, and He deserted not them going before.…

Let then our Lord speak; let Christ with us, whole Christ, speak. “Lord, hear my prayer, receive with Thine ears my entreaty” (ver. 1). “Hear” and “receive with ears” are the same thing. It is repetition, it is confirmation. “In Thy truth hear me, in Thy righteousness.” Take it not without emphasis when it is said, “in Thy righteousness.” For it is a commendation of grace, that none of us think his righteousness his own. For this is the righteousness of God, which God hath given thee to possess. For what saith the Apostle of them, who would boast of their own righteousness? Speaking of the Jews, he saith, “they have a zeal of God, but not according to knowledge.”…Thou art perverse, because thou imputest what thou hast done ill to God, what well to thyself: thou wilt be right, when thou imputest what thou hast done ill to thyself, what well to God.…Behold, “in Thy righteousness hear me.” For when I look upon myself, nought else do I find mine own, save sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"
