[[commentary]]
quote='''
“Make Thy mercies marvellous” (ver. 7). Let not Thy mercies be disesteemed, lest they be loved too little.

“Who savest them that hope in Thee from such as resist Thy right hand:” from such as resist the favour, whereby Thou favourest Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
