[[commentary]]
quote='''
We heard the apostle telling us, "We are ambassadors for Christ, exhorting you to be reconciled with God." He would not be exhorting us to be reconciled unless we had been enemies. So the whole world was the Savior's enemy, the captor's friend; that is, God's enemy, the devil's friend. And the whole human race, like this woman, was bent over and bowed down to the ground. There is someone who already understands these enemies, and he cries out against them and says to God, "They have bowed my soul down." The devil and his angels have bowed the souls of men and women down to the ground; that is, have bent them forward to be intent on temporal and earthly things and stop them from seeking the things that are above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520162B.html'
source_title="SERMON 162B"

[[commentary]]
quote='''
…Let your Love see the Lord speaking to us, and exhorting us by His example: “A trap they have prepared for My feet, and have bowed down My Soul” (ver. 7). They wished to bring It down as if from Heaven, and to the lower places to weigh It down: “They have bowed My Soul: they have digged before My face a pit and themselves have fallen into it.” Me have they hurt, or themselves? Behold He hath been exalted above the Heavens, God, and behold above all the earth the Glory of the Same: the kingdom of Christ we see, where is the kingdom of the Jews? Since therefore they did that which to have done they ought not, there hath been done in their case that which to have suffered they ought: themselves have dug a ditch, and themselves have fallen into it. For their persecuting Christ, to Christ did no hurt, but to themselves did hurt. And do not suppose, brethren, that themselves alone hath this befallen. Every one that prepareth a pit for his brother, it must needs be that himself fall into it.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252057.html'
source_title="Exposition on Psalm 57"
