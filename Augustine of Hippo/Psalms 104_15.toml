[[commentary]]
quote='''
“And wine maketh glad the heart of man” (ver. 15). Let no man prepare himself for intoxication; nay, let every man prepare him for intoxication. “How excellent is Thy cup which maketh inebriate!” We choose not to say, Let no man be drunk. Be inebriated; yet beware, from what source. If the excellent cup of the Lord doth saturate you, your ebriety shall be seen in your works, it shall be seen in the holy love of righteousness, it shall, lastly, be seen in the estrangement of your mind, but from things earthly to heavenly. “To make him a cheerful countenance with oil.”…What is the making the countenance cheerful with oil? The grace of God; a sort of shining for manifestation; as the Apostle saith, “The Spirit is given to every man for manifestation.” A certain grace which men can clearly see in men, to conciliate holy love, is termed oil, for its divine splendour; and since it appeared most excellent in Christ, the whole world loveth Him; who though while here He was scorned, is now worshipped by every nation: “For the kingdom is the Lord’s, and He shall be Governor among the people.” For such is His grace, that many, who do not believe on Him, praise Him, and declare that they are unwilling to believe on Him, because no man can fulfil what He doth command. They who with reproaches once raged against Him, are hindered by His very praises. Yet by all is He loved, by all is He preached; because He is excellently anointed, therefore He is Christ: for He is called Christ from the Chrism or anointing which He had. Messiah in the Hebrew, Christ in the Greek, Unctus in the Latin: but He anointeth over His whole Body. All therefore who come, receive grace, that their countenances may be made glad with oil.

“And bread strengtheneth man’s heart.” What is this, brethren? As it were, he hath forced us to understand what bread he was speaking of. For while that visible bread strengtheneth the stomach, feedeth the body, there is another bread which strengtheneth the heart, in that it is the bread of the heart.…There is therefore a wine that truly maketh glad the heart, and knoweth not to do aught else than to gladden the heart. But that thou mayest not imagine that this indeed should be taken of the spiritual wine, but not of that spiritual bread; He hath shown this very point, that it is also spiritual: “and bread,” he saith, “strengtheneth man’s heart.” So understand it therefore of the bread as thou dost understand it of the wine; hunger inwardly, thirst inwardly: “Blessed are they,” saith our Lord, “who hunger and thirst after righteousness; for they shall be filled.” That bread is righteousness, that wine is righteousness: it is truth, Christ is truth. “I am,” He said, “the living bread, who came down from heaven;” and, “I am the Vine, and ye are the branches.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
