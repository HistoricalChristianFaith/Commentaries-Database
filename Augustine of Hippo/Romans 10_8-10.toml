[[commentary]]
quote='''
When he says: The word is near, in your mouth and in your heart; this is the word of faith which we preach: that if you confess with your mouth that Jesus is Lord, and believe in your heart that God raised him from the dead, you shall be saved. For with the heart one believes unto righteousness, but with the mouth confession is made unto salvation—this whole passage refers to what he said above: For the Lord will make a word consummating and abridging upon the earth. For, the innumerable and manifold sacraments by which the Jewish people were burdened being removed, it came about, through the mercy of God, that by the brevity of the confession of faith we might attain to salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
