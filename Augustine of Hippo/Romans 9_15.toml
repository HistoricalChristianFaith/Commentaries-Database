[[commentary]]
quote='''
When he says: I will have mercy on whom I will have mercy, and I will show mercy to whom I will be merciful, it is shown from this that there is no injustice with God—which some can allege when they hear: Before they were born, Jacob I loved, but Esau I hated. For I will have mercy, he says, on whom I will have mercy. For God first had mercy on us, when we were sinners, so as to call us. Therefore on whom I will have mercy, he says, so as to call him, I will have mercy on him still further, when he has believed. But how still further, except that he gives the Holy Spirit to the one who believes and asks? And when this is given, he will show mercy to him to whom he will be merciful, that is, so as to make him merciful, whereby he may be able to do good through love. Let no one, therefore, dare to attribute to himself that he acts mercifully, because God has given him love through the Holy Spirit, without which no one can be merciful. God, therefore, did not choose those who work well, but rather those who believe, so that he himself may make them work well. For it is ours to believe and to will, but his to give to those who believe and will the ability to work well through the Holy Spirit, through whom the love of God is poured out in our hearts, that he may make us merciful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
