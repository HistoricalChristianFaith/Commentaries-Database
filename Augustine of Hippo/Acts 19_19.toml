[[commentary]]
quote='''
Ye know in the Acts of the Apostles how it is written, that many lost men, that is, men of such arts, and followers of naughty doctrines, brought unto the Apostles all their books; and there were burned so many volumes, that it was the writer’s task to make a valuation of them, and write down the sum of the price. This truly was for the glory of God, in order that even such lost men might not be despaired of by Him that knew how to seek that which had been lost. Therefore this man had been lost, is now sought, found, led hither, he bringeth with him books to be burned, by which he had been to be burned, so that when these have been thrown into the fire, he may himself pass over into a place of refreshment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
