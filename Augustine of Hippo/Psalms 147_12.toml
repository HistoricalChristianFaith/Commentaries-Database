[[commentary]]
quote='''
We have found a great protector, brothers. You know that people rely on their protectors. To someone threatening, a client of a greater man responds: "With the life of my lord safe, you do nothing to me." How much more strongly and surely can we say: "With our head safe, you do nothing to us?" For our protector is our head. Whoever relies on any human protector is a client of that person; we are members of our protector. May he hold us to him, and no one will tear us away from him. For whatever hardships we have suffered in this world, all that passes is nothing. Good things will come which will not pass away; we reach them through hardships. But once we have reached them, no one can tear us away from there. The gates of Jerusalem are closed, they even have bars, so that it may be said to that city: "Praise the Lord, Jerusalem; praise your God, Zion. For he has strengthened the bars of your gates, he has blessed your children within you. He has set your borders with peace." With the gates closed, bars in place, no friend leaves, no enemy enters. There we have true and certain security, if we have not abandoned the truth here.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520130.html'
source_title="Sermon 130"

[[commentary]]
quote='''
“Praise in unison, O Jerusalem, thy God” (ver. 12). Abiding yet in captivity, they behold those flocks, or rather, the one flock of all its citizens, gathered from all sides into that city; they see the joy of the mass, now after threshings and winnowings placed in the garner, fearing nothing, suffering no toil nor trouble; and, as yet abiding here, in the midst of the threshing they send forward their joy of hope, and pant for it, joining as it were their hearts to the Angels of God, and to that people which shall abide with them in joy for ever. For what wilt thou then do, O Jerusalem? Surely toil and groaning will pass away. What wilt thou do? wilt thou plough, or sow, or plant vines, or make voyages, or trade? What wilt thou do? Will it still be thy duty to be engaged in the works thou now doest, good though they are, and spring from mercy? Consider thy numbers, consider on all sides thy company: see whether any hungers, for thee to give bread to; see whether any thirsts, for thee to give a cup of cold water to; see whether any is a stranger, for thee to take in; see whether any is sick, for thee to visit; see whether any is at strife, for thee to reconcile him; see whether any is dying, for thee to bury him. What then wilt thou do? “Praise in unison, O Jerusalem, thy God.” Behold, this is thy business. As is wont to be said in inscriptions, “Use it and be happy.”

Be ye Jerusalem; remember of whom it is said, “Lord, in Thy city their image Thou shalt bring to nought.” These are they who now rejoice in such pomps; among them are they who have not come hither to-day because there is a show. To whom is it a gift? to whom is it a loss? or why is it a gift? why is it a loss? For not they only who exhibit such shows are smitten with loss, but with much greater loss are they smitten who delight in gazing on them. The former have their chest drained of its gold, the latter have their breast robbed of the riches of righteousness. Most of the exhibiters of shows have to mourn for selling their estates; how ought the sinners to mourn, for losing their souls: Was it then for this that the Lord cried out on the Lord’s Day, “Watch ye,” that to-day men should watch in this way. I beseech you, ye citizens of Jerusalem, I beseech you by the peace of Jerusalem, by the Redeemer, the Builder, the Ruler of Jerusalem, that ye address your prayers to God for them. May they see, may they feel, that they are trifling; and, intent as they are on the sights which please them, may at length look on themselves, and be displeased. For in many we rejoice that this has already been done: and once we too sat there and were mad: and how many think we now sit there, who shall yet be, not only Christians, but also Bishops! From what is past, we conjecture what is to be: from what has already been done, we announce beforehand what God will do. Let your prayers be wakeful, ye groan not for nothing. Certainly they who have already escaped, praying for those who are still in danger, because they too having been among those in danger, are heard; and God shall drag His people out of the captivity of Babylon; by all means He shall redeem and deliver them, and the number of the saints who bear the image of God shall be perfected.…“Praise in unison,” because thou consistest of many: “praise,” because thou hast been made one. “We being many,” saith the Apostle, “are one in Christ.” As then we are many, “we praise in unison;” as we are one, we “praise.” The same are many and one, because He in whom they are one is ever One.

Wherefore, saith this Jerusalem, do I praise in unison the Lord, and, as Sion, praise my God? Jerusalem is the same as Sion. For different reasons has it the two names. Jerusalem meaneth “visions of peace;” Sion meaneth “watching.” See whether these words do not sound like sights; that the Gentiles may not think that they have sights and we have none. Sometimes after the theatre or amphitheatre breaks up, when the crowd of lost ones begins to be vomited forth from that den, sometimes, retaining in their minds images of their vain amusements, and feeding their memory with things not only useless but even hurtful, rejoicing in them as if they were sweet, while they are really deadly; they see often, it may be, the servants of God pass by, they recognise them by their garb or headdress, or they know them by sight, and they say to one another, or inwardly, “Wretched people, how much they lose!” Brethren, let us return their good will (for they do mean it well) with prayers to the Lord. They wish us well; but “he that loveth iniquity, hateth his own soul.” If he hateth his own soul, how shall he love my soul? Yet with a perverse, and empty, and vain good will, if indeed it may be called good will, they grieve that we lose what they love: let us pray that they lose not what we love. Behold of what character that Jerusalem is to be which he exhorteth to praise, or rather foreseeth will praise. For the praises of that city, when we shall see and love and praise, will not need to be urged on and stirred up by the voice of prophecy; but the Prophets now say this, to drink in as far as while they remain in this flesh they can, the future joys of the blessed, and then giving them forth into our ears, to arouse in us love of that city. Let us burn with longing, let us not be slothful in spirit. “Praise thy God, O Sion.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
