[[commentary]]
quote='''
Mark also presents an almost entire identity with the above, both in language and in subject. The words, however, in which Pilate replied to the people when they asked him to release one prisoner according to the custom of the feast, are reported by this evangelist as follows: "But Pilate answered them, saying, Will ye that I release unto you the King of the Jews?" On the other hand, Matthew gives them thus: "Therefore when they were gathered together, Pilate said unto them, Whom will ye that I release unto you? Barabbas, or Jesus which is called Christ?" There need be no difficulty in the circumstance that Matthew says nothing about the people having requested that one should be released unto them. But it may fairly be asked, what were the words which Pilate actually uttered, whether these reported by Matthew, or those recited by Mark. For there seems to be some difference between these two forms of expression, namely, "Whom will ye that I release unto you? Barabbas, or Jesus which is called Christ?" and, "Will ye that I release unto you the King of the Jews?" Nevertheless, as they were in the habit of calling their kings "anointed ones," and one might use the one term or the other, it is evident that what Pilate asked them was whether they would have the King of the Jews, that is, the Christ, released unto them. And it matters nothing to the real identity in meaning that Mark, desiring simply to relate what concerned the Lord Himself, has not mentioned Barabbas here. For, in the report which he gives of their reply, he indicates with sufficient clearness who the person was whom they asked to have released unto them. His version is this: "But the chief priests moved the people, that he should rather release Barabbas unto them." Then he proceeds to add the sentence, "And Pilate answered and said again unto them, What will ye then that I should do unto him whom ye call the King of the Jews?" This makes it plain enough now, that in speaking of the King of the Jews, Mark meant to express the very sense which Matthew intended to convey by using the term "Christ." For kings were not called "anointed ones" except among the Jews; and the form which Matthew gives to the words in question is this, "Pilate saith unto them, What shall I do then with Jesus which is called Christ?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
