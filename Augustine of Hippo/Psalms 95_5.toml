[[commentary]]
quote='''
“For the sea is His and He made it” (ver. 5). For the sea is this world, but God made also the sea: nor can the waves rage save only so far as to the shore, where He hath marked their bounds. There is therefore no temptation, that hath not received its measure.…“And His hands prepared the dry land.” Be thou the dry land: thirst for the grace of God: that as a sweet shower it may come upon thee, may find in thee fruit. He alloweth not the waves to cover what He hath sown. “And His hands prepared the dry land.” Hence also therefore let us shout unto the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252095.html'
source_title="Exposition on Psalm 95"
