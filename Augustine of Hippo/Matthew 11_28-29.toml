[[commentary]]
quote='''
And for this reason labour is there, because iniquity is there: because injustice is there, therefore also labour is there. But let them hear him stretching forth hands. “Come unto Me, all ye that labour.” Ye cry, ye contradict, ye revile: He on the contrary, “Come unto Me, all ye that labour,” in your pride, and ye shall rest in My humility. “Learn of Me,” He saith, “for meek I am and humble in heart, and ye shall find rest unto your souls.” For whence do they labour, but because they are not meek and humble in heart? God humble was made, let man blush to be proud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
