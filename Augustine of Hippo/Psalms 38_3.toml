[[commentary]]
quote='''
“Neither is there any rest in my bones, from the face of my sin.” It is commonly enquired, of what person this is the speech; and some understand it to be Christ’s, on account of some things which are here said of the Passion of Christ; to which we shall shortly come; and which we ourselves shall acknowledge to be spoken of His Passion. But how could He who had no sin, say, “There is no rest in my bones, from the face of my sin.”…For if we were to say that they are not the words of Christ, those words, “My God, My God, why hast Thou forsaken Me?” will also not be the words of Christ. For there too you have, “My God, My God, why hast Thou forsaken Me?” “The words of mine offences are far from my health.” Just as here you have, “from the face of my sins,” so there also you have, “the words of my offences.” And if Christ is, for all that, without “sin,” and without “offences,” we begin to think those words in the Psalm also not to be His. And it is exceedingly harsh and inconsistent that that Psalm should not relate to Christ, where we have His Passion as clearly laid open as if it were being read to us out of the Gospel. For there we have, “They parted My garments among them, and cast lots upon My vesture.” Why should I mention that the first verse of that Psalm was pronounced by the Lord Himself while hanging on the Cross, with His own mouth, saying, “My God, My God, why hast Thou forsaken Me?” What did He mean to be inferred from it, but that the whole of that Psalm relates to Him, seeing He Himself, the Head of His Body, pronounced it in His own Person? Now when it goes on to say, “the words of mine offences,” it is beyond a doubt that they are the words of Christ. Whence then come “the sins,” but from the Body, which is the Church? Because both the Head and the Body of Christ are speaking. Why do they speak as if one person only? Because “they twain,” as He hath said, “shall be one flesh.” “This” (says the Apostle) “is a great mystery; but I speak concerning Christ and the Church.”…For why should He not say, “my sins,” who said, “I was an hungred, and ye gave Me no meat; I was thirsty, and ye gave Me no drink; I was a stranger, and ye took Me not in. I was sick and in prison, and ye visited Me not.” Assuredly the Lord was not in prison. Why should He not say this, to whom when it was said, “When saw we Thee a hungred, and athirst, or in prison; and did not minister unto Thee?” He replied, that He spake thus in the person of His Body. “Inasmuch as ye did it not unto one of the least of Mine, ye did it not unto Me.” Why should He not say, “from the face of my sins,” who said to Saul, “Saul, Saul, why persecutest thou Me,” who, however, being in Heaven, now suffered from no persecutors? But just as, in that passage, the Head spake for the Body, so here too the Head speaks the words of the Body; whilst you hear at the same time the accents of the Head Itself also. Yet do not either, when you hear the voice of the Body, separate the Head from it; nor the Body, when you hear the voice of the Head: because “they are no more twain, but one flesh.”

“There is no soundness in my flesh from the face of thine anger.” But perhaps God is unjustly angry with thee, O Adam; unjustly angry with thee, O son of man; because now brought to acknowledge that thy punishment, now that thou art a man that hath been placed in Christ’s Body, thou hast said, “There is no soundness in my flesh from the face of Thine anger.” Declare the justice of God’s anger: lest thou shouldest seem to be excusing thyself, and accusing Him. Go on to tell whence the “anger” of the Lord proceeds. “There is no soundness in my flesh from the face of Thine anger; neither is there any rest in my bones.” He repeats what he said before, “There is no soundness in my flesh;” for, “There is no rest in my bones,” is equivalent to this. He does not however repeat “from the face of Thine anger;” but states the cause of the anger of God. “There is no rest in my bones from the face of my sins.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
