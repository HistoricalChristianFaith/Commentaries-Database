[[commentary]]
quote='''
Rightly is [love] said to be "strong as death," either because no one overcomes it as no one overcomes death, or because in this life the measure of charity is unto death, as the Lord said: "Greater love than this no man has, that a man lay down his life for his friends." Or, rather, because as death tears the soul away from the senses of the flesh, so charity tears it away from carnal passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 167:11"

[[commentary]]
quote='''
No one dieth there, where no one arriveth save he that dieth to this world, not that universal kind of death whereby the body is bereft of the soul; but the death of the elect, through which, even while still remaining in this mortal flesh, the heart is set on the things which are above. Of such a death it is that the apostle said, "For ye are dead, and your life is hid with Christ in God." And perhaps to this, also, do the words refer,"Love is strong as death." For by this love it is brought about, that, While still held in the present corruptible body, we die to this world, and our life is hid with Christ in God; yea, that love itself is our death to the world, and our life with God. For if that is death when the soul quits the body, how can it be other than death when our love quits the world? Such love, therefore, is strong as death. And what is stronger than that which bindeth the world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252065.html'
source_title="Tractates on John 65"

[[commentary]]
quote='''
What is the might of this city? Whoso would understand the might of this city, let him understand the force of love. That is a virtue which none conquereth. Love’s flame no waves of the world, no streams of temptation, extinguish. Of this it is said, “Love is strong as death.” For as when death cometh, it cannot be resisted; by whatever arts, whatever medicines, you meet it; the violence of death can none avoid who is born mortal; so against the violence of love can the world do nothing. For from the contrary the similitude is made of death; for as death is most violent to take away, so love is most violent to save. Through love many have died to the world, to live to God; by this love inflamed, the martyrs, not pretenders, not puffed up by vain-glory, not such as they of whom it is written, “Though I give my body to be burned, and have not charity, it profiteth me nothing,” but men whom truly a love of Christ and of the truth led on to this passion; what to them were the temptations of the tormentors? Greater violence had the eyes of their weeping friends, than the persecutions of enemies. For how many were held by their children, that they might not suffer? to how many did their wives fall upon their knees, that they might not be left widows? How many have their parents forbidden to die; as we know and read in the Passion of the Blessed Perpetua! All this was done; but tears, however great, and with whatever force flowing, when did they extinguish the ardour of love?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"

[[commentary]]
quote='''
“Peace be in thy strength” (ver. 7). O Jerusalem, O city, who art being built as a city, whose partaking is in “The Same:” “Peace be in thy strength:” peace be in thy love; for thy strength is thy love. Hear the Song of songs: “Love is strong as death.” A great saying that, brethren, “Love is strong as death.” The strength of charity could not be expressed in grander terms than these, “Love is strong as death.” For who resisteth death, my brethren? Consider, my brethren. Fire, waves, the sword, are resisted: we resist principalities, we resist kings; death cometh alone, who resisteth it? There is nought more powerful than it. Charity therefore is compared with its strength, in the words, “Love is strong as death.” And since this love slayeth what we have been, that we may be what we were not; love createth a sort of death in us. This death he had died who said, “The world is crucified unto me, and I unto the world:” this death they had died unto whom he said, “Ye are dead, and your life is hid with Christ in God.” Love is strong as death…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520122.html'
source_title="Exposition on Psalm 122"
