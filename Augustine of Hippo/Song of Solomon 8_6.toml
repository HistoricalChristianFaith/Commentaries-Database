[[commentary]]
quote='''
When death comes, it cannot be resisted. By whatever arts, whatever medicines, you meet it; the violence of death can none avoid who is born mortal; so against the violence of love can the world do nothing. For from the contrary the similitude is made of death; for as death is most violent to take away, so love is most violent to save. Through love many have died to the world, to live to God.
'''
source_url=''
source_title="EXPLANATIONS OF THE PSALMS 48:12"


[[commentary]]
quote='''
Rightly is [love] said to be "strong as death," either because no one overcomes it as no one overcomes death, or because in this life the measure of charity is unto death, as the Lord said: "Greater love than this no man has, that a man lay down his life for his friends." Or, rather, because as death tears the soul away from the senses of the flesh, so charity tears it away from carnal passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 167:11"

[[commentary]]
quote='''
No one dieth there, where no one arriveth save he that dieth to this world, not that universal kind of death whereby the body is bereft of the soul; but the death of the elect, through which, even while still remaining in this mortal flesh, the heart is set on the things which are above. Of such a death it is that the apostle said, "For ye are dead, and your life is hid with Christ in God." And perhaps to this, also, do the words refer,"Love is strong as death." For by this love it is brought about, that, While still held in the present corruptible body, we die to this world, and our life is hid with Christ in God; yea, that love itself is our death to the world, and our life with God. For if that is death when the soul quits the body, how can it be other than death when our love quits the world? Such love, therefore, is strong as death. And what is stronger than that which bindeth the world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252065.html'
source_title="Tractates on John 65"
