
[[commentary]]
quote='''
What are these streams of the river? That overflowing of the Holy Spirit, of which the Lord said, “If any man thirst, let him come unto Me, and drink. He that believeth on Me, out of his bosom shall flow rivers of living water.” These rivers then flowed out of the bosom of Paul, Peter, John, the other Apostles, the other faithful Evangelists. Since these rivers flowed from one river, many “streams of the river make glad the City of God.” For that ye might know this to be said of the Holy Spirit, in the same Gospel next said the Evangelist, “But this spake He of the Spirit, which they that were to believe on Him should receive. For the Holy Ghost was not yet given, because that Jesus was not yet glorified.” Jesus being glorified after His Resurrection, glorified after His Ascension, on the day of Pentecost came the Holy Spirit, and filled the believers, who spake with tongues, and began to preach the Gospel to the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
