[[commentary]]
quote='''
“Blessed be the Lord, for He hath heard the voice of My prayer” (ver. 6).

“The Lord My Helper and My Protector” (ver. 7). The Lord helping Me in so great sufferings, and protecting Me with immortality in My resurrection. “In Him hath My Heart trusted, and I have been helped.” “And My Flesh hath flourished again:” that is, and My Flesh hath risen again. “And of my will I will confess unto Him.” Wherefore, the fear of death being now destroyed, not by the necessity of fear under the Law, but with a free will with the Law, shall they who believe on Me, confess unto Him; and because I am in them, I will confess.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252028.html'
source_title="Exposition on Psalm 28"
