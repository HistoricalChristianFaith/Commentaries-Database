[[commentary]]
quote='''
“Behold Thou, Lord, hast known all my last doings, and the ancient ones” (ver. 5). Thou hast known my latest doings, when I fed swine; Thou hast known my ancient doings, when I asked of Thee my portion of goods. Ancient doings were the beginnings to me of latest ills: ancient sin, when we fell; latest punishment, when we came into this toilsome and dangerous mortality. And would that this may be “latest” to us; it will be, if now we will to return. For there is another “latest” for certain wicked ones, to whom it shall be said, “Go ye into everlasting fire.”…“Thou hast fashioned me, and hast laid Thine hand upon me.” “Fashioned me,” where? In this mortality; now, to the toils whereunto we all are born. For none is born, but God has fashioned him in his mother’s womb; nor is there any creature, whereof God is not the Fashioner. But “Thou hast fashioned me” in this toil, “and laid Thine hand upon me,” Thine avenging hand, putting down the proud. For thus healthfully hath He cast down the proud, that He may lift him up humble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
