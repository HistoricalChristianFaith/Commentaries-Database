[[commentary]]
quote='''
He now proceedeth to the divine blessings which were conferred upon them as they wandered in the desert. “He spread out a cloud to be their covering: and fire to give them light in the night season” (ver. 39). This is as clear as it is well known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
