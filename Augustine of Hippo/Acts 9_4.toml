[[commentary]]
quote='''
How can we show that he is there and that he is also here? Let Paul answer for us, who was previously Saul.… First of all, the Lord's own voice from heaven shows this: "Saul, Saul, why are you persecuting me?" Had Paul climbed up to heaven then? Had Paul even thrown a stone at heaven? It was Christians he was persecuting, them he was tying up, them he was dragging off to be put to death, them he was everywhere hunting out of their hiding places and never sparing when he found them. To him the Lord said, "Saul, Saul." Where is he crying out from? Heaven. So he's up above. "Why are you persecuting me?" So he's down below.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520122.html'
source_title="SERMON 122.6"

[[commentary]]
quote='''
If haply any one asks, what person is speaking in this Psalm? I would say briefly, “It is Christ.” But as ye know, brethren, and as we must say frequently, Christ sometimes speaks in His own Person, in the Person of our Head. For He Himself is “the Saviour of the Body.” He is our Head; the Son of God, who was born of the Virgin, suffered for us, “rose again for our justification,” sitteth “at the right hand of God,” to “make intercession for us:” who is also to recompense to the evil and to the good, in the judgment, all the evil and the good that they have done. He deigned to become our Head; to become “the Head of the Body,” by taking of us that flesh in which He should die for us; that flesh which He also raised up again for our sakes, that in that flesh He might place before us an instance of the resurrection; that we might learn to hope for that of which we heretofore despaired, and might henceforth have our feet upon the rock, and might walk in Christ. He then sometimes speaks in the name of our Head; sometimes also He speaks of us who are His members. For both when He said, “I was an hungred, and ye gave Me meat,” He spoke on behalf of His members, not of Himself: and when He said, “Saul, Saul, why persecutest thou Me?” the Head was crying on behalf of its members: and yet He did not say, “Why dost thou persecute My members?” but, “Why persecutest thou Me?” If He suffers in us, then shall we also be crowned in Him. Such is the love of Christ. What is there can be compared to this? This is the thing on account of which “He hath put a hymn in our mouth,” and this He speaks on behalf of His members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"

[[commentary]]
quote='''
But who there is in this world that travaileth and is in pain, the faithful acknowledge, because thereof they are. Christ here travaileth, Christ here is in pain: the Head is above, the members below. For one not travailing nor in pain would not say, “Saul, Saul, why persecutest thou me?” Him, with whom when persecuting He was travailing, being converted, He made to travail. For he also was himself afterwards enlightened, and grafted on those members which he used to persecute; being pregnant with the same love, he said, “My little children, of whom again I travail, until Christ be formed in you.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"

[[commentary]]
quote='''
He therefore does not utterly take His mercies from Him, when He takes not His mercy from His body, His members, in which, even while He was enthroned in Heaven, He was still suffering persecutions on earth; and when He cried from Heaven, “Saul, Saul,” not why persecutest thou My servants, nor why persecutest thou My saints, nor My disciples, but, “why persecutest thou Me?” As then, while no one persecuted Him when sitting in Heaven, He cried out, “Why persecutest thou Me?” when the Head recognised its limbs, and His love allowed not the Head to separate Himself from the union of the body: so, when He taketh not away His mercies from Him, it is surely that He taketh it not from us, who are His limbs and body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
