[[commentary]]
quote='''
Let us see, then, what answer John gives: "They came unto John, and said unto him, Rabbi, he that was with thee beyond Jordan, to whom thou barest witness, behold the same baptizeth, and all men come to him:" that is, What sayest thou? Ought they not to be hindered, that they may rather come to thee? "He answered and said, A man cannot receive anything, except it be given him from heaven." Of whom, think you, had John said this? Of himself. "As a man, I received," saith he, "from heaven." Note, my beloved: "A man cannot receive anything, except it be given him from heaven Ye yourselves bear me witness that I said, I am not the Christ." As much as to say, "Why do ye deceive yourselves? See how you have put this question before me. What have you said to me? `Rabbi, he that was with thee beyond Jordan, to whom thou barest witness.' Then you know what sort of witness I bare to Him. Am I now to say that He is not the same whom I declared Him to be? And because I received somewhat from heaven, in order to be something, do you wish me to be empty of it, so as to speak against the truth? `A man cannot receive anything, except it be given him from heaven. Ye yourselves bear me witness that I said I am not the Christ.'" Thou art not the Christ; but what if thou art greater than He since thou didst baptize Him? "I am sent:" I am the herald, He is the Judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252013.html'
source_title="Tractates on John 13"
