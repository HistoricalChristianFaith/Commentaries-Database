[[commentary]]
quote='''
Whence then doth this man pray, set among evil men, with whose enmities he was being exercised? Why saith he, “I have been made sad in my exercise, and have been troubled”? While he is extending his love so as to love enemies, he hath been affected with disgust, being bayed at all around by the enmities of many men, by the frenzy of many and under a sort of human infirmity he hath sunk. He hath seen himself now begin to be pierced through with an evil suggestion of the devil, to bring on hatred against his enemies: wrestling against hatred in order to perfect love herself, in the very fight, and in the wrestling, he hath been troubled. For there is his voice in another Psalm, “Mine eye hath been troubled, because of anger.” And what followeth there? “I have waxen old among all mine enemies.” As if in storm and waves he were beginning to sink, like Peter. For he doth trample the waves of this world, that loveth enemies. Christ on the sea was walking fearless, from whose heart there could not by any means be taken away the love of an enemy, who hanging on the Cross did say, “Father, forgive them, for they know not what they do.” Peter too would walk. He as Head, Peter as Body: because, “Upon this rock,” He saith, “I will build My Church.” He was bidden to walk, and he was walking by the Grace of Him bidding, not by his own strength. But when he saw the wind mighty, he feared; and then he began to sink, being troubled in his exercise. By what mighty wind? “By the voice of the enemy, and by the tribulation of the sinner” (ver. 3). Therefore, in the same manner as he cried out on the waves, “Lord, I perish, save me,” a similar voice from this man hath preceded, “Hearken unto me.” Wherefore? For what sufferest thou? Of what dost thou groan? “I have been made sad in my exercise.” To be exercised indeed among evil men Thou hast set me, but too much they have risen up, beyond my powers: calm Thou one troubled, stretch forth a hand to one sinking. “For they have brought down upon me iniquity, and in anger they were shadowing me.” Ye have heard of waves and winds: one as it were humbled they were insulting, and he was praying: on every side against him with the roar of insult they were raging, but he within was calling upon Him whom they did not see.…

But this man being troubled and made sad was praying, his eye being disturbed as it were on account of anger. But the anger of a brother if it shall have been inveterate is then hatred. Anger doth trouble the eye, hatred doth quench it: anger is a straw, hatred is a beam. Sometimes thou hatest and chidest an angry man: in thee is hatred, in him whom thou chidest anger: with reason to thee is said, “Cast out first the beam from thine own eye, and so thou shalt see to cast out the straw from thy brother’s eye.” For that ye may know how much difference there is between anger and hatred: day by day men are angry with their sons, show me them that hate their sons! This man being troubled was praying even when made sad, wrestling against all revilings of all revilers; not in order that he might conquer any one of them by giving back reviling, but that he might not hate any one of them. Hence he prayeth, hence asketh: “From the voice of the enemy and from the tribulation of the sinner.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
