[[commentary]]
quote='''
But he explains another difference thus, saying: And the gift is not as it was through the one who sinned. For the judgment indeed was from one unto condemnation, but grace is from many offenses unto justification. When, therefore, it says from one, offense is to be understood, since there follows: but grace from many offenses. This, then, is the difference: that in Adam one offense was condemned, but by the Lord many were forgiven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
