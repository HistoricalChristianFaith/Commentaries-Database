[[commentary]]
quote='''
When Pilate, therefore, had sat down before the tribunal, "he saith unto the Jews, Behold your king! But they cried out, Away with him, away with him, crucify him. Pilate said unto them, Shall I crucify your king?" As yet he tries to overcome the terror with which they had inspired him about Caesar, by seeking to break them from their purpose on the ground of the ignominy it brought on themselves, with the words, "Shall I crucify your king?" when he failed to soften them on the ground of the ignominy done to Christ; but by and by he is overcome by fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520116.html'
source_title="Tractates on John 116"
