[[commentary]]
quote='''
So, then, all those that have founded any sect, even of false religion, while they wished to be believed, could not but admit this resurrection of minds: all have agreed concerning this; but many have denied the resurrection of the flesh, and affirmed that the resurrection had taken place already in faith. Such the apostle resisteth, saying, "Of whom is Hymeneus and Philetus, who concerning the truth have erred, saying that the resurrection hath taken place already, and overthrow the faith of some." They said that the resurrection had taken place already, but in such manner that another was not to be expected; and they blamed people who were looking for a resurrection of the flesh, just as if the resurrection which was promised were already accomplished in the act of believing, namely, in the mind. The apostle censures these. Why does he censure them? Did they not affirm what the Lord spoke just now: "The hour cometh, and now is, when the dead shall hear the voice of the Son of God, and they that hear shall live"? But, saith Jesus to thee, it is of the life of minds that I am hitherto speaking: I am not yet speaking of the life of bodies; but I speak of the life of that which is the life of bodies, that is, of the life of souls, in which the life of bodies exists. For I know that there are bodies lying in the tombs; I know also that your bodies will lie in the tombs. I am not speaking of that resurrection, but I speak of this; in this, rise ye again, lest ye rise to punishment in that.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"
