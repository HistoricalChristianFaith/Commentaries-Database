[[commentary]]
quote='''
Or does the clause, “Because Thou madest me,” belong to the verse that follows? “Remove Thy stroke away from me” (ver. 10). Because it is “Thou that hast made me,” let it not be Thy pleasure to destroy me utterly; scourge, so that I may be made better, not so that I faint; beat me, so that I may be beaten out to a greater length and breadth, not so that I may be ground to powder. “By the heaviness of Thy hand I fainted in corrections.” That is, I “fainted” while Thou wast correcting me. And what is meant by “correcting” me? except what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
