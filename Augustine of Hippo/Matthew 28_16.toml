[[commentary]]
quote='''
(de Cons. Ev. iii. 25.) But it is to be considered, how the Lord could be seen bodily in Galilee. For that it was not the day of the Resurrection is manifest; for He was seen that day in Jerusalem in the beginning of the night, as Luke and John evidently agree. Nor was it in the eight following days, after which John says that the Lord appeared to His disciples, and when Thomas first saw Him, who had not seen Him on the day of the Resurrection. For if within these eight days the eleven had seen Him on a mountain in Galilee, Thomas, who was one of the eleven, could not have seen Him first after the eight days. Unless it be said, that the eleven there spoken of were eleven out of the general body of the disciples, and not the eleven Apostles. But there is another difficulty. John having related that the Lord was seen not in the mountain, but at the sea of Tiberias, by seven who were fishing, adds, This is now the third time that Jesus showed himself to his disciples after he was risen from the (John 21:14.) dead. (Mark 16:14.) So that if we understand the Lord to have been seen within those eight days by eleven of the disciples, this manifestation at the sea of Tiberias will be the fourth, and not the third, appearance. Indeed, to understand John's account at all it must be observed, that he computes not each appearance, but each day on which Jesus appeared, though He may have appeared more than once on the same day; as He did three times on the day of His Resurrection. We are then obliged to understand that this appearance to the eleven disciples on the mountain in Galilee took place last of all. In the four Evangelists we find in all ten distinct appearances of Our Lord after His Resurrection. 1. At the sepulchre to the women. 2. To the same women on their way back from the sepulchre. 3. To Peter. 4. To two disciples as they went into the country. 5. To many together in Jerusalem; 6. when Thomas was not with them. 7. At the sea of Tiberias. 8. At the mountain in Galilee, according to Matthew. 9. To the eleven as they sat at meat, because they should not again eat with Him upon earth, related by Mark. 10. On the day of His Ascension, no longer on the earth, but raised aloft in a cloud, as related by both Mark and Luke. But all is not written, as John confesses, for He had much conversation with them during forty days before His ascension, being seen of them, and speaking unto them of the things pertaining to the kingdom of God. (Acts 1:3.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We have next to consider now what was the occasion of His first appearance to the disciples in Galilee. For this incident, which John narrates as the third in order, took place in Galilee by the sea of Tiberias. And one may perceive that the scene was in that district, if he calls to mind the miracle of the five loaves, the narrative of which the same John commences in these terms: "After these things Jesus went over the sea of Galilee, which is the sea of Tiberias." And what should naturally be supposed to be the proper locality for His first manifestation to the disciples after His resurrection but Galilee? This seems to be the conclusion to which we should be led when we recollect the words of the angel who, according to Matthew's Gospel, addressed the women as they came to the sepulchre. The words were these: "Fear not ye; for I know that ye seek Jesus of Nazareth, which was crucified. He is not here; for He is risen, as He said. Come, see the place where the Lord lay: and go quickly, and tell His disciples that He is risen from the dead; and, behold, He goeth before you into Galilee; there shall ye see Him: lo, I have told you." Mark presents a similar report, whether the angel of whom he speaks be the same one or a different. His version runs thus: "Be not affrighted: ye seek Jesus of Nazareth which was crucified; He is risen; He is not here: behold the place where they laid Him. But go your way, tell His disciples and Peter that He goeth before you into Galilee: there shall ye see Him, as He said unto you." Now the impression which these words seem to produce is, that Jesus was not to show Himself to His disciples after His resurrection, but in Galilee. The appearance thus referred to, however, is not recorded even by Mark himself, who has informed us how He showed Himself first to Mary Magdalene in the early morning of the first day of the week; how she went and told them that had been with Him as they mourned and wept; how these persons refused to believe her; how, after this, He was next seen by the two disciples who were going to the residence in the country; how these twain reported what had occurred to them to the residue, which, as Luke and John agree in certifying, took place in Jerusalem on the very day of the Lord's resurrection, and when night was now coming on. Thereafter the same evangelist comes next to that appearance which he calls His last, and which was vouchsafed to the eleven as they sat at meat; and when he has given us his account of that scene, he tells us how He was received up into heaven, which event took place, as we know, on the Mount Olivet, at no great distance from Jerusalem. Thus Mark nowhere relates the actual fulfilment of that which he declares to have been announced beforehand by the angel. Matthew, on the other hand, confines his statement to a single occurrence, and refers to no other locality whatsoever, whether earlier or later, where the disciples saw the Lord after He was risen, but the Galilee which was specified in the angel's prediction. This evangelist, in short, first introduces his notice of the terms in which the women were addressed by the angel; then he subjoins an account of what happened as they were going, and how the members of the watch were bribed to give a false report; and then he inserts his statement [of the appearance in Galilee], just as if that were the very event which followed immediately on what he has been relating. For, indeed, the angel's words, "He is risen; and behold, He goeth before you into Galilee," were really such as might make it seem reasonable to suppose that nothing would intervene [before that manifestation in Galilee]. Matthew's version, accordingly, proceeds as follows: "Then the eleven disciples went away into Galilee, into a mountain where Jesus had appointed them. And when they saw Him, they worshipped Him: but some doubted. And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost; teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world." In these terms has Matthew closed his Gospel.

Thus, then, were it not that the consideration of the narratives given by others of the evangelists led us inevitably to examine the whole subject with greater care, we might entertain the idea that the scene of the Lord's first manifestation of Himself to the disciples after His resurrection, could be nowhere else but in Galilee. In like manner, had Mark passed over the angel's announcement without notice, any one might have supposed that Matthew was induced to tell us how the disciples went away to a mountain in Galilee, and there worshipped the Lord, by his desire to show the actual fulfilment of the charge, and of the prediction which he had also recorded to have been conveyed by the angel. As the case now stands, however, Luke and John both certify with sufficient clearness, that on the very day of His resurrection the Lord was seen by His disciples in Jerusalem, which is at such a distance from Galilee as makes it impossible for Him to have been seen by these same individuals in both places in the course of a single day. In like manner, Mark, while he does report in similar terms the announcement made by the angel, nowhere mentions that the Lord actually was seen in Galilee by His disciples after He was risen. These, therefore, are considerations which strongly force upon us an inquiry into the real import of this saying, "Behold, He goeth before you into Galilee! there shall ye see Him." For if Matthew himself, too, had not stated that the eleven disciples went away into Galilee into a mountain, where Jesus had appointed them, and that they saw Him there and worshipped Him, we might have supposed that there was no literal fulfilment of the prediction in question, but that the whole announcement was intended to convey a figurative meaning. And a parallel to that we should then find in the words recorded by Luke, namely, "Behold I cast out devils, and I do cures to-day and to-morrow, and the third day I shall be perfected;" which prediction certainly was not accomplished in the letter. In like manner, if the angel had said, "He goeth before you into Galilee, there shall ye see Him first;" or, "Only there shall ye see Him;" or, "Nowhere else but there shall ye see Him;" unquestionably, in that case, Matthew would have been in antagonism with the rest of the evangelists. As the matter stands, however, the words are simply these: "Behold, He goeth before you into Galilee; there shall ye see Him;" and there is no statement of the precise time at which that meeting was to take place—whether at the earliest opportunity, and before He was seen by them elsewhere, or at a later period, and after they had seen Him also in other places besides Galilee; and, further, although Matthew relates that the disciples went away into Galilee into a mountain, he neither specifies the day of that departure, nor constructs his narrative in an order which would force upon us the necessity of supposing that this particular event must have been actually the first appearance. Consequently, we may conclude that Matthew stands in no antagonism with the narratives of the other evangelists, but that he makes it quite competent for us, in due consistency with his own report, to understand the meaning and accept the truth of these other accounts. At the same time, as the Lord thus pointed, not to the place where He intended first to manifest Himself, but to the locality of Galilee, where undoubtedly He appeared afterwards; and as He conveyed these instructions about beholding Himself at once through the angel, who said," Behold, He goeth before you into Galilee: there shall ye see Him;" and by His own words, "Go, tell my brethren, that they go into Galilee, and there shall ye see me;"—in these facts we find considerations which make every believer anxious to inquire with what mystical significance all this may be understood to have been stated.
'''
