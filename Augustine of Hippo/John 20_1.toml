[[commentary]]
quote='''
(de Con. Evang. iii. 24) Mary Magdalene, undoubtedly the most fervent in love, of all the women that ministered to our Lord; so that John deservedly mentions her only, and says nothing of the others who were with her, as we know from the other Evangelists.

(Tr. cxx) Una sabbati is the day which Christians call the Lord's day, after our Lord's resurrection. Matthew calls it prima sabbati.

(de Con. Evang. iii. 24.) What Mark says, Very early in the morning, at the rising of the sun (Mark 16:1), does not contradict John's words, when it was yet dark. At the dawn of day, there are yet remains of darkness, which disappear as the light breaks in. We must not understand Mark's words, Very early in the morning, at the rising of the sun, ἡλίου ἀνατεέλαντος to mean that the sun was above the horizon, but rather what we ourselves ordinarily mean by the phrase, when we want any thing to be done very early, we say at the rising of the sun, i. e. some time before the sun is risen.

(Con. Evang. iii. 24) Now took place what Matthew only relates, the earthquake, and rolling away of the stone, and fright of the guards.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And on the first of the week came Mary Magdalene early, when it was yet dark, unto the sepulchre, and saw the stone taken away from the sepulchre." The first of the week is what Christian practice now calls the Lord's day, because of the resurrection of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520120.html'
source_title="Tractates on John 120"

[[commentary]]
quote='''
At the same time, a question, which is not to be dealt with lightly, does arise here with respect to the exact hour at which the women came to the sepulchre. For when Matthew says, "Now, on the evening of the Sabbath, when it was dawning toward the first day of the week, came Mary Magdalene, and the other Mary, to see the sepulchre," what are we to make of Mark's statement, which runs thus: "And very early in the morning, the first day of the week, they came unto the sepulchre at the rising of the sun"? It is to be observed that in this Mark states nothing inconsistent with the reports given by other two of the evangelists, namely, Luke and John. For when Luke says, "Very early in the morning," and when John puts it thus, "Early, when it was yet dark," they convey the same sense which Mark is understood to express when he says, "Very early, at the rising of the sun;" that is to say, they all refer to the period when the heavens were now beginning to brighten in the east, which, of course, does not take place but when the sunrise is at hand. For it is the brightness which is diffused by the rising sun that is familiarly designated by the name of the dawn. Consequently, Mark does not contradict the other evangelist who uses the phrase, "When it was yet dark;" for as the day breaks, what remains of the darkness [of the night] passes away just in proportion as the sun continues to rise. And this phrase, "Very early in the morning," need not be taken to mean that the sun itself was actually seen by this time [blazing] over the lands; but it is rather to be taken as like the kind of expression which we are in the habit of employing when speaking to people to whom we wish to intimate that something should be done more betimes than usual. For when we have used the term, "Early in the morning," if we wish to keep the persons addressed from supposing that we refer directly to the time when the sun is already conspicuously visible over earth, we usually add the word "very," and say, "very early in the morning," in order that they may clearly understand that we allude to the time which is also called the daybreak. At the same time, it is also customary for men, after the cockcrow has been repeatedly heard, and when they begin to surmise that the day is now approaching, to say, "It is now early in the morning;" and when after this they weigh their words and observe that, as the sun now rises,—that is to say, as it now makes its immediate advent into these parts,—the sky is just beginning to redden, or to brighten, those who said, "It is early in the morning," then amplify their expression and say, "It is very early in the morning." But what does it matter, provided only that, whichever method of explanation be preferred, we understand that what is meant by Mark, when he uses the terms "early in the morning," is just the same as is intended by Luke when he adopts the phrase, "in the morning;" and that the whole expression employed by the former—namely, "very early in the morning"—amounts to the same as that which we find in Luke—namely, "very early in the dawn,"—and as that which is chosen by John when he says, "early, when it was yet dark"? Moreover, when Mark speaks of the "rising of the sun," he just means that by its rising the sun was now beginning to bring the light in upon the sky. But the question now is this: how can Matthew be in harmony with these three when he says neither "in the early morning" nor "early in the morning," but "in the evening of the Sabbath, when it was beginning to dawn toward the first day of the week"? This is a matter which must be carefully investigated. Now, under that first part of the night, which is [here called] the evening, Matthew intended to refer to this particular night, at the close of which the women came to the sepulchre. And we understand his reason for so referring to the said night to have been this: that by the time of the evening it was lawful for them to bring the spices, because the Sabbath was then indeed over. Consequently, as they were hindered by the Sabbath from doing so previously, he has given a designation of the night, taken from the time at which it began to be a lawful thing for them to do what they did at any period of the same night which pleased them. Thus, therefore, the phrase "in the evening of the Sabbath" is used, as if what was said had been "in the night of the Sabbath," or in other words, in the night which follows the day of the Sabbath. The express words which he employs thus indicate this with sufficient clearness. For his terms are these: "Now, in the evening of the Sabbath, when it began to dawn toward the first day of the week;" and that could not be the case if what we had to understand to be denoted by the mention of the "evening" was simply the first short space of the night, or in other words, only the beginning of the night. For what can be said "to begin to dawn toward the first day of the week" is not explicitly the beginning [of the night], but the night itself, as it commences to be brought to its close by the advance of the light. For the terminus of the first part of the night is just the beginning of the second part, but the terminus of the whole night is the light. Hence we could not speak of the evening as dawning toward the first day of the week unless under the term "evening" we should understand the night itself to be meant, which, as a whole, is brought to its close by the light. It is also a familiar method of speech in divine Scripture to express the whole under the part; and thus, under the word "evening" here, the evangelist has denoted the whole night, which finds its extreme point in the dawn. For it was in the dawn that those women came to the sepulchre; and in this way they really came on the night, which is here indicated by the term "evening." For, as I have said, the night as a whole is denoted by that word; consequently, at whatever period of that night they might have come, they certainly did come in the said night. And, accordingly, if they came at the latest point in that night, it is still unquestionably the case that they did come in the said night. But it could not be said to be on "the evening, when it began to dawn toward the first day of the week," unless the night as a whole can be understood under that expression. Accordingly, the women who came in the night referred to, came in the evening specified. And if they came at any period, even the latest during that night, they surely came in the night itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 24"
