[[commentary]]
quote='''
“For thou hast proved us, O God; Thou hast fired us as silver is fired” (ver. 10). Hast not fired us like hay, but like silver: by applying to us fire, Thou hast not turned us into ashes, but Thou hast washed off uncleanness, “Thou hast fired us, as silver is fired.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
