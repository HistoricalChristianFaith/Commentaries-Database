[[commentary]]
quote='''
Matthew continues in these terms: "And when they were come to Capharnaum, they that received tribute money came to Peter, and said to him, Doth not your master pay tribute? He saith, Yes;" and so on, down to where we read: "Thou shall find a piece of money: that take, and give unto them for me and thee." He is the only one who relates this occurrence, after the interposition of which he follows again the order which is pursued also by Mark and Luke in company with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 60"
