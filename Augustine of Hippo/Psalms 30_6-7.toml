[[commentary]]
quote='''
“Turn not Thou away Thy Face from me.” Thou didst turn it away from me when proud. For once I was full, and in my fulness I was puffed up. Once “in my fulness I said, I shall never be moved.” “I said in my fulness, I shall not be moved,” knowing not Thy Righteousness, and establishing mine own; but “Thou, Lord, in Thy Will hast afforded strength to my beauty.” “I said in my fulness, I shall not be moved,” but from Thee came whatever fulness I had. And to prove to me that it was from Thee, “Thou didst turn away Thy Face from me, and I was troubled.” After this trouble, whereinto I was cast, because Thou didst turn away Thy Face, after the weariness of my spirit, after my heart was troubled within me, because Thou didst turn away Thy Face, then became I “like a land without water to Thee: turn not Thou away Thy Face.” Thou turnedst it away from me when proud; give it back to me now I am humble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520143.html'
source_title="Exposition on Psalm 143"

[[commentary]]
quote='''
But it is plain that when it has been given, also our good merits begin to be,—yet only by means of it; for, were that only to withdraw itself, man falls, not raised up, but precipitated by free will. Wherefore no man ought, even when he begins to possess good merits, to attribute them to himself, but to God, who is thus addressed by the Psalmist: "Be Thou my helper, forsake me not." By saying, "Forsake me not," he shows that if he were to be forsaken, he is unable of himself to do any good thing. Wherefore also he says: "I said in my abundance, I shall never be moved," for he thought that he had such an abundance of good to call his own that he would not be moved. But in order that he might be taught whose that was, of which he had begun to boast as if it were his own, he was admonished by the gradual desertion of God's grace, and says: "O Lord, in Thy good pleasure Thou didst add strength to my beauty. Thou didst, however, turn away Thy face, and then I was troubled and distressed." Thus, it is necessary for a man that he should be not only justified when unrighteous by the grace of God,—that is, be changed from unholiness to righteousness,—when he is requited with good for his evil; but that, even after he has become justified by faith, grace should accompany him on his way, and he should lean upon it, lest he fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 13"
