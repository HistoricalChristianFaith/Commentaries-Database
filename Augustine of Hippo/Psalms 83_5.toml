[[commentary]]
quote='''
“Since they have imagined with one consent; together against Thee have they disposed a testament” (ver. 5): as though they could be the stronger. In fact, “a testament” is a name given in the Scriptures not only to that which is of no avail till the death of the testators, but every covenant and decree they used to call a testament. For Laban and Jacob made a testament, which was certainly to have force between the living; and such cases without number are read in the words of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252083.html'
source_title="Exposition on Psalm 83"
