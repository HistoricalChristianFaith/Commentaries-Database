[[commentary]]
quote='''
“For the Lord Most High is terrible” (ver. 2). The Most High in descending made like one ludicrous, by ascending into Heaven is made terrible. “A great King over all the earth.” Not only over the Jews; for over them also He is King. For of them also the Apostles believed and of them many thousands of men sold their goods, and laid the price at the Apostles’ feet, and in them was fulfilled what in the title of the Cross was written, “The King of the Jews.” For He is King also of the Jews. But “of the Jews” is little. “O clap your hands, all ye nations: for God is the King of all the earth.” For it sufficeth not Him to have under Him one nation: therefore such great price gave He out of His side, as to buy the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
