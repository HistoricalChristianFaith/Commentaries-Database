[[commentary]]
quote='''
What the finger of God is, the Gospel explaineth to us; for the finger of God is the Holy Ghost. How do we prove this? Our Lord, when answering those who accused Him of casting out devils in the name of Beelzebub, saith, “If I cast out devils by the Spirit of God;” and another Evangelist, in relating the same saying, saith, “If I with the finger of God cast out devils.” What therefore is in one stated clearly, is darkly expressed in another. Thou didst not know what was the finger of God, but another Evangelist explains it by terming it the Spirit of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"

[[commentary]]
quote='''
On the other hand, Luke gives an account of these things almost in the same language as Matthew has employed. And the circumstance that Luke here designates the Spirit of God as the finger of God, does not betray any departure from a genuine identity in sense; but it rather teaches us an additional lesson, giving us to know in what manner we are to interpret the phrase "the finger of God" wherever it occurs in the Scriptures. Moreover, with regard to other matters which are left unmentioned in this section both by Mark and by Luke, no difficulty can be raised by these. Neither can that be the case with some other circumstances which are related by them in somewhat different terms, for the sense still remains the same.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 38"
