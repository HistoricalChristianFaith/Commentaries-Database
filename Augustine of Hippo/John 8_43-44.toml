[[commentary]]
quote='''
"Why," He says, "do ye not understand my speech? Even because ye cannot hear my word." And so they could not understand, because they could not hear. And whence could they not hear, but just because they refused to be set right by believing? And why so? "Ye are of your father the devil." How long do ye keep speaking of a father? How often will ye change your fathers, - at one time Abraham, at another God? Hear from the Son of God whose children ye be: "Ye are of your father the devil."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
