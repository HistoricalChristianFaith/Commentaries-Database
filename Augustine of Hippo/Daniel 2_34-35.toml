[[commentary]]
quote='''
For He was as yet a small stone, already indeed cut out of the mountain without hands; as saith Daniel the prophet, that he saw a stone cut out of the mountain without hands.But what follows? "And that stone," saith he "grew and became a great mountain and filled the whole face of the earth." Mark then, my beloved brethren, what I say: Christ, before the Jews, was already cut out from the mountain. The prophet wishes that by the mountain should be understood the Jewish kingdom. But the kingdom of the Jews had not filled the whole face of the earth. The stone was cut out from thence, because from thence was the Lord born on His advent among men. And wherefore without hands? Because without the cooperation of man did the Virgin bear Christ. Now then was that stone cut out without hands before the eyes of the Jews; but it was humble. Not without reason; because not yet had that stone increased and filled the whole earth: that He showed in His kingdom, which is the Church, with which He has filled the whole face of the earth. Because then it had not yet increased, they stumbled at Him as at a stone: and that happened in them which is written, "Whosoever shall fall upon that stone shall be broken; but on whomsoever that stone shall fall, it will grind them to powder." At first they fell upon Him lowly: as the lofty One He shall come upon them; but that He may grind them to powder when He comes in His exaltation, He first broke them in His lowliness. They stumbled at Him, and were broken; they were not ground, but broken: He will come exalted and will grind them. But the Jews were to be pardoned because they stumbled at a stone which had not yet increased. What sort of persons are those who stumble at the mountain itself? Already you know who they are of whom I speak. Those who deny the Church diffused through the whole world, do not stumble at the lowly stone, but at the mountain itself: because this the stone became as it grew. The blind Jews did not see the lowly stone: but how great blindness not to see the mountain!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"

[[commentary]]
quote='''
Moreover, in the fifth age, in the fifth water-pot as it were, Daniel saw a stone that had been cut from a mountain without hands, and had broken all the kingdoms of the earth; and he saw the stone grow and become a great mountain, so as to fill the whole face of the earth. What can be plainer, my brethren? The stone is cut from a mountain: the same is the stone which the builders rejected, and is become the head of the corner. From what mountain is it cut, if not from the kingdom of the Jews, of which our Lord Jesus Christ was born according to the flesh? And it is cut without hands, without human exertion; because Christ sprung from a virgin, without a husband's embrace. The mountain from which it was cut had not filled the whole face of the earth; for the kingdom of the Jews did not possess all nations. But, on the other hand, the kingdom of Christ we see occupying the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25209.html'
source_title="Tractates on John 9"

[[commentary]]
quote='''
For there was a certain corner-stone contemptible, whereat the Jews stumbled, cut out of a certain mountain without hands, that is, coming of the kingdom of the Jews without hands, because human operation went not with Mary of whom was born Christ. But if that stone, when the Jews stumbled thereat, had remained there, thou hadst not had whither to ascend. But what was done? What saith the prophecy of Daniel? What but that the stone grew, and became a great mountain? How great? So that it filled the whole face of the earth. By growing, then, and by filling the whole face of the earth, that mountain came to us. Why then seek we the mountain as though absent, and not as being present ascend to it; that in us the Lord may be “great, and greatly to be praised”?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"

[[commentary]]
quote='''
What is His hill? We read elsewhere concerning this hill, that a stone was cut from the hill without hands, and shattered all the kingdoms of the earth, and the stone itself increased. This is the vision of Daniel which I am relating. This stone which was cut from the hill without hands increased, and “became,” he saith, “a great mountain, and filled the whole face of the earth.” Let us worship on that great mountain, if we desire to be heard. Heretics do not worship on that mountain, because it hath filled the whole earth; they have stuck fast on part of it, and have lost the whole. If they acknowledge the Catholic Church, they will worship on this hill with us. For we already see how that stone that was cut from the mountain without hands hath increased, and how great tracts of earth it hath prevailed over, and unto what nations it hath extended. What is the mountain whence the stone was hewn without hands? The Jewish kingdom, in the first place; since they worshipped one God. Thence was hewn the stone, our Lord Jesus Christ.…That stone then was born of the mountain without hands: it increased, and by its increase broke all the kingdoms of the earth. It hath become a great mountain, and hath filled the whole face of the earth. This is the Catholic Church, in whose communion rejoice that ye are. But they who are not in her communion, since they worship and praise God apart from this same mountain, are not heard unto eternal life; although they may be heard unto certain temporal things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
