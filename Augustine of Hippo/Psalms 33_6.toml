[[commentary]]
quote='''
“By the Word of the Lord were the heavens made firm:” for not by themselves, but by the Word of the Lord were the righteous made strong. “And all the strength of them by the Breath of His Mouth” (ver. 6). And all their faith by His Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
