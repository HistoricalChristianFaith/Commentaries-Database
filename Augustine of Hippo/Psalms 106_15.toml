[[commentary]]
quote='''
“And He gave them their desire, and sent fulness withal into their souls” (ver. 15). But He did not thus render them happy: for it was not that fulness of which it is said, “Blessed are they which do hunger and thirst after righteousness: for they shall be filled.” In this passage he doth not speak of the rational soul, but of the soul as giving animal life to the body; to the substance of which belong meat and drink, according to what is said in the Gospel, “Is not the soul more than meat, and the body than raiment?” as if it belonged to the soul to eat, to the body to be clothed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520106.html'
source_title="Exposition on Psalm 106"
