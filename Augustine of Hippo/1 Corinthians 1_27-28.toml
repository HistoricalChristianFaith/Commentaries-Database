[[commentary]]
quote='''
Was the fisherman, the publican, a prince? They were indeed princes: but because they became such in her. Princes of what kind were they? Princes come from Babylon, believing monarchs of this world, came to the city of Rome, as to the head of Babylon: they went not to the temple of the Emperor, but to the tomb of the Fisherman. Whence indeed did they rank as princes? “God chose the weak things of the world to confound the strong, and the foolish things He hath chosen, and things which are not as though they were, that things which are may be brought to nought.” This He doth who “from the ground raises the helpless, and from the dunghill exalts the poor.” For what purpose? “That He may set him with the princes, even with the princes of His people.” This is a mighty deed, a deep source of pleasure and exultation. Orators came later into that city, but they could never have done so, had not fishermen preceded them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
