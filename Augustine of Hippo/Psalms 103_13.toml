[[commentary]]
quote='''
“Yea, like as a father pitieth his own children, even so hath the Lord had mercy on them that fear Him” (ver. 13). Let Him be as angry as He shall will, He is our Father. But He hath scourged us, and afflicted us, and bruised us: He is our Father. Son, if thou bewailest, wail beneath thy Father; do not so with indignation, do not so with the puffing up of pride. What thou sufferest, whence thou mournest, it is medicine, not punishment; it is thy chastening, not thy condemnation. Do not refuse the scourge, if thou dost not wish to be refused thy heritage: do not think of what punishment thou sufferest in the scourge, but what place thou hast in the Testament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
