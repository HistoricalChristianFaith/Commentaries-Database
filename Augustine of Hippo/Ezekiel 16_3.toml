[[commentary]]
quote='''
How, then, were the Jews the children of the devil? By imitation, not by birth. Listen to the usual language of the Holy Scriptures. The prophet says to those very Jews, "Thy father was an Amorite, and thy mother a Hittite." The Amorites were not a nation that gave origin to the Jews. The Hittites also were themselves of a nation altogether different from the race of the Jews. But because the Amorites and Hittites were impious, and the Jews imitated their impieties, they found parents for themselves, not of whom they were born, but in whose damnation they should share, because following their customs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252042.html'
source_title="Tractates on John 42"
