[[commentary]]
quote='''
“This their own way is an offence to them” (ver. 13). Be it an offence to them, not to thee. But when will it be so to thee too? If thou thinkest such men to be blessed. If thou perceivest that they be not blessed, their own way will be an offence to themselves; not to Christ, not to His Body, not to His members. “And afterwards they shall bless with their mouth.” What meaneth, “Afterwards they shall bless with their mouth”? Though they have become such, that they seek nothing but temporal goods, yet they become hypocrites: and when they bless God, with lips they bless, and not with heart. Christians like these, when to them eternal life is commended, and they are told, that in the name of Christ they ought to be despisers of riches, do make grimaces in their hearts: and if they dare not do it with open face, lest they blush, or lest they should be rebuked by men, yet they do it in heart, and scorn; and there remaineth in their mouth blessing, and in their heart cursing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
