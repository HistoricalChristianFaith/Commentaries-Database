[[commentary]]
quote='''
“Fill their faces with shame, and they shall seek Thy name, O Lord” (ver. 16). Good and desirable is this which he prophesieth for them: and he would not prophesy thus, unless there were even in that company of the enemies of God’s people, some men of such kind that this would be granted to them before the last judgment: for now they are mixed together, and this is the body of the enemies, in respect of the envy whereby they rival the people of God. And now, where they can, they make a noise and lift up their head: but severally, not universally as they will do at the end of the world, when the last judgment is about to fall. But it is the same body, even in those who out of this number shall believe and pass into another body (for the faces of these are filled with shame, that they may seek the name of the Lord), as well as in those others who persevere unto the end in the same wickedness, who are made as stubble before the wind, and are consumed like a wood and barren mountains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252083.html'
source_title="Exposition on Psalm 83"
