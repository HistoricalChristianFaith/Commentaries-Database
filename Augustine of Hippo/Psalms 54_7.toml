[[commentary]]
quote='''
“For out of all tribulation Thou hast delivered me” (ver. 7). For this cause I have perceived how good a thing is Thy name: for if this I were able before tribulations to acknowledge, perchance for me there had been no need of them. But tribulation hath been applied for admonition, admonition hath redounded to Thy praise. For I should not have understood where I was, except of my weakness I had been admonished. “Out of all tribulations,” therefore, “Thou hast delivered me. And upon mine enemies mine eye hath looked back:” upon those Ziphites “mine eye hath looked back.” Yea, their flower I have passed over in loftiness of heart, unto Thee I have come, and thence I have looked back upon them, and have seen that “All flesh is grass, and all the glory of man as the flower of grass:” as in a certain place is also said, “I have seen the ungodly man to be exalted and raised up like the cedars of Lebanon: I passed by, and, lo! he was not.” Wherefore “he was not”? Because thou hast passed by. What is, “because thou hast passed by”? Because not to no purpose hast thou heard “Lift up thy heart;” because not on earth, where thou wouldest have rotted, thou hast remained; because thou hast lifted thy soul to God, and thou hast mounted beyond the cedars of Lebanon, and from that elevation hast observed: and “Lo! he was not;” and thou hast sought him, and there hath not been found place for him. No longer is labour before thee; because thou hast entered into the sanctuary of God, and hast understood for the last things. So also here thus he concludeth. “And upon mine enemies mine eye hath looked back.” This do ye therefore, brethren, with your souls; lift up your hearts, sharpen the edge of your mind, learn truly to love God, learn to despise the present world, learn voluntarily to sacrifice the offerings of praise; to the end that, mounting beyond the flower of the grass, ye may look back upon your enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"
