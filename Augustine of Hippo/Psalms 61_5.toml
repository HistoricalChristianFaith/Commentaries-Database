[[commentary]]
quote='''
“For Thou, O God, hast hearkened to my prayer” (ver. 5). What prayer? That wherewith he beginneth: “Hearken, O God, to my supplication.”…“Thou hast given inheritance to men fearing Thy name.” Let us continue therefore in the fear of God’s name: the eternal Father deceiveth us not. Sons labour, that they may receive the inheritance of their parents, to whom when dead they are to succeed: are we not labouring to receive an inheritance from that Father, to whom not dying we succeed; but together with Him in the very inheritance for everlasting are to live?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"
