[[commentary]]
quote='''
The sparrow hath found herself a home: my heart hath found itself a home. She tries her wings in the virtues of this life, in faith, and hope, and charity, by which she may fly unto her home: and when she shall have come thither, she shall remain; and now the complaining voice of the sparrow, which is here, shall no longer be there. For it is the very complaining sparrow of whom in another Psalm he saith, “Like a sparrow alone on the housetop.” From the housetop he flies home. Now let him be on the housetop, treading on his carnal house: he shall have a heavenly house, a perpetual home: that sparrow shall make an end of his complaints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"
