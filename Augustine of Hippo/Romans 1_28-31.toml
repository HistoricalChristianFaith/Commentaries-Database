[[commentary]]
quote='''
When at last he says: God gave them over to a reprobate mind, etc., filled, he says, with all iniquity, we are given to understand that these things he now names, that is, crimes, pertain to doing harm to others. But above he was speaking of the corruptions that are called shameful deeds, from which one comes to crimes; for each person, following the pernicious sweetness of shameful deeds, while he tries to remove the persons who hinder him, proceeds to crime. Thus too that passage in the Wisdom of Solomon is distinguished, where, when he had enumerated the shameful deeds above, he says: Let us lie in wait for the poor righteous man, because he is useless to us, etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
