[[commentary]]
quote='''
Justly then is it added, “Thy truth shalt Thou stablish in the Heavens:” for all those Israelites who were called to be Apostles became as Heavens which declare the glory of God: as it is written by them, “The Heavens declare the glory of God, and the firmament showeth His handywork.”…Since, although they were taken up from hence before the Church filled the whole world, yet as “their words reached to the ends of the world,” we are right in supposing this which we have just read, “Thy truth shalt Thou stablish in the Heavens,” fulfilled in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
