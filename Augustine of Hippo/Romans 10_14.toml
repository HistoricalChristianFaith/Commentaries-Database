[[commentary]]
quote='''
The preaching of predestination should not hinder the preaching of perseverance and progress in faith, so that those to whom it has been given to obey should hear what they ought to hear. For how will they hear without a preacher?
'''
source_url=''
source_title="GIFT OF PERSEVERANCE 14.36"

[[commentary]]
quote='''
Those who believe rightly believe that they may call on him in whom they have believed and may be strong to do what they have learned in the precepts of the law, since faith obtains what the law commands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 157"

[[commentary]]
quote='''
God sends his angels and gathers together his elect from the four winds, that is, from the whole world. Therefore, the church must necessarily be found among the nations where it does not yet exist, but it does not necessarily follow that all who live there will believe. The promise was to all nations but not to all men of all nations, for not all have faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 199.48"

[[commentary]]
quote='''
Then, again, there is the passage, especially noticeable, in which he says, "We, having the same spirit of faith," for his phrase is not "the knowledge of faith," but "the spirit of faith;" and he expressed himself thus in order that we might understand how that faith is given to us, even when it is not sought, so that other blessings may be granted to it at its request. For "how," says he, "shall they call upon Him in whom they have not believed?" The spirit of grace, therefore, causes us to have faith, in order that through faith we may, on praying for it, obtain the ability to do what we are commanded. On this account the apostle himself constantly puts faith before the law; since we are not able to do what the law commands unless we obtain the strength to do it by the prayer of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 28"
