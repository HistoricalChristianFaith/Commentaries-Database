[[commentary]]
quote='''
"If" then "ye continue in my word, ye shall be my disciples indeed," that ye may behold the very truth as it is, not through sounding words, but in dazzling light, wherewith He shall satisfy us: as we read in the psalm, "The light of Thy countenance is impressed upon us." We are God's money: we have wandered away as coin from the treasury. The impression that was stamped upon us has been rubbed out by our wandering. He has come to refashion, for He it was that fashioned us at first; and He is Himself asking for His money, as Caesar for his. Therefore He says, "Render unto Caesar the things that are Caesar's, and unto God the things that are God's:" to Caesar his money, to God yourselves. And then shall the truth be reproduced in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252040.html'
source_title="Tractates on John 40"


[[commentary]]
quote='''
But yet, “hope in the Lord,” is as yet expressed without explanation. Now what is hoped for, but good things? But since each one would obtain from God that good, which he loves; and they are not easy to be found who love interior goods, that is, which belong to the inward man, which alone should be loved, but the rest are to be used for necessity, not to be enjoyed for pleasure; excellently did he subjoin, when he had said, “hope in the Lord” (ver. 6), “Many say, Who showeth us good things?” This is the speech, and this the daily inquiry of all the foolish and unrighteous; whether of those who long for the peace and quiet of a worldly life, and from the frowardness of mankind find it not; who even in their blindness dare to find fault with the order of events, when involved in their own deservings they deem the times worse than these which are past: or, of those who doubt and despair of that future life, which is promised us; who are often saying, Who knows if it’s true? or, who ever came from below, to tell us this? Very exquisitely then, and briefly, he shows (to those, that is, who have interior sight), what good things are to be sought; answering their question, who say, “Who showeth us good things?” “The light of Thy countenance,” saith he, “is stamped on us, O Lord.” This light is the whole and true good of man, which is seen not with the eye, but with the mind. But he says, “stamped on us,” as a penny is stamped with the king’s image. For man was made after the image and likeness of God, which he defaced by sin: therefore it is his true and eternal good, if by a new birth he be stamped. And I believe this to be the bearing of that which some understand skilfully; I mean, what the Lord said on seeing Cæsar’s tribute money, “Render to Cæsar the things that are Cæsar’s; and to God the things that are God’s.” As if He had said, In like manner as Cæsar exacts from you the impression of his image, so also does God: that as the tribute money is rendered to him, so should the soul to God, illumined and stamped with the light of His countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25204.html'
source_title="Exposition on Psalm 4"
