[[commentary]]
quote='''
“I will sing to the Lord who hath given me good things;” spiritual good things, not belonging to man’s day. “And I will chant to the name of the Lord most high” (ver. 6); that is, I give thanks with joy, and in most due order employ my body, which is the song of the spiritual soul. But if any distinction is to be marked here, “I will sing” with the heart, “I will chant” with my works; “to the Lord,” that which He alone seeth, but “to the name of the Lord,” that which is known among men, which is serviceable not for Him, but for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252013.html'
source_title="Exposition on Psalm 13"
