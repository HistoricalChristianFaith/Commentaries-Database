[[commentary]]
quote='''
Of such as these was it said, “As Jannes and Jambres withstood Moses, so do these also resist the Truth; men of corrupt minds, reprobate concerning the faith.” But how is it that they resist the Truth, except by the vain inflation of their swelling pride, while they raise themselves up on high, as if great and righteous persons, though on the point of passing away into empty air? But what saith he of them? As if speaking of smoke, he says, “They shall proceed no farther, for their folly shall be manifest unto all men, even as theirs also was.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
