[[commentary]]
quote='''
(Ep. 199. 31.) Luke, in order to show that the abomination of desolation foretold by Daniel had reference to the time of the siege of Jerusalem, repeats these words of our Lord, When ye shall see Jerusalem encompassed by armies, then know ye that its desolation draweth nigh. (Luke 21:20.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(ubi sup.) For let us not suppose that the computation of Daniel's weeks was interfered with by this shortening of those days, or that they were not already at that time complete, but had to be completed afterwards in the end of all things, for Luke most plainly testifies that the prophecy of Daniel was accomplished at the time when Jerusalem was overthrown.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In like manner, what Matthew states thus, "When ye therefore shall see the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place, whoso readeth let him understand," is put in the following form by Mark: "But when ye shall see the abomination of desolation standing where it ought not, let him that readeth understand." But though the phrase is thus altered, the sense conveyed is the same. For the point of the clause "where it ought not," is that the abomination of desolation ought not to be in the holy place. Luke's method of putting it, again, is neither, "And when ye shall see the abomination of desolation stand in the holy place," nor "where it ought not," but, "And when ye shall see Jerusalem compassed with an army, then know that the desolation thereof is nigh." At that time, therefore, will the abomination of desolation be in the holy place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 77"
