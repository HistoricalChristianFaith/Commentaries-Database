[[commentary]]
quote='''
But if any one shall set himself in comparison, I say, not with the power. but with the innocence of Christ, and (I would not say) in thinking that he is healing the sins of others, but at least that he has no sins of his own, even so far is his avidity overstepping the requirements of the method of salvation; it is a matter of considerable moment for him, only he attains not his desire. And well it is that he is admonished in that passage of the Proverbs, which immediately goes on to say, "But if thy greed is too great, be not desirous of his dainties; for it is better that thou take nothing thereof, than that thou shouldst take more than is befitting. For such things," it is added, "have a life of deceit," that is, of hypocrisy. For in asserting his own sinlessness,he cannot prove, but only pretend, that he is righteous. And so it is said," For such have a deceiving life." There is only One who could at once have human flesh and be free from sin. Appropriately are we commanded that which follows; and such a word and proverb is well adapted to human weakness, when it is said, "Lay not thyself out, seeing thou art poor, against him that is rich." For the rich man is Christ, who was never obnoxious to punishment either through hereditary or personal debt and is righteous Himself, and justifies others. Lay not thyself out against Him, thou who art so poor, that thou art manifestly to the eyes of all the daily beggar that thou art in thy prayer for the remission of sins. "But keep thyself," he says, "from thine own counsel" ["cease from thine own wisdom"-E. V.]. From what, but from this delusive presumption? For He, indeed, inasmuch as He is not only man but also God, can never be chargeable with evil. "For if thou turn thine eye upon Him, He will nowhere be visible." "Thine eye," that is, the human eye, wherewith thou distinguishest that which is human; "if thou turn it upon Him, He will nowhere be visible," because He cannot be seen with such organs of sight as are thine. "For He will provide Himself wings like an eagle's, and will depart to the house of His overseer," from which, at all events, He came to us, and found us not such as He Himself was who came.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252084.html'
source_title="Tractates on John 84"
