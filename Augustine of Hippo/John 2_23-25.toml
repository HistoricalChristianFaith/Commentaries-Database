[[commentary]]
quote='''
Opportunely has the Lord procured for us that this passage should occur in its order to day: for I suppose you have observed, beloved, that we have undertaken to consider and explain the Gospel according to John in due course. Opportunely then it occurs, that to-day you should hear from the Gospel, that, "Except a man be born again of water and of the Spirit, he shall not see the kingdom of God." For it is time that we exhort you, who are still catechumens, who have believed in Christ in such wise, that you are still bearing your sins. And none shall see the kingdom of heaven while burdened with sins; for none shall reign with Christ, but he to whom they have been forgiven: but forgiven they cannot be, but to him who is born again of water and of the Holy Spirit. But let us observe all the words what they imply, that here the sluggish may find with what earnestness they must haste to put off their burden. For were they bearing some heavy load, either of stone, or of wood, or even of some gain; if they were carrying corn, or wine, or money, they would run to put off their loads: they are carrying a burden of sins, and yet are sluggish to run. You must run to put off this burden; it weighs you down, it drowns you.

Behold, you have heard that when our Lord Jesus Christ "was in Jerusalem at the Passover, on the feast day, many believed in His name, seeing the signs which He did." "Many believed in His name;" and what follows? "But Jesus did not trust Himself to them." Now what does this mean, "They believed," or trusted, "in His name;" and yet "Jesus did not trust Himself to them;"? Was it, perhaps, that they had not believed on Him, but were feigning to have believed, and that therefore Jesus did not trust Himself to them? But the evangelist would not have said, "Many believed in His name," if he were not giving a true testimony to them. A great thing, then, it is, and a wonderful thing: men believe on Christ, and Christ trusts not Himself to men. Especially is it wonderful, since, being the Son of God, He of course suffered willingly. If He were not willing, He would never have suffered, since, had He not willed it, He had not been born; and if He had willed this only, merely to be born and not to die, He might have done even whatever He willed, because He is the almighty Son of the almighty Father Let us prove it by facts. For when they wished to hold Him, He departed from them. The Gospel says, "And when they would have cast Him headlong from the top of the mountain, He departed from them unhurt." And when they came to lay hold of Him, after He was sold by Judas the traitor, who imagined that he had it in his power to deliver up his Master and Lord, there also the Lord showed that He suffered of His own will, not of necessity. For when the Jews desired to lay hold of Him, He said to them, "Whom seek ye? But they said, Jesus of Nazareth. And said He, I am He. On hearing this saying, they went backward, and fell to the ground." In this, that in answering them He threw them to the ground, He showed His power; that in His being taken by them He might show His will. It was of compassion, then, that He suffered. For "He was delivered up for our sins, and rose again for our justification." Hear His own words: "I have power to lay down my life, and I have power to take it again: no man taketh it from me, but I lay it down of myself, that I may take it again." Since, therefore, He had such power, since He declared it by words, showed it by deeds, what then does it mean that Jesus did not trust Himself to them, as if they would do Him some harm against His will, or would do something to Him against His will, especially seeing that they had already believed in His name? Moreover, of the same persons the evangelist says, "They believed in His name," of whom he says, "But Jesus did not trust Himself to them." Why? "Because He knew all men, and needed not that any should bear witness of man: for Himself knew what was in man." The artificer knew what was in His own work better than the work knew what was in itself. The Creator of man knew what was in man, which the created man himself knew not. Do we not prove this of Peter, that he knew not what was in himself, when he said, "With Thee, even to death"? Hear that the Lord knew what was in man: "Thou with me even to death? Verily, verily, I say unto thee, Before the cock crow, thou shalt deny me thrice." The man, then, knew not what was in himself; but the Creator of the man knew what was in the man. Nevertheless, many believed in His name, and yet Jesus did not trust Himself to them. What can we say, brethren? Perhaps the circumstances that follow will indicate to us what the mystery of these words is. That men had believed in Him is manifest, is true; none doubts it, the Gospel says it, the truth-speaking evangelist testifies to it. Again, that Jesus trusted not Himself to them is also manifest, and no Christian doubts it; for the Gospel says this also, and the same truth-speaking evangelist testifies to it. Why, then, is it that they believed in His name, and yet Jesus did not trust Himself to them? Let us see what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252011.html'
source_title="Tractates on John 11"

[[commentary]]
quote='''
It was in answer to Nicodemus, who was of them that had believed on Jesus, that it was said, And Jesus did not trust Himself to them. To certain men, indeed, He did not trust Himself, though they had already believed on Him. Thus it is written, "Many believed in His name, seeing the signs which He did. But Jesus did not trust Himself to them. For He needed not that any should testify of man; for Himself knew what was in man." Behold, they already believed on Jesus, and yet Jesus did not trust Himself to them. Why, because they were not yet born again of water and of the Spirit. From this have we exhorted and do exhort our brethren the catechumens. For if you ask them, they have already believed in Jesus; but because they have not yet received His flesh and blood, Jesus has not yet trusted Himself to them. What must they do that Jesus may trust Himself to them? They must be born again of water and of the Spirit; the Church that is in travail with them must bring them forth. They have been conceived; they must be brought forth to the light: they have breasts to be nourished at; let them not fear lest, being born, they may be smothered; let them not depart from the mother's breasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"
