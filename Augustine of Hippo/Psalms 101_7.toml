[[commentary]]
quote='''
“The proud man hath not dwelt in the midst of my house” (ver. 7). Understand this of the heart. The proud did not dwell in my heart: no such dwelt in my heart: for he hurried away from me. None but the meek and peaceful dwelt in my heart; the proud dwelt not there, for the unrighteous one dwelleth not in the heart of the righteous. Let the righteous be distant from thee, I know not how many miles and stations: ye dwell together, if ye have one heart. “The proud doer hath not dwelt in the midst of my house: he that speaketh unjust things hath not directed in the sight of my eyes.” This is the spotless way, where we understand when the Lord cometh unto us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"
