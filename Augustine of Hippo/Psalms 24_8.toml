[[commentary]]
quote='''
“Who is this King of glory?” Mortal nature is awe-struck in wonder, and asks, “Who is this King of glory?” “The Lord strong and mighty.” He whom thou didst deem weak and overwhelmed. “The Lord mighty in battle” (ver. 8). Handle the scars, and thou wilt find them made whole, and human weakness restored to immortality. The glorifying of the Lord, which was owing to earth, where It warred with death, hath been paid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252024.html'
source_title="Exposition on Psalm 24"
