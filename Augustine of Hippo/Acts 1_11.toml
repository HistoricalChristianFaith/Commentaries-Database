[[commentary]]
quote='''
The Scripture shows us more clearly that it is the Son that will appear. On the fortieth day after His resurrection He ascended into heaven, while His disciples were looking on; and they hear the angelic voice: "Men of Galilee," saith it, "why stand ye gazing up into heaven? This same that is taken up from you into heaven, shall so come in like manner as ye have seen Him going into heaven." In what manner did they see Him go? In the flesh, which they touched, which they handled. the wounds even of which they proved by touching; in that body in which He went in and out with them for forty days, manifesting Himself to them in truth, not in falsity; not a phantom, or shadow, or ghost, but, as Himself said, not deceiving them, "Handle and see, for a spirit hath not flesh and bones, as ye see me have." That body is now indeed worthy of a heavenly habitation, not being subject to death, nor mutable by the lapse of ages. It is not as it had grown to that age from infancy, so from the age of manhood declines to old age: He remains as He ascended, to come to those to whom He willed His word to be preached before He comes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252021.html'
source_title="Tractates on John 21"

[[commentary]]
quote='''
There was also the voice of the trumpet, the voice of Angels. For it is said, “Lift up thy voice like a trumpet.” Angels preached the ascension of the Lord: they saw the Disciples, their Lord ascending, tarrying, admiring, confounded, nothing speaking, but in heart jubilant: and now was the sound of the trumpet in the clear voice of the Angels, “Ye men of Galilee, why stand ye gazing up into Heaven? this is Jesus.” As if they knew not that it was the same Jesus. Had they not just before seen Him before them? Had they not heard Him speaking with them? Nay, they not only saw the figure of Him present, but handled also His limbs. Of themselves then knew they not, that it was the same Jesus? But they being by very admiration, from joy of jubilation, as it were transported in mind, the Angels said, “that same is Jesus.” As though they said, If ye believe Him, this is that same Jesus, whom crucified, your feet stumbled, whom dead and buried, ye thought your hope lost. Lo, this is the same Jesus. He hath gone up before you, “He shall so come in like manner as ye have seen Him go into Heaven.” His Body is removed indeed from your eyes, but God is not separated from your hearts: see Him going up, believe on Him absent, hope for Him coming; but yet through His secret Mercy, feel Him present. For He who ascended into Heaven that He might be removed from your eyes, promised unto you, saying, “Lo, I am with you always, even unto the end of the world.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
