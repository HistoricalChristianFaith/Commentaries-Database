[[commentary]]
quote='''
In a certain place in the Gospel, the Lord says that the prudent hearer of His word ought to be like a man who, wishing to build a house, digs deeply until he comes to the foundation of stability on the rock, and there establishes in security what he builds against the violence of the flood; so that, when the flood comes, it may be rather beaten back by the strength of the building. than bring ruin on that house by the force of its pressure. Let us regard the Scripture of God to be, as it were, the field where we wish to build something. Let us not be slothful, nor be content with the surface; let us dig deeply until we come to the rock: "And that rock was Christ."

The passage read to-day has spoken to us of the witness of the Lord, that He does not hold the witness of men necessary, but has a greater witness than men; and He has told us what this witness is: "The works," saith He, "which I do bear witness of me." Then He added, "And the Father that sent me beareth witness of me." The very works also which He doeth, He says that He has received from the Father. The works, therefore, bear witness, the Father bears witness. Has John borne no witness? He did clearly bear witness, but as a lamp; not to satisfy friends, but to confound enemies: for it had been predicted long before by the person of the Father, "I have prepared a lamp for mine Anointed: I will clothe His enemies with confusion; but upon Him shall flourish my sanctification." Be it that thou wert left in the dark in the night-time, thou didst direct thy attention to the lamp, thou didst admire the lamp, and didst exult at its light. But that lamp says that there is a sun, in which thou oughtest to exult; and though it burns in the night, it bids thee to be looking out for the day. Therefore it is not the case that there was no need of that man's testimony. For wherefore was he sent, if there was no need of him? But, on the contrary, lest man should stay at the lamp, and think the light of the lamp to be sufficient for him, therefore the Lord neither says that this lamp had been superfluous, nor yet doth He say that thou oughtest to stay at the lamp. The Scripture of God utters another testimony there undoubtedly God hath borne witness to His Son, and in that Scripture the Jews had placed their hope,-namely, in the law of God, given by Moses His servant. "Search the Scripture," saith He, "in which ye think ye have eternal life: the same bears witness of me; and ye will not come to me that ye may have life." Why do ye think that in the Scripture ye have eternal life? Ask itself to whom does it bear witness, and understand what is eternal life. And because for the sake of Moses they were willing to reject Christ, as an adversary to the ordinances and precepts of Moses, He convicts those same men as by another lamp.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252023.html'
source_title="Tractates on John 23"
