[[commentary]]
quote='''
So listen to this unity being even more urgently drawn to your attention: "I have other sheep," he says, "who are not of this fold." He was talking, you see, to the first sheepfold of the race of Israel according to the flesh. But there were others, of the race of the same Israel according to faith, and they were still outside, they were of the Gentiles, predestined but not yet gathered in. He knew those whom he had predestined. He knew those whom he had come to redeem by shedding his blood. He was able to see them, while they could not yet see him. He knew them, though they did not yet believe in him. "I have," he said, "other sheep that are not of this fold," because they are not of the race of Israel according to the flesh. But all the same, they will not be outside this sheepfold, because "I must bring them along too, so that there may be one flock and one shepherd."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520138.html'
source_title="SERMON 138.5"


[[commentary]]
quote='''
Let them all be in the one Shepherd and speak with the one voice of the Shepherd, which the sheep may hear and follow their shepherd, not this or that shepherd, but the one Shepherd. And in him let them all speak with one voice, not with conflicting voices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252046.html'
source_title="SERMON 46.30"


[[commentary]]
quote='''
(de Verb. Dom. s. 1) The sheep hitherto spoken of are those of the stock of Israel according to the flesh. But there were others of the stock of Israel, according to faith, Gentiles, who were as yet out of the fold; predestinated, but not yet gathered together. They are not of this fold, because they are not of the race of Israel, but they will be of this fold: Them also I must bring.

(Tr. xlvii. 4) What does He mean then when He says, I am not sent but unto the lost sheep of the house of Israel? Only, that whereas He manifested Himself personally to the Jews, He did not go Himself to the Gentiles, but sent others.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But of the one sheepfold and of the one Shepherd, you are now indeed being constantly reminded; for we have commended much the one sheepfold, preaching unity, that all the sheep should enter by Christ, and none of them should follow Donatus. Nevertheless, for what particular reason this was said by the Lord, is sufficiently apparent. For He was speaking among the Jews, and had been specially sent to the Jews, not for the sake of that class who were bound up in their inhuman hatred and persistently abiding in darkness, but for the sake of some in the nation whom He calls His sheep: of whom He saith, "I am not sent but to the lost sheep of the house of Israel." He knew them even amid the crowd of His raging foes, and foresaw them in the peace of believing. What, then, does He mean by saying, "I am not sent but to the lost sheep of the house of Israel," but that He exhibited His bodily presence only to the people of Israel? He did not proceed Himself to the Gentiles, but sent: to the people of Israel He both sent and came in person, that those who proved despisers should receive the greater judgment, because favored also with the sight of His actual presence. The Lord Himself was there: there He chose a mother: there He wished to be conceived, to be born, to shed His blood: there are His footprints, now objects of adoration where last He stood, and whence He ascended to heaven: but to the Gentiles He only sent.

But perhaps some one thinks that, as He Himself came not to us, but sent, we have not heard His own voice, but only the voice of those whom He sent. Far from it: let such a thought be banished from your hearts; for He Himself was in those whom He sent. Listen to Paul himself whom He sent; for Paul was specially sent as an apostle to the Gentiles; and it is Paul who, terrifying them not with himself but with Him saith, "Do ye wish to receive a proof of Him who speaketh in me, that is, of Christ?" Listen also to the Lord Himself. "And other sheep I have," that is, among the Gentiles, "which are not of this fold," that is, of the people of Israel: "them also must I bring." Therefore, even when it is by the instrumentality of His servants, it is He and not another that bringeth them. Listen further: "They shall hear my voice." See here also, it is He Himself who speaks by His servants, and it is His voice that is heard in those whom He sends. "That there may be one fold, and one shepherd." Of these two flocks, as of two walls, is the corner-stone formed. And thus is He both door and the corner-stone: all by way of comparison, none of them literally.

For I have said so before, and earnestly pressed it on your notice, and those who comprehend it are wise, yea, those who are wise do comprehend it; and yet let those who are not yet intellectually enlightened, keep hold by faith of what they cannot as yet understand. Christ is many things metaphorically, which strictly speaking He is not. Metaphorically Christ is both a rock, and a door, and a corner-stone, and a shepherd, and a lamb, and a lion. How numerous are such similitudes, and as many more as would take too long to enumerate! But if you select the strict significations of things as you are accustomed to see them, then He is neither a rock, for He is not hard and senseless; nor a door, for no artisan made Him; nor a corner-stone, for He was not constructed by a builder; nor a shepherd, for He is no keeper of four-footed animals; nor a lion, as it ranks among the beasts of the forest; nor a lamb, as it belongs to the flock. All such, then, are by way of comparison. But what is He properly? "In the beginning was the Word, and the Word was with God, and the Word was God [God was the Word]." And what, as He appeared in human nature? "And the Word was made flesh, and dwelt among us [in us]."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"
