[[commentary]]
quote='''
“Let Thy mercy, O Lord, be upon us, according as we have hoped in Thee” (ver. 22): let Thy mercy, O Lord, be upon us; for hope confoundeth not, because we have hoped in Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
