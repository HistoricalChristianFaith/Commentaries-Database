[[commentary]]
quote='''
"Heaven is my throne, while the earth is my footstool." … Haven't you also read that other text, "Who measured the heaven with the palm of his hand?" … Whoever sat in the palm of his own hand?…Does the same heaven become wide when he is sitting in it and narrow when he is measuring it? Or is God the same size in his seat as he is in his palm? If that is the case, God did not make us in his own likeness, because we have palms that are much narrower than the part of the body we sit with. But if he is as broad in the palm as he is broad in the beam, then he made very unequal parts for us. No, that is not where the likeness lies. Such an idol should be ashamed of itself in a Christian mind.
So then, take "heaven" as standing for all the saints, since earth too stands for all who are on the earth, "Let all the earth worship you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252053.html'
source_title="SERMON 53:13-14"

[[commentary]]
quote='''
Thou art become a heaven, and fearest thou the earth? For the Scripture saith in another passage, that the Lord our God doth declare, “The heaven is My throne.” If therefore even thou by having the fulness of knowledge, and by having love, hast been made the throne of God, thou hast become a heaven. For this heaven which we look up to with these eyes of ours, is not very precious before God. Holy souls are the heaven of God; the minds of the Angels, and all the minds of His servants, are the heaven of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"

[[commentary]]
quote='''
But consider, brethren, what he commandeth us to fall down before. In another passage of the Scriptures it is said, “The heaven is My throne, and the earth is My footstool.” Doth he then bid us worship the earth, since in another passage it is said, that it is God’s footstool? How then shall we worship the earth, when the Scripture saith openly, “Thou shalt worship the Lord thy God”? Yet here it saith, “fall down before His footstool:” and, explaining to us what His footstool is, it saith, “The earth is My footstool.” I am in doubt; I fear to worship the earth, lest He who made the heaven and the earth condemn me; again, I fear not to worship the footstool of my Lord, because the Psalm biddeth me, “fall down before His footstool.” I ask, what is His footstool? and the Scripture telleth me, “the earth is My footstool.” In hesitation I turn unto Christ, since I am herein seeking Himself: and I discover how the earth may be worshipped without impiety, how His footstool may be worshipped without impiety. For He took upon Him earth from earth; because flesh is from earth, and He received flesh from the flesh of Mary. And because He walked here in very flesh, and gave that very flesh to us to eat for our salvation; and no one eateth that flesh, unless he hath first worshipped: we have found out in what sense such a footstool of our Lord’s may be worshipped, and not only that we sin not in worshipping it, but that we sin in not worshipping.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252099.html'
source_title="Exposition on Psalm 99"
