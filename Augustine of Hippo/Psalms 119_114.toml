[[commentary]]
quote='''
He next addeth: “Thou art my helper and my taker up” (ver. 114): “my helper,” to do good works: “my taker up,” to escape evil ones. In the next words, “I have hoped more on Thy word,” he speaketh as a son of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
