[[commentary]]
quote='''
And now the other, in a perturbation of love and fear, and more frightened at the thought that Christ should be withheld from him, than even to see Him humbled at his feet, exclaims, "Lord, not my feet only, but also my hands and my head." Since this, indeed, is Thy threat, that my bodily members must be washed by Thee, not only do I no longer withhold the lowest, but I lay the foremost also at Thy disposal. Deny me not having a part with Thee, and I deny Thee not any part of my body to be washed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252056.html'
source_title="Tractates on John 56"
