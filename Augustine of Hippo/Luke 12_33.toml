[[commentary]]
quote='''
For wherefore art thou afflicted, O man, that thou hast given some things away to the poor, and hast lost certain other things? Seest thou not that it is what thou hast not given, that thou hast lost? Wherefore dost thou not attend to the voice of thy God? Where is thy faith? wherefore is it so fast asleep? Wake it up in thy heart. Consider what the Lord Himself said unto thee, while exhorting thee to good works of this kind: “Provide yourselves bags which wax not old; a treasure in the heavens that faileth not, where no thief approacheth.” Call this to mind therefore when you are lamenting over a loss. Wherefore dost thou lament, thou fool of little mind, or rather of unsound mind? Wherefore didst thou lose it, except that thou didst not lend it to Me? Wherefore didst thou lose it? Who has carried it off? Thou wilt answer, “A thief.” Was it not this, that I forewarned thee of? that thou shouldest not lay it up where the thief could approach? If then he who has lost anything, grieves, let him grieve for this, that he did not lay it up there, whence it could not be lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"


[[commentary]]
quote='''
And our Lord counselleth this: “Make for yourselves bags which wax not old, a treasure in the heavens that faileth not, where thief approacheth not, neither moth corrupteth.” God would not have thee lose thy wealth, but He hath given thee counsel to change the place thereof. Let your love understand. Suppose thy friend were just now to enter thy house, and find thou hadst placed thy store of grain in a damp place, and he knew the natural proneness of grain to decay, which thou perchance knewest not, he would give thee counsel of this sort, saying, “Brother, thou art losing what with great toil thou hast gathered, thou hast placed it in a damp place, in a few days this grain will decay.” “And what am I to do, brother? “Raise it into a higher place.” Thou wouldest hearken to thy friend suggesting that thou shouldest raise grain from a lower to a higher chamber, and dost thou not hearken to Christ charging thee to lift thy treasure from earth to heaven, where not what thou keepest in store may be paid to thee, but that thou mayest keep in store earth, mayest receive heaven, mayest keep in store things mortal, mayest receive things everlasting, that while thou lendest Christ to receive at thy hands but a small loan upon earth, He may repay thee a great recompense in Heaven?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
