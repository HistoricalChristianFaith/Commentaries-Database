[[commentary]]
quote='''
“I will confess to Thee for ever, because Thou hast done” (ver. 10). “Hast done what?” Doeg Thou hast condemned, David Thou hast crowned. “I will confess to Thee for ever, because Thou hast done.” Great confession, “Because thou hast done”! “Hast done” what? except these very things which above have been spoken of, that like an olive fruit-bearing in the house of God, I should trust in the mercy of God for everlasting and world without end? Thou hast done: an ungodly man cannot justify himself. But who is He that justifieth? “Believing,” he saith, “on Him” that justifieth “the ungodly.” “For what hast thou which thou hast not received? But if thou hast received, why dost thou glory as if thou hast not received, as if of thyself thou hast?” Be it far from me that I should so glory, saith he, that is opposed against Doeg, that beareth with Doeg upon earth, until he remove from his dwelling, and be rooted up from the land of the living. I glory not as if I have not received, but in God I glory. “And I will confess to Thee because Thou hast done,” that is, because Thou hast done not according to my merits, but according to Thy mercy. But I have done what? If thou recollectest, “Before, I was a blasphemer, and a persecutor, and injurious.” But thou, what hast thou done? “But mercy I have obtained, because ignorant I did it.” “I will confess to Thee for ever, because Thou hast done.”

“And I will look for Thy name, for it is pleasant.” Bitter is the world, but Thy name is pleasant. Even if certain sweet things are in the world, yet with bitterness they are digested. Thy name is preferred, not only for greatness but also for pleasantness. “For unjust men have told to me their delights, but it is not as Thy law, O Lord.” For if there were nothing sweet to the Martyrs, they would not have suffered with equanimity so great bitterness of tribulations. Their bitterness by any one was experienced, their sweetness easily could no one taste. The name of God therefore is pleasant to men loving God above all pleasantnesses. “I will look for Thy name, for it is pleasant.” And to what dost Thou prove that it is pleasant? Give me a palate to which it is pleasant. Praise honey as much as thou art able, exaggerate the sweetness thereof with what words thou shalt have the power: a man knowing not what honey is, unless he shall have tasted, what thou sayest knoweth not. Therefore the rather to the proof the Psalm inviting thee saith what? “Taste and see that sweet is the Lord.” Taste thou wilt not, and thou sayest, Is it pleasant? What is pleasant? If thou hast tasted, in thy fruit be it found, not in words alone, as it were only in leaves, lest by the curse of the Lord, to wither like that fig-tree thou shouldest deserve. “Taste,” he saith, “and see, that sweet is the Lord.” Taste and see: then ye shall see, if ye shall have tasted. But to a man not tasting, how provest thou? By praising the pleasantness of the name of God, whatsoever things thou shalt have said are words: something else is taste. The words of His praise there hear even the ungodly, but none taste how sweet it is, but the Saints. Further, a man discerning the sweetness of the name of God, and wishing to unfold and wishing to show the same, and not finding persons to whom he may unfold it; for to the Saints there is no need that he show it, because they even of themselves taste and know, but the ungodly cannot discern what they will not taste: doth, I say, what, because of the sweetness of the name of God? He hath borne him forthwith away from the crowds of the ungodly. “And I will look,” he saith, “for Thy name, for it is pleasant, in the sight of Thy Saints.” Pleasant is Thy name, but not in the sight of the ungodly. I know how sweet a thing it is, but it is to them that have tasted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252052.html'
source_title="Exposition on Psalm 52"
