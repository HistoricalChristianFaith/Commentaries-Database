[[commentary]]
quote='''
What then followeth? “Be still.” To what purpose? “And see that I am God” (ver. 10). That is, Not ye, but I am God. I created, I create anew; I formed, I form anew; I made, I make anew. If thou couldest not make thyself, how canst thou make thyself anew? This seeth not the contentious tumult of man’s soul; to which contentious tumult is it said, “Be still.” That is, restrain your souls from contradiction. Do not argue, and, as it were, arm against God. Else yet live thy arms, not yet burned up with fire. But if they are burned, “Be still;” because ye have not wherewith to fight. But if ye be still in yourselves, and from Me seek all, who before presumed on yourselves, then shall ye “see that I am God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252046.html'
source_title="Exposition on Psalm 46"
