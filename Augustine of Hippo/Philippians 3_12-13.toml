[[commentary]]
quote='''
The “end” he speaks of, is that which the Apostle fixed his eye upon, in his course; and made confession of his own infirmity, perceiving in himself a different state of things from that which he looked for elsewhere. For he says, “Not that I have already attained, or am already perfect. Brethren, I count not myself to have apprehended.” And that you might not say, “If the Apostle hath not apprehended, have I apprehended? If the Apostle is not perfect, am I perfect?”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
