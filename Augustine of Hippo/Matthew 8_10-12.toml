[[commentary]]
quote='''
Admiring at his faith, Jesus reprobates the Jews’ misbelief. For sound to themselves they seemed, whereas they were dangerously sick, when their Physician not knowing they slew. Therefore when He reprobated, and repudiated their pride what said he? “I say unto you, that many shall come from the east and west,” not belonging to the kindred of Israel: many shall come to whom He said, “O clap your hands, all ye nations;” “and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven.” Abraham begat them not of his own flesh; yet shall they come and sit down with him in the kingdom of heaven, and be his sons. Whereby his sons? Not as born of his flesh, but by following his faith. “But the children of the kingdom,” that is, the Jews, “shall be cast into outer darkness, there shall be weeping and gnashing of teeth.” They shall be condemned to outer darkness who are born of the flesh of Abraham, and they shall sit down with him in the kingdom of heaven, who have imitated Abraham’s faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252047.html'
source_title="Exposition on Psalm 47"
