[[commentary]]
quote='''
“For Thou shalt set them low.” For Thou shalt rank them among those from whom in degradation and contempt Thou wilt turn away. “In Thy leavings Thou shalt make ready their countenance” (ver. 12). And in these things that Thou leavest, that is, in the desires of an earthly kingdom, Thou shalt make ready their shamelessness for Thy passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
