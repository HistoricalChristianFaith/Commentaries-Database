[[commentary]]
quote='''
For while explaining our nature, that is, a sort of association of soul and body, and in these two parts a kind of intimacy of gluing and fastening together, the Apostle saith, that “we have a House not made with hands, everlasting in the Heavens:” that is, immortality prepared for us, wherewith we are to be clothed at the end, when we shall have risen from the dead; and he saith, “Wherein we are not willing to be stripped, but to be clothed upon, that the mortal may be swallowed up of life.” If it might so be, we should so will, he saith, to become immortal, as that now that same immortality might come, and now as we are it should change us, in order that this our mortal body by life should be swallowed up, and the body should not be laid aside through death, so as at the end again to have to be recovered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
