[[commentary]]
quote='''
“Thou, Lord, in the beginning hast laid the foundation of the earth: and the Heavens are the work of Thy hands” (ver. 25).…God laid the foundation of the earth, we know: the heavens are the works of His hands. For do not imagine that God doth one thing with His hand, another by His word. What He doth by His word, He doth by His hand: for He hath not distinct bodily members, who said, “I Am That I Am.” And perhaps His Word is His hand, assuredly His hand is His power. For inasmuch as it is said, “Let there be a firmament,” and there was a firmament; He is understood to have created it by His Word; but when He said, “Let Us make man in Our image, after Our likeness;” He seemeth to have created him by His hand. Hear therefore: “The heavens are the work of Thy hands.” Lo, what He created by His word, He created also by His hands; because He created them through His excellence, through His power. Observe rather what He created, and seek not to know in what manner He created them. It is much to thee to understand how He created them, since He created thyself so, that thou mayest first be a servant obeying, and afterwards perhaps a friend understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
