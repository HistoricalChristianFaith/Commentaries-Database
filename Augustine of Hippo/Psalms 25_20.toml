[[commentary]]
quote='''
“Keep my soul, and deliver me.” Keep my soul, that I turn not aside to imitate them; and draw me out from the confusion wherein they are mingled with me. “Let me not be confounded, for I have put my trust in Thee” (ver. 20). Let me not be confounded, if haply they rise up against me: for not in myself, but in Thee have I put my trust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
