[[commentary]]
quote='''
But whence shall we prove that sheep can be interpreted even, not of men, but of the blessed spirits of the angelical creatures on high? May we from the Lord’s saying that He had left ninety and nine sheep in the mountains, that is, in the higher regions, and had come down for one? For if we take the one lost sheep to be the human soul in Adam, since Eve even was made out of his side, for the spiritual handling and consideration of all which things this is not the time, it remains that, by the ninety and nine left in the mountains, spirits not human, but angelical, should be meant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"
