[[commentary]]
quote='''
Again, another sign which was given to Moses. For in like manner as above from the rod was a sign, so also from the right hand now. For when that thing had been done concerning the rod, God gave a second sign: “thrust,” He saith, “thine hand into thy bosom, and he thrust it: draw it forth, and he drew it forth: and it was found white,” that is, unclean. For whiteness on the skin is leprosy, not fairness of complexion. For the heritage of God itself, that is, His people, being cast out became unclean. But what saith He to him? Draw it back into thy bosom. He drew it back, and it was restored to its own colour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
