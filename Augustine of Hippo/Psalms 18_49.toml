[[commentary]]
quote='''
“For this cause will I confess to Thee among the Gentiles, O Lord” (ver. 49). For this cause shall the Gentiles confess to Thee through Me, O Lord. “And I will sing unto Thy Name.” And Thou shalt be more widely known by My good deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
