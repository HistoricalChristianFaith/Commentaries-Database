[[commentary]]
quote='''
Perhaps because [the psalm] said, "The Lord is sublime and observes lowly things," you say to yourself, "Then he does not observe me." What could be more unfortunate than you, if he does not observe you but ignores you? Observing indicates compassion; ignoring indicates contempt. But no doubt, because the Lord observes lowly things, you imagine you escape his notice, because you are not humble or lowly, you are high and mighty, you are proud. That is not the way to be missed by the eyes of God. I mean, just see what it says there: "The Lord is sublime." Sublime indeed. How are you going to get to him? Will you look for a ladder? Look for the wood of humility, and you have already gotten to him. "The Lord is sublime, he observes lowly things, but high and mighty things" (do not imagine you escape notice, you that are so proud) "but high and mighty things he knows from afar." He knows them, all right, but from afar. "Salvation is far from sinners."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252070A.html'
source_title="SERMON 70A.2"

[[commentary]]
quote='''
See how he willed that kings should sing on their way, humbly bearing the Lord, not lifting themselves up against the Lord. For if they lift themselves up, what follows? “For the Lord is high, and hath respect unto the lowly” (ver. 6). Do kings then desire that He have respect unto them? Let them be humble. What then? if they lift themselves up to pride, can they escape His eyes? Lest perchance, because thou hast heard, “He hath respect unto the lowly,” thou choose to be proud, and say in thy soul, God hath respect unto the lowly, He hath not respect unto me, I will do what I will. O foolish one! wouldest thou say this, if thou knewest what thou oughtest to love? Behold, even if God willeth not to see thee, dost thou not fear this very thing, that He willeth not to see thee?…The lofty then, it seemeth, He hath not respect unto, for it is the lowly He respecteth. “The lofty”—what? “He considereth from afar.” What then gaineth the proud? To be seen from afar, not to escape being seen. And think not that thou must needs be safe on that account, for that He seeth less clearly, who seeth thee from afar. For thou indeed seest not clearly, what thou seest from afar; God, although He see thee from afar, seeth thee perfectly, yet is He not with thee. This thou gainest, not that thou art less perfectly seen, but that thou art not with Him by whom thou art seen. But what doth the lowly gain? “The Lord is nigh unto them that are of a contrite heart.” Let the proud then lift himself up as much as he will, certainly God dwelleth on high, God is in heaven: wishest thou that He come nigh to thee? Humble thyself. For the higher will He be above thee, the more thou liftest thyself up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520138.html'
source_title="Exposition on Psalm 138"
