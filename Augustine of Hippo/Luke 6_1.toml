[[commentary]]
quote='''
Matthew continues his history in the following terms: "At that time Jesus went on the Sabbath-day through the corn; and His disciples were an hungered, and began to pluck the ears of corn, and to eat;" and so forth, on to the words, "For the Son of man is Lord even of the Sabbath-day." This is also given both by Mark and by Luke, in a way precluding any idea of antagonism. At the same time, these latter do not employ the definition "at that time." That fact, consequently, may perhaps make it the more probable that Matthew has retained the order of actual occurrence here, and that the others have kept by the order of their own recollections; unless, indeed, this phrase "at that time" is to be taken in a broader sense, that is to say, as indicating the period at which these many and various incidents took place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 34"
