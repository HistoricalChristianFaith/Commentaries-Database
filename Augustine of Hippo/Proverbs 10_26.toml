[[commentary]]
quote='''
Is then unrighteousness eaten? perhaps some one saith: what is it that he saith? Unrighteousness eaten? It is not I that say: hear the Scripture: “As a sour grape is vexation to the teeth, and smoke to the eyes, so is unrighteousness to them that use it.” For he that shall have eaten unrighteousness, that is, he that shall have had unrighteousness wilfully, shall not be able to eat righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
