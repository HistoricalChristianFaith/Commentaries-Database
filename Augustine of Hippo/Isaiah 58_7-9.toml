[[commentary]]
quote='''
You have heard from Isaiah, “Break thy bread to the hungry;” think not that fasting by itself is sufficient. Fasting chasteneth thine own self: it does not refresh others. Thy distress will profit thee, if thou affordest comfort to others. See, thou hast denied thyself; to whom wilt thou give that of which thou hast deprived thyself? Where wilt thou bestow what thou hast denied thyself? How many poor may be filled by the breakfast we have this day given up? Fast in such a way that thou mayest rejoice, that thou hast breakfasted, while another has been eating; fast on account of thy prayers, that thou mayest be heard in them. For He says in that passage, “Whilst thou art yet speaking I will say, Here I am,” provided thou wilt with cheerful mind “break thy bread to the hungry.” For generally this is done by men reluctantly and with murmurs, to rid themselves of the wearisome importunity of the beggar, not to refresh the bowels of him that is needy. But it is “a cheerful giver” that “God loves.” If thou givest thy bread reluctantly, thou hast lost both the bread, and the merit of the action. Do it then from the heart: that He “who seeth in secret,” may say, “whilst thou art yet speaking, Here I am.” How speedily are the prayers of those received, who work righteousness! And this is man’s righteousness in this life, fasting, alms, and prayer. Wouldest thou have thy prayer fly upward to God? Make for it those two wings of alms and fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252043.html'
source_title="Exposition on Psalm 43"
