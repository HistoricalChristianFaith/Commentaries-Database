[[commentary]]
quote='''
It can also be taken thus, “And now ye kings understand;” that is, And now that I am set as King, be ye not sad, kings of the earth, as if your excellency were taken from you, but rather “understand and be instructed.” For it is expedient for you, that ye should be under Him, by whom understanding and instruction are given you. And this is expedient for you, that ye lord it not with rashness, but that ye “serve the Lord” of all “with fear,” and “rejoice” in bliss most sure and most pure, with all caution and carefulness, lest ye fall therefrom into pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25202.html'
source_title="Exposition on Psalm 2"
