[[commentary]]
quote='''
Accordingly the heavens named above also may be interpreted as the same books, where he says, “For Thy glory hath been raised above the heavens:” so that the complete meaning should be this, “For Thy glory hath been raised above the heavens;” for Thy glory hath exceeded the declarations of all the Scriptures: “Out of the mouth of babes and sucklings Thou hast made perfect praise,” that they should begin by belief in the Scriptures, who would arrive at the knowledge of Thy glory: which hath been raised above the Scriptures, in that it passeth by and transcends the announcements of all words and languages. Therefore hath God lowered the Scriptures even to the capacity of babes and sucklings, as it is sung in another Psalm, “And He lowered the heaven, and came down:” and this did He because of the enemies, who through pride of talkativeness, being enemies of the cross of Christ, even when they do speak some truth, still cannot profit babes and sucklings. So is the enemy and defender destroyed, who, whether he seem to defend wisdom, or even the name of Christ, still, from the step of this faith, assaults that truth, which he so readily makes promise of. Whereby too he is convicted of not possessing it; since by assaulting the step thereof, namely faith, he knows not how one should mount up thereto. Hence then is the rash and blind promiser of truth, who is the enemy and defender, destroyed, when the heavens, the works of God’s fingers, are seen, that is, when the Scriptures, brought down even to the slowness of babes, are understood; and by means of the lowness of the faith of the history, which was transacted in time, they raise them, well nurtured and strengthened, unto the grand height of the understanding of things eternal, up to those things which they establish. For these heavens, that is, these books, are the works of God’s fingers; for by the operation of the Holy Ghost in the Saints they were completed. For they that have regarded their own glory rather than man’s salvation, have spoken without the Holy Ghost, in whom are the bowels of the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"
