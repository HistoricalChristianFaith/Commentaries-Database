[[commentary]]
quote='''
The wound of love is health-giving. The bride of Christ sings in the Song of Songs, "I am wounded with charity." When is this wound healed? When our desire is sated with good things. It's called a wound as long as we desire and don't yet have. Love, you see, in that case, is the same as if it were a pain. When we get there, when we have what we desire, the pain disappears, the love doesn't cease.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520298.html'
source_title="SERMON 298:2"

[[commentary]]
quote='''
“Thine arrows are sharp, are most powerful” (ver. 5); words that pierce the heart, that kindle love. Whence in the Song of Songs it is said, “I am wounded with love.” For she speaks of being “wounded with love;” that is, of being in love, of being inflamed with passion, of sighing for the Bridegroom, from whom she received the arrow of the Word. “Thine arrows are sharp, are most powerful;” both piercing, and effective; “sharp, most powerful.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"
