[[commentary]]
quote='''
But as even orphans may, without one to help them, and without a guardian, nevertheless increase amid trouble and want, and preserve their race by descent; he next saith, “Let his posterity be destroyed; and in the next generation let his name be clean put out” (ver. 12): that is, let what hath been generated by him generate no more, and quickly pass away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
