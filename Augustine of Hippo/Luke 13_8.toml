[[commentary]]
quote='''
(ubi sup.) Or, the husbandman who intercedes is every holy man who within the Church prays for them that are without the Church, saying, O Lord, O Lord, let it alone this year, that is, for that time vouchsafed under grace, until I dig about it. To dig about it, is to teach humility and patience, for the ground which has been dug is lowly. The dung signifies the soiled garments, but they bring forth fruit. The soiled garment of the dresser, is the grief and mourning of sinners; for they who do penance and do it truly are in soiled garments.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
What had evil fear done? It had dug up, as it were. For love doth inflame, fear doth humble: therefore, sins of evil love, with fire were lighted: sins of evil fear were dug up. On the one hand, evil fear doth humble, and good love doth light; but in different ways respectively. For even the husbandman interceding for the tree, that it should not be cut down, saith, “I will dig about it, and will apply a basket of dung.” The dug trench doth signify the godly humility of one fearing, and the basket of dung the profitable squalid state of one repenting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252080.html'
source_title="Exposition on Psalm 80"
