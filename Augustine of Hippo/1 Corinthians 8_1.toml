[[commentary]]
quote='''
Paul means that knowledge only does good in company with love. Otherwise it merely puffs a man into pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%25209.html'
source_title="City of God 9.20"

[[commentary]]
quote='''
Wherefore it is said that "the flesh profiteth nothing," in the same manner as it is said that "knowledge puffeth up." Then, ought we at once to hate knowledge? Far from it! And what means "Knowledge puffeth up"? Knowledge alone, without charity. Therefore he added, "but charity edifieth." Therefore add thou to knowledge charity, and knowledge will be profitable, not by itself, but through charity. So also here, "the flesh profiteth nothing," only when alone. Let the Spirit be added to the flesh, as charity is added to knowledge, and it profiteth very much.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252027.html'
source_title="Tractates on John 27"

[[commentary]]
quote='''
John says, "God is love." And thus the Pelagians affirm that they actually have God Himself, not from God, but from their own selves! and although they allow that we have the knowledge of the law from God, they will yet have it that love is from our very selves. Nor do they listen to the apostle when he says, "Knowledge puffeth up, but love edifieth." Now what can be more absurd, nay, what more insane and more alien from the very sacredness of love itself, than to maintain that from God proceeds the knowledge which, apart from love, puffs us up, while the love which prevents the possibility of this inflation of knowledge springs from ourselves? And again, when the apostle speaks of "the love of Christ as surpassing knowledge," what can be more insane than to suppose that the knowledge which must be subordinated to love comes from God, while the love which surpasses knowledge comes from man? The true faith, however, and sound doctrine declare that both graces are from God; the Scripture says, "From His face cometh knowledge and understanding;" and another Scripture says, "Love is of God." We read of "the Spirit of wisdom and understanding." Also of "the Spirit of power, and of love, and of a sound mind." But love is a greater gift than knowledge; for whenever a man has the gift of knowledge, love is necessary by the side of it, that he be not puffed up. For "love envieth not, vaunteth not itself, is not puffed up."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 40"
