[[commentary]]
quote='''
Now fasting, in its large and general sense, is to abstain from the iniquities and unlawful pleasures of the world, which is perfect fasting: "That, denying ungodliness and worldly lusts, we may live temperately, and righteously, and godly in this present world." What reward does the apostle join to this fast? He goes on to say: "Looking for that blessed hope, and the appearing of the glory of the blessed God, and our Saviour Jesus Christ." In this world, then, we celebrate, as it were, the forty days' abstinence, when we live aright, and abstain from iniquities and from unlawful pleasures. But because this abstinence shall not be without reward, we look for "that blessed hope, and the revelation of the glory of the great God, and of our Saviour Jesus Christ." In that hope, when the reality of the hope shall have come to pass, we shall receive our wages, a penny (denarius).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252017.html'
source_title="Tractates on John 17"
