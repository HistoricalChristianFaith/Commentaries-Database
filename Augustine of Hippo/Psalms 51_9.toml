[[commentary]]
quote='''
So all past sins are forgiven people on conversion; but for the rest of this life there are certain grave and deadly sins, from which one can be released only by the most vehement and distressing humbling of the heart and contrition of spirit and the pain of repentance. These are forgiven through the keys of the church. If you start judging yourself, you see, if you start being displeased with yourself, God will come along to show you mercy. If you are willing to punish yourself, he will spare you. In fact, all who repent and do penance well are punishing themselves. They have to be severe with themselves, so that God may be lenient with them. As David says, "Turn your face away from my sins, and blot out all my iniquities." But on what terms? He says in the same psalm, "Since I acknowledge my iniquity, and my sin is always before me." So if you acknowledge it, God overlooks it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520278.html'
source_title="SERMON 278:12"


[[commentary]]
quote='''
God does not listen to sinners. When he was beating his breast, he was punishing his sins; when he was punishing his sins, he was associating himself with God as judge. God, you see, hates sins; if you too hate them, you are beginning to join God, so that you can say to him, "Turn your face away from my sins." Turn your face away—but from what? From my sins. "Do not turn your face away from me." What's the meaning of "your face from my sins"? Don't see them, don't look at them; overlook them instead, so that you can pardon me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520136A.html'
source_title="SERMON 136A.2"

[[commentary]]
quote='''
Consider an instance in that penitential Psalm: “Hide Thy face from my sins.” Did he mean “from me”? No: for in another passage he says plainly, “Hide not Thy face from me.” “Turn” then “Thy face from my sins.” I would have Thee not see my sins. For God’s “seeing” is animadverting upon. Hence too a Judge is said to “animadvert” on that which he punishes; i.e. to turn his mind on it, to bend it thereon, even to the punishment of it, inasmuch as he is the Judge. So too is God a Judge. “Turn Thou Thy face from my sins.” But thou thyself, if thou wouldest have God turn “His face” from them, turn not thine own face from them. Observe how he proposes this to God in that very Psalm: “I acknowledge,” he says, “my transgression, and my sin is ever before me.” He would fain have that which he wishes to be ever before his own eyes, not be before God’s eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"

[[commentary]]
quote='''
“Turn Thou away Thy face from my sins, and all mine iniquities blot out” (ver. 9). For now bones humbled exult, now with hyssop cleansed, humble I have become. “Turn Thou away Thy face,” not from me, but “from my sins.” For in another place praying he saith, “Turn not away Thy face from me.” He that would not that God’s face be turned away from himself, would that God’s face be turned away from his sins. For to sin, when God turneth not Himself away, he adverteth: if he adverteth, he animadverteth. “And all mine iniquities blot out.” He is busied with that capital sin: he reckoneth on more, he would have all his iniquities to be blotted out: he relieth on the Physician’s hand, on that “great mercy,” upon which he hath called in the beginning of the Psalm: “All mine iniquities blot out.” God turneth away His face, and so blotteth out; by “turning away” His face, sins He blotteth out. By “turning towards,” He writeth them. Thou hast heard of Him blotting out by turning away, hear of Him by turning towards, doing what? “But the countenance of the Lord is upon men doing evil things, that He may destroy from the earth the remembrance of them:” He shall destroy the remembrance of them, not by “blotting out their sins.” But here he doth ask what? “Turn away Thy face from my sins.” Well he asketh. For he himself doth not turn away his face from his own sins, saying, “For my sin I acknowledge.” With reason thou askest and well askest, that God turn away from thy sin, if thou from thence dost not turn away thy face: but if thou settest thy sin at thy back, God doth there set His face. Do thou turn sin before thy face, if thou wilt that God thence turn away His face; and then safely thou askest, and He heareth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"

[[commentary]]
quote='''
Take heed therefore what ye do: for if He knoweth, He is not unobservant. It is better therefore that He be unobservant than known. For what is that same being unobservant, but not knowing? What is, not to know? Not to animadvert. For even as the act of one avenging animadversion is wont to be spoken of. Here one praying that He be unobservant: “Turn away Thy face from my sins.” What then wilt thou do if He shall have turned away His face from thee? A grievous thing it is, and to be feared, lest He forsake thee. Again, if He turn not away His face, He animadverteth. God knoweth this thing, God can do this thing, namely, both turn away face from one sinning, and not turn away from one confessing.…Confess therefore and invoke. For by confessing thou purgest the Temple, into which He may come, when invoked. Confess and invoke. May He turn away face from thy sins, not turn away from thee: turn away face from that which thou hast wrought, not turn away from that which He hath Himself wrought. For thee, as man, He hath Himself wrought, thy sins thou hast thyself wrought.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
