[[commentary]]
quote='''
“O fear the Lord, all ye His saints, for there is no want to them that fear Him” (ver. 9). For many therefore will not fear God the Lord, lest they suffer hunger. It is said to them, Defraud not; and they say, Whence can I feed myself? No art can be without imposture; no business can be without fraud. But fraud God punisheth: fear God. But if I should fear God, I shall not have whence to live. “O fear the Lord, all ye His saints, for there is no want to them that fear Him.” He promiseth plenty to him that trembleth, and doubteth, lest haply if he should fear God, he should lose things superfluous. The Lord fed thee despising Him, and will He desert thee fearing Him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
