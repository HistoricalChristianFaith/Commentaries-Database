[[commentary]]
quote='''
“And in it He hath prepared the instruments of death: He hath wrought His arrows for the burning” (ver. 13). That bow then I would readily take to be the Holy Scripture, in which by the strength of the New Testament, as by a sort of string, the hardness of the Old has been bent and subdued. From thence the Apostles are sent forth like arrows, or divine preachings are shot. Which arrows “He has wrought for the burning,” arrows, that is, whereby being stricken they might be inflamed with heavenly love. For by what other arrows was she stricken, who saith, “Bring me into the house of wine, place me among perfumes, crowd me among honey, for I have been wounded with love”? By what other arrows is he kindled, who, desirous of returning to God, and coming back from wandering, asketh for help against crafty tongues, and to whom it is said, “What shall be given thee, or what added to thee against the crafty tongue? Sharp arrows of the mighty, with devastating coals:” that is, coals, whereby, when thou art stricken and set on fire, thou mayest burn with so great love of the kingdom of heaven, as to despise the tongues of all that resist thee, and would recall thee from thy purpose, and to deride their persecutions, saying, “Who shall separate me from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword? For I am persuaded,” he says, “that neither death, nor life, nor angel, nor principality, nor things present, nor things to come, nor power, nor height, nor depth, nor other creature, shall be able to separate me from the love of God, which is in Christ Jesus our Lord.” Thus for the burning hath He wrought His arrows. For in the Greek copies it is found thus, “He hath wrought His arrows for the burning.” But most of the Latin copies have “burning arrows.” But whether the arrows themselves burn, or make others burn, which of course they cannot do unless they burn themselves, the sense is complete.

But since he has said that the Lord has prepared not arrows only, but “instruments of death” too, in the bow, it may be asked, what are “instruments of death”? Are they, peradventure, heretics? For they too, out of the same bow, that is, out of the same Scriptures, light upon souls not to be inflamed with love but destroyed with poison: which does not happen but after their deserts: wherefore even this dispensation is to be assigned to the Divine Providence, not that it makes men sinners, but that it orders them after they have sinned. For through sin reaching them with an ill purpose, they are forced to understand them ill, that this should be itself the punishment of sin: by whose death, nevertheless, the sons of the Catholic Church are, as it were by certain thorns, so to say, aroused from slumber, and make progress toward the understanding of the holy Scriptures. “For there must be also heresies, that they which are approved,” he says, “may be made manifest among you:” that is, among men, seeing they are manifest to God. Or has He haply ordained the same arrows to be at once instruments of death for the destruction of unbelievers, and wrought them burning, or for the burning, for the exercising of the faithful? For that is not false that the Apostle says, “To the one we are the savour of life unto life, to the other the savour of death unto death; and who is sufficient for these things?” It is no wonder then if the same Apostles be both instruments of death in those from whom they suffered persecution, and fiery arrows to inflame the hearts of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
