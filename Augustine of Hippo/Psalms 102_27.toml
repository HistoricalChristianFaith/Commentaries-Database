[[commentary]]
quote='''
For years of God have been also spoken of: “But Thou art the very Same, and Thy years shall not fail.” In the same manner as years, so days, so one day. Whatsoever thou wilt thou sayest of eternity. Whatever thou wilt thou sayest for this reason, because whatever thou shalt have said, it is too little that thou hast said. For thou must needs say somewhat, to the end that there may be something whereby thou mayest meditate on that which cannot be told.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252061.html'
source_title="Exposition on Psalm 61"

[[commentary]]
quote='''
The thrones of earthly kings are as the days of the earth: different are the days of Heaven from those of earth. The days of Heaven are those years of which it is said, “Thou art the same, and Thy years shall not fail.” The days of the earth are soon overtaken by their successors: those which precede are shut out from us: nor do those which succeed remain: but they come that they may go, and are almost gone before they are come. Such are the days of earth. But the days of Heaven, which are also the “One day” of Heaven, and the never failing years, have neither beginning nor end: nor is any day there narrowed between yesterday and to-morrow: no one there expects the future, nor loses the past: but the days of Heaven are always present, where His throne shall be for ever and ever.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"

[[commentary]]
quote='''
“But Thou art the same, and Thy years shall not fail” (ver. 27). But what are we to those years with these beggarly years? and what are they? Yet we ought not to despair. He had already said in His great and exceeding Wisdom, “I Am That I Am;” and yet He saith to console us, “I am the God of Abraham, and the God of Isaac, and the God of Jacob:” and we are Abraham’s seed: even we, although abject, although dust and ashes, trust in Him. We are servants: but for our sakes our Lord took the garb of a servant: for us who are mortal the Immortal One deigned to die, for our sakes He showed His example of resurrection. Let us therefore hope that we may reach these lasting years, in which days are not spent in a revolution of the Sun, but what is abideth even as it is, because it alone truly Is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
