[[commentary]]
quote='''
And as if to point out the cause why they are enemies of God’s people, he adds, “For Assur came with them.” Now Assur is often used figuratively for the devil, “who works in the children of disobedience,” as in his own vessels, that they may assail the people of God. “They have holpen the children of Lot,” he saith: for all enemies, by the working in them of the devil, their prince, “have holpen the children of Lot,” who is explained to mean “one declining.” But the apostate angels are well explained as the children of declension, for by declining from truth they swerved to become followers of the devil. These are they of whom the Apostle speaks: “Ye wrestle not against flesh and blood, but against principalities and powers, and the rulers of the darkness of this world, against spiritual wickedness in high places.” Those invisible enemies are holpen then by unbelieving men, in whom they work in order to assail the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252083.html'
source_title="Exposition on Psalm 83"
