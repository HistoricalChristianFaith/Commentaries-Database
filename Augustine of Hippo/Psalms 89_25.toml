[[commentary]]
quote='''
“I will set His hand also in the sea” (ver. 25): that is, He shall rule over the Gentiles; “and His right hand in the floods.” Rivers run into the sea: avaricious men roll onwards into the bitterness of this world: yet all these kinds of men will be subject to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
