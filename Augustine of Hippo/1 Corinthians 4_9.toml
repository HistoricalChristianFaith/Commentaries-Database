[[commentary]]
quote='''
“For we have been made a spectacle unto this world, and unto angels, and unto men:” to angels who praise, to men who censure, us; or rather to angels, some of whom praise, some of whom are censuring us: and to men also, some of whom are praising, and some censuring us.…Both the one and the other are arms to us: the one “on the right hand,” the other “on the left:” arms however they are both of them; both of these kinds of arms, both those “on the right hand,” and those “on the left;” both those who praise, and those who censure; both those who pay us honour, and those who heap dishonour upon us; with both these kinds I contend against the devil; with both of these I smite him; I defeat him with prosperity, if I be not corrupted by it; by adversity, if I am not broken in spirit by it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252039.html'
source_title="Exposition on Psalm 39"
