[[commentary]]
quote='''
“The ungodly walk in a circle round about” (ver. 8): that is, in the desire of things temporal, which revolves as a wheel in a repeated circle of seven days; and therefore they do not arrive at the eighth, that is, at eternity, for which this Psalm is entitled. So too it is said by Solomon, “For the wise king is the winnower of the ungodly, and he bringeth on them the wheel of the wicked.—After Thine height Thou hast multiplied the sons of men.” For there is in temporal things too a multiplication, which turns away from the unity of God. Hence “the corruptible body weigheth down the soul, and the earthy tabernacle presseth down the mind that museth upon many things.” But the righteous are multiplied “after the height of God,” when “they shall go from strength to strength.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252012.html'
source_title="Exposition on Psalm 12"

[[commentary]]
quote='''
What is, “their going about”? How they go about and stand not, how they go in the circle of error, where is journeying without end. He who goeth in a straight line, beginneth from some point, endeth at some point: he who goeth in a circle, never endeth. That is the toil of the wicked, which is set forth yet more plainly in another Psalm, “The wicked walk in a circle.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520140.html'
source_title="Exposition on Psalm 140"
