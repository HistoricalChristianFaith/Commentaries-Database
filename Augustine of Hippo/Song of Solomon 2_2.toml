[[commentary]]
quote='''
But would you like to know what is said to this lady somewhere else, in the Song of Songs? "Like a lily in the midst of thorns, so is my darling in the midst of the daughters." An extraordinary saying—he called the same people both thorns and daughters. And do those thorns do mightily? They do indeed. Can't you see how these heresies too pray, fast, give alms, praise Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252037.html'
source_title="SERMON 37:27"

[[commentary]]
quote='''
So those who have the Sacraments, and have not good manners, are both said to be of God, and not of God; are both said to be His, and to be strangers: His because of His own Sacraments, strangers because of their own vice. So also strange daughters: daughters, because of the form of godliness; strange, because of their loss of virtue. Be the lily there; let it receive the Mercy of God: hold fast the root of a good flower, be not ungrateful for soft rain coming from heaven. Be thorns ungrateful, let them grow by the showers: for the fire they grow, not for the garner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
