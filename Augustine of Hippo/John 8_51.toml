[[commentary]]
quote='''
(Tr. xliii. 10, 11) See is put for experience. But since, about to die Himself, He spoke with those about to die, what means this, If a man keep My saying, he shall never see death? What, but that He saw another death from which He came to free us, death eternal, the death of the damned, which is shared with the devil and his angels! That is the true death: the other is a passage only.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Thus spake the Lord (it is scarcely sufficient to say), as one dying to dying men; for "to the Lord also belong the issues from death," as saith the psalm. Seeing, then, He was both speaking to those destined to die, and speaking as one appointed to death Himself, what mean His words, "He who keepeth my saying shall never see death;" save that the Lord saw another death, from which He was come to deliver us-the second death, death eternal, the death of hell, the death of damnation with the devil and his angels? This is real death; for that other is only a removal. What is that other death? The leaving of the body-the laying down of a heavy burden; provided another burden be not carried away, to drag the man headlong to hell. Of that real death then did the Lord say, "He who keepeth my saying shall never see death."

Let us not be frightened at that other death, but let us fear this one. But, what is very grievous, many, through a perverse fear of that other, have fallen into this. It has been said to some, Adore idols; for if you do it not, you shall be put to death: or, as Nebuchadnezzar said, If you do not, you shall be thrown into the furnace of flaming fire. Many feared and adored. Shrinking from death, they died. Through fear of the death which cannot be escaped, they fell into that which they might happily have escaped, had they not, unhappily, been afraid of that which is inevitable. As a man, thou art born-art destined to die. Whither wilt thou go to escape death? What wilt thou do to escape it? That thy Lord might comfort thee in thy necessary subjection to death, of His own good pleasure He condescended to die. When thou seest the Christ lying dead, art thou reluctant to die? Die then thou must; thou hast no means of escape. Be it today, be it tomorrow; it is to be-the debt must be paid. What, then, does a man gain by fearing, fleeing, hiding himself from discovery by his enemy? Does he get exemption from death? No, but that he may die a little later. He gets not security against his debt, but asks a respite. Put it off as long as you please, the thing so delayed will come at last. Let us fear that death which the three men feared when they said to the king, "God is able to deliver us even from that flame; and if not," etc. There was there the fear of that death which the Lord now threatens, when they said, But also if He be not willing openly to deliver us, He can crown us with victory in secret. Whence also the Lord, when on the eve of appointing martyrs and becoming the head-martyr Himself, said, "Be not afraid of them that kill the body, and after that have no more that they can do."How "have they no more that they can do"? What if, after having slain one, they threw his body to be mangled by wild beasts, and torn to pieces by birds? Cruelty seems still to have something it can do. But to whom is it done? He has departed. The body is there, but without feeling. The tenement lies on the ground, the tenant is gone. And so "after that they have no more that they can do;" for they can do nothing to that which is without sensation. "But fear Him who hath power to destroy both body and soul, in hell fire." Here is the death that He spake of when He said, "He that keepeth my saying shall never see death." Let us keep then, brethren, His own word in faith, as those who are yet to attain to sight, when the liberty we receive has reached its fullness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252043.html'
source_title="Tractates on John 43"
