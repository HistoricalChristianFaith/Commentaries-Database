[[commentary]]
quote='''
Zacchæus had a strong will, Zacchæus had great charity.…Did then that widow who cast her two farthings into the treasury, sow little? Nay, as much as Zacchæus. For she had narrower means, but an equal will. She gave her two mites with as good a will as Zacchæus gave the half of his patrimony. If thou consider what they gave, thou wilt find their gifts different; if thou look to the source, thou wilt find them equal; she gave whatever she had, and he gave what he had.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520126.html'
source_title="Exposition on Psalm 126"
