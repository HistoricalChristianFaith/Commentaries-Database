[[commentary]]
quote='''
So someone says, "What's the use of the church, if you can confess, and be brought back to life by the voice of the Lord and come out immediately?" "What use is the church to you as you confess—the church to which the Lord said, 'What you loose on earth shall be loosed in heaven?' " Look at Lazarus's case. He came out, all tied up. He was already alive, by confessing, but he was not yet walking around freely, being still entangled with the bandages. So what does the church do, told as it has been, "Whatever you loose shall be loosed"? The church does what the Lord went on at once to tell the disciples, of course: "Unbind him and let him go."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252067.html'
source_title="SERMON 67.3"

[[commentary]]
quote='''
The remission of sins, is the loosing. For what would it have profited Lazarus, that he came forth from the tomb, unless it were said to him, “loose him, and let him go”? Himself indeed with His voice aroused him from the tomb, Himself restored his life by crying unto him, Himself overcame the mass of earth that was heaped upon the tomb, and he came forth bound hand and foot: not therefore with his own feet, but by the power of Him who drew him forth. This taketh place in the heart of the penitent: when thou hearest a man is sorry for his sins, he hath already come again to life; when thou hearest him by confessing lay bare his conscience, he is already drawn forth from the tomb, but he is not as yet loosed. When is he loosed, and by whom is he loosed? “Whatsoever thou shalt loose on earth,” He saith, “shall be loosed in Heaven.” Forgiveness of sins may justly be granted by the Church: but the dead man himself cannot be aroused except by the Lord crying within him; for God doth this within him. We speak to your ears: how do we know what may be going on in your hearts? But what is going on within, is not our doing, but His.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
