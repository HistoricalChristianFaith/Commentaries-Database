[[commentary]]
quote='''
But why sinners have this, he saith briefly: “Because there is no avoidance of their death, and there is a firmament in their scourge” (ver. 4). Now I have perceived, he saith, why they have peace, and flourish on the earth; because of their death there is no avoidance, because death sure and eternal doth await them, which neither doth avoid them, nor can they avoid it, “because there is no avoidance of their death, and there is a firmament in their scourge.” And there is a firmament in their scourge. For their scourge is not temporal, but firm for everlasting. Because of these evil things then which are to be to them eternal, now what? “In the labours of men they are not, and with men they shall not be scourged” (ver. 5). Doth not even the devil himself escape scourging with men, for whom nevertheless an eternal punishment is being prepared?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
