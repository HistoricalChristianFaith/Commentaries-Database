[[commentary]]
quote='''
(Tr. lxvii. 2) And as the disciples were afraid for themselves, when Peter, the boldest and most zealous of them, had been told, The cock shall not crow, till thou hast denied Me thrice, He adds, In My Father's house are many mansions, by way of an assurance to them in their trouble, that they might with confidence and certainty look forward, after all their trials, to dwelling together with Christ in the presence of God. For though one man is bolder, wiser, juster, holier than another, yet no one shall be removed from that house of God, but each receive a mansion suited to his deserts. The penny indeed which the householder paid to the labourers who worked in his vineyard, was the same to all; for life eternal, which this penny signifies, is of the same duration to all. But there may be many mansions, many degrees of dignity, in that life, corresponding to people's deserts.

(Tr. lxvii. 2) And thus God will be all in all; that is, since God is love, love will bring it to pass, that what each has, will be common to all. That which one loves in another is one's own, though one have it not one's self. And then there will be no envy at superior grace, for in all hearts will reign the unity of love.

(Tr. lxvii. 3) But they are rejected by the Christians, who infer from there being many mansions that there is a place outside the kingdom of heaven, where innocent souls, that have departed this life without baptism, and could not there enter into the kingdom of heaven, remain happy. But God forbid, that when every house of every heir of the kingdom is in the kingdom, there should be a part of the regal house itself not in the kingdom. Our Lord does not say, In eternal bliss are many mansions, but they are in My Father's house.

He means evidently that there are already many mansions, and that there is no need of His preparing one.

(Tract. lxviii. 1) But why does He go and prepare a place, if there are many mansions already? Because these are not as yet so prepared as they will be. The same mansions that He hath prepared by predestination, He prepares by operation. They are prepared already in respect of predestination; if they were not, He would have said, I will go and prepare, i. e. predestinate, a place for you; but inasmuch as they are not yet prepared in respect of operation, He says, And if I go and prepare a place for you. And now He is preparing mansions, by preparing occupants for them. Indeed, when He says, In My Father's house are many mansions, what think we the house of God to be but the temple of God, of which the Apostle saith, The temple of God is holy, which temple ye are. (1 Cor. 3:17) This house of God then is now being built, now being prepared. (c. 3.). But why has He gone away to prepare it, if it is ourselves that He prepares: if He leaves us, how can He prepare us? The meaning is, that, in order that those mansions may be prepared, the just must live by faith: and if thou seest, there is no faith. Let Him go away then, that He be not seen; let Him be hid, that He be believed. Then a place is prepared, if thou live by faith: let faith desire, that desire may enjoy. If thou rightly understandest Him, He never leaves either the place He came from, or that He goes from. He goes, when He withdraws from sight, He comes, when He appears. But except He remain in power, that we may grow in goodness, no place of happiness will be prepared for us.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We acknowledge, beloved brethren, that we are owing you, and ought now to repay, what was left over for consideration, how we can understand that there is no real mutual contrariety between these two statements, namely, that after saying, "In my Father's house are many mansions: if it were not so, I would have told you, that I go to prepare a place for you;"-where He makes it clear enough that He said so to them for the very reason that there are many mansions there already, and there is no need of preparing any; -the Lord again says: "And if I go and prepare a place for you, I will come again and receive you unto myself; that where I am, there ye may be also." How is it that He goes and prepares a place, if there are many mansions already? If there were not such, He would have said, "I go to prepare." Or if the place has still to be prepared, would He not then also properly have said, "I go to prepare"? Are these mansions in existence already, and yet needing still to be prepared? For if they were not in existence, He would have said, "I go to prepare." And yet, because their present state of existence is such as still to stand in need of preparation, He does not go to prepare them in the same sense as they already exist; but if He go and prepare them as they shall be hereafter, He will come again and receive His own to Himself: that where He is, there they may be also. How then are there mansions in the Father's house, and these not different ones but the same, which already exist in a sense in which they can admit of no preparation, and yet do not exist, inasmuch as they are still to be prepared? How are we to think of this, but in the same way as the prophet, who also declares of God, that He has [already] made that which is yet to be. For he says not, Who will make what is yet to be, but, "Who has made what is yet to be." Therefore He has both made such things and is yet to make them. For they have not been made at all if He has not made them; nor will they ever be if He make them not Himself. He has made them therefore in the way of fore-ordaining them; He has yet to make them in the way of actual elaboration. Just as the Gospel plainly intimates when He chose His disciples, that is to say, at the time of His calling them; and yet the apostle says, "He chose us before the foundation of the world," to wit, by predestination, not by actual calling. "And whom He did predestinate, them He also called;" He hath chosen by predestination before the foundation of the world, He chooses by calling before its close. And so also has He prepared those mansions, and is still preparing them and He who has already made the things which are yet to be, is now preparing, not different ones, but the very mansions He has already prepared: what He has prepared in predestination, He is preparing by actual working. Already, therefore; they are, as respects predestination; if it were not so, He would have said, I will go and prepare, that is, I will predestinate. But because they are not yet in a state of practical preparedness He says, "And if I go and prepare a place for you, I will come again, and receive you unto myself."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252068.html'
source_title="Tractates on John 68"
