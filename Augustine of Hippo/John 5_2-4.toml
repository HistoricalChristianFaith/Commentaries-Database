[[commentary]]
quote='''
Moses wrote five books: but in the five porches encircling the pool, sick men were lying, but they could not be healed. See how the letter remained, convicting the guilty, not saving the unrighteous. For in those five porches, a figure of the five books, sick men were given over rather than made whole. What then in that place did make whole a sick man? The moving of the water. When that pool was moved there went down a sick man, and there was made whole one, one because of unity: whatsoever other man went down unto that same moving was not made whole. How then was there commended the unity of the Body crying from the ends of the earth? Another man was not healed, except again the pool were moved. The moving of the pool then did signify the perturbation of the people of the Jews when the Lord Jesus Christ came. For at the coming of an Angel the water in the pool was perceived to be moved. The water then encircled with five porches was the Jewish nation encircled by the Law. And in the porches the sick lay, and in the water alone when troubled and moved they were healed. The Lord came, troubled was the water; He was crucified, may He come down in order that the sick man may be made whole. What is, may He come down? May He humble Himself. Therefore whosoever ye be that love the letter without grace, in the porches ye will remain, sick ye will be, lying ill, not growing well.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
[[commentary]]
quote='''
But what saith the Apostle? “Where sin abounded, grace hath much more abounded;” that is, the disease increased, the medicine became of more avail. Accordingly, my brethren, did those five porches of Solomon, in the middle of which the pool lay, heal the sick at all? The sick, says the Evangelist, lay in the five porches. In the Gospel we have and read it. Those five porches are the law in the five books of Moses. For this cause the sick were brought forth from their houses that they might lie in the porches. So the law brought the sick men forth, but did not heal them: but by the blessing of God the water was disturbed, as by an Angel descending into it. At the sight of the water troubled, the one person who was able, descended and was healed. That water surrounded by the five porches, was the people of the Jews shut up in their law. The Lord came and disturbed this people, so that He Himself was slain. For if the Lord had not troubled the Jews by coming down to them, would He have been crucified? So that the troubled water signified the Passion of the Lord, which arose from His troubling the Jewish people. The sick man who believeth in this Passion, like him who descended into the troubled water, is healed thereby. He whom the Law could not heal, that is, while he lay in the porches, is healed by grace, by faith in the Passion of our Lord Jesus Christ.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252084.html'
source_title="Exposition on Psalm 84"

[[commentary]]
quote='''
For the Law was given with this view, that the sick might be convinced of his infirmity, and pray for the physician. This is the hidden way of God. Thou hadst long ago heard, “Who healeth all thine infirmities.” Their infirmities were as yet hidden in the sick; the five books were given to Moses: the pool was surrounded by five porches; he brought forth the sick, that they might lie there, that they might be made known, not that they might be healed. The five porches discovered, but healed not, the sick; the pool healed when one descended, and this when it was disturbed: the disturbance of the pool was in our Lord’s Passion.…Since therefore this is a mystery there, he teacheth that the Law was given that sinners might be convinced of their sin, and call upon the Physician in order to receive grace.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
