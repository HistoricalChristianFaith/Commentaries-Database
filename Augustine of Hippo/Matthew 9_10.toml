[[commentary]]
quote='''
Matthew has not said in whose house Jesus sat at meat (on this occasion), from which we might suppose, that this was not told in its proper order, but that what took place at some other time is inserted here as it happened to come into his mind; did not Mark and Luke who relate the same show that it was in Levi's, that is, in Matthew's house.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew, accordingly, goes on to say: "And it came to pass, as He sat at meat in the house, behold, many publicans and sinners came and sat down with Jesus and His disciples;" and so on, down to where we read, "But they put new wine into new bottles, and both are preserved." Here Matthew has not told us particularly in whose house it was that Jesus was sitting at meat along with the publicans and sinners. This might make it appear as if he had not appended this notice in its strict order here, but had introduced at this point, in the way of reminiscence, something which actually took place on a different occasion, were it not that Mark and Luke, who repeat the account in terms thoroughly similar, have made it plain that it was in the house of Levi—that is to say, Matthew—that Jesus sat at meat, and all these sayings were uttered which follow. For Mark states the same fact, keeping also the same order, in the following manner: "And it came to pass, as He sat at meat in his house, many publicans and sinners sat also together with Jesus." Accordingly, when he says, "in his house," he certainly refers to the person of whom he was speaking directly before, and that was Levi. To the same effect, after the words, "He saith unto him, Follow me; and he left all, rose up, and followed Him," Luke has appended immediately this statement: "And Levi made Him a great feast in his own house: and there was a great company of publicans and of others that sat down with them." And thus it is manifest in whose house it was that these things took place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 27"
