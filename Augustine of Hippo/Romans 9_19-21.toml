[[commentary]]
quote='''
This conclusion having been drawn, he introduces a question as if from an objector. For he says: You will say to me then: Why does he still find fault? For who resists his will? To which inquiry he replies in such a way that we may understand that to spiritual men, who no longer live according to the earthly man, the first merits of faith and of ungodliness can lie open—how God, foreknowing, chooses those who will believe and condemns the unbelieving, neither choosing the former for their works nor condemning the latter for their works, but granting to the faith of the former that they may work well, and hardening the ungodliness of the latter by abandoning them, so that they may work evil. And because this understanding, as I said, lies open to the spiritual, but is far removed from carnal prudence, he thus refutes the inquirer, so that he may understand that he must first put off the man of clay, in order to be worthy to investigate these things through the spirit. And so he says: O man, who are you who answer back to God? Does the thing formed say to him who formed it: Why have you made me thus? Or does not the potter have power over the clay, from the same lump to make one vessel unto honor and another unto dishonor? As long as you are a thing formed, he says, and belong to the lump of clay, not yet brought to spiritual things, so as to be a spiritual man judging all things and judged by no one, you ought to restrain yourself from an inquiry of this kind and not answer back to God. For whoever desires to know his counsel must first be received into his friendship—which cannot happen except to the spiritual, who now bear the image of the heavenly man. For he now says: I will not call you servants but friends, for all the things which I have heard from my Father I have made known to you. And so, as long as you are an earthen vessel, this very thing in you must first be broken by that iron rod, of which it is said: You shall rule them with an iron rod, and you shall break them in pieces like a potter's vessel, so that, with the outer man destroyed and the inner renewed, you may be able, rooted and grounded in love, to comprehend the breadth, length, height, and depth, and to know also the surpassing knowledge of the love of God. Now, therefore, when out of the same lump God makes some vessels unto honor and others unto dishonor, it is not yours to examine this, whoever you are who still live according to this lump, that is, who are wise with an earthly and carnal sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
