[[commentary]]
quote='''
We have heard now, brethren, that which day by day is not kept secret: let us hear now what He hath cried through these pillars.…He crieth what? “I have said to unjust men, Do not unjustly” (ver. 4).…But already they have done, and they are guilty: already there hath flowed down the earth, and all they that dwell therein. Pricked to the heart were they that crucified Christ, they acknowledged their sin, they learned something of the Apostle, that they might not despair of the pardon of the Preacher. For as Physician He had come, and therefore had not come to the whole. “For there is no need,” He saith, “to the whole of a physician, but to them that are sick. I have not come to call righteous men, but sinners to repentance.” Therefore, “I have said to unjust men, Do not unjustly.” They heard not. For of old to us it was spoken: we heard not, we fell, were made mortal, were begotten mortal: the earth flowed down. Let them hear the Physician even now in order that they may rise, Him that came to the sick man, Him whom they would not hear when whole in order that they might not fall, let them hear when lying down in order that they may rise.…“I have said to unjust men, Do not unjustly; and to the delinquent, Do not exalt your horn.” There shall be exalted in you the horn of Christ, if your horn be not exalted. Your horn is of iniquity, the horn of Christ is of majesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252075.html'
source_title="Exposition on Psalm 75"
