[[commentary]]
quote='''
Because then, though having become a beast, I departed not from my God, there followeth, “Thou hast held the hand of my right hand.” He hath not said my right hand, but “the hand of my right hand.” If the hand of the right hand it is, a hand hath a hand. “The hand Thou hast held of my right hand,” in order that Thou mightest conduct me. For what hath he put hand? For power. For we say that a man hath that in his hand which he hath in his power: just as the devil said to God concerning Job, “Lay to Thine hand, and take away the things which he hath.” What is, lay to Thine hand? Put forth power. The hand of God he hath called the power of God: as hath been written in another place, “death and life are in the hands of the tongue.” Hath the tongue hands? But what is, in the hands of the tongue? In the power of the tongue. What is, in the power of the tongue? “Out of thy mouth thou shalt be justified, and out of thy mouth thou shalt be condemned.” “Thou hast held,” therefore, “the hand of my right hand,” the power of my right hand. What was my right hand? That I was alway with Thee. Unto the left I was holding, because I became a beast, that is, because there was an earthly concupiscence in me: but the right was mine, because I was alway with thee. Of this my right hand Thou hast held the hand, that is, hast directed the power. What power? “He gave them power to become sons of God.” He is beginning now to be among the sons of God, belonging to the New Testament. See in what manner the hand of his right hand was held.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
