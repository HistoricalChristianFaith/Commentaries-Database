[[commentary]]
quote='''
This is also a matter which requires some consideration,—namely, the question how it is said here, "Ye shall not see me henceforth, till ye shall say, Blessed is He that cometh in the name of the Lord," when, according to this same Matthew, they had already expressed themselves to this effect. Besides, Luke likewise tells us that a reply containing these very words had previously been returned by the Lord to the persons who had counselled Him to leave their locality, because Herod sought to kill Him. That evangelist represents these self-same terms, which Matthew records here, to have been employed by Him in the declaration which He directed on that occasion against Jerusalem itself. For Luke's narrative proceeds in the following manner: "The same day there came certain of the Pharisees, saying unto Him, Get thee out, and depart hence: for Herod will kill thee. And He said unto them, Go ye and tell that fox, Behold, I cast out devils, and I do cures to-day and to-morrow, and the third day I am perfected. Nevertheless, I must walk to-day, and to-morrow, and the day following; for it cannot be that a prophet perish out of Jerusalem. O Jerusalem, Jerusalem, which killest the prophets, and stonest them that are sent unto thee; how often would I have gathered thy children together, as a hen doth gather her brood under her wings, and ye would not! Behold, your house shall be left unto you desolate: and I say unto you, that ye shall not see me until the time come when ye shall say, Blessed is He that cometh in the name of the Lord." There does not seem, however, to be anything contradictory to the narration thus given by Luke in the circumstance that the multitudes said, when the Lord was approaching Jerusalem, "Blessed is He that cometh in the name of the Lord." For, according to the order which is followed by Luke, He had not yet come to the scene in question, and the words had not been uttered. But since he does not tell us that He did actually leave the place at that time, not to return to it until the period came when such words would be spoken by them (for He continues on His journey until he arrives at Jerusalem; and the saying, "Behold, I cast out devils, and I do cures to-day and to-morrow, and the third day I am perfected," is to be taken to have been uttered by Him in a mystical and figurative sense: for certainly He did not suffer at a time answering literally to the third day after the present occasion; nay, He immediately goes on to say, "Nevertheless, I must walk to-day, and to-morrow, and the day following"), we are indeed constrained also to put a mystical interpretation upon the sentence, "Ye shall not see me henceforth, until the time come when ye shall say, Blessed is He that cometh in the name of the Lord," and to understand it to refer to that advent of His in which He is to come in His effulgent brightness; it being thereby also implied, that what He expressed in the declaration, "I cast out devils, and I do cures to-day and to-morrow, and the third day I am perfected," bears upon His body, which is the Church. For devils are cast out when the nations abandon their ancestral superstitions and believe on Him; and cures are wrought when men renounce the devil and this world, and live in accordance with His commandments, even unto the consummation of the resurrection, in which there shall, as it were, be realized that perfecting on the third day; that is to say, the Church shall be perfected up to the measure of the angelic fulness through the realized immortality of the body as well as the soul. Therefore the order followed by Matthew is by no means to be understood to involve a digression to another connection. But we are rather to suppose, either that Luke has antedated the events which took place in Jerusalem, and has introduced them at this point simply as they were here suggested to his recollection, before his narrative really brings the Lord to Jerusalem; or that the Lord, when drawing near the same city on that occasion, did actually reply to the persons who counselled Him to be on His guard against Herod, in terms resembling those in which Matthew represents Him to have spoken also to the multitudes at a period when He had already arrived in Jerusalem, and when all these events had taken place which have been detailed above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 75"
