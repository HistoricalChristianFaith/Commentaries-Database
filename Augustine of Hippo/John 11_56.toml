[[commentary]]
quote='''
"Then sought they for Jesus:" but with evil intent. For happy are they who seek for Jesus in a way that is good. They sought for Him, with the intent that neither they nor we should have Him more: but in departing from them, He has been received by us. Some who seek Him are blamed, others who do so are commended; for it is the spirit animating the seeker that finds either praise or condemnation. Thence you have it also in the psalms, "Let them be confounded and put to shame that seek after my soul:" such are those who sought with evil purpose. But in another place he says, "Refuge hath failed me, and there is no one that seeketh after my soul." Those who sought, and those who did not, are blamed alike. Therefore let us seek for Christ, that He may be ours, that we may keep Him, and not that we may slay Him; for these men sought to get hold of Him, but only for the purpose of speedily getting quit of Him for ever. "Therefore they sought for Him, and spake among themselves: What think ye, that He will not come to the feast?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
