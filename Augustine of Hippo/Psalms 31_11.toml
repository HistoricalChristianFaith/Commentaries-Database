[[commentary]]
quote='''
“I have been made a reproach above all mine enemies” (ver 11). All the wicked are my enemies; and nevertheless they for their wickednesses are tortured only till they confess: I then have overpassed their reproach, I, whose confession death doth not follow, but racking pains follow upon it. “And to my neighbours too much.” This hath seemed too much to them, who were already drawing near to know Thee, and to hold the faith that I hold. “And a fear to mine acquaintance.” And into my very acquaintance I struck fear by the example of my dreadful tribulation. “They that did see me, fled without from me.” Because they did not understand my inward and invisible hope, they fled from me into things outward and visible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
