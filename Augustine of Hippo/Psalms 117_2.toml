[[commentary]]
quote='''
“For His merciful kindness is ever more and more towards us: and the truth of the Lord endureth for ever” (ver. 2). These are those two things, loving-kindness and truth, which in the CXVth Psalm I admonished you should be committed to memory. But “the merciful kindness of the Lord is ever more and more towards us,” since the furious tongues of hostile nations have yielded to His Name, through which we have been freed: “and the truth of the Lord endureth for ever,” whether in those things which He promised to the righteous, or in those which He hath threatened to the ungodly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520117.html'
source_title="Exposition on Psalm 117"
