[[commentary]]
quote='''
Then there is the book of Esther, who was a woman of the people of Israel, and in the land of their captivity became the wife of the foreign King Ahasuerus. In this book it is written, that, being driven by necessity to interpose in behalf of her people, whom the king had ordered to be slain in every part of his dominions, she prayed to the Lord. So strongly was she urged by the necessity of the case, that she even ventured into the royal presence without the king's command, and contrary to her own custom. Now observe what the Scripture says: "He looked at her like a bull in the vehemence of his indignation; and the queen was afraid, and her colour changed as she fainted; and she bowed herself upon the head of her delicate maiden which went before her. But God turned the king, and transformed his indignation into gentleness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 42"
