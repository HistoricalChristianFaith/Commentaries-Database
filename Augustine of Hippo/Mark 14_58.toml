[[commentary]]
quote='''
Out of those words of the Lord false witnesses made up a lie to say against Him, out of those very words wherein He mentioned His future Resurrection, in speaking of the Temple. For false witnesses, when they were asked what they had heard Him say, alleged against Him: “We heard Him saying, I will destroy this Temple, and after three days I will raise it up.” “After three days I will raise up,” they had heard: “I will destroy,” they had not heard: but had heard “destroy ye.” One word they changed and a few letters, in order to support their false testimony. But for whom changest thou a word, O human vanity, O human weakness? For the Word, the Unchangeable, dost thou change a word? Thou changest thy word, dost thou change God’s Word?…Wherefore said they that Thou hadst said, “I will destroy;” and said not that which Thou saidest, “destroy ye”? It was, as it were, in order that they might defend themselves from the charge of destroying the Temple without cause. For Christ, because He willed it, died: and nevertheless ye killed Him. Behold we grant you, O ye liars, Himself destroyed the Temple. For it hath been said by the Apostle, “That loved me, and gave up Himself for me.” It hath been said of the Father, “That His own Son spared not, but gave Him up for us all.”…By all means be it that Himself destroyed the Temple, Himself destroyed that said, “Power I have to lay down My Soul, and power I have again to take it: no one taketh it from Me, but I Myself lay it down from Me, and again I take it.” Be it that Himself hath destroyed the Temple in His Grace, in your malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
