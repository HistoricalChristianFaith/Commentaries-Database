[[commentary]]
quote='''
(De Cons. Ev. ii. 12.) The other Evangelists omit these words of John. What follows, This is He, &c. it is not clear whether the Evangelist speaks them in his own person, or whether they are part of John's preaching, and the whole from Repent ye, to Esaias the prophet, is to be assigned to John. It is of no importance that he says, This is he, and not, I am he; for Matthew speaking of himself says, He found a man sitting at the toll-office; (Mat. 9:9.) not He found me. Though when asked what he said of himself, he answered, as is related by John the Evangelist, I am the voice of one crying in the wilderness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore John too, when he was baptizing in the water of repentance, and would have men come to him repenting of their former deeds, spoke thus: “Prepare the way of the Lord, make His paths straight.” Thou didst please thyself in thy sins, O man: let that which thou wast displease thee, that thou mayest be able to become what thou wast not. Prepare the way of the Lord: let that righteousness go before, of confession of sins: He will come and visit thee, for now He hath where to place His steps, He hath whereby He may come to thee. Before thou didst confess thy sins, thou hadst shut up the way of God: there was no way by which He might come unto thee. Confess thy past life, and thou openest a way; and Christ shall come unto thee, and “shall place His steps in the way,” that He may guide thee with His own footsteps.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252085.html'
source_title="Exposition on Psalm 85"
