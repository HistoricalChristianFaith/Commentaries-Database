[[commentary]]
quote='''
Whence indeed did they rank as princes? “God chose the weak things of the world to confound the strong, and the foolish things He hath chosen, and things which are not as though they were, that things which are may be brought to nought.” This He doth who “from the ground raises the helpless, and from the dunghill exalts the poor.” For what purpose? “That He may set him with the princes, even with the princes of His people.” This is a mighty deed, a deep source of pleasure and exultation. Orators came later into that city, but they could never have done so, had not fishermen preceded them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
[[commentary]]
quote='''
“He taketh up the destitute out of the dust, and lifteth the poor out of the mire” (ver. 7); “that He may set Him with the princes, even with the princes of His people” (ver. 8). Let not then the heads of the exalted disdain to be humble, beneath the Lord’s right hand. For though the faithful steward of the Lord’s money be placed together with the princes of the people of God, although he be destined to sit on the twelve seats, and even to judge angels; yet he is taken up destitute from the dust, and lifted from out of the mire. Was not he possibly lifted up from the mire, who “served divers lusts and pleasures”?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520113.html'
source_title="Exposition on Psalm 113"
