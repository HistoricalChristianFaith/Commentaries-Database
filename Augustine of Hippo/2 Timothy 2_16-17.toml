[[commentary]]
quote='''
Hear, therefore, how the apostle foresaw such things, and gave salutary admonition about avoiding them, when he said, "Shun profane novelties of words; for they increase unto much ungodliness, and their speech insinuates itself as doth a cancer." He did not say novelties of words merely; but added, "profane." For there are also novelties of words in perfect harmony with religious doctrine, as is told us in Scripture of the very name of Christians, when it began to be used. For it was in Antioch that the disciples were first called Christians after the Lord's ascension, as we read in the Acts of the Apostles: and certain houses were afterwards called by the new names of hospices and monasteries; but the things themselves existed prior to their names, and are confirmed by religious truth, which also forms their defense against the wicked. In opposition also to the impiety of Arian heretics, they coined the new term, Patris Homousios; but there was nothing new signified by such a name; for what is called Homousios is just this: "I and my Father are one," to wit, of one and the same substance. For if every novelty were profane, as little should we have it said by the Lord, "A new commandment I give unto. you;" nor would the Testament be called New, nor the new song be sung throughout the whole earth. But there is profanity in the novelties of words, when it is said by "the foolish and audacious woman, Come and enjoy the tasting of hidden bread, and the sweetness of stolen waters."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252097.html'
source_title="Tractates on John 97"
