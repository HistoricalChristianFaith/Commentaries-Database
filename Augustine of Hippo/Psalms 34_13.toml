[[commentary]]
quote='''
Let not a Christian then murmur, let him see whose steps he followeth: but if he loveth good days, let him hearken unto Him teaching and saying, “Come, ye children, hearken unto Me; I will teach you the fear of the Lord.” What wouldest thou? Life and good days. Hear, and do. “Keep thy tongue from evil” (ver. 13). This do. I will not, saith a miserable man, I will not keep my tongue from evil, and yet I desire life and good days. If a workman of thine should say to thee, I indeed lay waste this vineyard, yet I require of thee my reward; thou broughtest me to the vineyard to lop and prune it, I cut away all the useful wood, I will cut short also the very trunks of the vines, that thou have thereon nothing to gather, and when I have done this, thou shalt repay to me my labour. Wouldest thou not call him mad? Wouldest thou not drive him from thy house or ever he put his hand to the knife? Such are those men who would both do evil, and swear falsely, and speak blasphemy against God, and murmur, and defraud, and be drunken, and dispute, and commit adultery, and use charms, and consult diviners, and withal see good days. To such it is said, thou canst not doing ill seek a good reward. If thou art unjust, shall God also be unjust? What shall I do, then? What desirest thou? Life I desire, good days I desire. “Keep thy tongue from evil, and thy lips that they speak no guile,” that is, defraud not any, lie not to any.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
