[[commentary]]
quote='''
Listen to the apostle speaking these things: "For ye see," saith he, "your calling, brethren, how that not many wise men after the flesh, not many mighty, not many noble, are called: but God hath chosen the weak things of the world to confound the things which are mighty; and base things of the world, and things that are despised, hath God chosen, yea, and things which are not, as though they were things that are, to bring to nought things that are. If a learned man had been chosen, perhaps he would have said that he was chosen for the reason that his learning made him worthy of choice. Our Lord Jesus Christ, wishing to break the necks of the proud, did not seek the orator by means of the fisherman, but by the fisherman He gained the emperor. Great was Cyprian as an orator, but before him was Peter the fisherman, by means of whom not only the orator, but also the emperor, should believe. No noble was chosen in the first place, no learned man, because God chose the weak things of the world that He might confound the strong.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25207.html'
source_title="Tractates on John 7"
