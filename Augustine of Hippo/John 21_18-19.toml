[[commentary]]
quote='''
(Tract. cxxiii. 5) That is, shalt be crucified. And to come to this end, Another shall gird thee, and carry thee whither thou wouldest not. First He said what would come to pass, secondly, how it would come to pass. For it was not when crucified, but when about to be crucified, that he was led whither he would not. He wished to be released from the body, and be with Christ; but, if it were possible, he wished to attain to eternal life without the pains of death: to which he went against his will, but conquered by the force of his will, and triumphing over the human feeling, so natural a one, that even old age could not deprive Peter of it. But whatever be the pain of death, it ought to be conquered by the strength of love for Him, Who being our life, voluntarily also underwent death for us. For if there is no pain in death, or very little, the glory of martyrdom would not be great.

(Tract. cxxiii) He who denied and loved, died in perfect love for Him, for Whom he had promised to die with wrong haste. It was necessary that Christ should first die for Peter's salvation, and then Peter die for Christ's Gospel.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whose love ought, in one who feedeth His sheep, to grow up unto so great a spiritual fervor as to overcome even the natural fear of death, that makes us unwilling to die even when we wish to live with Christ. For the Apostle Paul also says that he had a desire to be dissolved, and to be with Christ, and yet he groans, being burdened, and wishes not to be unclothed, but clothed upon, that mortality may be swallowed up of life. And so to His present lover the Lord said, "When thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee, and carry thee whither thou wouldest not. For this He said to him, signifying by what death he should glorify God." "Thou shalt stretch forth thy hands," He said; in other words, thou shalt be crucified. But that thou mayest come to this, "another shall gird thee, and carry thee," not whither thou wouldest, but "whither thou wouldest not." He told him first what would happen, and then how it should come to pass. For it was not after being crucified, but when actually about to be crucified, that he was carried whither he would not; for after being crucified he went his way, not whither he would not, but rather whither he would. And though when set free from the body he wished to be with Christ, yet, were it only possible, he had a desire for eternal life apart from the grievousness of death, to which grievous experience he was unwillingly carried, but from it [when all was over] he was willingly carried away; unwillingly he came to it, but willingly he conquered it, and left this feeling of infirmity behind that makes every one unwilling to die,-a feeling so permanently natural, that even old age itself was unable to set the blessed Peter free from its influence, even as it was said unto him, "When thou shalt be old," thou shall be led "whither thou wouldest not." For our consolation the Saviour Himself transfigured also the same feeling in His own person when He said, "Father, if it be possible, let this cup pass from me;" and He certainly had come to die without having any necessity, but only the willingness to die, with power to lay down His life, and with power to take it again. But however great be the grievousness of death, it ought to be overcome by the power of that love which is felt to Him who, being our life, was willing to endure even death in our behalf. For if there were no grievousness, even of the smallest kind, in death, the glory of the martyrs would not be so great. But if the good Shepherd, who laid down His own life for His sheep, has raised up so many martyrs for Himself out of the very sheep, how much more ought those to contend to death for the truth, and even to blood against sin, who are entrusted by Him with the feeding, that is, with the teaching and governing of these very sheep? And on this account, along with the preceding example of His own passion, who can fail to see that the shepherds ought all the more to set themselves closely to imitate the Shepherd, if He was so imitated even by many of the sheep under whom, as the one Shepherd and in the one flock, the shepherds themselves are likewise sheep? For He made all those His sheep for [all of] whom He died, because He Himself also became a sheep that He might suffer for all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520123.html'
source_title="Tractates on John 123"
