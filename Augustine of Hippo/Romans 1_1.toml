[[commentary]]
quote='''
By these two words, called and set apart, Paul distinguishes between the church, which is acceptable to God, and the synagogue, whose glory has faded away. The church (i.e., ecclesia) is so called because it "calls forth": the synagogue, because it "gathers together."
'''
source_url=''
source_title="RUDIMENTARY EXPOSITION OF THE EPISTLE TO THE ROMANS 2.1-3, 5"

[[commentary]]
quote='''
These are the meanings in the Epistle of the Apostle Paul to the Romans. First of all, that everyone should understand that in this epistle the question being treated concerns the works of the law and grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
