[[commentary]]
quote='''
It is nothing new to your ears, beloved, that the Evangelist John, like an eagle, takes a loftier flight, and soars above the dark mist of earth, to gaze with steadier eyes upon the light of truth. From his Gospel much has already been treated of and discussed through our ministry, with the Lord's help; and the passage which has been read to-day follows in due order. What I am about to say, with the Lord's permission, many of you will hear in such wise that you will be reviewing what you know, rather than learning what you know not. Yet, for all that, your attention ought not to be slack, because it is not an acquiring, but a reviewing, of knowledge. This has been read, and we have in our hands to discourse upon this passage-that which the Lord Jesus spoke with the Samaritan woman at Jacob's well. The things spoken there are great mysteries, and the similitudes of great things; feeding the hungry, and refreshing the weary soul.

Now when the Lord knew this, "when He had heard that the Pharisees had learned that He was making more disciples than John, and baptized more (though Jesus baptized not, but His disciples), He left Judea, and departed again into Galilee." We must not discourse of this too long, lest, by dwelling on what is manifest, we shall lack the time to investigate and lay open what is obscure. Certainly, if the Lord saw that the fact of their coming to know that He made more disciples, and baptized more, would so avail to salvation to the Pharisees in following Him, as to become themselves His disciples, and to desire to be baptized by Him; rather would He not have left Judea, but would have remained there for their sakes. But because He knew their knowledge of the fact, and at the same time knew their envy, and that they learned this, not to follow, but to persecute him, He departed thence. He could, indeed, even when present, cause that He should not be taken of them, if He would not; He had it in His power not to be put to death, if He would not, since He had the power not to be born, if He would not. But because, in everything that He did as man, He was showing an example to them who were to believe on Him (that any one servant of God sinneth not if he retire into another place, when he sees, it may be, the rage of his persecutors, or of them that seek to bring his soul into evil; but if a servant of God did this he might appear to commit sin, had not the Lord led the way in doing it), that good Master did this to teach us, not because He feared it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252015.html'
source_title="Tractates on John 15"

[[commentary]]
quote='''
Furthermore, we must consider the question how the evangelist John, before there is any mention of the casting of John the Baptist into prison, tells us that Jesus went into Galilee. For, after relating how He turned the water into wine at Cana of Galilee, and how He came down to Capernaum with His mother and His disciples, and how they abode there not many days, he tells us that He went up then to Jerusalem on account of the passover; that after this He came into the land of Judæa along with His disciples, and tarried there with them, and baptized; and then in what follows at this point the evangelist says: "And John also was baptizing in Ænon, near to Salim, because there was much water there; and they came, and were baptized: for John was not yet cast into prison." On the other hand, Matthew says: "Now when He had heard that John was cast into prison, Jesus departed into Galilee." In like manner, Mark's words are: "Now, after that John was put in prison, Jesus came into Galilee." Luke, again, says nothing indeed about the imprisonment of John; but notwithstanding this, after his account of the baptism and temptation of Christ, he also makes a statement to the same effect with that of these other two, namely, that Jesus went into Galilee. For he has connected the several parts of his narrative here in this way: "And when all the temptation was ended, the devil departed from Him for a season; and Jesus returned in the power of the Spirit into Galilee, and there went out a fame of Him through all the region round about." From all this, however, we may gather, not that these three evangelists have made any statement opposed to the evangelist John, but only that they have left unrecorded the Lord's first advent in Galilee after His baptism; on which occasion also He turned the water into wine there. For at that period John had not yet been cast into prison. And we are also to understand that these three evangelists have introduced into the context of these narratives an account of another journey of His into Galilee, which took place after John's imprisonment, regarding which return into Galilee the evangelist John himself furnishes the following notice: "When, therefore, Jesus knew how the Pharisees had heard that Jesus makes and baptizes more disciples than John (though Jesus Himself baptized not, but His disciples), he left Judæa, and departed again into Galilee." So, then, we perceive that by that time John had been already cast into prison; and further, that the Jews had heard that He was making and baptizing more disciples than John had made and baptized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 18"
