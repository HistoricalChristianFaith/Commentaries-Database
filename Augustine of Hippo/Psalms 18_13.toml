[[commentary]]
quote='''
“And the Lord hath thundered from heaven” (ver. 13). And in confidence of the Gospel the Lord hath sounded forth from the heart of the just One. “And the Highest gave His voice;” that we might entertain it, and in the depth of human things, might hear things heavenly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
