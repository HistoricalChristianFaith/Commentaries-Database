[[commentary]]
quote='''
“But thou,” he saith, “man of one mind, my guide and my friend” (ver. 13). Perchance sometimes good counsel thou hast given, perchance sometimes thou hast gone before me, and some wholesome advice thou hast given me: in the Church of God together we have been. “But thou,…that together with me didst take sweet morsels” (ver. 14). What are the sweet morsels? Not all they that are present know: but let them not be soured that do know, in order that they may be able to say to them that as yet know not: “Taste ye and see, how sweet is the Lord.” “In the House of God we have walked with consent.” Whence then dissension? Thou that wast within, hast become one without. He hath walked with me in the House of God with consent: another house hath he set up against the House of God. Wherefore hath that been forsaken, wherein we have walked with consent? wherefore hath that been deserted, wherein together we did take sweet morsels?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
