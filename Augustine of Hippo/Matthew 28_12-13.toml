[[commentary]]
quote='''
But in like manner as Saul effected not his purpose of slaying David: so this could not the government of the Jews effect, that the testimony of guards sleeping should avail more than that of Apostles watching. For what were the guards instructed to say? We give to you, they say, as much money as ye please; and say ye, that while ye were sleeping there came His disciples, and took Him away. Behold what sort of witnesses of falsehood against truth and the Resurrection of Christ, His enemies, through Saul figured, did produce. Enquire, O unbelief, of sleeping witnesses, let them reply to thee of what was done in the tomb. Who, if they were sleeping, whence knew it? If watching, wherefore detained they not the thieves?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"

[[commentary]]
quote='''
Where is the madness of their raging? To what did they bring those their searchings, in which searchings they failed, so that even, when the Lord was dead and buried, they set guards at the tomb? For they said to Pilate, “That deceiver;” by this name the Lord Jesus Christ was called, for the comfort of His servants when they are called deceivers; they say therefore to Pilate, “That deceiver said when yet living, After three days I will rise again:”…They set for guards soldiers at the sepulchre. At the earth quaking, the Lord rose again: such miracles were done about the sepulchre, that even the very soldiers that had come for guards were made witnesses, if they chose to tell the truth: but the same covetousness which had led captive a disciple, the companion of Christ, led captive also the soldier that was guard of the sepulchre. We give you, they say, money; and say ye, while yourselves were sleeping there came His disciples, and took Him away.…Sleeping witnesses ye adduce: truly thou thyself hast fallen asleep, that in searching such devices hast failed. If they were sleeping, what could they see? if nothing they saw, how are they witnesses? But “they failed in searching searchings:” failed of the light of God, failed in the very completion of their designs: when that which they willed, nowise they were able to complete, surely they failed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252064.html'
source_title="Exposition on Psalm 64"
