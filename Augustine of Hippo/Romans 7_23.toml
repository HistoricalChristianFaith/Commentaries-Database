[[commentary]]
quote='''
In this life it cannot happen to anyone that a law warring against the law of the mind should be entirely absent from his members, because that law would still be waging war even if man's spirit were offering it such resistance as not to fall into line with it.
'''
source_url=''
source_title="THE RETRACTIONS 1.19.1"

[[commentary]]
quote='''
Paul sees another law in his members fighting against the law of his mind. He sees it is there, not remembers that it was there. He is pressed by what is present, not recalling what is past. And he not only sees this law warring against him but even taking him captive to the law of sin, which is (not was) in his members.
'''
source_url=''
source_title="ON NATURE AND GRACE 55.65"

[[commentary]]
quote='''
Look what damage has been done to human nature by the disobedience of the will!
'''
source_url=''
source_title="ON NATURE AND GRACE 53.62"

[[commentary]]
quote='''
See what a fight we have with our dead sins, as that active soldier of Christ and faithful teacher of the church shows. For how is sin dead when it works many things in us while we struggle against it? What are these many things except foolish and harmful desires which plunge those who consent to them into death and destruction? And to bear them patiently and not give into them is a struggle, a conflict, a battle. And between what parties is this battle if not between good and evil, not of nature against nature but of nature against fault, which is already dead but still to be buried, that is, entirely healed?
'''
source_url=''
source_title="AGAINST JULIAN 2.9.32"

[[commentary]]
quote='''
When he says: I see another law in my members warring against the law of my mind and taking me captive under the law of sin which is in my members, he calls the law of sin that by which each one, entangled by carnal habit, is bound fast. He says that this wars against the law of his mind and takes him captive under the law of sin—from which it is understood that the man being described is one who is not yet under grace. For if carnal habit only warred and did not take captive, there would be no condemnation. For condemnation lies in this: that we submit to and serve evil carnal desires. But if such desires exist and are not lacking, yet we do not obey them, we are not taken captive, and we are already under grace—of which he will speak, when he has cried out and implored the help of the Liberator, so that through grace charity may accomplish what through the law fear could not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
