[[commentary]]
quote='''
In thy reflections therefore on thyself, think of thy low estate, think of thy dust: be not lifted up: if thou art anything better, thou wilt be so by His Grace, thou wilt be so by His mercy. For hear what followeth: “but the mercy of the Lord endureth for ever and ever upon them that fear Him” (ver. 17). Ye who fear not Him, will be grass, and in grass, and in torment with the grass: for the flesh shall arise unto the torment. Let those who fear Him rejoice, because His mercy is upon them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"
