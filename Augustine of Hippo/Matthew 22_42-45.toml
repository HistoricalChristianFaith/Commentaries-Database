[[commentary]]
quote='''
In short, in a certain place, the Lord Jesus, knowing that their views of the Christ were cast in a human mould, not in the Divine, taking His stand on the human ground, and not on that where along with the assumption of humanity He also continued Divine, He said to them, "What think ye of Christ? Whose Son is He?" Following their own opinion, they replied, "Of David." For so they had read, and this only they retained; because while they read of His divinity, they did not understand it. But the Lord, to pin them down to some inquiry touching the divinity of Him whose apparent weakness they despised, answered them: "How, then, doth David in spirit call Him Lord, saying, The Lord said unto my Lord, Sit Thou on my right hand, till I put Thine enemies under Thy feet? If David, then, in spirit call Him Lord, how is He his son?" He did not deny, but questioned. Let no one think, on hearing this, that the Lord Jesus denied that He was the Son of David. Had Christ the Lord given any such denial, He would not have enlightened the blind who so addressed Him. For as He was passing by one day, two blind men, who were sitting by the wayside, cried out, "Have mercy upon us, thou Son of David." And on hearing these words He had mercy on them. He stood still, healed, enlightened them; for He owned the name. The Apostle Paul also says, "Who was made of the seed of David according to the flesh;" and in his Epistle to Timothy, "Remember that Jesus Christ was raised from the dead, [He that is] of the seed of David, according to my gospel." For the Virgin Mary drew her origin, and hence our Lord also, from the seed of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"

[[commentary]]
quote='''
But concerning the hidden things of the Son, even if any one would not wish to understand the Son of God, but of David himself, to whose name the whole Psalter is attributed, for the Psalms we know are called the Psalms of David, let him give ear to those words in which it is said to the Lord, “Have mercy on us, O Son of David:” and so even in this manner let him understand the same Lord Christ, concerning whose hidden things is the inscription of this Psalm. For so likewise is it said by the Angel: “God shall give unto Him the throne of His father David.” Nor to this understanding of it is the sentence opposed in which the same Lord asks of the Jews, “If Christ be the Son of David, how then doth he in spirit call Him Lord, saying, The Lord said unto my Lord, Sit Thou on my right hand, until I put Thine enemies under Thy feet.” For it was said to the unskilled, who although they looked for Christ’s coming, yet expected Him as man, not as the Power and Wisdom of God. He teacheth then, in that place, the most true and pure faith, that He is both the Lord of king David, in that He is the Word in the beginning, God with God, by which all things were made; and Son, in that He was made to him of the seed of David according to the flesh. For He doth not say, Christ is not David’s Son, but if ye already hold that He is his Son, learn how He is his Lord: and do not hold in respect of Christ that He is the Son of Man, for so is He David’s Son; and leave out that He is the Son of God, for so is He David’s Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252010.html'
source_title="Exposition on Psalm 10"

[[commentary]]
quote='''
Moreover, when the Lord had questioned the Jews, whose Son they affirmed Christ to be, they made answer, “David’s:” where the Lord chides the Jews, when they said that He was the Son of David. He saw that they had stayed at the flesh, and had lost sight of the divinity; and He reproveth them by propounding a question: “How then doth David himself in spirit call Him Lord, ‘The Lord hath said unto my Lord.’…If then He in spirit calleth Him Lord, how is He is Son?” A question He propounded; His being Son He denied not. Ye have heard “Lord;” say ye how He is his “Son:” ye have heard “Son;” say how He is “Lord.” This question the Catholic Faith solveth. How “Lord”? Because “In the beginning was the Word, and the Word was with God, and the Word was God.” How “Son”? Because “The Word was made flesh, and dwelt among us.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"

[[commentary]]
quote='''
…This Psalm is one of those promises, surely and openly prophesying our Lord and Saviour Jesus Christ; so that we are utterly unable to doubt that Christ is announced in this Psalm, since we are now Christians, and believe the Gospel. For when our Lord and Saviour Jesus Christ asked of the Jews, whose Son they alleged Christ to be, and they had replied, “the Son of David;” He at once replied to their answer, “How then doth David in spirit call Him Lord, saying, The Lord said unto My Lord?” etc. “If then,” He asked, “David in the spirit call Him Lord, how is He his son?” With this verse this Psalm beginneth.

“The Lord said unto my Lord, Sit Thou on My right hand, until I make Thine enemies Thy footstool” (ver. 1). We ought, therefore, thoroughly to consider this question proposed to the Jews by the Lord, in the very commencement of the Psalm. For if what the Jews answered be asked of us, whether we confess or deny it; God forbid that we should deny it. If it be said to us, Is Christ the Son of David, or not? if we reply, No, we contradict the Gospel for the Gospel of St. Matthew thus beginneth, “The book of the generation of Jesus Christ, the Son of David.” The Evangelist declareth, that he is writing the book of the generation of Jesus Christ, the Son of David. The Jews, then, when questioned by Christ, whose Son they believed Christ to be, rightly answered, the Son of David. The Gospel agreeth with their answer. Not only the suspicion of the Jews, but the faith of Christians, doth declare this.…“If then David in the spirit called Him Lord, how is He his son?” The Jews were silent at this question: they found no further reply: yet they did not seek Him as the Lord, for they did not acknowledge Him to be Himself that Son of David. But let us, brethren, both believe and declare: for, “with the heart we believe unto righteousness: but with the mouth confession is made unto salvation;” let us believe, I say, and let us declare both the Son of David, and the Lord of David. Let us not be ashamed of the Son of David, lest we find the Lord of David angry with us.

…We know that Christ sitteth at the right hand of the Father, since His resurrection from the dead, and ascent into heaven. It is already done: we saw not it, but we have believed it: we have read it in the Scripture, have heard it preached, and hold it by faith. So that by the very circumstance that Christ was David’s Son, He became His Lord also. For That which was born of the seed of David was so honoured, that It was also the Lord of David. Thou wonderest at this, as if the same did not happen in human affairs. For if it should happen, that the son of any private person be made a king, will he not be his father’s lord? What is yet more wonderful may happen, not only that the son of a private person, by being made a king, may become his father’s lord; but that the son of a layman, by being made a Bishop, may become his father’s father. So that in this very circumstance, that Christ took upon Him the flesh, that He died in the flesh, that He rose again in the same flesh, that in the same He ascended into Heaven, and sitteth on the right hand of His Father, in this same flesh so honoured, so brightened, so changed into a heavenly garb, He is both David’s Son, and David’s Lord.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
