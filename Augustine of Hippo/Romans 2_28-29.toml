[[commentary]]
quote='''
But think not that the “daughters of Judah” are Jews. Judah is confession; all the sons of confession are all the sons of Judah. For “salvation is of the Jews,” is nothing else than that Christ is of the Jews. This saith also the Apostle, “He is not a Jew which is one outwardly; neither is that circumcision which is outward in the flesh: but he is a Jew which is one inwardly, and circumcision is that of the heart, in the spirit, and not in the letter, whose praise is not of men, but of God.” Be such a Jew; glory in the circumcision of the heart, though thou hast not the circumcision of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252048.html'
source_title="Exposition on Psalm 48"
