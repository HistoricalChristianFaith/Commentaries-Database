[[commentary]]
quote='''
Accordingly, the Lord cries aloud to us: for, "He stood and cried out, if any man thirst, let him come unto me, and drink. He that believeth on me, as the Scripture saith., out of his belly shall flow rivers of living water." We are not obliged to delay to inquire what this meant, since the evangelist has explained it. For why the Lord said, "If any man thirst, let him come unto me, and drink;" and, "He that believeth on me, out of his belly shall flow rivers of living water;" the evangelist has subsequently explained, saying: "But this spake He of the Spirit which they that believe on Him should receive. For the Spirit was not yet given, because Jesus was not yet glorified." There is therefore an inner thirst and an inner belly, because there is an inner man. And that inner man is indeed invisible, but the outer man is visible; but yet better is the inner than the outer. And this which is not seen is the more loved; for it is certain that the inner man is loved more than the outer. How is this certain? Let every man prove it in himself. For although they who live ill may surrender their minds to the body, yet they do wish to live, and to live is the property of the mind only; and they who rule, manifest themselves more than those things that are ruled. Now it is minds that rule, bodies are ruled. Every man rejoices in pleasure, and receives pleasure by the body: but separate the mind from it, and nothing remains in the body to rejoice; and if there is joy of the body, it is the mind that rejoices. If it has joy of its dwelling, ought it not to have joy of itself? And if the mind has whereof it may have delight outside itself, does it remain without delights within? It is quite certain that a man loves his soul more than his body. But further, a man loves the soul even in another man more than the body. What is it that is loved in a friend, where the love is the purer and more sincere? What in the friend is loved-the mind, or the body? If fidelity is loved, the mind is loved; if benevolence is loved, the mind is the seat of benevolence: if this is what thou lovest in another, that he too loves thee, it is the mind thou lovest, because it is not the flesh, but the mind that loves. For therefore thou lovest, because he loves thee: ask why he loves thee, and then see what it is thou lovest. Consequently, it is more loved, and yet is not seen.

I would say something further, by which it may more clearly appear to you, beloved, how much the mind is loved, and how it is preferred to the body. Those wanton lovers even, who delight in beauty of bodies, and are charmed by shapeliness of limbs, love the more when they are loved. For when a man loves, and finds that he is regarded with hatred, he feels more anger than liking. Why does he feel anger rather than liking? Because the love that he bestows is not given him in return. If, therefore, even the lovers of bodies desire to be loved in return, and this delights them more when they are loved, what shall we say of the lovers of minds? And if the lovers of minds are great, what shall we say of the lovers of God who makes minds beautiful? For as the mind gives grace to the body, so it is God that gives grace to the mind. For it is only the mind that causes that in the body by which it is loved; when the mind has left it, it is a corpse at which thou hast a horror; and how much soever thou mayest have loved its beautiful limbs, thou makest haste to bury it. Hence, the ornament of the body is the mind; the ornament of the mind is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252032.html'
source_title="Tractates on John 32"

[[commentary]]
quote='''
What is the river of God? The people of God. The first people was filled with water, wherewith the rest of the earth might be watered. Hear Him promising water: “If any man thirst, let him come to Me and drink: he that believeth on Me, rivers of living water from his belly shall flow:” if rivers, one river also; for in respect of unity many are one. Many Churches and one Church, many faithful and one Bride of Christ: so many rivers and one river. Many Israelites believed, and were fulfilled with the Holy Spirit; from thence they were scattered abroad through the nations, they began to preach the truth, and from the river of God that was filled with water, was the whole earth watered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252065.html'
source_title="Exposition on Psalm 65"

[[commentary]]
quote='''
Whence shall the floods clap their hands? What is to clap their hands? To rejoice in works. To clap hands, is to rejoice; hands, mean works. What floods? Those whom God hath made floods, by giving them that Water, the Holy Spirit. “If any man thirst,” saith He, “let him come unto Me, and drink. He that believeth on Me, out of his bosom shall flow rivers of living water.” These rivers clapped their hands, these rivers rejoiced in works, and blessed God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
