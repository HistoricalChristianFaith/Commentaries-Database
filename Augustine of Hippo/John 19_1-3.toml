[[commentary]]
quote='''
(Tr. cxvi) When the Jews had cried out that they did not wish Jesus to be released on account of the passover, but Barabbas, Then Pilate therefore took Jesus, and scourged Him. Pilate seems to have done this for no reason but to satisfy the malice of the Jews with some punishment short of death. On which account he allowed his band to do what follows, or perhaps even commanded them. The Evangelist only says however that the soldiers did so, not that Pilate commanded them: And the soldiers platted a crown of thorns, and put it on His head, and they put on Him a purple robe, and said, Hail, King of the Jews! and they smote Him with their hands.

(Tr. cxvi) Thus were fulfilled what Christ had prophesied of Himself; thus were martyrs taught to suffer all that the malice of persecutors could inflict; thus that kingdom which was not of this world conquered the proud world, not by fierce fighting, but by patient suffering.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
On the Jews crying out that they did not wish Jesus to be released unto them at the passover, but Barabbas the robber; not the Saviour, but the murderer; not the Giver of life, but the destroyer,-"then Pilate took Jesus and scourged Him." We must believe that Pilate acted thus for no other reason than that the Jews, glutted with the injuries done to Him, might consider themselves satisfied, and desist from madly pursuing Him even,unto death. With a similar intention was it that, as governor, he also permitted his cohort to do what follows, or even perhaps ordered them, although the evangelist is silent on the subject. For he tells us what the soldiers did thereafter, but not that Pilate ordered it. "And the soldiers," he says, "platted a crown of thorns, and put it on His head, and they clothed Him with a purple robe. And they came to Him and said, Hail, King of the Jews! And they smote Him with their hands." Thus were fulfilled the very things which Christ had foretold of Himself; thus were the martyrs moulded for the endurance of all that their persecutors should be pleased to inflict; thus, by concealing for a time the terror of His power, He commended to us the prior imitation of His patience; thus the kingdom which was not of this world overcame that proud world, not by the ferocity of fighting, but by the humility of suffering; and thus the grain of corn that was yet to be multiplied was sown amid the horrors of shame, that it might come to fruition amid the wonders of glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520116.html'
source_title="Tractates on John 116"

[[commentary]]
quote='''
We have now reached the point at which we may study the Lord's passion, strictly so called, as it is presented in the narrative of these four evangelists. Matthew commences his account as follows: "Then the soldiers of the governor took Jesus into the common hall, and gathered unto Him the whole band of soldiers. And they stripped Him, and put on Him a scarlet robe. And when they had platted a crown of thorns, they put it upon His head, and a reed in His right hand: and they bowed the knee before Him, and mocked Him, saying, Hail, King of the Jews!" At the same stage in the narrative, Mark delivers himself thus: "And the soldiers led Him away into the hall called Prætorium; and they called together the whole band. And they clothed Him with purple, and platted a crown of thorns, and put it on His head, and began to salute Him, saying, Hail, King of the Jews! And they smote Him on the head with a reed, and did spit upon Him, and, bowing their knees, worshipped Him." Here, therefore, we perceive that while Matthew tells us how they "put on Him a scarlet robe," Mark speaks of purple, with which He was clothed. The explanation may be that the said scarlet robe was employed instead of the royal purple by these scoffers. There is also a certain red-coloured purple which resembles scarlet very closely. And it may also be the case that Mark has noticed the purple which the robe contained, although it was properly scarlet. Luke has left this without mention. On the other hand, previous to stating how Pilate delivered Him up to be crucified, John has introduced the following passage: "Then Pilate therefore took Jesus, and scourged Him. And the soldiers platted a crown of thorns, and put it on His head, and they put on Him a purple robe, and said, Hail, King of the Jews! And they smote Him with their hands." This makes it evident that Matthew and Mark have reported this incident in the way of a recapitulation, and that it did not actually take place after Pilate had delivered Him up to be crucified. For John informs us distinctly enough that these things took place when He yet was with Pilate. Hence we conclude that the other evangelists have introduced the occurrence at that particular point, just because, having previously passed it by, they recollected it there. This is also borne out by what Matthew proceeds next to relate. He continues thus: "And they spit upon Him, and took the reed, and smote Him on the head. And after that they had mocked Him, they took the robe off from Him, and put His own raiment on Him, and led Him away to crucify Him." Here we are given to understand that the taking the robe off Him and the clothing Him with His own raiment were done at the close, when He was being led away. This is given by Mark, as follows: "And when they had mocked Him, they took off the purple from Him, and put His own clothes on Him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 9"
