[[commentary]]
quote='''
“But I have hoped in Thy mercy” (ver. 5). Because this very thing, that a man be not moved, and that he abide fixed in the Lord, he should not attribute to self: lest when he glories that he hath not been moved, he be moved by this very pride. “My heart shall exult in Thy salvation;” in Christ, in the Wisdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252013.html'
source_title="Exposition on Psalm 13"
