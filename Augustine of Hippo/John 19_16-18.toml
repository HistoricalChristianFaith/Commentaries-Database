[[commentary]]
quote='''
On Pilate's judgment and condemnation before the tribunal, they took the Lord Jesus Christ, about the sixth hour, and led Him away. "And He, bearing His cross, went forth into the place that is called Calvary, but in Hebrew, Golgotha; where they crucified Him." What else, then, is the meaning of the evangelist Mark saying, "And it was the third hour, and they crucified Him," but this, that the Lord was crucified at the third hour by the tongues of the Jews, at the sixth hour by the hands of the soldiers? That we may understand that the fifth hour was now completed, and there was some beginning made of the sixth, when Pilate took his seat before the tribunal, which is expressed by John as "about the sixth hour;" and when He was led forth, and nailed to the tree with the two robbers, and the events recorded were enacted beside His cross, the completion of the sixth hour was fully reached, being the hour from which, on to the ninth, the sun was obscured, and the darkness took place, we have it jointly attested on the authority of the three evangelists, Matthew, Mark, and Luke. But as the Jews attempted to transfer the crime of slaying Christ from themselves to the Romans, that is to say, to Pilate and his soldiers, therefore Mark suppresses the hour at which Christ was crucified by the soldiers,and which then began to enter upon the sixth, and remembers rather to give an express place to the third hour, at which they are understood to have cried out before Pilate, "Crucify, crucify him" (verse 6), that it not only may be seen that the former crucified Jesus, namely, the soldiers who hung Him on the tree at the sixth hour, but the Jews also, who at the third hour cried out to have Him crucified.

There is also another solution of this question, that we should not here understand the sixth hour of the day, because John says not, And it was about the sixth hour of the day, or about the sixth hour, but says, "And it was the parasceve of the passover, about the sixth hour" (ver. 14). And parasceve is in Latin praeparatio (preparation); but the Jews are fonder of using the Greek words in observances of this sort, even those of them who speak Latin rather than Greek. It was therefore the preparation of the passover. But "our passover, Christ," as the apostle says, "has been sacrificed;" and if we reckon the preparation of this passover from the ninth hour of the night (for then the chief priests seem to have given their verdict for the sacrifice of the Lord, when they said, "He is guilty of death," and when the hearing of His case was still proceeding in the high priest's house: whence there is a kind of harmony in understanding that therewith began the preparation of the true passover, whose shadow was the passover of the Jews, that is, of the sacrificing of Christ, when the priests gave their sentence that He was to be sacrificed), certainly from that hour of the night, which is conjectured to have been then the ninth, on to the third hour of the day, when the evangelist Mark testifies that Christ was crucified, there are six hours, three of the night, and three of the day. Hence in the case of this parasceve of the passover, that is, the preparation of the sacrifice of Christ, which began with the ninth hour of the night, it was about the sixth hour; that is to say, the fifth hour was completed, and the sixth had already begun to run, when Pilate ascended the tribunal: for that same preparation, which had begun with the ninth hour of the night, still continued till the sacrifice of Christ, which was the event in course of preparation, was completed, which took place at the third hour, according to Mark, not of the preparation, but of the day; while it was also the sixth hour, not of the day, but of the preparation, by reckoning, of course, six hours from the ninth hour of the night to the third of the day. Of these two solutions of this difficult question let each choose the one that pleases him. But one will judge better what to choose who reads the very elaborate discussions on "The Harmony of the Evangelists." And if other solutions of it can also be found, the stability of gospel truth will have a more cumulative defense against the calumnies of unbelieving and profane vanity. And now, after these brief discussions, let us return to the narrative of the evangelist John.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520117.html'
source_title="Tractates on John 117"
