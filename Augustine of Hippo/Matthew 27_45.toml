[[commentary]]
quote='''
Matthew proceeds in the following terms: "Now from the sixth hour there was darkness over all the land unto the ninth hour." The same fact is attested by two others of the evangelists. Luke adds, however, a statement of the cause of the darkness, namely, that "the sun was darkened."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 17"
