[[commentary]]
quote='''
But that there may be no more room for hesitation, hear what follows: "I and my Father are one." Up to this point the Jews were able to bear Him; they heard, "I and my Father are one," and they bore it no longer; and hardened in their own way, they had recourse to stones. "They took up stones to stone Him." The Lord, because He suffered not what He was unwilling to suffer, and only suffered what He was pleased to suffer, still addresses them while desiring to stone Him. "The Jews took up stones to stone Him. Jesus answered them, Many good works have I showed you from my Father; for which of those works do ye stone me?And they answered, For a good work we stone thee not, but for blasphemy, and because that thou, being a man, makest thyself God," Such was their reply to His words, "I and my Father are one." You see here that the Jews understood what the Arians understand not. For they were angry on this account, that they felt it could not be said, "I and my Father are one," save where there was equality of the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252048.html'
source_title="Tractates on John 48"
