[[commentary]]
quote='''
“Blessed is the man who hath filled his desire from them” (ver. 5). Well, my brethren, who filleth his desire from them? Who loveth not the world. He who is filled with the desire of the world, hath no room for that to enter which they have preached. Pour forth what thou carriest, and become fit for that which thou hast not. That is, thou desirest riches: thou canst not fill thy desire from them: thou desirest honours upon earth, thou desirest those things which God hath given even unto beasts of burden, that is, temporal pleasure, bodily health, and the like; thou wilt not fulfil thy desire from them.…“He shall not be ashamed, when he speaketh with his enemies in the gate.” Brethren, let us speak in the gate, that is, let all know what we speak. For he who chooseth not to speak in the gate, wisheth what he speaketh to be hidden, and perhaps wisheth it to be hidden for this reason, that it is evil. If he be confident, let him speak in the gate; as it is said of Wisdom, “She crieth at the gates, at the entry of the city.” As long as they hold unto righteousness in innocency, they shall not be ashamed: this is to preach at the gate. And who is he who preacheth at the gate? He who preacheth in Christ; because Christ is the gate whereby we enter into that city.…They, therefore, who speak against Christ, are without the gate; because they seek their own honours, not those of Christ. But he who preacheth in the gate, seeketh Christ’s honour, not his own: and, therefore, he who preacheth in the gate, saith, Trust not in me; for ye will not enter through me, but through the gate. While they who wish men to trust in themselves, wish them not to enter through the gate: it is no marvel if the gate be closed against them, and if they vainly knock for it to be opened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
