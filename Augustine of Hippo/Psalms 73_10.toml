[[commentary]]
quote='''
“And full days shall be found in them.”

“Therefore there shall return hither My people” (ver. 10). Now Asaph himself is returning hither. For he saw these things abound to unrighteous men, he saw them abound to proud men: he is returning to God, and is beginning to inquire and discuss. But when? “When full days shall be found in them.” What is “full days”? “But when there came the fulness of time, God sent His Son.” This is the very fulness of time, when He came to teach men that things temporal should be despised, that they should not esteem as a great matter whatever object evil men covet, that they should suffer whatever evil men fear. He became the way, He recalled us to inward thought, admonished us of what should be sought of God. And see from what thought reacting upon itself, and in a manner recalling the waves of its impulse, he doth pass over unto choosing true things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
