[[commentary]]
quote='''
But if any one would understand the moon of the synagogue, let him refer the Psalm to the Lord’s passion, and of the Jews say, “For they have destroyed what Thou hast perfected;” and of the Lord Himself, “But what hath the Just done?” whom they accused as the destroyer of the Law: whose precepts, by their corrupt living, and by despising them, and by setting up their own, they had destroyed, so that the Lord Himself may speak as Man, as He is wont, saying, “In the Lord I trust; how say ye to my soul, Remove into the mountains as a sparrow?” by reason, that is, of the fear of those who desire to apprehend and crucify Him. Since the interpretation is not unreasonable of sinners wishing to “shoot at the upright in heart,” that is, those who believed in Christ, “in the obscure moon,” that is, the Synagogue filled with sinners. To this too the words, “The Lord is in His holy temple; the Lord, His seat is in heaven,” are suitable; that is, the Word in Man, or the very Son of Man who is in heaven. “His eyes look upon the poor;” either on Him whom He assumed as God, or for whom He suffered as Man. “His eyelids question the sons of men.” The closing and opening of the eyes, which is probably meant by the word eyelids, we may take to be His death and resurrection, whereby He tried the sons of men His disciples, terrified at His passion, and gladdened by the resurrection. “The Lord questioneth the righteous and ungodly,” even now from out of Heaven governing the Church. “But whoso loveth iniquity, hateth his own soul.” Why it is so, what follows teaches us. For “He shall rain snares upon the sinners:” which is to be taken according to the exposition above given, and so on with all the rest to the end of the Psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252011.html'
source_title="Exposition on Psalm 11"
