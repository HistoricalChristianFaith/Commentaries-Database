[[commentary]]
quote='''
This is faith, whereof to the Church Herself is said in the Song of Songs, “Thou shalt come and shalt pass hence from the beginning of faith.” For She hath come like the chariot of God in thousands of men rejoicing, having a prosperous course, and She hath passed over from this world to the Father: in order that there may come to pass in Her that which the Bridegroom Himself saith, who hath passed hence from this world to the Father, “I will that where I am, these also may be with Me:” but from the beginning of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
