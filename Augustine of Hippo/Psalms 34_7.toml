[[commentary]]
quote='''
And how saveth He men out of all their troubles? “The Angel of the Lord shall send round about them that fear Him, and shall deliver them” (ver. 7). So it is written, brethren, not as some bad copies have it, “The Lord shall send His Angel round about them that fear Him, and He shall deliver them:” but thus, “The Angel of the Lord shall send round about them that fear Him, and shall deliver them.” Whom called He here the Angel of the Lord, who shall send round about them that fear Him, and shall deliver them? Our Lord Jesus Christ Himself is called in Prophecy, the Angel of the great Counsel, the Messenger of the great Counsel; so the Prophets called Him. Even He then, the Angel of the great Counsel, that is, the Messenger, shall send unto them that fear the Lord, and shall deliver them. Fear not then lest thou be hid: wheresoever thou hast feared the Lord, there doth that Angel know thee, who shall send to succour thee, and shall deliver thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252034.html'
source_title="Exposition on Psalm 34"
