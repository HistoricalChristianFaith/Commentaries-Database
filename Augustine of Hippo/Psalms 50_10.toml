[[commentary]]
quote='''
“For mine are all the beasts of the wood” (ver. 10). Why should I ask of thee what I have made? Is it more thine, to whom I have given it to possess, than Mine, who have made it? “For mine are all the beasts of the wood.” But perchance that Israel saith, The beasts are God’s, those wild beasts which I enclose not in my pen, which I bind not to my stall; but this ox and sheep and he-goat—these are mine own. “Cattle on the mountain, and oxen.” Mine are those which thou possessest not, Mine are these which thou possessest. For if thou art My servant, the whole of thy property is Mine. For it cannot be, that is the property of the master which the servant hath gotten to himself, and yet that not be the property of the Master which the Master Himself hath created for the servant. Therefore Mine are the beasts of the wood which thou hast not taken; Mine are also the cattle on the mountains which are thine, and the oxen which are at thy stall: all are Mine own, for I have created them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"
