[[commentary]]
quote='''
“Who teacheth my hands for battle” (ver. 34). Who teacheth me to work for the overthrow of mine enemies, who strive to shut the kingdom of heaven against us. “And Thou hast made mine arms as a bow of steel.” And Thou hast made my earnest striving after good works unwearied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
