[[commentary]]
quote='''
Men do fly hither, desiring to be rid of their wives: here they are more tightly bound: no man looseth these fetters. “What God joined together, let not man put asunder.” But these bonds are hard. Who but knows it? This hardness the Apostles grieved at, and said, “If this be the case with a wife, it is not good to marry.” If the bonds be of iron, it is not good to set our feet within them. And the Lord said, “All men cannot receive this saying, but let him that can receive it, receive it.” “Art thou bound unto a wife? seek not to be freed,” for thou art bound with bonds of iron. “Art thou free from a wife, seek not a wife;” bind not thyself with bonds of iron.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
