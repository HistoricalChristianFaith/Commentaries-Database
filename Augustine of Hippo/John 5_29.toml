[[commentary]]
quote='''
The apostle answers you and says: I know what I am talking about. You say the pagans are delivered from the body of this death, because the last day of this life is coming, and they will be released in due time from the body of this death. The day is also coming "when all who are in the tombs will hear his voice, and those who have done good will come forth to the resurrection of life." There you have the ones delivered from the body of this death. But he also says, "Those who have done evil will come to the resurrection of judgment." See, they will return to the body of this death. The body of this death is coming back to the wicked. They will never be released from it. Then it will not be eternal life but eternal death, because it is eternal punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520154.html'
source_title="SERMON 154.16"

[[commentary]]
quote='''
"All shall hear His voice, and shall come forth." And where is judgment, if all shall hear and all shall come forth? It is as if all were confusion; I see no distinguishing. Certainly Thou hast received authority to judge, because Thou art the Son of man: behold, Thou wilt be present in the judgment;the bodies will rise again; but tell us something of the judgment itself, that is, of the separation of the evil and the good. Hear this further, then: "They that have done good into the resurrection of life; they that have done evil into the resurrection of judgment." When above He spoke of a resurrection of minds and souls, did He make any distinction? No, for all "that hear shall live;" because by hearing, viz. by obeying, shall they live. But certainly not all will go to eternal life by rising and coming forth from the graves,-only they that have done well; and they that have done ill, to judgment. For here He has put judgment for punishment. There will also be a separation, not such as there is now. For now we are separated, not by place, but by character, affections, desires, faith, hope, charity. Now we live together with the unjust, though the life of all is not the same: in secret we are distinguished, in secret we are separated; as grain on the floor, not as grain in the granary. On the floor, grain is both separated and mixed: separated, because severed from the chaff; mixed, because not yet winnowed. Then there will be an open separation; a distinguishing of life just as of the character, a separation as there is in wisdom, so also will there be in bodies. They that have done well will go to live with the angels of God; they that have done evil, to be tormented with the devil and his angels. And the form of a servant will pass away. For to this end He had manifested Himself, that He might execute judgment. After the judgment, He shall go hence, will lead with Him the body of which He is the head, and deliver up the kingdom of God. Then will openly be seen that form of God which could not be seen by the wicked, to whose vision the form of a servant must be shown. He says also in another place on this wise: "These shall go away into everlasting burning" (speaking of certain on the left), "but the just into life eternal;" of which life He says in another place: "And this is eternal life, that they may know Thee the one true God, and Jesus Christ whom Thou hast sent." Then will He be there manifested, "who, being in the form of God, thought it not robbery to be equal with God." Then He will manifest Himself, as He has promised to manifest Himself to them that love Him. For "he that loveth me," saith He, "keepeth my commandments; and he that loveth me shall be loved of my Father; and I will love him, and will manifest myself to him." He was present in person with those to whom He was speaking: but they saw the form of a servant, they did not see the form of God. They were being led on His own beast to His dwelling to be healed; but now being healed, they will see, because, saith He, "I will manifest myself to him." How is He shown equal to the Father? When He says to Philip, "He that seeth me seeth my Father also."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252019.html'
source_title="Tractates on John 19"
