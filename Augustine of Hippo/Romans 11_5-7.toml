[[commentary]]
quote='''
These are they that are out of that people the inheritance of God.…So then even at this time a remnant through election of Grace have been saved. This remnant out of that nation doth belong to the inheritance of God: not those concerning whom a little below he saith, “But the rest have been blinded.” For thus he saith. “What then? That which Israel sought, this he hath not obtained: but the election hath obtained it: but the rest have been blinded.” This election then, this remnant, that people of God, which God hath not cast off, is called His inheritance. But in that Israel, which hath not obtained this, in the rest that were blinded, there was no longer an inheritance of God, in reference to whom it is possible that there should be spoken, after the glorification of Christ in the Heavens, in the time of Titus the Emperor, “O God, there have come the Gentiles unto Thine inheritance,” and the other things which in this Psalm seem to have been foretold concerning the destruction of both the temple and city belonging to that people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252079.html'
source_title="Exposition on Psalm 79"
