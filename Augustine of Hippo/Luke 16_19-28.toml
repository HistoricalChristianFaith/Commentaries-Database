[[commentary]]
quote='''
I add, that perchance ye will change conditions. Now everywhere the Gospel is being preached: observe a certain poor man full of sores, who was lying before the gate of a rich man, and was desiring to be filled with crumbs, which used to fall from the table of the rich man; observe also that likeness of thine who was clothed with purple and fine linen, and fared sumptuously every day. It chanced, I say, for that poor man to die, and to be borne by the Angels into the bosom of Abraham: but the other died and was buried; for the other’s burial perchance no one cared.…Brethren, how great was the toil of the poor man! Of how long duration were the luxuries of the rich man! But the condition which they have received in exchange is everlasting.…Deservedly too late he will say, “Send Lazarus,” “let him tell even my brethren;” since to himself there is not granted the fruit of repentance. For it is not that repentance is not given, but everlasting will be the repentance, and no salvation after repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
