[[commentary]]
quote='''
For most evidently God the Father hath been called a Husbandman. The Apostle saith, “God’s husbandry ye are, God’s building ye are.” In things visible of this world, the vine is not a building, and a building is not a vineyard: but we are the vineyard of the Lord, because He tilleth us for fruit; the building of God we are, since He who tilleth us, dwelleth in us. And what saith the same Apostle? “I have planted, Apollos hath watered, but the increase God hath given. Therefore neither he that planteth is anything, nor he that watereth, but He that giveth the increase, even God.” He it is therefore that giveth the increase. Are those perchance the husbandmen? For a husbandman he is called that planteth, that watereth: but the Apostle hath said, “I have planted, Apollos hath watered.” Do we enquire whence himself hath done this? The Apostle maketh answer, “Yet not I, but the Grace of God with me.” Therefore whithersoever thou turn thee, whether through Angels, thou wilt find God thy Husbandman; whether through Prophets, the Same is thy Husbandman; whether through Apostles, the very Same acknowledge to be thy Husbandman. What then of us? Perchance we are the labourers of that Husbandman, and this too with powers imparted by Himself, and by Grace granted by Himself.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
