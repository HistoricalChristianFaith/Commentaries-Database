[[commentary]]
quote='''
“The works of His hands are verity and judgment” (ver. 7). Let verity be held by those who are judged here. Martyrs are here sentenced, and brought to the judgment-seat, that they may judge not only those by whom they have been judged, but even give judgment on angels, against whom was their struggle here, even when they seemed to be judged by men. Let not tribulation, distress, famine, nakedness, the sword, separate from Christ. For “all His commandments are true;” He deceiveth not, He giveth us what He promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520111.html'
source_title="Exposition on Psalm 111"
