[[commentary]]
quote='''
“Let not them that are Mine enemies wrongfully rejoice over Me:” for they rejoice over Me because of My chaff. “Who hate Me without a cause;” that is, whom I never hurt; “winking with their eyes” (ver. 19): that is, pretending hypocrites, “For they spake indeed peace to Me” (ver. 20). What is, “winking with their eyes”? Declaring by their looks, what they carry not in their heart. And who are these “winking with their eyes”? “For they spake indeed peace to Me; and with wrath devised craftily.” “Yea they opened their mouth wide against Me” (ver. 21). First winking with their eyes, those lions sought to ravish and devour; first fawning they spake peace, and then with wrath devised craftily. What peace spake they? “Master, we know that Thou acceptest not man’s person, and teachest the way of God in truth. Is it lawful to give tribute unto Cæsar, or not?” They spake indeed peace unto Me. What then? Didst not Thou know them, and deceived they Thee, winking with their eyes? Truly He knew them; therefore said He, “Why tempt ye Me, ye hypocrites?” Afterward, “they opened their mouth wide against Me,” crying, “Crucify Him, Crucify Him! and said, Aha, Aha, our eyes have seen it.” This, when they insulted Him, “Aha, Aha, Prophesy unto us, Thou Christ.” As their peace was pretended when they tempted Him concerning the money, so now insulting was their praise. “They said, Aha, Aha, our eyes have seen it” (ver. 21): that is, Thy deeds, Thy miracles. This Man is the Christ. “If He be the Christ, let Him come down from the Cross, and we will believe Him. He saved others, Himself He cannot save.” “Our eyes have seen it.” This is all whereof He boasted Himself, when “He called Himself the Son of God.” But the Lord was hanging patient upon the Cross: His power had He not lost, but He showed His patience. For what great thing was it for Him to come down from the Cross, who could afterward rise again from the sepulchre? But He seems to have yielded to His insulters; and this, beloved, that having risen again He should show Himself to His own, and not to them, and this is a great mystery; for His resurrection signified the New Life, but the New Life is known to His friends, not to His enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
