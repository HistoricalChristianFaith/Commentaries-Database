[[commentary]]
quote='''
“For He spake, and they were made:” for no other one made those things which are to fear; but He spake, and they were made. “He commanded, and they were created” (ver. 9): He commanded by His Word, and they were created.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
