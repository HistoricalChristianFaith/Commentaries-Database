[[commentary]]
quote='''
Did not Absalom choose by his own will the counsel which was detrimental to him? And yet the reason of his doing so was that the Lord had heard his father's prayer that it might be so. Wherefore the Scripture says that "the Lord appointed to defeat the good counsel of Ahithophel, to the intent that the Lord might bring all evils upon Absalom." It called Ahithophel's counsel "good," because it was for the moment of advantage to his purpose. It was in favour of the son against his father, against whom he had rebelled; and it might have crushed him, had not the Lord defeated the counsel which Ahithophel had given, by acting on the heart of Absalom so that he rejected this counsel, and chose another which was not expedient for him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 41"
