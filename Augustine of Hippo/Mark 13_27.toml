[[commentary]]
quote='''
Concerning the execution of which power, there is immediately added, And then shall he send his angels.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Ye have heard the Gospel, where it saith, that when He cometh, “He shall gather together His elect from the four winds.” He gathereth all His elect from the four winds: therefore from the whole world. For Adam himself (this I had said before) signifieth in Greek the whole world; for there are four letters, A, D, A, and M. But as the Greeks speak, the four quarters of the world have these initial letters, Ἀνατολὴ, they call the East; Δύσις, the West; Ἄρκτος, the North; Μεσημβρία, the South: thou hast the word Adam. Adam therefore hath been scattered over the whole world. He was in one place, and fell, and as in a manner broken small, he filled the whole world: but the mercy of God gathered together the fragments from every side, and forged them by the fire of love, and made one what was broken. That Artist knew how to do this; let no one despair: it is indeed a great thing, but reflect who that Artist was. He who made, restored: He who formed, reformed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"
