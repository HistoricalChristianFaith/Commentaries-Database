[[commentary]]
quote='''
After these differences have been explained, he returns to the figure from which he had begun, whose sequence he had suspended, when he said: For as through one man sin entered into this world, and through sin, death. To which he now returns, when he says: Therefore, as through one man's offense it came upon all men unto condemnation, so also through one man's righteous act it comes upon all men unto justification of life. For as through the disobedience of one man many were made sinners, so also through the obedience of one many shall be made righteous. This is the figure of the coming Adam, of which he had begun to speak above, and, interposing certain of its differences, he had deferred the sequence, to which he now, returning, brought his conclusion, saying: Therefore, as through one man's offense it came upon all men, etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
