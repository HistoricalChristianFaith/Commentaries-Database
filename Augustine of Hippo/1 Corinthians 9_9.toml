[[commentary]]
quote='''
It is too little to say, thee; the sparrow, the locust, the worm, none of these did He not make, and He careth for all. His care refers not to His commandment, for this commandment He gave to man alone.…As regards then the tenor of the commandment, “God doth not take care for oxen:” as regards His providential care of the universe, whereby He created all things, and ruleth the world, “Thou, Lord, shalt save both man and beast.” Here perhaps some one may say to me, “God careth not for oxen,” comes from the New Testament: “Thou, Lord, shalt save both man and beast,” is from the Old Testament. There are some who find fault and say, that these two Testaments agree not with one another.…Let us hear the Lord Himself, the Chief and Master of the Apostles: “Consider,” saith He, “the fowls of the air; they sow not, neither do they reap, nor gather into barns, and your heavenly Father feedeth them.” Therefore even beside men, these animals are objects of care to God, to be fed, not to receive a law. As far then as regards giving a law, “God careth not for oxen:” as regards creating, feeding, governing, ruling, all things have to do with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
