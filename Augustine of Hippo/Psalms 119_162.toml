[[commentary]]
quote='''
Then follows, “I am as glad of Thy word as one that findeth great spoils” (ver. 162). By the same words he conquered, of which he stood in awe. For spoils are stripped from the conquered; as he was overcome and despoiled of whom it is said in the Gospel, “except he first bind the strong man.” But many spoils were found, when, admiring the endurance of the Martyrs, even the persecutors believed; and they who had plotted to injure our King by the injury of His soldiers, were gained over by Him in addition. Whoever therefore standeth in awe of the words of God, fearing lest he be overcome in the contest, rejoiceth as conqueror in the same words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
