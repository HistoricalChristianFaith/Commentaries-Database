[[commentary]]
quote='''
When he says: For until the law sin was in the world, it must be understood: until grace should come. For it was said against those who suppose that sins could be taken away through the law. For the Apostle says that sins were made manifest through the law, but not taken away, when he says: But sin was not imputed when there was no law. For he does not say: There was no sin, but: it was not imputed. Nor, when the law was given, was it taken away, but it began to be imputed, that is, to appear. Let us not, then, suppose that until the law was said as though there were no sin now under the law; rather it was said thus: until the law, so that you may count the whole time of the law up to the end of the law, which is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
