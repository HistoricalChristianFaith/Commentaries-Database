[[commentary]]
quote='''
(Tr. cxvi) They, i. e. the soldiers, the guards of the governor, as appears more clearly afterwards; Then the soldiers when they had crucified Jesus; though the Evangelist might justly have attributed the whole to the Jews, who were really the authors of what they procured to be done.

(Tr. xxxi. in fin.) Yea, even the cross, if thou consider it, was a judgment seat: for the Judge being the middle, one thief, who believed, was pardoned, the other, who mocked, was damned: a sign of what He would once do to the quick and dead, place the one on His right hand, the other on His left.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew continues his narrative in the following terms: "Then were there two robbers crucified with Him, one on the right hand, and another on the left." Mark and Luke give it also in a similar form. Neither does John raise any question of difficulty, although he has made no mention of those robbers. For he says, "And two other with Him, on either side one, and Jesus in the midst." But there would have been a contradiction if John had spoken of these others as innocent, while the former evangelists called them robbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 14"
