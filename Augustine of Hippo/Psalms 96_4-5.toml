[[commentary]]
quote='''
We have heard who are the gods that being made are justified, because they are called the sons of God: and who are the gods that are not Gods, to whom the God of gods is terrible? For another Psalm saith, “He is terrible over all gods.” And as if thou shouldest enquire, what gods? He saith, “For all the gods of the nations are devils.” To the gods of the nations, to the devils, terrible: to the gods made by Himself, to sons, lovely. Furthermore, I find both of them confessing the Majesty of God, both the devils confessed Christ, and the faithful confessed Christ. “Thou art Christ, the Son of the living God,” said Peter. “We know who Thou art, Thou art the Son of God,” said the devils. A like confession I hear, but like love I find not; nay even here love, there fear. To whom therefore He is lovely, the same are sons; to whom He is terrible, are not sons; to whom He is lovely, the same He hath made gods; those to whom He is terrible He doth prove not to be gods. For these are made gods, those are reputed gods; these Truth maketh gods, those error doth so account.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252050.html'
source_title="Exposition on Psalm 50"

[[commentary]]
quote='''
…For when he had said, “He is more to be feared than all gods:” he added, “As for all the gods of the heathen, they are devils.”…Because “all the gods of the heathen are devils.” And is this all the praise of Him who cannot worthily be praised, that He is above all the gods of the heathen, which are devils? Wait, and hear what followeth: “It is the Lord that made the heavens.” Not above all gods only therefore, but above all the heavens which He made, is the Lord. If he were to say, “above all gods, for the gods of the heathen are devils,” and if the praise of our Lord stopped here, he had said less than we are accustomed to think of Christ; but when he said, “But it is the Lord that made the heavens;” see what difference there is between the heavens and devils: and what between the heavens and Him who made the heavens; behold how exalted is the Lord. He said not, But the Lord sitteth above the heavens; for perhaps some one else might be imagined to have made them, upon which He was enthroned: but, “It is the Lord that made the heavens.” If He made the heavens, He made the Angels also: Himself made the Angels, Himself made the Apostles. The devils yielded to the Apostles: but the Apostles themselves were heavens, who bore the Lord.…O heavens, which He made, declare His honour unto the heathen! Let His house be built throughout the earth, let all the earth sing a new song.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252096.html'
source_title="Exposition on Psalm 96"

[[commentary]]
quote='''
But it is asked, If men are called gods to whom the word of the Lord came, are the Angels to be called gods, when the greatest reward which is promised to just and holy men is the being equal to Angels? In the Scriptures I know not whether it can, at least easily, be found, that the Angels are openly called gods; but when it had been said of the Lord God, “He is terrible, above all gods,” he adds, as by way of exposition why he says this, “for the gods of the heathen are devils,” that we might understand what had been expressed in the Hebrew, “the gods of the Gentiles are idols,” meaning rather the devils which dwell in the idols. For as regards images, which in Greek are called idols, a name we now use in Latin, they have eyes and see not, and all the other things which are said of them, because they are utterly without sense; wherefore they cannot be frightened, for nothing which has no sense can be frightened. How then can it be said of the Lord, “He is terrible above all gods, because the gods of the Gentiles are idols,” if the devils which may be terrified are not understood to be in these images. Whence also the Apostle says, “We know that an idol is nothing.” This refers to its earthy senseless material. But that no one may think, that there is no living and sentient nature, which delights in the Gentile sacrifices, he adds, “But what the Gentiles sacrifice, they sacrifice to devils, and not to God: I would not have you partakers with devils.” If therefore we never find in the divine words that the holy Angels are called gods, I think the best reason is, that men may not be induced by the name to pay that ministry and service of religion (which in Greek is called λειτουργία or λατρία) to the holy Angels, which neither would they have paid by man at all, save to that God, who is the God of themselves and men. Hence they are much more correctly called Angels, which in Latin is Nuntii, that by the name of their function, not their substance, we may plainly understand that they would have us worship the God, whom they announce. The whole then of that question the Apostle has briefly expounded, when he says, “For though there be who are called gods, whether in heaven or in earth, as there are gods many and lords many; yet we have one God the Father, from whom are all, and we in Him; and one Lord Jesus Christ, by whom are all things, and we by Him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520136.html'
source_title="Exposition on Psalm 136"
