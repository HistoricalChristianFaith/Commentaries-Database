[[commentary]]
quote='''
“Magnifying the salvation of His King” (ver. 50). God, who magnifieth, so as to make wonderful, the salvation, which His Son giveth to believers. “And showing mercy to His Christ:” God, who showeth mercy to His Christ: “To David and to His seed for evermore:” to the Deliverer Himself strong of hand, who hath overcome this world; and to them whom, as believers in the Gospel, He hath begotten for evermore. What things soever are spoken in this Psalm which cannot apply to the Lord Himself personally, that is to the Head of the Church, must be referred to the Church. For whole Christ speaks here, in whom are all His members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
