
[[commentary]]
quote='''
“He made the rivers a wilderness” (ver. 33). Waters did run there, prophecies were in course. Seek now a prophet among the Jews; thou findest none. For “He made the outgoings of waters to be thirst.” Let them say, “Now there is no prophet more, and He will not know us any more.” “A fruitful land to be saltpools” (ver. 34). Thou seekest there the faith of Christ, thou findest not: thou seekest a prophet, thou findest not: thou seekest a sacrifice, thou findest not: thou seekest a temple, thou findest none. Wherefore this? “From the wickedness of them that dwell therein.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
