[[commentary]]
quote='''
Listen to the apostle, when he says, "We are a sweet savor of Christ in every place." As it is said also in the Song of Songs, "Thy name is as ointment poured forth." Attend again to the apostle: "We are a sweet savor," he says, "of Christ in every place, both in them that are saved, and in them that perish. To the one we are the savor of life unto life, to the other the savor of death unto death: and who is sufficient for these things?" The lesson of the holy Gospel before us affords us the opportunity of so speaking of that savor, that we on our part may give worthy utterance, and you diligent heed, to what is thus expressed by the apostle himself, "And who is sufficient for these things?" But have we any reason to infer from these words that we are qualified to attempt speaking on such a subject, or you to hear? We, indeed, are not so; but He is sufficient, who is pleased to speak by us what it may be for your profit to hear. The apostle, you see, is, as he calls himself, "a sweet savor:" but that sweet savor is "to some the savor of life unto life, and to others the savor of death unto death;" and yet all the while "a sweet savor" in itself. For he does not say, does he, To some we are a sweet savor unto life, to others an evil savor unto death? He called himself a sweet savor, not an evil; and represented himself as the same sweet savor, to some unto life, to others unto death. Happy they who find life in this sweet savor! but what misery can be greater than theirs, to whom the sweet savor is the messenger of death?

And who is it, says some one, that is thus slain by the sweet savor? It is to this the apostle alludes in the words, "And who is sufficient for these things?" In what wonderful ways God brings it about that the good savor is fraught both with life to the good, and with death to the wicked; how it is so, so far as the Lord is pleased to inspire my thoughts (for it may still conceal a deeper meaning beyond my power to penetrate),-yet so far, I say, as my power of penetration has reached, you ought not to have the information withheld. The integrity of the Apostle Paul's life and conduct, his preaching of righteousness in word and exhibition of it in works, his wondrous power as a teacher and his fidelity as a steward, were everywhere noised abroad: he was loved by some, and envied by others. For he himself tells us in a certain place of some, that they preached Christ not sincerely, but of envy; "thinking," he says, "to add affliction to my bonds." But what does he add? "Whether in pretence or in truth, let Christ be preached." They preach who love me, they preach who hate me; in that good savor the former live, in it the others die: and yet by the preaching of both let the name of Christ be proclaimed, with this excellent savor let the world be filled. Hast thou been loving one whose conduct evidenced his goodness then in this good savor thou hast lived. Hast thou been envying such a one then in this same savor thou hast died. But hast thou, pray, in thus choosing to die, converted this savor into an evil one? Turn from thine envious feelings, and the good savor will cease to slay thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
