[[commentary]]
quote='''
(Tract. xxxvi. 7) But if the Father is with Thee, how did He send Thee? O Lord, Thy mission is Thy incarnation. Christ was here according to the flesh without withdrawing from the Father, because the Father and the Son are every where. Blush, thou Sabellian; our Lord doth not say, I am the Father, and I the self-same person am the Son; but, I am not alone, because the Father is with Me. Make a distinction then of persons, and distinction of intelligences: acknowledge that the Father is the Father, the Son the Son: but beware of saying, that the Father is greater, the Son less. Theirs is one substance, one coeternity, perfect equality. Therefore, He says, My judgment is true, because I am the Son of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But that you may know that Christ is judge even now, hear what follows: "And if I judge, my judgment is true." Behold, thou hast Him as thy judge, but acknowledge Him as thy Saviour, lest thou feel the judge. But why has He said that His judgment is true? "Because," saith He, "I am not alone, but I and the Father that sent me." I have said to you, brethren, that this holy Evangelist John soars exceedingly high: it is with difficulty that he is comprehended. But we need to remind you, beloved, of the deeper mystery of this soaring. Both in the prophet Ezekiel, and in the Apocalypse of this very John whose Gospel this is, there is mentioned a fourfold living creature, having four characteristic faces; that of a man, of an ox, of a lion, and of an eagle. Those who have handled the mysteries of Holy Scripture before us have, for the most part, understood by this living creature, or rather, these four living creatures, the four evangelists. They have understood the lion as put for king, because he appears to be, in a manner, the king of beasts on account of his strength and terrible valor. This character is assigned to Matthew, because in the generations of the Lord he followed the royal line, showing how the Lord was, along the royal line, of the seed of David. But Luke, because he begins with the priesthood of Zacharias, mentioning the father of John the Baptist, is designated the ox; for the ox was an important victim in the sacrifice of the priests. To Mark is deservedly assigned the man Christ, because neither has he said anything of the royal authority, nor did he begin with the priestly function, but only set out with the man Christ. All these have departed but little from the things of earth, that is, from those things which our Lord Jesus Christ performed on earth; of His divinity they have said very little, like men walking with Him on the earth. There remains the eagle; this is John, the preacher of sublime truths, and a contemplator with steady gaze of the inner and eternal light. It is said, indeed, that the young eagles are tested by the parent birds in this way: the young one is suspended from the talons of the male parent and directly exposed to the rays of the sun; if it looks steadily at the sun, it is recognized as a true brood; if its eye quivers, it is allowed to drop off, as a spurious brood. Now, therefore, consider how sublime are the things he ought to speak who is compared to the eagle; and yet even we, who creep on the earth, weak and hardly of any account among men, venture to handle and to expound these things; and imagine that we can either apprehend when we meditate them, or be apprehended when we speak.

Why have I said this? For perhaps after these words one may justly say to me: Lay aside the book then. Why dost thou take in hand what exceeds thy measure? Why trust thy tongue to it? To this I reply: Many heretics abound; and God has permitted them to abound to this end, that we may not be always nourished with milk and remain in senseless infancy. For inasmuch as they have not understood how the divinity of Christ is set forth to our acceptance, they have concluded according to their will: and by not discerning aright, they have brought in most troublesome questions upon catholic believers; and the hearts of believers began to be disturbed and to waver. Then immediately it became a necessity for spiritual men, who had not only read in the Gospel anything respecting the divinity of our Lord Jesus Christ, but had also understood it, to bring forth the armor of Christ against the armor of the devil, and with all their might to fight in most open conflict for the divinity of Christ against false and deceitful teachers; lest, while they were silent, others might perish. For whoever have thought either that our Lord Jesus Christ is of another substance than the Father is, or that there is only Christ, so that the same is Father, Son, and Holy Spirit; whoever also have chosen to think that He was only man, not God made man, or God in such wise as to be mutable in His Godhead, or God in such wise as not to be man; these have made shipwreck from the faith, and have been cast forth from the harbor of the Church, lest by their inquietude they might wreck the ships in their company. Which thing obliged that even we, though least and as regards ourselves wholly unworthy, but in regard of His mercy set in some account among His stewards, should speak to you what either you may understand and rejoice with me, or, if you cannot yet understand, by believing it you may remain secure in the harbor.

I will accordingly speak; let him who can, understand; and let him who cannot understand, believe: yet will I speak what the Lord saith, "Ye judge after the flesh; I judge not any man," either now, or after the flesh. "But even, if I judge, my judgment is true." Why is Thy judgment true? "Because I am not alone," saith He, "but I and the Father that sent me." What then, O Lord Jesus? If Thou wert alone would Thy judgment be false: and is it because Thou art not alone, but Thou and the Father that sent Thee, that Thou judgest truly? How shall I answer? Let Himself answer: He saith, "My judgment is true." Why? "Because I am not alone, but I and the Father that sent me." If He is with Thee, how has He sent Thee? And has He sent Thee, and yet is He also with Thee? Is it so that having been sent, Thou hast not departed from Him? And didst Thou come to us, and yet abode there? How is this to be believed how apprehended? To these two questions I answer: Thou sayest rightly, how is it to be apprehended; how believed, thou sayest not rightly. Rather, for that reason is it right to believe it, because it is not immediately to be apprehended; for if it were a thing to be immediately apprehended, there would be no need to believe it, because it would be seen. It is because thou dost not apprehend that thou believest; but by believing thou art made capable of apprehending. For if thou dost not believe, thou wilt never apprehend, since thou wilt remain less capable. Let faith then purify thee, that understanding may fill thee. "My judgment is true," saith He, "because I am not alone, but I and the Father that sent me." Therefore, O Lord our God, Jesus Christ, Thy sending is Thy incarnation. So I see, so I understand: in short, so I believe, in case it may smack of arrogance to say, so I understand. Doubtless the Lord Jesus Christ is even here; rather, was here as to His flesh, is here now as to His Godhead: He was both with the Father and had not left the Father. Hence, in that, He is said to have been sent and to have come to us, His incarnation is set forth to us, for the Father did not take flesh.

For there are certain heretics called Sabellians, who are also called Patripassians, who affirm that it was the Father Himself that had suffered. Do not thou so affirm, O Catholic; for if thou wilt be a Patripassian, thou wilt not be sane. Understand, then, that the incarnation of the Son is termed the sending of the Son; and do not believe that the Father was incarnate, but do not yet believe that He departed from the incarnate Son. The Son carried flesh, the Father was with the Son. If the Father was in heaven, the Son on earth, how was the Father with the Son? Because both Father and Son were everywhere: for God is not in such manner in heaven as not to be on earth. Hear him who would flee from the judgment of God, and found not a way to flee by: "Whither shall I go," saith he, "from Thy Spirit; and whither shall I flee from Thy face? If I ascend up into heaven, Thou art there." The question was about the earth; hear what follows: "If I descend unto hell, Thou art there." If, then, He is said to be present even in hell, what in the universe remains where He is not present? For the voice of God with the prophet is, "I fill heaven and earth." Hence He is everywhere, who is confined by no place. Turn not thou away from Him, and He is with thee. If thou wouldst come to Him, be not slow to love; for it is not with feet but with affections thou runnest. Thou comest while remaining in one place, if thou believest and lovest. Wherefore He is everywhere; and if everywhere, how not also with the Son? Is it so that He is not with the Son, while, if thou believest, He is even with thee?

How, then, is His judgment true, but because the Son is true? For this He said: "And if I judge, my judgment is true; because I am not alone, but I and the Father that sent me." Just as if He had said, "My judgment is true," because I am the Son of God. How dost Thou prove that Thou art the Son of God? "Because I am not alone, but I and the Father that sent me." Blush, Sabellian; thou hearest the Son, thou hearest the Father. Father is Father, Son is Son. He said not, I am the Father. and I the same am the Son; but He saith, "I am not alone." Why art Thou not alone? Because the Father is with me. "I am, and the Father that sent me;" thou hearest, "I am, and He that sent me." Lest thou lose sight of the person, distinguish the persons. Distinguish by understanding, do not separate by faithlessness; lest again, fleeing as it were Charybdis, thou rush Upon Scylla. For the whirlpool of the impiety of the Sabellians was swallowing thee, to say that the Father is the same who is Son: just now thou hast learned, "I am not alone, but I and the Father that sent me." Thou dost acknowledge that the Father is Father, and that the Son is Son thou dost rightly acknowledge: but do not say the Father is greater, the Son is less; do not say, the Father is gold, the Son is silver. There is one substance, one Godhead, one co-eternity, perfect equality, no unlikeness. For if thou only believe that Christ is another, not the same person that the Father is, but yet imagine that in respect of His nature He is somewhat different from the Father, thou hast indeed escaped Charybdis, but thou hast been wrecked on the rocks of Scylla. Steer the middle course, avoid each of the two perilous sides. Father is Father, Son is Son. Thou sayest now, Father is Father, Son is Son: thou hast fortunately escaped the danger of the absorbing whirl; why wouldst thou go unto the other side to say, the Father is this, the Son that? The Son is another person than the Father is, this thou sayest rightly; but that He is different in nature, thou sayest not rightly. Certainly the Son is another person, because He is not the same who is Father and the Father is another person, because He is not the same who is Son: nevertheless, they are not different in nature, but the selfsame is both Father and Son. What means the self-same? God is one. Thou hast heard, "Because I am not alone, but I and the Father that sent me:" hear how thou mayest believe Father and Son; hear the Son Himself, "I and the Father are one." He said not, I am the Father; or, I and the Father is one person; but when He says, "I and the Father are one," hear both, both the one, unum, and the are, sumus, and thou shalt be delivered both from Charybdis and from Scylla. In these two words, in that He said one, He delivers thee from Arius; in that He said are, He delivers thee from Sabellius. If one, therefore not diverse; if are, therefore both Father and Son. For He would not say are of one person; but, on the other hand, He would not say one of diverse. Hence the reason why He says, "my judgment is true," is, that thou mayest hear it briefly, because I am the Son of God. But I would have thee in such wise believe that I am the Son of God, that thou mayest understand that the Father is with me: I am not Son in such manner as to have left Him; I am not in such manner here that I should not be with Him; nor is He in such manner there as not to be with me: I have taken to me the form of a servant, yet have I not lost the form of God; therefore He saith, "I am not alone, but I and the Father that sent me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"

[[commentary]]
quote='''
Let it not by any means surprise any one that He says, "My judgment is true; because I am not alone, but I and the Father that sent me;" whilst He has said in another place, "The Father judgeth not any man, but all judgment hath He given to the Son." We have already discoursed on these same words of the evangelist, and we remind you now that this was not said because the Father will not be with the Son when He comes to judge, but because the Son alone will be apparent to the good and the bad in the judgment, in that form in which He suffered, and rose again, and ascended into heaven. For at that moment, indeed, as they were beholding Him ascending, the angelic voice sounded in the ears of His disciples, "So shall He come in like manner as ye have seen Him going into heaven;" that is, in the form of man in which He was judged, will He judge, in order that also that prophetic utterance may be fulfilled, "They shall look upon Him whom they pierced." But when the righteous go into eternal life, we shall see Him as He is; that will not be the judgment of the living and the dead, but only the reward of the living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252036.html'
source_title="Tractates on John 36"
