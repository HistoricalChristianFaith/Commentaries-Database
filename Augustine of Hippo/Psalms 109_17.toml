[[commentary]]
quote='''
As for the passage from the psalm, "He loved cursing, and it shall come upon him; and he willed not blessing, so it shall be far removed from him," which he quoted in the same book of Chapters, as if to prove that "all men are ruled by their own will," who can be ignorant that this is a fault not of nature as God created it, but of human will which departed from God? The fact indeed is, that even if he had not loved cursing, and had willed blessing, he would in this very case, too, deny that his will had received any assistance from God; in his ingratitude and impiety, moreover, he would submit himself to be ruled by himself, until he found out by his penalties that, sunk as he was into ruin, without God to govern him he was utterly unable to direct his own self.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520the%2520Proceedings%2520of%2520Pelagius.html'
source_title="On the Proceedings of Pelagius, Chapter 7"

[[commentary]]
quote='''
The Psalm then continueth: “His delight was in cursing, and it shall happen to him” (ver. 17). Although Judas loved cursing, both in stealing from the money bag, and selling and betraying the Lord: nevertheless, that people more openly loved cursing, when they said, “His blood be on us, and on our children.” “He loved not blessing, therefore it shall be far from him.” Such was Judas indeed, since he loved not Christ, in whom is everlasting blessing; but the Jewish people still more decidedly refused blessing, unto whom he who had been enlightened by the Lord said, “Will ye also be His disciples?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
