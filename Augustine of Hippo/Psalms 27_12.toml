[[commentary]]
quote='''
“Deliver me not up unto the souls of them that trouble me” (ver. 12). Suffer not them that trouble me to be satiated with my evils. “For unrighteous witnesses have risen up against me.” For there have risen up against me they that speak falsely of me, to remove and call me back from Thee, as if I seek glory of men. “And iniquity hath lied unto itself.” Therefore iniquity hath been pleased with its own lie. For me it hath not moved, to whom because of this there hath been promised a greater reward in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
