[[commentary]]
quote='''
For what hath he put hand? For power. For we say that a man hath that in his hand which he hath in his power: just as the devil said to God concerning Job, “Lay to Thine hand, and take away the things which he hath.” What is, lay to Thine hand? Put forth power. The hand of God he hath called the power of God: as hath been written in another place, “death and life are in the hands of the tongue.” Hath the tongue hands? But what is, in the hands of the tongue? In the power of the tongue. What is, in the power of the tongue? “Out of thy mouth thou shalt be justified, and out of thy mouth thou shalt be condemned.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
