[[commentary]]
quote='''
But concerning true patience, worthy of the name of this virtue, whence it is to be had, must now be inquired. For there are some who attribute it to the strength of the human will, not which it hath by Divine assistance, but which it hath of free-will. Now this error is a proud one: for it is the error of them which abound, of whom it is said in the Psalm, "A scornful reproof to them which abound, and a despising to the proud." It is not therefore that "patience of the poor" which "perisheth not forever." For these poor receive it from that Rich One, to Whom is said, "My God art Thou, because my goods Thou needest not:" of Whom is "every good gift, and every perfect gift;" to Whom crieth the needy and the poor, and in asking, seeking, knocking, saith, "My God, deliver me from the hand of the sinner, and from the hand of the lawless and unjust: because Thou art my patience, O Lord, my hope from my youth up." But these which abound, and disdain to be in want before God, lest they receive of Him true patience, they which glory in their own false patience, seek to "confound the counsel of the poor, because the Lord is his hope." Nor do they regard, seeing they are men, and attribute so much to their own, that is, to the human will, that they run into that which is written, "Cursed is every one who putteth his hope in man." Whence even if it chance them that they do bear up under any hardships or difficulties, either that they may not displease men, or that they may not suffer worse, or in self-pleasing and love of their own presumption, do with most proud will bear up under these same, it is meet that concerning patience this be said unto them, which concerning wisdom the blessed Apostle James saith, "This wisdom cometh not from above, but is earthly, animal, devilish." For why may there not be a false patience of the proud, as there is a false wisdom of the proud? But from Whom cometh true wisdom, from Him cometh also true patience. For to Him singeth that poor in spirit, "Unto God is my soul subjected, because from Him is my patience."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520Patience.html'
source_title="On Patience, Section 12"

[[commentary]]
quote='''
“Our soul is filled exceedingly; a reproach to the wealthy, and a contempt to the proud” (ver. 4). We were asking who were “the wealthy:” he hath expounded to thee, in that he hath said, “the proud.” “Reproach” and “contempt” are the same: and “wealthy” is the same with “proud.” It is a repetition of the sentence, “a reproach to the wealthy, and a contempt to the proud.” Why are the proud wealthy? Because they wish to be happy here. Why? since they themselves too are miserable, are they wealthy? But perhaps when they are miserable, they do not mock us. Listen, my beloved. Then perchance they mock when they are happy, when they boast themselves in the pomp of their riches! when they boast themselves in the inflated state of false honours: then they mock us, and seem to say, Behold, it is well with me: I enjoy the good things before me: let those who promise what they cannot show depart from me: what I see, I hold; what I see, I enjoy; may I fare well in this life. Be thou more secure; for Christ hath risen again, and hath taught thee what He will give in another life: be assured that He giveth it. But that man mocketh thee, because he holdeth what he hath. Bear with his mockeries, and thou wilt laugh at his groans: for afterwards there will come a season when these very persons will say, “This was he whom we had sometimes in derision.”…

To this we must add, that sometimes those also who are beneath the scourge of temporal unhappiness, mock us…Did not the robber mock, who was crucified with our crucified Lord? If therefore they who are not wealthy mock us, why doth the Psalm say, “A reproach to the wealthy”? If we carefully sift the matter, even these (the unfortunate) are wealthy. How are they wealthy? Yea; for if they were not wealthy, they would not be proud. For one man is wealthy in money, and proud on that score: another is wealthy in honours, and is proud on that account: another imagines himself wealthy in righteousness, and hence his pride, which is worse. They who seem not to be wealthy in money, seem to themselves to be wealthy in righteousness towards God; and when calamity overtakes them, they justify themselves, accuse God, and say, What wrong have I been guilty of, or, what have I done? Thou repliest: Look back, call to mind thy sins, see if thou hast done nothing. He is somewhat touched in conscience, and returneth to himself, and thinketh of his evil deeds; and when he hath thought of his evil deeds, not even then doth he choose to confess that he deserves his sufferings; but saith, Behold, I have clearly done many things; but I see that many have done worse, and suffer no evil. He is righteous against God. He also therefore is wealthy: he hath his breast puffed out with righteousness; since God seemeth to him to do ill, and he seemeth to himself to suffer unjustly. And if thou gavest him a vessel to pilot, he would be shipwrecked with it: yet he wishes to deprive God of the government of this world, and himself to hold the helm of Creation, and to distribute among all men pains and pleasures, punishments and rewards. Miserable soul! yet why do ye wonder? He is wealthy, but wealthy in iniquity, wealthy in malignity; but is more wealthy in iniquity, in proportion as he seemeth to himself to be wealthy in righteousness.

But a Christian ought not to be wealthy, but ought to acknowledge himself poor; and if he hath riches, he ought to know that they are not true riches, so that he may desire others…And what is the wealth of our righteousness? How much soever righteousness there may be in us, it is a sort of dew compared to that fountain: compared to that plenteousness it is as a few drops, which may soften our life, and relax our hard iniquity. Let us only desire to be filled with the full fountain of righteousness, let us long to be filled with that abundant richness, of which it is said in the Psalm, “They shall be satisfied with the plenteousness of Thy house: and Thou shalt give them drink out of the torrent of Thy pleasure.” But while we are here, let us understand ourselves to be destitute and in want; not only in respect of those riches which are not the true riches, but of salvation itself. And when we are whole, let us understand that we are weak. For as long as this body hungers and thirsts, as long as this body is weary with watching, weary with standing, weary with walking, weary with sitting, weary with eating; whithersoever it turneth itself for a relief from weariness, there it discovereth another source of fatigue: there is therefore no perfect soundness, not even in the body itself. Those riches are then not riches, but beggary; for the more they abound, the more doth destitution and avarice increase…Let then our whole hunger, our whole thirst, be for true riches, and true health, and true righteousness. What are true riches? That heavenly abode in Jerusalem. For who is called rich on this earth? When a rich man is praised, what is meant? He is very rich: nothing is wanting to him. That surely is the praise of him that praiseth the other: for it is not this, when it is said, He wants nothing. Consider if he really want nothing. If he desires nothing, he wants nothing: but if he still desires more than what he hath, his riches have increased in such wise, that his wants have increased also. But in that City there will be true riches, because there will be nothing wanting to us there; for we shall not be in need of anything, and there will be true health…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520123.html'
source_title="Exposition on Psalm 123"
