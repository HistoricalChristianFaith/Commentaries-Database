[[commentary]]
quote='''
(Tr. xxviii. 2) As the believer in Christ would have in time to come to hide himself from persecution, that no guilt might attach to such concealment, the Head began with doing Himself, what He sanctioned in the member; After these things Jesus walked in Galilee: for he would not walk in Jewry, because the Jews sought to kill Him.

(Tr. xxviii. 2) It is not meant that our Lord could not walk among the Jews, and escape being killed; for He had this power, whenever He chose to show it: but He set the example of so doing, as an accommodation to our weakness. He had not lost His power, but He indulged our frailty.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"
