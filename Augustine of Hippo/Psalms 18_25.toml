[[commentary]]
quote='''
“With the holy Thou shalt be holy” (ver. 25). There is a hidden depth also, wherein Thou art known to be holy with the holy, for that Thou makest holy. “And with the harmless Thou shalt be harmless.” For Thou harmest no man, but each one is bound by the bands of his own sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
