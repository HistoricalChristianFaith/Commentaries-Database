[[commentary]]
quote='''
For not only was baptism not profitable to thee, and not also hurtful Even holy things may be hurtful. In the good, indeed, holy things are to salvation; in the evil, to judgment. For we certainly know, brethren, what we receive, and what we receive is at any rate holy, and no one says that it is not: and what says the apostle? "But he that eateth and drinketh unworthily, eateth and drinketh judgment to himself." He does not say that the thing itself is bad, but that the evil man, by receiving it amiss , receives the good thing which he does receive to judgment. Was that morsel which the Lord delivered to Judas evil? God forbid. The physician would not give poison; it was health the physician gave; but by unworthily receiving it, he who received it not being at peace, received it unto destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"

[[commentary]]
quote='''
For even we at this day receive visible food: but the sacrament is one thing, the virtue of the sacrament another. How many do receive at the altar and die, and die indeed by receiving? Whence the apostle saith, "Eateth and drinketh judgment to himself." For it was not the mouthful given by the Lord that was the poison to Judas. And yet he took it; and when he took it, the enemy entered into him: not because he received an evil thing, but because he being evil received a good thing in an evil way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
