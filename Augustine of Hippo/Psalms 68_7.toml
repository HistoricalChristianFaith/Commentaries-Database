[[commentary]]
quote='''
“O God, when Thou wentest forth before Thy people” (ver. 7). His going forth is perceived, when He appeareth in His works. But He appeareth not to all men, but to them that know how to spy out His works. For I do not now speak of those works which are conspicuous to all men, Heaven and earth and sea and all things that in them are; but the works whereby He leadeth forth men fettered in strength, likewise men provoking that dwell in the tombs, and maketh them of one manner to dwell in a house. Thus He goeth forth before His people, that is, before those that do perceive this His Grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
