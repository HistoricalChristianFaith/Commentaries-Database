[[commentary]]
quote='''
(Serm. 210. 3.) Otherwise; Every one who rightly fasts, either humbles his soul in the groaning of prayer, and bodily chastisement, or suspends the motion of carnal desire by the joys of spiritual meditation. And the Lord here makes answer respecting both kinds of fasting; concerning the first, which is in humiliation of soul, He says, The children of the bridegroom cannot mourn. Of the other which has a feast of the Spirit, He next speaks, where He says, No man putteth a patch of undressed cloth. Then we must mourn because the Bridegroom is taken away from us. And we rightly mourn if we burn with desire of Him. Blessed they to whom it was granted before His passion to have Him present with them, to enquire of Him what they would, to hear what they ought to hear. Those days the fathers before His coming sought to see, and saw them not, because they were placed in another dispensation, one in which He was proclaimed as coming, not one in which He was heard as present. For in us was fulfilled that He speaks of, The days shall come when ye shall desire to see one of these days, and shall not be able. (Luke 17:22.) Who then will not mourn this? Who will not say, My tears have been my meat day and night, while they daily say unto me, Where is now thy God? (Ps. 42:3.) With reason then did the Apostle seek to die and to be with Christ.

(De Cons. Ev. ii. 27.) That Matthew writes here mourn, where Mark and Luke write fast, shows that the Lord spake of that kind of fasting which pertains to humbling one's self in chastisement; as in the following comparisons He may be supposed to have spoken of the other kind which pertains to the joy of a mind wrapt in spiritual thoughts, and therefore averted from the food of the body; showing that those who are occupied about the body, and owing to this retain their former desires, are not fit for this kind of fasting.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Once more, we find that Matthew and Mark have given similar accounts of what was said about the children of the bridegroom not fasting as long as the bridegroom is with them, with this exception, that Mark has named them the children of the bridals, while Matthew has designated them the children of the bridegroom. That, however, is a matter of no moment. For by the children of the bridals we understand at once those connected with the bridegroom, and those connected with the bride. The sense, therefore, is obvious and identical, and neither different nor contradictory. Luke, again, does not say, "Can the children of the bridegroom fast?" but, "Can ye make the children of the bridegroom fast, while the bridegroom is with them?" By expressing it in this method, the evangelist has elegantly opened up the self-same sense in a way calculated to suggest something else. For thus the idea is conveyed, that those very persons who were speaking would try to make the children of the bridegroom mourn and fast, inasmuch as they would [seek to] put the bridegroom to death. Moreover, Matthew's phrase, "mourn," is of the same import as that used by Mark and Luke, namely, "fast." For Matthew also says further on, "Then shall they fast," and not, "Then shall they mourn." But by the use of this phrase, he has indicated that the Lord spoke of that kind of fasting which pertains to the lowliness of tribulation. In the same way, too, the Lord may be understood to have pictured out a different kind of fasting, which stands related to the rapture of a mind dwelling in the heights of things spiritual, and for that reason estranged in a certain measure from the meats that are for the body, when He made use of those subsequent similitudes touching the new cloth and the new wine, by which He showed that this kind of fasting is an incongruity for sensual and carnal people, who are taken up with the cares of the body, and who consequently still remain in the old mind. These similitudes are also embodied in similar terms by the other two evangelists. And it should be sufficiently evident that there need be no real discrepancy, although one may introduce something, whether belonging to the subject-matter itself, or merely to the terms in which that subject is expressed, which another leaves out; provided only that there be neither any departure from a genuine identity in sense, nor any contradiction created between the different forms which may be adopted for expressing the same thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 27"
