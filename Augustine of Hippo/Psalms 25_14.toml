[[commentary]]
quote='''
“The Lord is the stay of them that fear Him” (ver. 14). Fear seems to belong to the weak, but the Lord is the stay of them that fear Him. And the Name of the Lord, which hath been glorified throughout the whole world, is a stay to them that fear Him. “And His testament, that it may be manifested unto them.” And He maketh His testament to be manifested unto them, for the Gentiles and the bounds of the earth are Christ’s inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
