[[commentary]]
quote='''
“Thou hast set our misdeeds before Thee” (ver. 8): that is, Thou hast not dissembled Thine anger: “and our age in the light of Thy countenance.” “The light of Thy countenance” answers to “before Thee,” and to “our misdeeds,” as above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252090.html'
source_title="Exposition on Psalm 90"
