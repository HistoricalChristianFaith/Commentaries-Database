[[commentary]]
quote='''
When he says: For a woman, while her husband lives, is bound by the law to her husband; but if her husband dies, she is released from the law of her husband, etc., it must be noted that this comparison differs in this from the matter for which it was employed: that here he says the husband dies, so that the woman may marry whom she wishes, being freed from the law of her husband; but there, when he sets up the soul as the woman, and the passions of sins as the husband—which work in our members so as to bring forth fruit unto death, that is, so that from such a union offspring worthy of death may be born—and the law that was given not to take away sin or for liberation from sin, but to reveal sin before grace, through which it came about that those placed under the law were swept away by a more vehement desire of sinning and sinned still more by transgression; since, then, there too there are three: the soul as the woman, the passions of sins as the husband, and the law as the law of the husband—yet there he does not say that the soul is freed by the sins dying, as by the husband dying, but that the soul itself dies to sin and is freed from the law, so that it may belong to another husband, that is, Christ, once it has died to sin, although sin itself is as it were still living; which happens when, with the desires and certain incitements to sinning still remaining in us, we nevertheless do not obey nor consent, serving the law of God with our mind, because we are dead to sin. But sin too will die when the reformation of the body takes place in the resurrection, of which he afterward says: He will give life to your mortal bodies also, on account of his Spirit remaining in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
