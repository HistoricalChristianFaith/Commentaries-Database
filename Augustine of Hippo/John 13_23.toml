[[commentary]]
quote='''
(Tr. lxi. 4) This is John, whose Gospel this is, as he afterwards declares. It is the custom of the sacred writers, when they come to any thing relating to themselves, to speak of themselves, as if they were speaking of another. For if the thing itself is related correctly, what does truth lose by the omission of boasting on the writer's part?

(Tr. lxi. 6) For by bosom what else is signified but secret? Here is the hollow of the breast, the secret chamber of wisdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"Now there was leaning on Jesus'bosom, one of His disciples, whom Jesus loved." What he meant by saying "in His bosom," he tells us a little further on, where he says, "on the breast of Jesus." It was that very John whose Gospel is before us, as he afterwards expressly declares. For it was a custom with those who have supplied us with the sacred writings, that when any of them was relating the divine history, and came to something affecting himself, he spoke as if it were about another; and gave himself a place in the line of his narrative becoming one who was the recorder of public events, and not as one who made himself the subject of his preaching. Saint Matthew acted also in this way, when, in coming in the course of his narrative to himself, he says, "He saw a publican named Matthew, sitting at the receipt of custom, and saith unto him, Follow me." He does not say, He saw me, and said to me. So also acted the blessed Moses, writing all the history about himself as if it concerned another, and saying, "The Lord said unto Moses." Less habitually was this done by the Apostle Paul, not however in any history which undertakes to explain the course of public events, but in his own epistles. At all events, he speaks thus of himself: "I knew a man in Christ fourteen years ago, (whether in the body, or whether out of the body, I cannot tell: God knoweth;) such an one caught up into the third heaven." And so, when the blessed evangelist also says here, not, I was leaning on Jesus' bosom, but, "There was leaning one of the disciples," let us recognize a custom of our author's, rather than fall into any wonder on the subject. For what loss is there to the truth, when the facts themselves are told us, and all boastfulness of language is in a measure avoided? For thus at least did he relate that which most signally pertained to his praise.

But what mean the words, "whom Jesus loved"? As if He did not love the others, of whom this same John has said above, "He loved them to the end" (ver. 1); and as the Lord Himself, "Greater love hath no man than this, that a man lay down his life for his friends." And who could enumerate all the testimonies of the sacred pages, in which the Lord Jesus is exhibited as the lover, not only of this one, or of those who were then around Him, but of such also as were to be His members in the distant future, and of His universal Church? But there is some truth, doubtless, underlying these words, and having reference to the bosom on which the narrator was leaning. For what else can be indicated by the bosom but some hidden truth? But there is another more suitable passage, where the Lord may enable us to say something about this secret that may prove sufficient.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252061.html'
source_title="Tractates on John 61"

[[commentary]]
quote='''
And the same John is also the only one who has recorded that witness which the Lord gave concerning Himself, when He said: "He that hath seen me, hath seen the Father also;" and, "I am in the Father, and the Father is in me;" "that they may be one, even as we are one;" and, "Whatsoever the Father doeth, these same things doeth the Son likewise." And whatever other statements there may be to the same effect, calculated to betoken, to those who are possessed of right understanding, that divinity of Christ in which He is the Father's equal, of all these we might almost say that we are indebted for their introduction into the Gospel narrative to John alone. For he is like one who has drunk in the secret of His divinity more richly and somehow more familiarly than others, as if he drew it from the very bosom of his Lord on which it was his wont to recline when He sat at meat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25201.html'
source_title="The Harmony of the Gospels, Book 1, Chapter 4"

[[commentary]]
quote='''
After this, Matthew proceeds to insert the mystery of His body and blood, as it was committed then by the Lord to the disciples. Here Mark and Luke act correspondingly. But after He had handed the cup to them, [we find that] He spoke again concerning His betrayer, in terms which Luke recounts, when he says, "But, behold, the hand of him that betrayeth me is with me on the table. And truly the Son of man goeth as it was determined: but woe unto that man by whom He shall be betrayed." At this point we must now suppose that to come in which is narrated by John while these others omit it, just as John has also passed by certain matters which they have detailed. In accordance with this, after the giving of the cup, and after the Lord's subsequent saying which has been brought in by Luke,—namely, "But, behold, the hand of him that betrayeth me is with me on the table," etc.,—the statement made by John is [to be taken as immediately] subjoined. It is to the following effect: "Now there was leaning on Jesus' bosom one of His disciples, whom Jesus loved. Simon Peter therefore beckoned to him, and said unto him, Who is he of whom He speaketh? He then, when he had laid himself on Jesus' breast, saith unto Him, Lord, who is it? Jesus answered, He it is to whom I shall give a sop, when I have dipped it. And when He had dipped the sop, He gave it to Judas, the son of Simon [of] Scarioth. And after the sop Satan then entered into him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 1"
