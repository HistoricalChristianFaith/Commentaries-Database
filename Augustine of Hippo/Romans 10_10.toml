[[commentary]]
quote='''
The innumerable and multiple rites by which the Jewish people had been oppressed have been taken away, so that in the mercy of God we might attain salvation by the simplicity of a confession of faith.
'''
source_url=''
source_title="AUGUSTINE ON ROMANS 67"

[[commentary]]
quote='''
Did not almost all those who disowned Christ in the presence of their persecutors keep in their hearts what they believed about him? Yet, for not making with their mouth profession of faith unto salvation they perished, except those who repented and lived again.
'''
source_url='https://www.newadvent.org/fathers/1313.htm'
source_title="Against Lying 6.13"

[[commentary]]
quote='''
This condition is fulfilled at the time of baptism, when faith and profession of faith are all that is demanded for one to be baptized.
'''
source_url=''
source_title="THE CHRISTIAN LIFE 13"

[[commentary]]
quote='''
This profession of faith is the creed which you will be going over in your thoughts and repeating from memory.
'''
source_url='https://www.newadvent.org/fathers/1307.htm'
source_title="A Sermon to Catechumens on the Creed 1"

[[commentary]]
quote='''
We who expect to reign in everlasting righteousness can only be saved from this wicked world if while for our neighbor's salvation we profess with our lips the faith which we carry about in our heart, we exercise a pious and careful vigilance to see that this faith in us is not sullied in any point of belief by the deceitful snares of heretics.
'''
source_url='https://www.newadvent.org/fathers/1304.htm'
source_title="On Faith and the Creed 1.1"

[[commentary]]
quote='''
If we believed with the body, men might be made to believe against their will. But believing is not a thing done with the body. Hear the apostle: "With the heart man believeth unto righteousness." And what follows? "And with the mouth confession is made unto salvation." That confession springs from the root of the heart. Sometimes thou hearest a man confessing, and knowest not whether he believes. But thou oughtest not to call him one confessing, if thou shouldest judge him to be one not believing. For to confess is this, to utter the thing that thou hast in thy heart: if thou hast one thing in thy heart, and another thing on thy tongue, thou art speaking, not confessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
