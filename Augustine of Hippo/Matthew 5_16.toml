[[commentary]]
quote='''
That person places the lamp under a bushel who obscures and conceals the light of good teaching with earthbound interests. Rather, one should place the truth up high "on the lampstand." That indicates the light that shines as a result of bodily service, so that it is presented to believers through their embodied ministry. In this way our voices and tongues and other operations of the body are conveyed into good works by those who are learning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25201.html'
source_title="SERMON ON THE MOUNT 1.6.17"

[[commentary]]
quote='''
Of course, the very words of the gospel are self-explanatory. While they feed the hearts of those who knock, they do not hinder the shouts of those who hunger. One must look deeply into the human heart to see in what direction it is turned and on what point its gaze is fixed. Suppose someone desires that his good work be seen by others. Suppose he regards his glory and profit according to the estimation of others and seeks to be elevated in the sight of others. By doing so he fulfills neither of the commands that the Lord has given in this text. For he has sought to practice his justice before the eyes of others, in order to be seen by them. Therefore his light has not caused others to give glory to the Father who is in heaven. He did not wish to have glory rendered to God but to himself. He did not love the will of God but sought advantage for himself. Of such the apostle says, "For they all seek their own interests, not those of Jesus Christ." The saying "Let your light so shine before others that they may see your good works" is incomplete. He immediately adds the reason why this should be done: "that they may give glory to your Father who is in heaven." This means that even though one is seen by others in doing good works, in one's conscience one ought to have the simple intention of glorifying God. It is only for the sake of God's glory that we should allow our good works to become known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252054.html'
source_title="SERMON 54.3"

[[commentary]]
quote='''
For if herein God the Father is glorified, that we bear much fruit, and be made the disciples of Christ, let us not credit our own glory therewith, as if we had it of ourselves. For of Him is such a grace, and accordingly therein the glory is not ours, but His. Hence also, in another passage, after saying, "Let your light so shine before men that they may see your good works;" to keep them from the thought that such good works were of themselves, He immediately added, "and may glorify your Father who is in heaven." For herein is the Father glorified, that we bear much fruit, and be made the disciples of Christ. And by whom are we so made, but by Him whose mercy hath forestalled us? For we are His workmanship, created in Christ Jesus unto good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252082.html'
source_title="Tractates on John 82"

[[commentary]]
quote='''
For if for the sake of yourselves being glorified ye do good works, we make the same reply as He made to certain of such men, “Verily I say unto you, they have received their reward:” and again, “Otherwise no reward ye will have with your Father that is in Heaven.” Thou wilt say, ought I, then, to hide my works, that I do them not before men? No. But what saith He? “Let your works shine before men.” In doubt then I shall remain. On one side Thou sayest to me, “Take heed that ye do not your righteousness before men:” on the other side Thou sayest to me, “Let your good works shine before men;” what shall I keep? what do? what leave undone? A man can as well serve two masters commanding different things as one commanding different things. I command not, saith the Lord, different things. The end observe, for the end sing: with what end thou doest it, see thou. If for this reason thou doest it, that thou mayest be glorified, I have forbidden it: but if for this reason, that God may be glorified, I have commanded it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252066.html'
source_title="Exposition on Psalm 66"
