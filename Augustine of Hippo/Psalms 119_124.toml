[[commentary]]
quote='''
In connection with this he goes on to say, “O deal with Thy servant according to Thy loving mercy” (ver. 124); not according to my righteousness. “And teach me,” he saith, “Thy righteousnesses;” those beyond doubt, whereby God rendereth men righteous, not they themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
