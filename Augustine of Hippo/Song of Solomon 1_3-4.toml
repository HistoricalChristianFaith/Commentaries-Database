[[commentary]]
quote='''
Let us love and imitate Him: let us run after his ointments, as is said in the Song of Solomon: “Because of the savour of thy good ointments, we will run after thee.” For He came, and gave forth a savour that filled the world. Whence was that fragrance? From heaven. Follow then towards heaven, if thou do not answer falsely when it is said, “Lift up your hearts,” lift up your thoughts, your love, your hope: that it may not rot upon the earth.…“For wherever thy treasure is, there will be thy heart also.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252091.html'
source_title="Exposition on Psalm 91"
