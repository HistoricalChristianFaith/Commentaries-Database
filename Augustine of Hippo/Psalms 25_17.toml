[[commentary]]
quote='''
“The tribulations of my heart have been multiplied” (ver. 17). The tribulations of my heart have been multiplied by the abounding of iniquity and the waxing cold of love. “O bring Thou me out of my necessities.” Since I must needs bear this, that by enduring unto the end I may be saved, bring Thou me out of my necessities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252025.html'
source_title="Exposition on Psalm 25"
