[[commentary]]
quote='''
Lastly there followeth, “and He builded like as of unicorns His sanctification” (ver. 70): or, as some interpreters have made thereof a new word, “His sanctifying.” The unicorns are rightly understood to be those, whose firm hope is uplifted unto that one thing, concerning which another Psalm saith, “One thing I have sought of the Lord, this I will require.” But the sanctifying of God, according to the Apostle Peter, is understood to be a holy people and a royal priesthood. But that which followeth, “in the land which He founded for everlasting:” which the Greek copies have εἰς τὸν αἰῶνα, whether it be called by us “for everlasting,” or “for an age,” is at the pleasure of the Latin translators; forasmuch as it doth signify either: and therefore the latter is found in some Latin copies, the former in others. Some also have it in the plural, that is, “for ages:” which in the Greek copies which we have had we have not found. But which of the faithful would doubt, that the Church, even though, some going, others coming, she doth pass out of this life in mortal manner, is yet founded for everlasting?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
