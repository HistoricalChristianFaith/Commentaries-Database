[[commentary]]
quote='''
Listen to the sort of persons whom the Apostle Paul mentions, false brethren, preaching the word of God through envy, and what he says of them: "And I therein do rejoice, yea, and will rejoice." They proclaimed Christ, through envy indeed, but still they proclaimed Christ. Consider not the why, but the whom: through envy is Christ preached to thee. Behold Christ, avoid envy. Do not imitate the evil preacher, but imitate the Good One who is preached to thee. Christ then was preached by some out of envy. And what is envy? A shocking evil. By this evil was the devil cast down; this malignant pest it was which cast him down; and certain preachers of Christ were possessed by it, whom, nevertheless, the apostle permitted to preach. Wherefore? Because they preached Christ But he who envies, hates; and he who hates, what is said concerning him? Listen to the Apostle John: "He who hateth his brother is a murderer." Behold, after John baptism was given, after a murderer baptism was not given; because John gave his own baptism, the murderer gave the baptism of Christ. That sacrament is so sacred that not even the ministration of a murderer pollutes it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25205.html'
source_title="Tractates on John 5"

[[commentary]]
quote='''
Yea, Paul himself, the holy apostle who said, "I have no one who hath a brother's concern about you; for all seek their own, not the things which are Jesus Christ's," draws a distinction in another place between hirelings and sons; and see what he saith: "Some preach Christ even of envy and strife, and some also of good will: some of love, knowing that I am set for the defence of the gospel; but some also preach Christ of contention, not sincerely, supposing to add affliction to my bonds." These were hirelings who disliked the Apostle Paul. And why such dislike, but just because they were seeking after temporal things? But mark what he adds: "What then, notwithstanding, every way, whether in pretence or in truth, Christ is preached: and I therein do rejoice, yea, and will rejoice." Christ is the truth: let the truth be preached in pretense by hirelings, let it be preached in truth by the children: the children are waiting patiently for the eternal inheritance of the Father, the hirelings are longing for, and in a hurry to get, the temporal pay of their employer. For my part let me be shorn of the human glory, which I see such an object of envy to hirelings: and yet by the tongues both of hirelings and of children let the divine glory of Christ be published abroad, seeing that, "whether in pretense or in truth, Christ is preached."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252046.html'
source_title="Tractates on John 46"
