[[commentary]]
quote='''
“Against Thee alone have I sinned, and before Thee an evil thing have I done” (ver. 4). What is this? For before men was not another’s wife debauched and husband slain? Did not all men know what David had done? What is, “Against Thee alone have I sinned, and before Thee an evil thing have I done.” Because Thou alone art without sin. He is a just punisher that hath nothing in Him to be punished; He is a just reprover that hath nothing in Him to be reproved. “That thou mayest be justified in Thy sayings, and conquer when Thou art judged.” To whom he speaketh, brethren, to whom he speaketh, is difficult to understand. To God surely he speaketh, and it is evident that God the Father is not judged. What is, “And conquer when Thou art judged”? He seeth the future Judge to be judged, one just by sinners to be judged, and therein conquering, because in Him was nothing to be judged. For alone among men could truly say the God-Man, “If ye have found in Me sin, say.” But perchance there was what escaped men, and they found not what was really there, but was not manifest. In another place He saith, “Behold there cometh the Prince of the world,” being an acute observer of all sins; “Behold,” He saith, “there cometh the Prince of this world,” with death afflicting sinners, presiding over death: for, “By the malice of the devil death came into the world.” “Behold,” He saith, “there cometh the Prince of the world:”—He said these words close upon His Passion:—“and in Me he shall find nothing,” nothing of sin, nothing worthy of death, nothing worthy of condemnation. And as if it were said to Him, Why then dost Thou die? He continueth and saith, “But that all men may know that I do the will of My Father; arise, let us go hence.” I suffer, He saith, undeserving, for men deserving, in order that them I may make deserving of My Life, for whom I undeservedly suffer their death. To Him then, having no sin, saith on the present occasion the Prophet David, “Against Thee only have I sinned, and before Thee an evil thing have I done, that Thou mayest be justified in Thy sayings, and conquer when Thou art judged.” For Thou overcomest all men, all judges; and he that deemeth himself just, before Thee is unjust: Thou alone justly judgest, having been unjustly judged, That hast power to lay down Thy life, and hast power again to take it. Thou conquerest, then, when Thou art judged. All men Thou overcomest, because Thou art more than men, and by Thee were men made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"