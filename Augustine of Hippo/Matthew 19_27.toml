[[commentary]]
quote='''
…Let him who hath resigned many things, not be proud. We know that Peter was a fisherman: what then could he give up, to follow our Lord? Or his brother Andrew, or John and James the sons of Zebedee, themselves also fishermen; and yet what did they say? “Behold, we have forsaken all, and followed Thee.” Our Lord said not to him, Thou hast forgotten thy poverty; what hast thou resigned, that thou shouldest receive the whole world? He, my brethren, who resigned not only what he had, but also what he longed to have, resigned much.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
