[[commentary]]
quote='''
Finally, as regards the fact that John states that the Apostle Thomas was not present with these others on the occasion under review, whereas, according to Luke, the two disciples, of whom Cleophas was one, returned to Jerusalem, and found the eleven assembled and those who were with them, it admits of little doubt that we must suppose Thomas simply to have left the company before the Lord showed Himself to the brethren when they were talking in the terms noticed above.

This being the case, John now records a second manifestation of Himself, which was vouchsafed by the Lord to the disciples eight days after, on which occasion Thomas also was present, who had not seen Him up to that time. The narrative proceeds thus: "And after eight days again His disciples were within, and Thomas with them. Then came Jesus, the doors being shut, and stood in the midst, and said, Peace be unto you. Then saith He to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing. Thomas answered and said unto Him, My Lord and my God. Jesus saith unto Him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed." This second appearance of the Lord among the disciples—that is to say, the appearance which John records in the second instance—we might also recognise as alluded to by Mark in a section concisely disposing of it, according to that evangelist's habit. A difficulty, however, is created by the circumstance that his terms are these: "Lastly, He appeared unto those eleven as they sat at meat." The difficulty does not lie in the mere fact that John says nothing about their sitting at meat, for he might well have omitted that; but it does rest in the use of the word "lastly," for that makes it seem as if He did not show Himself to them after that occasion, whereas John still proceeds to record a third appearance of the Lord by the sea of Tiberias. And then we have to keep in view the fact that the same Mark tells us how Jesus "upbraided them with their unbelief and hardness of heart, because they believed not them which had seen Him after He was risen." In these words he refers to the two disciples to whom He appeared after He was risen, as they went toward a country-seat, and to Peter, to whom the examination of Luke's narrative has shown us that He manifested Himself first of all [among the apostles],—perhaps also to Mary Magdalene, and those other women who were along with her on the occasion when He was seen by them at the sepulchre, and again when He met them as they were returning on the way. For the said Mark has constructed his record in a manner which leads him first to insert his brief notice of the two disciples to whom He appeared as they went toward the country-seat, and of their giving a report to the residue and obtaining no credit, and then to subjoin in the immediate connection this statement: "Lastly, He appeared unto the eleven as they sat at meat, and upbraided them with their unbelief and hardness of heart, because they believed not them which had seen Him after He was risen." How, then, is this phrase "lastly" used, as if they did not see Him subsequently to this occasion? For the last time that the apostles saw the Lord upon the earth was really the time when He ascended into heaven, and that event took place on the fortieth day after His resurrection. Now, is it likely that He would upbraid them at that period on the ground that they had not believed those who had seen Him after He was risen, when by that time they had seen Him themselves so often after His resurrection, and especially when they had seen Him on the very day of His resurrection,—that is to say, on the first day of the week, when it was now about night, as Luke and John record? It remains for us, therefore, to suppose that, in the passage under review, it was Mark's intention to give a statement, in his own concise fashion, simply on the subject of the said day of the Lord's resurrection; that is to say, that first day of the week on which Mary and the other women who were along with her saw Him after daybreak, on which also Peter beheld Him, on which likewise He appeared to the two disciples, of whom Cleophas was one, and to whom Mark himself also seems to refer; on which, further, when it was now about night, He showed Himself to the eleven (Thomas, however, being excepted) and those who were with them; and on which, finally, the persons already instanced reported to the disciples the things which they had seen. Hence it is that he has employed the term "lastly," because the incident mentioned was the last that took place on this same day. For the night was now coming on by the time that the two disciples had returned from the place where they had recognised Him in the breaking of bread, and had made their way into Jerusalem and found the eleven, as Luke tells us, and those who were with them, speaking to each other about the Lord's resurrection and about His having appeared to Peter; to whom these two also related what had occurred on the way, and how they came to know Him in the breaking of bread. But, assuredly, there were also there some who did not believe. Hence we see the truth of Mark's words, "Neither believed they them." When these, therefore, were now sitting at meat, as Mark informs us, and when they were talking of these subjects, as Luke tells us, the Lord stood in their midst, and said unto them, "Peace be unto you," as Luke and John both record. Moreover, the doors were shut when He entered among them, as John alone mentions. And thus, among the words which, as Luke and John have reported, the Lord spoke to the disciples on that occasion, this expostulation also comes in, which is instanced by Mark, and in which He upbraided them for not believing those who had seen Him after He was risen.

But, again, a difficulty may also be felt in understanding how Mark says that the Lord appeared to the eleven as they sat at meat, if the time referred to is really the beginning of the night of that Lord's day, as is indicated by Luke and John. For John, indeed, tells us plainly that the Apostle Thomas was not with them on that occasion; and we believe that he left them before the Lord entered among them, but after the two disciples who returned from the village had been conversing with the eleven, as we discover from Luke. Luke, it is true, presents a point in his narrative, at which we may fairly suppose, first, that Thomas went out while they were talking of these subjects, and then that the Lord came in. Mark, however, who says, "Lastly, He appeared unto the eleven as they sat at meat," compels us to admit that Thomas also was there. But it may be the case, perhaps, that he chose to style them the eleven, although one of the company was absent, because the same apostolic society was designated by this number at the time previous to the election of Matthias in the place of Judas. Or, if there is a difficulty in accepting this explanation, we may still suppose that, after the many manifestations in which He vouchsafed His presence to the disciples during the forty days, He also showed Himself on one final occasion to the eleven as they sat at meat,—that is to say, on the fortieth day itself; and that, as He was now on the point of leaving them and ascending into heaven, He was minded on that memorable day specially to upbraid them with their refusal to believe those who had seen Him after He had risen until they should first have seen Him themselves; and this particularly because it was the case that, when they preached the gospel subsequently to His ascension, the very Gentiles would be ready to believe what they did not see. For, after mentioning this upbraiding, Mark at once proceeds to subjoin this passage: "And He said unto them, Go ye into all the world, and preach the gospel to every creature. He that believeth and is baptized shall be saved; but he that believeth not shall be damned." If, therefore, they were charged to preach that he who believes not shall be condemned, when that indeed which he believes not is just what he has not seen, was it not meet that they should themselves first of all be thus reproved for their own refusal to believe those to whom the Lord had shown Himself at an earlier stage until they should have seen Him with their own eyes?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
