[[commentary]]
quote='''
“The wicked heart hath not cleaved unto me.”…The heart of a man, who wisheth not anything contrary to any that God wisheth, is called straight.…If therefore the righteous heart followeth God, the crooked heart resisteth God. Suppose something untoward happeneth to him, he crieth out, “God, what have I done unto Thee? What sin have I committed?” He wisheth himself to appear just, God unjust. What is so crooked as this? It is not enough that thou art crooked thyself: thou must think thy rule crooked also. Reform thyself, and thou findest Him straight, in departing from whom thou hast made thyself crooked. He doth justly, thou unjustly; and for this reason thou art perverse, since thou callest man just, and God unjust. What man dost thou call just? Thyself. For when thou sayest, “What have I done unto Thee?” thou thinkest thyself just. But let God answer thee: “Thou speakest truth: thou hast done nothing to Me: thou hast done all things unto thyself; for if thou hadst done anything for Me, thou wouldest have done good. For whatever is done well, is done unto Me; because it is done according to My commandment; but whatever of evil is done, is done unto thee, not unto Me; for the wicked man doth nothing except for his own sake, since it is not what I command.” When ye see such men, brethren, reprove them, convince and correct them: and if ye cannot reprove or correct them, consent not to them.

“When the wicked man departed from me, I knew him not” (ver. 4). I approved him not, I praised him not, he pleased me not. For we find the word “to know” occasionally used in Scripture, in the sense of “to be pleased.” For what is hidden from God, brethren? Doth He know the just, and doth He not know the unjust? What dost thou think of, that He doth not know? I say not, what thinkest thou; but what wilt thou ever think, that He will not have seen beforehand? God knoweth all things, then; and yet in the end, that is in judgment after mercy, He saith of some persons: “I will profess unto them, I never knew you; depart from Me, ye workers of iniquity.” Was there any one He did not know? But what meaneth, “I never knew you”? I acknowledge you not in My rule. For I know the rule of My righteousness: ye agree not with it, ye have turned aside from it, ye are crooked. Therefore He said here also: “When the wicked man departed from Me, I knew him not.”…Therefore, “when the wicked man departed from me,” that is, when the wicked man was unlike me, and was unwilling to imitate my paths, was unwilling in his wickedness to live as I had proposed myself for his imitation; “I knew him not.” What meaneth, “I knew him not”? Not that I was ignorant of him, but that I did not approve him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520101.html'
source_title="Exposition on Psalm 101"
