[[commentary]]
quote='''
By spiritual regeneration we therefore become sons and are adopted into the kingdom of God, not as aliens but as his creatures and offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOUR%2520LORD%2527S%2520SERMON%2520ON%2520THE%2520MOUNT%2FBook%25202.html'
source_title="SERMON ON THE MOUNT 23.78"

[[commentary]]
quote='''
For He, the Only-begotten, came to loose the sins in which we were entangled, and whose burden hindered our adoption: those whom He wished to make brethren to Himself, He Himself loosed, and made joint-heirs. For so saith the apostle, "But if a son, then an heir through God." And again, "Heirs of God, and joint-heirs with Christ." He did not fear to have joint-heirs, because His heritage does not become narrow if many are possessors. Those very persons, He being possessor, become His inheritance, and He in turn becomes their inheritance. Hear in what manner they become His inheritance: "The Lord hath said unto me, Thou art my Son, this day have I begotten Thee. Ask of me, and I will give Thee the nations for Thine inheritance." Hear in what manner He becomes their inheritance. He says in the Psalms: "The Lord is the portion of mine inheritance, and of my cup." Let us possess Him, and let Him possess us: let Him possess us as Lord; let us possess Him as salvation, let us possess Him as light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25202.html'
source_title="Tractates on John 2"
