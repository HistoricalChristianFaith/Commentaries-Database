[[commentary]]
quote='''
(lib. lxxxiii. Quæst. q. 63) The Greek word "logos" signifies both Word and Reason. But in this passage it is better to interpret it Word; as referring not only to the Father, but to the creation of things by the operative power of the Word; whereas Reason, though it produce nothing, is still rightly called Reason.

(Tract. super Joan. i. c. 8) Words by their daily use, sound, and passage out of us, have become common things. But there is a word which remaineth inward, in the very man himself; distinct from the sound which proceedeth out of the mouth. There is a word, which is truly and spiritually that, which you understand by the sound, not being the actual sound. (de Trin. l. xv. c. 19. [x.]). Now whoever can conceive the notion of word, as existing not only before its sound, but even before the idea of its sound is formed, may see enigmatically, and as it were in a glass, some similitude of that Word of Which it is said, In the beginning was the Word. For when we give expression to something which we know, the word used is necessarily derived from the knowledge thus retained in the memory, and must be of the same quality with that knowledge. For a word is a thought formed from a thing which we know; which word is spoken in the heart, being neither Greek nor Latin, nor of any language, though, when we want to communicate it to others, some sign is assumed by which to express it... (Ibid. cap. 20. [xi.]). Wherefore the word which sounds externally, is a sign of the word which lies hid within, to which the name of word more truly appertains. For that which is uttered by the mouth of our flesh, is the voice of the word; and is in fact called word, with reference to that from which it is taken, when it is developed externally.

(xv. de Trin. c. 22. [xiii.]) As our knowledge differs from God's, so does our word, which arises from our knowledge, differ from that Word of God, which is born of the Father's essence; we might say, from the Father's knowledge, the Father's wisdom, or, more correctly, the Father Who is Knowledge, the Father Who is Wisdom. (c. 23. (xiv.)) The Word of God then, the Only-Begotten Son of the Father, is in all things like and equal to the Father; being altogether what the Father is, yet not the Father; because the one is the Son, the other the Father. And thereby He knoweth all things which the Father knoweth; yet His knowledge is from the Father, ever as is His being: for knowing and being are the same with Him; and so as the Father's being is not from the Son, so neither is His knowing. Wherefore the Father begat the Word equal to Himself in all things as uttering forth Himself. For had there been more or less in His Word than in Himself, He would not have uttered Himself fully and perfectly. With respect however to our own inner word, which we find, in whatever sense, to be like the Word, let us not object to see how very unlike it is also. (cap. 25. (xv.)) A word is a formation of our mind going to take place, but not yet made, and something in our mind which we toss to and fro in a slippery circuitous way, as one thing and another is discovered, or occurs to our thoughts. When this, which we toss to and fro, has reached the subject of our knowledge, and been formed therefrom, when it has assumed the most exact likeness to it, and the conception has quite answered to the thing; then we have a true word. Who may not see how great the difference is here from that Word of God, which exists in the Form of God in such wise, that It could not have been first going to be formed, and afterwards formed, nor can ever have been unformed, being a Form absolute, and absolutely equal to Him from Whom It is. Wherefore in speaking of the Word of God here nothing is said about thought in God; lest we should think there was any thing revolving in God, which might first receive form in order to be a Word, and afterwards lose it, and be carried round and round again in an unformed state.

(de Verb. Dom. Serm. 38) Now the Word of God is a Form, not a formation, but the Form of all forms, a Form unchangeable, removed from accident, from failure, from time, from space, surpassing all things, and existing in all things as a kind of foundation underneath, and summit above them.

(de Trin. vi. c. 3 [ii]) Or, In the beginning, as if it were said, before all things.

(de verb. Dom. Serm. 38. [117.] §. 6) They say, however, if He is the Son, He was born. We allow it. They rejoin: if the Son was born to the Father, the Father was, before the Son was born to Him. This the Faith rejects. Then they say, explain to us how the Son could be born from the Father, and yet be coeval with Him from whom He is born: for sons are born after their fathers, to succeed them on their death. They adduce analogies from nature; and we must endeavour likewise to do the same for our doctrine. But how can we find in nature a coeternal, when we cannot find an eternal? However, if a thing generating and a thing generated can be found any where coeval, it will be a help to forming a notion of coeternals. Now Wisdom herself is called in the Scriptures, (Wisd. 7:26) the brightness of Everlasting Light, the image of the Father. Hence then let us take our comparison, and from coevals form a notion of coeternals. Now no one doubts that brightness proceeds from fire: fire then we may consider the father of the brightness. Presently, when I light a candle, at the same instant with the fire, brightness ariseth. Give me the fire without the brightness, and I will with thee believe that the Father was without the Son. An image is produced by a mirror. The image exists as soon as the beholder appears; yet the beholder existed before he came to the mirror. Let us suppose then a twig, or a blade of grass which has grown up by the water side. Is it not born with its image? If there had always been the twig, there would always have been the image proceeding from the twig. And whatever is from another thing, is born. So then that which generates may be coexistent from eternity with that which is generated from it. But some one will say perhaps, Well, I understand now the eternal Father, the coeternal Son: yet the Son is like the emitted brightness, which is less brilliant than the fire, or the reflected image, which is less real than the twig. Not so: there is complete equality between Father and Son. I do not believe, he says; for thou hast found nothing whereto to liken it. However, perhaps we can find something in nature by which we may understand that the Son is both coeternal with the Father, and in no respect inferior also: though we cannot find any one material of comparison that will be sufficient singly, and must therefore join together two, one of which has been employed by our adversaries, the other by ourselves. For they have drawn their comparison from things which are preceded in time by the things which they spring from, man, for example, from man. Nevertheless, man is of the same substance with man. We have then in that nativity an equality of nature; an equality of time is wanting. But in the comparison which we have drawn from the brightness of fire, and the reflexion of a twig, an equality of nature thou dost not find, of time thou dost. In the Godhead then there is found as a whole, what here exists in single and separate parts; and that which is in the creation, existing in a manner suitable to the Creator.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There are two births of our Lord Jesus Christ, the one divine, the other human.… Consider that first begetting: "In the beginning was the Word, and the Word was with God, and the Word was God." Whose Word? The Father's own. Which Word? The Son himself. The Father has never been without the Son; and yet the one who has never been without the Son begot the Son. He both begot and yet did not begin to do so. There is no beginning for one begotten without beginning. And yet he is the Son, and yet he is begotten. A mere human is going to say, "How is it that he is begotten, and yet he does not have a beginning? If he does not have a beginning, how was he begotten?" How, I do not know. Are you asking a mere human how God was begotten? I am overwhelmed by your questioning, but I appeal to the prophet: "His begetting who can tell the tale of?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520196.html'
source_title="SERMON 196.1"

[[commentary]]
quote='''
Moses, they tell us, says, "In the beginning God made heaven and earth," and does not even mention the Son through whom all things were made; whereas John says, "In the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God, all things were made through him, and without him was made nothing." Is this contradictory, or are they not rather contradicting themselves when they prefer blindly to find fault with what they do not understand instead of earnestly seeking to understand?… For the Lord says to the unbelieving Jews, "If you believed Moses, you would believe me too; for he wrote about me." So why shouldn't I understand the Lord himself as the beginning in which God the Father made heaven and earth? For Moses certainly wrote, "In the beginning God made heaven and earth," and it is the Lord's words that confirm that he wrote about the Lord. Or perhaps he himself is not also the beginning? But there need be no doubt about that either, with the Gospel telling us, when the Jews asked the Lord who he was, that he replied, "The beginning, because I am also speaking to you." There you have the beginning in which God made heaven and earth. So God made heaven and earth in the Son, through whom all things were made and without whom was made nothing. And so, since the Gospel is in agreement with Genesis, we may retain our inheritance in line with the consensus of both Testaments and leave fault-finding quibbles to the disinherited heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%25201.html'
source_title="SERMON 1.2"

[[commentary]]
quote='''
Whoever, then, is able to understand a word, not only before it is uttered in sound, but also before the images of its sounds are considered in thought,-for this it is which belongs to no tongue, to wit, of those which are called the tongues of nations, of which our Latin tongue is one;-whoever, I say, is able to understand this, is able now to see through this glass and in this enigma some likeness of that Word of whom it is said, "In the beginning was the Word, and the Word was with God, and the Word was God." For of necessity, when we speak what is true, i.e. speak what we know, there is born from the knowledge itself which the memory retains, a word that is altogether of the same kind with that knowledge from which it is born. For the thought that is formed by the thing which we know, is the word which we speak in the heart: which word is neither Greek nor Latin, nor of any other tongue. But when it is needful to convey this to the knowledge of those to whom we speak, then some sign is assumed whereby to signify it. ... Accordingly, the word that sounds outwardly is the sign of the word that gives light inwardly; which latter has the greater claim to be called a word. For that which is uttered with the mouth of the flesh, is the articulate sound of a word; and is itself also called a word, on account of that to make which outwardly apparent it is itself assumed. For our word is so made in some way into an articulate sound of the body, by assuming that articulate sound by which it may be manifested to men's senses, as the Word of God was made flesh, by assuming that flesh in which itself also might be manifested to men's senses. And as our word becomes an articulate sound, yet is not changed into one; so the Word of God became flesh, but far be it from us to say He was changed into flesh. For both that word of ours became an articulate sound, and that other Word became flesh, by assuming it, not by consuming itself so as to be changed into it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="On The Trinity 15.10.19-11.20"

[[commentary]]
quote='''
Therefore, as our knowledge is unlike that knowledge of God, so is our word also, which is born from our knowledge, unlike that Word of God which is born from the essence of the Father. And this is as if I should say, born from the Father's knowledge, from the Father's wisdom; or still more exactly, from the Father who is knowledge, from the Father who is wisdom.

The Word of God, then, the only-begotten Son of the Father, in all things like and equal to the Father, God of God, Light of Light, Wisdom of Wisdom, Essence of Essence, is altogether that which the Father is, yet is not the Father, because the one is Son, the other is Father. And hence He knows all that the Father knows; but to Him to know, as to be, is from the Father, for to know and to be is there one. And therefore, as to be is not to the Father from the Son, so neither is to know. Accordingly, as though uttering Himself, the Father begat the Word equal to Himself in all things; for He would not have uttered Himself wholly and perfectly, if there were in His Word anything more or less than in Himself. ...

And that word, then, of ours which has neither sound nor thought of sound, but is of that thing in seeing which we speak inwardly, and which therefore belongs to no tongue; and hence is in some sort like, in this enigma, to that Word of God which is also God; since this too is born of our knowledge, in such manner as that also is born of the knowledge of the Father: such a word, I say, of ours, which we find to be in some way like that Word, let us not be slow to consider how unlike also it is, as it may be in our power to utter it. ... But what is this that can be a word, and is therefore already held worthy of the name of a word? What, I say, is this thing that is formable, but not yet formed, except a something in our mind, which we toss to and fro by revolving it this way or that, while we think of first one thing and then another, according as they are found by or occur to us? And the true word then comes into being, when, as I said, that which we toss to and fro by revolving it arrives at that which we know, and is formed by that, in taking its entire likeness; so that in what manner each thing is known, in that manner also it is thought, i.e. is said in this manner in the heart, without articulate sound, without thought of articulate sound, such as no doubt belongs to some particular tongue. And hence if we even admit, in order not to dispute laboriously about a name, that this something of our mind, which can be formed from our knowledge, is to be already called a word, even before it is so formed, because it is, so to say, already formable, who would not see how great would be the unlikeness between it and that Word of God, which is so in the form of God, as not to have been formable before it was formed, or to have been capable at any time of being formless, but is a simple form, and simply equal to Him from whom it is, and with whom it is wonderfully co-eternal?

Wherefore that Word of God is in such wise so called, as not to be called a thought of God, lest we believe that there is anything in God which can be revolved, so that it at one time receives and at another recovers a form, so as to be a word, and again can lose that form and be revolved in some sense formlessly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%252015.html'
source_title="On The Trinity 15.13.22-16.26"

[[commentary]]
quote='''
We are not now discussing, brothers and sisters, possible ways of understanding the text, "In the beginning was the Word, and the Word was with God, and the Word was God." It can only be understood in ways beyond words; human words cannot suffice for understanding the Word of God. What we are discussing and stating is why it is not understood. I am not speaking in order that it may be understood but telling you what prevents it being understood.You see, it is a kind of form, a form that has not been formed but is the form of all things that have been formed; an unchangeable form that has neither fault not failing, beyond space, standing apart as at once the foundation for all things to stand on and the ceiling of them to stand under. If you say that all things are in it, you are not lying. The Word itself, you see, is called the Wisdom of God; but we have it written, "In wisdom you have made them all." Therefore all things are in it. And yet because it is God, all things are under it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520117.html'
source_title="SERMON 117.3"

[[commentary]]
quote='''
When I give heed to what we have just read from the apostolic lesson, that "the natural man perceiveth not the things which are of the Spirit of God," and consider that in the present assembly, my beloved, there must of necessity be among you many natural men, who know only according to the flesh, and cannot yet raise themselves to spiritual understanding, I am in great difficulty how, as the Lord shall grant, I may be able to express, or in my small measure to explain, what has been read from the Gospel, "In the beginning was the Word, and the Word was with God, and the Word was God;" for this the natural man does not perceive. What then, brethren? Shall we be silent for this cause? Why then is it read, if we are to be silent regarding it? Or why is it heard, if it be not explained? And why is it explained, if it be not understood? And so, on the other hand, since I do not doubt that there are among your number some who can not only receive it when explained, but even understand it before it is explained, I shall not defraud those who are able to receive it, from fear of my words being wasted on the ears of those who are not able to receive it. Finally, there will be present with us the compassion of God, so that perchance there may be enough for all, and each receive what he is able, while he who speaks says what he is able. For to speak of the matter as it is, who is able? I venture to say, my brethren, perhaps not John himself spoke of the matter as it is, but even he only as he was able; for it was man that spoke of God, inspired indeed by God, but still man. Because he was inspired he said something; if he had not been inspired, he would have said `nothing;' but because a man inspired, he spoke not the whole, but what a man could he spoke.

For this John, dearly beloved brethren, was one of those mountains concerning which it is written: "Let the mountains receive peace for thy people, and the hills righteousness." The mountains are lofty souls, the hills little souls. But for this reason do the mountains receive peace, that the hills may be able to receive righteousness. What is the righteousness which the hills receive? Faith, for" the just doth live by faith." The smaller souls, however, would not receive faith unless the greater souls, which are called mountains, were illuminated by Wisdom herself, that they may be able to transmit to the little ones what the little ones can receive; and the hills live by faith, because the mountains receive peace. By the mountains themselves it was said to the Church, "Peace be with you;" and the mountains themselves in proclaiming peace to the Church did not divide themselves against Him from whom they received peace, that truly, not feignedly, they might proclaim peace.

For there are other mountains which cause shipwreck, on which, if any one drive his ship, she is dashed to pieces. For it is easy, when land is seen by men in peril, to make a venture as it were to reach it; but sometimes land is seen on a mountain, and rocks lie hid under the mountain; and when any one makes for the mountain, he falls on the rocks, and finds there not rest, but wrecking. So there have been certain mountains, and great have they appeared among men, and they have created heresies and schisms, and have divided the Church of God; but those who divided the Church of God were not those mountains concerning which it is said, "Let the mountains receive peace for thy people." For in what manner have they received peace who have severed unity?

But those who received peace to proclaim it to the people have made Wisdom herself an object of contemplation, so far as human hearts could lay hold on that which "eye hath not seen, nor ear heard, neither has ascended into the heart of man." If it has not ascended into the heart of man, how has it ascended into the heart of John? Was not John a man? Or perhaps neither into John's heart did it ascend, but John's heart ascended into it? For that which ascends into the heart of man is from beneath, to man; but that to which the heart of man ascends is above, from man. Even so brethren, can it be said that, if it ascended into the heart of John (if in any way it can be said), it ascended into his heart in so far as he was not man. What means "was not man"? In so far as he had begun to be an angel. For all saints are angels, since they are messengers of God. Therefore to carnal and natural men, who are not able to perceive the things that are of God, what says the apostle? "For whereas ye say, I am of Paul, I of Apollos, are ye not men?, What did he wish to make them whom, he upbraided because they were men? Do you wish to know what he wished to make them? Hear in the Psalms: "I have said, ye are gods; and all of you are children of the Most High." To this, then, God calls us, that we be not men. But then will it be for the better that we be not men, if first we recognize the fact that we are men, that is, to the end that we may rise to that height from humility; lest, when we think that we are something when we are nothing, we not only do not receive what we are not, but even lose what we are.

Accordingly, brethren, of these mountains was John also, who said, "In the beginning was the Word, and the Word was with God, and the Word was God." This mountain had received peace; he was contemplating the divinity of the Word. Of what sort was this mountain? How lofty? He had risen above all peaks of the earth, he had risen above all plains of the sky, he had risen above all heights of the stars, he had risen above all choirs and legions of the angels. For unless he rose above all those things which were created, he would not arrive at Him by whom all things were made. You cannot imagine what he rose above, unless you see at what he arrived. Dost thou inquire concerning heaven and earth? They were made. Dost thou inquire concerning the things that are in heaven and earth? Surely much more were they made. Dost thou inquire concerning spiritual beings, concerning angels, archangels, thrones, dominions, powers, principalities? These also were made. For when the Psalm enumerated all these things, it finished thus: "He spoke, and they were made; He commanded, and they were created." If "He spoke and they were made," it was by the Word that they were made; but if it was by the Word they were made, the heart of John could not reach to that which he says, "In the beginning was the Word, and the Word was with God, and the Word was God," unless he had risen above all things that were made by the Word. What a mountain this! How holy! How high among those mountains that received peace for the people of God, that the hills might receive righteousness!

Consider, then, brethren, if perchance John is not one of those mountains concerning whom we sang a little while ago, "I have lifted up mine eyes to the mountains, from whence shall come my help." Therefore, my brethren, if you would understand, lift up your eyes to this mountain, that is, raise yourselves up to the evangelist, rise to his meaning. But, because though these mountains receive peace he cannot be in peace who places his hope in man, do not so raise your eyes to the mountain as to think that your hope should be placed in man; and so say, "I have lifted up mine eyes to the mountains, from whence shall come my help," that you immediately add, "My help is from the Lord, who made heaven and earth." Therefore let us lift our eyes to the mountains, from whence shall come our help; and yet it is not in the mountains themselves that our hope should be placed, for the mountains receive what they may minister to us; therefore, from whence the mountains also receive there should our hope be placed. When we lift our eyes to the Scriptures, since it was through men the Scriptures were ministered, we are lifting our eyes to the mountains, from whence shall come our help; but still, since they were men who wrote the Scriptures, they did not shine of themselves, but "He was the true light, who lighteth every man that cometh into the world." A mountain also was that John the Baptist, who said, "I am not the Christ," lest any one, placing his hope in the mountain, should fall from Him who illuminates the mountain. He also confessed, saying, "Since of His fullness have all we received." So thou oughtest to say, "I have lifted up mine eyes to the mountains, from whence shall come my help," so as not to ascribe to the mountains the help that comes to thee; but continue and say, "My help is from the Lord, who made heaven and earth."

Therefore, brethren, may this be the result of my admonition, that you understand that in raising your hearts to the Scriptures (when the gospel was sounding forth, "In the beginning was the Word, and the Word was with God, and the Word was God," and the rest that was read), you were lifting your eyes to the mountains, For unless the mountains said these things, you would not find out how to think of them at all. Therefore from the mountains came your help, that you even heard of these things; but you cannot yet understand what you have heard. Call for help from the Lord, who made heaven and earth; for the mountains were enabled only so to speak as not of themselves to illuminate, because they themselves are also illuminated by hearing. Thence John, who said these things, received them-he who lay on the Lord's breast, and from the Lord's breast drank in what he might give us to drink. But he gave us words to drink. Thou oughtest then to receive understanding from the source from which he drank who gave thee to drink; so that thou mayest lift up thine eyes to the mountains from whence shall come thine aid, so that from thence thou mayest receive, as it were, the cup, that is, the word, given thee to drink; and yet, since thy help is from the Lord, who made heaven and earth, thou mayest fill thy breast from the source from which he filled his; whence thou saidst, "My help is from the Lord, who made heaven and earth:" let him, then, fill who can. Brethren, this is what I have said: Let each one lift up his heart in the manner that seems. fitting, and receive what is spoken. But perhaps you will say that I am more present to you than God, Far be such a thought from you! He is much more present to you; for I appear to your eyes, He presides over your consciences. Give me then your ears, Him your hearts, that you may fill both. Behold, your eyes, and those your bodily senses, you lift up to us; and yet not to us, for we are not of those mountains, but to the gospel itself, to the evangelist himself: your hearts, however, to the Lord to be filled. Moreover, let each one so lift up as to see what he lifts up, and whither. What do I mean by saying, "what he lifts up, and whither?" Let him see to it what sort of a heart he lifts up, because it is to the Lord he lifts it up, lest, encumbered by a load of fleshly pleasure, it fall ere ever it is raised. But does each one see that he bears a burden of flesh? Let him strive by continence to purify that which he may lift up to God. For "Blessed are the pure in heart, because they shall see God."

But let us see what advantage it is that these words have sounded, "In the beginning was the Word, and the Word was with God, and the Word was God." We also uttered words when we spoke. Was it such a word that was with God? Did not those words which we uttered sound and pass away? Did God's Word, then, sound and come to an end? If so, how were all things made by it, and without it was nothing made? how is that which it created ruled by it, if it sounded and passed away? What sort of a word, then, is that which is both uttered and passes not away? Give ear, my beloved, it is a great matter. By everyday talk, words here become despicable to us, because through their sounding and passing away they are despised, and seem nothing but words. But there is a word in the man himself which remains within; for the sound proceeds from the mouth. There is a word which is spoken in a truly spiritual manner, that which you understand from the sound, not the sound itself. Mark, I speak a word when I say "God." How short the word which I have spoken-four letters and two syllables! Is this all that God is, four letters and two syllables? Or is that which is signified as costly as the word is paltry? What took place in thy heart when thou heardest "God "? What took place in my heart when I said "God "? A certain great and perfect substance was in our thoughts, transcending every changeable creature of flesh or of soul. And if I say to thee, "Is God changeable or unchangeable?" thou wilt answer immediately, "Far be it from me either to believe or imagine that God is changeable: God is unchangeable." Thy soul, though small, though perhaps still carnal, could not answer me otherwise than that God is unchangeable: but every creature is changeable; how then wert thou able to enter, by a glance of thy spirit, into that which is above the creature, so as confidently to answer me, "God is unchangeable"? What, then, is that in thy heart, when thou thinkest of a certain substance, living, eternal, all-powerful, infinite, everywhere present, everywhere whole, nowhere shut in? When thou thinkest of these qualities, this is the word concerning God in thy heart. But is this that sound which consists of four letters and two syllables? Therefore, whatever things are spoken and pass away are sounds, are letters, are syllables. His word which sounds passes away; but that which the sound signified, and was in the speaker as he thought of it, and in the hearer as he understood it, that remains while the sounds pass away.

Turn thy attention to that word. Thou canst have a word in thy heart, as it were a design born in thy mind, so that thy mind brings forth the design; and the design is, so to speak, the offspring of thy mind, the child of thy heart. For first thy heart brings forth a design to construct some fabric, to set up something great on the earth; already the design is conceived, and the work is not yet finished: thou seest what thou wilt make; but another does not admire, until thou hast made and constructed the pile, and brought that. fabric into shape and to completion; then men regard the admirable fabric, and admire the design of the architect; they are astonished at what they see, and are pleased with what they do not see: who is there who can see a design? If, then, on account of some great building a human design receives praise, do you wish to see what a design of God is the Lord Jesus Christ, that is, the Word of God? Mark this fabric of the world. View what was made by the Word, and then thou wilt understand what is the nature of the world. Mark these two bodies of the world, the heavens and the earth. Who will unfold in words the beauty of the heavens? Who will unfold in words the fruitfulness of the earth? Who will worthily extol the changes of the seasons? Who will worthily extol the power of seeds? You see what things I do not mention, lest in giving a long list I should perhaps tell of less than you can call up to your own minds. From this fabric, then, judge the nature of the Word by which it was made: and not it alone; for all these things are seen, because they have to do with the bodily sense. By that Word angels also were made; by that Word archangels were made, powers, thrones, dominions, principalities; by that Word were made all things. Hence, judge what a Word this is.

Perhaps some one now answers me, "Who so conceives this Word?" Do not then imagine, as it were, some paltry thing when thou hearest "the Word," nor suppose it to be words such as thou hearest them every day-"he spoke such words," "such words he uttered," "such words you tell me;" for by constant repetition the term word has become, so to speak, worthless. And when thou hearest, "In the beginning was the Word," lest thou shouldest imagine something worthless, such as thou hast been accustomed to think of when thou wert wont to listen to human words, hearken to what thou must think of: "The Word was God."

Now some unbelieving Arian may come forth and say that "the Word of God was made." How can it be that the Word of God was made, when God by the Word made all things? If the Word of God was itself also made, by what other Word was it made? But if thou sayest that there is a Word of the Word, I say, that by which it was made is itself the only Son of God. But if thou dost not say there is a Word of the Word, allow that that was not made by which all things were made. For that by which all things were made could not be made by itself. Believe the evangelist then. For he might have said, "In the beginning God made the Word:" even as Moses said, "In the beginning God made the heavens and the earth;" and enumerates all things thus: "God said, Let it be made, and it was made." If "said," who said? God. And what was made? Some creature. Between the speaking of God and the making of the creature, what was there by which it was made but the Word? For God said, "Let it be made, and it was made." This Word is unchangeable; although changeable things are made by it, the Word itself is unchangeable.

Do not then believe that that was made by which were made all things, lest thou be not new-made by the Word, which makes all things new. For already hast thou been made by the Word, but it behoves thee to be new-made by the Word. If, however, thy belief about the Word be wrong, thou wilt not be able to be new-made by the Word. And although creation by the Word has happened to thee, so that thou hast been made by Him, thou art unmade by thyself: if by thyself thou art unmade, let Him who made thee make thee new: if by thyself thou hast been made worse, let Him who created thee re-create thee. But how can He re-create thee by the Word, if thou holdest a wrong opinion about the Word? The evangelist says, "In the beginning was the Word;" and thou sayest, "In the beginning the Word was made." He says, "All things were made by Him;" and thou sayest that the Word Himself was made. The evangelist might have said, "In the beginning the Word was made:" but what does he say? "In the beginning was the Word." If He was, He was not made; that all things might be made by it, and without Him nothing be made. If, then, "in the beginning the Word was, and the Word was with God, and the Word was God;" if thou canst not imagine what it is, wait till thou art grown. That is strong meat: receive thou milk that thou mayest be nourished, and be able to receive strong meat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25201.html'
source_title="Tractates on John 1"

[[commentary]]
quote='''
It is fitting, brethren, that as far as possible we should treat of the text of Holy Scripture, and especially of the Holy Gospel, without omitting any portion, that both we ourselves may derive nourishment according to our capacity, and may minister to you from that source from which we have been nourished. Last Lord's day, we remember, we treated of the first section; that is, "In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by Him; and without Him was nothing made. That which was made, in Him is life; and the life was the light of men. And the light shineth in darkness; and the darkness comprehended it not." So far, I believe, had I advanced in the treatment of the passage: let all who were present recall what was then said; and those of you who were not present, believe me and those who chose to be present. Now therefore,-because we cannot always be repeating everything, out of justice to those who desire to hear what follows, and because repetition of the former thought is a burden to them and deprives them of what succeeds,-let those who were absent on the former occasion refrain from demanding repetition, but, together with those who were here, listen to the present exposition.

It goes on, "There was a man sent from God whose name was John." Truly, brethren beloved, those things which were said before, were said regarding the ineffable divinity of Christ, and almost ineffably. For who shall comprehend "In the beginning was the Word, and the Word was with God "? And do not allow the name word to appear mean to you, through the habit of daily words, for it is added, "and the Word was God." This Word is He of whom yesterday we spoke much; and I trust that God was present, and that even from only thus much speaking something reached your hearts. "In the beginning was the Word." He is the same, and is in the same manner; as He is, so He is always; He cannot be changed; that is, He is. This His name He spoke to His servant Moses: "I am that I am; and He that is hath sent me." Who then shall comprehend this when you see that all mortal things are variable; when you see that not only do bodies vary as to their qualities, by being born, by increasing, by becoming less, by dying, but that even souls themselves through the effect of divers volitions are distended and divided; when you see that men can obtain wisdom if they apply themselves to its light and heat, and also lose wisdom if they remove themselves from it through some evil influence? When, therefore, you see that all those things are variable, what is that which is, unless that which transcends all things which are so that they are not? Who then can receive this? Or who, in what manner soever he may have applied the strength of his mind to touch that which is, can reach to that which he may in any way have touched with his mind? It is as if one were to see his native land at a distance, and the sea intervening; he sees whither he would go, but he has not the means of going. So we desire to arrive at that our stability where that which is, is, because this alone always is as it is: the sea of this world interrupts our course, even although already we see whither we go; for many do not even see whither they go, That there might be a way by which we could go, He has come from Him to whom we wished to go. And what has He done? He has appointed a tree by which we may cross the sea. For no one is able to cross the sea of this world, unless borne by the cross of Christ. Even he who is of weak eyesight sometimes embraces this cross; and he who does not see from afar whither he goes, let him not depart from it, and it will carry him over.

Therefore, my brethren, I would desire to have impressed this upon your hearts: if you wish to live in a pious and Christian manner, cling to Christ according to that which He became for us, that you may arrive at Him according to that which is, and according to that which was. He approached, that for us He might become this; because He became that for us, on which the weak may be borne, and cross the sea of this world and reach their native country; where there will be no need of a ship, for no sea is crossed. It is better then not to see with the mind that which is, and yet not to depart from the cross of Christ, than to see it with the mind, and despise the cross of Christ. It is good beyond this, and best of all, if it be possible, that we both see whither we ought to go, and hold fast that which carries us as we go. This they were able to do, the great minds of the mountains, who have been called mountains, whom the light of divine justice pre-eminently illuminates; they were able to do this, and saw that which is. For John seeing said, "In the beginning was the Word, and the Word was with God, and the Word was God." They saw this, and in order that they might arrive at that which they saw from afar, they did not depart from the cross of Christ, and did not despise Christ's lowliness. But little ones who cannot understand this, who do not depart from the cross and passion and resurrection of Christ, are conducted in that same ship to that which they do not see, in which they also arrive who do see.

But truly there have been some philosophers of this world who have sought for the Creator by means of the creature; for He can be found by means of the creature, as the apostle plainly says, "For the invisible things of Him from the creation of the world are clearly seen, being understood by the things that are made, even His eternal power and glory; so they are without excuse." And it follows, "Because that, when they knew God;" he did not say, Because they did not know, but "Because that, when they knew God, they glorified Him not as God, neither were thankful; but became vain in their imaginations, and their foolish heart was darkened." How darkened? It follows, when he says more plainly: "Professing themselves to be wise, they became fools" They saw whither they must come; but ungrateful to Him who afforded them what they saw, they wished to ascribe to themselves what they saw; and having become proud, they lost what they saw, and were turned from it to idols and images, and to the worship of demons, to adore the creature and to despise the Creator. But these having been blinded did those things, and became proud, that they might be blinded: when they were proud they said that they were wise. Those, therefore, concerning whom he said, "Who, when they had known God," saw this which John says, that by the Word of God all things were made. For these things are also found in the books of the philosophers: and that God has an only-begotten Son, by whom are all things. They were able to see that which is, but they saw it from afar: they were unwilling to hold the lowliness of Christ, in which ship they might have arrived in safety at that which they were able to see from afar and the cross of Christ appeared vile to them. The sea has to be crossed, and dost thou despise the wood? Oh, proud wisdom! thou laughest to scorn the crucified Christ; it is He whom thou dost see from afar: "In the beginning was the Word, and the Word was with God." But wherefore was He crucified? Because the wood of His humiliation was needful to thee. For thou hadst become swollen with pride, and hadst been cast out far from that fatherland; and by the waves of this world has the way been intercepted, and there is no means of passing to the fatherland unless borne by the wood Ungrateful one! thou laughest Him to scorn who has come to thee that thou mayest return: He has become the way, and that through the sea: thence He walked in the sea to show that there is a way in the sea. But thou who art not able in any way thyself to walk in the sea, be carried in a ship, be carried by the wood: believe in the crucified One, and thou shalt arrive thither. On account of thee He was crucified, to teach thee humility; and because if He should come as God, He would not be recognized. For if He should come as God, He would not come to those who were not able to see God. For not according to His Godhead does He either come or depart; since He is everywhere present, and is contained in no place. But, according to what did He come? He appeared as a man.
'''
