[[commentary]]
quote='''
“And He ended with the sword His people, and His inheritance He despised” (ver. 62). “Their young men the fire devoured:” that is, wrath. “And their virgins mourned not” (ver. 63). For not even for this was there leisure, in fear of the foe. “Their priests fell by the sword, and their widows were not lamented” (ver. 64). For there fell by the sword the sons of Heli, of one of whom the wife being widowed, and presently dying in child-birth, because of the same confusion could not be mourned with the distinction of a funeral.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
