[[commentary]]
quote='''
He saith then, “But I as a deaf man heard not” (ver. 13). He who replied not to what He heard, did, as it were, not hear them. “But I as a deaf man heard not. And I was as a dumb man that openeth not his mouth.” And he repeats the same things again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"
