[[commentary]]
quote='''
“He hath turned Him unto the prayer of the poor destitute, and despised not their desire” (ver. 17). This is going on now in the building of Sion: the builders of Sion pray, they groan: He is the one poor, because the poor are many; because the thousands among so many nations are one in Him, because He is the unity of the peace of the Church, He is one, He is many: one, through love: many, on account of His extension. Therefore we now pray, we now run: now, if any man hath used to be otherwise, and lived differently, let him eat ashes as it were bread, and mingle his drink with weeping. Now is the time, when Sion is in building: now the stones are entering into the structure: when the building is finished, and the house dedicated, why dost thou run, to ask when too late, to beg in vain, to knock to no purpose, doomed to abide without with the five foolish virgins? Therefore now run.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
