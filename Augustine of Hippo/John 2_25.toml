[[commentary]]
quote='''
(Tr. xi. c. 2) The Maker knew better what was in His own work, than the work knew what was in itself. Peter knew not what was in himself when he said, I will go with Thee unto death; (Luke 22:33. ver. 61) but our Lord's answer showed that He knew what was in man; Before the cock crow, thou shalt thrice deny Me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
“For there was no need for Him, that any one to Him should bear testimony of man: for He knew Himself what was in man.” For He knew what was in man, who had made man, and who had been made Man, in order that He might seek man.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
