[[commentary]]
quote='''
"These things," said He, "have I spoken to you in proverbs: but the hour cometh, when I shall no more speak unto you in proverbs, but I shall show you plainly of my Father." I might be disposed to say that this hour, whereof He speaketh, must be understood as that future period when we shall see openly, as the blessed Paul says, "face to face;" that what He says, "These things have I spoken to you in proverbs," is one with what has been said by the same apostle, "Now we see through a glass, in a riddle:" and "I will show you," because the Father shall be seen through the instrumentality of the Son, is akin to what He says elsewhere, "Neither knoweth any man the Father, save the Son, and [he] to whom the Son shall be pleased to reveal Him." But such a sense seems to be interfered with by that which follows: "At that day ye shall ask in my name." For in that future world, when we have reached the kingdom where we shall be like Him, for we shall see Him as He is, what shall we then have to ask, when our desire shall be satisfied with good things? As it is also said in another psalm: "I shall be satisfied when Thy glory shall be revealed." For petition has to do with some kind of want, which can have no place there where such abundance shall reign.

It remains, therefore, for us, so far as my capacity to apprehend it goes, to understand Jesus as having promised that He would cause His disciples, from being carnal and natural, to become spiritual, although not yet such as we shall be, when a spiritual body shall also be ours; but such as was he who said, "We speak wisdom among them that are perfect;" and, "I could not speak unto you as unto spiritual, but as unto carnal;" and, "We have received, not the spirit of the world, but the Spirit who is of God; that we might know the things that are freely given to us of God. Which things also we speak, not in the words which man's wisdom teacheth, but which the Spirit teacheth; comparing spiritual things with spiritual. But the natural man perceiveth not the things of the Spirit of God." And thus the natural man, perceiving not the things of the Spirit of God, hears in such a way whatever is told him of the nature of God, that he can conceive of nothing else but some bodily form, however spacious or immense, however lustrous and magnificent, yet still a body: and therefore he holds as proverbs all that is said of the incorporeal and immutable substance of wisdom; not that he accounts them as proverbs, but that his thoughts follow the same direction as those who habitually listen to proverbs without understanding them. But when the spiritual man begins to discern all things, and he himself is discerned by no man, he perceives, even though in this life it still be through a glass and in part, not by any bodily sense, and not by any imaginative conception which catches at or devises the likenesses of all sorts of bodies, but by the clearest understanding of the mind, that God is not material, but spiritual: in such a way does the Son show us openly of the Father, that He, who thus shows, is also Himself seen to be of the same substance. And then it is that those who ask, ask in His name; for in the sound of that name they understand nothing else than what the reality is that is called by that name, and harbor not, in vanity or infirmity of mind, the fiction of the Father being in one place, and the Son in another, standing before the Father and making request in our behalf, with the material substances of both occupying each its own place, and the Word pleading verbally for us with Him whose Word He is, while a definite space interposes between the mouth of the speaker and the ears of the hearer; and other such absurdities which those who are natural, and at the same time carnal, fabricate for themselves in their hearts. For any such thing, suggested by the experience of bodily habits, as occurs to spiritual men when thinking of God, they deny and reject, and drive away, like troublesome insects, from the eyes of their mind; and resign themselves to the purity of that light by whose testimony and judgment they prove these bodily images that thrust themselves on their inward vision to be altogether false. These are able to a certain extent to think of our Lord Jesus Christ, in respect of His manhood, as addressing the Father on our behalf; but in respect to His Godhead, as hearing [and answering] us along with the Father. And this I am of opinion that He indicated, when He said, "And I say not that I will pray the Father for you." But the intuitive perception of this, how it is that the Son asketh not the Father, but that Father and Son alike listen to those who ask, is a height that can be reached only by the spiritual eye of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520102.html'
