[[commentary]]
quote='''
Two men Adam begat, and in one was unrighteousness, in one was righteousness: unrighteousness in Cain, righteousness in Abel. Unrighteousness seemed to prevail over righteousness, because Cain unrighteous slew Abel righteous in the night. Is it so in the morning? Nay, “but the righteous shall reign over them in the morning.” The morning shall come, and it shall be seen where Abel is, and where Cain. So all men who are after Cain, and so all who are after Abel, even unto the end of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252049.html'
source_title="Exposition on Psalm 49"
