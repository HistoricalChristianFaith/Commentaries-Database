[[commentary]]
quote='''
“Judge me, O Lord, according to My righteousness” (ver. 24); that is, attend to My cause. Not according to My punishment, but “according to My righteousness, O Lord, My God,” that is, according to this judge Thou Me. “And let them not rejoice over Me;” that is, Mine enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252035.html'
source_title="Exposition on Psalm 35"
