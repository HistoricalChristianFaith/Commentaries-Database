[[commentary]]
quote='''
Finally, after redemption from all corruption, what remains except the crown of righteousness? Certainly, it remains, but even in it or under it, let there not be a swollen head, so that it may receive the crown. Listen, attend to the Psalm, how that crown does not want a swollen head. When it said: Who redeems your life from corruption; who crowns you, it says. And here you would have said: It crowns you, my merits confess, my virtue has done this: it is rendered as due, not given as a gift. Rather, listen to the Psalm. For you also say this: Every man is a liar. Listen to what God says: Who crowns you with compassion and mercy. He crowns you from His mercy, He crowns you from His compassion. For you were not worthy to be called, and when called to be justified, and when justified to be glorified. The remnants have been saved by the election of grace. But if by grace, it is no longer out of works: otherwise grace is no longer grace. For to him who works, the reward is not reckoned according to grace, but according to debt. The Apostle speaks: Not according to grace, but according to debt. However, He crowns you in compassion and mercy: and if your merits have preceded, God says to you: Examine your merits well, and you will see that they are my gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520131.html'
source_title="Sermon 131:8"

[[commentary]]
quote='''
“Who redeemeth thy life from corruption” (ver. 4). Behold, “the body which is corrupted, weigheth down the soul.” The soul then hath life in a corruptible body. What sort of life? It suffereth burdens, it beareth weights. How great obstacles are there to thinking of God Himself, as it is right that men should think of God, as if interrupting us from the necessity of human corruption? how many influences recall us, how many interrupt, how many withdraw the mind when fixed on high? what a crowd of illusions, what tribes of suggestions? All this in the human heart, as it were, teemeth with the worms of human corruption. We have set forth the greatness of the disease, let us also praise the Physician. Shall not He then heal thee, who made thee such as to be in health, hadst thou chosen to keep the law of health which thou hadst received?…First think of thine own health. Sometimes a man is stricken in his own house, on his bed, with a more than usually manifest disorder; although this disorder too, which men dislike to contemplate, be plain; yet each man may be attacked with that sickness for which human physicians are sought, and may gasp with fever in his bed; perhaps he may wish to consider of his domestic affairs, to make some order or disposition relating to his estate or his house; at once he is recalled from such cares by the anxiety of his friends, plainly expressed around him, and he is advised to dismiss these subjects, and first to take thought for his health. This then is addressed unto thee, and to all men: if thou art not sick, think of other things: if thy very infirmity prove thee sick, first take heed of thy health. Christ is thy health: think therefore of Christ. Receive the cup of His saving Health, “who healeth all thine infirmities;” if thou shalt choose, thou shalt gain this Health.…For thy life hath been redeemed from corruption: rest secure now: the contract of good faith hath been entered upon; no man deceives, no man circumvents, no man oppresses, thy Redeemer. He hath here made a barter, He hath already paid the price, He hath poured forth His blood. The only Son of God, I say, hath shed His blood for us: O soul, raise thyself, thou art of so great price.…“He redeemeth thy life from corruption.”

“Who crowneth thee with mercy and loving-kindness.” Thou hadst perhaps begun to be in a manner proud, when thou didst hear the words, “He crowneth thee.” I am then great, I have then wrestled. By whose strength? By thine, but supplied by Him.…He crowneth thee, because He is crowning His own gifts, not thy deservings. “I laboured more abundantly than they all,” said the Apostle; but see what he addeth: “yet not I, but the grace of God which was with me.”…It is then by His mercy that thou art crowned; in nothing be proud; ever praise the Lord; forget not all His rewards. It is a reward when thou, a sinner and an ungodly man, hast been called, that thou mayest be justified. It is a reward, when thou art raised up and guided, that thou mayest not fall. It is a reward, when strength is given thee, that thou mayest persevere unto the end. It is a reward, that even that flesh of thine by which thou wast oppressed riseth again and that not even a hair of thy head perisheth. It is a reward, that after thy resurrection thou art crowned. It is a reward, that thou mayest praise God Himself for evermore without ceasing.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520103.html'
source_title="Exposition on Psalm 103"

[[commentary]]
quote='''
Perhaps you ask whether we ever read in the Sacred Scriptures of "grace for grace." Well you possess the Gospel according to John, which is perfectly clear in its very great light. Here John the Baptist says of Christ: "Of His fulness have we all received, even grace for grace." So that out of His fulness we have received, according to our humble measure, our particles of ability as it were for leading good lives—"according as God hath dealt to every man his measure of faith;" because "every man hath his proper gift of God; one after this manner, and another after that." And this is grace. But, over and above this, we shall also receive "grace for grace," when we shall have awarded to us eternal life, of which the apostle said: "The grace of God is eternal life through Jesus Christ our Lord," having just said that "the wages of sin is death." Deservedly did he call it "wages," because everlasting death is awarded as its proper due to diabolical service. Now, when it was in his power to say, and rightly to say: "But the wages of righteousness is eternal life," he yet preferred to say: "The grace of God is eternal life;" in order that we may hence understand that God does not, for any merits of our own, but from His own divine compassion, prolong our existence to everlasting life. Even as the Psalmist says to his soul, "Who crowneth thee with mercy and compassion." Well, now, is not a crown given as the reward of good deeds? It is, however, only because He works good works in good men, of whom it is said, "It is God which worketh in you both to will and to do of His good pleasure," that the Psalm has it, as just now quoted: "He crowneth thee with mercy and compassion," since it is through His mercy that we perform the good deeds to which the crown is awarded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 21"
