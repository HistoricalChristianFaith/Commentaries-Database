[[commentary]]
quote='''
(Tract. xxix. s. 3) Mine is not mine, appears a contradiction; why did He not say, This doctrine is not Mine? Because the doctrine of the Father being the Word of the Father, and Christ Himself being that Word, Christ Himself is the doctrine of the Father. And therefore He calls the doctrine both His own, and the Father's. A word must be a word of some one's. What is so much Thine as Thou, and what is so much not Thine as Thou, if what Thou art, Thou art of another. His saying then, My doctrine is not Mine own, seems briefly to express the truth, that He is not from Himself; it refutes the Sabellian heresy, which dares to assert that the Son is the same as the Father, there being only two names for one thing.

(de Trin. i. c. xi) Or thus: In one sense He calls it His, in another sense not His; according to the form of the Godhead His, according to the form of the servant not His.

(Tract. xxix. s. 6) Should any one however not understand this, let him hear the advice which immediately follows from our Lord: If any man will do His will, he shall know of the doctrine, whether it be of God, or whether I speak of Myself. What meaneth this, If any man will do His will? To do His will is to believe on Him, as He Himself says, This is the work of God, that ye believe on Him whom He hath sent. (c. 6:29) And who does not know, that to work the work of God, is to do His will? To know is to understand. Do not then seek to understand in order to believe, but believe in order to understand, for, Except ye believe, ye shall not understand. (Is. 7:9. Vulg.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If we have understood this, thanks be to God; but if any has not sufficiently understood, man has done as far as he could: as for the rest, let him see whence he may hope to understand. As laborers outside, we can plant and water; but it is of God to give the increase. "My doctrine," saith He, "is not mine, but His that sent me." Let him who says he has not yet understood hear counsel. For since it was a great and profound matter that had been spoken, the Lord Christ Himself did certainly see that all would not understand this so profound a matter, and He gave counsel in the sequel. Dost thou wish to understand? Believe. For God has said by the prophet: "Except ye believe, ye shall not understand." To the same purpose what the Lord here also added as He went on"If any man is willing to do His will, he shall know concerning the doctrine, whether it be of God, or whether I speak from myself." What is the meaning of this, "If any man be willing to do His will"? But I had said, if any man believe; and I gave this counsel: If thou hast not understood, said I, believe. For understanding is the reward of faith. Therefore do not seek to understand in order to believe, but believe that thou mayest understand; since, "except ye believe, ye shall not understand." Therefore when I would counsel the obedience of believing toward the possibility of understanding, and say that our Lord Jesus Christ has added this very thing in the following sentence, we find Him to have said, "If any man be willing to do His will, he shall know of the doctrine." What is "he shall know"? It is the same thing as "he shall understand." But what is "If any man be willing to do His will"? It is the same thing as to believe. All men indeed perceive that "shall know" is the same thing as "shall understand:" but that the saying, "If any man be willing to do His will," refers to believing, all do not perceive; to perceive this more accurately, we need the Lord Himself for expounder, to show us whether the doing of the Father's will does in reality refer to believing. But who does not know that this is to do the will of God, to work the work of God; that is, to work that work which is pleasing to Him? But the Lord Himself says openly in another place: "This is the work of God, that ye believe on Him whom He has sent." "That ye believe on Him," not, that ye believe Him. But if ye believe on Him, ye believe Him; yet he that believes Him does not necessarily believe on Him. For even the devils believed Him, but they did not believe on Him. Again, moreover, of His apostles we can say, we believe Paul; but not, we believe on Paul: we believe Peter; but not, we believe on Peter. For, "to him that believeth on Him that justifieth the ungodly, his faith is counted unto him for righteousness." What then is "to believe on Him"? By believing to love Him, by believing to esteem highly, by believing to go into Him and to be incorporated in His members. It is faith itself then that God exacts from us: and He finds not that which He exacts, unless He has bestowed what He may find. What faith, but that which the apostle has most amply defined in another place, saying, "Neither circumcision availeth anything, nor uncircumcision, but faith that worketh by love?" Not any faith of what kind soever, but "faith that worketh by love:" let this faith be in thee, and thou shall understand concerning the doctrine. What indeed shall thou understand? That "this doctrine is not mine, but His that sent me;" that is, thou shall understand that Christ the Son of God, who is the doctrine of the Father, is not from Himself, but is the Son of the Father.

This sentence overthrows the Sabellian heresy. The Sabellians have dared to affirm that the Son is the very same as He who is also the Father: that the names are two, but the reality one. If the names were two and reality one, it would not be said, "My doctrine is not mine." Anyhow, if Thy doctrine is not Thine, O Lord, whose is it, unless there be another whose it is? The Sabellians understand not what Thou saidst; for they see not the trinity, but follow the error of their own heart. Let us worshippers of the trinity and unity of Father, Son, and Holy Ghost, and one God, understand concerning Christ's doctrine, how it is not His. And He said that He spoke not from Himself for this reason, because Christ is the Son of the Father, and the Father is the Father of Christ; and the Son is from God the Father, God, but God the Father is God not from God the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252029.html'
source_title="Tractates on John 29"
