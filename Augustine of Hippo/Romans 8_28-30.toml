[[commentary]]
quote='''
When he says: Whom he called, them he also justified, it may prompt the question whether all who are called are justified. But elsewhere we read: Many are called, but few are chosen. Yet because the chosen too are surely called, it is clear that none are justified except the called—though not all the called, but those who are called according to purpose, as he said above. And the purpose is to be understood as God's, not their own. And he himself explains what according to purpose means, when he says: For whom he foreknew, he also predestined to be conformed to the image of his Son. For not all who are called are called according to purpose; for this purpose pertains to the foreknowledge and predestination of God. Nor did he predestine anyone except him whom he foreknew would believe and would follow his calling, whom he also calls the chosen. For many do not come when they have been called, but no one comes who has not been called.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
