[[commentary]]
quote='''
"Or despisest thou the riches of His long-suffering and gentleness; not knowing that the forbearance of God leadeth thee to repentance? But thou, after thy hardness and impenitent heart, treasurest up for thyself wrath against the day of wrath and the revelation of the righteous judgment of God; who will render to every man according to his deeds. The Lord is gentle, the Lord is long-suffering, the Lord is pitiful; but the Lord is also just, the Lord is also true. He bestows on thee space for correction; but thou lovest the delay of judgment more than the amendment of thy ways. Hast thou been a bad man yesterday? To-day be a good man. Hast thou gone on in thy wickedness to-day? At any rate change to-morrow. Thou art always expecting, and from the mercy of God makest exceeding great promises to thyself. As if He, who has promised thee pardon through repentance, promised thee also a longer life. How knowest thou what to-morrow may bring forth? Rightly thou sayest in thy heart: When I shall have corrected my ways, God will put all my sins away. We cannot deny that God has promised pardon to those that have amended their ways and are converted. For in what prophet thou readest to me that God has promised pardon to him that amends, thou dost not read to me that God has promised thee a long life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252033.html'
source_title="Tractates on John 33"
