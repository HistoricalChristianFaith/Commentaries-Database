[[commentary]]
quote='''
As to the events next related, it is true that their exact order is not made apparent by Matthew's narrative. For after the notices of the two incidents in connection with the blind men and the dumb demoniac, he continues in the following manner: "And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the kingdom of the gospel, and healing every sickness and every disease. But when He saw the multitudes, He was moved with compassion on them, because they were troubled and prostrate, as sheep having no shepherd. Then saith He unto His disciples, The harvest truly is plenteous, but the labourers are few: pray ye therefore the Lord of the harvest, that He will send forth labourers into His harvest. And when He had called unto Him His twelve disciples, He gave them power against unclean spirits;" and so forth, down to the words, "Verily I say unto you, he shall not lose his reward." This whole passage which we have now mentioned shows how He gave many counsels to His disciples. But whether Matthew has subjoined this section in its historical order, or has made its order dependent only on the succession in which it came up to his own mind, as has already been said, is not made apparent. Mark appears to have handled this paragraph in a succinct method, and to have entered upon its recital in the following terms: "And He went round about the villages, teaching in their circuit: and He called unto Him the twelve, and began to send them by two and two, and gave them power over unclean spirits;" and so on, down to where we read, "Shake off the dust from your feet for a testimony against them." But before narrating this incident, Mark has inserted, immediately after the story of the raising of the daughter of the ruler of the synagogue, an account of what took place on that occasion on which, in His own country, the people were astonished at the Lord, and asked from whence He had such wisdom and such capabilities, when they perceived His judgment: which account is given by Matthew after these counsels to the disciples, and after a number of other matters. It is uncertain, therefore, whether what thus happened in His own country has been recorded by Matthew in the succession in which it came to mind, after having been omitted at first, or whether it has been introduced by Mark in the way of an anticipation; and which of them, in short, has kept the order of actual occurrence, and which of them the order of his own recollection. Luke, again, in immediate succession to the mention of the raising of the daughter of Jaïrus to life, subjoins this paragraph, bearing on the power and the counsels given to the disciples, and that indeed with as great brevity as Mark. This evangelist, however, does not, any more than the others, introduce the subject in such a way as to produce the impression that it comes in also in the strictly historical order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 30"
