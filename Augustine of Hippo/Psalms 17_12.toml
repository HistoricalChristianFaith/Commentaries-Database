[[commentary]]
quote='''
“As a lion ready for prey, have they taken Me” (ver. 12). They have taken Me, like that adversary who “walketh about, seeking whom he may devour.” “And as a lion’s whelp dwelling in secret places.” And as his whelp, the people to whom it was said, “Ye are of your father the devil:” meditating on the snares, whereby they might circumvent and destroy the just One.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
