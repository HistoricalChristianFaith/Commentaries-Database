[[commentary]]
quote='''
But what doth this mean, “her foundations on the holy hills”? What are the holy hills upon which this city is built? Another citizen tells us this more explicitly, the Apostle Paul: of this was the Prophet a citizen, of this the Apostle citizen: and they spoke to exhort the other citizens. But how are these, I mean the Prophets and Apostles, citizens? Perhaps in this sense; that they are themselves the hills, upon which are the foundations of this city, whose gates the Lord loveth. Let then another citizen state this clearly, that I may not seem to guess. Speaking to the Gentiles, and telling them how they were returning, and being, as it were, framed together into the holy structure, “built,” he says, “upon the foundations of the Apostles and Prophets:” and because neither the Apostles nor Prophets, upon whom the foundations of that city rest, could stand by their own power, he adds, “Jesus Christ Himself being the head corner stone.” That the Gentiles, therefore, might not think they had no relation to Sion: for Sion was a certain city of this world, which bore a typical resemblance as a shadow to that Sion of which he presently speaketh, that Heavenly Jerusalem, of which the Apostle saith, “which is the mother of us all;” they might not be said to bear no relation to Sion, on the ground that they did not belong to the Jewish people, he addresses them thus: “Now therefore ye are no more strangers and foreigners, but fellow citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets.” Thou seest the structure of so great a city: yet whereon does all that edifice repose, where does it rest, that it may never fall? “Jesus Christ Himself,” he saith, “being the head corner stone.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
