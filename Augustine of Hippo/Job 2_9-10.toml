[[commentary]]
quote='''
Admitted was the tempter; he took away everything, there remained the man bereft of possessions, bereft of family, bereft of children, full of God. A wife certainly was left. Merciful do ye deem the devil, that he left him a wife? He knew through whom he had deceived Adam.…With wound smitten from head even unto feet, whole nevertheless within, he made answer to the woman tempting, out of the light of the living, out of the light of his heart: “thou hast spoken as though one of the unwise women,” that is, as though one that hath not the light of the living. For the light of the living is wisdom, and the darkness of unwise men is folly. Thou hast spoken as though one of the unwise women: my flesh thou seest, the light of my heart thou seest not. For she then might more have loved her husband, if the interior beauty she had known, and had beheld the place where he was beautiful before the eyes of God: because in Him were vows which he might render of praise to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252056.html'
source_title="Exposition on Psalm 56"
