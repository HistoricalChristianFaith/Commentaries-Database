[[commentary]]
quote='''
But if he have the dew of Hermon, which fell on the hill of Sion, he is quiet, peaceable, humble, submissive, pouring forth prayer in place of murmuring. For murmurers are admirably described in a certain passage of the Scriptures, “The heart of a fool is as the wheel of a cart.” What is the meaning of “the heart of a fool is as the wheel of a cart”? It carries hay, and creaks. The wheel of a cart cannot cease from creaking. Thus there are many brethren, who do not dwell together, save in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520133.html'
source_title="Exposition on Psalm 133"
