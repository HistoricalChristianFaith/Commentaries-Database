[[commentary]]
quote='''
"For as regards the fact that to preserve the figure of unity the Lord gave the power to Peter that whatsoever he should loose on earth should be loosed," it is clear that that unity is also described as one dove without fault. Can it be said, then, that to this same dove belong all those greedy ones, whose existence in the same Catholic Church Cyprian himself so grievously bewailed? For birds of prey, I believe, cannot be called doves, but rather hawks. How then did they baptize those who used to plunder estates by treacherous deceit, and increase their profits by compound usury, if baptism is only given by that indivisible and chaste and perfect dove, that unity which can only be understood as existing among the good? Is it possible that, by the prayers of the saints who are spiritual within the Church, as though by the frequent lamentations of the dove, a great sacrament is dispensed, with a secret administration of the mercy of God, so that their sins also are loosed who are baptized, not by the dove but by the hawk, if they come to that sacrament in the peace of Catholic unity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520Baptism%2FBook%25203.html'
source_title="ON BAPTISM 3:17.22"

[[commentary]]
quote='''
But perhaps they will say: Well, as it is a dove, and the dove is one, baptism there cannot be apart from the one dove. Therefore if the dove is with thee, or if thou be thyself a dove, do thou give me, when I come to thee, that which I have not. You know that this is what they say; but you will presently see that it is not of the voice of the dove, but of the clamor of the raven. For attend a little, beloved, and fear their devices; nay, beware of them, and listen to the words of gainsayers only to reject them, not to swallow them and take them into your bowels. Do therein what the Lord did when they offered Him the bitter draught, "He tasted, and spat it out; " so also you hear and cast away. What indeed say they? Let us see. Lo, says he, "Thou art the dove." O Catholic Church, it is to thee it is said, "My dove is one, the only one of her mother" to thee certainly is it said. Stop, do not question me; prove first whether to me it was said; if it was said to me, I would hear it at once. "To thee," saith he, "it was said." I answer, in the voice of the Catholic Church, "To me." And this answer, brethren, sounding forth from my mouth alone, has sounded, as I believe, also from your hearts, and we all affirmed together, yea, to the Catholic Church was it said, "One is my dove, the only one of her mother." Apart from this dove, says he further, there is no baptism: I was baptized apart from this dove, consequently have not baptism; if I have not baptism, why dost thou not give it me when I come to thee?

I also will put questions; let us meanwhile lay aside the inquiry as to whom this was said, "My dove is one, the only one of her mother; "-as yet we are inquiring;-it was said either to me or to thee; let us postpone the question as to whom it was said. This is what I ask, if the dove is simple, innocent, without gall, peaceful in its kisses, not fierce with its talons, I ask whether the covetous, the rapacious, the crafty, the sottish, the infamous, belong to the members of this dove? Are they members of this dove? Far be the thought, says he. And who would really say this, brethren? To speak of nothing else, if I mention the rapacious alone, members of the hawk they may be, not members of the dove. Kites seize and plunder, so do hawks, so do ravens; doves do not plunder nor tear, consequently they who snatch and rob are not members of the dove. Was there not even one rapacious person among you? Why abides the baptism, which in this case the hawk, not the dove, has given? Why do you not among yourselves baptize after robbers, after adulterers, after drunkards? Why not baptize after the avaricious among yourselves? Are these all members of the dove? You so dishonor your dove that you make those that have the nature of the vulture her members. What, then, brethren, what say we? There are the bad and the good in the Catholic Church, but with them the bad only. But perhaps I say this with a hostile feeling: let this too be afterwards examined. They do say, certainly, that among them are the good and the bad; for, should they assert that they have only the good, let their own credit it, and I subscribe. With us, let them say, there are none but holy, righteous, chaste, sober men; no adulterers, no usurers, no deceivers, no false swearers, no wine-bibbers;-let them say this, for I heed not their tongues I touch their hearts. But since they are well known to us, and to you, and to their own, just as you are known both to yourselves in the Catholic Church and to them, neither let us find fault with them, nor let them flatter themselves. We confess that in the Church there are good and bad, yet as the grain and the chaff. Sometimes he who is baptized by the grain is chaff, and he who is baptized by the chaff is grain. Otherwise, if his baptism who is baptized by the grain stands good, and his who is baptized by the chaff not, then it is not true, "This is He that baptizeth." But if it is true "This is He that baptizeth," then what is given by the chaff stands good, and he baptizeth in like manner as the dove. For the bad man (who administers baptism) is not the dove, nor belongs to the members of the dove, nor can he possibly be affirmed to be so, either with us in the Catholic Church or with them, if they assert that their Church is the dove. What then are we to understand, brethren? Since it is evident, and known to all, and they must admit, though it be against their will, that when with them bad men give baptism, it is not given after those bad men; and with us, too, when the bad give baptism, it is not given after them. The dove does not baptize after the raven; why then would the raven baptize after the dove?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25206.html'
source_title="Tractates on John 6"
