[[commentary]]
quote='''
“The hills melted like wax at the presence of the Lord” (ver. 5). Who are the hills? The proud. Every high thing raising itself against God, at the deeds of Christ and of the Christians, trembled, yielded, and when I say, what hath been already said, “melted,” a better word cannot be found. “The hills melted like wax at the presence of the Lord.” Where is the elevation of powers? where the hardness of the unbelieving? The Lord was a fire unto them, they melted at His presence like wax; so long hard, until that fire was applied. Every height hath been levelled; it dareth not now blaspheme Christ: and though the Pagan believeth not in Him, he blasphemeth Him not; though not as yet become a living stone, yet the hard hill hath been subdued. “At the presence of the Lord of the whole earth:” not of the Jews only, but of the Gentiles also, as the Apostle saith; for He is not the God of the Jews alone, but of the Gentiles also. He is therefore the Lord of the whole earth, the Lord Jesus Christ born in Judæa, but not born for Judæa alone, because before He was born He created all men; and He who created, also new created, all men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"
