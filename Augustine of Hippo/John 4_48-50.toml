[[commentary]]
quote='''
For He showed that He would break off these branches, and ingraft this wild olive, when moved by the faith of the centurion, who said to Him, "I am not worthy that thou shouldest come under my roof; but only speak the word, and my child shall be healed: for I also am a man put under authority, having soldiers under me; and I say to one, Go, and he goeth; and to another, Come, and he cometh; and to my servant, Do this, and he doeth it. Jesus turned to those who followed Him, and said, Verily I say unto you, I have not found so great faith in Israel." Why not found so great faith in Israel? "Because a prophet has no honor in his own country." Could not the Lord have said to that centurion, what He said to this ruler, "Go, thy child liveth?" See the distinction: this ruler desired the Lord to come down to his house that centurion declared himself to be unworthy. To the one it was said, "I will come and heal him;" to the other, "Go, thy son liveth." To the one He promised His presence; the other He healed by His word. The ruler sought His presence by force; the centurion declared himself unworthy of His presence. Here is a ceding to loftiness; there, a conceding to humility. As if He said to the ruler, "Go, thy son liveth;" do not weary me. "Except ye see signs and wonders, ye believe not;" thou desirest my presence in thy house, I am able to command by a word; do not wish to believe in virtue of signs: the centurion, an alien, believed me able to work by a word, and believed before I did it; you, "except ye see signs and wonders, believe not." Therefore, if it be so, let them be broken off as proud branches, and let the humble wild olive be grafted; nevertheless let the root remain, while those are cut off and these received in their place. Where does the root remain? In the patriarchs. For the people Israel is Christ's own country, since it is of them that He came according to the flesh; but the root of this tree is Abraham, Isaac, and Jacob, the holy patriarchs. And where are they? In rest with God, in great honor; so that it was into Abraham's bosom that the poor man, on being promoted, was raised after his departure from the body, and in Abraham's bosom was he seen from afar off by the proud rich man. Wherefore the root remains, the root is praised; but the proud branches deserved to be cut off, and to wither away; and by their cutting off, the humble wild olive has found a place.

Hear now how the natural branches are cut off, how the wild olive is grafted in, by means of the centurion himself, whom I have thought proper to mention for the sake of comparison with this ruler. "Verily I say unto you, I have not found so great faith in Israel; therefore I say unto you, that many shall come from the east and from the west." How widely the wild olive took possession of the earth! This world was a bitter forest; but because of the humility, because of this "I am not worthy-many shall come from the east and from the west." And grant that they come, what shall become of them? For if they come, they are cut off from the forest; where are they to be ingrafted, that they may not wither? "And shall sit down," saith He, "with Abraham, and Isaac, and Jacob." At what banquet, in case thou dost not invite to ever living, but to much drinking? Where, "shall sit down? In the kingdom of heaven." And how will it be with them who came of the stock of Abraham? What will become of the branches with which the tree was full? What but to be cut off, that these may be grafted in? Show us that they shall be cut off: "But the children of the kingdom shall go into outer darkness."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252016.html'
source_title="Tractates on John 16"
