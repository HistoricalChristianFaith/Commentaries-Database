[[commentary]]
quote='''
They would have slandered Him, because of the tribute: He said not, “It is lawful to pay tribute,” or, “It is not lawful to pay tribute.” And He willed to break utterly their teeth, wherewith they were gaping in order to bite; but in their own mouth He would do it. If He said, Let there be paid to Cæsar tribute, they would have slandered Him, because He had spoken evil to the nation of the Jews, by making it a tributary. For because of sin they were paying tribute, having been humbled, as to them in the Law had been foretold. We have Him, say they, a maligner of our nation, if He shall have bidden us to pay tribute: but if He say, Do not pay, we have Him for saying that we should not be under allegiance to Cæsar. Such a double noose as it were to catch the Lord they laid. But to whom had they come? To Him that knew how to break utterly the teeth of them in their own mouth. “Show to Me the coin,” He saith. Why tempt ye Me, ye hypocrites?” Of paying tribute do ye think? To do justice are ye willing? the counsel of justice do ye seek? “If truly justice ye speak, judge right things, ye sons of men.” But now because in one way ye speak, in another way judge, hypocrites ye are: “Why tempt ye Me, ye hypocrites?” Now I will break utterly your teeth in your mouth: “show to Me the coin.” And they showed it to Him. And He saith not, it is Cæsar’s: but asketh Whose it is? in order that their teeth in their own mouth might be utterly broken. For on His inquiring, of whom it had the image and inscription, they said, of Cæsar. Even now the Lord shall break utterly the teeth of them in their own mouth. Now ye have made answer, now have been broken utterly your teeth in your mouth. “Render unto Cæsar the things which are of Cæsar, and unto God the things which are of God.” Cæsar seeketh his image; render it: God seeketh His image; render it. Let not Cæsar lose from you his coin: let not God lose in you His coin. And they found not what they might answer. For they had been sent to slander Him: and they went back, saying, that no one to Him could make answer. Wherefore? Because broken utterly had been the teeth of them in their own mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
