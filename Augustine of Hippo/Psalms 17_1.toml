[[commentary]]
quote='''
A prayer of David himself.

This prayer must be assigned to the Person of the Lord, with the addition of the Church, which is His body.

“Hear My righteousness, O God, consider My supplication” (ver. 1). “Hearken unto My prayer, not in deceitful lips:” not going forth to Thee in deceitful lips.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252017.html'
source_title="Exposition on Psalm 17"
