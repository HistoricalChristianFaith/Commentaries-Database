[[commentary]]
quote='''
Jonadab (he is commended to us in the prophecy of Jeremiah) was a certain man, who had enjoined his sons not to drink wine, and not to dwell in houses, but in tents. But the commandment of the father the sons kept and observed, and by this earned a blessing from the Lord. Now the Lord had not commanded this, but their own father. But they so received it as though it were a commandment from the Lord their God; for even though the Lord had not commanded that they should drink no wine and should dwell in tents; yet the Lord had commanded that sons should obey their father. In this case alone a son ought not to obey his father, if his father should have commanded anything contrary to the Lord his God. For indeed the father ought not to be angry, when God is preferred before him. But when a father doth command that which is not contrary to God; he must be heard as God is: because to obey one’s father God hath enjoined. God then blessed the sons of Jonadab because of their obedience, and thrust them in the teeth of His disobedient people, reproaching them, because while the sons of Jonadab were obedient to their father, they obeyed not their God. But while Jeremiah was treating of these topics, he had this object in regard to the people of Israel, that they should prepare themselves to be led for captivity into Babylon, and should not hope for any other thing, but that they were to be captives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
