[[commentary]]
quote='''
Wherefore then is it in their hands, not in their tongues? “And swords,” it saith, “sharpened on both sides in their hands.” By “in their hands,” he meaneth in power. They received then the word of God in power, to speak where they would, to whom they would, neither to fear power, nor to despise poverty. For they had in their hands a sword; where they would they brandished it, handled it, smote with it: and all this was in the power of the preachers. For if the Word be not in their hands, why is it written, “The Word of the Lord was put in the hand of the Prophet Haggai”? Surely, brethren, God set not His Word in His fingers. What is meant by, “was put in his hand”? It was put into his power to preach the Word of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
