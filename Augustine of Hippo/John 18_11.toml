[[commentary]]
quote='''
Peter's deed, however, was disapproved of by the Lord, and He prevented Him from proceeding further by the words: "Put up thy sword into the sheath: the cup which my Father hath given me, shall I not drink it?" For in such a deed that disciple only sought to defend his Master, without any thought of what it was intended to signify. And he had therefore to be exhorted to the exercise of patience, and the event itself to be recorded as an exercise of understanding. But when He says that the cup of suffering was given Him by the Father, we have precisely the same truth as that which was uttered by the apostle: "If God be for us, who can be against us? He that spared not His own Son, but gave Him up for us all." But the originator of this cup is also one with Him who drank it; and hence the same apostle likewise says, "Christ loved us, and gave Himself for us an offering and a sacrifice to God of a sweet-smelling savor."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520112.html'
source_title="Tractates on John 112"
