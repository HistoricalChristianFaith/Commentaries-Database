[[commentary]]
quote='''
(de Con. in Evan. ii. 1.) He however might be called His father in that light in which he is rightly regarded as the husband of Mary, that is, not from any carnal connection, but by reason of the very bond of wedlock, a far closer relationship than that of adoption. For that Joseph was not to be called Christ's father was not, because he had not begotten Him by cohabitation, since in truth he might be a father to one whom he had not begotten from his wife, but had adopted from another.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Christ, it is true, was also supposed to be the son of Joseph in another way, as if He had been born simply of that man's seed. But this supposition was entertained by persons whose notice the virginity of Mary escaped. For Luke says: "And Jesus Himself began to be about thirty years of age, being (as was supposed) the son of Joseph." This Luke, however, instead of naming Mary His only parent, had not the slightest hesitation in also speaking of both parties as His parents, when he says: "And the boy grew and waxed strong, filled with wisdom, and the grace of God was in Him: and His parents went to Jerusalem every year at the feast of the passover." But lest any one may fancy that by the "parents" here are rather to be understood the blood relations of Mary along with the mother herself, what shall be said to that preceding word of the same Luke, namely, "And His father and mother marvelled at those things which were spoken of Him"? Since, then, he also makes the statement that Christ was born, not in consequence of Joseph's connection with the mother, but simply of Mary the virgin, how can he call him His father, unless it be that we are to understand him to have been truly the husband of Mary, without the intercourse of the flesh indeed, but in virtue of the real union of marriage; and thus also to have been in a much closer relation the father of Christ, in so far as He was born of his wife, than would have been the case had He been only adopted from some other party? And this makes it clear that the clause,"as was supposed," is inserted with a view to those who are of opinion that He was begotten by Joseph in the same way as other men are begotten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 1"
