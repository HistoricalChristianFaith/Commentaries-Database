[[commentary]]
quote='''
By "sin lies dead," Paul means that it is "latent" in us.
'''
source_url=''
source_title="TO SIMPLICIAN ON VARIOUS QUESTIONS 1.4"

[[commentary]]
quote='''
By "sin is dead" the apostle means that it is not "imputed" to us.
'''
source_url=''
source_title="QUESTIONS 66.4"

[[commentary]]
quote='''
When he says: But sin, having taken occasion, worked in me through the commandment every concupiscence, it must be understood that it was not the whole of concupiscence before it was increased by the prohibition. For concupiscence is increased by the prohibition when the grace of the Liberator is absent; and therefore it is not yet "all" before it is prohibited. But when it has been prohibited, grace being absent, as we have said, concupiscence grows so much that thus in its own kind it becomes "all," that is, consummated—so that it is even done against the law and heaps up the charge by transgression.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
When he says: For without the law sin is dead, he said it is dead not because it does not exist, but because it lies hidden—which he makes clear in what follows, when he says: But sin, that it might appear as sin, worked death in me through what is good. For the law is good, but without grace it only shows sins, it does not take them away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
