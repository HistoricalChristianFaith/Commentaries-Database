[[commentary]]
quote='''
Begotten from the eternal Father, begotten from eternity, begotten in eternity, with no beginning, with no ending, with no space of extension, because he is what is, because he himself is who is.
'''
source_url=''
source_title="HOMILIES ON 1 JOHN 2:5"

[[commentary]]
quote='''
“The Lord hath said unto me, Thou art My Son, to-day have I begotten Thee” (ver. 7). Although that day may also seem to be prophetically spoken of, on which Jesus Christ was born according to the flesh; and in eternity there is nothing past as if it had ceased to be, nor future as if it were not yet, but present only, since whatever is eternal, always is; yet as “to-day” intimates presentiality, a divine interpretation is given to that expression, “To-day have I begotten Thee,” whereby the uncorrupt and Catholic faith proclaims the eternal generation of the Power and Wisdom of God, who is the Only-begotten Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25202.html'
source_title="Exposition on Psalm 2"
