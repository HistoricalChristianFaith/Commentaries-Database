[[commentary]]
quote='''
And man, thou laughest doubtless at what thou hast made, if thou knowest by whom thou art made. But of them who know not, what is said? “All they who make them, and all they who trust in them, are like them” (ver. 18). And ye believe, brethren, that there is a likeness to these idols expressed not in their flesh, but in their inner man. For “they have ears, and hear not.” God calls to them indeed, “He who hath ears to hear, let him hear.” They have eyes, and see not, for they have the eyes of the body, and not the eyes of faith. Lastly, this prophecy is fulfilled among all the nations.…Is it not fulfilled? Is it not seen, as it is written? And they who remain have eyes, and see not; have nostrils, and smell not. They perceive not that savour. “We are a good savour of Christ,” as the apostle says everywhere. What profiteth it, that they have nostrils, and smell not that so sweet savour of Christ? Truly it is done in them, and truly it is said of them, “All they who make them,” etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520135.html'
source_title="Exposition on Psalm 135"
