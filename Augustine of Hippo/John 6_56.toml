[[commentary]]
quote='''
Then He explains what it is to eat His body and drink His blood: He that eateth My flesh, and drinketh My blood, dwelleth in Me, and I in him. So then to partake of that meat and that drink, is to dwell in Christ and Christ in thee. He that dwelleth not in Christ, and in whom Christ dwelleth not, neither eateth His flesh, nor drinketh His blood: but rather eateth and drinketh the sacrament of it to his own damnation.

(de Verb. Dom.) As for those, as indeed there are many, who either eat that flesh and drink that blood hypocritically, or, who having eaten, become apostates, do they dwell in Christ, and Christ in them? Nay, but there is a certain mode of eating that flesh, and drinking that blood, in the which he that eateth and drinketh, dwelleth in Christ, and Christ in him.

(de Civ. Dei, l. xxi. c. 25) That is to say, such an one eateth the body and drinketh the blood of Christ not in the sacramental sense, but in reality.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In a word, He now explains how that which He speaks of comes to pass, and what it is to eat His body and to drink His blood."He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him." This it is, therefore, for a man to eat that meat and to drink that drink, to dwell in Christ, and to have Christ dwelling in him. Consequently, he that dwelleth not in Christ, and in whom Christ dwelleth not, doubtless neither eateth His flesh [spiritually] nor drinketh His blood [although he may press the sacrament of the body and blood of Christ carnally and visibly with his teeth], but rather doth he eat and drink the sacrament of so great a thing to his own judgment, because he, being unclean, has presumed to come to the sacraments of Christ, which no man taketh worthily except he that is pure: of such it is said, "Blessed are the pure in heart, for they shall see God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"

[[commentary]]
quote='''
All this that the Lord spoke concerning His flesh and blood;-and in the grace of that distribution He promised us eternal life, and that He meant those that eat His flesh and drink His blood to be understood, from the fact of their abiding in Him and He in them; and that they understood not who believed not; and that they were offended through their understanding spiritual things in a carnal sense; and that, while these were offended and perished, the Lord was present for the consolation of the disciples who remained, for proving whom He asked, "Will ye also go away?" that the reply of their steadfastness might be known to us, for He knew that they remained with Him;-let all this, then, avail us to this end, most beloved, that we eat not the flesh and blood of Christ merely in the sacrament, as many evil men do, but that we eat and drink to the participation of the Spirit, that we abide as members in the Lord's body, to be quickened by His Spirit, and that we be not offended, even if many do now with us eat and drink the sacraments in a temporal manner, who shall in the end have eternal torments. For at present Christ's body is as it were mixed on the threshing-floor: "But the Lord knoweth them that are His." If thou knowest what thou threshest, that the substance is there hidden, that the threshing has not consumed what the winnowing has purged; certain are we, brethren, that all of us who are in the Lord's body, and abide in Him, that He also may abide in us, have of necessity to live among evil men in this world even unto the end. I do not say among those evil men who blaspheme Christ; for there are now few found who blaspheme with the tongue, but many who do so by their life. Among those, then, we must necessarily live even unto the end.

But what is this that He saith: "He that abideth in me, and I in him"? What, but that which the martyrs heard: "He that persevereth unto the end, the same shall be saved"? How did Saint Laurence, whose feast we celebrate to-day, abide in Him? He abode even to temptation, abode even to tyrannical questioning, abode even to bitterest threatening, abode even to destruction;-that were a trifle, abode even to savage torture. For he was not put to death quickly, but tormented in the fire: he was allowed to live a long time; nay, not allowed to live a long time, but forced to die a slow, lingering death. Then, in that lingering death, in those torments, because he had well eaten and well drunk, as one who had feasted on that meat, as one intoxicated with that cup, he felt not the torments. For He was there who said, "It is the Spirit that quickeneth." For the flesh indeed was burning, but the Spirit was quickening the soul. He shrunk not back, and he mounted into the kingdom. But the holy martyr Xystus, whose day we celebrated five days ago, had said to him, "Mourn not, my son;" for Xystus was a bishop, he was a deacon. "Mourn not," said he; "thou shall follow me after three days." He said three days, meaning the interval between the day of Saint Xystus's suffering and that of Saint Laurence's suffering, which falls on to-day. Three days is the interval. What comfort! He says not, "Mourn not, my son; the persecution will cease, and thou wilt be safe;" but, "do not mourn: whither I precede thou shalt follow; nor shall thy pursuit be deferred: three days will be the interval, and thou shalt be with me." He accepted the oracle, vanquished the devil, and attained to the triumph.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252027.html'
source_title="Tractates on John 27"
