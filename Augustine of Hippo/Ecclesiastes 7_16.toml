[[commentary]]
quote='''
And here we have to consider in the first place, if any one is rightly reproved of sin, how he may also be rightly reproved of righteousness. For if a sinner ought to be reproved just because he is a sinner, will any one imagine that a righteous man is also to be reproved because he is righteous? Surely not. For if at any time a righteous man also is reproved, he is rightly reproved on this account, that, according to Scripture, "There is not a just man upon earth, that doeth good, and sinneth not." And accordingly, when a righteous man is reproved, he is reproved of sin, and not of righteousness. Since in that divine utterance also, where we read, "Be not made righteous over-much," there is notice taken, not of the righteousness of the wise man, but of the pride of the presumptuous. The man, therefore, that becomes "righteous over-much," by that very excess becomes unrighteous. For he makes himself righteous over-much who says that he has no sin, or who imagines that he is made righteous, not by the grace of God, but by the sufficiency of his own will: nor is he righteous through living righteously, but is rather self-inflated with the imagination of being what he is not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252095.html'
source_title="Tractates on John 95"
