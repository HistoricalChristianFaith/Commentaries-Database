[[commentary]]
quote='''
“For by Thee shall I be delivered from temptation” (ver. 29). For not by myself, but by Thee, shall I be delivered from temptation. “And in my God shall I leap over the wall.” And not in myself, but in my God shall I leap over the wall, which sin has raised between men and the heavenly Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
