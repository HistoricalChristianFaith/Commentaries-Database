[[commentary]]
quote='''
When he says: For when they were not yet born, nor had done anything good or evil, that the purpose of God according to election might stand, not of works but of him who calls, it was said to her: The elder shall serve the younger; as it is written: Jacob I loved, but Esau I hated—this moves some to think that the apostle Paul has taken away free will, by which we earn God's favor through the good of godliness or offend him through the evil of ungodliness. For they say that before any works, whether good or evil, of two not yet born, God loved the one and hated the other. But we reply that this came about by the foreknowledge of God, by which he knows even of the not-yet-born what each one will be. But lest anyone say: God, then, chose the works in the one whom he loved, although they did not yet exist, because he foreknew they would be—and if he chose works, how does the Apostle say the election was made not of works?—therefore it must be understood that good works are done through love, but that love is in us through the gift of the Holy Spirit, as the same Apostle says: The love of God is poured out in our hearts through the Holy Spirit, who has been given to us. Therefore no one ought to glory in works as his own, which he has through the gift of God, since love itself works the good in him. What, then, did God choose? For if he grants the Holy Spirit, through whom love works the good, to whom he wills, how did he choose to whom he should grant it? For if there is no merit, there is no election; for all are equal before merit, and among things wholly equal, election cannot be spoken of. But since the Holy Spirit is not given except to believers, God did not indeed choose the works which he himself bestows when he gives the Holy Spirit, that through love we may do good works—yet he did choose faith. For unless a person believes in him and remains in the will to receive, he does not receive the gift of God, that is, the Holy Spirit, through whom, love being poured out, he may be able to do good. God, therefore, did not choose anyone's works in foreknowledge, which he himself was going to give, but he chose faith in foreknowledge, so that the one whom he foreknew would believe in him, him he chose, to whom he would give the Holy Spirit, so that by doing good he might also attain eternal life. For the same Apostle says: It is the same God who works all things in all, but nowhere is it said: God believes all things in all. Therefore that we believe is our own, but that we do good belongs to him who gives the Holy Spirit to those who believe in him. This example was set against certain Jews who had believed in Christ and gloried in works before grace, and said that they had merited the very grace of the Gospel by their preceding good works—whereas good works can exist in no one except one who has received grace. But it is grace that the calling is proffered to the sinner, when no merits of his have gone before except unto damnation. But if the called follows him who calls—which is now in free will—he will merit also the Holy Spirit, through whom he may be able to do good; and remaining in this (which is likewise in free will), he will merit also eternal life, which can be corrupted by no taint.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
