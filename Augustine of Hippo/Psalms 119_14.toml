[[commentary]]
quote='''
“I have had as great delight in the way of Thy testimonies, as in all manner of riches” (ver. 14). We understand that there is no more speedy, no more sure, no shorter, no higher way of the testimonies of God than Christ, “in whom are hid all the treasures of wisdom and knowledge.” Thence he saith that he hath had as great delight in this way, as in all riches. Those are the testimonies, by which He deigneth to prove unto us how much He loveth us.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
