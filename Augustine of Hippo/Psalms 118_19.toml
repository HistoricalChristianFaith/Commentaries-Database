[[commentary]]
quote='''
“Open me the gates of righteousness,” he saith in another Psalm, “that I may go into them, and confess unto the Lord.” Did he say, when I have entered, I will no longer confess? Even after his entrance, he will confess. For what sins did our Lord Jesus Christ confess, when He said, “I confess unto Thee, O Father”? He confessed in praising Him, not in accusing Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520100.html'
source_title="Exposition on Psalm 100"

[[commentary]]
quote='''
“Open me,” he saith, “the gates of righteousness” (ver 19). Behold, we have heard of the gates. What is within? “That I may,” he saith, “go into them, and give thanks unto the Lord.” This is the confession of praise full of wonder, “even unto the house of God, in the voice of joy and confession of praise, among such as keep holiday:” this is the everlasting bliss of the righteous, whereby they are blessed who dwell in the Lord’s house, praising Him for evermore.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520118.html'
source_title="Exposition on Psalm 118"
