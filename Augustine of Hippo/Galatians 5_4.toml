[[commentary]]
quote='''
Because it is they, not Christ, who are injured, he adds: "you have fallen from grace." For when the effect of Christ's grace is that those who were debtors to the works of the law were freed from this debt, these people, ungrateful to such great grace, prefer to be debtors to the whole law. Now this had not yet happened, but, because the will had begun to be moved, he therefore speaks frequently as though it had already happened.
'''
source_url=''
source_title="EPISTLE TO THE GALATIANS 42 [1B.5.4-12]"

[[commentary]]
quote='''
He is refuting those who believed that they were justified in the law, not those who observed its legitimate provisions in honor of him by whom they were commanded, understanding both that they were commanded as a foreshadowing of the truth and that they belonged to a particular time.
'''
source_url='https://www.newadvent.org/fathers/1102082.htm'
source_title="LETTERS 82.19.3"

[[commentary]]
quote='''
It is by grace that any one is a doer of the law; and without this grace, he who is placed under the law will be only a hearer of the law. To such persons he addresses these words: "Ye who are justified by the law are fallen from grace."

Now who can be so insensible to the words of the apostle, who so foolishly, nay, so insanely ignorant of the purport of his statement, as to venture to affirm that the law is grace, when he who knew very well what he was saying emphatically declares, "Ye who are justified by the law are fallen from grace"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapters 24-25"
