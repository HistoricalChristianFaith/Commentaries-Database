[[commentary]]
quote='''
It was from this diet that they drew the knowledge that He knew all things, and needed not that any one should ask Him: and, indeed, why they said this, is a topic worthy of inquiry. For one would think they ought rather to have said, Thou needest not to ask any one; not, "That any one should ask Thee." They had just said, We are sure that Thou knowest all things:" and surely He that knoweth all things is accustomed rather to be questioned by those who do not know, that in reply to their questions they may hear what they wish from Him who knoweth all things; and not to be Himself the questioner, as if wishing to know something, when He knoweth all things. What, then, are we to understand by this, that, when apparently they ought to have said to Him, whom they knew to be omniscient, Thou needest not to ask any man, they considered it more befitting to say, "Thou needest not that any man should ask Thee"? Yea, is it not the case that we read of both being done; to wit, that the Lord both asked, and was asked questions? But this latter is speedily answered: for this was needful not for Him, but for those rather whom He questioned, or by whom He was questioned. For He never questioned any for the purpose of learning anything from them, but for the purpose rather of teaching them. And for those who put questions to Him, as desirous of learning something of Him, it was assuredly needful to be made acquainted with some things by Him who knew everything. And doubtless on the same account also it was that He needed not that any man should ask Him. As it is the case that we, when questioned by those who wish to get some information from us, discover by their very questionings what it is that they wish to know, we therefore need to be questioned by those whom we wish to teach, in order that we may be acquainted with their inquiries that call for an answer: but He, who knew all things, had no need even of that, and as little need had He of discovering by their questions what it was that any one desired to know of Him, for before a question was put, He knew the intention of him who was to put it. But He suffered Himself to be questioned on this account, that He might show to those who were then present, or to those who should either hear the things that were to be spoken or read them when written, what was the character of those by whom He was questioned; and in this way we might come to know both the frauds that were powerless to impose upon Him, and the ways of approach that would turn to our profit in His sight. But to foresee the thoughts of men, and thus to have no need that any one should ask Him, was no great matter for God, but great enough for the babes, who said to Him, "By this we believe that Thou camest forth from God." A much greater thing it was, for the understanding of which He wished to have their minds expanded and enlarged, that, on their saying, and saying truly, "Thou camest forth from God," He replied, "The Father is with me;" in order that they should not think that the Son had come forth from the Father in any sense that would lead them to suppose that He had also withdrawn from His presence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520103.html'
source_title="Tractates on John 103"
