[[commentary]]
quote='''
“For Thou shalt give Him blessing for ever and ever.” This is the blessing which Thou shalt give Him for ever and ever: “Thou shalt make Him glad in joy together with Thy countenance” (ver. 6). According to His manhood, Thou shalt make Him glad together with Thy countenance, which He lifted up to Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252021.html'
source_title="Exposition on Psalm 21"
