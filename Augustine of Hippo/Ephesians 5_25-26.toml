[[commentary]]
quote='''
For Christ, who is the vine with us, and the husbandman with the Father, "loved the Church, and gave Himself for it." And then read the apostle, and see what he adds: "That He might sanctify it, cleansing it with the washing of water by the word." The cleansing, therefore, would on no account be attributed to the fleeting and perishable element, were it not for that which is added, "by the word."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252080.html'
source_title="Tractates on John 80"
