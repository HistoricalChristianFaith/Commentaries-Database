[[commentary]]
quote='''
When any people, you see, who are already of an age to make free decisions of will, approach the sacraments of the faithful, they cannot begin the new life unless they repent of the old. It's only babies that are exempt from this kind of repentance when they are baptized; after all they are not yet capable of making free choices.However, the faith of those who present them for baptism can avail them for sanctification and the remission of original sin; thus whatever defilement of wrongdoing they may have contracted through others, of whom they have been born, they can be purged of it through the interrogation of these others and the replies they give.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520351.html'
source_title="SERMON 351.2"

[[commentary]]
quote='''
Matthew proceeds thus: "Then were there brought unto Him little children, that He should put His hands on them, and pray; and the disciples rebuked them;" and so on, down to where we read, "For many are called, but few are chosen." Mark has followed the same order here as Matthew. But Matthew is the only one who introduces the section relating to the labourers who were hired for the vineyard. Luke, on the other hand, first mentions what He said to those who were asking each other who should be the greatest, and next subjoins at once the passage concerning the man whom they had seen casting out devils, although he did not follow Him; then he parts company with the other two at the point where he tells us how He stedfastly set His face to go to Jerusalem; and after the interposition of a number of subjects, he joins them again in giving the story of the rich man, to whom the word is addressed, "Sell all that thou hast," which individual's case is related here by the other two evangelists, but still in the succession which is followed by all the narratives alike. For in the passage referred to in Luke, that writer does not fail to bring in the story of the little children, just as the other two do immediately before the mention of the rich man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 63"
