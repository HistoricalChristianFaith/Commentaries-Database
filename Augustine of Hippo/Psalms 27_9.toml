[[commentary]]
quote='''
“Turn not away Thy face from me” (ver. 9): that I may find what I seek. “Turn not aside in anger from Thy servant:” lest, while seeking Thee, I fall in with somewhat else. For what is more grievous than this punishment to one who loveth and seeketh the truth of Thy countenance? “Be Thou my Helper.” How shall I find it, if Thou help me not? “Leave me not, neither despise me, O God my Saviour.” Scorn not that a mortal dares to seek the Eternal; for Thou, God, dost heal the wound of my sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252027.html'
source_title="Exposition on Psalm 27"
