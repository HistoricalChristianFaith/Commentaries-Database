[[commentary]]
quote='''
(Tr. xlv. 10. ct seq.) But here is a difficulty. Sometimes they who are not sheep hear Christ's voice; for Judas heard, who was a wolf. And sometimes the sheep hear Him not; for they who crucified Christ heard not; yet some of them were His sheep. You will say, While they did not hear, they were not sheep; the voice, when they heard it, changed them from wolves to sheep. Still I am disturbed by the Lord's rebuke to the shepherds in Ezekiel, Neither have ye brought again that which strayed. (Ezek. 34:4) He calls it a stray sheep, but yet a sheep all the while; though, if it strayed, it could not have heard the voice of the Shepherd, but the voice of a stranger. What I say then is this; The Lord knoweth them that are His. (2 Tim. 2:19) He knoweth the foreknown, he knoweth the predestinated. They are the sheep: for a time they know not themselves, but the Shepherd knows them; for many sheep are without the fold, many wolves within. He speaks then of the predestinated. And now the difficulty is solved. The sheep do hear the Shepherd's voice, and they only. When is that? It is when that voice saith, He that endureth to the end shall be saved. (Mat. 10:32) This speech His own hear, the alien hear not.

(ut sup.) Our Lord feedeth by plain words, exerciseth by obscure. For when two persons, one godly, the other ungodly, hear the words of the Gospel, and they happen to be such that neither can understand them; one says, What He saith is true and good, but we do not understand it: the other says, It is not worth attending to. The former, in faith, knocks, yea, and, if he continue to knock, it shall be opened unto him. The latter shall hear the words in Isaiah, If ye will not believe, surely ye shall not be established. (Isa. 7:9)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"This parable spake Jesus unto them; but they understood not what He spake unto them." Nor we also, perhaps. What, then, is the difference between them and us, before even we can understand these words? This, that we on our part knock, that it may be opened unto us; while they, by disowning Christ, refused to enter for salvation, and preferred remaining outside to be destroyed. In as far, then, as we listen to these words with a pious mind, in as far as, before we understand them, we believe them to be true and divine, we stand at a great distance from these men. For when two persons are listening to the words of the gospel, the one impious, the other pious, and some of these are such as neither perhaps understands, the one says, It has said nothing; the other says, It has said the truth, and what it has said is good, but we do not understand it. This latter, because he believes, now knocks, that he may be worthy to have it opened up to him, if he continue knocking; but the other still hears the words, "If ye believe not, ye shall not understand." Why do I draw your attention to this? Even for this reason, that when I have explained as I can these obscure words, or, because of their great abstruseness, I have either myself failed to arrive at an understanding of them, or wanted the faculty of explaining what I do understand, or every one has been so dull as not to follow me, even when I give the explanation, yet should he not despair of himself; but continue in faith, walk on in the way, and hear the apostle saying, "And if in anything ye be otherwise minded, God shall reveal even this unto you. Nevertheless whereto we have already attained, let us walk therein."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
