[[commentary]]
quote='''
“For the Word of the Lord is right:” for the Word of the Lord is right, to make you that which of yourselves ye cannot be. “And all His works are done in faith” (ver. 4): lest any think that by the merit of works he hath arrived at faith, when in faith are done all the works which God Himself loveth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
