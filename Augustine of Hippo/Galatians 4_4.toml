[[commentary]]
quote='''
But He was awaiting the time in which He should die, for He awaited also the time in which He should be born. The apostle, speaking of this time, says, "But when the fullness of time came, God sent His Son." For this cause many say, Why did not Christ come before? To whom we must make answer, Because the fullness of time had not yet come, while He by whom the times were made sets their bounds; for He knew when He ought to come. In the first place, it was necessary that He should be foretold through a long series of times and years; for it was not something insignificant that was to come: He who was to be ever held, had to be for a long time foretold. The greater the judge that was coming, the longer the train of heralds that preceded him. In short, when the fullness of time came, He also came who was to deliver us from time. For being delivered from time, we shall come to that eternity where there is no time: there it is not said, When shall the hour come, for the day is everlasting, a day which is neither preceded by a yesterday, nor cut off by a morrow. But in this world days roll on, some are passing away, others come; none abides; and the moments in which we are speaking drive out one another in turn, nor stands the first syllable for the second to sound. Since we began to speak we are somewhat older, and without doubt I am just now older than I was in the morning; thus, nothing stands, nothing remains fixed in time. Therefore ought we to love Him by whom the times were made, that we may be delivered from time and be fixed in eternity, where there is no more changeableness of times. Great, therefore, is the mercy of our Lord Jesus Christ, in that for our sakes He was made in time, by whom the times were made; that He was made among all things, by whom all things were made; that He became what He made. For He was made what He had made; for He was made man who had made man, lest what He had made should perish. According to this dispensation, the hour of His birth had now come, and He was born; but not yet had come the hour of His suffering, therefore not yet had He suffered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252031.html'
source_title="Tractates on John 31"

[[commentary]]
quote='''
But when? “When full days shall be found in them.” What is “full days”? “But when there came the fulness of time, God sent His Son.” This is the very fulness of time, when He came to teach men that things temporal should be despised, that they should not esteem as a great matter whatever object evil men covet, that they should suffer whatever evil men fear. He became the way, He recalled us to inward thought, admonished us of what should be sought of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252073.html'
source_title="Exposition on Psalm 73"
