[[commentary]]
quote='''
Again, if any one affirms his ability to prove it not to have been the third hour when the Jews cried out in the terms in question, because, after Mark's statement to this effect, "And Pilate answered, and said again unto them, What will ye then that I shall do unto him whom ye call the King of the Jews? And they cried out again, Crucify him," we find no further details introduced into the narrative of the same evangelist, but are led on at once to the statement, that the Lord was delivered up by Pilate to be crucified—an act which John mentions to have taken place about the sixth hour;—I repeat, if any one adduces such an argument, let him understand that many things have been passed by without record here, which occurred in the interval when Pilate was engaged in looking out for some means by which he could rescue Jesus from the Jews, and was exerting himself most strenuously by every means in his power to withstand their maddened desires. For Matthew says, "Pilate saith unto them, What shall I do, then, with Jesus, which is called Christ? They all say, Let him be crucified." Then we affirm it to have been the third hour. And when the same Matthew goes on to add the sentence, "But when Pilate saw that he could prevail nothing, but that rather a tumult was made," we understand that a period of two hours had passed, during the attempts made by Pilate to effect the release of Jesus, and the tumults raised by the Jews in their efforts to defeat him, and that the sixth hour had then commenced, previous to the close of which those things took place which are related as happening between the time when Pilate delivered up the Lord and the oncoming of the darkness. Once more, as regards what Matthew records above,—namely, "And when he was set down on the judgment-seat, his wife sent unto him, saying, Have thou nothing to do with that just man; for I have suffered many things this day in a dream because of him,"—we remark, that Pilate really took his seat upon the tribunal at a later point, but that, among the earlier incidents which Matthew was recounting, the account given of Pilate's wife came into his mind, and he decided on inserting it in this particular connection, with the view of preparing us for understanding how Pilate had an especially urgent reason for wishing, even on to the last, not to deliver Him up to the Jews.

Luke, again, after mentioning how Pilate said, "I will therefore chastise him and let him go," tells us that the whole multitude then cried out, "Away with this man, and release unto us Barabbas." But perhaps they had not yet exclaimed, "Crucify him!" For Luke next proceeds thus: "Pilate therefore, willing to release Jesus, spake again to them. But they cried, saying, Crucify him, crucify him!" This is understood to have been at the third hour. Luke then continues in these terms: "And he said unto them the third time, Why, what evil hath he done? I have found no cause of death in him: I will therefore chastise him and let him go. And they were instant with loud voices requiring that He might be crucified. And the voices of them prevailed." Here, then, this evangelist also makes it quite evident that there was a great tumult. With sufficient accuracy for the purposes of my inquiry into the truth, we can further gather how long the interval was after which he spoke to them in these terms, "Why, what evil hath he done?" And when he adds thereafter, "They were instant with loud voices, requiring that He might be crucified, and the voices of them prevailed," who can fail to perceive that this clamour was made just because they saw that Pilate was unwilling to deliver the Lord up to them? And, inasmuch as he was exceedingly reluctant to give Him up, he did not certainly yield at present in a moment, but in reality two hours and something more were passed by him in that state of hesitancy.

Interrogate John in like manner, and see how strong this hesitancy was on Pilate's part, and how he shrank from so shameful a service. For this evangelist records these incidents much more fully, although even he certainly does not mention all the occurrences which took up these two hours and part of the sixth hour. After telling us how Pilate scourged Jesus, and allowed the robe to be put on Him in derision by the soldiers, and suffered Him to be subjected to ill-treatment and many acts of mockery (all of which was permitted by Pilate, as I believe, really with the view of mitigating their fury and keeping them from persevering in their maddened desire for His death), John continues his account in the following manner: "Pilate went forth again, and saith unto them, Behold, I bring him forth to you, that ye may know that I find no fault in him. Then came Jesus forth, wearing the crown of thorns, and the purple robe. And Pilate saith unto them, Behold the man!" The object of this was, that they might gaze upon that spectacle of ignominy and be appeased. But the evangelist proceeds again: "When the chief priests therefore and officers saw Him, they cried out, saying, Crucify him, crucify him!" It was then the third hour, as we maintain. Mark also what follows: "Pilate saith unto them, Take ye him, and crucify him; for I find no fault in him. The Jews answered him, We have a law, and by our law he ought to die, because he made himself the Son of God. When Pilate therefore heard that saying, he was the more afraid; and went again into the judgment-hall, and saith unto Jesus, Whence art thou? But Jesus gave him no answer. Then saith Pilate unto Him, Speakest thou not unto me? knowest thou not that I have power to crucify thee, and have power to release thee? Jesus answered, Thou couldest have no power at all against me, except it were given thee from above: therefore he that delivered me unto thee hath the greater sin. From thenceforth Pilate sought to release Him." Now, when it is said here that "Pilate sought to release Him," how long a space of time may we suppose to have been spent in that effort, and how many things may have been omitted here among the sayings which were uttered by Pilate, or the contradictions which were raised by the Jews, until these Jews gave expression to the words which moved him, and made him yield? For the writer goes on thus: "But the Jews cried out, saying, If thou let this man go, thou art not Cæsar's friend: whosoever maketh himself a king speaketh against Cæsar. When Pilate therefore heard that saying, he brought Jesus forth, and sat down in the judgment-seat, in a place that is called the Pavement, but in the Hebrew, Gabbatha. And it was the preparation of the passover, about the sixth hour." Thus, then, between that exclamation of the Jews when they first cried out, "Crucify him," at which period it was the third hour, and this moment when he sat down on the judgment-seat, two hours had passed, which had been taken up with Pilate's attempts to delay matters and the tumults raised by the Jews; and by this time the fifth hour was quite spent, and so much of the sixth hour had been entered. Then the narrative goes on thus: "He saith unto the Jews, Behold your King! But they cried out, Away with him, away with him! crucify him!" But not even now was Pilate so overcome by the apprehension of their bringing a charge against himself as to be very ready to yield. For his wife had sent to him when he was sitting at this time upon the judgment-seat,—an incident which Matthew, who is the only one that records it, has given by anticipation, introducing it before he comes to its proper place (according to the order of time) in his narrative, and bringing it in at another point which he judged opportune. In this way, Pilate, still continuing his efforts to prevent further advances, said then to them, "Shall I crucify your king?" Thereupon "the chief priests answered, We have no king but Cæsar. Then delivered he Him therefore unto them to be crucified." And in the time that passed when He was on the way, and when He was crucified along with the two robbers, and when His garments were parted and the possession of His coat was decided by lot, and the various deeds of contumely were done to Him (for, while these different things were going on, gibes were also cast at Him), the sixth hour was fully spent, and the darkness came on, which is mentioned by Matthew, Mark, and Luke.

Let such impious pertinacity therefore perish, and let it be believed that the Lord Jesus Christ was crucified at once at the third hour by the voice of the Jews, and at the sixth by the hands of the soldiers. For during these tumults on the part of the Jews, and these agitations on the side of Pilate, upwards of two hours elapsed from the time when they burst out with the cry, "Crucify Him." But again, even Mark, who studies brevity above all the other evangelists, has been pleased to give a concise indication of Pilate's desire and of his efforts to save the Lord's life. For, after giving us this statement, "And they cried again, Crucify him" (in which he gives us to understand that they had cried out before this, when they asked that Barabbas might be released to them), he has appended these words: "Then Pilate continued to say unto them, Why, what evil hath he done?" Thus by one short sentence he has given us an idea of matters which took a long time for their transaction. At the same time, however, keeping in view the correct apprehension of his meaning, he does not say, "Then Pilate said unto them," but expresses himself thus: "Then Pilate continued to say unto them, Why, what evil hath he done?" For, if his phrase had been "said," we might have understood him to mean that such words were uttered only once. But, by adopting the terms, "continued to say," he has made it clear enough to the intelligent that Pilate spoke repeatedly, and in a number of ways. Let us therefore consider how briefly Mark has expressed this as compared with Matthew, how briefly Matthew as compared with Luke, how briefly Luke as compared with John, while at the same time each of these writers has introduced now one thing and now another peculiar to himself. In fine, let us also consider how brief is even the narrative given by John himself, as compared with the number of things which took place, and the space of time occupied by their occurrence. And let us give up the madness of opposition, and believe that two hours, and something more, may quite well have passed in the interval referred to.
'''
