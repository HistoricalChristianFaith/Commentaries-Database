[[commentary]]
quote='''
“Praise the Lord with harp:” praise the Lord, presenting unto Him your bodies a living sacrifice. “Sing unto Him with the psaltery of ten strings” (ver. 2): let your members be servants to the love of God, and of your neighbour, in which are kept both the three and the seven commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252033.html'
source_title="Exposition on Psalm 33"
