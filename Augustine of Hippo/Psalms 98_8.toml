[[commentary]]
quote='''
“Let the floods clap their hands together” (ver. 8). Let the sea be aroused, and the floods clap their hands together; persecutions arise, and the saints rejoice in God. Whence shall the floods clap their hands? What is to clap their hands? To rejoice in works. To clap hands, is to rejoice; hands, mean works. What floods? Those whom God hath made floods, by giving them that Water, the Holy Spirit. “If any man thirst,” saith He, “let him come unto Me, and drink. He that believeth on Me, out of his bosom shall flow rivers of living water.” These rivers clapped their hands, these rivers rejoiced in works, and blessed God. “The hills shall be joyful together.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252098.html'
source_title="Exposition on Psalm 98"
