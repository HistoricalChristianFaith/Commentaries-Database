[[commentary]]
quote='''
“He clothed himself with cursing, like as with a raiment:” either Judas, or that people. “And it came into his bowels like water.” Both without, then, and within; without, like a garment; within, like water: since he hath come before the judgment-seat of Him “who hath power to destroy both body and soul in hell;” the body without, the soul within. “And like oil into his bones.” He showeth that he worketh evil with delight, and storeth up cursing for himself, that is, everlasting punishment; for blessing is eternal life. For at present evil deeds are his delight, flowing like water into his bowels, like oil into his bones; but it is styled cursing, because God hath appointed torments for such men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520109.html'
source_title="Exposition on Psalm 109"
