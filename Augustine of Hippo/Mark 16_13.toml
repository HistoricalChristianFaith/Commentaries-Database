[[commentary]]
quote='''
Besides, it is necessary to believe that these were the same persons to whom Mark also refers. For he informs us, that they went and told these things to the rest: just as Luke states, that the persons in question rose up the same hour and returned to Jerusalem, and found the eleven gathered together, and them that were with them, saying, "The Lord is risen indeed, and hath appeared to Simon." And then he adds that these two also told what things were done on the way, and how He was known of them in breaking of bread. By this time, therefore, a report of the resurrection of Jesus had been conveyed by those women, and also by Simon Peter, to whom He had already shown Himself. For these two disciples found those to whom they came in Jerusalem talking of that very subject. Consequently, it may be the case that fear made them decline mentioning formerly, when they were on the way, that they had heard that He had risen again, so that they confined themselves to stating how the angels had been seen by the women. For, not knowing with whom they were conversing, they might reasonably be anxious not to let any word drop from them on the subject of Christ's resurrection, lest they should fall into the hands of the Jews. But again, we must remark that Mark states that "they went and told it unto the residue: neither believed they them:" whereas Luke tells us that these others were already saying that the Lord was risen indeed, and had appeared unto Simon. Is not the explanation, however, simply this, that there were some of them there who refused to credit what was related? Moreover, to whom can it fail to be clear that Mark has just omitted certain matters which are fully set forth in Luke's narrative,—that is to say, the subjects of the conversation which Jesus had with them before He recognised them, and the manner in which they came to know Him in the breaking of the bread? For, after recording how He appeared to them in another form, as they went towards a country-seat, Mark has immediately appended the sentence, "And they went and told it unto the residue: neither believed they them;" as if men could tell of a person whom they had not recognised, or as if those to whom He had appeared only in another form could know Him! Without doubt, therefore, Mark has simply given us no explanation of the way in which they came to know Him, so as to be able to report the same to others. And this, then, is a thing which deserves to be imprinted on our memory, in order that we may accustom ourselves to keep in view the habit which these evangelists have of passing over those matters which they do not put on record, and of connecting the facts which they do relate in such a manner that, among those who fail to give due consideration to the usage referred to, nothing proves itself a more fruitful source of misapprehension than this, leading them to imagine the existence of discrepancies in the sacred writers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 25"
