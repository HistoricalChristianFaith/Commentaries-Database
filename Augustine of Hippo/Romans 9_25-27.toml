[[commentary]]
quote='''
When he says: But Isaiah cries out for Israel: If the number of the children of Israel be as the sand of the sea, a remnant shall be saved, he shows how God is the cornerstone, joining both walls in himself. For the testimony of the prophet Hosea was spoken for the Gentiles: I will call that which was not my people, my people, and her that was not beloved, beloved; and the testimony of Isaiah was spoken for Israel, that a remnant shall be saved, so that those may be counted in the seed of Abraham who have believed in Christ. Thus he makes both peoples in concord, according also to the testimony of the Lord, who says in the Gospel concerning the Gentiles: I have other sheep, which are not of this fold, whom I must bring, and there shall be one flock and one shepherd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
