[[commentary]]
quote='''
“For the Lord hath chosen Sion to be an habitation for Himself” (ver. 13). Sion is the Church Herself; She is also that Jerusalem unto whose peace we are running, who is in pilgrimage not in the Angels, but in us, who in her better part waiteth for the part that will return; whence letters have come unto us, which are every day read. This city is that very Sion, whom the Lord hath chosen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520132.html'
source_title="Exposition on Psalm 132"
