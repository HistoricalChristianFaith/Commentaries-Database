[[commentary]]
quote='''
"Therefore, brethren" (that I may warn you with better effect in the words of the apostle himself), "we are debtors not to the flesh, to live after the flesh; for if ye live after the flesh ye shall die; but if ye through the Spirit do mortify the deeds of the body, ye shall live." I have said this to deter your free will from evil, and to exhort it to good by apostolic words; but yet you must not therefore glory in man,—that is to say, in your own selves,—and not in the Lord, when you live not after the flesh, but through the Spirit mortify the deeds of the flesh. For in order that they to whom the apostle addressed this language might not exalt themselves, thinking that they were themselves able of their own spirit to do such good works as these, and not by the Spirit of God, after saying to them, "If ye through the Spirit do mortify the deeds of the flesh, ye shall live," he at once added, "For as many as are led by the Spirit of God, they are the sons of God." When, therefore, you by the Spirit mortify the deeds of the flesh, that you may have life, glorify Him, praise Him, give thanks to Him by whose Spirit you are so led as to be able to do such things as show you to be the children of God; "for as many as are led by the Spirit of God, they are the sons of God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 23"
