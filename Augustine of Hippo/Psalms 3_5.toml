[[commentary]]
quote='''
The prophetic psalms are by no means silent on the subject of [Christ's] resurrection.… What other meaning can be taken from these words in Psalm 3, sung in the person of Christ?… For, unless one sees in this sleep the death, and in this awaking the resurrection of Christ thus prophesied, one is reduced to the silly supposition that the prophet wished to communicate to us the really remarkable news that he himself fell asleep and later on woke up!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252017.html'
source_title="City of God 17.18"


[[commentary]]
quote='''
Do not let these words, where he says, "since the Lord took me up," strike your minds as meaning that Christ himself did not raise up his own body. The Father raised him up, and he also raised himself up. How shall we prove to you that he raised himself up? Call to mind what he said to the Jews: "Pull down this temple, and in three days I will raise it up."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520305.html'
source_title="SERMON 305:3"

[[commentary]]
quote='''
Let not the Jews boast, as if they had prevailed; He Himself laid down His life. "I laid me down [to sleep]," He says [elsewhere]. You know the psalm: "I laid me down and slept; and I awaked [rose up], for the Lord sustaineth me." What of that-"I lay down"? Because it was my pleasure, I did so. What does "I lay down" mean? I died. Was it not a lying down to sleep on His part, who, when He pleased, rose from the tomb as He would from a bed? But He loves to give glory to the Father, that He may stir us up to glorify our Creator. For in adding, "I arose, for the Lord sustaineth me;" think you there was here a kind of failing in His power, so that, while He had it in His own power to die, He had it not in His power to rise again? So, indeed, the words seem to imply when not more closely considered. "I lay down to sleep;" that is, I did so, because I pleased. "And I arose:" why? "Because the Lord sustaineth [will sustain] me." What then wouldst Thou not have power to rise of Thyself? If Thou hadst not the power, Thou wouldst not have said, "I have power to lay down my life, and I have power to take it again."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"
