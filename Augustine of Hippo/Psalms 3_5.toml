[[commentary]]
quote='''
The prophetic psalms are by no means silent on the subject of [Christ's] resurrection.… What other meaning can be taken from these words in Psalm 3, sung in the person of Christ?… For, unless one sees in this sleep the death, and in this awaking the resurrection of Christ thus prophesied, one is reduced to the silly supposition that the prophet wished to communicate to us the really remarkable news that he himself fell asleep and later on woke up!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520City%2520of%2520God%2FBook%252017.html'
source_title="City of God 17.18"


[[commentary]]
quote='''
Do not let these words, where he says, "since the Lord took me up," strike your minds as meaning that Christ himself did not raise up his own body. The Father raised him up, and he also raised himself up. How shall we prove to you that he raised himself up? Call to mind what he said to the Jews: "Pull down this temple, and in three days I will raise it up."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520305.html'
source_title="SERMON 305:3"

[[commentary]]
quote='''
Let not the Jews boast, as if they had prevailed; He Himself laid down His life. "I laid me down [to sleep]," He says [elsewhere]. You know the psalm: "I laid me down and slept; and I awaked [rose up], for the Lord sustaineth me." What of that-"I lay down"? Because it was my pleasure, I did so. What does "I lay down" mean? I died. Was it not a lying down to sleep on His part, who, when He pleased, rose from the tomb as He would from a bed? But He loves to give glory to the Father, that He may stir us up to glorify our Creator. For in adding, "I arose, for the Lord sustaineth me;" think you there was here a kind of failing in His power, so that, while He had it in His own power to die, He had it not in His power to rise again? So, indeed, the words seem to imply when not more closely considered. "I lay down to sleep;" that is, I did so, because I pleased. "And I arose:" why? "Because the Lord sustaineth [will sustain] me." What then wouldst Thou not have power to rise of Thyself? If Thou hadst not the power, Thou wouldst not have said, "I have power to lay down my life, and I have power to take it again."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252047.html'
source_title="Tractates on John 47"

[[commentary]]
quote='''
“I slept, and took rest” (ver. 5). It may be not unsuitably remarked, that it is expressly said, “I,” to signify that of His own Will He underwent death, according to that, “Therefore doth My Father love Me, because I lay down My life, that I might take it again. No man taketh it from Me; I have power to lay it down, and I have power to take it again.” Therefore, saith He, you have not taken Me as though against My will, and slain Me; but “I slept, and took rest; and rose, for the Lord will take me up.” Scripture contains numberless instances of sleep being put for death; as the Apostle says, “I would not have you to be ignorant, brethren, concerning them which are asleep.” Nor need we make any question why it is added, “took rest,” seeing that it has already been said, “I slept.” Repetitions of this kind are usual in Scripture, as we have pointed out many in the second Psalm. But some copies have, “I slept, and was cast into a deep sleep.” And different copies express it differently, according to the possible renderings of the Greek words, ἐγὼ δὲ ἐκοιμήθην καὶ ὕπνωσα. Unless perhaps sleeping may be taken of one dying, but sleep of one dead: so that sleeping may be the transition into sleep, as awakening is the transition into wakefulness. Let us not deem these repetitions in the sacred writings empty ornaments of speech. “I slept, and took rest,” is therefore well understood as “I gave Myself up to My Passion, and death ensued.” “And I rose, for the Lord will take Me up.” This is the more to be remarked, how that in one sentence the Psalmist has used a verb of past and future time. For he has said, both “I rose,” which is the past, and “will take Me up,” which is the future; seeing that assuredly the rising again could not be without that taking up. But in prophecy the future is well joined to the past, whereby both are signified. Since things which are prophesied of as yet to come in reference to time are future; but in reference to the knowledge of those who prophesy they are already to be viewed as done. Verbs of the present tense are also mixed in, which shall be treated of in their proper place when they occur.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"

[[commentary]]
quote='''
When ye exulted that ye had slain Him, He slept; for He saith in another Psalm, “I slept.” They raged and would slay Me; “I slept.” If I had not willed, I had not even slept. “I slept,” because “I have power to lay down My life, and I have power to take it again.” “I laid Me down and slept, and rose up again.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"

[[commentary]]
quote='''
The king who fears no man, is not a fox: like that Lion of Judah, of whom it is said, “Stooping down Thou didst rise up, and didst sleep as a lion.” At Thy will Thou didst stoop down, at Thy will didst rise; because Thou wouldest, Thou didst sleep. And thus in another Psalm he says, “I slept.” Was not the sentence complete, “I slept, and took rest, and rose up again, because the Lord shall uphold Me”? Why is the word ego added? and thus with a strong emphasis on the word I, they raged against Me, they troubled Me: but had I not willed, I had not slept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"

[[commentary]]
quote='''
Thou hadst then slept amid the ruins, and hadst said, “I laid me down, and slept.” What meaneth, “I slept”? Because I chose, I slept: I slept for love of night: but, “I rose again,” followeth. Therefore “I watched,” is here said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520102.html'
source_title="Exposition on Psalm 102"
