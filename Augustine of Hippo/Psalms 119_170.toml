[[commentary]]
quote='''
“Let my request come before Thy presence, O Lord: deliver me, according to Thy word” (ver. 170). He repeateth what he hath asked. For his former words, “Let my prayer come near in Thy presence, O Lord:” are like unto what he saith, “Let my request come before Thy presence, O Lord:” and the words, “Give me understanding according to Thy word,” agree with these, “Deliver me according to Thy word.” For by receiving understanding he is delivered, who of himself through want of understanding is deceived.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
