[[commentary]]
quote='''
But there is also a false glory, when the praise given is the result of a mistake, whether in regard to things or to persons, or to both. For men are mistaken in regard to things, when they think that to be good which is evil; and in regard to persons, when they think one to be good who is evil; and in regard to both, when what is actually a vice is esteemed a virtue; and when he who is praised for something is destitute of what he is supposed to have, whether he be good or evil. To credit vain-glorious persons with the things they profess, is surely a huge vice, and not a virtue; and yet you know how common is the laudatory fame of such; for, as Scripture says, "The sinner is praised in the desires of his soul, and he who practises iniquity is blessed." Here those who praise are not mistaken in the persons, but in the things; for that is evil which they believe to be good. But those who are morally corrupted with the evil of prodigality are undoubtedly such as those who praise them do not simply suspect, but perceive them to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520100.html'
source_title="Tractates on John 100"
