[[commentary]]
quote='''
(Tr. xlv. c. 15) What is this, shall go in and out? To enter into the Church by Christ the Door, is a very good thing, but to go out of the Church is not. Going in must refer to inward cogitation; going out to outward action; as in the Psalm, Man goeth forth to his work. (Ps. 103:23)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hence it is that He saith, "I am the door: by me if any man enter in, he shall be saved, and shall go in and out, and find pasture." In this He clearly shows that not only the Shepherd, but the sheep also enter in by the door.

But what is this, "He shall go in and out, and find pasture"? To enter indeed into the Church by Christ the door, is eminently good; but to go out of the Church, as this same John the evangelist saith in his epistle, "They went out from us, but they were not of us," is certainly otherwise than good. Such a going out could not then be commended by the good Shepherd, when He said, "And he shall go in and out, and find pasture." There is therefore not only some sort of entrance, but some outgoing also that is good, by the good door, which is Christ. But what is that praiseworthy and blessed outgoing? I might say, indeed, that we enter when we engage in some inward exercise of thought; and go out, when we take to some active work without: and since, as the apostle saith, Christ dwelleth in our hearts by faith, to enter by Christ is to give ourselves to thought in accordance with that faith; but to go out by Christ is, in accordance also with that same faith, to take to outside works, that is to say, in the presence of others. Hence, also, we read in a psalm, "Man goeth forth to his work;" and the Lord Himself saith, "Let your works shine before men."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252045.html'
source_title="Tractates on John 45"
