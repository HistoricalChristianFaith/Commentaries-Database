[[commentary]]
quote='''
But lest they should suppose that eternal life was promised in this meat and drink in such manner that they who should take it should not even now die in the body, He condescended to meet this thought; for when He had said, "He that eateth my flesh, and drinketh my blood, hath eternal life," He forthwith subjoined, "and I will raise him up on the last day." That meanwhile, according to the Spirit, he may have eternal life in that rest into which the spirits of the saints are received; but as to the body, he shall not be defrauded of its eternal life, but, on the contrary, he shall have it in the resurrection of the dead at the last day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252026.html'
source_title="Tractates on John 26"
