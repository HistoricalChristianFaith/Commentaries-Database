[[commentary]]
quote='''
“Thou hast enlarged my steps under me” (ver. 36). Nor shall the straits of the flesh hinder me; for Thou hast enlarged my love, working in gladness even with these mortal things and members which are under me. “And my footsteps have not been weakened.” And either my goings, or the marks which I have imprinted for the imitation of those that follow, have not been weakened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
