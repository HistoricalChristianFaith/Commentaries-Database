[[commentary]]
quote='''
“Every soul that is blessed is simple,” not cleaving to things earthly nor with glued wings grovelling, but beaming with the brightness of virtues, on the twin wings of twin love doth spring into the free air; and seeth how from her is withdrawn that whereon she was treading, not that whereon she was resting, and she saith securely, “The Lord hath given, the Lord hath taken away; as it hath pleased the Lord, so hath been done: be the name of the Lord blessed.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252067.html'
source_title="Exposition on Psalm 67"
