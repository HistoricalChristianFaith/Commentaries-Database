[[commentary]]
quote='''
(Tr. xliv. s. 8) Lo, he is become a proclaimer of grace, an evangelist, and testifies to the Jews. That blind man testified, and the ungodly were vexed at the heart, because they had not in their heart what appeared upon his countenance. Then said they unto him, Where is He?

(Tr. xliv. 8) Here he is like one anointed, but unable yet to see: he preaches, and knows not what he preaches.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"They said to him, Where is he who hath opened thine eyes? He said, I know not." In these words the man's own soul was like that of one only as yet anointed, but not yet seeing. Let us so put it, brethren, as if he had that anointing in his soul. He preaches, and knows not the Being whom he preaches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252044.html'
source_title="Tractates on John 44"
