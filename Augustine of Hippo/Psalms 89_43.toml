
[[commentary]]
quote='''
“Thou hast turned away the help of his sword.” How they were used to fight few in number, and to strike down many. “Thou hast turned away the help of his sword, and Thou givest him not victory in the battle” (ver. 43). Naturally then is he conquered, naturally taken prisoner, naturally made an outcast from his kingdom, naturally scattered abroad: for he lost that land, for which he slew the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
