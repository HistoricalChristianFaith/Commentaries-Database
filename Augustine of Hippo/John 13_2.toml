[[commentary]]
quote='''
(Tr. lv. 2) And supper having been made, i. e. having been got ready, and laid on the table before them; not having been consumed and finished: for it was during supper that He rose, and washed His disciples' feet; as after this He sat at table again, and gave the sop to the traitor. What follows: The devil having now put it into the heart of Judas Iscariot, Simon's son, to betray Him, refers to a secret suggestion, not made to the ear, but to the mind; the suggestions of the devil being part of our own thoughts. Judas then had already conceived, through diabolical instigation, the intention of betraying his Master.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
"And the supper," he says, "having taken place, and the devil having now put into the heart of Judas Iscariot, Simon's son, to betray Him, [Jesus] knowing that the Father had given all things into His hands, and that He has come from God, and is going to God; He riseth from supper, and layeth aside His garments; and took a towel, and girded Himself. After that He poureth water into a basin, and began to wash the disciples' feet, and to wipe them with the towel wherewith He was girded." We are not to understand by the supper having taken place, as if it were already finished and over; for it was still going on when the Lord rose and washed His disciples' feet. For He afterwards sat down again, and gave the morsel [sop] to His betrayer, implying certainly that the supper was not yet over, or, in other words, that there was still bread on the table. Therefore, by supper having taken place, is meant that it was now ready, and laid out on the table for the use of the guests.

But when he says, "The devil having now put into the heart of Judas Iscariot, Simon's son, to betray Him;" if one inquires, what was put into Judas' heart, it was doubtless this, "to betray Him." Such a putting [into the heart] is a spiritual suggestion: and entereth not by the ear, but through the thoughts; and thereby not in a way that is corporal, but spiritual. For what we call spiritual is not always to be understood in a commendatory way. The apostle knew of certain spiritual things [powers], of wickedness in heavenly places, against which he testifies that we have to maintain a struggle; and there would not be spiritual wickednesses, were there not also wicked spirits. For it is from a spiritual being that spiritual things get their name. But how such things are done, as that devilish suggestions should be introduced, and so mingle with human thoughts that a man accounts them his own, how can he know? Nor can we doubt that good suggestions are likewise made by a good spirit in the same unobservable and spiritual way; but it is matter of concern to which of these the human mind yields assent, either as deservedly left without, or graciously aided by, the divine assistance. The determination, therefore, had now been come to in Judas' heart by the instigation of the devil, that the disciple should betray the Master, whom he had not learned to know as his God. In such a state had he now come to their social meal, a spy on the Shepherd, a plotter against the Redeemer, a seller of the Saviour; as such was he now come, was he now seen and endured, and thought himself undiscovered: for he was deceived about Him whom he wished to deceive. But He, who had already scanned the inward state of that very heart, was knowingly making use of one who knew it not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252055.html'
source_title="Tractates on John 55"

[[commentary]]
quote='''
Here we must take care not to let John underlie the appearance not only of standing in antagonism to Luke, who had stated before this, that Satan entered into the heart of Judas at the time when he made his bargain with the Jews to betray Him on receipt of a sum of money, but also of contradicting himself. For, at an earlier point, and previous to [his notice of] the receiving of this sop, he had made use of these terms: "And supper being ended, the devil having now put into the heart of Judas to betray Him." And how does he enter into the heart, but by putting unrighteous persuasions into the thoughts of unrighteous men? The explanation, however, is this. We ought to suppose Judas to have been more fully taken possession of by the devil now, just as on the other hand, in the instance of the good, those who had already received the Holy Spirit on that occasion, subsequently to His resurrection, when He breathed upon them and said, "Receive ye the Holy Ghost," also obtained a fuller gift of that Spirit at a later time, namely, when He was sent down from above on the day of Pentecost. In like manner, Satan then entered into this man after the sop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 1"
