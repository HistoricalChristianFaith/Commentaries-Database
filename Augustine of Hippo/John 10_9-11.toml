[[commentary]]
quote='''
Is Christ a door, in the same sense as the doors we see made by carpenters? Surely not; and yet He said, “I am the door.” Or a shepherd, in the same capacity as those who guard sheep? though He said, “I am the Shepherd.” Both these names occur in the same passage: in the Gospel, He said, that the shepherd enters by the door: the words are, “I am the good Shepherd;” and in the same passage, “I am the door:” and who is the shepherd who enters by the door? “I am the good Shepherd:” and what is the door by which Thou, Good Shepherd, enterest? How then art Thou all things? In the sense in which everything is through Me. To explain: when Paul enters by the door, does not Christ? Wherefore? Not because Paul is Christ: but since Christ is in Paul: and Paul acts through Christ. The Apostle says, “Do ye seek a proof of Christ speaking in me?” When His saints and faithful disciples enter by the door, does not Christ enter by the door? How are we to prove this? Since Saul, not yet called Paul, was persecuting those very saints, when He called to him from Heaven, “Saul, Saul, why persecutest thou Me?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
