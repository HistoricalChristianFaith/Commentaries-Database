[[commentary]]
quote='''
Indeed, Jesus himself shone as the sun, indicating that he is the light which illuminates every one who comes into this world. And this is the sun to the eyes of the flesh, that is the sun to the eyes of the heart. His garments are a type of his church. For garments, unless held up by the one having donned them, fall. Paul was like the lowest hem of these garments. For he himself says, "For I am the least of the apostles," 14 and in another passage, "I am the last of the apostles." On a garment, the hem is the last thing and the least. Just as that woman who touched the Lord's hem was made well, so the church which came out of the Gentiles was saved by means of Paul's preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252078.html'
source_title="SERMON 78.2"

[[commentary]]
quote='''
Rightly did the “raiment” of Christ “shine” on the mountain, “like snow.” The raiment of Christ did shine like snow, as though of that snow a garment had already been made: of which wool, that is, of the snow which He gave like wool, they being as yet predestined, were sluggish: but wait, see what followeth. Since He gave them as wool, a garment is made of them. For as the Church is called the Body of Christ, so is the Church also called the garment of Christ: hence cometh that which is said by the Apostle, “that He might present it to Himself a glorious Church, not having spot or wrinkle.” Let Him then present unto Himself a glorious Church, not having spot or wrinkle; let Him make Himself a garment of that wool, which He had predestinated in the snow. While men are yet unbelieving, and cold, and sluggish, let Him make a garment of this wool. That it may be washed from spots, let it be cleansed by faith: that it may have no wrinkle, let it be stretched out upon the cross.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520147.html'
source_title="Exposition on Psalm 147"
