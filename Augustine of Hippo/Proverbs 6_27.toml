[[commentary]]
quote='''
I have said that through their lusts this thing to them is done. Evil lust is like a burning and a fire. Doth fire consume a garment, and doth not the lust of adultery consume the soul? Of meditated adultery when the Scripture was speaking it saith, “Shall one bind fire in his bosom, and his garments shall he not burn up?” Thou bearest in thy bosom live coals; burned through is thy vest; thou bearest in thought adultery, and whole then is thy soul?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252058.html'
source_title="Exposition on Psalm 58"
