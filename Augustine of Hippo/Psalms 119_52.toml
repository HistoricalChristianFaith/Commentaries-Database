[[commentary]]
quote='''
“For I was mindful of Thy judgments from the beginning of the world, O Lord, and received comfort” (ver. 52); or, as other copies have it, “and I was exhorted,” that is, I received exhortation. For either might be rendered for the Greek παρεκλήθην. “From the beginning of the world,” that is, from the birth of the human race, “I was mindful of Thy judgments” upon the vessels of wrath, which are fitted unto perdition: “and I received comfort,” since through these also hast Thou shown the riches of Thy glory on the vessels of Thy mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
