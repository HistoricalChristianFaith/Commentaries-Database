[[commentary]]
quote='''
"If they were capable of sufficient knowledge to account for the universe, how is it that they did not more easily find its Lord?" They are blamed for having spent their time, their activity and their discussions scrutinizing, and in a certain way measuring, what is created. They investigated the movement of the planets, the distance between the stars, the course of the heavenly bodies. Through these studies, they arrived at such a scientific knowledge as to be able to predict eclipses of the sun and the moon, which then occurred on the day and hour predicted, for the length of time and at the exact point in space they had said. What ability! What capacity! But when they were at the point of seeking to know the Creator—who was not far from them—they were unable to find him. If they had found him, they would have had him in themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252068.html'
source_title="SERMON 68:4"

[[commentary]]
quote='''
When he said: The wrath of God is revealed from heaven against all ungodliness, and so on, Solomon too says concerning the wise men of the world: For if they were able to know so much that they could estimate the world, how did they not more easily find the Lord and Creator of that very world? But those whom Solomon reproves did not come to know the Creator through the creature; whereas those whom the Apostle reproves did know him, but they did not give thanks, and while saying that they were wise they became fools and fell to worshiping idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
