[[commentary]]
quote='''
“The wicked have drawn out the sword, and have bent their bow, to cast down the poor and needy, and to slay such as be of upright heart” (ver. 14). “Their weapon shall enter into their own heart” (ver. 15). It is an easy thing for his weapon, that is, his sword, to reach thy body, even as the sword of the persecutors reached the body of the Martyrs, but when the body had been smitten, “the heart” remained unhurt; but his heart who “drew out the sword against” the body of the just did not clearly remain unhurt. This is attested by this very Psalm. It saith, Their weapon, that is, “Their sword shall,” not go into their body, but, “their weapon shall go into their own heart.” They would fain have slain him in the body. Let them die the death of the soul. For those whose bodies they sought to kill, the Lord hath freed from anxiety, saying, “Fear not them who kill the body, but cannot kill the soul.”…

“And their bows shall be broken.” What is meant by, “And their bows shall be broken”? Their plots shall be frustrated. For above He had said, “The wicked have drawn out the sword and bent their bows.” By the “drawing out of the sword” he would have understood open hostility; but by the “bending of the bow,” secret conspiracies. See! His sword destroys himself, and his laying of snares is frustrated. What is meant by frustrated? That it does no mischief to the righteous. How then, for instance (you ask), did it do no mischief to the man, whom it thus stripped of his goods, whom it reduced to straitened circumstances by taking away his possessions? He has still cause to sing, “A little that a righteous man hath, is better than great riches of the ungodly” (ver. 16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"
