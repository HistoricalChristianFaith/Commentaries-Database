[[commentary]]
quote='''
Singing to the Lord, we have asked Him to turn away His face from our sins, and to blot out all our crimes. But you can notice, Brothers, that in the same psalm we have heard: For I acknowledge my iniquity, and my sin is ever before me. However, it is said to God elsewhere: Do not turn away your face from me, to whom we have said: Turn your face away from my sins. While therefore man and sinner are one person, man says: Do not turn away your face from me, the sinner says: Turn your face away from my sins. This is thus said: Do not turn away your face from the one whom you have made, turn your face away from what I have done. Your eye, he says, distinguishes both, lest the nature perish because of the vice. You have made something, and I have made something. What you have made is called nature; what I have done is called vice. Let the vice be healed, so that nature may be preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252019.html'
source_title="Sermon 19"

[[commentary]]
quote='''
He says to God, "Turn away Thy face from my sins:" yet with what countenance says it, unless he adds, "For I acknowledge mine iniquity, and my sin is ever before me?" Be that before thyself which thou desirest not to be before God. But if thou wilt put thy sin behind thee, God will thrust it back before thine eyes; and this He will do at a time when there will be no more fruit of repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252012.html'
source_title="Tractates on John 12"

[[commentary]]
quote='''
Consider an instance in that penitential Psalm: “Hide Thy face from my sins.” Did he mean “from me”? No: for in another passage he says plainly, “Hide not Thy face from me.” “Turn” then “Thy face from my sins.” I would have Thee not see my sins. For God’s “seeing” is animadverting upon. Hence too a Judge is said to “animadvert” on that which he punishes; i.e. to turn his mind on it, to bend it thereon, even to the punishment of it, inasmuch as he is the Judge. So too is God a Judge. “Turn Thou Thy face from my sins.” But thou thyself, if thou wouldest have God turn “His face” from them, turn not thine own face from them. Observe how he proposes this to God in that very Psalm: “I acknowledge,” he says, “my transgression, and my sin is ever before me.” He would fain have that which he wishes to be ever before his own eyes, not be before God’s eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"


[[commentary]]
quote='''
“For mine iniquity I acknowledge, and my delinquency is before me ever” (ver. 3). I have not put behind my back what I have done, I look not at others, forgetful of myself, I pretend not to pull out a straw from my brother’s eye, when there is a beam in my eye; my sin is before me, not behind me. For it was behind me when to me was sent the Prophet, and set before me the parable of the poor man’s sheep. For saith Nathan the Prophet to David, “There was a certain rich man having very many sheep; but a poor man his neighbour had one little ewe sheep, which in his bosom and of his own food he was feeding: there came a stranger to the rich man, nothing from his flock he took, for the little ewe sheep of the poor man his neighbour he lusted; her he slew for the stranger: what doth he deserve?” But the other being angry doth pronounce sentence: then the king, evidently knowing not wherein he had been taken, declared the rich man deserving of death, and that the sheep be restored fourfold. Most sternly and most justly. But his sin was not yet before him, behind his back was what he had done: his own iniquity he did not yet acknowledge, and therefore another’s he did not pardon. But the Prophet, being for this purpose sent, took from his back the sin, and before his eyes placed it, so that he might see that sentence so stern to have been pronounced against himself. For cutting and healing his heart’s wound, he made a lancet of his tongue.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"