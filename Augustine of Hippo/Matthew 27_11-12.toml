[[commentary]]
quote='''
Luke gives the following version of what took place in presence of Pilate: "And they began to accuse Him, saying, We found this fellow perverting the nation, and forbidding to give tribute to Cæsar, and saying that he himself is Christ a king." The previous two evangelists have not recorded these words, although they do mention the fact that these parties accused Him. Luke is thus the one who has specified the terms of the false accusations which were brought against Him. On the other hand, he does not state that Pilate said to Him, "Answerest thou nothing? behold, how many things they witness against thee." Instead of introducing these sentences, Luke goes on to relate other matters which are also reported by these two. Thus he continues: "And Pilate asked Him, saying, Art thou the King of the Jews? And He answered him and said, Thou sayest." Matthew and Mark have likewise inserted this fact, previous to the statement that Jesus was taken to task for not answering His accusers. The truth, however, is not at all affected by the order in which Luke has narrated these things; and as little is it affected by the mere circumstance that one writer passes over some incident without notice, which another expressly specifies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 8"
