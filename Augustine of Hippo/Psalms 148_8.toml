[[commentary]]
quote='''
There follows the seventh commandment: "You shall not steal," and the seventh plague: hail on the crops. What you steal from the commandment, you lose from your account in heaven. No one makes an unjust gain without suffering a just loss. For example, someone steals and acquires a suit, but by the judgment of heaven he forfeits trust. Where there is gain, there is loss; visible gain, invisible loss; gain from his own blindness, loss from the Lord's cloud. You see, dearly beloved, there is nothing that escapes providence. Or do you really think that what people suffer, they suffer while God is asleep? We see these things happening all the time and all around; clouds gather, rain comes down in buckets, hail is hurled down, the earth shaken by thunder, scared out of its wits by lightning. Everywhere these things are thought to happen as though they had nothing to do with divine providence. Against such ideas that psalm is on its guard: "Praise the Lord from the earth"—his praises had already been told from the heavens—"dragons and all deeps, fire, hail, snow, ice, stormy winds, which all carry out his word." So those who for their own evil desire steal outwardly are hailed on inwardly by the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%25208.html'
source_title="SERMON 8:10"


[[commentary]]
quote='''
Excepting, therefore, those corporeal things which are done in the order of nature in a perfectly usual series of times, as e.g., the rising and setting of the stars, the generations and deaths of animals, the innumerable diversities of seeds and buds, the vapors and the clouds, the snow and the rain, the lightnings and the thunder, the thunderbolts and the hail, the winds and the fire, cold and heat, and all like things; excepting also those which in the same order of nature occur rarely, such as eclipses, unusual appearances of stars, and monsters, and earthquakes, and such like;—all these, I say, are to be excepted, of which indeed the first and chief cause is only the will of God; whence also in the Psalm, when some things of this kind had been mentioned, "Fire and hail, snow and vapor, stormy wind," lest any one should think those to be brought about either by chance or only from corporeal causes, or even from such as are spiritual, but exist apart from the will of God, it is added immediately, "fulfilling His word."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%25203.html'
source_title="ON THE TRINITY 3:10.19"
