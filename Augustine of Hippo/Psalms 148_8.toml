[[commentary]]
quote='''
There follows the seventh commandment: "You shall not steal," and the seventh plague: hail on the crops. What you steal from the commandment, you lose from your account in heaven. No one makes an unjust gain without suffering a just loss. For example, someone steals and acquires a suit, but by the judgment of heaven he forfeits trust. Where there is gain, there is loss; visible gain, invisible loss; gain from his own blindness, loss from the Lord's cloud. You see, dearly beloved, there is nothing that escapes providence. Or do you really think that what people suffer, they suffer while God is asleep? We see these things happening all the time and all around; clouds gather, rain comes down in buckets, hail is hurled down, the earth shaken by thunder, scared out of its wits by lightning. Everywhere these things are thought to happen as though they had nothing to do with divine providence. Against such ideas that psalm is on its guard: "Praise the Lord from the earth"—his praises had already been told from the heavens—"dragons and all deeps, fire, hail, snow, ice, stormy winds, which all carry out his word." So those who for their own evil desire steal outwardly are hailed on inwardly by the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%25208.html'
source_title="SERMON 8:10"


[[commentary]]
quote='''
Excepting, therefore, those corporeal things which are done in the order of nature in a perfectly usual series of times, as e.g., the rising and setting of the stars, the generations and deaths of animals, the innumerable diversities of seeds and buds, the vapors and the clouds, the snow and the rain, the lightnings and the thunder, the thunderbolts and the hail, the winds and the fire, cold and heat, and all like things; excepting also those which in the same order of nature occur rarely, such as eclipses, unusual appearances of stars, and monsters, and earthquakes, and such like;—all these, I say, are to be excepted, of which indeed the first and chief cause is only the will of God; whence also in the Psalm, when some things of this kind had been mentioned, "Fire and hail, snow and vapor, stormy wind," lest any one should think those to be brought about either by chance or only from corporeal causes, or even from such as are spiritual, but exist apart from the will of God, it is added immediately, "fulfilling His word."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FOn%2520The%2520Trinity%2FBook%25203.html'
source_title="ON THE TRINITY 3:10.19"


[[commentary]]
quote='''
“Fire, hail, snow, ice, wind of storms, which do His word” (ver. 8). Wherefore added he here, “which do His word”? Many foolish men, unable to contemplate and discern creation, in its several places and rank, performing its movements at the nod and commandment of God think that God doth indeed rule all things above, but things below He despiseth, casteth aside, abandoneth, so that He neither careth for them, nor guideth, nor ruleth them; but that they are ruled by chance, how they can, as they can: and they are influenced by what they say sometimes to one another: e.g. “If it were God that gave rain, would He rain into the sea? What sort of providence,” they say, “is this? Getulia is thirsty, and it rains into the sea.” They think that they handle the matter cleverly. One should say to them, “Getulia does at all events thirst, thou dost not even thirst.” For good were it for thee to say to God, “My soul hath thirsted for Thee.” For he that thus argueth is already satisfied; he thinketh himself learned, he is not willing to learn, therefore he thirsteth not. For if he thirsted, he would be willing to learn, and he would find that everything happeneth upon earth by God’s Providence, and he would wonder at the arrangement of even the limbs of a flea. Attend, beloved. Who hath arranged the limbs of a flea and a gnat, that they should have their proper order, life, motion? Consider one little creature, even the very smallest, whatever thou wilt. If thou considerest the order of its limbs, and the animation of life whereby it moveth; how doth it shun death, love life, seek pleasures, avoid pain, exert divers senses, vigorously use movements suitable to itself! Who gave its sting to the gnat, for it to suck blood with? How narrow is the pipe whereby it sucketh! Who arranged all this? who made all this? Thou art amazed at the smallest things; praise Him that is great. Hold then this, my brethren, let none shake you from your faith or from sound doctrine. He who made the Angel in heaven, the Same also made the worm upon earth: the Angel in heaven to dwell in heaven, the worm upon earth to abide on earth. He made not the Angel to creep in the mud, nor the worm to move in heaven. He hath assigned dwellers to their different abodes; incorruption He assigned to incorruptible abodes, corruptible things to corruptible abodes. Observe the whole, praise the whole. He then who ordered the limbs of the worm, doth He not govern the clouds? And wherefore raineth He into the sea? As though there are not in the sea things which are nourished by rain; as though He made not fishes therein, as though He made not living creatures therein. Observe how the fishes run to sweet water. And wherefore, saith he, doth He give rain to the fishes, and sometimes giveth not rain to me? That thou mayest consider that thou art in a desert region, and in a pilgrimage of life; that so this present life may grow bitter to thee, that thou mayest long for the life to come: or else that thou mayest be scourged, punished, amended. And how well doth He assign their properties to regions. Behold, since we have spoken of Getulia, He raineth here nearly every year, and giveth corn every year; here the corn cannot be kept, it soon rotteth, because it is given every year; there, because it is given seldom, both much is given, and it can be kept for long. But dost thou perchance think that God there deserteth man, or that they do not there after their own manner of rejoicing both praise and glorify God? Take a Getulian from his country, and set him amid our pleasant trees; he will wish to flee away, and return to his bare Getulia. To all places then, regions, seasons, God hath assigned and arranged what fits them. Who could unfold it? Yet they who have eyes see many things therein: when seen, they please; pleasing, they are praised; not they really, but He who made them; thus shall all things praise God.

It was in thought of this that the spirit of the Prophet added the words, “which do His word.” Think not then that these things are moved by chance, which in every motion of theirs obey God. Whither God willeth, thither the fire spreads, thither the cloud hurries, whether it carry in it rain, or snow, or hail. And wherefore doth the lightning sometimes strike the mountain, yet strikes not the robber?…Perhaps He yet seeketh the robber’s conversion, and therefore is the mountain which feareth not smitten, that the man who feareth may be changed. Thou also sometimes, when maintaining discipline, smitest the ground to terrify a child. Sometimes too He smiteth a man, whom He will. But thou sayest to me, Behold, He smiteth the more innocent, and passeth over the more guilty. Wonder not; death, whencesoever it come, is good to the good man. And whence dost thou know what punishment is reserved in secret for that more guilty man, if he be unwilling to be converted? Would not they rather be scorched by lightning, to whom it shall be said in the end, “Depart into everlasting fire”? The needful thing is, that thou be guileless. Why so? Is it an evil thing to die by shipwreck, and a good thing to die by fever? Whether he die in this way or in that, ask what sort of man he is who dieth; ask whither he will go after death, not how he is to depart from life.…Whatever then happeneth here contrary to our wish, thou wilt know that it happeneth not, save by the will of God, by His providence, by His ordering, by His nod, by His laws: and if we understand not why anything is done, let us grant to His providence that it is not done without reason: so shall we not be blasphemers. For when we begin to argue concerning the works of God, “why is this?” “why is that?” and, “He ought not to have done this,” “He did this ill;” where is the praise of God? Thou hast lost thy Halleluia. Regard all things in such wise as to please God and praise the Creator. For if thou wert to happen to enter the workshop of a smith, thou wouldest not dare to find fault with his bellows, his anvils, his hammers. But take an ignorant man, who knows not for what purpose each thing is, and he findeth fault with all. But if he have not the skill of the workman, and have but the reasoning power of a man, what saith he to himself? Not without reason are the bellows placed here: the workman knoweth wherefore, though I know not. In the shop he dareth not to find fault with the smith, yet in the universe he dareth to find fault with God. Therefore just as “fire, hail, snow, ice, wind of storms, which do His word,” so all things in nature, which seem to foolish persons to be made at random, simply “do His word,” because they are not made save by His command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520148.html'
source_title="Exposition on Psalm 148"
