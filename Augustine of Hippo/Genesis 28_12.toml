[[commentary]]
quote='''
Degrees are either of ascent or of descent. But degrees, as they are used in this Psalm, are of ascending…There are therefore both those who ascend and those who descend on that ladder. Who are they that ascend? They who progress towards the understanding of things spiritual. Who are they that descend? They who, although, as far as men may, they enjoy the comprehension of things spiritual: nevertheless, descend unto the infants, to say to them such things as they can receive, so that, after being nourished with milk, they may become fitted and strong enough to take spiritual meat…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520120.html'
source_title="Exposition on Psalm 120"
