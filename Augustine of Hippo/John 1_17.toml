[[commentary]]
quote='''
(in Joan. Tr. iii. c. 8. et seq.) There was not grace in the Old Testament; for the law threatened, but assisted not, commanded, but healed not, showed our weakness, but relieved it not. It prepared the way however for a Physician who was about to come, with the gifts of grace and truth: whence the sentence which follows: For the law was given by Moses, but grace and truth were made by Jesus Christ. The death of thy Lord hath destroyed death, both temporal and eternal; that is the grace which was promised, but not contained, in the law.

(de Trin. xiii. c. 24. [xix.]) Or, we may refer grace to knowledge, truth to wisdom. Amongst the events of time the highest grace is the uniting of man to God in One Person; in the eternal world the highest truth pertains to God the Word.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We undertook, in the name of the Lord, and promised to you, beloved, to treat of that grace and truth of God, full of which the only-begotten Son, our Lord and Saviour Jesus Christ, appeared to the saints, and to show how, as a matter belonging to the New Testament, it is to be distinguished from the Old Testament. Give, then, your attention that what I receive in my measure from God you in your measure may receive and hear the same. For it will only remain if, when the seed is scattered in your hearts, the birds take it not away, nor thorns choke it, nor heat scorch it, and there descend upon it the rain of daily exhortations and your own good thoughts, by which that is done in the heart which in the field is done by means of harrows, so that the clod is broken, and the seed covered and enabled to germinate: that you bear fruit at which the husbandman may be glad and rejoice. But if, in return for good seed and good rain, you bring forth not fruit but thorns, the seed will not be blamed, nor will the rain be in fault; but for thorns due fire is prepared.

I do not think that I need spend much time in endeavoring to persuade you that we are Christian men; and if Christians, by virtue of the name, belonging to Christ. Upon the forehead we bear His sign; and we do not blush because of it, if we also bear it in the heart. His sign is His humility. By a star the Magi knew Him; and this sign was given by the Lord, and it was heavenly and beautiful He did not desire that a star should be His sign on the forehead of the faithful, but His cross. By it humbled, by it also glorified; by it He raised the humble, even by that to which He, when humbled, descended. We belong, then, to the gospel, we belong to the New Testament. "The law was given by Moses, but grace and truth came by Jesus Christ." We ask the apostle, and he says to us, since we are not under the law but under grace. "He sent therefore His Son, made of a woman, made under the law, that He might redeem those who were under the law, that we might receive the adoption of sons." Behold, for this end Christ came, that He might redeem those who were under the law; that now we may not be under the law, but under grace. Who, then, gave the law? He gave the law who gave likewise grace; but the law He sent by a servant, with grace He Himself came down. And in what manner were men made under the law? By not fulfilling the law. For he who fulfills the law is not under the law, but with the law;but he who is under the law is not raised up, but pressed down by the law. All men, therefore, being placed under the law, are by the law made guilty; and for this purpose it is over their head, that it may show sins, not take them away. The law then commands, the Giver of the law showeth pity in that which the law commands. Men, endeavoring by their own strength to fulfill that which the law commands, fell by their own rash and headstrong presumption; and not with the law, but under the law, became guilty: and since by their own strength they were unable to fulfill the law, and were become guilty under the law, they implored the aid of the Deliverer; and the guilt which the law brought caused sickness to the proud. The sickness of the proud became the confession of the humble. Now the sick confess that they are sick; let the physician come to heal the sick.

Who is the Physician? Our Lord Jesus Christ. Who is our Lord Jesus Christ? He who was seen even by those by whom He was crucified. He who was seized, buffeted, scourged, spit upon, crowned with thorns, suspended upon the cross, died, pierced by the spear, taken down from the cross, laid in the sepulchre. That same Jesus Christ our Lord, that same Jesus exactly, He is the complete Physician of our wounds. That crucified One at whom insults were cast, and while He hung on the cross His persecutors wagging the head, and saying. "If he be the Son of God, let him come down from the cross," -He, and no other, is our complete Physician. Wherefore, then, did He not show to his deriders that He was the Son of God; so that if He allowed Himself to be lifted up upon the cross, at least when they said, "If he be the Son of God, let him come down from the cross," He should then come down, and show to them that He was the very Son of God whom they had dared to deride? He would not. Wherefore would He not? Was it because He could not? Manifestly He could. For which is greater, to descend from the cross or to rise from the sepulchre? But He bore with His insulters; for the cross was taken not as a proof of power, but as an example of patience. There He cured thy wounds, where He long bore His own; there He healed thee of death eternal, where He vouchsafed to die the temporal death. And did He die, or in Him did death die? What a death was that, which slew death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
"For the law was given by Moses;" which law held the guilty. For what saith the apostle? "The law entered that the offense might abound." It was a benefit to the proud that the offense abounded, for they gave much to themselves, and, as it were, attributed much to their own strength; and they were unable to fulfill righteousness without the aid of Him who had commanded it. God, desirous to subdue their pride, gave the law, as if saying: Behold, fulfill, and do not think that there is One wanting to command. One to command is not wanting, but one to fulfill.

If, then, there is one wanting to fulfill, whence does he not fulfill? Because born with the heritage of sin and death. Born of Adam, he drew with him that which was there conceived. The first man fell, and all who were born of him from him derived the concupiscence of the flesh. It was needful that another man should be born who derived no concupiscence. A man and a man: a man to death and a man to life. Thus saith the apostle: "Since, indeed, by man death, by man also the resurrection of the dead." By which man death, and by which man the resurrection of the dead? Do not make haste: he goes on to say, "For as in Adam all die, so also in Christ shall all be made alive." Who belong to Adam? All who are born of Adam. Who to Christ? All who were born through Christ. Wherefore all in sin? Because no one was born except through Adam. But that they were born of Adam was of necessity, arising from damnation; to be born through Christ is of will and grace. Men are not compelled to be born through Christ: not because they wished were they born of Adam. All, however, who are of Adam are sinners with sin: all who are through Christ are justified, and just not in themselves, but in Him. For in themselves, if thou shouldest ask, they belong to Adam: in Him, if thou shouldest ask, they belong to Christ. Wherefore? Because He, the Head, our Lord Jesus Christ, did not come with the heritage of sin; but He came nevertheless with mortal flesh.

Death was the punishment of sins; in the Lord was the gift of mercy, not the punishment of sin. For the Lord had nothing on account of which He should justly die. He Himself says, "Behold, the prince of this world cometh, and findeth nothing in me." Wherefore then dost Thou die? "But that all may know that I do the will of my Father, arise, let us go hence." He had not in Himself any reason why He should die, and He died: thou hast such a reason, and dost thou refuse to die? Do not refuse to bear with an equal mind thy desert, when He did not refuse to suffer, to deliver thee from eternal death. A man and a man but the one nothing but man, the other God-man. The one a man of sin, the other of righteousness. Thou didst die in Adam, rise in Christ; for both are due to thee. Now thou hast believed in Christ, render nevertheless that which thou owest through Adam. But the chain of sin shall not hold thee eternally; because the temporal death of thy Lord slew thine eternal death. The same is grace, my brethren, the same is truth, because promised and manifested.

This grace was not in the Old Testament, because the law threatened, did not bring aid; commanded, did not heal; made manifest, but did not take away our feebleness: but it prepared the way for that Physician who was to come with grace and truth; as a physician who, about to come to any one to cure him, might first send his servant that he might find the sick man bound. He was not sound; he did not wish to be made sound and lest he should be made sound, he boasted that he was so. The law was sent, it bound him; he finds himself accused, now, he exclaims against the bandage. The Lord comes, cures with somewhat bitter and sharp medicines: for He says to the sick, Bear; He says, Endure; He says, Love not the world, have patience, let the fire of continence cure thee, let thy wounds endure the sword of persecutions. Wert thou greatly terrified although bound? He, free and unbound, drank what He gave to thee; He first suffered that He might console thee, saying, as it were, that which thou fearest to suffer for thyself, I first suffer for thee. This is grace, and great grace.Who can praise it in a worthy manner?

I speak, my brethren, regarding the humility of Christ. Who can speak regarding the majesty of Christ, and the divinity of Christ? In explaining and speaking of the humility of Christ, to do so in any fashion we find ourselves not sufficient, indeed wholly insufficient: we commend Him entire to your thoughts, we do not endeavor to fill Him up to your hearing. Consider the humility of Christ. But who, thou sayest, may explain it to us, unless thou declare it? Let Him declare it within. Better does He declare it who dwelleth within, than he who crieth without. Let Himself show to you the grace of His humility, who has begun to dwell in your hearts. But now, if in explaining and setting forth His humility we are deficient, who can speak of His majesty? If "the Word made flesh" disturbs us, who shall explain "In the beginning was the Word"? Keep hold then, brethren, upon the entireness of Christ.

"The law was given by Moses: grace and truth came by Jesus Christ." By a servant was the law given, and made men guilty: by an Emperor was pardon given, and delivered the guilty. "The law was given by Moses." Let not the servant attribute to himself more than was done through him. Chosen to a great ministry as one faithful in his house, but yet a servant, he is able to act according to the law, but cannot release from the guilt of the law. "The law," then, "was given by Moses: grace and truth came by Jesus Christ."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
But opportunely it hath chanced not by our own but by God’s dispensation, that just now we heard out of the Gospel, that “the Law was given by Moses, Grace and Truth came by Jesus Christ.” For if we distinguish between the two Testaments, Old and New, there are not the same Sacraments nor the same promises; nevertheless, the same commandments for the most part.…When examined they are either all found to be the same, or there are scarce any in the Gospel which have not been spoken by the Prophets. The Commandments are the same, the Sacraments are not the same, the Promises are not the same. Let us see wherefore the commandments are the same; because according to these we ought to serve God. The Sacraments are not the same, for some Sacraments there are giving Salvation, others promising a Saviour. The Sacraments of the New Testament give Salvation, the Sacraments of the Old Testament did promise a Saviour. When therefore thou hast now the things promised, why dost thou seek the things promising, having now the Saviour?…God through the New Testament hath taken out of the hands of His sons those things which are like the playthings of boys, in order that He might give something more useful to them growing up, on that account must He be supposed not to have given those former things Himself. He gave both Himself. But the Law itself through Moses was given, Grace and Truth came through Jesus Christ: Grace because there is fulfilled through love that which by the letter was being enjoined, Truth because there is being rendered that which was promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252074.html'
source_title="Exposition on Psalm 74"
