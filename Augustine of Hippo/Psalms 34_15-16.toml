[[commentary]]
quote='''
He took heed to it, and He heard it. See thou hast not waited in vain. His eyes are over thee. His ears turned towards thee. For, “the eyes of the Lord are upon the righteous, and His ears are open unto their cry.” What then? Did He not see thee, when thou usedst to do evil and to blaspheme Him? What then becomes of what is said in that very Psalm, “The face of the Lord is upon them that do evil”? But for what end? “That He may cut off the remembrance of them from the earth.” Therefore, even when thou wert wicked, He “took heed of thee;” but He “took no heed to thee.” So then to him who “waited patiently for the Lord,” it was not enough to say, “He took heed of me, He says, “He took heed to me;” that is, He took heed by comforting me, that He might do me good. What was it that He took heed to? “and He heard my cry.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252040.html'
source_title="Exposition on Psalm 40"
