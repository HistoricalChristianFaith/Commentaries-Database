
[[commentary]]
quote='''
“All they that go by the way have spoiled him:” that is, all the heathen that go by the way, meaning, all who pass through this life, have spoiled Israel, have spoiled David. First of all, see his fragments in all nations: for it is of the Jews that it is said, “They shall be a portion for foxes.” For the Scripture calls wicked, crafty, and cowardly kings, whom another’s virtue terrifies, foxes. Thus when our Lord Himself was speaking of the threatening Herod, He said, “Go ye, and tell that fox.” The king who fears no man, is not a fox: like that Lion of Judah, of whom it is said, “Stooping down Thou didst rise up, and didst sleep as a lion.” At Thy will Thou didst stoop down, at Thy will didst rise; because Thou wouldest, Thou didst sleep. And thus in another Psalm he says, “I slept.” Was not the sentence complete, “I slept, and took rest, and rose up again, because the Lord shall uphold Me”? Why is the word ego added? and thus with a strong emphasis on the word I, they raged against Me, they troubled Me: but had I not willed, I had not slept. Those then concerning whom it was declared that they should be a portion for foxes, are now spoken of as follows; “All they that go by have spoiled him: and he is become a reproach to his neighbours” (ver. 41). “Thou hast set up the right hand of his enemies, and made all his adversaries to rejoice” (ver. 42). Look at the Jews, and see all things fulfilled that were predicted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252089.html'
source_title="Exposition on Psalm 89"
