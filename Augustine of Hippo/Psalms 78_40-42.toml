[[commentary]]
quote='''
I say then of these crooked and embittering persons, “How often they exasperated Him in the desert, and provoked Him to wrath in the waterless place!” (ver. 40). “And they turned themselves and tempted God, and exasperated the Holy One of Israel” (ver. 41). He is repeating that same unbelief of theirs, of which He had made mention above. But the reason of the repetition is, in order that there may be mentioned also the plagues which He inflicted on the Egyptians for their sakes: all which things they certainly ought to have remembered, and not to be ungrateful. Lastly, there followeth what? “They remembered not His hands, in the day when He redeemed them from the hand of the troubler” (ver. 42).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
