[[commentary]]
quote='''
The reign of sin is overthrown and destroyed, partly by such an amendment on the part of men that the flesh is made subject to the spirit and partly by the condemnation of those who are persevering in sin, in order that they might be so justly restrained that they cannot be troublesome to the righteous, who reign with Christ.
'''
source_url=''
source_title="COMMENTARY ON THE LORD'S SERMON ON THE MOUNT 1.22.77"

[[commentary]]
quote='''
We must engage in a constant, daily struggle not to obey those desires which are forbidden or improper. For from this sort of fault it comes about that the eye is turned to where it ought not to look, and if this fault grows strong and prevails, even bodily adultery is carried out, which is committed in the heart as much more quickly as thought is quicker than action and has nothing to hinder or delay it.
'''
source_url=''
source_title="ON NATURE AND GRACE 38.45"


[[commentary]]
quote='''
This weakness of the flesh must be therefore minded, the words of the Apostle recollected, “Let not sin therefore reign in your mortal body.” He hath not said, let there not be; but, “let there not reign.” There is sin in thee, when thou takest pleasure; there reigneth, if thou shalt have consented. Carnal pleasure, especially if proceeding unto unlawful and strange objects, is to be bridled, not let loose: by government to be tamed, not to be set up for government. Look and be without care, if thou hast nothing whereby thou mayest be moved. But thou makest answer, “I contain with strong resolution.” Art thou any wise stronger than David?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"