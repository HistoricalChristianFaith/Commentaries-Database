[[commentary]]
quote='''
“I will think,” he says, “upon Rahab:” who is that harlot? That harlot in Jericho, who received the spies and conducted them out of the city by a different road: who trusted beforehand in the promise, who feared God, who was told to hang out of the window a line of scarlet thread, that is, to bear upon her forehead the sign of the blood of Christ. She was saved there, and thus represented the Church of the Gentiles: whence our Lord said to the haughty Pharisees, “Verily I say unto you, that the publicans and the harlots go into the kingdom of God before you.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252087.html'
source_title="Exposition on Psalm 87"
