[[commentary]]
quote='''
“Command, O God, Thy Virtue” (ver. 28). For one is our Lord Jesus Christ, through whom are all things, and we in Him, of whom we read that He is “the Virtue of God and the Wisdom of God.” But how doth God command His Christ, save while He commendeth Him? For “God commendeth His love in us, in that while yet we were sinners, for us Christ died.” “How hath He not also with Him given to us all things?” “Command, O God, Thy Virtue: confirm, O God, that which Thou hast wrought in us.” Command by teaching, confirm by aiding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252068.html'
source_title="Exposition on Psalm 68"
