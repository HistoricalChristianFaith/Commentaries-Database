[[commentary]]
quote='''
Again, although John tells us nothing as to the way in which the Lord despatched His disciples to fetch these animals to Him, nevertheless he inserts a brief allusion to this colt, and cites also the word of the prophet which Matthew makes use of. In the case also of this testimony from the prophet, the terms in which it is reproduced by the evangelists, although they exhibit certain differences, do not fail to express a sense identical in intention. Some difficulty, however, may be felt in the fact that Matthew adduces this passage in a form which represents the prophet to have made mention of the ass; whereas this is not the case, either with the quotation as introduced by John, or with the version given in the ecclesiastical codices of the translation in common use. An explanation of this variation seems to me to be found in the fact that Matthew is understood to have written his Gospel in the Hebrew language. Moreover, it is manifest that the translation which bears the name of the Septuagint differs in some particulars from the text which is found in the Hebrew by those who know that tongue, and by the several scholars who have given us renderings of the same Hebrew books. And if an explanation is asked for this discrepancy, or for the circumstance that the weighty authority of the Septuagint translation diverges in many passages from the rendering of the truth which is discovered in the Hebrew codices, I am of opinion that no more probable account of the matter will suggest itself, than the supposition that the Seventy composed their version under the influence of the very Spirit by whose inspiration the things which they were engaged in translating had been originally spoken. This is an idea which receives confirmation also from the marvellous consent which is asserted to have characterized them. Consequently, when these translators, while not departing from the real mind of God from which these sayings proceeded, and to the expression of which the words ought to be subservient, gave a different form to some matters in their reproduction of the text, they had no intention of exemplifying anything else than the very thing which we now admiringly contemplate in that kind of harmonious diversity which marks the four evangelists, and in the light of which it is made clear that there is no failure from strict truth, although one historian may give an account of some theme in a manner different indeed from another, and yet not so different as to involve an actual departure from the sense intended by the person with whom he is bound to be in concord and agreement. To understand this is of advantage to character, with a view at once to guard against what is false, and to pronounce correctly upon it; and it is of no less consequence to faith itself, in the way of precluding the supposition that, as it were with consecrated sounds, truth has a kind of defence provided for it which might imply God's handing over to us not only the thing itself, but likewise the very words which are required for its enunciation; whereas the fact rather is, that the theme itself which is to be expressed is so decidedly deemed of superior importance to the words in which it has to be expressed, that we would be under no obligation to ask about them at all, if it were possible for us to know the truth without the terms, as God knows it, and as His angels also know it in Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 66"
