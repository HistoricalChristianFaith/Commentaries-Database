[[commentary]]
quote='''
When he says: And make not provision for the flesh in its concupiscences, he shows that provision for the flesh is not to be blamed, when those things are provided which avail for the necessity of bodily health. But if it is for superfluous delights and luxuries, so that one may rejoice in the things that the flesh desires, he is rightly reproved, because he makes provision for the flesh in its concupiscences, since he who sows in his flesh shall reap corruption from the flesh, that is, he who rejoices in carnal delights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
