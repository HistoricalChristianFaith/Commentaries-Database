[[commentary]]
quote='''
“O Lord, rebuke me not in Thine indignation; neither chasten me in Thy hot displeasure” (ver. 1). For it will be that some shall be chastened in God’s “hot displeasure,” and rebuked in His “indignation.” And haply not all who are “rebuked” will be “chastened;” yet are there some that are to be saved in the chastening. So it is to be indeed, because it is called “chastening,” but yet it shall be “so as by fire.” But there are to be some who will be “rebuked,” and will not be “corrected.” For he will at all events “rebuke” those to whom He will say, “I was an hungred, and ye gave me no meat.”… “Neither chasten me in Thy hot displeasure;” so that Thou mayest cleanse me in this life, and make me such, that I may after that stand in no need of the cleansing fire, for those “who are to be saved, yet so as by fire.” Why? Why, but because they “build upon the foundation, wood, stubble, and hay.” Now they should build on it, “gold, silver, and precious stones;” and should have nothing to fear from either fire: not only that which is to consume the ungodly for ever, but also that which is to purge those who are to escape through the fire. For it is said, “he himself shall be saved, yet so as by fire.” And because it is said, “he shall be saved,” that fire is thought lightly of. For all that, though we should be “saved by fire,” yet will that fire be more grievous than anything that man can suffer in this life whatsoever.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252038.html'
source_title="Exposition on Psalm 38"


[[commentary]]
quote='''
Explain to us, then, saith one, how those that build wood, hay, stubble, on the foundation, do not perish, but “are saved, yet so as by fire”? An obscure question indeed that, but as I am able I tell you briefly. Brethren, there are men altogether despisers of this world, to whom nothing is pleasant that flows in the course of time, they cling not by love to any earthly works, holy, chaste, continent, just, perchance even selling all their goods and distributing to the poor, or “possessing as though they possessed not, and using this world as though not using it.” But there are others who cling to things allowed to infirmity with a degree of affection. He robs not another of his estate, but so loves his own, that if he loses it he will be disturbed. He does not covet another’s wife, but so clings to his own, so cohabits with his own, as not therein to keep the measure prescribed in the laws, for the sake of begetting children. He does not take away other men’s things, but reclaims his own, and has a law-suit with his brother. For to such it is said, “Now indeed there is altogether a fault among you, because ye have law-suits with each other.” But these very suits he orders to be tried in the Church, not to be dragged into court, yet he says they are faults. For a Christian contends for earthly things more than becomes one to whom the kingdom of Heaven is promised. Not the whole of his heart doth he raise upward, but some part of it he draggeth on the earth.…Therefore if thou lovest thy possession, yet dost not for its sake commit violence, dost not for its sake bear false witness, dost not for its sake commit manslaughter, dost not for its sake swear falsely, dost not for its sake deny Christ: in that thou wilt not for its sake do these things, thou hast Christ for a foundation. But yet because thou lovest it, and art saddened if thou losest it, upon the foundation thou hast placed, not gold, or silver, or precious stones, but wood, hay, stubble. Saved therefore thou wilt be, when that begins to burn which thou hast built, yet so as by fire. For let no one on this foundation building adulteries, blasphemies, sacrileges, idolatries, perjuries, think he shall be “saved through fire,” as though they were the “wood, hay, stubble:” but he that buildeth the love of earthly things on the foundation of the kingdom of Heaven, that is upon Christ, his love of temporal things shall be burned, and himself shall be saved through the right foundation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252081.html'
source_title="Exposition on Psalm 81"
