[[commentary]]
quote='''
For even the first heresy in the disciples of Christ, as it were from the hardness of His discourse arose. For when He said, “Except a man shall have eaten My flesh and shall have drunk My blood, he shall not have life in himself:” they, not understanding, said to one another, “Hard is this discourse, who can hear it?” Saying that, “Hard is this discourse,” they separated from Him: He remained with the others, the twelve. When they had intimated to Him, that by His discourse they had been scandalized, “Will ye also,” He saith, “choose to go?” Then Peter: “Thou hast the Word of life eternal: to whom shall we go?” Attend, we beseech you, and ye little ones learn godliness. Did Peter by any means at that time understand the secret of that discourse of the Lord? Not yet he understood: but that good were the words which he understood not, godly he believed. Therefore if hard is a discourse, and not yet is understood, be it hard to an ungodly man, but to thee be it by godliness softened: for whenever it is solved, it both will become for thee oil, and even unto the bones it will penetrate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252055.html'
source_title="Exposition on Psalm 55"
