[[commentary]]
quote='''
We have seen who the hireling is also. Who, but the devil, is the wolf? And what was said of the hireling? "When he seeth the wolf coming, he fleeth: but the sheep are not his own, and he careth not for the sheep." Was the Apostle Paul such an one? Certainly not. Was Peter such an one? Far from it. Was such the character of the other apostles, save Judas, the son of perdition? Surely not. Were they shepherds then? Certainly they were. And how is there one Shepherd? I have already said they were shepherds, because members of the Shepherd. In that head they rejoiced, under that head they were in harmony together, with one spirit they lived in the bond of one body; and therefore belonged all of them to the one Shepherd. If, then, they were shepherds, and not hirelings, wherefore fled they when suffering persecution? Explain it to us, O Lord. In an epistle, I have seen paul fleeing: he was let down by the wall in a basket, to escape the hands of his persecutor. Had he, then, no care of the sheep, whom he thus abandoned at the approach of the wolf? Clearly he had, but he commended them by his prayers to the Shepherd who was sitting in heaven; and for their advantage he preserved himself by flight, as he says in a certain place, "To abide in the flesh is needful for you." For all had heard from the Shepherd Himself, "If they persecute you in one city, flee ye into another." May the Lord be pleased to explain to us this point! Lord, Thou saidst to those whom Thou didst certainly wish to be faithful shepherds, and whom Thou didst form into Thine own members, "If they persecute you flee." Doest Thou, then, injustice to them, when Thou blamest the hirelings who flee when they see the wolf coming! We ask Thee to tell us what meaning lies hid in the depths of the question. Let us knock, and the keeper of the door, which is Christ, will be here to reveal Himself.

Who is the hireling that seeth the wolf coming, and fleeth? He that seeketh his own, not the things which are Jesus Christ's. He is one that does not venture plainly to rebuke an offender. Look, some one or other has sinned-grievously sinned; he ought to be rebuked, to be excommunicated: but once excommunicated, he will turn into an enemy, hatch plots, and do all the injury he can. At present, he who seeketh his own, not the things that are Jesus Christ's, in order not to lose what he follows after, the advantages of human friendship, and incur the annoyances of human enmity, keeps quiet and does not administer rebuke. See, the wolf has caught a sheep by the throat; the devil has enticed a believer into adultery: thou holdest thy peace-thou utterest no reproof. O hireling, thou hast seen the wolf coming and hast fled! Perhaps he answers and says: See, I am here; I have not fled. Thou hast fled, because thou hast been silent; thou hast been silent, because thou hast been afraid. The flight of the mind is fear. Thou stoodest with thy body, thou fleddest in thy spirit, which was not the conduct of him who said, "Though I be absent in the flesh, yet am I with you in the spirit." For how did he flee in spirit, who, though absent in the flesh, yet in his letters reproved the fornicators? Our affections are the motions of our minds. Joy is expansion of the mind; sorrow, contraction of the mind; desire, a forward movement of the mind; and fear, the flight of the mind. For thou art expanded in mind when thou art glad; contracted in mind when thou art in trouble; thou movest forward in mind when thou hast an earnest desire; and thou fleest in mind when thou art afraid. This, then, is how the hireling is said to flee at the sight of the wolf. Why? "Because he careth not for the sheep." Why "careth he not for the sheep"? "Because he is an hireling." What is that, "he is an hireling"? He seeketh a temporal reward, and shall not dwell in the house for ever. There are still some things here to be inquired about and discussed with you, but it is not prudent to burden you. For we are ministering the Lord's food to our fellow-servants; we feed as sheep in the Lord's pastures, and are fed together. And just as we must not withhold what is needful, so our weak hearts are not to be overcharged with the abundance of provisions. Let it not then annoy your Charity that I do not take up to-day all that I think is still here to be discussed; but the same lesson will, in the Lord's name, be read over to us again on the preaching days, and be, with His help, more carefully considered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252046.html'
source_title="Tractates on John 46"
