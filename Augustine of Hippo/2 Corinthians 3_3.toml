[[commentary]]
quote='''
But if God were not able to remove from the human heart even its obstinacy and hardness, He would not say, through the prophet, "I will take from them their heart of stone, and will give them a heart of flesh." That all this was foretold in reference to the New Testament is shown clearly enough by the apostle when he says, "Ye are our epistle, . . . written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshly tables of the heart." We must not, of course, suppose that such a phrase as this is used as if those might live in a fleshly way who ought to live spiritually; but inasmuch as a stone has no feeling, with which man's hard heart is compared, what was there left Him to compare man's intelligent heart with but the flesh, which possesses feeling?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 29"
