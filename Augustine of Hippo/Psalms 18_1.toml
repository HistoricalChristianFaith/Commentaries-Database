[[commentary]]
quote='''
Take care not to let trust in your own strength steal on you, for you are human, and "cursed be everyone who puts his hope in man." But put your trust fully and with your whole heart in God, and he will be your strength; trust him lovingly and gratefully and say to him humbly and faithfully, "I will love you, O Lord, my strength," because that very charity of God, when it is perfected in us, "casts out fear."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 218"

[[commentary]]
quote='''
To the end, for the servant of the Lord, David himself.

That is, for the strong of hand, Christ in His Manhood. “The words of this song which he spoke to the Lord on the day when the Lord delivered him out of the hands of his enemies, and of the hand of Saul; and he said, On the day when the Lord delivered him out of the hands of his enemies and of the hand of Saul:” namely, the king of the Jews, whom they had demanded for themselves. For as “David” is said to be by interpretation, strong of hand; so “Saul” is said to be demanding. Now it is well known, how that People demanded for themselves a king, and received him for their king, not according to the will of God, but according to their own will.

Christ, then, and the Church, that is, whole Christ, the Head and the Body, saith here, “I will love Thee, O Lord, My strength” (ver. 1). I will love Thee, O Lord, by whom I am strong.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252018.html'
source_title="Exposition on Psalm 18"
