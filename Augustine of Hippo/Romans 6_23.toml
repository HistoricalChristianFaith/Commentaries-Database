[[commentary]]
quote='''
But inasmuch as we have even our good works from God, from whom likewise comes our faith and our love, therefore the selfsame great teacher of the Gentiles has designated "eternal life" itself as His gracious "gift."

And hence there arises no small question, which must be solved by the Lord's gift. If eternal life is rendered to good works, as the Scripture most openly declares: "Then He shall reward every man according to his works:" how can eternal life be a matter of grace, seeing that grace is not rendered to works, but is given gratuitously, as the apostle himself tells us: "To him that worketh is the reward not reckoned of grace, but of debt;" and again: "There is a remnant saved according to the election of grace;" with these words immediately subjoined: "And if of grace, then is it no more of works; otherwise grace is no more grace"? How, then, is eternal life by grace, when it is received from works? Does the apostle perchance not say that eternal life is a grace? Nay, he has so called it, with a clearness which none can possibly gainsay. It requires no acute intellect, but only an attentive reader, to discover this. For after saying, "The wages of sin is death," he at once added, "The grace of God is eternal life through Jesus Christ our Lord."

This question, then, seems to me to be by no means capable of solution, unless we understand that even those good works of ours, which are recompensed with eternal life, belong to the grace of God, because of what is said by the Lord Jesus: "Without me ye can do nothing." And the apostle himself, after saying, "By grace are ye saved through faith; and that not of yourselves, it is the gift of God: not of works, lest any man should boast;" saw, of course, the possibility that men would think from this statement that good works are not necessary to those who believe, but that faith alone suffices for them; and again, the possibility of men's boasting of their good works, as if they were of themselves capable of performing them. To meet, therefore, these opinions on both sides, he immediately added, "For we are His workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them." What is the purport of his saying, "Not of works, lest any man should boast," while commending the grace of God? And then why does he afterwards, when giving a reason for using such words, say, "For we are His workmanship, created in Christ Jesus unto good works"? Why, therefore, does it run, "Not of works, lest any man should boast"? Now, hear and understand. "Not of works" is spoken of the works which you suppose have their origin in yourself alone; but you have to think of works for which God has moulded (that is, has formed and created) you. For of these he says, "We are His workmanship, created in Christ Jesus unto good works." Now he does not here speak of that creation which made us human beings, but of that in reference to which one said who was already in full manhood, "Create in me a clean heart, O God;" concerning which also the apostle says, "Therefore, if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new. And all things are of God." We are framed, therefore, that is, formed and created, "in the good works which" we have not ourselves prepared, but "God hath before ordained that we should walk in them." It follows, then, dearly beloved, beyond all doubt, that as your good life is nothing else than God's grace, so also the eternal life which is the recompense of a good life is the grace of God; moreover it is given gratuitously, even as that is given gratuitously to which it is given. But that to which it is given is solely and simply grace; this therefore is also that which is given to it, because it is its reward;—grace is for grace, as if remuneration for righteousness; in order that it may be true, because it is true, that God "shall reward every man according to his works."

Perhaps you ask whether we ever read in the Sacred Scriptures of "grace for grace." Well you possess the Gospel according to John, which is perfectly clear in its very great light. Here John the Baptist says of Christ: "Of His fulness have we all received, even grace for grace." So that out of His fulness we have received, according to our humble measure, our particles of ability as it were for leading good lives—"according as God hath dealt to every man his measure of faith;" because "every man hath his proper gift of God; one after this manner, and another after that." And this is grace. But, over and above this, we shall also receive "grace for grace," when we shall have awarded to us eternal life, of which the apostle said: "The grace of God is eternal life through Jesus Christ our Lord," having just said that "the wages of sin is death." Deservedly did he call it "wages," because everlasting death is awarded as its proper due to diabolical service. Now, when it was in his power to say, and rightly to say: "But the wages of righteousness is eternal life," he yet preferred to say: "The grace of God is eternal life;" in order that we may hence understand that God does not, for any merits of our own, but from His own divine compassion, prolong our existence to everlasting life. Even as the Psalmist says to his soul, "Who crowneth thee with mercy and compassion." Well, now, is not a crown given as the reward of good deeds? It is, however, only because He works good works in good men, of whom it is said, "It is God which worketh in you both to will and to do of His good pleasure," that the Psalm has it, as just now quoted: "He crowneth thee with mercy and compassion," since it is through His mercy that we perform the good deeds to which the crown is awarded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapters 18-21"
