[[commentary]]
quote='''
They were not reborn, those who were baptized by John's baptism, by which Christ himself was baptized. Rather, they were "prepared" by the ministry of a forerunner, who said, "Prepare a way for the Lord"—for him in whom alone they could be reborn.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 14:49"

[[commentary]]
quote='''
There it is written, "a voice of one crying in the wilderness," the Word is conceived in the virgin's womb. If the voice is not the Word, it is then a loud clanging of metal. For one then would not be able to say that every word is a sound but not every sound is a word. For it is not unfitting to take "the way" as that which came up to the very heart and filled us inwardly. Indeed, the heart became his place to which he comes and remains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520289.html'
source_title="SERMON 289"

[[commentary]]
quote='''
That said Isaiah. This prophecy was fulfilled in John, "I am the voice of one crying in the wilderness." Crying what? "Prepare ye the way of the Lord, make straight the paths of our God." Would it not have seemed to you that a herald would have cried, "Go away, make room." Instead of the herald's cry "Go away," John says "Come." The herald makes men stand back from the judge; to the Judge John calls. Yes, indeed, John calls men to the lowly One, that they may not experience what He will be as the exalted Judge. "I am the voice of one crying in the wilderness, Prepare ye the way of the Lord, as said the prophet Isaiah." He did not say, I am John, I am Elias, I am a prophet. But what did he say? This I am called, "The voice of one crying in the wilderness, Prepare the way for the Lord: I am the prophecy itself."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25204.html'
source_title="Tractates on John 4"
