[[commentary]]
quote='''
“O Lord, let me not be confounded, for I have called upon Thee” (ver. 17). O Lord, let me not be put to shame by those who insult me, for that I have called upon Thee. “Let the ungodly be ashamed, and be brought down to hell.” Let them rather who call upon stones be ashamed, and made to dwell with darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
