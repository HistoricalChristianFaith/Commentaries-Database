
[[commentary]]
quote='''
Because to Him it was said, “Thou art a Priest for ever, after the order of Melchizedec.” For thou seekest a sacrifice among the Jews; thou hast none after the order of Aaron. Thou seekest it after the order of Melchizedec; thou findest it not among them, but through the whole world it is celebrated in the Church. “From the rising of the sun to the setting thereof the name of the Lord is praised.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"

[[commentary]]
quote='''
And unto what art Thou born? “The Lord hath sworn, and will not repent: Thou art a Priest for ever after the order of Melchizedec” (ver. 4). For unto this wast Thou born from the womb before the morning star, that Thou mightest be a Priest for ever after the order of Melchizedec. For in that character in which He was born of the Father, God with God, coeternal with Him who begot Him, He is not a Priest; but He is a Priest on account of the flesh which He assumed, on account of the victim which He was to offer for us received from us. “The Lord,” then, “hath sworn.” What then meaneth, the Lord hath sworn? Doth the Lord, who forbiddeth men to swear, Himself swear? Or doth He possibly forbid man to swear chiefly on this account, that he may not fall into perjury, and for this reason the Lord may swear, since He cannot be forsworn. For man, who, through a habit of swearing, may slip into perjury, is rightly forbidden to swear: for he will be farther from perjury in proportion as he is far from swearing. For the man who sweareth, may swear truly or falsely: but he who sweareth not, cannot swear falsely; for he sweareth not at all. Why then should not the Lord swear, since the Lord’s oath is the seal of the promise? Let Him swear by all means. What then dost thou, when thou swearest? Thou callest God to witness: this is to swear, to call God to witness; and for this reason there must be anxiety, that thou mayest not call God to witness anything false. If therefore thou by an oath dost call God to witness, why then should not God also call Himself to witness with an oath? “I live, saith the Lord,” this is the Lord’s oath.…“The Lord sware,” then, that is, confirmed: “He will not repent,” He will not change. What? “Thou art a Priest for ever. “For ever,” for He will not repent. But Priest, in what sense? Will there be those victims, victims offered by the Patriarchs, altars of blood, and tabernacle, and those sacred emblems of the Old Covenant? God forbid! These things are already abolished; the temple being destroyed, that priesthood taken away, their victim and their sacrifice having alike disappeared, not even the Jews have these things. They see that the priesthood after the order of Aaron hath already perished, and they do not recognise the Priesthood after the order of Melchizedec. I speak unto believers. If catechumens understand not something, let them lay aside sloth, and hasten unto knowledge. It is not therefore needful for me to disclose mysteries here: let the Scriptures intimate to you what is the Priesthood after the order of Melchizedec.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520110.html'
source_title="Exposition on Psalm 110"
