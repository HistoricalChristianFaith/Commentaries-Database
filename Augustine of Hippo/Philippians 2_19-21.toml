[[commentary]]
quote='''
Who then is the hireling? There are some in office in the church, of whom the Apostle Paul saith, "Who seek their own, not the things that are Jesus Christ's." What means that, "Who seek their own"? Who do not love Christ freely, who do not seek after God for His own sake; who are pursuing after temporal advantages, gaping for gain, coveting honors from men. When such things are loved by an overseer, and for such things God is served, whoever such an one may be, he is an hireling who cannot count himself among the children. For of such also the Lord saith: "Verily, I say unto you, they have their reward." Listen to what the Apostle Paul says of St. Timothy: "But I trust in the Lord Jesus to send Timothy shortly unto you, that I also may be of good comfort, when I know your circumstances; for I have no man like-minded, who will naturally care for you. For all seek their own, not the things which are Jesus Christ's." The shepherd mourned in the midst of hirelings. He sought some one who sincerely loved the flock of Christ, and round about him, amongst those who were with him at that time, he found not one. Not that there was no one then in the Church of Christ but the Apostle Paul and Timothy, who had a brother's concern for the flock; but it so happened at the time of his sending Timothy, that he had none else of his sons about him; only hirelings were with him, "who sought their own, not the things which are Jesus Christ's." And yet he himself, with a brother's anxiety for the flock, preferred sending his son, and remaining himself amongst hirelings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252046.html'
source_title="Tractates on John 46"
