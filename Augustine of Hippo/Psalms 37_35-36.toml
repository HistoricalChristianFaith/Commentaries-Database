[[commentary]]
quote='''
“I have seen the ungodly lifted up on high, and rising above the cedars of Libanus” (ver. 35). And suppose him to be “lifted up on high;” suppose him to be towering above the “rest;” what follows?

“I passed by, and, lo, he was not! I sought him, and his place could nowhere be found!” (ver. 36). Why was he “no more, and his place nowhere to be found”? Because thou hast “passed by.” But if thou art yet carnally-minded, and that earthly prosperity appears to thee to be true happiness, thou hast not yet “passed by” him; thou art either his fellow, or thou art below him; go on, and pass him; and when thou hast made progress, and hast passed by him, thou observest him by the eye of faith; thou seest his end, thou sayest to thyself, “Lo! he who so swelled before, is not!” just as if it were some smoke that thou wert passing near to. For this too was said above in this very Psalm, “They shall consume and fade away as the smoke.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252037.html'
source_title="Exposition on Psalm 37"

[[commentary]]
quote='''
Yea, their flower I have passed over in loftiness of heart, unto Thee I have come, and thence I have looked back upon them, and have seen that “All flesh is grass, and all the glory of man as the flower of grass:” as in a certain place is also said, “I have seen the ungodly man to be exalted and raised up like the cedars of Lebanon: I passed by, and, lo! he was not.” Wherefore “he was not”? Because thou hast passed by. What is, “because thou hast passed by”? Because not to no purpose hast thou heard “Lift up thy heart;” because not on earth, where thou wouldest have rotted, thou hast remained; because thou hast lifted thy soul to God, and thou hast mounted beyond the cedars of Lebanon, and from that elevation hast observed: and “Lo! he was not;” and thou hast sought him, and there hath not been found place for him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252054.html'
source_title="Exposition on Psalm 54"

[[commentary]]
quote='''
But perhaps he will have passed to a good place, if indeed he have passed. For I know not whither he who spake thus hath passed. For he spake in pride; and I know not whither such men pass, save that I look into another Psalm, and see that their passage is an evil one. “I beheld the wicked lifted up above the cedars of Libanus, and I passed by, and, lo, he was not; and I sought him, and his place was not found.” The good man, who passed by, and found not the wicked, reached a place where the wicked is not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
