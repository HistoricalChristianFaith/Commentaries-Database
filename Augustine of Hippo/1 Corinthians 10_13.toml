[[commentary]]
quote='''
Why is this written if we are now so endowed that by the strength of our free will we are able to overcome all temptations merely by bearing them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FLetters.html'
source_title="LETTER 179, TO BISHOP JOHN"

[[commentary]]
quote='''
The devil is a sort of power; ofttimes however he wisheth to hurt, and is not able, because that power is under power. For if the devil could hurt as much as he would; no one of just men would remain, nor could any one of the faithful be on earth. The same through his vessels smiteth against, as it were, a wall bowed down: but he only smiteth against, so far as he receiveth power. But in order that the wall may not fall, the Lord will support: for He that giveth power to the tempter, doth Himself to the tempted extend mercy. For according to measure the devil is permitted to tempt. And, “Thou wilt give us to drink in tears in a measure.” Do not therefore fear the tempter permitted to do somewhat: for thou hast a most merciful Saviour. So much he is permitted to tempt as is profitable for thee, that thou mayest be exercised, mayest be proved; in order that by thyself thou mayest be found out, that knowest not thyself. For where, or from whence, ought we to be secure, except by this power and mercy of God? After that Apostolic saying, “Faithful is God, that doth not suffer you to be tempted above that which ye are able.”…Fear not the enemy: so much he doeth as he hath received power to do, Him fear thou that hath the chief power: Him fear, that doeth as much as He willeth, and that doeth nothing unjustly, and whatever He shall have done, is just. We might suppose something or other to be unjust: inasmuch as God hath done it, believe it to be just.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252062.html'
source_title="Exposition on Psalm 62"
