[[commentary]]
quote='''
“Gird Thy sword upon Thy thigh, O most Mighty” (ver. 3). What is meant by “Thy sword,” but “Thy word”? It was by that sword He scattered His enemies; by that sword he divided the son from the father, “the daughter from the mother, the daughter-in-law from the mother-in-law.” We read these words in the Gospel, “I came not to send peace, but a sword.” And, “In one house shall five be divided against each other; three against two, and two against three;” i.e. “the father against the son, the daughter against the mother, the daughter-in-law against the mother-in-law.” By what “sword,” but that which Christ brought, was this division wrought? And indeed, my brethren, we see this exemplified daily. Some young man is minded to give himself up to God’s service; his father is opposed to it; they are “divided against each other:” the one promises an earthly inheritance, the other loves an heavenly; the one promises one thing, the other prefers another. The father should not think himself wronged: God alone is preferred to him. And yet he is at strife with the son, who would fain give himself to God’s service. But the spiritual sword is mightier to separate them, than the ties of carnal nature to bind them together. This happens also in the case of a mother against her daughter; still more also in that of a daughter-in-law against a mother-in-law. For sometimes in one house mother-in-law and daughter-in law are found orthodox and heretical respectively. And where that sword is forcibly felt, we do not dread the repetition of Baptism. Could daughter be divided against mother; and could not daughter-in-law be divided against mother-in-law?…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252045.html'
source_title="Exposition on Psalm 45"

[[commentary]]
quote='''
The Lord Himself saith: “I am come to send fire on the earth:” “fire” in the same way as a “sword;” as in another passage He saith, that He was not come to send peace, but a sword, upon earth. The sword to divide, the fire to burn: but each salutary: for the sword of His own word hath in salutary wise separated us from evil habits. For He brought a sword, and separated every believer either from his father who believed not in Christ, or from his mother in like manner unbelieving: or at least, if we were born of Christian parents, from his ancestors. For no man among us had not either a grandsire, or great grandsire, or some ancestry among the heathen, and in that unbelief which is accursed before God. We are separated from that which we were before; but the sword which separateth, but slayeth not, hath cut between us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252097.html'
source_title="Exposition on Psalm 97"

[[commentary]]
quote='''
Without doubt there is a sword of good intent. What is the sword of good intent? That whereof the Lord saith, “I came not to send peace on earth, but a sword.” For He was about to separate believers from unbelievers, sons from parents, and to sever all other ties, while the sword cut off what was diseased, but healed the members of Christ. Of good intent then is the sword twice sharpened, powerful with both edges, the Old and New Testaments, with the narration of the past and the promise of the future. That then is the sword of good intent: but the other is of ill intent, wherewith they talk vanity, for that is of good intent, wherewith God speaketh verity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520144.html'
source_title="Exposition on Psalm 144"

[[commentary]]
quote='''
By “swords sharpened on both sides,” we understand the Word of the Lord: it is one sword, but therefore are they called many, because there are many mouths and many tongues of the saints. How is it two edged? It speaks of things temporal, it speaks also of things eternal. In both cases it proveth what it saith, and him whom it strikes, it severeth from the world. Is not this the sword whereof the Lord said, “I am not come to send peace upon earth, but a sword”? Observe how He came to divide, how He came to sever. He divideth the saints, He divideth the ungodly, He severeth from thee that which hindereth thee. The son willeth to serve God, the father willeth not: the sword cometh, the Word of God cometh, and severeth the son from the father.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
