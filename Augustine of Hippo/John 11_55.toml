[[commentary]]
quote='''
(Tr. l. 2) He who came from heaven to suffer, wished to draw near the place of His Passion, His hour being now at hand: And the Jews' passover was nigh at hand. That passover they had resolved to celebrate by shedding our Lord's blood; the blood which consecrated the Passover, the blood of the Lamb. The Law obliged every one to go up to the feast: And many went out of the country up to Jerusalem before the passover to purify them. But ours is the true Passover; the Jewish one was a shadow. The Jews held their passover in the dark, we in the light: their posts were stained with the blood of a slain animal, our foreheads are signed with the blood of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Yesterday's lesson in the holy Gospel, on which we spake as the Lord enabled us, is followed by to-day's, on which we purpose to speak in the same spirit of dependence. Some passages in the Scriptures are so clear as to require a hearer rather than an expounder: over such we need not tarry, that we may have sufficient time for those which necessarily demand a fuller consideration.

"And the Jews' passover was nigh at hand." The Jews wished to have that feast-day crimsoned with the blood of the Lord. On it that Lamb was slain, who hath consecrated it as a feast-day for us by His own blood. There was a plot among the Jews about slaying Jesus: and He, who had come from heaven to suffer, wished to draw near to the place of His suffering, because the hour of His passion was at hand. Therefore "many went out of the country up to Jerusalem before the passover, to sanctify themselves." The Jews did so in accordance with the command of the Lord delivered by holy Moses in the law, that on the feast-day of the passover all should assemble from every part of the land, and be sanctified in celebrating the services of the day. But that celebration was a shadow of the future. And why a shadow? It was a prophetic intimation of the Christ to come, a prophecy of Him who on that day was to suffer for us: that so the shadow might vanish and the light come; that the sign might pass away, and the truth be retained. The Jews therefore held the passover in a shadowy form, but we in the light. For what need was there that the Lord should command them to slay a sheep on the very day of the feast, save only because of Him it was prophesied, "He is led as a sheep to the slaughter"? . The door-posts of the Jews were sealed with the blood of the slaughtered animal: with the blood of Christ are our foreheads sealed. And that sealing-for it had a real significance-was said to keep away the destroyer from the houses that were sealed: Christ's seal drives away the destroyer from us, if we receive the Saviour into our hearts. But why have I said this? Because many have their door-posts sealed while there is no inmate abiding within: they find it easy to have Christ's seal in the forehead, and yet at heart refuse admission to His word. Therefore, brethren, I have said, and I repeat it, Christ's seal driveth from us the destroyer, if only we have Christ as an inmate of our hearts. I have stated these things, lest any one's thoughts should be turning on the meaning of these festivals of the Jews. The Lord therefore came as it were to the victim's place, that the true passover might be ours, when we celebrated His passion as the real offering of the lamb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252050.html'
source_title="Tractates on John 50"
