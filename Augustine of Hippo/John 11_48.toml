[[commentary]]
quote='''
Insincerity speaks in the Pharisees: "If we let him go, the Romans will come and take away our nation and place." It was not the reality of justice that they wished to have but its name, and they desired to hold on dishonestly to the honor owed to just men and women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252010.html'
source_title="SERMON 10.8"

[[commentary]]
quote='''
(Tr. xlix. 26) Or, they were afraid that, if all believed in Christ, none would remain to defend the city of God and the temple against the Romans: since they thought that Christ's teaching was directed against the temple, and their laws. They were afraid of losing temporal things, and thought not of eternal life; and thus they lost both. For the Romans, after our Lord had suffered and was glorified, did come and take away their place and nation, reducing the one by siege, and dispersing the other.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But they that of Christ have said, “He is not God,” have there feared where was no fear. For they said, “If we shall have let Him go, there will come the Romans, and will take away from us both place and kingdom.” O folly and imprudence saying in its heart, “He is not God”! Thou hast feared to lose earth, thou hast lost Heaven: thou hast feared lest there should come the Romans, and take away from thee place and kingdom! Could they take away from thee God? What then remaineth? what but that thou confess, that thou hast willed to keep, and by keeping ill hast lost? For thou hast lost both place and nation by slaying Christ. For ye did will rather to slay Christ, than to lose place; and ye have lost place, and nation, and Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252053.html'
source_title="Exposition on Psalm 53"

[[commentary]]
quote='''
They therefore fearing to lose earth, said what of the Lord Jesus Christ, when they saw great multitudes go after Him, forasmuch as He was doing wonderful things? “If we shall have let Him go alive, there will come the Romans, and will take away from us both place and nation.” They feared to lose earth, and they went under the earth: there befell them even what they feared. For they willed to kill Christ, that they might not lose earth; and earth they therefore lost, because Christ they slew. For when Christ had been slain, because the Lord Himself had said to them, “The kingdom shall be taken from you, and shall be given up to a nation doing righteousness:” there followed them great calamities of persecutions: there conquered them Roman emperors, and kings of the nations: they were shut out from that very place where they crucified Christ, and now that place is full of Christian praisers: it hath no Jew, it hath been cleared of the enemies of Christ, it hath been fulfilled with the praisers of Christ. Behold, they have lost at the hands of the Romans the place, because Christ they slew, who to this end slew, that they might not lose the place at the hands of the Romans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252063.html'
source_title="Exposition on Psalm 63"

[[commentary]]
quote='''
For the blindness of the Jews was secret vengeance: but the open was what? “Let their habitation become forsaken, and in their tabernacles let there not be any one to inhabit.” There hath come to pass this thing in the very city Jerusalem, wherein they thought themselves mighty in crying against the Son of God, “Crucify, Crucify;” and in prevailing because they were able to kill Him that raised dead men. How mighty to themselves, how great, they seemed! There followed afterwards the vengeance of the Lord, stormed was the city, utterly conquered the Jews, slain were I know not how many thousands of men. No one of the Jews is permitted to come thither now: where they were able to cry against the Lord, there by the Lord they are not permitted to dwell. They have lost the place of their fury: and O that even now they would know the place of their rest! What profit to them was Caiaphas in saying, “If we shall have let go this man thus, there will come the Romans, and take away from us both place and kingdom”? Behold, both they did not let Him go alive, and He liveth: and there have come the Romans, and have taken from them both place and kingdom. But now we heard, when the Gospel was being read, “Jerusalem, Jerusalem, how often would I have gathered together thy sons, as a hen her chickens under her wings, and thou wouldest not? Behold there is left to you your house forsaken.”…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252069.html'
source_title="Exposition on Psalm 69"
