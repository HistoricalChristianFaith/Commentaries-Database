[[commentary]]
quote='''
It is because of an indubitable mystery that He appears not to acknowledge His mother. from whom as the Bridegroom He came forth, when He says to her, "Woman, what have I to do with thee? Mine hour is not yet come." What is this? Did He come to the marriage for the purpose of teaching men to treat their mothers with contempt? Surely he to whose marriage He had come was taking a wife with the view of having children, and surely he wished to be honored by those children he would beget: had Jesus then come to the marriage in order to dishonor His mother, when marriages are celebrated and wives married with the view of having children, whom God commands to honor their parents? Beyond all doubt, brethren, there is some mystery lurking here. It is really a matter of such importance that some,-of whom the apostle, as we have mentioned before, has forewarned us to be on our guard, saying, "I fear, lest, as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ,"-taking away from the credibility of the gospel, and asserting that Jesus was not born of the Virgin Mary, used to endeavor to draw from this place an argument in support of their error, so far as to say, How could she be His mother, to whom He said, "Woman, what have I to do with thee?" Wherefore we must answer them, and show them why the Lord said this, lest in their insanity they appear to themselves to have discovered something contrary to wholesome belief, whereby the chastity of the virgin bride may be corrupted, that is, whereby the faith of the Church may be injured. For in very deed, brethren, their faith is corrupted who prefer a lie to the truth. For these men, who appear to honor Christ in such wise as to deny that He had flesh, do nothing short of proclaiming Him a liar. Now they who build up a lie in men, what do they but drive the truth out of them? They let in the devil, they drive Christ out; they let in an adulterer, shut out the bridegroom, being evidently paranymphs, or rather, the panderers of the serpent. For it is for this object they speak, that the serpent may possess, and Christ be shut out. How doth the serpent possess? When a lie possesses. When falsehood possesses, then the serpent possesses; when truth possesses, then Christ possesses. For Himself has said, "I am the truth;" but of that other He said, "He stood not in the truth, because the truth is not him." And Christ is the truth in such wise that thou shouldst receive the whole to be true in Him. The true Word, God equal with the Father, true soul, true flesh, true man, true God, true nativity, true passion, true death, true resurrection. If thou say that any of these is false, rottenness enters, the worms of falsehood are bred of the poison of the serpent, and nothing sound will remain.

What, then, is this, saith one, which the Lord saith, "Woman, what have I to do with thee?" Perhaps the Lord shows us in the sequel why He said this: "Mine hour," saith He, "is not yet come." For thus is how He saith, "Woman, what have I to do with thee? mine hour is not yet come." And we must seek to know why this was said. But first let us therefrom withstand the heretics. What says the old serpent, of old the hissing instiller of poison? What saith he? That Jesus had not a woman for His mother. Whence provest thou that? From this, saith he, because Jesus said, "Woman, what have I to do with thee?" Who has related this, that we should believe that Jesus said it? Who has related it? None other than John the evangelist. But the same John the evangelist said, "And the mother of Jesus was there." For this is how he has told us: "The next day. there was a marriage in Cana of Galilee, and the mother of Jesus was there. And having been invited to the marriage, Jesus had come thither with His disciples." We have here two sayings uttered by the evangelist. "The mother of Jesus was there," said the evangelist; and it is the same evangelist that has told us what Jesus said to His mother. And see, brethren, how he has told us that Jesus answered His mother, having said first, "His mother said unto Him," in order that you may keep the virginity of your heart secure against the tongue of the serpent. Here we are told in the same Gospel, the record of the same evangelist, "The mother of Jesus was there," and "His mother said unto Him." Who related this? John the evangelist. And what said Jesus in answer to His mother? "Woman, what have I to do with thee? Who relates this? The very same Evangelist John. O most faithful and truth-speaking evangelist, thou tellest me that Jesus said, "Woman, what have I to do with thee?" why hast thou added His mother, whom He does not acknowledge? For thou hast said that "the mother of Jesus was there," and that "His mother said unto Him;" why didst thou not rather say, Mary was there, and Mary said unto Him. Thou tellest as these two facts, "His mother said unto Him," and "Jesus answered her, Woman, why have I to do with thee?" Why doest thou this, if it be not because both are true? Now, those men are willing to believe the evangelist in the one case, when he tells us that Jesus said to His mother, "Woman, what have I to do with thee?" and yet they will not believe him in the other, when he says, "The mother of Jesus was there," and "His mother said unto Him." But who is he that resisteth the serpent and holds fast the truth, whose virginity of heart is not corrupted by the subtilty of the devil? He who believes both to be true, namely, that the mother of Jesus was there, and that Jesus made that answer to His mother. But if he does not as yet understand in what manner Jesus said, "Woman, what have I to do with thee?" let him meanwhile believe that He said it, and said it, moreover, to His mother. Let him first have the piety to believe, and he will then have fruit in understanding.

I ask you, O faithful Christians, Was the mother of Jesus there? Answer ye, She was. Whence know you? Answer, The Gospel says it. What answer made Jesus to His mother? Answer ye, "Woman, what have I to do with thee? mine hour is not yet come." And whence know you this? Answer, The Gospel says it. Let no man corrupt this your faith, if you desire to preserve a chaste virginity for the Bridegroom. But if it be asked of you, why He made this answer to His mother, let him declare who understands; but he who does not as yet understand, let him most firmly believe that Jesus made this answer, and made it moreover to His mother. By this piety he will learn to understand also why Jesus answered thus, if by praying he knock at the door of truth, and do not approach it with wrangling. Only this much, while he fancies himself to know, or is ashamed because he does not know, why Jesus answered thus, let him beware lest he be constrained to believe either that the evangelist lied when he said, "The mother of Jesus was there," or that Jesus Himself suffered for our sins by a counterfeit death and for our justification showed counterfeit scars; and that He spoke falsely in saying, "If ye continue in my word, ye are my disciples indeed; and ye shall know the truth, and the truth shall make you free. For if He had a false mother, false flesh, false death, false wounds in His death, false scars in His, resurrection, then it will not be the truth, but rather falsehood, that shall make free those that believe on Him. Nay, on the contrary, let falsehood yield to truth, and let all be confounded who would have themselves be accounted truth-speaking, because they endeavor to prove Christ a deceiver, and will not have it said to them, We do not believe you because you lie, when they affirm that truth itself has lied. Nevertheless, if we ask them, Whence know you that Christ said, "Woman, what have I to do with thee?" they answer that they believe the Gospel. Then why do they not believe the Gospel when it says, "The mother of Jesus was there," and, "His mother said unto Him"? Or if the Gospel lies here, how are we to believe it there, that Jesus said this, "Woman, what have I to do with thee?" Why do not those miserable men rather faithfully believe that the Lord did so answer, not to a stranger, but to His mother; and also piously seek to know why He did so answer? There is a great difference between him who says, I would know why Christ made this answer to His mother, and him who says, I know that it was not to His mother that Christ made this answer. It is one thing to be willing to understand what is shut up, another thing to be unwilling to believe what is open. He who says, I would know why Christ thus made answer to His mother, wishes the Gospel, in which he believes, opened up to him; but he who says, I know that it was not to His mother that Christ made this answer, accuses of falsehood the very Gospel, wherein he believed that Christ did so answer.

Now then, if it seem good, brethren, those men being repulsed, and ever wandering in their own blindness, unless in humility they be healed, let us inquire why our Lord answered His mother in such a manner. He was in an extraordinary manner begotten of the Father without a mother, born of a mother without a father; without a mother He was God, without a father He was man; without a mother before all time, without a father in the end of times. What He said was said in answer to His mother, for "the mother of Jesus was there," and "His mother said unto Him." All this the Gospel says. It is there we learn that "the mother of Jesus was there," just where we learn that He said unto her, "Woman, what have I to do with thee? mine hour is not yet come." Let us believe the whole; and what we do not yet understand, let us search out. And first take care, lest perhaps, as the Manichaeans found occasion for their falsehood, because the Lord said, "Woman, what have I to do with thee?" the astrologers in like manner may find occasion for their deception, in that He said, "Mine hour is not yet come." If it was in the sense of the astrologers He said this, we have committed a sacrilege in burning their books. But if we have acted rightly, as was done in the times of the apostles, it was not according to their notion that the Lord said, "Mine hour is not yet come." For, say those vain-talkers and deceived seducers, thou seest that Christ was under fate, as He says, "Mine hour is not yet come." To whom then must we make answer first-to the heretics or to the astrologers? For both come of the serpent, and desire to corrupt the Church's virginity of heart, which she holds in undefiled faith. Let us first reply to those whom we proposed, to whom, indeed, we have already replied in great measure. But lest they should think that we have not what to say of the words which the Lord uttered in answer to His mother, we prepare you further against them; for I suppose what has already been said is sufficient for their refutation.
'''
