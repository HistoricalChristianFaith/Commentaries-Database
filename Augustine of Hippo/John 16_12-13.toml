[[commentary]]
quote='''
As these things are so, beloved, I warn you in the love of Christ to beware of impure seducers and sects of obscene filthiness, whereof the apostle says, "But it is a shame even to speak of those things which are done of them in secret: lest, when they begin to teach their horrible impurities, which no human ear whatever can bear, they declare them to be the very things whereof the Lord said, "I have yet many things to say unto you, but ye cannot bear them now;" and assert that it is the Holy Spirit's agency that makes such impure and detestable things possible to be borne. The evil things which no human modesty whatever can endure are of one kind, and of quite another are the good things which man's little understanding is unable to bear: the former are wrought in unchaste bodies, the latter are beyond the reach of all bodies; the one is perpetrated in the filthiness of the flesh, the other is scarcely perceivable by the pure mind. "Be ye therefore renewed in the spirit of your mind," and "understand what is the will of God, which is good, and acceptable, and perfect;" that, "rooted and grounded in love, ye may be able to comprehend, with all saints, what is the length, and breadth, and height, and depth, even to know the love of Christ which passeth knowledge, that ye may be filled with all the fullness of God." For in such a way will the Holy Spirit teach you all truth, when He shall shed abroad that love ever more and more largely in your hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252096.html'
source_title="Tractates on John 96"

[[commentary]]
quote='''
The Holy Spirit, whom the Lord promised to send to His disciples, to teach them all the truth which, at the time He was speaking to them, they were unable to bear: of the which Holy Spirit, as the apostle says, we have now received "the earnest," an expression whereby we are to understand that His fullness is reserved for us till another life: that Holy Spirit, therefore, teacheth believers also in the present life, as far as they can severally apprehend what is spiritual; and enkindles a growing desire in their breasts, according as each one makes progress in that love, which will lead him both to love what he knows already, and to long after what still remains to be known: so that those very things which he has some notion of at present, he may know that he is still ignorant of, as they are yet to be known in that life which eye hath not seen, nor ear heard, nor the heart of man hath perceived. But were the inner Master wishing at present to say those things in such a way of knowing, that is, to unfold and make them patent to our mind, our human weakness would be unable to bear them. Whereof you remember, beloved, that I have already spoken, when we were occupied with the words of the holy Gospel, where the Lord says, "I have yet many things to say unto you, but ye cannot bear them now." Not that in these words of the Lord we should be suspecting an over-fastidious concealment of no one knows what secrets, which might be uttered by the Teacher, but could not be borne by the learner, but those very things which in connection with religious doctrine we read and write, hear and speak of, as within the knowledge of such and such persons, were Christ willing to utter to us in the self-same way as He speaks of them to the holy angels, in His own Person as the only-begotten Word of the Father, and co-eternal with Him, where are the human beings that could bear them, even were they already spiritual, as the apostles still were not when the Lord so spoke to them, and as they afterwards became when the Holy Spirit descended? For, of course, whatever may be known of the creature, is less than the Creator Himself, who is the supreme and true and unchangeable God. And yet who keeps silence about Him? Where is His name not found in the mouths of readers, disputants, inquirers, respondents, adorers, singers, all sorts of haranguers, and lastly even of blasphemers themselves? And although no one keeps silence about Him, who is there that apprehends Him as He is to be understood, although He is never out of the mouths and the hearing of men? Who is there, whose keenness of mind can even get near Him? Who is there that would have known Him as the Trinity, had not He Himself desired so to become known? And what man is there that now holds his tongue about that Trinity; and yet what man is there that has any such idea of it as the angels? The very things, therefore, that are incessantly being uttered off-hand and openly about the eternity, the truth, the holiness of God, are understood well by some, and badly by others: nay rather, are understood by some, and not understood at all by others. For he that understands in a bad way, does not understand at all. And in the case even of those by whom they are understood in a right sense, by some they are perceived with less, by others with greater mental vividness, and by none on earth are apprehended as they are by the angels. In the very mind, therefore, that is to say, in the inner man, there is a kind of growth, not only in order to the transition from milk to solid food, but also to the taking of food itself in still larger and larger measure. But such growth is not in the way of a space-covering mass of matter, but in that of an illuminated understanding; because that food is itself the light of the understanding. In order, then, to your growth and apprehension of God, and in order that your apprehension may keep full pace with your ever-advancing growth, you ought to be addressing your prayer, and turning your hope, not to the teacher whose voice only reaches your ears, that is, who plants and waters only by outside labor, but to Him who giveth the increase.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252097.html'
source_title="Tractates on John 97"
