[[commentary]]
quote='''
Sometimes people run off to a mountain to pray, as though God will be able to hear them better from there. Do you want to make contact with God in your prayer? Humble yourself. But again, just because I have said, "Do you want to make contact with God? Humble yourself," do not take it literally and materialistically and go off down to underground vaults and there start beseeching God. Do not go seeking either caverns or mountains. Have lowliness in your heart, and God will give you all the high altitude you want. He will come to you and be with you in your bedroom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%252045.html'
source_title="SERMON 45:7"

[[commentary]]
quote='''
“Now have I known that the Lord hath saved his Christ” (ver. 6). Now hath it been shown to me in prophecy, that the Lord will raise up His Christ again. “He will hear Him from His holy heaven.” He will hear Him not from earth only, where He prayed to be glorified; but from heaven also, where interceding for us at the Right Hand of the Father, He hath from thence shed abroad the Holy Spirit on them that believe on Him. “In strength is the safety of His right hand.” Our strength is in the safety of His favour, when even out of tribulation He giveth help, that “when we are weak, then we may be strong.” “For vain is” that “safety of man,” which comes not of His right hand but of His left: for thereby are they lifted up to great pride, whosoever in their sins have secured a temporal safety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252020.html'
source_title="Exposition on Psalm 20"
