[[commentary]]
quote='''
"Mary Magdalene came and told the disciples, I have seen the Lord, and He hath spoken these things unto me. Then the same day at evening, being the first day of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus, and stood in the midst, and saith unto them, Peace be unto you. And when He had so said, He showed unto them His hands and His side." For nails had pierced His hands, a spear had laid open His side: and there the marks of the wounds are preserved for healing the hearts of the doubting. But the shutting of doors presented no obstacle to the matter of His body, wherein Godhead resided. He indeed could enter without their being opened, by whose birth the virginity of His mother remained inviolate,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520121.html'
source_title="Tractates on John 121"
