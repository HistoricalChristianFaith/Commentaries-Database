[[commentary]]
quote='''
Hence therefore He is in the first place “gracious;” but “righteous,” because He scourgeth; and again, “merciful,” because He receiveth; for “He scourgeth every son whom He receiveth;” nor ought it to be so bitter to me that He scourgeth, as sweet that He receiveth. For how should not “The Lord, who keepeth little ones” (ver. 6), scourge those whom, when of mature age, He seeketh to be heirs; “for what son is he whom the father chasteneth not?” “I was in misery, and He helped me.” He helped me, because I was in misery; for the pain which the physician causeth by his knife is not penal, but salutary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520116.html'
source_title="Exposition on Psalm 116"
