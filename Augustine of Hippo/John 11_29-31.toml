
[[commentary]]
quote='''
"As soon as she heard that, she arose quickly, and came unto Him. For Jesus was not yet come into the town, but was still in that place where Martha met Him. The Jews, then, who were with her in the house,and comforted her, when they saw Mary, that she rose up hastily, and went out, followed her, saying, She goeth unto the grave, to weep there." What cause had the evangelist to tell us this? To show us what it was that occasioned the numerous concourse of people to be there when Lazarus was raised to life. For the Jews, thinking that her reason for hastening away was to seek in weeping the solace of her grief, followed her; that the great miracle of one rising again who had been four days dead, might have the presence of many witnesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252049.html'
source_title="Tractates on John 49"
