[[commentary]]
quote='''
See what followeth: “Be the glory of the Lord for ever” (ver. 31). Not thine, not mine, not his, or his; not for a season, but “for ever.” “The Lord shall rejoice in His works.” Not in thine, as if they were thine: because if thy works are evil, it is through thy iniquity; if good, it is through the grace of God. “The Lord shall rejoice in His works.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520104.html'
source_title="Exposition on Psalm 104"
