[[commentary]]
quote='''
Matthew proceeds thus: "At that time Jesus answered and said, I make my acknowledgment to Thee, O Father, Lord of heaven and earth, that Thou hast hid these things from the wise and prudent," and so on, down to where we read, "For my yoke is easy, and my burden is light." This passage is also noticed by Luke, but only in part. For he does not give us the words, "Come unto me, all ye that labour," and the rest. It is, however, quite legitimate to suppose that all this may have been said on one occasion by the Lord, and yet that Luke has not recorded the whole of what was said on that occasion. For Matthew's phrase is, that "at that time Jesus answered and said;" by which is meant the time after His upbraiding of the cities. Luke, on the other hand, interposes some matters, although they are not many, after that upbraiding of the cities; and then he subjoins this sentence: "In that hour He rejoiced in the Holy Spirit, and said." Thus, too, we see that even if Matthew's expression had been, not "at that time," but "in that very hour," still what Luke inserts in the interval is so little that it would not appear an unreasonable thing to give it as all spoken in the same hour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 33"
