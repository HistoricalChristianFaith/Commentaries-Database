[[commentary]]
quote='''
But whether the former exposition of this place, or this last be the more suitable, without prejudice to any one better, or equal, or as good, it follows very consistently, “the Lord judgeth the people.” For whether He returned on high, when, after the resurrection, He ascended into heaven, well does it follow, “The Lord judgeth the people:” for that He will come from thence to judge the quick and the dead. Or whether He return on high, when the understanding of the truth leaves sinful Christians, for that of His coming it has been said, “Thinkest thou the Son of Man on His coming will find faith on the earth?” “The Lord” then “judgeth the people.” What Lord, but Jesus Christ? “For the Father judgeth no man, but hath committed all judgment unto the Son.” Wherefore this soul which prayeth perfectly, see how she fears not the day of judgment, and with a truly secure longing says in her prayer, “Thy kingdom come: judge me,” she says, “O Lord, according to my righteousness.” In the former Psalm a weak one was entreating, imploring rather the mercy of God, than mentioning any desert of his own: since the Son of God came “to call sinners to repentance.” Therefore he had there said, “Save me, O Lord, for Thy mercy’s sake;” that is, not for my desert’s sake. But now, since being called he hath held and kept the commandments which he received, he is bold to say, “Judge me, O Lord, according to my righteousness, and according to my harmlessness, that is upon me.” This is true harmlessness, which harms not even an enemy. Accordingly, well does he require to be judged according to his harmlessness, who could say with truth, “If I have repaid them that recompense me evil.” As for what he added, “that is upon me,” it can refer not only to harmlessness, but can be understood also with reference to righteousness; that the sense should be this, Judge me, O Lord, according to my righteousness, and according to my harmlessness, which righteousness and harmlessness is upon me. By which addition he shows that this very thing, that the soul is righteous and harmless, she has not by herself, but by God who giveth brightness and light. For of this he says in another Psalm, “Thou, O Lord, wilt light my candle.” And of John it is said, that “he was not the light, but bore witness of the light.” “He was a burning and shining candle.” That light then, whence souls, as candles, are kindled, shines forth not with borrowed, but with original, brightness, which light is truth itself. It is then so said, “According to my righteousness, and according to my harmlessness, that is upon me,” as if a burning and shining candle should say, Judge me according to the flame which is upon me, that is, not that wherewith I am myself, but that whereby I shine enkindled of thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25207.html'
source_title="Exposition on Psalm 7"
