[[commentary]]
quote='''
"He has converted my soul." This is a confession rightly to boast about.… You will make it truly … and with an unalterable conscience, if you say it, not on account of your merits but for the sake of his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520366.html'
source_title="SERMON 366:4"

[[commentary]]
quote='''
“He hath converted my soul: He hath led me forth in the paths of righteousness, for His Name’s sake” (ver. 3). He hath brought me forth in the narrow ways, wherein few walk, of His righteousness; not for my merit’s sake, but for His Name’s sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252023.html'
source_title="Exposition on Psalm 23"
