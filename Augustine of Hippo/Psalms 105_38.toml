[[commentary]]
quote='''
“Egypt was glad at their departing: for their fear fell upon them” (ver. 38); that is, the fear of the Hebrews upon the Egyptians. For “their fear” is not that with which the Hebrews feared, but that with which they were feared. Some one will say, how then were the Egyptians unwilling to dismiss them? why did they let them go as if they expected them to return? why did they lend them gold and silver, as to men who were to return, and to repay them, if “Egypt was glad at their departing”? But we must understand, after that final destruction of the Egyptians, and the terrible overthrow of the mighty pursuing army in the Red Sea, that the rest of the Egyptians feared lest the Hebrews should return, and with great ease crush the relics of them: illustrating what he had stated, that He made His people stronger than their enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520105.html'
source_title="Exposition on Psalm 105"
