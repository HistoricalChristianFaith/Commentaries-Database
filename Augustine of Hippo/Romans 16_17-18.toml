[[commentary]]
quote='''
When he says: I beseech you, brethren, to mark those who make dissensions and scandals contrary to the teaching which you have learned, he is understood to speak of those of whom he also wrote to Timothy, saying: As I asked you to remain at Ephesus, when I was going into Macedonia, that you might charge certain persons not to teach otherwise, nor to give heed to fables and endless genealogies, which furnish questions rather than the edification of God, which is in faith; and to Titus: For there are many unruly, vain talkers and seducers of minds, especially those who are of the circumcision, who must be refuted, who subvert whole households, teaching things they ought not, for the sake of filthy gain; one of them, their own prophet, said: The Cretans are always liars, evil beasts, lazy bellies. For to this refers what he also says here: For these do not serve Christ the Lord, but their own belly—of whom he says in another place: Whose God is their belly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
