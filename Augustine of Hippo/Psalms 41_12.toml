[[commentary]]
quote='''
“But as for Me, Thou upholdest Me, because of Mine innocence” (ver. 12). Truly innocence; integrity without sin, requiting without debt, scourging without desert. “Thou upholdest Me because of Mine innocence, and hast made Me strong in Thy sight for ever.” Thou hast made Me strong for ever, Thou madest Me weak for a time: Thou hast made Me strong in Thy sight, Thou madest Me weak in sight of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"
