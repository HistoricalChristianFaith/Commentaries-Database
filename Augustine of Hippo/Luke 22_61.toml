[[commentary]]
quote='''
When fear overwhelmed him, as the Lord had predicted, he three times denies the one for whom he promised to die. As it says, "The Lord looked at him and he, for his part, wept bitterly." Remembrance of his denial was necessarily bitter, so that the grace of redemption might be even more sweet. If Christ had not left him to himself, he would not have denied. If Christ had not looked at him, he would not have wept. God hates people relying presumptuously on their own powers. Like a doctor, he lances this swollen tumor in those whom he loves. By lancing it, of course, he inflicts pain, but he also ensures health later. When he rises again, the Lord entrusts his sheep to Peter, to that one who denied him. Peter denied him because he relied on himself, but later Peter would feed his flock as a pastor, because he loved him. After all, why does he ask him three times about his love, if not to prick his conscience about his threefold denial?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FSermons%2FSermon%2520285.html'
source_title="SERMON 285.3"

[[commentary]]
quote='''
How we should understand this, requires some careful consideration; for Matthew says, Peter was sitting without in the hall, which he would not have said unless the transaction relating to our Lord were passing within. Likewise also, where Mark said, And as Peter was beneath in the hall, he shows that the things he had been speaking of took place not only within but in the upper part. How then did our Lord look upon Peter? not with His bodily face, since Peter was without in the hall among those who were warming themselves, while these things were going on in the inner part of the house. Wherefore, that looking upon Peter seems to me to have been done in a divine manner. And as it was said, Look thou, and hear me, (Ps. 13:3.) and, Turn and deliver my soul, (Ps. 6:4.) so I think the expression here used, The Lord turned and looked upon Peter.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Matthew then proceeds with his narrative in these terms: "And Peter remembered the word of Jesus which He had said unto him, Before the cock crow thou shalt deny me thrice. And he went out and wept bitterly." Mark, again, gives it thus: "And Peter called to mind the word that Jesus had said unto him, Before the cock crow twice thou shall deny me thrice. And he began to weep." Luke's version is as follows: "And the Lord turned and looked upon Peter. And Peter remembered the word of the Lord, how He had said unto him, Before the cock crow thou shalt deny me thrice. And Peter went out and wept bitterly." John says nothing about Peter's recollection and weeping. Now, the statement made here by Luke, to the effect that "the Lord turned and looked upon Peter," is one which requires more careful consideration, with a view to its correct acceptance. For although there are also inner halls (or courts), so named, it was in the outer court (or hall) that Peter appeared on this occasion among the servants, who were warming themselves along with him at the fire. And it is not a credible supposition that Jesus was heard by the Jews in this place, so that we might also understand the look referred to to have been a look with the bodily eye. For Matthew presents us first with this narrative: "Then did they spit in His face and buffeted Him; and others smote Him with the palms of their hands, saying, Prophesy unto us, thou Christ, who is he that smote thee?" And then he follows this up immediately with the paragraph about Peter: "Now Peter sat without in the palace." He would not, however, have used this latter expression, had it not been the case that the things previously alluded to were done to the Lord inside the house. And, indeed, as we gather from Mark's version, these things took place not simply in the interior, but also in the upper parts of the house. For, after recording the said circumstances, Mark goes on thus: "And as Peter was beneath in the palace." Thus, as Matthew's words, "Now Peter sat without in the palace," show us that the things previously mentioned took place inside the house, so Mark's words, "And as Peter was beneath in the palace," indicate that they were done not only in the interior, but in the upper parts of the house. But if this is the case, how could the Lord have looked on Peter with the actual glance of the bodily eye? These considerations bring me to the conclusion, that the look in question was one cast upon Peter from Heaven, the effect of which was to bring up before his mind the number of times he had now denied [his Master], and the declaration which the Lord had made to him prophetically, and in this way (the Lord thus looking mercifully upon him), to lead him to repent, and to weep salutary tears. The expression, therefore, will be a parallel to other modes of speech which we employ daily, as when we thus pray, "Lord, look upon me;" or as when, in reference to one who has been delivered by the divine mercy from some danger or trouble, we say that the "Lord looked upon him." In the Scriptures, also, we find such words as these: "Look upon me and hear me;" and "Return, O Lord, and deliver my soul." And, according to my judgment, a similar view is to be taken of the expression adopted here, when it is said that "the Lord turned and looked upon Peter; and Peter remembered the word of the Lord." Finally, we have to notice how, while it is the more usual practice with the evangelists to employ the name "Jesus" in preference to the word "Lord" in their narratives, Luke has used the latter term exclusively in the said sentence, saying expressly, "The 'Lord' turned and looked upon Peter; and Peter remembered the word of the 'Lord:'" whereas Matthew and Mark have passed over this "look" in silence, and consequently have said that Peter remembered not the word of the "Lord," but the word of "Jesus." From this, therefore, we may gather that the "look" thus proceeding from Jesus was not one with the eyes of the human body, but a look cast from Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25203.html'
source_title="The Harmony of the Gospels, Book 3, Chapter 6"
