[[commentary]]
quote='''
When he said: The wrath of God is revealed from heaven against all ungodliness, and so on, Solomon too says concerning the wise men of the world: For if they were able to know so much that they could estimate the world, how did they not more easily find the Lord and Creator of that very world? But those whom Solomon reproves did not come to know the Creator through the creature; whereas those whom the Apostle reproves did know him, but they did not give thanks, and while saying that they were wise they became fools and fell to worshiping idols. For that the wise men of the nations found the Creator, the same Apostle clearly showed when he was speaking with the Athenians. For when he had said: For in him we live and move and are, he added: As certain ones among you also have said. But with this intention he first reproves the ungodliness of the Gentiles, that from it he may prove that even those converted can attain to grace. For it is unjust that they should undergo the penalty of ungodliness and not receive the reward of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
