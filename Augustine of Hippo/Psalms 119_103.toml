[[commentary]]
quote='''
Consider then what followeth: “O how sweet are Thy words unto my throat!” (ver. 103). Or, as it is more literally rendered from the Greek, “Thy utterances, above honey and the honeycomb unto my mouth.” This is that sweetness which the Lord giveth, “So that the earth yield her increase:” that we do good truly in a good spirit, that is, not from the dread of carnal evil, but from the gladness of spiritual good. Some copies indeed do not read “honeycomb:” but the majority do. Now the open teaching of wisdom is like unto honey; but that is like the comb which is squeezed from the more recondite mysteries, as if from cells of wax, by the mouth of the teacher, as if he were chewing it: but it is sweet to the mouth of the heart, not to the mouth of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520119.html'
source_title="Exposition on Psalm 119"
