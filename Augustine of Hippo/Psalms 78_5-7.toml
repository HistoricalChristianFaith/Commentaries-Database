[[commentary]]
quote='''
“How great things,” he saith, “He hath commanded our fathers, to make the same known to their sons?” (ver. 5). “That another generation may know, sons who shall be born and shall rise up, and they may tell to their sons” (ver. 6). “That they may put their hope in God, and may not forget the works of God, and may seek out His commandments” (ver. 7). “That they may not become, like their fathers, a crooked and embittering generation: a generation that hath not guided their heart, and the spirit thereof hath not been trusted with God” (ver. 8). These words do point out two peoples as it were, the one belonging to the Old Testament, the other to the New: for in that he saith, he hath implied that they received the commandments, “to make them known to their sons,” but that they did not know or do them: but they received them themselves, to the end “that another generation might know,” what the former knew not. “Sons who shall be born and shall arise.” For they that have been born have not arisen: because they had not their heart above, but rather on the earth. For the arising is with Christ: whence hath been said, “If ye have arisen with Christ, savour ye the things which are above.” “And they may tell them,” he saith, “to their sons, in order that they may put their hope in God.”…“And may not forget the works of God:” that is to say, in magnifying and vaunting their own works, as though they did them themselves; while “God it is that worketh,” in them that work good things, “both to will and to work according to good will.” “And may search out His commandments.”…The commandments which He hath commanded. How then should they still search out, whereas they have already learned them, save that by putting their hope in God, they do then search out His commandments, in order that by them, with His aid, they may be fulfilled?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252078.html'
source_title="Exposition on Psalm 78"
