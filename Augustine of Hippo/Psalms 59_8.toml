[[commentary]]
quote='''
“And Thou, Lord, shalt deride them” (ver. 8). All nations are to be Christian, and ye say, “Who hath heard?” What is, “shalt deride them”? “As nothing Thou shalt esteem all nations.” Nothing for Thee it shall be; because a most easy thing it will be for all nations to believe in Thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252059.html'
source_title="Exposition on Psalm 59"
