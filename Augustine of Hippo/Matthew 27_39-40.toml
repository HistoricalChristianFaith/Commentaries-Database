[[commentary]]
quote='''
That crucified One at whom insults were cast, and while He hung on the cross His persecutors wagging the head, and saying. "If he be the Son of God, let him come down from the cross," -He, and no other, is our complete Physician. Wherefore, then, did He not show to his deriders that He was the Son of God; so that if He allowed Himself to be lifted up upon the cross, at least when they said, "If he be the Son of God, let him come down from the cross," He should then come down, and show to them that He was the very Son of God whom they had dared to deride? He would not. Wherefore would He not? Was it because He could not? Manifestly He could. For which is greater, to descend from the cross or to rise from the sepulchre? But He bore with His insulters; for the cross was taken not as a proof of power, but as an example of patience. There He cured thy wounds, where He long bore His own; there He healed thee of death eternal, where He vouchsafed to die the temporal death. And did He die, or in Him did death die? What a death was that, which slew death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%25203.html'
source_title="Tractates on John 3"

[[commentary]]
quote='''
Because the Jews did triumph, when they saw Christ crucified; they thought that they had fulfilled their will to do Him hurt: the fruits of their cruelty they saw in effect, Christ hanging on the Cross: they shook their heads, saying, “If Thou be the Son of God, come down from the Cross.” He came not down, who could; His Potency He showed not, but patience taught. For if, on their saying these things, He had come down from the Cross, He would have seemed as it were to yield to them insulting, and not being able to endure reproach, would have been believed conquered: more firm remained He upon the Cross, than they insulting; fixed was He, they wavering. For therefore shook they their heads, because to the true Head they adhered not. He taught us plainly patience. For mightier is that which He did, who would not do what the Jews challenged. For much mightier is it to rise from the sepulchre, than to come down from the Cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252041.html'
source_title="Exposition on Psalm 41"

[[commentary]]
quote='''
But why? Was not thy Lord made weak on the Cross? Did not most mighty men and fat bulls before Him, as though a man of no strength, made captive and oppressed, shake the head and say, “If Son of God He is, let Him come down from the Cross”? Has he deserted because He was made weak, who preferred not to come down from the Cross, lest He should seem not to have displayed power, but to have yielded to them reviling? What did He hanging teach thee, that would not come down, but patience amid men reviling, but that thou shouldest be strong in thy God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252071.html'
source_title="Exposition on Psalm 71"
