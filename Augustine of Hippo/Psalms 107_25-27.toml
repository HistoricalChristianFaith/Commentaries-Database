
[[commentary]]
quote='''
And what is done in them? God, willing that both they who steer, and they who are conveyed, should cry unto Him, “He spake, and the breath of the storm stood” (ver. 25). What is, stood? Abode, continued, still disturbeth, long tosseth; rageth, and passeth not away. “For He spake, and the breath of the storm stood.” And what did that breath of the storm? “They go up even to the heavens,” in daring; “They go down even into the deeps” (ver. 26), in fearing. “Their soul wasted in miseries.” “They were disturbed, and moved like a drunken man” (ver. 27). They who sit at the helm, and they who faithfully love the ship, feel what I say. Certainly, when they speak, when they read, when they interpret, they appear wise. Woe for the storm! “and all their wisdom,” he saith, “was swallowed up.” Sometimes all human counsels fail; whichever way one turns himself, the waves roar, the storm rageth, the arms are powerless: where the prow may strike, to what wave the side may be exposed, whither the stricken ship may be allowed to drift, from what rocks she must be kept back lest she be lost, is impossible for her pilots to see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
