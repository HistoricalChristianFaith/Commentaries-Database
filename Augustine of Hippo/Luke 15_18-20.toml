[[commentary]]
quote='''
The younger son went into a far country. After his toil and suffering and tribulation and want, he thought on his father, and desired to return, and said, “I will arise, and go to my father.” “I will arise,” said he, for before he had sat. Here then thou mayest recognise him saying, “Thou hast known my down-sitting and up-rising.” I sat, in want; I arose, in longing for Thy Bread. “Thou hast understood my thoughts from afar.” For far indeed had I gone; but where is not He whom I had left? Wherefore the Lord saith in the Gospel, that his father met him as he was coming. Truly; for “he had understood his thoughts from afar.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520139.html'
source_title="Exposition on Psalm 139"
