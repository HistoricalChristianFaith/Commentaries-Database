[[commentary]]
quote='''
It is possible for a good to be performed when there is no yielding to evil lust, but the good is completed or perfected only when evil lust itself no longer exists.
'''
source_url='https://www.newadvent.org/fathers/1308.htm'
source_title="On Continence 3.6"

[[commentary]]
quote='''
Paul says that the evil of the flesh is not good but that when this evil has ceased to exist the flesh will still be there, but … then it will not be defective or corrupt.
'''
source_url='https://www.newadvent.org/fathers/1308.htm'
source_title="On Continence 8.19"

[[commentary]]
quote='''
And what did that righteous man wish, who with the mind was serving the law of God, but that there should be a complete deliverance from that which needed to be bridled? And this ought every one to be striving after who is aiming at perfection, that lust itself also, no longer receiving the obedience of the members, may every day be lessened in the advancing pilgrim. "To will," he says, "is present with me; but not so, how to perfect that which is good." Has he said, To do good is not present with me? Had he said so, hope would be wanting. He does not say, To do is not present with me, but, "To perfect is not present with me." For what is the perfecting of good, but the elimination and end of evil? And what is the elimination of evil, but what the law says, "Thou shalt not lust [covet]"? To lust not at all is the perfecting of good, because it is the eliminating of evil. This he said, "To perfect that which is good is not present with me," because his doing could not get the length of setting him free from lust. He labored only to bridle lust, to refuse consent to lust, and not to yield his members to its service. "To perfect," then, he says, "that which is good is not present with me." I cannot fulfill the commandment, "Thou shalt not lust." What then is needed? To fulfill this: "Go not after thy lusts." Do this meanwhile so long as unlawful lusts are present in thy flesh; "Go not after thy lusts." Abide in the service of God, in the liberty of Christ. With the mind serve the law of thy God. Yield not thyself to thy lusts. By following them, thou addest to their strength. By giving them strength, how canst thou conquer, when on thine own strength thou art nourishing enemies against thyself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%252041.html'
source_title="Tractates on John 41"
