[[commentary]]
quote='''
For "the chief priests answered, We have no king but Caesar. Then delivered he Him therefore unto them to be crucified." For he would have every appearance of acting against Caesar if, on their declaration that they had no king but Caesar, he were wishing to impose on them another king by releasing without punishment one whom for these very attempts they had delivered unto him to be put to death. "Therefore he delivered Him unto them to be crucified." But was it, then, anything different that he had previously desired when he said, "Take ye him, and crucify him;" or even earlier still, "Take ye him, and judge him according to your law?" And why did they show so great reluctance, when they said, "It is not lawful for us to put any man to death," and were in every way urgent to have Him slain not by themselves, but by the governor, and therefore refused to receive Him for the purpose of putting Him to death, if now for the same purpose they actually do receive Him? Or if such be not the case, why was it said, "Then delivered he Him therefore unto them to be crucified?" Or is it of any importance? Plainly it is. For it was not said, "Then delivered he Him therefore unto them" that they might crucify Him, but "that He might be crucified," that is, that He might be crucified by the judicial sentence and power of the governor. But it is for this reason that the evangelist has said that He was delivered to them, that he might show that they were implicated in the crime from which they tried to hold themselves aloof; for Pilate would have done no such thing, save to implement what he perceived to be their fixed desire. The words, however, that follow, "And they took Jesus, and led Him away," may now refer to the soldiers, the attendants of the governor. For it is more clearly stated afterwards, "When the soldiers therefore had crucified Him," although the evangelist properly does so even when he attributes the whole to the Jews, for they it was that received what they had with the utmost greediness demanded, and they it was that did all that they compelled to be done. But the events that follow must be made the subject of consideration in another discourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FTRACTATES%2520ON%2520JOHN%2FTractate%2520116.html'
source_title="Tractates on John 116"
