[[commentary]]
quote='''
There will then be such a common accord between flesh and Spirit—the Spirit quickening the servant flesh without any need of sustenance from it. There will be no further conflict within ourselves. And just as there will be no more external enemies to bear with, so neither shall we have to bear with ourselves as enemies within.
'''
source_url='https://www.newadvent.org/fathers/1302.htm'
source_title="Enchiridion 23.91"

[[commentary]]
quote='''
In many bloods, as in the origin of the sinful flesh, many sins he would have to be understood. The Apostle having regard to the very sins which come of the corruption of flesh and blood, saith, “Flesh and blood shall not possess the kingdom of God.” For doubtless, after the true faith of the same Apostle, that flesh shall rise again and shall itself gain incorruption, as He saith Himself, “This corruptible must put on incorruption, and this mortal put on immortality.” Because then this corruption is of sin, by the name thereof sins are called. In like manner as both that morsel of flesh and member which playeth in the mouth when we articulate words is called a tongue, and that is called a tongue which by the tongue is made, so we call one tongue the Greek, another the Latin; for the flesh is not diverse, but the sound. In the same manner, then, as the speech which is made by the tongue is called a tongue; so also the iniquity which is made by blood is called blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252051.html'
source_title="Exposition on Psalm 51"
