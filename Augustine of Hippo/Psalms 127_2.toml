[[commentary]]
quote='''
If we wish to be guarded by Him who was humbled for our sakes, and who was exalted to keep us, let us be humble. Let no one assume anything unto himself. No man hath any good, except he hath received it from Him who alone is good. But he who chooseth to arrogate wisdom unto himself, is a fool. Let him be humble, that wisdom may come, and may enlighten him. But if, before wisdom cometh unto him, he imagine that he is wise; he riseth before light, and walketh in darkness. What doth he hear in this Psalm? “It is but lost labour that ye haste to rise up before dawn” (ver. 2). What meaneth this? If ye arise before light ariseth, ye must needs lose your labour, because ye will be in the dark. Our light, Christ, hath arisen; it is good for thee to rise after Christ, not to rise before Christ. Who rise before Christ? They who choose to prefer themselves to Christ. And who are they who wish to prefer themselves to Christ? They who wish to be exalted here, where He was humble. Let them, therefore, be humble here, if they wish to be exalted there, where Christ is exalted.…The Lord recalled the sons of Zebedee to humility, and said unto them, “Are ye able to drink of the cup that I shall drink of?” I came to be humble: and are ye wishing to be exalted before Me? The way I go, do ye follow, He saith. For if ye choose to go this way where I do not go, your labour is lost, in rising before dawn. Peter too had risen before the light, when he wished to give the Lord advice, deterring Him from suffering for us.…But what did our Lord do? He caused him to rise after the Light: “Get thee behind Me, Satan.” He was Satan, because he wished to rise before Light. “Get thee behind Me:” that I may precede, thou mayest follow: where I go, there thou mayest go; and mayest not wish to lead Me, where thou wouldest go.…

And as if thou shouldest say, When shall we rise? we are ordered now to sit: when will be our rising? When the Lord’s was. Look unto Him, who went before thee: for if thou heedest not Him, “it is lost labour for thee to rise before dawn.” When was He raised? When He had died. Hope therefore for thine uplifting after thy death: have hope in the resurrection of the dead, because He rose again and ascended. But where did He sleep? On the Cross. When He slept on the Cross, He bore a sign, yea, He fulfilled what had been signified in Adam: for when Adam was asleep, a rib was drawn from him and Eve was created; so also while the Lord slept on the Cross, His side was transfixed with a spear, and the Sacraments flowed forth, whence the Church was born. For the Church the Lord’s Bride was created from His side, as Eve was created from the side of Adam. But as she was made from his side no otherwise than while sleeping, so the Church was created from His side no otherwise than while dying. If therefore He rose not from the dead save when He had died, dost thou hope for exaltation save after this life? But that this Psalm might teach thee, in case thou shouldest ask, When shall I rise? perhaps before I have sat down? he addeth, “When He hath given His beloved sleep” (ver. 3). God giveth this when His beloved have fallen asleep; then His beloved, that is, Christ’s, shall rise. For all indeed shall rise, but not as His beloved. There is a resurrection of all the dead; but what saith the Apostle? “We shall all rise, but we shall not all be changed.” They rise unto punishment: we rise as our Lord rose, that we may follow our Head, if we are members of Him.…Hope for such a resurrection; and for the sake of this be a Christian, not for the sake of this world’s happiness. For if thou wish to be a Christian for the sake of this world’s happiness, since He thy Light sought not worldly happiness; thou art wishing to rise before the light; thou must needs continue in darkness. Be changed, follow thy Light; rise where He rose again: first sit down, and thus rise, “when He giveth His beloved sleep.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520127.html'
source_title="Exposition on Psalm 127"
