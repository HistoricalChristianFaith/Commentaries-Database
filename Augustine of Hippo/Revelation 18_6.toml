[[commentary]]
quote='''
Observe how the nations of Babylon are slain. She is repaid twofold: for so is it written of her, “repay her double for what she hath done.” How is she repaid double? The saints wage war, they draw their “swords twice sharpened;” thence come defeats, slaughters, severances: how is she repaid double? When she had power to persecute the Christians, she slew the flesh indeed, but she crushed not God: now she is repaid double, for the Pagans are extinguished and the idols are broken.…
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520149.html'
source_title="Exposition on Psalm 149"
