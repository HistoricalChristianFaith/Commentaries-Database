[[commentary]]
quote='''
In this narrative, then, which we have undertaken to consider at present, all these three evangelists indeed are unquestionably at one in the account which they give of the woman who was afflicted with the issue of blood. Nor is it a matter of any real consequence, that something which is passed by in silence by one of them is related by another; or that Mark says, "Who touched my clothes?" while Luke says, "Who touched me?" For the one has only adopted the phrase in use and wont, whereas the other has given the stricter expression. But for all that, both of them convey the same meaning. For it is more usual with us to say, "You are tearing me," than to say, "You are tearing my clothes;" as, notwithstanding the term, the sense we wish to convey is obvious enough.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25202.html'
source_title="The Harmony of the Gospels, Book 2, Chapter 28"
