[[commentary]]
quote='''
Now these three kinds of vice, namely, the pleasure of the flesh, and pride, and curiosity, include all sins. And they appear to me to be enumerated by the Apostle John, when he says, “Love not the world; for all that is in the world is the lust of the flesh, and the lust of the eyes, and the pride of life.” For through the eyes especially prevails curiosity. To what the rest indeed belong is clear. And that temptation of the Lord Man was threefold: by food, that is, by the lust of the flesh, where it is suggested, “command these stones that they be made bread:” by vain boasting, where, when stationed on a mountain, all the kingdoms of this earth are shown Him, and promised if He would worship: by curiosity, where, from the pinnacle of the temple, He is advised to cast Himself down, for the sake of trying whether He would be borne up by Angels. And accordingly after that the enemy could prevail with Him by none of these temptations, this is said of him, “When the devil had ended all his temptation.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25208.html'
source_title="Exposition on Psalm 8"
