[[commentary]]
quote='''
Now He saith as follows; “Preserve me, O Lord, for in Thee have I hoped” (ver. 1): “I have said to the Lord, Thou art my God, for Thou requirest not my goods” (ver. 2): for with my goods Thou dost not look to be made blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252016.html'
source_title="Exposition on Psalm 16"
