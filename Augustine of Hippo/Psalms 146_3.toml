[[commentary]]
quote='''
“Put not your trust in princes” (ver. 3). Brethren, here we receive a mighty task; it is a voice from heaven, from above it soundeth to us. For now through some kind of weakness the soul of man, whensoever it is in tribulation here, despaireth of God, and chooseth to rely on man. Let it be said to one when set in some affliction, “There is a great man, by whom thou mayest be set free;” he smileth, he rejoiceth, he is lifted up. But if it is said to him, “God freeth thee,” he is chilled, so to speak, by despair. The aid of a mortal is promised, and thou rejoicest; the aid of the Immortal is promised, and art thou sad? It is promised thee that thou shalt be freed by one who needeth to be freed with thee, and thou exultest, as at some great aid: thou art promised that Liberator, who needeth none to free Him, and thou despairest, as though it were but a fable. Woe to such thoughts: they wander far; truly there is sad and great death in them. Approach, begin to long, begin to seek and to know Him by whom thou wast made. For He will not leave His work, if He be not left by His work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520146.html'
source_title="Exposition on Psalm 146"
