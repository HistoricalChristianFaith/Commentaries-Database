
[[commentary]]
quote='''
“And He helped the poor out of beggary” (ver. 41). What meaneth this, brethren? Princes are despised, and the poor helped. The proud are cast aside, and the humble provided for.…“And made him households like sheep.” Thou understandest one poor man and one beggar of him concerning whom he said, “He hath helped the poor out of misery:” this poor man is now many households, this poor man is many nations; many Churches are one Church, one nation, one household, one sheep. These are great mysteries, great types, how profound, how full of hidden meanings; how sweetly discovered, since long hidden. Therefore, “the righteous will consider this, and rejoice: and the mouth of all wickedness shall be stopped” (ver. 42). That wickedness that doth prate against unity, and compelleth truth to be made manifest, shall be convicted, and have its mouth stopped.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520107.html'
source_title="Exposition on Psalm 107"
