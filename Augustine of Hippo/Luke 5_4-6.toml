[[commentary]]
quote='''
Luke, then, commences his Gospel in the following fashion: "There was in the days of Herod the king of Judæa, a certain priest named Zacharias, of the course of Abia: and his wife was of the daughters of Aaron, and her name was Elisabeth;"and so on, down to the passage where it is said, "Now when He had left speaking, He said unto Simon, Launch out into the deep, and let down your nets for a draught." In this whole section, there is nothing to stir any question as to discrepancies. It is true that John appears to relate something resembling the last passage. But what he gives is really something widely different. I refer to what took place by the sea of Tiberias after the Lord's resurrection. In that instance, not only is the particular time extremely different, but the circumstances themselves are of quite another character. For there the nets were cast on the right side, and a hundred and fifty and three fishes were caught. It is added, too, that they were great fishes. And the evangelist, therefore, has felt it necessary to state, that "for all there were so many, yet was not the net broken," surely just because he had in view the previous case, which is recorded by Luke, and in connection with which the nets were broken by reason of the multitude of fishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FThe%2520Harmony%2520of%2520the%2520Gospels%2FBook%25204.html'
source_title="The Harmony of the Gospels, Book 4, Chapter 9"
