[[commentary]]
quote='''
“Tremble, thou earth, at the presence of the Lord, at the presence of the God of Jacob” (ver. 7). What meaneth, “at the presence of the Lord,” save at the presence of Him who said, “Lo, I am with you alway, even unto the end of the world.” For the earth trembled; but because it had remained slothful, it was made to tremble, so that it might be more firmly fixed at the presence of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%2520114.html'
source_title="Exposition on Psalm 114"
