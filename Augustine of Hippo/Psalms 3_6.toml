[[commentary]]
quote='''
“I will not fear the thousands of people that surround me” (ver. 6). It is written in the Gospels how great a multitude stood around Him as He was suffering, and on the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%25203.html'
source_title="Exposition on Psalm 3"
