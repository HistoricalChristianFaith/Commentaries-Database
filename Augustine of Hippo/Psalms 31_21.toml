[[commentary]]
quote='''
“Blessed be the Lord; for He hath made His mercy marvellous, in the city of compassing” (ver. 21). Blessed be the Lord, for after the correction of the sharpest persecutions He hath made His mercy marvellous to all throughout the world, in the circuit of human society.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FON%2520THE%2520PSALMS%2FPsalm%252031.html'
source_title="Exposition on Psalm 31"
