[[commentary]]
quote='''
When he says: It is therefore not of him who wills, nor of him who runs, but of God who shows mercy, he does not take away free will, but says that our willing is not sufficient unless God helps us, by making us merciful for working well, through the gift of the Holy Spirit—referring this to what he said above: I will have mercy on whom I will have mercy, and I will show mercy to whom I will be merciful. Because we can neither will unless we are called; and when, after the calling, we have willed, our will and our running are not sufficient, unless God both supplies strength to those who run and leads them where he calls. It is clear, therefore, that our working well is not of him who wills nor of him who runs, but of God who shows mercy—although our will is there too, which by itself could do nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"
