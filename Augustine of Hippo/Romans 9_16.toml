[[commentary]]
quote='''
When he says: It is therefore not of him who wills, nor of him who runs, but of God who shows mercy, he does not take away free will, but says that our willing is not sufficient unless God helps us, by making us merciful for working well, through the gift of the Holy Spirit—referring this to what he said above: I will have mercy on whom I will have mercy, and I will show mercy to whom I will be merciful. Because we can neither will unless we are called; and when, after the calling, we have willed, our will and our running are not sufficient, unless God both supplies strength to those who run and leads them where he calls. It is clear, therefore, that our working well is not of him who wills nor of him who runs, but of God who shows mercy—although our will is there too, which by itself could do nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FExposition%2520of%2520Certain%2520Propositions%2520from%2520the%2520Epistle%2520to%2520the%2520Romans.html'
source_title="Exposition of Certain Propositions from the Epistle to the Romans"

[[commentary]]
quote='''
In the second clause he says, "I have finished my course." Now, who is it that says this, but he who declares in another passage, "So then it is not of him that willeth, nor of him that runneth, but of God that showeth mercy." And this sentence can by no means be transposed, so that it could be said: It is not of God, who showeth mercy, but of the man who willeth and runneth. If any person be bold enough to express the matter thus, he shows himself most plainly to be at issue with the apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Augustine%2520of%2520Hippo%2FA%2520Treatise%2520on%2520Grace%2520and%2520Free%2520Will.html'
source_title="On Grace and Free Will, Chapter 16"
