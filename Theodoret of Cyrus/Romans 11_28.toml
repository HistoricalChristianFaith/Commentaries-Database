[[commentary]]
quote='''
As concerning the gospel they are enemies for your sakes: but as touching the election they are beloved for the fathers' sakes. When I look to you, with whose instruction I am entrusted, I consider them as enemies and hateful, as doing all in their power to your injury; but when I turn to their forefathers, and reflect how God chose them from among the whole earth, on their account I love even these.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
