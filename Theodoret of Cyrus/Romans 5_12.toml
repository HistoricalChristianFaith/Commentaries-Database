[[commentary]]
quote='''
Wherefore, as by one man sin entered into the world, and death by sin, and so death passed upon all men, in that all have sinned. The Lord God having formed Adam, and dignified him with reason, imposed on him one single law for the exercise of those rational faculties; for indeed it was not meet that one who had received reason, and possessed the power of discriminating between good and its opposite, should live without any law at all. He, having been beguiled, transgressed the command. But, from the first, the lawgiver had to the command affixed the threat of retribution, and thus, falling under the sentence of death, he so begot Cain, Seth, and the rest. All therefore, as having sprung from him, inherited a mortal nature. Now such a nature has need of many things, food, and drink, and clothing, and houses, and various arts, and the use of these oftentimes excites the passions into excess, and excess begets sin; and therefore the holy apostle says, that Adam having sinned, and become mortal through that sin, both descended to his race, for death came upon all men, in that all have sinned, for not on account of our first father's transgression, but for his own, each receives the sentence of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
