[[commentary]]
quote='''
And if Christ be in you, the body indeed is dead, with regard to sin, but the spirit is life, as regards righteousness. He makes clear what had been ambiguous, and shows that it was not the mere flesh itself that he is condemning, but sin; for he bids the body be dead to sin, that is not to commit sin; and the soul is what he here speaks of as the spirit, in its having become already spiritual; here he enjoins to follow after righteousness, whose exceedingly desirable fruit is life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
