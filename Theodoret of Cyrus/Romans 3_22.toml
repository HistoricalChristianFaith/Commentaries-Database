[[commentary]]
quote='''
Even the righteousness of God, which is by faith of Jesus Christ unto all and upon all that believe. What had been before put down is here repeated, that what was wanting might be added; for having said the righteousness of God is manifested, and then interrupted the sentence to speak of its character, it was necessary that he should resume the phrase again, and show that it was by faith in the Lord Christ that all who desired to do so enjoyed it, whether Jews or Greeks; the unto all refers to the Jews, the upon all to the other nations; and this he goes on to set forth more clearly—For there is no difference:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
