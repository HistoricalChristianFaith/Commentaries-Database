[[commentary]]
quote='''
They are benevolently inclined verily, and their debtors they are; and whence arose this debt? For if the Gentiles have been made partakers of their spiritual things, their duty is also to minister unto them in carnal things. To them, says he, appertained the Patriarchs as their forefathers; to them the promises were made; their prophets it was who prophesied the blessings now common to both; of them according to His human nature was the Lord Christ; of them the Apostles the teachers of the whole world; through them have the gifts of the Spirit been shed abroad; it is right then that they who have imparted of the greater, should in return receive of the lesser; wherefore also he above calls the contribution of money a communication, and again afterwards a ministry; by the expression communication shewing it to be a repayment, and by that of ministry a tribute due.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
