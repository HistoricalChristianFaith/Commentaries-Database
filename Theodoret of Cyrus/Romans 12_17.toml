[[commentary]]
quote='''
Recompensing to no man evil for evil; and this indeed is an excellence belonging to virtue in its highest state of perfection, and approaching near to a total emancipation from the passions. Providing things honest in the sight of all men; and he says also elsewhere, "Give none offence, neither to the Jews, nor to the Gentiles, nor to the Church of God." (1 Cor. x. 32.)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
