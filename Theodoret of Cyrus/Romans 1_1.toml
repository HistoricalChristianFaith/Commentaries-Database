[[commentary]]
quote='''
Various and comprehensive is the doctrine which the holy apostle unfolds in the present epistle. Its general scope is this:—worthy of all awe and adoration to the sincere believer as is the mystery of the divine incarnation, clearly manifesting, as it does, the loving mercy of God; they nevertheless who are involved in the darkness of infidelity, and have not admitted the light of intellectual illumination, scorn that which not even the company of angels can worthily celebrate, as the inspired apostle distinctly says in his Epistle to the Corinthians (I Cor. i. 18). "For the preaching of the cross is to them that perish foolishness, but to them that are saved it is the power of God." In this Epistle to the Romans, therefore, he exhibits the indispensable necessity of this saving gospel, together with its utility and advantage to all mankind, Jews or Greeks. In order to which, in the first place he convicts the Greeks of having palpably corrupted the moral sense of good and evil, implanted in their constitution by their Maker, and transgressed the natural law; and secondly, the Jews of having, although in the enjoyment of the written instructions of the divine laws, yet rejected the benefit arising from them, and rendered themselves thereby obnoxious to the heavier retribution. After this, he shows that our God and Saviour came not for the condemnation and punishment of sinners, but to bring pardon for their offences, to promise victory over death, and proclaim eternal life.

Again, perceiving that the Jews clung but too much to the law, and those who savoured of the errors of Marcion and Valentine, with the Manichees, too much altogether undervalued and condemned it, as an expert general surrounded on all sides by his enemies strikes down first one, and then the other, so does the holy apostle break in pieces, by divine grace, the band of the heretics, and all the array of the Jews. For how does he conduct the argument? By neither elevating the law too high, because of the extravagance of the Jews, nor giving any occasion for reproach to the profane heretics, but demonstrating that it taught all that was needful, and brought in the doctrine of justification, although incompetent to convey justification itself by reason of the infirmity of those under it; and showing that faith brings to effect the design of the law, and what it fain would do, but cannot, it perfects through the grace of the thrice holy Spirit. By all which we learn, how continually regardful of mankind is God our Creator, in that not only did he implant in our nature the power of discriminating between good and evil, but also by the very works of his creation led such as were willing to piety and holiness, for although all were not thus willing to see the truth, they who were had full enjoyment of it, as they desired.

He next further instructs us, that the God of all turned not to this plan of our salvation, as though in a change of council from any of his former designs, but as having long ago foretold it in the ancient prophets; he sets forth the cause of the rejection of the Jews; and admonishes the believing Gentiles not to boast over them; exhorting them to lead the way in the gospel. With these doctrinal lessons he joins recommendations to practical virtue, at once displaying the truth, and reforming the morals. Such then is the general argument of the epistle, all the particulars in which the interpretation of the separate passages will now clearly make known to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"

[[commentary]]
quote='''
Paul, a servant of Jesus Christ, called an Apostle. Governors and generals superscribe their letters with the designations of their respective dignities, priding themselves thereon, and puffed up in fancied greatness by each fresh tide of honour; the holy apostle is content to call himself "one born out of due time," and "the chief of sinners," and to pronounce himself " unworthy the apostleship;" while yet, for the benefit of such as should receive his epistles, he prefixes to them the appellations which by grace he had obtained, that so, by seeing the honours belonging to the writer, they might the more readily and zealously welcome them. And he begins by Paul, not as having been so named of old by his parents, but as preferred to it after his call, as was Simon to that of Peter, and the sons of Zebedee to those of Sons of Thunder, Jacob to that of Israel, and Abram to that of Abraham. Next, servant of Jesus Christ, whom infidels reviled as dead and crucified, and a mere carpenter's son, and yet whose service the apostle notwithstanding chose above any sovereignty.

Then he speaks of himself as called, alluding to his divine call, and adds the name an apostle, teaching us that this also he had gained. For since our Lord gave this designation to the twelve, so the holy apostle here also places it, not as in a presumptuous self-assumption thereof, but as having had it bestowed upon him by his Master himself. "For depart," said he unto him, "because I will send thee far hence unto the Gentiles," (Acts xxii. 21;) and this he farther proves by what follows, namely; separated unto the gospel of God. I am not self-elected, exclaims he, but have been entrusted with the ministry of the word by God himself. Now it was the Father, and the Son, and the Holy Ghost, who thus set him apart; for that the Father did so, he himself declares in his Epistle to the Galatians (i. 15, 16). " It pleased God, who separated me from my mother's womb, and called me by his grace, to reveal his Son in me; that I might preach him among the heathen and that, again, the only-begotten Son did this likewise, is evident where the apostle tells us in the Acts (xxiii. 21) how the Lord was seen of him in the temple, commanding him to hasten and go out, because the Jews would not receive his preaching, adding, "Depart, for I will send thee far hence unto the Gentiles."

And the very same thing he said to Ananias, when he was hesitating and drawing back, (Acts ix. 15;) "Go thy way, for this man is a chosen vessel unto me, to bear my name before the Gentiles, and kings, and the children of Israel." And so St Luke also tells us, (xiii. 2,) that "as the prophets were ministering unto the Lord, and fasting, the Holy Ghost said, Separate me Barnabas and Saul for the work whereunto I have called them." Evident therefore from hence is the equality of the Trinity. And so also the gospel he now speaks of as the gospel of God, and a little onward as the gospel of the Son, saying, " for God is my witness, whom I serve with my spirit in the gospel of his Son." This I have not noted on idly, or to no purpose, but in order to point out how indifferently the teachers of the truth mention the same things, sometimes as those of the Father, and sometimes as those of the Son.

The doctrines also preached he designates as the gospel, because they promise the supply of so many blessings, announcing reconciliation with God, the overthrow of the devil, forgiveness of sins, conquest over death, the resurrection of the deceased, eternal life, and the kingdom of heaven. Having then thus stated that he had been separated to the gospel of God, the holy apostle next proceeds immediately to prove in the first place its antiquity, lest any should be foolish enough to except against it as a novelty, and so reject it; and says,
'''
