[[commentary]]
quote='''
For the Scripture saith, (Isa. xxviii. 10,) Whosoever believeth on Him shall not be ashamed: and he explains the whosoever, For there is no difference between the Jew and the Greek; for the same Lord over all is rich unto all that call upon Him. For (Joel iii. 5,) whosoever shall call upon the name of the Lord shall be saved. The salvation of men is what he here calls the riches of God, for he well knew the loving-kindness of the Lord; and most aptly does he suit his testimonies to the heart, and to the tongue; to the heart, the whosoever believeth on Him shall not be ashamed; to the tongue, the whosoever shall call upon the name of the Lord shall be saved. And then he shows that the Jews had voluntarily deprived themselves of salvation, by not choosing to receive the gospel offered, while yet he puts not forth this proof nakedly, but brings about the argument in a different way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
