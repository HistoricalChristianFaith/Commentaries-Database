[[commentary]]
quote='''
For the wrath of God is revealed from heaven against all ungodliness, and unrighteousness of men, who hold the truth in ungodliness. For nature taught them both that God was the Maker of all things, and that they ought to avoid unrighteousness, and seek righteousness; but they used not the instructions which it gave as they ought to have done; wherefore he threatened them with future punishment.

He here puts the word revealed, in that disbelievers who hearkened not to those threats were the very persons who should experience the truth of what he said. And vengeance he calls the wrath of God; not that God punishes with any passion of mind, but that by giving it so awful a name he might alarm the gainsayer. And he says, is revealed from heaven, because our God and Saviour will appear from thence, as the Lord himself declares, (Mark xiii. 26,) "Then shall ye see the Son of Man coming in the clouds of heaven, with power and great glory."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
