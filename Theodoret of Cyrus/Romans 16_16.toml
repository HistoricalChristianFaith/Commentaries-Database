[[commentary]]
quote='''
Salute one another, says he, with an holy kiss. For, as being absent he could not himself salute them, he does it through them, enjoining them to salute one another, and to salute with an holy kiss, chaste, modest, sincere, and true, and void of all deceit. All the churches of Christ salute you. From the whole world, so to speak, he salutes the Empress of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
