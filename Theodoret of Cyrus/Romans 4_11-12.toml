[[commentary]]
quote='''
And he received the sign of circumcision, a seal of the righteousness of the faith which he had yet being uncircumcised. Circumcision itself, says he, is not righteousness, but a testimony of righteousness, and a seal and sign of that faith, which he had exhibited before he was circumcised. That he might be the father of all them that believe, though they be not circumcised; that righteousness might be imputed unto them also. And the father of circumcision. Here we must make a full stop. For herein he shows that the patriarch first was the father of such as believed, being uncircumcised, inasmuch as he himself, while uncircumcised, offered to God the tribute of faith; and then of the Jews also, as of those who were sharers with him in the circumcision; and this he lays down again, yet more clearly, in what follows, Not to them only who are of the circumcision, but to them also who walk in the steps of that faith of our father Abraham, which he had while yet uncircumcised. For if any one sprung from the Gentiles, and not having received circumcision, should follow in the footsteps of that faith of the patriarch, which he had before his own circumcision, he would not fail of relationship to him; in that the God of all, foreseeing, as God, that He would hereafter gather together one people of the Gentiles, and the Jews, and extend to them salvation through faith, represented both of old in the patriarch Abraham. And thus then he calls him the father of the Gentiles, in having shown that he had acquired, before his circumcision, the righteousness which is of faith, and after his circumcision, had not walked under the Mosaic law, but continued under the guidance of the same faith; in order that both Jews and Greeks, looking to him, might in common aim at his faith, neither the one anxious for his circumcision, nor the other his uncircumcision, for it is neither circumcision nor uncircumcision, but faith which the holy Scripture speaks of as (the mean of v. 3, 5, 9, &c.) righteousness.

Having thus shown that faith was both older and more excellent than the law, he now also shows that the law was subsequent to the promise given to Abraham, in order thereby to make it manifest that (the covenant of) grace was itself also anterior to the law, seeing that of this it was, that the promises were given to Abraham; for the promise was, that "in his seed all the nations should be blessed," which promise received its accomplishment in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
