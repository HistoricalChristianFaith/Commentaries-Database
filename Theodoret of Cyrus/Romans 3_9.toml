[[commentary]]
quote='''
We have already said, that the holy apostle was desirous of showing the necessity of the incarnation of our God and Saviour Jesus Christ; on which account he began by speaking of those, who were strangers to, as well as those also who were under, the law, and convicted the former of having transgressed the natural, and the latter the Mosaic, law, and become worthy of the deepest punishment. Herein does he imitate a skilful physician, who first points out to his patients the virulent nature of their disorder, and then so offers the assistance of his healing remedies. For this he also does; having exhibited the sin of both parties, and proved them deserving of, and obnoxious to, punishment, he next produces his medicine of faith, and sets forth the loving-kindness of the divine dispensation, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
