[[commentary]]
quote='''
Let love be without simulation. He bids all things be done with earnestness. And the oversight he orders to be exercised with zeal, that it be not the name without the thing; and to shewing bounty he joins joy, in order to point out the gain that arises from communicating to others; seeing that they who gain are wont to rejoice; for so also he says in his epistle to the Corinthians (2 Ep. ix. 7); "not grudgingly or of necessity, for God loveth a cheerful giver;" and love He commands to be genuine and sincere, and repudiates the mask of pretence. Abhorring that which is evil, clinging to that which is good. Again he says not simply to fly from the former, and follow after the latter, but exhorts us exceedingly to hate sin, and to the performance of good deeds bids us closely be connected, our affections serving thereto as it were a cement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
