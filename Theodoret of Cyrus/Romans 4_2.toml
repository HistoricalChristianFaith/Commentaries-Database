[[commentary]]
quote='''
For if Abraham were justified by works he hath whereof to glory, but not before God. The full performance of good works crowns the doers with the prize, but does not exhibit the loving-kindness of God; while faith sets forth both the disposition of the believer towards God, and the loving-kindness of God, who by accepting such faith proclaims him who has acquired it, victorious. And this he confirms by the testimony of Scripture,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
