[[commentary]]
quote='''
But they have not all obeyed the gospel? and then again in reply, Esaias saith, (liii. 1,) Lord, who hath believed our report? Nor has Scripture been silent on this point either, but of old God predicted all this by Isaiah; and then as drawing his conclusion,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
