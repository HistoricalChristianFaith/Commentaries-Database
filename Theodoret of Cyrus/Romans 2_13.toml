[[commentary]]
quote='''
For not the hearers of the law are just before God, but the doers of the law shall be justified. For the law was not sent to us to gratify our ears, but to lead us to the practice of what is right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
