[[commentary]]
quote='''
For if ye live after the flesh ye shall die; after the flesh, that is, following the passions of the flesh: the death he means is that which is eternal; but if ye through the Spirit do put to death the deeds of the body, ye shall live. This superiority has (the covenant of) grace over (that of) the law, that the latter points out what is right; the former has the grace of the Spirit in addition, as an helpmate. And here indeed the holy apostle, foreseeing the corruptions of Marcion, Valentine, and Manes, uses the greatest accuracy of expression in his instructions, saying not, put to death the body, but the deeds of the body, that is, the desires of the flesh, the burstings forth of the passions, for ye have for an assistant the grace of the Spirit, and the fruit of victory is life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
