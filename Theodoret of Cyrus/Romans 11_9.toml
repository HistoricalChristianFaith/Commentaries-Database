[[commentary]]
quote='''
And David saith, (Ps. lxviii. 22,) Let their table be made a snare, and a trap, and a stumbling-block, and a recompense unto them; Let their eyes be darkened that they may not see, and bow down their back alway. By the word table he speaks of their luxurious living, which he prophesied would be exchanged for the reverse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
