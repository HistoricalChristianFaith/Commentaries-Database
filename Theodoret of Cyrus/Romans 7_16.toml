[[commentary]]
quote='''
If then I do that which I would not, I consent unto the law that it is good. For the very hatred I have for sin, I have received from the law, wherefore I bear testimony to the law, and acknowledge its excellence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
