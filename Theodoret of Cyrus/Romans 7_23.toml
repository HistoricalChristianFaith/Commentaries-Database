[[commentary]]
quote='''
But I see another law in my members warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members. By the law of sin he means sin itself, and this works within me by the passions of the body leaping about at pleasure, while the soul is unable to restrain them, in consequence of the sluggishness fallen into at first by her; she having cast off her own freedom, and allowed herself to be subjected to them; while yet not the less does she, even though thus obeying them, hate that servitude, and approve that (the law) which condemns it. Having thus laid down all this, in order to show us what we were before receiving grace (through the new covenant), and what we have become since that grace; and personating, as it were, the character of those besieged by sin before grace appeared; he now, as one in the midst of his enemies, taken captive and compelled to obey, while perceiving help from no other quarter, groans bitterly, and cries out, proving that the law could not succour him, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
