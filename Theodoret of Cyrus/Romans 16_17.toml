[[commentary]]
quote='''
Now I beseech you, brethren, to mark them which cause divisions and offences contrary to the doctrine which ye have learned, and avoid them. He alludes in these words to the evil advocates of the law, whose precepts he bids them to avoid, while praising the teaching of the chief of the Apostles; for the expression causing such contrary to the doctrine which ye have learned is that of one who greatly admires the doctrine they had already obtained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
