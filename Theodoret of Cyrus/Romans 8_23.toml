[[commentary]]
quote='''
And not only they, but ourselves also, which have the first-fruits of the Spirit, even we ourselves groan within ourselves. And what wonder if creation is so affected on our account? for even ourselves who have already received many pledges of the future, and above all others the grace of the Spirit, groan in our longings after freedom; as what follows shows that he means, waiting for the adoption, to wit, the redemption of our body. He had said, indeed, that we have received the spirit of adoption; but without infringement thereof, he here shows us more precisely that now we have obtained the name, but then shall be made partakers of the full reality, when our bodies shall have been released from corruption, and have put on immortality; while by the word first-fruits, he points out that in the future life, we shall receive a far larger measure of the grace of the Spirit; since if what is now offered is called first-fruits, and earnest, manifest is it that that shall far exceed it in greatness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
