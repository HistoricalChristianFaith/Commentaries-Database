[[commentary]]
quote='''
Therefore, having been justified by faith, we have peace with God through our Lord Jesus Christ, By whom now we have access, by faith, into this grace wherein we stand, and rejoice in hope of the glory of God. Faith then has given us remission of sins, and made us blameless and just by the regeneration of the baptismal font, and it is incumbent on you to preserve the peace thus effected. For the only-begotten by His incarnation has reconciled you, while you were in hostility with Him, and sin it was that produced this hostility, righteousness therefore it must be which will maintain the peace commenced; and this then we are in every way bound to pursue by the consideration of the hopes held out, and the glory promised by God to be given to us. For the recompense of our labours he calls not payment, but glory, to show the excess of our reward. And as they had at that time to endure many troubles, being beaten, tortured, and subjected to a thousand kinds of death, he most fitly brings forward the sources of consolation connected with these things,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
