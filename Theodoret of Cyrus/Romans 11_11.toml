[[commentary]]
quote='''
I say then, Have they stumbled that they should fall? God forbid, but rather through their fall salvation is come unto the Gentiles, for to provoke them to jealousy. For to them first, such as believed among them brought the saving gospel, and when they set themselves against it, and refused to receive their teaching, then to the Gentiles did they offer the divine gospel; but they that believed obtained salvation. And this was suited to prick in heart the gainsayers among the Jews, and excite them to emulation, and so gain for them a participation in that salvation, for those that have been last they see made first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
