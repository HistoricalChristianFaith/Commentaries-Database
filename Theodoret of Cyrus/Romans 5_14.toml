[[commentary]]
quote='''
But death reigned from Adam to Moses, even over them that had not sinned after the similitude of Adam's transgression, who is the type of Him that would come after. By Moses he means the law, as we also find in the Gospels (Luke xvi. 29,) "They have Moses and the prophets;" and so also the holy apostle speaks in the Second Epistle to the Corinthians (iii. 15,) " But even unto this day, when Moses is read, the vail is upon their hearts," that is, the law. Death then, says he, reigned from Adam until the manifestation of the Saviour, for then the law received its end, "for the law," says he, "and the prophets, prophesied until John; but from the days of John the kingdom of heaven suffereth violence, and the violent take it by force." (Matt. xi. 12, 13.) And death, moreover, reigned over those also, who had not sinned after the likeness of Adam's transgression, for although they had not transgressed that particular commandment, they had nevertheless ventured on other sins. And he calls Adam the type of Christ, for the latter he designates as Him that would come after, on this account, that as Adam first, by his sin, became subject to the sentence of death, and thus the whole race followed their first parent, so the Lord Christ, having fulfilled the most perfect righteousness, destroyed the power of death, and first rising from the dead shall restore the whole race of man to life. And as he had called Adam the type of Christ, he shows the pre-eminence (of the latter.)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
