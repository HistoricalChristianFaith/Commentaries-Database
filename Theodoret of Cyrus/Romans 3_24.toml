[[commentary]]
quote='''
Being justified freely by His grace, through the redemption that is in Christ Jesus. For by bringing faith alone, we have received remission of our sins, in that the Lord Christ has offered up His own body for us, to be, as it were, the price of redemption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
