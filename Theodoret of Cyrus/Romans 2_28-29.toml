[[commentary]]
quote='''
For he is not a Jew, which is one outwardly, neither is that circumcision which is outward in the flesh; But he is a Jew, which is one inwardly; and circumcision is that of the heart, in the spirit, and not in the letter, whose praise is not of men, but of God. He falls back here upon the testimony of the prophetic writings, which we have above quoted, for "Circumcise" says he, "the hardened foreskin of your hearts."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
