[[commentary]]
quote='''
Neither yield ye your members as instruments of unrighteousness unto sin. Having spoken of a reign, in strict keeping herewith, he mentions its artillery also, and teaches us the way of victory, for the weapons which sin uses against us are our own members. But yield yourselves unto God, as those that are alive from the dead. And, indeed, just before he had said the very same thing— "And so reckon ye also yourselves to be dead indeed unto sin, but alive unto God, through Jesus Christ;" that is, ye have been buried with Christ, and have risen again with Him, wherefore ye are dead to sin, and aspire to another life. And your members, as instruments of righteousness, unto God. He shows that the body is not evil, but the work of a God of goodness, for it is competent to serve God, if well and properly governed by the soul; wherefore it is the inclination of our own free will to the worse that offers the members for weapons, as it were, to sin; and again the love arising from our knowledge of good, which prepares the members to obey the divine laws. For thus the tongue of the musician, when he is in the right mind, offers up fitting melody to the God of all, but when he is drunken and disordered, madly sends forth the horrid sounds of impiety; and thus also it is both adorned by the words of truth, and disgraced by falsehoods; and thus the eye likewise can look abroad both modestly and lasciviously, both savagely and benevolently; and thus also the hand both kills and pities; and, in short, all the members of the body become the instruments of holiness when the Spirit is so minded, and of sin, on the reverse, when it has embraced the governance of sin. But in another way also does the holy apostle demonstrate the easiness of the victory:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
