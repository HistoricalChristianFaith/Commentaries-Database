[[commentary]]
quote='''
For if thou wert cut out of the olive tree, which is wild by nature, and wert grafted contrary to nature into a good olive tree; how much more shall these, which be the natural branches, be grafted into their own olive tree? If thou, being a wild olive—for thou hadst not the law tending thee, nor the prophets, watering, and pruning, and taking all needful care about thee,—hast been detached from unholy ancestors and relations, and made a partaker in the faith of Abraham, and boastest in him as thy father and ancestor, not by the natural course of the law, but by the divine loving-kindness; much more probable and natural must it be, that they, on believing, should be united again to their own root. And all this, as I before remarked, he says in order to teach humility to the Gentile converts, and exhort to salvation the disbelievers among the Jews; and with this agrees what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
