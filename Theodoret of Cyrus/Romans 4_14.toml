[[commentary]]
quote='''
For if they which are of the law be heirs, faith is made void, and the promise made of none effect; for if they who live according to the law obtain the promised blessings, in vain did Abraham believe in God, and false and not true were the promises made to him by God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
