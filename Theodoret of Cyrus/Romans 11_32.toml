[[commentary]]
quote='''
For God hath concluded all in unbelief, that He might have mercy upon all. Concluded he puts for convicted. For he convicted the Gentiles, as having both received natural judgment, and had the creation teaching them the knowledge of God, and yet from neither the one nor the other having derived benefit; and He convicted the Jews likewise, as having enjoyed yet more instruction, in that in addition to nature and the creation, they had received the prophets also teaching what was right, and so become obnoxious to the heavier vengeance; while at the same time both these and those, thus deserving total destruction, has He blessed with the privilege of salvation, provided only they were willing to believe. Having thus fully gone through these things, and contemplating the profundity of the divine lovingkindness, and how incomprehensible is His wisdom, he cries out,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
