[[commentary]]
quote='''
As it is written, There shall come out of Zion the Deliverer, and shall turn away ungodliness from Jacob; For this is My covenant unto them, when I shall take away their sins. If the polity of the law gives forgiveness of sins, that it is, which the speech of the prophet predicted; but if the law punishes those that transgress it, and the Jews ever lay under the accusation of such transgression, it is plain that the sentence points out the forgiveness which arises from baptism. And by all Israel, he means such as believe, whether they were of the Jews, as having a natural descent from Israel, or of the Gentiles, as connected with him by the relationship of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
