[[commentary]]
quote='''
Know you not brethren (for I speak to them that know the law) how that the law hath dominion over a man, as long as he liveth? You well know, says he, you I mean who have been brought up in the law, that the law has its authority over those who are yet alive; and he adduces an example also in accordance with this proposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
