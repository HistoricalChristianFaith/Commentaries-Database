[[commentary]]
quote='''
What fruit had ye then from those things? Tell me yourselves the gains of sin; or rather it were idle to ask, for in silence you confess its injury, for ye are covered with shame, as he adds, whereof ye are now ashamed; for although any one be barefaced indeed, he yet cannot but experience shame, when his enjoyment is over. And he subjoins, in addition to this, the greater and more bitter fruit of sin —for the end of those things is death. Death, he means not the present, which is merely temporal, but that which is eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
