[[commentary]]
quote='''
What then if? Here we must place a stop, for he means, if thou art desirous to know this, namely, why, when the majority sin, some of them He punishes, and some through their means He benefits; and when many pursue virtue, some of them He renders illustrious, and to some by them sets forth the hopes of the future; hear what follows: God willing to show His wrath, and to make His power known, endured with much long-suffering the vessels of wrath fitted to destruction, And that He might make known the riches of His glory on the vessels of mercy, which He had afore prepared unto glory; Even us whom He hath called, not of the Jews only, but also of the Gentiles. God, says he, was not the author of Pharaoh's wickedness, but exercised long-suffering towards him as He is wont, but he conceived that long-suffering weakness, and through it increased his own obstinacy; while at the same time the Governor of all things, in His wisdom both justly inflicted punishment on him, and from his very wickedness drew a preventive medicine to the rest. And thus, as physicians do not themselves make vipers, but from them prepare drugs profitable to men, so God preferred that Pharaoh should not suffer punishment, but, inasmuch as he had fallen into so great brutishness, brought on him retributions of every kind, and manifested at the same time His own power to all men; wherefore He says, "even for this same purpose have I raised thee up, that I might show My power in thee, and that My name might be declared throughout all the earth the I have raised thee up meaning, I have permitted thee to obtain the throne, and while able to prevent, prevented thee not, foreseeing the advantage that would thence arise to others. And those whom he calls vessels of wrath fitted to destruction, are they, who, by their own free will, have become so, for the same thing also has he written to Timothy, (2 Tim. ii. 20) "But in a great house there are not only vessels of gold, and of silver, but also of wood, and of earth; and some to honour, and some to dishonour;" and, teaching how every one becomes the one or the other of his own free will, he subjoined, "if a man, therefore, purge himself from these, he shall be a vessel unto honour, sanctified, and meet for the master's use, and prepared unto every good work;" and to the Corinthians, in like manner, he writes (1 Cor. iii. 12), "Now if any man build upon this foundation gold, silver, precious stones, wood, hay, stubble," —clearly teaching the free agency of man. So here does he call those who are worthy of the divine loving-kindness, vessels of mercy. And the hath before prepared unto glory displays the divine foreknowledge, for so had he also said before, "for whom He had foreknown He also did predestinate to be conformed to the image of His Son;" for the object of the apostle is to prove, that the God of all things alone knows who are worthy of salvation, while among men not a soul. And having stated that He hath called us not of the Jews only, but also of the Gentiles, he confirms the representation by the testimony of scripture, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
