[[commentary]]
quote='''
For one believeth that he may eat all things; that is, the Gentile convert; another, who is weak, eateth herbs. Some declare that the Jewish proselytes, in order to cast shame on the Gentile converts, abstained not only from swine's flesh, but even from all animal food, under the pretext of self-restraint and temperance; whence the holy Apostle says, he who is weak eateth herbs; for not having a perfect faith, he thought that he would be defiled by such kind of food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
