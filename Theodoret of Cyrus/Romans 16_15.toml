[[commentary]]
quote='''
Salute Philologus, and Julia, Nereus and his sister, and Olympus, and all the saints which are with them. And these again living together, on account of the virtue they possessed obtained the Apostle's salutation. Having thus greeted these by name, he then bids them all salute each other, for,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
