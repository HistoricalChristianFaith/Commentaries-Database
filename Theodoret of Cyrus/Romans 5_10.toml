[[commentary]]
quote='''
For if, when we were enemies, we were reconciled to God, by the death of His Son, much more, having been reconciled, shall we be saved in His life. If while we were antagonists, and enemies, He thought fit to treat us with so great consideration, as to give up His Son to die for us, how is it possible, now that reconciliation has been effected, that we should not share in everlasting life? And here again he calls the Lord Christ, the Son, who, the same, is both God and man; it must be evident therefore, I apprehend, even to the most determined heretics, as to which nature His passion took place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
