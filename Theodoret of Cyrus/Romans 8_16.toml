[[commentary]]
quote='''
For the Spirit itself beareth witness with our spirit, that we are the children of God. By the Spirit he means the Holy Ghost himself, by our spirit, the grace (or spirit of adoption) given to us, for both are here expressed by the same common word, and what he means is, that we put forth this prayer, (thus claiming sonship therein) as led by the teaching of the Spirit, and in so doing then we cannot be blameworthy, in that we do it according to the divine law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
