[[commentary]]
quote='''
For whatsoever things were written aforetime were written for our learning, that we through patience, and comfort of the Scriptures might have hope. God, providing for our advantage, has both afforded us a written rule of doctrine, and also preserved in written history the accounts of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
