[[commentary]]
quote='''
That I should be the minister of Jesus Christ to the Gentiles, ministering the gospel of God. I have been appointed the teacher of the Gentiles, this is the ministry I present to the Lord Christ; and what is the gain arising from thence? That the offering of the Gentiles might be acceptable, being sanctified by the Holy Ghost. I readily undergo any labour that the Gentiles may be established in the faith. I obtain the grace of the Spirit, for by the ministry he means preaching, and by the acceptable offering a sincere and genuine faith. I have done nothing then out of place, says he, if I have at all written somewhat more boldly, and rebuked them that offend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
