[[commentary]]
quote='''
He proceeds now in another way to prove our possession of the power of discriminating between good and evil. Therefore thou art inexcusable, O man, whosoever thou art that judgest: for wherein thou judgest another thou condemnest thyself for thou that judgest doest the same things. But, although thus situated, if you had received authority from any one to pass sentence, you would punish the transgressors of the law as guilty, so perfect a distinguishment have you between good and its opposite. It becomes you then to be aware, that in the very judgment you pronounce on others as sinners, you involve yourselves in the same condemnation, for you have not hesitated to fall into the same transgressions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
