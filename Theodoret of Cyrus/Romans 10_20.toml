[[commentary]]
quote='''
But Esaias is very bold, and saith, I was found of them that sought Me not, I was made manifest unto them that asked not after Me (lxv. 11). He shows at once the prophecy of the revelation of divine knowledge to the Gentiles, and the bloodthirstings of the Jews, as the expression is very bold testifies; he feared not, says he, the mad and murdering Jews, but with great boldness predicted the salvation of the Gentiles, and foretold the infidelity of the Jews: as what follows shows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
