[[commentary]]
quote='''
For whom He had foreknown, He also did predestinate to be conformed to the image of His Son, that He might be the first-born among many brethren; for He did not irrespectively predestine, but predestined in his foreknowledge of them. And speaking with the strictest accuracy of expression, he says not conformed to His Son, but to the image of His Son; and this he has even more plainly put in the Epistle to the Philippians (ch. iii. 20), where, having said that "our citizenship is in heaven, from whence also we look for the Saviour, the Lord Jesus Christ," he adds, "Who shall change our vile body, that it may be conformed to His glorious body." For our body will not be made to resemble His divinity, but His glorified body,—and so here also he calls those who now obtained the privilege of the call conformed to the image of His Son, that is, to the body of His Son; for the divine nature being invisible, and the body visible, by the body as an image (or shadow) is He adored; that He might be the first-born among many brethren; and this the truth of the doctrine testifies, for it is as man that He is called the first-born, as God being the Only-begotten, seeing that as God He has not brethren, but as man designates as brethren them which believe. Of these He is the firstborn, being yet no other than the Only-begotten; but He, the same, both Only-begotten and firstborn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
