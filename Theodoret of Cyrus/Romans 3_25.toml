[[commentary]]
quote='''
Whom God hath set forth to be a propitiatory, through faith in His blood. The propitiatory was a golden plate, which lay over the ark, having at either end the figure of a cherub, (Exod. xxv.) and from thence the mercy of God was manifested to the high priest in his ministrations. The holy apostle here then teaches, that the Lord Christ was the true propitiatory, for that ancient one was but a type of this. This name, however, is applied to Him as man, and not as God; for as God He Himself speaks from the propitiatory; while as man He receives this appellation even as others, such as "sheep" and "lamb," and "sin" and "curse," and the like. (See John i. 29, 36. Acts viii. 32. 2 Cor. v. 21. Gal. iii. 13.) And the ancient propitiatory was bloodless in itself, inasmuch as it was also inanimate, and received only the sprinklings of the blood of the victims; but the Lord is God, and propitiatory, and high priest, and lamb, and in His own blood hath worked out our salvation, demanding faith only from us.—To declare His righteousness for the remission of sins that are past:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
