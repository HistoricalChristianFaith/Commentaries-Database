[[commentary]]
quote='''
Salute Asyncritus, Phlegon, Hermas, Patrobas, Hermes, and the brethren which are with them. This was another society of the faithful worthy of Paul's greeting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
