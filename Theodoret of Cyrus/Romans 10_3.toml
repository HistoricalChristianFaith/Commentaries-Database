[[commentary]]
quote='''
For they being ignorant of God's righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God. Their unreasonable adherence to the law is what he here calls their own righteousness, for they are zealous still to observe it, though it has now come to an end; and that which is of grace, through faith, what he speaks of as the righteousness of God; for so he goes on to say,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
