[[commentary]]
quote='''
Professing themselves wise, they became fools. He increases their reprobation by the very name they gave themselves, in that, while calling themselves wise, they proved by their works that they were void of understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
