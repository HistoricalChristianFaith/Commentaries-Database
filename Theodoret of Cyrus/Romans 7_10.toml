[[commentary]]
quote='''
And the commandment which was ordained to life I found to be unto death. In every way he vindicates the law, and the commandment, but proves the evil of sin; for the commandment, says he, was the minister of life, but the turning aside to evil begot death, wherefore he most properly says, found, to show that the intention of the law, and the end brought about by sin, were widely different things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
