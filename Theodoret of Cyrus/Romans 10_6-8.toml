[[commentary]]
quote='''
But the righteousness which is of faith speaketh on this wise; (Deut. xxx. 12,) that is, but concerning the righteousness which is of faith, not Moses himself, but the God of all, through Moses, speaks thus, Say not in thine heart, Who shall ascend into heaven? that is, to bring Christ down from above; Or who shall descend into the deep? that is, to bring up Christ again from the dead. But what saith it? The word is nigh thee, even in thy mouth and in thy heart. These things the God of all spake indeed concerning the law, teaching the Jews, that without labour on their own part they had received the knowledge of what they ought to do, and needed neither an ascent into heaven, nor a descent into Hades. The word is nigh thee, for the knowledge of what thou shouldest do has been given unto thee; but the holy apostle has transferred them to this account of faith, teaching us that we should not over-curiously inquire into the dispensation in Christ Jesus, or question that the only-begotten Son of God did become incarnate, and having endured the passion, brought in the resurrection; but by faith reap the salvation (offered). For the word is nigh thee, in thy mouth, and in thy heart; and then he adds, that is, the word of faith, which we preach. What Moses once said of the injunctions of the law, that we now say of faith:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
