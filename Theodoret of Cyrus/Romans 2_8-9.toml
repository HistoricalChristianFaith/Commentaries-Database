[[commentary]]
quote='''
But unto them that are contentious, and do not obey the truth, but obey unrighteousness, indignation and wrath, Tribulation and anguish, upon every soul of man that worketh evil, of the Jew first, and also of the Gentile.

As with respect to the former party, it was not simply to any chance person, nor to such as follow virtue sluggishly, that he promised those blessings, but to those who are contented to undergo its difficulties and labours, in like manner does he now threaten the heavy denunciations upon sin not to such as are betrayed into it on some chance occasion, but such as determinately pursue it, as is evident from the are contentious, the obey not the truth, and the work evil. Jews and Gentiles equally, says he, he will punish if transgressors, and deem worthy of the crown if zealous after holiness and righteousness. By the Gentiles he means not such as had become converts to the divine preaching, but such as had lived antecedently to our Lord's incarnation; nor to those among them who were idol-worshippers; but those who, being beyond the Mosaic polity, yet had embraced true piety, and sought after righteousness, does he promise eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
