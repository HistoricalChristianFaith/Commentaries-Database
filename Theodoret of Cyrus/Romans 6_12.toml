[[commentary]]
quote='''
Let not sin therefore reign in your mortal body, that ye should obey it in the lusts thereof. A reign differs from a tyranny in this, that a tyranny is exercised over those who unwillingly submit to it; a reign, over subjects who are consenting thereto. He exhorts us therefore no longer to agree to the government of sin, for the Lord in His incarnation has overthrown its reign; and as one legislating for mere mortals, and such as possess a body liable to passions, he enjoins things consistent with their infirmities, and says, not Let not sin tyrannize, but, let it not reign; for the former is its own property, the latter rests on our will; the motions and tumult of the passions being engendered in us by nature, while the performance of what are forbidden depends on our own volition. And he shows, moreover, the short duration of the warfare by denominating the body mortal, in that when it has undergone the termination of death the attack of the passions ceases likewise. He exhorts us then, not to put a stop to the tyranny of sin, but, not to obey it when intemperately inflaming the desires of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
