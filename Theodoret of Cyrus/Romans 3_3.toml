[[commentary]]
quote='''
For what if some did not believe, shall their unbelief make the faith of God without effect? God forbid. Well knew the God of all, says he, from of old, both who would keep His law, and who would break it. They, therefore, who did not believe, by no means invalidated the divine mercies; nay, for even though all mankind should prove ungrateful towards Him, this their ingratitude could not diminish the glory of God; as he explains in what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
