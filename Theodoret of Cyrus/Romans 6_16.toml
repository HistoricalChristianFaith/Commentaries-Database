[[commentary]]
quote='''
Know ye not that to whom ye yield yourselves servants to obey, his servants ye are whom ye obey, whether of sin unto death, or of obedience unto righteousness? Whomsoever ye choose to submit yourselves unto, his commands you are bound to comply with, for it is not possible at the same time to obey two lords, but righteousness and sin are diametrically opposed to each other; and this also the Lord says in the holy gospels, (Matt. vi. 24,) "No man can serve two masters."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
