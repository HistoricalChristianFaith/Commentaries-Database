[[commentary]]
quote='''
But if our unrighteousness commend the righteousness of God, what shall we say, is not God unrighteous, who taketh vengeance? I speak as a man. God forbid.

It was necessary that he should bring forward the objection raised by others, and he shows its absurdity by his disavowal of it; for not I, says he, speak thus, but have only stated the position of others, which is what he means by as a man. For then how shall God judge the world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
