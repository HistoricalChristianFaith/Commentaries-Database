[[commentary]]
quote='''
Hast thou faith? have it to thyself before God. In the full exercise of faith thou keepest the law (of Christian liberty in the gospel, v. 14, and Gal. v. 1, &c.) Great is the possession, worthy of praise the excellence, but let it not be to the detriment of thy neighbour. Happy is he that condemneth not himself in that thing which he alloweth. The expression insinuates that the Gentile converts were in the habit of compelling the Jews to partake of those things they were averse to; he teaches therefore that the believer indeed derives no injury from the use of them, but that he who eats, while yet making a distinction, partakes in such as unclean, wherefore he pronounces him happy that judges not himself; that is, who makes no such difference (in his own mind); and so he subjoins, in explanation,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
