[[commentary]]
quote='''
For which cause also I have been much hindered from coming to you. For my engagement among these others has prevented my presence among yourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
