[[commentary]]
quote='''
Because the creature itself also shall be delivered from the bondage of corruption, into the glorious liberty of the children of God. For when these latter appear such as now they are called, and in their immortality are manifested to be the sons of God, the former also will obtain a total release from corruption. And all this he says, not meaning that the visible creation really was gifted with reason, but by a prosopopoeia, as was common with the prophets, so that one represents the pines as groaning, and another the woods as rejoicing, and the mountains leaping, and the rivers exulting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
