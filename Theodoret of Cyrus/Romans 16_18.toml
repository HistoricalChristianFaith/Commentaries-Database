[[commentary]]
quote='''
For they that are such serve not our Lord Jesus Christ, but their own belly. And from hence it is plain that it is of the Jews that he is thus speaking, for he is perpetually condemning their gluttony, and so elsewhere he says, "whose God is their belly." And by good words and fair speeches deceive the hearts of the simple. By fair speeches he means praise (flattery); and he hints that some had already been seduced by them, for they deceive, says he, the hearts of the simple; not depravity of disposition indeed, but simplicity does he allege as the cause. And then again he excites them with praises,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
