[[commentary]]
quote='''
Lord, they have killed Thy prophets, and digged down Thine altars; and I am left alone, and they seek my life? But what saith the answer of God unto him? (v. 13,) I have reserved to Myself seven thousand men, who have not bowed the knee to the image of Baal. And at that time also, says he, were there many of Israel, and all were called Israel, and yet the God of all things designated Himself the God of seven thousand (only), and all the rest He rejected; for I have left unto Myself, said He, seven thousand men who have not bowed the knee to the image of Baal; and this indeed the prophet knew not, but imagined that in himself alone was preserved what remained of true piety. No new nor inconceivable thing then is it, if you also know not those among you who have fixed their faith in the Saviour, whom the God of all things acknowledges as His people. And most opportunely does he bring forward the great Elias making this accusation against them, that not only had they slain the prophets, but even overthrown the altars from their foundations; for granting, says he, that they were evilly-disposed towards the prophets, as denouncing bitter things against them, what had they to allege against the divine altars? Rather then by such daring impieties did they manifest that their hatred was against the God thereof. And here the holy apostle, leaving these scripture testimonies, resumes the thread of his own discourse, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
