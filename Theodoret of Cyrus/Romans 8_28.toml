[[commentary]]
quote='''
And we know that all things work together for good to them that love God, to them who are called in accordance with (their own) disposition. They work not together with all, but with those that love Him, nor simply work with them, but work with them for good, for if any ask for what would not be profitable to him, he fails of his petition, because it is to his advantage not to gain it. And with the fittest accuracy of expression does he join the disposition with the call, for the call is not irrespective, but to those who possess this disposition; wherefore He said to the apostle in Corinth, (Acts xviii. 9,10,) "speak and hold not thy peace, for I have much people in this city and forbade him to preach the word in Mysia (ch. xvi. 6, 7); and as to Asia, at first restrained, and afterwards commanded him to do it; wherefore he also said to him in Jerusalem, (ch. xxii. 18,) "make haste and get thee quickly out of Jerusalem, for they will not receive thy testimony;" and wherefore he here also says, to those that are called in accordance with (their own) disposition, agreeably to what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
