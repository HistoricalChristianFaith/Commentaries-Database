[[commentary]]
quote='''
As it is written, Jacob have I loved, but Esau have I hated. He heeds not, therefore, the (bare descent of) nature, but virtue only is it that He requires; for this he confirms by many instances.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
