[[commentary]]
quote='''
Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost. He had already above said, in the part of this Epistle which we have expounded, that "hope which is seen is not hope" (ch. viii. 24); wherefore also he calls God the God of hope, as having of old given to the Gentiles the hope of the blessing, and now established that promise by deeds; and this is a pledge of the blessings yet hoped for; for He who promised those things, and then fulfilled them, will altogether fulfil also what He has now promised to us. And he bids us not only hope, but abound in hope, that is, hope sincerely, and expect to behold the blessings that we hope for; and this (confidence) he says the grace of the spirit affords. Having thus recommended these things, and invoked a blessing on them, he goes on to accord praise to them, by this leading them onward to yet greater goodness;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
