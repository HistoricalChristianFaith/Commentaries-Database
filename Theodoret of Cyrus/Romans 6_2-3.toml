[[commentary]]
quote='''
How shall we, that have died to sin, live any longer therein? And how have we died thereto? Know you not, brethren, that as many of us as have been baptized into Jesus Christ have been baptized into His death? Thou hast renounced sin, and hast become dead to it, and buried with Christ; how is it possible then that thou shouldst admit this same sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
