[[commentary]]
quote='''
I speak after the manner of men, because of the infirmity of your flesh. I suit my exhortations to your nature, for I am well aware of the passions which contend in a mortal body. For as ye have yielded your members servants to uncleanness and to iniquity unto iniquity; even so now yield your members servants to righteousness, unto holiness. By this also he shows that it is not the (natural, see ver. 13,) body that deserves reprobation, but the disposition that leads it astray. And he demands indeed from us nothing impossible, but that what we did give to sin, the same we should afford to righteousness; and to the former we subjected ourselves while it enjoined iniquity, the latter, if we obey it, will bring us to holiness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
