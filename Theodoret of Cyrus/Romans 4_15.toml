[[commentary]]
quote='''
Because the law worketh wrath; for it is the character of the law to punish the transgressors thereof; by wrath he means punishment; for where no law is there is no transgression, for the law punishes the violators of it, for with the law are connected observance and violation; some through zeal for virtue preferring to keep it, and some through love of ease carelessly suffering themselves to violate it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
