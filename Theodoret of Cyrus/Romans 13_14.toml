[[commentary]]
quote='''
But put ye on the Lord Jesus Christ. Not that they should receive another baptism, but consider the garment wherewith they were already clothed. And make not provision for the flesh, to fulfil the lusts thereof. Here he stops the mouths of those heretics who condemned the flesh itself, for he denounces not care for the body, but forbids luxurious indulgence and intemperance; saying not, make no provision for the body, but make it not for the lusts; that is, prepare it not by luxurious living to play the wanton. Having thus in its turn fully spoken of practical virtue, he now returns again to doctrinal instruction. And here it is first necessary to explain the scope of the Apostle's arguments, that the exposition of what he says may be more clearly understood. The Gentile believers, then, embraced the polity prescribed by the gospel; while many of the Jews who had become proselytes to the gospel, persisted still in submission to the institutions of the law, keeping still to the observation of particular days, and partaking of such food (only) as the law directed. Hence a disunion arose, and indeed positive quarrels, these latter condemning the Gentile believers for their indiscriminate use of all foods, and the former despising them in their turn on account of their extreme and superfluous adherence to the law. To correct all this, therefore, the holy Apostle offers such admonitions as are suited to both parties; and first he exhorts the Gentile believers to brotherly love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
