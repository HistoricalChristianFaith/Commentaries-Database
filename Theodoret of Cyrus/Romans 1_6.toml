[[commentary]]
quote='''
Among whom are ye also called of Jesus Christ. Of which nations, whose husbandry is thus entrusted to me, ye are part; for think not that I am appropriating what belongs to another, or seizing on fields allotted to some one else, for the Lord hath constituted me the minister of all the Gentiles;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
