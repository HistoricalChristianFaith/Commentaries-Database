[[commentary]]
quote='''
Avenging not yourselves, dearly beloved, but rather give ye place unto wrath: for it is written, Vengeance is Mine, I will repay, saith the Lord. (Deut. xxxii. 35.) Therefore if thine enemy hunger, feed him; if he thirst, give him drink; for in so doing thou shalt heap coals of fire on his head. Having pointed out the Judge, and shown his just judgments, for so the Vengeance is Mine, I will repay, saith the Lord, signifies, he bids us generously bear all the injuries offered to us, repaying with the reverse those that do evil to us, and ministering to the wants of those that hate us. For these things weave a crown to such as thus meekly and patiently endure, while they increase the punishment of the injurers. Not indeed that we are to suppose (that he means) that on this account we are to minister to our enemies, in order that they may suffer the heavier retribution hereafter, for the holy Apostle thus speaks from a wish to repress the anger of the injured party, not from a desire by (his) good to increase (the other's) evil. For that it is such a patient endurance which he inculcates, what follows shews; Be not overcome of evil, but overcome evil with good. For to revenge oneself proves defeat, while the returning good for evil is manifest victory. Having thus disciplined (their) morals, he exhorts them also to render to those in authority the honour due; for he foresaw, as one who had plenteously received of the grace of the thrice holy Spirit, how some, led rather by self-arrogance than any holy zeal for religion, would despise their earthly rulers, as conceiving themselves far superior to them by reason of their (better spiritual) knowledge. And especially does he do this, that he may blot out the opinion prevalent concerning them; for they were falsely represented as destroyers of the common laws; and some said, (Acts xvii. 6,) "These that have turned the world upside down are come hither also;" and others that they were introducing "new customs" (Acts x. 20); wherefore he thought it worth while to lay down his injunctions on this point also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
