[[commentary]]
quote='''
Timotheus my work-fellow, and Lucius and Jason, and Sosipater my kinsmen salute you. The first has the glory of a participation in works, the others relationship; but the fellow-worker is far more honourable than the relation; and this is the same Timothy whom in Lystra he circumcised (Acts xvi. 3), and to whom he wrote those two epistles. And of Jason also the history of the Acts makes mention (ch. xvii.)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
