[[commentary]]
quote='''
For the Scripture saith unto Pharaoh, (Exod. ix. 10,) Even for this same purpose have I raised thee up, that I might show My power in thee, and that My name might be declared throughout all the earth. And then again he adds as a deduction, Therefore hath he mercy on whom He will have mercy, and whom He will He hardeneth. Unquestionable, says he, are these scriptures, for what I advance is collected from thence, and from thence only. Thou hast heard God Himself declaring, "I will have mercy on whom I will have mercy, and I will have compassion on whom I will have compassion," and His again are the things spoken concerning Pharaoh. He, passing by Ishmael and the children by Keturah, chose Isaac; and He again preferred Jacob to Esau, although both received their being at the same time, in the same womb; why wonderest thou then, if he hath exactly so done now also, and received those among you who have believed, and rejected those that will not admit that light? But this indeed he does not yet lay down, but continues still adding to the difficulties of the subject, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
