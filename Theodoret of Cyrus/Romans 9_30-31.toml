[[commentary]]
quote='''
What shall we say then? We must read this interrogatively, putting a stop here: and then what follows as the answer. That the Gentiles which followed not after righteousness, have attained to righteousness, even the righteousness which is of faith. But Israel, which followed after the law of righteousness, hath not attained unto the law of righteousness. Know, says he, that faith is the cause of these blessings to the Gentiles, for it has rendered them meet to receive the righteousness which is of grace, them who formerly wandered about in error, and neither possessed, nor even wished to seek after, righteousness; while Israel, on the other hand, although possessing the law, and following after the righteousness which is of the law, hath failed of the mark, and not obtained righteousness. And then, again, interrogatively,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
