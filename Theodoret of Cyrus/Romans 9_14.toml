[[commentary]]
quote='''
What shall we say then? Is there unrighteousness with God? God forbid. The divine decision, says he, has nothing unjust in it, but is graced with perfect equity. And this indeed, though having it in his power to point out and teach clearly, that it is not the custom with God to pay attention to bare birth, but that He looks for the best disposition, as well as to remind them that oftentimes they had been delivered up to many enemies, without being at all spared for the sake of their forefathers, seeing that they imitated not their virtue; and that the whole nation had been allowed to be taken captive by the Babylonians, while Abimelech, on the other hand, though a slave and an Ethiopian, had been saved through his piety; he yet refrains from so doing, as not wishing too much to cast them down; but shows instead that the divine dispensations exceed the reckonings of man, and while many commit iniquity, yet not all are made to suffer vengeance for it; for so in the wilderness the greater part worshipped, for God, the image of the calf, yet not of all was punishment exacted, but some being made to suffer, others by those sufferings of their's were reformed; and so in avenging himself on Pharaoh, He brought by him great benefit to many; and these instances, accordingly, the holy Apostle places before them; and thus he speaks,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
