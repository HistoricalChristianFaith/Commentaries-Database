[[commentary]]
quote='''
For the woman which hath an husband is bound by the law to her husband, so long as he liveth; but if the husband be dead, she is made to cease from the law of her husband. And then he shows this yet more clearly: So then if, while her husband liveth, she be married to another man, she is called an adulteress; but if her husband be dead, she is free from the law, so that she is no adulteress, though she be married to another man. The law, says he, calls her an adulteress, not who after the death of her husband is united to another, but, who while her husband is yet alive, joins herself to any one else, for such an one it orders to be punished as insolently rebelling against the law of matrimony; it is evident, therefore, that when her husband has brought his life to an end, the widow not illegally, but with the distinct permission of the law, may marry another. Nor indeed was the holy apostle ignorant, that the law gave permission to the living also to dissolve a marriage when it should be no longer agreeable, but he was mindful of our Lord's assertion, which declared that Moses gave them that law on account of the hardness of the heart of the Jews, but that the law of nature had added no such terms, for one man, says he, and one woman did God make, establishing the law concerning marriage in their very creation: wherefore leaving this unnoticed, he passed on to the law as regarded the dead, and subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
