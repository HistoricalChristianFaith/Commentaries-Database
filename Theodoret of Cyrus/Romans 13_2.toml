[[commentary]]
quote='''
Whosoever, therefore, resisteth the power, resisteth the ordinance of God. He fitly deters them. And they that resist shall receive to themselves judgment; that is, will become obnoxious to punishment. And then he points out also the use of government.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
