[[commentary]]
quote='''
For if God spared not the natural branches, take heed lest He also spare not thee. For if the connexion of nature profited them not at all, because they retained not the same character and disposition, much more thou, if thou preservest not that grace, shalt become an alien from the root.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
