[[commentary]]
quote='''
And knowest the will, that is, the will of God: and discernest the differences, that is, between things which are opposite to each other, righteousness and unrighteousness, justice and injustice, temperance and excess, piety and impiety; Being instructed out of the law, for this it is, which was thy teacher in these matters;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
