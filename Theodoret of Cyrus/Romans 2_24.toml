[[commentary]]
quote='''
For the name of God is blasphemed among the Gentiles through you, as it is written; not only art thou not the cause of glory being given to God, but through thee many tongues are excited to speak evil of his name, in that when they witness thy wicked life, they openly reproach the God who hath chosen thee for his own.

Having thus shown that they had taken no advantage from the Mosaic legislation, he turns his discourse to circumcision, and proves that it also is deprived of its object, when separated from the other works belonging thereto;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
