[[commentary]]
quote='''
Because the inclination of the flesh is enmity against God. Again he condemns the inclination of the flesh, that is, the tyranny of the passions which he declares are at variance with God. For they are not subject to the law of God, neither indeed can be; for how is it possible that he who has admitted the tyranny of the passions, should embrace the service of God, while yet choosing to serve sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
