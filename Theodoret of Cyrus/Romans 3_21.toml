[[commentary]]
quote='''
But now the righteousness of God without the law is manifested, being witnessed by the law and the prophets. Who can sufficiently admire the power of the apostle's wisdom, who shows at once that the law had come to an end, and that it consented to (the covenant of ) grace. And aptly does he say manifested, for it has now laid clearly before all the hidden mystery of the dispensation; while in this comparison between grace and the law, by proving that both the law and the prophets were witnesses to the former, he exhibits the greatness of its conquest over the latter:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
