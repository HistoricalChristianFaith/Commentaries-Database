[[commentary]]
quote='''
To all that are beloved of God in Rome, called saints.

He at the same time honours them with such high and divine appellations, and represses every rising of arrogance. For, in the first place, instead of making any distinction between them as the masters of the world, and the other nations, he joins them with them; and, secondly, he writes to all, without respect of persons, addressing together, servants, beggars, and working-people; the wealthy, and the powerful; for that there were some of the latter who believed, he shows in the Epistle to the Philippians, (iv. 22,) saying, "They that are of Caesar's household salute you." It is evident, indeed, that he writes not to the unbelieving, but to those already converted, wherefore he calls them both called, and saints, exalting them with such spiritual appellations, and inflaming thereby their love towards their great Benefactor. Grace be unto you, and peace from God our Father, and the Lord Jesus Christ.

Thus then he completes the introduction to his letter, "Paul, a servant of Jesus Christ, to all that in Rome are beloved of God, called saints; grace be unto you, and peace, from God our Father, and the Lord Jesus Christ;" the rest which intervenes he threw in between, in order to mark whose messenger he had been constituted, and what were the tidings wherewith he had been entrusted, and to whom he had been commissioned to bring them. And he invokes on them first God's grace, because by this it was that believers obtained salvation; and next peace, by which he indicates the full establishment of virtue, since he alone has peace with God who has embraced an evangelical course, seeking ever to serve him in all things. And of these gifts he shows that not the Father only, but the Son also is the giver, in saying, from God our Father, and the Lord Jesus Christ; by which expression he plainly teaches the equality of the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
