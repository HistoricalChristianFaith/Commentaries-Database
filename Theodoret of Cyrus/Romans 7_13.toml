[[commentary]]
quote='''
Did then that which is good become death unto me? and again according to his wont he denies it, God forbid, and shows us the cause of these evils, but sin, that it might appear to be (indeed) sin, in its working death to me by that which is good. There is an obscurity here, arising from the extreme brevity made use of; what he means is this, that by that which is good, to wit the law and commandment, sin is made apparent to me, namely, as being bad and evil; and how is it so made apparent? by its working unto death, for from the fruit I know the tree, and seeing death I hate its parent; but of all this is the law the teacher; it is not then the law, which thus instructs, that is evil, but sin, which brings death; and it is the inclination of our own free will to the worse, that is the author of sin. That sin might by the commandment become exceeding sinful. For though nature points out sin, its excessive turpitude the law has more clearly manifested. The expression that it might become is incomplete, the word "apparent" being understood, for so also we explained it in the preceding sentence, "but sin, that it might be seen to be sin indeed by its working out death to me by that which is good, that sin might by the commandment become exceeding sinful," that is, that it might become by the commandment " apparent" that sin is exceeding sinful, that is evil. And then, like some skilful painter, he portrays the contest between nature and sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
