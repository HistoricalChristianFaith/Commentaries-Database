[[commentary]]
quote='''
Now we know that what things soever the law saith, it saith to them who are under the law. He words this with the greatest accuracy of expression, in that he puts it not "concerning" those who are under the law, but to those who are under the law; for it speaks much concerning the Babylonians, and Persians, and Medes, and Egyptians, and many other nations, but, nevertheless, even these predictions concerning them it addresses to the Jews. That every mouth may be stopped, and all the world may become guilty before God. And again, he employs the word that according to his favourite idiom, (or use of it,) for the God of all did not therefore bestow laws, and send forth His exhortations among men, in order that He might render them obnoxious to punishment, but consulting for their salvation has He done this; themselves it is who, by pursuing an opposite course, have drawn this vengeance on themselves.

Being now about to enter on the privileges of faith, he first demonstrates that all have need of it, and especially, above others, those who boasted in the law:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
