[[commentary]]
quote='''
For the earnest expectation of the creature waiteth for the manifestation of the sons of God. Perceive ye not, says he, the heaven, the earth, the sea, the air, the sun, the moon, the whole visible creation, and besides these, such as are invisible—angels, archangels, powers, dominions, principalities? all these are waiting for your full perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
