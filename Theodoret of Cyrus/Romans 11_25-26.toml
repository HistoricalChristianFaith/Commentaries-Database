[[commentary]]
quote='''
For I would not, brethren, that ye should be ignorant of this mystery, lest ye should be wise in your own conceits.A mystery is a thing not known to all, but to those only who are entrusted with it. What he means then is, that I wish you to understand the mystery I am aware of as regards these things, that you may not over-estimate your own spiritual knowledge, and hence be puffed up with self-sufficiency. And what is the mystery? That blindness in part is happened to Israel, until the fulness of the Gentiles be come in, and so all Israel shall be saved. He puts the in part, to show that not all had disbelieved, for many even among them had believed; and he bids them not despair of the salvation of the rest. For when the Gentile nation shall have received the gospel, then they also shall believe, the great Elias having come and brought instruction in the faith to them, for so the Lord also said in the holy gospels (Matt. xvii. 1), "Elias cometh and shall restore all things and he adds also the testimony of the prophet (Isa. lix. 20,)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
