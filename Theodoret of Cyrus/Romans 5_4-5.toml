[[commentary]]
quote='''
Knowing that tribulation worketh patience, and patience proof, and proof hope. And hope maketh not ashamed. When misfortunes surround a man, and he bears their attack nobly, he is thereby shown to stand his proof, and leans on the hope of the future; and this is not a fallacious hope, but one based on truth; which is what he means by maketh not ashamed, they who hope, and then are disappointed, being confounded and ashamed.

Because the love of God is shed abroad in our hearts, by the Holy Ghost which is given unto us. For the grace of the thrice holy Spirit, which we received through baptism, has kindled the love of God within us. And he then sets forth the causes of this love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
