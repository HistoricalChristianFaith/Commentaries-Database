[[commentary]]
quote='''
But if the Spirit of Him that raised up Jesus from the dead dwell in you, He that raised up Christ from the dead shall also quicken your mortal bodies by His Spirit that dwelleth in you. He invigorates them by hope of the future, and inspires them with willing readiness, sufficient for present contests; for ere long, says he, your bodies will be immortal, and superior to the passions that now molest them; and this will He do, the same, the God of all, who now so liberally bestows on us the earnest of the Spirit. And He has given us also a pledge of this resurrection, in the resurrection of Christ. And he teaches by all this, the unity of nature in the Godhead, for he calls the thrice-holy Spirit, the Spirit of the Father and of the Son; not that, as the infamous heretics say, He was created of the Father by the Son, but that He is of one substance with the Father and the Son, and proceeds from the Father, according to the teaching of the gospels. His grace it is, that is extended by Christ to such as are worthy. And he continues showing how we ought to triumph over the fleshly passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
