[[commentary]]
quote='''
Greet Amplias, my beloved in the Lord. Nor is this slight praise, for it is in the Lord that he calls him beloved; and this is demonstrative of his excellences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
