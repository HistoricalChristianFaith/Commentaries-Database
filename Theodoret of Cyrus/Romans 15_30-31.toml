[[commentary]]
quote='''
I beseech you, therefore, brethren, for the Lord Jesus Christ's sake, and for the love of the Spirit, that ye strive together with me in your prayers to God for me; That I may be delivered from them which do not believe in Judaea; and that my service which I have for Jerusalem may be accepted of the saints. With what praise worthy of it could any crown this blessed, aye, thrice blessed, brow? For first he both knew what would happen, and foretels it, for so he spoke to the elders of Ephesus at Miletus, "that the Holy Ghost witnesseth in every city, that bonds and afflictions await me" (Acts xx. 23); and when Agabus also predicted the same things, and all were weeping and endeavouring to detain him, the holy man cried out, "What, mean ye to weep and break mine heart? for I am ready not to be bound only, but also to die for the name of our Lord Jesus Christ" (Acts xxi. 13); and here he predicted that he would see both the Romans and Spaniards; and he adds that he would even come "in the fulness of the blessing of the gospel of Christ." And then, as fully contemplating the madness of the Jews, he begs also for their prayers not only as respected the disbelievers, but the believers also; for neither were they affectionately disposed towards him, because esteeming him a violator of the law; on which account he added, and that my service which I have for Jerusalem may be accepted of the saints. With a thousand labours had he collected these offerings, using every argument of exhortation with the disciples thereto, and yet he fears concerning those who should receive them, lest their dislike to himself should have greater weight with them than their own wants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
