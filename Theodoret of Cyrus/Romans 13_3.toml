[[commentary]]
quote='''
For rulers are not a terror to good works, but to the evil; for they chastise those that live in wickedness. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
