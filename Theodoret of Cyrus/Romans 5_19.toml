[[commentary]]
quote='''
For as by one man's disobedience many were made sinners, so by the obedience of one shall many be made righteous. With great nicety does he here, in the case of those under Adam, and that of those under grace, adopt the word many, for indeed among the former we find some, who were superior to the grosser sins, as Abel, and Enoch, and Noah, and Melchisedek, and the patriarchs, and even those who became illustrious under the law; and after (the covenant of) grace there are many who embrace a sinful life.

Having thus shewn us, from what took place through Adam, the reasons for the divine incarnation, he brings forward the objection which might arise, and offers a solution. The objection is with regard to the law, which was given in the interim between Adam and the appearance of the Saviour; wherefore the holy apostle says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
