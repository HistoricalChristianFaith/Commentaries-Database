[[commentary]]
quote='''
Is He the God of the Jews only; is He not also of the Gentiles? Yes, of the Gentiles also. And then, as a position which cannot be disputed, he confirms it by the assertion, Seeing that it is one God which shall justify the circumcision by faith, and the uncircumcision through faith. It is one God, who is the God of all; one, who is the Maker of all; nor is it possible that He should be careful for some, and leave others uncared for; wherefore He extends His salvation to all that believe. By circumcision he means the Jews, by uncircumcision the Gentiles. And he next resolves the objection which might be raised,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
