[[commentary]]
quote='''
Salute Urbanus our helper in Christ, and Stachys my beloved. With even yet greater praises does he honour Urbanus, for he calls him a helper both in the preaching, and in the labours and sufferings, for Christ's sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
