[[commentary]]
quote='''
That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised Him from the dead, thou shalt be saved. For with the heart man believeth unto righteousness, and with the mouth confession is made unto salvation. For both are necessary, a sound and firm faith, and a confession uttered with boldness; that both the heart may be adorned with a certain persuasion of faith, and the tongue dignified with a fearless proclamation of the truth. And then again he adduces the testimony of Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
