[[commentary]]
quote='''
So then every one of us shall give account of himself to God. Having pointed out the tribunal of the Lord, most consistently does he exhort them not to judge one another, but to await that judgment; for so he again subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
