[[commentary]]
quote='''
Who art thou that judgest another's servant? to his own master he standeth or falleth. Every servant while living is a source of profit to his own Master, and on death again brings him loss; and this man then the Lord of all things has bought, having given His own blood as the price of his purchase; and having said "to his own Master he standeth or falleth," he necessarily adds, Yea, he shall be holden up; and establishes what he says by the power of God, for God is able to make him stand. Having spoken thus much concerning foods, he transfers his discourse to the matter of days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
