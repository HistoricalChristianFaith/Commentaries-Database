[[commentary]]
quote='''
For I will not dare to speak of any of those things which Christ hath not wrought by me, to make the Gentiles obedient, by word and deed. By the power of signs and wonders, by the power of the Spirit of God. My boasting is not in mine own labours, but in the gift bestowed on me by the Lord Christ. For he has given me the grace of the thrice-holy Spirit, to the working of signs and wonders; so that by these means the Gentiles have been rescued unto life, and received the light of divine knowledge. And he shews also to how large a portion of the Gentiles he had preached; so that from Jerusalem and in a circle unto Illyricum I have fully preached the gospel of Christ. For I have tended not those nations lying in the direct line only, but traversing also in a circle have fully supplied with the doctrines of the gospel the eastern regions also, and those about Pontus, together with portions of Asia and Thrace; for this is what the words in a circle indicate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
