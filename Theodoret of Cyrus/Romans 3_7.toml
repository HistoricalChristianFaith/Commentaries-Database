[[commentary]]
quote='''
For if the truth of God hath more abounded through my falseness unto His glory, why yet am I also judged as a sinner? It is one of the most absurd things thus to speak; for the sentence of God is just. Nor can my own unworthiness advance at all the glory arising to God for His kindness, for it were the extremest injustice that they who advanced His glory should yet suffer vengeance from Him, and expect eternal punishment; this indeed is what not even the most unjust of men would do, how far less then He, from whom flow the very fountains of righteousness!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
