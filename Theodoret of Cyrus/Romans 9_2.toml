[[commentary]]
quote='''
That I have great heaviness and continual sorrow in my heart. The composition of the sentence is incomplete, for it should have been added that the continual sorrow was caused by the rejection, or infidelity of the Jews; but through caution he omits these distinct words, and is content to teach in the sequel that he so meant. For thus he speaks:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
