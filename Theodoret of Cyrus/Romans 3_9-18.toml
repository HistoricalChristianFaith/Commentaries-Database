[[commentary]]
quote='''
In what then are we better than they? for we have proved before both Jews and Gentiles, that they are all under sin: As it is written, There is none righteous, no, not one: There is none that understandeth, there is none that seeketh after God. They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one. Their throat is an open sepulchre; with their tongues have they used deceit; the poison of asps is under their lips: Whose mouth is full of cursing and bitterness: Their feet are swift to shed blood: Destruction and misery are in their ways: And the way of peace have they not known: There is no fear of God before their eyes.

In the part above explained, where he was comparing the case of the circumcision with that of the uncircumcision, he subjoined, "What more then had the Jew?" and here, wishing to show the pre-eminence of the grace of the gospel, he says, In what then are we better than they? for we have demonstrated that those without the law, and those within it, have both gone astray, and he adds the testimony of David as exactly adapted to the matter in hand; and he does so, as being particularly studious of brevity, since otherwise he might have called in all the prophets to the condemnation of the Jews, who allege the same, and even worse, things against them; whence he goes on,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
