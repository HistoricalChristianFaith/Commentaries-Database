[[commentary]]
quote='''
Because that when they knew God, they glorified him not as God, neither were thankful. For that they were aware of the existence of God, they themselves testify by their continual use of His adorable name, while yet rejecting all suitable sentiments concerning him. But became vain in their imaginations, and their foolish heart was darkened, for they followed senseless notions, and welcomed in the darkness of infidelity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
