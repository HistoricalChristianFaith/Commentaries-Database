[[commentary]]
quote='''
Communicating with the necessities of the saints. Having mentioned communication he exhorts to liberality; for who would not choose to impart of his wealth, thereby to become a sharer in good deeds? for so also did he say in his Epistle to the Corinthians, "that your abundance may be a supply for their want, that their abundance also may be a supply for your want." Given to hospitality. The guests he means are not the saints only, but such also as have come from any quarter whatsoever, and need entertainment, whom he commands us to take care of.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
