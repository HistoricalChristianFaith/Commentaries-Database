[[commentary]]
quote='''
Who, knowing the judgment of God, that they which commit such things are worthy of death, not only do the same, but have pleasure in those that do them. We have shown how nature teaches us to choose good, and avoid evil; but these, says he, nevertheless, think it not enough to commit such things, unless they also commend such as do so likewise: which is the last excess of wickedness, seeing that they ought not only to hate the transgressions of others, but with loathing to reprobate even their own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
