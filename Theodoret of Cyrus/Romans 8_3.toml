[[commentary]]
quote='''
For what the law could not do, in that it was weak through the flesh. The law then was not evil, but good, though impotent; and that weakness arose from its injunctions being given to those encumbered with a mortal nature, for now by the thrice-holy baptism we have received the pledge of immortality. God sending His own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh. He says not in the likeness of flesh, but in the likeness of sinful flesh, for He received actually the human nature, but human sin he received not; wherefore that which He thus assumed, he calls not the likeness of flesh, but the likeness of sinful flesh, because though He had the same nature with ourselves, He yet had not the same character or disposition. He means, then, that the law having been unable to bring to effect its own design, by reason of the weakness of those beneath its covenant, possessing as they did a mortal nature, and one obnoxious to infirmities and passions; the only-begotten Word of God, becoming incarnate, by that human flesh overthrew sin, in having fulfilled all righteousness, and admitted no taint of sin; and by enduring the death of sinners, as though Himself a sinner, manifested the injustice of sin, in that it delivered up to death a body over which death had no just claim. And this then both overthrew it and put an end to death; for in thus submitting to death through the unjust sentence of sin, while not at all obnoxious to it, in that He never committed sin, did He become the price of redemption of those justly subjected unto death, as one free among the dead: for so he also teaches in what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
