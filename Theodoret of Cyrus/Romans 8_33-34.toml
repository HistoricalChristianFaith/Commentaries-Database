[[commentary]]
quote='''
Who shall lay any thing to the charge of God's elect? It is God that justifieth. Who is he (then) that condemneth? Having said that while God helps, who can injure us? he adds, that God, having rendered us justified, who can condemn? Christ it is that died, yea rather that is risen again, who is ever at the right hand of God, who also maketh intercession for us. What more than all this seek ye? in our behalf the Lord Christ died, and having risen again sits by the Father; nor even thus has He ceased His care for us, but pointing to the first-fruits which He took from us, and showing its immaculate purity to the Father, by it He asks for salvation to ourselves. And this indeed he says as regards the humanity, for as God He asks not, but (Himself) grants. Nay, and even if the heretics should declare, that so the Son does as regards His divinity, neither so could they prove His glory to be the less. For let us suppose two kings to be equal in honour, and to have the same authority, and when some deputy or general has offended against both, the one of these having earliest received the prayer of the culprit to beg of the partner of his kingdom to admit him to reconciliation, does this at all diminish the dignity of him that makes this request? By no means. But in the present case we cannot grant even so much as this, for whatsoever seems good to the Son, pleases the Father also, and the will of both is the same. The passage therefore is figuratively expressed by the apostle, through his desire to set forth the greatness of (Christ's) zeal and watchfulness for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
