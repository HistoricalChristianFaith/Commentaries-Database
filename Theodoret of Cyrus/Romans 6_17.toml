[[commentary]]
quote='''
But God be thanked that ye were the servants of sin, but ye have obeyed from the heart that form of doctrine which was delivered you. He both points out the change in themselves, and exhibits the joy arising therefrom, giving praise to God; for ye were, says he, the servants of sin, but by your own voluntary choice you have shaken off its sovereignty, and embraced the divine polity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
