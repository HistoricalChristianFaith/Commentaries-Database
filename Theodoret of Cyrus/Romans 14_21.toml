[[commentary]]
quote='''
It is good neither to eat flesh, nor to drink wine, nor any thing whereby thy brother stumbleth, or is offended, or is made weak. And not as regards flesh alone, but wine also, I bid thee never to indulge in either, if this really work any harm to thy neighbour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
