[[commentary]]
quote='''
Where is boasting then? This must be read interrogatively, and then comes the answer, It is excluded. He says not destroyed, but excluded; that is, has no longer any place. By boasting he means the haughty self-esteem of the Jews, who exalted themselves as the only possessors of God's favour; while now, divine grace having appeared abroad, and been shed among all nations, this arrogance had been put out of the question, in that God had given to man a short and easy mean of salvation in faith; for this the apostle continues to show forth in the following sentences also, By what law? of works? Nay, but by the law of faith. He calls faith here a law, not from inconsideration, but as recollecting the prophecy of Jeremiah (xxxi. 31, 32,) "For in those days, saith the Lord, and at that time, I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant that I made with their fathers."

If then the Mosaic law is thus styled a covenant, and the new covenant again bears also the same name, and faith in Christ be the law it enacts, in strict accordance with the phraseology of the prophet does the holy apostle here apply the name of the law to faith. And then he subjoins the conclusion concerning faith:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
