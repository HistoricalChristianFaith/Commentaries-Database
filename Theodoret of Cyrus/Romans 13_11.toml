[[commentary]]
quote='''
And that, knowing the time, that now it is high time for us to awake out of sleep; that is, especially as this is not a time for sleep, but for arousing ourselves from slumber; for now is our salvation nearer than when we believed; for each day we draw nearer to the coming of the Lord (in judgment.)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
