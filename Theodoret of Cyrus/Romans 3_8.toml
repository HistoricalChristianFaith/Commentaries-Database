[[commentary]]
quote='''
And not also, as we be slanderously reported, and as some affirm that we say, Let us do evil that good may come? whose damnation is just. None of these things, says he, we ourselves maintain, but are calumniously reported so to speak by others, who will suffer the due reward of their calumny. For we must know that, as the holy apostles had declared that where sin abounded, grace did yet more abound, some who themselves were zealous in piety, yet uttering false accusations against them, had published, that they had said, Let us do evil that good may come. But not such indeed was the object of the apostolic doctrine, for they laid down exactly contrary rules, that all should abstain from every iniquity, while only exhorting such as came to their thrice-holy instructions to be of good cheer, in the pardon vouchsafed by God for past offences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
