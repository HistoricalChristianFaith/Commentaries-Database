[[commentary]]
quote='''
As it is written, (Isa. vi. 10, xxix. 10,) "God hath given them the spirit of slumber, eyes that they should not see, and ears that they should not hear unto this day." Gave them, as "gave them up," (i. 24,) that is, permitted them (to fall into), for God did not incline them to disbelief, for how were it possible for Him to have inflicted infidelity on them, and Himself demanded vengeance for the same? And this the prophet has yet more clearly shown, (ch. vi. 10, LXX., as also so cited Matt. xiii. 15, Acts xxviii. 27,) "for this people's heart is waxed gross, and their ears are dull of hearing, and their eyes have they closed." Not another then has blinded them, but themselves have closed their eyes, and have not chosen to see the light. And by the spirit of slumber, he means a fixed and obdurate mind; that as he who enjoys a sound and healthy sleep is open to no change for the worse, so he who has surrendered himself up entirely to evil, admits no alteration for the better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
