[[commentary]]
quote='''
But if thy brother be grieved with thy meat, now walkest thou not charitably. He increases the accusation (by that of want) of charity, to expose him that thus acted; and then even more fully points out the folly of such conduct. Destroy not him with thy meat, for whom Christ died. For him the Lord Christ endured death, while thou art not willing by a mere abstinence in food to gain life for him, but by indulgence contrivest death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
