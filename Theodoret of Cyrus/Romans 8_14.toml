[[commentary]]
quote='''
For as many as are led by the Spirit of God, they are the sons of God, for they who live under the Spirit obtain the privilege of adoption; and here he strikes at the Jews, teaching them not to think too highly of themselves, forasmuch as that they also had been called sons, for they are wanting in the glory of the thrice-holy Spirit, being aliens from grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
