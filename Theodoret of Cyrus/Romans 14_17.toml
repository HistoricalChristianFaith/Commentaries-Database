[[commentary]]
quote='''
For the kingdom of God is not meat and drink, but righteousness, and peace and joy in the Holy Ghost. For imagine not that this is the perfection of excellence, and what will procure the kingdom of heaven; for what procures that is true righteousness, and concord, and zeal as to peace, and love, from which springs joy, as to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
