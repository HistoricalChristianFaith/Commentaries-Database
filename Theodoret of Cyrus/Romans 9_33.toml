[[commentary]]
quote='''
As it is written (Isa. viii. 28), Behold I lay in Sion a stumbling-stone and rock of offence; and whosoever believeth on Him shall not be ashamed. They are wont to stumble who turn their attention elsewhere, and do not choose to look at their path. This had been the case with the Jews. For, being intent on the veriest minutiae of the law, they chose not to see the stone foretold by the prophets, although they had distinctly predicted, that whosoever trusted in Him should obtain the greatest blessings; for this is what he means by shall not be ashamed, such as hope, and then fail in their expectations being ashamed. Having thus gently touched them, again he exhibits the feelings he entertained towards them, lest his arguments should assume the appearance of arising from hostility, for he has kept the heavier censures for the last.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
