[[commentary]]
quote='''
For we know that the whole creation groaneth and travaileth in pain together until now. Here he includes the invisible creation also, for the whole creation, says he. But for the clearer understanding of the passage, I must bring to remembrance what the gospels state, for there the Lord declared, (Luke xv. 10.) that "even the angels in heaven rejoice over one sinner that repenteth;" if then they joy over penitent sinners, then must they also of a truth be cast down on beholding our transgressions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
