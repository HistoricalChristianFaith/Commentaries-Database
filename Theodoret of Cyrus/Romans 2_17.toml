[[commentary]]
quote='''
Behold, thou art entitled a Jew, for this title was from of old a general and honourable one, wherefore he says not merely named, but entitled; and restest in the law, for thou weariest not thyself, like him who is a stranger to the law, in searching after what is right and fitting in practice, but hast the law itself teaching thee all things plainly; and makest thy boast of God, as of one, who has honoured thee above all the nations on the earth, dignified thee with his especial providence, bestowed on thee the law, and led thee by the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
