[[commentary]]
quote='''
I find then the law with me in wishing to do what is right,—here we must put a stop,— (and yet) that evil is present to me. Again he has stated this obscurely through brevity: what he means is, that the law appears to me to be good, for I approve all that it recommends, as being right and excellent; and in unison with it I also love all good, and hate its opposite; but nevertheless evil is ever at hand with me, that is, sin, by reason of my possessing a mortal body, one subject to passions and appetites, as well as through the indolence and weakness of the soul. And thence he proceeds to describe more clearly the conflict between the mind and the passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
