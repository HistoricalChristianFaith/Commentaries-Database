[[commentary]]
quote='''
And thus indeed reckon ye also yourselves to be dead unto sin, but alive unto God, through Jesus Christ. And do you, therefore, display your bodies dead to the inworking of sin, but embrace the life which is after Christ, by which you shall obtain the life eternal. To this advice it behoves us all to take heed, flying from the snares of sin, and calling to our aid Christ who has saved us; for, if called, He will appear, and extend to us His own strength: in conjunction with whom, to the Father, with the thrice-holy Spirit, belong glory and majesty, now and for ever, unto endless ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
