[[commentary]]
quote='''
Who shall separate us from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or the sword? As it is written (Ps. xliv. 22,) For Thy sake we are killed all the day long; we are accounted as sheep for the slaughter. The witness adduced is exactly correspondent to the subject in hand, for it was spoken in the persons of those who had the same object, for the thrice-holy Spirit wrote this psalm by the inspired David, concerning the admirable Maccabees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
