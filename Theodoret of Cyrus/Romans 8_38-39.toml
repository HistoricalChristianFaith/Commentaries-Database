[[commentary]]
quote='''
For I am persuaded that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other such creation, could be able to separate us from the love of God, which is in Christ Jesus our Lord. Having weighed the whole creation at once against the love of God, and added to such as are visible, such as are perceptible only by the mind—angels, and powers, and dominions; and to the present, hoped for, blessings; as well as threatened punishments also; for by depth, as I apprehend, he signifies hell, and by height the kingdom (of heaven); and moreover everlasting life and eternal death; and seeing that even then this scale is lightest in the reckoning, he seeks for somewhat else to be cast in; and finding nothing, he frames into his account another such and as varied an universe; and neither so does he find all these together fit to be weighed against the love of God. For it behoves us, says he, not to love Him on account of His promises of blessings, but to desire them on His. For (so) neither if a man be sincerely well affected towards one who is rich, does he love him for the abundance of his wealth; but from his very affection towards him, loves also the possessions belonging to him; and in like manner the holy apostle declares, I would not choose to inherit the kingdom of heaven, and all visible and invisible creation, and as many such again twice or thrice multiplied, apart from the love of God; but rather were any one to lay before me present and future distresses, present and eternal death, and the most protracted punishment in hell, together with the love of Him, readily and welcomely would I choose these in preference to the former splendid and glorious and unspeakable objects, devoid of love to Him. Which therefore that ourselves may also possess, let us both pray and strive, so that following in the footsteps of the apostles, we may be made sharers thereby in the (eternal) habitations of the apostles, through the grace and mercy of our Lord Jesus Christ; with whom, to the Father, together with the thrice-holy Spirit, belong glory and majesty, now and ever, unto endless ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
