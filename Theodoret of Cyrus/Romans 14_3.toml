[[commentary]]
quote='''
Let not him that eateth despise him that eateth not. For the Gentile converts despised the Jewish, as not possessing a sound faith, and as on this account being unwilling to partake of such kind of food. And let not him that eateth not judge him that eateth. And the Jewish indeed condemned the Gentile converts, esteeming their indiscriminate use of every kind of food transgression. For God hath received him; that is, the Gentile convert; and he goes on in his rebuke of the Jew:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
