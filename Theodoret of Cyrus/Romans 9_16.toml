[[commentary]]
quote='''
So then it is not of him that willeth, nor of him that runneth, but of God that showeth mercy. And he brings not yet the resolution of all this, but continues still the whole question by the addition of what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
