[[commentary]]
quote='''
For circumcision verily profiteth, if thou keep the law; but if thou be a breaker of the law, thy circumcision is made uncircumcision. The holy apostle follows in the train of the ancient prophecies, the God of all says by the prophet Jeremiah, (ix. 26;iv, 4.) "All the Gentiles are uncircumcised in the flesh, but the house of Israel are uncircumcised in their hearts;" and again, "Circumcise yourselves to God;" adding, in order to show what is the circumcision which he speaks of as pleasing to God, "take away the hardened foreskin of your hearts."

Starting from this point, the holy apostle shows that circumcision is idle, if the circumcision of the heart be wanting, for it was instituted in order to that, which if absent the other is of no avail, since it bears but the part of a sign. For where we put gold, or silver, or precious stones, or valuable raiment, we are in the habit of affixing a mark, but, when none of these is within, the inscription of such a mark is idle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
