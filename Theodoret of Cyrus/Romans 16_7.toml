[[commentary]]
quote='''
Salute Andronicus and Junia my kinsmen, and my fellow-prisoners, who are of note among the Apostles, who also were in Christ before me. Many at once are the encomia here; and first that they had been partakers in the dangers of the holy Paul, for he calls them fellow-prisoners as having shared with him in his sufferings; and next he says that they are of note, not among the disciples, but the teachers; nor among ordinary teachers, but the Apostles; and he extols them also on account of the date of their faith, for he says, who were in Christ before me, for I myself was called subsequently to them; and I (Theodoret) am every where amazed at the humble-mindedness of the divine Apostle (lit. head.)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
