[[commentary]]
quote='''
When therefore I have performed this, and have sealed to them this fruit, I will come by you into Spain. Having sealed to them this fruit, to the Macedonians and Achaians he means; for I offer the things sent, to the right hand of God through the hands of the saints, and it will keep them safe and uninjured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
