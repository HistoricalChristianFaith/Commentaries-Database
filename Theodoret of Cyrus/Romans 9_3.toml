[[commentary]]
quote='''
For I could pray to be myself anathema from Christ for my brethren, my kinsmen according to the flesh. The word anathema has two significations, for that which is consecrated to God is called an anathema, and that which is separated from Him has the same name, and this second meaning the holy apostle has taught us in the Epistle to the Corinthians (1 Cor. xvi. 22), "If any man love not our Lord Jesus Christ, let him be anathema"—the first being explained even by common custom, for so we designate whatever is offered to God an anathema—and the God of all things Himself, in commanding the town of Jericho to be made an anathema (Joshua vi. 17). Here then the blessed apostle uses it in its second meaning, to manifest the feelings he entertained towards his brother Jews, and he says not I could desire, but I could pray to be separated from Christ, provided that they who are my kindred in the flesh, being united to Him, should reap salvation; and most aptly does he introduce the "even I myself" recalling to their recollection what he had just before stated of his love to Christ, and as it were saying, that I, whom "neither life, nor death, nor things present, nor things to come, nor any other such creation, could separate from the love of God which is in Christ Jesus," would gladly be alienated from Him, for the sake of the salvation of the Jews. But it is evident that he speaks not this as preferring them to the Saviour, but as indicating his love and anxiety for them, being most desirous that all should submit themselves, and joyfully receive the saving gospel. And to persuade them of the truth of what he says, he points out both their former high descent and eminence, and the riches of the divine gifts conferred on them, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
