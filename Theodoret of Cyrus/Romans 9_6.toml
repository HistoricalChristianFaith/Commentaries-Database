[[commentary]]
quote='''
Not as though the word of God hath taken none effect. I indeed, says he, not only could desire, but could also even pray, to be separated from Christ, if it were possible that by this separation of mine the Jews should gain the blessings held out, but nevertheless should they still prove gainsayers, and refuse to receive salvation, the promises made to the fathers would still remain true. How then? For they are not all Israel, which are of Israel. For God seeks not the relationship of nature, but of virtue; and then he teaches this yet more plainly;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
