[[commentary]]
quote='''
I say then, Hath God cast away his people? God forbid. And then while able to adduce proof of this from many other quarters, and bring forward the three thousand who believed in Jerusalem, (Acts ii. 41,) and the many myriads of whom the great James spake, (Acts xxi. 20,) and those of the Jews spread over the face of the land who had accepted the gospel, instead of all these he instances himself; and says, For I also am an Israelite, of the seed of Abraham, of the tribe of Benjamin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
