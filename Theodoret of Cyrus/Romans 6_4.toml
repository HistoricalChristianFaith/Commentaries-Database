[[commentary]]
quote='''
Therefore we are buried with Him by baptism into death, that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life. The very sacrament of baptism has taught thee to fly from sin, for baptism carries in it the representation of our Lord's death, for in that thou hast communicated both in the death and in the resurrection of Christ. It becomes thee therefore to lead a new life, as it were, and one suited to Him in whose resurrection thou hast partaken. The divinity of Christ is what he here calls the glory of the Father, for thus also in another epistle he speaks, (Eph. i. 17,) "That the God of our Lord Jesus Christ, the Father of glory . . . . ." and the Lord in the gospels (John ii. 19,) "Destroy this temple, and in three days I will raise it up again." Nay, and if heretics will not receive this interpretation, neither so can they injure the glory of the Only-begotten, for, even granting that it was the Father who raised Him up, as man it was that He raised Him, for as man it was that He also endured the passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
