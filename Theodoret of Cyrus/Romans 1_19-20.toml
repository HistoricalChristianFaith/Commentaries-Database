[[commentary]]
quote='''
Because that which may be known of God is manifest in them: who then gave them this knowledge? for God hath showed it unto them. For the invisible things of Him from the creation of the world are clearly seen, being understood by the things that are made, even His eternal power and Godhead. Creation, says he, and all things made in that creation, the succession of time, the change of seasons, the alternations of day and night, the labourings of the clouds, the blasts of the winds, the fruitfulness of plants and seeds, and the various other similar phenomena, plainly point out to us, that God is both the Maker of all things, and that He wisely holds the keys of the creation; for He who framed all things of His alone lovingkindness, can never leave neglected what He hath brought into being; wherefore the holy Apostle says not the invisible thing, but invisible things; that is, His creation, His providence, His just sentence on each person, and all His various dispensations; most unpardonable then are they who, enjoying such a multitude of teachers, yet have received no improvement from so many lessons, for this he adds, so that they are without excuse, for the works of creation themselves almost cry out against them, that they have nothing to plead in arrest of the threatened evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
