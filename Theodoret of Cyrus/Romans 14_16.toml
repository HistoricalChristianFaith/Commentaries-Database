[[commentary]]
quote='''
Let not then your good be evil spoken of. Again, the accusation is made in conjunction with praise, for faith he calls a good thing. I commend, says he, thy faith, but I would not that it become the cause of injury and reproach.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
