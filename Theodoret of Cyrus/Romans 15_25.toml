[[commentary]]
quote='''
But now I go unto Jerusalem to minister unto the saints. By ministering he means the distribution of a pecuniary collection; and he mentions also the senders thereof;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
