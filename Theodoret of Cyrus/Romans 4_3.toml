[[commentary]]
quote='''
For what saith Scripture? Abraham believed in God, and it was counted to him for righteousness. For the blessed Abraham obtained not the divine attestation by living according to the law, but enjoyed the riches of justification by believing on Him that called him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
