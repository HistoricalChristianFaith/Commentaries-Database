[[commentary]]
quote='''
Likewise the church that is in their house. The expression shews the greatness of their piety, for they instructed, it appears, all their household in the highest virtue, and gladly performed within their walls all the sacred rites of religion; and of these the holy Luke also takes notice, and shews how they led Apollos to the truth. (Acts xviii. 20). Salute my well-beloved Epenetus, who is the first fruits of Achaia unto Christ. For he was the first, it seems, of the whole nation that believed, on which account it was that he here receives the appellation of the first fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
