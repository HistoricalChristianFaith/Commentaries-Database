[[commentary]]
quote='''
Let every soul be subject unto the higher powers. Whether a man be a priest, or a bishop, or profess a monastic life, let him be subject to those who are invested with authority; evidently if it be consistent with duty to God, for any opposition to the divine laws leaves us not the power of obeying our rulers. For there is no power but of God; the powers that be are ordained of God. And these come from the providence of God; for He, consulting the general well-being, ordained some to govern, and some to be governed, imposing the fear of the magistrate to serve as a bridle on evil doers. But we must observe, that it is the ordinance of ruling and being ruled, which the holy Apostle derives from the providence of God, and not (so much) the elevation of this or that specific individual to power; for it is not (so much) the sway of the unjust, but the constitution of the office itself which is of God's appointment. And yet, when kindly-disposed towards any, He gives them rulers who respect and keep justice, for "I will give them," says He, "pastors according to Mine heart, which shall feed them with knowledge" (Jer. iii. 15); and again, "I will give your judges as at the first, and your counsellors as at the beginning" (Isa. i. 26); and when again desirous to chastise transgressors, He suffers them to be governed by evil governors also; for "I will place over them," says He, "children to be their princes, and scoffers shall rule over them" (Isa. iii. 4); but it is time to return to the rest of the exposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
