[[commentary]]
quote='''
But God commendeth his love towards us, in that, while we were yet sinners, Christ died for us. God then makes manifest the greatness of His love towards us, in the death of Christ having been undergone, not for such as had been just, but for such as were yet transgressors. For we now have been justified by faith in Him, but, when He undertook that death for us, we were still subject to every kind of sin; the words, in time, mean, at the fit time, in due time, and this he says also in his epistle to the Galatians, (iv. 4, 5.) "But when the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
