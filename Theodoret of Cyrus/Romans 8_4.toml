[[commentary]]
quote='''
That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit. For He has paid, says he, our debt, and fulfilled that which the law aimed at: and what then was this? to render them righteous that had received that law. If then the dispensation of Christ Jesus has brought to effect the intention of the law, the law deserves not blame, but praise.

And having thus touched upon the subject of righteousness, he goes on to an exhortation to it, and having said, who walk not after the flesh, but after the Spirit, adds,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
