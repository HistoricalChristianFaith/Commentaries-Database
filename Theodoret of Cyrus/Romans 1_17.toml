[[commentary]]
quote='''
For therein is the righteousness of God revealed from faith to faith; not to all is it revealed, but to those who have the eyes of faith.

The holy apostle here teaches us how from of old God has thus provided for us, and predicted the same by the prophets; and even before the prophets, had his own determination concerning these things secretly within himself, for this also he states in another place, (Eph. iii. 9,) saying, "The mystery which hath been hidden in God, who created all things; "and again, (1 Cor. ii. 7,) "We speak the wisdom hidden in a mystery, which God foreordained before the world, unto our glory." And here therefore he says not that righteousness is given, but revealed; for that which had been so long hidden is now made known to believers. From faith to faith, says he; for we ought to believe the prophets, and by them be brought to the faith of the gospel.

But this may bear another sense also; for he who believes in our Lord Christ, and has received the grace of the most holy baptism, and enjoys the free gift of adoption, is led on to believe in yet further coming blessings; the resurrection of the dead, I mean, eternal life, and the kingdom of heaven. By the righteousness of God, revealed in the gospel, he speaks not only of that which is hereby supplied to us, but that also which is so plainly set forth in the mysterious scheme of this his dispensation. For he effected not our salvation by mere power, nor destroyed the strength of death by his mere voice and command, but by combining pity with justice. For the very only-begotten Word of God, by putting on the nature of Adam, and keeping it free from all sin, obtained this for us, and paying the debt of nature, discharged the common forfeit of mankind.

But all this the holy apostle teaches more clearly below, and it were better for us to follow on our exposition passage by passage. Having then said that this salvation was offered to both Jews and Greeks, provided they were themselves duly disposed towards it, he confirms the assertion by the testimony of Scripture, saying, Even as it is written, The just shall live by faith. This he subjoins for the sake of the Jews, in order to teach them not to cling still to the dispensation of the law, but listen rather to their own prophets, who from of old set forth salvation through faith. And here, quitting his first point—the censure of the Jews, he commences his charge against all the gentile nations, that they had recklessly violated the law implanted in their nature by their Maker. And this blame of them includes a vindication of the Creator; for when he formed them, he suffered them not to live like the irrational creation, but dignified them with reason, and gave them judgment, and established in them the power of discriminating between good and evil; which position is evidenced by such as, before the coming of the Mosaic law, were illustrious for holiness and virtue, as well as by such as followed the opposite course. For so Adam, the instant he had transgressed the commandment, and eaten the forbidden fruit, attempted to hide himself, under the stings of conscience; and when called to account, neither denied what had been done, nor pretended ignorance in his defence, but threw the blame of the accusation on the woman; which plainly shows that our nature possessed the power of discerning the true character of things. And thus again Cain, having privily slain his brother, when examined, "Where is thy brother Abel?" denied it, and attempted to conceal what had been done, but when convicted, confessed that his punishment was just, and owned the equity of his judge, acknowledging that he had sinned beyond pardon; and a thousand other similar instances are to be found in the holy Scriptures: wherefore the holy apostle adds,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
