[[commentary]]
quote='''
But glory, honour, and peace to every man that doeth good, to the Jew first, and also to the Gentile.

He speaks thus, not without a distinct design, but with a view to what follows, where he enters upon the accusation of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
