[[commentary]]
quote='''
I commend unto you Phoebe our sister, which is a servant of the church which is at Cenchrea, That ye receive her in the Lord as becometh saints, and that ye assist her in whatsoever business she hath need of you, for she hath been a succourer of many, and of myself also. Greet Priscilla and Aquila my helpers in Christ Jesus. Cenchrea is a very large village of Corinth. Well then may we admire the power of the gospel, in that in so short a time it had filled with true godliness not the towns only but even the villages also; and so great was the body of the church at Cenchrea, as to have a woman acting as deaconess; and her a celebrated and illustrious person; for so largely did she abound in good works as to have obtained praises like the above from the tongue of an apostle; for she has been a succourer, says he, of many, and of myself also, by succour meaning, as I conceive, hospitality and kind attention. And he repays her with far greater honours in return; for she, it seems, received him into one house, and for a short time; that, it is plain, which he spent at Corinth; while he has opened the whole world to her, and in every land and sea is that woman become celebrated, so that not the Romans only and the Greeks have known her, but even every barbarian nation. And yet she next mentioned has surpassed even her, for Priscilla, or Prisca, for both names are to be found in the Bible, and Aquila, he calls fellow-helpers; and he adds the in Christ Jesus, lest any one should imagine that he alluded to a community of employment, seeing that they also were tent-makers; and he mentions also another trial (undergone by them on his account) of the greatest kind;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
