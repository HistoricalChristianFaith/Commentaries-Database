[[commentary]]
quote='''
Therefore as by the offence of one judgment came upon all men to condemnation; even so by the righteousness of one the free gift came upon all men unto justification of life. Doubt not, says he, concerning what I have said, while looking to Adam; for if those things be true, as indeed they are true, and when he had sinned the whole race received the sentence of death; it is plain, that the righteousness of the Saviour gains life to all men. And again he puts the same thing in another form, varying his phrase, and again and again re-stating it, in order the more clearly to open the mystery of the dispensation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
