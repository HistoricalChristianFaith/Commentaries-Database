[[commentary]]
quote='''
Do we then make void the law through faith? God forbid; yea, we establish the law. For of old both the law and the prophets prophesied of the things concerning the faith, and in receiving therefore the faith we confirm the law. He then brings forward evidences of all this, and, while having it in his power to adduce a vast variety of testimonies from the prophets, prefers going at once to the very root of the Jews, and demonstrates that the righteousness of the patriarch Abraham himself was that which is of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
