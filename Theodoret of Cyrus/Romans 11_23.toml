[[commentary]]
quote='''
And they also, if they abide not in unbelief shall be grafted in. For it becomes the righteousness of God, both to sever again from the root thee, who contrary to hope wert blessed with the privilege of that root, if thou thereafter preserve not the grace given; and to join them again to it, if they renounce their infidelity. And aptly does he use the words grafted in as regards them also, infidelity having altogether severed them from, and faith exactly, as in the case of the Gentiles, connecting them with, the root. For God is able to graft them in again. By mentioning the power of God, he shows the ease with which this would be done; and gives an instance, not one removed far from them, and of ancient times, but one which comes home, and was recent, for he calls themselves as witnesses to this; and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
