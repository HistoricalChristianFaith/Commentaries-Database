[[commentary]]
quote='''
Brethren, my heart's desire and prayer to God for Israel is, that they might be saved. An ardent wish is what he here calls a desire, for I ardently wish, says he, and pray, that they may obtain salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
