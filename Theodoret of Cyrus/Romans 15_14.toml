[[commentary]]
quote='''
And I myself also am persuaded of you, brethren, that ye also are full of goodness, filled with all knowledge, able also to admonish others. I know, says he, that ye need not instruction; for ye both possess sufficiently ample knowledge, and abound in good of every kind, so as even to extend to others also every fitting exhortation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
