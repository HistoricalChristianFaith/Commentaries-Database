[[commentary]]
quote='''
Even as David also describeth the blessedness of the man, unto whom God imputeth righteousness without works, Saying, Blessed are they whose iniquities are forgiven, and whose sins are covered. Blessed is the man, to whom the Lord will not impute sin. The law, says he, brought punishment on such as sinned, but the prophet speaks of the blessedness of those, who have received forgiveness of their sins. It is evident, therefore, that he is speaking of the blessedness of our own condition, and foretelling the free gifts of grace; and this grace he shows is open to all, saying interrogatively,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
