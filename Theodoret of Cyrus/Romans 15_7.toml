[[commentary]]
quote='''
Wherefore receive ye one another, as Christ also received us, to the glory of God. And indeed the Lord Christ loved us not as being holy, but receiving us while sinners so justified; we ought therefore ourselves also to bear the weakness of our brethren, and do all to forward their salvation. And seeing that the Jewish proselytes put forward the circumcision of our Lord, asserting that even Himself also had embraced the polity of the law, the holy Apostle thought it worth while to write what was fitting on this subject also; and he says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
