[[commentary]]
quote='''
One man esteemeth one day above another: another esteemeth every day alike, (for this purpose.) For some abstained from the meats forbidden by the law at all times, and some on particular days (only). Let every man be fully persuaded in his own mind. He lays not this down as a principle of universal application; for neither does he so bid us reckon as regards the doctrines of religion, seeing that he passes an anathema on those that permit themselves to preach contrary to the truth, (Gal. i. 9:) "For if any one preach unto you," says he, "any other gospel than that ye have received, let him be accursed." Concerning foods, then, only is it that he allows this power to each man's own mind. For so indeed this custom remains in the churches even to the present day, and one man embraces abstinence, and another without scruple takes of all kinds of food, and neither does the former condemn the latter, nor the latter find fault with the former, but mutually glory in the law of concord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
