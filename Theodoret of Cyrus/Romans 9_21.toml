[[commentary]]
quote='''
Hath not the potter power over the clay, of the same lump to make one vessel unto honour, and another unto dishonour? Look at the clay of the potter, which is devoid of rational discrimination; it answers not against its maker, but although set apart for the structure of some base vessel, it receives in silence what is done; but thou opposest and findest fault; therefore art thou not bound by physical necessity, nor transgressest against thine own inclination, but voluntarily embracest vice, and of thine own free choice undergoest the difficulties of virtue. Right, therefore, and just is the sentence of the God of all things, since with equity does he punish sinners as daring so to act of their own will. And in justice also is His loving-kindness, in that when He receives from us an opportunity, He extends His mercy to us. Some, however, interpret the Nay, but O man, who art thou that repliest against God? as spoken in rebuke; for so, say they, having first chidden those who are impertinently curious about divine matters, and shown their meanness, for man's nature differs not from the clay, does he proceed to the reply; and the reply is this—
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
