[[commentary]]
quote='''
Therefore if the uncircumcision keep the righteousness of the law, shall not his uncircumcision be counted for circumcision? The law, says he, demands practice; when then thou who art circumcised hast not this, but the uncircumcised has, oughtest not thou justly to be called a sinner, and he receive thine honourable name instead; no longer, according to your reproaches, being named uncircumcised, but rather circumcised, as having cut off the evil of his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
