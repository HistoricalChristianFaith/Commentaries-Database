[[commentary]]
quote='''
But the law came in between, that the offence might abound. He means not, by that it might, that such was its object; but uses the words according to his familiar mode of expression. But what he is shewing is, that neither in time past did God leave men neglected, but gave the law to the Jews, and by their means showed forth the light of religion on the rest of the nations also. And aptly has he put intervened, in that Christ was the end of the promise made to the patriarch; for "in thy seed," says He, "shall all the nations of the earth be blessed," and the law intervened between Abraham and Christ. And it taught the more clearly how evil a thing sin was, while yet it was incompetent to put a stop thereto, but only the more increased it, seeing that, in proportion as more commandments were given, so many the more became the violations of them. But where sin abounded, grace did much more abound. It invalidated not, says he, the mercy of God, but rather displayed the vastness of His loving-kindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
