[[commentary]]
quote='''
He that regardeth the day, regardeth it unto the Lord; and he that regardeth not the day, to the Lord he doth not regard it. He that eateth, eateth to the Lord, for he giveth God thanks; and he that eateth not, to the Lord he eateth not, and giveth God thanks. He says this in condescension to us, in order to produce peace and harmony in the church. The God of all, says he, knows the intention, both of those that eat, and of those that eat not, and he attends not to the bare deed, but inquires into the design of what is done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
