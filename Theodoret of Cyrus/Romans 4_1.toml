[[commentary]]
quote='''
What shall we then say that Abraham our father hath found, as pertaining to the flesh? What righteousness, says he, before he believed in God, have we heard that Abraham our father had as his own by works? for as pertaining to the flesh means that which is of works, inasmuch as it is by our fleshly bodies that works are done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
