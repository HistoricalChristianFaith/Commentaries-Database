[[commentary]]
quote='''
For I am not ashamed of the gospel of Christ; for it is the power of God unto salvation to every one that believeth, to the Jew first, and also to the Greek. I look not, says he, to the apparent disgrace, but to the blessing arising therefrom, namely, that from it believers obtain salvation.

And thus of mere outward objects many have their own property hidden within them; as pepper, for instance, has a cold appearance, and to those that are unacquainted with it shows no sign of heat, while he that bites it with his teeth perceives its fiery nature; on which account physicians rank it among hot things as to its quality, as though not looking so, and yet capable of being proved to be such. And thus also corn may become the root, and the stock, and the ear, which yet it could never seem, until it has been sown in the furrows of the field. Justly then does the holy apostle call the saving gospel the power of God, as exhibiting its power, and bestowing salvation, only on believers. And this he says is offered to all, both Jews and Greeks; and the Jews he puts first, before the Greeks, inasmuch as our Lord Christ sent the holy apostles as preachers to them first; for thus God proclaims by the prophet (Is. xlii. 6,) "I have appointed thee for a covenant of the people, for a light of the gentiles calling the Jews the people, since of them he sprung according to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
