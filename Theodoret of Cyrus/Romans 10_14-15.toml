[[commentary]]
quote='''
How then shall they call on Him in whom they have not believed? and how shall they believe in Him of whom they have not heard? and how shall they hear without a preacher? And how shall they preach, except they be sent? First, says he, must a person believe, and then call upon God; but it is impossible for any one to believe who has not enjoyed instruction, and this no one can obtain without there being teachers, and these again commission constitutes. Having laid down these positions as it were in vindication of the Jews, by them he increases the blame lying on them. And that which is first, (in order of time) namely, the sending forth of preachers, he puts last, as being about to show, that of old all this had been foretold; for it would have been in the common course to have set forth this before saying the rest, it being necessary first that preachers be appointed, then that they should preach, then that men should hear their preaching, and lastly believe. Therefore he adduces the prophecy of Isaiah, (lii. 7,) and says, How beautiful are the feet of them that preach the gospel of peace, and bring glad tidings of good things! for the Lord bade His apostles, when entering into a house to say, "Peace be to this house" (Luke x. 5), for they were proclaiming the divine reconciliation, and bringing glad tidings of the enjoyment of good things. The feet of such then he calls beautiful, as running a goodly course; as washed by the hands of the Lord Himself. And having thus brought forward the evidence concerning the preachers, he says interrogatively,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
