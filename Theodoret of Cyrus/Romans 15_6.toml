[[commentary]]
quote='''
That with one mind and one mouth ye may glorify God, even the Father of our Lord Jesus Christ. He calls God our God, but our Lord Jesus Christ's Father, for He who is the God of us all, is His Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
