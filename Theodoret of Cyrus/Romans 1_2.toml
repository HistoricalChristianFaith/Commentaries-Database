[[commentary]]
quote='''
Which he has promised afore by his prophets in the holy Scriptures, for the Old Testament is full of predictions concerning the Lord. Nor does he call them holy for no reason, but firstly to show that he acknowledged their inspiration; secondly, as excluding all other writings, for the inspired book alone contains all things we can need. And he adds the nature of the promise,—
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
