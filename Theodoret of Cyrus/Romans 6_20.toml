[[commentary]]
quote='''
For when ye were the servants of sin, ye were free from righteousness, for ye fulfilled its precepts only, while as to the laws of righteousness ye received not them at all. And then again, in another way, he exhibits the difference.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
