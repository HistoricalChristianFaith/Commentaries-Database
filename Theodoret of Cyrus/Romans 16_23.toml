[[commentary]]
quote='''
Gaius mine host, and of the whole church, saluteth you. And this also is the greatest testimony of praise, to have opened one's house to the nurselings of the faith, and together with all others to have ministered even to the very teachers of the whole world; for by host he means entertainer. And he was a Corinthian, as the holy Apostle also teaches us in his epistle to the Corinthians, "I thank my God," says he, "that I baptized none of you but Crispus and Gaius." (ch. i. 14). Erastus the chamberlain of the city saluteth you, and Quartus a brother. He calls him not the treasurer of the church, but of the city, as one fully entrusted with some charge; and he makes mention of him who in the epistle to Timothy, thus speaking, (2 Ep. iv. 20), "Erastus abode at Corinth, but Trophimus have I left at Miletum sick."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
