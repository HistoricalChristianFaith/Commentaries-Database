[[commentary]]
quote='''
Love worketh no ill to his neighbour; and then drawing his conclusion, therefore love is the fulfilling of the law. And so also the Lord, being asked which was the first commandment, mentioned the first, and joined the second to it, (Mark xii. 30,) "Thou shalt love the Lord thy God, with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself and shews that in the former is established perfect theoretical, and in the second perfect practical virtue; and so, in like manner, the holy Apostle, therefore love is the fulfilling of the law; and then he goes on to say,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
