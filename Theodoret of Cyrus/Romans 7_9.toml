[[commentary]]
quote='''
For I was alive without the law once, for Adam before his transgression had no fear of death, but when the commandment came, sin revived, and I died. For when God had imposed the commandment respecting the trees, immediately the devil came to the woman in the serpent, and uttered those deceitful speeches, and she being enticed, and beholding the beauty of the fruit, was overcome by desire and broke the commandment. And with Adam she immediately received the sentence, for he also had shared in that food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
