[[commentary]]
quote='''
All things indeed are pure; none, says he, of these foods is unclean by its own nature, but it is evil to that man who eateth with offence; but to thee, nevertheless, indulgence therein brings injury, because thou neglectest thy neighbour's interests, and seest him suffer with contempt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
