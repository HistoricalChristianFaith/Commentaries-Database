[[commentary]]
quote='''
What then? Here we must place a stop, for it is put interrogatively, that is, what shall we say to this? and then the rest as the reply, Israel hath not obtained that which he seeketh for; but the election hath obtained it, and the rest were hardened. By the election he signifies those that had believed; and what he means is this, Israel by his adherence to the law has failed of the mark, for now contrary to the (spirit of the) law, he still observes the law, and reaps no righteousness, but such among them as have believed have obtained it, but the rest were hardened, that is, their infidelity has yet more hardened their heart; and he shows that this also was foretold from of old;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
