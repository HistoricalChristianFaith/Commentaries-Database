[[commentary]]
quote='''
For he is the minister of God to thee for good. He shews that he is worthy of all respect in calling him the minister of God; and he exhorts also to the performance of good deeds, in saying that rulers are applauders of good. But if thou do that which is evil be afraid; for he beareth not the sword in vain; for he is the minister of God, a revenger to execute wrath upon him that doeth evil. If thou lovest what is good, honour then the government which enjoins these same things; but if thou pursuest the reverse fear then its judgment, for it is appointed of God for the punishment of the evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
