[[commentary]]
quote='''
And if children, then heirs. Nor was it enough that we should have been freed from bondage and enjoyed the grace of liberty, but moreover have we been blessed with the privilege of the adoption; nay, and not only are we called sons, but heirs also of God, and joint heirs with Christ, for so he subjoins, heirs of God, and joint heirs with Christ. Since not every son becomes the heir of his father, well has the holy apostle joined the heirship with the sonship; and since frequently even a servant receives some portion from his master, and yet is not left an equal partner with the child itself, it was necessary, in order to point out the ineffable magnitude of the divine love, that he should subjoin, joint heirs with Christ,—if so be that we suffer with Him, that we may be also glorified together. For not all who have been blessed by baptism, which places us in a state of salvation, will enjoy these good things, but they, who in addition thereto, have undergone their share of suffering with their Saviour. And this he subjoins not without a distinct object, but for the support of those to whom his letters were addressed; for they were subjected to the attacks of temptations of all sorts, being beaten, tortured, and imprisoned, and exposed to a thousand kinds of death; wherefore he sends them comforting words, supporting them by the future, and exhorting them to bear the present with fortitude.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
