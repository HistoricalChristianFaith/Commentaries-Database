[[commentary]]
quote='''
For the gifts and calling of God are without repentance. All this he says as an incitement to the Jews; for that the blessings which God gives he again resumes, when He sees those that have received them infected with ingratitude, Saul is a proof, who, having enjoyed spiritual grace, was afterwards deprived thereof; and Solomon in like manner, who, having obtained peace through the divine loving-kindness, after his transgression was stripped of that grace; and indeed the Jews themselves, who, ever having enjoyed the fostering care of the prophets, at that present time had been bereaved of this guardianship. And the same he had also, just before threatened to the believers among the Gentiles, "if thou continue," says he, "in His goodness; otherwise thou also shalt be cut off."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
