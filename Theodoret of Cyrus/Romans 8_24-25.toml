[[commentary]]
quote='''
For we are saved by hope, for not yet have we attained unto the resurrection, but having received the promise are comforted by our hopes; but hope that is seen is not hope; for what a man seeth, how doth he yet hope for? But if we hope for that we see not, then do we with patience wait for it. Be not cast down, says he, while looking on (present) distresses, for we have brought you no false promises, in that we said you must yet awhile wait, ere you should enjoy these good things, but good things thus expected are not seen with the bodily eyes, since if seen they would cease to be expected, while if expected, we should be content in confidence to wait for them, and never throw away the anchor of hope. And he shows that in addition to all this, there is also another source of help given,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
