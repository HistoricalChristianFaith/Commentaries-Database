[[commentary]]
quote='''
For even Christ pleased not himself, but as it is written (Ps. lxix. 9), "The reproaches of them that reproached Thee fell on Me." For even the Lord Himself sought not his own (convenience), but for our salvation gave Himself up to death. For we heard Him in his passion praying, and saying (Matt. xxvi. 39), "O My Father, if it be possible, let this cup pass from Me, nevertheless not as I will, but as Thou wilt and he bore also the blasphemies of the Jews, and those which they had formerly brought upon His Father by their wicked lives, the same they uttered against Him; on which account it is that he here cites that testimony of the prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
