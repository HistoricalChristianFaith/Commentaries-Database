[[commentary]]
quote='''
Now the God of peace be with you all, Amen. Not without cause does he here speak of God, as the God of peace; but both as himself needing it, by reason at once of those that openly opposed him and those that regarded him with suspicion; and as imploring it for them, on account of the differences they had between themselves, respecting legal observances.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
