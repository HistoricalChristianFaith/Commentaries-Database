[[commentary]]
quote='''
Now it was not written for his sake alone, that faith was reckoned unto him for righteousness, But for us also, to whom it shall be reckoned, if we believe on Him that raised up Jesus our Lord from the dead. Thus then the patriarch, while he saw the womb of his wife dead, yet believed that it was easy for God to fulfil his promise; and thus then we, while we hear the Jews declaring that our Lord Christ is dead, believe that He is risen again; wherefore we, in our turn, gather the fruits of faith, and enjoy the righteousness springing therefrom. For not for nothing were recorded the things which the Lord God did regarding the patriarch Abraham, but that we, beholding them, might exhibit the like faith ourselves. He that raised up our Lord Christ is spoken of His humanity, for, in the nature in which He suffered, in that it was that He arose, and the suffering was of the flesh, and not of the impassible Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
