[[commentary]]
quote='''
For none of us liveth to himself, and none of us dieth to himself. For whether we live, we live unto the Lord, and whether we die, we die unto the Lord; whether we live, therefore, or die, we are the Lord's. We are not our own lords; we have been bought with a price; and while living, therefore, we are the Lord's, and when dead we are the Lord's; that is, neither art thou his master, nor is he thine; for One we all have for our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
