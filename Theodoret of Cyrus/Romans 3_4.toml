[[commentary]]
quote='''
Yea, let God be true, but every man false. For granting, says he, for argument's sake, that no one soul of man offered to Him the praise and honour due, but all were infected with ingratitude, which is what he means by every man being false, what diminution would God's glory suffer from hence?

And the same thing has the blessed Apostle observed in another place, "For if we believe not," says he, (2 Tim. ii. 13,) "yet He abideth faithful. He cannot deny Himself." And here he subjoins the testimony of scripture, as it is written, that Thou mightest be justified in Thy sayings, and mightest overcome when Thou judgest. The word that here denotes not the reason, but the result; for we do not therefore sin in order that we may set forth the loving-kindness of God, but Himself supplies the streams of His mercies to bring salvation to all; while men being free agents, some prefer the service of God, and some walk in the contrary direction; and so each find their end correspondent with the path they have chosen. But still God's mercies having been extended to them (the latter) also, thus is He fully justified in afterwards judging them, by His previous care bestowed on them. And thus He Himself speaks to Israel, (Micah vi. 3,) "O My people, what have I done unto thee, or how have I grieved thee, or wherein have I wearied thee, testify against Me?" and then enumerates His blessings one by one in order. And thus again in Jeremiah (ii. 5,) does He cry out, "What iniquity have your fathers found in Me, that they are gone far from Me, and have walked after vanity, and are become vain?" and again subjoins a list of His past kindnesses. And here the holy apostle introduces a conclusion in the person of his adversary:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
