[[commentary]]
quote='''
For I say, through the grace given unto me, to every man that is among you, not to think of himself more highly than he ought to think, but to think as accords with sobriety. And not himself does he declare thus enjoins, but the grace of the Spirit through him, for its instrument, says he, I am; and by the word sobriety here, he designates the healthy state of the mind, to teach us that arrogance is the sickness of the intellect; and herein, indeed, he imitates his own Master; for so the Lord in the holy gospels (Matt. v. 3) pronounced the first blessing on such as were given to humility. "Blessed," says he, "are the poor in spirit, for theirs is the kingdom of heaven." And these instructions he lays on all, both rich and poor, both servants and masters, both men and women, as the words to every one that is among you testify; and he gives the proper measures of our self-opinion, according as God hath dealt to every man the measure of faith. Grace it is which he here calls faith, because that by faith comes the gift of grace; and according to the proportion of a man's faith are the gifts of grace supplied; and he commands each to regulate his own self-estimate by the grace allotted to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
