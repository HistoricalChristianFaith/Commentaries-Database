[[commentary]]
quote='''
Not slothful in ardour: shewing forth a ready promptness towards what is good, and altogether casting away indolence. Fervent in spirit. By spirit he means the spiritual grace given, and to this, as fuel to the fire, he commands us to bring alacrity as its subject-matter; as he says also in another place (1 Thess. v. 19); "Quench not the Spirit;" for the Spirit is quenched in such as are unworthy of such grace: for, not having the eye of their understanding clear; they take not in that beam; even as with the corporeally blind light itself becomes darkness, and in mid-day they are bound by the blackness of night. Wherefore he bid us be fervent in spirit, and possess a warm desire concerning heavenly things; as he also subjoins, serving the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
