[[commentary]]
quote='''
For, for this cause pay ye tribute also; for they are God's ministers attending continually upon this very thing. For while thou art asleep he is bearing about him the common care; and while thou sittest at home, he is meeting the war which brings thee peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
