[[commentary]]
quote='''
That I may come unto you with joy by the will of God, and may with you be refreshed. Not even what is good does he wish to obtain, unless it be in accordance with the will of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
