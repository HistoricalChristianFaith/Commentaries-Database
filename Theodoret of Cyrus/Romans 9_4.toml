[[commentary]]
quote='''
Who are Israelites? For most celebrated was this name, imposed by God Himself on their forefather, (Gen. xxxv. 10) and transmitted as an heirloom to his descendants; To whom pertaineth the adoption. And this name also they had obtained, for "Israel," says he, "is My son, my firstborn" (Exod iv. 22); And the glory, for they had been illustrious through miracles; And the covenants, not the old only, but the new also had He promised to bestow on them, "for I will make," says He, "a new covenant with the house of Israel, not according to the covenant I made with their fathers" (Jer. xxxi. 31, 32), but this they themselves were not willing to accept; And the giving of the law, for to them had He given the Mosaic law; And the service of God, for, honouring them above other nations, to them He had taught the ritual ministrations of the law; And the promises, both those made by God to their fathers and those promulged by the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
