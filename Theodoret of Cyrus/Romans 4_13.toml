[[commentary]]
quote='''
For the promise, that he should be the heir of the world, was not to Abraham or to his seed, through the law, but through the righteousness of faith: for it was by believing in God, and not by walking according to the Mosaic law, that he received the promise of the blessing of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
