[[commentary]]
quote='''
For he that in these things serveth Christ is acceptable to God, and approved of men. For these things the God of all both requires of us, and they also bring advantage to men. Nor must we fail to observe, that he declares the serving Christ is acceptable to the God of all. If, then, the serving Christ be pleasing to God, so also truly to honour Christ must be pleasing to Him; wherefore likewise to speak evil of Christ, and to attempt to lower His dignity, must be offensive to the God of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
