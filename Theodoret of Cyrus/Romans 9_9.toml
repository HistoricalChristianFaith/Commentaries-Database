[[commentary]]
quote='''
For this is the word of promise, At this time will I come, and Sarah shall have a son. For nature having failed, he was constituted a father by the divine bounty; and this shows that Ishmael also was a son to Abraham—aye, and his firstborn son; and wherefore then boastest thou, O Jew, of being alone called the seed of Abraham? But if thou dost imagine that he was rejected from the relationship, as being on one side a bondsman, then thinkest thou not rightly, for Scripture is wont to calculate descent not from the mother's, but the father's side. And so the holy Apostle might have brought forward the children sprung from Keturah, and shown that they also, though born of a free woman, yet were not reckoned as the seed of Abraham; and easy had it been for him to have pointed out the twelve sons of Jacob, born of different mothers, four of them being bondsmen on one side, and yet all called Israel, and receiving no injury from the slavery of their mothers; but contenting himself with fewer instances, all this he has omitted, and beats them down by the ample evidence left. For having mentioned that which had been said by God to Abraham, that in Isaac shall thy seed be called, he shows that neither were the whole of his race partakers of this blessing, seeing that of his own sons the one inherited the privilege, and the other failed of it; for so he subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
