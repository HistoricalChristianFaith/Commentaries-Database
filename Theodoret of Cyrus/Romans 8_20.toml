[[commentary]]
quote='''
For the creature was made subject to vanity, not willingly, but by reason of Him who hath subjected the same in hope. Corruption is what he here speaks of as vanity, for so he teaches presently, "because that the creature itself also shall be delivered from the bondage of corruption." And he declares that the whole visible creation had obtained a mortal nature, because the Maker of all had foreseen Adam's transgression, and the sentence of death, which would be passed on him. For neither was it fit nor right, that what was created for him should possess an incorruption, and yet himself, for whose sake all these were made, be mortal, and a prey to passions and sufferings; but the rather, by the resurrection receiving immortality, they in like manner inherit incorruption. Wherefore he says that the visible creation waits for such a change of things, for it was made changeable not of its own accord, but in submission to the decree of the Creator, and beholding the care exhibited in our behalf has a hope of such change, that itself also, the creation, shall be freed from the slavery of corruption; to which mutability of the universe the holy David also witnesses, when, mentioning the heaven and the earth he adds, (Ps. cii. 26,) "they shall perish, but Thou remain."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
