[[commentary]]
quote='''
For who hath known the mind of the Lord, or who hath been His counsellor? Or who hath first given to Him, and it shall be recompensed unto him again? These three he puts as answering to the former three, the "riches," and the "wisdom," and the "knowledge:" the who hath known the mind of the Lord, to the knowledge; the who hath been His counsellor, to the wisdom; and the who hath first given to Him, and it shall be recompensed to him again, to the riches. For so immense are the riches of His goodness, that both to them that were not, has He given existence, and on such as are, of His free grace bestowed well-being. And not as really due to us for any thing we have first given, but of His own free kindness does He confer His blessings, although in mercy condescending to call each such free gift, the repayment of ourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
