[[commentary]]
quote='''
Rejoicing in hope, patient in tribulation, continuing instant in prayer. For he who is fervent in spirit, both readily obeys his Master, and waits for the enjoyment of the blessings looked for, and rises superior to the temptations that befall him, arming himself with steadfastness against their attacks, and ever calling the divine grace to his assistance; as he also subjoins, continuing instant in prayer, that is, incessantly doing so;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
