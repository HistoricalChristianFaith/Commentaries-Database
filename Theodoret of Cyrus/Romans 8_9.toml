[[commentary]]
quote='''
But ye are not in the flesh, but in the Spirit, if so be that the Spirit of God dwell in you. For it is evident that they who received these his instructions were not devoid of the body itself, but what he means is, that they were conquerors over the fleshly passions, and enjoyed the grace of the thrice-holy Spirit resident within them; and so in a similar sense does our Lord say that His disciples are "not of the world," (John xv. 19,) not that they came from elsewhere, but that they were dead to the world.

Now if any man have not the Spirit of Christ, he is none of His. As he had said if so be that, which implies an alternative, he aptly subjoins that he who is wanting in this grace, has no fellowship with Christ. And as this was enough to warn and alarm them that received this Epistle, he proceeds again to re-assure them,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
