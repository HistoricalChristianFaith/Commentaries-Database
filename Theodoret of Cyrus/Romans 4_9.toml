[[commentary]]
quote='''
Cometh this blessedness then upon the circumcision only, or upon the uncircumcision also? And then again he establishes his position by the case of the patriarch Abraham, For we say that faith was reckoned to Abraham for righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
