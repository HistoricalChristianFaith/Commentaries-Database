[[commentary]]
quote='''
Concerning his Son, which was made of the seed of David, according to the flesh. By all the prophets, says he, God has prophesied of the things relating to his Son, who, in his nature begotten of him before all eternity, yet made himself the son of David, inasmuch as he took his human nature, of the seed of David. Having then thus mentioned David, it was necessary that he should subjoin, according to the flesh, lest he should be considered as by nature the son of David, and by grace only the Son of God; for the addition, according to the flesh, indicates that as to his divinity he is in truth the Son of God the Father. For indeed this phrase we can never find applied to those who simply are such as they appear; as St. Matthew the evangelist witnesses, when saying, Abraham begat Isaac, and Isaac begat Jacob, and Jacob begat Judah, and so going through the whole genealogy in order, he never yet uses this expression, according to the flesh, seeing that it suited not them which were mere men; and so then the divine incarnate Word of God being not only man, but God also from eternity, the apostle, having mentioned David, necessarily adds according to the flesh, clearly to teach us how he was indeed the Son of God, and how yet made to be of David;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
