[[commentary]]
quote='''
But not as the offence, so also is the free gift. And how then is this? For if through the offence of one, many be dead, much more the grace of God, and the gift by grace, which is by one man, Jesus Christ, hath abounded unto many. As regards punishment, says he, the Lord God preserved the strict law of justice, and Adam, having sinned, and been given over to death, the whole race followed him; how much more right then that, as regards God's loving-mercy, justice should also be preserved, and all men share in the resurrection of our Lord Christ! He here calls the Lord Christ a man, to show clearly the type in Adam, that as there by one man (came) death, so here by one man the dissolution of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
