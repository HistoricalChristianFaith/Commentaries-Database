[[commentary]]
quote='''
But we are sure that the judgment of God is according to truth against them which commit such things: but it is evident to those who think rightly, that by the divine law all who transgress are obnoxious to punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
