[[commentary]]
quote='''
For if we have been planted together in the likeness of His death, we shall be also in the likeness of His resurrection. Since he had called baptism, which places us in a state of salvation, a type of death, by this change of name He plainly points out the resurrection, for whatever is distinctly planted springs up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
