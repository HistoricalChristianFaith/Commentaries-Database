[[commentary]]
quote='''
I am glad therefore, says he, on your behalf; and yet while praising he still continues to instruct, but yet I would have you wise unto that which is good, and harmless concerning evil. And this rule also the Lord gave to the Apostles, saying, "Be ye wise as serpents and harmless as doves." And this saying of our Lord signifies, that we are to put away from us the snares brought in by our enemies, and least of all to revenge ourselves on those that injure us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
