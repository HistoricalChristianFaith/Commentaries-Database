[[commentary]]
quote='''
Having gifts, differing according to the grace that is given to us. Thus are we to understand this, we are members of each other, having gifts differing according to the grace given to us; and yet, although thus differing, they are nevertheless bestowed by the divine grace for the common good. Whether prophecy according to the proportion of faith; Or ministry that he should wait on ministering, or as a teacher on teaching; Or as an exhorter, on exhortation. According to the faith of each does the Giver of all good proportion the grace. And by prophecy he means not only the foreknowledge of the future, but the understanding hidden things also; and by ministry the office of preaching the gospel; by teaching the instructing in the divine doctrines; by exhortation the inciting to virtue. He that giveth, let him do it with singleness of heart; not seeking after the good opinion of others, but supplying the wants of him that needs; nor calculating with himself whether he has sufficient by him or not, but trusting in God, and so affording assistance liberally; he that ruleth, with diligence; he that showeth mercy, with cheerfulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
