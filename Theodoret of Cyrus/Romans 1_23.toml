[[commentary]]
quote='''
And changed the glory of the incorruptible God into an image made like unto corruptible man. For not choosing to perceive that the Maker of all things is superior to decay, and far above all that is seen, they called the likenesses of their own bodies, gods; for indeed it was not intelligences, which are invisible, (ch. i. 23-27,) that their statuaries, sculptors, and painters, endeavoured to convey representations of, but perishable mortal bodies; nor was this impiety enough, but they must needs, moreover, worship the images of birds, beasts, and creeping things; and while they should rather have considered that some of these men eat as food, some loathe as unclean, and some avoid as noxious, in their excess of madness and folly they made the likeness of these very things —which men thus ate, loathed, or killed—into gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
