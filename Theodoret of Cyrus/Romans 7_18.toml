[[commentary]]
quote='''
For I know that in me, that is in my flesh, dwelleth no good thing. He speaks of the dominion of the passions, which the mortality of the body introduced, and the indolence of the mind has strengthened. For to will is present with me, but how to perform that which is good I find not, for, as regards a willingness towards that which is good, this I have received from the teaching of the law, but at the same time, as regards action I am impotent from want of further help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
