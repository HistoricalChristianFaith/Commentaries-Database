[[commentary]]
quote='''
Nay, in all these things we are more than conquerors through Him that loved us. Opposing the love which God bears us to all these things, we rise superior to afflictions; for we reckon that it were most absurd for our Lord Christ to have undergone death for sinners, and yet ourselves not most readily to embrace martyrdom for Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
