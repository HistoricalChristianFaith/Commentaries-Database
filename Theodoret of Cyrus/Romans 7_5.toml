[[commentary]]
quote='''
For when we were in the flesh, that is, under the polity of the law, for the legislative ordinances concerning the flesh, as of foods and drinks, of leprosy, and such like, are what he here calls the flesh; the motions of sins, which were by the law, did work in our members. He says not "in" the law but by the law, for it does not itself bring about sin, but it condemns sin, while that, which was good, sin uses for evil; neither indeed do our members themselves bring about sin, but only by our members has the inclination of the soul to the worse brought its operations to effect. And what then springs from hence? To bring forth fruit unto death.

In these words he has taught us that before the coming of (the covenant of) grace, while we were living under the polity of the law, the attacks of sin to which we were subjected were the more powerful, in that the law showed indeed what ought to be done, but offered no help to do it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
