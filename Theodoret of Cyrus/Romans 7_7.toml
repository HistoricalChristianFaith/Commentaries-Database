[[commentary]]
quote='''
What shall we say then? Is the law sin?

He had in the former parts of this epistle laid down many positions, which might have given an opportunity of finding fault with the law, to such as were desirous of speaking evil of it, unless he had offered the present solution of such questions, (as) "the law entered in between that the offence might abound;" and "the law worketh wrath;" and "by the deeds of the law there shall no flesh be justified in His sight;" and the like; wherefore, for the resolution of these very things he proposes the objection. And first he shows that the interrogation is profane, and adds the expression of disavowal, God forbid, and then he teaches the utility of the law. Nay but I should not have been aware of what was sin, but by the law. Not only, says he, is the law not the teacher of sin, God forbid, but on the contrary it is the condemner of sin, for I should not have known what was evil, unless it had shown me. For I should not have known that lust was, except the law had said Thou shalt not lust. The words I should not have been aware, and I should not have known, are not here indicative of a total ignorance, but mean this, that I received from the law a knowledge more complete than the mere discrimination of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
