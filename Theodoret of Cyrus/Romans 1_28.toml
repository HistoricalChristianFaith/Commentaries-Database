[[commentary]]
quote='''
And even as they did not like to retain God in their knowledge, God gave them over to a reprobate mind, to do those things which are not convenient. For if they had been willing to know Him, they would have followed the Divine laws; but now, choosing to deny their Maker, they were altogether stripped of his protecting care, whereby they wrecklessly ventured on every kind of wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
