[[commentary]]
quote='''
Let us not therefore judge one another any more; but judge this rather, that no man put a stumbling block, or an occasion to fall, in his brother's way. Here he directs his rebukes to the Gentile converts, who condescended not to the infirmities of the Jewish proselytes, but esteemed the indifferent use of all kinds of food as the height of virtue and the warmth of zeal. And first, then, he teaches that none of these things is really impure and unclean; and thus he speaks:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
