[[commentary]]
quote='''
For they of Macedonia and Achaia have been benevolently inclined to make a communication to the poor saints which are at Jerusalem. It was indeed under a previously-arranged agreement to this effect with the blessed Apostles, Peter I mean, and James, and John, that the divinely-appointed Barnabas and Paul undertook the teaching of the Gentiles, promising to exhort the converts among the Gentiles to minister to the wants of the faithful in Judaea; and this he clearly teaches in his epistle to the Galatians (ii. 9, 10), for "Peter," says he, "and James, and John, who seemed to be pillars, gave to me and Barnabas the right hand of fellowship, that we should go unto the heathen, and they unto the circumcision, only they would that we should remember the poor, the same which I also was forward to do." This it is he here also speaks of, praising the zeal of Macedonia and Achaia; and this he calls both a benevolence and a debt;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
