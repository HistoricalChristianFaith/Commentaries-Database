[[commentary]]
quote='''
For there is no respect of persons with God. For as many as have sinned without law shall also perish without law, and as many as have sinned in the law, shall be judged by the law. God, says he, is the Maker of all, and therefore the Judge of all; and the Jews then will he take account of, and condemn, according to the Mosaic code, but those that have never received it, whom he means by the without law, and their sin, He will justly punish according to the knowledge of good and evil implanted in their nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
