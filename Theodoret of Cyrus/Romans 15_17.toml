[[commentary]]
quote='''
I have therefore whereof I may glory in Jesus Christ, in those things which pertain to God. And then he points out the character of that glorying;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
