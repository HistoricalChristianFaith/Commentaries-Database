[[commentary]]
quote='''
Salute them which are of Aristobulus's household, and Herodion my kinsman, and those of the household of Narcissus. It is evident that they were believing families; but of those of Narcissus he says, who are in the Lord, as there being, forsooth, some who had not yet become so.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
