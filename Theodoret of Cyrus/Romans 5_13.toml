[[commentary]]
quote='''
For until the law sin was in the world, but sin is not reckoned (such) where there is no law. He accuses not, as some suppose, those who lived before the law, but all alike; for the until the law means, not until the commencement of, but until the end of, the law; that is, while the law reigned sin had power, for where there is no law, neither can there be transgression.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
