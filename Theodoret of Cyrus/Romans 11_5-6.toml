[[commentary]]
quote='''
Even so then at this present time also there is a remnant according to the election of grace. And if by grace, then is it no more of works; otherwise grace is no more grace. But if it be of works, then is it no more grace, otherwise work is no more work. As at that time, says he, among countless myriads, seven thousand only were left who were free from impiety, even so now also have the greater number disbelieved, and the smaller are they who have believed and enjoyed the divine grace, for it is not the polity of the law that has justified them, which is what is here meant by of works, but the grace of God has saved them; wherefore also salvation itself is called grace, because it proceeds from the divine loving-kindness; and this also he said in speaking concerning the patriarch Abraham, (ch. iv. 4,) "but to him that worketh is the reward not reckoned of grace, but of debt."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
