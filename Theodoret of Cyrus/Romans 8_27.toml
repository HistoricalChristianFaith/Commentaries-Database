[[commentary]]
quote='''
For He that searcheth the hearts knoweth what is the mind of the Spirit, because it maketh intercession for the saints according to the will of God. By the Spirit here he means not the Holy Ghost himself, but the grace given to the faithful: for stirred up by this we pray the more earnestly, and with sighings inexpressible by words implore God our Saviour. And this the holy apostle writes from what himself had experienced, for he himself not once only or twice, but even thrice, had besought release from his own trials, and beseeching had failed of obtaining his prayer; for he heard in reply, (2 Cor. xii. 8, 9,) " My grace is sufficient for thee, for My strength is made perfect in weakness," and having learned this, he welcomed what he had before sought to be delivered from, and says, " most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
