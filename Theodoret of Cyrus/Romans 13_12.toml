[[commentary]]
quote='''
The night is far spent, the day is at hand. By night he means the season of ignorance; by the day the time since the appearance of the Lord among us. For the Sun of righteousness having arisen, has enlightened the whole world with the rays of divine knowledge. Let us therefore cast off the works of darkness, and let us put on the armour of light. By darkness he means ignorance; and by the works of darkness evil actions; and knowledge is what he calls light; and the performance of good deeds the armour of light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
