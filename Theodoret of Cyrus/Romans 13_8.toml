[[commentary]]
quote='''
Owe no man any thing, but to love one another. Not that we are not to pay the debt of love, for this we ought to discharge before any thing else, but that we should increase it by that payment; for such discharge augments the debt, in that it makes love the warmer; for he that loveth another hath fulfilled the law. How, and in what manner?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
