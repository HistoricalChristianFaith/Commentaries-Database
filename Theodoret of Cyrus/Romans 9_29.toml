[[commentary]]
quote='''
And as Esaias had said before (ch. i. 9), Except the Lord of Sabaoth had left us a seed, we had been as Sodoma, and been made like unto Gomorrah. Those whom above he spoke of as a "remnant," the same he here calls a seed, through whom the prophet declares that the Jews suffered not the fate of Sodom and Gomorrah, for they had undergone a total destruction. Having thus taught that the God of all things looks not to the mere relationship of birth, but seeks for a community of faith, he shows yet more clearly by what means the Jews had fallen from their ancestral excellence, and the Gentiles on the other hand had obtained salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
