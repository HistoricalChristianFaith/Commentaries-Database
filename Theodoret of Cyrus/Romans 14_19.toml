[[commentary]]
quote='''
Let us therefore follow after the things which make for peace, and things wherewith one may edify another. It behoves us therefore above all to value a profitable concord, and to do all for the mutual advantage of each other. For meat destroy not the work of God. The believing on Him is what our Lord called the work of God; for "this," says He, "is the work of God, that ye believe on Him whom He hath sent," (John vi. 29). Since then it was probable that some of the Jews would fall away from the faith, not enduring the reproaches of the Gentile believers, aptly does he say, for meat destroy not the work of God. And again, that the Jewish proselytes might not hence gain a pretext for insisting on the observance of the law, he provides against this also, and says,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
