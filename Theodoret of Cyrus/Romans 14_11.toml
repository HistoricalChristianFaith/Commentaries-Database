[[commentary]]
quote='''
For it is written, (see Isa. xliii. 10; xlv. 21, 23; xliv. 6, 8, &c.,) As I live, saith the Lord, every knee shall bow to Me, and every tongue shall confess to God. He is our judge, He is our sentencer; at that tribunal of His we must stand. And indeed this witness of the prophet proves the completeness of the divinity of the Only-begotten. For having said by the prophet, "I am God before all ages, and I am first, and I am afterwards, and even unto eternity I am God, and before Me there was no God formed, neither shall there be after Me, and beside Me there is none, and a just God and a Saviour there is none beside Me," then He adds, "By Myself have I sworn, saith the Lord, that unto Me every knee shall bow, and every tongue confess to God." But let us proceed on to what remains of our interpretation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
