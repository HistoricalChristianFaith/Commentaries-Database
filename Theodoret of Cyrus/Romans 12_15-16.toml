[[commentary]]
quote='''
Rejoice with them that do rejoice, and weep with them that weep; Being of the same mind one toward another. Share with each other both in afflictions and their opposite, for the former is the part of sympathy, and the latter of friendship unsullied by envy. Minding not high things, but condescending to men of low estate. Again he banishes the arrogance of haughtiness, and bids the high come down to the low. Be not wise in your own conceits; that is, be not satisfied with your own judgments, but take the counsels also of others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
