[[commentary]]
quote='''
Likewise the Spirit also helpeth our infirmities, we have a sufficient assistance in the grace of the Spirit, for we know not what we should pray for as we ought; but the Spirit itself maketh intercession for us with groanings that cannot be uttered. Ask not, says he, to be delivered from affliction, for ye know not what is profitable to you, as does God your Governor. Resign yourselves into His hands, who holds the helm of all things; for He, though you should ask nothing, but groan only as moved by the Spirit dwelling in you, wisely orders every thing relating to you, and will grant that which shall prove to your advantage; as he subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
