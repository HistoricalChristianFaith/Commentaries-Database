[[commentary]]
quote='''
For of Him, and through Him, and to Him are all things: to whom be glory for ever. Amen. For He created all things, and He continues governing all that He thus created. To Him we ought to look, confessing our gratitude for all we already have enjoyed, and begging for His future providence; and to Him we ought to offer up also the praise and honour due.— Now in the words above, the holy apostle shows that he recognised not any difference between the expressions of whom and through whom, as though the former, as indicating some superiority, belonged to the Father; and the latter, as implying some inferiority, were suited to the Son. For he applies both of them to the same Person; whom if, on the one hand, the Arians and Eunomians say is the Father, they will find the through whom joined to the of whom; and if, on the other, they refer it to the Son, they will see then the of whom connected to the through whom. If then the of whom implies any superiority, and the through whom any inferiority, and yet both are spoken of the same Person, He must in all reason be considered greater than Himself, on account of the of whom, and less than Himself on account of the through whom. Let us then, leaving such (arguers) for the present, magnify our Creator and Saviour, to whom belongs glory for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
