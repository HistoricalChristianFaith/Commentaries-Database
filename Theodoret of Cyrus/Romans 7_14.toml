[[commentary]]
quote='''
For we know that the law is spiritual. Again he crowns the law with praise, for what can be more holy than this designation? for it was written, says he, by divine inspiration, being a partaker of this grace the blessed Moses indited the law. But I am carnal, sold under sin. He brings before us the man who lived before the coming (of the covenant) of grace, beset by his passions, for by carnal he means one who had not yet received the spiritual help (offered in that new covenant, see verse 5 ad fin. and ch. vi. 14 ad fin. &c.); but the sold under sin we shall understand by comparing it with that passage of the prophet, (Isaiah l. 1,) "For your iniquities have you sold yourselves." And the same thing does he here say, I have delivered myself up to sin, and sold myself to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
