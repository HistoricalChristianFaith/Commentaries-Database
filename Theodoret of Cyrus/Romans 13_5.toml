[[commentary]]
quote='''
Wherefore ye must needs be subject, not only for wrath, but also for conscience' sake. By wrath he means punishment; and on both grounds he bids us be obedient, both from fear of punishment, and that we may fulfil what is our duty; for this is what he means by conscience' sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
