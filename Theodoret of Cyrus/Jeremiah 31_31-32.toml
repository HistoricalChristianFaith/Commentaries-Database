[[commentary]]
quote='''
By what law? of works? Nay, but by the law of faith. He calls faith here a law, not from inconsideration, but as recollecting the prophecy of Jeremiah (xxxi. 31, 32,) "For in those days, saith the Lord, and at that time, I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant that I made with their fathers."

If then the Mosaic law is thus styled a covenant, and the new covenant again bears also the same name, and faith in Christ be the law it enacts, in strict accordance with the phraseology of the prophet does the holy apostle here apply the name of the law to faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
