[[commentary]]
quote='''
So then faith cometh by hearing, and hearing by the word of God; wherefore, whosoever disbelieves, disbelieves the divine oracles, and whosoever believes, receiving the divine words, brings forth faith as the fruit of his hearing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
