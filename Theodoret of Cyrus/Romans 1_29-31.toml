[[commentary]]
quote='''
Being filled with all unrighteousness. By unrighteousness he means that (disposition) which is diametrically opposed to righteousness, for from this springs every kind of reprehensible conduct. And he proceeds to detail its natural fruits. Fornication, wickedness, covetousness, maliciousness; full of envy, murder, debate, deceit, malignity; whisperers, Backbiters, haters of God, despiteful, proud, boasters, inventors of evil things, disobedient to parents, Without understanding, covenant-breakers, without natural affection, faithless, unmerciful. By fornication he signifies intercourse independent of marriage. By wickedness, a savage disposition. By covetousness, the desire of getting more and more, and the carrying off of what does not belong to oneself. By maliciousness, the bent of the mind to evil, and the planning of injury to a neighbour. Full of envy. Bitter is the passion, and unable to bear the prosperity of a neighbour. It is the parent of murder, and conceives deceit. Wounded by envy, and calling in deceit as an helpmate, Cain led his brother forth into the field, and feared not to slay him. By malignant, he means such as exercise their thoughts in laying snares, and designing mischief to those around them. By whisperers, such as privily murmur into the ear abuse of others standing by. By backbiters, such as recklessly indulge in the scandal of the absent. By haters of God, such as are inimically disposed towards him. By despiteful, such as are given to petulance and insolence. By proud, such as are overmuch elevated by every superiority they possess. By boasters, such as are vainly puffed up, while having no just cause for so exalted self-complacency. By inventors of evil things, such as not only fearlessly run through all existing ordinary evil, but devise yet further means of ill-doing in addition. Disobedient to parents; and baseness indeed is this, of the grossest kind, nature herself condemning it. Without understanding; for they who have fallen upon so lawless a life have lost all marks of reason. Covenant breakers; such as have embraced an unsocial and depraved state. Without natural affection; such as will not learn the laws of friendship. Faithless; such as fearlessly break through all engagements. Unmerciful; such as imitate the ferocity of the brute creation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
