[[commentary]]
quote='''
And that he may prove himself enjoining what is agreeable to God, he offers up a fervent prayer in their behalf; Now to Him that is of power to stablish you; and after what manner to stablish? according to my gospel; and what is his gospel? and the preaching of Jesus Christ; and pointing out the antiquity of that preaching, he adds, according to the revelation of the mystery; for not now is the mystery framed, but now is it made known, having been long concealed; for so he goes on to say, which was kept secret since the world began; and then he brings forward also the witnesses of this preaching, but now is made manifest and by the scriptures of the prophets, according to the commandment of the everlasting God; for what He had darkly foreshown in the prophets, these things has the Maker of all ages now clearly displayed; and what is the fruit of this preaching? for the obedience of faith, for it behoves them that hear to believe what is preached; and who are they? made known to all nations. Thus it is to be understood, according to my gospel and the preaching of Jesus Christ, made known to all nations. To God only wise, through Christ Jesus, to whom be glory for ever, Amen. Having set forth the mystery of the dispensation, of old indeed fore-appointed, and then predicted in the prophets, and afterwards become manifest indeed, he magnifies the wisdom of God, and utters forth a doxology suitable thereto. But if the heretics should assert that God (the Father) is here called the alone wise, let them know that the Lord Christ is not only so called wise, but wisdom itself. (Prov. iii. 19, &c.) And if indeed they think it right to deprive the Son of this name of wise, so neither let them call Him immortal, for the same Apostle says of God, "who alone hath immortality." (1 Tim. vi. 16). But leaving such to their own folly, let us proceed onwards in our course. Having then thus offered up these supplications for them, the holy Apostle adds exhortations, giving praise to the Gentile converts, and designating them as strong, by reason of their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
