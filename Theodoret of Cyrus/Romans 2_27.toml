[[commentary]]
quote='''
And shall not uncircumcision which is by nature, if it fulfil the law, judge thee who by the letter and circumcision dost transgress the law? Worthy of all admiration is the exceeding greatness of the apostle's wisdom, in that it is not the natural, which he opposes to the written, law, but the despised name to the honoured, uncircumcision to circumcision. And this he says is free from blame, for no one is born so of his own choice, but so the Creator formed his nature, wherefore neither can any injury arise from thence to such as love virtue; while thou hast received from thine ancestors the sign of circumcision, and hast the law teaching thee what thou shouldest do, and yet in thy works actest contrary to all that the law points at.

Having thus demonstrated that circumcision was given for a sign, and had afterwards become idle, he then proves that neither has the name a Jew any advantage,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
