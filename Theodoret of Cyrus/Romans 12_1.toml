[[commentary]]
quote='''
The knowledge of the nature of God, and faith, and right affections towards Him, are the sum and true foundation of all good; for what the eye is to the body, that faith and the knowledge of divine matters are to the soul. But then she needs also at the same time practical virtue, as the eye does hands and feet, and the other members of the body.

Wherefore, the holy apostle adds moral instructions also to his doctrinal course, in order to promote in us the most perfect virtue, for through the Romans does he afford this advantage to all mankind: and thus he opens the subject.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"

[[commentary]]
quote='''
I beseech you, therefore, brethren, by the mercies of God. He lays down laws, and sinking authority puts forth his instructions with intreaties, reminding them of the divine loving-kindness, of which he had before spoken so much at length; and what then dost thou beseech? that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. And already before had he exhorted to make "their members instruments of righteousness, and yield themselves to God as those that are alive from the dead," (ch. vi. 13;) and here he bids these become also a sacrifice, and calls it a living sacrifice, for it is not to be slain that he commands the body, but to become dead to sin, and not be open to its action; and such sacrifice he speaks of as holy, reasonable, and acceptable, as contrasting it with the oblation of irrational animals, and showing that with this the Lord is pleased. For by all the prophets, as one may say, he finds fault with the sacrifices of beasts, while he enjoins this; for "sacrifice," says he, "unto God the sacrifice of praise," and "the sacrifice of praise shall glorify Me." Ps. l. (LXX. li. 14, 23; and see also Isa. i. 11-18,) and a thousand other such passages are to be found in the Holy Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
