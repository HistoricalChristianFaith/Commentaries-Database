[[commentary]]
quote='''
Render therefore to all their dues; tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour. By tribute he means the taxes arising from land, but by custom the excise or duty from merchandise; nor are these only what he calls dues, but fear and honour also; for these are owing from the ruled to the rulers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
