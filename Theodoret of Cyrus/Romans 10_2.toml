[[commentary]]
quote='''
For I bear them record that they have a zeal of God, but not according to knowledge. He mingles his censure with praise, hiding as it were the hook beneath a bait, that the benefit of what he says might be accepted by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
