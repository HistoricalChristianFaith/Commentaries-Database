[[commentary]]
quote='''
But, I say, have they not heard? And this again is to be read interrogatively, and then as the answer, Yes, verily, their sound went into all the earth, and their words unto the ends of the world. For how was it possible that the Jews should not have heard, when the nations spread over the whole earth had heard? For to them first the preachers of the truth brought their tidings, for so the Lord Himself enjoined them, (Matt. x. 6,) "But go rather to the lost sheep of the house of Israel and in the Acts of the Apostles, (ch. xiii. 40,) "It was necessary that the word of God should first have been spoken to you." And the holy apostle continues in the same form of argument, making his positions clearer by question and answer, for so again we must read interrogatively,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
