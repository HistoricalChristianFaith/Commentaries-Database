[[commentary]]
quote='''
For as we have many members in our body, and all members have not the same office; So we being many are one body in Christ, and every one members one of another. The illustration is exactly suited to such an exhortation concerning brotherly love; for as each of the members is not useful to itself alone, but contributes its benefits to the common whole, so, therefore, it becomes him who has been blessed with any grace from above, clearly to understand that he has received that gift for the common advantage; for believers are one body, and each of us fulfils the office of a member;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
