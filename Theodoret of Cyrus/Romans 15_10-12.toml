[[commentary]]
quote='''
And again it saith, Rejoice, ye Gentiles, with his people, (Deut. xxxii. 13). And again, Praise the Lord, all ye Gentiles, and laud Him, all ye people. (Ps. cxvii. 1). And again, Esaias saith, There shall be a root of Jesse, and He that shall rise to reign over the Gentiles, in Him shall the Gentiles trust. Now these testimonies he cites in order to teach the Jewish converts not to be offended at the salvation of the Gentiles, but believe the prophecies concerning them. And again he implores a blessing on them, exhibiting the fatherly affection he bore to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
