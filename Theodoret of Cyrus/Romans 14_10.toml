[[commentary]]
quote='''
But why dost thou judge thy brother? this he says to the Jew; for we shall all stand before the judgment-seat of Christ. And then he also establishes what he says on the testimony of Scripture:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
