[[commentary]]
quote='''
Whose are the fathers, the renowned, the celebrated, of whom God was called the God (Exod. iii. 15); and then in the last place he adduces the greatest of the blessings, And of whom, as concerning the flesh, Christ came, who is over all, God blessed for ever. Amen. And, indeed, the addition of the concerning the flesh had been enough to evidence the divinity of the Lord Christ, yet, as in the opening of the epistle having said, "who was of the seed of David according to the flesh," he subjoined, "and was declared to be the Son of God with power," so here also after the concerning the flesh, he adds, who is over all, God blessed for ever; both exhibiting thereby the difference of the natures, and teaching how just reason he had for his lamentation, since while of them according to the flesh was He who was God over all, they had fallen from their height, and become aliens from that relationship. And herein he imitates the female mourners, who introduce into their funeral songs the beauty of the person, and the flower of the age, and the illustriousness of the ancestry, and the wealth, and the power, of the deceased over whom they lament. Having then thus displayed the love he bore the Jews, he then begins his proposed design;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
