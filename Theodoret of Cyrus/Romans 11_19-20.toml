[[commentary]]
quote='''
Thou wilt say then, The branches were broken off, that I might be grafted in. Well, because of unbelief they were broken off, and thou standest by faith. Be not high-minded, but fear. Infidelity has rendered them aliens from the root, and faith has connected thee with the root, and made thee to share in its richness; it behoves thee therefore not to become self-sufficient, but to fear and tremble.—Wherefore?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
