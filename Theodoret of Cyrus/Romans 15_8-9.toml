[[commentary]]
quote='''
Now I say that Jesus Christ was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers; And that the Gentiles might glorify God for His mercy. The God of all things promised to Abraham that in his seed He would bless all nations; and the patriarch himself and all his race received the sign of circumcision; it behoved therefore Him also, who is called "his seed after the flesh," and who shed forth the blessing on the Gentiles, to bear the sign of his kindred, that the truth of the divine promise might be clearly manifested, and the Gentiles receiving that grace might magnify Him, from whom the loving-kindness has flowed to them. And then he adduces scriptural testimonies, shewing that the salvation of the Gentiles had been predicted of old; As it is written, For this cause I will confess to thee among the Gentiles, and sing unto Thy name (Ps. xviii. 49).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
