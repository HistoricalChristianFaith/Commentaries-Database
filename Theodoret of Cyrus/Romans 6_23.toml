[[commentary]]
quote='''
For the wages of sin is death. As (according to the metaphor throughout adopted, he had said that) it formerly reigned, and now tyrannizes, and he had called its weapons our own badly-disposed members, consistently also does he denominate the reward wages, for so he was in the habit of naming the pay of soldiers; as in the epistle to the Corinthians, he says, (1 Cor. ix. 7,) "Who goeth a warfare at any time on his own wages?" But the gift of God is eternal life, through Jesus Christ our Lord. Here he says, not reward, but free gift, for eternal life is the gift of God; for though any one should carry through the highest virtue, still those eternal blessings could not justly be weighed as a requital for such present labours. Having said these things to them that lived under (the covenant of) grace, respecting the obligation lying on them to avoid sin, he again turns his discourse to the comparison between the (covenant of) law and grace, and shows the strength of the latter and the weakness of the former, and teaches that on the entrance of the one, the other ceased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
