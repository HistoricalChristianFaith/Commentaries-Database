[[commentary]]
quote='''
Because that by the deeds of the law there shall no flesh be justified in His sight. Some of the injunctions of the Mosaic law agreed with the knowledge of nature, such as, "Thou shalt not commit adultery;" "Thou shalt do no murder;" "Thou shalt not steal;" "Thou shalt not bear false witness against thy neighbour;" "Honour thy father and mother and others of this kind: for they who had never received that law, were yet fully aware that each of these was deserving not only of condemnation, but of punishment likewise. And some, again, the Lawgiver imposed on the Jews as suitable to them for that present time only; such, I mean, as circumcision, and the sabbath, and sacrifices, and sprinklings, and the rites respecting the leper, and the seminally unclean, and such-like; which are the symbols of other things, and when fulfilled, are not in themselves sufficient to make the doer just. Wherefore the holy apostle says, therefore by the works of the law there shall no flesh be justified in His sight; and then, lest any one should suppose that he was passing a censure on the law, he adds, For by the law is the knowledge of sin. The law, says he, has given to man a more accurate discrimination of sin, and made the condemnation lying on it the heavier; but for the establishment of virtue it is not competent to be sufficient for men.

Having thus shown that the law was only the teacher of good, he proceeds to exhibit the power of grace:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
