[[commentary]]
quote='''
For God is my witness, whom I serve with my spirit in the gospel of his Son, that without ceasing I make mention of you always in my prayers; Making request, if by any means now at length I might have a prosperous journey by the will of God to come unto you.

There are many kinds of service; for he who prays to God is serving him, and he who fasts; and he who applies himself to the divine oracles; and indeed even he who busies himself in providing hospitality to strangers; and here then the holy apostle speaks of serving God in bringing the gospel of his Son to the gentiles, and serving in the spirit, that is, in the spiritual gift conferred on him; so pleasing to God did he feel was the glory of his Son. And, expressing himself critically, he does not simply say that he begged for this entrance unto them, but according to the will of God, that is, if it so please the Ruler of all things. If then where the salvation of so many thousands was concerned, the apostle yet asked not any thing absolutely, but to his petition joined the Divine will, how inexcusable must ourselves be, if busied about, and praying for, the mere objects of sense, we rest not at once all things concerning us on the Divine good pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
