[[commentary]]
quote='''
We then that are strong ought to bear the infirmities of the weak, and not to please ourselves. Let every one of us please his neighbour, for his good to edification:—I know that thou art brought to completeness, and that faith has made thee strong, but I exhort thee to extend a hand to him that is weak, and not to seek thine own (comfort or convenience) alone, but to consult also the advantage of thy neighbour; and he says not merely to please thy neighbour, but for his good to edification, since it is very possible to please a neighbour both to his and our own injury; and then the example,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
