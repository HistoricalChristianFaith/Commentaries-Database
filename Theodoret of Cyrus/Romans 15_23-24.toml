[[commentary]]
quote='''
But now having no more place in these parts, and having a great desire these many years to come unto you, Whensoever I take my journey into Spain, I will come to you; for I trust to see you in my journey, and to be brought on my way thitherward by you, if first I be somewhat filled with your company. He gives two reasons for his coming to them—that the rest had been preached unto, no nation remaining among which the doctrines of the gospel had not been heard; and his own love towards them. For the former hindrances having ceased, his longing after them excited him to the journey; and he declares that this his affection had been long antecedent to his actual coming, for for these many years, says he, have I earnestly desired to see you; and he tells them before-hand that he will not only see them, but take in Spain also; and that they may not hence conceive that his visit to them was merely by the way, he adds, and by you to be brought on my way thitherward, if first I be somewhat filled with your company; for you are they whom I first wish to see, and after you them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
