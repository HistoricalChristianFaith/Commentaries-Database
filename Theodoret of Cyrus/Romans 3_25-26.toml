[[commentary]]
quote='''
Through the forbearance of God, to declare, I say, at this time His righteousness. God has both exhibited His own mercy in so long bearing with sinners, and has made manifest His righteousness to all men; for that it was not without any further view that He thus bore with sinners, but as preparing for them this mean of salvation, the next sentence shows—that He might be just, and the justifier of him that believeth in Jesus. For both these things should we learn from hence, that the God of all has ordered His dispensations concerning ourselves with justice equally as with mercy; and that whosoever believes in the Lord Christ is made partaker of the righteousness which is by faith.

Thus briefly having stated the free gifts conferred by (the covenant of) grace, he returns to his discourse respecting the law, and shows that it yielded the victory to grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
