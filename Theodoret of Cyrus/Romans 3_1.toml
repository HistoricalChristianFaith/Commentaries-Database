[[commentary]]
quote='''
Having thus checked the pride of the Jew, and shown that he boasted in vain in circumcision, and in the law, and in the name of a Jew; lest any one should suppose that he spoke thus from an angry or hostile feeling, he continues, What more then had the Jew, or what profit was there in circumcision? If then, says he, some among heathen and alien nations, who were adorned with piety and virtue, share in the divine favour, to what good did God separate Israel from the Gentiles, and give them the rite of circumcision? for by the more of the Jew he means advantage above the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
