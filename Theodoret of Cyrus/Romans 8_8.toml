[[commentary]]
quote='''
So then they that are in the flesh cannot please God. He does not bid us go out of the body, but be freed from the inclination of the flesh, as is shown by what follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
