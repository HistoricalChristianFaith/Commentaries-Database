[[commentary]]
quote='''
Now the God of patience and consolation grant you to be like-minded one towards another according to Christ Jesus. Again by the addition of the according to Christ Jesus he shews that he does not indiscriminately beg for a concord of any kind for them, but the concord of godliness: and speaking of patience and comfort, he joins therewith the mention of love; that adorned therewith they might bear the imperfections of their neighbour, and by mutual counsel and comfort lead him on to completeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
