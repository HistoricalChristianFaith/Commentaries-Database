[[commentary]]
quote='''
Wherefore, my brethren, ye also are become dead to the law by the body of Christ; that ye should be married to another, even to Him who is raised from the dead. It would have been indeed in strict consistency with the example adduced, to have said, "the law is dead," that is, has ceased, but in consideration of the spiritual weakness of the Jews, for they greatly exalted the law, and from a desire not to afford an opportunity of finding fault with it to the heretics who denounced the Old Testament, he avoids saying that the law had ceased, but declares that we have become dead to the law by baptism which saveth us, and then rising again have been united to Him who hath Himself risen from the dead, that is Christ. And as he had called the faith which is in the Lord a marriage and union, in strict keeping herewith does he show the fruits also arising from marriage, that we should bring forth fruit unto God, says he. What then is this fruit-bearing? That our members become the instruments of righteousness. And most aptly does he show that the law itself leads us to be joined to Christ, for it forbade not, says he, a woman to be married to a second husband after the death of the first. And then he goes on to point out the difference.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
