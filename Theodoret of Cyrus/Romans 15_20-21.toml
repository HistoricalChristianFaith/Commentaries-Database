[[commentary]]
quote='''
Yea, so have I strived to preach the gospel, not where Christ was named, lest I should build upon another man's foundation, But as it is written, (Isa. lii. 15), To whom He was not spoken of they shall see; and they that have not heard shall understand. This shews the diligent earnestness of his zeal in labouring, in that taking in hand the fields that as yet had been uncultivated, he ploughed them up, and sowed, and converted them into fruitful corn fields, and brought its due fulfilment to the prophecy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
