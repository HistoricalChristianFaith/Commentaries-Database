[[commentary]]
quote='''
But after thine hardness and impenitent heart treasurest up to thyself wrath against the day of wrath, and revelation of the righteous judgment of God; Who will render to every man according to his deeds. For since you have an obdurate spirit, and remain still in your iniquity, you are passing against yourself the sentence of punishment, which God in mercy indeed yet delays, but will in the last day set forth, allotting to each a recompense correspondent to their own works.

Well does he adopt the expression, treasurest up unto thyself in order to show, that nothing of ours, whether word or deed, is consigned to oblivion, but that they who love virtue are laying up for themselves a store of good, and the workers of evil-doing the same (of evil).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
