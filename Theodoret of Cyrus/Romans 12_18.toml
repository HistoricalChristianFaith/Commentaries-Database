[[commentary]]
quote='''
If it be possible, as much as lieth in you, live peaceably with all men. Most accurately does he express himself here, in making the addition of the if it be possible, and the as far as lieth in you; let nothing, says he, be done on your part, but try every means for peace. And this is in strict consequence from what he had before said, for what feeling of hostility can he entertain, who "blesses him that persecutes," and avenges not himself on him that injures him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
