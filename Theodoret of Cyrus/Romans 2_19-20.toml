[[commentary]]
quote='''
And art confident that thou thyself art a guide of the blind, a light of them in darkness, An instructor of the foolish, a teacher of babes. He here points out their arrogant self-opinion, and lays bare the superciliousness they exhibited towards proselytes; which hast the form of knowledge, and of the truth in the law, for the divine law has furnished thee with the characters of all these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
