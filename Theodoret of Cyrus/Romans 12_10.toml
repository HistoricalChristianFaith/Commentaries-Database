[[commentary]]
quote='''
Being kindly affectioned one to another in brotherly love; in honour preferring one another. Have your regard warm, and such as becomes brethren towards each other; and let each yield the first places to his neighbour, for this is a proof of true and perfect love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
