[[commentary]]
quote='''
Salute Tryphena and Tryphosa, who labour in the Lord. Again, from their labours come the crown; and that labour the words shew to have been one either of hospitality or fasting, or other such virtue. Salute Persis the beloved which laboured much in the Lord. Ampler is her praise, for her zeal in labouring was ampler.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
