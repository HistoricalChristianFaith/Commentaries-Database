[[commentary]]
quote='''
For the law of the spirit of life in Christ Jesus hath made me free from the law of sin and death. As he had just before called sin "the law of sin," so now does he call the life-giving Spirit, the law of the spirit of life. His grace, says he, by faith in Christ has bestowed on you a double freedom; for not only has it overthrown the power of sin, but put an end also to the tyranny of death, and he shows how He has thus overthrown it
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
