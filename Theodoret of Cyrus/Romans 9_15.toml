[[commentary]]
quote='''
For he saith to Moses, (Exod. xxxiii. 10,) I will have mercy on whom I will have mercy, and I will have compassion on whom I will have compassion. These words God spake concerning the making of the calf. And it was necessary that he should mention Moses's name here, in order to show the trustworthiness of what he was alleging, by the testimony of Him who spoke, and him who heard; and then he draws the conclusion,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
