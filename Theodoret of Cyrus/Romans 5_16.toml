[[commentary]]
quote='''
And not as it was by one that sinned, so is the gift; for the judgment was by one to condemnation, but the free gift is of many offences unto justification. The munificence of grace, says he, goes beyond the limits of justice, for then, one having sinned, the whole race received punishment, but now, all mankind having been unholy, and transgressors, it has brought, not punishment but, the free gift of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
