[[commentary]]
quote='''
O the depth of the riches, and of the wisdom, and of the knowledge of God! For of old, and from the beginning, has He foreknown all these things, and foreknowing has wisely disposed, and in that dispensation manifested the riches of His loving-kindness. How unsearchable are his judgments, and His ways past finding out! The scheme of the divine economy surpasses man's understanding; nor even by the invisible powers is the providence of the God of all things fully reached unto.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
