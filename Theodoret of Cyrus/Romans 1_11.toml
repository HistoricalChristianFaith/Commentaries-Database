[[commentary]]
quote='''
For I long to see you, that I may impart unto you some spiritual gift. What he says is full of humility; his words are not, that I may "give," but that I may "impart;" that is, of what I myself have received I may communicate unto you. Inasmuch, moreover, as the great Peter had already conveyed to them the doctrines of the gospel, he necessarily adds, to the end ye may be established; for I desire, says he, not to bring you some other doctrine, but to confirm that already preached among you, and to water trees already planted. And full of modesty again is what he adds,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
