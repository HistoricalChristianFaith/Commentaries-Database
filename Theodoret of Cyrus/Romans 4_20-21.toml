[[commentary]]
quote='''
But he staggered not at the promise of God, through unbelief; but was strong in faith, giving glory to God: And being fully persuaded that, what He had promised, He was able also to perform. For he looked not to the impotence of nature, but trusted, without doubting, in the Creator of that nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
