[[commentary]]
quote='''
As he saith also in Osee (ch. ii. 23, and i. 10), I will call them My people, which were not My people, and her beloved, which was not beloved. And it shall come to pass that in the place where it was said unto them, ye are not My people; there shall they be called the children of the living God. And this God spake not of the Gentiles, but of the Jews themselves; for having commanded Hosea to marry an harlot, and indeed even an adulteress, thus did He order the children born from her to be called, the one not a people (Loammi), and the other not beloved (Loruhamah) (ch. i. 9, 6), foretelling what should happen to the Jews; while at the same time He promised them good things again, that the not people should be called a people, and the not beloved, beloved. Observe therefore, says he, that even you have not always enjoyed the same things, but at one time have been reckoned a people, and then not a people, and then a people again; and at one time beloved, and then not beloved, and then beloved again. Nothing then improbable has taken place at present, for you have been cast off in due consistency with all this; but and so if yet you again will it, you shall be reckoned a people, and beloved; for so also the Gentiles who were not a people, now are reckoned a people. And he adduces another witness also to this account:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
