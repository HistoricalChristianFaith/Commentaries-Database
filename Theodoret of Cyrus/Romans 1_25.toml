[[commentary]]
quote='''
Who changed the truth of God into a lie, and worshipped and served the creature more than the Creator, who is blessed for ever. Amen. Impiety, he says, was the foundation of their iniquities, and by both they became stripped of the Divine grace. The name "God" is what he here means by the truth of God, an idol made with hands by a lie; because that when they ought to have worshipped the true God, they offered the adoration belonging to Him to the creature instead. And to the same reproach do they lie open, who call the only-begotten Son of God a creature, and yet worship Him as God; for they ought either, admitting His divinity, to rank Him not with created things, but with God who begat Him; or else, pronouncing Him a created being, not to pay adoration to Him as divine.—But let us pursue the order of our exposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
