[[commentary]]
quote='''
But, I say, did not Israel know? and then what follows as the reply, First, Moses saith, I will provoke you to jealousy by them that are no people, and by a foolish nation I will anger you (Deut. xxxii. 21). We, it is, whom he called foolish, pointing out the folly we laboured under before our conversion to the faith, for so also the holy apostle speaks, (Tit. iii. 3,) "for we ourselves also were sometime foolish, disobedient, deceived, serving divers lusts and pleasures, living in malice and envy, hateful, and hating one another." By this God grievously vexed the Jews, for neither the captivity, nor the dispersion, nor the destruction of the temple, so much distresses them, as do the religion and eminence of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
