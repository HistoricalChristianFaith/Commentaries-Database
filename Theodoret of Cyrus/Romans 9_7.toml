[[commentary]]
quote='''
Neither because they are the seed of Abraham are they all children, that is of God, as he shows just below, —But in Isaac shall thy seed be called; and having thus stated the promise of God, he now explains it, and renders the saying clear by his exposition thereof.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
