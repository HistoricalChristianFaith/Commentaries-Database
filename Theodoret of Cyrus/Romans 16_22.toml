[[commentary]]
quote='''
I Tertius, who wrote this epistle, salute you in the Lord. And he also was one of those who had been thought worthy to enjoy the instructions of the Apostle, wherefore receiving the outpourings of his holy spirit through the tongue he was commanded to commit them to paper.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
