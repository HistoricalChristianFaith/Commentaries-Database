[[commentary]]
quote='''
To them who by patient continuance in well-doing seek for glory, and honour and immortality, eternal life. He teaches the difficulties of virtue, and displays its crown, for the patient continuance in welldoing is expressive of those difficulties, in that we must persevere in and carry through our virtue, and so expect its crown: but the labour is but for a time, the gain eternal; and this eternal he joins not to the life only, but to the glory, the honour and the immortality also, being desirous to illustrate the reward of our good deeds in as many ways as possible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
