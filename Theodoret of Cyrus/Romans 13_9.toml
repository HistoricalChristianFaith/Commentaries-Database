[[commentary]]
quote='''
For this, thou shalt not commit adultery, thou shalt not kill, thou shalt not steal, thou shalt not covet, and if there be any other commandment, it is briefly comprehended in this saying, namely, thou shalt love thy neighbour as thyself. For he who is kindly disposed towards any one, kills not him whom he thus loves, commits not adultery with his wife, steals not any thing belonging to the object of his affectionate regard, nor does any other thing which might give him pain; for so he subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
