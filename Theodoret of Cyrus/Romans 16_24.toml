[[commentary]]
quote='''
The grace of our Lord Jesus Christ be with you all, Amen. Again he imparts to them the spiritual benediction, and surrounds them with the grace of the Lord as with a wall of adamant, for this he made the beginning of his epistle, and this he places as its end. In this grace let us also become partakers, that we may rise superior to all snares; that by it enlightened we may without turning aside tread the strait road, and following in the Apostolic footsteps be deemed worthy to behold the teacher himself, and by his means enjoy the favour of the Lord, and obtain the promised blessing, through the grace and loving-kindness of our Lord Jesus Christ; with whom, to the Father, together with the thrice-holy Spirit, belong glory and majesty, now and ever, and unto endless ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
