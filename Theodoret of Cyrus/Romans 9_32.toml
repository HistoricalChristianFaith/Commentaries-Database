[[commentary]]
quote='''
Wherefore? the reason of this, says he, do you desire to know? Because they sought it not by faith, but as it were by the works of the law. They imagined that the living under the law was sufficient to secure righteousness to them, and they despised faith; wherefore they neither obtained the gifts of faith, nor gained the righteousness arising from living under its covenant. And then he teaches through what cause they enjoyed not the blessings of faith; For they stumbled at that stumbling-stone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
