[[commentary]]
quote='''
Much more then, having now been justified by His blood, shall we be saved from wrath through Him. Having encountered that accursed (see Gal. iii. 13) death for the ungodly and transgressors, it is evident that He will free from the future punishment those, that believe in Him; for that future (eternal) punishment is what he here calls wrath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
