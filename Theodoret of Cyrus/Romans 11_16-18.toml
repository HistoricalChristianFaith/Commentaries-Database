[[commentary]]
quote='''
For if the first-fruit be holy, the lump is also holy; and if the root be holy, so are the branches. And if some of the branches be broken off, and thou being a wild olive tree, wert grafted in among them, and with them partakest of the root and fatness of the olive tree; Boast not thyself against the branches. By the first-fruit he means the Lord Christ in his human nature; by the root, the patriarch Abraham; by the branches of the olive, the Jewish people as sprung from thence; and by the richness of the olive, the doctrines of religion. He admonishes those among the Gentiles who believed, not to be puffed up against the disbelieving Jews; for these are they whom he speaks of as branches broken off. Observe rather, says he, that you, born of another race, have been grafted into this, and have received of the richness of the holy root. But if thou boast, thou bearest not the root, but the root thee; and consider this also, that the root bears thee, not thou the root, and thou needest it, not it thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
