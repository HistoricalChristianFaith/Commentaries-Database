[[commentary]]
quote='''
I am a debtor both to the Greeks and to the Barbarians; both to the wise and to the unwise; So that as much as in me lies, I am ready to preach the gospel to you that are at Rome also. I have been appointed the teacher of all nations, wherefore I owe the debt of an evangelist not to the Greeks only, but to the Barbarians also. For this was it that the grace of the Spirit conferred on us the gift of other tongues; and it behoves us to discharge our debt both to those who boast in their wisdom, and to those who are unlearned likewise. By wise he means those who prided themselves on their eloquence; by unwise, those who for their ignorance were so denominated by such as were called philosophers, or wise men. And, as not all would receive the preaching of the gospel, fitly has he added, as much as in me lies; for it is mine to preach, but the believing depends on the hearers. And as he frequently calls this preaching by the name of the gospel, and the gospel contains an account of our Lord's passion, cross, and death, all which to the unbeliever seemed full of dishonour, he seasonably adds,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
