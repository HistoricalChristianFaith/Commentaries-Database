[[commentary]]
quote='''
By whom we have received grace and apostleship, for obedience to the faith among all nations, for his name. For he himself sent us forth as teachers, committing to us the salvation of all nations, and giving grace suitable to that preaching, that they who hear it may hearken unto us, and believe the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
