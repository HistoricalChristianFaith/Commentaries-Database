[[commentary]]
quote='''
Thou wilt say then unto me, why doth he yet find fault? for who hath resisted his will? For, if "He hath mercy on whom He will, and whom He will hardeneth," man's disposition must depend on His will (say you): and, if so, He cannot with justice inflict punishment on the offenders, for it is not possible for any to resist whatever he thinks fit. Having thus increased the difficulties of the subject by the variety of doubts, and proposed all the objections arising from it, he subjoins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
