[[commentary]]
quote='''
But to Israel he saith, All day long I have stretched forth My hands unto a disobedient and gainsaying people. All day long means without ceasing, for so Symmachus and Aquila interpret the every day. Having thus pointed out that the inspired prophets both condemned the Jews, and foreshowed the faith of the Gentiles, he seems indeed in what follows to bring comfort to them, while in truth adding fresh censures on the disbelievers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
