[[commentary]]
quote='''
As it is written, I have made thee a father of many nations, and then he strengthens this testimony by an evidence, Before Him whom he believed, even God who quickeneth the dead, and calleth those things which be not as though they were. For as, says he, God is the Maker of all, and the God, and carer for, all, so did He constitute Abraham, the father of all, not of the Jews only, but of all who believe.

And he (next) exhibits the greatness of Abraham's faith,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
