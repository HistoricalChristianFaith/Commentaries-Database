[[commentary]]
quote='''
For the inclination of the flesh is death. He says not the flesh, but the inclination of the flesh, that is, the breaking forth of the passions, for the recompense of sinners is death; but the inclination of the Spirit is life and peace, for he who lives after the Spirit gains peace with God;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
