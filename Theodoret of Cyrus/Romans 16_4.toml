[[commentary]]
quote='''
Who have for my life laid down their own necks. And to his private he subjoins the public (debt to them) unto whom not only I give thanks, but also all the churches of the Gentiles; and he commemorates also another praiseworthy virtue on their part, for he salutes,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
