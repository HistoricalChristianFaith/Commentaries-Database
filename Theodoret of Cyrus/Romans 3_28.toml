[[commentary]]
quote='''
We conclude therefore that a man is justified by faith, without the works of the law. By law here he means that of Moses; but at the same time he says not, we conclude that by faith a Jew is justified, but a man, the common name of the whole human race; as he goes on to reason,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
