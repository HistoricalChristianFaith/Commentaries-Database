[[commentary]]
quote='''
God hath not cast away His people, which he foreknew. For if He had cast them off, I also had been one of the condemned, seeing that I also have sprung from that root, and glory in Abraham as my forefather, and Benjamin as the head of my tribe, and boast myself in the name of Israel. And well has he added the which he foreknew, that is, those that are worthy of the divine knowledge, having welcomed the light of faith; for so he presently after shows, Wot ye not what the Scripture saith of Elias? how he maketh intercession to God against Israel (1 Kings xix. 14).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
