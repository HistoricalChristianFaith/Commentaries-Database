[[commentary]]
quote='''
And not only so, but we even glory in tribulations. He has displayed brightly his own insuperable magnanimity, for it is not, we patiently endure afflictions, which he says, but we even rejoice in afflictions; we are exalted, he exclaims, and take pride to ourselves, as fellow-sharers with the Lord of sufferings; but this he says not openly, because they alone could so feel, who with himself had arrived at completeness in the faith; the rest he encourages by what should come hereafter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
