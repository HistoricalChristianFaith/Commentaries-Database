[[commentary]]
quote='''
What then, shall we sin because we are not under the law, but under grace? He notes this objection because of the gainsayers, and first reprobates it, pointing out its absurdity, and says, God forbid, and then more at length demonstrates the contrary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
