[[commentary]]
quote='''
For the good that I would I do not, but the evil that I would not, that I do. Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me.

He makes the same assertion, only in a clearer manner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
