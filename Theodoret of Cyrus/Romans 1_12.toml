[[commentary]]
quote='''
That is, that I may be comforted together with you, by the mutual faith both of you and me; for not only do I wish to give, but to receive also from you, for the zeal of the disciple comforts and invigorates the master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
