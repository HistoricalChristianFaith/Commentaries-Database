[[commentary]]
quote='''
How was it then reckoned? when he was in circumcision, or in uncircumcision? Not in circumcision, but in uncircumcision. He proves that faith is older not merely than the law, but than circumcision itself, and that while circumcision was yet unestablished, the patriarch received the testimony of his righteousness, the righteousness which is of faith. How then could he need circumcision, while having already obtained the righteousness which is of faith? This he clearly explains,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
