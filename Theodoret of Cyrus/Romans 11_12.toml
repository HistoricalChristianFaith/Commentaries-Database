[[commentary]]
quote='''
Now if the fall of them be the riches of the world, and the diminishing of them the riches of the Gentiles, how much more their fulness? For if, when the greater number disbelieved, those that were converted among them brought the riches of the divine knowledge to the Gentiles, most manifest is it, that if all believed, they would become the means of yet greater blessings to all mankind, for all would the more readily believe, when these no longer opposed, but joined with us instead in preaching, the truth. Thence he turns his exhortations to those among the Gentiles who had believed, and counsels them to entertain a chastened view of themselves; aiming at once at a double point, on the one hand to pull down all self-sufficiency on their part, and lead them to fear; and on the other, to bring the Jews to a participation of their ancestral inheritance; and thus he begins,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
