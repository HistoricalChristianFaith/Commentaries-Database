[[commentary]]
quote='''
For if the casting away of them be the reconciling of the world, what shall the receiving of them be, but life from the dead? For if, says he, on their disbelief the Gentiles were received in, and freed from their former ignorance, manifest is it, that if all these were willing to believe, nothing else would then remain to be accomplished, but the resurrection of the dead; for so the Lord also said, "and this gospel of the kingdom shall be preached unto all nations for a witness unto them, and then shall the end come," (Matt. xxiv. 14). And all this we must recollect the holy apostle says, from a desire to suit his matter exactly to the subject in hand, and teach humility to those among the Gentiles that had believed, hold out the offer yet to the disbelieving among the Jews, and point out the salvation that would arise from their change of mind; as what follows teaches yet more clearly,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
