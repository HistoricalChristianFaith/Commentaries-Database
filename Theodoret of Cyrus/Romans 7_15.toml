[[commentary]]
quote='''
For that which I do I know not: for he who is overcome by pleasure, and indeed he also who is intoxicated by the passion of anger, has no clear perception of sin, but after such passion has subsided receives a knowledge of the evil. For what I would that I do not, but what I hate that I do. This is the perfection of the law, to point out what is evil and implant a hatred of it in the soul. The words what I would not and what I hate do not denote compulsion, but weakness; for we sin not because driven thereto by some necessity or force, but being beguiled by pleasure we fall into those things which yet we cannot but hate and denounce as wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
