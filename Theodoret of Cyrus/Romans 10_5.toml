[[commentary]]
quote='''
For Moses describeth the righteousness which is of the law, That the man which doeth those things shall live by them. Whosoever has observed all things enjoined by the law, has life as the reward of such obedience, but any one transgression entails punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
