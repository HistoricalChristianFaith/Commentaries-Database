[[commentary]]
quote='''
He that spared not His own Son, but delivered Him up for us all, how shall He not with Him also freely give us all things? He has given us the greater, and shall He not give also the less? His own Son has He bestowed, and will He deprive us of what we have gained? But here we must remember, that the Person of the Son is (but) one; for the human nature was delivered up in our behalf by the divinity; for (so) "the bread," says He, (John vi. 31,) "that I will give is my flesh, which I will give for the life of the world;" and (ch. x. 18,) "I have power to lay down My life, and I have power to take it again."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
