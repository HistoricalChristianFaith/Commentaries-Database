[[commentary]]
quote='''
But he that maketh a distinction is condemned if he eat; and he shews the reason, because he eateth not of faith; but whatsoever is not of faith is sin. For he who believes harmlessly partakes, but he who eats with any such distinction passes sentence on himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
