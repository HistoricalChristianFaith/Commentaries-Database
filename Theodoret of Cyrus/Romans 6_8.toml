[[commentary]]
quote='''
For if we have died with Christ, we believe we shall also live with Him. It becomes us, therefore, also, having been buried with Christ, to be dead indeed unto sin, but to await the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
