[[commentary]]
quote='''
Having then been freed from sin, ye were made servants of righteousness. Ye have cast away the slavery of sin, and taken upon you the yoke of righteousness; it is not possible therefore that bearing the latter you should yield to the commands of the former.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
