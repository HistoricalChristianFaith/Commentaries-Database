[[commentary]]
quote='''
But now having been freed from sin, and made servants of God, ye have your fruit unto holiness, and the end everlasting life. In these words he opposes God to sin, holiness to shame, and life everlasting to everlasting death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
