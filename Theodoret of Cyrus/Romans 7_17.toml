[[commentary]]
quote='''
Now then it is no more I that do it, but sin that dwelleth in me. This needs elucidation somewhat more at length. The body then after the transgression of the commandment becoming mortal received passions and appetites, since by these it is that our present state of existence is carried on. For thus it needs desire, not only for the provision thereby of food, but for the procreation of children also, and for agriculture's sake, and the various other arts, none of which could exist were desire altogether wanting. Thus it also contributes to our perseverance in well-doing, for nothing but such an affection for and desire of virtue could qualify us to bear its attendant difficulties. And so also does it work within us the Divine love.

The proper measure of desire then is an auxiliary to good, but its disorder brings forth intemperance, in that it leads us to lay snares against the marriage-bed of others, and to covet what does not belong to us, and to steal, and to break open tombs (in order to spoil the dead), and to commit manslaughter, and become guilty of other the like crimes; wherefore has the God of all added side by side to it (an uncalculating) impetuosity, that the latter might repress the extravagance of the others, while itself also needing a check on its own excesses. As then we dilute with what is too cold, that which is hot, and again correct what is too cold by what is hot, even so has God our Creator, by implanting in us these two passions directly opposed to each other, taught us to check each reciprocally by the other. For over them He has placed the mind, like a charioteer over his horses, and imposed the yoke of submission on them, enjoining both to bear it evenly together; if then it happen that desire springs forward beyond the line, He bids her goad up impetuosity, that this rushing onward may again bring the yoke straight; and, if that admit the overworkings of its own temper, again in its turn He orders desire to be pressed forward, that it may correct the excess of impetuosity. The mind then, if watchful and prudent, thus keeps under and directs them, while if negligent, and letting the reins go, she becomes the means of her horses breaking away, and is herself dragged onward, and with them falls into pits and down precipices. This then is what the holy apostle means by now it is no more I that do it, but sin that dwelleth in me, by sin intending the enslavement of the mind, and the usurpation of the passions; and he then doeth it not, for he hates what is done, but this usurpation of the passions is the author of the action.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
