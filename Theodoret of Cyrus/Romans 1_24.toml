[[commentary]]
quote='''
Wherefore God also gave them up to uncleanness, through the lusts of their own hearts, to dishonour their own bodies between themselves. He puts gave them up for permitted; and he means, that, seeing them willing neither by the works of creation to be led up to the Creator, nor by the judgment of reason to choose the better and avoid the worse in practice, he deprived them of his special providence, and suffered them to be carried about like an unsteady vessel, no longer enduring to direct those, who had fallen into the grossest impiety, productive of a lawless life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
