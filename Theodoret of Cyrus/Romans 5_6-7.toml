[[commentary]]
quote='''
For when we were yet without strength, in time Christ died for the ungodly. For scarcely for a righteous man will one die; yet peradventure for a good man some would even dare to die. For we reflect, that when we were yet transgressors, and suffering under the infection of impiety, the Lord Christ endured that death, which was inflicted on our behalf; and hence we learn the depth of His loving-mercy, for for a just man it might be, that some might face death, but He, through the excess of His love, welcomed the death which was in behalf of sinners; as he also goes on to say,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
