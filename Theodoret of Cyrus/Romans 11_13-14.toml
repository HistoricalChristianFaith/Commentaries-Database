[[commentary]]
quote='''
For I speak unto you, Gentiles; inasmuch indeed as I am the apostle of the Gentiles, I magnify mine office, If by any means I may provoke to emulation them which are my flesh, and may save some of them. Since God sent me forth as the minister of the Gentiles, necessarily do I labour after the salvation of the Gentiles, and direct my discourses in their behalf, and point out the holy prophets of old predicting these things; and this, that so I may excite the Jews to rivalry, and induce some of them to share in that salvation; for by his flesh he means the Jews, as those that in spirit were distant, and related to him only by the affinity of kindred,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
