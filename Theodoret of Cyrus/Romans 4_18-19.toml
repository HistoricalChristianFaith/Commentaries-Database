[[commentary]]
quote='''
Who against hope believed in hope, that he might become the father of many nations, according to that which was spoken, "So shall thy seed be." And not being weak in faith so as to consider his own body now dead, being about an hundred years old, neither the deadness of Sarah's womb; for while he saw that his wife was barren, that the impotency of old age lay upon both, and that there appeared not, according to human calculation, the smallest hope of child-bearing, and was unable to produce a single similar instance from earlier times for his encouragement, he yet welcomed the divine promise with confidence; for against hope means hope from nature; in hope, confidence in the divine promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
