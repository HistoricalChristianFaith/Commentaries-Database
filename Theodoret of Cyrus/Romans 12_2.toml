[[commentary]]
quote='''
And follow not the fashions of this world. He speaks of the things of this present world, such as wealth, and power, and other like pomps, by fashions, future things being substances, as alone permanent and satisfying; for so in another place also, (1 Cor. vii. 31,) "for the fashion of this world passeth away." For many from the height of abundance have fallen into the extremest poverty, and others sprung from the lowest parents become entrusted with the noblest offices of authority; and some again who elevated an haughty brow, and enlarged themselves in pride, conceiving themselves superior to everybody, being suddenly carried off, have become ill-savoured dust. The holy apostle therefore desires us not to gape after these things, nor to love the fashion of this world, but to seek those things which advance the life eternal. But be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect will of God. He exhorts here those also who were inclining to the worse to return again to the better, as the word transformed shews. And he teaches how great is the difference between virtue and mere present objects, by calling them fashions, but virtue a form, for a form indicates actually existing objects, but a fashion that which quickly melts away. And he points out the freedom of will which the soul possesses, by commanding it both to renew the mind, and to discriminate the better from the worse; for these things are what he says serve God; and he marks out what these are; and first of all he denounces arrogance, and enjoins humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
