[[commentary]]
quote='''
Moreover whom He did predestinate, them He also called; and whom He called, them He also justified; and whom He justified, them He also glorified. Those whose (suitable) disposition he had foreknown, those in the beginning He predestinated; and predestinating, also called; and calling, justified by baptism; and justifying, glorified by designating them sons, and endowing them with the grace of the Holy Spirit. But let no one say that such foreknowledge is the cause of these things; for foreknowledge made them not such as they are, but God as God, foresaw from of old all that would be. For so neither if seeing a violent horse seizing the bit in its teeth, and not heeding its rider, I should predict that nearing a precipice it would fall over it, and the event were to happen as I said, should I have cast the horse down that precipice, but merely have foretold what was itself about to take place, while using the evidence of the fierceness of the horse himself as my guide. But (and so likewise) the God of all, from of old knows all things as God, not that He imposes on any one a necessity for his establishment in virtue, or on another for his performance of vice; for if He exercised force towards either, He could not with justice praise and reward the former, or adjudge punishment to the latter. If then God be just, as indeed He is just, He exhorts indeed to what is right, and denounces its opposite; He approves the doers of good, and avenges Himself on those who from their own will embrace wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
