[[commentary]]
quote='''
For if by one man's offences death reigned by one; much more they which receive the fulness of grace, and of the gift, and of righteousness, shall reign in life by one, Jesus Christ. If the transgression of one man established the dominion of death, it is evident that they, which enjoy the plenteous gifts of God, shall be conquerors over death, and share with Christ in the imperishable kingdom and life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
