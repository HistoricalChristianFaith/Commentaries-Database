[[commentary]]
quote='''
Now to him that earneth it by his works the reward is not reckoned of grace, but of debt. For the doer of righteousness demands his reward, while the righteousness which is of faith is the free gift of the God of all, as is further exhibited in what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
