[[commentary]]
quote='''
And the God of peace shall bruise Satan under your feet shortly. Since he had commanded them to be on their guard against their enemies, most opportunely does he beseech God to confound the teacher of all snares, and cast him beneath the feet of the believers. The grace of our Lord Jesus Christ be with you. Having pointed out the enemy, he next points out the Helper, for they that have obtained the divine grace possess that which is invincible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
