[[commentary]]
quote='''
Salute Rufus chosen in the Lord, and his mother and mine. And most enviable also is this encomium, for many are called but few chosen; and his mother he praises as adorned with many noble acts of virtue, for not otherwise could she have been deemed worthy of being called the mother of Paul; for of Rufus indeed nature made her the mother, but of the holy Paul respect for her virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
