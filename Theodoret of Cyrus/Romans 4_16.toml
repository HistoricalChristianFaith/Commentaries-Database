[[commentary]]
quote='''
Therefore it is of faith, that it might be by grace; to the end the promise might be sure to all the seed; not to that only which is of the law, but to that also which is of the faith of Abraham, who is the father of us all. He puts down the arrogance of the Jews by applying the name, seed of Abraham, to such as imitated the faith of Abraham, however aliens in blood. But if then, while the law punishes transgressors, (the covenant of) grace gives forgiveness of sins, it confirms thereby the promise made by God, in bringing that blessing on the nations. And as He had called Abraham, the father both of the nations, and of the Jews, he supports the expression by testimony from Scripture,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
