[[commentary]]
quote='''
And thinkest thou this, O man, that judgest them which do such things, and doest the same, that thou shalt escape the judgment of God? Or despisest thou the riches of His goodness and forbearance and long-suffering? We know indeed that in His own due time the righteous Judge will inflict vengeance on every sinner, but you, says he, who are so ready to punish others, and to shut your eyes to your own transgressions, imagine that you will escape the divine tribunal. Not so. God bears with you, and has long-suffering, because He yet waits your repentance, as he subjoins, not knowing that the goodness of God leadeth thee to repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
