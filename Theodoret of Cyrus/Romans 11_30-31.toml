[[commentary]]
quote='''
For as ye in times past have not believed God, yet have now obtained mercy through their unbelief, Even so have these also now not believed, that through your mercy they also may obtain mercy. Remember indeed how for so long a period all of you lived in sin, and yet the merciful Lord looked not to that lengthened and bitter ungodliness, but blessed with his unspeakable loving-kindness such as were willing to receive it, and when these (the Jews) would not believe, called you in their room; nothing inconsistent then were it, that these also, who now gainsay, should be accepted of God whenever willing to believe, and so inherit the divine loving-kindness. And the that he here again uses in the idiom and sense familiar to him, for they did not therefore disbelieve, in order that they might find mercy, but they disbelieved because of the hardness of their hearts, and will find mercy by turning to a change of mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
