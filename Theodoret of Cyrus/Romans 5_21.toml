[[commentary]]
quote='''
That as sin had reigned unto death, even so might grace reign through righteousness unto eternal life, by Jesus Christ our Lord. Here he finishes the argument, shewing that as sin, begetting death, had reigned in our mortal bodies, exciting the passions to excess; so grace, conveying to believers the justification which is of faith, has her dominion also, one not coeval with that of sin, but eternal and endless; for the former reigns over our bodies, but at their death ceases from her power, "for he who is dead," according to the holy apostle, "is freed from sin;" while, after the resurrection, our bodies having become imperishable, and immortal, grace will reign in them, sin having no longer any place; for when the passions have ceased, there will be no room for sin. And then again he proposes another objection arising from the subject, and with ease resolves it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
