[[commentary]]
quote='''
I know and am persuaded by the Lord Jesus, that in Him there is nothing unclean. It was necessary, by reason of the infirmity of the Jews, that he should add the expression in the Lord Jesus; for it was that they might not say, Who art thou that legislatest in contradiction of Moses? that he brings forward the Lord of Moses; showing that He had put an end to the observances of the law, and permitted us not to consider any food unclean; for the in Him signifies in His institutions in the gospel; for Himself also said to the blessed Peter, "What God hath cleansed that call not thou unclean." (Acts x. 15.) But to him that esteemeth any thing to be unclean, to him it is unclean. But if a man conceiving such food to be unclean, yet partakes therein, it becomes unclean; not by reason of its own nature, but on account of the opinion of him that thus partakes of it. Having thus distinguished as to these things, he again censures the Gentile converts, who bore not the infirmities of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
