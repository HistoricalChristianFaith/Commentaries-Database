[[commentary]]
quote='''
Nevertheless, brethren, I have written the more boldly unto you in some sort, as putting you in mind, because of the grace that is given to me of God. He displays at the same time the modesty of his own mind in saying he made bold to teach them; and exhibits this grace given to him, in teaching that he writes in subservience to it. And what grace then is this given to thee?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
