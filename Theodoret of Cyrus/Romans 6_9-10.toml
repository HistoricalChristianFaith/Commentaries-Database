[[commentary]]
quote='''
Knowing that Christ, having been raised from the dead, dieth no more: death hath no more dominion over him. For in that he died, he died unto sin once; but in that he liveth, he liveth unto God. Amply, by these words, has he proved his wish to make believers abstain from sin. Once, says he, Christ died; and that He should a second time die were impossible, for He now possesses an immortal body. On this account, therefore, we all also enjoy one baptism; expect not then any second forgiveness by (means of any second) baptism. He has indeed well said that He died unto sin, for He was not subject to death, inasmuch as He had done no sin, but received death for our sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
