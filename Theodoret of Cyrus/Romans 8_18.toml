[[commentary]]
quote='''
For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us. The crowns exceed the contests; the reward cannot be put in the same scale with the afflictions; small is the affliction, but vast the looked for gain; wherefore he calls the things thus hoped for, not payment, but glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
