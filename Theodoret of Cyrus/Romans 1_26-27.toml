[[commentary]]
quote='''
For this cause, God gave them up to infamous passions, for even their women did change the natural use into that which is against nature. And likewise also the men, leaving the natural use of the woman, burned in their lust one towards another, men with men working that which is unseemly. Iniquity walks hand in hand with impiety, so that as they had changed the truth of God into a lie, so did they in like manner exchange the proper object and exercise of the passions for that which was abominable. And receiving in themselves that recompense of their error which was meet. For infamy is the severest penalty of such affections. And thus, what not even a victorious enemy had ever attempted to inflict on them, they themselves willingly ran into; and punishment thereby, heavier than that which any judge would impose, do they voluntarily bring on themselves. And what then was the cause of all these evils?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
