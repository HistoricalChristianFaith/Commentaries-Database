[[commentary]]
quote='''
Nay but, O man, who art thou, that repliest against God? Since thou hast asked, says he, "who has resisted His will," tell me what thou art; art thou not a man? How then dost thou reply against, and over-curiously inquirest into the divine dispensations? for if thou wert not a free agent, nor couldest choose by thine own free will what thou wouldest do, but wert enslaved to the compulsion of the divine will, thou wouldest, like the inanimate creation, have been silent, and acquiesced in His dispensations; but since thou art dignified by reason, (therefore it is that) thou both sayest and doest what thou thyself pleasest, and lovest not what has been done, but inquirest into the causes of the divine dispensations. Shall the thing formed say to him that formed it, Why hast thou made me thus?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
