[[commentary]]
quote='''
Therefore we are debtors, not to the flesh, to live after the flesh, for having received salvation of Christ Jesus, and been made partakers of the grace of the Spirit, to Him we owe the debt of service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
