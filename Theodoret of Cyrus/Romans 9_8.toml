[[commentary]]
quote='''
That is, not they which are the children of the flesh are the children of God, but the children of the promise are counted for the seed. By the children of the flesh, he means those that were born after the ordinary course of nature, but of the promise, those that were given by grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
