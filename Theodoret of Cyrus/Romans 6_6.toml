[[commentary]]
quote='''
Knowing this, that our old man has been crucified with Him, that the body might be rendered inoperative as regards sin, so as that we should no longer serve sin. Not our nature, but our evil inclination, is what He here calls the old man, and this he says has been put to death in baptism, that the body may be idle as regards sin, for this it is which He means by that the body might be made to cease from sin, so that it should in no wise serve sin. And this He shows more plainly by another similitude:—
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
