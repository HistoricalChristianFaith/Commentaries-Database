[[commentary]]
quote='''
For to this end Christ both died, and rose, and revived, that He might be Lord, both of the dead and the living. He is the Master of all, who for our sakes gave Himself up to death, who destroyed the power of death, and has promised salvation to us all. To Him, then, are we subject, as from Him having received life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
