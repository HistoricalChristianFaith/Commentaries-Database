[[commentary]]
quote='''
Let us walk honestly, as in the day. By natural things he sets forth spiritual, for so they that embrace a life of sin commit such sin in the night, while in the day time they put on the appearance of orderly conduct. He intends, then, that the night having as it were passed away, and ignorance ceased, we should depart from evil deeds. And what these are he goes on to specify. Not in lasciviousness, and drunkenness; not in chambering and wantonness; not in strife and envying. For in their feasts some were wont to act lewdly, and defile their tongues with obscene songs, all of which drunkenness provokes, as it is also the parent of wantonness, and the teacher of strife and quarrelsomeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
