[[commentary]]
quote='''
O wretched man that I am! who shall deliver me from this body of death? I thank my God through Jesus Christ our Lord. He calls it a body of death, as being born subject to death; that is, mortal, for the soul is immortal. Christ alone, says he, has freed us from this bitter bondage, by putting an end to death, and promising us immortality, and that life which is without either labour or pain, and apart from warfare and sin; the full enjoyment whereof we shall receive in the existence to come; while in the present we are blessed with the grace of the thrice holy Spirit, and thereby not only do we set ourselves against the passions, but by the possession of such an Helper are enabled to triumph over them. And then he brings forward the resolution of all that had been said, So then I myself, the same person, with the mind serve the law of God, but with the flesh the law of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
