[[commentary]]
quote='''
What shall we then say to these things? If God be for us, who can be against us? Having God as our ally, shall we be afraid of men? He comprehends all things at once under the word who; whether kings, or generals, or people, or their leaders; the whole world at once. And then he brings forward the crowning blessing of blessings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
