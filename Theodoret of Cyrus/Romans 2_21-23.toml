[[commentary]]
quote='''
Thou therefore that teachest another, teachest thou not thyself? thou that preachest a man should not steal, dost thou steal? Thou that sayest a man should not commit adultery, dost thou commit adultery? thou that abhorrest idols dost thou commit sacrilege? Thou that makest thy boast of the law, through breaking the law dishonourest thou God? He shows that they had drawn no benefit from the establishment of the law among them, but being content to pride themselves on its mere letter, and endeavouring to teach others, while by their deeds contradicting their words, so boasted in the law in vain; and he adds a proof to confirm the accusation,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
