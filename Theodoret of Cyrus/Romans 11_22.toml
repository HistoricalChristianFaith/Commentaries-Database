[[commentary]]
quote='''
Behold therefore the goodness and severity of God: on them which fell, severity; but towards thee, goodness, if thou continue in His goodness: otherwise thou also shalt be cut off. Behold now how God has cut them off, because they followed not the faith of their forefathers, and how He has conferred on thee the blessing of his loving-kindness, and made thee to share in a root not appertaining to thee, from which thou wilt be altogether severed again, if thou keepest not the gift bestowed on thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
