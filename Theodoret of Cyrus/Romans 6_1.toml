[[commentary]]
quote='''
What shall we say then? shall we continue in sin, that grace may abound? God forbid. By the reprobation of this, he shows its inconsistency, but the question itself he put down, because of what had been just before said, "Where sin abounded, grace did much more abound." Nor is he contented with this bare condemnatory disavowal, but proceeds to treat the subject in another way also:—
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
