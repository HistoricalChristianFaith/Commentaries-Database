[[commentary]]
quote='''
For sin shall no longer have dominion over you, says he. For nature no longer fights singly, but has for her assistant the grace of the Spirit; for this he adds, for ye are not under the law, but under grace. He shows that before the coming of (the covenant of) grace, the law taught only what was to be done, but afforded no help to those under it, while (the covenant of) grace, in addition to the imposition of duties, extends assistance also, on which account the legislative constitution of grace is also more complete than the law, as removing the impediments by this succour. And here again he answers an objection arising.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
