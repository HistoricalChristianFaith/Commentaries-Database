[[commentary]]
quote='''
Wherefore the law is holy, and the commandment holy, and just and good. It is the Mosaic which he here speaks of as the law, and that given to Adam as the commandment. And the reason why he honours the latter with the greater praises, is that it commonly meets with the greater censures. For they who live in idle ease, and will not undergo the labours of virtue, cry out even against God Himself, for imposing this commandment. For if He were ignorant, say they, of what would happen, how can He be God who foreknows not the future? but if while foreseeing the transgression, He yet imposed the commandment, Himself is the cause of the transgression! But such should be aware, that the power of discriminating between good and its opposite is the property of those that are gifted with reason, for the nature of the irrational creatures possesses no such faculty of distinguishment of these things; for the wolf is ravenous, and the lion feasts on its prey while scarce dead, and bears and leopards follow in the same train; and they have no sense of sin, nor a conscience to be pricked at what has been done; while men, though no one be present at their actions, are ashamed and afraid on account of what they have dared to commit, for conscience supplies the accusation. How then were it possible that they who possess such a nature, should yet live without any law at all? Wherefore God enjoined the commandment, that man might thereby learn to understand his own nature, and to fear his Lawgiver. And well indeed may we perceive the loving-kindness of that Lawgiver, for He enjoined, not some law which was difficult of observation, but one which could have been easily kept. He allowed to him the enjoyment of all the trees, of one alone He forbade him the use; not that He grudged him that one, for how could He do so, who had already given him power over all? but in order to teach him the terms of submission, and to render him well-affected towards his Creator, and afford a mean for the exercise of his rational faculties. And if then, by not keeping the commandment he came under sentence of death, this can be no cause for blame to the Lawgiver, but to him who transgressed the law. For so neither, when a physician orders his patient to abstain from cold drinks, does he do this because he invidiously grudges them to him, but in order to bring about his health; and if he not observing the injunction will take water, he draws the injury on himself, but the physician is free from blame altogether. But indeed the Lord God has treated with every possible consideration and kindness, both Adam himself and all his race, and, to pass by all other, and come at once to the noblest instance, for him, and his race, the only-begotten Word became incarnate, and put an end to the power of death, which from him had received its beginning, and promised the resurrection, and prepared the kingdom of heaven: so that He both foreknew his transgression, and made ready before-hand the mean of remedy to follow; wherefore the holy apostle calls the commandment holy, just, and good; holy, as teaching what we ought to do; just, as rightly pronouncing judgment on the transgressors; good, as appointing life to such as observed it. And then again he states the objection that might arise,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
