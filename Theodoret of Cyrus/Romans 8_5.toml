[[commentary]]
quote='''
For they that are after the flesh, do mind the things of the flesh; but they that are after the Spirit, the things of the Spirit; and in like manner in another place, (Gal. v. 25,) "If we live in the Spirit, let us also walk in the Spirit," meaning here by the Spirit, the grace of the Spirit, and teaching that he who follows it, both thinks and does the things agreeable thereto, and he that is enslaved to the flesh, that is, to the passions of the body, has deprived himself of his freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
