[[commentary]]
quote='''
But I know that, when I come unto you, I shall come in the fulness of the blessing of the gospel of Christ. By the fulness of the blessing of the gospel he means, the dangers for the gospel's sake which he underwent at Jerusalem; as what follows evinces,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
