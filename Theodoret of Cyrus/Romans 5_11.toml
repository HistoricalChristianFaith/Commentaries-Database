[[commentary]]
quote='''
And not only so, but we joy also in God, through our Lord Jesus Christ, by whom we have now received the reconciliation. For not only do we expect immortal life, but even as to the present existence, glory in having been brought near unto God, while we reflect upon the things concerning the Lord Christ, who, being our mediator, has effected peace.

From hence he proceeds to explain the mystery of the dispensation, and show the reasons of the incarnation,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
