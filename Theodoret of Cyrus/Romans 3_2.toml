[[commentary]]
quote='''
Much in every way. For He chose their ancestors, He freed them from the dominion of the Egyptians, He made them the wonder of nations by miracles of all kinds, He gave the law for their assistance, and set over them His prophets; for this is what he means by much in every way: while yet omitting the specific enumeration of all these, he is content to mention the institution of the law alone—Chiefly that unto them were committed the oracles of God. For this was the highest honour: while the other nations possessed only that knowledge which nature gives, themselves to have received the gift of the law in addition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
