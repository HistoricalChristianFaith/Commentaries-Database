[[commentary]]
quote='''
For Christ is the end of the law for righteousness to every one that believeth. For faith in the Lord is not contrary to the law, but most agreeable therewith, seeing that the law itself has directed us to the Lord Christ. he, then, that trusts in Christ, fulfils the intention of the law. And well again does he say, to every one that believeth, for the whole race of mankind has been comprehended, so that whether it be Greek or barbarian, if he believe, he shall obtain salvation. And then he again sets forth the difference between the law and grace, and introduces Moses the lawgiver, as the teacher of both;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
