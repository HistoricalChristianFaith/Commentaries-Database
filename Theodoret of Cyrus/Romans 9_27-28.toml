[[commentary]]
quote='''
Esaias also crieth concerning Israel, Though the number of the children of Israel be as the sand of the sea, a remnant (only) shall be saved. For a short word will the Lord make upon the earth (ch. x. 22, 23). Most opportunely has he brought forward this evidence, to show that, of old, the God of all foresaw both those who had attached themselves to the faith, and those who had sunk beneath the disease of infidelity. For as the Jews alleged that but few of them had accepted the gospel, and all the rest had turned away from it as a deception, he proves that all this had long ago been predicted, and that although they should exceed the power of numbers in multitude, and equal the sand of the sea, not all, but such (only) as were furnished with faith, should obtain salvation. For faith is what he calls the short word, because what the law taught in many commandments, while yet unable to afford complete salvation, that confession in Christ has accomplished, while engendering faith. And this is short, and needs not multiplied periods, being evidenced by the disposition of the heart, and published by the tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
