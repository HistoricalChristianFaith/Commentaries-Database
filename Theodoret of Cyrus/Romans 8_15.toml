[[commentary]]
quote='''
For ye have not received the spirit of bondage again to fear, but ye have received the spirit of adoption. Again, he compares (the covenants of) grace and the law, and calls the institutions of the latter, bondage, while at the same time showing that it was written by the grace of the Spirit. Not, therefore, the thrice-holy Spirit itself does he here call the spirit of bondage, but the imposition of the law as effected by that holy Spirit; for had he by the spirit of bondage meant the thrice-holy Spirit itself, then truly must there have been another Spirit, of adoption; but not so is it, for the thrice-holy Spirit is One, while different and varying are His gifts; "for to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit; to another faith by the same Spirit and so forth. And having shown that in truth we have received the privilege of adoption, he subjoins, whereby we cry, Abba, Father. For when we offer up to the Lord the prayer of the initiated, we are bidden to address Him as our Father, and we say, "Our Father which art in heaven and he has added the word, Abba, to point out the confidence wherewith we call upon Him, for so little children, using the greater boldness towards their parents, in that they have not as yet a clear knowledge of the difference between them and themselves, the oftener and oftener go on lisping out the same word towards them; and so in like manner we, by reason of His unspeakable kindness, and immeasurable goodness, call the Maker of all our Father, as we are commanded, while yet we are unconscious how great is the difference between Him and ourselves, not understanding our own selves clearly, and of His nature being altogether ignorant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
