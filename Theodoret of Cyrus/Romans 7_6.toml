[[commentary]]
quote='''
But now we are made to cease from the law. He still continues in the same cautious mode of expression, and says not, "the law is made to cease," but we are made to cease from the law, that is, it is inoperative as regards ourselves, we are no longer under its polity. And how are we made to cease from it? Being dead to that wherewith we had been held. For when we were subjects of the law we came to baptism, and dying with Christ, and with Him rising again, we were united to our Lawgiver, and no longer need the polity of the law, for we have received the very grace itself of the Spirit, as what follows proves, that we should serve in newness of spirit, and not in the oldness of the letter. He here puts the spirit in opposition to letter, and the new against the old, that by the word letter he might point out the law, and by the old its having come to a conclusion. For indeed by Jeremiah (xxxi. 31, 32) God says, "I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant that I made with their fathers, in the day that I took them by the hand to bring them out of the land of Egypt so that the difference was shown even by the prophet; and on the appearance of the new covenant, the old must yield. Having thus spoken, and foreseeing as one honoured with the gifts of the Spirit, that some of the heretics would understand this in derogation of the old covenant, and conceive that the old law came from some other than the one same God, the holy apostle necessarily states the objections and subjoins the answers to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
