[[commentary]]
quote='''
But sin taking occasion by the commandment wrought in me all manner of concupiscence. In every way he endeavours to show that it was free from blame, for having said that by the imposition of the law sins had been increased, lest any one should suppose that the law had been the cause, he most seasonably sets forth its way, that sin making use of the imposition of the law as a mean for battle, beat down the weaker powers of judgment. For without the law sin were dead, for where there is no law pointing out what should be done, and forbidding what should not be done, sin has no place. And he makes this evident by an example;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
