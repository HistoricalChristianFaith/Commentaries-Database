[[commentary]]
quote='''
Wherefore also it was imputed unto him for righteousness; that is, faith was.

Having thus shown that faith flourished among those, who were under the law, and those also who lived before it, he turns his discourse to the object proposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
