[[commentary]]
quote='''
For he that is dead is freed from sin. For who ever yet saw one that was dead either invading the marriage-bed of another, or imbruing his hands in bloodshed, or committing any other of the catalogue of iniquities?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
