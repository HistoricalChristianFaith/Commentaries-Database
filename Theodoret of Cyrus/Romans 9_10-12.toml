[[commentary]]
quote='''
And not only this; but when Rebecca also had conceived by one, even by our father Isaac: For the children being not yet born, neither having done any good, or evil, that the purpose of God according to election might stand, not of works, but of Him that calleth, It was said unto her, that the elder shall serve the younger. If thou thinkest, says he, that, on account of (his birth from) Sarah, Isaac was preferred before Ishmael, and Abraham's other children whom he had by Keturah, what wilt thou say to the case of Rebecca? For here were there the same father and the same mother, and the same one single conception, the children being twins; for this is what he means by having conceived by one, that is conceived both at the same time; but the one nevertheless was beloved of God, and the other unworthy the divine regard; and God waited not for the evidence of events, but while yet they were in the womb predicted the difference between them; and He predicted it from foreknowing their dispositions, for election is not arbitrary, but in accordance to the disposition of men; and then he adduces the testimony of the prophet, (Mal. i. 3,)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
