[[commentary]]
quote='''
And declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead of Jesus Christ our Lord.

Before his cross and passion, not only to the other Jews, but even to the apostles themselves, our Lord Christ did not seem to be God; for they were misled by his perfect humanity, when they saw him eating and drinking, and sleeping, and becoming fatigued; nor could even his miracles bring them to this conviction; and thus, for instance, when they beheld the miracle at the sea of Tiberias (Matt. viii. 27,) they cried out, "What manner of man is this, that even the winds and the sea obey him!" In full accordance with which, our Lord said unto them, (John xvi. 12,) "I have many things to say unto you, but ye cannot bear them yet. Howbeit when he, the Spirit of truth, is come, he will guide you into all truth and again, (Luke xxiv. 49,) "Tarry ye here in this city, until ye shall be endued with power from on high, the holy Ghost coming upon you."

Before his passion, then, such were the ideas they entertained of him; but after his resurrection and ascension to heaven, and the illumination of the thrice holy Spirit, and the various miracles which by the invocation of his sacred name they performed, all the faithful knew that he is God, and the only-begotten Son of God. This then the holy apostle teaches here, that he, who according to the flesh was designated as the son of David, was proved and set forth as the Son of God, in the power exercised by the thrice holy Spirit, after the resurrection from the dead of the same our Lord Jesus Christ;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Theodoret%2520of%2520Cyrus%2FCommentary%2520on%2520Romans.html'
source_title="Commentary on Romans"
