[[commentary]]
quote='''
For whom would he not dare to try, who did not keep from his treacherous attempts even on our Lord Jesus Christ? For, as the story of the Gospel has disclosed, when our Saviour, Who was true God, that He might show Himself true Man also, and banish all wicked and erroneous opinions, after the fast of 40 days and nights, had experienced the hunger of human weakness, the devil, rejoicing at having found in Him a sign of passible and mortal nature, in order to test the power which he feared, said, “If Thou art the Son of God, command that these stones become bread.” Doubtless the Almighty could do this, and it was easy that at the Creator’s command a creature of any kind should change into the form that it was commanded: just as when He willed it, in the marriage feast, He changed the water into wine: but here it better agreed with His purposes of salvation that His haughty foe’s cunning should be vanquished by the Lord, not in the power of His Godhead, but by the mystery of His humiliation. At length, when the devil had been put to flight and the tempter baffled in all his arts, angels came to the Lord and ministered to Him, that He being true Man and true God, His Manhood might be unsullied by those crafty questions, and His Godhead displayed by those holy ministrations. And so let the sons and disciples of the devil be confounded, who, being filled with the poison of vipers, deceive the simple, denying in Christ the presence of both true natures, whilst they rob either His Godhead of Manhood, or His Manhood of Godhead, although both falsehoods are destroyed by a twofold and simultaneous proof: for by His bodily hunger His perfect Manhood was shown, and by the attendant angels His perfect Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252040%2520On%2520Lent%252C%25202.html'
source_title="Sermon 40, Chapter 3"
