[[commentary]]
quote='''
(Serm. 55, 1.) Two thieves were crucified with him, one on the right hand and one on the left, that in the figure of His cross might be represented that separation of all mankind which shall be made in His judgment. The Passion then of Christ contains a sacrament of our salvation, and of that instrument which the wickedness of the Jews provided for His punishment, the power of the Redeemer made a step to glory.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so when all things had been accomplished, which the Godhead veiled in frail flesh permitted, Jesus Christ the Son of God was fixed to the cross which He had also been carrying, two robbers being similarly crucified, one on His right hand, and the other on the left: so that even in the incidents of the cross might be displayed that difference which in His judgment must be made in the case of all men; for the believing robber’s faith was a type of those who are to be saved, and the blasphemer’s wickedness prefigured those who are to be damned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252055%2520On%2520the%2520Lord%2527s%2520Passion%25204%252C%2520Delivered%2520on%2520Wednesday%2520in%2520Holy%2520Week.html'
source_title="Sermon 55, Chapter 1"
