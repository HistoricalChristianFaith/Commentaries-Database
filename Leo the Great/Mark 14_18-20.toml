[[commentary]]
quote='''
But Jesus, sure of His purpose and undaunted in carrying out His Father’s will, fulfilled the New Testament and founded a new Passover. For while the disciples were lying down with Him at the mystic Supper, and when discussion was proceeding in the hall of Caiaphas how Christ might be put to death, He, ordaining the Sacrament of His Body and Blood, was teaching them what kind of Victim must be offered up to God, and not even from this mystery was the betrayer kept away, in order to show that he was exasperated by no personal wrong, but had determined beforehand of his own free-will upon his treachery. For he was his own source of ruin and cause of perfidy, following the guidance of the devil and refusing to have Christ as director. And so when the Lord said, “Verily I say to you that one of you is about to betray Me,” He showed that His betrayer’s conscience was well known to Him, not confounding the traitor by harsh or open rebukes, but meeting him with mild and silent warnings that he who had never been sent astray by rejection, might the easier be set right by repentance. Why, unhappy Judas, dost thou not make use of so great long-suffering? Behold, the Lord spares thy wicked attempts; Christ betrays thee to none save thyself. Neither thy name nor thy person is discovered, but only the secrets of thy heart are touched by the word of truth and mercy. The honour of the apostolic rank is not denied thee, nor yet a share in the Sacraments. Return to thy right mind; lay aside thy madness and be wise. Mercy invites thee, Salvation knocks at the door, Life recalls thee to life. Lo, thy stainless and guiltless fellow-disciples shudder at the hint of thy crime, and all tremble for themselves till the author of the treachery is declared. For they are saddened not by the accusations of conscience, but by the uncertainty of man’s changeableness; fearing lest what each knew against himself be less true than what the Truth Himself foresaw. But thou abusest the Lord’s patience in this panic of the saints, and believest that thy bold front hides thee. Thou addest impudence to guilt, and art not frightened by so clear a test. And when the others refrain from the food in which the Lord had set His judgment, thou dost not withdraw thy hand from the dish, because thy mind is not turned aside from the crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 3"
