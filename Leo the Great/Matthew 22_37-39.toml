[[commentary]]
quote='''
And so, when the Lord says, “Thou shalt love the Lord thy God, from all thy heart and from all thy mind: and thou shalt love thy neighbour as thyself,” let the faithful soul put on the unfading love of its Author and Ruler, and subject itself also entirely to His will in Whose works and judgments true justice and tender-hearted compassion never fail. For although a man be wearied out with labours and many misfortunes, there is good reason for him to endure all in the knowledge that adversity will either prove him good or make him better. But this godly love cannot be perfect unless a man love his neighbour also. Under which name must be included not only those who are connected with us by friendship or neighbourhood, but absolutely all men, with whom we have a common nature, whether they be foes or allies, slaves or free. For the One Maker fashioned us, the One Creator breathed life into us; we all enjoy the same sky and air, the same days and nights, and, though some be good, others bad, some righteous, others unrighteous, yet God is bountiful to all, kind to all, as Paul and Barnabas said to the Lycaonians concerning God’s Providence, “who in generations gone by suffered all the nations to walk in their own ways. And yet He left Himself not without witness, doing them good, giving rain from heaven and fruitful seasons, and filling our hearts with food and gladness.” But the wide extent of Christian grace has given us yet greater reasons for loving our neighbour, which, reaching to all parts of the whole world, looks down on no one, and teaches that no one is to be neglected. And full rightly does He command us to love our enemies, and to pray to Him for our persecutors, who, daily grafting shoots of the wild olive from among all nations upon the holy branches of His own olive, makes men reconciled instead of enemies, adopted sons instead of strangers, just instead of ungodly, “that every knee may bow of things in heaven, of things on earth, and of things under the earth, and every tongue confess that the Lord Jesus Christ is in the glory of God the Father.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252012%2520On%2520the%2520Fast%2520of%2520The%252C%2520Tenth%2520Month%252C%25201.html'
source_title="Sermon 12, Chapter 2"

[[commentary]]
quote='''
But as the world attracts us with its appearance, and abundance and variety, it is not easy to turn away from it unless in the beauty of things visible the Creator rather than the creature is loved; for, when He says, “thou shalt love the Lord thy God from all thy heart, and from all thy mind, and from all thy strength,” He wishes us in noticing to loosen ourselves from the bonds of His love. And when He links the love of our neighbour also to this command, He enjoins on us the imitation of His own goodness, that we should love what He loves and do what He does.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252090%2520%2528on%2520the%2520Fast%2520of%2520Seventh%2520Month%252C%25205%2529.html'
source_title="Sermon 90, Chapter 3"
