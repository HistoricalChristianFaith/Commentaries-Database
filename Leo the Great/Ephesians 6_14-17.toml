[[commentary]]
quote='''
“Stand, therefore,” dearly-beloved, as the Apostle says, “having the loins of your mind girt in truth, and your feet shod in the preparation of the gospel of peace, in all things taking the shield of faith in which ye may be able to extinguish all the fiery darts of the evil one, and put on the helmet of salvation and the sword of the Spirit, which is the Word of God.” See, dearly-beloved, with what mighty weapons, with what impregnable defences we are armed by our Leader, who is famous for His many triumphs, the unconquered Master of the Christian warfare. He has girt our loins with the belt of chastity, He has shod our feet with the bonds of peace: because the unbelted soldier is quickly vanquished by the suggester of immodesty, and he that is unshod is easily bitten by the serpent. He has given the shield of faith for the protection of our whole body; on our head has He set the helmet of salvation; our right hand has He furnished with a sword, that is with the word of Truth: that the spiritual warrior may not only be safe from wounds, but also may have strength to wound his assailant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapter 4"
