[[commentary]]
quote='''
But He Who was postponing the shedding of His blood for the world’s redemption till another time, was carried and brought into Egypt by his parents’ aid, and thus sought the ancient cradle of the Hebrew race, and in the power of a greater providence dispensing the princely office of the true Joseph, in that He, the Bread of Life and the Food of reason that came down from heaven, removed that worse than all famines under which the Egyptians’ minds were labouring, the lack of truth, nor without that sojourn would the symbolism of that One Victim have been complete; for there first by the slaying of the lamb was fore-shadowed the health-bringing sign of the Cross and the Lord’s Passover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 4"
