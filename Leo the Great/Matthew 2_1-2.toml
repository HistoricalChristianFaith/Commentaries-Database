[[commentary]]
quote='''
(Serm. xxxiii. 2.) Christ Himself, the expectation of the nations, that innumerable posterity once promised to the most blessed patriarch Abraham, but to be born not after the flesh, but by the Spirit; therefore likened to the stars for multitude, that from the father of all nations, not an earthly but an heavenly progeny might be looked for. Thus the heirs of that promised posterity, marked out in the stars, are roused to the faith by the rise of a new star, and where the heavens had been at first called in to witness, the aid of Heaven is continued.

(Serm. xxxiv. 3.) Besides that star thus seen with the bodily eye, a yet brighter ray of truth pierced their hearts; they were enlightened by the illumination of the true faith.

(ubi sup.) What they knew and believed might have been sufficient for themselves, that they needed not to seek to see with the bodily eye, what they saw so clearly with the spiritual. But their earnestness and perseverance to see the Babe was for our profit. It profited us that Thomas, after the Lord's resurrection, touched and felt the marks of his wounds, and so for our profit the Magians' eyes looked on the Lord in His cradle.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For it concerns all men’s salvation, that the infancy of the Mediator between God and men was already manifested to the whole world, while He was still detained in the tiny town. For although He had chosen the Israelitish nation, and one family out of that nation, from whom to assume the nature of all mankind, yet He was unwilling that the early days of His birth should be concealed within the narrow limits of His mother’s home: but desired to be soon recognized by all, seeing that He deigned to be born for all. To three wise men, therefore, appeared a star of new splendour in the region of the East, which, being brighter and fairer than the other stars, might easily attract the eyes and minds of those that looked on it, so that at once that might be observed not to be meaningless, which had so unusual an appearance. He therefore who gave the sign, gave to the beholders understanding of it, and caused inquiry to be made about that, of which He had thus caused understanding, and after inquiry made, offered Himself to be found.

These three men follow the leading of the light above, and with stedfast gaze obeying the indications of the guiding splendour, are led to the recognition of the Truth by the brilliance of Grace, for they supposed that a king’s birth was notified in a human sense, and that it must be sought in a royal city. Yet He who had taken a slave’s form, and had come not to judge, but to be judged, chose Bethlehem for His nativity, Jerusalem for His passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252031%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25201.html'
source_title="Sermon 31, Chapters 1-2"

[[commentary]]
quote='''
Now the manifestation of this unspeakable mercy, dearly-beloved, came to pass when Herod held the royal power in Judea, where the legitimate succession of Kings having failed and the power of the High-priests having been overthrown, an alien-born had gained the sovereignty: that the rising of the true King might be attested by the voice of prophecy, which had said: “a prince shall not fail from Juda, nor a leader from his loins, until He come for whom it is reserved, and He shall be the expectation of the nations.” Concerning which an innumerable succession was once promised to the most blessed patriarch Abraham to be begotten not by fleshly seed but by fertile faith; and therefore it was compared to the stars in multitude that as father of all the nations he might hope not for an earthly but for a heavenly progeny. And therefore, for the creating of the promised posterity, the heirs designated under the figure of the stars are awakened by the rising of a new star, that the ministrations of the heaven might do service in that wherein the witness of the heaven had been adduced. A star more brilliant than the other stars arouses wise men that dwell in the far East, and from the brightness of the wondrous light these men, not unskilled in observing such things, appreciate the importance of the sign: this doubtless being brought about in their hearts by Divine inspiration, in order that the mystery of so great a sight might not be hid from them, and, what was an unusual appearance to their eyes, might not be obscure to their minds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 2"

[[commentary]]
quote='''
For the confirmation therefore of this Faith which was to be fore-armed against all errors, it was a wondrous loving provision of the Divine plan that a nation which dwelt in the far-off country of the East and was cunning in the art of reading the stars, should receive the sign of the infant’s birth who was to reign over all Israel. For the unwonted splendour of a bright new star appeared to the wise men and filled their mind with such wonder, as they gazed upon its brilliance, that they could not think they ought to neglect what was announced to them with such distinctness. And, as the event showed, the grace of God was the disposing cause of this wondrous thing: who when the whole of Bethlehem itself was still unaware of Christ’s birth, brought it to the knowledge of the nations who would believe, and declared that which human words could not yet explain, through the preaching of the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 1"

[[commentary]]
quote='''
The day, dearly-beloved, on which Christ the Saviour of the world first appeared to the nations must be venerated by us with holy worship: and to-day those joys must be entertained in our hearts which existed in the breasts of the three magi, when, aroused by the sign and leading of a new star, which they believed to have been promised, they fell down in presence of the King of heaven and earth. For that day has not so passed away that the mighty work, which was then revealed, has passed away with it, and that nothing but the report of the thing has come down to us for faith to receive and memory to celebrate; seeing that, by the oft-repeated gift of God, our times daily enjoy the fruit of what the first age possessed. And therefore, although the narrative which is read to us from the Gospel properly records those days on which the three men, who had neither been taught by the prophets’ predictions nor instructed by the testimony of the law, came to acknowledge God from the furthest parts of the East, yet we behold this same thing more clearly and abundantly carried on now in the enlightenment of all those who are called, since the prophecy of Isaiah is fulfilled when he says, “the Lord has laid bare His holy arm in the sight of all the nations, and all the nations upon earth have seen the salvation which is from the Lord our God;” and again, “and those to whom it has not been announced about Him shall see, and they who have not heard, shall understand.” Hence when we see men devoted to worldly wisdom and far from belief in Jesus Christ brought out of the depth of their error and called to an acknowledgment of the true Light, it is undoubtedly the brightness of the Divine grace that is at work: and whatever of new light illumines the darkness of their hearts, comes from the rays of the same star: so that it should both move with wonder, and going before lead to the adoration of God the minds which it visited with its splendour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252036%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25206.html'
source_title="Sermon 36, Chapter 1"
