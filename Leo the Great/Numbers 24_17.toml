[[commentary]]
quote='''
But although it was the office of the Divine condescension to make the Saviour’s Nativity recognizable to the nations, yet for the understanding of the wondrous sign the wise men could have had intimation even from the ancient prophecies of Balaam, knowing that it was predicted of old and by constant repetition spread abroad: “A star shall rise out of Jacob, and a man shall rise out of Israel, and shall rule the nations.” And so the three men aroused by God through the shining of a strange star, follow the guidance of its twinkling light, thinking they will find the babe designated at Jerusalem in the royal city. But finding themselves mistaken in this opinion, through the scribes and teachers of the Jews they learnt what the Holy Scripture had foretold of the birth of Christ; so that confirmed by a twofold witness, they sought with still more eager faith Him whom both the brightness of the star and the sure word of prophecy revealed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 2"
