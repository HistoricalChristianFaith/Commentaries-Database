[[commentary]]
quote='''
(Serm. 60.4.) He did not out of any fear forsake Christ, but through lust of money cast Him off; for in comparison of the love of money all our affections are feeble; the soul athirst for gain fears not to die for a very little; there is no trace of righteousness in that heart in which covetousness has once taken up its abode. The traitor Judas, intoxicated with this bane, in his thirst for lucre was so foolishly hardened, as to sell his Lord and Master.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so, in being willing to suffer their furious rage, the Lord Jesus Christ was in no way the Author of their crimes; nor did He force them to desire this, but permitted them to be able, and used the madness of the blinded people just as He did also the treachery of His betrayer, whom by kindly acts and words He vouchsafed to recall from the awful crime he had conceived, by taking him for a disciple, by promoting him to be an apostle, by warning him with signs, by admitting him to the revelation of holy mysteries, that one who had lacked no degree of kindness to correct him, might have no pretext for his crime at all.

But O ungodliest of men, “thou seed of Chanaan and not of Juda,” and no longer “a vessel of election,” but “a son of perdition” and death, thou didst think the devil’s instigations would profit thee better, so that, inflamed with the torch of greed, thou wert ablaze to gain 30 pieces of silver and sawest not what riches thou wouldst lose. For even if thou didst not think the Lord’s promises were to be believed, what reason was there for preferring so small a sum of money to what thou hadst already received? Thou wast wont to command the evil spirits, to heal the sick, to receive honour with the rest of the apostles, and that thou mightest satisfy thy thirst for gain, it was open to thee to steal from the box that was in thy charge. But thy mind, which lusted after forbidden things, was more strongly stimulated by that which was less allowed: and the amount of the price pleased thee not so much as the enormity of the sin. Wherefore thy wicked bargain is not so detestable merely because thou countedst the Lord so cheap, but because thou didst sell Him Who was the Redeemer, yea, even thine, and hadst no pity on thyself. And justly was thy punishment put into thine own hands because none could be found more cruelly bent on thy destruction than thyself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252067%2520%2528on%2520the%2520Passion%252C%252016%253A%2520Delivered%2520on%2520the%2520Sunday%2529.html'
source_title="Sermon 67, Chapters 3-4"
