[[commentary]]
quote='''
The mystery of this boon is great, dearly beloved, and this gift exceeds all gifts that God should call man son, and man should name God Father: for by these terms we perceive and learn the love which reached so great a height. For if in natural progeny and earthly families those who are born of noble parents are lowered by the faults of evil intercourse, and unworthy offspring are put to shame by the very brilliance of their ancestry; to what end will they come who through love of the world do not fear to be outcast from the family of Christ? But if it gains the praise of men that the father’s glory should shine again in their descendants, how much more glorious is it for those who are born of God to regain the brightness of their Maker’s likeness and display in themselves Him Who begat them, as saith the Lord: “Let your light so shine before men that they may see your good works and glorify your Father which is in heaven?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 4"
