[[commentary]]
quote='''
When Judas, therefore, at the devil’s persuasion, departed from Christ, and cut himself off from the unity of the Apostolic body, the Lord, without being disturbed by any fear, but anxious only for the salvation of those He came to redeem, spent all the time that was free from His persecutors’ attack on mystic conversation and holy teaching, as is declared in St. John’s gospel: raising His eyes to heaven and beseeching the Father for the whole Church that all whom the Father had and would give the Son might become one and remain undivided to the Redeemer’s glory, and adding lastly that prayer in which He says, “Father, if it be possible, let this cup pass from Me.” Wherein it is not to be thought that the Lord Jesus wished to escape the Passion and the Death, the sacraments of which He had already committed to His disciples’ keeping, seeing that He Himself forbids Peter, when he was burning with devoted faith and love, to use the sword, saying, “The cup which the Father hath given Me, shall I not drink it?” and seeing that that is certain which the Lord also says, according to John’s Gospel, “For God so loved the world that He gave His only begotten Son, that everyone who believes in Him may not perish, but have eternal life;” as also what the Apostle Paul says, “Christ loved us and gave Himself for us, a victim to God for a sweet-smelling savour.” For the saving of all through the Cross of Christ was the common will and the common plan of the Father and the Son; nor could that by any means be disturbed which before eternal ages had been mercifully determined and unchangeably fore-ordained. Therefore in assuming true and entire manhood He took the true sensations of the body and the true feelings of the mind. And it does not follow because everything in Him was full of sacraments, full of miracles, that therefore He either shed false tears or took food from pretended hunger or feigned slumber. It was in our humility that He was despised, with our grief that He was saddened, with our pain that He was racked on the cross. For His compassion underwent the sufferings of our mortality with the purpose of healing them, and His power encountered them with the purpose of conquering them. And this Isaiah has most plainly prophesied, saying, “He carries our sins and is pained for us, and we thought Him to be in pain and in stripes and in vexation. But He was wounded for our sins, and was stricken for our offences, and with His bruises we are healed.”

And so, dearly-beloved, when the Son of God says, “Father, if it be possible, let this cup pass from Me,” He uses the outcry of our nature, and pleads the cause of human frailty and trembling: that our patience may be strengthened and our fears driven away in the things which we have to bear. At length, ceasing even to ask this now that He had in a measure palliated our weak fears, though it is not expedient for us to retain them, He passes into another mood, and says, “Nevertheless, not as I will but as Thou;” and again, “If this cup can not pass from Me, except I drink it, Thy will be done.” These words of the Head are the salvation of the whole Body: these words have instructed all the faithful, kindled the zeal of all the confessors, crowned all the martyrs. For who could overcome the world’s hatred, the blasts of temptations, the terrors of persecutors, had not Christ, in the name of all and for all, said, to the Father, “Thy will be done?” Then let the words be learnt by all the Church’s sons who have been purchased at so great a price, so freely justified: and when the shock of some violent temptation has fallen on them, let them use the aid of this potent prayer, that they may conquer their fear and trembling, and learn to suffer patiently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapters 4-5"

[[commentary]]
quote='''
Hence it is that the Lord Jesus Christ, our Head, representing all the members of His body in Himself, and speaking for those whom He was redeeming in the punishment of the cross, uttered that cry which He had once uttered in the psalm, “O God, My God, look upon Me: why hast Thou forsaken Me?” That cry, dearly-beloved, is a lesson, not a complaint. For since in Christ there is one person of God and man, and He could not have been forsaken by Him, from Whom He could not be separated, it is on behalf of us, trembling and weak ones, that He asks why the flesh that is afraid to suffer has not been heard. For when the Passion was beginning, to cure and correct our weak fear He had said, “Father, if it be possible, let this cup pass from Me: nevertheless not as I will but as Thou;” and again, “Father, if this cup cannot pass except I drink it, Thy will be done.” As therefore He had conquered the tremblings of the flesh, and had now accepted the Father’s will, and trampling all dread of death under foot, was then carrying out the work of His design, why at the very time of His triumph over such a victory does He seek the cause and reason of His being forsaken, that is, not heard, save to show that the feeling which He entertained in excuse of His human fears is quite different from the deliberate choice which, in accordance with the Father’s eternal decree, He had made for the reconciliation of the world? And thus the very cry of “Unheard” is the exposition of a mighty Mystery, because the Redeemer’s power would have conferred nothing on mankind if our weakness in Him had obtained what it sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252067%2520%2528on%2520the%2520Passion%252C%252016%253A%2520Delivered%2520on%2520the%2520Sunday%2529.html'
source_title="Sermon 67, Chapter 7"
