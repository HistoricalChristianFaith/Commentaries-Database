[[commentary]]
quote='''
In fact, the case of the Crucified is so different from that of His crucifiers that what Christ undertook could not be reversed, while what they did could be wiped out. For He Who came to save sinners did not refuse mercy even to His murderers, but changed the evil of the wicked into the goodness of the believing, that God’s grace might be the more wonderful, being mercifully put in force, not according to men’s merits, but according to the multitude of the riches of God’s wisdom and knowledge, seeing that they also who had shed the Saviour’s blood were received into the baptismal flood. For, as says the Scripture, which contains the Apostles’ acts when the preaching of the blessed Apostle Peter pierced the hearts of the Jews, and they acknowledged the iniquity of their crime, saying, “what shall we do, brethren?” the same Apostle said, “Repent and be baptized, each one of you, in the name of Jesus Christ for the remission of your sins, and ye shall receive the gift of the Holy Ghost. For to you is the promise, and to your sons, and to all that are afar off, whomsoever our Lord God has called,” and soon after the Scripture goes on to say: “they therefore that received his word were baptized, and there were added on that day about 3,000 souls.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252067%2520%2528on%2520the%2520Passion%252C%252016%253A%2520Delivered%2520on%2520the%2520Sunday%2529.html'
source_title="Sermon 67, Chapter 3"
