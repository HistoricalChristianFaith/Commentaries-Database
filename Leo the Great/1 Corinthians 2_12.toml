[[commentary]]
quote='''
The Saviour then, dearly beloved, is born not of fleshly seed but of the Holy Spirit, in such wise that the condemnation of the first transgression did not touch Him. And hence the very greatness of the boon conferred demands of us reverence worthy of its splendour. For, as the blessed Apostle teaches, “we have received not the spirit of this world but the Spirit which is of God, that we may know the things which are given us by God:” and that Spirit can in no other way be rightly worshipped, except by offering Him that which we received from Him. But in the treasures of the Lord’s bounty what can we find so suitable to the honour of the present feast as the peace, which at the Lord’s nativity was first proclaimed by the angel-choir?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 3"
