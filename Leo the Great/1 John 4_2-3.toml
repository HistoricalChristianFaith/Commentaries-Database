[[commentary]]
quote='''
To confirm your hearts therefore, dearly-beloved, in the Faith and Truth, let to-day’s festival help you all, and let the catholic confession be fortified by the testimony of the manifestation of the Saviour’s infancy, while we anathematize the blasphemy of those who deny the flesh of our nature in Christ: about which the blessed Apostle John has forewarned us in no doubtful utterance, saying, “every spirit which confesses Christ Jesus to have come in the flesh is of God: and every spirit which destroys Jesus is not of God, and this is Antichrist.” Consequently let no Christian have aught in common with men of this kind, let him have no alliance or intercourse with such.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 5"
