[[commentary]]
quote='''
Be not carried away by their deceitful keepings of sham and pretended fasts which tend not to the cleansing, but to the destroying of men’s souls. They put on indeed a cloke of piety and chastity, but under this deceit they conceal the filthiness of their acts, and from the recesses of their ungodly heart hurl shafts to wound the simple; that, as the prophet says, “they may shoot in darkness at the upright in heart.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 6"
