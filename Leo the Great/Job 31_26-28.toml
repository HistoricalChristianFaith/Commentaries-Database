[[commentary]]
quote='''
This objectionable practice must be given up therefore by the faithful, and the honour due to God alone must not be mixed up with those men’s rites who serve their fellow-creatures. For the divine Scripture says: “Thou shalt worship the Lord thy God, and Him only shalt thou serve.” And the blessed Job, “a man without complaint,” as the Lord says, “and one that eschews every evil,” said, “Have I seen the sun when it shone or the moon walking brightly, and my heart hath rejoiced in secret, and I have kissed my hand: what is my great iniquity and denial against the most High God?” But what is the sun or what is the moon but elements of visible creation and material light: one of which is of greater brightness and the other of lesser light? For as it is now day time and now night time, so the Creator has constituted divers kinds of luminaries, although even before they were made there had been days without the sun and nights without the moon. But these were fashioned to serve in making man, that he who is an animal endowed with reason might be sure of the distinction of the months, the recurrence of the year, and the variety of the seasons, since through the unequal length of the various periods, and the clear indications given by the changes in its risings, the sun closes the year and the moon renews the months. For on the fourth day, as we read, God said: “Let there be lights in the firmament of the heaven, and let them shine upon the earth, and let them divide between day and night, and let them be for signs and for seasons, and for days and years, and let them be in the firmament of heaven that they may shine upon earth.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapter 5"
