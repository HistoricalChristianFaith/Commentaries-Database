[[commentary]]
quote='''
A mighty bulwark is a sound faith, a true faith, to which nothing has to be added or taken away: because unless it is one, it is no faith, as the Apostle says, “one Lord, one faith, one baptism, one God and Father of all, who is above all, and through all, and in us all.” Cling to this unity, dearly beloved, with minds unshaken, and in it “follow after” all “holiness,” in it carry out the Lord’s commands, because “without faith it is impossible to please God,” and without it nothing is holy, nothing is pure, nothing alive: “for the just lives by faith,” and he who by the devil’s deception loses it, is dead though living, because as righteousness is gained by faith, so too by a true faith is eternal life gained, as says our Lord and Saviour. And this is life eternal, that they may know Thee, the only true God, and Jesus Christ, whom Thou hast sent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 6"
