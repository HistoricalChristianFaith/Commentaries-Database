[[commentary]]
quote='''
Accordingly, dearly-beloved, Christ being lifted up upon the cross, let the eyes of your mind not dwell only on that sight which those wicked sinners saw, to whom it was said by the mouth of Moses, “And thy life shall be hanging before thine eyes, and thou shalt fear day and night, and shalt not be assured of thy life.” For in the crucified Lord they could think of nothing but their wicked deed, having not the fear, by which true faith is justified, but that by which an evil conscience is racked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 6"
