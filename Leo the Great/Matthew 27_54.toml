[[commentary]]
quote='''
(Serm. 66. 3.) From this example then of the Centurion let the substance of the earth tremble in the punishment of its Redeemer, let the rocks of unbelieving minds be rent, and those who were pent up in these sepulchres of mortality leap forth, bursting the bonds that would detain them; and let them show themselves in the Holy City, i. e. the Church of God, as signs of the Resurrection to come; and thus let that take place in the heart, which we must believe takes place in the body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To this was added a terrible confusion of all the elements, and nature herself withdrew her support from Christ’s crucifiers. And although the centurion in charge of the crucifixion, in fright at what he had seen, said “truly this man was the Son of God,” yet the wicked hearts of the Jews, which were harder than all tombs and rocks, is not reported to have been pierced by any compunction: so that it seems the Roman soldiers were then readier to recognize the Son of God than the priests of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapter 3"
