[[commentary]]
quote='''
For God the almighty and merciful, Whose nature is goodness, Whose will is power, Whose work is mercy: as soon as the devil’s malignity killed us by the poison of his hatred, foretold at the very beginning of the world the remedy His piety had prepared for the restoration of us mortals: proclaiming to the serpent that the seed of the woman should come to crush the lifting of his baneful head by its power, signifying no doubt that Christ would come in the flesh, God and man, Who born of a Virgin should by His uncorrupt birth condemn the despoiler of the human stock.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252022%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25202.html'
source_title="Sermon 22, Chapter 1"
