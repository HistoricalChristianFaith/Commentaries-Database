[[commentary]]
quote='''
But, perhaps there are some rich people, who, although they are not wont to help the Church’s poor by bounteous gifts, yet keep other commands of God, and among their many meritorious acts of faith and uprightness think they will be pardoned for the lack of this one virtue. But this is so important that, though the rest exist without it, they can be of no avail. For although a man be full of faith, and chaste, and sober, and adorned with other still greater decorations, yet if he is not merciful, he cannot deserve mercy: for the Lord says, “blessed are the merciful, for God shall have mercy upon them.” And when the Son of Man comes in His Majesty and is seated on His glorious throne, and all nations being gathered together, division is made between the good and the bad, for what shall they be praised who stand upon the fight except for works of benevolence and deeds of love which Jesus Christ shall reckon as done to Himself? For He who has made man’s nature His own, has separated Himself in nothing from man’s humility. And what objection shall be made to those on the left except for their neglect of love, their inhuman harshness, their refusal of mercy to the poor? as if those on the right had no other virtues those on the left no other faults. But at the great and final day of judgment large-hearted liberality and ungodly meanness will be counted of such importance as to outweigh all other virtues and all other shortcomings, so that for the one men shall gain entrance into the Kingdom, for the other they shall be sent into eternal fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252010%2520On%2520the%2520Collections%252C%25205.html'
source_title="Sermon 10, Chapter 3"

[[commentary]]
quote='''
For forgiveness of sins is most efficaciously prayed for with almsgiving and fasting, and supplications that are winged by such aids mount swiftly to God’s ears: since as it is written, “the merciful man doeth good to his own soul,” and nothing is so much a man’s own as that which he spends on his neighbour. For that part of his material possessions with which he ministers to the needy, is transformed into eternal riches, and such wealth is begotten of this bountifulness as can never be diminished or in any way destroyed, for “blessed are the merciful, for God shall have mercy on them,” and He Himself shall be their chief Reward, who is the Model of His own command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252016%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month.html'
source_title="Sermon 16, Chapter 2"

[[commentary]]
quote='''
Let threats be laid aside; let bonds be loosed, for he who will not loose them will bind himself with them much more disastrously. For whatsoever one man resolves upon against another, he decrees against himself by his own terms. Whereas “blessed are the merciful, for God shall have mercy on them:” and He is just and kind in His judgments, allowing some to be in the power of others to this end, that under fair government may be preserved both the profitableness of discipline and the kindliness of clemency, and that no one should dare to refuse that pardon to another’s shortcomings, which he wishes to receive for his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 5"

[[commentary]]
quote='''
And this assuredly it is possible for all to obtain, God helping and guiding us, if by the purification of fasting and by merciful liberality, we take pains to be set free from the filth of sins, and to be rich in the fruits of love. For whatever is spent in feeding the poor, in healing the sick, in ransoming prisoners, or in any other deeds of piety, is not lessened but increased, nor will that ever be lost in the sight of God which the loving-kindness of the faithful has expended, seeing that whatever a man gives in relief, he lays up for his own reward. For “blessed are the merciful, since God shall have mercy on them;” nor will shortcomings be remembered, where the presence of true religion has been attested.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252078%2520%2528on%2520the%2520Whidsuntide%2520Fast%252C%25201%2529.html'
source_title="Sermon 78, Chapter 4"

[[commentary]]
quote='''
In fine, as in that passage the care for one’s neighbour is joined to the love of God, so, too, here the virtue of mercy is linked to the desire for righteousness, and it is said:

“Blessed are the merciful, for God shall have mercy on them.” Recognize, Christian, the worth of thy wisdom, and understand to what rewards thou art called, and by what methods of discipline thou must attain thereto. Mercy wishes thee to be merciful, righteousness to be righteous, that the Creator may be seen in His creature, and the image of God may be reflected in the mirror of the human heart expressed by the lines of imitation. The faith of those who do good is free from anxiety: thou shalt have all thy desires, and shalt obtain without end what thou lovest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapters 6-7"
