[[commentary]]
quote='''
Avail thyself of the long-suffering of God, and persist not in cherishing thy sin, because its punishment is put off. The sinner must not feel secure of his impunity, because if he loses the time for repentance he will find no place for mercy, as the prophet says, “in death no one remembers thee; and in the realms below who will confess to thee?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252036%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25206.html'
source_title="Sermon 36, Chapter 4"
