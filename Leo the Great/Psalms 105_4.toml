[[commentary]]
quote='''
Let human frailty, then, succumb to God’s glory, and ever acknowledge itself unequal to the unfolding of His works of mercy. Let us toil in thought, fail in insight, falter in utterance: it is good that even our right thoughts about the Lord’s Majesty should be insufficient. For, remembering what the prophet says, “Seek ye the Lord and be strengthened: seek His face always,” no one must assume that he has found all he seeks, lest he fail of coming near, if he cease his endeavours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252062%2520%2528on%2520the%2520Passion%252C%252011%2529.html'
source_title="Sermon 62, Chapter 1"
