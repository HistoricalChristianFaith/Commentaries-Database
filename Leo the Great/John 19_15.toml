[[commentary]]
quote='''
Accordingly, permitting the infliction on Himself of all that the people’s fury inflamed by the priests dared do, He is brought to Annas, father-in-law to Caiaphas, and thence Annas passes Him on to Caiaphas: and after the calumniators’ mad accusations, after the lying falsehoods of suborned witnesses, He is transferred to Pilate’s hearing by the delegation of the two high-priests, who in neglecting the Divine law, and exclaiming that they had “no king but Cæsar,” as if they were devoted to the Roman laws, and had left the whole judgment in the hands of the governor, really sought for an accomplisher of their cruelty rather than an umpire of the case. For they gave up Jesus, bound in hard bonds, bruised by many buffets and blows, spat upon, already condemned by their shouts: so that amidst so many signs of their own verdict Pilate might not dare to acquit One Whom all desired to perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 2"
