[[commentary]]
quote='''
We must not, therefore, indulge in folly amid vain pursuits, nor give way to fear in the midst of adversities. On the one side, no doubt, we are flattered by deceits, and on the other weighed down by troubles; but because “the earth is full of the mercy of the Lord,” Christ’s victory is assuredly ours, that what He says may be fulfilled, “Fear not, for I have overcome the world.” Whether, then, we fight against the ambition of the world, or against the lusts of the flesh, or against the darts of heresy, let us arm ourselves always with the Lord’s Cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 4"
