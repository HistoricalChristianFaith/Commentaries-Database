[[commentary]]
quote='''
When, therefore, “God was in Christ reconciling the world to Himself,” and the Creator Himself was wearing the creature which was to be restored to the image of its Creator; and after the Divinely-miraculous works had been performed, the performance of which the spirit of prophecy had once predicted, “then shall the eyes of the blind be opened and the ears of the deaf shall hear; then shall the lame man leap as a hart, and the tongue of the dumb shall be plain;” Jesus knowing that the time was now come for the fulfilment of His glorious Passion, said, “My soul is sorrowful even unto death;” and again, “Father, if it be possible, let this cup pass from Me.” And these words, expressing a certain fear, show His desire to heal the affection of our weakness by sharing them, and to check our fear of enduring pain by undergoing it. In our Nature, therefore, the Lord trembled with our fear, that He might fully clothe our weakness and our frailty with the completeness of His own strength. For He had come into this world a rich and merciful Merchant from the skies, and by a wondrous exchange had entered into a bargain of salvation with us, receiving ours and giving His, honour for insults, salvation for pain, life for death: and He Whom more than 12,000 of the angel-hosts might have served for the annihilation of His persecutors, preferred to entertain our fears, rather than employ His own power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252054%2520On%2520the%2520Passion%252C%25203%253B%2520Delivered%2520on%2520the%2520Sunday%2520Before%2520Easter.html'
source_title="Sermon 54, Chapter 4"
