[[commentary]]
quote='''
“Abstain from fleshly lusts which war against the soul,” as the blessed Apostle, present in his words as we read, exhorts us, “In malice be ye children,” because the Lord of glory conformed Himself to the infancy of mortals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252031%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25201.html'
source_title="Sermon 31, Chapter 3"
