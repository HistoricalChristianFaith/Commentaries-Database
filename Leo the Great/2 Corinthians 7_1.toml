[[commentary]]
quote='''
As we are therefore, dearly-beloved, about to enter on those mystic days which are dedicated to the benefits of fasting, let us take care to obey the Apostle’s precepts, cleansing “ourselves from every defilement of flesh and spirit:” that by controlling the struggles that go on between our two natures, the spirit which, if it is under the guidance of God, should be the governor of the body, may uphold the dignity of its rule: so that we may give no offence to any, nor be subject to the chidings of reprovers. For we shall be rightly attacked with rebukes, and through our fault ungodly tongues will arm themselves to do harm to religion, if the conduct of those that fast is at variance with the standard of perfect purity. For our fast does not consist chiefly of mere abstinence from food, nor are dainties withdrawn from our bodily appetites with profit, unless the mind is recalled from wrong-doing and the tongue restrained from slandering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252042%2520On%2520Lent%252C%25204.html'
source_title="Sermon 42, Chapter 2"
