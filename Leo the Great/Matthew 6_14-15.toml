[[commentary]]
quote='''
If any one, therefore, has been fired by the desire for vengeance against another, so that he has given him up to prison or bound him with chains, let him make haste to forgive not only the innocent, but also one who seems worthy of punishment, that he may with confidence make use of the clause in the Lord’s prayer and say, “Forgive us our debts, as we also forgive our debtors.” Which petition the Lord marks with peculiar emphasis, as if the efficacy of the whole rested on this condition, by saying, “For if ye forgive men their sins, your Father which is in heaven also will forgive you: but if ye forgive not men, neither will your Father forgive you your sins.”

Accordingly, dearly-beloved, being mindful of our weakness, because we easily fall into all kinds of faults, let us by no means neglect this special remedy and most effectual healing of our wounds. Let us remit, that we may have remission: let us grant the pardon which we crave: let us not be eager to be revenged when we pray to be forgiven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapters 5-6"
