[[commentary]]
quote='''
“While we have time therefore,” as the Apostle says, “let us do that which is good to all men, and especially to them that are of the household of faith.” “But let us not be weary in doing good; for in His own time we shall reap.” And so the present life is the time for sowing, and the day of retribution is the time of harvest, when every one shall reap the fruit of his seed according to the amount of his sowing. And no one shall be disappointed in the produce of that harvesting, because it is the heart’s intentions rather than the sums expended that will be reckoned up. And little sums from little means shall produce as much as great sums from great means.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252010%2520On%2520the%2520Collections%252C%25205.html'
source_title="Sermon 10, Chapter 4"
