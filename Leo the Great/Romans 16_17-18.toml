[[commentary]]
quote='''
And so be not infected with the error of those who are corrupted merely by their own ordinances, “serving the creature rather than the Creator,” and offering a foolish abstinence to the service of the lights of heaven: seeing that they have chosen to fast on the first and second days of the week in honour of the sun and moon, proving themselves in this one instance of their perverseness twice disloyal to God, twice blasphemous, by setting up their fast not only in worship of the stars but also in contempt of the Lord’s Resurrection. For they reject the mystery of man’s salvation and refuse to believe that Christ our Lord in the true flesh of our nature was truly born, truly suffered, was truly buried and was truly raised. And in consequence, condemn the day of our rejoicing by the gloom of their fasting. And since to conceal their infidelity they dare to be present at our meetings, at the Communion of the Mysteries they bring themselves sometimes, in order to ensure their concealment, to receive Christ’s Body with unworthy lips, though they altogether refuse to drink the Blood of our Redemption. And this we make known to you, holy brethren, that men of this sort may be detected by you by these signs, and that they whose impious pretences have been discovered may be driven from the society of the saints by priestly authority. For of such the blessed Apostle Paul in his foresight warns God’s Church, saying: “but we beseech you, brethren, that ye observe those who make discussions and offences contrary to the doctrine which ye learnt and turn away from them. For such persons serve not Christ the Lord but their own belly, and by sweet words and fair speeches beguile the hearts of the innocent.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252042%2520On%2520Lent%252C%25204.html'
source_title="Sermon 42, Chapter 5"
