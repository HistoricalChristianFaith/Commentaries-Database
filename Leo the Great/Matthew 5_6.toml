[[commentary]]
quote='''
Therefore, dearly-beloved, seeing that, as we are taught by our Redeemer’s precept, “man lives not in bread alone, but in every word of God,” and it is right that Christian people, whatever the amount of their abstinence, should rather desire to satisfy themselves with the “Word of God” than with bodily food, let us with ready devotion and eager faith enter upon the celebration of the solemn fast, not with barren abstinence from food, which is often imposed on us by weakliness of body, or the disease of avarice, but in bountiful benevolence: that in truth we may be of those of whom the very Truth speaks, “blessed are they which hunger and thirst after righteousness, for they shall be filled.” Let works of piety, therefore, be our delight, and let us be filled with those kinds of food which feed us for eternity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252040%2520On%2520Lent%252C%25202.html'
source_title="Sermon 40, Chapter 4"

[[commentary]]
quote='''
After this the Lord goes on to say: “blessed are they who hunger and thirst after righteousness, for they shall be satisfied.” It is nothing bodily, nothing earthly, that this hunger, this thirst seeks for: but it desires to be satiated with the good food of righteousness, and wants to be admitted to all the deepest mysteries, and be filled with the Lord Himself. Happy the mind that craves this food and is eager for such drink: which it certainly would not seek for if it had never tasted of its sweetness. But hearing the Prophet’s spirit saying to him: “taste and see that the Lord is sweet;” it has received some portion of sweetness from on high, and blazed out into love of the purest pleasure, so that spurning all things temporal, it is seized with the utmost eagerness for eating and drinking righteousness, and grasps the truth of that first commandment which says: “Thou shalt love the Lord thy God out of all thy heart, and out of all thy mind, and out of all thy strength:” since to love God is nothing else but to love righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapter 6"
