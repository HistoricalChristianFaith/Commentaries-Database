[[commentary]]
quote='''
So, dearly-beloved, let us who instructed in Divine learning come wittingly to the present contest and strife, hear the Apostle when he says, “for our struggle is not against flesh and blood, but against principalities and powers, against the rulers of this dark world, against spiritual wickedness in heavenly things,” and let us not forget that these our enemies feel it is against them all is done that we strive to do for our salvation, and that by the very fact of our seeking after some good thing we are challenging our foes. For this is an old-standing quarrel between us and them fostered by the devil’s ill-will, so that they are tortured by our being justified, because they have fallen from those good things to which we, God helping us, are advancing. If, therefore, we are raised, they are prostrated: if we are strengthened, they are weakened. Our cures are their blows, because they are wounded by our wounds’ cure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapter 4"
