[[commentary]]
quote='''
For there are no works of power, dearly-beloved, without the trials of temptations, there is no faith without proof, no contest without a foe, no victory without conflict. This life of ours is in the midst of snares, in the midst of battles; if we do not wish to be deceived, we must watch: if we want to overcome, we must fight. And therefore the most wise Solomon says, “My son in approaching the service of God prepare thy soul for temptation.” For He being a man full of the wisdom of God, and knowing that the pursuit of religion involves laborious struggles, foreseeing too the danger of the fight, forewarned the intending combatant; lest haply, if the tempter came upon him in his ignorance, he might find him unready and wound him unawares.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapter 3"
