[[commentary]]
quote='''
The earth, then, which is promised to the meek, and is to be given to the gentle in possession, is the flesh of the saints, which in reward for their humility will be changed in a happy resurrection, and clothed with the glory of immortality, in nothing now to act contrary to the spirit, and to be in complete unity and agreement with the will of the soul. For then the outer man will be the peaceful and unblemished possession of the inner man: then the mind, engrossed in beholding God, will be hampered by no obstacles of human weakness nor will it any more have to be said “The body which is corrupted, weigheth upon the soul, and its earthly house presseth down the sense which thinketh many things:” for the earth will not struggle against its tenant, and will not venture on any insubordination against the rule of its governor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapter 5"
