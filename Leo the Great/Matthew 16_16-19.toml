[[commentary]]
quote='''
And from His overruling and eternal protection we have received the support of the Apostles’ aid also, which assuredly does not cease from its operation: and the strength of the foundation, on which the whole superstructure of the Church is reared, is not weakened by the weight of the temple that rests upon it. For the solidity of that faith which was praised in the chief of the Apostles is perpetual: and as that remains which Peter believed in Christ, so that remains which Christ instituted in Peter. For when, as has been read in the Gospel lesson, the Lord had asked the disciples whom they believed Him to be amid the various opinions that were held, and the blessed Peter had replied, saying, “Thou art the Christ, the Son of the living God,” the Lord says, “Blessed art thou, Simon Bar-Jona, because flesh and flood hath not revealed it to thee, but My Father, which is in heaven. And I say to thee, that thou art Peter, and upon this rock will I build My church, and the gates of Hades shall not prevail against it. And I will give unto thee the keys of the kingdom of heaven. And whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed also in heaven.”

The dispensation of Truth therefore abides, and the blessed Peter persevering in the strength of the Rock, which he has received, has not abandoned the helm of the Church, which he undertook. For he was ordained before the rest in such a way that from his being called the Rock, from his being pronounced the Foundation, from his being constituted the Doorkeeper of the kingdom of heaven, from his being set as the Umpire to bind and to loose, whose judgments shall retain their validity in heaven, from all these mystical titles we might know the nature of his association with Christ. And still to-day he more fully and effectually performs what is entrusted to him, and carries out every part of his duty and charge in Him and with Him, through Whom he has been glorified. And so if anything is rightly done and rightly decreed by us, if anything is won from the mercy of God by our daily supplications, it is of his work and merits whose power lives and whose authority prevails in his See. For this, dearly-beloved, was gained by that confession, which, inspired in the Apostle’s heart by God the Father, transcended all the uncertainty of human opinions, and was endued with the firmness of a rock, which no assaults could shake. For throughout the Church Peter daily says, “Thou art the Christ, the Son of the living God,” and every tongue which confesses the Lord, accepts the instruction his voice conveys. This Faith conquers the devil, and breaks the bonds of his prisoners. It uproots us from this earth and plants us in heaven, and the gates of Hades cannot prevail against it. For with such solidity is it endued by God that the depravity of heretics cannot mar it nor the unbelief of the heathen overcome it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%25203%2520On%2520His%2520Birthday%252C%2520Delivered%2520on%2520the%2520Anniversary%2520of%2520His%2520Elevation%2520to%2520the%2520Pontificate.html'
source_title="Sermon 3, Chapters 2-3"

[[commentary]]
quote='''
The Saviour of mankind, Jesus Christ, in founding that faith, which recalls the wicked to righteousness and the dead to life, used to instruct His disciples by admonitory teaching and by miraculous acts to the end that He, the Christ, might be believed to be at once the Only-begotten of God and the Son of Man. For the one without the other was of no avail to salvation, and it was equally dangerous to have believed the Lord Jesus Christ to be either only God without manhood, or only man without Godhead, since both had equally to be confessed, because just as true manhood existed in His Godhead, so true Godhead existed in His Manhood. To strengthen, therefore, their most wholesome knowledge of this belief, the Lord had asked His disciples, among the various opinions of others, what they themselves believed, or thought about Him: whereat the Apostle Peter, by the revelation of the most High Father passing beyond things corporeal and surmounting things human by the eyes of his mind, saw Him to be Son of the living God, and acknowledged the glory of the Godhead, because he looked not at the substance of His flesh and blood alone; and with this lofty faith Christ was so well pleased that he received the fulness of blessing, and was endued with the holy firmness of the inviolable Rock on which the Church should be built and conquer the gates of hell and the laws of death, so that, in loosing or binding the petitions of any whatsoever, only that should be ratified in heaven which had been settled by the judgment of Peter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252051%2520A%2520Homily%2520Delivered%2520on%2520the%2520Saturday%2520Before%2520the%2520Second%2520Sunday%2520in%2520Lent-On%2520the%2520Transfiguration%252C%2520S%2520Matt%252017%25201-13.html'
source_title="Sermon 51, Chapter 1"
