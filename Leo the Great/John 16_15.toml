[[commentary]]
quote='''
Accordingly, dearly-beloved, let us despise the vain and blind cunning of ungodly heretics, which flatters itself over its crooked interpretation of this sentence, and when the Lord says, “All things that the Father hath are Mine,” does not understand that it takes away from the Father whatever it dares to deny to the Son, and is so foolish in matters even which are human as to think, that what is His Father’s has ceased to belong to His Only-begotten, because He has taken on Him what is ours. Mercy in the case of God does not lessen power, nor is the reconciliation of the creature whom He loves a falling off of Eternal glory. What the Father has the Son also has, and what the Father and the Son have, the Holy Ghost also has, because the whole Trinity together is One God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252077%2520%2528on%2520Whitsuntide%252C%25203%2529.html'
source_title="Sermon 77, Chapter 6"
