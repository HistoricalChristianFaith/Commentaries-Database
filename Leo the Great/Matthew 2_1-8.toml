[[commentary]]
quote='''
But although it was the office of the Divine condescension to make the Saviour’s Nativity recognizable to the nations, yet for the understanding of the wondrous sign the wise men could have had intimation even from the ancient prophecies of Balaam, knowing that it was predicted of old and by constant repetition spread abroad: “A star shall rise out of Jacob, and a man shall rise out of Israel, and shall rule the nations.” And so the three men aroused by God through the shining of a strange star, follow the guidance of its twinkling light, thinking they will find the babe designated at Jerusalem in the royal city. But finding themselves mistaken in this opinion, through the scribes and teachers of the Jews they learnt what the Holy Scripture had foretold of the birth of Christ; so that confirmed by a twofold witness, they sought with still more eager faith Him whom both the brightness of the star and the sure word of prophecy revealed. And when the Divine oracle was proclaimed through the chief priests’ answers and the Spirit’s voice declared, which says: “And thou, Bethlehem, the land of Judah, art not least among the princes of Judah; for out of thee shall come a leader to rule My people Israel,” how easy and how natural it was that the leading men among the Hebrews should believe what they taught! But it appears that they held material notions with Herod, and reckoned Christ’s kingdom as on the same level as the powers of this world: so that they hoped for a temporal leader while he dreaded an earthly rival. The fear that racks thee, Herod, is wasted; in vain dost thou try to vent thy rage on the infant thou suspectest. Thy realm cannot hold Christ; the Lord of the world is not satisfied with the narrow limits of thy sway. He, whom thou dost not wish to reign in Judæa, reigns everywhere: and thou wouldst rule more happily thyself, if thou wert to submit to His command. Why dost thou not do with sincerity what in treacherous falseness thou dost promise? Come with the wise men, and in suppliant adoration worship the true King. But thou, from too great fondness for Jewish blindness, wilt not imitate the nations’ faith, and directest thy stubborn heart to cruel wiles, though thou art doomed neither to stay Him whom thou fearest nor to harm them whom thou slayest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 2"
