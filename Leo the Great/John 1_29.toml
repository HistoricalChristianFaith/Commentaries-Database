[[commentary]]
quote='''
Now, too, the variety of fleshly sacrifices has ceased, and the one offering of Thy Body and Blood fulfils all those different victims: for Thou art the true “Lamb of God, that takest away the sins of the world,” and in Thyself so accomplishest all mysteries, that as there is but one sacrifice instead of many victims, so there is but one kingdom instead of many nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 7"
