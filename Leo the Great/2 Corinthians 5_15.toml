[[commentary]]
quote='''
And so, dearly-beloved, let that come to pass of which S. Paul speaks, “that they that live, should henceforth not live to themselves but to Him who died for all and rose again.” And because the old things have passed away and all things are become new, let none remain in his old carnal life, but let us all be renewed by daily progress and growth in piety. For however much a man be justified, yet so long as he remains in this life, he can always be more approved and better. And he that is not advancing is going back, and he that is gaining nothing is losing something.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 8"
