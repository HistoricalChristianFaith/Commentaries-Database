[[commentary]]
quote='''
And hence, Judas, thou art proved more criminal and unhappier than all; for when repentance should have called thee back to the Lord, despair dragged thee to the halter. Thou shouldest have awaited the completion of thy crime, and have put off thy ghastly death by hanging, until Christ’s Blood was shed for all sinners. And among the many miracles and gifts of the Lord’s which might have aroused thy conscience, those holy mysteries, at least, might have rescued thee from thy headlong fall, which at the Paschal supper thou hadst received, being even then detected in thy treachery by the sign of Divine knowledge. Why dost thou distrust the goodness of Him, Who did not repel thee from the communion of His body and blood, Who did not deny thee the kiss of peace when thou camest with crowds and a band of armed men to seize Him. But O man that nothing could convert, O “spirit going and not returning,” thou didst follow thy heart’s rage, and, the devil standing at thy right hand, didst turn the wickedness, which thou hadst prepared against the life of all the saints, to thine own destruction, so that, because thy crime had exceeded all measure of punishment, thy wickedness might make thee thine own judge, thy punishment allow thee to be thine own hangman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252054%2520On%2520the%2520Passion%252C%25203%253B%2520Delivered%2520on%2520the%2520Sunday%2520Before%2520Easter.html'
source_title="Sermon 54, Chapter 3"
