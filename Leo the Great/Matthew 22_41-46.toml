[[commentary]]
quote='''
For her virginity fecundated by the Holy Spirit at one and the same time brought forth without trace of corruption both the offspring and the Maker of her race. Hence also the same Lord, as the Evangelist relates, asked of the Jews whose son they had learnt Christ to be on the authority of the Scriptures, and when they replied that the tradition was He would come of David’s seed, “How,” saith He, “doth David in the Spirit call Him Lord, saying, the Lord said to my Lord: sit thou on My right hand till I place thy enemies as the footstool of thy feet?” And the Jews could not solve the question put, because they did not understand that in the one Christ both the stock of David and the Divine nature were there prophesied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 2"
