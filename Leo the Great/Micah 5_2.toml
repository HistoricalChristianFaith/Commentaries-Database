[[commentary]]
quote='''
And so the three men aroused by God through the shining of a strange star, follow the guidance of its twinkling light, thinking they will find the babe designated at Jerusalem in the royal city. But finding themselves mistaken in this opinion, through the scribes and teachers of the Jews they learnt what the Holy Scripture had foretold of the birth of Christ; so that confirmed by a twofold witness, they sought with still more eager faith Him whom both the brightness of the star and the sure word of prophecy revealed. And when the Divine oracle was proclaimed through the chief priests’ answers and the Spirit’s voice declared, which says: “And thou, Bethlehem, the land of Judah, art not least among the princes of Judah; for out of thee shall come a leader to rule My people Israel,” how easy and how natural it was that the leading men among the Hebrews should believe what they taught! But it appears that they held material notions with Herod, and reckoned Christ’s kingdom as on the same level as the powers of this world: so that they hoped for a temporal leader while he dreaded an earthly rival.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 2"
