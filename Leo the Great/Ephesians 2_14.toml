[[commentary]]
quote='''
The birthday of the Lord is the birthday of peace: for thus says the Apostle, “He is our peace, who made both one;” since whether we be Jew or Gentile, “through Him we have access in one Spirit to the Father.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 5"
