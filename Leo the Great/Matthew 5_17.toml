[[commentary]]
quote='''
The teaching of the Law, dearly beloved, imparts great authority to the precepts of the Gospel, seeing that certain things are transferred from the old ordinances to the new, and by the very devotions of the Church it is shown that the Lord Jesus Christ “came not to destroy but to fulfil the Law.” For since the cessation of the signs by which our Saviour’s coming was announced, and the abolition of the types in the presence of the Very Truth, those things which our religion instituted, whether for the regulation of customs or for the simple worship of God, continue with us in the same form in which they were at the beginning, and what was in harmony with both Testaments has been modified by no change. Among these is also the solemn fast of the tenth month, which is now to be kept by us according to yearly custom, because it is altogether just and godly to give thanks to the Divine bounty for the crops which the earth has produced for the use of men under the guiding hand of supreme Providence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252017%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month%252C%25206.html'
source_title="Sermon 17, Chapter 1"
