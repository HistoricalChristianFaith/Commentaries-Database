[[commentary]]
quote='''
And taking heed lest any of the holy flock should perish, we admonish you with fatherly warnings to keep aloof from the “lying lips” and the “deceitful tongue” from which the prophet asks that his soul should be delivered; because “their words,” as says the blessed Apostle, “do creep as doth a gangrene.” They creep in humbly, they arrest softly, they bind gently, they slay secretly. For they “come,” as the Saviour foretold, “in sheeps’ clothing, but inwardly they are ravening wolves;” because they could not deceive the true and simple sheep, unless they covered their bestial rage with the name of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252016%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month.html'
source_title="Sermon 16, Chapter 3"
