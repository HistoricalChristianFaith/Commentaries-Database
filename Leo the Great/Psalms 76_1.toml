[[commentary]]
quote='''
Let the fulness of the nations enter into the family of the patriarchs, yea let it enter, and let the sons of promise receive in Abraham’s seed the blessing which his sons, according to the flesh, renounce their claim to. In the three Magi let all people worship the Author of the universe: and let God be known not in Judæa alone, but in all the world, so that everywhere “His name” may be “great in Israel.” For while the dignity of the chosen race is proved to be degenerate by unbelief in its descendants, it is made common to all alike by our belief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 3"
