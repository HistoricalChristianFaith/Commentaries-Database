[[commentary]]
quote='''
And so, dearly beloved, we do not bid or advise you to despise God’s works or to think there is anything opposed to your Faith in what the good God has made good, but to use every kind of creature and the whole furniture of this world reasonably and moderately: for as the Apostle says, “the things which are seen are temporal: but the things which are not seen are eternal.” Hence because we are born for the present and reborn for the future, let us not give ourselves up to temporal goods, but to eternal: and in order that we may behold our hope nearer, let us think on what the Divine Grace has bestowed on our nature on the very occasion when we celebrate the mystery of the Lord’s birthday.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapter 6"

[[commentary]]
quote='''
Thus while those who crave things visible are unnumbered, those who prefer the eternal to the temporal are hardly to be found. And, therefore, seeing that the blessed Apostle Paul says, “the things which are seen are temporal, but the things which are not seen are eternal,” the path of virtue lies hid and in concealment, to a certain extent, since “by hope we were saved,” and true faith loves that above all things, which it attains to without any intervention of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 2"
