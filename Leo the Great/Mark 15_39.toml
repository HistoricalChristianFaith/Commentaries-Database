[[commentary]]
quote='''
To this was added a terrible confusion of all the elements, and nature herself withdrew her support from Christ’s crucifiers. And although the centurion in charge of the crucifixion, in fright at what he had seen, said “truly this man was the Son of God,” yet the wicked hearts of the Jews, which were harder than all tombs and rocks, is not reported to have been pierced by any compunction: so that it seems the Roman soldiers were then readier to recognize the Son of God than the priests of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapter 3"
