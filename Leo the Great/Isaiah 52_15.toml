[[commentary]]
quote='''
And therefore, although the narrative which is read to us from the Gospel properly records those days on which the three men, who had neither been taught by the prophets’ predictions nor instructed by the testimony of the law, came to acknowledge God from the furthest parts of the East, yet we behold this same thing more clearly and abundantly carried on now in the enlightenment of all those who are called, since the prophecy of Isaiah is fulfilled when he says, “the Lord has laid bare His holy arm in the sight of all the nations, and all the nations upon earth have seen the salvation which is from the Lord our God;” and again, “and those to whom it has not been announced about Him shall see, and they who have not heard, shall understand.” Hence when we see men devoted to worldly wisdom and far from belief in Jesus Christ brought out of the depth of their error and called to an acknowledgment of the true Light, it is undoubtedly the brightness of the Divine grace that is at work: and whatever of new light illumines the darkness of their hearts, comes from the rays of the same star: so that it should both move with wonder, and going before lead to the adoration of God the minds which it visited with its splendour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252036%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25206.html'
source_title="Sermon 36, Chapter 1"
