[[commentary]]
quote='''
Man’s folly too often dares to murmur against his Creator, not only in time of want, but also in time of plenty, so that, when something is not supplied, he complains, and when certain things are in abundance he is ungrateful. The lord of rich harvests thought scorn of his well-filled garners, and groaned over his abundant grape-gathering: he did not give thanks for the size of the crop, but complained of its poorness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252012%2520On%2520the%2520Fast%2520of%2520The%252C%2520Tenth%2520Month%252C%25201.html'
source_title="Sermon 12, Chapter 3"
