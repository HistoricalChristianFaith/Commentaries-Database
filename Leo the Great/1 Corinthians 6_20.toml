[[commentary]]
quote='''
Consider, dearly beloved and by the illumination of the Holy Spirit thoughtfully bear in mind Who it was that received us into Himself, and that we have received in us: since, as the Lord Jesus became our flesh by being born, so we also became His body by being re-born. Therefore are we both members of Christ, and the temple of the Holy Ghost: and for this reason the blessed Apostle says, “Glorify and carry God in your body:” for while suggesting to us the standard of His own gentleness and humility, He fills us with that power whereby He redeemed us, as the Lord Himself promises: “come unto Me all ye who labour and are heavy-laden, and I will refresh you. Take My yoke upon you and learn of Me, for I am meek and lowly of heart, and ye shall find rest to your souls.” Let us then take the yoke, that is not heavy nor irksome, of the Truth that rules us, and let us imitate His humility, to Whose glory we wish to be conformed: He Himself helping us and leading us to His promises, Who, according to His great mercy, is powerful to blot out our sins, and to perfect His gifts in us, Jesus Christ our Lord, Who lives and reigns for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252023%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25203.html'
source_title="Sermon 23, Chapter 5"
