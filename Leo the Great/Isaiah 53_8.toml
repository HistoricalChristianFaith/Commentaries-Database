[[commentary]]
quote='''
The birth of our Lord and Savior, whether that of his divinity from the Father or that of his flesh from his mother, surpasses the power of human eloquence. As a result, the saying ("Who will recount his generation?") may rightly be referred to either.
'''
source_url=''
source_title="SERMON 30:1"

[[commentary]]
quote='''
The things which are connected with the mystery of to-day’s solemn feast are well known to you, dearly-beloved, and have frequently been heard: but as yonder visible light affords pleasure to eyes that are unimpaired, so to sound hearts does the Saviour’s nativity give eternal joy; and we must not keep silent about it, though we cannot treat of it as we ought. For we believe that what Isaiah says, “who shall declare his generation?” applies not only to that mystery, whereby the Son of God is co-eternal with the Father, but also to this birth whereby “the Word became flesh.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252023%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25203.html'
source_title="Sermon 23, Chapter 1"
