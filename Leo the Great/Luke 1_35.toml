[[commentary]]
quote='''
And by a new nativity He was begotten, conceived by a Virgin, born of a Virgin, without paternal desire, without injury to the mother’s chastity: because such a birth as knew no taint of human flesh, became One who was to be the Saviour of men, while it possessed in itself the nature of human substance. For when God was born in the flesh, God Himself was the Father, as the archangel witnessed to the Blessed Virgin Mary: “because the Holy Spirit shall come upon thee, and the power of the most High shall overshadow thee: and therefore, that which shall be born of thee shall be called holy, the Son of God.” The origin is different but the nature like: not by intercourse with man but by the power of God was it brought about: for a Virgin conceived, a Virgin bare, and a Virgin she remained. Consider here not the condition of her that bare but the will of Him that was born; for He was born Man as He willed and was able. If you inquire into the truth of His nature, you must acknowledge the matter to be human: if you search for the mode of His birth, you must confess the power to be of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252022%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25202.html'
source_title="Sermon 22, Chapter 2"
