[[commentary]]
quote='''
This change, dearly-beloved, is the handiwork of the Most High, Who “worketh all things in all,” so that by the good manner of life observed in each one of the faithful, we know Him to be the Author of all just works, and give thanks to God’s mercy, Who so adorns the whole body of the Church with countless gracious gifts, that through the many rays of the one Light the same brightness is everywhere diffused, and that which is well done by any Christian whatsoever cannot but be part of the glory of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 7"
