[[commentary]]
quote='''
And so they enter the chief city of the Kingdom of Judæa, and in the royal city ask that He should be shown them Whom they had learnt was begotten to be King. Herod is perturbed: he fears for his safety, he trembles for his power, he asks of the priests and teachers of the Law what the Scripture has predicted about the birth of Christ, he ascertains what had been prophesied: truth enlightens the wise men, unbelief blinds the experts: carnal Israel understands not what it reads, sees not what it points out; refers to the pages, whose utterances it does not believe. Where is thy boasting, O Jew? where thy noble birth drawn from the stem of Abraham? is not thy circumcision become uncircumcision? Behold thou, the greater servest the less, and by the reading of that covenant which thou keepest in the letter only, thou becomest the slave of strangers born, who enter into the lot of thy heritage. Let the fulness of the nations enter into the family of the patriarchs, yea let it enter, and let the sons of promise receive in Abraham’s seed the blessing which his sons, according to the flesh, renounce their claim to. In the three Magi let all people worship the Author of the universe: and let God be known not in Judæa alone, but in all the world, so that everywhere “His name” may be “great in Israel.” For while the dignity of the chosen race is proved to be degenerate by unbelief in its descendants, it is made common to all alike by our belief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 3"
