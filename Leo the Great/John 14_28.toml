[[commentary]]
quote='''
This union, dearly beloved, whereby the Creator is joined to the creature, Arian blindness could not see with the eyes of intelligence, but, not believing that the Only-begotten of God was of the same glory and substance with the Father, spoke of the Son’s Godhead as inferior, drawing its arguments from those words which are to be referred to the “form of a slave,” in respect of which, in order to show that it belongs to no other or different person in Himself, the same Son of God with the same form, says, “The Father is greater than I,” just as He says with the same form, “I and my Father are one.” For in “the form of a slave,” which He took at the end of the ages for our restoration, He is inferior to the Father: but in the form of God, in which He was before the ages, He is equal to the Father. In His human humiliation He was “made of a woman, made under the Law:” in His Divine majesty He abides the Word of God, “through whom all things were made.” Accordingly, He Who in the form of God made man, in the form of a slave was made man. For both natures retain their own proper character without loss: and as the form of God did not do away with the form of a slave, so the form of a slave did not impair the form of God. And so the mystery of power united to weakness, in respect of the same human nature, allows the Son to be called inferior to the Father: but the Godhead, which is One in the Trinity of the Father, Son, and Holy Ghost, excludes all notion of inequality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252023%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25203.html'
source_title="Sermon 23, Chapter 2"

[[commentary]]
quote='''
Therefore in both natures it is the same Son of God taking what is ours and not losing what is His own; renewing man in His manhood, but enduring unchangeable in Himself. For the Godhead which is His in common with the Father underwent no loss of omnipotence, nor did the “form of a slave” do despite to the “form of God,” because the supreme and eternal Essence, which lowered Itself for the salvation of mankind, transferred us into Its glory, but did not cease to be what It was. And hence when the Only-begotten of God confesses Himself less than the Father, and yet calls Himself equal with Him, He demonstrates the reality of both forms in Himself: so that the inequality proves the human nature, and the equality the Divine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapter 1"

[[commentary]]
quote='''
The Lord Jesus does, indeed, say to His disciples, as was read in the Gospel lection, “if ye loved Me, ye would assuredly rejoice, because I go to the Father, because the Father is greater than I;” but those ears, which have often heard the words, “I and the Father are One,” and “He that sees Me, sees the Father also,” accept the saying without supposing a difference of Godhead or understanding it of that Essence which they know to be co-eternal and of the same nature with the Father. Man’s uplifting, therefore, in the Incarnation of the Word, is commended to the holy Apostles also, and they, who were distressed at the announcement of the Lord’s departure from them, are incited to eternal joy over the increase in their dignity; “If ye loved Me,” He says, “ye would assuredly rejoice, because I go to the Father:” that is, if, with complete knowledge ye saw what glory is bestowed on you by the fact that, being begotten of God the Father, I have been born of a human mother also, that being invisible I have made Myself visible, that being eternal “in the form of God” I accepted the “form of a slave,” “ye would rejoice because I go to the Father.” For to you is offered this ascension, and your humility is in Me raised to a place above all heavens at the Father’s right hand. But I, Who am with the Father that which the Father is, abide undivided with My Father, and in coming from Him to you I do not leave Him, even as in returning to Him from you I do not forsake you. Rejoice, therefore, “because I go to the Father, because the Father is greater than I.” For I have united you with Myself, and am become Son of Man that you might have power to be sons of God. And hence, though I am One in both forms, yet in that whereby I am conformed to you I am less than the Father, whereas in that whereby I am not divided from the Father I am greater even than Myself. And so let the Nature, which is less than the Father, go to the Father, that the Flesh may be where the Word always is, and that the one Faith of the catholic Church may believe that He Whom as Man it does not deny to be less, is equal as God with the Father.

Accordingly, dearly-beloved, let us despise the vain and blind cunning of ungodly heretics, which flatters itself over its crooked interpretation of this sentence, and when the Lord says, “All things that the Father hath are Mine,” does not understand that it takes away from the Father whatever it dares to deny to the Son, and is so foolish in matters even which are human as to think, that what is His Father’s has ceased to belong to His Only-begotten, because He has taken on Him what is ours. Mercy in the case of God does not lessen power, nor is the reconciliation of the creature whom He loves a falling off of Eternal glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252077%2520%2528on%2520Whitsuntide%252C%25203%2529.html'
source_title="Sermon 77, Chapters 5-6"
