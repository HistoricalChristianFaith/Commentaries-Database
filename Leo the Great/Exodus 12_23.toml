[[commentary]]
quote='''
And because no virtues are worthier or more excellent than merciful loving-kindness and unblemished chastity, let us more especially equip ourselves with these weapons, so that, raised from the earth, as it were on the two wings of active charity and shining purity, we may win a place in heaven. And whosoever, aided by God’s grace, is filled with this desire and glories not in himself, but in the Lord, over his progress, pays due honour to the Easter mystery. His threshold the angel of destruction does not cross, for it is marked with the Lamb’s blood and the sign of the cross. He fears not the plagues of Egypt, and leaves his foes overwhelmed by the same waters by which he himself was saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252055%2520On%2520the%2520Lord%2527s%2520Passion%25204%252C%2520Delivered%2520on%2520Wednesday%2520in%2520Holy%2520Week.html'
source_title="Sermon 55, Chapter 5"
