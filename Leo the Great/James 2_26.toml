[[commentary]]
quote='''
Let no one therefore, dearly beloved, flatter himself on any merits of a good life, if works of charity be wanting in him, and let him not trust in the purity of his body, if he be not cleansed by the purification of almsgiving. For “almsgiving wipes out sin,” kills death, and extinguishes the punishment of perpetual fire. But he who has not been fruitful therein, shall have no indulgence from the great Recompenser, as Solomon says, “He that closeth his ears lest he should hear the weak, shall himself call upon the Lord, and there shall be none to hear him.” And hence Tobias also, while instructing his son in the precepts of godliness, says, “Give alms of thy substance, and turn not thy face from any poor man: so shall it come to pass that the face of God shall not be turned from thee.” This virtue makes all virtues profitable; for by its presence it gives life to that very faith, by which “the just lives,” and which is said to be “dead without works:” because as the reason for works consists in faith, so the strength of faith consists in works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252010%2520On%2520the%2520Collections%252C%25205.html'
source_title="Sermon 10, Chapter 4"
