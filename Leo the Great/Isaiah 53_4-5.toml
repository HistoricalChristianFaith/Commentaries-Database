[[commentary]]
quote='''
Therefore in assuming true and entire manhood He took the true sensations of the body and the true feelings of the mind. And it does not follow because everything in Him was full of sacraments, full of miracles, that therefore He either shed false tears or took food from pretended hunger or feigned slumber. It was in our humility that He was despised, with our grief that He was saddened, with our pain that He was racked on the cross. For His compassion underwent the sufferings of our mortality with the purpose of healing them, and His power encountered them with the purpose of conquering them. And this Isaiah has most plainly prophesied, saying, “He carries our sins and is pained for us, and we thought Him to be in pain and in stripes and in vexation. But He was wounded for our sins, and was stricken for our offences, and with His bruises we are healed.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 4"
