[[commentary]]
quote='''
Let no one fall back into that from which he has risen, but, even though from bodily weakness he still languishes under certain maladies, let him urgently desire to be healed and raised up. For this is the path of health through imitation of the Resurrection begun in Christ, whereby, notwithstanding the many accidents and falls to which in this slippery life the traveller is liable, his feet may be guided from the quagmire on to solid ground, for, as it is written, “the steps of a man are directed by the Lord, and He will delight in his way. When the just man falls he shall not be overthrown, because the Lord will stretch out His hand.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252071%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25201%253B%2520Delivered%2520on%2520Holy%2520Saturday%2520in%2520the%2520Vigil%2520of%2520Easter%2529.html'
source_title="Sermon 71, Chapter 6"
