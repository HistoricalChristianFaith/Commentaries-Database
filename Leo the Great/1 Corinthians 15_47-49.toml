[[commentary]]
quote='''
Accordingly, since the Apostle says, “the first man is of the earth earthy, the second man is from heaven heavenly. As is the earthy, such also are they that are earthy; and as is the heavenly, such also are they that are heavenly. As we have borne the image of the earthy, so let us also bear the image of Him Who is from heaven,” we must greatly rejoice over this change, whereby we are translated from earthly degradation to heavenly dignity through His unspeakable mercy, Who descended into our estate that He might promote us to His, by assuming not only the substance but also the conditions of sinful nature, and by allowing the impassibility of Godhead to be affected by all the miseries which are the lot of mortal manhood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252071%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25201%253B%2520Delivered%2520on%2520Holy%2520Saturday%2520in%2520the%2520Vigil%2520of%2520Easter%2529.html'
source_title="Sermon 71, Chapter 2"
