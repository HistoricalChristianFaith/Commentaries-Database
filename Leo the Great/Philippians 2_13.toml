[[commentary]]
quote='''
Let us remember that we owe love first to God, secondly to our neighbour, and that all our affections must be so regulated as not to draw us away from the worship of God, or the benefiting our fellow slave. But how shall we worship God unless that which is pleasing to Him is also pleasing to us? For, if our will is His will, our weakness will receive strength from Him, from Whom the very will came; “for it is God,” as the Apostle says, “who worketh in us both to will and to do for (His) good pleasure.” And so a man will not be puffed up with pride, nor crushed with despair, if he uses the gifts which God gave to His glory, and withholds his inclinations from those things, which he knows will harm him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252019%2520On%2520the%2520Fast%2520of%2520the%2520Ten%2520Month%252C%25208.html'
source_title="Sermon 19, Chapter 3"
