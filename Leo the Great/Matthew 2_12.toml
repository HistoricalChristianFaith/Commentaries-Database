[[commentary]]
quote='''
Now when the wise men had worshipped the Lord and finished all their devotions, according to the warning of a dream, they return not by the same route by which they had come. For it behoved them now that they believed in Christ not to walk in the paths of their old line of life, but having entered on a new way to keep away from the errors they had left: and it was also to baffle Herod’s design, who, under the cloke of homage, was planning a wicked plot against the Infant Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 4"
