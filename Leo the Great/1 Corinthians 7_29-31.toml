[[commentary]]
quote='''
For the Divine teaching commands by the Apostle’s mouth that “they who have wives” should “be as though they had none: and those that weep as though they wept not; and those that rejoice as though they rejoiced not; and those that buy as though they possessed not; and those that use this world as though they used it not; for the fashion of this world passeth away.” Blessed, therefore, is the mind that passes the time of its pilgrimage in chaste sobriety, and loiters not in the things through which it has to walk, so that, as a stranger rather than the possessor of its earthly abode, it may not be wanting in human affections, and yet rest on the Divine promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 2"

[[commentary]]
quote='''
For there are two loves from which proceed all wishes, as different in quality as they are different in their sources. For the reasonable soul, which cannot exist without love, is the lover either of God or the world. In the love of God there is no excess, but in the love of the world all is hurtful. And therefore we must cling inseparably to eternal treasures, but things temporal we must use like passers-by, that as we are sojourners hastening to return to our own land, all the good things of this world which meet us may be as aids on the way, not snares to detain us. Therefore the blessed Apostle makes this proclamation, “the time is short: it remains that those who have wives be as though they had none; and those who weep, as though they wept not; and those who rejoice, as though they rejoiced not; and those who buy, as though they possessed not; and those that use this world, as though they used it not. For the fashion of this world passes away.” But as the world attracts us with its appearance, and abundance and variety, it is not easy to turn away from it unless in the beauty of things visible the Creator rather than the creature is loved; for, when He says, “thou shalt love the Lord thy God from all thy heart, and from all thy mind, and from all thy strength,” He wishes us in noticing to loosen ourselves from the bonds of His love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252090%2520%2528on%2520the%2520Fast%2520of%2520Seventh%2520Month%252C%25205%2529.html'
source_title="Sermon 90, Chapter 3"
