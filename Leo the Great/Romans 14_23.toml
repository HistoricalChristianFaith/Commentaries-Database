[[commentary]]
quote='''
But because the right practice of abstinence is needful not only to the mortification of the flesh but also to the purification of the mind, we desire your observance to be so complete that, as you cut down the pleasures that belong to the lusts of the flesh, so you should banish the errors that proceed from the imaginations of the heart. For he whose heart is polluted with no misbelief prepares himself with true and reasonable purification for the Paschal Feast, in which all the mysteries of our religion meet together. For, as the Apostle says, that “all that is not of faith is sin,” the fasting of those will be unprofitable and vain, whom the father of lying deceives with his delusions, and who are not fed by Christ’s true flesh. As then we must with the whole heart obey the Divine commands and sound doctrine, so we must use all foresight in abstaining from wicked imaginations. For the mind then only keeps holy and spiritual fast when it rejects the food of error and the poison of falsehood, which our crafty and wily foe plies us with more treacherously now, when by the very return of the venerable Festival, the whole church generally is admonished to understand the mysteries of its salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252046%2520On%2520Lent%252C%25208.html'
source_title="Sermon 46, Chapter 1"
