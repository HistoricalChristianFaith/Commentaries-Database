[[commentary]]
quote='''
And so while He was yet speaking, behold a bright cloud overshadowed them, and behold a voice out of the cloud, saying, “This is My beloved Son, in whom I am well pleased; hear ye Him.” The Father was indeed present in the Son, and in the Lord’s brightness, which He had tempered to the disciples’ sight, the Father’s Essence was not separated from the Only-begotten: but, in order to emphasize the two-fold personality, as the effulgence of the Son’s body displayed the Son to their sight, so the Father’s voice from out the cloud announced the Father to their hearing. And when this voice was heard, “the disciples fell upon their faces, and were sore afraid,” trembling at the majesty, not only of the Father, but also of the Son: for they now had a deeper insight into the undivided Deity of Both: and in their fear they did not separate the One from the Other, because they doubted not in their faith. That was a wide and manifold testimony, therefore, and contained a fuller meaning than struck the ear. For when the Father said, “This is My beloved Son, in Whom, &c.,” was it not clearly meant, “This is My Son,” Whose it is to be eternally from Me and with Me? because the Begetter is not anterior to the Begotten, nor the Begotten posterior to the Begetter. “This is My Son,” Who is separated from Me, neither by Godhead, nor by power, nor by eternity. “This is My Son,” not adopted, but true-born, not created from another source, but begotten of Me: nor yet made like Me from another nature, but born equal to Me of My nature. “This is My Son,” “through Whom all things were made, and without Whom was nothing made” because all things that I do He doth in like manner: and whatever I perform, He performs with Me inseparably and without difference: for the Son is in the Father and the Father in the Son, and Our Unity is never divided: and though I am One Who begat, and He the Other Whom I begat, yet is it wrong for you to think anything of Him which is not possible of Me. “This is My Son,” Who sought not by grasping, and seized not in greediness, that equality with Me which He has, but remaining in the form of My glory, that He might carry out Our common plan for the restoration of mankind, He lowered the unchangeable Godhead even to the form of a slave.

“Hear ye Him,” therefore, unhesitatingly, in Whom I am throughout well pleased, and by Whose preaching I am manifested, by Whose humiliation I am glorified; because He is “the Truth and the Life,” He is My “Power and Wisdom.” “Hear ye Him,” Whom the mysteries of the Law have foretold, Whom the mouths of prophets have sung. “Hear ye Him,” Who redeems the world by His blood, Who binds the devil, and carries off his chattels, Who destroys the bond of sin, and the compact of the transgression. Hear ye Him, Who opens the way to heaven, and by the punishment of the cross prepares for you the steps of ascent to the Kingdom? Why tremble ye at being redeemed? why fear ye to be healed of your wounds? Let that happen which Christ wills and I will. Cast away all fleshly fear, and arm yourselves with faithful constancy; for it is unworthy that ye should fear in the Saviour’s Passion what by His good gift ye shall not have to fear even at your own end.

These things, dearly-beloved, were said not for their profit only, who heard them with their own ears, but in these three Apostles the whole Church has learnt all that their eyes saw and their ears heard. Let all men’s faith then be established, according to the preaching of the most holy Gospel, and let no one be ashamed of Christ’s cross, through which the world was redeemed. And let not any one fear to suffer for righteousness’ sake, or doubt of the fulfilment of the promises, for this reason, that through toil we pass to rest and through death to life; since all the weakness of our humility was assumed by Him, in Whom, if we abide in the acknowledgment and love of Him, we conquer as He conquered, and receive what he promised, because, whether to the performance of His commands or to the endurance of adversities, the Father’s fore-announcing voice should always be sounding in our ears, saying, “This is My beloved Son, in Whom I am well pleased; hear ye Him:” Who liveth and reigneth, with the Father and the Holy Ghost, for ever and ever. Amen.
'''
