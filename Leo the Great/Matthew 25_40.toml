[[commentary]]
quote='''
But when the Prophet says, “Blessed is he, who considereth the poor and needy,” he is the praiseworthy distributor of clothes and food among the poor, who knows he is clothing and feeding Christ in the poor: for He Himself says, “as long as ye have done it to one of My brethren, ye have done it to Me.” And so Christ is One, True God and True Man, rich in what is His own, poor in what is ours, receiving gifts and distributing gifts, Partner with mortals, and the Quickener of the dead, so that in the “name of Jesus every knee should bow, of things in heaven, of things on earth, and of things under the earth, and that every tongue should confess that the Lord Jesus Christ is in the glory of God the Father,” living and reigning with the Holy Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252091%2520on%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25206.html'
source_title="Sermon 91, Chapter 3"
