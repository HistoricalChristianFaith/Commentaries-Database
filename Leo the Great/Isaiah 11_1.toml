[[commentary]]
quote='''
Now no longer then are we led to believe by signs and types, but being confirmed by the gospel story we worship that which we believe to have been done; the prophetic lore assisting our knowledge, so that we have no manner of doubt about that which we know to have been predicted by such sure oracles. For hence it is that the Lord says to Abraham: “In thy seed shall all nations be blessed:” hence David, in the spirit of prophecy, sings, saying: “The Lord swore truth to David, and He shall not frustrate it: of the fruit of thy loins will I set upon thy seat;” hence the Lord again says through Isaiah: “behold a virgin shall conceive in her womb, and shall bear a Son, and His Name shall be called Emmanuel, which is interpreted, God with us,” and again, “a rod shall come forth from the root of Jesse, and a flower shall arise from his root.” In which rod, no doubt the blessed Virgin Mary is predicted, who sprung from the stock of Jesse and David and fecundated by the Holy Ghost, brought forth a new flower of human flesh, becoming a virgin-mother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 1"
