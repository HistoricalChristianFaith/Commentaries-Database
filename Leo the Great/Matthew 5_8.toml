[[commentary]]
quote='''
And since through thine alms-giving all things are pure to thee, to that blessedness also thou shalt attain which is promised in consequence where the Lord says:

“Blessed are the pure in heart, for they shall see God.” Great is the happiness, beloved, of him for whom so great a reward is prepared. What, then, is it to have the heart pure, but to strive after those virtues which are mentioned above? And how great the blessedness of seeing God, what mind can conceive, what tongue declare? And yet this shall ensue when man’s nature is transformed, so that no longer “in a mirror,” nor “in a riddle,” but “face to face” it sees the very Godhead “as He is,” which no man could see; and through the unspeakable joy of eternal contemplation obtains that “which eye has not seen, nor ear heard, neither has entered into the heart of man.” Rightly is this blessedness promised to purity of heart. For the brightness of the true light will not be able to be seen by the unclean sight: and that which will be happiness to minds that are bright and clean, will be a punishment to those that are stained. Therefore, let the mists of earth’s vanities be shunned, and your inward eyes purged from all the filth of wickedness, that the sight may be free to feed on this great manifestation of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapters 7-8"
