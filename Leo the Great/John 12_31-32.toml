[[commentary]]
quote='''
But let our understandings, illumined by the Spirit of Truth, foster with pure and free heart the glory of the cross which irradiates heaven and earth, and see with the inner sight what the Lord meant when He spoke of His coming Passion: “The hour is come that the Son of man may be glorified:” and below He says, “Now is My spirit troubled. And what shall I say? Father, save Me from this hour, but for this cause came I unto this hour. Father, glorify Thy Son.” And when the Father’s voice came from heaven, saying, “I have both glorified it and will glorify it again,” Jesus in reply said to those that stood by, “This voice came not for Me but for you. Now is the world’s judgment, now shall the prince of this world be cast out. And I, if I be lifted up from the earth, will draw all things unto Me.”

O wondrous power of the Cross! O ineffable glory of the Passion, in which is contained the Lord’s tribunal, the world’s judgment, and the power of the Crucified! For thou didst draw all things unto Thee, Lord and when Thou hadst stretched out Thy hands all the day, long to an unbelieving people that gainsaid Thee, the whole world at last was brought to confess Thy majesty. Thou didst draw all things unto Thee, Lord, when all the elements combined to pronounce judgment in execration of the Jews’ crime, when the lights of heaven were darkened, and the day turned into night, and the earth also was shaken with unwonted shocks, and all creation refused to serve those wicked men. Thou didst draw all things unto Thee, Lord, for the veil of the temple was rent, and the Holy of Holies existed no more for those unworthy high-priests: so that type was turned into Truth, prophecy into Revelation, law into Gospel. Thou didst draw all things unto Thee, Lord, so that what before was done in the one temple of the Jews in dark signs, was now to be celebrated everywhere by the piety of all the nations in full and open rite. For now there is a nobler rank of Levites, there are elders of greater dignity and priests of holier anointing: because Thy cross is the fount of all blessings, the source of all graces, and through it the believers receive strength for weakness, glory for shame, life for death. Now, too, the variety of fleshly sacrifices has ceased, and the one offering of Thy Body and Blood fulfils all those different victims: for Thou art the true “Lamb of God, that takest away the sins of the world,” and in Thyself so accomplishest all mysteries, that as there is but one sacrifice instead of many victims, so there is but one kingdom instead of many nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapters 6-7"
