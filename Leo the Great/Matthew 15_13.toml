[[commentary]]
quote='''
Let every Christian scrutinise himself, and search severely into his inmost heart: let him see that no discord cling there, no wrong desire be harboured. Let chasteness drive incontinence far away; let the light of truth dispel the shades of deception; let the swellings of pride subside; let wrath yield to reason; let the darts of ill-treatment be shattered, and the chidings of the tongue be bridled; let thoughts of revenge fall through, and injuries be given over to oblivion. In fine, let “every plant which the heavenly Father hath not planted be removed by the roots.” For then only are the seeds of virtue well nourished in us, when every foreign germ is uprooted from the field of wheat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapter 5"
