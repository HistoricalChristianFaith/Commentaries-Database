[[commentary]]
quote='''
Minds that have heard the call to be uplifted must not be pressed down by earthly affections, they that are fore-ordained to things eternal must not be taken up with the things that perish; they that have entered on the way of Truth must not be entangled in treacherous snares, and the faithful must so take their course through these temporal things as to remember that they are sojourning in the vale of this world, in which, even though they meet with some attractions, they must not sinfully embrace them, but bravely pass through them. For to this devotion the blessed Apostle Peter arouses us, and entreating us with that loving eagerness which he conceived for feeding Christ’s sheep by the threefold profession of love for the Lord, says, “dearly-beloved, I beseech you, as strangers and pilgrims, abstain from fleshly lusts which war against the soul.” But for whom do fleshly pleasures wage war, if not for the devil, whose delight it is to fetter souls that strive after things above, with the enticements of corruptible good things, and to draw them away from those abodes from which he himself has been banished? Against his plots every believer must keep careful watch that he may crush his foe on the side whence the attack is made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252074%2520%2528on%2520the%2520Lord%2527s%2520Ascension%252C%25202%2529.html'
source_title="Sermon 74, Chapter 5"
