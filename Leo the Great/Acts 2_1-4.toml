[[commentary]]
quote='''
The hearts of all catholics, beloved, realize that to-day’s solemnity is to be honoured as one of the chief feasts, nor is there any doubt that great respect is due to this day, which the Holy Spirit has hallowed by the miracle of His most excellent gift. For from the day on which the Lord ascended up above all heavenly heights to sit down at God the Father’s right hand, this is the tenth which has shone, and the fiftieth from His Resurrection, being the very day on which it began, and containing in itself great revelations of mysteries both new and old, by which it is most manifestly revealed that Grace was fore-announced through the Law and the Law fulfilled through Grace. For as of old, when the Hebrew nation were released from the Egyptians, on the fiftieth day after the sacrificing of the lamb the Law was given on Mount Sinai, so after the suffering of Christ, wherein the true Lamb of God was slain, on the fiftieth day from His Resurrection, the Holy Ghost came down upon the Apostles and the multitude of believers, so that the earnest Christian may easily perceive that the beginnings of the Old Testament were preparatory to the beginnings of the Gospel, and that the second covenant was founded by the same Spirit that had instituted the first.

For as the Apostles’ story testifies: “while the days of Pentecost were fulfilled and all the disciples were together in the same place, there occurred suddenly from heaven a sound as of a violent wind coming, and filled the whole house where they were sitting. And there appeared to them divided tongues as of fire and it sat upon each of them. And they were all filled with the Holy Spirit, and began to speak with other tongues, as the Holy Spirit gave them utterance.” Oh! how swift are the words of wisdom, and where God is the Master, how quickly is what is taught, learnt. No interpretation is required for understanding, no practice for using, no time for studying, but the Spirit of Truth blowing where He wills, the languages peculiar to each nation become common property in the mouth of the Church. And therefore from that day the trumpet of the Gospel-preaching has sounded loud: from that day the showers of gracious gifts, the rivers of blessings, have watered every desert and all the dry land, since to renew the face of the earth the Spirit of God “moved over the waters,” and to drive away the old darkness flashes of new light shone forth, when by the blaze of those busy tongues was kindled the Lord’s bright Word and fervent eloquence, in which to arouse the understanding, and to consume sin there lay both a capacity of enlightenment and a power of burning.

But although, dearly-beloved, the actual form of the thing done was exceeding wonderful, and undoubtedly in that exultant chorus of all human languages the Majesty of the Holy Spirit was present, yet no one must think that His Divine substance appeared in what was seen with bodily eyes. For His Nature, which is invisible and shared in common with the Father and the Son, showed the character of His gift and work by the outward sign that pleased Him, but kept His essential property within His own Godhead: because human sight can no more perceive the Holy Ghost than it can the Father or the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252075%2520%2528on%2520Whitsuntide%252C%25201%2529.html'
source_title="Sermon 75, Chapters 1-3"

[[commentary]]
quote='''
To-day’s festival, dearly-beloved, which is held in reverence by the whole world, has been hallowed by that advent of the Holy Ghost, which on the fiftieth day after the Lord’s Resurrection, descended on the Apostles and the multitude of believers, even as it was hoped. And there was this hope, because the Lord Jesus had promised that He should come, not then first to be the Indweller of the saints, but to kindle to a greater heat, and to fill with larger abundance the hearts that were dedicated to Him, increasing, not commencing His gifts, not fresh in operation because richer in bounty. For the Majesty of the Holy Ghost is never separate from the Omnipotence of the Father and the Son, and whatever the Divine government accomplishes in the ordering of all things, proceeds from the Providence of the whole Trinity. Therein exists unity of mercy and loving-kindness, unity of judgment and justice: nor is there any division in action where there is no divergence of will. What, therefore, the Father enlightens, the Son enlightens, and the Holy Ghost enlightens: and while there is one Person of the Sent, another of the Sender, and another of the Promiser, both the Unity and the Trinity are at the same time revealed to us, so that the Essence which possesses equality and does not admit of solitariness is understood to belong to the same Substance but not the same Person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252077%2520%2528on%2520Whitsuntide%252C%25203%2529.html'
source_title="Sermon 77, Chapter 1"
