[[commentary]]
quote='''
Since then all things which Jewish ungodliness committed against the Lord of Majesty were foretold so long before, and the language of the prophets is concerned not so much with things to come as with things past, what else is thereby revealed to us but the unchangeable order of God’s eternal decrees, with Whom the things which are to be decided are already determined, and what will be is already accomplished? For since both the character of our actions and the fulfilment of all our wishes are fore-known to God, how much better known to Him are His own works? And He was rightly pleased that things should be recorded as if done which nothing could hinder from being done. And hence when the Apostles also, being full of the Holy Ghost, suffered the threats and cruelty of Christ’s enemies, they said to God with one consent, “For truly in this city against Thy holy Servant Jesus, Whom Thou hast anointed, Herod and Pontius Pilate, with the Gentiles and the peoples of Israel were gathered together to do what Thy hand and Thy counsel ordained to come to pass.” Did then the wickedness of Christ’s persecutors spring from God’s plan, and was that unsurpassable crime prepared and set in motion by the hand of God? Clearly we must not think this of the highest Justice: that which was fore-known in respect of the Jews’ malice is far different, indeed quite contrary to what was ordained in respect of Christ’s Passion. Their desire to slay Him did not proceed from the same source as His to die: nor were their atrocious crime and the Redeemer’s endurance the offspring of One Spirit. The Lord did not incite but permit those madmen’s naughty hands: nor in His foreknowledge of what must be accomplished did He compel its accomplishment, even though it was in order to its accomplishment that He had taken flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252067%2520%2528on%2520the%2520Passion%252C%252016%253A%2520Delivered%2520on%2520the%2520Sunday%2529.html'
source_title="Sermon 67, Chapter 2"
