[[commentary]]
quote='''
For when the Lord says, “unless ye have eaten the flesh of the Son of Man, and drunk His blood, ye will not have life in you,” you ought so to be partakers at the Holy Table, as to have no doubt whatever concerning the reality of Christ’s Body and Blood. For that is taken in the mouth which is believed in Faith, and it is vain for them to respond Amen who dispute that which is taken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252091%2520on%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25206.html'
source_title="Sermon 91, Chapter 3"
