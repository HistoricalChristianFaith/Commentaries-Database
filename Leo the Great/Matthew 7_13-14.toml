[[commentary]]
quote='''
And thus is perfectly fulfilled that assurance of the Truth, by which we learn that “narrow and steep is the way that leads to life;” and whilst the breadth of the way that leads to death is crowded with a large company, the steps are few of those that tread the path of safety. And wherefore is the left road more thronged than the right, save that the multitude is prone to worldly joys and carnal goods? And although that which it desires is short-lived and uncertain, yet men endure toil more willingly for the lust of pleasure than for love of virtue. Thus while those who crave things visible are unnumbered, those who prefer the eternal to the temporal are hardly to be found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 2"
