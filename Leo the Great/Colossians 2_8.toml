[[commentary]]
quote='''
But do not limit your plan of abstinence, dearly-beloved, to the mortifying of the body, or to the lessening of food alone. For the greater advantages of this virtue belong to that chastity of the soul, which not only crushes the lusts of the flesh, but also despises the vanities of worldly wisdom, as the Apostle says, “take heed that no one deceive you through philosophy and empty deceit, according to the tradition of men.”

We must restrain ourselves, therefore, from food, but much more must we fast from errors that the mind, given up to no carnal pleasure, may be taken captive by no falsehood: because as in past days, so also in our own, there are not wanting enemies of the Truth, who dare to stir up civil wars within the catholic Church, in order that by leading the ignorant into agreement with their ungodly doctrines they may boast of increase in numbers through those whom they have been able to sever from the Body of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252091%2520on%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25206.html'
source_title="Sermon 91, Chapters 1-2"
