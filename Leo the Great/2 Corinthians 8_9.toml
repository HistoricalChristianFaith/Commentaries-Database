[[commentary]]
quote='''
And rightly in the needy and poor do we recognize the person of Jesus Christ our Lord Himself, “Who though He was rich,” as says the blessed Apostle, “became poor, that He might enrich us by His poverty.” And that His presence might never seem to be wanting to us, He so effected the mystic union of His humility and His glory that while we adore Him as King and Lord in the Majesty of the Father, we might also feed Him in His poor, for which we shall be set free in an evil day from perpetual damnation, and for our considerate care of the poor shall be joined with the whole company of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%25209%2520Upon%2520the%2520Collections%252C%25204.html'
source_title="Sermon 9, Chapter 3"
