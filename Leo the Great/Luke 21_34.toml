[[commentary]]
quote='''
When the Saviour would instruct His disciples about the Advent of God’s Kingdom and the end of the world’s times, and teach His whole Church, in the person of the Apostles, He said, “Take heed lest haply your hearts be overcharged with surfeiting and drunkenness, and care of this life.” And assuredly, dearly beloved, we acknowledge that this precept applies more especially to us, to whom undoubtedly the day denounced is near, even though hidden. For the advent of which it behoves every man to prepare himself, lest it find him given over to gluttony, or entangled in cares of this life. For by daily experience, beloved, it is proved that the mind’s edge is blunted by over-indulgence of the flesh, and the heart’s vigour is dulled by excess of food, so that the delights of eating are even opposed to the health of the body, unless reasonable moderation withstand the temptation and the consideration of future discomfort keep from the pleasure. For although the flesh desires nothing without the soul, and receives its sensations from the same source as it receives its motions also, yet it is the function of the same soul to deny certain things to the body which is subject to it, and by its inner judgment to restrain the outer parts from things unseasonable, in order that it may be the oftener free from bodily lusts, and have leisure for Divine wisdom in the palace of the mind, where, away from all the noise of earthly cares, it may in silence enjoy holy meditations and eternal delights. And, although this is difficult to maintain in this life, yet the attempt can frequently be renewed, in order that we may the oftener and longer be occupied with spiritual rather than fleshly cares; and by our spending ever greater portions of our time on higher cares, even our temporal actions may end in gaining the incorruptible riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252019%2520On%2520the%2520Fast%2520of%2520the%2520Ten%2520Month%252C%25208.html'
source_title="Sermon 19, Chapter 1"
