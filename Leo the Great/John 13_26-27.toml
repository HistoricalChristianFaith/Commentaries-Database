[[commentary]]
quote='''
And thus it followed, dearly-beloved, that as John the Evangelist has narrated, when the Lord offered the bread which He had dipped to His betrayer, more clearly to point him out, the devil entirely seized Judas, and now, by his veritable act of wickedness, took possession of one whom he had already bound down by his evil designs. For only in body was he lying there with those at meat: in mind he was arming the hatred of the priests, the falseness of the witnesses, and the fury of the ignorant mob. At last the Lord, seeing on what a gross crime Judas was bent says, “What thou doest, do quickly.” This is the voice not of command but of permission, and not of fear but of readiness: He, that has power over all times, shows that He puts no hindrance in the way of the traitor, and carries out the Father’s will for the redemption of the world in such a way as neither to promote nor to fear the crime which His persecutors were preparing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 4"
