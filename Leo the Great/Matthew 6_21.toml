[[commentary]]
quote='''
But the peace of the spiritual and of catholics coming down from above and leading upwards refuses to hold communion with the lovers of the world, resists all obstacles and flies from pernicious pleasures to true joys, as the Lord says: “Where thy treasure is, there will thy heart be also:” that is, if what you love is below you will descend to the lowest depth: if what you love is above, you will reach the topmost height: thither may the Spirit of peace lead and bring us, whose wishes and feeling are at one, and who are of one mind in faith and hope and in charity: since “as many as are led by the Spirit of God these are sons of God” Who reigneth with the Son and Holy Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 5"
