[[commentary]]
quote='''
But the chief priests, for whom the Saviour sought forgiveness, rendered the torture of the cross yet worse by the barbs of railery; and at Him, on Whom they could vent no more fury with their hands, they hurled the weapons of their tongues, saying, “He saved others; Himself he cannot save. If He is the King of Israel, let Him now come down from the cross, and we believe Him.” From what spring of error, from what pool of hatred, O ye Jews, do ye drink such poisonous blasphemies? What master informed you, what teaching convinced you that you ought to believe Him to be King of Israel and Son of God, who should either not allow Himself to be crucified, or should shake Himself free from the binding nails. The mysteries of the Law, the sacred observances of the Passover, the mouths of the Prophets never told you this: whereas you did find truly and oft-times written that which applies to your abominable wicked-doing and to the Lord’s voluntary suffering. For He Himself says by Isaiah, “I gave My back to the scourges, My cheeks to the palms of the hand, I turned not My face from the shame of spitting.” He Himself says by David, “They gave Me gall for My food, and in My thirst they supplied Me with vinegar,” and again, “Many dogs came about Me, the council of evil-doers beset Me. They pierced My hands and My feet, they counted all My bones. But they themselves watched and gazed on Me, they parted My raiment among them, and for My robe they cast lots.” And lest the course of your own evil doings should seem to have been foretold, and no power in the Crucified predicted, ye read not, indeed, that the Lord descended from the cross, but ye did read, “The Lord reigned on the tree.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252055%2520On%2520the%2520Lord%2527s%2520Passion%25204%252C%2520Delivered%2520on%2520Wednesday%2520in%2520Holy%2520Week.html'
source_title="Sermon 55, Chapter 2"

[[commentary]]
quote='''
This, then, had been the Jews’ belief, that Jesus had been forsaken by God, against Whom they had been able to commit such unholy cruelty; for not understanding the mystery of His wondrous endurance, they said in blasphemous mockery: “He saved others, Himself He cannot save. If He be the King of Israel, let Him now come down from the cross, and we believe Him.” Not at your blind will, O foolish scribes and wicked priests, was the Saviour’s power to be displayed, nor in obedience to blasphemers’ evil tongues was the Redemption of mankind to be delayed; for if you had wished to recognize the Godhead of the Son of God, you would have observed His numberless works, and they must have confirmed you in that faith, which you so deceitfully promise. But if, as you yourselves acknowledge, it is true that He saved others, why have those many, great miracles, which have been done under the public gaze, done nothing to soften the hardness of your hearts, unless it be because you have always so resisted the Holy Ghost as to turn all God’s benefits towards you into your destruction? For even though Christ should descend from the cross, you would yet remain in your crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapter 2"
