[[commentary]]
quote='''
And so be not infected with the error of those who are corrupted merely by their own ordinances, “serving the creature rather than the Creator,” and offering a foolish abstinence to the service of the lights of heaven: seeing that they have chosen to fast on the first and second days of the week in honour of the sun and moon, proving themselves in this one instance of their perverseness twice disloyal to God, twice blasphemous, by setting up their fast not only in worship of the stars but also in contempt of the Lord’s Resurrection. For they reject the mystery of man’s salvation and refuse to believe that Christ our Lord in the true flesh of our nature was truly born, truly suffered, was truly buried and was truly raised. And in consequence, condemn the day of our rejoicing by the gloom of their fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252042%2520On%2520Lent%252C%25204.html'
source_title="Sermon 42, Chapter 5"
