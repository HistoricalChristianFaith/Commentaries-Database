[[commentary]]
quote='''
For it is the strength of great minds and the light of firmly-faithful souls, unhesitatingly to believe what is not seen with the bodily sight, and there to fix one’s affections whither you cannot direct your gaze. And whence should this Godliness spring up in our hearts, or how should a man be justified by faith, if our salvation rested on those things only which lie beneath our eyes? Hence our Lord said to him who seemed to doubt of Christ’s Resurrection, until he had tested by sight and touch the traces of His Passion in His very Flesh, “because thou hast seen Me, thou hast believed: blessed are they who have not seen and yet have believed.”

In order, therefore, dearly-beloved, that we may be capable of this blessedness, when all things were fulfilled which concerned the Gospel preaching and the mysteries of the New Testament, our Lord Jesus Christ, on the fortieth day after the Resurrection in the presence of the disciples, was raised into heaven, and terminated His presence with us in the body, to abide on the Father’s right hand until the times Divinely fore-ordained for multiplying the sons of the Church are accomplished, and He comes to judge the living and the dead in the same flesh in which He ascended. And so that which till then was visible of our Redeemer was changed into a sacramental presence, and that faith might be more excellent and stronger, sight gave way to doctrine, the authority of which was to be accepted by believing hearts enlightened with rays from above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252074%2520%2528on%2520the%2520Lord%2527s%2520Ascension%252C%25202%2529.html'
source_title="Sermon 74, Chapters 1-2"
