[[commentary]]
quote='''
He "assumed the form of a slave" without the stain of sin, enhancing the human without diminishing the divine. That emptying by which the invisible One offered himself to be seen and the Creator and Lord of all things elected to be one among mortals was a sovereign act of stooping in majestic pity, not a defect of power.
'''
source_url=''
source_title="EPISTLE 28 TO FLAVIAN 3"

[[commentary]]
quote='''
Thus in the whole and perfect nature of true man was true God born, complete in what was His own, complete in what was ours. And “ours” we call what the Creator formed in us from the beginning and what He undertook to repair. For what the deceiver brought in and the deceived admitted had no trace in the Saviour. Nor because He partook of man’s weaknesses, did He therefore share our faults. He took the form of a slave without stain of sin, increasing the human and not diminishing the Divine: because that “emptying of Himself” whereby the Invisible made Himself visible and Creator and Lord of all things as He was, wished to be mortal, was the condescension of Pity not the failing of Power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252022%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25202.html'
source_title="Sermon 22, Chapter 1"

[[commentary]]
quote='''
Thus in the whole and perfect nature of true man was true God born, complete in what was His own, complete in what was ours. And by “ours” we mean what the Creator formed in us from the beginning, and what He undertook to repair. For what the deceiver brought in, and man deceived committed, had no trace in the Saviour; nor because He partook of man’s weaknesses, did He therefore share our faults. He took the form of a slave without stain of sin, increasing the human and not diminishing the divine: for that “emptying of Himself,” whereby the Invisible made Himself visible, was the bending down of pity, not the failing of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252023%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25203.html'
source_title="Sermon 23, Chapter 2"

[[commentary]]
quote='''
And so, dearly-beloved, when in reading or hearing the Gospel you find certain things in our Lord Jesus Christ subjected to injuries and certain things illumined by miracles, in such a way that in the same Person now the Humanity appears, and now the Divinity shines out, do not put down any of these things to a delusion, as if in Christ there is either Manhood alone or Godhead alone, but believe both faithfully, worship both right humbly; so that in the union of the Word and the Flesh there may be no separation, and the bodily proofs may not seem delusive, because the divine signs were evident in Jesus. The attestations to both natures in Him are true and abundant, and by the depth of the Divine purpose all concur to this end, that the inviolable Word not being separated from the passible flesh, the Godhead may be understood as in all things partaker with the flesh and the flesh with the Godhead. And, therefore, must the Christian mind that would eschew lies and be the disciple of truth, use the Gospel-story confidently, and, as if still in company with the Apostles themselves, distinguish what is visibly done by the Lord, now by the spiritual understanding and now by the bodily organs of sight. Assign to the man that He is born a boy of a woman: assign to God that His mother’s virginity is not harmed, either by conception or by bearing. Recognize “the form of a slave” enwrapped in swaddling clothes, lying in a manger, but acknowledge that it was the Lord’s form that was announced by angels, “proclaimed by the elements,” adored by the wise men. Understand it of His humanity that he did not avoid the marriage feast: confess it Divine that he turned water into wine. Let your own feelings explain to you why He shed tears over a dead friend: let His Divine power be realized, when that same friend, after mouldering in the grave four days, is brought to life and raised only by the command of His voice. To make clay with spittle and earth was a work of the body: but to anoint therewith and enlighten the eyes of the blind is an undoubted mark of that power which had reserved for the revelation of its glory that which it had not allowed to the early part of His natural life. It is truly human to relieve bodily fatigue with rest in sleep: but it is truly Divine to quell the violence of raging storms by a rebuking command. To set food before the hungry denotes human kindness and a philanthropic spirit: but with five loaves and two fishes to satisfy 5,000 men, besides women and children, who would dare deny that to be the work of Deity? a Deity which, by the co-operation of the functions of true flesh, showed not only itself in Manhood, but also Manhood in itself; for the old, original wounds in man’s nature could not be healed, except by the Word of God taking to Himself flesh from the Virgin’s womb, whereby in one and the same Person flesh and the Word co-existed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252046%2520On%2520Lent%252C%25208.html'
source_title="Sermon 46, Chapter 2"

[[commentary]]
quote='''
But it is not enough to know the Son of God in the Father’s nature only, unless we acknowledge Him in what is ours without withdrawal of what is His own. For that self-emptying, which He underwent for man’s restoration, was the dispensation of compassion, not the loss of power. For, though by the eternal purpose of God there was “no other name under heaven given to men whereby they must be saved,” the Invisible made His substance visible, the Intemporal temporal, the Impassible passible: not that power might sink into weakness, but that weakness might pass into indestructible power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 5"
