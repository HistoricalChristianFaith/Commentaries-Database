[[commentary]]
quote='''
For if between men that is the lasting friendship which is based upon similarity of character notwithstanding that such identity of wills is often directed to wicked ends, how ought we to yearn and strive to differ in nothing from what is pleasing to God. Of which the prophet speaks, “for wrath is in His indignation, and life in His pleasure,” because we shall not otherwise attain the dignity of the Divine Majesty, unless we imitate His will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252012%2520On%2520the%2520Fast%2520of%2520The%252C%2520Tenth%2520Month%252C%25201.html'
source_title="Sermon 12, Chapter 1"
