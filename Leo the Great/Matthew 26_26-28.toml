[[commentary]]
quote='''
But Jesus, sure of His purpose and undaunted in carrying out His Father’s will, fulfilled the New Testament and founded a new Passover. For while the disciples were lying down with Him at the mystic Supper, and when discussion was proceeding in the hall of Caiaphas how Christ might be put to death, He, ordaining the Sacrament of His Body and Blood, was teaching them what kind of Victim must be offered up to God, and not even from this mystery was the betrayer kept away, in order to show that he was exasperated by no personal wrong, but had determined beforehand of his own free-will upon his treachery. For he was his own source of ruin and cause of perfidy, following the guidance of the devil and refusing to have Christ as director.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 3"
