[[commentary]]
quote='''
But the wide extent of Christian grace has given us yet greater reasons for loving our neighbour, which, reaching to all parts of the whole world, looks down on no one, and teaches that no one is to be neglected. And full rightly does He command us to love our enemies, and to pray to Him for our persecutors, who, daily grafting shoots of the wild olive from among all nations upon the holy branches of His own olive, makes men reconciled instead of enemies, adopted sons instead of strangers, just instead of ungodly, “that every knee may bow of things in heaven, of things on earth, and of things under the earth, and every tongue confess that the Lord Jesus Christ is in the glory of God the Father.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252012%2520On%2520the%2520Fast%2520of%2520The%252C%2520Tenth%2520Month%252C%25201.html'
source_title="Sermon 12, Chapter 2"
