[[commentary]]
quote='''
Let us, then, dearly-beloved, confess what the blessed teacher of the nations, the Apostle Paul, confessed, saying, “Faithful is the saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners.” For God’s mercy towards us is the more wonderful that Christ died not for the righteous nor for the holy, but for the unrighteous and wicked; and though the nature of the Godhead could not sustain the sting of death, yet at His birth He took from us that which He might offer for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 8"
