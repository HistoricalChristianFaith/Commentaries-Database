[[commentary]]
quote='''
And therefore in the general ruin of the entire human race there was but one remedy in the secret of the Divine plan which could succour the fallen, and that was that one of the sons of Adam should be born free and innocent of original transgression, to prevail for the rest both by His example and His merits. Still further, because this was not permitted by natural generation, and because there could be no offspring from our faulty stock without seed, of which the Scripture saith, “Who can make a clean thing conceived of an unclean seed? is it not Thou who art alone?” David’s Lord was made David’s Son, and from the fruit of the promised branch sprang One without fault, the twofold nature coming together into one Person, that by one and the same conception and birth might spring our Lord Jesus Christ, in Whom was present both true Godhead for the performance of mighty works and true Manhood for the endurance of sufferings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 3"
