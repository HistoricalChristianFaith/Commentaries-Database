[[commentary]]
quote='''
In bowing, therefore, dearly-beloved, to the madness of the implacable people, in permitting Jesus to be dishonoured by much mocking, and harassed with excessive insults, and in displaying Him to the eyes of His persecutors lacerated with scourges, crowned with thorns, and clothed in a robe of scorn, Pilate doubtless thought to appease the enemies’ minds, so that when they had glutted their cruel hate, they might cease further to persecute One Whom they beheld subjected to such a variety of afflictions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 3"
