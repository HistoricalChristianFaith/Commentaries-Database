[[commentary]]
quote='''
But when the disciples’ eyes followed the ascending Lord to heaven with upward gaze of earnest wonder, two angels stood by them in raiment shining with wondrous brightness, who also said, “Ye men of Galilee, why stand ye gazing into heaven? This Jesus Who was taken up from you into heaven shall so come as ye saw Him going into heaven.” By which words all the sons of the Church were taught to believe that Jesus Christ will come visibly in the same Flesh wherewith He ascended, and not to doubt that all things are subjected to Him on Whom the ministry of angels had waited from the first beginning of His Birth. For, as an angel announced to the blessed Virgin that Christ should be conceived by the Holy Ghost, so the voice of heavenly beings sang of His being born of the Virgin also to the shepherds. As messengers from above were the first to attest His having risen from the dead, so the service of angels was employed to foretell His coming in very Flesh to judge the world, that we might understand what great powers will come with Him as Judge, when such great ones ministered to Him even in being judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252074%2520%2528on%2520the%2520Lord%2527s%2520Ascension%252C%25202%2529.html'
source_title="Sermon 74, Chapter 4"
