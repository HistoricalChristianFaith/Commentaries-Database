[[commentary]]
quote='''
By what law is it, my Jewish friends, that what is unlawful to do is lawful to desire? By what standard is it that what defiles the body does not taint the heart? You fear to be contaminated by the shedding of his blood that you would take upon yourselves and your children. Since your wickedness will not commit so great a crime, allow the procurator to pass judgment. But, prevailing upon him impetuously, you do not allow him to swerve from that goal you deceitfully abstain from.Pilate sinned by doing what he did not want to do. He acquiesced in your judgment, doing whatever your rage wrought by force. Such was your observance of the law that you eschewed placing into the treasury the money which the seller of Christ returned to you, wary lest the blood money pollute the sacred coffers. Whose heart is guilty of this pretense? The conscience of the priests accepts what the money box does not receive. Thus with untold shades of deceit you cover yourselves, and a deal is made with the traitor.
'''
source_url=''
source_title="SERMON 44.3"

[[commentary]]
quote='''
(Serm. lix. 2.) The impiety of the Jews then exceeded the fault of Pilate; but he was not guiltless, seeing he resigned his own jurisdiction, and acquiesced in the injustice of others.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For ye resolved on a mad and bloody counsel, ye “fat bulls,” ye “many oxen,” ye “roaring” wild beasts, ye rabid “dogs,” to give up to death the Author of life and the Lord of glory; and, as if the enormity of your fury could be palliated by employing the verdict of him, who ruled your province, you lead Jesus bound to Pilate’s judgment, that the terror-stricken judge being overcome by your persistent shouts, you might choose a man that was a murderer for pardon, and demand the crucifixion of the Saviour of the world. After this condemnation of Christ, brought about more by the cowardice than the power of Pilate, who with washed hands but polluted mouth sent Jesus to the cross with the very lips that had pronounced Him innocent, the licence of the people, obedient to the looks of the priests, heaped many insults on the Lord, and the frenzied mob wreaked its rage on Him, Who meekly and voluntarily endured it all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252054%2520On%2520the%2520Passion%252C%25203%253B%2520Delivered%2520on%2520the%2520Sunday%2520Before%2520Easter.html'
source_title="Sermon 54, Chapter 6"

[[commentary]]
quote='''
For they gave up Jesus, bound in hard bonds, bruised by many buffets and blows, spat upon, already condemned by their shouts: so that amidst so many signs of their own verdict Pilate might not dare to acquit One Whom all desired to perish. In fact, the very inquiry shows both that he found in the Accused no fault and that in his judgment he did not adhere to his purpose: for as judge he condemns One Whom he pronounces guiltless, invoking on the unrighteous people the blood of the Righteous Man with Whom he felt by his own conviction, and knew from his wife’s dream, he must have nothing to do. That stained soul is not cleansed by the washing of hands, there is no expiation in water-besprinkled fingers for the crime abetted by that wicked mind. Pilate’s fault is indeed, less than the Jews’ crime; for it was they that terrified him with Cæsar’s name, chode him with hateful words, and drove him to perpetrate his wickedness. But he also did not escape incrimination for playing into the hands of those that made the uproar, for abandoning his own judgment, and for acquiescing in the charges of others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 2"
