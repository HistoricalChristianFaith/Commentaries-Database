[[commentary]]
quote='''
And hence also we have sung with harmonious voice the psalm of David, dearly beloved, not in our own praise, but to the glory of Christ the Lord. For it is He of whom it is prophetically written, “Thou art a priest for ever after the order of Melchizedeck,” that is, not after the order of Aaron, whose priesthood descending along his own line of offspring was a temporal ministry, and ceased with the law of the Old Testament, but after the order of Melchizedeck, in whom was prefigured the eternal High Priest. And no reference is made to his parentage because in him it is understood that He was portrayed, whose generation cannot be declared. And finally, now that the mystery of this Divine priesthood has descended to human agency, it runs not by the line of birth, nor is that which flesh and blood created, chosen, but without regard to the privilege of paternity and succession by inheritance, those men are received by the Church as its rulers whom the Holy Ghost prepares: so that in the people of God’s adoption, the whole body of which is priestly and royal, it is not the prerogative of earthly origin which obtains the unction, but the condescension of Divine grace which creates the bishop.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%25203%2520On%2520His%2520Birthday%252C%2520Delivered%2520on%2520the%2520Anniversary%2520of%2520His%2520Elevation%2520to%2520the%2520Pontificate.html'
source_title="Sermon 3, Chapter 1"
