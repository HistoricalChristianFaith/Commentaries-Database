[[commentary]]
quote='''
The nature then of Christ’s teaching is attested by His own holy statements: that they who wish to arrive at eternal blessedness may understand the steps of ascent to that high happiness. “Blessed,” He saith, “are the poor in spirit, for theirs is the kingdom of heaven.” It would perhaps be doubtful what poor He was speaking of, if in saying “blessed are the poor” He had added nothing which would explain the sort of poor: and then that poverty by itself would appear sufficient to win the kingdom of heaven which many suffer from hard and heavy necessity. But when He says “blessed are the poor in spirit,” He shows that the kingdom of heaven must be assigned to those who are recommended by the humility of their spirits rather than by the smallness of their means. Yet it cannot be doubted that this possession of humility is more easily acquired by the poor than the rich: for submissiveness is the companion of those that want, while loftiness of mind dwells with riches. Notwithstanding, even in many of the rich is found that spirit which uses its abundance not for the increasing of its pride but on works of kindness, and counts that for the greatest gain which it expends in the relief of others’ hardships. It is given to every kind and rank of men to share in this virtue, because men may be equal in will, though unequal in fortune: and it does not matter how different they are in earthly means, who are found equal in spiritual possessions. Blessed, therefore, is poverty which is not possessed with a love of temporal things, and does not seek to be increased with the riches of the world, but is eager to amass heavenly possessions.

Of this high-souled humility the Apostles first, after the Lord, have given us example, who, leaving all that they had without difference at the voice of the heavenly Master, were turned by a ready change from the catching of fish to be fishers of men, and made many like themselves through the imitation of their faith, when with those first-begotten sons of the Church, “the heart of all was one, and the spirit one, of those that believed:” for they, putting away the whole of their things and possessions, enriched themselves with eternal goods, through the most devoted poverty, and in accordance with the Apostles’ preaching rejoiced to have nothing of the world and possess all things with Christ. Hence the blessed Apostle Peter, when he was going up into the temple, and was asked for alms by the lame man, said, “Silver and gold is not mine, but what I have that I give thee: in the Name of Jesus Christ of Nazareth, arise and walk.” What more sublime than this humility? what richer than this poverty? He hath not stores of money, but he hath gifts of nature. He whom his mother had brought forth lame from the womb, is made whole by Peter with a word; and he who gave not Cæsar’s image in a coin, restored Christ’s image on the man. And by the riches of this treasure not he only was aided whose power of walking was restored, but 5,000 men also, who then believed at the Apostle’s exhortation on account of the wonder of this cure. And that poor man who had not what to give to the asker, bestowed so great a bounty of Divine Grace, that, as he had set one man straight on his feet, so he healed these many thousands of believers in their hearts, and made them “leap as an hart” in Christ whom he had found limping in Jewish unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapters 2-3"
