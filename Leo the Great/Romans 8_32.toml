[[commentary]]
quote='''
For the blessed Apostle says that the Father “spared not His own Son, but gave Him up for us all;” and again, he says, “For Christ loved the Church, and gave Himself up for her, that He might sanctify it.” And hence the giving up of the Lord to His Passion was as much of the Father’s as of His own will, so that not only did the Father “forsake” Him, but He also abandoned Himself in a certain sense, not in hasty flight, but in voluntary withdrawal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapter 2"
