[[commentary]]
quote='''
Of what avail, dearly-beloved, are religious fasts in winning the mercy of God, and in renewing the fortunes of human frailty, we know from the statements of the holy Prophets, who proclaim that justice of God, Whose vengeance the people of Israel had again and again incurred through their iniquities, cannot be appeased save by fasting. Thus it is that the Prophet Joel warns them, saying, “thus saith the Lord your God, turn ye to Me with all your heart, with fasting and weeping and mourning, and rend your hearts and not your garments, and turn ye to the Lord your God, for He is merciful and patient, and of great kindness, and very merciful,” and again, “sanctify a fast, proclaim a healing, assemble the people, sanctify the church.” And this exhortation must in our days also be obeyed, because these healing remedies must of necessity be proclaimed by us too, in order that in the observance of the ancient sanctification Christian devotion may gain what Jewish transgression lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252088%2520On%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25203.html'
source_title="Sermon 88, Chapter 1"
