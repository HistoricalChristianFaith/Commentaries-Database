[[commentary]]
quote='''
And how much this humiliation conferred upon all the faithful, the most blessed Apostle Peter was the first to prove, who, after the fierce blast of threatening cruelty had dismayed him, quickly changed, and was restored to vigour, finding remedy from the great Pattern, so that the suddenly-shaken member returned to the firmness of the Head. For the bond-servant could not be “greater than the Lord, nor the disciple greater than the master,” and he could not have vanquished the trembling of human frailty had not the Vanquisher of Death first feared. The Lord, therefore, “looked back upon Peter,” and amid the calumnies of priests, the falsehoods of witnesses, the injuries of those that scourged and spat upon Him, met His dismayed disciple with those eyes wherewith He had foreseen his dismay: and the gaze of the Truth entered into him, on whose heart correction must be wrought, as if the Lord’s voice were making itself heard there, and saying, Whither goest thou, Peter? why retirest thou upon thyself? turn thou to Me, put thy trust in Me, follow Me: this is the time of My Passion, the hour of thy suffering is not yet come. Why dost thou fear what thou, too, shalt overcome? Let not the weakness, in which I share, confound thee. I was fearful for thee; do thou be confident of Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252054%2520On%2520the%2520Passion%252C%25203%253B%2520Delivered%2520on%2520the%2520Sunday%2520Before%2520Easter.html'
source_title="Sermon 54, Chapter 5"
