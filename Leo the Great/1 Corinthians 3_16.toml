[[commentary]]
quote='''
Awake, O man, and recognize the dignity of thy nature. Recollect thou wast made in the image of God, which although it was corrupted in Adam, was yet re-fashioned in Christ. Use visible creatures as they should be used, as thou usest earth, sea, sky, air, springs, and rivers: and whatever in them is fair and wondrous, ascribe to the praise and glory of the Maker. Be not subject to that light wherein birds and serpents, beasts and cattle, flies and worms delight. Confine the material light to your bodily senses, and with all your mental powers embrace that “true light which lighteth every man that cometh into this world,” and of which the prophet says, “Come unto Him and be enlightened, and your faces shall not blush.” For if we “are a temple of God, and the Spirit of God dwelleth in” us, what every one of the faithful has in his own heart is more than what he wonders at in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapter 6"
