[[commentary]]
quote='''
For Christ’s Death had much disturbed the disciples’ hearts, and a kind of torpor of distrust had crept over their grief-laden minds at His torture on the cross, at His giving up the ghost, at His lifeless body’s burial. For, when the holy women, as the Gospel-story has revealed, brought word of the stone rolled away from the tomb, the sepulchre emptied of the body, and the angels bearing witness to the living Lord, their words seemed like ravings to the Apostles and other disciples. Which doubtfulness, the result of human weakness, the Spirit of Truth would most assuredly not have permitted to exist in His own preacher’s breasts, had not their trembling anxiety and careful hesitation laid the foundations of our faith. It was our perplexities and our dangers that were provided for in the Apostles: it was ourselves who in these men were taught how to meet the cavillings of the ungodly and the arguments of earthly wisdom. We are instructed by their lookings, we are taught by their hearings, we are convinced by their handlings. Let us give thanks to the Divine management and the holy Fathers’ necessary slowness of belief. Others doubted, that we might not doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252073%2520%2528on%2520the%2520Lord%2527s%2520Ascension%252C%25201%2529.html'
source_title="Sermon 73, Chapter 1"
