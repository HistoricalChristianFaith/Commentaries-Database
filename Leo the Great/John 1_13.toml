[[commentary]]
quote='''
They then who “are born not of blood nor of the will of the flesh nor of the will of man but of God,” must offer to the Father the unanimity of peace-loving sons, and all the members of adoption must meet in the First-begotten of the new creation, Who came to do not His own Will but His that sent Him; inasmuch as the Father in His gracious favour has adopted as His heirs not those that are discordant nor those that are unlike Him, but those that are in feeling and affection one. They that are re-modelled after one pattern must have a spirit like the model.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 5"

[[commentary]]
quote='''
And so our Lord Jesus Christ, being at birth true man though He never ceased to be true God, made in Himself the beginning of a new creation, and in the “form” of His birth started the spiritual life of mankind afresh, that to abolish the taint of our birth according to the flesh there might be a possibility of regeneration without our sinful seed for those of whom it is said, “Who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God.” What mind can grasp this mystery, what tongue can express this gracious act? Sinfulness returns to guiltlessness and the old nature becomes new; strangers receive adoption and outsiders enter upon an inheritance. The ungodly begin to be righteous, the miserly benevolent, the incontinent chaste, the earthly heavenly. And whence comes this change, save by the right hand of the Most High? For the Son of God came to “destroy the works of the devil,” and has so united Himself with us and us with Him that the descent of God to man’s estate became the exaltation of man to God’s.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapter 2"

[[commentary]]
quote='''
All therefore that the Son of God did and taught for the world’s reconciliation, we not only know as a matter of past history, but appreciate in the power of its present effect. It is He Who, born of the Virgin Mother by the Holy Ghost, fertilizes His unpolluted Church with the same blessed Spirit, that by the birth of Baptism an innumerable multitude of sons may be born to God, of Whom it is said, “who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 6"
