[[commentary]]
quote='''
But because the snares of the devil are not at rest even in such a state of things, most rightly at certain seasons of the year the renewal of our vigour is provided for: and now in particular, when one who is greedy of present good might boast himself over the clemency of the weather and the fertility of the land, and having stored his crops in great barns, might say to his soul, “thou hast much goods, eat and drink,” let him take heed to the rebuke of the Divine voice, and hear it saying, “Thou fool, this night they require thy soul of thee, and the things which thou hast prepared, whose shall they be?” This should be the wise man’s most anxious consideration, in order that, as the days of this life are short and its span uncertain, death may never come upon him unawares, and that knowing himself mortal he may meet his end fully prepared.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252090%2520%2528on%2520the%2520Fast%2520of%2520Seventh%2520Month%252C%25205%2529.html'
source_title="Sermon 90, Chapter 4"
