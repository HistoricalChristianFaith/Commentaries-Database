[[commentary]]
quote='''
Let no one therefore, dearly beloved, flatter himself on any merits of a good life, if works of charity be wanting in him, and let him not trust in the purity of his body, if he be not cleansed by the purification of almsgiving. For “almsgiving wipes out sin,” kills death, and extinguishes the punishment of perpetual fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252010%2520On%2520the%2520Collections%252C%25205.html'
source_title="Sermon 10, Chapter 4"

[[commentary]]
quote='''
Furthermore, in the distribution of alms and care of the poor, let our Christian fast-times be fat and abound; and let each bestow on the weak and destitute those dainties which he denies himself. Let pains be taken that all may bless God with one mouth, and let him that gives some portion of his substance understand that he is a minister of the Divine mercy; for God has placed the cause of the poor in the hand of the liberal man; that the sins which are washed away either by the waters of baptism, or the tears of repentance, may be also blotted out by alms-giving; for the Scripture says, “As water extinguisheth fire, so alms extinguisheth sin.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 6"
