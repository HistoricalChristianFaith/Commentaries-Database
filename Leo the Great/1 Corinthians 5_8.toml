[[commentary]]
quote='''
This is that true Light which justifies and enlightens every man. This it is that rescues from the power of darkness and transfers us into the Kingdom of the Son of God. This it is that by newness of life exalts the desires of the mind and quenches the lusts of the flesh. This it is whereby the Lord’s Passover is duly kept “With the unleavened bread of sincerity and truth” by the casting away of “the old leaven of wickedness” and the inebriating and feeding of the new creature with the very Lord. For naught else is brought about by the partaking of the Body and Blood of Christ than that we pass into that which we then take, and both in spirit and in body carry everywhere Him, in and with Whom we were dead, buried, and rose again, as the Apostle says, “For ye are dead, and your life is hid with Christ in God. For when Christ, your life, shall appear, then shall ye also appear with Him in glory.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 7"
