[[commentary]]
quote='''
The iniquity of money-lending must absolutely be abjured, and the gain which lacks all humanity must be shunned. A man’s possessions are indeed multiplied by these unrighteous and sorry means, but the mind’s wealth decays because usury of money is the death of the soul. For what God thinks of such men the most holy Prophet David makes clear, for when he asks, “Lord, who shall dwell in thy tabernacle, or who shall rest upon thy holy hill?” he receives the Divine utterance in reply, from which he learns that that man attains to eternal rest who among other rules of holy living “hath not given his money upon usury:” and thus he who gets deceitful gain from lending his money on usury is shown to be both an alien from God’s tabernacle and an exile from His holy hill, and in seeking to enrich himself by other’s losses, he deserves to be punished with eternal neediness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252017%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month%252C%25206.html'
source_title="Sermon 17, Chapter 3"
