[[commentary]]
quote='''
A star more brilliant than the other stars arouses wise men that dwell in the far East, and from the brightness of the wondrous light these men, not unskilled in observing such things, appreciate the importance of the sign: this doubtless being brought about in their hearts by Divine inspiration, in order that the mystery of so great a sight might not be hid from them, and, what was an unusual appearance to their eyes, might not be obscure to their minds. In a word they scrupulously set about their duty and provide themselves with such gifts that in worshipping the One they may at the same time show their belief in His threefold function: with gold they honour the Person of a King, with myrrh that of Man, with incense that of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 2"

[[commentary]]
quote='''
Led then, dearly beloved, into Bethlehem by obeying the guidance of the star, the wise men “rejoiced with very great joy,” as the evangelist has told us: “and entering the house, found the child with Mary, His mother; and falling down they worshipped Him; and opening their treasures they presented to Him gifts, gold, frankincense and myrrh.” What wondrous faith of perfect knowledge, which was taught them not by earthly wisdom, but by the instruction of the Holy Spirit! Whence came it that these men, who had quitted their country without having seen Jesus, and had not noticed anything in His looks to enforce such systematic adoration, observed this method in offering their gifts? unless it were that besides the appearance of the star, which attracted their bodily eyes, the more refulgent rays of truth taught their hearts that before they started on their toilsome road, they must understand that He was signified to Whom was owed in gold royal honour, in incense Divine adoration, in myrrh the acknowledgment of mortality. Such a belief and understanding no doubt, as far as the enlightenment of their faith went, might have been sufficient in themselves and have prevented their using their bodily eyes in inquiring into that which they had beheld with their mind’s fullest gaze. But their sagacious diligence, persevering till they found the child, did good service for future peoples and for the men of our own time: so that, as it profited us all that the apostle Thomas, after the Lord’s resurrection, handled the traces of the wounds in His flesh, so it was of advantage to us that His infancy should be attested by the visit of the wise men. And so the wise men saw and adored the Child of the tribe of Judah, “of the seed of David according to the flesh,” “made from a woman, made under the law,” which He had come “not to destroy but to fulfil.” They saw and adored the Child, small in size, powerless to help others, incapable of speech, and in nought different to the generality of human children. Because, as the testimonies were trustworthy which asserted in Him the majesty of invisible Godhead, so it ought to be impossible to doubt that “the Word became flesh,” and the eternal essence of the Son of God took man’s true nature: lest either the inexpressible marvels of his acts which were to follow or the infliction of sufferings which He had to bear should overthrow the mystery of our Faith by their inconsistency: seeing that no one at all can be justified save those who believe the Lord Jesus to be both true God and true Man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252034%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25204.html'
source_title="Sermon 34, Chapter 3"

[[commentary]]
quote='''
But if with careful thought we wish to see how their threefold kind of gift is also offered by all who come to Christ with the foot of faith, is not the same offering repeated in the hearts of true believers? For he that acknowledges Christ the King of the universe brings gold from the treasure of his heart: he that believes the Only-begotten of God to have united man’s true nature to Himself, offers myrrh; and he that confesses Him in no wise inferior to the Father’s majesty, worships Him in a manner with incense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252036%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25206.html'
source_title="Sermon 36, Chapter 1"
