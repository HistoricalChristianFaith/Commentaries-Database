[[commentary]]
quote='''
In bowing, therefore, dearly-beloved, to the madness of the implacable people, in permitting Jesus to be dishonoured by much mocking, and harassed with excessive insults, and in displaying Him to the eyes of His persecutors lacerated with scourges, crowned with thorns, and clothed in a robe of scorn, Pilate doubtless thought to appease the enemies’ minds, so that when they had glutted their cruel hate, they might cease further to persecute One Whom they beheld subjected to such a variety of afflictions. But their wrath was still in full blaze, and they cried out to him to release Barabbas and let Jesus bear the penalty of the cross, and thus, when with consenting murmur the crowd said, “His blood be on us and on our sons,” those wicked folk gained, to their own damnation what they had persistently demanded, “whose teeth,” as the prophet bore witness, “were arms and arrows, and their tongue a sharp sword.” For in vain did they keep their own hands from crucifying the Lord of glory when they had hurled at Him the tongue’s deadly darts and the poisoned weapons of words. On you, on you, false Jews and unholy leaders of the people, falls the full weight of that crime: and although the enormity of the guilt involves the governor and the soldiers also, yet you are the primary and chief offenders. And in Christ’s condemnation, whatsoever wrong was done either by Pilate’s judgment or by the cohorts carrying out of his commands, makes you only the more deserving of the hatred of mankind, because the impulse of your fury would not let even those be free from guilt who were displeased at your unrighteous acts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 3"

[[commentary]]
quote='''
And yet so great was His loving compassion for even His murderers, that He prayed to the Father on the cross, and begged not for His own vengeance but for their forgiveness, saying, “Father, forgive them, for they know not what they do.” And such was the power of that prayer, that the hearts of many of those who had said, “His blood be on us and on our sons,” were turned to penitence by the Apostle Peter’s preaching, and on one day there were baptized about 3,000 Jews: and they all were “of one heart and of one soul,” being ready now to die for Him, Whose crucifixion they had demanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252062%2520%2528on%2520the%2520Passion%252C%252011%2529.html'
source_title="Sermon 62, Chapter 3"
