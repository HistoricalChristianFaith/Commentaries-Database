[[commentary]]
quote='''
And lest we should be led by despair into sheer inaction, He promises that the Divine power shall make those things possible which are to man impossible from his own lack of power: “for narrow and strait is the way which leadeth unto life,” and no one could set foot on it, no one could advance one step, unless Christ by making Himself the Way unbarred the difficulties of approach: and thus the Ordainer of the journey becomes the Means whereby we are able to accomplish it, because not only does He impose the labour, but also brings us to the haven of rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252090%2520%2528on%2520the%2520Fast%2520of%2520Seventh%2520Month%252C%25205%2529.html'
source_title="Sermon 90, Chapter 2"
