[[commentary]]
quote='''
I entreat you, beloved, let those words of the Saviour touch your hearts, Who, when by the power of His mercy He had cleansed ten lepers, said that only one of them all had returned to give thanks: meaning without doubt that, though the ungrateful ones had gained soundness of body, yet their failure in this godly duty arose from ungodliness of heart. And therefore, dearly-beloved, that this brand of ingratitude may not be applied to you, return to the Lord, remembering the marvels which He has deigned to perform among us; and ascribing our release not, as the ungodly suppose, to the influences of the stars, but to the unspeakable mercy of Almighty God, Who has deigned to soften the hearts of raging barbarians, betake yourselves to the commemoration of so great a benefit with all the vigour of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252084%2520Concerning%2520the%2520Neglect%2520of%2520the%2520Commemoration.html'
source_title="Sermon 84, Chapter 2"
