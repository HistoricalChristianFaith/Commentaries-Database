[[commentary]]
quote='''
But you, dearly beloved, whom I address in no less earnest terms than those of the blessed Apostle Peter, “a chosen race, a royal priesthood, a holy nation, a people for God’s own possession,” built upon the impregnable rock, Christ, and joined to the Lord our Saviour by His true assumption of our flesh, remain firm in that Faith, which you have professed before many witnesses, and in which you were reborn through water and the Holy Ghost, and received the anointing of salvation, and the seal of eternal life. But “if any one preach to you any thing beside that which you have learnt, let him be anathema:” refuse to put wicked fables before the clearest truth, and what you may happen to read or hear contrary to the rule of the catholic and Apostolic creed, judge it altogether deadly and diabolical.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 6"
