[[commentary]]
quote='''
It is He Who, without excluding any nation, makes one flock of holy sheep from every nation under heaven, and daily fulfils what He promised, saying, “Other sheep also I have which are not of this fold; them also I must bring, and they shall hear My voice, and there shall be one flock and one shepherd.” For though to the blessed Peter first and foremost He says, “Feed My sheep;” yet the one Lord directs the charge of all the shepherds, and feeds those that come to the rock with such glad and well-watered pastures, that countless sheep are nourished by the richness of His love, and hesitate not to perish for the Shepherd’s sake, even as the good Shepherd Himself was content to lay down His life for His sheep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 6"
