[[commentary]]
quote='''
And therefore that the Lord might use outward healings as an introduction to inward remedies, and after healing bodies might work cures in the soul, He separated Himself from the surrounding crowd, ascended into the retirement of a neighbouring mountain, and called His apostles to Him there, that from the height of that mystic seat He might instruct them in the loftier doctrines, signifying from the very nature of the place and act that He it was who had once honoured Moses by speaking to him: then indeed with a more terrifying justice, but now with a holier mercifulness, that what had been promised might be fulfilled when the Prophet Jeremiah says: “behold the days come when I will complete a new covenant for the house of Israel and for the house of Judah. After those days, saith the Lord, I will put My laws in their minds, and in their heart will I write them.” He therefore who had spoken to Moses, spoke also to the apostles, and the swift hand of the Word wrote and deposited the secrets of the new covenant in the disciples’ hearts: there were no thick clouds surrounding Him as of old, nor were the people frightened off from approaching the mountain by frightful sounds and lightning, but quietly and freely His discourse reached the ears of those who stood by: that the harshness of the law might give way before the gentleness of grace, and “the spirit of adoption” might dispel the terrors of bondage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252095%2520A%2520Homily%2520on%2520the%2520Beatitudes%252C%2520St%2520Matt%25205%25201-9.html'
source_title="Sermon 95, Chapter 1"
