[[commentary]]
quote='''
And then, having now tasted the vinegar, the produce of that vineyard which had degenerated in spite of its Divine Planter, and had turned to the sourness of a foreign vine, the Lord says, “it is finished;” that is, the Scriptures are fulfilled: there is no more for Me to abide from the fury of the raging people: I have endured all that I foretold I should suffer. The mysteries of weakness are completed, let the proofs of power be produced. And so He bowed the head and yielded up His Spirit and gave that Body, Which should be raised again on the third day, the rest of peaceful slumber.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252055%2520On%2520the%2520Lord%2527s%2520Passion%25204%252C%2520Delivered%2520on%2520Wednesday%2520in%2520Holy%2520Week.html'
source_title="Sermon 55, Chapter 4"
