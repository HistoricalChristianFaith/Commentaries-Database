[[commentary]]
quote='''
For in the Divine Trinity nothing is unlike or unequal, and all that can be thought concerning Its substance admits of no diversity either in power or glory or eternity. And while in the property of each Person the Father is one, the Son is another, and the Holy Ghost is another, yet the Godhead is not distinct and different; for whilst the Son is the Only begotten of the Father, the Holy Spirit is the Spirit of the Father and the Son, not in the way that every creature is the creature of the Father and the Son, but as living and having power with Both, and eternally subsisting of That Which is the Father and the Son. And hence when the Lord before the day of His Passion promised the coming of the Holy Spirit to His disciples, He said, “I have yet many things to say to you, but ye cannot bear them now. But when He, the Spirit of Truth shall have come, He shall guide you into all the Truth. For He shall not speak from Himself, but whatsoever He shall have heard, He shall speak and shall announce things to come unto you. All things that the Father hath are Mine: therefore said I that He shall take of Mine, and shall announce it to you.” Accordingly, there are not some things that are the Father’s, and other the Son’s, and other the Holy Spirit’s: but all things whatsoever the Father has, the Son also has, and the Holy Spirit also has: nor was there ever a time when this communion did not exist, because with Them to have all things is to always exist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252075%2520%2528on%2520Whitsuntide%252C%25201%2529.html'
source_title="Sermon 75, Chapter 3"
