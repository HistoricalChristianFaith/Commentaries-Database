[[commentary]]
quote='''
Whose intentions would that most naughty enemy not dare to attack? whose fasting would he not seek to break down? seeing that, as has been shown in the reading of the Gospel, he did not restrain his wiles even against the Saviour of the world Himself. For being exceedingly afraid of His fast, which lasted 40 days and nights, he wished most cunningly to discover whether this power of abstinence was given Him or His very own: for he need not fear the defeat of all his treacherous designs, if Christ were throughout subject to the same conditions as He is in body. And so he first craftily examined whether He were Himself the Creator of all things, such that He could change the natures of material things as He pleased: secondly, whether under the form of human flesh the Godhead lay concealed, to Whom it was easy to make the air His chariot, and convey His earthly limbs through space. But when the Lord preferred to resist him by the uprightness of His true Manhood, than to display the power of His Godhead, to this he turns the craftiness of his third design, that he might tempt by the lust of empire Him in Whom the signs of Divine power had failed, and entice Him to the worship of himself by promising the kingdoms of the world. But the devil’s cleverness was rendered foolish by God’s wisdom, so that the proud foe was bound by that which he had formerly bound, and did not fear to assail Him Whom it behoved to be slain for the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252042%2520On%2520Lent%252C%25204.html'
source_title="Sermon 42, Chapter 3"
