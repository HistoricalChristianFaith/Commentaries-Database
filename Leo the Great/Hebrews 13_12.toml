[[commentary]]
quote='''
For by this transference the propitiation of the spotless Lamb and the fulfilment of all mysteries passed from the circumcision to the uncircumcision, from the sons according to the flesh to the sons according to the spirit: since as the Apostle says, “Christ our Passover is sacrificed for us,” Who offering Himself to the Father a new and true sacrifice of reconciliation, was crucified not in the temple, whose worship was now at an end, and not within the confines of the city which for its sin was doomed to be destroyed, but outside, “without the camp,” that, on the cessation of the old symbolic victims, a new Victim might be placed on a new altar, and the cross of Christ might be the altar not of the temple but of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 5"
