[[commentary]]
quote='''
Believe the Son of God to be co-eternal with the Father by Whom all things were made and without Whom nothing was made, born also according to the flesh at the end of the times. Believe Him to have been in the body crucified, dead, raised up, and lifted above the heights of heavenly powers, set on the Father’s right hand, about to come in the same flesh in which He ascended, to judge the living and the dead. For this is what the Apostle proclaims to all the faithful, saying: “if ye be risen with Christ seek the things which are above, where Christ is sitting on the right hand of God. Set your mind on the things that are above, not on the things that are upon the earth. For ye are dead, and your life is hid with Christ in God. For when Christ, our life, shall appear, then shall ye also appear with Him in glory.”

Relying, therefore, dearly-beloved, on so great a promise, be heavenly not only in hope, but also in conduct.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252046%2520On%2520Lent%252C%25208.html'
source_title="Sermon 46, Chapters 3-4"

[[commentary]]
quote='''
And so, dearly-beloved, if we unhesitatingly believe with the heart what we profess with the mouth, in Christ we are crucified, we are dead, we are buried; on the very third day, too, we are raised. Hence the Apostle says, “If ye have risen with Christ, seek those things which are above, where Christ is, sitting on God’s right hand: set your affections on things above, not on things on the earth. For ye are dead, and your life is hid with Christ in God. For when Christ, your life, shall have appeared, then shall ye also appear with Him in glory.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 3"
