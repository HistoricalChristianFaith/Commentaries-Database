[[commentary]]
quote='''
For the cross of Christ, which was set up for the salvation of mortals, is both a mystery and an example: a sacrament where by the Divine power takes effect, an example whereby man’s devotion is excited: for to those who are rescued from the prisoner’s yoke Redemption further procures the power of following the way of the cross by imitation. For if the world’s wisdom so prides itself in its error that every one follows the opinions and habits and whole manner of life of him whom he has chosen as his leader, how shall we share in the name of Christ save by being inseparably united to Him, Who is, as He Himself asserted, “the Way, the Truth, and the Life?” the Way that is of holy living, the Truth of Divine doctrine, and the Life of eternal happiness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 1"
