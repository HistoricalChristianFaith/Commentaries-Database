[[commentary]]
quote='''
But he is unfaithful and unfair even to himself, who does not wish to have for ever what he esteems desirable. Let him amass what he may, let him hoard and store what he may, he will leave this world empty and needy, as David the prophet says, “for when he dieth he shall take nothing away, nor shall his glory descend with him.” Whereas if he were considerate of his own soul, he would trust his good to Him, who is both the proper Surety for the poor and the generous Repayer of loans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252017%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month%252C%25206.html'
source_title="Sermon 17, Chapter 2"
