[[commentary]]
quote='''
When Judas, therefore, at the devil’s persuasion, departed from Christ, and cut himself off from the unity of the Apostolic body, the Lord, without being disturbed by any fear, but anxious only for the salvation of those He came to redeem, spent all the time that was free from His persecutors’ attack on mystic conversation and holy teaching, as is declared in St. John’s gospel: raising His eyes to heaven and beseeching the Father for the whole Church that all whom the Father had and would give the Son might become one and remain undivided to the Redeemer’s glory, and adding lastly that prayer in which He says, “Father, if it be possible, let this cup pass from Me.” Wherein it is not to be thought that the Lord Jesus wished to escape the Passion and the Death, the sacraments of which He had already committed to His disciples’ keeping, seeing that He Himself forbids Peter, when he was burning with devoted faith and love, to use the sword, saying, “The cup which the Father hath given Me, shall I not drink it?” and seeing that that is certain which the Lord also says, according to John’s Gospel, “For God so loved the world that He gave His only begotten Son, that everyone who believes in Him may not perish, but have eternal life;” as also what the Apostle Paul says, “Christ loved us and gave Himself for us, a victim to God for a sweet-smelling savour.” For the saving of all through the Cross of Christ was the common will and the common plan of the Father and the Son; nor could that by any means be disturbed which before eternal ages had been mercifully determined and unchangeably fore-ordained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 4"
