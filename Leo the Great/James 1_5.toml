[[commentary]]
quote='''
And so, that the malice of the fretting foe may effect nothing by its rage, a keener devotion must be awaked to the performance of the Divine commands, in order that we may enter on the season, when all the mysteries of the Divine mercy meet together, with preparedness both of mind and body, invoking the guidance and help of God, that we may be strong to fulfil all things through Him, without Whom we can do nothing. For the injunction is laid on us, in order that we may seek the aid of Him Who lays it. Nor must any one excuse himself by reason of his weakness, since He Who has granted the will, also gives the power, as the blessed Apostle James says, “If any of you lack wisdom, let him ask of God, Who giveth to all liberally and upbraideth not, and it shall be given him.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252049%2520On%2520Lent%252C%252011.html'
source_title="Sermon 49, Chapter 4"
