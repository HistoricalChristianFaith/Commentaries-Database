[[commentary]]
quote='''
And though our minds must at all times be set on holiness of mind and body, yet now during these 40 days of fasting bestir yourselves to yet more active works of piety, not only in the distribution of alms, which are very effectual in attesting reform, but also in forgiving offences, and in being merciful to those accused of wrongdoing, that the condition which God has laid down between Himself and us may not be against us when we pray. For when we say, in accordance with the Lord’s teaching, “Forgive us our debts, as we also forgive our debtors,” we ought with the whole heart to carry out what we say. For then only will what we ask in the next clause come to pass, that we be not led into temptation and freed from all evils: through our Lord Jesus Christ, Who with the Father and the Holy Spirit lives and reigns for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252046%2520On%2520Lent%252C%25208.html'
source_title="Sermon 46, Chapter 4"
