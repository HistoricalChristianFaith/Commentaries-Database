[[commentary]]
quote='''
We must die, therefore, to the devil and live to God: we must perish to iniquity that we may rise to righteousness. Let the old sink, that the new may rise; and since, as says the Truth, “no one can serve two masters,” let not him be Lord who has caused the overthrow of those that stood, but Him Who has raised the fallen to victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252071%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25201%253B%2520Delivered%2520on%2520Holy%2520Saturday%2520in%2520the%2520Vigil%2520of%2520Easter%2529.html'
source_title="Sermon 71, Chapter 1"
