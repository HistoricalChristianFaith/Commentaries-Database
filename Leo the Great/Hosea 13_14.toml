[[commentary]]
quote='''
For God’s mercy towards us is the more wonderful that Christ died not for the righteous nor for the holy, but for the unrighteous and wicked; and though the nature of the Godhead could not sustain the sting of death, yet at His birth He took from us that which He might offer for us. For of old He threatened our death with the power of His death, saying by the mouth of Hosea the prophet, “O death, I will be thy death, and I will be thy destruction, O hell.” For by dying He underwent the laws of hell, but by rising again He broke them, and so destroyed the continuity of death as to make it temporal instead of eternal. “For as in Adam all die, even so in Christ shall all be made alive.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 8"
