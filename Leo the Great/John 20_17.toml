[[commentary]]
quote='''
The Son of Man and Son of God, therefore, dearly-beloved, then attained a more excellent and holier fame, when He betook Himself back to the glory of the Father’s Majesty, and in an ineffable manner began to be nearer to the Father in respect of His Godhead, after having become farther away in respect of His manhood. A better instructed faith then began to draw closer to a conception of the Son’s equality with the Father without the necessity of handling the corporeal substance in Christ, whereby He is less than the Father, since, while the Nature of the glorified Body still remained the faith of believers was called upon to touch not with the hand of flesh, but with the spiritual understanding the Only-begotten, Who was equal with the Father. Hence comes that which the Lord said after His Resurrection, when Mary Magdalene, representing the Church, hastened to approach and touch Him: “Touch Me not, for I have not yet ascended to My Father:” that is, I would not have you come to Me as to a human body, nor yet recognize Me by fleshly perceptions: I put thee off for higher things, I prepare greater things for thee: when I have ascended to My Father, then thou shalt handle Me more perfectly and truly, for thou shalt grasp what thou canst not touch and believe what thou canst not see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252074%2520%2528on%2520the%2520Lord%2527s%2520Ascension%252C%25202%2529.html'
source_title="Sermon 74, Chapter 4"
