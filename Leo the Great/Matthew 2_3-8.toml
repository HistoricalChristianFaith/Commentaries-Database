[[commentary]]
quote='''
But Herod, hearing that a prince of the Jews was born, suspected a successor, and was in great terror: and to compass the death of the Author of Salvation, pledged himself to a false homage. How happy had he been, if he had imitated the wise men’s faith, and turned to a pious use what he designed for deceit. What blind wickedness of foolish jealousy, to think thou canst overthrow the Divine plan by thy frenzy. The Lord of the world, who offers an eternal Kingdom, seeks not a temporal. Why dost thou attempt to change the unchangeable order of things ordained, and to forestall others in their crime? The death of Christ belongs not to thy time. The Gospel must be first set on foot, the Kingdom of God first preached, healings first given to the sick, wondrous acts first performed. Why dost thou wish thyself to have the blame of what will belong to another’s work, and why without being able to effect thy wicked design, dost thou bring on thyself alone the charge of wishing the evil? Thou gainest nothing and carriest out nothing by this intriguing. He that was born voluntarily shall die of His own free will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252031%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25201.html'
source_title="Sermon 31, Chapter 2"
