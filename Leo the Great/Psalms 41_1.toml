[[commentary]]
quote='''
You should "recognize" Christ "in the needy" to the extent that your resources "allow." Christ our Lord gives testimony to the fact that he is the one whom we clothe, support and feed in them. That is how strongly he has recommended the poor to us.
'''
source_url=''
source_title="SERMON 6:2"

[[commentary]]
quote='''
We exhort you, therefore, holy brethren throughout the churches of your several regions on Wednesday next to contribute of your goods, according to your means and willingness, to purposes of charity, that ye may be able to win that blessedness in which he shall rejoice without end, who “considereth the needy and poor.” And if we are to “consider” him, dearly beloved, we must use loving care and watchfulness, in order that we may find him whom modesty conceals and shamefastness keeps back. For there are those who blush openly to ask for what they want and prefer to suffer privation without speaking rather than to be put to shame by a public appeal. These are they whom we ought to “consider” and relieve from their hidden straits in order that they may the more rejoice from the very fact that their modesty as well as poverty has been consulted. And rightly in the needy and poor do we recognize the person of Jesus Christ our Lord Himself, “Who though He was rich,” as says the blessed Apostle, “became poor, that He might enrich us by His poverty.” And that His presence might never seem to be wanting to us, He so effected the mystic union of His humility and His glory that while we adore Him as King and Lord in the Majesty of the Father, we might also feed Him in His poor, for which we shall be set free in an evil day from perpetual damnation, and for our considerate care of the poor shall be joined with the whole company of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%25209%2520Upon%2520the%2520Collections%252C%25204.html'
source_title="Sermon 9, Chapter 3"

[[commentary]]
quote='''
But when the Prophet says, “Blessed is he, who considereth the poor and needy,” he is the praiseworthy distributor of clothes and food among the poor, who knows he is clothing and feeding Christ in the poor: for He Himself says, “as long as ye have done it to one of My brethren, ye have done it to Me.” And so Christ is One, True God and True Man, rich in what is His own, poor in what is ours, receiving gifts and distributing gifts, Partner with mortals, and the Quickener of the dead, so that in the “name of Jesus every knee should bow, of things in heaven, of things on earth, and of things under the earth, and that every tongue should confess that the Lord Jesus Christ is in the glory of God the Father,” living and reigning with the Holy Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252091%2520on%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25206.html'
source_title="Sermon 91, Chapter 3"
