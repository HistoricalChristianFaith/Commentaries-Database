[[commentary]]
quote='''
Accordingly, dearly-beloved, that we may be able to overcome all our enemies, let us seek Divine aid by the observance of the heavenly bidding, knowing that we cannot otherwise prevail against our adversaries, unless we prevail against our own selves. For we have many encounters with our own selves: the flesh desires one thing against the spirit, and the spirit another thing against the flesh. And in this disagreement, if the desires of the body be stronger, the mind will disgracefully lose its proper dignity, and it will be most disastrous for that to serve which ought to have ruled. But if the mind, being subject to its Ruler, and delighting in gifts from above, shall have trampled under foot the allurements of earthly pleasure, and shall not have allowed sin to reign in its mortal body, reason will maintain a well-ordered supremacy, and its strongholds no strategy of spiritual wickednesses will cast down: because man has then only true peace and true freedom when the flesh is ruled by the judgment of the mind, and the mind is directed by the will of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252039%2520On%2520Lent%252C%25201.html'
source_title="Sermon 39, Chapter 2"
