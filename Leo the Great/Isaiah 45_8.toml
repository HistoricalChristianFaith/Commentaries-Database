[[commentary]]
quote='''
In this nativity of Christ, according to the prophecy of David, “truth sprang out of the earth, and righteousness looked down from heaven.” In this nativity also, Isaiah’s saying is fulfilled, “let the earth produce and bring forth salvation, and let righteousness spring up together.” For the earth of human flesh, which in the first transgressor, was cursed, in this Offspring of the Blessed Virgin only produced a seed that was blessed and free from the fault of its stock. And each one is a partaker of this spiritual origin in regeneration; and to every one when he is re-born, the water of baptism is like the Virgin’s womb; for the same Holy Spirit fills the font, Who filled the Virgin, that the sin, which that sacred conception overthrew, may be taken away by this mystical washing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 3"
