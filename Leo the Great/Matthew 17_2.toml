[[commentary]]
quote='''
And in this Transfiguration the foremost object was to remove the offence of the cross from the disciple’s heart, and to prevent their faith being disturbed by the humiliation of His voluntary Passion by revealing to them the excellence of His hidden dignity. But with no less foresight, the foundation was laid of the Holy Church’s hope, that the whole body of Christ might realize the character of the change which it would have to receive, and that the members might promise themselves a share in that honour which had already shone forth in their Head. About which the Lord had Himself said, when He spoke of the majesty of His coming, “Then shall the righteous shine as the sun in their Father’s Kingdom,” whilst the blessed Apostle Paul bears witness to the self-same thing, and says: “for I reckon that the sufferings of this time are not worthy to be compared with the future glory which shall be revealed in us:” and again, “for ye are dead, and your life is hid with Christ in God. For when Christ our life shall appear, then shall ye also appear with Him in glory.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252051%2520A%2520Homily%2520Delivered%2520on%2520the%2520Saturday%2520Before%2520the%2520Second%2520Sunday%2520in%2520Lent-On%2520the%2520Transfiguration%252C%2520S%2520Matt%252017%25201-13.html'
source_title="Sermon 51, Chapter 3"
