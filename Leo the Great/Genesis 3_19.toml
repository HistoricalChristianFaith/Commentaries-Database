[[commentary]]
quote='''
For the first man received the substance of flesh from the earth, and was quickened with a rational spirit by the in-breathing of his Creator, so that living after the image and likeness of his Maker, he might preserve the form of God’s goodness and righteousness as in a bright mirror. And, if he had perseveringly maintained this high dignity of his nature by observing the Law that was given him, his uncorrupt mind would have raised the character even of his earthly body to heavenly glory. But because in unhappy rashness he trusted the envious deceiver, and agreeing to his presumptuous counsels, preferred to forestall rather than to win the increase of honour that was in store for him, not only did that one man, but in him all that came after him also hear the verdict: “earth thou art, and unto earth shalt thou go;” “as in the earthy,” therefore, “such are they also that are earthy,” and no one is immortal, because no one is heavenly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 2"

[[commentary]]
quote='''
Keep far from your hearts, dearly beloved, the poisonous lies of the devil’s inspirations, and knowing that the eternal Godhead of the Son underwent no growth while with the Father, be wise and consider that to the same nature to which it was said in Adam, “Thou art earth, and unto earth shalt thou go,” it is said in Christ, “sit Thou on My right hand.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 6"
