[[commentary]]
quote='''
Renounce pleasure, turn away from uncleanness, dispel luxury, flee unrighteousness, resist falsehood. When you see that you are waging a battle on many fronts, then you must also, in imitation of the martyrs, pursue a many-sided victory. Every time we die to sins, the sins die in us, and this "death of his holy ones is precious in the sight of the Lord," because a "human being" dies "to the world" not by the destruction of senses but by the death of vices.
'''
source_url=''
source_title="SERMON 84B.2"

[[commentary]]
quote='''
Thither came also thy blessed brother-Apostle Paul, “the vessel of election,” and the special teacher of the Gentiles, and was associated with thee at a time when all innocence, all modesty, all freedom was in jeopardy under Nero’s rule. Whose fury, inflamed by excess of all vices, hurled him headlong into such a fiery furnace of madness that he was the first to assail the Christian name with a general persecution, as if God’s Grace could be quenched by the death of saints, whose greatest gain it was to win eternal happiness by contempt of this fleeting life. “Precious,” therefore, “in the eyes of the Lord is the death of His saints:” nor can any degree of cruelty destroy the religion which is founded on the mystery of Christ’s cross. Persecution does not diminish but increase the church, and the Lord’s field is clothed with an ever richer crop, while the grains, which fall singly, spring up and are multiplied a hundred-fold. Hence how large a progeny have sprung from these two Heaven-sown seeds is shown by the thousands of blessed martyrs, who, rivalling the Apostles’ triumphs, have traversed the city far and wide in purple-clad and ruddy-gleaming throngs, and crowned it, as it were with a single diadem of countless gems.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252082%2520On%2520the%2520Feast%2520Of%2520the%2520Apostles%2520Peter%2520and%2520Paul%2520%2528June%252029%2529.html'
source_title="Sermon 82, Chapter 6"
