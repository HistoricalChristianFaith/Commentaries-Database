[[commentary]]
quote='''
Now the manifestation of this unspeakable mercy, dearly-beloved, came to pass when Herod held the royal power in Judea, where the legitimate succession of Kings having failed and the power of the High-priests having been overthrown, an alien-born had gained the sovereignty: that the rising of the true King might be attested by the voice of prophecy, which had said: “a prince shall not fail from Juda, nor a leader from his loins, until He come for whom it is reserved, and He shall be the expectation of the nations.” Concerning which an innumerable succession was once promised to the most blessed patriarch Abraham to be begotten not by fleshly seed but by fertile faith; and therefore it was compared to the stars in multitude that as father of all the nations he might hope not for an earthly but for a heavenly progeny. And therefore, for the creating of the promised posterity, the heirs designated under the figure of the stars are awakened by the rising of a new star, that the ministrations of the heaven might do service in that wherein the witness of the heaven had been adduced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 2"
