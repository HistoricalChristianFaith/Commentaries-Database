[[commentary]]
quote='''
Therefore beginning, dearly-beloved, to handle once more the Gospel-story of the Lord’s Passion, we understand it was part of the Divine plan that the profane chiefs of the Jews and the unholy priests, who had often sought occasion of venting their rage on Christ, should receive the power of exercising their fury at no other time than the Paschal festival. For the things which had long been promised under mysterious figures had to be fulfilled in all clearness; for instance, the True Sheep had to supersede the sheep which was its antitype, and the One Sacrifice to bring to an end the multitude of different sacrifices. For all those things which had been divinely ordained through Moses about the sacrifice of the lamb had prophesied of Christ and truly announced the slaying of Christ. In order, therefore, that the shadows should yield to the substance and types cease in the presence of the Reality, the ancient observance is removed by a new Sacrament, victim passes into Victim, blood is wiped away by Blood, and the law-ordained Feast is fulfilled by being changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252058%2520%2528on%2520the%2520Passion%252C%25207%2529.html'
source_title="Sermon 58, Chapter 1"
