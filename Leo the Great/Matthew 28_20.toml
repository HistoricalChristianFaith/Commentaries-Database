[[commentary]]
quote='''
(Serm. 72. 3.) For by ascending into heaven He does not desert His adopted; but from above strengthens to endurance, those whom He invites upwards to glory.
Of which glory may Christ make us partakers,
Who is the King of glory,
God blessed for ever,
AMEN.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There is no doubt therefore, dearly-beloved, that man’s nature has been received by the Son of God into such a union that not only in that Man Who is the first-begotten of all creatures, but also in all His saints there is one and the self-same Christ, and as the Head cannot be separated from the members, so the members cannot be separated from the Head. For although it is not in this life, but in eternity that God is to be “all in all,” yet even now He is the inseparable Inhabitant of His temple, which is the Church, according as He Himself promised, saying, “Lo! I am with you all the days till the end of the age.” And agreeably therewith the Apostle says, “He is the head of the body, the Church, which is the beginning, the first-begotten from the dead, that in all things He may have the pre-eminence, because in Him it was pleasing that all fulness (of the Godhead) should dwell, and that through Him all things should be reconciled in Himself.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 3"

[[commentary]]
quote='''
But that the hearts of the faithful may know that they have that whereby to spurn the lusts of the world and be lifted to the wisdom that is above, the Lord promises us His presence, saying, “Lo! I am with you all the days, even till the end of the age.” For not in vain had the Holy Ghost said by Isaiah: “Behold! a virgin shall conceive and shall bear a Son, and they shall call His name Emmanuel, which is, being interpreted, God with us.” Jesus, therefore, fulfils the proper meaning of His name, and in ascending into the heavens does not forsake His adopted brethren, though “He sitteth at the right hand of the Father,” yet dwells in the whole body, and Himself from above strengthens them for patient waiting while He summons them upwards to His glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 3"
