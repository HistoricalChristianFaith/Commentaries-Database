[[commentary]]
quote='''
For the supplication, which is supported by works of piety, is most efficacious in prevailing with God, since he who turns not his heart away from the poor soon turns himself to hear the Lord, as the Lord says: “be ye merciful as your Father also is merciful . . . . release and ye shall be released.” What is kinder than this justice? what more merciful than this retribution, where the judge’s sentence rests in the power of him that is to be judged? “Give,” he says, “and it shall be given to you.” How soon do the misgivings of distrust and the puttings off of avarice fall to the ground, when humanity may fearlessly spend what the Truth pledges Himself to repay.

Be stedfast, Christian giver: give what you may receive, sow what you may reap, scatter what you may gather. Fear not to spend, sigh not over the doubtfulness of the gain. Your substance grows when it is wisely dispensed. Set your heart on the profits due to mercy, and traffic in eternal gains. Your Recompenser wishes you to be munificent, and He who gives that you may have, commands you to spend, saying, “Give, and it shall be given to you.” You must thankfully embrace the conditions of this promise. For although you have nothing that you did not receive, yet you cannot fail to have what you give. He therefore that loves money, and wishes to multiply his wealth by immoderate profits, should rather practise this holy usury and grow rich by such money-lending, in order not to catch men hampered with difficulties, and by treacherous assistance entangle them in debts which they can never pay, but to be His creditor and His money-lender, who says, “Give, and it shall be given to you,” and “with what measure ye measure, it shall be measured again to you.” But he is unfaithful and unfair even to himself, who does not wish to have for ever what he esteems desirable. Let him amass what he may, let him hoard and store what he may, he will leave this world empty and needy, as David the prophet says, “for when he dieth he shall take nothing away, nor shall his glory descend with him.” Whereas if he were considerate of his own soul, he would trust his good to Him, who is both the proper Surety for the poor and the generous Repayer of loans. But unrighteous and shameless avarice, which promises to do some kind act but eludes it, trusts not God, whose promises never fail, and trusts man, who makes such hasty bargains; and while he reckons the present more certain than the future, often deservedly finds that his greed for unjust gain is the cause of by no means unjust loss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252017%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month%252C%25206.html'
source_title="Sermon 17, Chapters 1-2"
