[[commentary]]
quote='''
For although “by hope we were saved,” and still bear about with us a flesh that is corruptible and mortal, yet we are rightly said not to be in the flesh, if the fleshly affections do not dominate us, and are justified in ceasing to be named after that, the will of which we do not follow. And so, when the Apostle says, “make not provision for the flesh in the lusts thereof,” we understand that those things are not forbidden us, which conduce to health and which human weakness demands, but because we may not satisfy all our desires nor indulge in all that the flesh lusts after, we recognize that we are warned to exercise such self-restraint as not to permit what is excessive nor refuse what is necessary to the flesh, which is placed under the mind’s control. And hence the same Apostle says in another place, “For no one ever hated his own flesh, but nourisheth and cherisheth it;” in so far, of course, as it must be nourished and cherished not in vices and luxury, but with a view to its proper functions, so that nature may recover herself and maintain due order, the lower parts not prevailing wrongfully and debasingly over the higher, nor the higher yielding to the lower, lest if vices overpower the mind, slavery ensues where there should be supremacy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252071%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25201%253B%2520Delivered%2520on%2520Holy%2520Saturday%2520in%2520the%2520Vigil%2520of%2520Easter%2529.html'
source_title="Sermon 71, Chapter 5"
