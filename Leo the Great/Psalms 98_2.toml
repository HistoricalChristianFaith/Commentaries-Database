[[commentary]]
quote='''
This day David sang of in the psalms saying: “all nations that thou hast made shall come and worship before Thee, O Lord: and they shall glorify Thy name;” and again: “The Lord hath made known His salvation: His righteousness hath He openly showed in the sight of the nations.” This in good truth we know to have taken place ever since the three wise men aroused in their far-off land were led by a star to recognize and worship the King of heaven and earth, [which to those who gaze aright ceases not daily to appear. And if it could make Christ known when concealed in infancy, how much more able was it to reveal Him when reigning in majesty].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 5"
