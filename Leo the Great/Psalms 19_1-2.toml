[[commentary]]
quote='''
Accordingly we keep the spring fast in Lent, the summer fast at Whitsuntide, the autumn fast in the seventh month, and the winter fast in this which is the tenth month, knowing that there is nothing unconnected with the Divine commands, and that all the elements serve the Word of God to our instruction, so that from the very hinges on which the world turns, as if by four gospels we learn unceasingly what to preach and what to do. For, when the prophet says, “The heavens declare the glory of God, and the firmament showeth His handiwork: day unto day uttereth speech, and night showeth knowledge,” what is there by which the Truth does not speak to us? By day and by night His voices are heard, and the beauty of the things made by the workmanship of the One God ceases not to instil the teachings of Reason into our hearts’ ears, so that “the invisible things of God may be perceived and seen through the things which are made,” and men may serve the Creator of all, not His creatures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252019%2520On%2520the%2520Fast%2520of%2520the%2520Ten%2520Month%252C%25208.html'
source_title="Sermon 19, Chapter 2"
