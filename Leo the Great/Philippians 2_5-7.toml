[[commentary]]
quote='''
For amid all the changes of this life which is full of various afflictions, we ought to remember the Apostle’s exhortation; whereby he instructs us, saying, “Let this mind be in you which was also in Christ Jesus: Who being in the form of God counted it not robbery to be equal with God, but emptied Himself, taking the form of a bond-servant, being made in the likeness of men and found in fashion as a man. Wherefore God also exalted Him, and gave Him a name which is above every name, that in the name of Jesus every knee should bow of things in heaven, of things on earth, and of things below, and that every tongue should confess that the Lord Jesus Christ is in the glory of God the Father.” If, he says, you understand “the mystery of great godliness,” and remember what the Only-begotten Son of God did for the salvation of mankind, “have that mind in you which was also in Christ Jesus,” Whose humility is not to be scorned by any of the rich, not to be thought shame of by any of the high-born. For no human happiness whatever can reach so great a height as to reckon it a source of shame to himself that God, abiding in the form of God, thought it not unworthy of Himself to take the form of a slave.

Imitate what He wrought: love what He loved, and finding in you the Grace of God, love in Him your nature in return, since as He was not dispossessed of riches in poverty, lessened not glory in humility, lost not eternity in death, so do ye, too, treading in His footsteps, despise earthly things that ye may gain heavenly: for the taking up of the cross means the slaying of lusts, the killing of vices, the turning away from vanity, and the renunciation of all error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapters 4-5"
