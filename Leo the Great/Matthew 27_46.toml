[[commentary]]
quote='''
Hence it is that the Lord Jesus Christ, our Head, representing all the members of His body in Himself, and speaking for those whom He was redeeming in the punishment of the cross, uttered that cry which He had once uttered in the psalm, “O God, My God, look upon Me: why hast Thou forsaken Me?” That cry, dearly-beloved, is a lesson, not a complaint. For since in Christ there is one person of God and man, and He could not have been forsaken by Him, from Whom He could not be separated, it is on behalf of us, trembling and weak ones, that He asks why the flesh that is afraid to suffer has not been heard. For when the Passion was beginning, to cure and correct our weak fear He had said, “Father, if it be possible, let this cup pass from Me: nevertheless not as I will but as Thou;” and again, “Father, if this cup cannot pass except I drink it, Thy will be done.” As therefore He had conquered the tremblings of the flesh, and had now accepted the Father’s will, and trampling all dread of death under foot, was then carrying out the work of His design, why at the very time of His triumph over such a victory does He seek the cause and reason of His being forsaken, that is, not heard, save to show that the feeling which He entertained in excuse of His human fears is quite different from the deliberate choice which, in accordance with the Father’s eternal decree, He had made for the reconciliation of the world? And thus the very cry of “Unheard” is the exposition of a mighty Mystery, because the Redeemer’s power would have conferred nothing on mankind if our weakness in Him had obtained what it sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252067%2520%2528on%2520the%2520Passion%252C%252016%253A%2520Delivered%2520on%2520the%2520Sunday%2529.html'
source_title="Sermon 67, Chapter 7"

[[commentary]]
quote='''
The last discourse, dearly-beloved, of which we desire now to give the promised portion, had reached that point in the argument where we were speaking of that cry which the crucified Lord uttered to the Father: we bade the simple and unthinking hearer not take the words “My God, &c.,” in a sense as if, when Jesus was fixed upon the wood of the cross, the Omnipotence of the Father’s Deity had gone away from Him; seeing that God’s and Man’s Nature were so completely joined in Him that the union could not be destroyed by punishment nor by death. For while each substance retained its own properties, God neither held aloof from the suffering of His body nor was made passible by the flesh, because the Godhead which was in the Sufferer did not actually suffer. And hence, in accordance with the Nature of the Word made Man, He Who was made in the midst of all is the same as He through Whom all things were made. He Who is arrested by the hands of wicked men is the same as He Who is bound by no limits. He Who is pierced with nails is the same as He Whom no wound can affect. Finally, He Who underwent death is the same as He Who never ceased to be eternal, so that both facts are established by indubitable signs, namely, the truth of the humiliation in Christ and the truth of the majesty; because Divine power joined itself to human frailty to this end, that God, while making what was ours His, might at the same time make what was His ours. The Son, therefore, was not separated from the Father, nor the Father from the Son; and the unchangeable Godhead and the inseparable Trinity did not admit of any division. For although the task of undergoing Incarnation belonged peculiarly to the Only-begotten Son of God, yet the Father was not separated from the Son any more than the flesh was separated from the Word.

Jesus, therefore, cried with a loud voice, saying, “Why hast Thou forsaken Me?” in order to notify to all how it behoved Him not to be rescued, not to be defended, but to be given up into the hands of cruel men, that is to become the Saviour of the world and the Redeemer of all men, not by misery but by mercy; and not by the failure of succour but by the determination to die. But what must we feel to be the intercessory power of His life Who died and rose again by His own inherent power. For the blessed Apostle says that the Father “spared not His own Son, but gave Him up for us all;” and again, he says, “For Christ loved the Church, and gave Himself up for her, that He might sanctify it.” And hence the giving up of the Lord to His Passion was as much of the Father’s as of His own will, so that not only did the Father “forsake” Him, but He also abandoned Himself in a certain sense, not in hasty flight, but in voluntary withdrawal. For the might of the Crucified restrained itself from those wicked men, and in order to avail Himself of a secret design, He refused to avail Himself of His open power. For how would He who had come to destroy death and the author of death by His Passion have saved sinners, if he had resisted His persecutors?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapters 1-2"
