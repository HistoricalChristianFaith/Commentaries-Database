[[commentary]]
quote='''
Keep far from your hearts, dearly beloved, the poisonous lies of the devil’s inspirations, and knowing that the eternal Godhead of the Son underwent no growth while with the Father, be wise and consider that to the same nature to which it was said in Adam, “Thou art earth, and unto earth shalt thou go,” it is said in Christ, “sit Thou on My right hand.” According to that Nature, whereby Christ is equal to the Father, the Only-begotten was never inferior to the sublimity of the Father; nor was the glory which He had with the Father a temporal possession; for He is on the very right hand of the Father, of which it is said in Exodus, “Thy right hand, O Lord, is glorified in power;” and in Isaiah, “Lord, who hath believed our report? and the arm of the Lord, to whom is it revealed?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 6"
