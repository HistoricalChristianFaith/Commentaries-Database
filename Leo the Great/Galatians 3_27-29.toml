[[commentary]]
quote='''
For the one Faith justifies the saints of all ages, and to the self-same hope of the faithful pertains all that by Jesus Christ, the Mediator between God and man, we acknowledge done, or our fathers reverently accepted as to be done. And between Jew and Gentile there is no distinction, since, as the Apostle says, “Circumcision is nothing, and uncircumcision is nothing, but the keeping of God’s commands,” and if they be kept in entirety of faith, they make Christians the true sons of Abraham, that is perfect, for the same Apostle says, “For whosoever of you were baptized in Christ Jesus, have put on Christ. There is neither Jew nor Greek: there is neither slave nor free: there is neither male nor female. For ye are all one in Christ. But if ye are Christ’s, then are ye Abraham’s seed, heirs according to promise.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 2"
