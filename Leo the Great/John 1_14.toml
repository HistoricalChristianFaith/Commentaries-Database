[[commentary]]
quote='''
Therefore the Word of God, Himself God, the Son of God who “in the beginning was with God,” through whom “all things were made” and “without” whom “was nothing made,” with the purpose of delivering man from eternal death, became man: so bending Himself to take on Him our humility without decrease in His own majesty, that remaining what He was and assuming what He was not, He might unite the true form of a slave to that form in which He is equal to God the Father, and join both natures together by such a compact that the lower should not be swallowed up in its exaltation nor the higher impaired by its new associate. Without detriment therefore to the properties of either substance which then came together in one person, majesty took on humility, strength weakness, eternity mortality: and for the paying off of the debt, belonging to our condition, inviolable nature was united with passible nature, and true God and true man were combined to form one Lord, so that, as suited the needs of our case, one and the same Mediator between God and men, the Man Christ Jesus, could both die with the one and rise again with the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252021%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25201.html'
source_title="Sermon 21, Chapter 2"

[[commentary]]
quote='''
In Christ, therefore, born of the Virgin’s womb, the nature does not differ from ours, because His nativity is wonderful. For He Who is true God, is also true man: and there is no lie in either nature. “The Word became flesh” by exaltation of the flesh, not by failure of the Godhead: which so tempered its power and goodness as to exalt our nature by taking it, and not to lose His own by imparting it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252024%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25204.html'
source_title="Sermon 24, Chapter 3"

[[commentary]]
quote='''
Inasmuch as whether it be the testimony of the Law, or the oracles of the prophets, or the trumpet of the gospel to which we apply our inward ear, that is true which the blessed John full of the Holy Spirit uttered with his voice of thunder: “in the beginning was the Word: and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made through Him, and without Him was nothing made.” And similarly is it true what the same preacher added: “the Word became flesh and dwelt in us: and we beheld His glory, the glory as of the only-begotten of the Father.” Therefore in both natures it is the same Son of God taking what is ours and not losing what is His own; renewing man in His manhood, but enduring unchangeable in Himself. For the Godhead which is His in common with the Father underwent no loss of omnipotence, nor did the “form of a slave” do despite to the “form of God,” because the supreme and eternal Essence, which lowered Itself for the salvation of mankind, transferred us into Its glory, but did not cease to be what It was. And hence when the Only-begotten of God confesses Himself less than the Father, and yet calls Himself equal with Him, He demonstrates the reality of both forms in Himself: so that the inequality proves the human nature, and the equality the Divine.

The bodily Nativity therefore of the Son of God took nothing from and added nothing to His Majesty because His unchangeable substance could be neither diminished nor increased. For that “the Word became flesh” does not signify that the nature of God was changed into flesh, but that the Word took the flesh into the unity of His Person: and therein undoubtedly the whole man was received, with which within the Virgin’s womb fecundated by the Holy Spirit, whose virginity was destined never to be lost, the Son of God was so inseparably united that He who was born without time of the Father’s essence was Himself in time born of the Virgin’s womb. For we could not otherwise be released from the chains of eternal death but by Him becoming humble in our nature, Who remained Almighty in His own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252027%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25207.html'
source_title="Sermon 27, Chapters 1-2"

[[commentary]]
quote='''
The glory, dearly-beloved, of the Lord’s Passion, on which we promised to speak again to-day, is chiefly wonderful for its mystery of humility, which has both ransomed and instructed us all, that He, Who paid the price, might also impart His righteousness to us. For the Omnipotence of the Son of God, whereby He is by the same Essence equal to the Father, might have rescued mankind from the dominion of the devil by the mere exercise of Its will, had it not better suited the Divine working to conquer the opposition of the foe’s wickedness by that which had been conquered, and to restore our nature’s liberty by that very nature by which bondage had come upon the whole race. But, when the evangelist says, “The Word became flesh and dwelt in us,” and the Apostle, “God was in Christ reconciling the world to Himself,” it was shown that the Only-begotten of the Most High Father entered on such a union with human humility, that, when He took the substance of our flesh and soul, He remained one and the same Son of God by exalting our properties, not His own: because it was the weakness, not the power that had to be reinforced, so that upon the union of the creature with the Creator there should be nothing wanting of the Divine to the assumed, nor of the human to the Assuming.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252063%2520%2528on%2520the%2520Passion%252C%252012%253A%2520Preached%2520on%2520Wednesday%2529.html'
source_title="Sermon 63, Chapter 1"

[[commentary]]
quote='''
But the catholic Faith, which withstands all errors, refutes these blasphemies also at the same time, condemning Nestorius, who divides the Divine from the human, and denouncing Eutyches, who nullifies the human in the Divine; seeing that the Son of True God, Himself True God, possessing unity and equality with the Father and with the Holy Ghost, has vouchsafed likewise to be true Man, and after the Virgin Mother’s conception was not separated from her flesh and child-bearing, so uniting humanity to Himself as to remain immutably God; so imparting Godhead to man as not to destroy but enhance him by glorification. For He, Who became “the form of a slave,” ceased not to be “the form of God,” and He is not one joined with the other, but One in Both, so that ever since “the Word became Flesh” our faith is disturbed by no vicissitudes of circumstance, but whether in the miracles of power, or in the degradation of suffering, we believe Him to be both God, Who is Man, and Man, Who is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252091%2520on%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25206.html'
source_title="Sermon 91, Chapter 2"
