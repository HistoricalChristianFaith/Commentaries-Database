[[commentary]]
quote='''
Accordingly, as God wishes us to be good, because He is good, none of His judgments ought to displease us. For not to give Him thanks in all things, what else is it but to blame Him in some degree. Man’s folly too often dares to murmur against his Creator, not only in time of want, but also in time of plenty, so that, when something is not supplied, he complains, and when certain things are in abundance he is ungrateful. The lord of rich harvests thought scorn of his well-filled garners, and groaned over his abundant grape-gathering: he did not give thanks for the size of the crop, but complained of its poorness. And if the ground has been less prolific than its wont in the seed it has reared, and the vines and the olives have failed in their supply of fruit, the year is accused, the elements blamed, neither the air nor the sky is spared, whereas nothing better befits and reassures the faithful and godly disciples of Truth than the persistent and unwearied lifting of praise to God, as says the Apostle, “Rejoice alway, pray without ceasing: in all things give thanks. For this is the will of God in Christ Jesus in all things for you.” But how shall we be partakers of this devotion, unless vicissitudes of fortune train our minds in constancy, so that the love directed towards God may not be puffed up in prosperity nor faint in adversity. Let that which pleases God, please us too. Let us rejoice in whatever measure of gifts He gives. Let him who has used great possessions well, use small ones also well. Plenty and scarcity may be equally for our good, and even in spiritual progress we shall not be cast down at the smallness of the results, if our minds become not dry and barren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252012%2520On%2520the%2520Fast%2520of%2520The%252C%2520Tenth%2520Month%252C%25201.html'
source_title="Sermon 12, Chapter 3"
