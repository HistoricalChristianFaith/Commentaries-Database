[[commentary]]
quote='''
The birthday of the Lord is the birthday of peace: for thus says the Apostle, “He is our peace, who made both one;” since whether we be Jew or Gentile, “through Him we have access in one Spirit to the Father.” And it was this in particular that He taught His disciples before the day of His passion which He had of His own free-will fore-ordained, saying, “My peace I give unto you, My peace I leave for you;” and lest under the general term the character of His peace should escape notice, He added, “not as the world give I unto you.” The world, He says, has its friendships, and brings many that are apart into loving harmony. There are also minds which are equal in vices., and similarity of desires produces equality of affection. And if any are perchance to be found who are not pleased with what is mean and dishonourable, and who exclude from the terms of their connexion unlawful compacts, yet even such if they be either Jews, heretics or heathens, belong not to God’s friendship but to this world’s peace. But the peace of the spiritual and of catholics coming down from above and leading upwards refuses to hold communion with the lovers of the world, resists all obstacles and flies from pernicious pleasures to true joys, as the Lord says: “Where thy treasure is, there will thy heart be also:” that is, if what you love is below you will descend to the lowest depth: if what you love is above, you will reach the topmost height: thither may the Spirit of peace lead and bring us, whose wishes and feeling are at one, and who are of one mind in faith and hope and in charity: since “as many as are led by the Spirit of God these are sons of God” Who reigneth with the Son and Holy Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 5"
