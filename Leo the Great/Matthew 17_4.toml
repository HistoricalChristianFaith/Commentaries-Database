[[commentary]]
quote='''
The Apostle Peter, therefore, being excited by the revelation of these mysteries, despising things mundane and scorning things earthly, was seized with a sort of frenzied craving for the things eternal, and being filled with rapture at the whole vision, desired to make his abode with Jesus in the place where he had been blessed with the manifestation of His glory. Whence also he says, “Lord, it is good for us to be here: if thou wilt let us make three tabernacles, one for Thee, one for Moses, and one for Elias.” But to this proposal the Lord made no answer, signifying that what he wanted was not indeed wicked, but contrary to the Divine order: since the world could not be saved, except by Christ’s death, and by the Lord’s example the faithful were called upon to believe that, although there ought not to be any doubt about the promises of happiness, yet we should understand that amidst the trials of this life we must ask for the power of endurance rather than the glory, because the joyousness of reigning cannot precede the times of suffering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252051%2520A%2520Homily%2520Delivered%2520on%2520the%2520Saturday%2520Before%2520the%2520Second%2520Sunday%2520in%2520Lent-On%2520the%2520Transfiguration%252C%2520S%2520Matt%252017%25201-13.html'
source_title="Sermon 51, Chapter 5"
