[[commentary]]
quote='''
Such then beloved was the nativity which became the Power of God and the Wisdom of God even Christ, whereby He might be one with us in manhood and surpass us in Godhead. For unless He were true God, He would not bring us a remedy, unless He were true Man, He would not give us an example. Therefore the exulting angel’s song when the Lord was born is this, “Glory to God in the Highest,” and their message, “peace on earth to men of good will.” For they see that the heavenly Jerusalem is being built up out of all the nations of the world: and over that indescribable work of the Divine love how ought the humbleness of men to rejoice, when the joy of the lofty angels is so great?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252021%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25201.html'
source_title="Sermon 21, Chapter 2"

[[commentary]]
quote='''
But in the treasures of the Lord’s bounty what can we find so suitable to the honour of the present feast as the peace, which at the Lord’s nativity was first proclaimed by the angel-choir? For that it is which brings forth the sons of God, the nurse of love and the mother of unity: the rest of the blessed and our eternal home; whose proper work and special office it is to join to God those whom it removes from the world. Whence the Apostle incites us to this good end, in saying, “being justified therefore by faith let us have peace towards God.” In which brief sentence are summed up nearly all the commandments; for where true peace is, there can be no lack of virtue. But what is it, dearly beloved, to have peace towards God, except to wish what He bids, and not to wish what He forbids? For if human friendships seek out equality of soul and similarity of desires, and difference of habits can never attain to full harmony, how will he be partaker of divine peace, who is pleased with what displeases God and desires to get delight from what he knows to be offensive to God? That is not the spirit of the sons of God; such wisdom is not acceptable to the noble family of the adopted. That chosen and royal race must live up to the dignity of its regeneration, must love what the Father loves, and in nought disagree with its Maker, lest the Lord should again say: “I have begotten and raised up sons, but they have scorned Me: the ox knoweth his owner and the ass his master’s crib: but Israel hath not known Me and My people hath not acknowledged Me.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 3"
