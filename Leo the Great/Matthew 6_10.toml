[[commentary]]
quote='''
We know indeed, as the Apostle John says that “the whole world lieth in the evil one,” and that by the stratagems of the Devil and his angels numberless attempts are made either to frighten man in his struggle upwards by adversity or to spoil him by prosperity, but “greater is He that is in us, than he that is against us,” and they who have peace with God and are always saying to the Father with their whole hearts “thy will be done” can be overcome in no battles, can be hurt by no assaults. For accusing ourselves in our confessions and refusing the spirit’s consent to our fleshly lusts, we stir up against us the enmity of him who is the author of sin, but secure a peace with God that nothing can destroy, by accepting His gracious service, in order that we may not only surrender ourselves in obedience to our King but also be united to Him by our free-will. For if we are like-minded, if we wish what He wishes, and disapprove what He disapproves, He will finish all our wars for us, He Who gave the will, will also give the power: so that we may be fellow-workers in His works, and with the exultation of Faith may utter that prophetic song: “the Lord is my light and my salvation: whom shall I fear? the Lord is the defender of my life: of whom shall I be afraid?”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252026%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25206.html'
source_title="Sermon 26, Chapter 4"

[[commentary]]
quote='''
For this reason, in the Lord’s prayer we say most devoutly, “Thy Kingdom come, Thy will be done as in heaven, so also on earth.” For what else do we ask for in these words but that God may subdue those whom He has not yet subdued, and as in heaven He makes the angels ministers of His will, so also on earth He may make men? And in seeking this we love God, we love also our neighbour: and the love within us has but one Object, since we desire the bond-servant to serve and the Lord to have rule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252090%2520%2528on%2520the%2520Fast%2520of%2520Seventh%2520Month%252C%25205%2529.html'
source_title="Sermon 90, Chapter 3"
