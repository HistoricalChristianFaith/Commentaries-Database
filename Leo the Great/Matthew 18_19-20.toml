[[commentary]]
quote='''
And the fullest abolition of sins is obtained when the whole Church offers up one prayer and one confession. For if the Lord has promised fulfilment of all they shall ask, to the holy and devout agreement of two or three, what shall be denied to many thousands of the people who unite in one act of worship, and with one breath make their common supplications?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252088%2520On%2520the%2520Fast%2520of%2520the%2520Seventh%2520Month%252C%25203.html'
source_title="Sermon 88, Chapter 3"
