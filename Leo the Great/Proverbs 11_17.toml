[[commentary]]
quote='''
For forgiveness of sins is most efficaciously prayed for with almsgiving and fasting, and supplications that are winged by such aids mount swiftly to God’s ears: since as it is written, “the merciful man doeth good to his own soul,” and nothing is so much a man’s own as that which he spends on his neighbour. For that part of his material possessions with which he ministers to the needy, is transformed into eternal riches, and such wealth is begotten of this bountifulness as can never be diminished or in any way destroyed, for “blessed are the merciful, for God shall have mercy on them,” and He Himself shall be their chief Reward, who is the Model of His own command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252016%2520On%2520the%2520Fast%2520of%2520the%2520Tenth%2520Month.html'
source_title="Sermon 16, Chapter 2"
