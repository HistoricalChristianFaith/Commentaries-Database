[[commentary]]
quote='''
For if the Incarnation of the Word is the uniting of the Divine and human natures, but by the very fact of their coming together that which was twofold became single, it was only the Godhead that was born of the Virgin’s womb, and went through the deceptive appearance of receiving nourishment and bodily growth: and to pass over all the changes of the human state, it was only the Godhead that was crucified, dead, and buried: so that according to those who thus think, there is no reason to hope for the resurrection, and Christ is not “the first-begotten from the dead;” because He was not One who ought to have been raised again, if He had not been One who could be slain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 5"
