[[commentary]]
quote='''
And surely their worship of Him exhorts us to imitation; that, as far as we can, we should serve our gracious God who invites us all to Christ. For whosoever lives religiously and chastely in the Church and “sets his mind on the things which are above, not on the things that are upon the earth,” is in some measure like the heavenly light: and whilst he himself keeps the brightness of a holy life, he points out to many the way to the Lord like a star.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252033%2520On%2520the%2520Feast%2520of%2520the%2520Epiphany%252C%25203.html'
source_title="Sermon 33, Chapter 5"
