[[commentary]]
quote='''
The decrease of worldly means should not be feared in the practice of works of mercy. Christian poverty is always rich, because what it has is more than what it has not. Nor does the poor man fear to labour in this world, to whom it is given to possess all things in the Lord of all things. Therefore those who do the things which are good must have no manner of fear lest the power of doing should fail them; since in the gospel the widow’s devotion is extolled in the case of her two mites, and voluntary bounty gets its reward for a cup of cold water. For the measure of our charitableness is fixed by the sincerity of our feelings, and he that shows mercy on others will never want for mercy himself. The holy widow of Sarepta discovered this, who offered the blessed Elias in the time of famine one day’s food, which was all she had, and putting the prophet’s hunger before her own needs, ungrudgingly gave up a handful of corn and a little oil. But she did not lose what she gave in all faith, and in the vessels emptied by her godly bounty a source of new plenty arose, that the fulness of her substance might not be diminished by the holy purpose to which she had put it, because she had never dreaded being brought to want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252042%2520On%2520Lent%252C%25204.html'
source_title="Sermon 42, Chapter 2"
