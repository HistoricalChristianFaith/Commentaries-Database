[[commentary]]
quote='''
But this exalted and highly-praised understanding, dearly-beloved, had also to be instructed on the mystery of Christ’s lower substance, lest the Apostle’s faith, being raised to the glory of confessing the Deity in Christ, should deem the reception of our weakness unworthy of the impassible God, and incongruous, and should believe the human nature to be so glorified in Him as to be incapable of suffering punishment, or being dissolved in death. And, therefore, when the Lord said that He must go to Jerusalem, and suffer many things from the elders and scribes and chief of the priests, and the third day rise again, the blessed Peter who, being illumined with light from above, was burning with the heat of his confession, rejected their mocking insults and the disgrace of the most cruel death, with, as he thought, a loyal and outspoken contempt, but was checked by a kindly rebuke from Jesus and animated with the desire to share His suffering. For the Saviour’s exhortation that followed, instilled and taught this, that they who wished to follow Him should deny themselves, and count the loss of temporal things as light in the hope of things eternal; because he alone could save his soul that did not fear to lose it for Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252051%2520A%2520Homily%2520Delivered%2520on%2520the%2520Saturday%2520Before%2520the%2520Second%2520Sunday%2520in%2520Lent-On%2520the%2520Transfiguration%252C%2520S%2520Matt%252017%25201-13.html'
source_title="Sermon 51, Chapter 2"
