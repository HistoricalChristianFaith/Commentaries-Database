[[commentary]]
quote='''
But because the Word and the Flesh is one Person, the Assumed is not separated from the Assuming nature, and the honour of being promoted is spoken of as accruing to Him that promotes, as the Apostle says in a passage we have already quoted, “Wherefore also God exalted Him and gave Him a name which is above every name.” Where the exaltation of His assumed Manhood is no doubt spoken of, so that He in Whose sufferings the Godhead remains indivisible is likewise coeternal in the glory of the Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252072%2520%2528on%2520the%2520Lord%2527s%2520Resurrection%252C%25202%2529.html'
source_title="Sermon 72, Chapter 6"
