[[commentary]]
quote='''
For her virginity fecundated by the Holy Spirit at one and the same time brought forth without trace of corruption both the offspring and the Maker of her race. Hence also the same Lord, as the Evangelist relates, asked of the Jews whose son they had learnt Christ to be on the authority of the Scriptures, and when they replied that the tradition was He would come of David’s seed, “How,” saith He, “doth David in the Spirit call Him Lord, saying, the Lord said to my Lord: sit thou on My right hand till I place thy enemies as the footstool of thy feet?” And the Jews could not solve the question put, because they did not understand that in the one Christ both the stock of David and the Divine nature were there prophesied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 2"

[[commentary]]
quote='''
Keep far from your hearts, dearly beloved, the poisonous lies of the devil’s inspirations, and knowing that the eternal Godhead of the Son underwent no growth while with the Father, be wise and consider that to the same nature to which it was said in Adam, “Thou art earth, and unto earth shalt thou go,” it is said in Christ, “sit Thou on My right hand.” According to that Nature, whereby Christ is equal to the Father, the Only-begotten was never inferior to the sublimity of the Father; nor was the glory which He had with the Father a temporal possession; for He is on the very right hand of the Father, of which it is said in Exodus, “Thy right hand, O Lord, is glorified in power;” and in Isaiah, “Lord, who hath believed our report? and the arm of the Lord, to whom is it revealed?” The man, therefore, assumed into the Son of God, was in such wise received into the unity of Christ’s Person from His very commencement in the body, that without the Godhead He was not conceived, without the Godhead He was not brought forth, without the Godhead He was not nursed. It was the same Person in the wondrous acts, and in the endurance of insults; through His human weakness crucified, dead and buried: through His Divine power, being raised the third day, He ascended to the heavens, sat down at the right hand of the Father, and in His nature as man received from the Father that which in His nature as God He Himself also gave.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252028%2520On%2520the%2520Festival%2520of%2520the%2520Nativity%252C%25208.html'
source_title="Sermon 28, Chapter 6"
