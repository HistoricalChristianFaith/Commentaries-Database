[[commentary]]
quote='''
O wondrous power of the Cross! O ineffable glory of the Passion, in which is contained the Lord’s tribunal, the world’s judgment, and the power of the Crucified! For thou didst draw all things unto Thee, Lord and when Thou hadst stretched out Thy hands all the day, long to an unbelieving people that gainsaid Thee, the whole world at last was brought to confess Thy majesty. Thou didst draw all things unto Thee, Lord, when all the elements combined to pronounce judgment in execration of the Jews’ crime, when the lights of heaven were darkened, and the day turned into night, and the earth also was shaken with unwonted shocks, and all creation refused to serve those wicked men. Thou didst draw all things unto Thee, Lord, for the veil of the temple was rent, and the Holy of Holies existed no more for those unworthy high-priests: so that type was turned into Truth, prophecy into Revelation, law into Gospel. Thou didst draw all things unto Thee, Lord, so that what before was done in the one temple of the Jews in dark signs, was now to be celebrated everywhere by the piety of all the nations in full and open rite.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252059%2520%2528on%2520the%2520Passion%252C%25208%253A%2520on%2520Wednesday%2520in%2520Holy%2520Week%2529.html'
source_title="Sermon 59, Chapter 7"

[[commentary]]
quote='''
For a peerless victim was being offered to God for the world’s salvation, and the slaying of Christ the true Lamb, predicted through so many ages, was transferring the sons of promise into the liberty of the Faith. The New Testament also was being ratified, and in the blood of Christ the heirs of the eternal Kingdom were being enrolled; the High Pontiff was entering the Holy of Holies, and to intercede with God the spotless Priest was passing in through the veil of His flesh. In fine, so evident a transition was being effected from the Law to the Gospel, from the synagogue to the Church, from many sacrifices to the One Victim, that, when the Lord gave up the ghost, that mystic veil which hung before and shut out the inner part of the Temple and its holy recess was by sudden force torn from top to bottom, for the reason that Truth was displacing figures, and forerunners were needless in the presence of Him they announced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252068%2520%2528on%2520the%2520Passion%252C%252017%253A%2520Delivered%2520on%2520the%2520Wednesday%2529.html'
source_title="Sermon 68, Chapter 3"
