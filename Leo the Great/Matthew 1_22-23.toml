[[commentary]]
quote='''
(Serm. xxiii. 1.) The conception was by the Holy Spirit within the womb of the Virgin; who, as she conceived in perfect chastity, in like manner brought forth her Son.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so God, the Son of God, equal and of the same nature from the Father and with the Father, Creator and Lord of the Universe, Who is completely present everywhere, and completely exceeds all things, in the due course of time, which runs by His own disposal, chose for Himself this day on which to be born of the blessed virgin Mary for the salvation of the world, without loss of the mother’s honour. For her virginity was violated neither at the conception nor at the birth: “that it might be fulfilled,” as the Evangelist says, “which was spoken by the Lord through Isaiah the prophet, saying, behold the virgin shall conceive in the womb, and shall bear a son, and they shall call his name Emmanuel, which is interpreted, God with us.” For this wondrous child-bearing of the holy Virgin produced in her offspring one person which was truly human and truly Divine, because neither substance so retained their properties that there could be any division of persons in them; nor was the creature taken into partnership with its Creator in such a way that the One was the in-dweller, and the other the dwelling; but so that the one nature was blended with the other. And although the nature which is taken is one, and that which takes is another, yet these two diverse natures come together into such close union that it is one and the same Son who says both that, as true Man, “He is less than the Father,” and that, as true God, “He is equal with the Father.”
'''
source_url='https://historicalchristian.faith/by_father.php?file=Leo%2520the%2520Great%2FSermons%2FSermon%252023%2520On%2520the%2520Feast%2520of%2520the%2520Nativity%252C%25203.html'
source_title="Sermon 23, Chapter 1"
