[[commentary]]
quote='''
And next in the Disciples of Christ (for I omit to mention Christ Himself, in Whom He dwelt, not as energizing, but as accompanying His Equal), and that in three ways, as they were able to receive Him, and on three occasions; before Christ was glorified by the Passion, and after He was glorified by the Resurrection; and after His Ascension, or Restoration, or whatever we ought to call it, to Heaven. Now the first of these manifests Him—the healing of the sick and casting out of evil spirits, which could not be apart from the Spirit; and so does that breathing upon them after the Resurrection, which was clearly a divine inspiration; and so too the present distribution of the fiery tongues, which we are now commemorating. But the first manifested Him indistinctly, the second more expressly, this present one more perfectly, since He is no longer present only in energy, but as we may say, substantially, associating with us, and dwelling in us. For it was fitting that as the Son had lived with us in bodily form—so the Spirit too should appear in bodily form; and that after Christ had returned to His own place, He should have come down to us—Coming because He is the Lord; Sent, because He is not a rival God. For such words no less manifest the Unanimity than they mark the separate Individuality.

And therefore He came after Christ, that a Comforter should not be lacking unto us; but Another Comforter, that you might acknowledge His co-equality. For this word Another marks an Alter Ego, a name of equal Lordship, not of inequality. For Another is not said, I know, of different kinds, but of things consubstantial. And He came in the form of Tongues because of His close relation to the Word. And they were of Fire, perhaps because of His purifying Power (for our Scripture knows of a purifying fire, as any one who wishes can find out), or else because of His Substance. For our God is a consuming Fire, and a Fire burning up the ungodly; though you may again pick a quarrel over these words, being brought into difficulty by the Consubstantiality. And the tongues were cloven, because of the diversity of Gifts; and they sat to signify His Royalty and Rest among the Saints, and because the Cherubim are the Throne of God. And it took place in an Upper Chamber (I hope I am not seeming to any one over tedious), because those who should receive it were to ascend and be raised above the earth; for also certain upper chambers are covered with Divine Waters, by which the praise of God are sung. And Jesus Himself in an Upper Chamber gave the Communion of the Sacrament to those who were being initiated into the higher Mysteries, that thereby might be shewn on the one hand that God must come down to us, as I know He did of old to Moses; and on the other that we must go up to Him, and that so there should come to pass a Communion of God with men, by a coalescing of the dignity. For as long as either remains on its own footing, the One in His Glory the other in his lowliness, so long the Goodness of God cannot mingle with us, and His lovingkindness is incommunicable, and there is a great gulf between, which cannot be crossed; and which separates not only the Rich Man from Lazarus and Abraham's Bosom which he longs for, but also the created and changing natures from that which is eternal and immutable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Sections 11-12"
