[[commentary]]
quote='''
Flowers, too, I have, more blooming and lasting than all those of spring, "out of the full land that the Lord hath blessed," that is, the holy and sweet-smelling pastors and teachers, and all that is pure and choice of the congregation; with these do I desire to be crowned and to go in procession, "having fought the good fight, having finished my course, having kept the faith," according to the holy Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 35"
