[[commentary]]
quote='''
And He is the Author of spiritual regeneration. Here is your proof:—None can see or enter into the Kingdom, except he be born again of the Spirit, and be cleansed from the first birth, which is a mystery of the night, by a remoulding of the day and of the Light, by which every one singly is created anew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 14"
