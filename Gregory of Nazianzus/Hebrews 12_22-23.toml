[[commentary]]
quote='''
But, if I must treat of her case in a more philosophic and lofty strain, Gorgonia's native land was Jerusalem above, the object, not of sight but of contemplation, wherein is our commonwealth, and whereto we are pressing on: whose citizen Christ is, and whose fellow-citizens are the assembly and church of the first born who are written in heaven, and feast around its great Founder in contemplation of His glory, and take part in the endless festival; her nobility consisted in the preservation of the Image, and the perfect likeness to the Archetype, which is produced by reason and virtue and pure desire, ever more and more conforming, in things pertaining to God, to those truly initiated into the heavenly mysteries; and in knowing whence, and of what character, and for what end we came into being.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25208.html'
source_title="Oration 8, Section 6"
