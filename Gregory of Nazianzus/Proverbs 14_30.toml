[[commentary]]
quote='''
For what could be more distressing than this calamity, or call more loudly on one whose eyes were raised aloft for exertions on behalf of the common weal? The good or ill success of an individual is of no consequence to the community, but that of the community involves of necessity the like condition of the individual. With this idea and purpose, he who was the guardian and patron of the community (and, as Solomon says with truth, a perceptive heart is a moth to the bones, unsensitiveness is cheerily confident, while a sympathetic disposition is a source of pain, and constant consideration wastes away the heart), he, I say, was consequently in agony and distress from many wounds; like Jonah and David, he wished in himself to die and gave not sleep to his eyes, nor slumber to his eyelids, he expended what was left of his flesh upon his reflections, until he discovered a remedy for the evil: and sought for aid from God and man, to stay the general conflagration, and dissipate the gloom which was lowering over us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 42"
