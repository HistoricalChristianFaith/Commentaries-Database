[[commentary]]
quote='''
I have likewise a table, this spiritual one, which the Lord hath prepared for me, when He rescued me out of the hand of the oppressors, at the which I refresh myself and revel, yet do not grow wanton out of fulness, but calm down all rebellion of my passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 35"
