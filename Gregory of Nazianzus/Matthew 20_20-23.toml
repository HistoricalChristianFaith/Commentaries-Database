[[commentary]]
quote='''
In another place it is also said and understood, and perhaps it is necessary that I should add it as follows to what has already been said, in order that I may impart to you also my wealth. The Mother of the Sons of Zebedee, in an impulse of parental affection, asked a thing in ignorance of the measure of what she was asking, but pardonably, through the excess of her love and of the kindness due to her children. For there is nothing more affectionate than a Mother,—and I speak of this that I may lay down a law for honouring Mothers. Their mother, then, asked Jesus that they might sit, the one on His right hand, the other on his left. But what saith the Saviour? He first asks if they can drink the Cup which He Himself was about to drink; and when this was professed, and the Saviour accepted the profession (for He knew that they were being perfected by the same, or rather that they would be perfected thereby); what saith He? "They shall drink the cup; but to sit on My right hand and on My left—it is not Mine, He saith, to give this, but to whom it hath been given." Is then the ruling mind nothing? Nothing the labour? Nothing the reasoning? Nothing the philosophy? Nothing the fasting? Nothing the vigils, the sleeping on the ground, the shedding floods of tears? Is it for nothing of these, but in accordance with some election by lot, that a Jeremias is sanctified, and others are estranged from the womb?

I fear lest some monstrous reasoning may come in, as of the soul having lived elsewhere, and then having been bound to this body, and that it is from that other life that some receive the gift of prophecy, and others are condemned, namely, those who lived badly. But since such a conception is too absurd, and contrary to the traditions of the Church (others if they like may play with such doctrines, but it is unsafe for us to play with them); we must in this place too add to the words "To whom it hath been given," this, "who are worthy;" who have not only received this character from the Father, but have given it to themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 14-15"
