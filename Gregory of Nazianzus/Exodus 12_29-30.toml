[[commentary]]
quote='''
Then the last and gravest plague upon the persecutors, truly worthy of the night; and Egypt mourns the first-born of her own reasonings and actions which are also called in the Scripture the Seed of the Chaldeans removed, and the children of Babylon dashed against the rocks and destroyed; and the whole air is full of the cry and clamour of the Egyptians; and then the Destroyer of them shall withdraw from us in reverence of the Unction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 15"
