[[commentary]]
quote='''
Let thy fountain of water, it says, be only thine own, and let no stranger share it with thee; and, let the colt of thy favours and the stag of thy love company with thee; do thou then take care not to be a strange river, nor to please others better than thine own wife. But if thou be carried elsewhere, then thou makest a law of lewdness for thy partner also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 8"
