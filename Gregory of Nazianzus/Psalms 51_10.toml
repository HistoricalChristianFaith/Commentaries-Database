[[commentary]]
quote='''
I find also the heart and inward parts deemed worthy of honour. David convinces me of this, when he prays that a clean heart may be created in him, and a right spirit renewed in his inward parts; meaning, I think, the mind and its movements or thoughts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 39"
