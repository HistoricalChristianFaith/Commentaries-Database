[[commentary]]
quote='''
Let us conquer those that have oppressed us, with clemency; and above all let humanity be our director, and the force of that commandment which promises us like for like mercy whenever we need the same; for "with what measure ye mete, with the same shall it be measured to you again," as we well know. And if any of you feel exceedingly bitter, let us leave to God those who have vexed us, and to the tribunal of the next world; let us not diminish aught of the coming wrath by means of our own violence; let us not think of confiscation; let us not bring them before the tribunals; let us not banish them from their country; let us not torture them with scourges, nor, to sum up all, let us not do to them anything of all that they have done to us. Let us make them better, if perchance that be possible, by our own example. If any one's father has been a sufferer, or his son, or wife, or kinsman, or friend, or any of those dear to him, let us render the suffering profitable to them by persuading them to bear patiently the things which they have suffered; in this way we shall do them a greater favour than in any other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 37"
