[[commentary]]
quote='''
But since you hold so very close to the letter (although you are contending against the letter), pray take your demonstrations from this source. There are in the Book of Proverbs three things which go well, a lion, a goat, and a cock; and to these is added a fourth;—a King making a speech before the people, to pass over the other sets of four which are there counted up, although things of various natures. And I find in Moses two Cherubim counted singly. But now, in your technology, could either the former things be called three, when they differ so greatly in their nature, or the latter be treated as units when they are so closely connected and of one nature? For if I were to speak of God and Mammon, as two masters, reckoned under one head, when they are so very different from each other, I should probably be still more laughed at for such a connumeration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 18"
