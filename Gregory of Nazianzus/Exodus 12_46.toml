[[commentary]]
quote='''
Well, let them lament; we will feed on the Lamb toward evening—for Christ's Passion was in the completion of the ages; because too He communicated His Disciples in the evening with His Sacrament, destroying the darkness of sin; and not sodden, but roast—that our word may have in it nothing that is unconsidered or watery, or easily made away with; but may be entirely consistent and solid, and free from all that is impure and from all vanity. And let us be aided by the good coals, kindling and purifying our minds from Him That cometh to send fire on the earth, that shall destroy all evil habits, and to hasten its kindling. Whatsoever then there be, of solid and nourishing in the Word, shall be eaten with the inward parts and hidden things of the mind, and shall be consumed and given up to spiritual digestion; aye, from head to foot, that is, from the first contemplations of Godhead to the very last thoughts about the Incarnation. Neither let us carry aught of it abroad, nor leave it till the morning; because most of our Mysteries may not be carried out to them that are outside, nor is there beyond this night any further purification; and procrastination is not creditable to those who have a share in the Word. For just as it is good and well-pleasing to God not to let anger last through the day, but to get rid of it before sunset, whether you take this of time or in a mystical sense, for it is not safe for us that the Sun of Righteousness should go down upon our wrath; so too we ought not to let such Food remain all night, nor to put it off till to-morrow. But whatever is of bony nature and not fit for food and hard for us even to understand, this must not be broken; that is, badly divined and misconceived (I need not say that in the history not a bone of Jesus was broken, even though His death was hastened by His crucifiers on account of the Sabbath); nor must it be stripped off and thrown away, lest that which is holy should be given to the dogs, that is, to the evil hearers of the Word; just as the glorious pearl of the Word is not to be cast before swine; but it shall be consumed with the fire with which the burnt offerings also are consumed, being refined and preserved by the Spirit That searcheth and knoweth all things, not destroyed in the waters, nor scattered abroad as the calf's head which was hastily made by Israel was by Moses, for a reproach for their hardness of heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 16"
