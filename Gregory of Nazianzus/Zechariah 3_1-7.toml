[[commentary]]
quote='''
Whenever I remember Zechariah, I shudder at the reaping-hook, and likewise at his testimony against the priests, his hints in reference to the celebrated Joshua, the high priest, whom he represents as stripped of filthy and unbecoming garments and then clothed in rich priestly apparel. As for the words and charges to Joshua which he puts into the angel's mouth, let them be treated with silent respect, as referring perhaps to a greater and higher object than those who are many priests: but even at his right hand stood the devil, to resist him. A fact, in my eyes, of no slight significance, and demanding no slight fear and watchfulness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 62"
