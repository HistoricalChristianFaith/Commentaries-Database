[[commentary]]
quote='''
And may the victory rest with that which will be for the profit of both you and me, under the Spirit's guidance of our affairs, (for our discourse comes back again to the same point,) to Whom we have given ourselves, and the head anointed with the oil of perfection, in the Almighty Father, and the Only-begotten Son, and the Holy Spirit, Who is God. For how long shall we hide the lamp under the bushel, and withhold from others the full knowledge of the Godhead, when it ought to be now put upon the lampstand and give light to all churches and souls and to the whole fulness of the world, no longer by means of metaphors, or intellectual sketches, but by distinct declaration? And this indeed is a most perfect setting forth of Theology to those who have been deemed worthy of this grace in Christ Jesus Himself, our Lord, to Whom be glory, honour, and power for ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252012.html'
source_title="Oration 12, Section 6"
