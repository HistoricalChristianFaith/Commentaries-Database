[[commentary]]
quote='''
But why should I paint for you the portrait of the man? St. Paul has sketched him by anticipation. This he does, when he sings the praises of the great High-priest, who hath passed through the heavens (for I will venture to say even this, since Scripture can call those who live according to Christ by the name of Christs): and again when by the rules in his letter to Timothy, he gives a model for future Bishops: for if you will apply the law as a test to him who deserves these praises, you will clearly perceive his perfect exactness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 10"
