[[commentary]]
quote='''
In praising Athanasius, I shall be praising virtue. To speak of him and to praise virtue are identical, because he had, or, to speak more truly, has embraced virtue in its entirety. For all who have lived according to God still live unto God, though they have departed hence. For this reason, God is called the God of Abraham, Isaac and Jacob, since He is the God, not of the dead, but of the living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 1"
