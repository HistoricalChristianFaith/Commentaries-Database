[[commentary]]
quote='''
Sow in good season, and gather together, and open thy barns when it is the time to do so; and plant in season, and let the clusters be cut when they are ripe, and launch boldly in spring, and draw thy ship on shore again at the beginning of winter, when the sea begins to rage. And let there be to thee also a time for war and a time for peace; a time to marry, and a time to abstain from marrying; a time for friendship, and a time for discord, if this be needed; and in short a time for everything, if you will follow Solomon's advice. And it is best to do so, for the advice is profitable. But the work of your salvation is one upon which you should be engaged at all times; and let every time be to you the definite one for Baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 14"
