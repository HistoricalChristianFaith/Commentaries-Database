[[commentary]]
quote='''
We both believe in and hear of the dregs of the anger of God, the residuum of His dealings with those who deserve it: For the Lord is a God of vengeance. For although He is disposed by His kindness to gentleness rather than severity, yet He does not absolutely pardon sinners, lest they should be made worse by His goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252018.html'
source_title="Oration 18, Section 25"
