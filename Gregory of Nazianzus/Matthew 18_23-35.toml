[[commentary]]
quote='''
If you find a debtor falling at your feet, tear up every document, whether just or unjust. Remember the ten thousand talents which Christ forgave you, and be not a harsh exactor of a smaller debt—and that from whom? From your fellow servant, you who were forgiven so much more by the Master. Otherwise you will have to give satisfaction to His mercy, which you would not imitate and take as your copy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 31"
