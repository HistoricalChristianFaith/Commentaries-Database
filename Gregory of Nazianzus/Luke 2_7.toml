[[commentary]]
quote='''
This is why the new was substituted for the old, why He Who suffered was for suffering recalled to life, why each property of His, Who was above us, was interchanged with each of ours, why the new mystery took place of the dispensation, due to loving kindness which deals with him who fell through disobedience. This is the reason for the generation and the virgin, for the manger and Bethlehem; the generation on behalf of the creation, the virgin on behalf of the woman, Bethlehem because of Eden, the manger because of the garden, small and visible things on behalf of great and hidden things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 24"
