[[commentary]]
quote='''
Wherefore do not overmuch dread the purification. For our success is always judged by comparison with our place in life by our just and merciful Judge; and often one who is in public life and has had small success has had a greater reward than one who in the enjoyment of liberty has not completely succeeded; as I think it more marvellous for a man to advance a little in fetters, than for one to run who is not carrying any weight; or to be only a little spattered in walking through mud, than to be perfectly clean when the road is clean. To give you a proof of what I have said:—Rahab the harlot was justified by one thing alone, her hospitality, though she receives no praise for the rest of her conduct; and the Publican was exalted by one thing, his humility, though he received no testimony for anything else; so that you may learn not easily to despair concerning yourself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 19"
