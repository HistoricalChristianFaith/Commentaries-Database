[[commentary]]
quote='''
And so the secondary Splendours came into being, as the Ministers of the Primary Splendour; whether we are to conceive of them as intelligent Spirits, or as Fire of an immaterial and incorruptible kind, or as some other nature approaching this as near as may be. I should like to say that they were incapable of movement in the direction of evil, and susceptible only of the movement of good, as being about God, and illumined with the first rays from God—for earthly beings have but the second illumination; but I am obliged to stop short of saying that, and to conceive and speak of them only as difficult to move because of him, who for his splendour was called Lucifer, but became and is called Darkness through his pride; and the apostate hosts who are subject to him, creators of evil by their revolt against good and our inciters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 9"
