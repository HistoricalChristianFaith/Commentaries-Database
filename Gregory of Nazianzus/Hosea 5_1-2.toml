[[commentary]]
quote='''
Is the undertaking then so serious and laborious to a sensitive and sad heart—a very rottenness to the bones of a sensible man: while the danger is slight, and a fall not worth consideration? Nay the blessed Hosea inspires me with serious alarm, where he says that to us priests and rulers pertaineth the judgment, because we have been a snare to the watchtower; and as a net spread upon Tabor, which has been firmly fixed by the hunters of men's souls, and he threatens to cut off the wicked prophets, and devour their judges with fire, and to cease for a while from anointing a king and princes, because they ruled for themselves, and not by Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 57"
