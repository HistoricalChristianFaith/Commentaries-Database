[[commentary]]
quote='''
But not yet perhaps is there formed upon your soul any writing good or bad; and you want to be written upon today, and formed by us unto perfection. Let us go within the cloud. Give me the tables of your heart; I will be your Moses, though this be a bold thing to say; I will write on them with the finger of God a new Decalogue. I will write on them a shorter method of salvation. And if there be any heretical or unreasoning beast, let him remain below, or he will run the risk of being stoned by the Word of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 45"
