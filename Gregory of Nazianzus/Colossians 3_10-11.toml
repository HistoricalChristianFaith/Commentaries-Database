[[commentary]]
quote='''
This is the purpose of the great mystery for us. This is the purpose for us of God, Who for us was made man and became poor, to raise our flesh, and recover His image, and remodel man, that we might all be made one in Christ, who was perfectly made in all of us all that He Himself is, that we might no longer be male and female, barbarian, Scythian, bond or free (which are badges of the flesh), but might bear in ourselves only the stamp of God, by Whom and for Whom we were made, and have so far received our form and model from Him, that we are recognized by it alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 23"
