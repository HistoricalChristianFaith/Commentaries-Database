[[commentary]]
quote='''
We were entrusted with Paradise that we might enjoy life. We received a Commandment that we might obtain a good repute by keeping it; not that God did not know what would take place, but because He had laid down the law of Free Will. We were deceived because we were the objects of envy. We were cast out because we transgressed. We fasted because we refused to fast, being overpowered by the Tree of Knowledge. For the Commandment was ancient, coeval with ourselves, and was a kind of education of our souls and curb of luxury, to which we were reasonably made subject, in order that we might recover by keeping it that which we had lost by not keeping it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 28"
