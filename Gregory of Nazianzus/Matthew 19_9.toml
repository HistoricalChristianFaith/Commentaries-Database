[[commentary]]
quote='''
Now the Law grants divorce for every cause; but Christ not for every cause; but He allows only separation from the whore; and in all other things He commands patience. He allows to put away the fornicatress, because she corrupts the offspring; but in all other matters let us be patient and endure; or rather be ye enduring and patient, as many as have received the yoke of matrimony. If you see lines or marks upon her, take away her ornaments; if a hasty tongue, restrain it; if a meretricious laugh, make it modest; if immoderate expenditure or drink, reduce it; if unseasonable going out, shackle it; if a lofty eye, chastise it. It is uncertain which is in danger, the separator or the separated. Let thy fountain of water, it says, be only thine own, and let no stranger share it with thee; and, let the colt of thy favours and the stag of thy love company with thee; do thou then take care not to be a strange river, nor to please others better than thine own wife. But if thou be carried elsewhere, then thou makest a law of lewdness for thy partner also. Thus saith the Saviour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 8"
