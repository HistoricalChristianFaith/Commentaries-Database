[[commentary]]
quote='''
Neither let us carry aught of it abroad, nor leave it till the morning; because most of our Mysteries may not be carried out to them that are outside, nor is there beyond this night any further purification; and procrastination is not creditable to those who have a share in the Word. For just as it is good and well-pleasing to God not to let anger last through the day, but to get rid of it before sunset, whether you take this of time or in a mystical sense, for it is not safe for us that the Sun of Righteousness should go down upon our wrath; so too we ought not to let such Food remain all night, nor to put it off till to-morrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 16"
