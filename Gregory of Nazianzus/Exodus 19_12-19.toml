[[commentary]]
quote='''
What is it that has induced this fear in me, that, instead of supposing me to be needlessly afraid, you may highly commend my foresight? I hear from Moses himself, when God spake to him, that, although many were bidden to come to the mount, one of whom was even Aaron, with his two sons who were priests, and seventy elders of the senate, the rest were ordered to worship afar off, and Moses alone to draw near, and the people were not to go up with him. For it is not everyone who may draw near to God, but only one who, like Moses, can bear the glory of God. Moreover, before this, when the law was first given, the trumpet-blasts, and lightnings, and thunders, and darkness, and the smoke of the whole mountain, and the terrible threats that if even a beast touched the mountain it should be stoned, and other like alarms, kept back the rest of the people, for whom it was a great privilege, after careful purification, merely to hear the voice of God. But Moses actually went up and entered into the cloud, and was charged with the law, and received the tables, which belong, for the multitude, to the letter, but, for those who are above the multitude, to the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 92"

[[commentary]]
quote='''
Now when I go up eagerly into the Mount—or, to use a truer expression, when I both eagerly long, and at the same time am afraid (the one through my hope and the other through my weakness) to enter within the Cloud, and hold converse with God, for so God commands; if any be an Aaron, let him go up with me, and let him stand near, being ready, if it must be so, to remain outside the Cloud. But if any be a Nadad or an Abihu, or of the Order of the Elders, let him go up indeed, but let him stand afar off, according to the value of his purification. But if any be of the multitude, who are unworthy of this height of contemplation, if he be altogether impure let him not approach at all, for it would be dangerous to him; but if he be at least temporarily purified, let him remain below and listen to the Voice alone, and the trumpet, the bare words of piety, and let him see the Mountain smoking and lightening, a terror at once and a marvel to those who cannot get up. But if any is an evil and savage beast, and altogether incapable of taking in the subject matter of Contemplation and Theology, let him not hurtfully and malignantly lurk in his den among the woods, to catch hold of some dogma or saying by a sudden spring, and to tear sound doctrine to pieces by his misrepresentations, but let him stand yet afar off and withdraw from the Mount, or he shall be stoned and crushed, and shall perish miserably in his wickedness. For to those who are like wild beasts true and sound discourses are stones. If he be a leopard let him die with his spots. If a ravening and roaring lion, seeking what he may devour of our souls or of our words; or a wild boar, trampling under foot the precious and translucent pearls of the Truth; or an Arabian and alien wolf, or one keener even than these in tricks of argument; or a fox, that is a treacherous and faithless soul, changing its shape according to circumstances or necessities, feeding on dead or putrid bodies, or on little vineyards when the large ones have escaped them; or any other carnivorous beast, rejected by the Law as unclean for food or enjoyment; our discourse must withdraw from such and be engraved on solid tables of stone, and that on both sides because the Law is partly visible, and partly hidden; the one part belonging to the mass who remain below, the other to the few who press upward into the Mount.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 2"
