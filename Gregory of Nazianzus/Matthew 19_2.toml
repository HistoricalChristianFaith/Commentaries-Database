[[commentary]]
quote='''
And great multitudes followed Him, and He healed them there, where the multitude was greater. If He had abode upon His own eminence, if He had not condescended to infirmity, if He had remained what He was, keeping Himself unapproachable and incomprehensible, a few perhaps would have followed Him—perhaps not even a few, possibly only Moses—and He only so far as to see with difficulty the Back Parts of God. For He penetrated the cloud, either being placed outside the weight of the body or being withdrawn from his senses; for how could he have gazed upon the subtlety, or the incorporeity, or I know not how one should call it, of God, being incorporate and using material eyes? But inasmuch as He strips Himself for us, inasmuch as He comes down (and I speak of an exinanition, as it were, a laying aside and a diminution of His glory), He becomes by this comprehensible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 3"
