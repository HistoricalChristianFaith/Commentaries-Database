[[commentary]]
quote='''
"Yet once more," I hear the Scripture say that the heaven and the earth shall be shaken, inasmuch as this has befallen them before, signifying, as I suppose, a manifest renovation of all things. And we must believe S. Paul when he says that this last shaking is none other than the second coming of Christ, and the transformation and changing of the universe to a condition of stability which cannot be shaken. And I imagine that this present shaking, in which the contemplatives and lovers of God, who before the time exercise their heavenly citizenship, are shaken from us, is of no less consequence than any of former days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 25"
