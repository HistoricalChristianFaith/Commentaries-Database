[[commentary]]
quote='''
As far then as we can reach, He Who Is, and God, are the special names of His Essence; and of these especially He Who Is, not only because when He spake to Moses in the mount, and Moses asked what His Name was, this was what He called Himself, bidding him say to the people "I Am hath sent me," but also because we find that this Name is the more strictly appropriate. For the Name Θεός (God), even if, as those who are skilful in these matters say, it were derived from Θέειν (to run) or from Αἴθειν (to blaze), from continual motion, and because He consumes evil conditions of things (from which fact He is also called A Consuming Fire), would still be one of the Relative Names, and not an Absolute one; as again is the case with Lord, which also is called a name of God. I am the Lord Thy God, He says, that is My name; and, The Lord is His name. But we are enquiring into a Nature Whose Being is absolute and not into Being bound up with something else. But Being is in its proper sense peculiar to God, and belongs to Him entirely, and is not limited or cut short by any Before or After, for indeed in him there is no past or future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 18"

[[commentary]]
quote='''
God always was, and always is, and always will be. Or rather, God always Is. For Was and Will be are fragments of our time, and of changeable nature, but He is Eternal Being. And this is the Name that He gives to Himself when giving the Oracle to Moses in the Mount. For in Himself He sums up and contains all Being, having neither beginning in the past nor end in the future; like some great Sea of Being, limitless and unbounded, transcending all conception of time and nature, only adumbrated by the mind, and that very dimly and scantily . . . not by His Essentials, but by His Environment; one image being got from one source and another from another, and combined into some sort of presentation of the truth, which escapes us before we have caught it, and takes to flight before we have conceived it, blazing forth upon our Master-part, even when that is cleansed, as the lightning flash which will not stay its course, does upon our sight . . . in order as I conceive by that part of it which we can comprehend to draw us to itself (for that which is altogether incomprehensible is outside the bounds of hope, and not within the compass of endeavour), and by that part of It which we cannot comprehend to move our wonder, and as an object of wonder to become more an object of desire, and being desired to purify, and by purifying to make us like God; so that when we have thus become like Himself, God may, to use a bold expression, hold converse with us as Gods, being united to us, and that perhaps to the same extent as He already knows those who are known to Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 7"
