[[commentary]]
quote='''
And Jacob dreamed of a lofty ladder and stair of Angels, and in a mystery anointed a pillar—perhaps to signify the Rock that was anointed for our sake—and gave to a place the name of The House of God in honour of Him whom he saw; and wrestled with God in human form; whatever this wrestling of God with man may mean . . . possibly it refers to the comparison of man's virtue with God's; and he bore on his body the marks of the wrestling, setting forth the defeat of the created nature; and for a reward of his reverence he received a change of his name; being named, instead of Jacob, Israel—that great and honourable name. Yet neither he nor any one on his behalf, unto this day, of all the Twelve Tribes who were his children, could boast that he comprehended the whole nature or the pure sight of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 18"
