[[commentary]]
quote='''
Now, we come to another action of Christ, and another mystery. I cannot restrain my pleasure; I am rapt into God. Almost like John I proclaim good tidings; for though I be not a Forerunner, yet am I from the desert. Christ is illumined, let us shine forth with Him. Christ is baptized, let us descend with Him that we may also ascend with Him. Jesus is baptized; but we must attentively consider not only this but also some other points. Who is He, and by whom is He baptized, and at what time? He is the All-pure; and He is baptized by John; and the time is the beginning of His miracles. What are we to learn and to be taught by this? To purify ourselves first; to be lowly minded; and to preach only in maturity both of spiritual and bodily stature. The first has a word especially for those who rush to Baptism off hand, and without due preparation, or providing for the stability of the Baptismal Grace by the disposition of their minds to good. For since Grace contains remission of the past (for it is a grace), it is on that account more worthy of reverence, that we return not to the same vomit again. The second speaks to those who rebel against the Stewards of this Mystery, if they are their superiors in rank. The third is for those who are confident in their youth, and think that any time is the right one to teach or to preside. Jesus is purified, and dost thou despise purification? . . . and by John, and dost thou rise up against thy herald? . . . and at thirty years of age, and dost thou before thy beard has grown presume to teach the aged, or believe that thou teachest them, though thou be not reverend on account of thine age, or even perhaps for thy character? But here it may be said, Daniel, and this or that other, were judges in their youth, and examples are on your tongues; for every wrongdoer is prepared to defend himself. But I reply that that which is rare is not the law of the Church. For one swallow does not make a summer, nor one line a geometrician, nor one voyage a sailor.

But John baptizes, Jesus comes to Him . . . perhaps to sanctify the Baptist himself, but certainly to bury the whole of the old Adam in the water; and before this and for the sake of this, to sanctify Jordan; for as He is Spirit and Flesh, so He consecrates us by Spirit and water. John will not receive Him; Jesus contends. "I have need to be baptized of Thee" says the Voice to the Word, the Friend to the Bridegroom; he that is above all among them that are born of women, to Him Who is the Firstborn of every creature; he that leaped in the womb, to Him Who was adored in the womb; he who was and is to be the Forerunner to Him Who was and is to be manifested. "I have need to be baptized of Thee;" add to this "and for Thee;" for he knew that he would be baptized by Martyrdom, or, like Peter, that he would be cleansed not only as to his feet. "And comest Thou to me?" This also was prophetic; for he knew that after Herod would come the madness of Pilate, and so that when he had gone before Christ would follow him. But what saith Jesus? "Suffer it to be so now," for this is the time of His Incarnation; for He knew that yet a little while and He should baptize the Baptist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Sections 14-15"
