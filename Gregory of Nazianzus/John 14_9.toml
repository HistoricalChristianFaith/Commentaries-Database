[[commentary]]
quote='''
And He is called the Word, because He is related to the Father as Word to Mind; not only on account of His passionless Generation, but also because of the Union, and of His declaratory function. Perhaps too this relation might be compared to that between the Definition and the Thing defined since this also is called Λόγος. For, it says, he that hath mental perception of the Son (for this is the meaning of Hath Seen) hath also perceived the Father; and the Son is a concise demonstration and easy setting forth of the Father's Nature. For every thing that is begotten is a silent word of him that begat it. And if any one should say that this Name was given Him because He exists in all things that are, he would not be wrong. For what is there that consists but by the word?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 20"
