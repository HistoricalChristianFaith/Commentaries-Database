[[commentary]]
quote='''
And I revere also the Equal Rank of the Holy Ghost; and I fear the threat pronounced against those who blaspheme Him. And blasphemy is not the reckoning Him God, but the severing Him from the Godhead. And here you must remark that That which is blasphemed is Lord, and That which is avenged is the Holy Ghost, evidently as Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 11"
