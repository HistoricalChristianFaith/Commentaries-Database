[[commentary]]
quote='''
Let us anticipate His anger by confession; let us desire to see Him appeased, after He was wroth. Who knoweth, he says, if He will turn and repent, and leave a blessing behind Him? This I know certainly, I the sponsor of the loving-kindness of God. And when He has laid aside that which is unnatural to Him, His anger, He will betake Himself to that which is natural, His mercy. To the one He is forced by us, to the other He is inclined. And if He is forced to strike, surely He will refrain, according to His Nature. Only let us have mercy on ourselves, and open a road for our Father's righteous affections.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 14"
