[[commentary]]
quote='''
One light alone let us shun—that which is the offspring of the baleful fire; let us not walk in the light of our fire, and in the flame which we have kindled. For I know a cleansing fire which Christ came to send upon the earth, and He Himself is anagogically called a Fire. This Fire takes away whatsoever is material and of evil habit; and this He desires to kindle with all speed, for He longs for speed in doing us good, since He gives us even coals of fire to help us. I know also a fire which is not cleansing, but avenging; either that fire of Sodom which He pours down on all sinners, mingled with brimstone and storms, or that which is prepared for the Devil and his Angels or that which proceeds from the face of the Lord, and shall burn up his enemies round about; and one even more fearful still than these, the unquenchable fire which is ranged with the worm that dieth not but is eternal for the wicked. For all these belong to the destroying power; though some may prefer even in this place to take a more merciful view of this fire, worthily of Him That chastises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 36"
