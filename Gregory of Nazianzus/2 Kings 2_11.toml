[[commentary]]
quote='''
To Elias neither the strong wind, nor the fire, nor the earthquake, as you learn from the story, but a light breeze adumbrated the Presence of God, and not even this His Nature. And who was this Elias? The man whom a chariot of fire took up to heaven, signifying the superhuman excellency of the righteous man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 19"
