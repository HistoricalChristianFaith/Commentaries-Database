[[commentary]]
quote='''
With bitter herbs, for a life according to the Will of God is bitter and arduous, especially to beginners, and higher than pleasures. For although the new yoke is easy and the burden light, as you are told, yet this is on account of the hope and the reward, which is far more abundant than the hardships of this life. If it were not so, who would not say that the Gospel is more full of toil and trouble than the enactments of the Law? For, while the Law prohibits only the completed acts of sin, we are condemned for the causes also, almost as if they were acts. The Law says, Thou shalt not commit adultery; but you may not even desire, kindling passion by curious and earnest looks. Thou shalt not kill, says the Law; but you are not even to return a blow, but on the contrary are to offer yourself to the smiter. How much more ascetic is the Gospel than the Law! Thou shalt not forswear thyself is the Law; but you are not to swear at all, either a greater or a lesser oath, for an oath is the parent of perjury. Thou shalt not join house to house, nor field to field, oppressing the poor; but you are to set aside willingly even your just possessions, and to be stripped for the poor, that without encumbrance you may take up the Cross and be enriched with the unseen riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 17"
