[[commentary]]
quote='''
But, the objector says, the very form of the expression "He begat" and "He was begotten," brings in the idea of a beginning of generation. But what if you do not use this expression, but say, "He had been begotten from the beginning" so as readily to evade your far-fetched and time-loving objections? Will you bring Scripture against us, as if we were forging something contrary to Scripture and to the truth? Why, every one knows that in practice we very often find tenses interchanged when time is spoken of; and especially is this the custom of Holy Scripture, not only in respect of the past tense, and of the present; but even of the future, as for instance "Why did the heathen rage?" when they had not yet raged and "they shall cross over the river on foot," where the meaning is they did cross over. It would be a long task to reckon up all the expressions of this kind which students have noticed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 5"
