[[commentary]]
quote='''
For you have not hastened to mingle with the larger number, nor have you reckoned religion by numbers, nor endured to be a mere unorganized rabble, rather than a people purified by the Word of God; but having, as is right, rendered to Cæsar the things that are Cæsar's, ye have offered besides to God the things that are God's; to the former Custom, to the latter Fear; and after feeding the people with your cargoes, you yourselves have come to be fed by us. For we also distribute corn, and our distribution is perhaps not worth less than yours. Come eat of my Bread and drink of the Wine which I have mingled for you. I join with Wisdom in bidding you to my table.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 7"
