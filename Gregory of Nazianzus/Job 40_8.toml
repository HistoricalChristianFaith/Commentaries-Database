[[commentary]]
quote='''
Often were the righteous given into the hands of the wicked, not that the latter might be honoured, but that the former might be tested: and though the wicked come, as it is written, to an awful death, nevertheless for the present the godly are a laughing stock, while the goodness of God and the great treasuries of what is in store for each of them hereafter are concealed. Then indeed word and deed and thought will be weighed in the just balances of God, as He arises to judge the earth, gathering together counsel and works, and revealing what He had kept sealed up. Of this let the words and sufferings of Job convince thee, who was a truthful, blameless, just, godfearing man, with all those other qualities which are testified of him, and yet was smitten with such a succession of remarkable visitations, at the hands of him who begged for power over him, that, although many have often suffered in the whole course of time, and some even have, as is probable, been grievously afflicted, yet none can be compared with him in misfortunes. For he not only suffered, without being allowed space to mourn for his losses in their rapid succession, the loss of his money, his possessions, his large and fair family, blessings for which all men care; but was at last smitten with an incurable disease horrible to look upon, and, to crown his misfortunes, had a wife whose only comfort was evil counsel. For his surpassing troubles were those of his soul added to those of the body. He had also among his friends truly miserable comforters, as he calls them, who could not help him. For when they saw his suffering, in ignorance of its hidden meaning, they supposed his disaster to be the punishment of vice and not the touchstone of virtue. And they not only thought this, but were not even ashamed to reproach him with his lot, at a time when, even if he had been suffering for vice, they ought to have treated his grief with words of consolation.

Such was the lot of Job: such at first sight his history. In reality it was a contest between virtue and envy: the one straining every nerve to overcome the good, the other enduring everything, that it might abide unsubdued; the one striving to smooth the way for vice, by means of the chastisement of the upright, the other to retain its hold upon the good, even if they do exceed others in misfortunes. What then of Him who answered Job out of the whirlwind and cloud, Who is slow to chastise and swift to help, Who suffers not utterly the rod of the wicked to come into the lot of the righteous, lest the righteous should learn iniquity? At the end of the contests He declares the victory of the athlete in a splendid proclamation and lays bare the secret of his calamities, saying: "Thinkest thou that I have dealt with thee for any other purpose than the manifestation of thy righteousness?" This is the balm for his wounds, this is the crown of the contest, this the reward for his patience. For perhaps his subsequent prosperity was small, great as it may seem to some, and ordained for the sake of small minds, even though he received again twice as much as he had lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Sections 17-18"
