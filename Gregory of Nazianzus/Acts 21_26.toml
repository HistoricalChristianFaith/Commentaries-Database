[[commentary]]
quote='''
Now the two Testaments are alike in this respect, that the change was not made on a sudden, nor at the first movement of the endeavour. Why not (for this is a point on which we must have information)? That no violence might be done to us, but that we might be moved by persuasion. For nothing that is involuntary is durable; like streams or trees which are kept back by force. But that which is voluntary is more durable and safe. The former is due to one who uses force, the latter is ours; the one is due to the gentleness of God, the other to a tyrannical authority. Wherefore God did not think it behoved Him to benefit the unwilling, but to do good to the willing. And therefore like a Tutor or Physician He partly removes and partly condones ancestral habits, conceding some little of what tended to pleasure, just as medical men do with their patients, that their medicine may be taken, being artfully blended with what is nice. For it is no very easy matter to change from those habits which custom and use have made honourable. For instance, the first cut off the idol, but left the sacrifices; the second, while it destroyed the sacrifices did not forbid circumcision. Then, when once men had submitted to the curtailment, they also yielded that which had been conceded to them; in the first instance the sacrifices, in the second circumcision; and became instead of Gentiles, Jews, and instead of Jews, Christians, being beguiled into the Gospel by gradual changes. Paul is a proof of this; for having at one time administered circumcision, and submitted to legal purification, he advanced till he could say, and I, brethren, if I yet preach circumcision, why do I yet suffer persecution? His former conduct belonged to the temporary dispensation, his latter to maturity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 25"
