[[commentary]]
quote='''
Thou countest tens of thousands, God counts those who are in a state of salvation; thou countest the dust which is without number, I the vessels of election. For nothing is so magnificent in God's sight as pure doctrine, and a soul perfect in all the dogmas of the truth.—For there is nothing worthy of Him Who made all things, of Him by Whom are all things, and for Whom are all things, so that it can be given or offered to God: not merely the handiwork or means of any individual, but even if we wished to honour Him, by uniting together all the property and handiwork of all mankind. Do not I fill heaven and earth? saith the Lord! and what house will ye build Me? or what is the place of My rest? But, since man must needs fall short of what is worthy, I ask of you, as approaching it most nearly, piety, the wealth which is common to all and equal in My eyes, wherein the poorest may, if he be nobleminded, surpass the most illustrious. For this kind of glory depends upon purpose, not upon affluence. These things be well assured, I will accept at your hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252042.html'
source_title="Oration 42, Section 8"
