[[commentary]]
quote='''
Thus the veneration paid to the number Seven gave rise also to the veneration of Pentecost. For seven being multiplied by seven generates fifty all but one day, which we borrow from the world to come, at once the Eighth and the first, or rather one and indestructible. For the present sabbatism of our souls can find its cessation there, that a portion may be given to seven and also to eight (so some of our predecessors have interpreted this passage of Solomon).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 2"
