[[commentary]]
quote='''
Every time is suitable for your ablution, since any time may be your death. With Paul I shout to you with that loud voice, "Behold now is the accepted time; behold Now is the day of salvation;" and that Now does not point to any one time, but is every present moment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 13"
