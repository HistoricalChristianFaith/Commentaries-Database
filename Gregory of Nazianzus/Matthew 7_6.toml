[[commentary]]
quote='''
All fear has been banished from souls, shamelessness has taken its place, and knowledge and the deep things of the Spirit are at the disposal of anyone who will; and we all become pious by simply condemning the impiety of others; and we claim the services of ungodly judges, and fling that which is holy to the dogs, and cast pearls before swine, by publishing divine things in the hearing of profane souls, and, wretches that we are, carefully fulfil the prayers of our enemies, and are not ashamed to go a whoring with our own inventions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 79"

[[commentary]]
quote='''
But whatever is of bony nature and not fit for food and hard for us even to understand, this must not be broken; that is, badly divined and misconceived (I need not say that in the history not a bone of Jesus was broken, even though His death was hastened by His crucifiers on account of the Sabbath); nor must it be stripped off and thrown away, lest that which is holy should be given to the dogs, that is, to the evil hearers of the Word; just as the glorious pearl of the Word is not to be cast before swine; but it shall be consumed with the fire with which the burnt offerings also are consumed, being refined and preserved by the Spirit That searcheth and knoweth all things, not destroyed in the waters, nor scattered abroad as the calf's head which was hastily made by Israel was by Moses, for a reproach for their hardness of heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 16"
