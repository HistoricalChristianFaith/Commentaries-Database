[[commentary]]
quote='''
Now, since our Festival is of Baptism, and we must endure a little hardness with Him Who for our sake took form, and was baptized, and was crucified; let us speak about the different kinds of Baptism, that we may come out thence purified. Moses baptized but it was in water, and before that in the cloud and in the sea. This was typical as Paul saith; the Sea of the water, and the Cloud of the Spirit; the Manna, of the Bread of Life; the Drink, of the Divine Drink. John also baptized; but this was not like the baptism of the Jews, for it was not only in water, but also "unto repentance." Still it was not wholly spiritual, for he does not add "And in the Spirit." Jesus also baptized, but in the Spirit. This is the perfect Baptism. And how is He not God, if I may digress a little, by whom you too are made God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 17"
