[[commentary]]
quote='''
The Light Shineth In Darkness, in this life and in the flesh, and is chased by the darkness, but is not overtaken by it:—I mean the adverse power leaping up in its shamelessness against the visible Adam, but encountering God and being defeated;—in order that we, putting away the darkness, may draw near to the Light, and may then become perfect Light, the children of perfect Light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 2"
