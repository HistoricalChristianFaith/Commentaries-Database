[[commentary]]
quote='''
Who is it, Who made all things by His Word, and formed man by His Wisdom, and gathered into one things scattered abroad, and mingled dust with spirit, and compounded an animal visible and invisible, temporal and immortal, earthly and heavenly, able to attain to God but not to comprehend Him, drawing near and yet afar off. I said, I will be wise, says Solomon, but she (i.e. Wisdom) was far from me beyond what is: and, Verily, he that increaseth knowledge increaseth sorrow. For the joy of what we have discovered is no greater than the pain of what escapes us; a pain, I imagine, like that felt by those who are dragged, while yet thirsty, from the water, or are unable to retain what they think they hold, or are suddenly left in the dark by a flash of lightning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 75"

[[commentary]]
quote='''
Thus Solomon, who was the wisest of all men, whether before him or in his own time, to whom God gave breadth of heart, and a flood of contemplation, more abundant than the sand, even he, the more he entered into the depth, the more dizzy he became, and declared the furthest point of wisdom to be the discovery of how very far off she was from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 21"
