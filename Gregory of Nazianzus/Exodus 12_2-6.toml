[[commentary]]
quote='''
What more? The First Month is introduced, or rather the beginning of months, whether it was so among the Hebrews from the beginning, or was made so later on this account, and became the first in consequence of the Mystery; and the tenth of the Month, for this is the most complete number, of units the first perfect unit, and the parent of perfection. And it is kept until the fifth day, perhaps because the Victim, of Whom I am speaking, purifies the five senses, from which comes falling into sin, and around which the war rages, inasmuch as they are open to the incitements to sin. And it was chosen, not only out of the lambs, but also out of the inferior species, which are placed on the left hand—the kids; because He is sacrificed not only for the righteous, but also for sinners; and perhaps even more for these, inasmuch as we have greater need of His mercy. And we need not be surprised that a lamb for a house should be required as the best course, but if that could not be, then one might be obtained by contributions (owing to poverty) for the houses of a family; because it is clearly best that each individual should suffice for his own perfecting, and should offer his own living sacrifice holy unto God Who called him, being consecrated at all times and in every respect. But if that cannot be, then that those who are akin in virtue and of like disposition should be made use of as helpers. For I think this provision means that we should communicate of the Sacrifice to those who are nearest, if there be need.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 14"
