[[commentary]]
quote='''
For the same Word is on the one hand terrible through its nature to those who are unworthy, and on the other through its loving kindness can be received by those who are thus prepared, who have driven out the unclean and worldly spirit from their souls, and have swept and adorned their own souls by self-examination, and have not left them idle or without employment, so as again to be occupied with greater armament by the seven spirits of wickedness . . . the same number as are reckoned of virtue (for that which is hardest to fight against calls for the sternest efforts) . . . but besides fleeing from evil, practise virtue, making Christ entirely, or at any rate to the greatest extent possible, to dwell within them, so that the power of evil cannot meet with any empty place to fill it again with himself, and make the last state of that man worse than the first, by the greater energy of his assault, and the greater strength and impregnability of the fortress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 10"

[[commentary]]
quote='''
How shall this be? Remember always the parable, and so will you best and most perfectly help yourself. The unclean and malignant spirit is gone out of you, being chased by baptism. He will not submit to the expulsion, he will not resign himself to be houseless and homeless: He goes through waterless places, dry of the Divine Stream, and there he desires to abide. He wanders, seeking rest; he finds none. He lights on baptized souls, whose sins the font has washed away. He fears the water; he is choked with the cleansing, as the Legion were in the sea. Again he returns to the house whence he came out. He is shameless, he is contentious, he makes a fresh assault upon it, he makes a new attempt. If he finds that Christ has taken up His abode there, and has filled the place which he had vacated, he is driven back again, and goes off without success and is become an object of pity in his wandering state. But if he finds in you a place, swept and garnished indeed, but empty and idle, equally ready to take in this or that which shall first occupy it, he makes a leap into it, he takes up his abode there with a larger train; and the last state is worse than the first, inasmuch as then there was a hope of amendment and safety, but now the evil is rampant, and drags in sin by its flight from good, and therefore the possession is more secure to him who dwells there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 35"
