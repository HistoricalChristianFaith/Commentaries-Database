[[commentary]]
quote='''
But the sinner is pardoned not seven times, but seventy times seven. And we may see it by the contrary also (for the punishment of wickedness is to be praised), Cain being avenged seven times, that is, punishment being exacted from him for his fratricide, and Lamech seventy times seven, because he was a murderer after the law and the condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 3"
