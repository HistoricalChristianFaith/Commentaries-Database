[[commentary]]
quote='''
What say you? Shall we pause here, after discussing nothing further than matter and visible things, or, since the Word knows the Tabernacle of Moses to be a figure of the whole creation—I mean the entire system of things visible and invisible—shall we pass the first veil, and stepping beyond the realm of sense, shall we look into the Holy Place, the Intellectual and Celestial creation? But not even this can we see in an incorporeal way, though it is incorporeal, since it is called—or is—Fire and Spirit. For He is said to make His Angels spirits, and His Ministers a flame of fire . . . though perhaps this "making" means preserving by that Word by which they came into existence. The Angel then is called spirit and fire; Spirit, as being a creature of the intellectual sphere; Fire, as being of a purifying nature; for I know that the same names belong to the First Nature. But, relatively to us at least, we must reckon the Angelic Nature incorporeal, or at any rate as nearly so as possible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 31"
