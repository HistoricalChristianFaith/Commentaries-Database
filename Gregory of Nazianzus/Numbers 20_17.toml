[[commentary]]
quote='''
This, however, I take to be generally admitted—that just as it is not safe for those who walk on a lofty tight rope to lean to either side, for even though the inclination seems slight, it has no slight consequences, but their safety depends upon their perfect balance: so in the case of one of us, if he leans to either side, whether from vice or ignorance, no slight danger of a fall into sin is incurred, both for himself and those who are led by him. But we must really walk in the King's highway, and take care not to turn aside from it either to the right hand or to the left, as the Proverbs say. For such is the case with our passions, and such in this matter is the task of the good shepherd, if he is to know properly the souls of his flock, and to guide them according to the methods of a pastoral care which is right and just, and worthy of our true Shepherd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 34"
