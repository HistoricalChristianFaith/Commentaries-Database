[[commentary]]
quote='''
And He is called Life, because He is Light, and is the constituting and creating Power of every reasonable soul. For in Him we live and move and have our being, according to the double power of that Breathing into us; for we were all inspired by Him with breath, and as many of us as were capable of it, and in so far as we open the mouth of our mind, with God the Holy Ghost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 20"
