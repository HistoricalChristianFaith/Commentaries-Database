[[commentary]]
quote='''
One thing connected with the Birth of Christ I would have you hate . . . the murder of the infants by Herod. Or rather you must venerate this too, the Sacrifice of the same age as Christ, slain before the Offering of the New Victim. If He flees into Egypt, joyfully become a companion of His exile. It is a grand thing to share the exile of the persecuted Christ. If He tarry long in Egypt, call Him out of Egypt by a reverent worship of Him there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 18"
