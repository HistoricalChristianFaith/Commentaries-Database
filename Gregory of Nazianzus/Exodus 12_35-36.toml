[[commentary]]
quote='''
Thus it hath pleased Him that thou shouldest come forth out of Egypt, the iron furnace; that thou shouldest leave behind the idolatry of that country, and be led by Moses and his lawgiving and martial rule. I give thee a piece of advice which is not my own, or rather which is very much my own, if thou consider the matter spiritually. Borrow from the Egyptians vessels of gold and silver; with these take thy journey; supply thyself for the road with the goods of strangers, or rather with thine own. There is money owing to thee, the wages of thy bondage and of thy brickmaking; be clever on thy side too in asking retribution; be an honest robber. Thou didst suffer wrong there whilst thou wast fighting with the clay (that is, this troublesome and filthy body) and wast building cities foreign and unsafe, whose memorial perishes with a cry. What then? Dost thou come out for nothing and without wages? But why wilt thou leave to the Egyptians and to the powers of thine adversaries that which they have gained by wickedness, and will spend with yet greater wickedness? It does not belong to them: they have ravished it, and have sacrilegiously taken it as plunder from Him who saith, The silver is Mine and the gold is Mine, and I give it to whom I will. Yesterday it was theirs, for it was permitted to be so; to-day the Master takes it and gives it to thee, that thou mayest make a good and saving use of it. Let us make to ourselves friends of the Mammon of unrighteousness, that when we fail, they may receive us in the time of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 20"
