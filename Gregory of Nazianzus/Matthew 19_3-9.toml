[[commentary]]
quote='''
The Pharisees also, it says, came unto Him, tempting Him, and saying unto Him, is it lawful for a man to put away his wife for every cause? Again the Pharisees tempt Him; again they who read the Law do not know the Law; again they who are expounders of the Law need others to teach them. It was not enough that Sadducees should tempt Him concerning the Resurrection, and Lawyers question Him about perfection, and the Herodians about the poll-tax, and others about authority; but some one must also ask about Marriage at Him who cannot be tempted, the Creator of wedlock, Him who from the First Cause made this whole race of mankind. And He answered and said unto them, Have ye not read that He which made them at the beginning made them male and female? He knoweth how to solve some of their questions and to bridle others. When He is asked, By what authority doest thou these things? He Himself, because of the utter ignorance of those who asked Him, replies with another question; The baptism of John, was it from Heaven or of men? He on both sides entangles His questioners, so that we also are able, following the example of Christ, sometimes to check those who argue with us over-officiously, and with still more absurd questions to solve the absurdity of their questions. For we too are wise in vanity at times, if I may boast of the things of folly. But when He sees a question that calls for reasoning, then He does not deem His questioners unworthy of prudent answers.

The question which you have put seems to me to do honour to chastity, and to demand a kind reply. Chastity, in respect of which I see that the majority of men are ill-disposed, and that their laws are unequal and irregular. For what was the reason why they restrained the woman, but indulged the man, and that a woman who practises evil against her husband's bed is an adulteress, and the penalties of the law for this are very severe; but if the husband commits fornication against his wife, he has no account to give? I do not accept this legislation; I do not approve this custom. They who made the Law were men, and therefore their legislation is hard on women, since they have placed children also under the authority of their fathers, while leaving the weaker sex uncared for. God doth not so; but saith Honour thy father and thy mother, which is the first commandment with promise; that it may be well with thee; and, He that curseth father or mother, let him die the death. Similarly He gave honour to good and punishment to evil. And, The blessing of a father strengtheneth the houses of children, but the curse of a mother uprooteth the foundations. See the equality of the legislation. There is one Maker of man and woman; one debt is owed by children to both their parents.

How then dost thou demand Chastity, while thou dost not thyself observe it? How dost thou demand that which thou dost not give? How, though thou art equally a body, dost thou legislate unequally? If thou enquire into the worse—The Woman Sinned, and so did Adam. The serpent deceived them both; and one was not found to be the stronger and the other the weaker. But dost thou consider the better? Christ saves both by His Passion. Was He made flesh for the Man? So He was also for the woman. Did He die for the Man? The Woman also is saved by His death. He is called of the seed of David; and so perhaps you think the Man is honoured; but He is born of a Virgin, and this is on the Woman's side. They two, He says, shall be one Flesh; so let the one flesh have equal honour." And Paul legislates for chastity by His example. How, and in what way? This Sacrament is great, he says, But I speak concerning Christ and the Church. It is well for the wife to reverence Christ through her husband: and it is well for the husband not to dishonor the Church through his wife. Let the wife, he says, see that she reverence her husband, for so she does Christ; but also he bids the husband cherish his wife, for so Christ does the Church. Let us, then, give further consideration to this saying.

Churn milk and it will be butter; examine this and perhaps you may find something more nourishing in it. For I think that the Word here seems to deprecate second marriage. For, if there were two Christs, there may be two husbands or two wives; but if Christ is One, one Head of the Church, let there be also one flesh, and let a second be rejected; and if it hinder the second what is to be said for a third? The first is law, the second is indulgence, the third is transgression, and anything beyond this is swinish, such as has not even many examples of its wickedness. Now the Law grants divorce for every cause; but Christ not for every cause; but He allows only separation from the whore; and in all other things He commands patience. He allows to put away the fornicatress, because she corrupts the offspring; but in all other matters let us be patient and endure; or rather be ye enduring and patient, as many as have received the yoke of matrimony. If you see lines or marks upon her, take away her ornaments; if a hasty tongue, restrain it; if a meretricious laugh, make it modest; if immoderate expenditure or drink, reduce it; if unseasonable going out, shackle it; if a lofty eye, chastise it. It is uncertain which is in danger, the separator or the separated. Let thy fountain of water, it says, be only thine own, and let no stranger share it with thee; and, let the colt of thy favours and the stag of thy love company with thee; do thou then take care not to be a strange river, nor to please others better than thine own wife. But if thou be carried elsewhere, then thou makest a law of lewdness for thy partner also. Thus saith the Saviour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 5-8"
