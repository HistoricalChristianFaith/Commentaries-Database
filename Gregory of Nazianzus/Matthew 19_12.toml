[[commentary]]
quote='''
For there are eunuchs which were made eunuchs from their mother's womb, etc. I should very much like to be able to say something bold about eunuchs. Be not proud, ye who are eunuchs by nature. For, in point of self-restraint, this is perhaps unwilling. For it has not come to the test, nor has your self-restraint been proved by trial. For the good which is by nature is not a subject of merit; that which is the result of purpose is laudable. What merit has fire for burning, for it is its nature to burn? What merit has water for falling, a property given to it by its Maker? What thanks does the snow get for its coldness, or the sun for its shining?—It shines even if it does not wish. Claim merit if you please by willing the better things. You will claim it if, being carnal, you make yourself spiritual; if, while drawn down by the leaden flesh, you receive wings from reason; if though lowly born, you are found to be heavenly; if while chained down to the flesh, you shew yourself superior to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 16"

[[commentary]]
quote='''
There are, He says, some eunuchs which were so born from their mother's womb; and there are some eunuchs which were made eunuchs of men; and there be eunuchs which have made themselves eunuchs for the Kingdom of Heaven's sake. He that is able to receive it, let him receive it. I think that the discourse would sever itself from the body, and represent higher things by bodily figures; for to stop the meaning at bodily eunuchs would be small and very weak, and unworthy of the Word; and we must understand in addition something worthy of the Spirit. Some, then, seem by nature to incline to good. And when I speak of nature, I am not slighting free will, but supposing both—an aptitude for good, and that which brings the natural aptitude to effect. And there are others whom reason cleanses, by cutting them off from the passions. These I imagine to be meant by those whom men have made Eunuchs, when the word of teaching distinguishing the better from the worse and rejecting the one and commanding the other (like the verse, Depart from evil and do good), works spiritual chastity. This sort of making eunuchs I approve; and I highly praise both teachers and taught, that the one have nobly effected, and the other still more nobly endured, the cutting off.

And there be eunuchs which have made themselves eunuchs for the Kingdom of Heaven's sake. Others, too, who have not met with teachers, have been laudable teachers to themselves. No father nor mother, no Priest or Bishop, nor any of those commissioned to teach, taught you your duty; but by moving reason in yourself and by kindling the spark of good by your free will, you made yourself a eunuch, and acquired such a habit of virtue that impulse to vice became almost an impossibility to you. Therefore I praise this kind of Eunuch-making also, and perhaps even above the others. He that is able to receive it let him receive it. Choose which part you will; either follow the Teacher or be your own teacher. One thing alone is shameful—that the passions be not extirpated. It matters not how they are extirpated. The teacher is God's creature; and you also have the same origin; and whether the teacher grasp this grace, or the good be your own—it is equally good.

Only let us cut ourselves off from passion, lest any root of bitterness springing up trouble us; only let us follow the image; only let us reverence our Archetype. Cut off the bodily passions; cut off also the spiritual. For by how much the soul is more precious than the body, by so much more precious is it to cleanse the soul than the body. And if cleansing of the body be a praiseworthy act, see, I pray you, how much greater and higher is that of the soul. Cut away the Arian impiety; cut away the false opinion of Sabellius; do not join more than is right, or wrongly sever; do not either confuse the Three Persons into One, or make Three diversities of Nature. The One is praiseworthy if rightly understood; and the Three when rightly divided, when the division is of Persons, not of Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 20-22"
