[[commentary]]
quote='''
For whenever I hear Isaiah threaten the people of Sodom and rulers of Gomorrah, and say Why will ye be smitten any more, adding sin to sin? I am almost filled with horror, and melted to tears. It is impossible, he says, to find any blow to add to those which are past, because of your newly added sins; so completely have you run through the whole, and exhausted every form of chastisement, ever calling upon yourselves some new one by your wickedness. There is not a wound, nor bruise, nor putrefying sore; the plague affects the whole body and is incurable: for it is impossible to apply a plaster, or ointment or bandages. I pass over the rest of the threatenings, that I may not press upon you more heavily than your present plague.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 16"
