[[commentary]]
quote='''
What shall we do in the day of visitation, with which one of the Prophets terrifies me, whether that of the righteous sentence of God against us, or that upon the mountains and hills, of which we have heard, or whatever and whenever it may be, when He will reason with us, and oppose us, and set before us those bitter accusers, our sins, comparing our wrongdoings with our benefits, and striking thought with thought, and scrutinising action with action, and calling us to account for the image which has been blurred and spoilt by wickedness, till at last He leads us away self-convicted and self-condemned, no longer able to say that we are being unjustly treated—a thought which is able even here sometimes to console in their condemnation those who are suffering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 8"
