[[commentary]]
quote='''
And you have heard David's words; The Lord is my Light and my Salvation, whom then shall I fear? And now he asks that the Light and the Truth may be sent forth for him, now giving thanks that he has a share in it, in that the Light of God is marked upon him; that is, that the signs of the illumination given are impressed upon him and recognized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 36"
