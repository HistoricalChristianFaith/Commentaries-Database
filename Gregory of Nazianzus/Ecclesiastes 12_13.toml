[[commentary]]
quote='''
I have seen all things, says the preacher, I have reviewed in thought all human things, wealth, pleasure, power, unstable glory, wisdom which evades us rather than is won; then pleasure again, wisdom again, often revolving the same objects, the pleasures of appetite, orchards, numbers of slaves, store of wealth, serving men and serving maids, singing men and singing women, arms, spearmen, subject nations, collected tributes, the pride of kings, all the necessaries and superfluities of life, in which I surpassed all the kings that were before me. And what does he say after all these things? Vanity of vanities, all is vanity and vexation of spirit, possibly meaning some unreasoning longing of the soul, and distraction of man condemned to this from the original fall: but hear, he says, the conclusion of the whole matter, Fear God. This is his stay in his perplexity, and this is thy only gain from life here below, to be guided through the disorder of the things which are seen and shaken, to the things which stand firm and are not moved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 19"
