[[commentary]]
quote='''
With Luke be inspired as you study the Acts of the Apostles. Why do you range yourself with Ananias and Sapphira, those vain embezzlers (if indeed the theft of one's own property be a vain thing) and that by appropriating, not silver nor any other cheap and worthless thing, like a wedge of gold, or a didrachma, as did of old a rapacious soldier; but stealing the Godhead Itself, and lying, not to men but to God, as you have heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 14"
