[[commentary]]
quote='''
Do you on your side offer to God and to us obedience to your Pastors, dwelling in a place of herbage, and being fed by water of refreshment; knowing your Shepherd well, and being known by him; and following when he calls you as a Shepherd frankly through the door; but not following a stranger climbing up into the fold like a robber and a traitor; nor listening to a strange voice when such would take you away by stealth and scatter you from the truth on mountains, and in deserts, and pitfalls, and places which the Lord does not visit; and would lead you away from the sound Faith in the Father, the Son, and the Holy Ghost, the One Power and Godhead, Whose Voice my sheep always heard (and may they always hear it), but with deceitful and corrupt words would tear them from their true Shepherd. From which may we all be kept, Shepherd and flock, as from a poisoned and deadly pasture; guiding and being guided far away from it, that we may all be one in Christ Jesus our Lord, now and unto the heavenly rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25201.html'
source_title="Oration 1, Section 7"

[[commentary]]
quote='''
Is mine a little flock? But it is not being carried over a precipice. Is mine a narrow fold? But it is unapproachable by wolves; it cannot be entered by a robber, nor climbed by thieves and strangers. I shall yet see it, I know well, wider. And many of those who are now wolves, I must reckon among my sheep, and perhaps even amongst the shepherds. This is the glad tidings brought me by the Good Shepherd, for Whose sake I lay down my life for the sheep. I fear not for the little flock, for it is seen at a glance. I know my sheep and am known of mine. Such are they that know God and are known of God. My sheep hear my voice, which I have heard from the oracles of God, which I have been taught by the Holy Fathers, which I have taught alike on all occasions, not conforming myself to the opportune, and which I will never cease to teach; in which I was born, and in which I will depart.

These I call by name (for they are not nameless like the stars which are numbered and have names), and they follow me, for I rear them up beside the waters of rest; and they follow every such shepherd, whose voice they love to hear, as you see; but a stranger they will not follow, but will flee from him, because they have a habit of distinguishing the voice of their own from that of strangers. They will flee from Valentinus with his division of one into two, refusing to believe that the Creator is other than the Good. They will flee from Depth and Silence, and the mythical Æons, that are verily worthy of Depth and Silence. They will flee from Marcion's god, compounded of elements and numbers; from Montanus' evil and feminine spirit; from the matter and darkness of Manes; from Novatus' boasting and wordy assumption of purity; from the analysis and confusion of Sabellius, and if I may use the expression, his absorption, contracting the Three into One, instead of defining the One in Three Personalities; from the difference of natures taught by Arius and his followers, and their new Judaism, confining the Godhead to the Unbegotten; from Photinus' earthly Christ, who took his beginning from Mary. But they worship the Father and the Son and the Holy Ghost, One Godhead; God the Father, God the Son and (do not be angry) God the Holy Ghost, One Nature in Three Personalities, intellectual, perfect, Self-existent, numerically separate, but not separate in Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252033.html'
source_title="Oration 33, Sections 15-16"
