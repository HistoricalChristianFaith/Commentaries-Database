[[commentary]]
quote='''
Who was more sympathetic in mind, more bounteous in hand, towards the poor, that most dishonoured portion of the nature to which equal honour is due? For he actually treated his own property as if it were another's, of which he was but the steward, relieving poverty as far as he could, and expending not only his superfluities but his necessities—a manifest proof of love for the poor, giving a portion, not only to seven, according to the injunction of Solomon, but if an eighth came forward, not even in his case being niggardly, but more pleased to dispose of his wealth than we know others are to acquire it; taking away the yoke and election (which means, as I think, all meanness in testing as to whether the recipient is worthy or not) and word of murmuring in benevolence. This is what most men do: they give indeed, but without that readiness, which is a greater and more perfect thing than the mere offering. For he thought it much better to be generous even to the undeserving for the sake of the deserving, than from fear of the undeserving to deprive those who were deserving. And this seems to be the duty of casting our bread upon the waters, since it will not be swept away or perish in the eyes of the just Investigator, but will arrive yonder where all that is ours is laid up, and will meet with us in due time, even though we think it not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252018.html'
source_title="Oration 18, Section 20"
