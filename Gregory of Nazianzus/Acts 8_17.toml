[[commentary]]
quote='''
What? Will you not reverence even the authority of the Spirit Who breathes upon whom, and when, and as He wills? He comes upon Cornelius and his companions before Baptism, to others after Baptism, by the hands of the Apostles; so that from both sides, both from the fact that He comes in the guise of a Master and not of a Servant, and from the fact of His being sought to make perfect, the Godhead of the Spirit is testified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 14"
