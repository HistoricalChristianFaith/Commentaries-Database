[[commentary]]
quote='''
But one thing more I preach unto you. The Station in which you shall presently stand after your Baptism before the Great Sanctuary is a foretype of the future glory. The Psalmody with which you will be received is a prelude to the Psalmody of Heaven; the lamps which you will kindle are a Sacrament of the illumination there with which we shall meet the Bridegroom, shining and virgin souls, with the lamps of our faith shining, not sleeping through our carelessness, that we may not miss Him that we look for if He come unexpectedly; nor yet unfed, and without oil, and destitute of good works, that we be not cast out of the Bridechamber. For I see how pitiable is such a case. He will come when the cry demands the meeting, and they who are prudent shall meet Him, with their light shining and its food abundant, but the others seeking for oil too late from those who possess it. And He will come with speed, and the former shall go in with Him, but the latter shall be shut out, having wasted in preparations the time of entrance; and they shall weep sore when all too late they learn the penalty of their slothfulness, when the Bride-chamber can no longer be entered by them for all their entreaties, for they have shut it against themselves by their sin, following in another fashion the example of those who missed the Wedding feast with which the good Father feasts the good Bridegroom; one on account of a newly wedded wife; another of a newly purchased field; another of a yoke of oxen; which he and they acquired to their misfortune, since for the sake of the little they lose the great. For none are there of the disdainful, nor of the slothful, nor of those who are clothed in filthy rags and not in the Wedding garment even though here they may have thought themselves worthy of wearing the bright robe there, and secretly intruded themselves, deceiving themselves with vain hopes. And then, What? When we have entered, then the Bridegroom knows what He will teach us, and how He will converse with the souls that have come in with Him. He will converse with them, I think in teaching things more perfect and more pure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 46"
