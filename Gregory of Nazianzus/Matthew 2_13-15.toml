[[commentary]]
quote='''
I will address myself as is right to those who have come from Egypt; for they have come here eagerly, having overcome illwill by zeal, from that Egypt which is enriched by the River, raining out of the earth, and like the sea in its season,—if I too may follow in my small measure those who have so eloquently spoken of these matters; and which is also enriched by Christ my Lord, Who once was a fugitive into Egypt, and now is supplied by Egypt; the first, when He fled from Herod's massacre of the children; and now by the love of the fathers for their children, by Christ the new Food of those who hunger after good; the greatest alms of corn of which history speaks and men believe; the Bread which came down from heaven and giveth life to the world, that life which is indestructible and indissoluble, concerning Whom I now seem to hear the Father saying, Out of Egypt have I called My Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 1"
