[[commentary]]
quote='''
For it is not so easy to dye deeply a piece of cloth, or to impregnate with odours, foul or the reverse, whatever comes near to them; nor is it so easy for the fatal vapour, which is rightly called a pestilence, to infect the air, and through the air to gain access to living beings, as it is for the vice of a superior to take most speedy possession of his subjects, and that with far greater facility than virtue its opposite. For it is in this that wickedness especially has the advantage over goodness, and most distressing it is to me to perceive it, that vice is something attractive and ready at hand, and that nothing is so easy as to become evil, even without any one to lead us on to it; while the attainment of virtue is rare and difficult, even where there is much to attract and encourage us. And it is this, I think, which the most blessed Haggai had before his eyes, in his wonderful and most true figure:—"Ask the priests concerning the law, saying: If holy flesh borne in a garment touch meat or drink or vessel, will it sanctify what is in contact with it? And when they said No; ask again if any of these things touch what is unclean, does it not at once partake of the pollution? For they will surely tell you that it does partake of it, and does not continue clean in spite of the contact."

What does he mean by this? As I take it, that goodness can with difficulty gain a hold upon human nature, like fire upon green wood; while most men are ready and disposed to join in evil, like stubble, I mean, ready for a spark and a wind, which is easily kindled and consumed from its dryness. For more quickly would any one take part in evil with slight inducement to its full extent, than in good which is fully set before him to a slight degree. For indeed a little wormwood most quickly imparts its bitterness to honey; while not even double the quantity of honey can impart its sweetness to wormwood: and the withdrawal of a small pebble would draw headlong a whole river, though it would be difficult for the strongest dam to restrain or stay its course.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Sections 11-12"
