[[commentary]]
quote='''
But further—Jesus goeth up out of the water . . . for with Himself He carries up the world . . . and sees the heaven opened which Adam had shut against himself and all his posterity, as the gates of Paradise by the flaming sword. And the Spirit bears witness to His Godhead, for he descends upon One that is like Him, as does the Voice from Heaven (for He to Whom the witness is borne came from thence), and like a Dove, for He honours the Body (for this also was God, through its union with God) by being seen in a bodily form; and moreover, the Dove has from distant ages been wont to proclaim the end of the Deluge. But if you are to judge of Godhead by bulk and weight, and the Spirit seems to you a small thing because He came in the form of a Dove, O man of contemptible littleness of thought concerning the greatest of things, you must also to be consistent despise the Kingdom of Heaven, because it is compared to a grain of mustard seed; and you must exalt the adversary above the Majesty of Jesus, because he is called a great Mountain, and Leviathan and King of that which lives in the water, whereas Christ is called the Lamb, and the Pearl, and the Drop and similar names.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 16"
