[[commentary]]
quote='''
As to the honour paid to Seven there are many testimonies, but we will be content with a few out of the many. For instance, seven precious spirits are named; for I think Isaiah loves to call the activities of the Spirit spirits; and the Oracles of the Lord are purified seven times according to David, and the just is delivered from six troubles and in the seventh is not smitten.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 3"
