[[commentary]]
quote='''
If you were deaf and dumb, let the Word sound in your ears, or rather keep there Him Who hath sounded. Do not shut your ears to the Instruction of the Lord, and to His Counsel, like the adder to charms.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 34"
