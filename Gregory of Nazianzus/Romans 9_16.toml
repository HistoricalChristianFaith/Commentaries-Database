[[commentary]]
quote='''
When you hear To whom it is given, add, And it is given to those who are called and to those who incline that way. For when you hear, Not of him that willeth, nor of him that runneth, but of God that sheweth mercy, I counsel you to think the same. For since there are some who are so proud of their successes that they attribute all to themselves and nothing to Him that made them and gave them wisdom and supplied them with good; such are taught by this word that even to wish well needs help from God; or rather that even to choose what is right is divine and a gift of the mercy of God. For it is necessary both that we should be our own masters and also that our salvation should be of God. This is why He saith not of him that willeth; that is, not of him that willeth only, nor of him that runneth only, but also of God. That sheweth mercy. Next; since to will also is from God, he has attributed the whole to God with reason. However much you may run, however much you may wrestle, yet you need one to give the crown. Except the Lord build the house, they laboured in vain that built it: Except the Lord keep the city, in vain they watched that keep it. I know, He says, that the race is not to the swift, nor the battle to the strong, nor the victory to the fighters, nor the harbours to the good sailors; but to God it belongs both to work victory, and to bring the barque safe to port.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 13"
