[[commentary]]
quote='''
Another girdle I know, the soldierly and manly one, I mean, from which the Euzoni of Syria and certain Monozoni take their name. And it is in respect of this too that God saith in an oracle to Job, "Nay, but gird up thy loins like a man, and give a manly answer." With this also holy David boasts that he is girded with strength from God, and speaks of God Himself as clothed with strength and girded about with power—against the ungodly of course—though perhaps some may prefer to see in this a declaration of the abundance of His power, and, as it were, its restraint, just as also He clothes Himself with Light as with a garment. For who shall endure His unrestrained power and light?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 18"
