[[commentary]]
quote='''
And if thou must needs dance, like a festival-keeper and reveller, then dance, but not the dance of Herodias the immodest, the end whereof was the death of the Baptist, but rather that of David upon the stopping of the Ark, the which I take for an emblem of a rapid and diversified walking after the will of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 35"
