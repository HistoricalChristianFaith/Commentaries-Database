[[commentary]]
quote='''
To search all things, yea, the deep things of God is, according to the testimony of S. Paul, the office of the Spirit, not because He is ignorant of them, but because He takes delight in their contemplation. Now all the things of the Spirit Basil had fully investigated, and hence he drew his instructions for every kind of character, his lessons in the sublime, and his exhortations to quit things present, and adapt ourselves to things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 65"
