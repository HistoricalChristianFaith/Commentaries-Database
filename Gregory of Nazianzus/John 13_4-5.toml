[[commentary]]
quote='''
Dost thou on this account deem Him lessened, because He girds Himself with a towel and washes His disciples' feet, and shows that humiliation is the best road to exaltation? Because for the soul that was bent to the ground He humbles Himself, that He may raise up with Himself the soul that was tottering to a fall under a weight of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 14"
