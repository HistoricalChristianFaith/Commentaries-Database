[[commentary]]
quote='''
A vine (we used to say) transplanted out of Egypt (out of dark ignorance of God), which had grown up to this beauty of faith and bigness, then the fence was taken away which formerly defended us (the protection of God); it was laid open to all passers by (to bad rulers); it was laid waste by the wild boar (by him that chose wickedness for his own, and was covered with the mire).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 27"

[[commentary]]
quote='''
And when he saw the great heritage of God, purchased by His own words and laws and sufferings, the holy nation, the royal priesthood, in such evil plight that it was torn asunder into ten thousand opinions and errors: and the vine brought out of Egypt and transplanted, the Egypt of impious and dark ignorance, which had grown to such beauty and boundless size that the whole earth was covered with the shadow of it, while it overtopped mountains and cedars, now being ravaged by that wicked wild boar, the devil, he could not content himself with quietly lamenting the misfortune, and merely lifting up his hands to God, and seeking from Him the dispersion of the pressing misfortunes, while he himself was asleep, but felt bound to come to her aid at some expense to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 41"
