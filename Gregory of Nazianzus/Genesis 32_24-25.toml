[[commentary]]
quote='''
I extol the ladder of Jacob, and the pillar which he anointed to God, and his wrestling with Him, whatever it was; and, in my opinion, it was the contrast and opposition of the human stature to the height of God, resulting in the tokens of the defeat of his race. I extol also his clever devices and success in cattle-breeding, and his children, the twelve Patriarchs, and the distribution of his blessings, with their glorious prophecy of the future. But I still more extol Basil for the ladder which he did not merely see, but which he ascended by successive steps towards excellence, and the pillar which he did not anoint, but which he erected to God, by pillorying the teaching of the ungodly; and the wrestling with which he wrestled, not with God, but, on behalf of God, to the overthrow of the heretics; and his pastoral care, whereby he grew rich, through gaining for himself a number of marked sheep greater than that of the unmarked, and his illustrious fruitfulness in spiritual children, and the blessing with which he established many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 71"
