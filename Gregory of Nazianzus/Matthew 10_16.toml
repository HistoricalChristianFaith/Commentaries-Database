[[commentary]]
quote='''
Such and so remarkable being his gentleness, did he yield the palm to others in industry and practical virtue? By no means. Gentle as he was, he possessed, if any one did, an energy corresponding to his gentleness. For although, for the most part, the two virtues of benevolence and severity are at variance and opposed to each other, the one being gentle but without practical qualities, the other practical but unsympathetic, in his case there was a wonderful combination of the two, his action being as energetic as that of a severe man, but combined with gentleness; while his readiness to yield seemed unpractical but was accompanied with energy, in his patronage, his freedom of speech, and every kind of official duty. He united the wisdom of the serpent, in regard to evil, with the harmlessness of the dove, in regard to good, neither allowing the wisdom to degenerate into knavery, nor the simplicity into silliness, but as far as in him lay, he combined the two in one perfect form of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252018.html'
source_title="Oration 18, Section 27"
