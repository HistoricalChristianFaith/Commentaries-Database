[[commentary]]
quote='''
This, then, is our reply to those who would puzzle us; not given willingly indeed (for light talk and contradictions of words are not agreeable to the faithful, and one Adversary is enough for us), but of necessity, for the sake of our assailants (for medicines exist because of diseases), that they may be led to see that they are not all-wise nor invincible in those superfluous arguments which make void the Gospel. For when we leave off believing, and protect ourselves by mere strength of argument, and destroy the claim which the Spirit has upon our faith by questionings, and then our argument is not strong enough for the importance of the subject (and this must necessarily be the case, since it is put in motion by an organ of so little power as is our mind), what is the result? The weakness of the argument appears to belong to the mystery, and thus elegance of language makes void the Cross, as Paul also thought. For faith is that which completes our argument.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 21"
