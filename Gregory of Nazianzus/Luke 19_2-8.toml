[[commentary]]
quote='''
Be a Zaccheus, who yesterday was a Publican, and is to-day of liberal soul; offer all to the coming in of Christ, that though small in bodily stature you may show yourself great, nobly contemplating Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 31"
