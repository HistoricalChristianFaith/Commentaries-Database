[[commentary]]
quote='''
Thou art angry, and we have sinned, says one of old, making confession; and it is now time for me to say the opposite, "We have sinned, and Thou art angry:" therefore have we become a reproach to our neighbours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 12"
