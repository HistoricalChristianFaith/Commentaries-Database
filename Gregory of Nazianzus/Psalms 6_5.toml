[[commentary]]
quote='''
I do not dwell on the judgments to come, to which indulgence in this world delivers us, as it is better to be punished and cleansed now than to be transmitted to the torment to come, when it is the time of chastisement, not of cleansing. For as he who remembers God here is conqueror of death (as David has most excellently sung) so the departed have not in the grave confession and restoration; for God has confined life and action to this world, and to the future the scrutiny of what has been done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 7"
