[[commentary]]
quote='''
They two, He says, shall be one Flesh; so let the one flesh have equal honour." And Paul legislates for chastity by His example. How, and in what way? This Sacrament is great, he says, But I speak concerning Christ and the Church. It is well for the wife to reverence Christ through her husband: and it is well for the husband not to dishonor the Church through his wife. Let the wife, he says, see that she reverence her husband, for so she does Christ; but also he bids the husband cherish his wife, for so Christ does the Church. Let us, then, give further consideration to this saying.

Churn milk and it will be butter; examine this and perhaps you may find something more nourishing in it. For I think that the Word here seems to deprecate second marriage. For, if there were two Christs, there may be two husbands or two wives; but if Christ is One, one Head of the Church, let there be also one flesh, and let a second be rejected; and if it hinder the second what is to be said for a third? The first is law, the second is indulgence, the third is transgression, and anything beyond this is swinish, such as has not even many examples of its wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 7-8"
