[[commentary]]
quote='''
What of Habakkuk? He utters more heated words, and is impatient with God Himself, and cries down, as it were our good Lord, because of the injustice of the judges. O Lord, how long shall I cry and Thou wilt not hear? Shall I cry out unto Thee of violence, and Thou wilt not save? Why dost Thou show me toil and labour, causing me to look upon perverseness and impiety? Judgment has been given against me, and the judge is a spoiler. Therefore the law is slacked, and judgment doth never go forth. Then comes the denunciation, and what follows upon it. Behold, ye despisers, and regard, and wonder marvellously, and vanish away, for I work a work. But why need I quote the whole of the denunciation?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 60"
