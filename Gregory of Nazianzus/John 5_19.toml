[[commentary]]
quote='''
Sixthly, let it be asserted that it is written, The Son can do nothing of Himself, but what He seeth the Father do. The solution of this is as follows:—Can and Cannot are not words with only one meaning, but have many meanings. On the one hand they are used sometimes in respect of deficiency of strength, sometimes in respect of time, and sometimes relatively to a certain object; as for instance, A Child cannot be an Athlete, or, A Puppy cannot see, or fight with so and so. Perhaps some day the child will be an athlete, the puppy will see, will fight with that other, though it may still be unable to fight with Any other. Or again, they may be used of that which is Generally true. For instance,—A city that is set on a hill cannot be hid; while yet it might possibly be hidden by another higher hill being in a line with it. Or in another sense they are used of a thing which is not reasonable; as, Can the Children of the Bridechamber fast while the Bridegroom is with them; whether He be considered as visible in bodily form (for the time of His sojourning among us was not one of mourning, but of gladness), or, as the Word. For why should they keep a bodily fast who are cleansed by the Word? Or, again, they are used of that which is contrary to the will; as in, He could do no mighty works there because of their unbelief,—i.e. of those who should receive them. For since in order to healing there is need of both faith in the patient and power in the Healer, when one of the two failed the other was impossible. But probably this sense also is to be referred to the head of the unreasonable. For healing is not reasonable in the case of those who would afterwards be injured by unbelief. The sentence The world cannot hate you, comes under the same head, as does also How can ye, being evil, speak good things? For in what sense is either impossible, except that it is contrary to the will? There is a somewhat similar meaning in the expressions which imply that a thing impossible by nature is possible to God if He so wills; as that a man cannot be born a second time, or that a needle will not let a camel through it. For what could prevent either of these things happening, if God so willed?

And besides all this, there is the absolutely impossible and inadmissible, as that which we are now examining. For as we assert that it is impossible for God to be evil, or not to exist—for this would be indicative of weakness in God rather than of strength—or for the non-existent to exist, or for two and two to make both four and ten, so it is impossible and inconceivable that the Son should do anything that the Father doeth not. For all things that the Father hath are the Son's; and on the other hand, all that belongs to the Son is the Father's. Nothing then is peculiar, because all things are in common. For Their Being itself is common and equal, even though the Son receive it from the Father. It is in respect of this that it is said I live by the Father; not as though His Life and Being were kept together by the Father, but because He has His Being from Him beyond all time, and beyond all cause. But how does He see the Father doing, and do likewise? Is it like those who copy pictures and letters, because they cannot attain the truth unless by looking at the original, and being led by the hand by it? But how shall Wisdom stand in need of a teacher, or be incapable of acting unless taught? And in what sense does the Father "Do" in the present or in the past? Did He make another world before this one, or is He going to make a world to come? And did the Son look at that and make this? Or will He look at the other, and make one like it? According to this argument there must be Four worlds, two made by the Father, and two by the Son. What an absurdity! He cleanses lepers, and delivers men from evil spirits, and diseases, and quickens the dead, and walks upon the sea, and does all His other works; but in what case, or when did the Father do these acts before Him? Is it not clear that the Father impressed the ideas of these same actions, and the Word brings them to pass, yet not in slavish or unskilful fashion, but with full knowledge and in a masterly way, or, to speak more properly, like the Father? For in this sense I understand the words that whatsoever is done by the Father, these things doeth the Son likewise; not, that is, because of the likeness of the things done, but in respect of the Authority. This might well also be the meaning of the passage which says that the Father worketh hitherto and the Son also; and not only so but it refers also to the government and preservation of the things which He has made; as is shewn by the passage which says that He maketh His Angels Spirits, and that the earth is founded upon its steadfastness (though once for all these things were fixed and made) and that the thunder is made firm and the wind created. Of all these things the Word was given once, but the Action is continuous even now.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Sections 10-11"
