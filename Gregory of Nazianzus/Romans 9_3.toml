[[commentary]]
quote='''
He fights for all, prays for all, is jealous for all, is kindled on behalf of all, whether without law, or under the law; a preacher of the Gentiles, a patron of the Jews. He even was exceedingly bold on behalf of his brethren according to the flesh, if I may myself be bold enough to say so, in his loving prayer that they might in his stead be brought to Christ. What magnanimity! what fervor of spirit! He imitates Christ, who became a curse for us, who took our infirmities and bore our sicknesses; or, to use more measured terms, he is ready, next to Christ, to suffer anything, even as one of the ungodly, for them, if only they be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 55"
