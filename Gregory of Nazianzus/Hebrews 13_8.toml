[[commentary]]
quote='''
They are the titles of the Son. Walk through them, those that are lofty in a godlike manner; those that belong to the body in a manner suitable to them; or rather, altogether in a godlike manner, that thou mayest become a god, ascending from below, for His sake Who came down from on high for ours. In all and above all keep to this, and thou shalt never err, either in the loftier or the lowlier names; Jesus Christ is the Same yesterday and to-day in the Incarnation, and in the Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 21"
