[[commentary]]
quote='''
The Old Testament proclaimed the Father openly, and the Son more obscurely. The New manifested the Son, and suggested the Deity of the Spirit. Now the Spirit Himself dwells among us, and supplies us with a clearer demonstration of Himself. For it was not safe, when the Godhead of the Father was not yet acknowledged, plainly to proclaim the Son; nor when that of the Son was not yet received to burden us further (if I may use so bold an expression) with the Holy Ghost; lest perhaps people might, like men loaded with food beyond their strength, and presenting eyes as yet too weak to bear it to the sun's light, risk the loss even of that which was within the reach of their powers; but that by gradual additions, and, as David says, Goings up, and advances and progress from glory to glory, the Light of the Trinity might shine upon the more illuminated. For this reason it was, I think, that He gradually came to dwell in the Disciples, measuring Himself out to them according to their capacity to receive Him, at the beginning of the Gospel, after the Passion, after the Ascension, making perfect their powers, being breathed upon them, and appearing in fiery tongues. And indeed it is by little and little that He is declared by Jesus, as you will learn for yourself if you will read more carefully. I will ask the Father, He says, and He will send you another Comforter, even the spirit of Truth. This He said that He might not seem to be a rival God, or to make His discourses to them by another authority. Again, He shall send Him, but it is in My Name. He leaves out the I will ask, but He keeps the Shall send, then again, I will send,—His own dignity. Then shall come, the authority of the Spirit.

You see lights breaking upon us, gradually; and the order of Theology, which it is better for us to keep, neither proclaiming things too suddenly, nor yet keeping them hidden to the end. For the former course would be unscientific, the latter atheistical; and the former would be calculated to startle outsiders, the latter to alienate our own people. I will add another point to what I have said; one which may readily have come into the mind of some others, but which I think a fruit of my own thought. Our Saviour had some things which, He said, could not be borne at that time by His disciples (though they were filled with many teachings), perhaps for the reasons I have mentioned; and therefore they were hidden. And again He said that all things should be taught us by the Spirit when He should come to dwell amongst us. Of these things one, I take it, was the Deity of the Spirit Himself, made clear later on when such knowledge should be seasonable and capable of being received after our Saviour's restoration, when it would no longer be received with incredulity because of its marvellous character. For what greater thing than this did either He promise, or the Spirit teach. If indeed anything is to be considered great and worthy of the Majesty of God, which was either promised or taught.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Sections 26-27"
