[[commentary]]
quote='''
Look also, I pray you, at those who stretch themselves upon beds of ivory, whom the divine Amos fitly upbraids, who anoint themselves with the chief ointments, and chant to the sound of instruments of music, and attach themselves to transitory things as though they were stable, but have not grieved nor had compassion for the affliction of Joseph; though they ought to have been kind to those who had met with disaster before them, and by mercy have obtained mercy; as the fir-tree should howl, because the cedar had fallen, and be instructed by their neighbours' chastisement, and be led by others' ills to regulate their own lives, having the advantage of being saved by their predecessors' fate, instead of being themselves a warning to others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 19"
