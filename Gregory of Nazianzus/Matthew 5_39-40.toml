[[commentary]]
quote='''
And how very clever was the argument of him that was at once executioner and sovereign, law-breaker, and law-maker; or, to speak more correctly, rather "enemy and avenger," according to our way of speaking. "That it was part of our religion neither to resist injury nor to go to law, nor to possess anything at all, nor to consider anything one's own, but to live in the other world, and to despise things present as though they were not; neither is it lawful for anyone to return evil for evil, but when they are smitten on the one cheek to turn the other also to the smiter, and to be stripped of the coat after the cloak;" and perhaps he will add, "ought to pray for those that injured them, and wish well to their persecutors." 'Tis very true he could not help knowing all this—he that once was a Reader of the divine oracles, was a candidate for the honour of the great pulpit, and used to glorify the Martyrs by the gift of churches and of consecrated lands!

In which place I am first astonished that the man so accurately acquainted with all this, had not observed, or else had purposely overlooked that text, "The wicked man shall perish in an evil way, and so shall everyone that denieth God;" nay (what is going further than this), whilst he was plaguing such as stood fast in their confession, and was entangling them in such troubles as he himself richly deserved to fall into. If, therefore, according to the rule he prescribes, "that we must be such as above described, and abide within the limits defined," he is able to prove that fact—then judgment is passed on him that he is the worse of the two, or else that this conduct is well-pleasing to his own gods; and inasmuch as habits are divided into two kinds (I mean Virtue and Vice), he proves that the better part is set apart for us, the worse cast contemptuously to his side. Let him allow this, and then we shall gain our cause by the testimony of our adversaries and those prosecuting us. But if they make any pretence to generosity and clemency, in speech at least if not in action, and are not so devoid of shame (even though they be very wicked and delight in evil gods) as to assert that Vice, like one of two snares, belongs to them—let them show in that case how and where it is just that we when wronged shall endure it patiently, whilst they should not spare us who spare them? View the matter in this way: seasons of power have come to us as well as to you, revolving and changing from one side to the other. What has ever happened to your party from the Christians of the kind that has often happened to the Christians from your party? Of what liberty of speech have we debarred you? Against whom have we stirred up furious mobs, or officials going far beyond their instructions? Whom have we brought into peril of his life, or rather, whom have we expelled from their offices and honours that belong by right to the best men? And to sum up all, upon whom have we inflicted anything like what has often been perpetrated by your side, and often been threatened? Not even yourselves can say this, you who cast in our teeth our own gentleness and humanity.

And then how comes it that thou dost not consider this circumstance, thou wisest and most knowing of men, thou that confinest the Christians within the strictest limit of virtue, that in our code of laws some rules carry with them the necessity of obedience to their injunctions; and which, if not observed, punishment follows; whereas others do not carry with them obligation, but voluntary obedience; whilst for such as do not observe them, no punishment whatever follows. Now if it were possible for all to be very good, and attain to the extreme point of virtue, this certainly would be best and most perfect: and since things divine are distinct from things human, and whilst the former have in themselves all that is good, it is a great thing if the latter attain even to mediocrity—what is the meaning of thy prescribing rules that are not meant for all, or else that they are condemned who do not keep them; just as though those not deserving of capital punishment were ipso facto deserving of commendation: and, on the other hand, those not worthy of commendation deserved capital punishment; but rather the right thing is so long as we remain within the limits of our own system and of human capability, then to demand of us correctness of conduct.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Sections 97-99"
