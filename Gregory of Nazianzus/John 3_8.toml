[[commentary]]
quote='''
As to the things of the Spirit, may the Spirit be with me, and grant me speech as much as I desire; or if not that, yet as is in due proportion to the season. Anyhow He will be with me as my Lord; not in servile guise, nor awaiting a command, as some think. For He bloweth where He wills and on whom He wills, and to what extent He wills. Thus we are inspired both to think and to speak of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 5"
