[[commentary]]
quote='''
Let nothing hinder you from going on, nor draw you away from your readiness. While your desire is still vehement, seize upon that which you desire. While the iron is hot, let it be tempered by the cold water, lest anything should happen in the interval, and put an end to your desire. I am Philip; do you be Candace's Eunuch. Do you also say, "See, here is water, what doth hinder me to be baptized?" Seize the opportunity; rejoice greatly in the blessing; and having spoken be baptized; and having been baptized be saved; and though you be an Ethiopian body, be made white in soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 26"
