[[commentary]]
quote='''
What of the regulations of Jesus for his disciples, when He sends them to preach? The main object of these is—not to enter into particulars—that they should be of such virtue, so simple and modest, and in a word, so heavenly, that the gospel should make its way, no less by their character than by their preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 69"

[[commentary]]
quote='''
And as to shoes, let him who is about to touch the Holy Land which the feet of God have trodden, put them off, as Moses did upon the Mount, that he may bring there nothing dead; nothing to come between Man and God. So too if any disciple is sent to preach the Gospel, let him go in a spirit of philosophy and without excess, inasmuch as he must, besides being without money and without staff and with but one coat, also be barefooted, that the feet of those who preach the Gospel of Peace and every other good may appear beautiful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 19"
