[[commentary]]
quote='''
So, help me, each of you who can, and stretch out a hand to me who am pressed down and torn asunder by regret and enthusiasm. The one suggests flights, mountains and deserts, and calm of soul and body, and that the mind should retire into itself, and recall its powers from sensible things, in order to hold pure communion with God, and be clearly illumined by the flashing rays of the Spirit, with no admixture or disturbance of the divine light by anything earthly or clouded, until we come to the source of the effulgence which we enjoy here, and regret and desire are alike stayed, when our mirrors pass away in the light of truth. The other wills that I should come forward, and bear fruit for the common good, and be helped by helping others, and publish the Divine light, and bring to God a people for His own possession, a holy nation, a royal priesthood, and His image cleansed in many souls. And this, because, as a park is better than and preferable to a tree, the whole heaven with its ornaments to a single star, and the body to a limb, so also, in the sight of God, is the reformation of a whole church preferable to the progress of a single soul: and therefore, I ought not to look only on my own interest, but also on that of others. For Christ also likewise, when it was possible for him to abide in His own honour and deity, not only so far emptied Himself as to take the form of a slave, but also endured the cross, despising the shame, that he might by His own sufferings destroy sin, and by death slay death. The former are the imaginings of desire, the latter the teachings of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252012.html'
source_title="Oration 12, Section 4"
