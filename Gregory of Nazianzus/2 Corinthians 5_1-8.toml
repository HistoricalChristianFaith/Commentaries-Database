[[commentary]]
quote='''
I believe the words of the wise, that every fair and God-beloved soul, when, set free from the bonds of the body, it departs hence, at once enjoys a sense and perception of the blessings which await it, inasmuch as that which darkened it has been purged away, or laid aside—I know not how else to term it—and feels a wondrous pleasure and exultation, and goes rejoicing to meet its Lord, having escaped as it were from the grievous poison of life here, and shaken off the fetters which bound it and held down the wings of the mind, and so enters on the enjoyment of the bliss laid up for it, of which it has even now some conception. Then, a little later, it receives its kindred flesh, which once shared in its pursuits of things above, from the earth which both gave and had been entrusted with it, and in some way known to God, who knit them together and dissolved them, enters with it upon the inheritance of the glory there. And, as it shared, through their close union, in its hardships, so also it bestows upon it a portion of its joys, gathering it up entirely into itself, and becoming with it one in spirit and in mind and in God, the mortal and mutable being swallowed up of life. Hear at least how the inspired Ezekiel discourses of the knitting together of bones and sinews, how after him Saint Paul speaks of the earthly tabernacle, and the house not made with hands, the one to be dissolved, the other laid up in heaven, alleging absence from the body to be presence with the Lord, and bewailing his life in it as an exile, and therefore longing for and hastening to his release.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 21"
