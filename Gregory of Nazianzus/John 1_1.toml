[[commentary]]
quote='''
With John thunder, sounding forth nothing that is low or earthly concerning God, but what is high and heavenly, Who is in the beginning, and is with God, and is God the Word, and true God of the true Father, and not a good fellow-servant honoured only with the title of Son; and the Other Comforter (other, that is, from the Speaker, Who was the Word of God).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 13"

[[commentary]]
quote='''
He removeth from place to place, Who is not contained in any place; the timeless, the bodiless, the uncircumscript, the same Who was and is; Who was both above time, and came under time, and was invisible and is seen. He was in the beginning and was with God, and was God. The word Was occurs the third time to be confirmed by number. What He was He laid aside; what He was not He assumed; not that He became two, but He deigned to be One made out of the two. For both are God, that which assumed, and that which was assumed; two Natures meeting in One, not two Sons (let us not give a false account of the blending).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 2"
