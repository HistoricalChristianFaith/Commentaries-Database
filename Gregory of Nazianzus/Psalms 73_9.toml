[[commentary]]
quote='''
There was no need of anything of this kind in the expedition against us, but what was still worse and more harmful, this was what the Emperor was reported to say and do. He stretched forth his mouth unto heaven, speaking blasphemy against the most High, and his tongue went through the world. Excellently did the inspired David before our days thus describe him who made heaven to stoop to earth, and reckoned with the creation that supermundane nature, which the creation cannot even contain, even though in kindness to man it did to some extent come among us, in order to draw to itself us who were lying upon the ground.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 45"
