[[commentary]]
quote='''
This is our present Festival; it is this which we are celebrating to-day, the Coming of God to Man, that we might go forth, or rather (for this is the more proper expression) that we might go back to God—that putting off the old man, we might put on the New; and that as we died in Adam, so we might live in Christ, being born with Christ and crucified with Him and buried with Him and rising with Him. For I must undergo the beautiful conversion, and as the painful succeeded the more blissful, so must the more blissful come out of the painful. For where sin abounded Grace did much more abound; and if a taste condemned us, how much more doth the Passion of Christ justify us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 4"
