[[commentary]]
quote='''
This Spirit shares with the Son in working both the Creation and the Resurrection, as you may be shewn by this Scripture; By the Word of the Lord were the heavens made, and all the power of them by the breath of His Mouth; and this, The Spirit of God that made me, and the Breath of the Almighty that teacheth me; and again, Thou shalt send forth Thy Spirit and they shall be created, and Thou shalt renew the face of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 14"
