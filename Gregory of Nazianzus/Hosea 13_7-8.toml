[[commentary]]
quote='''
I know Him, Who, though free from passion, meets us like a bear robbed of her whelps, like a leopard in the way of the Assyrians, not only those of that day, but if anyone now is an Assyrian in wickedness: nor is it possible to escape the might and speed of His wrath when He watches over our impieties, and His jealousy, which knoweth to devour His adversaries, pursues His enemies to the death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 7"
