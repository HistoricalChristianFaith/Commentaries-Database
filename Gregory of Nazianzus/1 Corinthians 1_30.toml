[[commentary]]
quote='''
He is Righteousness, because He distributes according to that which we deserve, and is a righteous Arbiter both for those who are under the Law and for those who are under Grace, for soul and body, so that the former should rule, and the latter obey, and the higher have supremacy over the lower; that the worse may not rise in rebellion against the better. He is Sanctification, as being Purity, that the Pure may be contained by Purity. And Redemption, because He sets us free, who were held captive under sin, giving Himself a Ransom for us, the Sacrifice to make expiation for the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 20"
