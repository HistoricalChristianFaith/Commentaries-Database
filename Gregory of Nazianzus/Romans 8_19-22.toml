[[commentary]]
quote='''
I find but one voice, one song in any way worthy of the present occasion—that which Isaiah hath shouted out before us, exactly suited to the present times, and vying with the magnitude of the blessing: "Let the heavens above rejoice, and let the clouds drop down righteousness; let the mountains break forth into joy, and let the little hills exult" inasmuch as the whole creation and the heavenly powers, such, at least, is my opinion, take an equal interest in these events. For not only does the "whole creation groan with us and is in the pangs of labour, being made subject to corruption" (I mean to things below that are born and perish) "expecting the end of these things and the revelation," in order that itself may then obtain the hoped-for deliverance, as being bound fast to them against its will through the power of Him that created it; but it also joins in glorifying Him, and exults together with the sons of God when they do rejoice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Section 15"
