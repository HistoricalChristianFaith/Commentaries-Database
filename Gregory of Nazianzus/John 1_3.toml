[[commentary]]
quote='''
So I will not be frightened by the argument that all things are said to have been made by the Son; as if the Holy Spirit also were one of these things. For it says all things that were made, and not simply all things. For the Father was not, nor were any of the things that were not made. Prove that He was made, and then give Him to the Son, and number Him among the creatures; but until you can prove this you will gain nothing for your impiety from this comprehensive phrase. For if He was made, it was certainly through Christ; I myself would not deny that. But if He was not made, how can He be either one of the All, or through Christ? Cease then to dishonour the Father in your opposition to the Only-begotten (for it is no real honour, by presenting to Him a creature to rob Him of what is more valuable, a Son), and to dishonour the Son in your opposition to the Spirit. For He is not the Maker of a Fellow servant, but He is glorified with One of co-equal honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 12"
