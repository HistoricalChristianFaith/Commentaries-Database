[[commentary]]
quote='''
Would that I might mortify my members that are upon the earth, would that I might spend my all upon the spirit, walking in the way that is narrow and trodden by few, not that which is broad and easy. For glorious and great are its consequences, and our hope is greater than our desert. What is man, that Thou art mindful of him? What is this new mystery which concerns me? I am small and great, lowly and exalted, mortal and immortal, earthly and heavenly. I share one condition with the lower world, the other with God; one with the flesh, the other with the spirit. I must be buried with Christ, arise with Christ, be joint heir with Christ, become the son of God, yea, God Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 23"
