[[commentary]]
quote='''
For I am neither going to lament for him who is gone more than is good—as I should not approve of such conduct even in others—nor am I going to praise him beyond due measure. Albeit that language is a dear and especially proper tribute to one gifted with it, and eulogy to one who was exceedingly fond of my words—aye, not only a tribute, but a debt, the most just of all debts. But even in my tears and admiration I must respect the law which regards such matters: nor is this alien to our philosophy; for he says The memory of the just is accompanied with eulogies, and also, Let tears fall down over the dead, and begin to lament, as if thou hadst suffered great harm thyself: removing us equally from insensibility and immoderation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 1"
