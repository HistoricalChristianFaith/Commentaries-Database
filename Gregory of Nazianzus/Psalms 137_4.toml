[[commentary]]
quote='''
So that it is not the continual remembrance of God that I would hinder, but only the talking about God; nor even that as in itself wrong, but only when unseasonable; nor all teaching, but only want of moderation. As of even honey repletion and satiety, though it be of honey, produce vomiting; and, as Solomon says and I think, there is a time for every thing, and that which is good ceases to be good if it be not done in a good way; just as a flower is quite out of season in winter, and just as a man's dress does not become a woman, nor a woman's a man; and as geometry is out of place in mourning, or tears at a carousal; shall we in this instance alone disregard the proper time, in a matter in which most of all due season should be respected? Surely not, my friends and brethren (for I will still call you Brethren, though you do not behave like brothers). Let us not think so nor yet, like hot tempered and hard mouthed horses, throwing off our rider Reason, and casting away Reverence, that keeps us within due limits, run far away from the turning point, but let us philosophize within our proper bounds, and not be carried away into Egypt, nor be swept down into Assyria, nor sing the Lord's song in a strange land, by which I mean before any kind of audience, strangers or kindred, hostile or friendly, kindly or the reverse, who watch what we do with over great care, and would like the spark of what is wrong in us to become a flame, and secretly kindle and fan it and raise it to heaven with their breath and make it higher than the Babylonian flame which burnt up every thing around it. For since their strength lies not in their own dogmas, they hunt for it in our weak points. And therefore they apply themselves to our—shall I say "misfortunes" or "failings"?—like flies to wounds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252027.html'
source_title="Oration 27, Section 5"
