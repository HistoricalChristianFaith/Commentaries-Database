[[commentary]]
quote='''
Wherefore we must purify ourselves first, and then approach this converse with the Pure; unless we would have the same experience as Israel, who could not endure the glory of the face of Moses, and therefore asked for a veil; or else would feel and say with Manoah "We are undone O wife, we have seen God," although it was God only in his fancy; or like Peter would send Jesus out of the boat, as being ourselves unworthy of such a visit; and when I say Peter, I am speaking of the man who walked upon the waves; or like Paul would be stricken in eyes, as he was before he was cleansed from the guilt of his persecution, when he conversed with Him Whom he was persecuting—or rather with a short flash of That great Light; or like the Centurion would seek for healing, but would not, through a praiseworthy fear, receive the Healer into his house. Let each one of us also speak so, as long as he is still uncleansed, and is a Centurion still, commanding many in wickedness, and serving in the army of Cæsar, the World-ruler of those who are being dragged down; "I am not worthy that thou shouldest come under my roof." But when he shall have looked upon Jesus, though he be little of stature like Zaccheus of old, and climb up on the top of the sycamore tree by mortifying his members which are upon the earth, and having risen above the body of humiliation, then he shall receive the Word, and it shall be said to him, This day is salvation come to this house. Then let him lay hold on the salvation, and bring forth fruit more perfectly, scattering and pouring forth rightly that which as a publican he wrongly gathered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 9"
