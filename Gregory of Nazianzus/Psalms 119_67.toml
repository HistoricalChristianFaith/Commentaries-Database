[[commentary]]
quote='''
In reality it seems a harder matter to retain good things, than to obtain those we do not possess; and more easy to recover departed prosperity by dint of care, than to preserve long that which is present, and "pride goeth before destruction," the Proverbs well say, "and humility before glory;" or, that I may speak more plainly, ruin follows pride, and glorification follows humility. "The Lord sets His face against the high-minded, and giveth grace unto the humble, and recompenseth contrary things unto the adversaries; He that meeteth out all things justly." Of this the divine David was well aware, and reckons as one of his blessings, the fact of his being chastened, and confesses his thankfulness to Him, Who had chastened; inasmuch as the learning the commandments accrued to himself therefrom. And, "Before I was humbled (says he), I went astray: on this account I have kept Thy word," placing his humiliation in the middle between his transgression and his correction, seeing that it arose out of the first, and produced the second, for sin is the parent of humiliation, and humiliation of repentance. So we, having been exalted when we were virtuous and orderly; and having grown up into this form and multitude through God's guidance, "waxed fat and kicked;" and when we had spread ourselves out, we were pressed close; and the glory and strength that we had gathered amidst persecutions and oppression, this when we prospered we brought to ruin—the sequel of my discourse shall show how.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Section 32"
