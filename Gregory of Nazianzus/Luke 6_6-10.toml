[[commentary]]
quote='''
Yesterday meanness and avarice were withering your hand; to-day let liberality and kindness stretch it out. It is a noble cure for a weak hand to disperse abroad, to give to the poor, to pour out the things which we possess abundantly, till we reach the very bottom; and perhaps this will gush forth food for you, as for the woman of Sarepta, and especially if you happen to be feeding an Elias, to recognize that it is a good abundance to be needy for the sake of Christ, Who for our sakes became poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 34"
