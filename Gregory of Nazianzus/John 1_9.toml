[[commentary]]
quote='''
But we have so much confidence in the Deity of the Spirit Whom we adore, that we will begin our teaching concerning His Godhead by fitting to Him the Names which belong to the Trinity, even though some persons may think us too bold. The Father was the True Light which lighteneth every man coming into the world. The Son was the True Light which lighteneth every man coming into the world. The Other Comforter was the True Light which lighteneth every man coming into the world. Was and Was and Was, but Was One Thing. Light thrice repeated; but One Light and One God. This was what David represented to himself long before when he said, In Thy Light shall we see Light. And now we have both seen and proclaim concisely and simply the doctrine of God the Trinity, comprehending out of Light (the Father), Light (the Son), in Light (the Holy Ghost).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 3"
