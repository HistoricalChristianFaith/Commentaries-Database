[[commentary]]
quote='''
For He that said unto backsliding Israel, "If ye offer a wheaten cake, it is vain: your incense is an abomination unto me;" not accepting their New Moons and Sabbaths and Great Day, seeing that He, being full, stands not in need of anything that is human and little, so that He should take pleasure in those who offer to Him unworthily; for He abominates the sacrifice of transgressors, even though it be a calf, as that of a dog, and their frankincense like a blasphemy; and excluding from the Temple and shaking off as defilement the hire of a harlot; whilst He gives honour to that sacrifice alone which pure hands bring unto the Most Pure, and a high and sanctified spirit. What wonder, then, if He did not accept honour from that man, offered in bad manner and from a bad motive,—He that seeth not as man seeth, nor looketh at the outward appearance, but at the hidden man, and the inward workshop of virtue or of wickedness!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Section 29"
