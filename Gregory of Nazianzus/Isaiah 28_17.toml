[[commentary]]
quote='''
Discourse awhile on our present heavy blow, about the just judgments of God, whether we grasp their meaning, or are ignorant of their great deep. How again "mercy is put in the balance," as holy Isaiah declares, for goodness is not without discernment, as the first labourers in the vineyard fancied, because they could not perceive any distinction between those who were paid alike: and how anger, which is called "the cup in the hand of the Lord," and "the cup of falling which is drained," is in proportion to transgressions, even though He abates to all somewhat of what is their due, and dilutes with compassion the unmixed draught of His wrath. For He inclines from severity to indulgence towards those who accept chastisement with fear, and who after a slight affliction conceive and are in pain with conversion, and bring forth the perfect spirit of salvation; but nevertheless he reserves the dregs, the last drop of His anger, that He may pour it out entire upon those who, instead of being healed by His kindness, grow obdurate, like the hard-hearted Pharaoh, that bitter taskmaster, who is set forth as an example of the power of God over the ungodly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 4"
