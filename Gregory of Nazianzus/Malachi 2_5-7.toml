[[commentary]]
quote='''
Again he reminds them of the covenant of God, a covenant of life and peace, with the sons of Levi, and that they should serve Him in fear, and stand in awe of the manifestation of His Name. The law of truth, he says, was in his mouth, and unrighteousness was not found in his lips; he walked with me uprightly in peace, and turned away many from iniquity: for the priest's lips shall keep knowledge, and they shall seek the law at his mouth. And how honourable and at the same time how fearful is the cause! for he is the messenger of the Lord Almighty. Although I pass over the following imprecations, as strongly worded, yet I am afraid of their truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 61"
