[[commentary]]
quote='''
And how shall we preserve the truth that God pervades all things and fills all, as it is written "Do not I fill heaven and earth? saith the Lord," and "The Spirit of the Lord filleth the world," if God partly contains and partly is contained? For either He will occupy an empty Universe, and so all things will have vanished for us, with this result, that we shall have insulted God by making Him a body, and by robbing Him of all things which He has made; or else He will be a body contained in other bodies, which is impossible; or He will be enfolded in them, or contrasted with them, as liquids are mixed, and one divides and is divided by another;—a view which is more absurd and anile than even the atoms of Epicurus and so this argument concerning the body will fall through, and have no body and no solid basis at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 8"
