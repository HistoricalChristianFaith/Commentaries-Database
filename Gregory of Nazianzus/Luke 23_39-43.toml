[[commentary]]
quote='''
If you are crucified with Him as a robber, acknowledge God as a penitent robber. If even He was numbered among the transgressors for you and your sin, do you become law-abiding for His sake. Worship Him Who was hanged for you, even if you yourself are hanging; make some gain even from your wickedness; purchase salvation by your death; enter with Jesus into Paradise, so that you may learn from what you have fallen. Contemplate the glories that are there; let the murderer die outside with his blasphemies; and if you be a Joseph of Arimathaea, beg the Body from him that crucified Him, make thine own that which cleanses the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 24"
