[[commentary]]
quote='''
Men and women, young and old, all ye that have been admitted to this tribunal, and all ye that are set in the lower place, all ye whom the Lord hath redeemed, first, out of error and ungodliness, and now from the rebellion of the gentiles, from the dangers already present, and from those anticipated: hear the words of a man not slightly versed in such matters both from what daily takes place and from ancient histories, books, and facts. It is a great thing never to have experienced any trouble—though perhaps, after all, not a great thing if the saying be true, "Whom the Lord loveth He chasteneth, and scourgeth the son whom He accepteth and for whom He careth." But truly it is a great thing never to have sinned at all—at least heinously, inasmuch as completeness in virtue the Lord has placed beyond mortal reach; and secondly, it is a great thing that such as have somewhat stumbled and been chastised, and then set on their feet again, should abide sensible of that correction, and shun a second scourging for a second offence.

Wherefore let us be really corrected by this divine correction; let us show ourselves deserving, not only of what we have suffered at first, but of the blessings we obtained afterwards; let us make some defence, as regards the calamity that overtook us, in the fact that we were not given over to the gentiles as malefactors, but have been chastised as sons; let us not forget the tossing in the calm, nor the sickness in time of health, nor the captivity when restored to Jerusalem, nor Egypt after leaving Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Sections 33-34"

[[commentary]]
quote='''
For whom the Lord loveth He chasteneth, and a rebuke is a fatherly action; while every soul which is unchastised, is unhealed. Is not then freedom from chastisement a hard thing? But to fail to be corrected by the chastisement is still harder. One of the prophets, speaking of Israel, whose heart was hard and uncircumcised, says, Lord, Thou hast stricken them, but they have not grieved, Thou hast consumed them but they have refused to receive correction; and again, The people turned not to Him that smiteth them; and Why is my people slidden back by a perpetual backsliding, because of which it will be utterly crushed and destroyed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 15"
