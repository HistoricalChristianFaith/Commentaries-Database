[[commentary]]
quote='''
And with respect to the Sea even if I did not marvel at its greatness, yet I should have marvelled at its gentleness, in that although loose it stands within its boundaries; and if not at its gentleness, yet surely at its greatness; but since I marvel at both, I will praise the Power that is in both. What collected it? What bounded it? How is it raised and lulled to rest, as though respecting its neighbour earth? How, moreover, does it receive all the rivers, and yet remain the same, through the very superabundance of its immensity, if that term be permissible? How is the boundary of it, though it be an element of such magnitude, only sand? Have your natural philosophers with their knowledge of useless details anything to tell us, those men I mean who are really endeavouring to measure the sea with a wineglass, and such mighty works by their own conceptions? Or shall I give the really scientific explanation of it from Scripture concisely, and yet more satisfactorily and truly than by the longest arguments? "He hath fenced the face of the water with His command." This is the chain of fluid nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 27"
