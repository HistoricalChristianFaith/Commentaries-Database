[[commentary]]
quote='''
But if without any labour and trouble at all you may obtain that which you desire, what folly it is to put off the gift: "Ho, every one that thirsteth, come ye to the waters," Esaias invites you, "and he that hath no money, come buy wine and milk, without money and without price." O swiftness of His mercy: O easiness of the Covenant: This blessing may be bought by you merely for willing it; He accepts the very desire as a great price; He thirsts to be thirsted for; He gives to drink to all who desire to drink; He takes it as a kindness to be asked for the kindness; He is ready and liberal; He gives with more pleasure than others receive. Only let us not be condemned for frivolity by asking for little, and for what is unworthy of the Giver.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 27"
