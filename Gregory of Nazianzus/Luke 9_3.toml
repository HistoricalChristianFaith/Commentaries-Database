[[commentary]]
quote='''
(Orat. ii. 69.) Now in sending His disciples to preach, our Lord enjoined many things on them, the chief of which are, that they should be so virtuous, so constant, so temperate, and, to speak briefly, so heavenly, that no less through their manner of living than their words, the teaching of the Gospel might be spread abroad. And therefore were they sent with lack of money, and staves, and a single garment; He accordingly adds, And he said to them, Take nothing in the way, neither staves.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What of the regulations of Jesus for his disciples, when He sends them to preach? The main object of these is—not to enter into particulars—that they should be of such virtue, so simple and modest, and in a word, so heavenly, that the gospel should make its way, no less by their character than by their preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 69"
