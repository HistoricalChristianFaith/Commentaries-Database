[[commentary]]
quote='''
Have you an infant child? Do not let sin get any opportunity, but let him be sanctified from his childhood; from his very tenderest age let him be consecrated by the Spirit. Fearest thou the Seal on account of the weakness of nature? O what a small-souled mother, and of how little faith! Why, Anna even before Samuel was born promised him to God, and after his birth consecrated him at once, and brought him up in the priestly habit, not fearing anything in human nature, but trusting in God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 17"
