[[commentary]]
quote='''
Speak of God with Paul, who was caught up to the third Heaven, and who sometimes counts up the Three Persons, and that in varied order, not keeping the same order, but reckoning one and the same Person now first, now second, now third; and for what purpose? Why, to shew the equality of the Nature. And sometimes he mentions Three, sometimes Two or One, because That which is not mentioned is included. And sometimes he attributes the operation of God to the Spirit, as in no respect different from Him, and sometimes instead of the Spirit he brings in Christ; and at times he separates the Persons saying, "One God, of whom are all things, and we in Him; and one Lord Jesus Christ, by whom are all things, and we by Him;" at other times he brings together the one Godhead, "For of Him and through Him and in Him are all things;" that is, through the Holy Ghost, as is shown by many places in Scripture. To Him be glory for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 15"

[[commentary]]
quote='''
For to us there is but One God, the Father, of Whom are all things, and One Lord Jesus Christ, by Whom are all things; and One Holy Ghost, in Whom are all things; yet these words, of, by, in, whom, do not denote a difference of nature (for if this were the case, the three prepositions, or the order of the three names would never be altered), but they characterize the personalities of a nature which is one and unconfused. And this is proved by the fact that They are again collected into one, if you will read—not carelessly—this other passage of the same Apostle, "Of Him and through Him and to Him are all things; to Him be glory forever, Amen."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 12"
