[[commentary]]
quote='''
But if you are already rightly disposed, and marked with the good inscription, see that you keep what is written, and remain unchanged in a changing time concerning an unchanging Thing. Follow Pilate's example in the better sense; you who are rightly written on, imitate him who wrote wrongfully. Say to those who would persuade you differently, what I have written, I have written. For indeed I should be ashamed if, while that which was wrong remained inflexible, that which is right should be so easily bent aside; whereas we ought to be easily bent to that which is better from that which is worse, but immovable from the better to the worse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 44"
