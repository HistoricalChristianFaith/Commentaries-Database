[[commentary]]
quote='''
For all things that the Father hath are the Son's; and on the other hand, all that belongs to the Son is the Father's. Nothing then is peculiar, because all things are in common. For Their Being itself is common and equal, even though the Son receive it from the Father. It is in respect of this that it is said I live by the Father; not as though His Life and Being were kept together by the Father, but because He has His Being from Him beyond all time, and beyond all cause.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 11"
