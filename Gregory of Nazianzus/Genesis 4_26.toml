[[commentary]]
quote='''
Thus Enos "hoped to call upon the Name of the Lord." Hope was that for which he is commended; and that, not that he should know God, but that he should call upon him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 18"
