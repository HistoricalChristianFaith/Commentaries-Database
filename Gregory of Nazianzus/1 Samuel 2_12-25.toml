[[commentary]]
quote='''
I know also of Eli the priest, and a little later of Uzzah, the former made to pay the penalty for his sons' transgression, in daring to violate the sacrifices by an untimely exaction of the first fruits of the cauldrons, although he did not condone their impiety, but frequently rebuked them; the other, because he only touched the ark, which was being thrown off the cart by the ox, and though he saved it, was himself destroyed, in God's jealousy for the reverence due to the ark.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 93"
