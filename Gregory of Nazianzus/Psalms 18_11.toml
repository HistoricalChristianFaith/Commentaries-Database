[[commentary]]
quote='''
Therefore this darkness of the body has been placed between us and God, like the cloud of old between the Egyptians and the Hebrews; and this is perhaps what is meant by "He made darkness His secret place," namely our dulness, through which few can see even a little. But as to this point, let those discuss it whose business it is; and let them ascend as far as possible in the examination.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 12"
