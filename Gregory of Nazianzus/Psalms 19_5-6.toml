[[commentary]]
quote='''
How came the sun to be a beacon-fire to the whole world, and to all eyes like the leader of some chorus, concealing all the rest of the stars by his brightness, more completely than some of them conceal others. The proof of this is that they shine against him, but he outshines them and does not even allow it to be perceived that they rose simultaneously with him, fair as a bridegroom, swift and great as a giant—for I will not let his praises be sung from any other source than my own Scriptures—so mighty in strength that from one end to the other of the world he embraces all things in his heat, and there is nothing hid from the feeling thereof, but it fills both every eye with light, and every embodied creature with heat; warming, yet not burning, by the gentleness of its temper, and the order of its movement, present to all, and equally embracing all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 29"
