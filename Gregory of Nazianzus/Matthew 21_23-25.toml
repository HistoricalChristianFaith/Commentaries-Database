[[commentary]]
quote='''
He knoweth how to solve some of their questions and to bridle others. When He is asked, By what authority doest thou these things? He Himself, because of the utter ignorance of those who asked Him, replies with another question; The baptism of John, was it from Heaven or of men? He on both sides entangles His questioners, so that we also are able, following the example of Christ, sometimes to check those who argue with us over-officiously, and with still more absurd questions to solve the absurdity of their questions. For we too are wise in vanity at times, if I may boast of the things of folly. But when He sees a question that calls for reasoning, then He does not deem His questioners unworthy of prudent answers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 5"
