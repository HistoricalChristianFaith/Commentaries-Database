[[commentary]]
quote='''
But since to us grace has been given to flee from superstitious error and to be joined to the truth and to serve the living and true God, and to rise above creation, passing by all that is subject to time and to first motion; let us look at and reason upon God and things divine in a manner corresponding to this Grace given us. But let us begin our discussion of them from the most fitting point. And the most fitting is, as Solomon laid down for us; us; The beginning of wisdom, he says, is to get wisdom. And what this is he tells us; the beginning of wisdom is fear. For we must not begin with contemplation and leave off with fear (for an unbridled contemplation would perhaps push us over a precipice), but we must be grounded and purified and so to say made light by fear, and thus be raised to the height. For where fear is there is keeping of commandments; and where there is keeping of commandments there is purifying of the flesh, that cloud which covers the soul and suffers it not to see the Divine Ray. And where there is purifying there is Illumination; and Illumination is the satisfying of desire to those who long for the greatest things, or the Greatest Thing, or That Which surpasses all greatness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 8"
