[[commentary]]
quote='''
But he ever so far surpassed himself as he has been shown hitherto to have surpassed others, his ideas on this point being most excellent and philosophic. For he held that, while it is virtuous in a private individual to avoid vice, and be to some extent good, it is a vice in a chief and ruler, especially in such an office, to fail to surpass by far the majority of men, and by constant progress to make his virtue correspond to his dignity and throne: for it is difficult for one in high position to attain the mean, and by his eminence in virtue raise up his people to the golden mean. Or rather to treat this question more satisfactorily, I think that the result is the same as I see in the case of our Saviour, and of every specially wise man, I fancy, when He was with us in that form which surpassed us and yet is ours. For He also, the gospel says, increased in wisdom and favour, as well as in stature, not that these qualities in Him were capable of growth: for how could that which was perfect from the first become more perfect, but that they were gradually disclosed and displayed? So I think that the virtue of Basil, without being itself increased, obtained at this time a wider exercise, since his power provided him with more abundant material.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252043.html'
source_title="Oration 43, Section 38"
