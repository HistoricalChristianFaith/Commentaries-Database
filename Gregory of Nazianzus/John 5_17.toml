[[commentary]]
quote='''
But how does He see the Father doing, and do likewise? Is it like those who copy pictures and letters, because they cannot attain the truth unless by looking at the original, and being led by the hand by it? But how shall Wisdom stand in need of a teacher, or be incapable of acting unless taught? And in what sense does the Father "Do" in the present or in the past? Did He make another world before this one, or is He going to make a world to come? And did the Son look at that and make this? Or will He look at the other, and make one like it? According to this argument there must be Four worlds, two made by the Father, and two by the Son. What an absurdity! He cleanses lepers, and delivers men from evil spirits, and diseases, and quickens the dead, and walks upon the sea, and does all His other works; but in what case, or when did the Father do these acts before Him? Is it not clear that the Father impressed the ideas of these same actions, and the Word brings them to pass, yet not in slavish or unskilful fashion, but with full knowledge and in a masterly way, or, to speak more properly, like the Father? For in this sense I understand the words that whatsoever is done by the Father, these things doeth the Son likewise; not, that is, because of the likeness of the things done, but in respect of the Authority. This might well also be the meaning of the passage which says that the Father worketh hitherto and the Son also; and not only so but it refers also to the government and preservation of the things which He has made; as is shewn by the passage which says that He maketh His Angels Spirits, and that the earth is founded upon its steadfastness (though once for all these things were fixed and made) and that the thunder is made firm and the wind created. Of all these things the Word was given once, but the Action is continuous even now.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 11"
