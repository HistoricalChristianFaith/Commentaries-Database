[[commentary]]
quote='''
Their tenth objection is the ignorance, and the statement that Of the last day and hour knoweth no man, not even the Son Himself, but the Father. And yet how can Wisdom be ignorant of anything—that is, Wisdom Who made the worlds, Who perfects them, Who remodels them, Who is the Limit of all things that were made, Who knoweth the things of God as the spirit of a man knows the things that are in him? For what can be more perfect than this knowledge? How then can you say that all things before that hour He knows accurately, and all things that are to happen about the time of the end, but of the hour itself He is ignorant? For such a thing would be like a riddle; as if one were to say that he knew accurately all that was in front of the wall, but did not know the wall itself; or that, knowing the end of the day, he did not know the beginning of the night—where knowledge of the one necessarily brings in the other. Thus everyone must see that He knows as God, and knows not as Man;—if one may separate the visible from that which is discerned by thought alone. For the absolute and unconditioned use of the Name "The Son" in this passage, without the addition of whose Son, gives us this thought, that we are to understand the ignorance in the most reverent sense, by attributing it to the Manhood, and not to the Godhead.

If then this argument is sufficient, let us stop here, and not enquire further. But if not, our second argument is as follows:—Just as we do in all other instances, so let us refer His knowledge of the greatest events, in honour of the Father, to The Cause. And I think that anyone, even if he did not read it in the way that one of our own Students did, would soon perceive that not even the Son knows the day or hour otherwise than as the Father does. For what do we conclude from this? That since the Father knows, therefore also does the Son, as it is evident that this cannot be known or comprehended by any but the First Nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Sections 15-16"
