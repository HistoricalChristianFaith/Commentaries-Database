[[commentary]]
quote='''
Not indeed that we are ashamed of being judged, for we are ourselves judges in turn, and both with the same charity. But the law is an ancient one: for even Paul communicated to the Apostles his Gospel: not for the sake of ostentation, for the Spirit is far removed from all ostentation, but in order to establish his success and correct his failure, if indeed there were any such in his words or actions, as he declares when writing of himself. Since even the Spirits of the Prophets are subject to the prophets, according to the order of the Spirit who regulates and divides all things well. And do not wonder that, while he rendered his account privately and to some, I do so publicly, and to all. For my need is greater than his, of being aided by the freedom of my censors, if I am proved to have failed in my duty, lest I should run, or have run, in vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252042.html'
source_title="Oration 42, Section 1"
