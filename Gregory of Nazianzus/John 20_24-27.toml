[[commentary]]
quote='''
And if, like a Thomas, you were left out when the disciples were assembled to whom Christ shews Himself, when you do see Him be not faithless; and if you do not believe, then believe those who tell you; and if you cannot believe them either, then have confidence in the print of the nails.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 24"
