[[commentary]]
quote='''
This being so, if any be on the Lord's side let him come with us, and let us adore the One Godhead in the Three; not ascribing any name of humiliation to the unapproachable Glory, but having the exaltations of the Triune God continually in our mouth. For since we cannot properly describe even the greatness of Its Nature, on account of Its infinity and undefinableness, how can we assert of It humiliation? But if any one be estranged from God, and therefore divideth the One Supreme Substance into an inequality of Natures, it were marvellous if such an one were not cut in sunder by the sword, and his portion appointed with the unbelievers, reaping any evil fruit of his evil thought both now and hereafter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 9"
