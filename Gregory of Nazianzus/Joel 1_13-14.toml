[[commentary]]
quote='''
Joel again summons us to wailing, and will have the ministers of the altar lament under the presence of famine: so far is he from allowing us to revel in the misfortunes of others: and, after sanctifying a fast, calling a solemn assembly, and gathering the old men, the children, and those of tender age, we ourselves must further haunt the temple in sackcloth and ashes, prostrated right humbly on the ground, because the field is wasted, and the meat-offering and the drink-offering is cut off from the house of the Lord, till we draw down mercy by our humiliation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 59"
