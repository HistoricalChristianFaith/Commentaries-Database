[[commentary]]
quote='''
And on the Mountain He was bright as the lightning, and became more luminous than the sun, initiating us into the mystery of the future.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 19"
