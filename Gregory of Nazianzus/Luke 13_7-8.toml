[[commentary]]
quote='''
For it is a strange thing to substitute for a painless remedy one which is more painful; to cast away the grace of mercy, and owe a debt of punishment; and to measure our amendment against sin. For how many tears must we contribute before they can equal the fount of baptism; and who will be surety for us that death shall wait for our cure, and that the judgment seat shall not summon us while still debtors, and needing the fire of the other world? You perhaps, as a good and pitiful husbandman, will entreat the Master still to spare the figtree, and not yet to cut it down, though accused of unfruitfulness; but to allow you to put dung about it in the shape of tears, sighs, invocations, sleepings on the ground, vigils, mortifications of soul and body, and correction by confession and a life of humiliation. But it is uncertain if the Master will spare it, inasmuch as it cumbers the ground of another asking for mercy, and becoming deteriorated by the longsuffering shewn to this one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 9"
