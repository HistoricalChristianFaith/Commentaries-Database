[[commentary]]
quote='''
If he plot against you with vain glory (as he did against Christ when he led Him up to the pinnacle of the temple and said to Him, Cast Thyself down as a proof of Thy Godhead), be not overborne by elation. If you be taken by this he will not stop here. For he is insatiable, he grasps at every thing. He fawns upon you with fair pretences, but he ends in evil; this is the manner of his fighting. Yes, and the robber is skilled in Scripture. On the one side was that It is written about the Bread, and on the other that it Is written about the Angels. It is written, quoth he, He shall give His Angels charge concerning thee, and they shall bear thee in their hands. O vile sophist! how was it that thou didst suppress the words that follow, for I know it well, even if thou passest it by in silence? I will make thee to go upon the asp and basilisk, and I will tread upon serpents and scorpions, being fenced by the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 10"
