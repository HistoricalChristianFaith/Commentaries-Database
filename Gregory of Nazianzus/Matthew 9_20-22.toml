[[commentary]]
quote='''
Yesterday you were being dried up by an abundant hæmorrhage, for you were pouring out crimson sin; today stanched and flourishing again, for you have touched the hem of Christ and your issue has been stayed. Guard, I pray you, the cleansing lest you should again have a hæmorrhage, and not be able to lay hold of Christ to steal salvation; for Christ does not like to be stolen from often, though He is very merciful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 33"
