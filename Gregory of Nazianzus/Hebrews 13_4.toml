[[commentary]]
quote='''
It is good to marry; I too admit it, for marriage is honourable in all, and the bed undefiled. It is good for the temperate, not for those who are insatiable, and who desire to give more than due honour to the flesh. When marriage is only marriage and conjunction and the desire for a succession of children, marriage is honourable, for it brings into the world more to please God. But when it kindles matter, and surrounds us with thorns, and as it were discovers the way of vice, then I too say, It is not good to marry.

Marriage is honourable; but I cannot say that it is more lofty than virginity; for virginity were no great thing if it were not better than a good thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 9-10"
