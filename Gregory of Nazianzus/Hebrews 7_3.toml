[[commentary]]
quote='''
The letter gives way, the Spirit comes to the front. The shadows flee away, the Truth comes in upon them. Melchisedec is concluded. He that was without Mother becomes without Father (without Mother of His former state, without Father of His second).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 2"
