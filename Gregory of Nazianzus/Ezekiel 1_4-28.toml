[[commentary]]
quote='''
What would you say of Isaiah or Ezekiel, who was an eyewitness of very great mysteries, and of the other Prophets; for one of these saw the Lord of Sabaoth sitting on the Throne of glory, and encircled and praised and hidden by the sixwinged Seraphim, and was himself purged by the live coal, and equipped for his prophetic office. And the other describes the Cherubic Chariot of God, and the Throne upon them, and the Firmament over it, and Him that shewed Himself in the Firmament, and Voices, and Forces, and Deeds. And whether this was an appearance by day, only visible to Saints, or an unerring vision of the night, or an impression on the mind holding converse with the future as if it were the present; or some other ineffable form of prophecy, I cannot say; the God of the Prophets knoweth, and they know who are thus inspired. But neither these of whom I am speaking, nor any of their fellows ever stood before the Council and Essence of God, as it is written, or saw, or proclaimed the Nature of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 19"
