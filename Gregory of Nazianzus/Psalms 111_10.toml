[[commentary]]
quote='''
Fairer in my eyes, is the beauty which we can gaze upon than that which is painted in words: of more value the wealth which our hands can hold, than that which is imagined in our dreams; and more real the wisdom of which we are convinced by deeds, than that which is set forth in splendid language. For "a good understanding," he saith, "have all they that do thereafter," not they who proclaim it. Time is the best touchstone of this wisdom, and "the hoary head is a crown of glory." For if, as it seems to me as well as to Solomon, we must "judge none blessed before his death," and it is uncertain "what a day may bring forth," since our life here below has many turnings, and the body of our humiliation is ever rising, falling and changing; surely he, who without fault has almost drained the cup of life, and nearly reached the haven of the common sea of existence is more secure, and therefore more enviable, than one who has yet a long voyage before him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 3"

[[commentary]]
quote='''
From meditating on every book of the Old and New Testament, with a depth such as none else has applied even to one of them, he grew rich in contemplation, rich in splendour of life, combining them in wondrous sort by that golden bond which few can weave; using life as the guide of contemplation, contemplation as the seal of life. For the fear of the Lord is the beginning of wisdom, and, so to say, its first swathing band; but, when wisdom has burst the bonds of fear and risen up to love, it makes us friends of God, and sons instead of bondsmen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 6"
