[[commentary]]
quote='''
And when I looked a little closer, I saw, not the First and unmingled Nature, known to Itself—to the Trinity, I mean; not That which abideth within the first veil, and is hidden by the Cherubim; but only that Nature, which at last even reaches to us. And that is, as far as I can learn, the Majesty, or as holy David calls it, the Glory which is manifested among the creatures, which It has produced and governs. For these are the Back Parts of God, which He leaves behind Him, as tokens of Himself like the shadows and reflection of the sun in the water, which shew the sun to our weak eyes, because we cannot look at the sun himself, for by his unmixed light he is too strong for our power of perception.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html"
source_title="Oration 28, Section 3"
