[[commentary]]
quote='''
But are you afraid of being reproached with Tritheism? Do you take possession of this good thing, the Unity in the Three, and leave me to fight the battle. Let me be the shipbuilder, and do you use the ship; or if another is the builder of the ship, take me for the architect of the house, and do you live in it with safety, though you spent no labour upon it. You shall not have a less prosperous voyage, or a less safe habitation than I who built them, because you have not laboured upon them. See how great is my indulgence; see the goodness of the Spirit; the war shall be mine, yours the achievement; I will be under fire, and you shall live in peace; but join with your defender in prayer, and give me your hand by the Faith. I have three stones which I will sling at the Philistine; I have three inspirations against the son of the Sareptan, with which I will quicken the slain; I have three floods against the faggots with which I will consecrate the Sacrifice with water, raising the most unexpected fire; and I will throw down the prophets of shame by the power of the Sacrament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 43"
