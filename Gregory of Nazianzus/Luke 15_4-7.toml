[[commentary]]
quote='''
Wilt thou deem Him little on this account, that He humbled Himself for thee; because the Good Shepherd, He who lays down His life for His sheep, came to seek for that which had strayed upon the mountains and the hills, on which thou wast then sacrificing, and found the wanderer; and having found it, took it upon His shoulders—on which He also took the Wood of the Cross; and having taken it, brought it back to the higher life; and having carried it back, numbered it amongst those who had never strayed. Because He lighted a candle—His own Flesh—and swept the house, cleansing the world from sin; and sought the piece of money, the Royal Image that was covered up by passions. And He calls together His Angel friends on the finding of the coin, and makes them sharers in His joy, whom He had made to share also the secret of the Incarnation?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 14"
