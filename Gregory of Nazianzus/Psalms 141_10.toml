[[commentary]]
quote='''
Thus he combined the two, and so united the partisans of both calm action and of active calm, as to convince them that the monastic life is characterised by steadfastness of disposition rather than by bodily retirement. Accordingly the great David was a man of at once the most active and most solitary life, if any one thinks the verse, I am in solitude, till I pass away, of value and authority in the exposition of this subject.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 20"
