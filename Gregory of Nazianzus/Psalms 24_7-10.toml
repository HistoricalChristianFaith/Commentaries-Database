[[commentary]]
quote='''
With Shepherds glorify Him; with Angels join in chorus; with Archangels sing hymns. Let this Festival be common to the powers in heaven and to the powers upon earth. For I am persuaded that the Heavenly Hosts join in our exultation and keep high Festival with us to-day . . . because they love men, and they love God . . . just like those whom David introduces after the Passion ascending with Christ and coming to meet Him, and bidding one another to lift up the gates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 17"

[[commentary]]
quote='''
And if He ascend up into Heaven, ascend with Him. Be one of those angels who escort Him, or one of those who receive Him. Bid the gates be lifted up, or be made higher, that they may receive Him, exalted after His Passion. Answer to those who are in doubt because He bears up with Him His body and the tokens of His Passion, which He had not when He came down, and who therefore inquire, "Who is this King of Glory?" that it is the Lord strong and mighty, as in all things that He hath done from time to time and does, so now in His battle and triumph for the sake of Mankind. And give to the doubting of the question the twofold answer. And if they marvel and say as in Isaiah's drama Who is this that cometh from Edom and from the things of earth? Or How are the garments red of Him that is without blood or body, as of one that treads in the full wine-press? Set forth the beauty of the array of the Body that suffered, adorned by the Passion, and made splendid by the Godhead, than which nothing can be more lovely or more beautiful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 25"
