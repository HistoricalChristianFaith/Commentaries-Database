[[commentary]]
quote='''
Then the removal of leaven; that is, of the old and sour wickedness, not of that which is quickening and makes bread; for seven days, a number which is of all the most mystical, and is co-ordinate with this present world, that we may not lay in provision of any Egyptian dough, or relic of Pharisaic or ungodly teaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 15"
