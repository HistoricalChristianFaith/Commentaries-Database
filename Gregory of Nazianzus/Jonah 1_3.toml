[[commentary]]
quote='''
What then is the story, and wherein lies its application? For, perhaps, it would not be amiss to relate it, for the general security. Jonah also was fleeing from the face of God, or rather, thought that he was fleeing: but he was overtaken by the sea, and the storm, and the lot, and the whale's belly, and the three days' entombment, the type of a greater mystery. He fled from having to announce the dread and awful message to the Ninevites, and from being subsequently, if the city was saved by repentance, convicted of falsehood: not that he was displeased at the salvation of the wicked, but he was ashamed of being made an instrument of falsehood, and exceedingly zealous for the credit of prophecy, which was in danger of being destroyed in his person, since most men are unable to penetrate the depth of the Divine dispensation in such cases.

But, as I have learned from a man skilled in these subjects, and able to grasp the depth of the prophet, by means of a reasonable explanation of what seems unreasonable in the history, it was not this which caused Jonah to flee, and carried him to Joppa and again from Joppa to Tarshish, when he entrusted his stolen self to the sea: for it was not likely that such a prophet should be ignorant of the design of God, viz., to bring about, by means of the threat, the escape of the Ninevites from the threatened doom, according to His great wisdom, and unsearchable judgments, and according to His ways which are beyond our tracing and finding out; nor that, if he knew this he would refuse to co-operate with God in the use of the means which He designed for their salvation. Besides, to imagine that Jonah hoped to hide himself at sea, and escape by his flight the great eye of God, is surely utterly absurd and stupid, and unworthy of credit, not only in the case of a prophet, but even in the case of any sensible man, who has only a slight perception of God, Whose power is over all.

On the contrary, as my instructor said, and as I am myself convinced, Jonah knew better than any one the purpose of his message to the Ninevites, and that, in planning his flight, although he changed his place, he did not escape from God. Nor is this possible for any one else, either by concealing himself in the bosom of the earth, or in the depths of the sea, or by soaring on wings, if there be any means of doing so, and rising into the air, or by abiding in the lowest depths of hell, or by enveloping himself in a thick cloud, or by any other of the many devices for ensuring escape. For God alone of all things cannot be escaped from or contended with; if He wills to seize and bring them under His hand, He outstrips the swift, He outwits the wise, He overthrows the strong, He abases the lofty, He subdues rashness, He represses power.

Jonah then was not ignorant of the mighty hand of God, with which he threatened other men, nor did he imagine that he could utterly escape the Divine power; this we are not to believe: but when he saw the falling away of Israel, and perceived the passing over of the grace of prophecy to the Gentiles—this was the cause of his retirement from preaching and of his delay in fulfilling the command; accordingly he left the watchtower of joy, for this is the meaning of Joppa in Hebrew, I mean his former dignity and reputation, and flung himself into the deep of sorrow: and hence he is tempest-tossed, and falls asleep, and is wrecked, and aroused from sleep, and taken by lot, and confesses his flight, and is cast into sea, and swallowed, but not destroyed, by the whale; but there he calls upon God, and, marvellous as it is, on the third day he, like Christ, is delivered: but my treatment of this topic must stand over, and shall shortly, if God permit, be more deliberately worked out.

Now however, to return to my original point, the thought and question occurred to me, that although he might possibly meet with some indulgence, if reluctant to prophesy, for the cause which I mentioned—yet, in my own case, what could be said, what defence could be made, if I longer remained restive, and rejected the yoke of ministry, which, though I know not whether to call it light or heavy, had at any rate been laid upon me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Sections 106-110"
