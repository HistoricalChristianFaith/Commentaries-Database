[[commentary]]
quote='''
But, he says, who in ancient or modern times ever worshipped the Spirit? Who ever prayed to Him? Where is it written that we ought to worship Him, or to pray to Him, and whence have you derived this tenet of yours? We will give the more perfect reason hereafter, when we discuss the question of the unwritten; for the present it will suffice to say that it is the Spirit in Whom we worship, and in Whom we pray. For Scripture says, God is a Spirit, and they that worship Him must worship Him in Spirit and in truth. And again,—We know not what we should pray for as we ought; but the Spirit Itself maketh intercession for us with groanings which cannot be uttered; and I will pray with the Spirit and I will pray with the understanding also;—that is, in the mind and in the Spirit. Therefore to adore or to pray to the Spirit seems to me to be simply Himself offering prayer or adoration to Himself. And what godly or learned man would disapprove of this, because in fact the adoration of One is the adoration of the Three, because of the equality of honour and Deity between the Three?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 12"
