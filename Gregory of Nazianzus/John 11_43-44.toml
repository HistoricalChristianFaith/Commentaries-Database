[[commentary]]
quote='''
You have heard the loud voice, Lazarus, come forth, as you lay in the tomb; not, however, after four days, but after many days; and you were loosed from the bonds of your graveclothes. Do not again become dead, nor live with those who dwell in the tombs; nor bind yourself with the bonds of your own sins; for it is uncertain whether you will rise again from the tomb till the last and universal resurrection, which will bring every work into judgment, not to be healed, but to be judged, and to give account of all which for good or evil it has treasured up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 33"
