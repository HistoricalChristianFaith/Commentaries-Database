[[commentary]]
quote='''
Since then I knew these things, and that no one is worthy of the mightiness of God, and the sacrifice, and priesthood, who has not first presented himself to God, a living, holy sacrifice, and set forth the reasonable, well-pleasing service, and sacrificed to God the sacrifice of praise and the contrite spirit, which is the only sacrifice required of us by the Giver of all; how could I dare to offer to Him the external sacrifice, the antitype of the great mysteries, or clothe myself with the garb and name of priest, before my hands had been consecrated by holy works; before my eyes had been accustomed to gaze safely upon created things, with wonder only for the Creator, and without injury to the creature; before my ear had been sufficiently opened to the instruction of the Lord, and He had opened mine ear to hear without heaviness, and had set a golden earring with precious sardius, that is, a wise man's word in an obedient ear; before my mouth had been opened to draw in the Spirit, and opened wide to be filled with the spirit of speaking mysteries and doctrines; and my lips bound, to use the words of wisdom, by divine knowledge, and, as I would add, loosed in due season: before my tongue had been filled with exultation, and become an instrument of Divine melody, awaking with glory, awaking right early, and laboring till it cleave to my jaws: before my feet had been set upon the rock, made like hart's feet, and my footsteps directed in a godly fashion so that they should not well-nigh slip, nor slip at all; before all my members had become instruments of righteousness, and all mortality had been put off, and swallowed up of life, and had yielded to the Spirit?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 95"

[[commentary]]
quote='''
Let us give to God all our members which are upon the earth; let us consecrate them all; not the lobe of the liver or the kidneys with the fat, nor some part of our bodies now this now that (why should we despise the rest?); but let us bring ourselves entire, let us be reasonable holocausts, perfect sacrifices; and let us not make only the shoulder or the breast a portion for the Priest to take away, for that would be a small thing, but let us give ourselves entire, that we may receive back ourselves entire; for this is to receive entirely, when we give ourselves to God and offer as a sacrifice our own salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 40"
