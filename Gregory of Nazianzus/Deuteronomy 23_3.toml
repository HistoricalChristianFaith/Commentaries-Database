[[commentary]]
quote='''
Moreover, the Moabites and Ammonites must not even be allowed to enter into the Church of God, I mean those sophistical, mischievous arguments which enquire curiously into the generation and inexpressible procession of God, and rashly set themselves in array against the Godhead: as if it were necessary that those things which it is beyond the power of language to set forth, must either be accessible to them alone, or else have no existence because they have not comprehended them. We however, following the Divine Scriptures, and removing out of the way of the blind the stumbling blocks contained in them, will cling to salvation, daring any and every thing rather than arrogance against God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252042.html'
source_title="Oration 42, Section 18"
