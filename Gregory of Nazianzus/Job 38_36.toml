[[commentary]]
quote='''
Now Holy Scripture admires the cleverness in weaving even of women, saying, Who gave to woman skill in weaving and cleverness in the art of embroidery? This belongeth to a living creature that hath reason, and exceedeth in wisdom and maketh way even as far as the things of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 24"
