[[commentary]]
quote='''
But as the old Confusion of tongues was laudable, when men who were of one language in wickedness and impiety, even as some now venture to be, were building the Tower; for by the confusion of their language the unity of their intention was broken up, and their undertaking destroyed; so much more worthy of praise is the present miraculous one. For being poured from One Spirit upon many men, it brings them again into harmony. And there is a diversity of Gifts, which stands in need of yet another Gift to discern which is the best, where all are praiseworthy. And that division also might be called noble of which David says, Drown O Lord and divide their tongues. Why? Because they loved all words of drowning, the deceitful tongue. Where he all but expressly arraigns the tongues of the present day which sever the Godhead. Thus much upon this point.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 16"
