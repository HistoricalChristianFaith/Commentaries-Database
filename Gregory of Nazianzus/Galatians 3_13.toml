[[commentary]]
quote='''
It is not that the Lord was changed into these things—for how could that be?—but because he underwent them, "taking up our transgressions and bearing our sicknesses."
'''
source_url=''
source_title="LETTER 101.61"
[[commentary]]
quote='''
He is made all things to all men that He may gain all. Why do I say, All things to all men? For even that which Paul could not endure to say of himself I find that the Saviour suffered. For He is made not only a Jew, and not only doth He take to Himself all monstrous and vile names, but even that which is most monstrous of all, even very sin and very curse; not that He is such, but He is called so. For how can He be sin, Who setteth us free from sin; and how can He be a curse, Who redeemeth us from the curse of the Law? But it is in order that He may carry His display of humility even to this extent, and form us to that humility which is the producer of exaltation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 1"
