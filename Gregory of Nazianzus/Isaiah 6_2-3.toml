[[commentary]]
quote='''
To sum up my discourse:—Glorify Him with the Cherubim, who unite the Three Holies into One Lord, and so far indicate the Primal Substance as their wings open to the diligent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 13"
