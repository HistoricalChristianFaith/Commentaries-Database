[[commentary]]
quote='''
And if it was a great thing for the altar never to have had an iron tool lifted upon it, and that no chisel should be seen or heard, with greater reason, since everything dedicated to God ought to be natural and free from artificiality, it was also surely a great thing that she reverenced the sanctuary by her silence; that she never turned her back to the venerable table, nor spat upon the divine pavement; that she never grasped the hand or kissed the lips of any heathen woman, however honourable in other respects, or closely related she might be; nor would she ever share the salt, I say not willingly but even under compulsion, of those who came from the profane and unholy table; nor could she bear, against the law of conscience, to pass by or look upon a polluted house; nor to have her ears or tongue, which had received and uttered divine things, defiled by Grecian tales or theatrical songs, on the ground that what is unholy is unbecoming to holy things; and what is still more wonderful, she never so far yielded to the external signs of grief, although greatly moved even by the misfortunes of strangers, as to allow a sound of woe to burst forth before the Eucharist, or a tear to fall from the eye mystically sealed, or any trace of mourning to be left on the occasion of a festival, however frequent her own sorrows might be; inasmuch as the God-loving soul should subject every human experience to the things of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252018.html'
source_title="Oration 18, Section 10"
