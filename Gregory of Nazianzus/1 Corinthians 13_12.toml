[[commentary]]
quote='''
What God is in nature and essence, no man ever yet has discovered or can discover. Whether it will ever be discovered is a question which he who will may examine and decide. In my opinion it will be discovered when that within us which is godlike and divine, I mean our mind and reason, shall have mingled with its Like, and the image shall have ascended to the Archetype, of which it has now the desire. And this I think is the solution of that vexed problem as to "We shall know even as we are known." But in our present life all that comes to us is but a little effluence, and as it were a small effulgence from a great Light. So that if anyone has known God, or has had the testimony of Scripture to his knowledge of God, we are to understand such an one to have possessed a degree of knowledge which gave him the appearance of being more fully enlightened than another who did not enjoy the same degree of illumination; and this relative superiority is spoken of as if it were absolute knowledge, not because it is really such, but by comparison with the power of that other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 17"

[[commentary]]
quote='''
If it had been permitted to Paul to utter what the Third Heaven contained, and his own advance, or ascension, or assumption thither, perhaps we should know something more about God's Nature, if this was the mystery of the rapture. But since it was ineffable, we too will honour it by silence. Thus much we will hear Paul say about it, that we know in part and we prophesy in part. This and the like to this are the confessions of one who is not rude in knowledge, who threatens to give proof of Christ speaking in him, the great doctor and champion of the truth. Wherefore he estimates all knowledge on earth only as through a glass darkly, as taking its stand upon little images of the truth. Now, unless I appear to anyone too careful, and over anxious about the examination of this matter, perhaps it was of this and nothing else that the Word Himself intimated that there were things which could not now be borne, but which should be borne and cleared up hereafter, and which John the Forerunner of the Word and great Voice of the Truth declared even the whole world could not contain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 20"
