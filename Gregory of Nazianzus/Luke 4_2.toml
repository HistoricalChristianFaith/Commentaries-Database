[[commentary]]
quote='''
(Orat. 40.) He fasted in truth forty days, eating nothing. (For He was God.) But we regulate our fasting according to our strength, although the zeal of some persuades them to fast beyond what they are able.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But for you, what necessity is there that by following the examples which are far above you, you should do a thing so ill-advised for yourself? For there are many other details of the Gospel History which are quite different to what happens nowadays, and the seasons of which do not correspond. For instance Christ fasted a little before His temptation, we before Easter. As far as the fasting days are concerned it is the same, but the difference in the seasons is no little one. He armed Himself with them against temptation; but to us this fast is symbolical of dying with Christ, and it is a purification in preparation for the festival. And He fasted absolutely for forty days, for He was God; but we measure our fasting by our power, even though some are led by zeal to rush beyond their strength. Again, He gave the Sacrament of the Passover to His Disciples in an upper chamber, and after supper, and one day before He suffered; but we celebrate it in Houses of Prayer, and before food, and after His resurrection. He rose again the third day; our resurrection is not till after a long time. But matters which have to do with Him are neither abruptly separated from us, nor yet yoked together with those which concern us in point of time; but they were handed down to us just so far as to be patterns of what we should do, and then they carefully avoided an entire and exact resemblance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 30"
