[[commentary]]
quote='''
And as I know of two kinds of fire, so also do I of light. The one is the light of our ruling power directing our steps according to the will of God; the other is a deceitful and meddling one, quite contrary to the true light, though pretending to be that light, that it may cheat us by its appearance. This really is darkness, yet has the appearance of noonday, the high perfection of light. And so I read that passage of those who continually flee in darkness at noonday; for this is really night, and yet is thought to be bright light by those who have been ruined by luxury. For what saith David? "Night was around me and I knew it not, for I thought that my luxury was enlightenment."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 37"
