[[commentary]]
quote='''
This I seemed to hear Him say, and to see Him do, and besides, to hear Him shouting to His people, which once were few and scattered and miserable, and have now become many, and compact enough and enviable, Go through My gates and be ye enlarged. Must you always be in trouble and dwell in tents, while those who vex you rejoice exceedingly? And to the presiding Angels, for I believe, as John teaches me in his Revelation, that each Church has its guardian, Prepare ye the way of My people, and cast away the stones from the way, that there may be no stumblingblock or hindrance for the people in the divine road and entrance, now, to the temples made with hands, but soon after, to Jerusalem above, and the Holy of holies there, which will, I know, be the end of suffering and struggle to those who here bravely travel on the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252042.html'
source_title="Oration 42, Section 9"
