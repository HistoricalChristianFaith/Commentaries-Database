[[commentary]]
quote='''
Do I enquire what there is common to the loins and to truth? What then is the meaning to S. Paul of the expression, "Stand, therefore, having your loins girt about with truth?" Is it perhaps that contemplation is to restrain concupiscence, and not to allow it to be carried in another direction? For that which is disposed to love in a particular direction will not have the same power towards other pleasures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 18"
