[[commentary]]
quote='''
Passing by the elders in the book of Daniel; for it is better to pass them by, together with the Lord's righteous sentence and declaration concerning them, that wickedness came from Babylon from ancient judges, who seemed to govern the people; how are we affected by Ezekiel, the beholder and expositor of the mighty mysteries and visions? By his injunction to the watchmen not to keep silence concerning vice and the sword impending over it, a course which would profit neither themselves nor the sinners; but rather to keep watch and forewarn, and thus benefit, at any rate those who gave warning, if not both those who spoke and those who heard?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html'
source_title="Oration 2, Section 64"

[[commentary]]
quote='''
An important medicine for evil is confession, and care to avoid stumbling. I will be first to do so, as I have made my report to my people from on high, and performed the duty of a watcher. For I did not conceal the coming of the sword that I might save my own soul and those of my hearers. So will I now announce the disobedience of my people, making what is theirs my own, if I may perchance thus obtain some tenderness and relief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 17"
