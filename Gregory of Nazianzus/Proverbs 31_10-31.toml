[[commentary]]
quote='''
The divine Solomon, in his instructive wisdom, I mean his Proverbs, praises the woman who looks to her household and loves her husband, contrasting her with one who roams abroad, and is uncontrolled and dishonourable, and hunts for precious souls with wanton words and ways, while she manages well at home and bravely sets about her woman's duties, as her hands hold the distaff, and she prepares two coats for her husband, buying a field in due season, and makes good provision for the food of her servants, and welcomes her friends at a liberal table; with all the other details in which he sings the praises of the modest and industrious woman. Now, to praise my sister in these points would be to praise a statue for its shadow, or a lion for its claws, without allusion to its greatest perfections.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25208.html'
source_title="Oration 8, Section 9"
