[[commentary]]
quote='''
Honour thou also thy mother, of whom thou wast born. Honour thou also her who is of a mother and is a mother. A mother she is not, but a Bride of Christ she is. The visible beauty is not hidden, but that which is unseen is visible to God. All the glory of the King's Daughter is within, clothed with golden fringes, embroidered whether by actions or by contemplation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 10"
