[[commentary]]
quote='''
If you are a Rachel or a Leah, a patriarchal and great soul, steal whatever idols of your father you can find; not, however, that you may keep them, but that you may destroy them; and if you are a wise Israelite remove them to the Land of the Promise, and let the persecutor grieve over the loss of them, and learn through being outwitted that it was vain for him to tyrannize over and keep in bondage better men than himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 21"
