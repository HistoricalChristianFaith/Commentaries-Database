[[commentary]]
quote='''
Thus much is taken from things celestial and sympathizing with our fortunes, in accordance with the mighty harmony and disposition of the universe. What follows let the Psalm finish for me: "Because Thou hast cast down cities," namely, those ancient ones for the very same acts of impiety, in the middle of the very same offences against us; some thereof overwhelmed by the floods, others swallowed up by earthquake; so that one is pretty nearly able to apply the remainder: "The memorial of them hath perished with a sound and a destruction noised abroad." For such has been their fall, and such their ruin, also of those their neighbours who took the most delight in their impiety, so that a very long time were necessary to them for their restoration, even if anyone should have the boldness to undertake it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 6"
