[[commentary]]
quote='''
And that you may not be ignorant of the depth of His Wisdom and the riches of His unsearchable judgments, He did not leave even these unhallowed altogether, or useless, or with nothing in them but mere blood. But that great, and if I may say so, in Its first nature unsacrificeable Victim, was intermingled with the Sacrifices of the Law, and was a purification, not for a part of the world, nor for a short time, but for the whole world and for all time. For this reason a Lamb was chosen for its innocence, and its clothing of the original nakedness. For such is the Victim, That was offered for us, Who is both in Name and fact the Garment of incorruption. And He was a perfect Victim not only on account of His Godhead, than which nothing is more perfect; but also on account of that which He assumed having been anointed with Deity, and having become one with That which anointed It, and I am bold to say, made equal with God. A Male, because offered for Adam; or rather the Stronger for the strong, when the first Man had fallen under sin; and chiefly because there is in Him nothing feminine, nothing unmanly; but He burst from the bonds of the Virgin-Mother's womb with much power, and a Male was brought forth by the Prophetess, as Isaiah declares the good tidings. And of a year old, because He is the Sun of Righteousness setting out from heaven, and circumscribed by His visible Nature, and returning unto Himself. And "The blessed crown of Goodness,"—being on every side equal to Himself and alike; and not only this, but also as giving life to all the circle of the virtues, gently commingled and intermixed with each other, according to the Law of Love and Order. And Immaculate and guileless, as being the Healer of faults, and of the defects and taints that come from sin. For though He both took on Him our sins and bare our diseases, yet He did not Himself suffer aught that needed healing. For He was tempted in all points like as we are yet without sin. For he that persecuted the Light that shineth in darkness could not overtake Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 13"
