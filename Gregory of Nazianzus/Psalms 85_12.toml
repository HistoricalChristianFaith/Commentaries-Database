[[commentary]]
quote='''
Beg for bodily sustenance, but beg rather for the angels' food that cometh down from heaven. So doing, thou wilt make God to be our God, wilt conciliate heaven, wilt restore the former and latter rain: the Lord shall show loving-kindness and our land shall yield her fruit; our earthly land its fruit which lasts for the day, and our frame, which is but dust, the fruit which is eternal, which we shall store up in the heavenly winepresses by thy hands, who presentest both us and ours in Christ Jesus our Lord, to whom be glory for evermore. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 20"
