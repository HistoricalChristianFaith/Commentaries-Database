[[commentary]]
quote='''
And if, when we admit that in respect of being the Cause the Father is greater than the Son, they should assume the premiss that He is the Cause by Nature, and then deduce the conclusion that He is greater by Nature also, it is difficult to say whether they mislead most themselves or those with whom they are arguing. For it does not absolutely follow that all that is predicated of a class can also be predicated of all the individuals composing it; for the different particulars may belong to different individuals. For what hinders me, if I assume the same premiss, namely, that the Father is greater by Nature, and then add this other, Yet not by nature in every respect greater nor yet Father—from concluding, Therefore the Greater is not in every respect greater, nor the Father in every respect Father? Or, if you prefer it, let us put it in this way: God is an Essence: But an Essence is not in every case God; and draw the conclusion for yourself—Therefore God is not in every case God. I think the fallacy here is the arguing from a conditioned to an unconditioned use of a term, to use the technical expression of the logicians. For while we assign this word Greater to His Nature viewed as a Cause, they infer it of His Nature viewed in itself. It is just as if when we said that such a one was a dead man they were to infer simply that he was a Man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 15"

[[commentary]]
quote='''
As your third point you count the Word Greater; and as your fourth, To My God and your God. And indeed, if He had been called greater, and the word equal had not occurred, this might perhaps have been a point in their favour. But if we find both words clearly used what will these gentlemen have to say? How will it strengthen their argument? How will they reconcile the irreconcilable? For that the same thing should be at once greater than and equal to the same thing is an impossibility; and the evident solution is that the Greater refers to origination, while the Equal belongs to the Nature; and this we acknowledge with much good will. But perhaps some one else will back up our attack on your argument, and assert, that That which is from such a Cause is not inferior to that which has no Cause; for it would share the glory of the Unoriginate, because it is from the Unoriginate. And there is, besides, the Generation, which is to all men a matter so marvellous and of such Majesty. For to say that he is greater than the Son considered as man, is true indeed, but is no great thing. For what marvel is it if God is greater than man? Surely that is enough to say in answer to their talk about Greater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252030.html'
source_title="Oration 30, Section 7"

[[commentary]]
quote='''
I should like to call the Father the greater, because from him flows both the Equality and the Being of the Equals (this will be granted on all hands), but I am afraid to use the word Origin, lest I should make Him the Origin of Inferiors, and thus insult Him by precedencies of honour. For the lowering of those Who are from Him is no glory to the Source. Moreover, I look with suspicion at your insatiate desire, for fear you should take hold of this word Greater, and divide the Nature, using the word Greater in all senses, whereas it does not apply to the Nature, but only to Origination. For in the Consubstantial Persons there is nothing greater or less in point of Substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 43"
