[[commentary]]
quote='''
For you indeed supply bodily food to peoples and cities so far as your lovingkindness reaches; and you supply spiritual food also, not to a particular people, nor to this or that city, circumscribed by narrow boundaries, though its people may think it very illustrious, but to almost the whole world. And you bring the remedy not for famine of bread or thirst of water, which is no very terrible famine—and to avoid it is easy; but to a famine of hearing the Word of the Lord, which it is most miserable to suffer, and a most laborious matter to cure at the present time, because iniquity hath abounded, and scarce anywhere do I find its genuine healers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 2"
