[[commentary]]
quote='''
He was baptized as Man—but He remitted sins as God—not because He needed purificatory rites Himself, but that He might sanctify the element of water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 20"
