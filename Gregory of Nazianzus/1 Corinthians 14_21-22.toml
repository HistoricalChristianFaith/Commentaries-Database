[[commentary]]
quote='''
They spoke with strange tongues, and not those of their native land; and the wonder was great, a language spoken by those who had not learnt it. And the sign is to them that believe not, and not to them that believe, that it may be an accusation of the unbelievers, as it is written, With other tongues and other lips will I speak unto this people, and not even so will they listen to Me saith the Lord. But they heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 15"
