[[commentary]]
quote='''
Hence again the divine Micah, unable to brook the building of Zion with blood, however you interpret the phrase, and of Jerusalem with iniquity, while the heads thereof judge for reward, and the priests teach for hire, and the prophets divine for money—what does he say will be the result of this? Zion shall be plowed as a field, and Jerusalem be as a lodge in a garden, and the mountain of the house be reckoned as a glade in a thicket.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25202.html"
source_title="Oration 2, Section 58"
