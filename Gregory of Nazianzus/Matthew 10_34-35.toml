[[commentary]]
quote='''
And what the Sword? The cutting of the Word, which separates the worse from the better, and makes a division between the faithful and the unbeliever; and stirs up the son and the daughter and the bride against the father and the mother and the mother in law, the young and fresh against the old and shadowy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 15"
