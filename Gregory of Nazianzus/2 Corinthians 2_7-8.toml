[[commentary]]
quote='''
Will you not admit even David's repentance, to whom his penitence preserved even the gift of prophecy? nor the great Peter himself, who fell into human weakness at the Passion of our Saviour? Yet Jesus received him, and by the threefold question and confession healed the threefold denial. Or will you even refuse to admit that he was made perfect by blood (for your folly goes even as far as that)? Or the transgressor at Corinth? But Paul confirmed love towards him when he saw his amendment, and gives the reason, "that such an one be not swallowed up by overmuch sorrow," being overwhelmed by the excess of the punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 18"
