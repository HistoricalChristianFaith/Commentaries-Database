[[commentary]]
quote='''
(Orat. 39.) We must therefore consider who He was who was baptized, and by whom and when: seeing He was pure, baptized by John, and at a time when His miracles had begun, that we might thence derive the lesson of purifying ourselves beforehand, and of embracing humility, and of not beginning to preach until the maturity of our spiritual and natural life. The first of these was said for their sakes who are receiving baptism; for although the gift of baptism brings remission, yet we must fear lest we return again to our vomit. The second is pointed at those who exalt themselves against the stewards of the mysteries, whom they may excel in rank. The third was uttered for those who trust in their youth, and imagine that any age is fit for promotion and teaching. Jesus is cleansed, and dost thou despise purification? By John, and dost thou say ought against thy teacher. At thirty years old, but dost thou in teaching precede thy elders? But the example of Daniel and the like are ready in thy mouth, for every guilty person is ready with an answer. But that is not the law of the Church which seldom happens, as neither does a single swallow make the spring.

(Orat. 40.) Still must a child be baptized if necessity demands it. For it is better to be insensibly sanctified, than to pass from this life unsealed. But you will say, Christ is baptized at thirty years old, and He was God, but thou biddest us to hasten our baptism. In that thou saidst God, the objection was done away: He needed no cleansing, nor was any danger hanging over Him while He put off His baptism. But with thee it extends to no slight calamity, if thou passest from this life born in corruption, but not if thou hast put on the robe of incorruption. And truly it is a blessed thing to keep unsullied the clean robe of baptism, but it is better at times to be slightly stained, than to be altogether devoid of grace.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now, we come to another action of Christ, and another mystery. I cannot restrain my pleasure; I am rapt into God. Almost like John I proclaim good tidings; for though I be not a Forerunner, yet am I from the desert. Christ is illumined, let us shine forth with Him. Christ is baptized, let us descend with Him that we may also ascend with Him. Jesus is baptized; but we must attentively consider not only this but also some other points. Who is He, and by whom is He baptized, and at what time? He is the All-pure; and He is baptized by John; and the time is the beginning of His miracles. What are we to learn and to be taught by this? To purify ourselves first; to be lowly minded; and to preach only in maturity both of spiritual and bodily stature. The first has a word especially for those who rush to Baptism off hand, and without due preparation, or providing for the stability of the Baptismal Grace by the disposition of their minds to good. For since Grace contains remission of the past (for it is a grace), it is on that account more worthy of reverence, that we return not to the same vomit again. The second speaks to those who rebel against the Stewards of this Mystery, if they are their superiors in rank. The third is for those who are confident in their youth, and think that any time is the right one to teach or to preside. Jesus is purified, and dost thou despise purification? . . . and by John, and dost thou rise up against thy herald? . . . and at thirty years of age, and dost thou before thy beard has grown presume to teach the aged, or believe that thou teachest them, though thou be not reverend on account of thine age, or even perhaps for thy character? But here it may be said, Daniel, and this or that other, were judges in their youth, and examples are on your tongues; for every wrongdoer is prepared to defend himself. But I reply that that which is rare is not the law of the Church. For one swallow does not make a summer, nor one line a geometrician, nor one voyage a sailor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 14"

[[commentary]]
quote='''
But, one says, Christ was thirty years old when He was baptized, and that although He was God; and do you bid us hurry our Baptism?—You have solved the difficulty when you say He was God. For He was absolute cleansing; He had no need of cleansing; but it was for you that He was purified, just as it was for you that, though He had not flesh, yet He is clothed with flesh. Nor was there any danger to Him from putting off Baptism, for He had the ordering of His own Passion as of His own Birth. But in your case the danger is to no small interests, if you were to depart after a birth to corruption alone, and without being clothed with incorruption. And there is this further point for me to consider, that that particular time of baptism was a necessity for Him, but your case is not the same. He manifested Himself in the thirtieth year after His birth and not before; first, in order that He might not appear ostentatious, which is a condition belonging to vulgar minds; and next, because that age tests virtue thoroughly, and is the right time to teach. And since it was needful for Him to undergo the passion which saves the world, it was needful also that all things which belong to the passion should fit into the passion; the Manifestation, the Baptism, the Witness from Heaven, the Proclamation, the concourse of the multitude, the Miracles; and that they should be as it were one body, not torn asunder, nor broken apart by intervals. For out of the Baptism and Proclamation arose that earthquake of people coming together, for so Scripture calls that time; and out of the multitude arose the shewing of the signs and the miracles that lead up to the Gospel. And out of these came the jealousy, and from this the hatred, and out of the hatred the circumstance of the plot against Him, and the betrayal; and out of these the Cross, and the other events by which our Salvation has been effected. Such are the reasons in the case of Christ so far as we can attain to them. And perhaps another more secret reason might be found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 29"
