[[commentary]]
quote='''
The first point to be considered is—What is this great rivalry of speech and endless talking? What is this new disease of insatiability? Why have we tied our hands and armed our tongues? We do not praise either hospitality, or brotherly love, or conjugal affection, or virginity; nor do we admire liberality to the poor, or the chanting of Psalms, or nightlong vigils, or tears. We do not keep under the body by fasting, or go forth to God by prayer; nor do we subject the worse to the better—I mean the dust to the spirit—as they would do who form a just judgment of our composite nature; we do not make our life a preparation for death; nor do we make ourselves masters of our passions, mindful of our heavenly nobility; nor tame our anger when it swells and rages, nor our pride that bringeth to a fall, nor unreasonable grief, nor unchastened pleasure, nor meretricious laughter, nor undisciplined eyes, nor insatiable ears, nor excessive talk, nor absurd thoughts, nor aught of the occasions which the Evil One gets against us from sources within ourselves; bringing upon us the death that comes through the windows, as Holy Scripture saith; that is, through the senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252027.html'
source_title="Oration 27, Section 7"
