[[commentary]]
quote='''
O clap your hands together all ye people, because unto us a Child is born, and a Son given unto us, Whose Government is upon His shoulder (for with the Cross it is raised up), and His Name is called The Angel of the Great Counsel of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 2"
