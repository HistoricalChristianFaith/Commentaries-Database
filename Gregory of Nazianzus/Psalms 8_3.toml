[[commentary]]
quote='''
As to what concerns us, it is not only the Peace of God which passeth all understanding and knowledge, nor only the things which God hath stored up in promise for the righteous, which "eye hath not seen, nor ear heard, nor mind conceived" except in a very small degree, nor the accurate knowledge of the Creation. For even of this I would have you know that you have only a shadow when you hear the words, "I will consider the heavens, the work of Thy fingers, the moon and the stars," and the settled order therein; not as if he were considering them now, but as destined to do so hereafter. But far before them is That nature Which is above them, and out of which they spring, the Incomprehensible and Illimitable—not, I mean, as to the fact of His being, but as to Its nature. For our preaching is not empty, nor our Faith vain, nor is this the doctrine we proclaim; for we would not have you take our candid statement as a starting point for a quibbling denial of God, or of arrogance on account of our confession of ignorance. For it is one thing to be persuaded of the existence of a thing, and quite another to know what it is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 5"
