[[commentary]]
quote='''
Paul also tries to arrive at, I will not say the nature of God, for this he knew was utterly impossible, but only the judgments of God; and since he finds no way out, and no halting place in the ascent, and moreover, since the earnest searching of his mind after knowledge does not end in any definite conclusion, because some fresh unattained point is being continually disclosed to him (O marvel, that I have a like experience), he closes his discourse with astonishment, and calls this the riches of God, and the depth, and confesses the unsearchableness of the judgments of God, in almost the very words of David, who at one time calls God's judgments the great deep whose foundations cannot be reached by measure or sense; and at another says that His knowledge of him and of his own constitution was marvellous, and had attained greater strength than was in his own power or grasp.

For if, he says, I leave everything else alone, and consider myself and the whole nature and constitution of man, and how we are mingled, and what is our movement, and how the mortal was compounded with the immortal, and how it is that I flow downwards, and yet am borne upwards, and how the soul is circumscribed; and how it gives life and shares in feelings; and how the mind is at once circumscribed and unlimited, abiding in us and yet travelling over the Universe in swift motion and flow; how it is both received and imparted by word, and passes through air, and enters with all things; how it shares in sense, and enshrouds itself away from sense. And even before these questions—what was our first moulding and composition in the workshop of nature, and what is our last formation and completion? What is the desire for and imparting of nourishment, and who brought us spontaneously to those first springs and sources of life? How is the body nourished by food, and the soul by reason? What is the drawing of nature, and the mutual relation between parents and children, that it should be held together by a spell of love? How is it that species are permanent, and are different in their characteristics, although there are so many that their individual marks cannot be described? How is it that the same animal is both mortal and immortal, the one by decease, the other by coming into being? For one departs, and another takes its place, just like the flow of a river, which is never still, yet ever constant. And you might discuss many more points concerning men's members and parts, and their mutual adaptation both for use and beauty, and how some are connected and others disjoined, some are more excellent and others less comely, some are united and others divided, some contain and others are contained, according to the law and reason of Nature. Much too might be said about voices and ears. How is it that the voice is carried by the vocal organs, and received by the ears, and both are joined by the smiting and resounding of the medium of the air? Much too of the eyes, which have an indescribable communion with visible objects, and which are moved by the will alone, and that together, and are affected exactly as is the mind. For with equal speed the mind is joined to the objects of thought, the eye to those of sight. Much too concerning the other senses, not objects of the research of reason. And much concerning our rest in sleep, and the figments of dreams, and of memory and remembrance; of calculation, and anger, and desire; and in a word, all by which this little world called Man is swayed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Sections 21-22"
