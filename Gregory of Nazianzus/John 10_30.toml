[[commentary]]
quote='''
And when you read, I and the Father are One, keep before your eyes the Unity of Substance; but when you see, "We will come to him, and make Our abode with him," remember the distinction of Persons; and when you see the Names, Father, Son, and Holy Ghost, think of the Three Personalities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252034.html'
source_title="Oration 34, Section 13"
