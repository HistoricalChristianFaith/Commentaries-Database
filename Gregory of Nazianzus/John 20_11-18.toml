[[commentary]]
quote='''
If you be a Mary, or another Mary, or a Salome, or a Joanna, weep in the early morning. Be first to see the stone taken away, and perhaps you will see the Angels and Jesus Himself. Say something; hear His Voice. If He say to you, Touch Me not, stand afar off; reverence the Word, but grieve not; for He knoweth those to whom He appeareth first. Keep the feast of the Resurrection; come to the aid of Eve who was first to fall, of Her who first embraced the Christ, and made Him known to the disciples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252045.html'
source_title="Oration 45, Section 24"
