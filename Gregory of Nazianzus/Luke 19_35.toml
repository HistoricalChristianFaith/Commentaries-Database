[[commentary]]
quote='''
He rode upon a colt, almost, blame me not for folly, as my Jesus did upon that other colt, whether it were the people of the Gentiles, whom He mounts in kindness, by setting it free from the bonds of ignorance, or something else, which the Scripture sets forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252021.html'
source_title="Oration 21, Section 29"
