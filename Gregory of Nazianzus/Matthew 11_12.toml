[[commentary]]
quote='''
Therefore do not delay in coming to grace, but hasten, lest the robber outstrip you, lest the adulterer pass you by, lest the insatiate be satisfied before you, lest the murderer seize the blessing first, or the publican or the fornicator, or any of these violent ones who take the Kingdom of heaven by force. For it suffers violence willingly, and is tyrannized over through goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 24"
