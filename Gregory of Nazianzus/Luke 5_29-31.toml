[[commentary]]
quote='''
Why dost thou not also charge upon Him as a crime the fact that He eats with Publicans and at Publicans' tables, and that He makes disciples of Publicans, that He too may gain somewhat . . . and what? . . . the salvation of sinners. If so, we must blame the physician for stooping over sufferings, and enduring evil odours that he may give health to the sick; or one who as the Law commands bent down into a ditch to save a beast that had fallen into it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 14"
