[[commentary]]
quote='''
Formerly, whilst God still bore with thee, and delayed His revenge on our account, nor had yet kindled all His indignation, but held up His hand on high against the ungodly, and was bending and making ready His bow, but held it back by force, and, like some concealed constitutional disease, He waited first for the whole of its virulence to break out; as indeed is the regular course of God's judgments, in order that either He may save through repentance, or punish with greater cause: at that time we being discontented at what had taken place, and apprehensive of what was to come (for we did not bear patiently the hidden goodness of God towards His own people), we uttered those expostulations unto God, at one time invoking Him as a master, at another supplicating Him as a kind father, partly upbraiding and expostulating with Him, as is the wont of people in grief: "Wherefore hast Thou rejected us, O God; for ever? Hath Thy Spirit been wroth against the sheep of Thy pasture? Remember the help that Thou hast possessed from the beginning, which Thou hast obtained through the sufferings of Thy Only-begotten Word, which Thou hast thought worthy of the great Covenant, which Thou hast drawn up to the heavens by the New Mystery and by the pledge of the Spirit: and lift up Thine hand against their pride at last; remembering what the enemies have done against Thy saints, and how they have boasted against Thy festivals."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25205.html'
source_title="Oration 5, Section 27"
