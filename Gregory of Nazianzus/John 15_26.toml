[[commentary]]
quote='''
But since we do not admit your first division, which declares that there is no mean between Begotten and Unbegotten, at once, along with your magnificent division, away go your Brothers and your Grandsons, as when the first link of an intricate chain is broken they are broken with it, and disappear from your system of divinity. For, tell me, what position will you assign to that which Proceeds, which has started up between the two terms of your division, and is introduced by a better Theologian than you, our Saviour Himself? Or perhaps you have taken that word out of your Gospels for the sake of your Third Testament, The Holy Ghost, which proceedeth from the Father; Who, inasmuch as He proceedeth from That Source, is no Creature; and inasmuch as He is not Begotten is no Son; and inasmuch as He is between the Unbegotten and the Begotten is God. And thus escaping the toils of your syllogisms, He has manifested himself as God, stronger than your divisions. What then is Procession? Do you tell me what is the Unbegottenness of the Father, and I will explain to you the physiology of the Generation of the Son and the Procession of the Spirit, and we shall both of us be frenzy-stricken for prying into the mystery of God. And who are we to do these things, we who cannot even see what lies at our feet, or number the sand of the sea, or the drops of rain, or the days of Eternity, much less enter into the Depths of God, and supply an account of that Nature which is so unspeakable and transcending all words?

What then, say they, is there lacking to the Spirit which prevents His being a Son, for if there were not something lacking He would be a Son? We assert that there is nothing lacking—for God has no deficiency. But the difference of manifestation, if I may so express myself, or rather of their mutual relations one to another, has caused the difference of their Names. For indeed it is not some deficiency in the Son which prevents His being Father (for Sonship is not a deficiency), and yet He is not Father. According to this line of argument there must be some deficiency in the Father, in respect of His not being Son. For the Father is not Son, and yet this is not due to either deficiency or subjection of Essence; but the very fact of being Unbegotten or Begotten, or Proceeding has given the name of Father to the First, of the Son to the Second, and of the Third, Him of Whom we are speaking, of the Holy Ghost that the distinction of the Three Persons may be preserved in the one nature and dignity of the Godhead. For neither is the Son Father, for the Father is One, but He is what the Father is; nor is the Spirit Son because He is of God, for the Only-begotten is One, but He is what the Son is. The Three are One in Godhead, and the One Three in properties; so that neither is the Unity a Sabellian one, nor does the Trinity countenance the present evil distinction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Sections 8-9"
