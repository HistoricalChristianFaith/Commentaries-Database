[[commentary]]
quote='''
But as her pastor, who in this wonderful scene, was carefully watching her, perceived that her lips were gently moving, and placed his ear to them, which his disposition and sympathy emboldened him to do,—but do you expound the meaning of this mysterious calm, for no one can disbelieve it on your word! Under her breath she was repeating a psalm—the last words of a psalm—to say the truth, a testimony to the boldness with which she was departing, and blessed is he who can fall asleep with these words, "I will lay me down in peace, and take my rest." Thus wert thou singing, fairest of women, and thus it fell out unto thee; and the song became a reality, and attended on thy departure as a memorial of thee, who hast entered upon sweet peace after suffering, and received (over and above the rest which comes to all), that sleep which is due to the beloved, as befitted one who lived and died amid the words of piety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25208.html'
source_title="Oration 8, Section 22"
