[[commentary]]
quote='''
Let us become like Christ, since Christ became like us. Let us become God's for His sake, since He for ours became Man. He assumed the worse that He might give us the better; He became poor that we through His poverty might be rich; He took upon Him the form of a servant that we might receive back our liberty; He came down that we might be exalted; He was tempted that we might conquer; He was dishonoured that He might glorify us; He died that He might save us; He ascended that He might draw to Himself us, who were lying low in the Fall of sin. Let us give all, offer all, to Him Who gave Himself a Ransom and a Reconciliation for us. But one can give nothing like oneself, understanding the Mystery, and becoming for His sake all that He became for ours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25201.html'
source_title="Oration 1, Section 5"

[[commentary]]
quote='''
And He Who gives riches becomes poor, for He assumes the poverty of my flesh, that I may assume the richness of His Godhead. He that is full empties Himself, for He empties Himself of His glory for a short while, that I may have a share in His Fulness. What is the riches of His Goodness? What is this mystery that is around me? I had a share in the image; I did not keep it; He partakes of my flesh that He may both save the image and make the flesh immortal. He communicates a second Communion far more marvellous than the first, inasmuch as then He imparted the better Nature, whereas now Himself partakes of the worse. This is more godlike than the former action, this is loftier in the eyes of all men of understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 13"
