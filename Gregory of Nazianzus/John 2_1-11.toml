[[commentary]]
quote='''
Art thou not yet wedded to flesh? Fear not this consecration; thou art pure even after marriage. I will take the risk of that. I will join you in wedlock. I will dress the bride. We do not dishonour marriage because we give a higher honour to virginity. I will imitate Christ, the pure Grooms-man and Bridegroom, as He both wrought a miracle at a wedding, and honours wedlock with His Presence. Only let marriage be pure and unmingled with filthy lusts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 18"
