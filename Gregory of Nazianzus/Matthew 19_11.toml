[[commentary]]
quote='''
But He said unto them, All men cannot receive this saying, save they to whom it is given. Do you see the sublimity of the matter? It is found to be nearly incomprehensible. For surely it is more than carnal that that which is born of flesh should not beget to the flesh. Surely it is Angelic that she who is bound to flesh should live not according to flesh, but be loftier than her nature. The flesh bound her to the world, but reason led her up to God. The flesh weighed her down, but reason gave her wings; the flesh bound her, but desire loosed her. With thy whole soul, O Virgin, be intent upon God (I give this same injunction to men and to women); and do not take the same view in other respects of what is honourable as the mass of men do; of family, of wealth, of throne, of dynasty, of that beauty which shews itself in complexion and composition of members, the plaything of time and disease. If thou hast poured out upon God the whole of thy love; if thou hast not two objects of desire, both the passing and the abiding, both the visible and the invisible, then thou hast been so pierced by the arrow of election, and hast so learned the beauty of the Bridegroom, that thou too canst say with the bridal drama and song, thou art sweetness and altogether loveliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Section 11"

[[commentary]]
quote='''
All men, He saith, cannot receive this saying, but they to whom it is given. When you hear this, It is given, do not understand it in a heretical fashion, and bring in differences of nature, the earthly and the spiritual and the mixed. For there are people so evilly disposed as to think that some men are of an utterly ruined nature, and some of a nature which is saved, and that others are of such a disposition as their will may lead them to, either to the better, or to the worse. For that men may have a certain aptitude, one more, another less, I too admit; but not that this aptitude alone suffices for perfection, but that it is reason which calls this out, that nature may proceed to action, just as fire is produced when a flint is struck with iron. When you hear To whom it is given, add, And it is given to those who are called and to those who incline that way. For when you hear, Not of him that willeth, nor of him that runneth, but of God that sheweth mercy, I counsel you to think the same. For since there are some who are so proud of their successes that they attribute all to themselves and nothing to Him that made them and gave them wisdom and supplied them with good; such are taught by this word that even to wish well needs help from God; or rather that even to choose what is right is divine and a gift of the mercy of God. For it is necessary both that we should be our own masters and also that our salvation should be of God. This is why He saith not of him that willeth; that is, not of him that willeth only, nor of him that runneth only, but also of God. That sheweth mercy. Next; since to will also is from God, he has attributed the whole to God with reason. However much you may run, however much you may wrestle, yet you need one to give the crown. Except the Lord build the house, they laboured in vain that built it: Except the Lord keep the city, in vain they watched that keep it. I know, He says, that the race is not to the swift, nor the battle to the strong, nor the victory to the fighters, nor the harbours to the good sailors; but to God it belongs both to work victory, and to bring the barque safe to port.

In another place it is also said and understood, and perhaps it is necessary that I should add it as follows to what has already been said, in order that I may impart to you also my wealth. The Mother of the Sons of Zebedee, in an impulse of parental affection, asked a thing in ignorance of the measure of what she was asking, but pardonably, through the excess of her love and of the kindness due to her children. For there is nothing more affectionate than a Mother,—and I speak of this that I may lay down a law for honouring Mothers. Their mother, then, asked Jesus that they might sit, the one on His right hand, the other on his left. But what saith the Saviour? He first asks if they can drink the Cup which He Himself was about to drink; and when this was professed, and the Saviour accepted the profession (for He knew that they were being perfected by the same, or rather that they would be perfected thereby); what saith He? "They shall drink the cup; but to sit on My right hand and on My left—it is not Mine, He saith, to give this, but to whom it hath been given." Is then the ruling mind nothing? Nothing the labour? Nothing the reasoning? Nothing the philosophy? Nothing the fasting? Nothing the vigils, the sleeping on the ground, the shedding floods of tears? Is it for nothing of these, but in accordance with some election by lot, that a Jeremias is sanctified, and others are estranged from the womb?

I fear lest some monstrous reasoning may come in, as of the soul having lived elsewhere, and then having been bound to this body, and that it is from that other life that some receive the gift of prophecy, and others are condemned, namely, those who lived badly. But since such a conception is too absurd, and contrary to the traditions of the Church (others if they like may play with such doctrines, but it is unsafe for us to play with them); we must in this place too add to the words "To whom it hath been given," this, "who are worthy;" who have not only received this character from the Father, but have given it to themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252037.html'
source_title="Oration 37, Sections 13-15"
