[[commentary]]
quote='''
If you see one naked clothe him, in honour of your own garment of incorruption, which is Christ, for as many as were baptized into Christ have put on Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 31"
