[[commentary]]
quote='''
But to my mind, he says, those things are said to be connumerated and of the same essence of which the names also correspond, as Three Men, or Three gods, but not Three this and that. What does this concession amount to? It is suitable to one laying down the law as to names, not to one who is asserting the truth. For I also will assert that Peter and James and John are not three or consubstantial, so long as I cannot say Three Peters, or Three Jameses, or Three Johns; for what you have reserved for common names we demand also for proper names, in accordance with your arrangement; or else you will be unfair in not conceding to others what you assume for yourself. What about John then, when in his Catholic Epistle he says that there are Three that bear witness, the Spirit and the Water and the Blood? Do you think he is talking nonsense? First, because he has ventured to reckon under one numeral things which are not consubstantial, though you say this ought to be done only in the case of things which are consubstantial. For who would assert that these are consubstantial? Secondly, because he has not been consistent in the way he has happened upon his terms; for after using Three in the masculine gender he adds three words which are neuter, contrary to the definitions and laws which you and your grammarians have laid down. For what is the difference between putting a masculine Three first, and then adding One and One and One in the neuter, or after a masculine One and One and One to use the Three not in the masculine but in the neuter, which you yourself disclaim in the case of Deity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252031.html'
source_title="Oration 31, Section 19"
