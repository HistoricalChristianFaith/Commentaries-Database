[[commentary]]
quote='''
Seeing, therefore, the commotion of the people against him, who were intending and threatening extreme measures, at first he meditates making his escape, not so much out of cowardice, as on account of the commandment bidding one to flee from one city to another city, and give way unto the persecutors; seeing that it behoves people, being Christians, to have regard, not merely to what concerns themselves (even though they be very courageous, and full of fortitude), but likewise even to spare their persecutors, so that the share in the business, at least, belonging to themselves, shall not contribute to the danger of their enemies. But when many persons were seized and pulled about on his account, and were even in danger of their souls by reason of the cruelty of the persecutors, he would not suffer others to be imperilled for his individual security; and therefore he forms a resolution at once most virtuous and most philosophic. He returns from flight, comes and surrenders himself to the mob to treat as they please, and boldly faces the hostility of the times.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Section 88"

[[commentary]]
quote='''
During the evil days he lived in retirement, obedient herein to our Christian law, which bids us, when occasion offers, to make ventures on behalf of the truth, and not be traitors to our religion from cowardice; yet refrain, as long as may be, from rushing into danger, either in fear for our own souls, or to spare those who bring the danger upon us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25207.html'
source_title="Oration 7, Section 14"
