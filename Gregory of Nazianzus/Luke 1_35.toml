[[commentary]]
quote='''
Conceived by the Virgin, who first in body and soul was purified by the Holy Ghost (for it was needful both that Childbearing should be honoured, and that Virginity should receive a higher honour), He came forth then as God with that which He had assumed, One Person in two Natures, Flesh and Spirit, of which the latter deified the former.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 13"
