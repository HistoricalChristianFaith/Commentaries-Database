[[commentary]]
quote='''
And what is the "Fan?" The Purification. And what is the "Fire?" The consuming of the chaff, and the heat of the Spirit. And what the "Axe?" The excision of the soul which is incurable even after the dung. And what the Sword? The cutting of the Word, which separates the worse from the better, and makes a division between the faithful and the unbeliever; and stirs up the son and the daughter and the bride against the father and the mother and the mother in law, the young and fresh against the old and shadowy. And what is the Latchet of the shoe, which thou John who baptizest Jesus mayst not loose? thou who art of the desert, and hast no food, the new Elias, the more than Prophet, inasmuch as thou sawest Him of Whom thou didst prophesy, thou Mediator of the Old and New Testaments. What is this? Perhaps the Message of the Advent, and the Incarnation, of which not the least point may be loosed, I say not by those who are yet carnal and babes in Christ, but not even by those who are like John in spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252039.html'
source_title="Oration 39, Section 15"
