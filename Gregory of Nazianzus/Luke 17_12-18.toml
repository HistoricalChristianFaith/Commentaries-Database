[[commentary]]
quote='''
If you were full of leprosy, that shapeless evil, yet you scraped off the evil matter, and received again the Image whole. Shew your cleansing to me your Priest, that I may recognize how much more precious it is than the legal one. Do not range yourself with the nine unthankful men, but imitate the tenth. For although he was a Samaritan, yet he was of better mind than the others. Make certain that you will not break out again with evil ulcers, and find the indisposition of your body hard to heal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 34"
