[[commentary]]
quote='''
I seem indeed to hear that voice, from Him Who gathers together those who are broken, and welcomes the oppressed: Enlarge thy cords, break forth on the right hand and on the left, drive in thy stakes, spare not thy curtains. I have given thee up, and I will help thee. In a little wrath I smote thee, but with everlasting mercy I will glorify thee. The measure of His kindness exceeds the measure of His discipline. The former things were owing to our wickedness, the present things to the adorable Trinity: the former for our cleansing, the present for My glory, Who will glorify them that glorify Me, and I will move to jealousy them that move Me to jealousy. Behold this is sealed up with Me, and this is the indissoluble law of recompense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252042.html'
source_title="Oration 42, Section 7"
