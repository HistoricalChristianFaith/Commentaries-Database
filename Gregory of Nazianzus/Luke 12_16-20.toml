[[commentary]]
quote='''
Another has had no pity on the widow and orphan, and not imparted his bread and meagre nourishment to the needy, or rather to Christ, Who is nourished in the persons of those who are nourished even in a slight degree; a man perhaps of much property unexpectedly gained, for this is the most unjust of all, who finds his many barns too narrow for him, filling some and emptying others, to build greater ones for future crops, not knowing that he is being snatched away with hopes unrealised, to give an account of his riches and fancies, and proved to have been a bad steward of another's goods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 18"
