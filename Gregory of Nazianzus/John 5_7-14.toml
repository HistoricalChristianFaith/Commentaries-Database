[[commentary]]
quote='''
Yesterday you were flung upon a bed, exhausted and paralyzed, and you had no one when the water should be troubled to put you into the pool. Today you have Him Who is in one Person Man and God, or rather God and Man. You were raised up from your bed, or rather you took up your bed, and publicly acknowledged the benefit. Do not again be thrown upon your bed by sinning, in the evil rest of a body paralyzed by its pleasures. But as you now are, so walk, mindful of the command, Behold thou art made whole; sin no more lest a worse thing happen unto thee if thou prove thyself bad after the blessing thou hast received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 33"
