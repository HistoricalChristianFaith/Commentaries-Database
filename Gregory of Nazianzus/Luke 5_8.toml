[[commentary]]
quote='''
And are you not amazed at Manoah the Judge of yore, and at Peter the disciple in later days; the one being unable to endure the sight even of one in whom was a representation of God; and saying, "We are undone, O wife, we have seen God;" speaking as though even a vision of God could not be grasped by human beings, let alone the Nature of God; and the other unable to endure the Presence of Christ in his boat and therefore bidding Him depart; and this though Peter was more zealous than the others for the knowledge of Christ, and received a blessing for this, and was entrusted with the greatest gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252028.html'
source_title="Oration 28, Section 19"
