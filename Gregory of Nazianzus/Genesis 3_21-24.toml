[[commentary]]
quote='''
But when through the Devil's malice and the woman's caprice, to which she succumbed as the more tender, and which she brought to bear upon the man, as she was the more apt to persuade, alas for my weakness! (for that of my first father was mine), he forgot the Commandment which had been given to him; he yielded to the baleful fruit; and for his sin he was banished, at once from the Tree of Life, and from Paradise, and from God; and put on the coats of skins . . . that is, perhaps, the coarser flesh, both mortal and contradictory. This was the first thing that he learnt—his own shame; and he hid himself from God. Yet here too he makes a gain, namely death, and the cutting off of sin, in order that evil may not be immortal. Thus his punishment is changed into a mercy; for it is in mercy, I am persuaded, that God inflicts punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252038.html'
source_title="Oration 38, Section 12"
