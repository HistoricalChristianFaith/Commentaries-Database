[[commentary]]
quote='''
And what of the loins, or reins, for we must not pass these over? Let the purification take hold of these also. Let our loins be girded about and kept in check by continence, as the Law bade Israel of old when partaking of the Passover. For none comes out of Egypt purely, or escapes the Destroyer, except he who has disciplined these. And let the reins be changed by that good conversion by which they transfer all the affections to God, so that they can say, Lord, all my desire is before Thee, and the day of man have I not desired; for you must be a man of desires, but they must be those of the spirit. For thus you would destroy the dragon that carries the greater part of his strength upon his navel and his loins, by slaying the power that comes to him from these.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 40"
