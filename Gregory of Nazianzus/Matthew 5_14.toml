[[commentary]]
quote='''
Let us be made light, as it was said to the disciples by the Great Light, ye are the light of the world. Let us be made lights in the world, holding forth the Word of Life; that is, let us be made a quickening power to others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 37"
