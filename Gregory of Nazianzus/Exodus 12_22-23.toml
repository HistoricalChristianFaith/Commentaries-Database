[[commentary]]
quote='''
Can ye abide my wrath, saith the Lord. Has not My hand the power to inflict upon you other plagues also? There are still at My command the blains breaking forth from the ashes of the furnace, by sprinkling which toward heaven, Moses, or any other minister of God's action, may chastise Egypt with disease. There remain also the locusts, the darkness that may be felt, and the plague which, last in order, was first in suffering and power, the destruction and death of the firstborn, and, to escape this, and to turn aside the destroyer, it were better to sprinkle the doorposts of our mind, contemplation and action, with the great and saving token, with the blood of the new covenant, by being crucified and dying with Christ, that we may both rise and be glorified and reign with Him both now and at His final appearing, and not be broken and crushed, and made to lament, when the grievous destroyer smites us all too late in this life of darkness, and destroys our firstborn, the offspring and results of our life which we had dedicated to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 11"

[[commentary]]
quote='''
But if you would fortify yourself beforehand with the Seal, and secure yourself for the future with the best and strongest of all aids, being signed both in body and in soul with the unction, as Israel was of old with that blood and unction of the firstborn at night that guarded him, what then can happen to you, and what has been wrought out for you? Listen to the Proverbs. "If thou sittest, he says, thou shalt be without fear; and if thou sleepest, thy sleep shall be sweet." And listen to David giving thee the good news, "Thou shalt not be afraid for the terror by night, for mischance or noonday demon." This, even while you live, will greatly contribute to your sense of safety (for a sheep that is sealed is not easily snared, but that which is unmarked is an easy prey to thieves), and at your death a fortunate shroud, more precious than gold, more magnificent than a sepulchre, more reverent than fruitless libations, more seasonable than ripe firstfruits, which the dead bestow on the dead, making a law out of custom. Nay, if all things forsake thee, or be taken violently away from thee; money, possessions, thrones, distinctions, and everything that belongs to this early turmoil, yet you will be able to lay down your life in safety, having suffered no loss of the helps which God gave you unto salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 15"

[[commentary]]
quote='''
Be it so, some will say, in the case of those who ask for Baptism; what have you to say about those who are still children, and conscious neither of the loss nor of the grace? Are we to baptize them too? Certainly, if any danger presses. For it is better that they should be unconsciously sanctified than that they should depart unsealed and uninitiated.

A proof of this is found in the Circumcision on the eighth day, which was a sort of typical seal, and was conferred on children before they had the use of reason. And so is the anointing of the doorposts, which preserved the firstborn, though applied to things which had no consciousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252040.html'
source_title="Oration 40, Section 28"
