[[commentary]]
quote='''
What shall be said to this by those of us who are buyers and sellers of corn, and watch the hardships of the seasons, in order to grow prosperous, and luxuriate in the misfortunes of others, and acquire, not, like Joseph, the property of the Egyptians, as a part of a wide policy, (for he could both collect and supply corn duly, as he also could foresee the famine, and provide against it afar off,) but the property of their fellow countrymen in an illegal manner, for they say, "When will the new moon be gone, that we may sell, and the sabbaths, that we may open our stores?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252016.html'
source_title="Oration 16, Section 19"
