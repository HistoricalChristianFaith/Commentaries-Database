[[commentary]]
quote='''
And if we must also look at ancient history, I perceive that Enoch, the seventh among our ancestors, was honoured by translation. I perceive also that the twenty-first, Abraham, was given the glory of the Patriarchate, by the addition of a greater mystery. For the Hebdomad thrice repeated brings out this number. And one who is very bold might venture even to come to the New Adam, my God and Lord Jesus Christ, Who is counted the Seventy-seventh from the old Adam who fell under sin, in the backward genealogy according to Luke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252041.html'
source_title="Oration 41, Section 4"
