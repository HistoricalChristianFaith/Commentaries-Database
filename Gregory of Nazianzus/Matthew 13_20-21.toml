[[commentary]]
quote='''
One party, one kind of souls, do I exclude from the festive assembly, though I groan and am pained, and grieved for them who perhaps understand me not, neither are sensible of their own ruin, whom I bewail (for this is the most pitiable part of their affliction): nevertheless I exclude by proclamation, all who have not been sown upon the solid and immovable Rock, but upon the dry and barren ground. These be they who having come unto the Word superficially, and through not having depth of earth, forthwith springing up and peeping forth, upon a brief assault of the Evil One, and a slight blast of persecution, have withered up and died away. And those yet worse than they, and still more worthy of exclusion from the festivity—all those who did not for even a little space hold out against the times and against those who were leading us into an evil captivity away from Him "Who ascended up on high and made captives of us for our good;" but these did superfluously show themselves good for nought, and mercenary, inasmuch as they did not resist even for a little while, but were straggling plants, though not even a slight affliction or trial had befallen them on account of the Word; but for the sake of temporary gain, or court-favour, or brief power, these wretched fellows bartered away their own salvation!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%25204.html'
source_title="Oration 4, Section 11"
