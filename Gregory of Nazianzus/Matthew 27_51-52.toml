[[commentary]]
quote='''
He lays down His life, but He has power to take it again; and the veil is rent, for the mysterious doors of Heaven are opened; the rocks are cleft, the dead arise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Gregory%2520of%2520Nazianzus%2FOrations%2FOration%252029.html'
source_title="Oration 29, Section 20"
