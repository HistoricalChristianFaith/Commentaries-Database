[[commentary]]
quote='''
Moreover, the seven heavens agree with those days; for thus we are warned: "By the word of the Lord were the heavens made, and all the powers of them by the spirit of His mouth." There are seven spirits. Their names are the spirits which abode on the Christ of God, as was intimated in Isaiah the prophet: "And there rests upon Him the spirit of wisdom and of understanding, the spirit of counsel and might, the spirit of wisdom and of piety, and the spirit of God's fear hath filled Him." Therefore the highest heaven is the heaven of wisdom; the second, of understanding; the third, of counsel; the fourth, of might; the fifth, of knowledge; the sixth, of piety; the seventh, of God's fear.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FOn%2520the%2520Creation%2520of%2520the%2520World.html"
source_title="On the Creation of the World"
