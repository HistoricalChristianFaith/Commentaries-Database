[[commentary]]
quote='''
On the sixth day the things that were wanting were created; and thus God raised up man from the soil, as lord of all the things which He created upon the earth and the water. Yet He created angels and archangels before He created man, placing spiritual beings before earthly ones. For light was made before sky and the earth. This sixth day is called parasceve, that is to say, the preparation of the kingdom. For He perfected Adam, whom He made after His image and likeness. But for this reason He completed His works before He created angels and fashioned man, lest perchance they should falsely assert that they had been His helpers.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FOn%2520the%2520Creation%2520of%2520the%2520World.html"
source_title="On the Creation of the World"
