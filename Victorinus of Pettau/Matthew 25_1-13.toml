[[commentary]]
quote='''
It is therefore clear that these ten virgins are like the Christian people, whose foolish part and wise part, of five virgins each, is described. The vessels are bodies; the lamps and their light, souls; the oil, good works or prayer and God's mercy; the bridegroom, Christ; the bride, the Church. The closed door is the fiery river by which the impious are separated from the kingdom of God, as it is written in Daniel and in Peter—in his Apocalypse.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FHomily%2520on%2520the%2520Ten%2520Virgins.pdf"
source_title="Homily on the Ten Virgins"
