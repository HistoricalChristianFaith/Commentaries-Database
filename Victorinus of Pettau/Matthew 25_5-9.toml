[[commentary]]
quote='''
We read thus: When the bridegroom begins to tarry, the wise virgins will devote themselves to prayer and await the kingdom of God. However, when certain signs of God's coming begin to appear from heaven, the foolish virgins will ask those wise ones to petition for their sins. Then they will answer them: "Since we too have sins, we fear that our prayer is not strong enough to obtain for both you and us; go rather and buy for yourselves from those who sell."

Who, you ask, are those who sell that oil of mercy? Receive: the blind, the lame, the thirsty, the crippled, the poor, the widows, the orphans, the foreigners, the exiles, those condemned to the mines, the prisoners, the sick, and the rest like these. Therefore, these wretched ones who are late to consider their own health die before obtaining absolution for their sins, and on the day of judgment they find the door shut. For thus it says: But as the bridegroom tarried, they all fell asleep—that is, they died.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FHomily%2520on%2520the%2520Ten%2520Virgins.pdf"
source_title="Homily on the Ten Virgins"
