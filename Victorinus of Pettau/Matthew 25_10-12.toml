[[commentary]]
quote='''
Therefore, on the day of judgment, as I have said, when the trumpet blows and the shout is made, all the righteous will rise and enter with Christ in his kingdom. That foolish part will rise too, and it will find the door already shut—opposite, of course, the fiery river—and will ask him to open that door. He will answer: "Amen, I say to you, I do not know you."
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FHomily%2520on%2520the%2520Ten%2520Virgins.pdf"
source_title="Homily on the Ten Virgins"
