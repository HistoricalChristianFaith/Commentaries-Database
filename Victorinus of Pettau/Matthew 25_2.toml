[[commentary]]
quote='''
The wise virgins are the churches, indeed—as I say more truly—this part of the people that keeps the law of God, loves piety, forgives attacks, prays for its enemies, offers itself as generous to the widow and orphan, delightful to the guest, humane to the foreigner, attentive to the needy, enters prisons, approaches mines, forced laborers, exiles, rescues the imperiled, visits the sick, satisfies the hungry with bread, refreshes the thirsty with drink, consoles the downcast, raises the prostrate, strengthens the terrified, softens the cruel, makes the severe mild, alleviates the harsh, humbles the arrogant, bravely endures suffering, patiently bears hunger, thirst, cold, endures condemnations, sorrows, exiles, mines, prisons, with calm mind. This is the righteousness of the wise virgins owed to God, this price of eternal life, this garland of the Church. This is that image of the kingdom of the immortal Christ. This is that distinct crown with the precious stone, perfused with starry redness.

But that part of the people, to whom the name of the foolish virgins is ascribed, since, with neglect of God, neglect of their brothers, arrogance, hatred toward the poor, toward the orphan, the foreigner, offer themselves away from all the virtues that I recalled above, they will be found without a share in that kingdom of Christ. For this is that part of the people that on the day of judgment stands at the left hand, the same that the Evangelist distinguishes by the name of young goats; but he calls what stands at the right hand lambs.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FHomily%2520on%2520the%2520Ten%2520Virgins.pdf"
source_title="Homily on the Ten Virgins"
