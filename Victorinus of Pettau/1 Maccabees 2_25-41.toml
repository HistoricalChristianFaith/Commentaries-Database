[[commentary]]
quote='''
Matthias also, prince of Judah, broke the Sabbath; for he slew the prefect of Antiochus the king of Syria on the Sabbath, and subdued the foreigners by pursuing them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FOn%2520the%2520Creation%2520of%2520the%2520World.html"
source_title="On the Creation of the World"
