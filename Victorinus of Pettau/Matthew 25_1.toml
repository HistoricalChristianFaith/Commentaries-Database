[[commentary]]
quote='''
It is worthwhile also for this figure of the ten virgins to be interpreted, which is in this way:

Some say that those virgins are two peoples, wrongly of course: for the synagogues are not virgins; for they have the man Moses. Some say that those virgins are the heretical sects, falsely of course: for the heretical sects are not virgins; they are adulteresses. For virgins of God's house are of serene face, chaste expression, modest appearance, restrained eyes, pleasant words, sweet prayer, gentle disposition. Such is Christ, such the image. Yet all the heretical sects are of sad face, impudent expression, wicked eyes, harsh words, wicked prayer, savage disposition, obstinate contention of lies, and full of bitterness of all error, stuffed with curses and scorns. Therefore, since the heretical sects are unlikely, the synagogues are unlikely, the Decalogue, which certain ones bring in, is unlikely, we will discuss about the virgins themselves.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FHomily%2520on%2520the%2520Ten%2520Virgins.pdf"
source_title="Homily on the Ten Virgins"
