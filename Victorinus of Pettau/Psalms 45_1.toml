[[commentary]]
quote='''
But the author of the whole creation is Jesus. His name is the Word; for thus His Father says: "My heart hath emitted a good word." John the evangelist thus says: "In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by Him, and without Him was nothing made that was made." Therefore, first, was made the creation; secondly, man, the lord of the human race, as says the apostle. Therefore this Word, when it made light, is called Wisdom; when it made the sky, Understanding; when it made land and sea, Counsel; when it made sun and moon and other bright things, Power; when it calls forth land and sea, Knowledge; when it formed man, Piety; when it blesses and sanctifies man, it has the name of God's fear.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Victorinus%2520of%2520Pettau%2FOn%2520the%2520Creation%2520of%2520the%2520World.html"
source_title="On the Creation of the World"
