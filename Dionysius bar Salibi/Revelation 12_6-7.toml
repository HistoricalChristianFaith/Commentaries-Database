[[commentary]]
quote='''
And that woman fled into the desert, where a place was prepared for her by God; she there finished a thousand two hundred sixty days. And battle was waged in heaven—The woman is the church who suffers persecution by the Antichrist. And the faithful who call upon the Church in the presence of the pseudo-Christ will flee or scatter: and they will depart into places that now lack religion, that their gospel may be announced in the whole earth. And a thousand two hundred sixty days are three and a half years or half a week: the faithful will be in straits in these days, and sacrifice will cease. Battle in heaven is a tumult of the heavens, and virtues are the angels. For when the Lord comes, he will send the angels who will gather the elect. For when these things happen, the disturbance in heaven will not be meager, but all will be in terror just like men struck down with trembling of war.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 12:6-7"
