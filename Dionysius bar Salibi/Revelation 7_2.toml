[[commentary]]
quote='''
An angel who has the seal of God—holding in hand the sign of the cross. He calls signed those who have confessed the Father and the Son and the Holy Spirit and with faith have proffered works of virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 7:2"
