[[commentary]]
quote='''
I was on the isle of Patmos—All the books attest that the apostle was expelled to the isle of Patmos, and also the epistle that Dionysius the Areopagite wrote to him there. Because of the word of God—because of the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:9"
