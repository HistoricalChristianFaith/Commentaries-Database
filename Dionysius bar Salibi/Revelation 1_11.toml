[[commentary]]
quote='''
Seven churches, to Ephesus, to Smyrna, etc.—Those cities are in the region of Asia; the beginning calls them churches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:11"
