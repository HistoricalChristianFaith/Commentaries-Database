[[commentary]]
quote='''
By the white horse, etc., he shows the faith, which is spread out into the four plagues, and all nations have confessed Christ and been saved, according to which Luke says: Believe, so that times of quiet may come to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:2"
