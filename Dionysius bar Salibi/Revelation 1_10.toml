[[commentary]]
quote='''
I was in the Spirit, on the day of the Lord—He calls the first day of the week the Lord's, because on that day our Lord rose from the tomb, and on that day the Spirit descended upon the apostles, and on that day creation was created, and on that day our Lord arose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:10"
