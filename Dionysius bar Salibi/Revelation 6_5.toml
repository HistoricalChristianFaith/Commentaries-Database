[[commentary]]
quote='''
By the black horse, he indicates the time of suffering that falls upon the earth because of the iniquities and impieties that are multiplied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:5"
