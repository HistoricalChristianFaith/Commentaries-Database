[[commentary]]
quote='''
The first living creature like a lion—By this he shows the kingdom and sovereignty of the lion who has arisen from the tribe of Judah; Matthew shows this. The second living creature like a calf—The bull signifies the priestly glory of Christ, of which Luke tells. The third living creature has the face of a man—He shows the passibility of the Son and the lowly condition of the Son of Man who was among men, of which Mark tells. And the fourth living creature a figure of a flying eagle—By the eagle he indicates the tremendous spiritual mystery of the Word and teaches that his power extends into the heavens; John proclaims this.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 4:7"
