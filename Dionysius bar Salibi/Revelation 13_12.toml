[[commentary]]
quote='''
And all power preceded him to that first beast, and he made the earth and those who lived in it worship the first beast, whose mortal wound was healed—That signifies: after the image of the law of Augustus, by whom the Roman Empire was established, thus he also established and imposed the law of all, since he was strong, and through that obtained for himself great praise. However, this was the fourth beast, whose head was wounded and healed again, for he was destroyed and made an affront, and he wore ten diadems, because when he was eager for malice he was like him who cared for and renewed him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 13:12"
