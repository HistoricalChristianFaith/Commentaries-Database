[[commentary]]
quote='''
And he said to me: You must prophesy again about peoples and nations and kings—This signifies the preaching of the Gospel, which was done in Asia. He composed first the Apocalypse on the isle of Patmos, into which he was expelled by Domitian, and when it was reversed, the Gospel in Asia. Because of this it is said: You must prophesy again about peoples, because by all peoples the prophecy was to be heard, which is in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 10:11"
