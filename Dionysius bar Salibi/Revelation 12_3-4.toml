[[commentary]]
quote='''
And behold, a red dragon, having seven heads and ten horns, and upon his head seven diadems. And his tail draws a third of the stars of the sky, etc.—What Daniel also names a beast, John calls a dragon, i.e., the Antichrist, or the Slanderer, the dragon, who urges him to persecute the saints. He calls the saints stars, according to what our Lord said: The righteous will shine like the stars. When there are saints in that temple in the great tribulation, he will seize and abduct certain ones of them into his wickedness, and he will overthrow the traces of the elect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 12:3-4"
