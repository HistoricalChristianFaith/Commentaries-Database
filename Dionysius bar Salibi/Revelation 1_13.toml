[[commentary]]
quote='''
Clothed in a robe—Covering the feet and complete, or a garment that descends all the way to the feet. The Syrian version calls the robe an ephod.

Son of Man—God the Word is called by this name when he became flesh in accordance with what he was made. He is now called Son of Man, although he is God, because he became man without change. Again, he is called Son of Man, because he was the son of that new man who existed before the transgression of the commandment. For the body and soul that Adam had before the transgression of the commandment, the Word assumed when he became flesh.

And girding his breasts, a golden belt—He calls the two testaments breasts. He calls the peoples a belt, or girdle; just as a belt girds the loins with clothes, so also Christ has bound with his love those who believe his truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:13"
