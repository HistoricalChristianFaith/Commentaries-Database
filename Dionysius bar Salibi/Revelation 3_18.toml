[[commentary]]
quote='''
I urge you to buy from me proven gold—He calls gold the divine nature; he urges that we give what we possess to the poor. And for the alms he will give you the precious glory of his divinity: in this world, indeed, wisdom and knowledge, and in the future the splendor of the angels.

And white garments for being clothed—He names white garments good works: faith, fasting, and prayer, with the rest of the virtues. And he calls eye salve the light of divine knowledge and understanding, which is obtained by reading the Scriptures, which illuminate the covered eyes. He names eyes the sense, the faculties of the soul: mind, intellect, understanding, knowledge, discretion; by which the soul sees the spiritual world; and he teaches that by these eyes we should take away the darkness of evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 3:18"
