[[commentary]]
quote='''
Come, I will show you the judgment of the harlot who sits upon many waters, etc., up to the blood of the prophets and the saints and all the slain upon the earth—In all the things that are said above, he indicates the torture and particular harms that will come upon Babylon in the end, on the part of the tyrants who will be then.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 17:1-18:24"
