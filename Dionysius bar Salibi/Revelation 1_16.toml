[[commentary]]
quote='''
In his right hand seven stars—seven ministering spirits, which are in his power, as in his hand: the lampstands of the churches.

And out of his mouth a sharp sword—the divine word, which is sharper than a sword against the evil.

And his face like the sun—to the good he will appear glorious and mild in countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:16"
