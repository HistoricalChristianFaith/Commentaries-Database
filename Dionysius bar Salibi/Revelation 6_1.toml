[[commentary]]
quote='''
The lamb opened one of the seven seals—He wants to give this notice about future time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:1"
