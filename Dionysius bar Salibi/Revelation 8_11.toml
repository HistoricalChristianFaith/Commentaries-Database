[[commentary]]
quote='''
And the name of the star is called wormwood; and a third of the water was made into wormwood, and many men died—Wormwood is a bitter root, and everything into which it is put turns into bitterness. And before the Lord's coming, thus will befall the pagans who do evil to the Christians: for the waters, their drink, are converted into bitterness. It is a figure of the fountain of Marah, at which the Hebrews encamped; the Lord made the water sweet with wood, for those who believed. And just as for the Egyptians the waters were made blood and for the Hebrews the waters were pure, so before that day will the unfaithful be struck with the bitterness of the water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 8:11"
