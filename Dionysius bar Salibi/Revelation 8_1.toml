[[commentary]]
quote='''
And when he had opened the seventh seal, etc.—because this too is written, it is to happen in the end of time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 8:1"
