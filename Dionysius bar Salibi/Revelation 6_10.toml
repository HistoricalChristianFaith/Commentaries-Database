[[commentary]]
quote='''
Until when, Lord, do you not judge—This shows that he serves the life of the soul and its memory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:10"
