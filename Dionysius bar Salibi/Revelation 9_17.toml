[[commentary]]
quote='''
Their breastplates like fire and hyacinth and sulfur—By this he shows the clothes of those who will come from the places of the nations, because the peoples are dressed in a variety of colors who live at the banks of the Euphrates.

And the heads of their horses like heads of lions, and out of their mouth comes fire—This is also said by Isaiah: they run like lions and like lion's whelps. For he says this showing the vehemence and bitterness of those who will be gathered with the Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 9:17"
