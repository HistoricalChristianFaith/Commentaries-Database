[[commentary]]
quote='''
And the tree of life that bore fruit—The tree of life, of which he says, from here and there on the bank of the river, shows the passion of Christ, in which, when man first believes, he descends into the waters and washes away his sins.

Twelve in every month—For those twelve fruits are the twelve apostles, whose words are like leaves to the health of the people.

And the leaves of the tree the health of the people—What are now in the Church and counted little will then be revealed in glory. The health and knowledge that we will receive there is much more sublime than what is ministered here.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 22:2"
