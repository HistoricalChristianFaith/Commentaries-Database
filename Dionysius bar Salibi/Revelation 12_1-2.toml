[[commentary]]
quote='''
A woman clothed with the sun, and the moon under her feet, and upon her head a crown of twelve stars. And when she was pregnant, she shouted and in labor was struggling to give birth—That here indicates the persecutions and vexations that the church must suffer by the Antichrist. For he calls the church the woman; clothed with the sun, because she is clothed with the paternal word that shines more than the sun. And the moon under her feet—adorned with heavenly beauty like the moon. And upon her head a crown of twelve stars—the twelve apostles, whose is the Church's firmness. And she shouted and was struggling to give birth—because continually and incessantly she gives birth from her heart to the Word, and indeed in the world she suffers persecution by the unbelieving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 12:1-2"
