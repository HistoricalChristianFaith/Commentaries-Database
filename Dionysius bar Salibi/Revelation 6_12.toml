[[commentary]]
quote='''
The sixth seal signifies the end, when the Lord will have already risen from the heavens, after the killing that the Antichrist will do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:12"
