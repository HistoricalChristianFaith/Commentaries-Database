[[commentary]]
quote='''
I saw seven golden lampstands—he calls lampstands the churches of those cities. Just as a lampstand gives light to the inhabitants of a house, so the churches illuminate with their teaching the peoples who lie in sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:12"
