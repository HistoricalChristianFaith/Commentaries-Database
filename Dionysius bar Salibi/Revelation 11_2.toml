[[commentary]]
quote='''
And the court that is within the temple, send outside, and do not measure it—He has adduced this, because many who are thought to be within, because they have believed, will then be driven away, when they are to be reckoned with the sinful nations, because they have not carried themselves according to the measure of grace, according to that: He will send his angels and gather from his kingdom the stumbling blocks and cast them into the furnace of fire, and the righteous will shine like the sun.

And the holy city shall they tread under foot forty-two months—The city is the Church; and these months they are to persecute her and kill, when the false Christ shall come, because she does not worship him. Now, of this said Daniel, He shall approve the covenant for many, one week; in the half week shall cease the sacrifice. The half week: that is, three and a half years; and these make the forty-two months that are mentioned. The sacrifice he speaks of is not that of sheep, but the prayers of the upright. And the holy city he speaks of is the righteous, i.e., those who are oppressed and trodden under foot by the horn that sprang up in the midst, which is the Antichrist, as Daniel said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 11:2"
