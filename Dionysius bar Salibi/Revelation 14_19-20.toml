[[commentary]]
quote='''
And he harvested the vine of the earth and threw it into the press of the wrath of God. And that press was trampled outside the city, and blood flowed out from the press up to the bridles of horses, for a thousand six hundred stades—Zechariah has also spoken thus of the war, which before the coming of the Lord will be started by that adversary against those who in the beginning stood against him. This demonstration, however, is a type of the great breaking off of peoples and kingdoms, as also Ezekiel says that whoever opposes him in battle will fall into ruin. And Zechariah says: Before the harvest, when it is finished, there will be a flower, and there will be bitter grapes, and he will sever those little clusters with sickles, and he will sever and tear off the branches, and he will leave them to the flying things of the sky and the animals of the earth. And John says things similar to these that will be before the coming of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 14:19-20"
