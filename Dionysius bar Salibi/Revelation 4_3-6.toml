[[commentary]]
quote='''
Stone of jasper—jasper or onyx, i.e., like white lead is his likeness. And of carnelian—He is of red color like fire. Of emerald—The color of emerald is like beet.

Sea of glass like crystal—of ice.

Twenty-four elders—They are of the order of Thrones.

And four living creatures—order of Cherubim. And those having six wings are Seraphim; but in the Apocalypse he says the Cherubim have six wings and they exclaim: "Holy!" For by the church above the Son of Thunder is illuminated with this revelation.

Four living creatures full of eyes—Each living creature has four faces; because when one is the Gospel, it seems quadriform.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 4:3-6"
