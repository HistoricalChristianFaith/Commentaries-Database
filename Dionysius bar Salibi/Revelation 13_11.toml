[[commentary]]
quote='''
And I saw another beast ascending from the earth, and it had two horns, like those of a lamb; and he spoke like a dragon—The beast that ascends from the earth declares the future kingdom of the Antichrist; the two horns, however: himself and the false prophet who is with him. That his horns were like those of a lamb—He wants to become like the Son of God and to set himself forward as king. That he spoke like a dragon, because he is a seducer and not truthful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 13:11"
