[[commentary]]
quote='''
Golden belts on their chest—bound on their chests with a golden bond.

Bowls are jugs or dishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 15:6-7"
