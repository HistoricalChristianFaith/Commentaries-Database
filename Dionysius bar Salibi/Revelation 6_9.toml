[[commentary]]
quote='''
I saw under the altar the souls that have been killed—of the prophets, the apostles, and the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:9"
