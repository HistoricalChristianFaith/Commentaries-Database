[[commentary]]
quote='''
Two hundred million—This is also written in Ezekiel of that large number: All his host he will gather from the sun's rising to the sun's setting. Both those whom he called and those whom he did not call will go with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 9:16"
