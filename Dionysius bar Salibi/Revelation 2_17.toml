[[commentary]]
quote='''
And I will give him that hidden manna—the body.

White stone—It means baptism. And on the stone a new name—of Christians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 2:17"
