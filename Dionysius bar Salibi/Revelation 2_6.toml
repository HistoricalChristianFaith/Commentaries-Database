[[commentary]]
quote='''
Because you hate the works of the Nicolaitans—The heresies are those called according to the name of Nicholas. For he was one of the seven deacons who were constituted with Stephen; when he was made a disciple, he dismissed his wife, who was beautiful; and he lived chastely, and she also likewise. When a certain time had passed, there arose certain ones after him, and they made their wives common.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 2:6"
