[[commentary]]
quote='''
And from Jesus Christ—the son incarnate. Firstborn of the dead—who first rose in the flesh in incorruptibility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:5"
