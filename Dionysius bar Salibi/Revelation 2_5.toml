[[commentary]]
quote='''
Whence have you fallen?—Pay attention to what kind of honor you were in the beginning.

I will remove your lampstand—If the people is not converted, or the church that is the lampstand, from evil, it will be cast away from the face of the Son. Such is one justice to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 2:5"
