[[commentary]]
quote='''
And the structure of its wall—the construction of its wall. Jasper or jasipon; sapphire or sapphila; agate or chalcedony; emerald; the fifth, onyx or red; the sixth, carnelian or sardonyx; the seventh, chrysolite or golden stone; the eighth, beryl; the ninth, topaz or pazion; the tenth, chrysoprase or purple gold; the eleventh, jacinth, i.e., hyacinth; the twelfth, amethyst or reddening—These are said of the church, which is built with these precious stones, i.e., the saints, who just like the stones are assembled by the Word as the worker and are built as a city, and on that day they will be filled with glory and God will dwell in it. The twelve stones signify mystically the twelve tribes, who were scattered through righteousness and through which the nations accessed God. And the twelve foundations are the twelve names of the apostles; they themselves are the foundations of the Church, which they bear. And he said their walls from very precious stones, i.e., the righteous and the virgins and the saints; who are sturdy, by whom the wall of the city is built, they themselves are the keepers of those who dwell in their midst. And these mysteries, which spiritually are fulfilled today, are those of which Moses had ordered types to be done. He served spiritual things with spiritual things, which now mystically the Father works, that they be shown complete and perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 21:18-20"
