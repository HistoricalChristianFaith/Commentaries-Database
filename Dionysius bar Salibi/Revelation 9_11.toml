[[commentary]]
quote='''
And the angel of the abyss, whose name in Hebrew is Abaddon, and his name in Greek, Apollyon—however: "releasing" or "destroying" or "letting loose".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 9:11"
