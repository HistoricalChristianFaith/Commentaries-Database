[[commentary]]
quote='''
And he showed me the river of the water of life. A river as of crystal, flowing from the seat of God and the lamb in the middle of the street—That river of life is baptism. In the middle of the city—in the midst of the church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 22:1"
