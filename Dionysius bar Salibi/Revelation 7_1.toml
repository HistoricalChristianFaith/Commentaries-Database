[[commentary]]
quote='''
By four angels, who appeared afterward, he indicates: by the four plagues they are to gather the sons of Adam and are ready to destroy the earth and its foundations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 7:1"
