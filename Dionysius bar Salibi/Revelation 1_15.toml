[[commentary]]
quote='''
Like Lebanese bronze—however: the mystery of the fathers is figured in the feet, which are solid in works just like bronze.

And his voice like the voice of many waters—By voice he designates his teaching like water, according to that: rivers of living water flow from his belly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:15"
