[[commentary]]
quote='''
A quart of wheat for a denarius—This announces the famine, which there will be because of the impious in the end; he calls a cabus a quart measure, which is a third of a modius in the region of Phrygia and Galatia.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:6"
