[[commentary]]
quote='''
I saw thrones that had been placed, and they sat upon them, and judgment over their souls, etc.—The saints do not receive a single reward, as if established in equality. Greater will be the reward of the virgin than that of the married; also that of him who has suffered martyrdom for our Lord, greater than that of him who has not rendered testimony. For what is said, he will give a denarius to the first and to those who have come toward evening, means about life, because all live; he calls life a denarius. Because the righteous will rise first, Zechariah teaches: The Lord will come and all the saints with him; Isaiah: The dead will rise, and those in tombs will be revived; and Paul: The dead who in Christ will rise first. And thus on the matter says John, that the slain are raised first on that glorious day. He calls this the first resurrection, not because there is a second resurrection, but he teaches of the order of the righteous, who are to be the first to enter into the kingdom; the second order is of those who will be rejected like the goats. Some say that all the dead are resurrected together in the blink of an eye; but the righteous first and afterwards the wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 20:4-5"
