[[commentary]]
quote='''
And to the angel of the church of Smyrna—Those cities are in the region of Asia.

I am the first—eternal and from the beginning. And the last—without end. And in the end of times I have put on the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 2:8"
