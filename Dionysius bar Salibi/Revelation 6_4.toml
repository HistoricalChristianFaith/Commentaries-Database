[[commentary]]
quote='''
By the red horse, battle and the shedding of the blood of the saints, which the pagans have poured out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:4"
