[[commentary]]
quote='''
That is mixed undiluted—that is mixed without mixture, namely, a drink with which nothing is mixed or conjoined.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 14:10"
