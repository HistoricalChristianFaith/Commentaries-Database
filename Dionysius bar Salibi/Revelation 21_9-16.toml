[[commentary]]
quote='''
Come, I will show you the bride, the wife of the lamb. And he took me in spirit upon a great mountain, and he showed me the holy city Jerusalem, and below: and that city was placed as a square—by four corners it is established.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 21:9-16"
