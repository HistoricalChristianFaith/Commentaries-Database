[[commentary]]
quote='''
And I was given a rod like a staff—Ezekiel shows this again, as he has announced spiritually the measurings of the heavenly city.

Arise, measure the Lord's temple, and the altar, and those who worship in it—he calls the temple the body of Christ. However, the Hebrews, when they did not understand the prophecy, tried to build it in the days of Zerubbabel and Sharbashar, leader of Cyrus's army, according to the measures that Ezekiel stated. And they were impeded, because they were unable. He therefore calls the temple, and at the same time the church, his body, in which, as he dwells in it, he resides in us. He thus again says: Destroy this temple. But, because they wanted to adduce earthly glory and measure, again from this they were impeded. Some things are what the prophet signified, and others, what the Hebrews wanted to do. And those who worship in it—In what temple do the saints worship, if not in that which is Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 11:1"
