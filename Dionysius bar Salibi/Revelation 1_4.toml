[[commentary]]
quote='''
John to the seven churches, which are in Asia—By churches, he indicates cities and calls them churches because of the excellence of the elect who were in them. He says seven, because the number seven was in high esteem among the Hebrews in the Scriptures. And there are seven gifts of one Spirit descending on one Church.

From him who is and who was—This indicates that the book is John the Apostle's; for thus he writes in the Gospel: In the beginning was the Word, etc. By the words who is, he indicates God.

And from the seven spirits—He indicates the operations of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:4"
