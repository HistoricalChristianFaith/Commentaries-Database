[[commentary]]
quote='''
A book written within and without, sealed with seven seals—For truly, too, unknown to the Jews were the secrets of the prophets; now Christ has opened all things to the believing. For he himself is the perfect seal and the key of David, who opens and no one shuts, just as John says below: Worthy are you to take the book and open its seals—He therefore takes the book and opens it, for what has been said about himself secretly before is now proclaimed openly upon the rooftops. Again, the book of which John speaks represents the soul, and the seven seals upon it are the seven gifts of the Spirit. Again, in a man's head are seven doors: two eyes, two ears, two nostrils, and a mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 5:1"
