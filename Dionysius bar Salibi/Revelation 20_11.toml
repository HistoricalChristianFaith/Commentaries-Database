[[commentary]]
quote='''
And I saw a great white throne, and him who sits upon it: and from his face fled the earth and the heaven—After the day of revelation that the faithful and unfaithful see, he will say to those who are left and have not yet tasted death: Come with me, that you enter your chambers and hide until the wrath has passed. Because, however, the heavens and the earth fled, and a place was not found for them, he shows the stupor of all creation and the commotion of the elements, because of the wrath that occurs. Through that: a place was not found for them, he shows that they did not perish, but in a stupor were shaken in a tremor, when he arose in the divine wrath who created everything; who afterwards will restore everything that will be renewed, according to that: There will be a new heaven and a new earth; and the Apostle: The expectation of creation for the revelation of the sons of God, because this creation will also be freed from the servitude of corruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 20:11"
