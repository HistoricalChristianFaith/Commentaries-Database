[[commentary]]
quote='''
To the place that is called in Hebrew Megiddo, in Greek Armageddon—We see again what John says of Babylon, which thrust him into exile.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 16:16"
