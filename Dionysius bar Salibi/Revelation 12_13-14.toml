[[commentary]]
quote='''
He pursued the woman who had given birth to the male; and she was given two wings of that great eagle, to fly into the desert: to be nourished there a time and times and half a time, away from the serpent's face—The time etc. are those thousand two hundred and sixty days or half week, when the pseudo-Christ will seize and persecute the Church, who will flee from place to place and hide herself in the mountains and in the desert. And she has with her two wings—the faithful in Christ, who, when he spreads his hands on the wood, spreads two wings—his right and left hand; and he will call the faithful and he will gather them as a hen her chicks. And through Malachi he said: To you fearing my name, that the face, the sun of justice, appear: and healing in its wings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 12:13-14"
