[[commentary]]
quote='''
Green horse indicates death and ruin, which will come in the end of times upon the inhabitants of the earth because of their evil works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:8"
