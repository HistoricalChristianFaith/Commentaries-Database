[[commentary]]
quote='''
And his number is: six hundred sixty-six—it is not permitted to be equally definite about his name: for we see that many names arrive at this reckoning, for example Titin or Auntos, and others such. This computation occurs in the alphabet of the Greeks, and not in the alphabet of the Syrians. Taw in the Greek language is three hundred, and in ours teth is nine. But because, as we said before: The beast's wound was healed, and he made the image speak—that he be strengthened, the manifestation is of those who now dominate, i.e., of the Romans. The Romans, before they had this name, were called Latins, and one of them is called a Latin. However, from this name the number of one man is collected. Latin is the name ΛΕΑΤΙΝΟΣ (Leatinos). According to the numeration of the Greeks, those signs are applied: as we said, taw is three hundred among the Greeks, seventy... such is the name of the beast and the number of his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 13:18"
