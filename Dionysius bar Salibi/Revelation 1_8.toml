[[commentary]]
quote='''
I am the Aleph and the Taw—the beginning and the end.

Who is and who was and who is to come—He expounds three times. He is God today and yesterday and forever, according to the word of the apostle. Is signifies present time, and was, past time, and is to come, future time, as God is above times and spaces and moments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:8"
