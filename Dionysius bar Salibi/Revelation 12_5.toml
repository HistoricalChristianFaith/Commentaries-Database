[[commentary]]
quote='''
And she gave birth to a male child, who is to shepherd all the nations—He called Christ male, who is God and himself man, whom the Church procures immediately and teaches to all the nations. And her son was carried off to God and to his throne—because he is the heavenly king and the Son of the Father, as David says: The Lord said to my Lord, sit at my right hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 12:5"
