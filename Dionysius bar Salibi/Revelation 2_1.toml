[[commentary]]
quote='''
To the angel of the church in Ephesus, write—Make note to the minister of the Ephesians and to his congregation, although they are patient and refute the evil, yet shortly is their love toward God to run out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 2:1"
