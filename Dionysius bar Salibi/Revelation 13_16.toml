[[commentary]]
quote='''
And he will make all these, small and great and rich, etc., and he will give them a sign upon their hands—For he is shrewd and eager to be exalted over the servants of God. And he wants to harass and drive them out of the world, because they do not give him praise. That a sign be given to them—by this the Antichrist wants to imitate the Lord, and he gives the seal of his name to those who are gathered in his house, so that even in this he oppressed the saints, and he will order everyone everywhere to build up a sanctuary, so that none of the saints can buy, but such a one who has the sign, which is given upon the right hand. However, that says to be imposed upon the seat of the eyes, or the forehead: because they will crown with a foreign crown, not of life but of death, all whom they deceive with themselves. Thus did Antiochus Epiphanes, the Antiochene, from the family of Alexander; for when he boasted in his heart, he ordered altars to be built; and indeed that all celebrate the feast of Dionysius crowned in wood: but they killed those who did not sacrifice. And the Lord struck him with worms, and he died, as it is written in Maccabees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 13:16"
