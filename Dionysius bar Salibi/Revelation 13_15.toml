[[commentary]]
quote='''
This is what is said by the prophet: He will give breath to the image, and the image of the beast will speak—He will make those who are designated by him strengthened through the law. And he will make all who do not worship the beast be killed: then the faith and patience of the saints will appear.

He will give breath to the image of the beast—the image of the beast shows a figure of this present kingdom and what the Antichrist is to do then. For all that the present kingdom does by the operation of Satan against the saints, likewise then, when the Antichrist comes, he will establish and confirm that they are against the righteous. Of what must thus be fulfilled, the Apocalypse justly says: He will give breath to the image of the beast, and the image will speak—He will strengthen those who are established by the image of the kingdom as if by the name, and he will do thus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 13:15"
