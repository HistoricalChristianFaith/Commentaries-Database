[[commentary]]
quote='''
And a white garment was given to each of them—the clothing of incorruptibility, with which they are to clothe themselves.

Until their companions are also complete—until the fullness of the elect enters. For Paul said: So that they will not be perfected without us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 6:11"
