[[commentary]]
quote='''
For, moreover, "His name is called the Word of God," and not without reason. "My heart has emitted a good word;" which word He subsequently calls by the name of the King inferentially, "I will tell my works to the King." For "by Him were made all the works, and without Him was nothing made."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 13"

[[commentary]]
quote='''
If Christ is man only, how does He say, "I proceeded forth and came from God," when it is evident that man was made by God, and did not proceed forth from Him? But in the way in which as man He proceeded not from God, thus the Word of God proceeded, of whom it is said, "My heart hath uttered forth a good Word;" which, because it is from God, is with reason also with God. And this, too, since it was not uttered without effect, reasonably makes all things: "For all things were made by Him, and without Him was nothing made." But this Word whereby all things were made (is God). "And God," says he, "was the Word." Therefore God proceeded from God, in that the Word which proceeded is God, who proceeded forth from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
