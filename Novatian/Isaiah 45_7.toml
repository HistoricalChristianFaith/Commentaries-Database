[[commentary]]
quote='''
Who, similarly wishing still more to come into our knowledge, and, by way of stirring up our minds to His worship, said, "I am the Lord, who made the light and created the darkness;" that we might deem not that some Nature,—what I know not,—was the artificer of those vicissitudes whereby nights and days are controlled, but might rather, as is more true, recognise God as their Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
