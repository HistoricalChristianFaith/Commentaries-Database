[[commentary]]
quote='''
If Christ was only man, wherefore did He lay down for us such a rule of believing as that in which He said, "And this is life eternal, that they should know Thee, the only and true God, and Jesus Christ, whom Thou hast sent?" Had He not wished that He also should be understood to be God, why did He add, "And Jesus Christ, whom Thou hast sent," except because He wished to be received as God also? Because if He had not wished to be understood to be God, He would have added, "And the man Jesus Christ, whom Thou hast sent;" but, in fact, He neither added this, nor did Christ deliver Himself to us as man only, but associated Himself with God, as He wished to be understood by this conjunction to be God also, as He is. We must therefore believe, according to the rule prescribed, on the Lord, the one true God, and consequently on Him whom He has sent, Jesus Christ, who by no means, as we have said, would have linked Himself to the Father had He not wished to be understood to be God also: for He would have separated Himself from Him had He not wished to be understood to be God. He would have placed Himself among men only, had He known Himself to be only man; nor would He have linked Himself with God had He not known Himself to be God also. But in this case He is silent about His being man, because no one doubts His being man, and with reason links Himself to God, that He might establish the formula of His divinity for those who should believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 16"
