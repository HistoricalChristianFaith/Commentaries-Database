[[commentary]]
quote='''
If Christ is only man, what is that which He says, "I and the Father are one?" For how can it be that "I and the Father are one," if He is not both God and the Son?—who may therefore be called one, seeing that He is of Himself, being both His Son, and being born of Him, being declared to have proceeded from Him, by which He is also God; which when the Jews thought to be hateful, and believed to be blasphemous, for that He had shown Himself in these discourses to be God, and therefore rushed at once to stoning, and set to work passionately to hurl stones, He strongly refuted His adversaries by the example and witness of the Scriptures. "If," said He, "He called them gods to whom the words of God were given, and the Scriptures cannot be broken, ye say of Him whom the Father sanctified, and sent into this world, Thou blasphemest, because I said, I am the Son of God." By which words He did not deny Himself to be God, but rather He confirmed the assertion that He was God. For because, undoubtedly, they are said to be gods unto whom the words of God were given, much more is He God who is found to be superior to all these. And nevertheless He refuted the calumny of blasphemy in a fitting manner with lawful tact. For He wishes that He should be thus understood to be God, as the Son of God, and He would not wish to be understood to be the Father Himself. Thus He said that He was sent, and showed them that He had manifested many good works from the Father; whence He desired that He should not be understood to be the Father, but the Son. And in the latter portion of His defence He made mention of the Son, not the Father, when He said, "Ye say, Thou blasphemest, because I said, I am the Son of God." Thus, as far as pertains to the guilt of blasphemy, He calls Himself the Son, not the Father; but as pertaining to His divinity, by saying, "I and the Father are one," He proved that He was the Son of God. He is God, therefore, but God in such a manner as to be the Son, not the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
