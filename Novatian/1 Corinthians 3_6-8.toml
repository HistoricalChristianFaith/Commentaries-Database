[[commentary]]
quote='''
In fine, the Apostle Paul also apprehended this agreement of unity, with the distinction of persons notwithstanding: for in writing to the Corinthians he said, "I have planted, Apollos watered, but God gave the increase. Therefore neither is he that planteth anything, nor he that watereth, but God who gives the increase. Now he that planteth and he that watereth are one." And who does not perceive that Apollos is one person and Paul another, and that Apollos and Paul are not one and the same person? Moreover, also, the offices mentioned of each one of them are different; for one is he who plants, and another he who waters. The Apostle Paul, however, put forward these two not as being one person, but as being "one;" so that although Apollos indeed is one, and Paul another, so far as respects the distinction of persons, yet as far as respects their agreement both are "one." For when two persons have one judgment, one truth, one faith, one and the same religion, one fear of God also, they are one even although they are two persons: they are the same, in that they have the same mind. Since those whom the consideration of person divides from one another, these same again are brought together as one by the consideration of religion. And although they are not actually the self-same people, yet in feeling the same, they are the same; and although they are two, are still one, as having an association in faith, even although they bear diversity in persons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 27"
