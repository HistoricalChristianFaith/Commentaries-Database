[[commentary]]
quote='''
And therefore by consequence He was, as we have said, the Word of God, who is revealed to be at one time invested, at another time divested of the flesh. For this, moreover, He before predicted in blessings: "He shall wash His garment in wine, and His clothing in the blood of the grape." If the garment in Christ be the flesh, and the clothing itself be the body, let it be asked who is He whose body is clothing, and garment flesh? For to us it is evident that the flesh is the garment, and the body the clothing of the Word; and He washed His bodily substance, and purified the material of the flesh in blood, that is, in wine, by His passion, in the human character that He had undertaken. Whence, if indeed He is washed, He is man, because the garment which is washed is the flesh; but He who washes is the Word of God, who, in order that He might wash the garment, was made the taker-up of the garment. Rightly, from that substance which is taken that it might be washed, He is revealed as a man, even as from the authority of the Word who washed it He is manifested to be God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 21"
