[[commentary]]
quote='''
Therefore, in this respect, one of two things must needs be established. For since it is evident that all things were made by Christ, He is either before all things, since all things were by Him, and so He is justly God; or because He is man He is subsequent to all things, and justly nothing was made by Him. But we cannot say that nothing was made by Him, when we observe it written that all things were made by Him. He is not therefore subsequent to all things; that is, He is not man only, who is subsequent to all things, but God also, since God is prior to all things. For He is before all things, because all things are by Him, while if He were only man, nothing would be by Him; or if all things were by Him, He would not be man only, because if He were only man, all things would not be by Him; nay, nothing would be by Him. What, then, do they reply? That nothing is by Him, so that He is man only? How then are all things by Him? Therefore He is not man only, but God also, since all things are by Him; so that we reasonably ought to understand that Christ is not man only, who is subsequent to all things, but God also, since by Him all things were made. For how can you say that He is man only, when you see Him also in the flesh, unless because when both aspects are considered, both truths are rightly believed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 13"
