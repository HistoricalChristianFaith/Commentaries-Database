[[commentary]]
quote='''
And He, wishing moreover to attract to gentleness our minds, brutish, and swelling, and stubborn with cloddish ferocity, says, "And upon whom shall my Spirit rest, save upon him that is lowly, and quiet, and that trembleth at my words?"—so that in some degree one may recognise how great God is, in learning to fear Him by the Spirit given to him:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
