[[commentary]]
quote='''
If Christ is only man, how comes John the Baptist to testify and say, "He who cometh after me has become before me, because He was prior to me;" when, if Christ were only man, being born after John, He could not be before John, unless because He preceded him, in that He is God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 14"
