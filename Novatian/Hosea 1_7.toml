[[commentary]]
quote='''
Why, then, should we hesitate to say what Scripture does not shrink from declaring? Why shall the truth of faith hesitate in that wherein the authority of Scripture has never hesitated? For, behold, Hosea the prophet says in the person of the Father: "I will not now save them by bow, nor by horses, nor by horsemen; but I will save them by the Lord their God." If God says that He saves by God, still God does not save except by Christ. Why, then, should man hesitate to call Christ God, when he observes that He is declared to be God by the Father according to the Scriptures? Yea, if God the Father does not save except by God, no one can be saved by God the Father unless he shall have confessed Christ to be God, in whom and by whom the Father promises that He will give him salvation: so that, reasonably, whoever acknowledges Him to be God, may find salvation in Christ God; whoever does not acknowledge Him to be God, would lose salvation which he could not find elsewhere than in Christ God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 12"
