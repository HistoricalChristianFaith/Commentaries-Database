[[commentary]]
quote='''
Of whom the same apostle, "Now unto the King eternal, immortal, invisible, the only God, be honour and glory." For He has gone beyond the contemplation of the eyes who has surpassed the greatness of thought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
