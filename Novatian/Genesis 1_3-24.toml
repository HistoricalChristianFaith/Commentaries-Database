[[commentary]]
quote='''
What if Moses pursues this same rule of truth, and delivers to us in the beginning of his sacred writings, this principle by which we may learn that all things were created and founded by the Son of God, that is, by the Word of God? For He says the same that John and the rest say; nay, both John and the others are perceived to have received from Him what they say. For if John says, "All things were made by Him, and without Him was nothing made," the prophet David too says, "I tell my works to the King." Moses, moreover, introduces God commanding that there should be light at the first, that the heaven should be established, that the waters should be gathered into one place, that the dry land should appear, that the fruit should be brought forth according to its seed, that the animals should be produced, that lights should be established in heaven, and stars. He shows that none other was then present to God—by whom these works were commanded that they should be made—than He by whom all things were made, and without whom nothing was made. And if He is the Word of God—"for my heart has uttered forth a good Word"—He shows that in the beginning the Word was, and that this Word was with the Father, and besides that the Word was God, and that all things were made by Him. Moreover, this "Word was made flesh and dwelt among us,"—to wit, Christ the Son of God; whom both on receiving subsequently as man according to the flesh, and seeing before the foundation of the world to be the Word of God, and God, we reasonably, according to the instruction of the Old and New Testament, believe and hold to be as well God as man, Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 17"
