[[commentary]]
quote='''
He, then, is always like to Himself; nor does He ever turn or change Himself into any forms, lest by change He should appear to be mortal. For the change implied in turning from one thing to another is comprehended as a portion of a certain death. Thus there is never in Him any accession or increase of any part or honour, lest anything should appear to have ever been wanting to His perfection, nor is any loss sustained in Him, lest a degree of mortality should appear to have been suffered by Him. But what He is, He always is; and who He is, He is always Himself; and what character He has, He always has. For increasing argues beginning, as well as losses prove death and perishing. And therefore He says, "I am God, I change not;" in that, what is not born cannot suffer change, holding His condition always. For whatever it be in Him which constitutes Divinity, must necessarily exist always, maintaining itself by its own powers, so that He should always be God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 4"
