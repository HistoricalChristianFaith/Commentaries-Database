[[commentary]]
quote='''
And if, moreover, the angel meets with Hagar, Sarah's maid, driven from her home as well as turned away, near the fountain of water in the way to Shur; asks and learns the reason of her flight, and after that offers her advice that she should humble herself; and, moreover, gives her the hope of the name of mother, and pledges and promises that from her womb there should be a numerous seed, and that she should have Ishmael to be born from her; and with other things unfolds the place of his habitation, and describes his mode of life; yet Scripture sets forth this angel as both Lord and God—for He would not have promised the blessing of seed unless the angel had also been God. Let them ask what the heretics can make of this present passage. Was that the Father that was seen by Hagar or not? For He is declared to be God. But far be it from us to call God the Father an angel, lest He should be subordinate to another whose angel He would be. But they will say that it was an angel. How then shall He be God if He was an angel? Since this name is nowhere conceded to angels, except that on either side the truth compels us into this opinion, that we ought to understand it to have been God the Son, who, because He is of God, is rightly called God, because He is the Son of God. But, because He is subjected to the Father, and the Announcer of the Father's will, He is declared to be the Angel of Great Counsel. Therefore, although this passage neither is suited to the person of the Father, lest He should be called an angel, nor to the person of an angel, lest he should be called God; yet it is suited to the person of Christ that He should be both God because He is the Son of God, and should be an angel because He is the Announcer of the Father's mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 18"
