[[commentary]]
quote='''
And, moreover, what is required does not come without man's knowledge; but He shows forth man's hope of future discovery and salvation in Christ. And that he is prevented from touching of the wood of the tree of life, is not caused by the malignant poison of envy, but lest, living for ever without Christ's previous pardon of his sins, he should always bear about with him for his punishment an immortality of guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 1"
