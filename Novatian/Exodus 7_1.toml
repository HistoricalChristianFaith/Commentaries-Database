[[commentary]]
quote='''
And what in the world is the reason, that although they say that this name was given even to Moses, since it is said, "I have made thee as a god to Pharaoh," it should be denied to Christ, who is declared to be ordained not to Pharaoh only, but to every creature, as both Lord and God? And in the former case indeed this name is given with reserve, in the latter lavishly; in the former by measure, in the latter above all kind of measure: "For," it is said, "the Father giveth not to the Son by measure, for the Father loveth the Son." In the former for the time, in the latter without reference to time; for He received the power of the divine name, both above all things and for all time. But if he who has received the power of one man, in respect to this limited power given him, still without hesitation attains that name of God, how much more shall He who has power over Moses himself as well be believed to have attained the authority of that name?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 20"
