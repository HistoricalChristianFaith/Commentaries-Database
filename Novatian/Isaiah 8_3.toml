[[commentary]]
quote='''
For often the divine Scripture announces things that are not yet done as being done, because thus they shall be; and things which by all means have to happen, it does not predict as if they were future, but narrates as if they were done. And thus, although Christ had not been born as yet in the times of Isaiah the prophet, he said, "For unto us a child is born;" and although Mary had not yet been approached, he said, "And I approached unto the prophetess; and she conceived, and bare a son." And when Christ had not yet made known the mind of the Father, it is said, "And His name shall be called the Angel of Great Counsel." And when He had not yet suffered, he declared, "He is as a sheep led to the slaughter." And although the cross had never yet existed, He said, "All day long have I stretched out my hands to an unbelieving people." And although not yet had He been scornfully given to drink, the Scripture says, "In my thirst they gave me vinegar to drink." And although He had not yet been stripped, He said, "Upon my vesture they did cast lots, and they numbered my bones: they pierced my hands and my feet." For the divine Scripture, foreseeing, speaks of things which it knows shall be as being already done, and speaks of things as perfected which it regards as future, but which shall come to pass without any doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 28"
