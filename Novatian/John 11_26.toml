[[commentary]]
quote='''
If Christ was only man, how is it that He Himself says, "And every one that believeth in me shall not die for evermore?" And yet he who believes in man by himself alone is called accursed; but he who believes on Christ is not accursed, but is said not to die for evermore. Whence, if on the one hand He is man only, as the heretics will have it, how shall not anybody who believes in Him die eternally, since he who trusts in man is held to be accursed? Or on the other, if he is not accursed, but rather, as it is read, destined for the attainment of everlasting life, Christ is not man only, but God also, in whom he who believes both lays aside all risk of curse, and attains to the fruit of righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 16"
