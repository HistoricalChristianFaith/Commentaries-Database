[[commentary]]
quote='''
Him, then, we acknowledge and know to be God, the Creator of all things—Lord on account of His power, Parent on account of His discipline—Him, I say, who "spake, and all things were made;" He commanded, and all things went forth: of whom it is written, "Thou hast made all things in wisdom;" of whom Moses said, "God in heaven above, and in the earth beneath;" who, according to Isaiah, "hath meted out the heaven with a span, the earth with the hollow of His hand;" "who looketh on the earth, and maketh it tremble; who boundeth the circle of the earth, and those that dwell in it like locusts; who hath weighed the mountains in a balance, and the groves in scales," that is, by the sure test of divine arrangement; and lest its greatness, lying unequally, should easily fall into ruins if it were not balanced with equal weights, He has poised this burden of the earthly mass with equity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
