[[commentary]]
quote='''
If Christ is only man, why does He say, "What if ye shall see the Son of man ascending thither where He was before?" But He ascended into heaven, therefore He was there, in that He returned thither where He was before. But if He was sent from heaven by the Father, He certainly is not man only; for man, as we have said, could not come from heaven. Therefore as man He was not there before, but ascended thither where He was not. But the Word of God descended which was there,—the Word of God, I say, and God by whom all things were made, and without whom nothing was made. It was not therefore man that thus came thence from heaven, but the Word of God; that is, God descended thence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 14"
