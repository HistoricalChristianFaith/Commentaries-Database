[[commentary]]
quote='''
Still, nevertheless, God indulgently tempered his punishment by cursing, not so much himself, as his labours upon earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 1"
