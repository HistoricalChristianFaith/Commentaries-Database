[[commentary]]
quote='''
And lest moreover any one should think that such an indefatigable providence of God does not reach to even the very least things, "One of two sparrows," says the Lord, "shall not fall without the will of the Father; but even the very hairs of your head are all numbered." And His care and providence did not permit even the clothes of the Israelites to be worn out, nor even the vilest shoes on their feet to be wasted; nor, moreover, finally, the very garments of the captive young men to be burnt. And this is not without reason; for if He embraces all things, and contains all things,—and all things, and the whole, consist of individuals,—His care will consequently extend even to every individual thing, since His providence reaches to the whole, whatever it is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 8"
