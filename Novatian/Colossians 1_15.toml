[[commentary]]
quote='''
And if by the apostle Christ is called "the first-born of every creature," how could He be the first-born of every creature, unless because according to His divinity the Word proceeded from the Father before every creature? And unless the heretics receive it thus, they will be constrained to show that Christ the man was the first-born of every creature; which they will not be able to do. Either, therefore, He is before every creature, that He may be the first-born of every creature, and He is not man only, because man is after every creature; or He is man only, and He is after every creature. And how is He the first-born of every creature, except because being that Word which is before every creature; and therefore, the first-born of every creature, He becomes flesh and dwells in us, that is, assumes that man's nature which is after every creature, and so dwells with him and in him, in us, that neither is humanity taken away from Christ, nor His divinity denied? For if He is only before every creature, humanity is taken away from Him; but if He is only man, the divinity which is before every creature is interfered with. Both of these, therefore, are leagued together in Christ, and both are conjoined, and both are linked with one another. And rightly, as there is in Him something which excels the creature, the agreement of the divinity and the humanity seems to be pledged in Him: for which reason He who is declared as made the "Mediator between God and man" is revealed to have associated in Himself God and man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 21"
