[[commentary]]
quote='''
And yet, even after this, the same divine Scripture justly does not cease to call the Angel God, and to pronounce God the Angel. For when this very Jacob was about to bless Manasseh and Ephraim, the sons of Joseph, with his hands placed across on the heads of the lads, he said, "The God which fed me from my youth even unto this day, the Angel who delivered me from all evils, bless these lads." Even to such a point does he affirm the same Being to be an Angel, whom he had called God, as in the end of his discourse, to express the person of whom he was speaking as one, when he said "bless these lads." For if he had meant the one to be understood as God, and the other as an angel, he would have comprised the two persons in the plural number; but now he defined the singular number of one person in the blessing, whence he meant it to be understood that the same person is God and Angel. But yet He cannot be received as God the Father; but as God and Angel, as Christ He can be received. And Him, as the author of this blessing, Jacob also signified by placing his hands crossed upon the lads, as if their father was Christ, and showing, from thus placing his hands, the figure and future form of the passion. Let no one, therefore, who does not shrink from speaking of Christ as an Angel, thus shrink from pronouncing Him God also, when he perceives that He Himself was invoked in the blessing of these lads, by the sacrament of the passion, intimated in the type of the crossed hands, as both God and Angel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 19"
