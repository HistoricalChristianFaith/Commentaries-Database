[[commentary]]
quote='''
"For," it is said, "of Him, and through Him, and in Him are all things." For all things are by His command, because they are of Him; and are ordered by His word as being through Him; and all things return to His judgment; as in Him expecting liberty when corruption shall be done away, they appear to be recalled to Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
