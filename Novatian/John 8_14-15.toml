[[commentary]]
quote='''
If Christ is only man, how is it that He says, "Though I bear record of myself, yet my record is true: because I know whence I came, and whither I go; ye know not whence I came, and whither I go. Ye judge after the flesh?" Behold, also He says, that He shall return thither whence He bears witness that He came before, as being sent,—to wit, from heaven. He came down therefore from whence He came, in the same manner as He goes thither from whence He descended. Whence if Christ were only man, He would not have come thence, and therefore would not depart thither, because He would not have come thence. Moreover, by coming thence, whence as man He could not have come, He shows Himself to have come as God. For the Jews, ignorant and untaught in the matter of this very descent of His, made these heretics their successors, seeing that to them it is said, "Ye know not whence I come, and whither I go: ye judge after the flesh." As much they as the Jews, holding that the carnal birth of Christ was the only one, believed that Christ was nothing else than man; not considering this point, that as man could not come from heaven, so as that he might return thither, He who descended thence must be God, seeing that man could not come thence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
