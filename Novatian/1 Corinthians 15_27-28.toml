[[commentary]]
quote='''
And His divinity is thus declared, that it may not appear by any dissonance or inequality of divinity to have caused two Gods. For all things being subjected to Him as the Son by the Father, while He Himself, with those things which are subjected to Him, is subjected to His Father, He is indeed proved to be Son of His Father; but He is found to be both Lord and God of all else. Whence, while all things put under Him are delivered to Him who is God, and all things are subjected to Him, the Son refers all that He has received to the Father, remits again to the Father the whole authority of His divinity. The true and eternal Father is manifested as the one God, from whom alone this power of divinity is sent forth, and also given and directed upon the Son, and is again returned by the communion of substance to the Father. God indeed is shown as the Son, to whom the divinity is beheld to be given and extended. And still, nevertheless, the Father is proved to be one God; while by degrees in reciprocal transfer that majesty and divinity are again returned and reflected as sent by the Son Himself to the Father, who had given them; so that reasonably God the Father is God of all, and the source also of His Son Himself whom He begot as Lord. Moreover, the Son is God of all else, because God the Father put before all Him whom He begot. Thus the Mediator of God and men, Christ Jesus, having the power of every creature subjected to Him by His own Father, inasmuch as He is God; with every creature subdued to Him, found at one with His Father God, has, by abiding in that condition that He moreover "was heard," briefly proved God His Father to be one and only and true God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 31"
