[[commentary]]
quote='''
For in the same way as Isaiah says, "Behold, a virgin shall conceive and bear a son, and ye shall call His name Emmanuel, which is, interpreted, God with us;" so Christ Himself says, "Lo, I am with you, even to the consummation of the world." Therefore He is "God with us;" yea, and much rather, He is in us. Christ is with us, therefore it is He whose name is God with us, because He also is with us; or is He not with us? How then does He say that He is with us? He, then, is with us. But because He is with us He was called Emmanuel, that is, God with us. God, therefore, because He is with us, was called God with us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 12"
