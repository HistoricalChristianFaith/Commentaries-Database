[[commentary]]
quote='''
This is He who, after the manner of a dove, when our Lord was baptized, came and abode upon Him, dwelling in Christ full and entire, and not maimed in any measure or portion; but with His whole overflow copiously distributed and sent forth, so that from Him others might receive some enjoyment of His graces: the source of the entire Holy Spirit remaining in Christ, so that from Him might be drawn streams of gifts and works, while the Holy Spirit dwelt affluently in Christ. For truly Isaiah, prophesying this, said: "And the Spirit of wisdom and understanding shall rest upon Him, the Spirit of counsel and might, the Spirit of knowledge and piety; and the Spirit of the fear of the Lord shall fill Him." This self-same thing also he said in the person of the Lord Himself, in another place, "The Spirit of the Lord is upon me; because He has anointed me, He has sent me to preach the Gospel to the poor." Similarly David: "Wherefore God, even Thy God, hath anointed Thee with the oil of gladness above thy fellows."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 29"
