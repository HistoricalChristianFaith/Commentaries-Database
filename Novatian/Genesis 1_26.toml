[[commentary]]
quote='''
And after these things He also placed man at the head of the world, and man, too, made in the image of God, to whom He imparted mind, and reason, and foresight, that he might imitate God; and although the first elements of his body were earthly, yet the substance was inspired by a heavenly and divine breathing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 1"
