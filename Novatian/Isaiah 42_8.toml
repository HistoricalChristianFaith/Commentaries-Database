[[commentary]]
quote='''
Who says by the prophet, "I am God, and there is none beside me." Who says by the same prophet, "Because I will not give my majesty to another," that He may exclude all heathens and heretics with their figments; proving that that is not God who is made by the hand of the workman, nor that which is feigned by the intellect of a heretic. For he is not God for whose existence the workman must be asked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
