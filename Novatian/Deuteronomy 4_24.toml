[[commentary]]
quote='''
Finally, if you receive the Spirit as the substance of God, you will make God a creature. For every spirit is a creature. And therefore, then, God will be made. In which manner also, if, according to Moses, you should receive God to be fire, in saying that He is a creature, you will have declared what is ordained, you will not have taught who is its ordainer. But these things are rather used as figures than as being so in fact. For as, in the Old Testament, God is for this reason called Fire, that fear may be struck into the hearts of a sinful people, by suggesting to them a Judge; so in the New Testament He is announced as Spirit, that, as the Renewer and Creator of those who are dead in their sins, He may be attested by this goodness of mercy granted to those that believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 7"
