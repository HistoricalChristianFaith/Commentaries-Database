[[commentary]]
quote='''
And when He had given him all things for his service, He willed that he alone should be free. And lest, again, an unbounded freedom should fall into peril, He laid down a command, in which man was taught that there was no evil in the fruit of the tree; but he was forewarned that evil would arise if perchance he should exercise his free will, in the contempt of the law that was given. For, on the one hand, it had behoved him to be free, lest the image of God should, unfittingly be in bondage; and on the other, the law was to be added, so that an unbridled liberty might not break forth even to a contempt of the Giver. So that he might receive as a consequence both worthy rewards and a deserved punishment, having in his own power that which he might choose to do, by the tendency of his mind in either direction: whence, therefore, by envy, mortality comes back upon him; seeing that, although he might escape it by obedience, he rushes into it by hurrying to be God under the influence of perverse counsel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 1"
