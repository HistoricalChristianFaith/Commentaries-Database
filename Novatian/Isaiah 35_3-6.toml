[[commentary]]
quote='''
The same prophet says: "Be ye strengthened, ye relaxed hands, and ye feeble knees; be consoled, ye that are cowardly in heart; be strong; fear not. Lo, our God shall return judgment; He Himself shall come, and shall save you: then shall the eyes of the blind be opened, and the ears of the deaf shall hear; then shall the lame man leap as an hart, and the tongue of the dumb shall be eloquent." Since the prophet says that at God's advent these should be the signs which come to pass; let men acknowledge either that Christ is the Son of God, at whose advent and by whom these wonders of healings were performed; or, overcome by the truth of Christ's divinity, let them rush into the other heresy, and refusing to confess Christ to be the Son of God, and God, let them declare Him to be the Father. For, being bound by the words of the prophets, they can no longer deny Christ to be God. What, then, do they reply when those signs are said to be about to take place on the advent of God, which were manifested on the advent of Christ? In what way do they receive Christ as God? For now they cannot deny Him to be God. As God the Father, or as God the Son? If as the Son, why do they deny that the Son of God is God? If as the Father, why do they not follow those who appear to maintain blasphemies of that kind? unless because in this contest against them concerning the truth, this is in the meantime sufficient for us, that, being convinced in any kind of way, they should confess Christ to be God, seeing they have even wished to deny that He is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 12"
