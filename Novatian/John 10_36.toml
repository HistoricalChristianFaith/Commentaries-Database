[[commentary]]
quote='''
Besides, when at these words of the Lord the Jewish ignorance had been aroused, so that hastily they ran to take up stones, and said, "For a good work we stone thee not, but for blasphemy; and because thou, being a man, makest thyself God," the Lord established the distinction, in giving them the principle on which He had either said that He was God, or wished it to be understood, and says, "Say ye of Him, whom the Father sanctified, and sent into this world, Thou blasphemest; because I said, I am the Son of God?" Even here also He said that He had the Father. He is therefore the Son, not the Father: for He would have confessed that He was the Father had He considered Himself to be the Father; and He declares that He was sanctified by His Father. In receiving, then, sanctification from the Father, He is inferior to the Father. Now, consequently, He who is inferior to the Father, is not the Father, but the Son; for had He been the Father, He would have given, and not received, sanctification. Now, however, by declaring that He has received sanctification from the Father, by the very fact of proving Himself to be less than the Father, by receiving from Him sanctification, He has shown that He is the Son, and not the Father. Besides, He says that He is sent: so that by that obedience wherewith the Lord Christ came, being sent, He might be proved to be not the Father, but the Son, who assuredly would have sent had He been the Father; but being sent, He was not the Father, lest the Father should be proved, in being sent, to be subjected to another God. And still after this He added what might dissolve all ambiguity, and quench all the controversy of error: for He says, in the last portion of His discourse, "Ye say, Thou blasphemest, because I said I am the Son of God." Therefore if He plainly testifies that He is the Son of God, and not the Father, it is an instance of great temerity and excessive madness to stir up a controversy of divinity and religion, contrary to the testimony of the Lord Christ Himself, and to say that Christ Jesus is the Father, when it is observed that He has proved Himself to be, not the Father, but the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 27"
