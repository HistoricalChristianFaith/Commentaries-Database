[[commentary]]
quote='''
Him alone the Lord rightly declares good, of whose goodness the whole world is witness; which world He would not have ordained if He had not been good. For if "everything was very good," consequently, and reasonably, both those things which were ordained have proved that He that ordained them is good, and those things which are the work of a good Ordainer cannot be other than good; wherefore every evil is a departure from God. For it cannot happen that He should be the originator or architect of any evil work, who claims to Himself the name of "the Perfect," both Parent and Judge, especially when He is the avenger and judge of every evil work; because, moreover, evil does not occur to man from any other cause than by his departure from the good God. Moreover, this very thing is specified in man, not because it was necessary, but because he himself so willed it. Whence it manifestly appeared also what was evil; and lest there should seem to be envy in God, it was evident whence evil had arisen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 4"
