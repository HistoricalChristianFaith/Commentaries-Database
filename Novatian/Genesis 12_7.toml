[[commentary]]
quote='''
Behold, the same Moses tells us in another place that "God was seen of Abraham." And yet the same Moses hears from God, that "no man can see God and live." If God cannot be seen, how was God seen? Or if He was seen, how is it that He cannot be seen? For John also says, "No man hath seen God at any time;" and the Apostle Paul, "Whom no man hath seen, nor can see." But certainly the Scripture does not lie; therefore, truly, God was seen. Whence it may be understood that it was not the Father who was seen, seeing that He never was seen; but the Son, who has both been accustomed to descend, and to be seen because He has descended. For He is the image of the invisible God, as the imperfection and frailty of the human condition was accustomed sometimes even then to see God the Father in the image of God, that is, in the Son of God. For gradually and by progression human frailty was to be strengthened by the image to that glory of being able one day to see God the Father. For the things that are great are dangerous if they are sudden. For even the sudden light of the sun after darkness, with its too great splendour, will not make manifest the light of day to unaccustomed eyes, but will rather strike them with blindness.

And lest this should occur to the injury of human eyes, the darkness is broken up and scattered by degrees; and the rising of that luminary, mounting by small and unperceived increments, gently accustoms men's eyes to bear its full orb by the gentle increase of its rays. Thus, therefore, Christ also—that is, the image of God, and the Son of God—is looked upon by men, inasmuch as He could be seen. And thus the weakness and imperfection of the human destiny is nourished, led up, and educated by Him; so that, being accustomed to look upon the Son, it may one day be able to see God the Father Himself also as He is, that it may not be stricken by His sudden and intolerable brightness, and be hindered from being able to see God the Father, whom it has always desired. Wherefore it is the Son who is seen; but the Son of God is the Word of God: and the Word of God was made flesh, and dwelt among us; and this is Christ. What in the world is the reason that we should hesitate to call Him God, who in so many ways is acknowledged to be proved God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 18"
