[[commentary]]
quote='''
Established in this Spirit, "none ever calleth Jesus anathema;" no one has ever denied Christ to be the Son of God, or has rejected God the Creator; no one utters any words of his own contrary to the Scriptures; no one ordains other and sacrilegious decrees; no one draws up different laws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 29"
