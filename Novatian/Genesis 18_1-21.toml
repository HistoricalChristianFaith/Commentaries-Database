[[commentary]]
quote='''
To this, moreover, Moses added the instance of God seen of Abraham at the oak of Mamre, when he was sitting at the opening of his tent at noon-day. And nevertheless, although he had beheld three men, note that he called one of them Lord; and when he had washed their feet, he offers them bread baked on the ashes, with butter and abundance of milk itself, and urges them that, being detained as guests, they should eat. And after this he hears also that he should be a father, and learns that Sarah his wife should bring forth a son by him; and acknowledges concerning the destruction of the people of Sodom, what they deserve to suffer; and learns that God had come down on account of the cry of Sodom. In which place, if they will have it that the Father was seen at that time to have been received with hospitality in company with two angels, the heretics have believed the Father to be visible. But if an angel, although of the three angels one is called Lord, why, although it is not usual, is an angel called God? Unless because, in order that His proper invisibility may be restored to the Father, and the proper inferiority be remitted to the angel, it was only God the Son, who also is God, who was seen by Abraham, and was believed to have been received with hospitality. For He anticipated sacramentally what He was hereafter to become. He was made a guest of Abraham, being about to be among the sons of Abraham. And his children's feet, by way of proving what He was, He washed; returning in the children the claim of hospitality which formerly the Father had put out to interest to Him. Whence also, that there might be no doubt but that it was He who was the guest of Abraham on the destruction of the people of Sodom, it is declared: "Then the Lord rained upon Sodom and upon Gomorrha fire and brimstone from the Lord out of heaven." For thus also said the prophet in the person of God: "I have overthrown you, as the Lord overturned Sodom and Gomorrha." Therefore the Lord overturned Sodom, that is, God overturned Sodom; but in the overturning of Sodom, the Lord rained fire from the Lord. And this Lord was the God seen by Abraham; and this God was the guest of Abraham, certainly seen because He was also touched. But although the Father, being invisible, was assuredly not at that time seen, He who was accustomed to be touched and seen was seen and received to hospitality. But this the Son of God, "The Lord rained from the Lord upon Sodom and Gomorrha brimstone and fire." And this is the Word of God. And the Word of God was made flesh, and dwelt among us; and this is Christ. It was not the Father, then, who was a guest with Abraham, but Christ. Nor was it the Father who was seen then, but the Son; and Christ was seen. Rightly, therefore, Christ is both Lord and God, who was not otherwise seen by Abraham, except that as God the Word He was begotten of God the Father before Abraham himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 18"
