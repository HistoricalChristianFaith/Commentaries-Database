[[commentary]]
quote='''
For a law of resurrection is established, in that Christ is raised up in the substance of the body as an example for the rest; because, when it is written that "flesh and blood do not inherit the kingdom of God," it is not the substance of the flesh that is condemned, which was built up by the divine hands that it should not perish, but only the guilt of the flesh is rightly rebuked, which by the voluntary daring of man rebelled against the claims of divine law. Because in baptism and in the dissolution of death the flesh is raised up and returns to salvation, by being recalled to the condition of innocency when the mortality of guilt is put away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 10"
