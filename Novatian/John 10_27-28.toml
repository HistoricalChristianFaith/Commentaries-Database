[[commentary]]
quote='''
If Christ was only man, how does He say, "And I know them, and my sheep follow me; and I give unto them eternal life, and they shall never perish?" And yet, since every man is bound by the laws of mortality, and therefore is unable to keep himself for ever, much more will he be unable to keep another for ever. But Christ promises to give salvation for ever, which if He does not give, He is a deceiver; if He gives, He is God. But He does not deceive, for He gives what He promises. Therefore He is God who proffers eternal salvation, which man, being unable to keep himself for ever, cannot be able to give to another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
