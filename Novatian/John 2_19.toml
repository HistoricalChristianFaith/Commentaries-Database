[[commentary]]
quote='''
Although, however, I must hasten to other matters, I do not think that I must pass over this point, that in the Gospel the Lord declared, by way of signifying His majesty, saying, "Destroy this temple, and in three days I will build it up again." Or when, in another passage, and on another subject, He declares, "I have power to lay down my life, and again to take it up; for this commandment I have received of my Father." Now who is it who says that He can lay down His life, or can Himself recover His life again, because He has received it of His Father? Or who says that He can again resuscitate and rebuild the destroyed temple of His body, except because He is the Word who is from the Father, who is with the Father, "by whom all things were made, and without whom nothing was made;" the imitator of His Father's works and powers, "the image of the invisible God;" "who came down from heaven;" who testified what things he had seen and heard; who "came not to do His own will, but rather to do the will of the Father," by whom He had been sent for this very purpose, that being made the "Messenger of Great Counsel," He might unfold to us the laws of the heavenly mysteries; and who as the Word made flesh dwelt among us, of us this Christ is proved to be not man only, because He was the son of man, but also God, because He is the Son of God?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 21"
