[[commentary]]
quote='''
For our bodies are both trained in Him and by Him to advance to immortality, by learning to govern themselves with moderation according to His decrees. For this is He who "desireth against the flesh," because "the flesh resisteth against the Spirit." This is He who restrains insatiable desires, controls immoderate lusts, quenches unlawful fires, conquers reckless impulses, repels drunkenness, checks avarice, drives away luxurious revellings, links love, binds together affections, keeps down sects, orders the rule of truth, overcomes heretics, turns out the wicked, guards the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 29"
