[[commentary]]
quote='''
And since by the gaze of our eyes we cannot see Him, we rightly learn of Him from the greatness, and the power, and the majesty of His works. "For the invisible things of Him," says the Apostle Paul," from the creation of the world, are clearly seen, being understood by those things which are made, even His eternal power and godhead;" so that the human mind, learning hidden things from those that are manifest, from the greatness of the works which it should behold, might with the eyes of the mind consider the greatness of the Architect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 3"
