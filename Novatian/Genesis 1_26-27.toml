[[commentary]]
quote='''
What if the same Moses introduces God saying, "Let us make man after our image and likeness;" and below, "And God made man; in the image of God made He him, male and female made He them?" If, as we have already shown, it is the Son of God by whom all things were made, certainly it was the Son of God by whom also man was ordained, on whose account all things were made. Moreover, when God commands that man should be made, He is said to be God who makes man; but the Son of God makes man, that is to say, the Word of God, "by whom all things were made, and without whom nothing was made." And this Word was made flesh, and dwelt among us: therefore Christ is God; therefore man was made by Christ as by the Son of God. But God made man in the image of God; He is therefore God who made man in the image of God; therefore Christ is God: so that with reason neither does the testimony of the Old Testament waver concerning the person of Christ, being supported by the manifestation of the New Testament; nor is the power of the New Testament detracted from, while its truth is resting on the roots of the same Old Testament. Whence they who presume Christ the Son of God and man to be only man, and not God also, do so in opposition to both Old and New Testaments, in that they corrupt the authority and the truth both of the Old and New Testaments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 17"
