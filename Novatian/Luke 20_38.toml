[[commentary]]
quote='''
For if Abraham, and Isaac, and Jacob, who, it is admitted, were only men, are manifested to be alive—for all they, says He, "live unto God;" and death in them does not destroy the soul, although it dissolves the bodies themselves: for it could exercise its power on the bodies, it did not avail to exercise it on the souls: for the one in them was mortal, and therefore died; the other in them was immortal, and therefore is understood not to have been extinguished: for which reason they are affirmed and said to live unto God,—much rather death in Christ could have power against the material of His body alone, while against the divinity of the Word it could not bring itself to bear. For the power of death is broken when the authority of immortality intervenes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 25"
