[[commentary]]
quote='''
But when Scripture determines, as we have frequently shown, that He is not only God, but man also, it follows that what is immortal may be held to have remained uncorrupted. For who cannot understand that the divinity is impassible, although the human weakness is liable to suffering? When, therefore, Christ is understood to be mingled and associated as well of that which God is, as of that which man is—for "the Word was made flesh, and dwelt in us"—who cannot easily apprehend of himself, without any teacher and interpreter, that it was not that in Christ that died which is God, but that in Him died which is man? For what if the divinity in Christ does not die, but the substance of the flesh only is destroyed, when in other men also, who are not flesh only, but flesh and soul, the flesh indeed alone suffers the inroads of wasting and death, while the soul is seen to be uncorrupted, and beyond the laws of destruction and death? For this also our Lord Himself said, exhorting us to martyrdom and to contempt of all human power: "Fear not those who slay the body, but cannot kill the soul." But if the immortal soul cannot be killed or slain in any other, although the body and flesh by itself can be slain, how much rather assuredly could not the Word of God and God in Christ be put to death at all, although the flesh alone and the body was slain! For if in any man whatever, the soul has this excellence of immortality that it cannot be slain, much more has the nobility of the Word of God this power of not being slain. For if the power of men fails to slay the sacred power of God, and if the cruelty of man fails to destroy the soul, much more ought it to fail to slay the Word of God. For as the soul itself, which was made by the Word of God, is not killed by men, certainly much rather will it be believed that the Word of God cannot be destroyed. And if the sanguinary cruelty of men cannot do more against men than only to slay the body, how much more certainly it will not have power against Christ beyond in the same way slaying the body! So that, while from these considerations it is gathered that nothing but the human nature in Christ was put to death, it appears that the Word in Him was not drawn down into mortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 25"
