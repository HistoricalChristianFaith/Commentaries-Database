[[commentary]]
quote='''
Whence also, that there might be no doubt but that it was He who was the guest of Abraham on the destruction of the people of Sodom, it is declared: "Then the Lord rained upon Sodom and upon Gomorrha fire and brimstone from the Lord out of heaven." For thus also said the prophet in the person of God: "I have overthrown you, as the Lord overturned Sodom and Gomorrha." Therefore the Lord overturned Sodom, that is, God overturned Sodom; but in the overturning of Sodom, the Lord rained fire from the Lord. And this Lord was the God seen by Abraham; and this God was the guest of Abraham, certainly seen because He was also touched. But although the Father, being invisible, was assuredly not at that time seen, He who was accustomed to be touched and seen was seen and received to hospitality. But this the Son of God, "The Lord rained from the Lord upon Sodom and Gomorrha brimstone and fire." And this is the Word of God. And the Word of God was made flesh, and dwelt among us; and this is Christ. It was not the Father, then, who was a guest with Abraham, but Christ. Nor was it the Father who was seen then, but the Son; and Christ was seen. Rightly, therefore, Christ is both Lord and God, who was not otherwise seen by Abraham, except that as God the Word He was begotten of God the Father before Abraham himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 18"
