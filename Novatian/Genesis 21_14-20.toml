[[commentary]]
quote='''
Moreover, says the Scripture, the same Angel and God visits and consoles the same Hagar when driven with her son from the dwelling of Abraham. For when in the desert she had exposed the infant, because the water had fallen short from the pitcher; and when the lad had cried out, and she had lifted up her weeping and lamentation, "God heard," says the Scripture, "the voice of the lad from the place where he was." Having told that it was God who heard the voice of the infant, it adds: "And the angel of the Lord called Hagar herself out of heaven," saying that that was an angel whom it had called God, and pronouncing Him to be Lord whom it had set forth as an angel; which Angel and God moreover promises to Hagar herself greater consolations, in saying, "Fear not; for I have heard the voice of the lad from the place where he was. Arise, take up the lad, and hold him; for I will make of him a great nation." Why does this angel, if angel only, claim to himself this right of saying, I will make of him a great nation, since assuredly this kind of power belongs to God, and cannot belong to an angel? Whence also He is confirmed to be God, since He is able to do this; because, by way of proving this very point, it is immediately added by the Scripture: "And God opened her eyes, and she saw a well of running water; and she went and filled the bottle from the well, and gave to the lad: and God was with the lad." If, then, this God was with the Lord, who opened the eyes of Hagar that she might see the well of running water, and might draw the water on account of the urgent need of the lad's thirst, and this God who calls her from heaven is called an angel when, in previously hearing the voice of the lad crying, He was rather God; is not understood to be other than angel, in like manner as He was God also. And since this cannot be applicable or fitting to the Father, who is God only, but may be applicable to Christ, who is declared to be not only God, but angel also, it manifestly appears that it was not the Father who thus spoke to Hagar, but rather Christ, since He is God; and to Him also is applied the name of angel, since He became the "angel of great counsel." And He is the angel, in that He declares the bosom of the Father, as John sets forth. For if John himself says, that He Himself who sets forth the bosom of the Father, as the Word, became flesh in order to declare the bosom of the Father, assuredly Christ is not only man, but angel also; and not only angel, but He is shown by the Scriptures to be God also. And this is believed to be the case by us; so that, if we will not consent to apprehend that it was Christ who then spoke to Hagar, we must either make an angel God, or we must reckon God the Father Almighty among the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 18"
