[[commentary]]
quote='''
And if the same apostle says of Christ, that "having put off the flesh, He spoiled powers, they being openly triumphed over in Himself," he certainly did not without a meaning propound that the flesh was put off, unless because he wished it to be understood that it was again put on also at the resurrection. Who, therefore, is He that thus put off and put on the flesh? Let the heretics seek out. For we know that the Word of God was invested with the substance of flesh, and that He again was divested of the same bodily material, which again He took up in the resurrection and resumed as a garment. And yet Christ could neither have been divested of nor invested with manhood, had He been only man: for man is never either deprived of nor invested with himself. For that must be something else, whatever it may be, which by any other is either taken away or put on. Whence, reasonably, it was the Word of God who put off the flesh, and again in the resurrection put it on, since He put it off because at His birth He had been invested with it. Therefore in Christ it is God who is invested, and moreover must be divested, because He who is invested must also likewise be He who is divested; whereas, as man, He is invested with and divested of, as it were, a certain tunic of the compacted body. And therefore by consequence He was, as we have said, the Word of God, who is revealed to be at one time invested, at another time divested of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 21"
