[[commentary]]
quote='''
For He it is who "as a bridegroom goeth forth from his bride-chamber; He exulted as a giant to run his way. His going forth is from the end of the heaven, and His return unto the ends of it." Because, even to the highest, "not any one hath ascended into heaven save He who came down from heaven, the Son of man who is in heaven." Repeating this same thing, He says: "Father, glorify me with that glory wherewith I was with Thee before the world was." And if this Word came down from heaven as a bridegroom to the flesh, that by the assumption of flesh He might ascend thither as the Son of man, whence the Son of God had descended as the Word, reasonably, while by the mutual connection both flesh wears the Word of God, and the Son of God assumes the frailty of the flesh; when the flesh being espoused ascending thither, whence without the flesh it had descended, it at length receives that glory which in being shown to have had before the foundation of the world, it is most manifestly proved to be God. And, nevertheless, while the world itself is said to have been founded after Him, it is found to have been created by Him; by that very divinity in Him whereby the world was made, both His glory and His authority are proved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 13"

[[commentary]]
quote='''
If Christ was only man, how does He say, "And now glorify me with the glory which I had with Thee before the world was?" If, before the world was, He had glory with God, and maintained His glory with the Father, He existed before the world, for He would not have had the glory unless He Himself had existed before, so as to be able to keep the glory. For no one could possess anything, unless he himself should first be in existence to keep anything. But now Christ has the glory before the foundation of the world; therefore He Himself was before the foundation of the world. For unless He were before the foundation of the world, He could not have glory before the foundation of the world, since He Himself was not in existence. But indeed man could not have glory before the foundation of the world, seeing that he was after the world; but Christ had—therefore He was before the world. Therefore He was not man only, seeing that He was before the world. He is therefore God, because He was before the world, and held His glory before the world. Neither let this be explained by predestination, since this is not so expressed, or let them add this who think so, but woe is denounced to them who add to, even as to those who take away from, that which is written. Therefore that may not be said, which may not be added. And thus, predestination being set aside, seeing it is not so laid down, Christ was in substance before the foundation of the world. For He is "the Word by which all things were made, and without which nothing was made." Because even if He is said to be glorious in predestination, and that this predestination was before the foundation of the world, let order be maintained, and before Him a considerable number of men was destined to glory. For in respect of that destination, Christ will be perceived to be less than others if He is designated subsequent to them. For if this glory was in predestination, Christ received that predestination to glory last of all; for prior to Him Adam will be seen to have been predestinated, and Abel, and Enoch, and Noah, and Abraham, and many others. For since with God the order of all, both persons and things, is arranged, many will be said to have been predestinated before this predestination of Christ to glory. And on these terms Christ is discovered to be inferior to other men, although He is really found to be better and greater, and more ancient than the angels themselves. Either, then, let all these things be set on one side, that Christ's divinity may be destroyed; or if these things cannot be set aside, let His proper divinity be attributed to Christ by the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 16"
