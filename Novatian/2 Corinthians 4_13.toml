[[commentary]]
quote='''
And He is not new in the Gospel, nor yet even newly given; for it was He Himself who accused the people in the prophets, and in the apostles gave them the appeal to the Gentiles. For the former deserved to be accused, because they had contemned the law; and they of the Gentiles who believe deserve to be aided by the defence of the Spirit, because they earnestly desire to attain to the Gospel law. Assuredly in the Spirit there are different kinds of offices, because in the times there is a different order of occasions; and yet, on this account, He who discharges these offices is not different, nor is He another in so acting, but He is one and the same, distributing His offices according to the times, and the occasions and impulses of things. Moreover, the Apostle Paul says, "Having the same Spirit; as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak." He is therefore one and the same Spirit who was in the prophets and apostles, except that in the former He was occasional, in the latter always. But in the former not as being always in them, in the latter as abiding always in them; and in the former distributed with reserve, in the latter all poured out; in the former given sparingly, in the latter liberally bestowed; not yet manifested before the Lord's resurrection, but conferred after the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 29"
