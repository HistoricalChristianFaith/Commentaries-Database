[[commentary]]
quote='''
For, said He, "I will pray the Father, and He will give you another Advocate, that He may be with you for ever, even the Spirit of truth." And, "When He, the Advocate, shall come, whom I shall send unto you from my Father, the Spirit of truth who proceedeth from my Father." And, "If I go not away, that Advocate shall not come to you; but if I go away, I will send Him to you." And, "When the Spirit of truth shall come, He will direct you into all the truth." And because the Lord was about to depart to the heavens, He gave the Paraclete out of necessity to the disciples; so as not to leave them in any degree orphans, which was little desirable, and forsake them without an advocate and some kind of protector. For this is He who strengthened their hearts and minds, who marked out the Gospel sacraments, who was in them the enlightener of divine things; and they being strengthened, feared, for the sake of the Lord's name, neither dungeons nor chains, nay, even trod under foot the very powers of the world and its tortures, since they were henceforth armed and strengthened by the same Spirit, having in themselves the gifts which this same Spirit distributes, and appropriates to the Church, the spouse of Christ, as her ornaments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 29"
