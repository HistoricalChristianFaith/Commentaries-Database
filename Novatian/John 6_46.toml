[[commentary]]
quote='''
If Christ is only man, how does He say that "no man hath seen God at any time, save He which is of God; He hath seen God?" Because if Christ is only man, He could not see God, because no man has seen God; but if, being of God, He has seen God, He wishes it to be understood that He is more than man, in that He has seen God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 14"
