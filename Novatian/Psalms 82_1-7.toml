[[commentary]]
quote='''
And if "God standeth in the assembly of the gods, and in the midst God distinguisheth between the gods," and Christ stood at various times in the synagogue, then Christ stood in the synagogue as God,—judging, to wit, between the gods, to whom He says, "How long do ye accept the persons of men?" That is to say, consequently, charging the men of the synagogue with not practising just judgments. Further, if they who are reproved and blamed seem even for any reason to attain this name without blasphemy, that they should be called gods, assuredly much more shall He be esteemed God, who not only is said to have stood as God in the synagogue of the gods, but moreover is revealed by the same authority of the reading as distinguishing and judging between gods. But even if they who "fall like one of the princes" are still called gods, much rather shall He be said to be God, who not only does not fall like one of the princes, but even overcomes both the author and prince of wickedness himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 20"
