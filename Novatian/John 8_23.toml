[[commentary]]
quote='''
If Christ is only man, how does He say, "Ye are from below, I am from above; ye are of this world, I am not of this world?" But therefore if every man is of this world, and Christ is for that reason in this world, is He only man? God forbid! But consider what He says: "I am not of this world." Does He then speak falsely when He says "of this world," if He is only man? Or if He does not speak falsely, He is not of this world; He is therefore not man only, because He is not of this world. But that it should not be a secret who He was, He declared whence He was: "I," said He, "am from above," that is, from heaven, whence man cannot come, for he was not made in heaven. He is God, therefore, who is from above, and therefore He is not of this world; although, moreover, in a certain manner He is of this world: wherefore Christ is not God only, but man also. As reasonably in the way in which He is not of this world according to the divinity of the Word, so He is of this world according to the frailty of the body that He has taken upon Him. For man is joined with God, and God is linked with man. But on that account this Christ here laid more stress on the one aspect of His sole divinity, because the Jewish blindness contemplated in Christ the aspect alone of the flesh; and thence in the present passage He passed over in silence the frailty of the body, which is of the world, and spoke of His divinity alone, which is not of the world: so that in proportion as they had inclined to believe Him to be only man, in that proportion Christ might draw them to consider His divinity, so as to believe Him to be God, desirous to overcome their incredulity concerning His divinity by omitting in the meantime any mention of His human condition, and by setting before them His divinity alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
