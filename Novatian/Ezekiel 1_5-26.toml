[[commentary]]
quote='''
Hence it is that He also sitteth above the Cherubim; that is, He presides over the variety of His works, the living creatures which hold the control over the rest being subjected to His throne: a crystal covering being thrown over all things; that is, the heaven covering all things, which at the command of God had been consolidated into a firmament from the fluent material of the waters, that the strong hardness that divides the midst of the waters that covered the earth before, might sustain as if on its back the weight of the superincumbent water, its strength being established by the frost. And, moreover, wheels lie below—that is to say, the seasons—whereby all the members of the world are always being rolled onwards; such feet being added by which those things do not stand still for ever, but pass onward. And, moreover, throughout all their limbs they are studded with eyes; for the works of God must be contemplated with an ever watchful inspection: in the heart of which things, a fire of embers is in the midst, either because this world of ours is hastening to the fiery day of judgment; or because all the works of God are fiery, and are not darksome, but flourish. Or, moreover, lest, because those things had arisen from earthly beginnings, they should naturally be inactive, from the rigidity of their origin, the hot nature of an interior spirit was added to all things; and that this nature concreted with the cold bodies might minister for the purpose of life equal measures for all. This, therefore, according to David, is God's chariot. "For the chariot of God," says he, "is multiplied ten thousand times;" that is, it is innumerable, infinite, immense. For, under the yoke of the natural law given to all things, some things are restrained, as if withheld by reins; others, as if stimulated, are urged on with relaxed reins. For the world, which is that chariot of God with all things, both the angels themselves and the stars guide; and their movements, although various, yet bound by certain laws, we watch them guiding by the bounds of a time prescribed to themselves; so that rightly we also are now disposed to exclaim with the apostle, as he admires both the Architect and His works: "Oh the depth of the riches of the wisdom and knowledge of God! how inscrutable are His judgments, and His ways past finding out!" And the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 8"
