[[commentary]]
quote='''
If Christ is only man, how does He say, "If any man shall keep my word, he shall not see death for ever?" Not to see death for ever! what is this but immortality? But immortality is the associate of divinity, because both the divinity is immortal, and immortality is the fruit of divinity. For every man is mortal; and immortality cannot be from that which is mortal. Therefore from Christ, as a mortal man, immortality cannot arise. "But," says He, "whosoever keepeth my word, shall not see death for ever;" therefore the word of Christ affords immortality, and by immortality affords divinity. But although it is not possible to maintain that one who is himself mortal can make another immortal, yet this word of Christ not only sets forth, but affords immortality: certainly He is not man only who gives immortality, which if He were only man He could not give; but by giving divinity by immortality, He proves Himself to be God by offering divinity, which if He were not God He could not give.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 15"
