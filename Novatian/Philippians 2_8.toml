[[commentary]]
quote='''
Moreover, the Son does nothing of His own will, nor does anything of His own determination; nor does He come from Himself, but obeys all His Father's commands and precepts; so that, although birth proves Him to be a Son, yet obedience even to death declares Him the minister of the will of His Father, of whom He is. Thus making Himself obedient to His Father in all things, although He also is God, yet He shows the one God the Father by His obedience, from whom also He drew His beginning. And thus He could not make two Gods, because He did not make two beginnings, seeing that from Him who has no beginning He received the source of His nativity before all time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 31"
