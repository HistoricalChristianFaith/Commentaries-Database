[[commentary]]
quote='''
He says by Habakkuk the prophet: "God shall come from the south, and the Holy One from the dark and dense mountain." Whom do they wish to represent as coming from the south? If they say that it is the Almighty God the Father, then God the Father comes from a place, from which place, moreover, He is thus excluded, and He is bounded within the straitnesses of some abode; and thus by such as these, as we have said, the sacrilegious heresy of Sabellius is embodied. Since Christ is believed to be not the Son, but the Father; since by them He is asserted to be in strictness a bare man, in a new manner, by those, again, Christ is proved to be God the Father Almighty. But if in Bethlehem, the region of which local division looks towards the southern portion of heaven, Christ is born, who by the Scriptures is also said to be God, this God is rightly described as coming from the south, because He was foreseen as about to come from Bethlehem. Let them, then, choose of the two alternatives, the one that they prefer, that He who came from the south is the Son, or the Father; for God is said to be about to come from the south. If the Son, why do they shrink from calling Him Christ and God? For the Scripture says that God shall come. If the Father, why do they shrink from being associated with the boldness of Sabellius, who says that Christ is the Father? unless because, whether they call Him Father or Son, from his heresy, however unwillingly, they must needs withdraw if they are accustomed to say that Christ is merely man; when compelled by the facts themselves, they are on the eve of exalting Him as God, whether in wishing to call Him Father or in wishing to call Him Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 12"
