[[commentary]]
quote='''
For all such fables as these are confuted as well by the nativity as by the death itself of our Lord. For John says: "The Word was made flesh, and dwelt among us;" so that, reasonably, our body should be in Him, because indeed the Word took on Him our flesh. And for this reason blood flowed forth from His hands and feet, and from His very side, so that He might be proved to be a sharer in our body by dying according to the laws of our dissolution. And that He was raised again in the same bodily substance in which He died, is proved by the wounds of that very body, and thus He showed the laws of our resurrection in His flesh, in that He restored the same body in His resurrection which He had from us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 10"

[[commentary]]
quote='''
And thus also John, describing the nativity of Christ, says: "The Word was made flesh, and dwelt among us, and we saw His glory, the glory as of the only begotten of the Father, full of grace and truth." For, moreover, "His name is called the Word of God," and not without reason. "My heart has emitted a good word;" which word He subsequently calls by the name of the King inferentially, "I will tell my works to the King." For "by Him were made all the works, and without Him was nothing made." "Whether," says the apostle, "they be thrones or dominations, or powers, or mights, visible things and invisible, all things subsist by Him." Moreover, this is that word which came unto His own, and His own received Him not. For the world was made by Him, and the world knew Him not." Moreover, this Word "was in the beginning with God, and God was the Word." Who then can doubt, when in the last clause it is said, "The Word was made flesh, and dwelt among us," that Christ, whose is the nativity, and because He was made flesh, is man; and because He is the Word of God, who can shrink from declaring without hesitation that He is God, especially when he considers the evangelical Scripture, that it has associated both of these substantial natures into one concord of the nativity of Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 13"
