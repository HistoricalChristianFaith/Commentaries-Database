[[commentary]]
quote='''
And thus He says, "I am that I am." For what He is has this name, because it always maintains the same quality of Himself. For change takes away the force of that name "That I Am;" for whatever, at any time, is changed, is shown to be mortal in that very particular which is changed. For it ceases to be that which it had been, and consequently begins to be what it was not; and therefore, reasonably, there remains always in God His position, in that without any loss arising from change, He is always like and equal to Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Novatian%2FA%2520Treatise%2520of%2520Novatian%2520Concerning%2520the%2520Trinity.html'
source_title="On the Trinity, Chapter 4"
