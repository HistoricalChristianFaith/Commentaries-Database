[[commentary]]
quote='''
And once again, the Gospel tells us that, He, having come into the place, said ‘I thirst’: and they gave Him some vinegar mixed with gall, and when He had tasted it He would not drink. If, then, on the one hand it was as God that He suffered thirst and when He had tasted would not drink, surely He must be subject to passion also as God, for thirst and taste are passions. But if it was not as God but altogether as man that He was athirst, likewise as man He must be endowed with volition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 14"
