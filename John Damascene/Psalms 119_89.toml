[[commentary]]
quote='''
But should the Jew refuse to accept the Word and the Spirit, let the divine Scripture confute him and curb his tongue. For concerning the Word, the divine David says, For ever, O Lord, Thy Word is settled in heaven. And again, He sent His Word and healed them. But the word that is uttered is not sent, nor is it for ever settled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25201.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 1, Chapter 7"
