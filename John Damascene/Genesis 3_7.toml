[[commentary]]
quote='''
The tree of knowledge was for trial, and proof, and exercise of man’s obedience and disobedience: and hence it was named the tree of the knowledge of good and evil, or else it was because to those who partook of it was given power to know their own nature. Now this is a good thing for those who are mature, but an evil thing for the immature and those whose appetites are too strong, being like solid food to tender babes still in need of milk. For our Creator, God, did not intend us to be burdened with care and troubled about many things, nor to take thought about, or make provision for, our own life. But this at length was Adam’s fate: for he tasted and knew that he was naked and made a girdle round about him: for he took fig-leaves and girded himself about. But before they took of the fruit, They were both naked, Adam and Eve, and were not ashamed. For God meant that we should be thus free from passion, and this is indeed the mark of a mind absolutely void of passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 11"

[[commentary]]
quote='''
Man, then, was thus snared by the assault of the arch-fiend, and broke his Creator’s command, and was stripped of grace and put off his confidence with God, and covered himself with the asperities of a toilsome life (for this is the meaning of the fig-leaves); and was clothed about with death, that is, mortality and the grossness of flesh (for this is what the garment of skins signifies); and was banished from Paradise by God’s just judgment, and condemned to death, and made subject to corruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 1"
