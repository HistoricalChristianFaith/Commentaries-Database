[[commentary]]
quote='''
It is one and the same God Whom both the Old and the New Testament proclaim, Who is praised and glorified in the Trinity: I am come, saith the Lord, not to destroy the law but to fulfil it. For He Himself worked out our salvation for which all Scripture and all mystery exists.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 17"
