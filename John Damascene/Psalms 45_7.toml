[[commentary]]
quote='''
Now we have often said already that essence is one thing and subsistence another, and that essence signifies the common and general form of subsistences of the same kind, such as God, man, while subsistence marks the individual, that is to say, Father, Son, Holy Spirit, or Peter, Paul. Observe, then, that the names, divinity and humanity, denote essences or natures: while the names, God and man, are applied both in connection with natures, as when we say that God is incomprehensible essence, and that God is one, and with reference to subsistences, that which is more specific having the name of the more general applied to it, as when the Scripture says, Therefore God, thy God, hath anointed thee, or again, There was a certain man in the land of Uz, for it was only to Job that reference was made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 4"

[[commentary]]
quote='''
The mind was not united with God the Word, as some falsely assert, before the Incarnation by the Virgin and from that time called Christ. That is the absurd nonsense of Origen who lays down the doctrine of the priority of the existence of souls. But we hold that the Son and Word of God became Christ after He had dwelt in the womb of His holy ever-virgin Mother, and became flesh without change, and that the flesh was anointed with divinity. For this is the anointing of humanity, as Gregory the Theologian says. And here are the words of the most holy Cyril of Alexandria which he wrote to the Emperor Theodosius: “For I indeed hold that one ought to give the name Jesus Christ neither to the Word that is of God if He is without humanity, nor yet to the temple born of woman if it is not united with the Word. For the Word that is of God is understood to be Christ when united with humanity in ineffable manner in the union of the œconomy.” And again, he writes to the Empresses thus: “Some hold that the name ‘Christ’ is rightly given to the Word that is begotten of God the Father, to Him alone, and regarded separately by Himself. But we have not been taught so to think and speak. For when the Word became flesh, then it was, we say, that He was called Christ Jesus. For since He was anointed with the oil of gladness, that is the Spirit, by Him Who is God and Father, He is for this reason called Christ. But that the anointing was an act that concerned Him as man could be doubted by no one who is accustomed to think rightly.” Moreover, the celebrated Athanasius says this in his discourse “Concerning the Saving Manifestation:” “The God Who was before the sojourn in the flesh was not man, but God in God, being invisible and without passion, but when He became man, He received in addition the name of Christ because of the flesh, since, indeed, passion and death follow in the train of this name.”

And although the holy Scripture says, Therefore God, thy God, hath anointed thee with the oil of gladness, it is to be observed that the holy Scripture often uses the past tense instead of the future, as for example here: Thereafter He was seen upon the earth and dwelt among men. For as yet God was not seen nor did He dwell among men when this was said. And here again: By the rivers of Babylon, there we sat down; yea we wept. For as yet these things had not come to pass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 6"

[[commentary]]
quote='''
Some, again, have a prophetic sense, and of these some are in the future tense: for instance, He shall come openly, and this from Zechariah, Behold, thy King cometh unto thee, and this from Micah, Behold, the Lord cometh out of His place and will come down and tread upon the high places of the earth. But others, though future, are put in the past tense, as, for instance, This is our God: Therefore He was seen upon the earth and dwelt among men, and The Lord created me in the beginning of His ways for His works, and Wherefore God, thy God, anointed thee with the oil of gladness above thy fellows, and such like.

The things said, then, that refer to the period before the union will be applicable to Him even after the union: but those that refer to the period after the union will not be applicable at all before the union, unless indeed in a prophetic sense, as we said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
