[[commentary]]
quote='''
And let us not be satisfied with arriving speedily at the gate, but rather let us knock hard, so that the door of the bridal chamber may be opened to us and we may behold the beauties within. Now, the gate is the letter, but the bridal chamber within the gate is the beauty of the thoughts hidden behind the letter, which is to say, the Spirit of truth. Let us knock hard, let us read once, twice, many times. By thus digging through we shall find the treasure of knowledge and take delight in the wealth of it. Let us seek, let us search, let us examine, let us inquire. ‘For every one that asketh, receiveth: and he that seeketh, findeth: and to him that knocketh, it shall be opened;’ and ‘Ask thy father, and he will declare to thee: thy elders in knowledge and they will tell thee.’ If, then, we are lovers of learning, we shall learn much, for it is of the nature of all things that they may be apprehended through industry and toil, and before all and after all by the grace of God, the Giver of grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FThe%2520Philosophical%2520Chapters.html'
source_title="The Philosophical Chapters, Chapter 1"
