[[commentary]]
quote='''
These are the things which the spiritual law of Christ enjoins on us and those who observe that become superior to the law of Moses. For when that which is perfect is come, then that which is in part shall be done away: and when the covering of the law, that is, the veil, is rent asunder through the crucifixion of the Saviour, and the Spirit shines forth with tongues of fire, the letter shall be done away with, bodily things shall come to an end, the law of servitude shall be fulfilled, and the law of liberty be bestowed on us. Yea we shall celebrate the perfect rest of human nature, I mean the day after the resurrection, on which the Lord Jesus, the Author of Life and our Saviour, shall lead us into the heritage promised to those who serve God in the spirit, a heritage into which He entered Himself as our forerunner after He rose from the dead, and whereon, the gates of Heaven being opened to Him, He took His seat in bodily form at the right hand of the Father, where those who keep the spiritual law shall also come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 23"
