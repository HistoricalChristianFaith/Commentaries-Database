[[commentary]]
quote='''
This bread is the first-fruits of the future bread which is ἐπιούσιος, i.e. necessary for existence. For the word ἐπιούσιον signifies either the future, that is Him Who is for a future age, or else Him of Whom we partake for the preservation of our essence. Whether then it is in this sense or that, it is fitting to speak so of the Lord’s body. For the Lord’s flesh is life-giving spirit because it was conceived of the life-giving Spirit. For what is born of the Spirit is spirit. But I do not say this to take away the nature of the body, but I wish to make clear its life-giving and divine power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 13"
