[[commentary]]
quote='''
Further, some hold that the earth is in the form of a sphere, others that it is in that of a cone. At all events it is much smaller than the heaven, and suspended almost like a point in its midst. And it will pass away and be changed. But blessed is the man who inherits the earth promised to the meek.

For the earth that is to be the possession of the holy is immortal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 10"
