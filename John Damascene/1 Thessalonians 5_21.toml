[[commentary]]
quote='''
Furthermore, since the divine Apostle says: ‘But prove all things: hold fast that which is good,’ let us also find something in them worth carrying away and reap some fruit that will be of profit to our soul. For every craftsman has need, also, of certain things for the prosecution of his works, and it is also fitting for the queen to be waited upon by certain handmaidens. So let us receive such sayings as serve the truth, while we reject the impiety which exercised an evil tyranny over them. And let us not belittle that which is good. Nor let us use the art of rhetoric for the deception of simpler folk. On the other hand, although the truth stands in no need of the service of subtle reasonings, let us definitely use them to overthrow both those who fight dishonestly and that which is falsely called knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FThe%2520Philosophical%2520Chapters.html'
source_title="The Philosophical Chapters, Chapter 1"
