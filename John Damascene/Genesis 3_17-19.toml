[[commentary]]
quote='''
Moreover, the earth of its own accord used to yield fruits, for the benefit of the animals that were obedient to man, and there was neither rain nor tempest on the earth. But after the transgression, when he was compared with the unintelligent cattle and became like to them, after he had contrived that in him irrational desire should have rule over reasoning mind and had become disobedient to the Master’s command, the subject creation rose up against him whom the Creator had appointed to be ruler: and it was appointed for him that he should till with sweat the earth from which he had been taken.

But even now wild beasts are not without their uses, for, by the terror they cause, they bring man to the knowledge of his Creator and lead him to call upon His name. And, further, at the transgression the thorn sprung out of the earth in accordance with the Lord’s express declaration and was conjoined with the pleasures of the rose, that it might lead us to remember the transgression on account of which the earth was condemned to bring forth for us thorns and prickles.

That this is the case is made worthy of belief from the fact that their endurance is secured by the word of the Lord, saying, Be fruitful and multiply, and replenish the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 10"
