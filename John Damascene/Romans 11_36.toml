[[commentary]]
quote='''
For, indeed, we apply all the divine names simply and unconditionally to each of the subsistences in imitation of the divine Apostle’s words. But to us there is but one God, the Father, of Whom are all things, and we in Him: and one Lord Jesus Christ by Whom are all things, and we by Him. And, nevertheless, we follow Gregory the Theologian when he says, “But to us there is but one God, the Father, of Whom are all things, and one Lord Jesus Christ, through Whom are all things, and one Holy Spirit, in Whom are all things:” for the words “of Whom” and “through Whom” and “in Whom” do not divide the natures (for neither the prepositions nor the order of the names could ever be changed), but they characterise the properties of one unconfused nature. And this becomes clear from the fact that they are once more gathered into one, if only one reads with care these words of the same Apostle, Of Him and through Him and in Him are all things: to Him be the glory for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 10"


[[commentary]]
quote='''
God Who is good and altogether good and more than good, Who is goodness throughout, by reason of the exceeding riches of His goodness did not suffer Himself, that is His nature, only to be good, with no other to participate therein, but because of this He made first the spiritual and heavenly powers: next the visible and sensible universe: next man with his spiritual and sentient nature. All things, therefore, which he made, share in His goodness in respect of their existence. For He Himself is existence to all, since all things that are, are in Him, not only because it was He that brought them out of nothing into being, but because His energy preserves and maintains all that He made: and in especial the living creatures. For both in that they exist and in that they enjoy life they share in His goodness. But in truth those of them that have reason have a still greater share in that, both because of what has been already said and also because of the very reason which they possess. For they are somehow more clearly akin to Him, even though He is incomparably higher than they.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 13"
