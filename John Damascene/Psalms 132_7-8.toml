[[commentary]]
quote='''
So, then, this same truly precious and august tree, on which Christ hath offered Himself as a sacrifice for our sakes, is to be worshipped as sanctified by contact with His holy body and blood; likewise the nails, the spear, the clothes, His sacred tabernacles which are the manger, the cave, Golgotha, which bringeth salvation, the tomb which giveth life, Sion, the chief stronghold of the churches and the like, are to be worshipped. In the words of David, the father of God, We shall go into His tabernacles, we shall worship at the place where His feet stood. And that it is the Cross that is meant is made clear by what follows, Arise, O Lord, into Thy Rest. For the resurrection comes after the Cross. For if of those things which we love, house and couch and garment, are to be longed after, how much the rather should we long after that which belonged to God, our Saviour, by means of which we are in truth saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
