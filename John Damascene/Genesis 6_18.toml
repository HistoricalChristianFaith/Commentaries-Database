[[commentary]]
quote='''
Noah when he was commanded to enter the ark and was entrusted with the preservation of the seed of the world received this command, Go in, saith the Lord, thou and thy sons, and thy wife, and thy sons’ wives. He separated them from their wives in order that with purity they might escape the flood and that shipwreck of the whole world. After the cessation of the flood, however, He said, Go forth of the ark, thou and thy sons, and thy wife, and thy sons’ wives. Lo, again, marriage is granted for the sake of the multiplication of the race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 24"
