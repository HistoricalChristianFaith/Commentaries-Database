[[commentary]]
quote='''
And we confess also that there is one incarnate nature of God the Word, expressing by the word “incarnate” the essence of the flesh, according to the blessed Cyril. And so the Word was made flesh and yet did not abandon His own proper immateriality: He became wholly flesh and yet remained wholly uncircumscribed. So far as He is body He is diminished and contracted into narrow limits, but inasmuch as He is God He is uncircumscribed, His flesh not being coextensive with His uncircumscribed divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 7"

[[commentary]]
quote='''
God the Word Incarnate, therefore, did not assume the nature that is regarded as an abstraction in pure thought (for this is not incarnation, but only an imposture and a figment of incarnation), nor the nature viewed in species (for He did not assume all the subsistences): but the nature viewed in the individual, which is identical with that viewed in species. For He took on Himself the elements of our compound nature, and these not as having an independent existence or as being originally an individual, and in this way assumed by Him, but as existing in His own subsistence. For the subsistence of God the Word in itself became the subsistence of the flesh, and accordingly “the Word became flesh” clearly without any change, and likewise the flesh became Word without alteration, and God became man. For the Word is God, and man is God, through having one and the same subsistence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 11"

[[commentary]]
quote='''
It has been said, then, that the nature of the Word became flesh, that is, was united to flesh: but that the nature of the Word suffered in the flesh we have never heard up till now, though we have been taught that Christ suffered in the flesh. So that “the nature of the Word” does not mean “the subsistence.” It remains, therefore, to say that to become flesh is to be united with the flesh, while the Word having become flesh means that the very subsistence of the Word became without change the subsistence of the flesh. It has also been said that God became man, and man God. For the Word which is God became without alteration man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 11"

[[commentary]]
quote='''
But if the Evangelist said that the Word was made flesh, note that in the Holy Scripture sometimes a man is spoken of as a soul, as, for example, with seventy-five souls came Jacob into Egypt: and sometimes a man is spoken of as flesh, as, for example, All flesh shall see the salvation of God. And accordingly the Lord did not become flesh without soul or mind, but man. He says, indeed, Himself, Why seek ye to kill Me, a Man that hath told you the truth? He, therefore, assumed flesh animated with the spirit of reason and mind, a spirit that holds sway over the flesh but is itself under the dominion of the divinity of the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 18"
