[[commentary]]
quote='''
In the beginning, indeed, the water lay all over the surface of the earth. And first God created the firmament to divide the water above the firmament from the water below the firmament. For in the midst of the sea of waters the firmament was established at the Master’s decree. And out of it God bade the firmament arise, and it arose. Now for what reason was it that God placed water above the firmament? It was because of the intense burning heat of the sun and ether. For immediately under the firmament is spread out the ether, and the sun and moon and stars are in the firmament, and so if water had not been put above it the firmament would have been consumed by the heat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"
