[[commentary]]
quote='''
May those who happen upon this work have it as their purpose to bring their mind safely through to the final blessed end—which means to be guided by their sense perceptions up to that which is beyond all sense perception and comprehension, which is He who is the Author and Maker and Creator of all. ‘For by the beauty of his own creatures the creator is by analogy discovered,’ and ‘the invisible things of him from the creation of the world are clearly seen, being understood by the things that are made.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FThe%2520Philosophical%2520Chapters.html'
source_title="The Philosophical Chapters, Chapter 1"
