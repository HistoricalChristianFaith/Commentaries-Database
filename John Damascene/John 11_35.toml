[[commentary]]
quote='''
But, as the blessed Cyril says, no one in his senses could admit that there was but one natural energy of God and His creation. It is not His human nature that raises up Lazarus from the dead, nor is it His divine power that sheds tears: for the shedding of tears is peculiar to human nature while the life is peculiar to the enhypostatic life. But yet they are common the one to the other, because of the identity in subsistence. For Christ is one, and one also is His person or subsistence, but yet He has two natures, one belonging to His humanity, and another belonging to His divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 15"
