[[commentary]]
quote='''
Others are of the nature of ascription, as Christ’s question, Where have ye laid Lazarus? His running to the fig-tree, His shrinking, that is, His drawing back, His praying, and His making as though He would have gone further For neither as God nor as man was He in need of these or similar things, but only because His form was that of a man as necessity and expediency demanded. For example, the praying was to shew that He is not opposed to God, for He gives honour to the Father as the cause of Himself: and the question was not put in ignorance but to shew that He is in truth man as well as God; and the drawing back is to teach us not to be impetuous nor to give ourselves up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
