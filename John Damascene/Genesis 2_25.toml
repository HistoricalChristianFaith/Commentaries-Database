[[commentary]]
quote='''
The tree of knowledge was for trial, and proof, and exercise of man’s obedience and disobedience: and hence it was named the tree of the knowledge of good and evil, or else it was because to those who partook of it was given power to know their own nature. Now this is a good thing for those who are mature, but an evil thing for the immature and those whose appetites are too strong, being like solid food to tender babes still in need of milk. For our Creator, God, did not intend us to be burdened with care and troubled about many things, nor to take thought about, or make provision for, our own life. But this at length was Adam’s fate: for he tasted and knew that he was naked and made a girdle round about him: for he took fig-leaves and girded himself about. But before they took of the fruit, They were both naked, Adam and Eve, and were not ashamed. For God meant that we should be thus free from passion, and this is indeed the mark of a mind absolutely void of passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 11"

[[commentary]]
quote='''
Carnal men abuse virginity, and the pleasure-loving bring forward the following verse in proof, Cursed be every one that raiseth not up seed in Israel. But we, made confident by God the Word that was made flesh of the Virgin, answer that virginity was implanted in man’s nature from above and in the beginning. For man was formed of virgin soil. From Adam alone was Eve created. In Paradise virginity held sway. Indeed, Divine Scripture tells that both Adam and Eve were naked and were not ashamed. But after their transgression they knew that they were naked, and in their shame they sewed aprons for themselves. And when, after the transgression, Adam heard, dust thou art and unto dust shalt thou return, when death entered into the world by reason of the transgression, then Adam knew Eve his wife, and she conceived and bare seed. So that to prevent the wearing out and destruction of the race by death, marriage was devised that the race of men may be preserved through the procreation of children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 24"
