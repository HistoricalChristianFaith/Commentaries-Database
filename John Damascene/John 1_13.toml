[[commentary]]
quote='''
But when the fulness of time was come, the messenger of the Lord was sent to her, with the good news of our Lord’s conception. And thus she conceived the Son of God, the hypostatic power of the Father, not of the will of the flesh nor of the will of man, that is to say, by connection and seed, but by the good pleasure of the Father and co-operation of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 14"
