[[commentary]]
quote='''
Yea, He meant us further to be free from care and to have but one work to perform, to sing as do the angels, without ceasing or intermission, the praises of the Creator, and to delight in contemplation of Him and to cast all our care on Him. This is what the Prophet David proclaimed to us when He said, Cast thy burden on the Lord, and He will sustain thee. And, again, in the Gospels, Christ taught His disciples saying, Take no thought for your life what ye shall eat, nor for your body what ye shall put on. And further, Seek ye first the Kingdom of God and His righteousness and all these things shall be added unto you. And to Martha He said, Martha, Martha, thou art careful and troubled about many things: but one thing is needful: and Mary hath chosen that good part, which shall not be taken away from her, meaning, clearly, sitting at His feet and listening to His words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 11"
