[[commentary]]
quote='''
Moreover, His ascent from earth to heaven, and again, His descent from heaven to earth, are manifestations of the energies of His circumscribed body. For He shall so come again to you, saith he, in like manner as ye have seen Him go into Heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 1"

[[commentary]]
quote='''
And when He was received again into Heaven He was borne towards the East, and thus His apostles worship Him, and thus He will come again in the way in which they beheld Him going towards Heaven; as the Lord Himself said, As the lightning cometh out of the East and shineth even unto the West, so also shall the coming of the Son of Man be.

So, then, in expectation of His coming we worship towards the East.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 12"

[[commentary]]
quote='''
And the Lord shall come out of heaven, just as the holy apostles beheld Him going into heaven, perfect God and perfect man, with glory and power, and will destroy the man of lawlessness, the son of destruction, with the breath of His mouth. Let no one, therefore, look for the Lord to come from earth, but out of Heaven, as He himself has made sure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 26"
