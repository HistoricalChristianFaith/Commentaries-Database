[[commentary]]
quote='''
Since, therefore, the Scripture speaks of heaven, and heaven of heaven, and heavens of heavens, and the blessed Paul says that he was snatched away to the third heaven, we say that in the cosmogony of the universe we accept the creation of a heaven which the foreign philosophers, appropriating the views of Moses, call a starless sphere. But further, God called the firmament also heaven, which He commanded to be in the midst of the waters, setting it to divide the waters that are above the firmament from the waters that are below the firmament. And its nature, according to the divine Basilius, who is versed in the mysteries of divine Scripture, is delicate as smoke. Others, however, hold that it is watery in nature, since it is set in the midst of the waters: others say it is composed of the four elements: and lastly, others speak of it as a fifth body, distinct from the four elements.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 6"
