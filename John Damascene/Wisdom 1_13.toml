[[commentary]]
quote='''
Of things that are not in our hands some have their beginning or cause in those that are in our power, that is to say, the recompenses of our actions both in the present and in the age to come, but all the rest are dependent on the divine will. For the origin of all things is from God, but their destruction has been introduced by our wickedness for our punishment or benefit. For God did not create death, neither does He take delight in the destruction of living things. But death is the work rather of man, that is, its origin is in Adam’s transgression, in like manner as all other punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 28"
