[[commentary]]
quote='''
This also should be recognised, that it is usual in the Scriptures for some things that ought to be considered as effects to be stated in a causal sense, as, Against Thee, Thee only, have I sinned and done this evil in Thy sight, that Thou mightest be justified when Thou speakest, and prevail when Thou judgest. For the sinner did not sin in order that God might prevail, nor again did God require our sin in order that He might by it be revealed as victor. For above comparison He wins the victor’s prize against all, even against those who are sinless, being Maker, incomprehensible, uncreated, and possessing natural and not adventitious glory. But it is because when we sin God is not unjust in His anger against us; and when He pardons the penitent He is shewn victor over our wickedness. But it is not for this that we sin, but because the thing so turns out. It is just as if one were sitting at work and a friend stood near by, and one said, My friend came in order that I might do no work that day. The friend, however, was not present in order that the man should do no work, but such was the result. For being occupied with receiving his friend he did not work. These things, too, are spoken of as effects because affairs so turned out. Moreover, God does not wish that He alone should be just, but that all should, so far as possible, be made like unto Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 19"
