[[commentary]]
quote='''
The fourth was that of John, being preliminary and leading those who were baptized to repentance, that they might believe in Christ: I, indeed, he said, baptize you with water; but He that cometh after me, He will baptize you in the Holy Spirit and in fire. Thus John’s purification with water was preliminary to receiving the Spirit. The fifth was the baptism of our Lord, whereby He Himself was baptized. Now He is baptized not as Himself requiring purification but as making my purification His own, that He may break the heads of the dragons on the water, that He may wash away sin and bury all the old Adam in water, that He may sanctify the Baptist, that He may fulfil the Law, that He may reveal the mystery of the Trinity, that He may become the type and ensample to us of baptism. But we, too, are baptized in the perfect baptism of our Lord, the baptism by water and the Spirit. Moreover, Christ is said to baptize with fire: because in the form of flaming tongues He poured forth on His holy disciples the grace of the Spirit: as the Lord Himself says, John truly baptized with water: but ye shall be baptized with the Holy Spirit and with fire, not many days hence: or else it is because of the baptism of future fire wherewith we are to be chastized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
