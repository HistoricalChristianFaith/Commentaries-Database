[[commentary]]
quote='''
The envy of the devil then was the reason of man’s fall. For that same demon, so full of envy and with such a hatred of good, would not suffer us to enjoy the pleasures of heaven, when he himself was kept below on account of his arrogance, and hence the false one tempts miserable man with the hope of Godhead, and leading him up to as great a height of arrogance as himself, he hurls him down into a pit of destruction just as deep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 30"
