[[commentary]]
quote='''
Moreover, the Word appropriates to Himself the attributes of humanity: for all that pertains to His holy flesh is His: and He imparts to the flesh His own attributes by way of communication in virtue of the interpenetration of the parts one with another, and the oneness according to subsistence, and inasmuch as He Who lived and acted both as God and as man, taking to Himself either form and holding intercourse with the other form, was one and the same. Hence it is that the Lord of Glory is said to have been crucified, although His divine nature never endured the Cross, and that the Son of Man is allowed to have been in heaven before the Passion, as the Lord Himself said. For the Lord of Glory is one and the same with Him Who is in nature and in truth the Son of Man, that is, Who became man, and both His wonders and His sufferings are known to us, although His wonders were worked in His divine capacity, and His sufferings endured as man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 3"

[[commentary]]
quote='''
When, then, we speak of His divinity we do not ascribe to it the properties of humanity. For we do not say that His divinity is subject to passion or created. Nor, again, do we predicate of His flesh or of His humanity the properties of divinity: for we do not say that His flesh or His humanity is uncreated. But when we speak of His subsistence, whether we give it a name implying both natures, or one that refers to only one of them, we still attribute to it the properties of both natures. For Christ, which name implies both natures, is spoken of as at once God and man, created and uncreated, subject to suffering and incapable of suffering: and when He is named Son of God and God, in reference to only one of His natures, He still keeps the properties of the co-existing nature, that is, the flesh, being spoken of as God who suffers, and as the Lord of Glory crucified, not in respect of His being God but in respect of His being at the same time man. Likewise also when He is called Man and Son of Man, He still keeps the properties and glories of the divine nature, a child before the ages, and man who knew no beginning; it is not, however, as child or man but as God that He is before the ages, and became a child in the end. And this is the manner of the mutual communication, either nature giving in exchange to the other its own properties through the identity of the subsistence and the interpenetration of the parts with one another. Accordingly we can say of Christ: This our God was seen upon the earth and lived amongst men, and This man is uncreated and impassible and uncircumscribed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 4"
