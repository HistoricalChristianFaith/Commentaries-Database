[[commentary]]
quote='''
Moreover, the blessed Paul the Apostle says, He became obedient unto death, even the death of the cross. But obedience is subjection of the real will, not of the unreal will. For that which is irrational is not said to be obedient or disobedient. But the Lord having become obedient to the Father, became so not as God but as man. For as God He is not said to be obedient or disobedient. For these things are of the things that are under one’s hand, as the inspired Gregorius said. Wherefore, then, Christ is endowed with volition as man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 14"
