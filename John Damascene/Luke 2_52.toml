[[commentary]]
quote='''
He is, moreover, said to grow in wisdom and age and grace, increasing in age indeed and through the increase in age manifesting the wisdom that is in Him; yea, further, making men’s progress in wisdom and grace, and the fulfilment of the Father’s goodwill, that is to say, men’s knowledge of God and men’s salvation, His own increase, and everywhere taking as His own that which is ours. But those who hold that He progressed in wisdom and grace in the sense of receiving some addition to these attributes, do not say that the union took place at the first origin of the flesh, nor yet do they give precedence to the union in subsistence, but giving heed to the foolish Nestorius they imagine some strange relative union and mere indwelling, understanding neither what they say nor whereof they affirm. For if in truth the flesh was united with God the Word from its first origin, or rather if it existed in Him and was identical in subsistence with Him, how was it that it was not endowed completely with all wisdom and grace? not that it might itself participate in the grace, nor share by grace in what belonged to the Word, but rather by reason of the union in subsistence, since both what is human and what is divine belong to the one Christ, and that He Who was Himself at once God and man should pour forth like a fountain over the universe His grace and wisdom and plenitude of every blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 22"
