[[commentary]]
quote='''
God, then, being immaterial and uncircumscribed, has not place. For He is His own place, filling all things and being above all things, and Himself maintaining all things. Yet we speak of God having place and the place of God where His energy becomes manifest. For He penetrates everything without mixing with it, and imparts to all His energy in proportion to the fitness and receptive power of each: and by this I mean, a purity both natural and voluntary. For the immaterial is purer than the material, and that which is virtuous than that which is linked with vice. Wherefore by the place of God is meant that which has a greater share in His energy and grace. For this reason the Heaven is His throne. For in it are the angels who do His will and are always glorifying Him. For this is His rest and the earth is His footstool. For in it He dwelt in the flesh among men. And His sacred flesh has been named the foot of God. The Church, too, is spoken of as the place of God: for we have set this apart for the glorifying of God as a sort of consecrated place wherein we also hold converse with Him. Likewise also the places in which His energy becomes manifest to us, whether through the flesh or apart from flesh, are spoken of as the places of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25201.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 1, Chapter 13"
