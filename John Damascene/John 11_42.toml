[[commentary]]
quote='''
Moreover, other things are said as though the Father’s good-will was fulfilled through His energy, and not as through an instrument or a servant, but as through His essential and hypostatic Word and Wisdom and Power, because but one action is observed in Father and Son, as for example, All things were made by Him, and He sent His Word and healed them, and That they may believe that Thou hast sent Me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
