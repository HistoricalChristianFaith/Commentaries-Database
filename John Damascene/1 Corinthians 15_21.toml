[[commentary]]
quote='''
For if the body had come down from heaven and had not partaken of our nature, what would have been the use of His becoming man? For the purpose of God the Word becoming man was that the very same nature, which had sinned and fallen and become corrupted, should triumph over the deceiving tyrant and so be freed from corruption, just as the divine apostle puts it, For since by man came death, by man came also the resurrection of the dead. If the first is true the second must also be true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 12"
