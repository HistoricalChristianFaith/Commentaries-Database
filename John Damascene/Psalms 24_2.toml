[[commentary]]
quote='''
The earth is one of the four elements, dry, cold, heavy, motionless, brought into being by God, out of nothing on the first day. For in the beginning, he said, God created the heaven and the earth: but the seat and foundation of the earth no man has been able to declare. Some, indeed, hold that its seat is the waters: thus the divine David says, To Him Who established the earth on the waters. Others place it in the air. Again some other says, He Who hangeth the earth on nothing. And, again, David, the singer of God, says, as though the representative of God, I bear up the pillars of it, meaning by “pillars” the force that sustains it. Further, the expression, He hath founded it upon the seas, shews clearly that the earth is on all hands surrounded with water. But whether we grant that it is established on itself, or on air or on water, or on nothing, we must not turn aside from reverent thought, but must admit that all things are sustained and preserved by the power of the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 10"
