[[commentary]]
quote='''
All Scripture, then, is given by inspiration of God and is also assuredly profitable. Wherefore to search the Scriptures is a work most fair and most profitable for souls. For just as the tree planted by the channels of waters, so also the soul watered by the divine Scripture is enriched and gives fruit in its season, viz. orthodox belief, and is adorned with evergreen leafage, I mean, actions pleasing to God. For through the Holy Scriptures we are trained to action that is pleasing to God, and untroubled contemplation. For in these we find both exhortation to every virtue and dissuasion from every vice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 17"
