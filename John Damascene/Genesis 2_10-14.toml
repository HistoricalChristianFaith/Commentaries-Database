[[commentary]]
quote='''
The ocean, then, is like a river encircling the whole earth, and I think it is concerning it that the divine Scripture says, A river went out of Paradise. The water of the ocean is sweet and potable. It is it that furnishes the seas with water which, because it stays a long time in the seas and stands unmoved, becomes bitter: for the sun and the waterspouts draw up always the finer parts. Thus it is that clouds are formed and showers take place, because the filtration makes the water sweet.

This is parted into four first divisions, that is to say, into four rivers. The name of the first is Pheison, which is the Indian Ganges; the name of the second is Geon, which is the Nile flowing from Ethiopia down to Egypt: the name of the third is Tigris, and the name of the fourth is Euphrates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"
