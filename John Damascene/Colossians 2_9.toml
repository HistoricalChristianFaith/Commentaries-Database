[[commentary]]
quote='''
Thus, therefore, we confess that the nature of the Godhead is wholly and perfectly in each of its subsistences, wholly in the Father, wholly in the Son, and wholly in the Holy Spirit. Wherefore also the Father is perfect God, the Son is perfect God, and the Holy Spirit is perfect God. In like manner, too, in the Incarnation of the Trinity of the One God the Word of the Holy Trinity, we hold that in one of its subsistences the nature of the Godhead is wholly and perfectly united with the whole nature of humanity, and not part united to part. The divine Apostle in truth says that in Him dwelleth all the fulness of the Godhead bodily, that is to say in His flesh. And His divinely-inspired disciple, Dionysius, who had so deep a knowledge of things divine, said that the Godhead as a whole had fellowship with us in one of its own subsistences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 6"
