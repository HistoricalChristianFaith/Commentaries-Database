[[commentary]]
quote='''
The second name of God is ὁ Θεός, derived from θέειν, to run, because He courses through all things, or from αἴθειν, to burn: For God is a fire consuming all evil: or from θεᾶσθαι, because He is all-seeing: for nothing can escape Him, and over all He keepeth watch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25201.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 1, Chapter 9"
