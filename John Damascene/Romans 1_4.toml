[[commentary]]
quote='''
Others again are for the purpose of revealing Him to us and strengthening our faith, as, And now, O Father, glorify Thou Me with the glory which I had with Thee, before the world was. For He Himself was glorified and is glorified, but His glory was not manifested nor confirmed to us. Also that which the apostle said, Declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead. For by the miracles and the resurrection and the coming of the Holy Spirit it was manifested and confirmed to the world that He is the Son of God. And this too, The Child grew in wisdom and grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
