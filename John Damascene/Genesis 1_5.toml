[[commentary]]
quote='''
And God called the light day, but the darkness He called night. Further, darkness is not any essence, but an accident: for it is simply absence of light. The air, indeed, has not light in its essence. It was, then, this very absence of light from the air that God called darkness: and it is not the essence of air that is darkness, but the absence of light which clearly is rather an accident than an essence. And, indeed, it was not night, but day, that was first named, so that day is first and after that comes night. Night, therefore, follows day. And from the beginning of day till the next day is one complete period of day and night. For the Scripture says, And the evening and the morning were one day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 7"
