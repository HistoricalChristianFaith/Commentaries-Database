[[commentary]]
quote='''
But those who were not baptized into the Holy Trinity, these must be baptized again. For although the divine Apostle says: Into Christ and into His death were we baptized, he does not mean that the invocation of baptism must be in these words, but that baptism is an image of the death of Christ. For by the three immersions, baptism signifies the three days of our Lord’s entombment. The baptism then into Christ means that believers are baptized into Him. We could not believe in Christ if we were not taught confession in Father, Son, and Holy Spirit. For Christ is the Son of the Living God, Whom the Father anointed with the Holy Spirit: in the words of the divine David, Therefore God, thy God, hath anointed thee with the oil of gladness above thy fellows. And Isaiah also speaking in the person of the Lord says, The Spirit of the Lord is upon me because He hath anointed me. Christ, however, taught His own disciples the invocation and said, Baptizing them in the Name of the Father, and of the Son, and of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"

[[commentary]]
quote='''
For by the Cross all things have been made right. So many of us, the apostle says, as were baptized into Christ, were baptized into His death, and as many of you as have been baptized into Christ, have put on Christ. Further Christ is the power of God and the wisdom of God. Lo! the death of Christ, that is, the Cross, clothed us with the enhypostatic wisdom and power of God. And the power of God is the Word of the Cross, either because God’s might, that is, the victory over death, has been revealed to us by it, or because, just as the four extremities of the Cross are held fast and bound together by the bolt in the middle, so also by God’s power the height and the depth, the length and the breadth, that is, every creature visible and invisible, is maintained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
