[[commentary]]
quote='''
It does not derive its light from itself, but is illuminated by sun, and moon, and stars, and fire. And this is just what the Scripture means when it says, And darkness was upon the deep; for its object is to shew that the air has not derived its light from itself, but that it is quite a different essence from light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 8"

[[commentary]]
quote='''
Water also is one of the four elements, the most beautiful of God’s creations. It is both wet and cold, heavy, and with a tendency to descend, and flows with great readiness. It is this the Holy Scripture has in view when it says, And darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters. For the deep is nothing else than a huge quantity of water whose limit man cannot comprehend. In the beginning, indeed, the water lay all over the surface of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"

[[commentary]]
quote='''
God, then, bade the first water produce living breath, since it was to be by water and the Holy Spirit that moved upon the waters in the beginning, that man was to be renewed. For this is what the divine Basilius said: Therefore it produced living creatures, small and big; whales and dragons, fish that swim in the waters, and feathered fowl. The birds form a link between water and earth and air: for they have their origin in the water, they live on the earth and they fly in the air. Water, then, is the most beautiful element and rich in usefulness, and purifies from all filth, and not only from the filth of the body but from that of the soul, if it should have received the grace of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"

[[commentary]]
quote='''
In the beginning, then, as the Holy Scripture says, it was hidden beneath the waters, and was unwrought, that is to say, not beautified. But at God’s bidding, places to hold the waters appeared, and then the mountains came into existence, and at the divine command the earth received its own proper adornment, and was dressed in all manner of herbs and plants, and on these, by the divine decree, was bestowed the power of growth and nourishment, and of producing seed to generate their like.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 10"

[[commentary]]
quote='''
And He laid on us the command to be born again of water and of the Spirit, through prayer and invocation, the Holy Spirit drawing nigh unto the water. For since man’s nature is twofold, consisting of soul and body, He bestowed on us a twofold purification, of water and of the Spirit: the Spirit renewing that part in us which is after His image and likeness, and the water by the grace of the Spirit cleansing the body from sin and delivering it from corruption, the water indeed expressing the image of death, but the Spirit affording the earnest of life.

For from the beginning the Spirit of God moved upon the face of the waters, and anew the Scripture witnesseth that water has the power of purification. In the time of Noah God washed away the sin of the world by water. By water every impure person is purified, according to the law, even the very garments being washed with water. Elias shewed forth the grace of the Spirit mingled with the water when he burned the holocaust by pouring on water. And almost everything is purified by water according to the law: for the things of sight are symbols of the things of thought. The regeneration, however, takes place in the spirit: for faith has the power of making us sons (of God), creatures as we are, by the Spirit, and of leading us into our original blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
