[[commentary]]
quote='''
For by the good pleasure of our God and Father, the Only-begotten Son and Word of God and God, Who is in the bosom of the God and Father, of like essence with the Father and the Holy Spirit, Who was before the ages, Who is without beginning and was in the beginning, Who is in the presence of the God and Father, and is God and made in the form of God, bent the heavens and descended to earth: that is to say, He humbled without humiliation His lofty station which yet could not be humbled, and condescends to His servants, with a condescension ineffable and incomprehensible: (for that is what the descent signifies).
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 1"
