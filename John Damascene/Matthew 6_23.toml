[[commentary]]
quote='''
Let us approach with attention and in all sincerity and proceed without letting the spiritual eye of our soul be dulled by passions, for even the clearest and most limpid eye will hardly enable one to gain a clear view of the truth. ‘If then the light that is in us (that is to say, the mind) be darkness: the darkness itself how great shall it be!’ With our whole soul and our whole understanding let us approach. And since it is impossible for the eye that is constantly shifting and turning about clearly to perceive the visible object, because for clear vision the eye must be steadily focused upon the object observed, let us put aside every anxiety of the mind and approach the truth unhampered by material considerations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FThe%2520Philosophical%2520Chapters.html'
source_title="The Philosophical Chapters, Chapter 1"
