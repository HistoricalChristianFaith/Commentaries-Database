[[commentary]]
quote='''
Now when God was about to fashion man out of the visible and invisible creation in His own image and likeness to reign as king and ruler over all the earth and all that it contains, He first made for him, so to speak, a kingdom in which he should live a life of happiness and prosperity. And this is the divine paradise, planted in Eden by the hands of God, a very storehouse of joy and gladness of heart (for “Eden” means luxuriousness). Its site is higher in the East than all the earth: it is temperate and the air that surrounds it is the rarest and purest: evergreen plants are its pride, sweet fragrances abound, it is flooded with light, and in sensuous freshness and beauty it transcends imagination: in truth the place is divine, a meet home for him who was created in God’s image: no creature lacking reason made its dwelling there but man alone, the work of God’s own hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 11"

[[commentary]]
quote='''
Since, therefore, God is spiritual light, and Christ is called in the Scriptures Sun of Righteousness and Dayspring, the East is the direction that must be assigned to His worship. For everything good must be assigned to Him from Whom every good thing arises. Indeed the divine David also says, Sing unto God, ye kingdoms of the earth: O sing praises unto the Lord: to Him that rideth upon the Heavens of heavens towards the East. Moreover the Scripture also says, And God planted a garden eastward in Eden; and there He put the man whom He had formed: and when he had transgressed His command He expelled him and made him to dwell over against the delights of Paradise, which clearly is the West. So, then, we worship God seeking and striving after our old fatherland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 12"
