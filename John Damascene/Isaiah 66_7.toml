[[commentary]]
quote='''
For He who was of the Father, yet without mother, was born of woman without a father’s co-operation. And so far as He was born of woman, His birth was in accordance with the laws of parturition, while so far as He had no father, His birth was above the nature of generation: and in that it was at the usual time (for He was born on the completion of the ninth month when the tenth was just beginning), His birth was in accordance with the laws of parturition, while in that it was painless it was above the laws of generation. For, as pleasure did not precede it, pain did not follow it, according to the prophet who says, Before she travailed, she brought forth, and again, before her pain came she was delivered of a man-child.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 14"
