[[commentary]]
quote='''
We hold, moreover, that our nature has been raised from the dead and has ascended to the heavens and taken its seat at the right hand of the Father: not that all the persons of men have risen from the dead and taken their seat at the right hand of the Father, but that this has happened to the whole of our nature in the subsistence of Christ. Verily the divine Apostle says, God hath raised us up together and made us sit together in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 6"
