[[commentary]]
quote='''
Next, God bade the waters be gathered together into one mass. But when the Scripture speaks of one mass it evidently does not mean that they were gathered together into one place: for immediately it goes on to say, And the gatherings of the waters He called seas: but the words signify that the waters were separated off in a body from the earth into distinct groups. Thus the waters were gathered together into their special collections and the dry land was brought to view.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"
