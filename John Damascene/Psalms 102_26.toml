[[commentary]]
quote='''
All things, then, which are brought into existence are subject to corruption according to the law of their nature, and so even the heavens themselves are corruptible. But by the grace of God they are maintained and preserved. Only the Deity, however, is by nature without beginning and without end. Wherefore it has been said, They will perish, but Thou dost endure: nevertheless, the heavens will not be utterly destroyed. For they will wax old and be wound round as a covering, and will be changed, and there will be a new heaven and a new earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 6"
