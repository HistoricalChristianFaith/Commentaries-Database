[[commentary]]
quote='''
The first thought that arises in us is called energy: and it is simple energy not involving any relationship, the mind sending forth the thoughts peculiar to it in an independent and invisible way, for if it did not do so it could not justly be called mind. Again, the revelation and unfolding of thought by means of articulate speech is said to be energy. But this is no longer simple energy that involves no relationship, but it is considered in relation as being composed of thought and speech. Further, the very relation which he who does anything bears to that which is brought about is energy; and the very thing that is effected is called energy. The first belongs to the soul alone, the second to the soul making use of the body, the third to the body animated by mind, and the last is the effect. For the mind sees beforehand what is to be and then performs it thus by means of the body. And so the hegemony belongs to the soul, for it uses the body as an instrument, leading and restraining it. But the energy of the body is quite different, for the body is led and moved by the soul. And with regard to the effect, the touching and handling and, so to speak, the embrace of what is effected, belong to the body, while the figuration and formation belong to the soul. And so in connection with our Lord Jesus Christ, the power of miracles is the energy of His divinity, while the work of His hands and the willing and the saying, I will, be thou clean, are the energy of His humanity. And as to the effect, the breaking of the loaves, and the fact that the leper heard the “I will,” belong to His humanity, while the multiplication of the loaves and the purification of the leper belong to His divinity. For through both, that is through the energy of the body and the energy of the soul, He displayed one and the same, cognate and equal divine energy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 15"
