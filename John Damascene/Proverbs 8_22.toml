[[commentary]]
quote='''
Some, again, have a prophetic sense, and of these some are in the future tense: for instance, He shall come openly, and this from Zechariah, Behold, thy King cometh unto thee, and this from Micah, Behold, the Lord cometh out of His place and will come down and tread upon the high places of the earth. But others, though future, are put in the past tense, as, for instance, This is our God: Therefore He was seen upon the earth and dwelt among men, and The Lord created me in the beginning of His ways for His works, and Wherefore God, thy God, anointed thee with the oil of gladness above thy fellows, and such like.

The things said, then, that refer to the period before the union will be applicable to Him even after the union: but those that refer to the period after the union will not be applicable at all before the union, unless indeed in a prophetic sense, as we said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
