[[commentary]]
quote='''
But it was in fact to make the divinity of His own nature manifest and to confirm the belief in His own and our resurrection, that He raised up Lazarus who was destined once more to die. And the Lord became Himself the first-fruits of the perfect resurrection that is no longer subject to death. Wherefore also the divine Apostle Paul said: If the dead rise not, then is not Christ raised. And if Christ be not raised, our faith is vain: we are yet in our sins. And, Now is Christ risen from the dead and become the first-fruits of them that slept, and the first-born from the dead; and again, For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with Him. Even so, he said, as Christ rose again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
