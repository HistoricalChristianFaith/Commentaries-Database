[[commentary]]
quote='''
And further, if the Creator and Lord of all things is called also King of Kings and Lord of Lords and God of Gods, surely also the saints are gods and lords and kings. For of these God is and is called God and Lord and King. For I am the God of Abraham, He said to Moses, the God of Isaac and the God of Jacob. And God made Moses a god to Pharaoh. Now I mean gods and kings and lords not in nature, but as rulers and masters of their passions, and as preserving a truthful likeness to the divine image according to which they were made (for the image of a king is also called king), and as being united to God of their own free-will and receiving Him as an indweller and becoming by grace through participation with Him what He is Himself by nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 15"

[[commentary]]
quote='''
And again to Moses, I am the God of Abraham, the God of Isaac and the God of Jacob: God is not the God of the dead (that is, those who are dead and will be no more), but of the living, whose souls indeed live in His hand, but whose bodies will again come to life through the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
