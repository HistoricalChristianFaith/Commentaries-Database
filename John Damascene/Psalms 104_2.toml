[[commentary]]
quote='''
Others have pictured the heaven as a hemisphere. This idea is suggested by these words of David, the singer of God, Who stretchest out the heavens like a curtain, by which word he clearly means a tent: and by these from the blessed Isaiah, Who hath established the heavens like a vault: and also because when the sun, moon, and stars set they make a circuit round the earth from west to north, and so reach once more the east. Still, whether it is this way or that, all things have been made and established by the divine command, and have the divine will and counsel for a foundation that cannot be moved. For He Himself spoke and they were made: He Himself commanded and they were created. He hath also established them for ever and ever: He hath made a decree which will not pass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 6"
