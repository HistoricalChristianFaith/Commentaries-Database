[[commentary]]
quote='''
And He laid on us the command to be born again of water and of the Spirit, through prayer and invocation, the Holy Spirit drawing nigh unto the water. For since man’s nature is twofold, consisting of soul and body, He bestowed on us a twofold purification, of water and of the Spirit: the Spirit renewing that part in us which is after His image and likeness, and the water by the grace of the Spirit cleansing the body from sin and delivering it from corruption, the water indeed expressing the image of death, but the Spirit affording the earnest of life.

For from the beginning the Spirit of God moved upon the face of the waters, and anew the Scripture witnesseth that water has the power of purification. In the time of Noah God washed away the sin of the world by water. By water every impure person is purified, according to the law, even the very garments being washed with water. Elias shewed forth the grace of the Spirit mingled with the water when he burned the holocaust by pouring on water. And almost everything is purified by water according to the law: for the things of sight are symbols of the things of thought. The regeneration, however, takes place in the spirit: for faith has the power of making us sons (of God), creatures as we are, by the Spirit, and of leading us into our original blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
