[[commentary]]
quote='''
And He is called First-born among many brethren, for although being Only-begotten, He was also born of a mother. Since, indeed, He participated just as we ourselves do in blood and flesh and became man, while we too through Him became sons of God, being adopted through the baptism, He Who is by nature Son of God became first-born amongst us who were made by adoption and grace sons of God, and stand to Him in the relation of brothers. Wherefore He said, I ascend unto My Father and your Father. He did not say “our Father,” but “My Father,” clearly in the sense of Father by nature, and “your Father,” in the sense of Father by grace. And “My God and your God.” He did not say “our God,” but “My God:” and if you distinguish with subtle thought that which is seen from that which is thought, also “your God,” as Maker and Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 8"
