[[commentary]]
quote='''
But since some find fault with us for worshipping and honouring the image of our Saviour and that of our Lady, and those, too, of the rest of the saints and servants of Christ, let them remember that in the beginning God created man after His own image. On what grounds, then, do we shew reverence to each other unless because we are made after God’s image? For as Basil, that much-versed expounder of divine things, says, the honour given to the image passes over to the prototype. Now a prototype is that which is imaged, from which the derivative is obtained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 16"
