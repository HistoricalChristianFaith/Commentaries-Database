[[commentary]]
quote='''
We confess one baptism for the remission of sins and for life eternal. For baptism declares the Lord’s death. We are indeed “buried with the Lord through baptism,” as saith the divine Apostle. So then, as our Lord died once for all, we also must be baptized once for all, and baptized according to the Word of the Lord, In the Name of the Father, and of the Son, and of the Holy Spirit, being taught the confession in Father, Son, and Holy Spirit. Those, then, who, after having been baptized into Father, Son, and Holy Spirit, and having been taught that there is one divine nature in three subsistences, are rebaptized, these, as the divine Apostle says, crucify the Christ afresh. For it is impossible, he saith, for those who were once enlightened, &c., to renew them again unto repentance: seeing they crucify to themselves the Christ afresh, and put Him to an open shame. But those who were not baptized into the Holy Trinity, these must be baptized again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
