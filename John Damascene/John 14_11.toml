[[commentary]]
quote='''
For with reference to the uncircumscribed Deity we cannot speak of separation in space, as we can in our own case. For the subsistences dwell in one another, in no wise confused but cleaving together, according to the word of the Lord, I am in the father, and the father in Me: nor can one admit difference in will or judgment or energy or power or anything else whatsoever which may produce actual and absolute separation in our case.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25201.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 1, Chapter 8"
