[[commentary]]
quote='''
Further, observe that the number seven denotes all the present time, as the most wise Solomon says, to give a portion to seven and also to eight. And David, the divine singer when he composed the eighth psalm, sang of the future restoration after the resurrection from the dead. Since the Law, therefore, enjoined that the seventh day should be spent in rest from carnal things and devoted to spiritual things, it was a mystic indication to the true Israelite who had a mind to see God, that he should through all time offer himself to God and rise higher than carnal things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 23"
