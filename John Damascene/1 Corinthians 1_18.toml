[[commentary]]
quote='''
The word ‘Cross’ is foolishness to those that perish, but to us who are saved it is the power of God. For he that is spiritual judgeth all things, but the natural man receiveth not the things of the Spirit. For it is foolishness to those who do not receive in faith and who do not consider God’s goodness and omnipotence, but search out divine things with human and natural reasonings. For all the things that are of God are above nature and reason and conception. For should any one consider how and for what purpose God brought all things out of nothing into being, and aim at arriving at that by natural reasonings, he fails to comprehend it. For knowledge of this kind belongs to spirits and demons. But if any one, under the guidance of faith, should consider the divine goodness and omnipotence and truth and wisdom and justice, he will find all things smooth and even, and the way straight. But without faith it is impossible to be saved. For it is by faith that all things, both human and spiritual, are sustained. For without faith neither does the farmer cut his furrow, nor does the merchant commit his life to the raging waves of the sea on a small piece of wood, nor are marriages contracted nor any other step in life taken. By faith we consider that all things were brought out of nothing into being by God’s power. And we direct all things, both divine and human, by faith. Further, faith is assent free from all meddlesome inquisitiveness.

Every action, therefore, and performance of miracles by Christ are most great and divine and marvellous: but the most marvellous of all is His precious Cross. For no other thing has subdued death, expiated the sin of the first parent, despoiled Hades, bestowed the resurrection, granted the power to us of contemning the present and even death itself, prepared the return to our former blessedness, opened the gates of Paradise, given our nature a seat at the right hand of God, and made us the children and heirs of God, save the Cross of our Lord Jesus Christ. For by the Cross all things have been made right. So many of us, the apostle says, as were baptized into Christ, were baptized into His death, and as many of you as have been baptized into Christ, have put on Christ. Further Christ is the power of God and the wisdom of God. Lo! the death of Christ, that is, the Cross, clothed us with the enhypostatic wisdom and power of God. And the power of God is the Word of the Cross, either because God’s might, that is, the victory over death, has been revealed to us by it, or because, just as the four extremities of the Cross are held fast and bound together by the bolt in the middle, so also by God’s power the height and the depth, the length and the breadth, that is, every creature visible and invisible, is maintained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
