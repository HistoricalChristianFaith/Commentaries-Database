[[commentary]]
quote='''
Indeed, before the transgression all things were under his power. For God set him as ruler over all things on the earth and in the waters. Even the serpent was accustomed to man, and approached him more readily than it did other living creatures, and held intercourse with him with delightful motions. And hence it was through it that the devil, the prince of evil, made his most wicked suggestion to our first parents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 10"
