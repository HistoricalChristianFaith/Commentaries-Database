[[commentary]]
quote='''
And we cannot, if we wish to be accurate, speak of Christ as having judgment (γνώμη) and preference. For judgment is a disposition with reference to the decision arrived at after investigation and deliberation concerning something unknown, that is to say, after counsel and decision. And after judgment comes preference, which chooses out and selects the one rather than the other. But the Lord being not mere man but also God, and knowing all things, had no need of inquiry, and investigation, and counsel, and decision, and by nature made whatever is good His own and whatever is bad foreign to Him. For thus says Isaiah the prophet, Before the child shall know to prefer the evil, he shall choose the good; because before the child knows good or evil, he refuses wickedness by choosing the good. For the word “before” proves that it is not with investigation and deliberation, as is the way with us, but as God and as subsisting in a divine manner in the flesh, that is to say, being united in subsistence to the flesh, and because of His very existence and all-embracing knowledge, that He is possessed of good in His own nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 14"
