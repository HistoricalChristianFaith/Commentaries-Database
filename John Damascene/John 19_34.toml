[[commentary]]
quote='''
For since Christ made us for incorruption, and we transgressed His saving command, He condemned us to the corruption of death in order that that which is evil should not be immortal, and when in His compassion He stooped to His servants and became like us, He redeemed us from corruption through His own passion. He caused the fountain of remission to well forth for us out of His holy and immaculate side, water for our regeneration, and the washing away of sin and corruption; and blood to drink as the hostage of life eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
