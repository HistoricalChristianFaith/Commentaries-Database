[[commentary]]
quote='''
And she was troubled at his word, and the angel said to her, Fear not, Mary, for thou hast found favour with God, and shalt bring forth a Son and shalt call His name Jesus; for He shall save His people from their sins. Hence it comes that Jesus has the interpretation Saviour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 2"
