[[commentary]]
quote='''
And the Lord shall come out of heaven, just as the holy apostles beheld Him going into heaven, perfect God and perfect man, with glory and power, and will destroy the man of lawlessness, the son of destruction, with the breath of His mouth. Let no one, therefore, look for the Lord to come from earth, but out of Heaven, as He himself has made sure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 26"
