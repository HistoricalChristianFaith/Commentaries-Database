[[commentary]]
quote='''
Wherefore, also, when they spoke of it along with the divine nature they called it energy. For he who said, “For either form energises close communion with the other,” did something quite different from him who said, And when He had fasted forty days, He was afterwards an hungered: (for He allowed His nature to energise when it so willed, in the way proper to itself,) or from those who hold there is a different energy in Him or that He has a twofold energy, or now one energy and now another. For these statements with the change in terms signify the two energies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 15"
