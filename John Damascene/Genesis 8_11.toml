[[commentary]]
quote='''
Olive oil is employed in baptism as significant of our anointing, and as making us anointed, and as announcing to us through the Holy Spirit God’s pity: for it was the fruit of the olive that the dove brought to those who were saved from the flood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
