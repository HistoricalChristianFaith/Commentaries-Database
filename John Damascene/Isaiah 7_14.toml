[[commentary]]
quote='''
Moreover, since the enemy of our salvation was keeping a watchful eye on virgins, according to the prophecy of Isaiah, who said, Behold a virgin shall conceive and bare a Son and shall call His name Emmanuel, which is, being interpreted, ‘God with us,’ in order that he who taketh the wise in their own craftiness may deceive him who always glorieth in his wisdom, the maiden is given in marriage to Joseph by the priests, a new book to him who is versed in letters: but the marriage was both the protection of the virgin and the delusion of him who was keeping a watchful eye on virgins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 14"
