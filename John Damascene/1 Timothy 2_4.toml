[[commentary]]
quote='''
The third kind of absolute worship is thanksgiving for all the good things he has created for us. All things owe a debt of thanks to God and must offer him ceaseless worship, because all things have their existence from him, and in him all things hold together. He gives lavishly of his gifts to all, without being asked. He desires all men to be saved and to partake of his goodness. He is long-suffering with us sinners, for he makes his sun rise on the evil and on the good, and sends rain on the just and the unjust. He is the Son of God, yet he became one of us for our sake and made us participants of his divine nature, so that "we shall be like him," as John the Theologian says in his catholic epistle.
'''
source_url=''
source_title="ON DIVINE IMAGES 3.30"

[[commentary]]
quote='''
Also one must bear in mind that God’s original wish was that all should be saved and come to His Kingdom. For it was not for punishment that He formed us but to share in His goodness, inasmuch as He is a good God. But inasmuch as He is a just God, His will is that sinners should suffer punishment.

The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is two-fold; one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands.

But of actions that are in our hands the good ones depend on His antecedent goodwill and pleasure, while the wicked ones depend neither on His antecedent nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 29"
