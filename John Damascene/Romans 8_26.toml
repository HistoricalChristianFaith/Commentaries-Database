[[commentary]]
quote='''
But what the law could not do, in that it was weak through the flesh, God, sending His own Son in the likeness of sinful flesh (for He assumed flesh but not sin) condemned sin in the flesh, that the righteousness of the law might be fulfilled in us who walk not after the flesh but in the Spirit. For the Spirit helpeth our infirmities and affordeth power to the law of our mind, against the law that is in our members. For the verse, we know not what we should pray for as we ought, but the Spirit itself maketh intercession with groanings that cannot be uttered, itself teacheth us what to pray for. Hence it is impossible to carry out the precepts of the Lord except by patience and prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 22"
