[[commentary]]
quote='''
Fire is one of the four elements, light and with a greater tendency to ascend than the others. It has the power of burning and also of giving light, and it was made by the Creator on the first day. For the divine Scripture says, And God said, Let there be light, and there was light. Fire is not a different thing from what light is, as some maintain. Others again hold that this fire of the universe is above the air and call it ether. In the beginning, then, that is to say on the first day, God created light, the ornament and glory of the whole visible creation. For take away light and all things remain in undistinguishable darkness, incapable of displaying their native beauty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 7"
