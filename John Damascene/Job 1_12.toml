[[commentary]]
quote='''
Now the works of Providence are partly according to the good-will (of God) and partly according to permission. Works of good-will include all those that are undeniably good, while works of permission are……. For Providence often permits the just man to encounter misfortune in order that he may reveal to others the virtue that lies concealed within him, as was the case with Job. At other times it allows something strange to be done in order that something great and marvellous might be accomplished through the seemingly-strange act, as when the salvation of men was brought about through the Cross. In another way it allows the pious man to suffer sore trials in order that he may not depart from a right conscience nor lapse into pride on account of the power and grace granted to him, as was the case with Paul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 29"
