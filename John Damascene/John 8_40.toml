[[commentary]]
quote='''
But if the Evangelist said that the Word was made flesh, note that in the Holy Scripture sometimes a man is spoken of as a soul, as, for example, with seventy-five souls came Jacob into Egypt: and sometimes a man is spoken of as flesh, as, for example, All flesh shall see the salvation of God. And accordingly the Lord did not become flesh without soul or mind, but man. He says, indeed, Himself, Why seek ye to kill Me, a Man that hath told you the truth? He, therefore, assumed flesh animated with the spirit of reason and mind, a spirit that holds sway over the flesh but is itself under the dominion of the divinity of the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 18"
