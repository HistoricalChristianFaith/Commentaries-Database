[[commentary]]
quote='''
The heaven of heaven, then, is the first heaven which is above the firmament. So here we have two heavens, for God called the firmament also Heaven. And it is customary in the divine Scripture to speak of the air also as heaven, because we see it above us. Bless Him, it says, all ye birds of the heaven, meaning of the air. For it is the air and not the heaven that is the region in which birds fly. So here we have three heavens, as the divine Apostle said. But if you should wish to look upon the seven zones as seven heavens there is no injury done to the word of truth. For it is usual in the Hebrew tongue to speak of heaven in the plural, that is, as heavens, and when a Hebrew wishes to say heaven of heaven, he usually says heavens of heavens, and this clearly means heaven of heaven, which is above the firmament, and the waters which are above the heavens, whether it is the air and the firmament, or the seven zones of the firmament, or the firmament itself which are spoken of in the plural as heavens according to the Hebrew custom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 6"
