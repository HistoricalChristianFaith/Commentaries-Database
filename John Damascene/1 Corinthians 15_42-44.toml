[[commentary]]
quote='''
Again the divine apostle says, For this corruptible must put on incorruption, and this mortal must put on immortality. And again: It is sown in corruption, it is raised in incorruption: it is sown in weakness, it is raised in power: it is sown in dishonour, it is raised in glory: it is sown a natural body (that is to say, crass and mortal), it is raised a spiritual body, such as was our Lord’s body after the resurrection which passed through closed doors, was unwearying, had no need of food, or sleep, or drink. For they will be, saith the Lord, as the angels of God: there will no longer be marriage nor procreation of children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
