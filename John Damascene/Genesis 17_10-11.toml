[[commentary]]
quote='''
The Circumcision was given to Abraham before the law, after the blessings, after the promise, as a sign separating him and his offspring and his household from the Gentiles with whom he lived. And this is evident, for when the Israelites passed forty years alone by themselves in the desert, having no intercourse with any other race, all that were born in the desert were uncircumcised: but when Joshua led them across Jordan, they were circumcised, and a second law of circumcision was instituted. For in Abraham’s time the law of circumcision was given, and for the forty years in the desert it fell into abeyance. And again for the second time God gave the law of Circumcision to Joshua, after the crossing of Jordan, according as it is written in the book of Joshua, the son of Nun: At that time the Lord said unto Joshua, Make thee knives of stone from the sharp rock, and assemble and circumcise the sons of Israel a second time; and a little later: For the children of Israel walked forty and two years in the wilderness of Battaris, till all the people that were men of war, which came out of Egypt, were uncircumcised, because they obeyed not the voice of the Lord: unto whom the Lord sware that He would not shew them the good land, which the Lord sware unto their fathers that He would give them, a land that floweth with milk and honey. And their children, whom He raised up in their stead, them Joshua circumcised: for they were uncircumcised, because they had not circumcised them by the way. So that the circumcision was a sign, dividing Israel from the Gentiles with whom they dwelt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 25"
