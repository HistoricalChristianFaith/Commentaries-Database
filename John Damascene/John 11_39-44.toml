[[commentary]]
quote='''
But it was not only by word, but also by deed, that the Lord revealed the resurrection of the bodies. First He raised up Lazarus, even after he had been dead four days, and was stinking. For He did not raise the soul without the body, but the body along with the soul: and not another body but the very one that was corrupt. For how could the resurrection of the dead man have been known or believed if it had not been established by his characteristic properties? But it was in fact to make the divinity of His own nature manifest and to confirm the belief in His own and our resurrection, that He raised up Lazarus who was destined once more to die. And the Lord became Himself the first-fruits of the perfect resurrection that is no longer subject to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
