[[commentary]]
quote='''
And although the holy Scripture says, Therefore God, thy God, hath anointed thee with the oil of gladness, it is to be observed that the holy Scripture often uses the past tense instead of the future, as for example here: Thereafter He was seen upon the earth and dwelt among men. For as yet God was not seen nor did He dwell among men when this was said. And here again: By the rivers of Babylon, there we sat down; yea we wept. For as yet these things had not come to pass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 6"
