[[commentary]]
quote='''
If, therefore, we are lovers of learning, we shall also be learned in many things. For by care and toil and the grace of God the Giver, all things are accomplished. For every one that asketh receiveth, and he that seeketh findeth, and to him that knocketh it shall be opened. Wherefore let us knock at that very fair garden of the Scriptures, so fragrant and sweet and blooming, with its varied sounds of spiritual and divinely-inspired birds ringing all round our ears, laying hold of our hearts, comforting the mourner, pacifying the angry and filling him with joy everlasting: which sets our mind on the gold-gleaming, brilliant back of the divine dove, whose bright pinions bear up to the only-begotten Son and Heir of the Husbandman of that spiritual Vineyard and bring us through Him to the Father of Lights. But let us not knock carelessly but rather zealously and constantly: lest knocking we grow weary. For thus it will be opened to us. If we read once or twice and do not understand what we read, let us not grow weary, but let us persist, let us talk much, let us enquire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 17"
