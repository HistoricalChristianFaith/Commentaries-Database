[[commentary]]
quote='''
The dead shall rise again, and they that are in the graves shall awake. They that have kept the commandments of Christ and have departed this life in the true faith shall inherit eternal life; and they that have died in their sins and have turned aside from the right faith shall go away into eternal punishment. Do not believe that there is any true being or kingdom of evil or suppose that it is without beginning, or self-originated or born of God—forget such an absurdity! But believe rather that it is the work of us and the devil, come on us through our inattentiveness, because we were endowed with free will, and we made our choice, of deliberate purpose, whether it be good or evil.
'''
source_url=''
source_title="BARLAAM AND JOSEPH 19:164-65"

[[commentary]]
quote='''
And divine Daniel also says: And at that time shall Michael stand up, the great prince which standeth for the children of thy people: and there shall be a time of trouble, such trouble as never was since there was a nation on the earth even to that same time. And at that time thy people shall be delivered, every one that shall be found written in the book. And many of them that sleep in the dust of the earth shall awake: some to everlasting life and some to shame and everlasting contempt. And they that be wise shall shine as the brightness of the firmament, and out of the multitude of the just shall shine like stars into the ages and beyond. The words, many of them that sleep in the dust of the earth shall awake, clearly shew that there will be a resurrection of bodies. For no one surely would say that the souls sleep in the dust of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
