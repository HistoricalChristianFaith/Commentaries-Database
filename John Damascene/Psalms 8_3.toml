[[commentary]]
quote='''
The course which the Creator appointed for them to run is unceasing and remaineth fixed as He established them. For the divine David says, The moon and the stars which Thou establishedst, and by the word ‘establishedst,’ he referred to the fixity and unchangeableness of the order and series granted to them by God. For He appointed them for seasons, and signs, and days and years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 7"
