[[commentary]]
quote='''
But if we say that the Father is the origin of the Son and greater than the Son, we do not suggest any precedence in time or superiority in nature of the Father over the Son (for through His agency He made the ages), or superiority in any other respect save causation. And we mean by this, that the Son is begotten of the Father and not the Father of the Son, and that the Father naturally is the cause of the Son: just as we say in the same way not that fire proceedeth from light, but rather light from fire. So then, whenever we hear it said that the Father is the origin of the Son and greater than the Son, let us understand it to mean in respect of causation. And just as we do not say that fire is of one essence and light of another, so we cannot say that the Father is of one essence and the Son of another: but both are of one and the same essence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25201.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 1, Chapter 8"

[[commentary]]
quote='''
And others make known the fact of His origin from the Father as cause, for instance My Father is greater than I. For from Him He derives both His being and all that He has: His being was by generative and not by creative means, as, I came forth from the Father and am come, and I live by the Father. But all that He hath is not His by free gift or by teaching, but in a causal sense, as, The Son can do nothing of Himself but what He seeth the Father do. For if the Father is not, neither is the Son. For the Son is of the Father and in the Father and with the Father, and not after the Father. In like manner also what He doeth is of Him and with Him. For there is one and the same, not similar but the same, will and energy and power in the Father, Son and Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
