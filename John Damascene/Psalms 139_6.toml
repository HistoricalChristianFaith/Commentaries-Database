[[commentary]]
quote='''
Indeed, it is possible to understand by every tree the knowledge of the divine power derived from created things. In the words of the divine Apostle, For the invisible things of Him from the creation of the world are clearly seen, being understood by the things that are made. But of all these thoughts and speculations the sublimest is that dealing with ourselves, that is, with our own composition. As the divine David says, The knowledge of Thee from me, that is from my constitution, was made a wonder. But for the reasons we have already mentioned, such knowledge was dangerous for Adam who had been so lately created.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 11"
