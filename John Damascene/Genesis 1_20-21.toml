[[commentary]]
quote='''
God, then, bade the first water produce living breath, since it was to be by water and the Holy Spirit that moved upon the waters in the beginning, that man was to be renewed. For this is what the divine Basilius said: Therefore it produced living creatures, small and big; whales and dragons, fish that swim in the waters, and feathered fowl. The birds form a link between water and earth and air: for they have their origin in the water, they live on the earth and they fly in the air. Water, then, is the most beautiful element and rich in usefulness, and purifies from all filth, and not only from the filth of the body but from that of the soul, if it should have received the grace of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 9"
