[[commentary]]
quote='''
For by the Cross all things have been made right. So many of us, the apostle says, as were baptized into Christ, were baptized into His death, and as many of you as have been baptized into Christ, have put on Christ. Further Christ is the power of God and the wisdom of God. Lo! the death of Christ, that is, the Cross, clothed us with the enhypostatic wisdom and power of God. And the power of God is the Word of the Cross, either because God’s might, that is, the victory over death, has been revealed to us by it, or because, just as the four extremities of the Cross are held fast and bound together by the bolt in the middle, so also by God’s power the height and the depth, the length and the breadth, that is, every creature visible and invisible, is maintained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
