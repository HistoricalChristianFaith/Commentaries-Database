[[commentary]]
quote='''
The Word of God, who out of mercy condescended to become her son, serves with his sovereign hands this most holy and most divine woman as is fitting toward a mother and receives her holy soul. What a good legislator! Not being subject to the law, he keeps the law that he decreed. It is he, in fact, who established the duty of children toward their parents. "Honor," he says, "your father and your mother." I believe this is a truth that is obvious to anyone who is at least a little familiar with the divine revelation of sacred Scripture. If, as sacred Scripture says, "the souls of the righteous are in the hands of the Lord," how much more should she not entrust her soul to her Son and her God?
'''
source_url=''
source_title="HOMILY ON THE DORMITION 1:4"

[[commentary]]
quote='''
The divine Scripture likewise saith that the souls of the just are in God’s hand and death cannot lay hold of them. For death is rather the sleep of the saints than their death. For they travailed in this life and shall to the end, and Precious in the sight of the Lord is the death of His saints. What then, is more precious than to be in the hand of God? For God is Life and Light, and those who are in God’s hand are in life and light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 15"
