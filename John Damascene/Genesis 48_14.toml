[[commentary]]
quote='''
The tree of life which was planted by God in Paradise pre-figured this precious Cross. For since death was by a tree, it was fitting that life and resurrection should be bestowed by a tree. Jacob, when He worshipped the top of Joseph’s staff, was the first to image the Cross, and when he blessed his sons with crossed hands he made most clearly the sign of the cross. Likewise also did Moses’ rod, when it smote the sea in the figure of the cross and saved Israel, while it overwhelmed Pharaoh in the depths; likewise also the hands stretched out crosswise and routing Amalek; and the bitter water made sweet by a tree, and the rock rent and pouring forth streams of water, and the rod that meant for Aaron the dignity of the high priesthood: and the serpent lifted in triumph on a tree as though it were dead, the tree bringing salvation to those who in faith saw their enemy dead, just as Christ was nailed to the tree in the flesh of sin which yet knew no sin. The mighty Moses cried, You will see your life hanging on the tree before your eyes, and Isaiah likewise, I have spread out my hands all the day unto a faithless and rebellious people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
