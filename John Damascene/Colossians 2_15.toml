[[commentary]]
quote='''
The Eutychians, who get their name from the heresy of Eutyches, say that our Lord Jesus Christ did not take His flesh from the blessed Virgin Mary, but contend that He became incarnate in a more divine manner. For they could not conceive how God the Word could unite to Himself from the Virgin Mary this man, who was subject to the sin of his first father Adam, to the effect that ‘despoiling the principalities and powers, he hath exposed them confidently in open shew,’ as has been written, ‘triumphing on the cross’ over those very things which He had put on because of the fall of the first man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FOn%2520Heresies.html'
source_title="On Heresies, Heresy 82"
