[[commentary]]
quote='''
Moreover, Christ is said to baptize with fire: because in the form of flaming tongues He poured forth on His holy disciples the grace of the Spirit: as the Lord Himself says, John truly baptized with water: but ye shall be baptized with the Holy Spirit and with fire, not many days hence: or else it is because of the baptism of future fire wherewith we are to be chastized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 9"
