[[commentary]]
quote='''
Since, therefore, God is spiritual light, and Christ is called in the Scriptures Sun of Righteousness and Dayspring, the East is the direction that must be assigned to His worship. For everything good must be assigned to Him from Whom every good thing arises. Indeed the divine David also says, Sing unto God, ye kingdoms of the earth: O sing praises unto the Lord: to Him that rideth upon the Heavens of heavens towards the East. Moreover the Scripture also says, And God planted a garden eastward in Eden; and there He put the man whom He had formed: and when he had transgressed His command He expelled him and made him to dwell over against the delights of Paradise, which clearly is the West. So, then, we worship God seeking and striving after our old fatherland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 12"
