[[commentary]]
quote='''
And David, sire of the Divine, says to God, Thou takest away their breath, they die and return to their dust. See how he speaks about bodies. Then he subjoins this, Thou sendest forth Thy Spirit, they are created: and Thou renewest the face of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
