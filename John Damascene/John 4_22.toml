[[commentary]]
quote='''
Others again have reference to His appropriation of the personal life of the Jews, in numbering Himself among the Jews, as He saith to the Samaritan woman, Ye worship ye know not what: we know what we worship, for salvation is of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
