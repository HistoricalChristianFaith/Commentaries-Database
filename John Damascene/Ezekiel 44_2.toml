[[commentary]]
quote='''
But just as He who was conceived kept her who conceived still virgin, in like manner also He who was born preserved her virginity intact, only passing through her and keeping her closed. The conception, indeed, was through the sense of hearing, but the birth through the usual path by which children come, although some tell tales of His birth through the side of the Mother of God. For it was not impossible for Him to have come by this gate, without injuring her seal in any way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 14"
