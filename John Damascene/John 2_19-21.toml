[[commentary]]
quote='''
Moreover, that the resurrection of the Lord was the union of uncorrupted body and soul (for it was these that had been divided) is manifest: for He said, Destroy this temple, and in three days I will raise it up. And the holy Gospel is a trustworthy witness that He spoke of His own body. Handle Me and see, the Lord said to His own disciples when they were thinking that they saw a spirit, that it is I Myself, and that I am not changed: for a spirit hath not flesh or bones, as ye see Me have. And when He had said this He shewed them His hands and His side, and stretched them forward for Thomas to touch. Is not this sufficient to establish belief in the resurrection of bodies?
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 27"
