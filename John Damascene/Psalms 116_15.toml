[[commentary]]
quote='''
The divine Scripture likewise saith that the souls of the just are in God’s hand and death cannot lay hold of them. For death is rather the sleep of the saints than their death. For they travailed in this life and shall to the end, and Precious in the sight of the Lord is the death of His saints. What then, is more precious than to be in the hand of God? For God is Life and Light, and those who are in God’s hand are in life and light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 15"
