[[commentary]]
quote='''
Moreover, faith is twofold. For faith cometh by hearing. For by hearing the divine Scriptures we believe in the teaching of the Holy Spirit. The same is perfected by all the things enjoined by Christ, believing in work, cultivating piety, and doing the commands of Him Who restored us. For he that believeth not according to the tradition of the Catholic Church, or who hath intercourse with the devil through strange works, is an unbeliever.

But again, faith is the substance of things hoped for, the evidence of things not seen, or undoubting and unambiguous hope alike of what God hath promised us and of the good issue of our prayers. The first, therefore, belongs to our will, while the second is of the gifts of the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 10"
