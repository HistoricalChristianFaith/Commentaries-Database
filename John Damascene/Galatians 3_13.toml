[[commentary]]
quote='''
It is to be observed that there are two appropriations: one that is natural and essential, and one that is personal and relative. The natural and essential one is that by which our Lord in His love for man took on Himself our nature and all our natural attributes, becoming in nature and truth man, and making trial of that which is natural: but the personal and relative appropriation is when any one assumes the person of another relatively, for instance, out of pity or love, and in his place utters words concerning him that have no connection with himself. And it was in this way that our Lord appropriated both our curse and our desertion, and such other things as are not natural: not that He Himself was or became such, but that He took upon Himself our personality and ranked Himself as one of us. Such is the meaning in which this phrase is to be taken: Being made a curse for our sakes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 25"

[[commentary]]
quote='''
Others again are said in the manner of association and relation, as, My God, My God, why hast Thou forsaken Me? and He hath made Him to be sin for us, Who knew no sin, and being made a curse for us; also, Then shall the Son also Himself be subject unto Him that put all things under Him For neither as God nor as man was He ever forsaken by the Father, nor did He become sin or a curse, nor did He require to be made subject to the Father. For as God He is equal to the Father and not opposed to Him nor subjected to Him; and as God, He was never at any time disobedient to His Begetter to make it necessary for Him to make Him subject. Appropriating, then, our person and ranking Himself with us, He used these words. For we are bound in the fetters of sin and the curse as faithless and disobedient, and therefore forsaken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 18"
