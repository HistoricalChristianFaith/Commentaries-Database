[[commentary]]
quote='''
This was given to us as a sign on our forehead, just as the circumcision was given to Israel: for by it we believers are separated and distinguished from unbelievers. This is the shield and weapon against, and trophy over, the devil. This is the seal that the destroyer may not touch you, as saith the Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25204.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 4, Chapter 11"
