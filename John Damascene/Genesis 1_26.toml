[[commentary]]
quote='''
Now this being the case, He creates with His own hands man of a visible nature and an invisible, after His own image and likeness: on the one hand man’s body He formed of earth, and on the other his reasoning and thinking soul He bestowed upon him by His own inbreathing, and this is what we mean by “after His image.” For the phrase “after His image” clearly refers to the side of his nature which consists of mind and free will, whereas “after His likeness” means likeness in virtue so far as that is possible.

Further, body and soul were formed at one and the same time, not first the one and then the other, as Origen so senselessly supposes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 12"

[[commentary]]
quote='''
Man then the Creator made male, giving him to share in His own divine grace, and bringing him thus into communion with Himself: and thus it was that he gave in the manner of a prophet the names to living things, with authority as though they were given to be his slaves. For having been endowed with reason and mind, and free-will after the image of God, he was fitly entrusted with dominion over earthly things by the common Creator and Master of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25202.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 2, Chapter 30"

[[commentary]]
quote='''
For the virtues are natural qualities, and are implanted in all by nature and in equal measure, even if we do not all in equal measure employ our natural energies. By the transgression we were driven from the natural to the unnatural. But the Lord led us back from the unnatural into the natural. For this is what is the meaning of in our image, after our likeness. And the discipline and trouble of this life were not designed as a means for our attaining virtue which was foreign to our nature, but to enable us to cast aside the evil that was foreign and contrary to our nature: just as on laboriously removing from steel the rust which is not natural to it but acquired through neglect, we reveal the natural brightness of the steel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 14"

[[commentary]]
quote='''
Therefore, God the Word, wishing to restore that which was in His own image, became man. But what is that which was in His own image, unless mind? So He gave up the better and assumed the worse. For mind is in the border-land between God and flesh, for it dwells indeed in fellowship with the flesh, and is, moreover, the image of God. Mind, then, mingles with mind, and mind holds a place midway between the pureness of God and the denseness of flesh. For if the Lord assumed a soul without mind, He assumed the soul of an irrational animal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=John%2520Damascene%2FAn%2520Exact%2520Exposition%2520of%2520the%2520Orthodox%2520Faith%2FBook%25203.html'
source_title="An Exact Exposition of the Orthodox Faith, Book 3, Chapter 18"
